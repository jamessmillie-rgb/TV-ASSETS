name: Fetch site images (one-off)
on:
  push:
    paths: ['.github/workflows/fetch-site-images.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download hero and phlebotomy images from the Webflow CDN
        run: |
          set -e
          mkdir -p assets/img/site
          curl -sSfL -o assets/img/site/home-hero-report-phone.webp "https://cdn.prod.website-files.com/6825a8869d9afdbdbc4d8881/6a85f89c6bd497fdb00d29da_Gemini_Generated_Image_wdxwy1wdxwy1wdxw.webp"
          curl -sSfL -o assets/img/site/phlebotomy-at-home.avif "https://cdn.prod.website-files.com/6825a8869d9afdbdbc4d8881/6977ea4e01bb7e22ffaa43e5_Untitled%20design%20(5).avif"
          curl -sSfL -o assets/img/site/phlebotomy-in-clinic.avif "https://cdn.prod.website-files.com/6825a8869d9afdbdbc4d8881/6977ea3663f358170a0db430_Untitled%20design%20(6).avif"
          ls -la assets/img/site
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/site
          git commit -m "Copy site hero and phlebotomy images from Webflow for print materials" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
