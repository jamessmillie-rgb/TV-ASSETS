<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Signature booking test</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter Tight',sans-serif;background:#f3f4f6;margin:0;padding:24px 16px}.w{max-width:600px;margin:0 auto}.note{font-size:13px;color:#6b7280;margin-bottom:16px}#fallback{background:#fff;border-radius:12px;padding:20px;color:#4b5563}</style>
</head><body><div class="w">
<div class="note">Internal test page (not linked anywhere). Uses the session id in the URL.</div>
<div id="pick"></div>
<div id="fallback" style="display:none">Fallback shown: "Randox will email you a booking link".</div>
</div>
<script src="/assets/sig-book.js?v=2"></script>
<script>
var sid=new URLSearchParams(location.search).get('session_id');
TVSigBook.mount(document.getElementById('pick'),{sessionId:sid,onUnavailable:function(r){var f=document.getElementById('fallback');f.style.display='';f.textContent+=' (reason: '+r+')';},onBooked:function(b){console.log('booked',b)}});
</script>
</body></html>
