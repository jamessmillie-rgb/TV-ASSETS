<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Bogdan-Ionut Rusu","dob":"25/03/1999","report_date":"2026-08-26","summary":"Bogdan-Ionut is a 27-year-old male presenting with a BMI of 28.4, following a takeaway and convenience-based diet rated 2 out of 10 for quality with a volume of 8 out of 10. He does not train at all, performing zero cardio and zero resistance sessions per week, with fewer than 2,000 daily steps. He consumes more than 7 alcoholic drinks per week, uses cannabis, and overuses caffeine or energy drinks. He reports low energy and fatigue, brain fog, and low mood with anxiety. His goals are to reduce stress and anxiety, build muscle, and lose body fat.\n\nBefore discussing anything else, Bogdan-Ionut's white blood cell count is 3.84, which sits below the lower limit of 4.0, and his neutrophils, the most abundant type of white cell responsible for fighting bacterial infection, are 1.59, below the lower limit of 2.0. Neutrophils below 1.5 are classified as neutropenia, and at 1.59 he is sitting just above that threshold. At 27, with no medications that would suppress the marrow, the most likely explanations are cannabis use, which is associated with mild immune suppression and lower neutrophil counts, alcohol, which can suppress bone marrow production of white cells, or what is called benign ethnic neutropenia, a harmless genetic variant seen in some people of Eastern European descent. His absolute reticulocyte count, which measures the rate at which the bone marrow is releasing new red blood cells, is also marginally low at 46.4 against a lower limit of 50. Put together, these findings suggest the bone marrow is running at a slightly lower output than expected for a 27-year-old. This is not an emergency, but it should be discussed with his GP, who may wish to repeat the full blood count in six to eight weeks to confirm whether this is a stable pattern or a trend. If it is stable, benign ethnic neutropenia can be confirmed and noted on his medical record, which is useful information for any future blood tests.\n\nTurning to the positives, and there are many. His cardiovascular risk profile is excellent. Total cholesterol is 3.9, LDL is 2.1 which is well within the optimal range, ApoB, the protein that carries cholesterol into artery walls and the single best predictor of cardiovascular risk, is 0.63, comfortably below the 0.8 optimal threshold. His ApoB to ApoA-I ratio is 0.5, which places him firmly in the lower-risk category. Triglycerides are 0.91, within the optimal range, and his HDL, the protective cholesterol that removes lipid from artery walls, is 1.4. His Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk and cannot be changed by lifestyle, is below 25, which is normal. This is genuinely useful information to have on his permanent medical record because it means his cardiovascular risk is driven entirely by modifiable factors, not by genetics. Remnant cholesterol, which represents the cholesterol carried by triglyceride-rich particles and is increasingly recognised as an independent risk factor, calculates to 0.39, which is well within the optimal range. His TG to HDL ratio calculates to 0.65, also excellent.\n\nHis kidney function is strong. Cystatin C is 0.96, giving a Cystatin C-based eGFR of 106, and his creatinine-based eGFR is above 90. Uric acid at 324 is comfortably within the optimal range. His liver is in good health. ALT at 24 is within the optimal male threshold of below 30, GGT at 24 is just under the optimal ceiling of 25, AST is 25, FIB-4 is 0.65, and bilirubin is 15. Given his alcohol intake of more than seven drinks per week, the fact that the liver is showing no visible metabolic strain at all is reassuring, though this does not mean the liver will tolerate this level indefinitely. Amylase and lipase, which reflect pancreatic health, are both comfortably within range.\n\nHis glucose metabolism is working well. Fasting glucose is 4.8, HbA1c is 30 mmol/mol, which is well below the pre-diabetic threshold of 42, and HOMA-IR, the calculated measure of insulin resistance, is 0.85, placing him in the insulin-sensitive category. His fasting insulin is 3.97, which is within the optimal band of 2 to 8. At BMI 28.4 with a convenience-based diet and no exercise, insulin sensitivity this clean is a genuine positive, but it is not something he can take for granted indefinitely if the lifestyle does not change. His C-Peptide, a protein released alongside insulin that reflects how much insulin the pancreas is producing, converts to 357.5 pmol/L. The lab flagged it as marginally below range at 1.08 ug/L against a lower limit of 1.1, but when converted to pmol/L this sits just at the boundary, and in the context of completely normal glucose, HbA1c, and insulin, this simply reflects low insulin demand rather than any pancreatic problem. HOMA-B, which estimates how hard the pancreas is working to keep glucose controlled, calculates to approximately 61, which is below the conventional range of 80 to 200. Again, in the setting of a fasting glucose of 4.8 and an HbA1c of 30, this is not a failing pancreas. It is a pancreas that does not need to work very hard because insulin sensitivity is good.\n\nHis thyroid is functioning well. TSH is 1.56, sitting within the optimal band of 1.0 to 2.5. Free T4 is 17.4 and Free T3 is 5.4, both within their optimal ranges. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. His inflammation is very low, with hs-CRP at 0.3, well below the optimal ceiling of 1.0. ESR, another inflammatory marker measuring how quickly red cells settle, is 8, within range. Calcium is healthy with corrected calcium at 2.32 and PTH, the parathyroid hormone that regulates calcium balance, at 3.0, both well within range. Magnesium at 1.1 is at the very top of the laboratory range of 0.53 to 1.11, and sits within the optimal band. His prostate markers are reassuring, with PSA at 1.33 and a free PSA ratio of 0.376, well above the 0.19 threshold. His tumour markers CA 19-9 and CEA are both undetectable, and his immunoglobulins IgG, IgM, and IgA are all within range, as is IgE, ruling out an allergic drive. Rheumatoid factor is negative and the coeliac screen is negative. Creatine kinase, a marker of muscle damage, is 167, comfortably within range. His urinalysis is clean across every parameter, with no protein, glucose, blood, white cells, or nitrites detected. Bacterial culture and sensitivities are pending.\n\nNow to the findings that connect most directly to how Bogdan-Ionut is feeling. His oestradiol, the primary oestrogen, is 208 pmol/L, above the male upper limit of 146.1. In men, oestradiol is produced when an enzyme called aromatase converts testosterone into oestrogen, and aromatase activity is directly increased by body fat, alcohol, and cannabis use. All three apply here. Elevated oestradiol in men is associated with fatigue, low mood, difficulty losing body fat, and reduced drive, all of which he is experiencing. His testosterone at 16.5 is within the laboratory range of 8.4 to 28.7, but at 27 years old it sits below the optimal band of 18 to 30. Free testosterone, which is the fraction not bound to proteins and therefore available to tissues, is 0.321 nmol/L, and his SHBG, the binding protein that locks testosterone up and makes it unavailable, is 32.9. The combination of below-optimal testosterone, elevated oestradiol, and the aromatase-driving trifecta of excess body fat, regular alcohol, and cannabis creates a hormonal environment that works directly against his goals of building muscle and losing body fat, and almost certainly contributes to his fatigue and low mood. This is not a hormonal disorder. It is a hormonal environment shaped by lifestyle, and it is reversible.\n\nHis vitamin D at 84 nmol/L is within the sufficient range but sits below the optimal band of 75 to 120. At this level it is adequate, but given his very low sun exposure implied by under 2,000 steps per day, a maintenance dose of vitamin D through the autumn and winter months would be sensible to prevent a seasonal drop. His vitamin B12 at 303 is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism. At 303, he is not deficient, but given his fatigue and brain fog symptoms, optimising this level could make a noticeable difference. A takeaway-based diet is typically low in B12-rich foods like eggs, meat, and dairy of good quality, so supplementation is the most reliable route. His folate at 19 is flagged above the laboratory range of 3 to 17, but elevated folate is not a clinical concern. It most likely reflects recent intake of folate-rich foods or fortified products and requires no action.\n\nHis ferritin at 297 is within the laboratory range of 22 to 322 but sits above the optimal ceiling of 200. Ferritin is the body's iron storage protein, and while it is not dangerously high, at 297 in a 27-year-old it is worth noting. Transferrin saturation at 29.56% is within the optimal band of 25 to 40%, and transferrin itself at 2.64 is healthy. This is not an iron overload pattern because transferrin and saturation are both normal, but the ferritin level means he should not take any iron supplements, and it is worth rechecking in twelve months.\n\nHis cortisol at 383, taken as a morning sample, is within the expected range and does not suggest adrenal dysfunction. DHEA-S converts to approximately 4,534 ug/dL, and at 12.3 umol/L it is near the top of the laboratory range, which at 27 is expected. Prolactin at 134 is within range. LH and FSH are both within range, suggesting the pituitary gland is signalling normally. His progesterone at 2.14 is within the male reference range.\n\nHis total antioxidant activity at 2.15 is above the laboratory range of 1.3 to 1.77. This marker reflects the combined antioxidant capacity of the blood and can be elevated by supplementation, caffeine intake, or recent dietary polyphenols. Given his heavy caffeine and energy drink consumption, this is the most likely explanation and is not a concern.\n\nTo bring this together for Bogdan-Ionut: his blood tells a story of a young man whose body is still fundamentally healthy, with excellent cardiovascular markers, clean glucose metabolism, good kidney and liver function, and no inflammatory or autoimmune signals. But the lifestyle is pulling in the wrong direction. The combination of a low-quality, high-volume convenience diet, no exercise, minimal movement, more than seven drinks per week, cannabis, and excessive caffeine is creating a hormonal environment, with below-optimal testosterone and elevated oestradiol, that directly explains many of his symptoms and works against every one of his goals. The mildly suppressed white cell count and reticulocytes add a further signal that the body is not getting what it needs to function at its best. The encouraging news is that at 27, with no chronic disease and strong metabolic foundations, these findings are entirely reversible. The body is waiting for better inputs.","links":"The single most impactful change Bogdan-Ionut can make is overhauling his diet. At 85 kg and 173 cm with no current exercise, his estimated maintenance calories sit around 2,200 to 2,400 per day. To lose body fat, he should aim for a moderate deficit of around 1,800 to 2,000 calories per day, with a protein floor of at least 130 grams per day, ideally closer to 140 to 150 grams. Protein is the non-negotiable foundation for both fat loss and the muscle-building goal he has identified. Good protein sources do not need to be complicated: eggs, chicken, tinned tuna, Greek yoghurt, cottage cheese, mince, and whey protein shakes are all cheap, widely available, and easy to prepare. The diet quality score of 2 out of 10 is the lowest possible score before zero, and the volume score of 8 out of 10 means he is eating a lot of low-quality food. The shift needs to be toward less overall volume of higher quality food, not restriction for its own sake.\n\nAlcohol should come down. More than seven drinks per week is a significant contributor to his elevated oestradiol, and alcohol provides entirely empty calories that make fat loss harder. A target of under four drinks per week, ideally with two to three consecutive alcohol-free days, would reduce aromatase activity, support better sleep quality, and remove a meaningful number of empty calories. Cannabis should be reduced or stopped if possible. It is associated with the neutrophil suppression seen in his results and contributes to fatigue, low motivation, and appetite dysregulation, all of which work against his goals.\n\nCaffeine and energy drink use should be reined in. Excessive caffeine drives anxiety, disrupts sleep architecture even when it does not prevent falling asleep, and creates a cycle of fatigue and stimulant dependence that he is likely already experiencing. A practical approach: no caffeine after 1pm, a maximum of two caffeinated drinks per day, and a transition away from energy drinks toward coffee or tea where the dose is easier to control.\n\nExercise is currently zero across every measure. He does not need to start with a punishing programme. Three resistance training sessions per week, even 30 to 40 minutes each, would improve testosterone, reduce oestradiol by lowering body fat over time, improve insulin sensitivity further, and directly address the muscle-building goal. Walking 7,000 to 10,000 steps per day, up from under 2,000, would improve mood, energy, and metabolic health more than almost any supplement. He could start with 4,000 to 5,000 steps and build from there.\n\nFor his GP, the key conversation points are: white blood cell count 3.84 with neutrophils at 1.59, both below range. A repeat full blood count in six to eight weeks would confirm whether this is a stable benign finding or a trend requiring investigation. The oestradiol at 208 above the 146.1 limit could also be mentioned, though the GP is likely to recommend lifestyle changes as the first intervention, which aligns with everything in this report.\n\nFor sleep, which underpins mood, anxiety, and recovery: a fixed wake time seven days a week, outside within an hour of waking for natural light exposure, no caffeine after 1pm, a cool bedroom around 18 degrees, and screens dimmed or stopped 30 to 60 minutes before bed. These changes cost nothing and have a stronger evidence base for anxiety and mood than most supplements.\n\nRetest recommendation: a repeat blood panel in four to six months focusing on full blood count with differential, testosterone, oestradiol, SHBG, vitamin D, B12, and ferritin. This would show whether the lifestyle changes are moving the markers in the right direction.","flags":"Below-range white blood cell count: WBC 3.84 (range 4.0 to 10.0) with neutrophils 1.59 (range 2.0 to 7.0). Reticulocytes absolute 46.4 (range 50 to 100). At 27 with no medications, consider benign ethnic neutropenia, cannabis-related suppression, or alcohol-related marrow suppression. Recommend repeat FBC in six to eight weeks to confirm stability. If neutrophils fall below 1.5 on repeat, further investigation warranted.\n\nElevated oestradiol: 208 pmol/L (upper limit 146.1). In context of BMI 28.4, alcohol intake over 7 units per week, and cannabis use, likely driven by increased aromatase activity. Testosterone 16.5 nmol/L, within lab range but below optimal for age. Free testosterone 0.321 nmol/L. Recommend lifestyle modification as first-line intervention with retest in four to six months.\n\nC-Peptide marginally below range: 1.08 ug/L (range 1.1 to 4.4), converting to approximately 357.5 pmol/L. In context of fasting glucose 4.8, HbA1c 30, HOMA-IR 0.85, this reflects low insulin demand rather than pancreatic insufficiency. No action required.\n\nFolate above range: 19 ng/ml (range 3 to 17). Likely dietary. No clinical concern.\n\nTotal antioxidant activity above range: 2.15 mmol/L (range 1.3 to 1.77). Likely driven by high caffeine and energy drink intake. No clinical concern.\n\nFerritin 297 ng/ml, within range but above optimal ceiling of 200. Transferrin saturation 29.56% and transferrin 2.64 g/L are both normal, making iron overload unlikely. No iron supplementation. Recheck in twelve months.\n\nReassuring negatives: Lipid profile excellent with ApoB 0.63, LDL 2.1, TG 0.91, Lp(a) below 25. Glucose metabolism clean with HbA1c 30, HOMA-IR 0.85. Liver enzymes all normal despite alcohol intake. Kidney function strong with Cystatin C eGFR 106. Thyroid normal with negative antibodies. hs-CRP 0.3. PSA 1.33 with free ratio 0.376. Coeliac screen negative. Immunoglobulins within range. Urinalysis clean.","recommendations":"1. Overhaul diet from takeaway-based to whole-food-based. Target 1,800 to 2,000 calories per day with a minimum of 130 grams of protein daily. Prioritise eggs, chicken, fish, Greek yoghurt, and whey protein.\n\n2. Reduce alcohol to under four drinks per week with at least two consecutive alcohol-free days.\n\n3. Reduce or stop cannabis use. It is associated with the suppressed white cell count and contributes to fatigue and appetite dysregulation.\n\n4. Limit caffeine to two servings per day, none after 1pm. Transition away from energy drinks.\n\n5. Begin resistance training three times per week, even 30 to 40 minutes per session.\n\n6. Increase daily steps from under 2,000 to a target of 7,000 to 10,000, building gradually.\n\n7. Discuss white blood cell count and neutrophils with GP. Request repeat full blood count in six to eight weeks.\n\n8. Implement sleep hygiene: fixed wake time, morning daylight exposure, cool bedroom, no screens before bed.\n\n9. Retest in four to six months: full blood count, testosterone, oestradiol, SHBG, free testosterone, vitamin D, B12, ferritin.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 IU daily taken with a meal containing fat. His level at 84 nmol/L is adequate but with under 2,000 daily steps suggesting very limited outdoor time, a maintenance dose through autumn and winter will prevent a seasonal decline below the optimal floor of 75 nmol/L. This should be paired with vitamin K2 (MK-7) at 100 mcg daily, which directs calcium into bones rather than soft tissues and is always recommended alongside vitamin D supplementation.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily dissolved under the tongue. His B12 at 303 is within the laboratory range but below the optimal threshold of 500. B12 supports nerve function, red blood cell production, and energy metabolism, all relevant to his fatigue and brain fog. Sublingual delivery bypasses any absorption issues in the gut and is more reliable than oral tablets.\n\nMagnesium (glycinate): 300 mg before bed. His magnesium at 1.1 is at the top of the laboratory range and within the optimal band, so this is not correcting a deficiency. Magnesium glycinate supports sleep quality, reduces anxiety, and aids muscle recovery, all of which align with his symptoms and goals. The glycinate form is the best tolerated and has the strongest evidence for sleep and mood.\n\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily with food. His lipid profile is already excellent, but omega-3 has anti-inflammatory effects, supports brain function which is relevant to his brain fog, and is almost certainly lacking in a takeaway-based diet. Look for a product that states the EPA and DHA content per serving rather than just total fish oil.\n\nDO NOT take iron supplements. His ferritin at 297 is already above the optimal ceiling of 200 and adding iron could push it into genuinely problematic territory.\n\nThe most important changes from this report are not supplements. They are fixing the diet, starting to move, reducing alcohol and cannabis, and controlling caffeine. No supplement will compensate for a diet rated 2 out of 10 and zero exercise. The supplements above support the transition, but the lifestyle changes are what will move the needle on his symptoms, his hormones, and his goals.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. At 4.8 mmol/L, this sits within the optimal range of 4.0 to 5.4, indicating that the body is managing blood sugar effectively. This is a reassuring result, particularly at a BMI of 28.4 with a convenience-based diet, because it means the pancreas and insulin signalling system are keeping glucose tightly controlled.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress response, steroid use, pancreatic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the preceding two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. At 4.9%, this is well below the pre-diabetic threshold of 6.0% and indicates excellent average blood sugar control over recent months.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised mmol/mol units. At 30, it sits well below the normal upper limit of 42 and within the optimal range of below 36. This confirms excellent long-term glucose control and no evidence of pre-diabetes or diabetes.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3927","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5754","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing while fasting. Insulin is the hormone that moves glucose from the blood into cells for energy. A low fasting insulin with normal blood sugar, as seen here at 3.97 mIU/L, is the hallmark of good insulin sensitivity. The body is achieving excellent glucose control without having to produce much insulin, which is the ideal scenario. High fasting insulin, even with normal glucose, would suggest the pancreas is having to work overtime to compensate for insulin resistance.","low_causes":"Very low carbohydrate intake, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, early type 2 diabetes, obesity, high sugar/refined carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"357.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3426","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"400","upper_optimal":"1200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3399","upper_optimal_position":"0.6099","units":"pmol/L","description":"C-Peptide is released in equal amounts alongside insulin from the pancreas, so it serves as an independent measure of how much insulin the body is producing. The lab result of 1.08 ug/L converts to approximately 357.5 pmol/L, which sits just below the lower limit of 364.1 pmol/L. However, in the context of a fasting glucose of 4.8, an HbA1c of 30, and a HOMA-IR of 0.85, this marginally low C-Peptide simply reflects that the pancreas does not need to produce much insulin because the body is using it efficiently. This is not a sign of pancreatic failure.","low_causes":"High insulin sensitivity with low demand, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index that estimates insulin resistance by combining fasting glucose and fasting insulin. A score below 1.0 indicates insulin sensitivity, meaning the body responds efficiently to insulin. At 0.85, this is an excellent result, placing Bogdan-Ionut in the insulin-sensitive category. At a BMI of 28.4 with a convenience-based diet, this degree of insulin sensitivity is genuinely positive and suggests the metabolic system is still functioning well despite the dietary pattern.","low_causes":"High insulin sensitivity, very low carbohydrate diet","high_causes":"Insulin resistance, obesity, high-sugar diet, sedentary lifestyle, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"61.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2426","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates beta-cell function, essentially how hard the pancreas is working to produce insulin relative to the blood sugar level. The formula is (20 x insulin) / (glucose minus 3.5), giving a result of approximately 61. This is below the conventional range of 80 to 200, but interpretation depends entirely on context. With a fasting glucose of 4.8 and an HbA1c of 30, the pancreas is achieving perfect glucose control. The low HOMA-B score reflects low insulin demand, not a struggling pancreas. If glucose were climbing alongside a low HOMA-B, that would be concerning. Here, it is simply a mathematical consequence of good insulin sensitivity.","low_causes":"High insulin sensitivity with low insulin demand, beta-cell exhaustion in advanced diabetes, very low carbohydrate intake","high_causes":"Insulin resistance forcing increased pancreatic output, early type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6400","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 80 g/L, this is within the laboratory range and reflects adequate protein in the bloodstream. Total protein can be affected by hydration status, liver function, and immune activity.","low_causes":"Malnutrition, liver disease, kidney disease with protein loss, malabsorption","high_causes":"Dehydration, chronic infection, inflammatory conditions, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6458","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3708","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and drugs, and maintains fluid balance by keeping water inside blood vessels. At 49 g/L, this is a strong result near the top of the range, indicating healthy liver synthetic function and good nutritional status.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/L","description":"Globulins are a group of proteins in the blood that include immunoglobulins (antibodies) and transport proteins. At 31 g/L, this is within the laboratory range and reflects normal immune function and protein balance. Globulin rises with chronic infection or inflammation and falls with immune deficiency or liver disease.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver cirrhosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. At 1.58, this reflects a healthy balance between the liver-produced albumin and the immune-related globulins. A low ratio can indicate chronic infection, inflammation, or liver disease, while a very high ratio is less clinically significant.","low_causes":"Chronic inflammation, liver disease, autoimmune conditions, overproduction of immunoglobulins","high_causes":"Genetic, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6048","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and bile ducts. In a 27-year-old male, ALP at 63 is a healthy, unremarkable result. Elevations can reflect liver or bile duct obstruction, bone disease, or simply the tail end of bone growth in younger adults.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, liver disease, bone disorders, Paget's disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells break down. It is processed by the liver and excreted in bile. At 15, this is within the normal and optimal range, indicating healthy red blood cell turnover and liver processing capacity.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome (benign, inherited), liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that rises when liver cells are damaged or inflamed. It is considered the most liver-specific enzyme. At 24, this is within the optimal male threshold of below 30 and well within the laboratory range. Given an alcohol intake of more than seven drinks per week, a clean ALT is a reassuring sign that the liver is not currently under strain.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, alcohol-related liver damage, viral hepatitis, medication effects, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Unlike ALT, it is not liver-specific, so elevations can come from muscle damage as well as liver injury. At 25, this is within both the laboratory and optimal range.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, alcohol, muscle damage, intense exercise, heart damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1644","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4521","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol use and bile duct problems. It is often the first liver enzyme to rise with regular alcohol consumption. At 24, this sits just under the optimal ceiling of 25, which is notable given the reported intake of more than seven alcoholic drinks per week. The liver is handling the current alcohol load without visible enzyme elevation, though this does not guarantee it will continue to do so.","low_causes":"Not clinically significant","high_causes":"Alcohol use, bile duct disease, fatty liver, medication effects, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2241","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. At 0.65, this is well below the threshold of 1.3, making significant liver fibrosis very unlikely. This is a reassuring finding in the context of regular alcohol use.","low_causes":"Not clinically significant, indicates low fibrosis risk","high_causes":"Liver fibrosis, cirrhosis, age-driven calculation artefact, low platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3561","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest starch. At 35, this is within the laboratory range and indicates normal pancreatic function. Elevated amylase can suggest pancreatitis, which is relevant to monitor in the context of alcohol consumption.","low_causes":"Chronic pancreatitis (burned-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, gallstones, alcohol use, salivary gland inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4397","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6099","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. It is more specific to the pancreas than amylase and is the preferred marker for diagnosing pancreatitis. At 28, this is comfortably within range and confirms healthy pancreatic function.","low_causes":"Not clinically significant","high_causes":"Pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3764","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL, and VLDL. At 3.9, this is well within the desirable range of below 5.18. Total cholesterol on its own is a blunt tool because it does not distinguish between protective HDL and harmful LDL, but this low total alongside the favourable breakdown seen in the other lipid markers is very positive.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2676","lower_normal":"0","upper_normal":"1.70","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily influenced by recent food intake, sugar, alcohol, and refined carbohydrates. At 0.91, this is within the optimal range of below 1.0, which is an excellent result. Low triglycerides alongside adequate HDL suggest that the liver is processing fats efficiently.","low_causes":"Malnutrition, malabsorption, hyperthyroidism","high_causes":"High sugar or refined carbohydrate intake, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2628","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.60","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. It is a precursor to LDL and contributes to arterial plaque formation. At 0.41, this is well within range and reflects healthy triglyceride metabolism.","low_causes":"Not clinically significant","high_causes":"High triglycerides, insulin resistance, obesity, excessive alcohol or sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4483","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6724","upper_optimal_position":"0.9598","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. Higher is better. At 1.4, this is above the minimum desirable level of 1.04 but just below the optimal male threshold of above 1.4. Regular exercise is the most powerful way to raise HDL, and starting resistance training and increasing daily steps could push this into the optimal range over time.","low_causes":"Sedentary lifestyle, obesity, smoking, high refined carbohydrate diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2800","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5733","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits cholesterol into artery walls, driving atherosclerosis. Lower is better for cardiovascular risk. At 2.1, this is well within the optimal range of below 2.6 and the laboratory range of 0.5 to 3.0. This is an excellent result for cardiovascular protection.","low_causes":"Hyperthyroidism, malabsorption, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3100","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL and provides a simple cardiovascular risk indicator. Below 4.5 is desirable and below 4.0 is optimal. At 2.79, this is an excellent ratio indicating low cardiovascular risk.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"35.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4488","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. Above 20% is the minimum target. At 35.9%, over a third of total cholesterol is protective HDL, which is a healthy proportion.","low_causes":"Low HDL, elevated total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol particles (LDL, VLDL, and remnants) in one number. Below 4.0 is the target, and at 2.5 this is well within the optimal range, confirming low atherogenic burden.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High saturated fat diet, obesity, insulin resistance, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4200","lower_normal":"1.20","upper_normal":"3.0","lower_optimal":"1.40","upper_optimal":"3.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5556","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL cholesterol. It is the functional counterpart to ApoB: while ApoB drives cholesterol into arteries, ApoA1 pulls it back out. At 1.26, this is above the minimum of 1.20 but below the optimal threshold. Regular exercise is the most effective way to increase ApoA1 levels.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle, making it the single best measure of the total number of atherogenic (artery-damaging) particles in the blood. Each ApoB particle can enter the artery wall and deposit cholesterol. At 0.63, this is well below the optimal threshold of 0.8 and the desirable limit of 0.9. This is an excellent result for cardiovascular risk assessment.","low_causes":"Hyperthyroidism, malnutrition, genetic factors","high_causes":"High saturated fat diet, genetic factors, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective lipoproteins in one number. Below 0.7 is lower risk, and at 0.5 this is excellent. This ratio is considered one of the most powerful predictors of cardiovascular risk, and this result indicates a favourable balance.","low_causes":"High ApoA1, low ApoB, excellent cardiovascular profile","high_causes":"High ApoB, low ApoA1, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that independently increases cardiovascular risk by depositing cholesterol into artery walls, promoting blood clots, and driving inflammation. Unlike LDL, its level is almost entirely genetic and cannot be changed by diet, exercise, or currently available medications. At below 25, this is within the normal range of below 32. This is genuinely useful information to have permanently on his medical record because it means his cardiovascular risk profile is driven entirely by modifiable lifestyle factors, not by inherited Lp(a). It only needs to be tested once in a lifetime.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2167","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that provides a proxy for insulin resistance and small, dense LDL particles. A ratio below 0.87 is optimal. At 0.65, this is excellent and further confirms good insulin sensitivity and a favourable LDL particle size distribution.","low_causes":"High HDL, low triglycerides, excellent metabolic health","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2438","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, and represents the cholesterol carried by triglyceride-rich remnant particles. These particles are increasingly recognised as an independent driver of cardiovascular disease. At 0.39, this is well within the optimal range of below 0.5.","low_causes":"Low triglyceride-rich lipoproteins, lean body composition","high_causes":"Insulin resistance, obesity, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is used as a marker of both systemic inflammation and cardiovascular risk. Below 1.0 is optimal and indicates very low levels of chronic inflammation. At 0.3, this is an excellent result. At BMI 28.4 with a convenience-based diet, this low level of inflammation is a genuinely surprising positive, as higher BMI and poor diet typically drive CRP upward.","low_causes":"Low inflammation, healthy metabolic state","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a test tube over one hour. Faster settling indicates more inflammation. At 8, this is within range and confirms the low inflammatory picture seen with the hs-CRP result.","low_causes":"Not clinically significant","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/L","description":"Sodium is the primary electrolyte that controls fluid balance and blood pressure. At 141, this is within the optimal range and indicates normal fluid and electrolyte balance.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, severe vomiting/diarrhoea, heart failure","high_causes":"Dehydration, excessive salt intake, kidney disease, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3519","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for nerve signalling, muscle contraction, and heart rhythm. At 3.6, this is within the laboratory range but near the lower boundary and below the optimal band of 3.8 to 5.0. A takeaway-based diet is often low in potassium-rich foods such as bananas, potatoes, leafy greens, and avocados. Increasing whole food intake would help optimise this level. The lab notes that delayed or prolonged contact with cells can affect potassium results.","low_causes":"Poor dietary intake, excessive sweating, diuretics, vomiting/diarrhoea, excessive caffeine","high_causes":"Kidney disease, medications (ACE inhibitors, potassium-sparing diuretics), haemolysis in sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base balance. At 96, this is within the laboratory range but at the lower end. It typically moves in the same direction as sodium.","low_causes":"Vomiting, metabolic alkalosis, excessive sweating, adrenal insufficiency","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"27.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5606","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.6364","units":"mmol/L","description":"Bicarbonate is a buffer that helps maintain the blood's acid-base balance (pH). At 27.5, this is within the optimal range and indicates normal acid-base homeostasis.","low_causes":"Metabolic acidosis, kidney disease, severe diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, prolonged vomiting, respiratory disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"11.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4513","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upp
