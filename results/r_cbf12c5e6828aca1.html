er_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate) and helps identify the cause of metabolic acidosis. At 11.1, this is within normal range and indicates no unusual acid-base disturbance.","low_causes":"Low albumin, laboratory error","high_causes":"Diabetic ketoacidosis, lactic acidosis, kidney failure, toxic ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5731","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.20","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6158","units":"mmol/L","description":"Calcium is essential for bone strength, nerve transmission, muscle contraction, and blood clotting. At 2.49, this is within the optimal range and indicates healthy calcium balance.","low_causes":"Vitamin D deficiency, parathyroid disease, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result for the albumin level, giving a more accurate picture of the biologically active calcium. At 2.32, this is within the optimal range and confirms healthy calcium metabolism. The PTH (parathyroid hormone) at 3.0 pmol/L is also within range, confirming the calcium-PTH axis is working correctly.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, pancreatitis","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6609","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5184","upper_optimal_position":"0.6345","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions, including energy production, muscle relaxation, nerve function, and sleep regulation. At 1.1, this is at the top of the laboratory range and within the optimal band. Despite this healthy serum level, supplemental magnesium glycinate before bed may still benefit sleep quality and anxiety, as serum magnesium does not always reflect tissue stores.","low_causes":"Alcohol use, poor diet, diuretics, gastrointestinal losses, excessive caffeine","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"324","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4860","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5159","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in food and cells. Elevated levels can lead to gout and are associated with cardiovascular risk and kidney stones. At 324, this is within both the laboratory and optimal range for a male.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High purine diet (red meat, shellfish, beer), obesity, kidney disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3527","upper_optimal_position":"0.5893","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. At 3.7, this is within the laboratory range but at the lower end, which can reflect lower protein intake. Given the goal of building muscle, increasing dietary protein would be expected to bring this into the optimal range over time.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4274","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6068","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. It is used to estimate kidney function (eGFR). At 76, this is within the optimal range and consistent with healthy kidney function. With no resistance training, this level reflects a relatively low muscle mass, which is expected.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high-protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate calculated from creatinine estimates how much blood the kidneys filter per minute. Above 90 is considered optimal kidney function. The lab reported this as >90, which is the normal expected result for a healthy 27-year-old.","low_causes":"Kidney disease, dehydration, certain medications, urinary obstruction","high_causes":"Not clinically significant, can be seen in early diabetes or pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4364","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/L","description":"Cystatin C is a protein produced by all cells that is filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function in people with low muscle mass or those who do not exercise. At 0.96, this is within the optimal range and gives a Cystatin C-based eGFR of 106, confirming excellent kidney function.","low_causes":"Not clinically significant","high_causes":"Kidney disease, thyroid dysfunction, inflammation, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"106","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR provides a muscle-mass-independent estimate of kidney filtration rate. At 106, this is well above the optimal threshold of 90, confirming strong kidney function. This is a more reliable measure than creatinine-based eGFR in someone with no resistance training and relatively low muscle mass.","low_causes":"Kidney disease, acute kidney injury","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"164","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6167","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. At 164, this is a healthy result within the optimal male range, indicating good oxygen-carrying capacity and no anaemia.","low_causes":"Iron deficiency, vitamin B12/folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, living at altitude, polycythaemia, smoking, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5700","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. At 5.21, this is within the optimal range and indicates healthy red blood cell production by the bone marrow.","low_causes":"Anaemia from iron/B12/folate deficiency, chronic disease, blood loss, bone marrow failure","high_causes":"Dehydration, polycythaemia, smoking, living at altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.476","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5887","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.476, this is within the optimal range and indicates good hydration and red cell volume.","low_causes":"Anaemia, overhydration, blood loss, chronic disease","high_causes":"Dehydration, polycythaemia, smoking, altitude, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"12.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"RDW measures the variation in size of red blood cells. A wider distribution suggests a mix of old and new cells or nutritional deficiency affecting cell production. At 12.9%, this is within the optimal range, indicating uniform red blood cell production.","low_causes":"Not clinically significant","high_causes":"Iron deficiency, B12/folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"91.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6056","units":"fL","description":"MCV measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency or alcohol use. At 91.4, this is within the optimal range and indicates normal red cell size and production.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12/folate deficiency, alcohol use, liver disease, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"31.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin per red blood cell. At 31.5, this is within the optimal range and indicates that each red cell is carrying an appropriate amount of oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12/folate deficiency, alcohol use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"344","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"MCHC measures the average concentration of haemoglobin in a given volume of red cells. At 344, this is within the laboratory range but very near the upper boundary and above the optimal ceiling of 340. This margin is not clinically significant and is most likely normal laboratory variation or a very slight effect of sample temperature on measurement.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Spherocytosis, dehydration, laboratory artefact from sample temperature","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"213","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4141","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3410","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are cell fragments that form blood clots to stop bleeding. At 213, this is within the optimal range and indicates healthy platelet production and no bleeding or clotting risk.","low_causes":"Viral infections, bone marrow disorders, alcohol, medications, autoimmune conditions","high_causes":"Iron deficiency, inflammation, infection, post-splenectomy, reactive thrombocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. At 9.9, this is within the laboratory range but near the upper boundary. This is not clinically significant at this margin, especially with a normal platelet count.","low_causes":"Bone marrow suppression, chemotherapy, aplastic anaemia","high_causes":"Increased platelet turnover, immune thrombocytopenia, inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3087","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.5583","units":"x10^9/L","description":"White blood cells are the immune system's defence force, fighting infections and foreign invaders. The total WBC count at 3.84 is below the lower limit of 4.0. In a 27-year-old with no medications, the most likely explanations are cannabis use (which is associated with mild immune suppression), regular alcohol consumption (which can suppress bone marrow production of white cells), or benign ethnic neutropenia (a harmless genetic variant). This finding warrants a repeat test in six to eight weeks to confirm whether it is a stable pattern.","low_causes":"Viral infection, cannabis use, alcohol use, bone marrow suppression, benign ethnic neutropenia, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.59","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2653","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. At 1.59, this is below the lower limit of 2.0 and just above the threshold of 1.5 that would be classified as neutropenia. At 27 with no medications, this is most likely related to cannabis use, alcohol, or benign ethnic neutropenia. A repeat test is recommended to confirm stability. If stable, it should be noted on his medical record so future tests are interpreted correctly.","low_causes":"Cannabis use, alcohol, benign ethnic neutropenia, viral infection, bone marrow suppression, autoimmune conditions","high_causes":"Bacterial infection, inflammation, physical stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for targeted immune responses, including antibody production (B cells) and killing virus-infected cells (T cells). At 1.76, this is within the optimal range, indicating healthy adaptive immune function.","low_causes":"HIV, immunosuppressive drugs, severe stress, autoimmune conditions","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells. They also play a role in chronic inflammation. At 0.4, this is within the optimal range.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic infection, inflammatory conditions, autoimmune disease, certain cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5694","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. At 0.06, this is low within range, indicating no active allergic or parasitic process.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, eczema, drug reactions, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells and are involved in allergic and inflammatory responses. At 0.03, this is within the optimal range.","low_causes":"Acute allergic reactions (temporarily), hyperthyroidism, steroid use","high_causes":"Allergic reactions, hypothyroidism, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3977","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3483","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, immature red blood cells freshly released from the bone marrow. The percentage reflects the rate of red blood cell production. At 0.89%, this is within the laboratory range, indicating that the bone marrow is producing red cells, though at the lower end of output.","low_causes":"Iron/B12/folate deficiency, bone marrow suppression, chronic disease, aplastic anaemia","high_causes":"Recovery from blood loss, haemolytic anaemia, response to iron/B12 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"46.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3213","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells being released into circulation. At 46.4, this is marginally below the lower limit of 50. Combined with the below-range white cell count and neutrophils, this suggests the bone marrow is producing at a slightly reduced rate overall. In a 27-year-old, this is most likely related to cannabis and alcohol effects on bone marrow function rather than any primary marrow disorder. A repeat in six to eight weeks will confirm whether this is a stable finding.","low_causes":"Bone marrow suppression (alcohol, cannabis, medications), iron/B12/folate deficiency, aplastic anaemia, chronic disease","high_causes":"Recovery from blood loss or anaemia, haemolytic anaemia, post-treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"0.90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a simple marker of immune balance and systemic inflammation. It is calculated by dividing neutrophils by lymphocytes. At 0.90, this is below the lower range of 1.0, reflecting the low neutrophil count rather than elevated lymphocytes. The lymphocyte count itself is healthy at 1.76, so this ratio is being pulled down by the isolated neutrophil reduction.","low_causes":"Low neutrophils from any cause (benign ethnic neutropenia, cannabis, alcohol, bone marrow suppression)","high_causes":"Bacterial infection, systemic inflammation, physical stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"29.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. At 29.56%, this is within the optimal range of 25 to 40%, indicating healthy iron delivery to tissues without overloading.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"19.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4729","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3719","upper_optimal_position":"0.6122","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. It fluctuates throughout the day and after meals. At 19.6, this is within the optimal range and indicates adequate iron availability for red blood cell production and energy metabolism.","low_causes":"Iron deficiency, chronic inflammation, poor dietary intake, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.30","upper_optimal":"3.30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. The body produces more transferrin when iron stores are low (to scavenge more iron) and less when stores are high. At 2.64, this is within the optimal range and indicates normal iron metabolism. The fact that transferrin is healthy alongside a ferritin of 297 makes haemochromatosis less likely.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"57.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6143","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and carry iron. It moves inversely with iron stores: high TIBC suggests iron deficiency, low TIBC suggests overload or inflammation. At 57.9, this is within the optimal range and consistent with healthy iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"297","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6389","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5260","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve, primarily in the liver, spleen, and bone marrow. At 297, this is within the laboratory range of 22 to 322 but above the optimal male ceiling of 200. However, transferrin, TIBC, and transferrin saturation are all normal, which makes iron overload conditions like haemochromatosis unlikely. Ferritin can also be elevated by inflammation, but hs-CRP at 0.3 rules that out. Alcohol can contribute to modestly elevated ferritin. No iron supplementation should be taken, and this should be rechecked in twelve months.","low_causes":"Iron deficiency, blood loss, poor dietary intake, coeliac disease","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, alcohol use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"383","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5013","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5822","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning cortisol should be at its highest as part of the natural daily rhythm. At 383, this is within the optimal range for a morning sample, indicating that the adrenal glands are functioning normally and the stress response is not dysregulated.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid use, depression, shift work","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"208","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7120","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4108","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In men, it is produced when an enzyme called aromatase converts testosterone into oestrogen. Aromatase is found primarily in fat tissue and its activity increases with body fat, alcohol consumption, and cannabis use. At 208, this is significantly above the male upper limit of 146.1. Elevated oestradiol in men is associated with fatigue, low mood, difficulty losing body fat, water retention, and reduced sex drive. Given the combination of BMI 28.4, more than 7 drinks per week, and cannabis use, all three factors are driving this elevation. This is reversible through lifestyle change: reducing body fat, cutting alcohol, and stopping cannabis would all reduce aromatase activity and bring oestradiol back down.","low_causes":"Low body fat, aromatase inhibitor medication, menopause (in women)","high_causes":"Obesity (increased aromatase), alcohol use, cannabis use, liver disease, aromatase-producing tumours","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4730","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in brain function and is a precursor to other hormones. At 2.14, this is within the male reference range and requires no action.","low_causes":"Adrenal insufficiency, age-related decline","high_causes":"Congenital adrenal hyperplasia, testicular tumours, HCG-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5190","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3397","upper_optimal_position":"0.6154","units":"mIU/ml","description":"Luteinising hormone is released by the pituitary gland to stimulate testosterone production in the testes. At 5.83, this is within the optimal range and indicates that the pituitary is signalling normally. The fact that testosterone sits at 16.5 despite normal LH signalling suggests the testes are responding but the testosterone produced is being partially converted to oestradiol by aromatase, rather than a failure of the signalling pathway.","low_causes":"Pituitary disease, steroid use, severe illness, obesity","high_causes":"Primary testicular failure, Klinefelter syndrome, age-related decline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"8.52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5627","units":"mIU/ml","description":"FSH is released by the pituitary gland to stimulate sperm production in the testes. At 8.52, this is within the laboratory range but slightly above the optimal ceiling of 8.0. This is not clinically significant in isolation and could reflect natural variation. In combination with the other hormonal markers, the pituitary signalling axis appears to be functioning normally.","low_causes":"Pituitary disease, steroid use, severe illness","high_causes":"Primary testicular failure, age-related decline, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"16.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4532","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, mood, libido, and body composition. At 16.5, this is within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30. At 27 years old, testosterone should be near its peak. The below-optimal level is consistent with the elevated oestradiol: aromatase in body fat is converting testosterone to oestrogen, effectively reducing the amount available for male hormonal function. This pattern directly contributes to the reported fatigue, low mood, and difficulty with body composition, and works against the goal of building muscle. The encouraging news is that this is lifestyle-driven and reversible. Reducing body fat, alcohol, and cannabis would all be expected to raise testosterone and lower oestradiol.","low_causes":"Obesity, alcohol, cannabis, poor sleep, stress, ageing, pituitary disease, testicular disease","high_causes":"Anabolic steroid use, testosterone therapy, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"134","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4053","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6106","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for its role in milk production in women, but in men it affects libido and testosterone function. Very high prolactin can suppress testosterone. At 134, this is within the optimal range and indicates no prolactin-related hormonal disruption. Cannabis can elevate prolactin, so the normal level here is reassuring.","low_causes":"Not clinically significant in most cases","high_causes":"Prolactinoma (pituitary tumour), medications (antipsychotics, SSRIs), cannabis, hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"50.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4457","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically active by dividing total testosterone by SHBG and multiplying by 100. At 50.15, this is within the optimal range, suggesting that despite the below-optimal total testosterone, a reasonable proportion of it is available to tissues.","low_causes":"Low testosterone, high SHBG, ageing, liver disease, thyroid disease","high_causes":"Low SHBG, obesity, insulin resistance, polycystic ovary syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"12.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6386","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4.0","upper_optimal":"11.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3609","upper_optimal_position":"0.5817","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is the most abundant circulating steroid hormone. At 12.3 umol/L (converting to approximately 4,534 ug/dL), this is near the top of the laboratory range, which is expected at 27 years old when DHEA-S is at or near its lifetime peak. No action is needed.","low_causes":"Ageing (declines steadily from late twenties), adrenal insufficiency, chronic illness","high_causes":"Adrenal hyperplasia, adrenal tumour, polycystic ovary syndrome (in women), stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"32.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4388","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3836","upper_optimal_position":"0.5893","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds to testosterone and oestradiol, making them unavailable to tissues. At 32.9, this is within the optimal range of 25 to 55. A moderate SHBG is desirable: too low means the liver is under metabolic strain (common in obesity and insulin resistance), too high means too much testosterone is bound and unavailable.","low_causes":"Obesity, insulin resistance, hypothyroidism, steroid use","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.321","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4678","lower_normal":"0.17","upper_normal":"0.52","lower_optimal":"0.30","upper_optimal":"0.52","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4238","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, and therefore available to enter cells and exert its effects. At 0.321, this is within the laboratory range but at the lower end of the optimal band. Free testosterone is the most functionally relevant testosterone measure, and optimising it through the lifestyle changes discussed would support energy, mood, muscle building, and fat loss.","low_causes":"Low total testosterone, high SHBG, obesity, ageing, cannabis, alcohol","high_causes":"Low SHBG, testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5089","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the inactive thyroid hormone produced by the thyroid gland that circulates in the blood and is converted to active T3 in tissues. At 17.4, this is within the optimal range, indicating adequate thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, autoimmune thyroid disease","high_causes":"Hyperthyroidism, thyroid nodules, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4135","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3696","upper_optimal_position":"0.4749","units":"mIU/L","description":"TSH is produced by the pituitary gland to stimulate the thyroid. It works as an inverse signal: high TSH means the thyroid is underperforming (the pituitary is shouting louder), while low TSH means the thyroid is overproducing. At 1.56, this is within the optimal band of 1.0 to 2.5, indicating the thyroid is working well without being pushed.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5289","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism in every cell. It is produced by converting T4 in tissues. At 5.4, this is within the optimal range, confirming that the body is converting T4 to T3 effectively and metabolic rate is being properly supported by the thyroid.","low_causes":"Hypothyroidism, sick euthyroid syndrome, selenium deficiency, calorie restriction","high_causes":"Hyperthyroidism, early thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system and target an enzyme in the thyroid gland. Their presence at elevated levels indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At below 6.6, this is well within the normal range, ruling out TPO-driven autoimmune thyroid disease.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used in thyroid hormone production. Elevated levels indicate autoimmune thyroid activity. At below 1.3, this is undetectable, which is the case for over 80% of the population and rules out thyroglobulin-driven autoimmune thyroid disease.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is produced in the skin from sunlight and is essential for bone health, immune function, mood regulation, and muscle function. At 84, this is above the sufficient threshold of 50 and within the optimal band of 75 to 120. However, with fewer than 2,000 daily steps suggesting very limited outdoor time, this level is likely to drop during autumn and winter months. A maintenance dose of vitamin D3 is recommended to prevent a seasonal decline, especially given the low mood and fatigue symptoms, both of which have associations with suboptimal vitamin D.","low_causes":"Limited sun exposure, dark skin, obesity (fat sequesters vitamin D), northern latitude, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4507","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5733","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate balance. It rises when calcium or vitamin D are low. At 3.0, this is within the optimal range, confirming that the calcium-vitamin D-PTH axis is functioning correctly.","low_causes":"Hypoparathyroidism, excessive calcium or vitamin D, magnesium deficiency","high_causes":"Low calcium, low vitamin D, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"303","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3732","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4558","upper_optimal_position":"0.6158","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is found in animal products and is absorbed through a complex process in the gut. At 303, this is within the laboratory range but below the optimal threshold of 500. Given the symptoms of fatigue and brain fog, both of which B12 supports, optimising this level through sublingual methylcobalamin supplementation could make a noticeable difference. A takeaway-based diet may not provide consistent, high-quality B12 sources.","low_causes":"Poor dietary intake (especially vegan/vegetarian), malabsorption, pernicious anaemia, medications (metformin, PPIs), alcohol","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7024","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, cell division, and red blood cell production. It works closely with B12. At 19, this is above the laboratory upper limit of 17, but elevated serum folate is not a clinical concern. It most likely reflects recent intake of folate-rich or folate-fortified foods. No action is required.","low_causes":"Poor dietary intake, alcohol use, malabsorption, certain medications, pregnancy","high_causes":"Supplementation, fortified foods, B12 deficiency masking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"167","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found in skeletal muscle, heart muscle, and brain. It rises after muscle damage, intense exercise, or injury. At 167, this is within the optimal range. With no current exercise programme, this likely reflects normal baseline muscle turnover.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7979","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the combined ability of all antioxidants in the blood to neutralise free radicals. At 2.15, this is above the laboratory range of 1.3 to 1.77. This is not a harmful finding. Elevated TAA is most commonly driven by caffeine and polyphenol intake, and given the reported overuse of caffeine and energy drinks, this is the most likely explanation. No action is needed beyond the general recommendation to moderate caffeine intake for other reasons.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Caffeine intake, polyphenol-rich foods, antioxidant supplementation, uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2660","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/ml","description":"Prostate-specific antigen is a protein produced by the prostate gland. It is used as a screening marker for prostate disease. At 1.33, this is within the normal and optimal range for a 27-year-old. This provides a useful baseline for future comparison.","low_causes":"Not clinically significant","high_causes":"Benign prostatic hyperplasia (BPH), prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the unbound fraction of total PSA. The ratio of free to total PSA helps distinguish between benign and malignant causes of elevated PSA. At 0.5, this is within range.","low_causes":"Not clinically significant in isolation","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Free/Total Ratio","group":"PROSTATE","result":"0.376","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4926","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The free to total PSA ratio helps interpret PSA results. A ratio above 0.19 is normal, and higher ratios are reassuring. At 0.376, this is well above the threshold and indicates a healthy prostate profile.","low_causes":"Higher proportion of bound PSA (associated with malignancy risk)","high_causes":"Benign prostatic hyperplasia, normal prostate","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker primarily associated with pancreatic and gastrointestinal cancers. At below 1.2, this is essentially undetectable and provides a reassuring baseline.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gastric cancer, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_p y the immune system in response to a new infection. At 0.5, this is at the lower boundary of the laboratory range. While within range, this is consistent with the mildly suppressed white cell picture and may relate to the overall lower immune output seen in this panel. It is not clinically significant in isolation.","low_causes":"Primary immunodeficiency, certain medications, age","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the immunoglobulin that protects mucosal surfaces including the gut, lungs, and urinary tract. It is also relevant for interpreting coeliac screening (the TTG IgA test requires adequate IgA to be valid). At 1.2, this is within range and confirms the coeliac screen result is reliable.","low_causes":"Selective IgA deficiency (most common immunodeficiency, usually harmless), medications","high_causes":"Chronic mucosal infection, liver disease, coeliac disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"17.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0860","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2500","units":"IU/ml","description":"IgE is the immunoglobulin involved in allergic responses and parasitic defence. Elevated levels suggest allergic tendency or active allergic disease. At 17.2 function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
