<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Beatrice Ogbuagu","dob":"11/08/1962","report_date":"2026-09-05","summary":"Beatrice is a 64-year-old female presenting with a BMI of 32.4, following a standard mixed diet rated 4 out of 10 for quality with a volume of 5 out of 10. She performs one session of cardio per week with no resistance training and takes between 2,000 and 5,000 steps per day. She reports sleeping fewer than six hours most nights and frequently uses painkillers such as ibuprofen or paracetamol. She has a diagnosis of hypertension. She reports frequent illness, joint pain and stiffness, and bloating or digestive discomfort. Her goals are to improve digestion and gut health, improve long-term health and longevity, and prevent disease. She has specifically asked to understand why her cholesterol remains elevated despite medication, why her blood sugars and blood pressure are high, why she falls ill frequently, and what her vitamin and mineral levels look like.\n\nThere are several findings in this report that warrant a conversation with her GP, and the most important of these is the immune picture, which we will come to shortly. First, however, it is worth acknowledging that a number of things are working well. Her kidney function, measured by Cystatin C (a protein the kidneys filter at a steady rate, giving a reliable estimate of how well they are working), returns an eGFR of 86, which is a solid result at 64. Her creatinine-based eGFR is above 90, and with her West African ethnicity the adjusted figure would be even higher, so her kidneys are in good shape despite her blood pressure history and regular painkiller use, both of which can strain the kidneys over time. Her liver enzymes are reassuring: ALT, which measures liver cell damage, is 17, well within the optimal range for women. AST is 21, also comfortable. GGT, a marker particularly sensitive to metabolic strain, alcohol, and medication effects, is 37, just inside the upper limit for women but still within range. Her FIB-4 score, which estimates whether there is any scarring in the liver, is 1.33, and at her age the threshold of concern is actually 2.0, so this is well within the safe zone. Her bilirubin is 7, her albumin is 37, and together these confirm a liver that is functioning without any sign of disease. Her thyroid is working well. TSH at 0.95 sits in the lower half of the ideal range, FT4 at 13.6 is a little below optimal but still within the laboratory range, and FT3, the active thyroid hormone that cells actually use, is 5.1, comfortably in the ideal zone. Both thyroid antibody tests are negative, meaning there is no sign of autoimmune thyroid disease. Her triglycerides at 0.87 are excellent, sitting below the optimal threshold of 1.0, and her HDL cholesterol at 1.9 is genuinely impressive, well above the 1.6 optimal target for women. Her TG/HDL ratio, one of the best markers for metabolic health, calculates to 0.46, which is outstanding. Her ESR, an inflammation marker that rises with infection, autoimmune conditions, and many chronic diseases, is just 1, about as low as it can go. Her CA-125 and CA 19-9 tumour markers are both reassuringly low. Her CEA is 1.43, well within the normal range for a non-smoker. Her urine is clean, with no protein, no glucose, no blood cells, no white cells, and no nitrites, all of which is reassuring given her hypertension and painkiller use. Her cortisol at 167 sits within the expected morning range, and her oestradiol at 57 and progesterone at 0.69 are entirely consistent with her postmenopausal status, confirmed by her FSH of 61.75 (FSH, or follicle-stimulating hormone, rises permanently above 40 once the ovaries stop cycling). Her prolactin is normal at 105.\n\nNow to the findings that need attention. The most striking result in this report is the immune system. Her IgG is 19.8, above the upper limit of 16. IgG is the most abundant antibody in the blood, the one the body uses for long-term defence against bacteria and viruses. Her IgA is 4.5, above the upper limit of 3.5. IgA is the antibody that lines the mucosal surfaces, the gut, the airways, the urinary tract, essentially the first barrier between the outside world and the inside of the body. Her IgE is 357, more than three times the upper limit of 100. IgE is the antibody the body produces in response to allergic triggers and parasitic infections. Having all three immunoglobulin classes elevated simultaneously is unusual and suggests the immune system is being chronically activated. Given that Beatrice is of West African heritage, the raised IgE could reflect a parasitic exposure history or an allergic or atopic tendency, but the combination of raised IgG, IgA, and IgE together, particularly at these levels, needs further investigation. The elevated IgA is particularly relevant given her digestive symptoms, as IgA is the dominant antibody in the gut lining, and a raised level could reflect chronic gut inflammation or immune activation within the digestive tract. This pattern could also be associated with a condition called an IgG or IgA monoclonal gammopathy, which is more common with age and is usually harmless but needs to be excluded with a test called serum protein electrophoresis. Her GP should be made aware of all three results and asked to arrange serum protein electrophoresis and, depending on the clinical picture, consideration of allergy testing or stool testing for parasites. The elevated globulin of 44, above the upper limit of 36, fits with this picture, as globulin is the total pool of antibody proteins, and when multiple immunoglobulin classes are raised, the globulin total rises with them. Her rheumatoid factor is still to follow and may add further context, particularly given her joint pain and stiffness. These immune findings may well be connected to her frequent illness: a chronically activated immune system can paradoxically become less effective at fighting new infections because the resources are directed elsewhere.\n\nThe blood count tells an important story. Her haemoglobin is 110, below the lower limit of 120 for women, meaning she is anaemic. Her MCV, which measures the average size of her red blood cells, is 70.9, well below the lower limit of 83. Her MCH, the average amount of haemoglobin packed into each red cell, is 23.3, below the lower limit of 27. Her RDW, which measures how much variation there is in red cell size, is 17.1, above the upper limit of 14. Her haematocrit, the proportion of blood made up of red cells, is 0.335, below the lower limit of 0.36. This pattern, small red cells with low haemoglobin and high size variation, is called a microcytic anaemia, and the two most common explanations are iron deficiency and thalassaemia trait. Here is where it becomes interesting: her ferritin, the main marker of iron stores, is 139, which is comfortably within range and actually above the optimal floor of 40 for women. Her serum iron is 19.2, healthy. Her transferrin saturation is 31.7%, right in the middle of the optimal range. So her iron stores are adequate, but her red cells are still small and under-filled. This pattern is characteristic of thalassaemia trait, a very common inherited condition in people of West African heritage where the body makes a slightly different form of haemoglobin. It is not a disease, it does not progress, and it does not usually cause symptoms, but it does cause the blood count to look like iron deficiency even when iron is perfectly adequate. The important clinical point is that she should not be given iron supplements on the basis of these results, because her iron stores are already healthy, and additional iron could cause harm. Her GP can confirm this with a test called haemoglobin electrophoresis or an HbA2 level. It would be valuable to know whether this has been investigated before, and if not, this is the time to do so. Her MPV at 10.9 is marginally above the upper limit of 10.1. MPV measures the average size of platelets, and a slightly raised MPV is commonly seen alongside microcytic anaemia as the bone marrow compensates by producing slightly larger, more active platelets. It is not a concern in isolation.\n\nHer transferrin is 2.41, just below the lower limit of 2.5. Transferrin is the transport protein that carries iron through the bloodstream. A mildly low transferrin in the presence of adequate iron stores is not typically a sign of iron deficiency. Rather, transferrin can fall as part of the body's inflammatory or immune response, as it is what is called a negative acute phase reactant, meaning the liver produces less of it when the immune system is activated. Given her elevated immunoglobulins and hs-CRP of 2.9, a low-grade chronic inflammatory state is plausible and would explain the transferrin being fractionally below range.\n\nHer hs-CRP, the high-sensitivity measure of inflammation in the body, is 2.9. While this is within the laboratory range of under 5, the optimal level is below 1.0, and from a cardiovascular risk perspective, a level above 2.0 is considered to add meaningful risk. At her BMI of 32.4 with hypertension and the elevated immunoglobulin picture, this level of inflammation is not surprising, but it is something that can be improved through dietary quality, weight management, and increased physical activity.\n\nTurning to her cholesterol, which she has specifically asked about: her total cholesterol is 6.2, above the desirable level of 5.18. Her LDL cholesterol is 3.96, above the optimal target of 3.0 used by the laboratory and well above the 2.6 threshold that represents genuinely low cardiovascular risk. Her ApoB, which counts the actual number of cholesterol-carrying particles in the blood (and is a more accurate measure of risk than LDL alone), is 1.11, above the 0.9 target. Her non-HDL cholesterol is 4.3, above the 4.0 threshold. Her ApoB to ApoA1 ratio is 0.70, above the lower-risk threshold of 0.6 though still in the average-risk zone rather than higher risk. However, the single most important finding in the lipid panel is her Lipoprotein(a), reported as greater than 212.5 nmol/L. Lipoprotein(a), often written as Lp(a), is a genetically inherited particle that is essentially an LDL particle with an extra protein attached to it. It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls just like LDL, it promotes blood clotting, and it drives inflammation. The level is entirely determined by genetics and cannot be changed by diet, exercise, medication, or any lifestyle intervention. The normal level is below 32 nmol/L. Hers is above 212.5, putting her in the high-risk category. This is almost certainly the reason her cholesterol remains elevated despite medication, because standard cholesterol-lowering drugs do not reduce Lp(a). Her total cholesterol and LDL numbers include the cholesterol carried by Lp(a), so a significant portion of what appears as elevated LDL is actually Lp(a)-carried cholesterol that medication cannot touch. This is genuinely important information. Her GP should record this result permanently in her medical notes, because it represents a lifelong, inherited cardiovascular risk factor. It also means that controlling the modifiable parts of her cardiovascular risk, her blood pressure, her weight, her hs-CRP, her blood sugar, her ApoB from non-Lp(a) sources, becomes even more important because the Lp(a) component cannot be changed. Her first-degree relatives, siblings and children, should also be offered Lp(a) testing, as there is approximately a 50% chance of inheriting it. There is one piece of good news within the lipid picture: her HDL at 1.9 and her triglycerides at 0.87 are excellent, and her ApoA1 at 1.59 is above the desirable threshold, meaning the protective side of her lipid profile is strong.\n\nHer blood sugar deserves careful attention. Her fasting glucose is 5.7, which sits at the upper boundary of the laboratory range of 3.5 to 6.0 and above the optimal ceiling of 5.4. Her HbA1c, which reflects average blood sugar over the previous two to three months, is 39 mmol/mol (or 5.7%), which is within the normal range of under 42 but close enough to the pre-diabetic threshold to take seriously. Her insulin is 2.14, below the lower limit of the laboratory range of 2.6, and her C-Peptide, which is released in equal amounts to insulin and is a more stable measure of how much insulin the pancreas is producing, is 0.324 ug/L (approximately 107 pmol/L), below the lower limit of 1.1 ug/L (364 pmol/L). Her HOMA-IR, the measure of insulin resistance, is 0.54, which is actually in the insulin-sensitive range and technically a positive finding. However, the combination of a glucose creeping to the top of range alongside insulin and C-Peptide both being below range raises a different question. Rather than the common pattern of insulin resistance where the body produces too much insulin to force sugar into cells, her pattern suggests the pancreas may not be producing quite enough insulin to keep glucose tightly controlled. This could reflect early pancreatic beta-cell insufficiency, and given her age and West African heritage (which carries a higher baseline risk of type 2 diabetes), it would be sensible for her GP to monitor this with a repeat glucose, HbA1c, and C-Peptide in six months. The C-Peptide result carries a lab note that samples not separated within four hours can lose up to 56% of their concentration, so a repeat on a properly handled sample would be valuable.\n\nHer vitamin D at 54 nmol/L sits just above the sufficiency threshold of 50 but is well below the optimal range of 75 to 120. At a BMI of 32.4, fat tissue sequesters vitamin D, meaning she needs a higher dose to reach optimal levels. Given her joint pain, her immune findings, and her goal of disease prevention, optimising vitamin D is one of the most straightforward interventions available. Her folate at 6 is within the laboratory range of 3 to 17 but below the optimal threshold of 8 and low enough that, combined with a diet rated 4 out of 10 for quality, it suggests she is not getting enough leafy greens, legumes, or fortified foods. Her B12 at 414 is within range but below the optimal floor of 500, and given her age (B12 absorption declines with age) this should be supplemented. Her magnesium at 1.05 is at the top of the laboratory range and within the optimal band, which is a genuine positive.\n\nHer testosterone is 0.4, below the lower limit of 0.5 for women. Her free testosterone, calculated at 0.006 nmol/L, is also very low. In postmenopausal women, testosterone supports muscle maintenance, bone density, energy, and libido. A low level may be contributing to her joint stiffness and general sense of low vitality, particularly in combination with no resistance training and very low activity levels. Her DHEA-S at 1.1 umol/L (approximately 405 ug/dL) is within range but at the lower end for her age. These are worth discussing with her GP or a menopause specialist, as testosterone replacement in postmenopausal women is an option where symptoms are present.\n\nHer total antioxidant activity at 1.55 is within the healthy range. Her calcium is well controlled at 2.57 corrected, and her parathyroid hormone at 2.2 is mid-range, confirming normal calcium regulation. Her CA-125 at 13.7 is reassuringly low. Her CA 15-3 and rheumatoid factor results are still pending and should be reviewed when available. Her celiac screen (tissue transglutaminase IgA) is negative at 2.51, which helps rule out celiac disease as a cause of her bloating, though with her IgA being elevated, the negative result is reliable rather than being a false negative from IgA deficiency. Her uric acid at 262 is well within range. Her creatine kinase at 69 is healthy, and her amylase and lipase, which measure pancreatic function, are both within their respective ranges.","links":"Beatrice has asked three specific questions, and the results provide answers to all of them. The cholesterol that keeps coming back elevated is almost certainly being driven, at least in part, by her Lipoprotein(a), which is genetically inherited and does not respond to standard cholesterol medication. This does not mean medication is pointless, because reducing the LDL component that can be modified is even more important when the Lp(a) component cannot be touched. She should discuss this with her GP, bringing the Lp(a) result of greater than 212.5 nmol/L, and ask for it to be recorded permanently in her medical notes. Her GP may wish to consider whether her current medication is optimised or whether additional options such as PCSK9 inhibitors are appropriate given the Lp(a) level. Her first-degree relatives should be offered testing.\n\nThe higher blood sugars are sitting at the boundary between normal and pre-diabetic territory. Her fasting glucose of 5.7 and HbA1c of 39 are not yet in the pre-diabetic range, but the low insulin and C-Peptide suggest the pancreas is working on the lighter side rather than the heavier side. The most effective intervention here is weight loss and dietary improvement. At 81 kg and 158 cm, her BMI is 32.4. A reduction of 8 to 12 kg, bringing her to a target range of 69 to 73 kg, would significantly improve her insulin sensitivity, reduce the inflammatory burden driving her hs-CRP, ease the load on her blood pressure, and likely improve her joint discomfort. Her current maintenance calories at her activity level sit at approximately 1,750 to 1,850 per day. A sustainable fat-loss intake would be 1,400 to 1,550 calories per day, and she should aim for a minimum of 105 grams of protein per day (approximately 1.3g per kg of body weight), which will protect her muscle mass during weight loss and support her bone density postmenopausally. Protein sources should include oily fish at least twice per week (salmon, mackerel, sardines), which also provides omega-3 to support her cardiovascular risk profile. She should increase her intake of vegetables, legumes, and whole grains, prioritising soluble fibre from oats, beans, lentils, and sweet potatoes, which directly reduces LDL cholesterol by binding bile acids in the gut. Reducing saturated fat from processed and fried foods, red meat, and full-fat dairy will also help lower the modifiable component of her LDL. These dietary changes address her digestion goals simultaneously, as more fibre and more diverse plant foods feed the beneficial gut bacteria and improve the bloating and digestive discomfort she reports.\n\nHer frequent illness should be discussed with her GP in the context of her raised IgG, IgA, and IgE. The GP should arrange serum protein electrophoresis to exclude a monoclonal gammopathy, and depending on the clinical picture, may wish to consider allergy testing (given the markedly raised IgE) and stool testing for parasitic infection. If the electrophoresis is normal, the pattern may reflect chronic immune activation from gut inflammation, environmental allergens, or another ongoing stimulus. This investigation should take priority.\n\nHer blood count showing microcytic anaemia with adequate iron stores is very likely explained by thalassaemia trait, which is common in people of West African heritage. If she has never had haemoglobin electrophoresis, she should request it from her GP. This is a one-off test that provides a definitive answer. She should not take iron supplements.\n\nHer sleep is a critical area. Sleeping fewer than six hours most nights accelerates cardiovascular ageing, impairs immune function (directly relevant to her frequent illness), raises cortisol and blood pressure, increases insulin resistance, and promotes weight gain. Practical steps include setting a fixed wake time seven days a week, getting outside within an hour of waking for natural light exposure, cutting caffeine entirely after midday, keeping the bedroom cool (around 18 degrees), and avoiding screens for 30 to 60 minutes before bed. If these measures do not improve sleep duration, her GP should assess whether a formal sleep study is warranted.\n\nHer painkiller use needs attention. Frequent ibuprofen use can damage the gut lining (potentially contributing to her bloating and digestive discomfort), reduce kidney function over time, and raise blood pressure. She should discuss alternatives with her GP, particularly given that her joint pain may benefit from other approaches such as physiotherapy, weight loss (which reduces mechanical load on the joints), and anti-inflammatory dietary changes rather than regular painkiller use.\n\nHer physical activity is the single biggest area for improvement. One cardio session per week, no resistance training, and 2,000 to 5,000 steps per day is not enough to support her goals of disease prevention and longevity. She should aim for a minimum of 7,000 steps per day initially, building towards 10,000 over three months. She should add at least two sessions per week of resistance exercise, which could be bodyweight exercises, resistance bands, or supervised gym work. Resistance training is the most effective intervention for maintaining muscle mass, bone density, and metabolic health in postmenopausal women, and it directly addresses her low testosterone by stimulating natural testosterone production. Her GP should repeat the following markers in six months: full blood count, glucose, HbA1c, C-Peptide, insulin, IgG, IgA, IgE, serum protein electrophoresis, hs-CRP, lipid panel with ApoB, and vitamin D.","flags":"IMMUNOLOGY: IgG 19.8 (range 6.5 to 16), IgA 4.5 (range 0.4 to 3.5), IgE 357 (range under 100). All three immunoglobulin classes elevated simultaneously. Globulin 44 (range 18 to 36) consistent with polyclonal or monoclonal hypergammaglobulinaemia. Recommend serum protein electrophoresis to exclude monoclonal gammopathy. Consider allergy panel and stool ova/cyst/parasite testing given IgE level and West African heritage. Rheumatoid factor still pending.\n\nHAEMATOLOGY: Haemoglobin 110 (range 120 to 150), MCV 70.9 (range 83 to 101), MCH 23.3 (range 27 to 32), HCT 0.335 (range 0.36 to 0.46), RDW 17.1 (range 11.6 to 14). Microcytic hypochromic anaemia with adequate iron stores (ferritin 139, transferrin saturation 31.7%). Pattern strongly suggests thalassaemia trait given West African ethnicity. Recommend haemoglobin electrophoresis or HPLC if not previously performed. Iron supplementation not indicated. MPV 10.9 (range 7.1 to 10.1), marginally raised, likely compensatory.\n\nLIPIDS: Lipoprotein(a) greater than 212.5 nmol/L (range under 32), high-risk category. Inherited, permanent. Should be recorded permanently in medical notes. First-degree relatives should be tested. Total cholesterol 6.2, LDL 3.96 (range under 3.0), ApoB 1.11 (range under 0.9), non-HDL 4.3 (range under 4.0), ApoB/A1 ratio 0.70 (range under 0.6). Consider optimisation of lipid-lowering therapy in context of Lp(a). HDL 1.9 and triglycerides 0.87 are protective.\n\nGLUCOSE: Fasting glucose 5.7 (range 3.5 to 6.0, optimal under 5.4). HbA1c 39 mmol/mol (normal under 42). Insulin 2.14 (range 2.6 to 24.9), C-Peptide 0.324 ug/L (range 1.1 to 4.4), both below range. Pattern may reflect low insulin secretory capacity rather than insulin resistance. C-Peptide may have been affected by delayed sample separation. Recommend repeat glucose, HbA1c, C-Peptide, and insulin in six months.\n\nIRON: Transferrin 2.41 (range 2.5 to 3.8), marginally below range. Likely negative acute phase response given elevated immunoglobulins and hs-CRP 2.9. Iron stores adequate.\n\nINFLAMMATION: hs-CRP 2.9 (lab range under 5, optimal under 1.0). Intermediate cardiovascular risk category. Consistent with BMI 32.4 and chronic immune activation.\n\nHORMONES: Testosterone 0.4 (range 0.5 to 2.6). Low postmenopausal testosterone. May contribute to fatigue, joint stiffness, and reduced muscle mass. Consider discussing testosterone replacement with menopause specialist if symptomatic.\n\nVITAMINS: Vitamin D 54 nmol/L (sufficient but below optimal 75 to 120). Folate 6 ng/ml (range 3 to 17, optimal above 8). B12 414 pg/ml (range 193 to 982, optimal above 500).\n\nPENDING: CA 15-3, Rheumatoid Factor, Bacterial Count, Urine Culture and Sensitivities. Review when available.\n\nReassuring negatives: Kidney function preserved (Cystatin C eGFR 86, creatinine eGFR above 90). Liver enzymes all within range. Thyroid function normal with negative antibodies. ESR 1. CA-125 13.7 (under 24). CA 19-9 under 1.2. CEA 1.43. Celiac screen negative. Urine clean. Calcium and PTH normal. Amylase and lipase normal.","recommendations":"Book a GP appointment to discuss the following: the raised IgG, IgA, and IgE results with a request for serum protein electrophoresis; the Lipoprotein(a) result for permanent recording in medical notes; the blood count pattern suggesting thalassaemia trait with a request for haemoglobin electrophoresis if not previously done; the glucose and C-Peptide pattern for monitoring; and the low testosterone for consideration of replacement. Bring a printed copy of the flags section to the appointment.\n\nIncrease dietary quality from 4 to at least 7 out of 10 by adding vegetables, legumes, oily fish, and whole grains while reducing processed foods, fried foods, and excess saturated fat. Aim for at least 30 grams of fibre per day, with emphasis on soluble fibre from oats, lentils, beans, and sweet potatoes.\n\nReduce calorie intake to 1,400 to 1,550 calories per day with a minimum of 105 grams of protein daily to support a weight loss target of 69 to 73 kg over 12 to 18 months.\n\nIncrease daily steps to a minimum of 7,000, building towards 10,000 over three months. Add at least two resistance training sessions per week.\n\nPrioritise sleep. Aim for seven to eight hours per night with a fixed wake time, morning light exposure, no caffeine after midday, and a cool, dark bedroom.\n\nDiscuss painkiller use with GP and explore alternatives such as physiotherapy, weight loss, and anti-inflammatory dietary changes for joint pain management.\n\nArrange Lp(a) testing for first-degree relatives (siblings and children).\n\nRetest in six months: full blood count, glucose, HbA1c, C-Peptide, insulin, hs-CRP, IgG, IgA, IgE, lipid panel with ApoB, vitamin D, and folate.","supplementation":"Vitamin D3 (cholecalciferol), 4,000 IU daily taken with her largest meal containing fat. At her BMI of 32.4, the higher dose is needed because fat tissue absorbs and holds onto vitamin D, reducing the amount available in the bloodstream. Her current level of 54 is sufficient by NHS standards but well below the optimal range of 75 to 120. This should always be paired with Vitamin K2 (MK-7 form), 200 mcg daily, which directs the calcium that vitamin D helps absorb into the bones rather than the artery walls, an important consideration given her cardiovascular risk profile.\n\nOmega-3 fish oil, providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports cardiovascular health by reducing triglycerides (hers are already excellent, but the anti-inflammatory and anti-clotting effects are valuable given her Lp(a) level and hs-CRP of 2.9), reduces systemic inflammation, and supports joint comfort.\n\nVitamin B12, sublingual methylcobalamin, 1,000 mcg daily dissolved under the tongue. Sublingual delivery bypasses the gut, which is important because B12 absorption declines with age. Her level of 414 is within the laboratory range but below the optimal threshold of 500.\n\nFolate (methylfolate, not folic acid), 400 to 800 mcg daily. Her folate at 6 is below the optimal level of 8, and improving it supports red blood cell production, homocysteine metabolism, and overall cellular function. This works synergistically with B12.\n\nMagnesium glycinate, 300 mg taken before bed. Although her magnesium at 1.05 is within the optimal range, magnesium glycinate specifically supports sleep quality, which is a priority given that she sleeps fewer than six hours most nights. The glycinate form is gentle on the gut, relevant given her digestive symptoms.\n\nShe should NOT take iron supplements. Her ferritin at 139 and transferrin saturation at 31.7% confirm that her iron stores are adequate. The small red cells on her blood count are very likely a reflection of thalassaemia trait rather than iron deficiency, and adding iron when stores are already healthy could push ferritin into the high range and cause harm.\n\nThe most important changes from this report are not supplements. They are improving her diet quality and increasing her protein intake, losing 8 to 12 kg of body weight, adding resistance training and more daily movement, and extending her sleep to seven or more hours per night. These four changes would improve her blood sugar, her inflammation, her cholesterol, her joint pain, her immune resilience, and her energy more than any supplement can.","biomarkers":[{"key":"GLU","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5600","units":"mmol/l","description":"Blood glucose measures the concentration of sugar in the blood at the moment the sample was taken. It is the body's primary fuel source, regulated by insulin from the pancreas. Beatrice's fasting glucose of 5.7 sits at the top end of the laboratory range (3.5 to 6.0) and above the optimal ceiling of 5.4. While not yet in the pre-diabetic range, this level, combined with her low insulin and C-Peptide, suggests the pancreas may not be producing quite enough insulin to keep glucose tightly controlled. Weight loss, dietary improvement, and increased physical activity are the most effective ways to bring this down.","low_causes":"Fasting, excessive insulin production, liver disease, adrenal insufficiency","high_causes":"Pre-diabetes, type 2 diabetes, stress, corticosteroid use, Cushing's syndrome, pancreatic insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GHB","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4385","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4500","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose permanently attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Beatrice's HbA1c of 5.7% is within the normal range (under 6.0%) but approaching the pre-diabetic threshold of 6.0 to 6.4%. However, there is an important caveat: in thalassaemia trait, red blood cells have a shorter lifespan, which can make HbA1c appear falsely low. If thalassaemia trait is confirmed, her true average blood sugar may be slightly higher than 5.7% suggests.","low_causes":"Shortened red blood cell lifespan, haemolytic anaemia, significant blood loss, thalassaemia trait","high_causes":"Pre-diabetes, type 2 diabetes, chronic hyperglycaemia, iron deficiency anaemia (falsely elevated)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"GHBI","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised units of mmol/mol rather than percentage. Beatrice's result of 39 mmol/mol falls within the normal range (under 42) but above the optimal ceiling of 36. The pre-diabetic range begins at 42. As noted above, thalassaemia trait, if confirmed, can cause HbA1c to underestimate true average blood sugar.","low_causes":"Shortened red blood cell lifespan, haemolytic anaemia, thalassaemia trait","high_causes":"Pre-diabetes, type 2 diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"INS","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2296","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3973","units":"mIU/L","description":"Insulin is the hormone produced by the beta cells of the pancreas that allows cells to take up glucose from the blood for energy. Beatrice's fasting insulin of 2.14 is below the laboratory range of 2.6 to 24.9 and also below the optimal range of 2.0 to 8.0. In many lean, low-carbohydrate individuals, low insulin simply reflects excellent insulin sensitivity and low demand. However, in Beatrice's case, her fasting glucose is also at the top of range at 5.7, which raises the possibility that her pancreas is not producing quite enough insulin to keep glucose tightly regulated. This should be monitored with repeat testing in six months.","low_causes":"Low carbohydrate intake, high insulin sensitivity, early beta-cell insufficiency, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, metabolic syndrome, obesity, polycystic ovary syndrome, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CPEP","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.324","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1676","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4758","units":"ug/l","description":"C-Peptide is a fragment that is cut away from proinsulin when the pancreas manufactures insulin. One molecule of C-Peptide is released for every molecule of insulin, making it a reliable measure of how much insulin the pancreas is actually producing. It is more stable in the blood than insulin itself. Beatrice's C-Peptide of 0.324 ug/L is well below the laboratory range of 1.1 to 4.4, confirming the low insulin finding. The lab has noted that samples not separated within four hours can lose up to 56% of their C-Peptide concentration, so delayed processing could account for some of the low reading. A repeat on a properly handled sample would clarify whether this is a genuine finding. In pmol/L (multiplying by 331), this is approximately 107 pmol/L.","low_causes":"Low insulin secretion, early beta-cell insufficiency, type 1 diabetes, prolonged fasting, delayed sample processing","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3540","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated score that estimates how resistant the body's cells are to insulin's effects. It is derived from the fasting glucose and fasting insulin levels. A lower score is better, with under 1.0 indicating good insulin sensitivity. Beatrice's HOMA-IR of 0.54 places her in the insulin-sensitive category, which in isolation is a positive finding. However, this result should be interpreted alongside the low insulin and C-Peptide: the score is low partly because insulin is low, and if insulin is low because the pancreas is under-producing rather than because the body is highly sensitive, the clinical meaning is different.","low_causes":"High insulin sensitivity, low carbohydrate diet, low insulin production","high_causes":"Insulin resistance, metabolic syndrome, obesity, type 2 diabetes, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"HOMA_B","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"19.45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1621","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the pancreatic beta cells are functioning by calculating the expected insulin output for a given glucose level. It is calculated as (20 x Insulin) / (Glucose - 3.5). Beatrice's HOMA-B of 19.5 is well below the expected range of 80 to 200, suggesting reduced beta-cell output. This is the most concerning component of the glucose picture: while her glucose and HbA1c are still in the normal range, the beta cells appear to be producing less insulin than expected for her glucose level. This may be influenced by delayed sample processing affecting the insulin measurement, so a repeat is recommended. If confirmed, it would warrant closer monitoring for progression towards type 2 diabetes.","low_causes":"Reduced beta-cell function, early type 2 diabetes, late-onset type 1 diabetes (LADA), prolonged fasting, delayed sample processing","high_causes":"Insulin resistance with compensatory hypersecretion, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ALT","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1518","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood, making it a sensitive marker of liver health. Beatrice's ALT of 17 is well within the laboratory range and below the optimal ceiling of 25 for women, indicating her liver cells are healthy with no sign of damage or metabolic strain.","low_causes":"Normal finding, vitamin B6 deficiency (rare)","high_causes":"Fatty liver disease, hepatitis, alcohol excess, medication toxicity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"AST","name":"AST/GOT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5313","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT, but when viewed alongside ALT it helps build a picture of liver health. Beatrice's AST of 21 is well within range, confirming healthy liver function.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GGT","name":"Gamma GT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4868","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5294","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake, metabolic stress, bile duct problems, and medication effects. It is often the first liver marker to rise when the liver is under strain. Beatrice's GGT of 37 is within the laboratory range for women (4 to 38) but above the optimal ceiling of 25. This borderline level may reflect her BMI, her frequent painkiller use, or a combination of factors. It is not a concern at this level but worth monitoring.","low_causes":"Normal finding","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, metabolic syndrome, medication effects (paracetamol, NSAIDs)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ALP","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, and bile ducts. It can be raised by bile duct problems, bone disorders, or vitamin D deficiency. Beatrice's ALP of 85 is comfortably within range, suggesting no biliary or bone issues.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, vitamin D deficiency, Paget's disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"BILI","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells break down. The liver processes it for excretion. Elevated bilirubin can indicate liver disease, bile duct problems, or excessive red cell breakdown. Beatrice's bilirubin of 7 is at the lower end of the range, which is normal and healthy.","low_causes":"Normal finding","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PROT","name":"Total Protein","group":"LIVER & METABOLIC","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6173","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. Beatrice's total protein of 81 is at the upper end of the range (57 to 82), driven primarily by her elevated globulin fraction. The total is within range because her albumin is at the lower end, but the high globulin is the component that warrants investigation.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Chronic infection, chronic inflammation, elevated immunoglobulins, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ALB","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance. Beatrice's albumin of 37 is within the laboratory range but below the optimal floor of 40. A lower albumin alongside high globulin is a pattern sometimes seen in chronic inflammation or immune activation, where the liver redirects its protein production from albumin towards acute phase proteins.","low_causes":"Chronic inflammation, liver disease, kidney disease (protein loss), malnutrition, overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GLOB","name":"Globulin","group":"LIVER & METABOLIC","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8148","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6222","units":"g/l","description":"Globulin is a family of proteins in the blood that includes all the immunoglobulins (antibodies). It is calculated by subtracting albumin from total protein. Beatrice's globulin of 44 is significantly above the upper limit of 36, directly reflecting her elevated IgG, IgA, and IgE levels. When globulin is this elevated, serum protein electrophoresis is recommended to determine whether the elevation is polyclonal (spread across multiple antibody types, typically seen in chronic infection or inflammation) or monoclonal (a single clone of cells producing one antibody type, which can indicate myeloma or a benign gammopathy).","low_causes":"Immune deficiency, liver disease, nephrotic syndrome","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, myeloma, liver cirrhosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"AG_RATIO","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"0.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2095","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio divides the albumin level by the globulin level to give a simple summary of the balance between these two protein groups. A healthy ratio is above 1.1, meaning albumin should outweigh globulin. Beatrice's ratio of 0.84 is below range because her globulin is elevated (44) while her albumin is on the lower side (37). This inverted ratio reinforces the need for serum protein electrophoresis to investigate the cause of the elevated globulin.","low_causes":"Elevated immunoglobulins, chronic infection, autoimmune disease, myeloma, liver cirrhosis, low albumin","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FIB4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4586","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score estimates the likelihood of liver fibrosis (scarring) using a formula that combines age, ALT, AST, and platelet count. Beatrice's score of 1.33 is below the standard threshold of 1.45, and importantly, at her age of 64, the age-adjusted threshold is actually 2.0, which means her score is well within the safe range. Her liver enzymes are all healthy, confirming that this score reflects healthy liver tissue.","low_causes":"Normal finding, young age, high platelet count","high_causes":"Liver fibrosis, cirrhosis, age-driven calculation artefact, low platelets, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"AMY","name":"Amylase","group":"LIVER & METABOLIC","result":"111","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5758","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels can indicate pancreatitis or other pancreatic disease. Beatrice's amylase of 111 is within the range of 30 to 118, confirming normal pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"Lip","name":"Lipase","group":"LIVER & METABOLIC","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. It is a more specific marker of pancreatic health than amylase. Beatrice's lipase of 53 is within the range of 13 to 60, confirming her pancreas is functioning normally.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, pancreatic tumour, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CHO","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5986","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL (the type that can build up in artery walls), HDL (the protective type that removes cholesterol from arteries), and VLDL (which carries triglycerides). Beatrice's total cholesterol of 6.2 is above the desirable level of 5.18. However, total cholesterol alone is not the best measure of cardiovascular risk because it includes the protective HDL. With her excellent HDL of 1.9, a significant portion of her total is made up of good cholesterol. The more meaningful measures are her LDL, ApoB, and Lp(a).","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Genetics, diet high in saturated fat, hypothyroidism, obesity, kidney disease, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"TRI","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2559","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat in the blood, made from dietary fats and excess carbohydrates. They are a key marker of metabolic health. Beatrice's triglycerides of 0.87 are below the optimal ceiling of 1.0, which is an excellent result. Low triglycerides indicate her body is processing dietary fats and sugars efficiently.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol excess, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"VLDC","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to the tissues. It is calculated from the triglyceride level. Beatrice's VLDL of 0.4 is well within range and consistent with her excellent triglyceride level.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"High triglycerides, metabolic syndrome, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"HDL","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6119","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective form of cholesterol. It collects excess cholesterol from the artery walls and carries it back to the liver for recycling or disposal, a process called reverse cholesterol transport. Higher is better. Beatrice's HDL of 1.9 is well above both the desirable threshold of 1.55 and the optimal floor of 1.6 for women. This is an excellent result and provides meaningful cardiovascular protection, partially offsetting the risk from her elevated LDL and Lp(a).","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, low-fat diet","high_causes":"Genetics, regular exercise, moderate alcohol consumption, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"LDL","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"0","upper_normal":"3.0","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is the type most associated with cardiovascular disease. It carries cholesterol into the artery walls where it can accumulate and form plaques. Beatrice's LDL of 3.96 is above the laboratory target of 3.0 and well above the optimal ceiling of 2.6. Importantly, this number includes cholesterol carried by Lp(a) particles, which cannot be reduced by diet or standard medication. Her GP can estimate how much of her LDL is truly modifiable versus Lp(a)-driven, which may change the treatment approach.","low_causes":"Hyperthyroidism, malnutrition, liver disease, statin therapy","high_causes":"Genetics, diet high in saturated fat, hypothyroidism, elevated Lp(a), obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"HDLRat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3622","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. It provides a simple summary of the balance between total and protective cholesterol. A ratio below 4.5 is desirable, and below 3.5 is optimal. Beatrice's ratio of 3.26 falls within the optimal range, largely because her HDL is so strong at 1.9.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"HCR","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"30.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7663","lower_normal":"20.0","upper_normal":"","lower_optimal":"25.0","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This expresses HDL cholesterol as a percentage of total cholesterol. A higher percentage is better, meaning more of the total cholesterol is the protective type. Beatrice's HDL makes up 30.65% of her total cholesterol, well above the desirable threshold of 20%. This is a strong positive finding.","low_causes":"Low HDL, metabolic syndrome, obesity, sedentary lifestyle","high_causes":"High HDL, genetics, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"NHDL","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5375","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, representing all the potentially harmful cholesterol particles in the blood (LDL, VLDL, IDL, and Lp(a)). Beatrice's non-HDL of 4.3 is above the target of 4.0 and above the optimal ceiling of 3.4. A portion of this is driven by her very high Lp(a).","low_causes":"Statin therapy, low-fat diet, hyperthyroidism","high_causes":"Genetics, elevated Lp(a)
