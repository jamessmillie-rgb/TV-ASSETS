parathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6322","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle relaxation, nerve function, and blood pressure regulation. Beatrice's magnesium at 1.05 mmol/L is within the optimal range, which is a positive finding particularly given her hypertension, as magnesium supports healthy blood pressure.","low_causes":"Poor diet, diuretics, alcohol, diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"262","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2857","upper_optimal_position":"0.5238","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced naturally by the body. High levels can cause gout and are associated with kidney stones and cardiovascular risk. Beatrice's uric acid at 262 umol/L is within range and within the optimal band for women.","low_causes":"Low purine diet, kidney disease (rarely)","high_causes":"Gout, kidney disease, high purine diet, obesity, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product of protein metabolism, filtered out by the kidneys. Elevated levels can indicate reduced kidney function or dehydration. Beatrice's urea at 5.8 mmol/L is within range.","low_causes":"Low protein diet, liver disease","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3496","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product of muscle metabolism, filtered by the kidneys at a fairly constant rate. It is used to estimate kidney function. Beatrice's creatinine at 51 umol/L is within range but at the lower end, which is common in women with lower muscle mass. At her BMI with no resistance training, Cystatin C provides a more reliable estimate of kidney function.","low_causes":"Low muscle mass, small body size","high_causes":"Kidney disease, dehydration, high muscle mass, high protein intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated Glomerular Filtration Rate) measures how well the kidneys are filtering waste from the blood. Beatrice's creatinine-based eGFR is greater than 90, which is within the normal range. However, the Cystatin C-based eGFR at 86 provides a more accurate assessment at her body composition.","low_causes":"Kidney disease, dehydration, medications (NSAIDs, ACE inhibitors)","high_causes":"Hyperfiltration (early diabetes)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells in the body, freely filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function in women, older adults, and those with high BMI. Beatrice's Cystatin C at 1.04 mg/L is within the laboratory range of below 1.1 but above the optimal threshold of 0.9, consistent with the Cystatin C eGFR of 86 which is mildly below the ideal threshold of 90.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatin_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min","description":"The Cystatin C eGFR uses the Cystatin C measurement to estimate kidney filtration rate more accurately than creatinine alone. Beatrice's result of 86 ml/min is above the clinically significant threshold of 60 but below the ideal of 90, placing her in the mild Stage 2 range. At 64 with hypertension and frequent NSAID use, this warrants monitoring. NSAIDs in particular can reduce kidney blood flow and should be used with caution.","low_causes":"Kidney disease, ageing, hypertension, NSAID use, dehydration","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"110","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. Every cell in the body depends on haemoglobin to deliver the oxygen it needs for energy production. Beatrice's haemoglobin at 110 g/L is below the female lower limit of 120, confirming she is anaemic. This is very likely contributing to her fatigue and could also be impairing her immune function and exercise tolerance.","low_causes":"Iron deficiency, chronic disease, vitamin B12 or folate deficiency, thalassaemia, bone marrow disorders, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6400","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures how many red blood cells are present per litre of blood. Beatrice's RBC at 4.72 is within range and actually in the upper half. This is notable because despite being anaemic (low haemoglobin), she has plenty of red blood cells. They are simply too small (low MCV) and carrying too little haemoglobin each (low MCH). This pattern of many small, pale cells is characteristic of either iron deficiency or thalassaemia trait.","low_causes":"Anaemia, blood loss, bone marrow failure, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.335","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Beatrice's haematocrit at 0.335 is below the lower limit of 0.36, consistent with her anaemia. Because her red cells are smaller than normal, they take up less space even though their count is adequate.","low_causes":"Anaemia, blood loss, fluid overload","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"70.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1611","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. Beatrice's MCV at 70.9 fL is significantly below the lower limit of 83, indicating her red cells are small (microcytic). The two most common causes of microcytic anaemia are iron deficiency and thalassaemia trait. In a woman of West African heritage, both should be considered and investigated.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"Vitamin B12 deficiency, folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"23.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2593","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin in each red blood cell. Beatrice's MCH at 23.3 pg is below the lower limit of 27, confirming that each red cell is carrying less haemoglobin than it should. This is consistent with the microcytic anaemia picture.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"Vitamin B12 deficiency, folate deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"329","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures the concentration of haemoglobin within the red blood cells. Beatrice's MCHC at 329 g/L is within range, meaning the haemoglobin is at normal concentration within the cells. They are simply smaller than normal.","low_causes":"Severe iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"17.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7194","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"%","description":"RDW (red cell distribution width) measures the variation in size among red blood cells. A high RDW means the bone marrow is producing cells of inconsistent size, which typically happens when iron supply is fluctuating or when there is a mixed population of normal and abnormal cells. Beatrice's RDW at 17.1% is above the upper limit of 14%, which supports active iron deficiency as at least a partial explanation for her anaemia. In pure thalassaemia trait, the RDW is often normal because all the cells are uniformly small. A raised RDW alongside microcytic indices may suggest iron deficiency coexisting with thalassaemia trait, or iron deficiency alone.","low_causes":"","high_causes":"Iron deficiency, mixed nutritional deficiencies, blood transfusion, thalassaemia with coexisting deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"246","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4564","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that help form blood clots to stop bleeding. Beatrice's platelets at 246 are well within range.","low_causes":"Bone marrow disorders, viral infection, liver disease, medications","high_causes":"Iron deficiency (reactive), infection, inflammation, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7556","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5778","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets are younger and more active. Beatrice's MPV at 10.9 fL is above the upper limit of 10.1. A mildly elevated MPV can be a reactive response to anaemia or iron deficiency, as the bone marrow produces larger, more active platelets to compensate. This is not concerning in isolation.","low_causes":"Bone marrow suppression, chronic inflammation","high_causes":"Iron deficiency (reactive), immune thrombocytopenia, bone marrow recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3950","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells (WBCs) are the immune system's defence force. The total count gives an overall picture of immune cell availability. Beatrice's WBC at 4.37 is within the laboratory range of 4 to 10 but sits in the lower quarter. While this is not abnormal, it is below the optimal range and, combined with her frequent illness, suggests her immune system may be running with limited reserves.","low_causes":"Viral infection, bone marrow suppression, autoimmune disease, nutritional deficiency, medications","high_causes":"Infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3613","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infections. They are produced in the bone marrow and released into the blood to patrol for invaders. Beatrice's neutrophils at 2.14 are within range but at the lower boundary. It is worth noting that benign ethnic neutropenia, a harmless constitutional finding where people of African heritage naturally carry lower neutrophil counts, is common and does not impair immune function. However, combined with her frequent illness, the lower-end count may be worth keeping in view.","low_causes":"Benign ethnic neutropenia, viral infection, medications, bone marrow suppression, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4783","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes include T-cells, B-cells, and natural killer cells, forming the adaptive immune system that provides targeted and long-term immunity. Beatrice's lymphocytes at 1.87 are within the optimal range.","low_causes":"Viral infection (HIV), steroid use, immunosuppression, malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5417","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues to become macrophages, where they engulf and destroy pathogens and debris. Beatrice's monocytes at 0.24 are within range.","low_causes":"Bone marrow failure, steroid use","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3812","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Interestingly, despite Beatrice's very elevated IgE (the allergic antibody), her eosinophils are within range and not elevated. This makes an active parasitic infection somewhat less likely but does not exclude it entirely, as IgE can remain elevated from past exposure or from allergic sensitisation.","low_causes":"Steroid use, stress response","high_causes":"Allergic disease, parasitic infection, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic responses and releasing histamine. Beatrice's basophils at 0.03 are within range.","low_causes":"Steroid use, acute infection","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5717","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly released red blood cells. The percentage reflects how actively the bone marrow is producing new red cells. Beatrice's reticulocyte percentage at 1.93% is within range, suggesting her bone marrow is responding appropriately to the anaemia. In severe iron deficiency, the reticulocyte count can be suppressed, so a normal count here is a relatively positive sign.","low_causes":"Iron deficiency (severe), B12/folate deficiency, bone marrow failure, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"91.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6093","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6333","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells being produced. Beatrice's absolute reticulocyte count at 91.1 is within range, confirming adequate bone marrow production.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow failure","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3905","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is a simple marker of systemic inflammation and immune balance. A higher ratio suggests more inflammation-driven immune activity. Beatrice's NLR at 1.14 is within the optimal range, suggesting good immune balance despite the immunoglobulin elevations.","low_causes":"Neutropenia","high_causes":"Infection, inflammation, stress, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"19.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4923","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4735","upper_optimal_position":"0.5814","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals, so it is less reliable than ferritin and transferrin as standalone measures. Beatrice's serum iron at 19.2 umol/L is within range.","low_causes":"Iron deficiency, chronic disease, malabsorption","high_causes":"Haemochromatosis, iron overload, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4862","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4401","upper_optimal_position":"0.5534","units":"ng/ml","description":"Ferritin is the body's iron storage protein. Each ferritin molecule can hold up to 4,500 iron atoms, making it the primary indicator of total iron reserves. Beatrice's ferritin at 139 ng/mL appears healthy and is within the optimal range for women. However, ferritin is also an acute-phase protein that rises during inflammation, chronic disease, and infection. With her elevated immunoglobulins and hs-CRP of 2.9, it is possible that inflammation is inflating her ferritin, masking true iron deficiency beneath a reassuring number. This is why haemoglobin electrophoresis and a soluble transferrin receptor test would help clarify the picture.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Inflammation (acute phase response), iron overload, haemochromatosis, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3026","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the blood to the bone marrow and other tissues. The body increases transferrin production when iron stores are low (trying to capture more iron) and decreases it during inflammation (it is a negative acute-phase protein, meaning it falls when the immune system is active). Beatrice's transferrin at 2.41 g/L is marginally below the lower limit of 2.5. This could reflect the chronic inflammatory state suppressing transferrin production, genuine iron deficiency, or both. It is a subtle but important finding in the context of her anaemia.","low_causes":"Chronic inflammation, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency (compensatory increase), pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"31.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5034","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5225","upper_optimal_position":"0.5631","units":"%","description":"Transferrin saturation measures what percentage of the transferrin protein is carrying iron. It gives an indication of how much of the body's iron transport capacity is being used. Beatrice's transferrin saturation at 31.72% is within the optimal range of 25 to 40%. Despite the microcytic anaemia, the saturation looks adequate, which adds weight to the possibility that thalassaemia trait rather than pure iron deficiency may be contributing to the picture.","low_causes":"Iron deficiency, chronic disease","high_causes":"Iron overload, haemochromatosis, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"56.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4613","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6040","units":"umol/l","description":"TIBC (total iron binding capacity) measures the total capacity of transferrin to bind iron. It rises in iron deficiency as the body tries to capture more iron, and falls in iron overload and chronic inflammation. Beatrice's TIBC at 56.3 umol/L is within range, which is consistent with a mixed picture where inflammation may be dampening what would otherwise be an elevated TIBC in pure iron deficiency.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3613","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.5756","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is released by the pituitary gland to tell the thyroid how much hormone to produce. A high TSH suggests the thyroid is underperforming; a low TSH suggests it is overproducing. Beatrice's TSH at 0.95 mIU/L is within the laboratory range and just below the optimal band of 1.0 to 2.5. This is not concerning and indicates normal thyroid regulation.","low_causes":"Hyperthyroidism, pituitary insufficiency, thyroid medication (excess)","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"13.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3521","lower_normal":"11.5","upper_normal":"22.7","lower function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
