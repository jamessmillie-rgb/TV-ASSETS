, diet, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"APOA","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5681","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA1 (apolipoprotein A1) is the main protein on HDL particles. It reflects the number and functionality of HDL particles in the blood. Higher levels are associated with better cardiovascular protection. Beatrice's ApoA1 of 1.59 is above the desirable threshold of 1.4, consistent with her excellent HDL cholesterol.","low_causes":"Sedentary lifestyle, obesity, metabolic syndrome, smoking","high_causes":"Genetics, regular exercise, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"APOB","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is the protein found on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, measuring ApoB effectively counts the total number of cholesterol-carrying particles that can enter artery walls. Many experts consider ApoB a better predictor of cardiovascular risk than LDL cholesterol alone. Beatrice's ApoB of 1.11 is above the desirable level of 0.9 and above the optimal ceiling of 0.8. A significant portion of her ApoB will be contributed by her very high Lp(a), as each Lp(a) particle also carries one ApoB molecule.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"Genetics, elevated Lp(a), high LDL, high saturated fat diet, hypothyroidism, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"APOR","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective lipoprotein particles. It is considered one of the best single markers of cardiovascular risk. A ratio below 0.6 indicates lower risk for women, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Beatrice's ratio of 0.70 places her in the average-risk category. The ratio is being pushed up by her Lp(a)-driven ApoB, while her strong ApoA1 provides some counterbalance.","low_causes":"High HDL, low LDL, statin therapy, healthy lifestyle","high_causes":"High LDL, elevated Lp(a), low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"LPA","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a genetically determined lipoprotein particle. It is essentially an LDL particle with an extra protein called apolipoprotein(a) attached to it. Lp(a) contributes to cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls like LDL, it has properties that promote blood clotting, and it drives inflammation. The level is entirely determined by genetics, inherited from one or both parents, and cannot be changed by diet, exercise, or currently available medications. A normal level is below 32 nmol/L. Beatrice's Lp(a) is reported as greater than 212.5 nmol/L, placing her in the high-risk category. This is almost certainly a major driver of her persistently elevated cholesterol despite medication. This result should be recorded permanently in her medical records and her first-degree relatives (siblings and children) should be offered testing, as there is approximately a 50% chance they have inherited the same elevated level. There are clinical trials of new medications specifically targeting Lp(a), and her GP or cardiologist may wish to monitor developments in this area.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), cannot be modified by lifestyle or standard medication","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"REMNANT_CHOL","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent risk factor for cardiovascular disease. Beatrice's remnant cholesterol of 0.34 is within the optimal range of below 0.5, reflecting her excellent triglyceride metabolism.","low_causes":"Low triglycerides, healthy metabolic function","high_causes":"High triglycerides, metabolic syndrome, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"TG_HDL_RATIO","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful marker of metabolic health and insulin resistance. A lower ratio indicates better metabolic function. Beatrice's ratio of 0.46 is well below the optimal ceiling of 0.87, indicating excellent metabolic processing of fats despite her BMI of 32.4. This is a genuinely impressive result.","low_causes":"Excellent metabolic health, high HDL, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"HSCRP","name":"hs-CRP","group":"INFLAMMATION","result":"2.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"hs-CRP (high-sensitivity C-reactive protein) is a marker of systemic inflammation produced by the liver. It is used in cardiovascular risk assessment because chronic low-grade inflammation damages artery walls and accelerates plaque formation. A level below 1.0 is optimal, 1.0 to 3.0 indicates intermediate cardiovascular risk, and above 3.0 indicates higher risk. Beatrice's hs-CRP of 2.9 is within the laboratory range of under 5 but above the optimal ceiling of 1.0. At her BMI of 32.4 with elevated immunoglobulins, this level likely reflects a combination of adipose tissue inflammation and chronic immune activation. Weight loss, increased physical activity, omega-3 supplementation, and dietary improvement can all help reduce this.","low_causes":"Low inflammation, healthy weight, statin therapy","high_causes":"Obesity, chronic infection, chronic inflammation, autoimmune disease, cardiovascular disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ESR","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a test tube over one hour. It rises in the presence of inflammation, infection, and autoimmune conditions. Beatrice's ESR of 1 is about as low as it can go, which is reassuring and argues against any active systemic inflammatory or autoimmune process.","low_causes":"Normal finding, polycythaemia","high_causes":"Infection, autoimmune disease, cancer, chronic inflammation, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"NA","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/l","description":"Sodium is a key electrolyte that regulates fluid balance, nerve function, and muscle contraction. Beatrice's sodium of 144 is within the optimal range. Given her hypertension, maintaining appropriate sodium levels through dietary control (limiting processed food and added salt) is important.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CL","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/l","description":"Chloride is an electrolyte that works with sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Beatrice's chloride of 98 is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis, adrenal insufficiency","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"HCO3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4242","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the main buffer in the blood that keeps the pH in the narrow range needed for normal cell function. Beatrice's bicarbonate of 23.2 is within the optimal range, confirming normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CA","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. The body tightly regulates blood calcium levels through parathyroid hormone and vitamin D. Beatrice's calcium of 2.44 is within the optimal range, and her corrected calcium (adjusted for albumin) of 2.57 is also healthy.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CCA","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of the calcium that is actually available in the blood. When albumin is low (as Beatrice's is at 37), total calcium can appear falsely low, so the corrected value is more reliable. Her corrected calcium of 2.57 is within the laboratory range but slightly above the optimal ceiling of 2.55, though this is essentially at the boundary and not a concern. Her PTH is normal, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"MG","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6322","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5149","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar regulation, blood pressure control, and sleep regulation. Beatrice's magnesium of 1.05 sits right at the top of the optimal range, which is an excellent result. This is particularly reassuring given her hypertension (magnesium supports healthy blood pressure) and frequent painkiller use (NSAIDs can affect magnesium levels).","low_causes":"Poor dietary intake, diuretics, alcohol excess, proton pump inhibitors, diarrhoea","high_causes":"Kidney failure, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"UA","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"262","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3248","upper_optimal_position":"0.5190","units":"umol/l","description":"Uric acid is the end product of purine metabolism (purines are found in foods like red meat, organ meats, and certain seafood). High levels can cause gout and are associated with cardiovascular disease and kidney stones. Beatrice's uric acid of 262 is well within the optimal range for women, indicating healthy purine metabolism.","low_causes":"Low purine diet, Wilson's disease, Fanconi syndrome","high_causes":"High purine diet, obesity, kidney disease, gout, metabolic syndrome, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"UREA","name":"Urea","group":"KIDNEY FUNCTION","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product from protein metabolism, filtered by the kidneys and excreted in urine. It reflects both kidney function and protein intake. Beatrice's urea of 5.8 is within the optimal range, indicating healthy kidney filtration and adequate protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CREA","name":"Creatinine","group":"KIDNEY FUNCTION","result":"51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3545","lower_normal":"49","upper_normal":"90","lower_optimal":"53","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3431","upper_optimal_position":"0.5626","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a constant rate. It is used to estimate kidney function (eGFR). Beatrice's creatinine of 51 is at the lower end of the range, which in a woman with relatively low muscle mass (no resistance training) is expected. A low creatinine can make the creatinine-based eGFR appear higher than the true filtration rate, which is why the Cystatin C-based eGFR of 86 gives a more reliable picture.","low_causes":"Low muscle mass, small body size, advanced age","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GFR","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how well the kidneys are filtering waste from the blood. It is calculated from creatinine, age, and sex. A value above 90 is normal, 60 to 89 is mildly reduced, and below 60 warrants further investigation. Beatrice's creatinine-based eGFR is above 90. With her West African ethnicity, the lab notes an adjustment factor of 1.21, which would bring it even higher. However, the Cystatin C-based eGFR of 86 may be a more accurate reflection, as creatinine can underestimate kidney function in people with low muscle mass.","low_causes":"Kidney disease, dehydration, medication effects (NSAIDs, ACE inhibitors), ageing","high_causes":"High muscle mass, pregnancy, hyperfiltration (early diabetes)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cGFR","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"This eGFR is calculated from Cystatin C, a protein produced at a constant rate by all cells and filtered entirely by the kidneys. Unlike creatinine, Cystatin C is not affected by muscle mass, diet, or ethnicity, making it a more reliable measure of true kidney function. Beatrice's Cystatin C eGFR of 86 is above 60 (the threshold for kidney disease) but below the optimal 90. At 64 with hypertension and frequent NSAID use, this is a reasonable result, but it underscores the importance of minimising painkiller use and keeping blood pressure well controlled to protect kidney function over the coming decades.","low_causes":"Kidney disease, ageing, hypertension, chronic NSAID use, diabetes","high_causes":"Normal finding in younger adults","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"CYC","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells in the body and filtered entirely by the kidneys. It is used to calculate the Cystatin C eGFR. Beatrice's Cystatin C of 1.04 is within the laboratory range (under 1.1) but above the optimal level of 0.9. This suggests mild age-related decline in kidney filtration, consistent with the eGFR of 86.","low_causes":"Normal finding, hyperthyroidism","high_causes":"Reduced kidney function, ageing, inflammation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"HBGL","name":"Haemoglobin","group":"HEMATOLOGY","result":"110","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Beatrice's haemoglobin of 110 is below the lower limit of 120 for women, confirming she is mildly anaemic. However, the pattern of her anaemia (small red cells with adequate iron stores) strongly suggests thalassaemia trait rather than iron deficiency, which is common in people of West African heritage. Thalassaemia trait typically produces a mild, stable anaemia that does not cause significant symptoms or require treatment.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, B12/folate deficiency, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"RBC","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"x10/12/l","description":"The red blood cell count measures the total number of red blood cells per litre of blood. Beatrice's RBC of 4.72 is within range and actually towards the upper end. In thalassaemia trait, the body often compensates for the small size of each red cell by producing more of them, resulting in a normal or even high RBC count alongside low haemoglobin. This pattern supports the thalassaemia trait diagnosis.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, thalassaemia trait (compensatory), polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"HCT","name":"Haematocrit","group":"HEMATOLOGY","result":"0.335","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"l/l","description":"Haematocrit measures the proportion of blood volume that is made up of red blood cells. Beatrice's haematocrit of 0.335 is below the lower limit of 0.36, consistent with her mild anaemia. Because her red cells are small (low MCV), they pack together more tightly, and the haematocrit appears low even though her red cell count is normal. This is a typical finding in thalassaemia trait.","low_causes":"Anaemia, thalassaemia trait, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"MCV","name":"MCV","group":"HEMATOLOGY","result":"70.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1657","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6167","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. Beatrice's MCV of 70.9 is significantly below the lower limit of 83, meaning her red blood cells are small (microcytic). This is the hallmark finding of thalassaemia trait, where the body makes a slightly different form of haemoglobin that results in smaller red cells. Iron deficiency also causes low MCV, but her iron stores are adequate, making thalassaemia trait the more likely explanation.","low_causes":"Thalassaemia trait, iron deficiency, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, reticulocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"MCH","name":"MCH","group":"HEMATOLOGY","result":"23.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1940","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin in each red blood cell. Beatrice's MCH of 23.3 is below the lower limit of 27, confirming her red cells are not only small but contain less haemoglobin than expected (hypochromic). This is characteristic of thalassaemia trait and follows directly from the low MCV.","low_causes":"Thalassaemia trait, iron deficiency, chronic disease","high_causes":"B12 or folate deficiency, reticulocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"MCGL","name":"MCHC","group":"HEMATOLOGY","result":"329","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures how concentrated the haemoglobin is within each red blood cell. Unlike MCH (which measures the total amount per cell), MCHC measures the concentration relative to cell size. Beatrice's MCHC of 329 is within range, which is expected in thalassaemia trait where both the cell size and haemoglobin content are reduced proportionally.","low_causes":"Iron deficiency, thalassaemia trait (sometimes)","high_causes":"Spherocytosis, dehydration artefact, cold agglutinins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"RDW","name":"RDW","group":"HEMATOLOGY","result":"17.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8083","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6319","units":"%","description":"RDW (red cell distribution width) measures how much variation there is in the size of red blood cells. A higher number means more variation. Beatrice's RDW of 17.1 is above the upper limit of 14, indicating a mix of different-sized red cells. In thalassaemia trait, this is common because the bone marrow produces cells of varying sizes. RDW is also elevated in iron deficiency and combined nutritional deficiencies. Interestingly, an elevated RDW is also an independent predictor of cardiovascular risk, adding another reason to investigate and confirm the underlying cause.","low_causes":"Normal finding, very uniform red cell production","high_causes":"Iron deficiency, thalassaemia, B12/folate deficiency, mixed nutritional deficiency, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PLTS","name":"Platelets","group":"HEMATOLOGY","result":"246","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4564","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot. Too few increases bleeding risk; too many increases clotting risk. Beatrice's platelet count of 246 is comfortably within the optimal range.","low_causes":"Viral infections, liver disease, bone marrow disorders, autoimmune conditions, medications","high_causes":"Iron deficiency, chronic inflammation, infection, post-splenectomy, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"MPV","name":"MPV","group":"HEMATOLOGY","result":"10.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7556","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets are generally younger and more active. Beatrice's MPV of 10.9 is above the upper limit of 10.1. A mildly elevated MPV is common alongside microcytic anaemia and is not a concern in isolation. It typically reflects the bone marrow producing slightly larger, more active platelets as a compensatory mechanism.","low_causes":"Bone marrow suppression, aplastic anaemia, inflammatory bowel disease","high_causes":"Increased platelet production (compensatory), immune thrombocytopenia, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"WBC","name":"White Cell Count","group":"HEMATOLOGY","result":"4.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3539","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. These cells fight infection and patrol for abnormal cells. Beatrice's WBC of 4.37 is within the laboratory range of 4 to 10 but below the optimal floor of 4.5. Benign ethnic neutropenia, a normal variant common in people of West African heritage where white cell and neutrophil counts run naturally lower, is the most likely explanation. This does not represent immune weakness.","low_causes":"Benign ethnic neutropenia (common in West African heritage), viral infection, bone marrow suppression, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"NLR","name":"NLR (Neutrophil/Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3905","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio (NLR) is a marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, with the optimal range being 1 to 2. Beatrice's NLR of 1.14 is within the optimal range, indicating a healthy balance between her innate immune cells (neutrophils) and adaptive immune cells (lymphocytes). This is reassuring despite the elevated immunoglobulins, as it suggests no active acute infection or severe inflammation.","low_causes":"Benign ethnic neutropenia, autoimmune conditions","high_causes":"Bacterial infection, acute inflammation, physiological stress, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"NEUT","name":"Neutrophils","group":"HEMATOLOGY","result":"2.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3613","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5533","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. They engulf and destroy bacteria. Beatrice's neutrophils of 2.14 are at the lower end of the laboratory range (2 to 7) and below the optimal floor of 2.5. In people of West African heritage, this is very commonly explained by benign ethnic neutropenia, a normal genetic variant where neutrophil counts run 0.5 to 1.0 lower than European reference ranges without any increased infection risk.","low_causes":"Benign ethnic neutropenia (West African heritage), viral infection, medication effects, autoimmune conditions","high_causes":"Bacterial infection, acute inflammation, corticosteroid use, smoking, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"LYMP","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4783","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for the adaptive immune response. They include T cells (which kill infected cells), B cells (which produce antibodies), and natural killer cells. Beatrice's lymphocytes of 1.87 are within the optimal range, indicating a healthy adaptive immune population.","low_causes":"Viral infection (acute), corticosteroid use, autoimmune conditions, HIV","high_causes":"Viral infection (reactive), chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"MONO","name":"Monocytes","group":"HEMATOLOGY","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3417","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that patrol the blood and migrate into tissues where they become macrophages, engulfing debris, pathogens, and dead cells. They also present antigens to T cells, bridging the innate and adaptive immune systems. Beatrice's monocytes of 0.24 are at the lower end of range but within the optimal band.","low_causes":"Bone marrow disorders, corticosteroid use","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"EOSI","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Despite Beatrice's very high IgE (which is also involved in allergic and parasitic responses), her eosinophils are within the low-normal range at 0.09. This is somewhat reassuring and suggests the IgE elevation may be more chronic/allergic in nature rather than indicating an active parasitic infection, though it does not exclude it entirely.","low_causes":"Normal finding, corticosteroid use, acute infection","high_causes":"Allergic disease, parasitic infection, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"BASO","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and are involved in allergic responses and inflammation. They release histamine and other mediators. Beatrice's basophils of 0.03 are within range.","low_causes":"Normal finding, corticosteroid use, acute allergic reaction (consumed)","high_causes":"Allergic disease, chronic inflammation, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"RET","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5220","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"%","description":"Reticulocytes are young red blood cells recently released from the bone marrow. The percentage indicates how actively the marrow is producing new red cells. Beatrice's reticulocyte count of 1.93% is within the optimal range, indicating the bone marrow is producing red cells at an appropriate rate. This is consistent with thalassaemia trait, where the marrow functions normally but the haemoglobin structure limits cell size.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow failure, chronic disease","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"RETA","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"91.096","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5537","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells rather than the percentage. Beatrice's absolute count of 91 is within range, confirming adequate bone marrow red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow failure, chronic disease","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FESA","name":"Transferrin Saturation","group":"IRON STUDIES","result":"31.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4399","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3522","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures what percentage of the iron-carrying protein transferrin is actually loaded with iron. It reflects the balance between iron supply and demand. Beatrice's transferrin saturation of 31.72% is right in the middle of the optimal range (25 to 40%), confirming that iron is being transported effectively despite the mild anaemia.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, haemolytic anaemia, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FE","name":"Serum Iron","group":"IRON STUDIES","result":"19.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4925","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.5813","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates through the day and with meals, so it is best interpreted alongside transferrin saturation and ferritin. Beatrice's serum iron of 19.2 is within the optimal range, further confirming adequate iron availability.","low_causes":"Iron deficiency, chronic disease, inflammation, poor dietary intake","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TRA","name":"Transferrin","group":"IRON STUDIES","result":"2.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3103","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6103","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. The liver produces more transferrin when iron stores are low (to capture more iron) and less when stores are adequate. Beatrice's transferrin of 2.41 is just below the lower limit of 2.5. In the context of adequate iron stores (ferritin 139, saturation 31.7%), this is not a sign of iron deficiency. Transferrin is a negative acute phase reactant, meaning the liver produces less of it during inflammation or immune activation, which may explain the mild reduction given her elevated immunoglobulins and hs-CRP.","low_causes":"Chronic inflammation, chronic infection, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"IBC","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"56.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4525","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3366","upper_optimal_position":"0.6045","units":"umol/l","description":"TIBC (total iron binding capacity) measures the total capacity of transferrin to carry iron. It rises when iron stores are low and falls when they are adequate or high. Beatrice's TIBC of 56.3 is within the optimal range, consistent with her adequate iron stores.","low_causes":"Iron overload, chronic disease, inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FERR","name":"Ferritin","group":"IRON STUDIES","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4866","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.5309","units":"ng/ml","description":"Ferritin is the body's iron storage protein. Each ferritin molecule can hold thousands of iron atoms, and the blood level reflects total body iron stores. Beatrice's ferritin of 139 is within the optimal range for women (40 to 150). This adequate ferritin level, combined with her low MCV and haemoglobin, strongly suggests that her anaemia is not caused by iron deficiency but rather by thalassaemia trait, where the haemoglobin structure is different but iron stores are normal or even elevated.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TSH","name":"TSH","group":"THYROID","result":"0.95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3648","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4795","units":"mIU/l","description":"TSH (thyroid-stimulating hormone) is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. When thyroid hormone levels are low, TSH rises to push the thyroid harder; when they are high, TSH falls. Beatrice's TSH of 0.95 is within the laboratory range but just below the optimal band of 1.0 to 2.5. A TSH below 1.0 can sometimes indicate the thyroid is producing slightly more hormone than ideal, but in Beatrice's case, her FT4 is at the lower end and her FT3 is comfortably mid-range, so this is likely simply her normal set-point. Both thyroid antibody tests are negative.","low_causes":"Subclinical hyperthyroidism, excessive thyroid medication, pituitary dysfunction, non-thyroidal illness","high_causes":"Subclinical or overt hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FT4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"13.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3521","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3558","upper_optimal_position":"0.5893","units":"pmol/l","description":"FT4 (free thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active FT3 by tissues throughout the body. Beatrice's FT4 of 13.6 is within the laboratory range (11.5 to 22.7) but below the optimal floor of 14. While this is only marginally below optimal, it is worth noting that she is converting FT4 to FT3 well (FT3 is 5.1, comfortably mid-range), so the functional thyroid output is adequate.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction, non-thyroidal illness","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis (acute phase)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FT3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4222","upper_optimal_position":"0.6000","units":"pmol/L","description":"FT3 (free triiodothyronine) is the active thyroid hormone that cells actually use. It is produced partly by the thyroid and partly by conversion from FT4 in tissues. Beatrice's FT3 of 5.1 is within the optimal range, confirming that her cells are receiving adequate thyroid hormone. This is the most important thyroid marker for day-to-day function.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, calorie restriction, selenium/zinc deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3-predominant thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies (thyroid peroxidase antibodies) are produced by the immune system when it mistakenly attacks the thyroid gland, a condition called Hashimoto's thyroiditis. Beatrice's TPO antibodies are below 6.6, well within the normal range (under 13.8), which rules out autoimmune thyroid disease.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"THY","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce thyroid hormones. Like TPO antibodies, they indicate autoimmune thyroid disease when elevated. Beatrice's level of 1.3 is well below the threshold of 4.4 (over 80% of the population have undetectable levels), confirming no thyroid autoimmunity.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease, thyroid cancer monitoring interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"VIDC","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1.0","units":"nmol/L","description":"Vitamin D is a hormone that regulates calcium absorption, bone health, immune function, and mood. It is produced in the skin when exposed to sunlight and is also obtained from food and supplements. Beatrice's vitamin D of 54 is just above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. At her BMI of 32.4, fat tissue absorbs and stores vitamin D, reducing the amount available in the blood and meaning she needs a higher supplementation dose to reach optimal levels. Given her joint pain, frequent illness, immune findings, and cardiovascular risk, optimising vitamin D is one of the most straightforward and valuable interventions available.","low_causes":"Limited sun exposure, darker skin pigmentation, obesity (fat sequestration), winter months, malabsorption, ageing","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"B12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"414","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4465","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3723","upper_optimal_position":"0.6230","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. It is found in animal products and its absorption declines with age as stomach acid production decreases. Beatrice's B12 of 414 is within the laboratory range (193 to 982) but below the optimal floor of 500. Given her age, her digestive symptoms, and the fact that B12 deficiency can contribute to fatigue and neurological symptoms, supplementation is recommended.","low_causes":"Poor dietary intake (vegetarian/vegan), age-related malabsorption, pernicious anaemia, metformin use, proton pump inhibitors","high_causes":"Excessive supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FOLA","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA synthesis, and red blood cell production. It works closely with B12. Beatrice's folate of 6 is within the laboratory range (3 to 17) but below the optimal threshold of 8. Low folate can contribute to fatigue and is associated with elevated homocysteine (a cardiovascular risk factor). Given her diet quality rating of 4 out of 10, she is likely not consuming enough leafy green vegetables, legumes, and fortified foods to maintain optimal levels.","low_causes":"Poor dietary intake (low vegetable consumption), alcohol excess, malabsorption, coeliac disease, certain medications","high_causes":"Excessive supplementation, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PTH","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4427","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.6139","units":"pmol/L","description":"PTH (parathyroid hormone) is produced by the four small parathyroid glands behind the thyroid. It regulates blood calcium levels by increasing calcium release from bones, calcium absorption from the gut, and calcium retention by the kidneys. Beatrice's PTH of 2.2 is within the optimal range, confirming normal calcium regulation. Despite her vitamin D being below optimal (vitamin D deficiency can cause PTH to rise as the body tries to maintain calcium), her PTH has not risen, suggesting her vitamin D is adequate to maintain basic calcium regulation even if not optimal for broader health benefits.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CORT","name":"Cortisol","group":"HORMONES","result":"167","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3523","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"145.4","upper_optimal":"450","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5762","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning (helping you wake up) and falling through the day. Beatrice's morning cortisol of 167 is within the expected morning range (145.4 to 619.4), though towards the lower end. Given her sleep restriction (fewer than six hours most nights), a low-normal cortisol could reflect chronic sleep disruption affecting the normal cortisol rhythm. This is not a concern on its own but reinforces the importance of improving sleep duration.","low_causes":"Adrenal insufficiency, chronic stress exhaustion, late sampling time","high_causes":"Acute or chronic stress, Cushing's syndrome, corticosteroid medication, early morning sampling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4830","lower_normal":"0","upper_normal":"118.2","lower_optimal":"0","upper_optimal":"118.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. In premenopausal women it drives the menstrual cycle, but after menopause it falls to low levels as the ovaries stop producing it. Beatrice's oestradiol of 57 is within the expected postmenopausal range (0 to 118.2). This level is consistent with her elevated FSH confirming postmenopausal status.","low_causes":"Menopause, premature ovarian insufficiency, hypothalamic amenorrhoea","high_causes":"HRT, obesity (aromatisation of androgens in fat tissue), ovarian tumour","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"PROG","name":"Progesterone","group":"HORMONES","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2960","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone that supports the second half of the menstrual cycle and pregnancy. After menopause, progesterone falls to very low levels. Beatrice's progesterone of 0.69 is within the expected postmenopausal range (0 to 2.32).","low_causes":"Menopause (expected), anovulation, luteal phase deficiency","high_causes":"Pregnancy, HRT with progesterone, ovarian cyst, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"LH","name":"Luteinising Hormone","group":"HORMONES","result":"26.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3410","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and stimulates the ovaries. After menopause, LH rises because the pituitary sends increasingly strong signals to ovaries that are no longer responding. Beatrice's LH of 26.01 is within the expected postmenopausal range (15.9 to 54).","low_causes":"Pituitary dysfunction, hypothalamic amenorrhoea, hormonal contraceptives","high_causes":"Menopause (expected), premature ovarian insufficiency, PCOS (relative to FSH)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FSH","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"61.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"FSH (follicle-stimulating hormone) is produced by the pituitary gland and stimulates the ovaries to produce eggs and oestrogen. After menopause, FSH rises above 40 because the pituitary is trying to stimulate ovaries that no longer respond. Beatrice's FSH of 61.75 is well within the postmenopausal range (23 to 116.3), confirming she is postmenopausal.","low_causes":"Pituitary dysfunction, hypothalamic amenorrhoea, hormonal contraceptives","high_causes":"Menopause (expected), premature ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TEST","name":"Testosterone","group":"HORMONES","result":"0.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.5619","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands. Although present in much smaller amounts than in men, it plays important roles in maintaining muscle mass, bone density, energy, mood, and libido. Beatrice's testosterone of 0.4 is below the lower limit of 0.5 for women. In postmenopausal women, testosterone production from the ovaries declines significantly. Low testosterone can contribute to fatigue, reduced muscle mass, joint stiffness (due to loss of the anti-inflammatory effect testosterone has on joints), and reduced quality of life. Given her symptoms of joint pain and frequent illness, discussing testosterone replacement with her GP or a menopause specialist may be worthwhile.","low_causes":"Menopause, adrenal insufficiency, pituitary dysfunction, oral oestrogen therapy (raises SHBG)","high_causes":"PCOS, adrenal hyperplasia, androgen-secreting tumour, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FAI","name":"Free Androgen Index","group":"HORMONES","result":"0.76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3622","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3389","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) estimates the proportion of testosterone that is biologically active (not bound r-old. This is consistent with her low testosterone and reflects the natural age-related decline in adrenal androgen production.","low_causes":"Ageing (natural decline), adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal hyperplasia, adrenal tumour, PCOS, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"SHBG","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"52.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4034","lower_normal":"27.8","upper_normal":"146","lower_optimal":"35","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3394","upper_optimal_position":"0.4851","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds testosterone and oestradiol, controlling how much of each is available for tissues to use. Beatrice's SHBG of 52.6 is within the optimal range (35 to 80). With her total testosterone already low at 0.4, her SHBG is binding most of what little testosterone she produces, resulting in the very low free testosterone of 0.006.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS, high androgen levels","high_causes":"Ageing, oestrogen therapy, hyperthyroidism, liver disease, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PROL","name":"Prolactin","group":"HORMONES","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3432","lower_normal":"38","upper_normal":"430","lower_optimal":"38","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6130","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in breast milk production. Outside of pregnancy, elevated prolactin can indicate pituitary issues or m const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
