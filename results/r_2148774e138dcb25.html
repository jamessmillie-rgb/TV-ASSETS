ng":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"30.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7663","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This measures what proportion of total cholesterol is the protective HDL type. At 30.65%, nearly a third of Beatrice's total cholesterol is HDL, which is well above the minimum of 20% and a strong indicator of cardiovascular protection.","low_causes":"Low HDL, obesity, physical inactivity, metabolic syndrome","high_causes":"Regular exercise, healthy weight, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5375","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol types (LDL, VLDL, IDL, and Lp(a)) in a single number. At 4.3, Beatrice is above the target of 4.0. Like LDL, this includes the Lp(a) contribution which is genetically fixed.","low_causes":"Low total cholesterol, high HDL","high_causes":"Elevated LDL, elevated Lp(a), elevated triglycerides, diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5679","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL cholesterol particles. It reflects the functional capacity of the protective HDL system. At 1.59, Beatrice is above the healthy threshold of 1.4, consistent with her excellent HDL cholesterol level.","low_causes":"Low HDL, metabolic syndrome, smoking, physical inactivity","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is a protein found on every LDL, VLDL, IDL, and Lp(a) particle. Because there is exactly one ApoB molecule per particle, measuring ApoB effectively counts the number of atherogenic particles in the blood. Many experts consider it the single best predictor of cardiovascular risk. At 1.11, Beatrice is above the desirable limit of 0.9 and well above the optimal target of 0.8. A significant number of these particles will be Lp(a) particles given her very high Lp(a) level.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Genetic factors, elevated Lp(a), high saturated fat diet, obesity, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful cholesterol particles (ApoB) to the capacity of the protective system (ApoA1). It is one of the best single summary measures of cardiovascular risk. At 0.70, Beatrice is above the female lower-risk threshold of 0.6 and sits in the average risk band (0.6 to 0.8). Her strong ApoA1 of 1.59 is providing meaningful protection, but the high ApoB driven partly by Lp(a) is pushing the ratio above ideal.","low_causes":"Low ApoB, high ApoA1, healthy lipid profile","high_causes":"Elevated ApoB, low ApoA1, genetic factors, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lp(a), pronounced lipoprotein little a, is a genetically inherited form of LDL cholesterol. Unlike regular LDL, Lp(a) levels are determined almost entirely by DNA and cannot be changed by diet, exercise, or standard cholesterol-lowering medications like statins. At above 212.5, Beatrice is in the high-risk category (200 to 400 nmol/L), well above the normal threshold of 32. Lp(a) is harmful because it deposits cholesterol in artery walls like regular LDL, but it also promotes blood clot formation and drives inflammation at the vessel surface. This is the most likely explanation for why her cholesterol has remained persistently elevated despite medication over the years, as a significant portion of her measured LDL is actually Lp(a) that no standard treatment can reduce. This result should be permanently recorded in her medical notes. Her first-degree relatives (children and siblings) should be offered testing. The only drug class shown to reduce Lp(a) (by 20 to 30 percent) is PCSK9 inhibitors, which her GP or a lipid specialist should discuss with her.","low_causes":"Genetic determination (favourable)","high_causes":"Genetic determination (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio divides triglycerides by HDL cholesterol and is a useful marker of metabolic health and insulin resistance. At 0.46, Beatrice's ratio is excellent, well within the optimal threshold of 0.87. This reflects her strong triglycerides and excellent HDL, indicating healthy metabolic processing of dietary fats despite her elevated BMI.","low_causes":"Excellent metabolic health, low triglycerides, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high sugar diet, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles (VLDL and IDL), which are increasingly recognised as independent drivers of cardiovascular risk. At 0.34, Beatrice is well within the optimal range of below 0.5. This is another positive metabolic finding.","low_causes":"Healthy metabolic function, low triglycerides","high_causes":"Elevated triglycerides, insulin resistance, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"2.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"hs-CRP (high-sensitivity C-reactive protein) is a marker of systemic inflammation produced by the liver. It is used to assess both general inflammation and cardiovascular risk. At 2.9, Beatrice is within the laboratory range of below 5 but above the optimal threshold of 1.0 for cardiovascular risk assessment. According to cardiovascular guidelines, a hs-CRP between 1.0 and 3.0 indicates moderate cardiovascular risk, and above 3.0 indicates higher risk. At 2.9, she is at the upper boundary of moderate risk. Given her elevated Lp(a), raised LDL/ApoB, BMI of 32.4, and immune activation, this low-grade inflammation is likely multifactorial. Weight loss, dietary improvement, increased omega-3 intake, and improved sleep would all be expected to lower this.","low_causes":"Low inflammation, healthy weight, active lifestyle","high_causes":"Obesity, chronic infection, autoimmune conditions, metabolic syndrome, cardiovascular disease, recent illness or injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. At 1, Beatrice's ESR is essentially at the floor, which is an excellent result. This effectively rules out significant systemic inflammatory conditions such as vasculitis, polymyalgia rheumatica, or active autoimmune disease. The contrast between the very low ESR and the elevated hs-CRP of 2.9 is interesting: hs-CRP is more sensitive to low-grade metabolic and cardiovascular inflammation (driven by BMI and immune activation), while ESR picks up more severe systemic inflammation.","low_causes":"Low inflammation, healthy state","high_causes":"Infection, autoimmune disease, vasculitis, malignancy, anaemia (usually raises ESR but not in this case)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/L","description":"Sodium is a key electrolyte that regulates fluid balance, blood pressure, and nerve function. At 144, Beatrice is within range and at the top of the optimal band. Given her hypertension, maintaining sodium intake at a moderate level is important.","low_causes":"Diuretics, excessive water intake, heart failure, kidney disease, adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid and electrolyte balance and helps regulate the acid-base status of the blood. At 98, Beatrice is within range and within the optimal band.","low_causes":"Vomiting, diuretics, metabolic alkalosis, Addison's disease","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3636","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's primary acid buffer, helping maintain blood pH within its very narrow safe range. At 23.2, Beatrice is within range and within the optimal band, indicating healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. At 2.44, Beatrice is within range and within the optimal band. Her corrected calcium of 2.57 (adjusted for albumin) is also healthy. Together with a normal PTH of 2.2, this confirms the calcium-regulating system is functioning well.","low_causes":"Vitamin D deficiency, low PTH, kidney disease, magnesium deficiency, malabsorption","high_causes":"Overactive parathyroid, cancer, excessive vitamin D, dehydration, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5917","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration, giving a more accurate picture of true calcium status. At 2.57, Beatrice is within the laboratory range but just above the optimal ceiling of 2.55 by a very small margin. This is not a clinical concern and sits comfortably within the normal band.","low_causes":"Vitamin D deficiency, low PTH, kidney disease, magnesium deficiency","high_causes":"Overactive parathyroid, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6322","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6356","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar regulation, blood pressure control, and sleep quality. At 1.05, Beatrice is right at the top of the optimal range of 0.85 to 1.05. This is an excellent result and is particularly relevant for her hypertension and sleep quality. Supplementing with magnesium glycinate before bed can still be beneficial for sleep despite this healthy serum level, as serum magnesium represents only about 1% of total body magnesium.","low_causes":"Poor dietary intake, alcohol, diuretics, diabetes, malabsorption, proton pump inhibitors","high_causes":"Kidney failure, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"262","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4262","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3190","upper_optimal_position":"0.4524","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in many foods and produced by the body. Elevated levels can cause gout (painful joint inflammation) and are associated with cardiovascular disease and kidney stones. At 262, Beatrice is within range and within the optimal band for women (160 to 320). Given her joint pain, this is a useful negative finding: her joint stiffness is unlikely to be gout-related.","low_causes":"Low purine diet, certain medications, liver disease","high_causes":"High purine diet (red meat, shellfish), alcohol, obesity, kidney disease, dehydration, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered out by the kidneys. At 5.8, Beatrice is within range and within the optimal band, indicating healthy protein metabolism and kidney filtration.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, heart failure, GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3496","lower_normal":"49","upper_normal":"90","lower_optimal":"49","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 51, Beatrice is at the lower end of range. In women with lower muscle mass and at a higher BMI where muscle may be a smaller proportion of body composition, creatinine can underestimate kidney stress, which is why Cystatin C is a more reliable measure.","low_causes":"Low muscle mass, small body size, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how well the kidneys filter waste from the blood. At above 90, Beatrice's creatinine-based eGFR indicates good kidney function. However, the Cystatin C-based eGFR of 86 provides a more accurate picture for her body composition.","low_causes":"Kidney disease, dehydration, certain medications, heart failure","high_causes":"Healthy kidney function, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced at a constant rate by all nucleated cells. Unlike creatinine, its level is not affected by muscle mass, making it a more reliable marker of kidney function in women, older adults, and those with higher BMI. At 1.04, Beatrice is within the laboratory range of below 1.1 but above the optimal threshold of 0.9. This gives a Cystatin C-based eGFR of 86, which is good for a 64-year-old and indicates the kidneys are functioning well, though not quite at the above-90 optimal level. Given her hypertension and regular painkiller use, monitoring kidney function regularly is important.","low_causes":"Very good kidney function","high_causes":"Reduced kidney function, thyroid dysfunction, corticosteroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR uses Cystatin C rather than creatinine to estimate kidney filtration rate. At 86, this is a more accurate reflection of Beatrice's kidney function than the creatinine-based eGFR of above 90. At 64 years old, an eGFR of 86 represents good kidney function with normal age-related decline. Above 60 is the minimum healthy threshold, and above 90 is optimal. Her kidneys are performing well given her age, hypertension, and painkiller use.","low_causes":"Kidney disease, ageing, dehydration, medications, hypertension","high_causes":"Healthy kidney function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"110","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 110, Beatrice is below the lower limit of 120 for women, meaning she is formally anaemic. This is the finding that explains much of her fatigue and may contribute to her frequent illness and joint stiffness, as every tissue in the body depends on oxygen delivery. The pattern of her other red cell markers (low MCV, low MCH, high RDW) points to either iron deficiency or thalassaemia trait as the cause, and her GP needs to investigate with a haemoglobin electrophoresis.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, blood loss, B12/folate deficiency, kidney disease","high_causes":"Dehydration, smoking, polycythaemia, living at high altitude, lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6666666667","units":"x10^12/L","description":"The red blood cell count measures how many red cells are in the blood. At 4.72, Beatrice is within the normal and optimal range. Interestingly, her red cell count is healthy despite being anaemic, which means she has enough red cells but each one is smaller than normal and carrying less haemoglobin. This pattern is characteristic of thalassaemia trait, where the body compensates for small red cells by making more of them, or chronic iron deficiency in its earlier stages before the count drops.","low_causes":"Iron deficiency (advanced), B12/folate deficiency, chronic disease, kidney disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease, thalassaemia trait","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.335","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3083","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.335, Beatrice is below the lower limit of 0.36, consistent with her anaemia. Despite having a normal number of red cells, the cells are smaller than normal (low MCV), so they take up less space, producing a low haematocrit.","low_causes":"Anaemia (any cause), blood loss, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"70.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1578","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"fL","description":"MCV (mean corpuscular volume) measures the average size of each red blood cell. At 70.9, Beatrice's red cells are significantly smaller than normal (range 83 to 101). This is called microcytosis. The two most common causes of microcytic red cells are iron deficiency and thalassaemia trait. Given Beatrice's West African heritage, thalassaemia trait is an important possibility that should be investigated with a haemoglobin electrophoresis.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"23.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1933","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6133","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin in each red blood cell. At 23.3, Beatrice's red cells contain less haemoglobin than they should (range 27 to 32). This is called hypochromia and goes hand in hand with the low MCV. Each red cell is both too small and carrying too little oxygen-transporting haemoglobin, which directly explains why her total haemoglobin is low despite having a normal number of red cells.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, reticulocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"329","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures the average concentration of haemoglobin within each red cell. At 329, Beatrice is within range. The MCHC being normal while MCH is low tells us that the haemoglobin is at a normal concentration within the cell, but the cells themselves are too small, so each cell carries less haemoglobin overall.","low_causes":"Iron deficiency (advanced), thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"17.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8139","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6111","units":"%","description":"RDW (red cell distribution width) measures the variation in size between red blood cells. At 17.1, Beatrice's RDW is significantly above the upper limit of 14, meaning her red cells vary a lot in size. This is called anisocytosis. In iron deficiency, the body produces smaller and smaller cells as iron runs low, creating a mix of older normal-sized cells and newer small cells. In thalassaemia trait, the RDW is often normal or only mildly raised, so a significantly raised RDW may favour iron deficiency as at least part of the picture. Her GP will be able to assess this further with a blood film.","low_causes":"Normal finding, all red cells of similar size","high_causes":"Iron deficiency, B12/folate deficiency, mixed deficiency, thalassaemia (mild elevation), chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"246","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4462","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that enable blood clotting. At 246, Beatrice's platelet count is healthy and mid-range. In iron deficiency anaemia, platelets sometimes rise as the bone marrow is stimulated, but hers remain within the normal band.","low_causes":"Viral infections, liver disease, bone marrow disorders, autoimmune conditions, medications","high_causes":"Iron deficiency (reactive), infection, inflammation, post-surgery, essential thrombocythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"10.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7933","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5778","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. At 10.9, Beatrice is above the upper limit of 10.1. Larger platelets are younger and more active. In the context of iron deficiency anaemia, the bone marrow is under stress and tends to release larger, younger platelets. This is a reactive finding rather than a separate concern and should normalise once the underlying anaemia is addressed.","low_causes":"Bone marrow suppression, chronic inflammation, certain medications","high_causes":"Iron deficiency, bone marrow stimulation, ITP (immune thrombocytopenia), Bernard-Soulier syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3539","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. At 4.37, Beatrice is within the laboratory range but at the lower end and below the optimal band of 4.5 to 8.0. Given that she reports frequent illness, this is worth noting. However, it is important to recognise that WBC counts vary significantly between individuals and throughout the day, and a count of 4.37 is not clinically low. People of West African heritage may naturally have lower baseline neutrophil counts (benign ethnic neutropenia), which can pull the total WBC down without any clinical significance.","low_causes":"Viral infections, benign ethnic neutropenia, bone marrow suppression, autoimmune conditions, medications, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3613","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the front-line immune cells that respond first to bacterial infections. At 2.14, Beatrice is at the lower end of the laboratory range (2.0 to 7.0) but within it. In people of West African descent, neutrophil counts are commonly lower than in European populations due to a benign genetic variation called Duffy-null phenotype, present in about 70% of West Africans. This is called benign ethnic neutropenia and is not associated with increased infection risk. However, given her report of frequent illness, it is still worth having the GP review this in the context of the full immune picture.","low_causes":"Benign ethnic neutropenia (common in West African descent), viral infections, medications, bone marrow suppression, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4783","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are the immune cells responsible for adaptive immunity, including producing antibodies and fighting viral infections. At 1.87, Beatrice is within the optimal range. Interestingly, despite her elevated immunoglobulins suggesting chronic immune activation, her lymphocyte count is healthy rather than elevated, which may suggest the antibody production is driven by a long-standing process rather than an acute response.","low_causes":"Viral infections (acute phase), corticosteroids, autoimmune conditions, HIV, malnutrition","high_causes":"Viral infections, chronic inflammation, lymphoproliferative disorders, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"x10^9/L","description":"Monocytes are immune cells that mature into macrophages in the tissues, where they engulf pathogens and dead cells. At 0.24, Beatrice is within range and at the lower end. This is a normal finding.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic infections, inflammatory conditions, autoimmune disease, recovery phase of infections","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are immune cells involved in allergic responses and parasitic defence. At 0.09, Beatrice is within range. Interestingly, despite her very high IgE of 357 (which is associated with allergic and parasitic responses), her eosinophils are not elevated. This does not rule out an allergic or parasitic cause of the high IgE, but it makes an active parasitic infection somewhat less likely.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergic conditions, parasitic infections, asthma, eczema, drug reactions, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory responses. At 0.03, Beatrice is within range. This is a normal finding.","low_causes":"Normal finding (basophils are normally very low), hyperthyroidism, corticosteroids","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5220","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"%","description":"Reticulocytes are young, newly released red blood cells. The percentage tells us how actively the bone marrow is producing new red cells. At 1.93%, Beatrice is within range. In the context of her anaemia, we might expect the bone marrow to be producing more reticulocytes to compensate, so this relatively normal percentage suggests the bone marrow response may be somewhat blunted, which can be seen in both iron deficiency (if the iron available for new red cells is limited despite stored ferritin) and thalassaemia trait.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow suppression, aplastic anaemia","high_causes":"Active blood loss, haemolytic anaemia, response to B12/iron/folate treatment, bone marrow recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"91.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6073","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red cells in the blood per litre. At 91.1, Beatrice is within the laboratory range but above the optimal ceiling of 85. Given her anaemia, the bone marrow is working to produce new red cells, and this slightly above-optimal count reflects that compensatory effort.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow suppression","high_causes":"Active blood loss, haemolytic anaemia, response to treatment, bone marrow recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil/Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4033","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a calculated marker of systemic inflammation and immune balance. At 1.14, Beatrice is within the optimal range of 1.0 to 2.0. A low NLR is generally favourable and suggests the immune system is not under acute inflammatory stress, which is consistent with her excellent ESR of 1.","low_causes":"Neutropenia, lymphocytosis, good immune balance","high_causes":"Acute infection, systemic inflammation, physiological stress, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"19.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4916","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3800","upper_optimal_position":"0.5822","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and with meals. At 19.2, Beatrice is comfortably mid-range and healthy. This is somewhat reassuring but does not rule out iron-related issues, as serum iron is a snapshot while ferritin and transferrin saturation give a more complete picture.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3128","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. At 2.41, Beatrice is marginally below the lower limit of 2.5. Transferrin is a negative acute-phase protein, meaning it decreases during inflammation. Given her hs-CRP of 2.9 and evidence of chronic immune activation, this mild suppression is likely driven by the inflammatory state rather than indicating a primary problem with iron transport. In iron deficiency, transferrin typically rises (as the body makes more to scavenge limited iron), so the combination of anaemia with normal-to-low transferrin is another reason the GP should investigate whether thalassaemia trait or inflammation is the primary driver.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"31.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5038","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5676","units":"%","description":"Transferrin saturation shows what percentage of the body's iron-carrying capacity is currently filled. At 31.72%, Beatrice is within the optimal range of 25 to 40%. This confirms that there is adequate iron circulating in the blood, which makes the anaemia picture more complex and supports the need for haemoglobin electrophoresis to investigate thalassaemia trait as the cause of the small, pale red cells.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"56.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4614","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3438","upper_optimal_position":"0.6041","units":"umol/L","description":"TIBC (total iron binding capacity) measures the total amount of iron the blood could carry if all the transferrin were fully loaded. At 56.3, Beatrice is within range. In pure iron deficiency, TIBC typically rises as the body increases transferrin production to capture more iron. The fact that it is normal further supports the possibility that the anaemia is not caused by simple iron deficiency.","low_causes":"Chronic inflammation, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5000","units":"ng/mL","description":"Ferritin is the body's main iron storage protein. At 139, Beatrice is within the female optimal range of 40 to 150. This is the result that makes the anaemia picture puzzling: if iron stores are healthy, why are the red cells small and pale? The main possibilities are that the iron is being sequestered by inflammation and not released efficiently to the bone marrow, or that the small red cells are caused by thalassaemia trait rather than iron deficiency. Ferritin is also an acute-phase protein that rises with inflammation, so the true functional iron stores may be somewhat lower than 139 suggests given her hs-CRP of 2.9. However, this is still well above the level where iron deficiency would typically be diagnosed.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian/vegan diet","high_causes":"Inflammation, infection, liver disease, haemochromatosis, iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3649","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5266","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how much thyroid hormone to make. At 0.95, Beatrice is within the laboratory range and just marginally below the optimal band of 1.0 to 2.5. Functionally, this is an excellent result. A low-normal TSH with healthy FT3 and FT4 means the thyroid is producing adequate hormone without being pushed hard. There is no suggestion of thyroid disease.","low_causes":"Hyperthyroidism, excess thyroid medication, early pregnancy, pituitary dysfunction","high_causes":"Hypothyroidism (underactive thyroid), Hashimoto's thyroiditis, iodine deficiency, thyroid medication underdose","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"13.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3522","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3921","upper_optimal_position":"0.5833","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the more active T3 in the tissues. At 13.6, Beatrice is within the laboratory range but below the optimal band of 14 to 20. Given that her TSH is healthy and her T3 is within the optimal range, this suggests the body is efficiently converting the available T4 to T3. This is a pattern worth monitoring over time, but it is not a concern at present.","low_causes":"Hypothyroidism, sick euthyroid syndrome (non-thyroidal illness), pituitary dysfunction","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis (acute phase)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism in every cell. At 5.1, Beatrice is within the optimal range of 4.5 to 6.5. This is a strong result and confirms that the thyroid is producing adequate active hormone. The fact that T3 is optimal despite T4 being at the lower end of range suggests efficient conversion.","low_causes":"Hypothyroidism, sick euthyroid syndrome, low T4 to T3 conversion, selenium deficiency","high_causes":"Hyperthyroidism, excess thyroid medication, T3-dominant thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are immune proteins that attack the thyroid gland. When elevated, they indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At below 6.6, Beatrice's TPO antibodies are well within the normal range of below 13.8. This rules out autoimmune thyroid disease as a cause of any thyroid dysfunction.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies attack thyroglobulin, a protein used by the thyroid to produce hormones. At 1.3, Beatrice is within range and at the level where over 80% of the population sits. This further confirms no autoimmune thyroid disease.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and reducing inflammation. At 54, Beatrice is just above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. At a BMI of 32.4, vitamin D is sequestered in fat tissue, meaning a higher dose is needed to achieve the same blood level compared to a lean person. Given her frequent illness, joint pain, immune activation, and cardiovascular risk, optimising vitamin D is a priority. She should supplement with 3,000 to 4,000 IU of cholecalciferol daily with a fat-containing meal.","low_causes":"Low sun exposure, dark skin pigmentation, high BMI (fat sequesters it), malabsorption, winter months, indoor lifestyle","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4427","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3861","upper_optimal_position":"0.5561","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. At 2.2, Beatrice's PTH is healthy and within the optimal range. Together with her healthy calcium levels, this confirms the calcium-regulating system is working normally. In vitamin D insufficiency, PTH sometimes starts to rise as the body compensates; the fact that it remains normal suggests her vitamin D, while below optimal, has not yet dropped low enough to trigger a compensatory response.","low_causes":"Excess calcium, excess vitamin D, hypoparathyroidism, magnesium deficiency (severe)","high_causes":"Vitamin D deficiency, primary hyperparathyroidism, kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"414","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4039","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4561","upper_optimal_position":"0.6163","units":"pg/mL","description":"Vitamin B12 is essential for red blood cell production, nerve function, DNA synthesis, and energy metabolism. At 414, Beatrice is within the laboratory range but below the optimal threshold of 500. B12 absorption from food naturally declines with age, and her reported digestive symptoms (bloating) may further impair absorption. Given her anaemia, optimising B12 is important as it works alongside iron and folate in red cell production. Sublingual methylcobalamin at 1,000 mcg daily bypasses the gut and ensures reliable absorption.","low_causes":"Age-related decline in absorption, vegetarian/vegan diet, pernicious anaemia, malabsorption, metformin use, low stomach acid","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6666666667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and homocysteine metabolism. At 6, Beatrice is within the laboratory range but below the optimal threshold of 8. Suboptimal folate, combined with below-optimal B12, may be contributing to the anaemia picture alongside the iron or thalassaemia component. Increasing dietary folate through dark green leafy vegetables, lentils, beans, and fortified foods, and supplementing with methylfolate 400 mcg daily, would be beneficial.","low_causes":"Poor dietary intake, malabsorption, alcohol, certain medications (methotrexate, phenytoin), increased demand (pregnancy)","high_causes":"Supplementation, B12 deficiency (folate accumulates when B12 is lacking for processing)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4190","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"U/L","description":"CK (creatine kinase) is an enzyme found in muscles, the heart, and the brain. It rises with muscle damage, intense exercise, or cardiac injury. At 69, Beatrice is comfortably within range, indicating no significant muscle damage or cardiac strain.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, heart attack, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"19.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8088","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgG is the most abundant antibody class in the blood and provides long-term immune memory against infections. It is the antibody that rises after vaccination and past infections. At 19.8, Beatrice is above the upper limit of 16. Elevated IgG can indicate chronic infection, chronic inflammation, autoimmune disease, or liver disease. When multiple immunoglobulin classes are elevated simultaneously (as in Beatrice's case with IgG, IgA, and IgE), it is called a polyclonal elevation and usually reflects chronic immune stimulation rather than a blood cancer. However, a serum protein electrophoresis is needed to confirm this is polyclonal and not monoclonal.","low_causes":"Primary immunodeficiency, nephrotic syndrome, certain medications, protein-losing enteropathy","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease, myeloma (if monoclonal)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"2.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5333","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. It is the early responder before IgG takes over. At 2.9, Beatrice is at the top of the laboratory range (0.5 to 3.0). While within range, it is consistent with the pattern of overall immune activation seen in her other immunoglobulin results.","low_causes":"Primary immunodeficiency, nephrotic syndrome, certain medications","high_causes":"Acute or recent infection, Waldenstrom's macroglobulinaemia, chronic infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"4.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7194","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgA is the antibody class that protects mucosal surfaces, including the gut, respiratory tract, and urinary tract. At 4.5, Beatrice is above the upper limit of 3.5. Elevated IgA is particularly relevant to her digestive symptoms, as it may reflect chronic irritation or inflammation of the gut lining. It can also be raised in liver disease, coeliac disease, and chronic respiratory infections. Her coeliac screen (tTG IgA) is negative, which is reassuring. The elevated IgA should be investigated alongside the other raised immunoglobulins.","low_causes":"IgA deficiency (most common primary immunodeficiency), medications, nephrotic syndrome","high_causes":"Chronic mucosal inflammation (gut, respiratory), liver disease, coeliac disease, chronic infection, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"357","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"IgE is the antibody class associated with allergic responses and defence against parasitic infections. At 357, Beatrice is more than three times the upper limit of 100. This is a significant elevation and could reflect an underlying allergic condition (eczema, asthma, hay fever, food allergies), a parasitic infection, or atopic tendency. Given her West African heritage, her GP may wish to screen for parasitic infection as part of the workup, as this is a well-recognised cause of elevated IgE. If she experiences any skin rashes, nasal congestion, wheezing, or reactions to specific foods, an allergy workup may also be worthwhile.","low_causes":"Normal finding (many people have very low IgE)","high_causes":"Allergic conditions (eczema, asthma, hay fever), parasitic infections, atopic dermatitis, drug reactions, hyper-IgE syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1745","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"The tissue transglutaminase IgA test screens for coeliac disease, an autoimmune condition where the body reacts to gluten and damages the small intestine lining. At 2.51, well below the positive threshold of 8.8 and the equivocal range of 7.2 to 8.8, the result is negative. This effectively rules out coeliac disease as a cause of Beatrice's digestive symptoms, provided she has been eating a gluten-containing diet (which her standard mixed diet confirms). Her elevated IgA does not invalidate this test; in fact, IgA deficiency is the scenario where this test can give false negatives.","low_causes":"Normal finding, no coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"167","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4455","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5825","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning cortisol should be at its highest (the cortisol awakening response). At 167, Beatrice is within the laboratory morning range of 145.4 to 619.4 but below the optimal band of 200 to 500. A lower morning cortisol can sometimes contribute to fatigue and difficulty getting going in the morning. However, cortisol is highly variable and a single measurement has limitations. Poor sleep quality, which Beatrice reports (under six hours most nights), can disrupt the cortisol rhythm.","low_causes":"Adrenal insufficiency, chronic stress (burnout phase), sleep disruption, pituitary dysfunction","high_causes":"Acute stress, Cushing's syndrome, high-dose corticosteroid use, illn // ============================================================

const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}

document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

dob.addEventListener('input',function(){

  this.value=f;
});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
