<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Beatrice Ogbuagu","dob":"11/08/1962","report_date":"2026-09-05","summary":"Beatrice is a 64-year-old female presenting with a BMI of 32.4, following a standard mixed diet rated 4 out of 10 for quality with a volume of 5 out of 10. She trains once per week with cardio and does no resistance training, averaging 2,000 to 5,000 daily steps. She has a diagnosis of hypertension. She reports sleeping fewer than six hours most nights and uses painkillers frequently, such as ibuprofen or paracetamol. She reports frequent illness, joint pain and stiffness, and bloating or digestive discomfort. Her goals are to improve digestion and gut health, improve long-term health and longevity, and prevent disease. She notes that her blood tests have always shown high cholesterol levels even after medication, and she wants to understand why cholesterol keeps recurring, why her blood sugars and blood pressure are elevated, what is causing her frequent illnesses, and what her vitamin and mineral levels look like.\n\nThere are several findings in this report that deserve prompt attention from her GP, and we will work through each of them clearly.\n\nThe most important finding is a pattern in the full blood count that points strongly towards iron deficiency anaemia. Her haemoglobin is 110, below the lower limit of 120 for women, meaning she is formally anaemic. Her MCV, which measures the average size of each red blood cell, is 70.9, well below the lower limit of 83. Her MCH, which measures how much haemoglobin each red cell carries, is 23.3, below the lower limit of 27. Her RDW, which measures the variation in red cell size, is 17.1, above the upper limit of 14. Put together, this is a textbook microcytic hypochromic anaemia with increased size variation, and the single most common cause of that pattern is iron deficiency. What makes this more complex is that her ferritin, the main storage marker for iron, is 139, which is comfortably within range and well above the level where simple iron deficiency would be expected. Her serum iron at 19.2 and her transferrin saturation at 31.7% are both healthy. Her transferrin, the protein that carries iron around the body, is 2.41, just below the lower limit of 2.5, but only marginally so. This creates a puzzle: the red cells look iron-starved, but the iron stores appear adequate. There are a few possible explanations. One is that chronic inflammation is trapping iron in storage so that it is present in the body but not being released efficiently to the bone marrow for red cell production. Her hs-CRP, a sensitive marker of inflammation, is 2.9, which while within the laboratory limit of 5, is above the ideal threshold of 1.0 and does suggest a low-grade inflammatory state. A second possibility is a thalassaemia trait, which is an inherited variation in haemoglobin production that is more common in people of West African heritage. Thalassaemia trait produces exactly this pattern: small red cells, low MCH, raised RDW, but normal or even elevated iron stores. It is not a disease and does not cause illness in the trait form, but it is important to identify because it changes how the anaemia is managed. Her GP should request a haemoglobin electrophoresis to check for this. A third consideration is the frequent painkiller use she reports. Regular ibuprofen can cause slow, invisible blood loss from the stomach lining, which over months can deplete haemoglobin even when iron stores have not yet fallen. The anaemia is directly relevant to several of her reported symptoms. Low haemoglobin means less oxygen reaching the muscles, joints, and immune cells, which could be contributing to her fatigue, her joint stiffness, and her frequent illnesses. This finding should be discussed with her GP as a priority, and a haemoglobin electrophoresis, a blood film, and a reticulocyte haemoglobin content test would help clarify the underlying cause.\n\nHer immune system results are the second area that needs GP involvement, and they connect directly to her concern about frequent illness. Her IgG, which is the main antibody class responsible for long-term immune memory, is 19.8, above the upper limit of 16. Her IgA, which protects the mucosal surfaces of the gut, airways, and urinary tract, is 4.5, above the upper limit of 3.5. Her IgE, which is the antibody class associated with allergic responses and parasitic defence, is 357, more than three times the upper limit of 100. Her globulin, the total protein fraction that includes all immunoglobulins, is 44, above the upper limit of 36, which is consistent with these elevations. This is a polyclonal immunoglobulin elevation, meaning multiple antibody classes are raised rather than just one. This pattern suggests the immune system is chronically activated. Possible drivers include chronic infection, an autoimmune process, chronic inflammation, or an allergic or atopic condition. The very high IgE in particular could reflect an allergic tendency, and given her West African heritage, her GP may wish to consider screening for parasitic infection as a routine part of the workup, as this is a recognised cause of elevated IgE. The combination of raised IgG and IgA alongside frequent illness is somewhat paradoxical: the immune system appears to be working hard, yet she is still getting ill frequently. This can happen when the immune system is busy fighting something chronic and has less reserve for new infections. Her GP should investigate with a serum protein electrophoresis to ensure the elevation is polyclonal rather than monoclonal, as monoclonal elevation at 64 would need haematology review. Her coeliac screen, the tissue transglutaminase IgA test, came back negative, which is reassuring given that raised IgA can sometimes be associated with coeliac disease.\n\nHer cholesterol results help answer her longstanding question about why her levels remain elevated despite medication. Her total cholesterol is 6.2, above the desirable level of 5.18. Her LDL, the form of cholesterol that drives plaque formation in artery walls, is 3.96, above the upper limit of 3.0. Her ApoB, which counts the actual number of cholesterol-carrying particles in the blood and is considered the most accurate single predictor of cardiovascular risk, is 1.11, above the desirable limit of 0.9. Her non-HDL cholesterol is 4.3, above the target of 4.0. These are all elevated and confirm that the atherogenic burden, meaning the amount of cholesterol being deposited into artery walls, is above where it should be. However, there is a critically important finding that explains a large part of why her cholesterol has been persistently elevated despite treatment. Her Lp(a), which stands for lipoprotein(a), is above 212.5, which is in the high-risk category. Lp(a) is a genetically inherited form of LDL cholesterol that the body produces at a fixed rate determined by DNA. It cannot be lowered by diet, exercise, or standard cholesterol-lowering medication such as statins. It is measured in the LDL total on a standard blood test, which means that a significant portion of her elevated LDL is Lp(a) rather than conventional LDL. Lp(a) is particularly harmful because it not only deposits cholesterol in artery walls like regular LDL, but it also promotes blood clotting and drives inflammation at the vessel surface. This is the most likely explanation for why her cholesterol levels have remained stubbornly elevated over the years, and it is information her GP should record permanently in her medical notes. Her first-degree relatives, including children and siblings, should be offered Lp(a) testing because of the inherited nature of this marker. On the positive side, her HDL cholesterol is 1.9, which is excellent and well above the desirable level of 1.55. Her triglycerides are 0.87, which is well within the healthy range and below the optimal threshold of 1.0. Her ApoA1 is 1.59, above the healthy threshold of 1.4. These are genuinely strong protective factors. Her ApoB to ApoA1 ratio is 0.70, which sits in the average risk band. The challenge is that the Lp(a) contribution is adding substantial risk that the good HDL and triglyceride numbers cannot fully offset. Her GP may wish to discuss whether PCSK9 inhibitors, a newer class of medication, could be appropriate, as these are the only drug class that has been shown to reduce Lp(a) levels by approximately 20 to 30 percent.\n\nHer blood sugar results are worth careful interpretation. Her fasting glucose is 5.7, which while within the laboratory limit of 6.0, is at the top of range and above the optimal ceiling of 5.4. Her HbA1c, which reflects average blood sugar over the past two to three months, is 39 mmol/mol. This is within the normal range (below 42), so she is not pre-diabetic by HbA1c criteria. Her insulin is 2.14, which is below the laboratory lower limit of 2.6, and her C-Peptide, which is a more stable measure of how much insulin the pancreas is producing, is 0.324 ug/l (approximately 107 pmol/L), below the lower limit of 1.1 ug/l (364 pmol/L). Her HOMA-IR, which estimates insulin resistance, is 0.54, which is in the insulin-sensitive range. At first glance, low insulin with good insulin sensitivity might seem reassuring, and in a lean, active person on a low-carb diet it often is. However, in Beatrice's case the glucose is sitting at the upper end of range despite very low insulin production, which raises the possibility that the pancreas is not producing quite enough insulin to keep glucose optimally controlled. The lab has noted that C-Peptide can degrade if samples are not separated within four hours, so the C-Peptide result should be interpreted with some caution and ideally repeated on a fresh, promptly processed sample. This does not yet meet any diagnostic threshold for diabetes or pre-diabetes, but the combination of borderline glucose with low insulin output is a pattern her GP should be aware of, and a repeat fasting glucose and C-Peptide in three to six months would be sensible.\n\nTurning to the areas where her body is doing well, there are genuine positives to highlight. Her kidney function is reassuring. Her Cystatin C, which is a more reliable marker of kidney filtration than creatinine alone, especially in women and at higher BMI, gives an eGFR of 86. At 64, this represents good kidney function, and given that she has hypertension and uses painkillers regularly, both of which can stress the kidneys, this is an important positive. Her uric acid at 262 is comfortably within range. Her liver is in good health. Her ALT at 17 is well below the optimal ceiling of 25 for women. Her AST at 21 is mid-range and healthy. Her GGT at 37 is within the laboratory limit of 38, though it sits just below the boundary and above the optimal threshold of 25, which at her BMI and with regular painkiller use is not unexpected. Her FIB-4 score, which screens for liver fibrosis, is 1.33, and at 65-plus the threshold relaxes to 2.0, so this is comfortably reassuring. Her bilirubin, alkaline phosphatase, amylase, and lipase are all within range, indicating no biliary or pancreatic concerns. Her thyroid is functioning well. Her TSH at 0.95 is within the optimal band of 1.0 to 2.5, just marginally below but functionally excellent. Her free T3, the active thyroid hormone, is 5.1, within the optimal range of 4.5 to 6.5. Her free T4 at 13.6 is within the laboratory range but sits below the optimal band of 14 to 20, which is something to watch over time but is not a concern given that her TSH is healthy and her T3 conversion is excellent. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. Her magnesium at 1.05 is within the optimal range of 0.85 to 1.05, sitting right at the top, which is an excellent result and important for blood pressure regulation, sleep quality, and muscle function. Her calcium is healthy with a corrected calcium of 2.57, and her PTH at 2.2 confirms the calcium-regulating system is working normally. Her cortisol at 167 is appropriate for a morning sample. Her oestradiol at 57, progesterone at 0.69, FSH at 61.75, and LH at 26.01 are all consistent with a post-menopausal hormone profile, as expected at 64. Her total antioxidant activity at 1.55 is healthy within range. Her creatine kinase at 69 is mid-range, indicating no muscle damage. Her tumour markers are all reassuring: CA125 at 13.7, CA15-3 at 18, CA19-9 below 1.2, and CEA at 1.43 are all well within their respective limits. Her urinalysis is clean with no protein, no glucose, no blood, no casts, and no nitrites. The bacterial count of 10^5 with heavy mixed growth has been called probable contamination by the laboratory, particularly as the sample was received in a plain bottle without boric acid preservative, and there are no white cells or nitrites to suggest true infection.\n\nHer vitamin D at 54 is classified as sufficient by laboratory standards but is below the optimal range of 75 to 120. At a BMI of 32.4, vitamin D is sequestered in fat tissue, which means she needs a higher supplementation dose than a lean person to achieve the same blood level. Vitamin D is important for immune function, bone health, mood, and inflammation, all of which are relevant to her goals. Her vitamin B12 at 414 is within the laboratory range but below the optimal threshold of 500. Given her digestive symptoms and her age, as B12 absorption from food naturally declines with age, a sublingual supplement would be worthwhile. Her folate at 6 is within range but below the optimal threshold of 8. Folate works closely with B12 in red cell production and homocysteine metabolism, and improving both would support the anaemia picture.\n\nHer testosterone at 0.4 is below the lower limit of 0.5 for women. While testosterone is often thought of as a male hormone, it plays important roles in women including supporting energy, muscle maintenance, joint health, bone density, and libido. At 64 and post-menopausal, some decline is expected, but being below range may be contributing to her joint stiffness and fatigue. Her SHBG at 52.6 is mid-range, and her free androgen index at 0.76 is within range, suggesting the low testosterone is a production issue rather than excessive binding. This is worth discussing with her GP, particularly if she is seeing a menopause specialist.\n\nHer ESR at 1 is excellent and essentially rules out any significant systemic inflammatory condition such as vasculitis or active autoimmune disease, which is reassuring given the immune findings. Her MPV at 10.9 is above the upper limit of 10.1. MPV measures the average size of platelets, and mildly elevated MPV can be seen with iron deficiency anaemia as the bone marrow produces larger, younger platelets in response to the anaemic drive. This finding is likely secondary to the anaemia rather than a separate concern.\n\nIn summary, Beatrice's report reveals four key areas for her GP: an anaemia that needs characterisation with haemoglobin electrophoresis and a blood film, a polyclonal immunoglobulin elevation that needs a serum protein electrophoresis, a very high Lp(a) that explains her persistently elevated cholesterol and should be permanently recorded, and a borderline blood sugar pattern with low insulin production that warrants monitoring. Alongside these, there are clear nutritional targets in vitamin D, B12, and folate that can be addressed immediately, and her digestion, immune resilience, and energy levels may all benefit from the dietary and lifestyle changes outlined below.","links":"Beatrice has asked specifically about why her cholesterol remains elevated, why her blood sugars and blood pressure are high, what is causing her frequent illnesses, and what her vitamin and mineral levels look like. This section addresses each of those questions with practical next steps.\n\nThe cholesterol question has a clear answer from this report: her Lp(a) is above 212.5 nmol/L, which is a genetically inherited form of LDL cholesterol that does not respond to diet, exercise, or standard statin therapy. This means that a significant portion of what has been measured as elevated LDL over the years is actually Lp(a), which no lifestyle change or conventional medication can reduce. She should bring this result to her GP and ask for it to be recorded permanently in her medical notes. She should also discuss whether a referral to a lipid clinic would be appropriate, as they may consider PCSK9 inhibitor therapy, the only current drug class shown to lower Lp(a) by 20 to 30 percent. Her first-degree relatives, including any children and siblings, should be offered Lp(a) testing. Beyond the Lp(a), the modifiable portion of her LDL and ApoB can still be improved through dietary changes. She should aim to include at least two portions of oily fish per week (salmon, mackerel, sardines), increase soluble fibre intake through oats, beans, lentils, and ground flaxseed, and reduce saturated fat from processed meats, full-fat dairy, and fried foods. Her triglycerides and HDL are already excellent, which means she has strong metabolic foundations to build on.\n\nFor her blood sugar concern, the current picture is not pre-diabetic, but the glucose at 5.7 with very low insulin production is a pattern that should be monitored. The single most effective action she can take is to improve her diet quality from its current rating of 4 out of 10. Specifically, she should reduce refined carbohydrates such as white bread, white rice, sugary drinks, and processed snacks, and replace them with whole grains, vegetables, legumes, and protein-rich foods at every meal. Walking after meals for even 10 to 15 minutes has been shown to meaningfully reduce post-meal blood sugar spikes. She should aim for a repeat fasting glucose, HbA1c, insulin, and C-Peptide in three to six months, with the C-Peptide sample promptly processed to avoid the degradation issue noted by the lab.\n\nFor her frequent illness concern, the report shows that her immune system is actually very active, with raised IgG, IgA, and IgE, but it appears to be chronically stimulated rather than weak. The GP should investigate what is driving this chronic activation with a serum protein electrophoresis and, given her heritage, consider screening for parasitic infection. The raised IgE at 357 may also point to an allergic component, and if she has any nasal congestion, skin rashes, or breathing difficulties, these should be mentioned to the GP. Improving her sleep from below six hours to seven to eight hours per night is one of the most powerful changes she can make for immune resilience. Sleep restriction suppresses natural killer cell activity and antibody responses within a single week. Practical steps include setting a fixed wake time seven days a week, getting outside within an hour of waking for natural light exposure, cutting caffeine after midday, keeping the bedroom cool (16 to 18 degrees), and avoiding screens for 30 minutes before bed.\n\nFor the anaemia, her GP needs to request a haemoglobin electrophoresis to check for thalassaemia trait, a blood film to examine the red cell morphology, and potentially a reticulocyte haemoglobin content test. She should also discuss her frequent painkiller use with the GP, as regular ibuprofen can cause occult gastrointestinal blood loss. If the anaemia is confirmed as iron-responsive (and not thalassaemia trait), iron supplementation in the form of ferrous bisglycinate 25mg every other day with vitamin C would be appropriate, but this should wait until the cause is clarified because supplementing iron in thalassaemia trait is not helpful and could lead to iron overload given her ferritin is already 139.\n\nFor her digestion and gut health goal, several findings are relevant. The raised IgA at 4.5 specifically protects mucosal surfaces including the gut lining, and its elevation may reflect chronic gut inflammation or irritation. Her coeliac screen is negative, which rules out that specific cause. Improving diet quality from 4 to at least 6 or 7 out of 10 is the foundation: more vegetables, more fibre-rich foods, more fermented foods such as natural yoghurt, kefir, sauerkraut, and kimchi, and fewer processed foods. Eating slowly, chewing thoroughly, and eating regular meals rather than grazing can help with bloating. If bloating persists despite dietary improvement, a food diary and potential referral for SIBO (small intestinal bacterial overgrowth) testing through the GP would be reasonable.\n\nFor calorie and protein targets, at 81kg, 158cm, 64 years old, and lightly active (one cardio session plus 2,000 to 5,000 steps), her estimated maintenance calories are approximately 1,750 to 1,850 per day. For gradual fat loss of 0.25 to 0.5kg per week, a target of 1,450 to 1,600 calories per day would be appropriate. Her protein intake should be at least 1.0 to 1.3g per kilogram of bodyweight, which means 81 to 105g of protein per day. This is particularly important given the anaemia, the low testosterone, and her joint symptoms, as adequate protein supports red blood cell production, muscle and joint tissue maintenance, and immune function. A realistic initial weight target would be 72 to 76kg, which would bring her BMI into the 29 to 30 range and meaningfully reduce the cardiovascular risk amplified by her Lp(a).\n\nIncreasing her physical activity would deliver large benefits across nearly every finding in this report. Adding even one resistance training session per week would support bone density (critical post-menopause), improve insulin sensitivity, support joint health through stronger supporting muscles, and help with weight management. Increasing her daily steps from the current 2,000 to 5,000 range towards 7,000 to 8,000 would improve cardiovascular health, blood sugar control, and energy levels. Walking is low-impact and joint-friendly, making it ideal given her joint stiffness.","flags":"GP-URGENT ITEMS:\n\n1. Microcytic hypochromic anaemia with normal iron stores: Haemoglobin 110 (range 120-150), MCV 70.9 (range 83-101), MCH 23.3 (range 27-32), RDW 17.1% (range 11.6-14.0), ferritin 139 (range 10-291). The anaemia pattern is consistent with iron deficiency or thalassaemia trait. Given West African heritage, haemoglobin electrophoresis is recommended to exclude thalassaemia trait. Blood film review and reticulocyte haemoglobin content would help clarify. Regular ibuprofen use raises the possibility of occult GI blood loss. HCT low at 0.335 (range 0.36-0.46), consistent with anaemia.\n\n2. Polyclonal immunoglobulin elevation: IgG 19.8 (range 6.5-16.0), IgA 4.5 (range 0.4-3.5), IgE 357 (range <100), globulin 44 (range 18-36). Multiple immunoglobulin classes elevated, suggesting chronic immune stimulation. Serum protein electrophoresis recommended to confirm polyclonal pattern and exclude monoclonal gammopathy. Given West African heritage and very high IgE, parasitic infection screening should be considered. Coeliac screen (tTG IgA) negative.\n\n3. Lp(a) >212.5 nmol/L (target <32): High-risk category. Genetically determined, not modifiable by diet or statins. Explains persistently elevated LDL despite treatment. Should be permanently recorded. First-degree relatives should be tested. Consider lipid clinic referral and discussion of PCSK9 inhibitor therapy.\n\n4. Elevated LDL and ApoB: LDL 3.96 (range 0.5-3.0), ApoB 1.11 (target <0.9), non-HDL 4.3 (target <4.0), ApoB/A1 ratio 0.70 (target <0.6), total cholesterol 6.2 (desirable <5.18). Significantly elevated atherogenic burden, amplified by very high Lp(a). HDL 1.9 and triglycerides 0.87 are protective. ApoA1 1.59 is healthy.\n\n5. Low insulin and C-Peptide with borderline glucose: Insulin 2.14 (range 2.6-24.9), C-Peptide 0.324 ug/L (range 1.1-4.4), fasting glucose 5.7 (range 3.5-6.0), HbA1c 39 mmol/mol (normal <42). HOMA-IR 0.54 indicates insulin sensitivity. However, low insulin production with glucose at the upper end of range raises the possibility of early beta-cell insufficiency. Lab notes C-Peptide may degrade if not promptly separated. Recommend repeat fasting glucose, insulin, and C-Peptide on a fresh, promptly processed sample in 3-6 months.\n\nOTHER FLAGS:\n\n6. Testosterone 0.4 nmol/L (range 0.5-2.6): Below range for a post-menopausal female. May contribute to fatigue, joint stiffness, and reduced muscle mass. Worth discussing with GP or menopause specialist.\n\n7. Transferrin 2.41 g/L (range 2.5-3.8): Marginally below range. Transferrin is a negative acute-phase protein and may be suppressed by chronic inflammation (hs-CRP 2.9). Not significantly low.\n\n8. hs-CRP 2.9 mg/L (target <1.0): Within laboratory range (<5) but above the optimal threshold of 1.0 for cardiovascular risk. Indicates low-grade systemic inflammation. Relevant in the context of anaemia, immune activation, elevated Lp(a), and BMI 32.4.\n\n9. Vitamin D 54 nmol/L: Sufficient by laboratory criteria but below optimal range of 75-120. Supplementation recommended, especially given BMI 32.4 (fat sequesters vitamin D) and immune and bone health concerns.\n\n10. MPV 10.9 fL (range 7.1-10.1): Mildly elevated. Likely reactive to anaemia as bone marrow produces larger platelets in response.\n\n11. Urine culture: Heavy mixed growth, probable contamination per laboratory. Plain bottle received without boric acid. No WBCs, no nitrites. Clinical significance low but note for repeat if urinary symptoms develop.\n\nREASSURING NEGATIVES: Kidney function preserved (Cystatin C eGFR 86). Liver enzymes clean (ALT 17, AST 21, GGT 37). FIB-4 1.33, well below the age-adjusted threshold of 2.0. Thyroid function normal with negative antibodies. Tumour markers all within range (CA125 13.7, CA15-3 18, CA19-9 <1.2, CEA 1.43). Coeliac screen negative. Urinalysis clean. ESR 1, effectively ruling out active systemic inflammatory disease. HOMA-IR 0.54 indicating insulin sensitivity. Electrolytes balanced.","recommendations":"1. GP appointment to discuss anaemia: bring this report and request haemoglobin electrophoresis, blood film review, and reticulocyte haemoglobin content. Discuss regular ibuprofen use and the possibility of occult gastrointestinal blood loss. Consider switching to paracetamol as the primary painkiller or discuss gastroprotection if ibuprofen must continue.\n\n2. GP appointment to discuss immunoglobulin elevation: request serum protein electrophoresis to confirm polyclonal pattern. Discuss parasitic infection screening given heritage and very high IgE. Discuss potential allergic workup if there are any respiratory, skin, or nasal symptoms.\n\n3. Record Lp(a) >212.5 nmol/L permanently in medical notes. Discuss referral to a lipid clinic. Test first-degree relatives for Lp(a).\n\n4. Repeat fasting glucose, insulin, C-Peptide, and HbA1c in 3 to 6 months on a promptly processed sample to clarify the beta-cell function picture.\n\n5. Improve diet quality from 4/10 towards 7/10: prioritise vegetables, oily fish twice weekly, legumes, whole grains, lean protein at every meal. Reduce processed foods, refined carbohydrates, and saturated fat.\n\n6. Increase daily steps towards 7,000 to 8,000. Add one resistance training session per week, even bodyweight exercises at home.\n\n7. Prioritise sleep: aim for 7 to 8 hours per night. Fixed wake time, morning daylight exposure, caffeine cut-off at midday, cool bedroom, no screens 30 minutes before bed.\n\n8. Begin vitamin D3 supplementation at 3,000 to 4,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 at 100 to 200 mcg.\n\n9. Begin sublingual methylcobalamin B12 at 1,000 mcg daily.\n\n10. Increase dietary folate through dark green leafy vegetables, or supplement with methylfolate 400 mcg daily.\n\n11. Calorie target: 1,450 to 1,600 per day for gradual fat loss. Protein target: 81 to 105g per day. Initial weight target: 72 to 76kg.\n\n12. Do NOT begin iron supplementation until the cause of anaemia has been clarified by the GP. Iron supplementation in thalassaemia trait with ferritin already at 139 could lead to iron overload.\n\n13. Retest in 3 to 6 months: full blood count, ferritin, iron studies, fasting glucose, insulin, C-Peptide, HbA1c, vitamin D, B12, folate, lipid panel, immunoglobulins, hs-CRP.","supplementation":"DO NOT take iron supplements until the cause of the anaemia has been clarified by the GP. Beatrice's ferritin is already 139, which is well within range, and if the anaemia is caused by thalassaemia trait rather than iron deficiency, adding iron would risk iron overload. Iron supplementation should only begin if the GP confirms iron-responsive anaemia after haemoglobin electrophoresis results.\n\nVitamin D3 (cholecalciferol): 3,000 to 4,000 IU daily, taken with the largest fat-containing meal of the day. Her current level of 54 nmol/L is below the optimal range of 75 to 120, and at a BMI of 32.4, a higher dose is needed because fat tissue absorbs and holds onto vitamin D, making less available in the bloodstream. Vitamin D supports immune function, bone density (especially important post-menopause), mood, and helps regulate inflammation, all of which are directly relevant to her goals and symptoms. She should pair this with Vitamin K2 in the MK-7 form at 100 to 200 mcg daily, taken at the same time. Vitamin K2 directs calcium into bones rather than allowing it to deposit in artery walls, which is particularly important given her cardiovascular risk profile.\n\nVitamin B12 as sublingual methylcobalamin: 1,000 mcg daily, dissolved under the tongue. Her B12 at 414 is within the laboratory range but below the optimal level of 500. Sublingual delivery bypasses the digestive system, which is important because B12 absorption from the gut naturally declines with age, and her reported digestive symptoms suggest absorption may not be optimal. B12 supports red blood cell production (relevant to her anaemia), nerve function, energy metabolism, and works with folate to keep homocysteine in check.\n\nMethylfolate: 400 mcg daily. Her folate at 6 is below the optimal threshold of 8. Folate works alongside B12 in red blood cell production and DNA synthesis. The methylfolate form is pre-activated and does not require conversion by the MTHFR enzyme, which a proportion of the population has reduced capacity for. She should also increase dietary folate through dark green leafy vegetables, lentils, and fortified foods.\n\nOmega-3 fish oil: 2 to 3g of combined EPA and DHA daily, taken with food. This supports cardiovascular health by mildly reducing triglycerides (hers are already good, but the anti-inflammatory benefit is the primary reason here), reducing inflammation (her hs-CRP is 2.9), and supporting joint health given her joint pain and stiffness. Choose a product that specifies EPA and DHA content on the label rather than just total fish oil weight.\n\nMagnesium glycinate: 300 to 400mg before bed. Although her serum magnesium at 1.05 is at the top of the optimal range, magnesium glycinate specifically supports sleep quality, which is a priority given her sleep restriction below six hours. The glycinate form is well absorbed and has a calming effect. It also supports blood pressure regulation, which is relevant given her hypertension, and muscle and joint comfort.\n\nThe most important changes from this report are not supplements. They are clarifying the cause of the anaemia with the GP, investigating the immune activation, recording the Lp(a) finding permanently, improving diet quality from 4 to 7 out of 10 with more vegetables and oily fish and less processed food, increasing daily movement, and extending sleep towards seven to eight hours per night. These changes will have a greater impact on her long-term health, her immune resilience, her digestion, and her cardiovascular risk than any supplement can provide.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5600","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. At 5.7, Beatrice's result is within the laboratory range but sits above the optimal ceiling of 5.4. In combination with very low insulin production, this suggests the pancreas may be working at or near its capacity to keep blood sugar controlled. Maintaining glucose below 5.4 through dietary changes and activity would reduce long-term risk of type 2 diabetes and cardiovascular disease.","low_causes":"Prolonged fasting, excessive insulin production, certain medications, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, high carbohydrate diet, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4750","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4500","units":"%","description":"HbA1c expressed as a percentage reflects the proportion of haemoglobin in the blood that has been glycated, meaning coated with sugar, over the past two to three months. At 5.7%, Beatrice is within the normal range (below 6.0%) but above the threshold where pre-diabetes begins to be considered. This corresponds to her HbA1c of 39 mmol/mol. It is not a diabetic result, but combined with her borderline glucose, it warrants monitoring.","low_causes":"Low average blood sugar, anaemia (can falsely lower), blood loss","high_causes":"Elevated average blood sugar, pre-diabetes, diabetes, iron deficiency (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the standard unit for measuring glycated haemoglobin. At 39, Beatrice is within the normal range (below 42) and not in the pre-diabetic zone (42 to 47). However, she is above the optimal threshold of 36 mmol/mol. It is worth noting that iron deficiency anaemia, which is present in this report, can falsely elevate HbA1c because the red cells live longer when they are smaller, accumulating more sugar coating. The true average blood sugar may therefore be slightly lower than this reading suggests.","low_causes":"Low average blood sugar, conditions that shorten red cell lifespan","high_causes":"Elevated average blood sugar, pre-diabetes, diabetes, iron deficiency anaemia (falsely elevates)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2371","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5754","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas releases to control blood sugar between meals. At 2.14, Beatrice's insulin is below the laboratory lower limit of 2.6. In a lean, active person eating low-carb, this would often simply reflect low insulin demand. However, in Beatrice's case, with a BMI of 32.4 and a glucose of 5.7 sitting at the upper end of range, this low insulin level raises the possibility that the pancreas may not be producing quite enough insulin to meet demand. This should be monitored with a repeat test in three to six months.","low_causes":"Low carbohydrate diet, high insulin sensitivity, early beta-cell dysfunction, type 1 diabetes (progressive)","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes (early stage), high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"107.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1588","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"1456.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"pmol/L","description":"C-Peptide is a byproduct of insulin production. Every time the pancreas makes one molecule of insulin, it also makes one molecule of C-Peptide, making it a reliable marker of how much insulin the pancreas is actually producing. At 107.2 pmol/L (converted from 0.324 ug/L), Beatrice's C-Peptide is significantly below the lower limit of 364 pmol/L. This is consistent with her low insulin and suggests reduced pancreatic insulin output. The laboratory has noted that C-Peptide can degrade by up to 56% if the sample is not separated within four hours, so this result should be confirmed on a fresh, promptly processed sample before drawing firm conclusions.","low_causes":"Low carbohydrate diet, sample degradation, early beta-cell dysfunction, type 1 diabetes (progressive), high insulin sensitivity","high_causes":"Insulin resistance, type 2 diabetes (early), insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) estimates how resistant the body's cells are to insulin. It is calculated from fasting glucose and fasting insulin. At 0.54, Beatrice is in the insulin-sensitive range, which is the favourable direction. A value below 1.0 means the body's cells are responding well to insulin. While this is genuinely positive, it must be read alongside the very low insulin and C-Peptide: the ratio is favourable partly because the insulin level itself is very low.","low_causes":"High insulin sensitivity, low carbohydrate diet, very low insulin production","high_causes":"Insulin resistance, metabolic syndrome, obesity, high sugar/carbohydrate diet, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"19.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1694","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the insulin-producing beta cells of the pancreas are working. It is calculated as (20 x insulin) / (glucose - 3.5). At 19.5, Beatrice's result is well below the lower limit of 80, suggesting that the beta cells are producing less insulin than expected for her blood sugar level. This is a calculated marker and relies on the accuracy of the insulin and glucose measurements. Given the potential for C-Peptide degradation noted by the lab, which would also affect the overall picture of pancreatic output, this should be confirmed on a repeat test.","low_causes":"Low carbohydrate diet, beta-cell dysfunction, late-onset autoimmune diabetes (LADA), sample issues","high_causes":"Insulin resistance driving compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1518","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found mainly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so elevated levels suggest liver stress. At 17, Beatrice's ALT is well within the laboratory range and comfortably below the optimal threshold of 25 for women. This indicates the liver is not under metabolic strain, which is a genuinely positive finding given her BMI of 32.4 and regular painkiller use.","low_causes":"Normal finding, very low muscle mass","high_causes":"Fatty liver disease, alcohol, medications, viral hepatitis, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. At 21, Beatrice's AST is healthy and mid-range, further confirming that the liver is in good condition.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart disease, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4868","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5390","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol use, bile duct issues, and metabolic stress. At 37, Beatrice is within the female laboratory range of 4 to 38 but above the optimal threshold of 25. At her BMI of 32.4 and with regular painkiller use, this mild elevation is not unexpected. It is worth monitoring but not a cause for concern given that her other liver markers are clean.","low_causes":"Normal finding, hypothyroidism","high_causes":"Alcohol use, fatty liver, medications (particularly painkillers), bile duct issues, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5190","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, and bile ducts. It rises with bile duct obstruction, bone disorders, and certain liver conditions. At 85, Beatrice's result is comfortably mid-range and healthy.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, Paget's disease, vitamin D deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes bilirubin for excretion. At 7, Beatrice's bilirubin is healthy and at the lower end of range, indicating normal red cell turnover and liver processing.","low_causes":"Normal finding","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6293","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3453","upper_optimal_position":"0.6133","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 81, Beatrice is at the top of the laboratory range (57 to 82). This is being driven by her elevated globulin at 44, as her albumin at 37 is within range. The high total protein is a reflection of the immune system overactivity seen in her immunoglobulin results.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, immune system activation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3542","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6666666667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and maintains fluid balance. At 37, Beatrice is within the laboratory range but below the optimal band of 40 to 50. Albumin can be mildly suppressed by chronic inflammation, which is consistent with her hs-CRP of 2.9 and immune activation. Adequate protein intake (81 to 105g per day) and reducing inflammation may help improve this.","low_causes":"Chronic inflammation, liver disease, malnutrition, kidney disease (nephrotic syndrome)","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8148","lower_normal":"18","upper_normal":"36","lower_optimal":"18","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"Globulin is the protein fraction that includes immunoglobulins (antibodies) and other immune and transport proteins. At 44, Beatrice's globulin is significantly above the upper limit of 36. This is being driven by her elevated IgG (19.8), IgA (4.5), and IgE (357), indicating that the immune system is chronically overactive. The GP should investigate the cause of this polyclonal elevation with a serum protein electrophoresis.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, allergic conditions, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"0.84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2381","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"The albumin to globulin ratio divides albumin by globulin to assess the balance between these two protein groups. At 0.84, Beatrice's ratio is below the lower limit of 1.1, driven by the combination of mildly low albumin (37) and elevated globulin (44). This is consistent with chronic immune activation and inflammation. As the underlying cause of the immunoglobulin elevation is identified and addressed, this ratio should normalise.","low_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease, myeloma","high_causes":"Immune deficiency, nephrotic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4586","lower_normal":"0","upper_normal":"2.0","lower_optimal":"0","upper_optimal":"1.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3625","units":"","description":"FIB-4 is a calculated score that screens for liver fibrosis (scarring) using age, ALT, AST, and platelet count. At 1.33, the score is within the age-adjusted reassuring range. For patients over 65, the threshold relaxes to 2.0, and Beatrice is well within this. With clean ALT (17) and AST (21) and healthy platelets (246), there is no suggestion of significant liver fibrosis.","low_causes":"Young age, healthy liver","high_causes":"Liver fibrosis, age (calculation includes age), low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"111","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5379","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands to digest starch. Elevated levels can indicate pancreatic inflammation (pancreatitis). At 111, Beatrice is within range, indicating normal pancreatic function.","low_causes":"Chronic pancreatitis (burnt-out), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. It is more specific to the pancreas than amylase. At 53, Beatrice is within range, confirming healthy pancreatic function. This is relevant given her digestive symptoms, as it helps rule out pancreatic causes of bloating.","low_causes":"Chronic pancreatitis (burnt-out)","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5985","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all cholesterol in the blood, including protective HDL and harmful LDL and VLDL. At 6.2, Beatrice is above the desirable level of 5.18. However, total cholesterol alone is a crude measure. Her HDL at 1.9 is contributing substantially to the total, and the more important question is what the LDL and ApoB levels are, which are addressed below.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2559","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat stored in the body and transported in the blood. Elevated levels are a risk factor for cardiovascular disease and are closely linked to diet, especially sugar and refined carbohydrate intake. At 0.87, Beatrice's triglycerides are excellent, well within the optimal threshold of 1.0. This is a genuinely strong metabolic marker.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar/carbohydrate diet, alcohol, obesity, insulin resistance, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2564","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. At 0.4, Beatrice is within the optimal range. VLDL is closely linked to triglyceride levels, and the excellent triglyceride result is reflected here.","low_causes":"Low triglyceride levels, low fat diet","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6118","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. Higher is better. At 1.9, Beatrice's HDL is excellent, well above both the desirable threshold of 1.55 and the optimal threshold of 1.6 for women. This provides meaningful cardiovascular protection and is a genuine positive given her other lipid findings.","low_causes":"Physical inactivity, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol use, genetic factors, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the form of cholesterol that deposits in artery walls and drives atherosclerosis (plaque build-up). At 3.96, Beatrice is above the upper limit of 3.0 and well above the optimal target of 2.6. Critically, a significant portion of this measured LDL is actually Lp(a), an inherited form that does not respond to standard treatment. The modifiable portion can be reduced through dietary changes including increased soluble fibre, oily fish, and reduced saturated fat intake.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic factors (including Lp(a)), hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3622","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL cholesterol and is a useful summary of cardiovascular risk. At 3.26, Beatrice is well within the desirable limit of 4.5 and within the optimal range, demonstrating that her excellent HDL is substantially offsetting the elevated total cholesterol.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","paddi
