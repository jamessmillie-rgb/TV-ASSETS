<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Khalid Chauhry","dob":"07/09/1968","report_date":"2026-09-04","summary":"Khalid is a 57-year-old male presenting with a BMI of 25.8, following a standard mixed diet rated 7 out of 10 for quality with a volume of 6 out of 10. He does not currently engage in any structured cardio or resistance training and averages 2,000 to 5,000 daily steps. He takes medication for high blood pressure, though the specific agent was not captured in the questionnaire. He reports bloating and digestive discomfort, skin breakouts, and joint pain and stiffness. His goals are to lose body fat, build muscle, and prevent disease.\n\nThere are two findings in this report that warrant prompt attention. The first is a significantly elevated IgE, the immunoglobulin responsible for allergic and hypersensitivity responses. Khalid's IgE has exceeded the upper measurable limit of 2,000 IU/ml, against a reference ceiling of 100. An IgE this high is not explained by mild seasonal allergies. It suggests either a sustained and significant allergic process, a chronic skin condition such as atopic dermatitis or eczema, a parasitic infection, or, less commonly, a condition called allergic bronchopulmonary aspergillosis. Given that Khalid reports skin breakouts, the IgE and the skin symptoms may well be connected, but a level this extreme needs investigation by his GP, who will likely want to arrange specific allergen testing, consider a referral to immunology or dermatology, and check for parasitic causes. The second finding that should go to the GP is a markedly elevated Lipoprotein(a), which will be discussed alongside the lipid results below.\n\nThere is a good deal of reassuring news in this report. Khalid's kidney function is excellent. His Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of filtration rate than creatinine alone, returns an eGFR of 103, which is outstanding at 57. His creatinine is actually below the laboratory range at 59, but this reflects his relatively lean build and the absence of resistance training rather than any kidney problem, and the Cystatin C confirms that the kidneys are working very well. His liver panel is clean. ALT at 25 and AST at 23 are both comfortably within range, GGT at 42 is within the male reference, ALP is healthy, bilirubin is normal, and his FIB-4 score, a composite that estimates liver scarring risk, is 0.89, well below the threshold. Albumin at 44 reflects good synthetic liver function and adequate protein intake. His thyroid is working well, with TSH at 1.61, Free T4 at 15.7, and Free T3 at 4.8, all sitting within their respective ranges, and both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His inflammation is well controlled: hs-CRP, a sensitive marker of systemic inflammation, is 0.8, which is within the optimal band of below 1.0, and his ESR at 2 is essentially as low as it gets. For a man with joint pain and stiffness, this is genuinely reassuring because it suggests the joint symptoms are more likely mechanical or degenerative in nature rather than driven by an active inflammatory process. His prostate markers are excellent, with a PSA of 0.42, well below the age-adjusted threshold, and a free-to-total ratio of 47.6%, which is very reassuring. His tumour markers CA 19-9 and CEA are both within normal limits. His iron studies are balanced, with ferritin at 132, transferrin saturation at 34%, serum iron at 23.6, and transferrin at 2.75, all sitting comfortably within range. His total antioxidant activity is healthy at 1.64. His calcium, corrected calcium, phosphate, and parathyroid hormone are all within range, with corrected calcium at 2.45 sitting in a good position. His uric acid at 226 is within range, though it sits very close to the lower boundary, which at this level carries no concern whatsoever and actually suggests a low risk of gout.\n\nTurning to the lipid panel, the picture is mixed and worth understanding in detail. Khalid's HDL cholesterol, the protective fraction that removes cholesterol from artery walls, is 2.7, which is exceptionally high and genuinely impressive. His triglycerides at 0.88 are excellent, comfortably below the 1.0 optimal threshold. His TC/HDL ratio at 2.37 is very favourable, and his ApoB/A1 ratio at 0.54 is well below the 0.7 lower-risk threshold. Apolipoprotein A1, the main protein on HDL particles, is 2.02, which is superb. These are all strong cardiovascular positives. However, his LDL cholesterol at 3.37 is above the 3.0 upper reference and above the 2.6 optimal target, and his Apolipoprotein B (ApoB), which counts the number of potentially harmful cholesterol-carrying particles in the blood, is 1.1, above the 0.9 desirable limit. His total cholesterol at 6.4 is above the desirable threshold of 5.18, largely driven by a combination of the high HDL and the elevated LDL. This is where the Lipoprotein(a) result becomes critical. Lp(a) is an inherited, genetically determined particle that is essentially an LDL particle with an extra protein attached. Khalid's Lp(a) is 130.73 nmol/L, which places him in the moderate-risk category (90 to 200 nmol/L). This is not something that changes with diet, exercise, or any currently available supplement. It is fixed from birth. What it means practically is that a portion of his elevated LDL and ApoB is being driven by Lp(a) particles, which are particularly harmful because they not only deposit cholesterol in artery walls but also promote clotting and inflammation at the site of arterial plaques. This is the most important cardiovascular finding in the report and should be recorded permanently in his medical notes. His GP should be made aware, because the combination of elevated ApoB and significantly elevated Lp(a) in a 57-year-old man with hypertension may shift the risk-benefit calculation around statin therapy or other lipid-lowering interventions. Khalid should also consider recommending that his first-degree relatives, particularly siblings and children, have their own Lp(a) measured, since it is inherited. The modifiable portion of his LDL and ApoB elevation can still be addressed through dietary changes and the introduction of exercise, and these are discussed in the recommendations below.\n\nHis glucose metabolism shows an emerging pattern that deserves attention. His fasting glucose at 5.4 is within the laboratory range but sits at the upper boundary. His HbA1c at 39 mmol/mol (5.7%) is within the normal band but is approaching the 42 mmol/mol pre-diabetic threshold. His fasting insulin at 8.66 is within the laboratory range of 2.6 to 24.9 but is above the optimal ceiling of 8.0. His HOMA-IR, a calculation that estimates how resistant the body's cells are to the effects of insulin, is 2.08, above the 1.5 upper reference and crossing the 1.9 threshold that indicates early insulin resistance. His C-Peptide, a marker of how much insulin the pancreas is actually producing, is 1.36 ug/L (450 pmol/L), which is within range and confirms the pancreas is functioning adequately. Put together, this pattern shows that the body is having to produce slightly more insulin than ideal to keep blood sugar controlled, which is the hallmark of early insulin resistance. As a South Asian male, Khalid carries a well-documented higher baseline risk for type 2 diabetes, and this pattern, while not yet pre-diabetic, is the stage where lifestyle intervention is most effective at preventing progression. The absence of any structured exercise is the single biggest modifiable factor here. Introducing resistance training even two to three times per week has a profound effect on insulin sensitivity because muscle tissue acts as a glucose sponge, pulling sugar out of the blood without needing as much insulin.\n\nHis IgM, one of the five classes of immunoglobulin, is 0.4, marginally below the 0.5 lower limit. IgM is the first antibody the immune system produces when it encounters a new infection. A marginally low IgM in isolation, with IgG and IgA both healthy, is rarely significant and is most commonly a normal variant. It does not indicate immune deficiency at this level, but it is worth the GP noting for context, particularly if Khalid were to experience recurrent infections.\n\nHis lipase, an enzyme produced by the pancreas to break down fats, is 68, above the upper limit of 60. His amylase, the other main pancreatic enzyme, is 74 and within range. A mildly elevated lipase with normal amylase is common and in most cases does not indicate pancreatic disease. It can be seen with digestive discomfort, particularly bloating after fatty meals, and may reflect mild pancreatic strain or simply normal variation. Given that Khalid reports bloating and digestive discomfort, this is worth mentioning to his GP, though the normal amylase, normal liver enzymes, and absence of abdominal pain make significant pancreatic pathology unlikely.\n\nHis testosterone at 10.2 is within the laboratory range of 8.4 to 28.7 but is below both the laboratory's own recommended level of 12 and significantly below the optimal band of 18 to 30. His SHBG (Sex Hormone Binding Globulin), the protein that binds testosterone and makes it unavailable to tissues, is 29.6, which is within range, and his Free Androgen Index at 34.46 is within range, meaning the proportion of testosterone that is free and active is not being excessively bound. His calculated free testosterone is 0.211 nmol/L. His LH at 1.62 is just inside the lower limit of 1.5, and his FSH at 5.49 is within range. This pattern, where testosterone is below optimal but LH is not elevated in response, suggests the hypothalamus and pituitary are not driving the testes harder to compensate. At 57, some decline in testosterone is expected, but a level of 10.2 is lower than ideal, particularly for someone whose goals include building muscle and losing body fat. The most effective interventions for testosterone at this level are resistance training, adequate sleep, maintaining a healthy body fat percentage, and ensuring sufficient zinc and vitamin D intake. If these are optimised and testosterone remains below 12 on retest, a conversation with the GP about further investigation would be warranted.\n\nHis progesterone at 0.34 is below the male reference range of 0.89 to 3.88. In men, progesterone plays a relatively minor role compared to testosterone, and a low level in isolation is rarely clinically significant. It may reflect the same overall downward pressure on the hormonal axis that is producing the below-optimal testosterone.\n\nHis chloride at 93 is marginally below the lower limit of 95. Chloride is an electrolyte that helps maintain fluid balance and acid-base equilibrium. A mild reduction can be associated with bicarbonate retention, and indeed his bicarbonate is 28.4, which is towards the upper end of its range. This pairing can be seen with certain blood pressure medications, mild metabolic alkalosis, or simply hydration status at the time of the blood draw. His sodium at 133 sits at the very bottom of the reference range. Together, the low-normal sodium and below-range chloride may warrant the GP reviewing his antihypertensive medication to ensure it is not affecting electrolyte balance, particularly if he is taking a thiazide diuretic.\n\nHis vitamin D at 70 nmol/L is sufficient but below the optimal range of 75 to 120 that is associated with the best outcomes for immune function, bone health, and muscle function. His vitamin B12 at 336 is within the laboratory range but below the optimal band of 500 to 900 pg/ml, and his folate at 6 ng/ml is within range but below the optimal level of above 8. Both of these can be improved with targeted supplementation and dietary adjustment. His magnesium at 0.92 is within the optimal range of 0.85 to 1.05, which is reassuring.\n\nHis urine culture has returned a moderate growth of Staphylococcus aureus, with the laboratory noting that the sample was received in a plain bottle without boric acid preservative, which can cause overgrowth of organisms. His urinary white cells are 10, which sits at the boundary of significance, and his nitrites are negative. In the absence of urinary symptoms such as burning, frequency, or urgency, and given the plain bottle caveat, this is most likely to represent skin contamination during collection rather than a genuine urinary tract infection. The antibiotic sensitivity panel has been returned and shows the organism is sensitive to the majority of tested antibiotics, which is useful information should treatment ever be needed. If Khalid is experiencing any urinary symptoms, a repeat mid-stream sample in a boric acid container would clarify the picture.\n\nHis MCH at 32.6 is marginally above the upper limit of 32, and his MCHC at 347 is marginally above the upper limit of 345. Both of these describe the concentration and amount of haemoglobin within each red blood cell. At these margins, this is almost certainly laboratory variation, particularly given that the laboratory notes that MCHC can be affected by temperature and storage. His MCV at 94.1, haemoglobin at 153, and red cell distribution width at 12.4 are all healthy, confirming there is no underlying issue with red cell production. His cortisol at 259, his DHEA-S at 3 umol/L (1,105.5 ug/dL), oestradiol at 96, and prolactin at 57 are all within their respective ranges. His Rheumatoid Factor result is pending and should be reviewed when available, particularly given his joint symptoms.\n\nHis creatine kinase at 72 is within range and consistent with the absence of resistance training. His IgG at 13.8 and IgA at 2.4 are both within range. His coeliac screen (tissue transglutaminase IgA) is negative, which rules out coeliac disease as a contributor to his digestive symptoms.","links":"Khalid's most important next step is a conversation with his GP, bringing three specific findings. First, the Lp(a) at 130.73 nmol/L, which should be recorded permanently in his medical notes. Given the combination of elevated Lp(a), elevated ApoB at 1.1, below-optimal LDL at 3.37, hypertension, South Asian ethnicity, and age 57, the GP should assess his overall cardiovascular risk using a validated scoring tool (such as QRISK3, which includes ethnicity and can factor in Lp(a)). This may change the threshold at which lipid-lowering therapy becomes appropriate. Khalid should also encourage his first-degree relatives to have their own Lp(a) tested. Second, the IgE exceeding 2,000 IU/ml needs investigation. The GP should consider specific allergen panels (both environmental and food), assess for atopic conditions including eczema, consider checking for parasitic causes particularly if there has been any relevant travel history, and potentially refer to immunology or dermatology. The skin breakouts Khalid reports may be connected to this finding. Third, the early insulin resistance pattern (HOMA-IR 2.08, fasting glucose 5.4, HbA1c 39) should be discussed in the context of his South Asian ethnicity and elevated metabolic risk, and the GP may wish to monitor this with annual HbA1c checks.\n\nThe GP should also be made aware of the mildly elevated lipase at 68, the low chloride at 93 and borderline sodium at 133 in the context of his blood pressure medication, the low IgM at 0.4, and the below-optimal testosterone at 10.2 with LH at 1.62. The Rheumatoid Factor result is pending and should be reviewed when it arrives, given the joint symptoms.\n\nFor the modifiable portion of his cholesterol, Khalid should focus on increasing soluble fibre intake, which physically binds cholesterol in the gut and prevents its absorption. Practical sources include oats (a bowl of porridge daily provides approximately 3g of beta-glucan), lentils and chickpeas (which also provide excellent plant protein), flaxseed, and psyllium husk. He should aim for two to three portions of oily fish per week (salmon, mackerel, sardines) for their omega-3 content, which supports HDL function, lowers triglycerides (though his are already excellent), and has anti-inflammatory effects. Reducing saturated fat from red meat, butter, cheese, and processed foods will help lower the LDL fraction that is modifiable through diet.\n\nFor his body composition and insulin sensitivity goals, Khalid's estimated maintenance calories at his current activity level (sedentary, given zero structured training and 2,000 to 5,000 steps) are approximately 2,100 to 2,200 kcal per day. To lose body fat at a sustainable rate of 0.5 to 0.75 kg per week, he should target 1,700 to 1,900 kcal per day with a protein floor of 120 to 145g per day (1.3 to 1.6g per kg of bodyweight). Protein is the single most important macronutrient for his goals because it preserves muscle during fat loss, has the highest thermic effect of any macronutrient (meaning the body burns more calories digesting it), and promotes satiety. Good sources include chicken breast, turkey, white fish, Greek yoghurt, eggs, lentils, and whey protein.\n\nThe most transformative change Khalid can make is introducing structured exercise. Resistance training two to three times per week, even starting with bodyweight movements or light weights, will improve insulin sensitivity within weeks, support testosterone production, build the muscle tissue he needs to achieve his body composition goals, and directly address the early insulin resistance pattern. Even a simple programme of squats, lunges, press-ups, rows, and deadlifts performed with moderate weights for three sets of eight to twelve repetitions would be sufficient to begin. He should aim to increase his daily step count gradually towards 7,500 to 10,000 steps per day, as this low-intensity movement improves glucose disposal throughout the day.\n\nFor his digestive symptoms, the negative coeliac screen is reassuring. The bloating may respond to a food diary kept over two to three weeks to identify specific triggers. Common culprits include excess onion, garlic, beans, and cruciate vegetables in sensitive individuals. Eating more slowly, chewing thoroughly, and avoiding large meals late in the evening can also help. If symptoms persist, the GP may consider testing for Helicobacter pylori or arranging further investigation.\n\nFor his joint symptoms, the very low CRP and ESR are reassuring that there is no active systemic inflammation. The pending Rheumatoid Factor will add further clarity. In the meantime, maintaining a healthy weight, omega-3 supplementation, and introducing gentle resistance training to strengthen the muscles around affected joints are all evidence-based approaches. If the joints are primarily weight-bearing (knees, hips), even modest weight loss of 5 to 10 kg can significantly reduce load and improve symptoms.\n\nA retest in four to six months would be valuable to reassess HOMA-IR, fasting glucose, HbA1c, the lipid panel (particularly ApoB and LDL), testosterone, IgE (after GP investigation), and IgM. The electrolytes should also be rechecked, ideally after the GP has reviewed his antihypertensive medication.","flags":"1. IgE >2,000 IU/ml (reference <100): Massively elevated. Requires investigation for allergic disease, atopic dermatitis, parasitic infection, or allergic bronchopulmonary aspergillosis. Patient reports skin breakouts which may be related. Recommend specific allergen panels, consider immunology or dermatology referral.\n\n2. Lipoprotein(a) 130.73 nmol/L (reference <32): Moderate-risk category. Genetically determined, not modifiable by lifestyle. Should be recorded permanently in medical notes. Combined with ApoB 1.1 g/L (above 0.9 desirable), LDL 3.37 mmol/L (above 3.0 reference), hypertension, South Asian ethnicity, and age 57, formal cardiovascular risk assessment recommended. First-degree relatives should be offered Lp(a) testing.\n\n3. HOMA-IR 2.08 (reference 0.5-1.5): Early insulin resistance. Fasting glucose 5.4 mmol/L (upper boundary of range), HbA1c 39 mmol/mol (below 42 threshold but trending). Fasting insulin 8.66 mIU/L (above optimal 8.0). South Asian ethnicity confers additional metabolic risk. Lifestyle intervention (exercise, dietary modification) recommended as primary approach. Annual HbA1c monitoring suggested.\n\n4. ApoB 1.1 g/L (desirable <0.9): Borderline high particle count. Partially driven by Lp(a) contribution. Modifiable portion addressable through diet and exercise. Statin consideration in context of overall risk profile.\n\n5. LDL 3.37 mmol/L (reference 0.5-3.0): Elevated. Partially Lp(a)-driven. Total cholesterol 6.4 mmol/L (desirable <5.18).\n\n6. Lipase 68 U/L (reference 13-60): Mildly elevated with normal amylase (74 IU/L) and normal liver enzymes. Low suspicion for significant pancreatic pathology. Patient reports bloating and digestive discomfort.\n\n7. Testosterone 10.2 nmol/L (reference 8.4-28.7, recommended >12): Below optimal. LH 1.62 mIU/ml (borderline low, reference 1.5-9.3) without compensatory elevation. Consider reassessment after lifestyle optimisation (exercise, sleep, weight management).\n\n8. Chloride 93 mmol/L (reference 95-108): Below range. Sodium 133 mmol/L at lower boundary. Bicarbonate 28.4 towards upper end. Consider review of antihypertensive medication effects on electrolytes.\n\n9. Progesterone 0.34 nmol/L (reference 0.89-3.88): Below range. Clinically minor in males, likely reflects overall hormonal axis suppression.\n\n10. IgM 0.4 g/L (reference 0.5-3.0): Marginally below range. Isolated finding with normal IgG and IgA. Unlikely to be clinically significant. Note for context if recurrent infections occur.\n\n11. Creatinine 59 umol/L (reference 65-104): Below range but Cystatin C eGFR 103 confirms excellent renal function. Reflects body composition rather than renal impairment.\n\n12. MCH 32.6 pg (reference 27-32), MCHC 347 g/L (reference 315-345): Both marginally above range. Laboratory variation, particularly with temperature and storage effects noted by lab. No clinical concern.\n\n13. Urine culture: Moderate growth of Staphylococcus aureus. Plain bottle (no boric acid). WBC 10 (borderline), nitrites negative. Likely contamination. Repeat in boric acid container if symptomatic.\n\n14. Rheumatoid Factor: Pending (to follow). Review in context of joint symptoms when available.\n\nReassuring negatives: Thyroid function normal with negative antibodies. CRP 0.8 (optimal). ESR 2 (very low, arguing against inflammatory arthritis). Cystatin C eGFR 103 (excellent renal function). FIB-4 0.89 (no liver fibrosis risk). PSA 0.42 with free ratio 47.6% (excellent prostate health). Coeliac screen negative. Iron studies balanced. Corrected calcium, phosphate, PTH all normal. CEA and CA 19-9 normal. ApoB/A1 ratio 0.544 (favourable). Triglycerides 0.88 (excellent). HDL 2.7 (exceptional).","recommendations":"1. Book a GP appointment to discuss the elevated IgE (>2,000), elevated Lp(a) (130.73), HOMA-IR (2.08), and the overall cardiovascular risk profile. Bring this report.\n\n2. Begin resistance training two to three times per week. Start with a simple full-body programme of compound movements (squats, lunges, press-ups, rows, hinges) using bodyweight or light weights, progressing load gradually. This is the single most impactful change for insulin sensitivity, testosterone, muscle building, and long-term disease prevention.\n\n3. Increase daily step count gradually from the current 2,000 to 5,000 towards a target of 7,500 to 10,000. Walking after meals is particularly effective for glucose disposal.\n\n4. Target 1,700 to 1,900 kcal per day for fat loss, with a protein floor of 120 to 145g per day. Prioritise lean protein sources at every meal.\n\n5. Add a daily bowl of porridge oats or other soluble fibre source (lentils, chickpeas, psyllium husk) to help lower the modifiable portion of LDL cholesterol.\n\n6. Eat oily fish (salmon, mackerel, sardines) two to three times per week for omega-3 intake.\n\n7. Reduce saturated fat from red meat, butter, cheese, and processed foods.\n\n8. Keep a food diary for two to three weeks to identify bloating triggers. Eat slowly, chew thoroughly, and avoid large late-evening meals.\n\n9. Begin vitamin D3 supplementation at 3,000 IU daily to move from 70 into the 75 to 120 optimal range.\n\n10. Begin sublingual methylcobalamin B12 at 1,000 mcg daily to move from 336 towards the 500 to 900 optimal band.\n\n11. Increase dietary folate through leafy greens, lentils, and fortified foods, or supplement with 400 mcg methylfolate daily.\n\n12. Recommend Lp(a) testing for first-degree relatives (siblings and children).\n\n13. Review the Rheumatoid Factor result when it returns and discuss with GP if positive.\n\n14. Retest in four to six months: HOMA-IR, fasting glucose, HbA1c, full lipid panel with ApoB, testosterone, LH, IgE, IgM, chloride, sodium, and electrolytes.","supplementation":"Vitamin D3: 3,000 IU (75 mcg) cholecalciferol daily, taken with the largest fat-containing meal of the day. Khalid's level is 70 nmol/L, which is sufficient but below the 75 to 120 optimal range associated with the best outcomes for immune function, bone density, insulin sensitivity, and testosterone production. South Asian skin pigmentation reduces vitamin D synthesis from sunlight, making supplementation particularly important. At a dose of 3,000 IU daily, he should reach the optimal range within two to three months.\n\nVitamin K2: 100 mcg MK-7 daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bone and away from soft tissues and arterial walls. It should always accompany vitamin D supplementation, particularly in someone with cardiovascular risk factors.\n\nOmega-3 fish oil: 2g combined EPA and DHA daily, taken with food. This supports the favourable HDL and triglyceride profile Khalid already has, provides anti-inflammatory benefits relevant to his joint symptoms, and contributes to cardiovascular protection alongside the dietary changes to address his LDL and ApoB.\n\nVitamin B12: 1,000 mcg sublingual methylcobalamin daily, dissolved under the tongue rather than swallowed. Khalid's B12 at 336 pg/ml is within the laboratory range but below the 500 to 900 optimal band. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets. The methylcobalamin form is the biologically active version.\n\nMethylfolate: 400 mcg daily. Khalid's folate at 6 ng/ml is within range but below the optimal threshold of 8. Folate works synergistically with B12 in methylation pathways and red blood cell production. Methylfolate is the bioavailable form and is preferable to folic acid.\n\nMagnesium glycinate: 300 mg before bed. Khalid's magnesium at 0.92 is within the optimal range, so this is a maintenance dose rather than a corrective one. Magnesium glycinate supports sleep quality, muscle recovery, and blood pressure regulation, all of which are relevant to his goals and his hypertension. The glycinate form is the best tolerated and least likely to cause digestive upset.\n\nThe most important changes from this report are not supplements. They are beginning resistance training two to three times per week, increasing daily movement towards 7,500 to 10,000 steps, adjusting calorie intake to 1,700 to 1,900 kcal with a protein floor of 120 to 145g per day, and having the GP conversation about his IgE, Lp(a), and early insulin resistance. These will do more for Khalid's cardiovascular risk, insulin sensitivity, testosterone, body composition, and long-term health than any supplement can.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2232","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When the liver is under strain, whether from excess alcohol, fatty liver disease, medication, or metabolic overload, ALT leaks into the bloodstream and the level rises. Khalid's ALT at 25 is comfortably below both the laboratory limit of 56 and the tighter optimal ceiling of 30 for males, indicating that the liver is under no metabolic strain.","low_causes":"","high_causes":"Fatty liver disease, alcohol, medications, viral hepatitis, obesity, strenuous exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4531","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5833","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It rises with liver damage but is less specific to the liver than ALT because muscle damage and intense exercise can also elevate it. Khalid's AST at 23 is well within range, and alongside the normal ALT, confirms healthy liver function.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart disease, strenuous exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2877","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake, bile duct obstruction, and metabolic stress. It is often the first liver enzyme to rise when the liver is under pressure. Khalid's GGT at 42 is within the male laboratory range of 4 to 73 but above the tighter optimal ceiling of 25. This does not indicate liver disease, but it does suggest the liver is working slightly harder than ideal, which can be influenced by body composition, diet quality, or alcohol intake.","low_causes":"","high_causes":"Alcohol consumption, fatty liver, bile duct disease, metabolic syndrome, medications, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3905","upper_optimal_position":"0.6048","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, kidneys, and digestive system. Elevations can indicate bile duct obstruction, bone disease, or liver pathology. Khalid's ALP at 62 is comfortably within range and within the optimal band, indicating healthy bile flow and normal bone turnover.","low_causes":"Zinc deficiency, malnutrition, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. Elevated levels can indicate liver disease, bile duct obstruction, or increased red cell breakdown. A harmless inherited condition called Gilbert's syndrome can also cause mildly elevated bilirubin. Khalid's bilirubin at 10 is healthy and within the optimal range.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects liver synthetic function, immune status, and nutritional state. Khalid's total protein at 78 is within the optimal range, reflecting adequate nutrition and healthy liver and immune function.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance between the blood vessels and tissues. Low albumin can indicate liver disease, malnutrition, or chronic illness. Khalid's albumin at 44 is healthy and within the optimal band, confirming good liver synthetic function and adequate protein nutrition.","low_causes":"Liver disease, malnutrition, chronic illness, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5926","units":"g/l","description":"Globulins are a group of proteins that include immunoglobulins (antibodies) and transport proteins. The level reflects immune system activity and liver function. Khalid's globulin at 34 is within the laboratory range but above the optimal ceiling of 32, sitting in the upper portion of the reference band. This may partly reflect the elevated IgE contributing to the globulin total, and the massively elevated IgE is likely the main driver.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, immune activation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3929","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood. A ratio within range reflects a healthy balance between liver synthetic function (albumin) and immune activity (globulin). Khalid's ratio at 1.29 is within the laboratory range but marginally below the optimal band of 1.3 to 2.0, likely reflecting the slightly elevated globulin driven by the very high IgE.","low_causes":"Overproduction of globulins (chronic infection, inflammation, myeloma), underproduction of albumin (liver disease)","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3069","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that combines age, AST, ALT, and platelet count to estimate the risk of liver fibrosis (scarring). A score below 1.45 suggests a very low risk of significant fibrosis. Khalid's score of 0.89 is well below the threshold, indicating no concern about liver scarring.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advanced age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatic inflammation (pancreatitis), salivary gland issues, or bowel obstruction. Khalid's amylase at 74 is within range and within the optimal band, indicating healthy pancreatic function from this marker's perspective.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"68","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7234","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6241","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase. Khalid's lipase at 68 is mildly above the upper limit of 60. A mild elevation with normal amylase is common and usually does not indicate significant pancreatic disease. It may be associated with digestive discomfort, particularly after fatty meals, and can be seen in mild pancreatic strain, metabolic causes, or simply normal variation. Given Khalid's bloating symptoms, this finding is worth mentioning to his GP, though the normal amylase and liver enzymes make serious pancreatic pathology unlikely.","low_causes":"Pancreatic insufficiency, chronic pancreatitis","high_causes":"Pancreatitis, bowel obstruction, kidney disease, medications, gallstones","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6178","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL, and VLDL. While the desirable level is below 5.18 mmol/L, total cholesterol alone does not tell the full story because it includes the protective HDL fraction. Khalid's total cholesterol of 6.4 is above the desirable threshold, but this is substantially driven by his exceptionally high HDL of 2.7. The more important metrics are his LDL, ApoB, and the ratios, which give a clearer picture of cardiovascular risk.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, kidney disease, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2588","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats circulating in the blood, largely influenced by recent carbohydrate and sugar intake, alcohol consumption, and metabolic health. Elevated triglycerides are associated with insulin resistance and cardiovascular risk. Khalid's triglycerides at 0.88 are excellent, well below the 1.7 laboratory limit and within the tighter optimal ceiling of 1.0. This is a strong cardiovascular positive.","low_causes":"Hyperthyroidism, low-fat diet, malabsorption, malnutrition","high_causes":"High sugar or refined carbohydrate diet, alcohol, obesity, insulin resistance, metabolic syndrome, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9643","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. Higher levels are associated with lower cardiovascular risk. Khalid's HDL at 2.7 is exceptionally high, far above both the 1.04 lower reference and the 1.4 optimal threshold for males. This is one of the strongest positives in his entire report.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, insulin resistance, metabolic syndrome","high_causes":"Genetics, regular exercise, moderate alcohol intake, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5572","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the cholesterol fraction that deposits cholesterol into artery walls, contributing to atherosclerosis over time. Lower levels are associated with reduced cardiovascular risk. Khalid's LDL at 3.37 is above the 3.0 upper reference and above the 2.6 optimal target. Importantly, a portion of this LDL reading is contributed by Lp(a) particles, which are genetically determined and not modifiable through diet or exercise. The remainder is modifiable through dietary changes, particularly reducing saturated fat and increasing soluble fibre intake.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Diet high in saturated fat, genetics (including familial hypercholesterolaemia), hypothyroidism, kidney disease, obesity, Lp(a) elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.4","wi ightly harder than ideal.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes (pancreatic exhaustion), low-carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, pre-diabetes, metabolic syndrome, obesity, high refined carbohydrate diet, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"450","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4188","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5276","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is a more reliable measure of pancreatic insulin production than insulin itself because it is not affected by liver metabolism. Khalid's C-Peptide (converted from 1.36 ug/L to 450 pmol/L) is within range, confirming that the pancreas is producing insulin adequately. The issue is not pancreatic output but rather the body's sensitivity to the insulin being produced.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8600","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's effects. Below hronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"g/L","description":"Transferrin is the transport protein that carries iron through the blood. The body produces more transferrin when iron stores are low (trying to capture more iron) and less when stores are adequate or high. Khalid's transferrin at 2.75 is within the optimal range, consistent with balanced iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"62.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5273","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3854","upper_optimal_position":"0.5729","units":"umol/l","description":"TIBC (total iron binding capacity) measures the maximum amount of iron that transferrin can carry. It is an indirect measure of transferrin levels and reflects the body's capacity to transport iron. Khalid's TIBC at 62.7 is within the optimal range.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"T f lifestyle optimisation does not raise the level above 12 on retest, further investigation with his GP would be appropriate.","low_causes":"Aging, obesity, sedentary lifestyle, stress, poor sleep, testicular injury, pituitary disorders, medications (opioids, statins), chronic illness","high_causes":"Testosterone replacement therapy, anabolic steroids, testicular or adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.211","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone not bound to proteins (SHBG or albumin) and therefore available to enter cells and exert biological effects. Khalid's calculated free testosterone of 0.211 nmol/L is consistent with his below-optimal total testosterone level. No validated laboratory reference range was provided for this calculated value.","low_causes":"Low total testosterone, elevated SHBG, aging, obesity","high_causes":"Testosterone supplementation, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"29.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4179","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3849","upper_optimal_position":"0.5922","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds testosterone and oestradiol, controlling how much is available for the body to use. Higher SHBG means less free testosterone; lower SHBG means more free testosterone. Khalid's SHBG at 29.6 is within the optimal range of 25 to 55, meaning SHBG is not excessively binding what testosterone he has.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use, PCOS","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen medications, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"34.46","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3704","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) is calculated as (total testosterone / SHBG) x 100 and provides an estimate of the proportion of testosterone that is biologically active. Khalid's FAI at 34.46 is within the laboratory range but below the optimal band of 40 to 100, reflecting his below-optimal total testosterone level.","low_causes":"Low testosterone, elevated SHBG, aging, obesity","high_causes":"High testosterone, low SHBG, PCOS (females), anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3286","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4451","units":"pmol/L","description":"Oestradiol is the primary oestrogen in the body. In men, small amounts are essential for bone health, brain function, and libido. It is produced by the conversion of testosterone via an enzyme called aromatase, with higher body fat generally leading to more conversion. Khalid's oestradiol at 96 is within range and within the optimal band.","low_causes":"Low testosterone (less substrate for conversion), low body fat, aromatase inhibitor medications","high_causes":"Obesity (increased aromatase activity), liver disease, medications, testosterone therapy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2413","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6207","units":"nmol/L","description":"Progesterone is primarily associated with the female reproductive cycle, but men produce small amounts in the adrenal glands and testes. In men, it plays a minor role in supporting brain function and may influence sleep and mood. Khalid's progesterone at 0.34 is below the male reference range of 0.89 to 3.88. In men, a low progesterone in isolation is rarely clinically significant and may reflect the same overall downward pressure on the hormonal axis that is producing his below-optimal testosterone.","low_causes":"Adrenal insufficiency, low hormonal drive, aging","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"1.62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3451","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3744","upper_optimal_position":"0.5590","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and signals the testes to produce testosterone. When testosterone is low, LH should
