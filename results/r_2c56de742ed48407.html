<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Celina Keywood","dob":"12/06/1974","report_date":"2026-08-27","summary":"Celina is a 52-year-old female presenting with a BMI of 29.4, following a low-carb, high-protein diet rated 8 out of 10 for quality with a volume of 5 out of 10. She trains twice per week, once cardio and once resistance, with 5,000 to 7,500 daily steps. She takes levothyroxine for hypothyroidism and is on HRT. She also supplements with magnesium, melatonin, 5-MTHF (methylfolate), L-tyrosine and quercetin. She has a confirmed MTHFR gene variant. She underwent Roux-en-Y (RNY) gastric bypass surgery in 2018 and requires iron infusions approximately every 18 months due to recurrent low ferritin. She reports poor sleep with waking for one to two hours most nights, low energy, fatigue and hair thinning. Her goals are to improve sleep quality, improve energy levels and support long-term health and longevity.\n\nThe most important finding in this report is her lipase level. Lipase is an enzyme produced primarily by the pancreas to digest dietary fat. Celina's lipase is 121, which is double the upper limit of 60. Elevated lipase can reflect pancreatic inflammation, even at a subclinical level, and this is particularly relevant in someone who has had RNY gastric bypass because the surgical rerouting of the gut alters how digestive enzymes are released and how food reaches the pancreas. Her amylase, the other main pancreatic enzyme, is 105 against an upper limit of 118, so while within range it is sitting in the upper quarter. Taken together, these two findings suggest the pancreas is working hard and may be under some degree of strain. This should be discussed with her GP, who may wish to repeat the lipase on a fresh fasting sample and consider imaging of the pancreas if the elevation persists. It is worth noting that her abdominal symptoms, if any, and her surgical history will be important context for the GP.\n\nHer C-peptide is also flagged as below range. C-peptide is a molecule released by the pancreas in a one-to-one ratio with insulin, so it is a reliable measure of how much insulin the body is actually producing. Celina's C-peptide is 0.66 micrograms per litre (approximately 218 pmol/L) against a lower limit of 1.1 micrograms per litre (364 pmol/L). Her fasting insulin is 2.9, just inside the lower boundary of its range. However, her fasting glucose is an excellent 4.3 and her HOMA-IR, a calculation that estimates insulin resistance, is 0.55, which sits right at the lower (most favourable) end of the range. What this pattern tells us is that Celina's body needs very little insulin to keep her blood sugar perfectly controlled. In the context of a low-carb diet, gastric bypass (which itself profoundly improves insulin sensitivity), and a healthy body weight, this is a sign of excellent metabolic efficiency rather than pancreatic failure. The pancreas is not struggling; it simply does not need to produce much insulin. That said, because the full blood count including HbA1c was not returned (due to a missing EDTA tube), we cannot confirm her average blood sugar over three months. We would recommend repeating the HbA1c at the earliest opportunity to complete this picture. If the HbA1c returns below 36 mmol/mol, this low C-peptide pattern is entirely reassuring.\n\nHer IgM is 0.4, marginally below the lower limit of 0.5. IgM is the first antibody the immune system produces when it encounters a new infection. An isolated, marginally low IgM without recurrent infections is common and usually clinically insignificant. If Celina does not experience frequent or unusual infections, this is unlikely to be meaningful, but it is worth mentioning to the GP for their records.\n\nTurning to the substantial positives in this report, Celina's cardiovascular and lipid profile is genuinely excellent. Her total cholesterol is 5.2, which sits just above the desirable threshold of 5.18 and is essentially at target. Her LDL cholesterol, the primary driver of arterial plaque, is 2.19, comfortably within the ideal range of below 2.6. Her ApoB, which is the most accurate single measure of atherogenic particle number (each potentially harmful lipoprotein particle carries exactly one ApoB molecule), is 0.65, well below the desirable limit of 0.9 and inside the optimal zone below 0.8. Her HDL cholesterol is 2.7, which is exceptionally high. HDL particles perform reverse cholesterol transport, pulling cholesterol out of artery walls and returning it to the liver for disposal. Her ApoA1, the structural protein of HDL particles, is 2.01. The ApoB to ApoA1 ratio, which is the single best lipid metric for cardiovascular risk, is 0.32, well inside the lower risk threshold of below 0.6. Her triglycerides are 0.76, inside the optimal range of below 1.0, and her triglyceride-to-HDL ratio is 0.28, which is outstanding. Her Lp(a), lipoprotein(a), a genetically inherited and unchangeable lipoprotein that independently drives cardiovascular risk, is below 25, which is normal. This is genuinely useful information because it means her cardiovascular risk profile is driven entirely by modifiable, lifestyle-related factors, and those factors are clearly being managed very well. Her remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.31, well inside the optimal threshold of below 0.5. Her VLDL is 0.35, also well within range. In summary, her entire lipid and cardiovascular risk panel is in excellent shape.\n\nHer inflammation marker, high-sensitivity CRP (hs-CRP), a protein produced by the liver in response to systemic inflammation, is 0.2, which is very low. At a BMI approaching 30, this is a particularly impressive result because adipose tissue is metabolically active and tends to generate low-grade inflammation. A CRP this low suggests her body is under very little inflammatory stress.\n\nHer liver is in good health. GGT (gamma-glutamyl transferase) is 18, well inside the optimal zone of below 25. ALT (alanine aminotransferase) is 32, which is above the optimal threshold of below 25 for women but within the laboratory range of below 56. AST is 26, comfortably within range. ALP (alkaline phosphatase) is 64, within range. Bilirubin is 8, normal. Albumin is 37, within range though sitting in the lower quarter, which is not unusual after bariatric surgery because the altered gut can reduce protein absorption. Total protein is 65, also within range but on the lower side, consistent with the same mechanism.\n\nHer kidney function is solid. Cystatin C, which is a more reliable measure of kidney filtration than creatinine because it is not affected by muscle mass, is 0.93 with a calculated eGFR of 88. The creatinine-based eGFR is 86. Both are above the threshold of 60 that defines chronic kidney disease but sit just below the optimal level of above 90. At 52, this represents healthy, age-appropriate kidney function. Sodium, chloride, bicarbonate and potassium are all within their respective ranges. Uric acid is 207, within range and within the optimal zone for women of 160 to 320.\n\nHer iron studies tell an important story given her history of recurrent iron deficiency requiring infusions. Right now, her ferritin is 66, which is above the lower limit of 10 and above the optimal floor of 40 for women. Her serum iron is 18.7, her transferrin is 2.53 (just at the lower limit of its range at 2.5), and her transferrin saturation is 29.4%, within the optimal band of 25 to 40%. This snapshot shows iron stores that are currently adequate but not abundant. Given that she depletes her ferritin approximately every 18 months, this level should be monitored every six months rather than waiting for symptoms to develop. The transferrin sitting right at the bottom of its range is worth watching because transferrin is the protein that carries iron in the blood, and a low level can mean the body is not making enough transport capacity. For now, the overall picture is acceptable but not uggesting she is in the perimenopausal transition. LH (luteinising hormone) is 10.14, consistent with perimenopause. Her oestradiol is 198 pmol/L, which is above the post-menopausal ceiling of 118.2 and within the follicular range, confirming that her HRT is providing meaningful oestrogen replacement. Progesterone is 0.48, within the post-menopausal range, which is expected on most HRT regimens unless a cyclical progesterone component has been taken recently. Testosterone is 2.2 against a female range of 0.5 to 2.6, which is within range. Free testosterone calculated is 0.02, and her SHBG (sex hormone binding globulin), the protein that binds testosterone and makes it unavailable to tissues, is 91.3. This SHBG level is within the laboratory range of 27.8 to 146 but is on the higher side, which means more of her total testosterone is being bound and less is available to tissues. Low free testosterone can contribute to reduced energy, difficulty building muscle and hair changes. This is worth discussing with her HRT prescriber, who may consider whether testosterone supplementation would be appropriate. DHEA-S (dehydroepiandrosterone sulphate), an adrenal precursor to sex hormones, is 1.0 micromoles per litre (368.5 micrograms per decilitre), which is within range but on the lower side for age. Prolactin is 168, within the non-pregnant range. Cortisol is 136, which sits just below the lower end of the morning reference range of 145.4 to 619.4. If this sample was taken in the morning, a cortisol this low could reflect adrenal output that is slightly suppressed, which can contribute to fatigue and poor stress resilience. However, cortisol varies significantly with time of day and stress, so a single reading should be interpreted cautiously.\n\nHer vitamin D is 93 nmol/L, which is within the optimal range of 75 to 120 and represents good supplementation or sun exposure. After gastric bypass, vitamin D absorption is impaired, so maintaining this level is a genuine achievement. Her B12 is 309 pg/ml, which is within the laboratory range of 193 to 982 but below the optimal floor of 500. Her Active B12 is 227.7, flagged as above the upper limit of 165. Active B12 (holotranscobalamin) measures the fraction of B12 that is actually available for cells to use, and it is a more reliable marker than total B12. The fact that active B12 is elevated while total B12 is below optimal is not a concern; it means her supplementation is providing B12 in a form that is reaching the cells, which is what matters. In the context of gastric bypass, where the intrinsic factor pathway for B12 absorption is disrupted, having a healthy active B12 is reassuring and suggests her supplementation route (likely sublingual or injectable) is effective. Folate is 17 against a range of 3 to 17, sitting right at the upper limit, which reflects her 5-MTHF supplementation for the MTHFR variant and is exactly where it should be.\n\nHer calcium metabolism is healthy. Corrected calcium is 2.34, within the optimal range. PTH (parathyroid hormone), which regulates calcium levels, is 3.5, within range. After gastric bypass, calcium absorption is impaired, so normal calcium and PTH levels suggest her supplementation is adequate. Magnesium is 0.77, within the laboratory range of 0.53 to 1.11 but below the optimal floor of 0.85. Given that she is already supplementing magnesium and still sitting below optimal, she may benefit from a higher dose or a different form, which we will address in the supplementation section. Magnesium is critical for sleep quality, and suboptimal magnesium could be contributing to her nighttime waking.\n\nHer total antioxidant activity is 1.71, within the range of 1.3 to 1.77, reflecting her quercetin supplementation and good dietary quality. Creatine kinase is 109, within range and unremarkable. Her tumour markers are all within normal limits: CA-125 is 6.2, CA 15-3 is 12.4, CA 19-9 is 3.81, and CEA is below 0.5. Rheumatoid factor is 7, within range. IgG is 10 and IgA is 2, both within range. IgE is 22.2, within range. Coeliac screening (tissue transglutaminase IgA) is negative.\n\nHer urinalysis shows a positive nitrite result with a moderate mixed growth on culture, but the laboratory has flagged this as probable contamination. The sample was received in a plain bottle without boric acid preservative, which can allow bacterial overgrowth that does not reflect what was present in the bladder. Her white blood cells in urine are below 1 and red blood cells are below 1, neither of which supports a urinary tract infection. If Celina has no urinary symptoms such as burning, frequency or urgency, this is almost certainly a collection artefact. If she does have symptoms, a repeat mid-stream sample in a boric acid container would clarify the picture.\n\nIt is important to note that the EDTA tube was not received by the laboratory, which means the entire full blood count has not been returned. This includes haemoglobin, red cell count, white cell count with differential, platelets, reticulocytes, MCV, MCH, MCHC, RDW, MPV and ESR. It also means HbA1c was not returned. These are significant gaps. The full blood count is essential for assessing anaemia (critical given her history of iron depletion), immune function, and bone marrow health. The HbA1c is needed to confirm long-term glucose control alongside the reassuring fasting glucose and HOMA-IR. We strongly recommend arranging a repeat blood draw with the EDTA tube included as soon as possible to complete this report.\n\nIn summary, Celina has an outstanding cardiovascular risk profile, excellent insulin sensitivity, very low systemic inflammation, healthy kidney function and well-managed calcium metabolism despite the absorptive challenges of gastric bypass. The key areas requiring attention are the elevated lipase, which needs GP investigation; the low Free T3 despite adequate TSH, which may explain her fatigue, sleep disruption and hair thinning and warrants a conversation with her thyroid prescriber; the suboptimal magnesium despite supplementation; and the missing full blood count and HbA1c, which should be repeated promptly.","links":"Celina's report highlights several areas where specific actions could meaningfully improve how she feels day to day, particularly her sleep, energy and hair quality.\n\nThe most time-sensitive action is to share the elevated lipase result with her GP. Lipase at 121 (upper limit 60) in someone with a history of RNY gastric bypass needs clinical evaluation. She should bring this report and ask whether a repeat fasting lipase and pancreatic imaging are warranted. The GP should also be made aware of the marginally low IgM at 0.4 (lower limit 0.5) for their records, though this is unlikely to require action in the absence of recurrent infections.\n\nThe second priority is a conversation with her thyroid prescriber about her Free T3 of 3.8. Despite a well-controlled TSH of 1.25, her active thyroid hormone is in the bottom third of the range. This is a recognised pattern in patients on levothyroxine monotherapy who convert T4 to T3 inefficiently. She should ask whether adding liothyronine (synthetic T3) would be appropriate, or whether optimising conversion cofactors (selenium at 200 micrograms daily as selenomethionine, and zinc at 15 to 25 milligrams daily as zinc picolinate or bisglycinate) should be tried first. Both approaches are reasonable and her prescriber will have a preference. She should specifically mention that her fatigue, disrupted sleep and hair thinning are all consistent with insufficient T3 at the tissue level.\n\nFor her sleep, the suboptimal magnesium of 0.77 (optimal is 0.85 to 1.05) is likely contributing. After gastric bypass, magnesium absorption through the gut is reduced, so she may need a higher dose than typical. We would recommend increasing her magnesium glycinate to 400 to 600 milligrams elemental magnesium, taken in divided doses with 200 to 300 milligrams after dinner and another 200 to 300 milligrams at bedtime. Magnesium glycinate is the preferred form because glycine itself has calming properties and the chelated form is better absorbed in a shortened gut. Beyond supplementation, practical sleep strategies that may help include maintaining a fixed wake time seven days a week (even after a bad night), getting outside into natural light within 30 to 60 minutes of waking to reset the circadian clock, cutting caffeine entirely after midday, keeping the bedroom cool (16 to 18 degrees Celsius), and if she wakes in the night and cannot sleep within 20 minutes, getting up and doing something calm in dim light rather than lying in bed becoming frustrated. Her melatonin supplementation is reasonable but should ideally be taken at a consistent time 30 to 60 minutes before her target sleep time.\n\nFor her hair thinning, multiple factors are converging. The low Free T3 is the most likely primary driver, as thyroid hormone directly regulates the hair growth cycle. Iron stores are currently adequate at ferritin 66 but not generous, and given her pattern of depletion, keeping ferritin above 70 to 80 would provide a better buffer for hair follicle metabolism. She should continue monitoring ferritin every six months rather than waiting for symptoms. The relatively high SHBG of 91.3 is binding most of her testosterone, leaving very little free for tissues including hair follicles. Discussing testosterone supplementation with her HRT prescriber is worth considering.\n\nFor her energy, the low Free T3 is again the most likely contributor. Optimising thyroid hormone delivery to cells is the single intervention most likely to improve her energy. The low-normal cortisol of 136 may also be playing a role. If her prescriber agrees that cortisol warrants further investigation, a morning cortisol (taken between 7am and 9am, fasting) or a cortisol day curve would be more informative than a single reading.\n\nFor nutrition, at 81 kilograms, 166 centimetres tall, training twice weekly with moderate step count, her estimated maintenance calories are approximately 1,850 to 2,000 per day (using a multiplier of 1.45 for light activity on a basal metabolic rate of approximately 1,350). Her diet volume is rated 5 out of 10, which after gastric bypass is understandable because the stomach pouch limits how much can be eaten at once. However, she should aim for a protein intake of at least 105 to 130 grams per day (1.3 to 1.6 grams per kilogram), spread across four to five smaller meals to accommodate her anatomy. Protein is critical for hair growth, maintaining lean mass, and supporting immune function. Her diet quality at 8 out of 10 is excellent. Given her low-carb approach and the outstanding metabolic markers (glucose 4.3, HOMA-IR 0.55, triglycerides 0.76), there is no reason to change her dietary pattern. If she wishes to lose a small amount of weight, a modest deficit of 250 to 300 calories per day (approximately 1,550 to 1,700 per day) would be appropriate, but protein should not drop below 105 grams regardless of calorie target.\n\nThe missing EDTA tube means the full blood count and HbA1c were not completed. We strongly recommend arranging a repeat blood draw within two to four weeks. The specific markers to ensure are drawn include the complete blood count (haemoglobin, MCV, MCH, reticulocytes, white cell differential, platelets) and HbA1c. Given her history of iron depletion, haemoglobin and MCV are particularly important to assess whether she is currently anaemic or developing macrocytic changes.\n\nFor retesting, we would recommend repeating the following in approximately three to four months: Free T3 and Free T4 (to assess whether any thyroid medication changes or cofactor supplementation have improved conversion), ferritin (to track her depletion curve), magnesium (to confirm whether the increased dose is reaching optimal), lipase (to confirm whether the elevation was transient or persistent), and the full blood count and HbA1c that were missed from this panel.","flags":"ELEVATED LIPASE: 121 U/L (upper limit 60). In the context of RNY gastric bypass (2018), elevated lipase warrants investigation to exclude subclinical pancreatic inflammation or altered pancreatic drainage. Amylase is 105 (upper limit 118), in the upper quarter of its range. Recommend repeat fasting lipase and consider pancreatic imaging if persistent.\n\nLOW C-PEPTIDE: 0.66 ug/L (lower limit 1.1), equivalent to approximately 218 pmol/L. However, fasting glucose is 4.3, fasting insulin is 2.9, and HOMA-IR is 0.55. This pattern is consistent with low insulin demand rather than pancreatic beta-cell failure, particularly on a low-carb diet post-gastric bypass. HbA1c is needed to confirm (not returned due to missing EDTA tube).\n\nLOW FREE T3: 3.8 pmol/L (range 2.6 to 7.1, optimal 4.5 to 6.5). Free T4 is 13.9 (range 11.5 to 22.7, optimal 14 to 20). TSH is 1.25 (optimal). Pattern suggests poor T4-to-T3 conversion on levothyroxine monotherapy. Clinically relevant given symptoms of fatigue, sleep disruption and hair thinning. Consider liothyronine addition or conversion cofactor optimisation (selenium, zinc).\n\nLOW IgM: 0.4 g/L (lower limit 0.5). Isolated, marginally below range. Clinically significant only if recurrent or unusual infections present. IgG 10 and IgA 2 are both normal.\n\nELEVATED ACTIVE B12: 227.7 pmol/L (upper limit 165). In the context of B12 supplementation post-gastric bypass, this reflects effective supplementation delivery and is not pathological. Total B12 is 309 (below optimal 500), confirming supplementation rather than endogenous overproduction.\n\nSUBOPTIMAL MAGNESIUM: 0.77 mmol/L (range 0.53 to 1.11, optimal 0.85 to 1.05). Relevant to sleep disruption. Absorption likely impaired by gastric bypass anatomy.\n\nLOW-NORMAL CORTISOL: 136 nmol/L (morning reference 145.4 to 619.4). Single reading, interpret with caution. If sample taken in morning, marginally below reference floor.\n\nMISSING EDTA TUBE: Full blood count (haemoglobin, MCV, MCH, MCHC, RDW, platelets, MPV, WBC, differential, reticulocytes, ESR) and HbA1c not returned. Critical gap given history of recurrent iron deficiency. Recommend urgent repeat.\n\nURINALYSIS: Nitrites positive but WBC below 1, RBC below 1, and culture shows moderate mixed growth flagged as probable contamination. Plain bottle received (no boric acid). Not consistent with urinary tract infection unless symptomatic. Repeat in boric acid container if symptoms present.\n\nReassuring negatives: Cardiovascular risk profile is excellent (ApoB 0.65, ApoB/A1 0.32, Lp(a) below 25, TG/HDL 0.28, remnant cholesterol 0.31). hs-CRP 0.2 rules out significant systemic inflammation. Thyroid antibodies undetectable (no autoimmune thyroid activity). Kidney function healthy (Cystatin C eGFR 88). Iron stores currently adequate (ferritin 66, transferrin saturation 29.4%). Tumour markers all normal. Coeliac screen negative. Calcium metabolism normal despite bypass.","recommendations":"1. Share this report with your GP and specifically discuss the elevated lipase of 121 (double the upper limit). A repeat fasting lipase and potential pancreatic imaging should be considered given your gastric bypass history.\n\n2. Arrange a repeat blood draw within two to four weeks to obtain the full blood count and HbA1c that were missed due to the EDTA tube not being received by the laboratory. This is particularly important given your history of recurrent iron depletion.\n\n3. Discuss your Free T3 of 3.8 with your thyroid prescriber. Despite a well-controlled TSH, your active thyroid hormone is low and may be driving your fatigue, sleep disruption and hair thinning. Ask about adding liothyronine or optimising conversion with selenium and zinc supplementation.\n\n4. Discuss testosterone levels with your HRT prescriber. Your SHBG is relatively high at 91.3, which is binding most of your testosterone and leaving very little free for tissues. Low free testosterone can contribute to fatigue, difficulty building muscle and hair changes.\n\n5. Increase magnesium glycinate to 400 to 600 milligrams of elemental magnesium daily, split between evening meal and bedtime, to target the optimal range of 0.85 to 1.05 and support sleep quality.\n\n6. Aim for a minimum protein intake of 105 to 130 grams per day, spread across four to five smaller meals to accommodate your gastric bypass anatomy.\n\n7. Monitor ferritin every six months rather than waiting for symptoms. Current level of 66 is adequate but not generous given your pattern of depletion every 18 months.\n\n8. Maintain current vitamin D supplementation as your level of 93 is within the optimal range.\n\n9. Continue 5-MTHF supplementation for the MTHFR variant. Folate is at the top of range at 17, which is exactly where it should be.\n\n10. If you experience any urinary symptoms (burning, frequency, urgency), provide a repeat mid-stream urine sample in a boric acid container. If no symptoms, the positive nitrite and mixed growth are most likely a collection artefact.\n\n11. Implement sleep hygiene practices: fixed wake time seven days a week, natural light exposure within an hour of waking, no caffeine after midday, bedroom temperature 16 to 18 degrees, and if awake for more than 20 minutes during the night, get up and do something calm in dim light rather than staying in bed.\n\n12. Retest in three to four months: Free T3, Free T4, ferritin, magnesium, lipase, plus the full blood count and HbA1c from the missing EDTA tube.","supplementation":"The following supplement recommendations are tailored to Celina's results, her gastric bypass anatomy (which impairs absorption of many nutrients), and her current symptoms. After RNY bypass, absorption through the standard gut pathway is significantly reduced, so forms, doses and delivery methods matter more than usual.\n\nMagnesium glycinate: increase to 400 to 600 milligrams of elemental magnesium daily, split as 200 to 300 milligrams with the evening meal and 200 to 300 milligrams at bedtime. Magnesium glycinate is preferred because glycine has calming properties and the chelated form survives the altered gut better than oxide or citrate. This addresses the suboptimal magnesium of 0.77 (optimal is 0.85 to 1.05) and directly supports sleep quality, which is one of Celina's primary goals. Continue her current melatonin alongside this.\n\nSelenium as selenomethionine: 200 micrograms daily with food. Selenium is the key cofactor for the deiodinase enzymes that convert T4 (the inactive thyroid hormone provided by levothyroxine) into T3 (the active form). With a Free T3 of 3.8, well below optimal, improving conversion efficiency is a priority. This should be discussed with and approved by her thyroid prescriber.\n\nZinc picolinate or zinc bisglycinate: 15 to 25 milligrams daily, taken with food but separated from any thyroid medication by at least four hours. Zinc supports T4-to-T3 conversion, immune function and hair follicle health. It is also commonly depleted after gastric bypass.\n\nVitamin D3 (cholecalciferol): continue current supplementation at 2,000 to 3,000 IU daily with a fat-containing meal. Her level of 93 nmol/L is within the optimal range of 75 to 120, which is an excellent result after gastric bypass. The goal is to maintain this level, not increase it further.\n\nVitamin K2 (MK-7): 100 to 200 micrograms daily, taken alongside vitamin D. K2 directs calcium into bones and teeth and away from arteries. It is particularly relevant for a perimenopausal woman on HRT where bone density preservation is important.\n\nVitamin B12: continue current supplementation. Her Active B12 of 227.7 confirms that B12 is reaching cells effectively. If she is not already using sublingual methylcobalamin, switching to this form at 1,000 micrograms daily would be ideal, as sublingual delivery bypasses the gut entirely and avoids the intrinsic factor pathway that is disrupted by gastric bypass. Total B12 at 309 is below the optimal floor of 500, but the active B12 being well above range confirms the functional picture is good.\n\n5-MTHF (methylfolate): continue current dose. Folate is 17, at the top of the range, confirming the MTHFR-appropriate form is working well.\n\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily with food. While Celina's lipid profile is excellent, omega-3 fatty acids support brain function, reduce neuroinflammation and may help with sleep architecture. They also support hair follicle health through anti-inflammatory pathways.\n\nL-tyrosine: continue current supplementation. Tyrosine is the amino acid backbone of thyroid hormone, and in the context of low Free T3 it provides raw material for hormone production.\n\nQuercetin: continue current supplementation. Her total antioxidant activity of 1.71 is within range and likely reflects the contribution of quercetin alongside her good dietary quality.\n\nDO NOT add iron supplementation at this time. Ferritin is 66 and transferrin saturation is 29.4%, both currently adequate. Iron should only be supplemented under medical supervision given her history of managed infusions, and unnecessary iron supplementation can cause gastrointestinal distress, particularly after gastric bypass.\n\nThe most important changes from this report are not supplements. They are the conversation with her thyroid prescriber about Free T3 optimisation, the GP review of the elevated lipase, the repeat blood draw for the missing full blood count and HbA1c, and the sleep hygiene practices that will work alongside the increased magnesium to address her nighttime waking.","biomarkers":[{"key":"ALT","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When the liver is healthy, ALT stays inside the cells and blood levels are low. When liver cells are stressed or damaged, ALT leaks into the bloodstream. Celina's ALT is 32, which is within the laboratory range of below 56 but above the optimal threshold of below 25 for women. This mild elevation can be seen with metabolic load on the liver, high-protein diets, or simply normal variation. In the context of her excellent GGT, normal AST and normal bilirubin, this does not suggest liver disease but is worth monitoring.","low_causes":"","high_causes":"Liver inflammation, fatty liver, metabolic stress, medication effects, high-protein diets","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"AST","name":"AST/GOT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7396","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6020","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. Like ALT, it rises when these tissues are damaged, but because it is found in multiple organs it is less specific to the liver than ALT. Celina's AST is 26, comfortably within range and within the optimal zone. This confirms that her liver is not under significant stress.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver damage, muscle damage, heart disease, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GGT","name":"Gamma GT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2368","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol use, bile duct obstruction and metabolic stress. It is one of the earliest markers to rise when the liver is under strain. Celina's GGT is 18, well inside the optimal zone of below 25. This is an excellent result and confirms the liver is handling her metabolic load, medications and dietary pattern without any measurable strain.","low_causes":"","high_causes":"Alcohol use, bile duct disease, fatty liver, medications, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ALP","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4190","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones and bile ducts. It can be elevated in liver disease, bile duct obstruction or bone conditions, but also rises naturally during bone remodelling and in perimenopause. Celina's ALP is 64, comfortably within range and unremarkable.","low_causes":"Zinc deficiency, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, perimenopause","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PROT","name":"Total Protein","group":"LIVER & METABOLIC","result":"65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4400","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4533","upper_optimal_position":"0.6133","units":"g/l","description":"Total protein measures all the proteins in the blood, including albumin (made by the liver) and globulins (which include immune antibodies). Celina's total protein is 65, within the laboratory range but sitting at the lower end. After gastric bypass, protein absorption is reduced because food bypasses much of the small intestine where protein is normally absorbed. This makes achieving adequate dietary protein intake even more important and supports the recommendation for 105 to 130 grams per day.","low_causes":"Malabsorption, malnutrition, liver disease, gastric bypass","high_causes":"Chronic inflammation, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ALB","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is a protein made by the liver that maintains fluid balance in the blood vessels and transports hormones, vitamins and medications. Celina's albumin is 37, within the laboratory range of 34 to 50 but below the optimal floor of 40. Lower albumin after gastric bypass is common due to reduced protein absorption. Optimising protein intake can help improve this over time.","low_causes":"Malabsorption, malnutrition, liver disease, inflammation, gastric bypass","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GLOB","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/l","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. Celina's globulin is 28, within range and optimal. This is consistent with her generally healthy immune protein levels (IgG and IgA both normal).","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"BILI","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated bilirubin can indicate liver disease, bile duct obstruction, or increased red cell destruction. Celina's bilirubin is 8, well within range and normal.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"AMY","name":"Amylase","group":"LIVER & METABOLIC","result":"105","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4943","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5341","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands to digest starch. Elevated levels can indicate pancreatic inflammation (pancreatitis), though mild elevations can also come from salivary sources. Celina's amylase is 105, within the laboratory range of 30 to 118 but sitting in the upper quarter. Viewed alongside the elevated lipase, this reinforces the need for GP evaluation of pancreatic function.","low_causes":"Pancreatic insufficiency, advanced chronic pancreatitis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"Lip","name":"Lipase","group":"LIVER & METABOLIC","result":"121","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is an enzyme produced primarily by the pancreas to digest dietary fat. It is more specific to the pancreas than amylase. Celina's lipase is 121, which is double the upper limit of 60. Elevated lipase can indicate pancreatic inflammation, altered pancreatic drainage, or pancreatic duct changes. In someone who has had RNY gastric bypass, the surgical rerouting of the gut alters the normal pathway by which digestive enzymes are stimulated and released, and this can put additional strain on the pancreas. This finding should be discussed with the GP, who may recommend a repeat fasting measurement and pancreatic imaging.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, pancreatic duct obstruction, gastric bypass-related changes, renal impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"AG_RATIO","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main types of protein in the blood. A balanced ratio suggests healthy liver function and immune status. Celina's A/G ratio is 1.32, within the optimal range.","low_causes":"Liver disease, overproduction of globulins, malnutrition","high_causes":"Immune deficiency, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CHO","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5019","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol types in the blood, including LDL, HDL and VLDL. While often cited as a risk marker, total cholesterol alone is a poor predictor of cardiovascular risk because it includes the protective HDL. Celina's total cholesterol is 5.2, marginally above the desirable threshold of 5.18. However, this is driven by her exceptionally high protective HDL of 2.7, so the total cholesterol figure is misleading when viewed in isolation. Her actual cardiovascular risk, as measured by ApoB and the ApoB/A1 ratio, is very low.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet, genetics, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"HDL","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8438","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because HDL particles perform reverse cholesterol transport, collecting excess cholesterol from artery walls and returning it to the liver for disposal. Celina's HDL is 2.7, which is exceptionally high and well above the optimal threshold of 1.6 for women. This provides substantial cardiovascular protection and partly explains why her ApoB/A1 ratio is so favourable.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome","high_causes":"Genetics, regular exercise, moderate alcohol, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"LDL","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2920","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6107","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is the primary driver of atherosclerotic plaque in arteries. Each LDL particle can cross the arterial wall and deposit cholesterol, initiating a process that narrows arteries over decades. Celina's LDL is 2.19, within the optimal target of below 2.6. This is an excellent result and means her arterial exposure to LDL particles is low.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TRI","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2235","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and carbohydrate intake. High triglycerides are a hallmark of insulin resistance and metabolic syndrome. Celina's triglycerides are 0.76, within the optimal range of below 1.0. This is consistent with her low-carb diet and excellent insulin sensitivity.","low_causes":"Very low-fat diet, malabsorption, hyperthyroidism","high_causes":"High-carbohydrate diet, insulin resistance, alcohol, obesity, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"VLDC","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2244","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol is produced by the liver to transport triglycerides to tissues. Elevated VLDL reflects high triglyceride production, often driven by excess carbohydrate or alcohol. Celina's VLDL is 0.35, well within range and consistent with her excellent triglyceride level.","low_causes":"Low-fat diet, malabsorption","high_causes":"High-carbohydrate diet, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"HDLRat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2144","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a better predictor of cardiovascular risk than total cholesterol alone becau ult":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is the single best lipid metric for predicting cardiovascular risk. It directly compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1). Celina's ratio is 0.32, well within the lower risk threshold of below 0.6 and within the optimal threshold of below 0.5 for women. This is an excellent result.","low_causes":"","high_causes":"Elevated ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"LPA","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a genetically inherited lipoprotein that independently drives cardiovascular risk. Unlike LDL and triglycerides, Lp(a) levels are determined almost entirely by genetics and do not change significantly with diet or exercise. Celina's Lp(a) is below 25, which is normal (below the 32 nmol/L threshold). This is genuinely useful information because it confirms that her cardiovascular risk profile is driven entirely by modifiable lifestyle factors, all of which she is managing very well. Lp(a) only needs to be measured once in a lifetime as it does not change.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"TG_HDL","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0933","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a powerful marker of insulin resistance and metabolic health. A low ratio indicates that the body is handling fat metabolism efficiently. Celina's TG/HDL ratio is 0.28, which is outstanding and well within the optimal range of below 0.87. This is one of the best measures of metabolic health and hers is excellent.","low_causes":"","high_causes":"Insulin resistance, high-carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"REM_CHOL","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1938","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich lipoproteins after they have delivered their triglycerides to tissues. These remnant particles are highly atherogenic and can penetrate artery walls even more easily than LDL. Celina's remnant cholesterol is 0.31, well within the optimal range of below 0.5.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"GLU","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body is managing blood sugar in the absence of food. Celina's fasting glucose is 4.3, within the optimal range of 4.0 to 5.4. This is an excellent result and confirms that her blood sugar regulation is working very well.","low_causes":"Fasting, insulin excess, medications, adrenal insufficiency","high_causes":"Insulin resistance, prediabetes, diabetes, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GHB","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"Regret, no EDTA received.","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"%","description":"HbA1c was not returned because the EDTA blood tube was not received by the laboratory. HbA1c measures the average blood sugar over the preceding two to three months by looking at how much glucose has attached to haemoglobin in red blood cells. This is an important missing marker and should be repeated at the next blood draw.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"GHBI","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"Regret, no EDTA received.","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/mol","description":"HbA1c (IFCC units) was not returned because the EDTA blood tube was not received by the laboratory. This should be repeated at the next blood draw.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"INS","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3348","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5486","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to maintain blood sugar after an overnight fast. Lower levels suggest the body is insulin sensitive and does not need much insulin to control blood sugar. Celina's insulin is 2.9, just inside the lower boundary of the laboratory range and within the optimal range of 2 to 8. This very low insulin demand, combined with a fasting glucose of 4.3 and a HOMA-IR of 0.55, confirms exceptional insulin sensitivity.","low_causes":"Low-carb diet, gastric bypass, very high insulin sensitivity, pancreatic insufficiency","high_causes":"Insulin resistance, metabolic syndrome, high-carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CPEP","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1636","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-peptide is a molecule released by the pancreas in an exact one-to-one ratio with insulin. Because insulin is partially cleared by the liver before reaching the bloodstream, C-peptide gives a more accurate picture of how much insulin the pancreas is actually producing. Celina's C-peptide is 0.66 micrograms per litre (approximately 218 pmol/L), below the lower limit of 1.1. However, this must be interpreted alongside her fasting glucose of 4.3 and HOMA-IR of 0.55. The pattern shows that her pancreas does not need to produce much insulin because her body is highly insulin sensitive. In the context of a low-carb diet and post-gastric bypass physiology, this is a reflection of metabolic efficiency rather than pancreatic failure. The lab has also noted that delayed sample separation can reduce C-peptide levels.","low_causes":"Low insulin demand, low-carb diet, gastric bypass, high insulin sensitivity, type 1 diabetes (with absent insulin)","high_causes":"Insulin resistance, insulinoma, type 2 diabetes (early stage)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation that uses fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A lower score means the body responds well to insulin and needs very little to control blood sugar. Celina's HOMA-IR is 0.55, at the most favourable end of the range. Below 1.0 is considered insulin sensitive, which is optimal. This is an excellent result, particularly given her BMI of 29.4, and reflects the combined benefits of her low-carb diet, gastric bypass and metabolic health.","low_causes":"High insulin sensitivity, low-carb diet, gastric bypass","high_causes":"Insulin resistance, metabolic syndrome, obesity, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"HOMA_B","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"72.50","within_normal": articularly impressive result because excess adipose tissue typically generates low-grade inflammation.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"NA","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"mmol/l","description":"Sodium is the primary electrolyte that maintains fluid balance and blood pressure. It is tightly regulated by the kidneys. Celina's sodium is 140, within the optimal range.","low_causes":"Excess water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"POT","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is essential for heart rhythm, muscle function and nerve signalling. Both high and low potassium can be dangerous. Celina's potassium is 4.0, within the optimal range.","low_causes":"Diuretics, vomiting, diarrhoea, malabsorption","high_causes":"Kidney disease, ACE inhibitors, haemolysis, delayed sample processing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CL","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"
