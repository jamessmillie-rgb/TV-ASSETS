ly deficient minerals. Celina's magnesium is 0.77, within the laboratory range of 0.53 to 1.11 but below the optimal floor of 0.85. Given that she is already supplementing magnesium and still below optimal, this suggests either insufficient dose or poor absorption through her gastric bypass anatomy. Suboptimal magnesium is directly relevant to her sleep disruption, as magnesium activates the parasympathetic nervous system and helps regulate melatonin.","low_causes":"Malabsorption, gastric bypass, diuretics, alcohol, proton pump inhibitors, insufficient intake","high_causes":"Kidney failure, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"UA","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"207","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3452","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2524","upper_optimal_position":"0.5190","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced by the body. High levels can cause gout and are associated with cardiovascular risk. Low levels are generally favourable. Celina's uric acid is 207, within the optimal range for women of 160 to 320.","low_causes":"Low purine diet, Wilson's disease","high_causes":"High purine diet, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ANION_GAP","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"19.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7458","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate) and reflects unmeasured anions in the blood. Celina's anion gap is 19.7, above the upper limit of 16. A mildly elevated anion gap can be seen on low-carb or ketogenic diets due to ketone body production, and can also reflect albumin levels (low albumin can widen the apparent gap). Given Celina's low-carb diet and the absence of urinary ketones on this sample, this is most likely a mild metabolic variation rather than a pathological finding. It does not require specific action but is noted for completeness.","low_causes":"Low albumin, laboratory error","high_causes":"Ketosis, lactic acidosis, renal failure, toxic ingestion, low-carb diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"UREA","name":"Urea","group":"KIDNEY FUNCTION","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. It reflects both protein intake and kidney function. Celina's urea is 5.2, within the optimal range and consistent with healthy kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CREA","name":"Creatinine","group":"KIDNEY FUNCTION","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5122","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3821","upper_optimal_positi hat is not influenced by muscle mass, making it more reliable in people with low muscle mass or after bariatric surgery. Celina's Cystatin C eGFR is 88, consistent with the creatinine-based value and confirming healthy kidney function for her age.","low_causes":"Kidney disease, aging","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"CYC","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4227","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, its level is not affected by muscle mass, diet or exercise, making it a more reliable kidney marker. Celina's Cystatin C is 0.93, within range and within the optimal zone.","low_causes":"","high_causes":"Kidney disease, inflammation, hyperthyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"HBGL","name":"Haemoglobin","group":"HEMATOLOGY","result":"Regret, no EDTA received.","within_normal":"","within_optimal":"","result_position":"","lower_normal":"120","upper_normal":"150","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"g/L","description":"Haemoglobin was not returned because the EDTA blood tube was not received by the laboratory. Haemoglobin is the oxygen-carrying protein in red blood cells and is critical for assessing anaemia, which is particularly important given Celina's history of recurrent iron depletion requiring infusions. This should be repeated urgently.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"RBC"," cription":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals. Celina's serum iron is 18.7, within the optimal range.","low_causes":"Iron deficiency, chronic disease, malabsorption","high_causes":"Iron overload, haemochromatosis, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TRA","name":"Transferrin","group":"IRON STUDIES","result":"2.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3872","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. The liver produces transferrin in response to iron status. Celina's transferrin is 2.53, just at the lower boundary of the laboratory range (2.5 to 3.8) and below the optimal floor of 2.7. Low transferrin can indicate that iron stores are adequate (the body downregulates production when it has enough iron) or that the liver's protein production capacity is slightly reduced, which can occur after gastric bypass. Given her ferritin of 66 and adequate saturation, this is not currently concerning but should be monitored.","low_causes":"Iron overload, inflammation, liver disease, malnutrition, gastric bypass","high_causes":"Iron deficiency (the body produces more to capture more iron)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"IBC","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"57.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4748","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3957","upper_optimal_position":"0.5834","units":"umol/l","description":"TIBC (total iron binding capacity) measures how much iron the blood could carry if all transferrin was fully loaded. It is an indirect measure of transferrin levels. Celina's TIBC is 57.7, within the optimal range and consistent with adequate iron transport capacity.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FESA","name":"Transferrin Saturation","group":"IRON STUDIES","result":"29.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4416","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4225","upper_optimal_position":"0.5631","units":"%","description":"Transferrin saturation shows what percentage of the body's iron-carrying capacity is actually being used. It is calculated from serum iron and TIBC. Celina's transferrin saturation is 29.4%, within the optimal range of 25 to 40%. This confirms that iron is being transported and utilised effectively at present.","low_causes":"Iron deficiency, chronic disease","high_causes":"Iron overload, haemochromatosis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"CORT","name":"Cortisol","group":"HORMONES","result":"136","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2192","lower_normal":"94.9","upper_normal":"619.4","lower_optimal":"145.4","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4297","upper_optimal_position":"0.6064","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a strong circadian rhythm, peaking in the morning and falling throughout the day. Celina's cortisol is 136, which falls within the afternoon reference range (94.9 to 462.4) but below the morning reference floor (145.4). If this sample was taken in the morning, cortisol sitting below the morning threshold could reflect slightly suppressed adrenal output, which can contribute to fatigue and low stress resilience. However, a single cortisol reading is highly variable and should not be over-interpreted. If fatigue persists after thyroid optimisation, a morning cortisol repeat or cortisol day curve may be worth discussing with her GP.","low_causes":"Adrenal insufficiency, chronic stress (adrenal fatigue pattern), afternoon sampling","high_causes":"Acute stress, Cushing's syndrome, corticosteroid medication, morning sampling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"198","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3953","upper_optimal_position":"0.6031","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In a perimenopausal woman on HRT, this level reflects the replacement dose rather than natural production. Celina's oestradiol is 198, which is above the post-menopausal ceiling of 118.2 and within the follicular range. This confirms that her HRT is providing meaningful oestrogen replacement. Whether the level is optimal for symptom control depends on how she feels, and can be discussed with her HRT prescriber.","low_causes":"Menopause, ovarian failure, HRT dose insufficient","high_causes":"HRT, pregnancy, ovarian cysts, obesity (aromatase conversion)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PROG","name":"Progesterone","group":"HORMONES","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4138","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone involved in the menstrual cycle and pregnancy. In a perimenopausal or post-menopausal context, low progesterone is expected. Celina's progesterone is 0.48, within the post-menopausal range of 0 to 2.32. If her HRT regimen includes cyclical progesterone, this level would depend on when in the cycle the blood was drawn. This can be discussed with her HRT prescriber if she has symptoms such as sleep disruption that progesterone might help address.","low_causes":"Perimenopause, menopause, anovulatory cycle","high_causes":"Pregnancy, luteal phase, HRT with progesterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FSH","name":"FSH","group":"HORMONES","result":"33.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"3.4","upper_normal":"116.3","lower_optimal":"3.4","upper_optimal":"116.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"FSH (follicle-stimulating hormone) is produced by the pituitary gland to stimulate the ovaries. As the ovaries produce less oestrogen during perimenopause, FSH rises. Celina's FSH is 33.6, which sits above the mid-cycle peak range and in the lower part of the post-menopausal range (23 to 116.3). This is consistent with perimenopause. Despite being on HRT, FSH remains elevated because HRT does not fully suppress pituitary signalling in the way natural ovarian function would.","low_causes":"HRT (partial suppression), pregnancy, pituitary disease","high_causes":"Perimenopause, menopause, ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"LH","name":"Luteinising Hormone","group":"HORMONES","result":"10.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.5","upper_normal":"54","lower_optimal":"0.5","upper_optimal":"54","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"LH (luteinising hormone) works alongside FSH to regulate the reproductive cycle. In perimenopause, LH typically rises but often lags behind FSH. Celina's LH is 10.14, within the follicular/luteal range and consistent with her perimenopausal status and HRT use.","low_causes":"HRT, pituitary disease","high_causes":"Menopause, perimenopause, PCOS (if ratio to FSH is altered)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TEST","name":"Testosterone","group":"HORMONES","result":"2.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5714","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4127","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women plays a role in libido, energy, muscle maintenance, bone density and mood. Celina's total testosterone is 2.2, within the laboratory range of 0.5 to 2.6. However, with an SHBG of 91.3, most of this testosterone is bound and unavailable to tissues. The calculated free testosterone of 0.02 confirms that very little is biologically active. This may contribute to her fatigue and difficulty maintaining energy and muscle. Testosterone supplementation can be discussed with her HRT prescriber.","low_causes":"Menopause, adrenal insufficiency, high SHBG","high_causes":"PCOS, adrenal hyperplasia, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FTEC","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.02","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0.005","upper_normal":"0.06","lower_optimal":"0.015","upper_optimal":"0.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4242","upper_optimal_position":"0.6061","units":"nmol/l","description":"Free testosterone is the fraction not bound to proteins and therefore available to enter cells and exert biological effects. It is a more meaningful measure than total testosterone. Celina's free testosterone is 0.02, within the laboratory range but in the lower half. Given her SHBG of 91.3, a high proportion of her total testosterone is being bound, leaving limited free hormone for tissues. This is relevant to her symptoms of fatigue and hair thinning.","low_causes":"High SHBG, menopause, low total testosterone","high_causes":"PCOS, low SHBG, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FAI","name":"Free Androgen Index","group":"HORMONES","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4393","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.5","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is calculated as (total testosterone / SHBG) x 100 and provides another way to estimate biologically available androgen. Celina's FAI is 2.41, within range. While it appears adequate as a ratio, the very low absolute free testosterone of 0.02 nmol/L is the more clinically relevant measurement.","low_causes":"High SHBG, low testosterone, menopause","high_causes":"PCOS, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"SHBG","name":"SHBG","group":"HORMONES","result":"91.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5123","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4361","upper_optimal_position":"0.5746","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to sex hormones, particularly testosterone, and makes them unavailable to tissues. Higher SHBG means less free, biologically active hormone. Celina's SHBG is 91.3, within the laboratory range but above the optimal ceiling of 80. This elevated SHBG is binding most of her testosterone. Oestrogen (including from HRT) can raise SHBG, as can thyroid medication. This is clinically relevant because it reduces the amount of testosterone available for energy, muscle maintenance and hair growth.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism","high_causes":"Oral oestrogen (HRT), hyperthyroidism, levothyroxine, liver disease, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"DHEA","name":"DHEA Sulphate","group":"HORMONES","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3456","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4954","upper_optimal_position":"0.5498","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. Celina's DHEA-S is 1.0 umol/L (approximately 368.5 micrograms per decilitre), within the laboratory range but on the lower side and below the optimal floor. Low DHEA-S can contribute to reduced energy and is consistent with her lower cortisol, both suggesting the adrenal glands may not be producing at full capacity.","low_causes":"Aging, adrenal insufficiency, chronic stress","high_causes":"Adrenal hyperplasia, PCOS, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PROL","name":"Prolactin","group":"HORMONES","result":"168","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"619","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In non-pregnant, non-breastfeeding women, elevated prolactin can indicate pituitary issues or medication effects. Celina's prolactin is 168, well within the non-pregnant reference range of 59 to 619 and unremarkable.","low_causes":"","high_causes":"Pituitary adenoma, medications, stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"TSH","name":"TSH","group":"THYROID","result":"1.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3883","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4393","upper_optimal_position":"0.5457","units":"mIU/l","description":"TSH (thyroid-stimulating hormone) is produced by the pituitary gland to instruct the thyroid to make thyroid hormones. In someone taking levothyroxine, TSH reflects whether the replacement dose is providing enough T4 to satisfy the pituitary. Celina's TSH is 1.25, within the optimal range of 1.0 to 2.5, suggesting her levothyroxine dose is well calibrated from the pituitary's perspective. However, TSH alone does not tell us whether enough T4 is being converted to the active T3 in tissues.","low_causes":"Excess thyroid medication, hyperthyroidism, pituitary disease","high_causes":"Insufficient thyroid medication, hypothyroidism, thyroid autoimmunity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FT4","name":"Free T4","group":"THYROID","result":"13.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4479","upper_optimal_position":"0.5894","units":"pmol/l","description":"Free T4 (thyroxine) is the inactive storage form of thyroid hormone that circulates in the blood. It must be converted to Free T3 before it can enter cells and drive metabolism. Celina's Free T4 is 13.9, within the laboratory range of 11.5 to 22.7 but below the optimal floor of 14. For someone on levothyroxine, this is in the lower quarter of the range, suggesting that either the dose could be slightly higher or that T4 is being consumed quickly as the body tries to convert it to T3.","low_causes":"Insufficient levothyroxine dose, poor conversion to T3, poor absorption","high_causes":"Excessive levothyroxine dose, hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FT3","name":"Free T3","group":"THYROID","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3704","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6074","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that enters cells and drives metabolism, energy production, heat generation, hair growth, brain function and sleep regulation. Celina's Free T3 is 3.8 against a range of 2.6 to 7.1, placing it in the bottom third and well below the optimal floor of 4.5. This is the most clinically significant finding in the thyroid panel. Because levothyroxine provides only T4, the body must convert T4 to T3 using deiodinase enzymes that require selenium, zinc and iron. If conversion is poor, the pituitary gland (which sees T4) may be satisfied (hence the normal TSH), while the tissues are functionally under-supplied with active hormone. Low Free T3 is directly associated with fatigue, sleep disruption, hair thinning and difficulty losing weight, all symptoms Celina reports.","low_causes":"Poor T4-to-T3 conversion, selenium/zinc/iron deficiency, chronic illness, calorie restriction, stress","high_causes":"Hyperthyroidism, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies that attack thyroid peroxidase, an enzyme the thyroid needs to produce hormones. Positive TPO antibodies indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Celina's TPO antibodies are below 6.6, which is negative and below the threshold of 13.8. This is reassuring and means there is no current autoimmune attack on her thyroid, even though she has established hypothyroidism. Her hypothyroidism may be non-autoimmune in origin, or antibodies may have been positive in the past and have since declined.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"THY","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are autoantibodies that target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, they indicate autoimmune thyroid disease when elevated. Celina's thyroglobulin antibodies are below 1.3, which is negative. More than 80% of the population have undetectable levels. This confirms no current autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"VIDC","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3875","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation and muscle function. It is produced in the skin from sunlight and is also obtained from food and supplements. After gastric bypass, vitamin D absorption is significantly impaired because the duodenum and proximal jejunum, where most vitamin D is absorbed, are bypassed. Celina's vitamin D is 93 nmol/L, within the optimal range of 75 to 120. Maintaining this level after gastric bypass is a genuine achievement and shows her supplementation is working well.","low_causes":"Insufficient sunlight, malabsorption, gastric bypass, obesity, dark skin","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"B12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"309","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3814","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5563","upper_optimal_position":"0.5960","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. After gastric bypass, B12 absorption is severely impaired because the procedure removes access to intrinsic factor, a protein made in the stomach that is needed to absorb B12 in the small intestine. Celina's total B12 is 309, within the laboratory range of 193 to 982 but below the optimal floor of 500. However, her Active B12 (holotranscobalamin) is 227.7, which is above range, confirming that B12 is reaching her cells effectively despite the lower total level. The total B12 includes both active and inactive forms, so the active level is the more meaningful measure.","low_causes":"Malabsorption, gastric bypass, vegan diet, pernicious anaemia","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"AB12","name":"Active B12 (Holotranscobalamin)","group":"VITAMINS & NUTRIENTS","result":"227.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"25.1","upper_normal":"165","lower_optimal":"70","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6548","upper_optimal_position":"0.6666666667","units":"pmol/L","description":"Active B12 (holotranscobalamin) measures only the fraction of B12 that is bound to transcobalamin II and is therefore available for cellular uptake. It is a more reliable marker of B12 status than total B12. Celina's Active B12 is 227.7, above the upper limit of 165. In the context of B12 supplementation after gastric bypass, this is an expected and reassuring finding. It confirms that her supplementation is delivering B12 in a form that cells can use. Elevated Active B12 from supplementation is not harmful and does not require dose reduction.","low_causes":"B12 deficiency, malabsorption, pernicious anaemia","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"FOLA","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5714","upper_optimal_position":"0.6666666667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and methylation. Celina has a confirmed MTHFR gene variant, which means her body has reduced ability to convert standard folic acid into the active form (5-MTHF). She supplements with 5-MTHF directly, and her folate is 17, at the top of the range and within the optimal zone. This confirms her supplementation strategy is working perfectly for her genetic variant.","low_causes":"Poor diet, malabsorption, gastric bypass, medications, alcohol","high_causes":"Supplementation, high folate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"PTH","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4720","upper_optimal_position":"0.5387","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones, increase gut absorption and reduce kidney excretion. After gastric bypass, PTH can rise if calcium absorption is impaired. Celina's PTH is 3.5, within the optimal range, and her corrected calcium is 2.34, also within range. This confirms that her calcium metabolism is well balanced despite the absorptive challenges of gastric bypass.","low_causes":"Excess calcium or vitamin D, post-thyroid surgery","high_causes":"Hyperparathyroidism, vitamin D deficiency, calcium deficiency, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"109","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"170","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4190","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle tissue. It rises when muscles are damaged, whether from exercise, injury or disease. Celina's CK is 109, within range and consistent with her current training load of twice per week.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5035","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"IgG is the most abundant antibody in the blood and provides long-term immune protection against infections the body has previously encountered. Celina's IgG is 10, within the normal range of 6.5 to 16 and indicating adequate humoral immunity.","low_causes":"Immune deficiency, malnutrition, medications","high_causes":"Chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"IGM","name":"IgM","group":"IMMUNOLOGY","result":"0.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"IgM is the first antibody produced by the immune system when it encounters a new infection. It provides early-stage defence before IgG takes over for longer-term protection. Celina's IgM is 0.4, marginally below the lower limit of 0.5. Isolated, mildly low IgM is common and usually not clinically significant unless the patient experiences frequent or unusual infections. Her IgG and IgA are both normal, which means the other arms of her antibody defence are intact.","low_causes":"Normal variation, medications, immune deficiency syndromes","high_causes":"Acute infection, autoimmune disease, lymphoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"IGA","name":"IgA","group":"IMMUNOLOGY","result":"2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"IgA is the antibody found in mucosal surfaces including the gut, respiratory tract and urinary tract. It provides front-line defence against pathogens at entry points. Celina's IgA is 2, within range. Normal IgA is also required for the coeliac screen (tissue transglutaminase IgA) to be reliable, and her coeliac screen is negative.","low_causes":"Selective IgA deficiency (common, usually benign), medications","high_causes":"Chronic infection, liver disease, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"IGE","name":"IgE","group":"IMMUNOLOGY","result":"22.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1110","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2500","units":"IU/ml","description":"IgE is the antibody involved in allergic responses and parasitic defence. Elevated IgE suggests allergic sensitisation or parasitic infection. Celina's IgE is 22.2, well within range and suggesting no significant allergic burden.","low_causes":"Immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infection","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"RF","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor is an autoantibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Celina's rheumatoid factor is 7, within the normal range and negative for autoimmune rheumatic disease.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infections","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ca1","name":"CA-125","group":"TUMOR MARKERS","result":"6.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1000","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer but also in many benign function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

  setTimeout(()=>animateBarsIn(document), 200);
}
