n":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle and nerve function, and sleep regulation. Sophie's result of 0.96 is within the ideal band of 0.85 to 1.05. Despite this healthy blood level, supplemental magnesium glycinate before bed can still improve sleep quality and reduce the tingling sensations she reports in her feet.","low_causes":"Alcohol, diuretics, poor diet, chronic diarrhoea, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2333","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood and energy. Sophie's level of 56 nmol/L is above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. At a BMI of 30, fat tissue sequesters vitamin D, meaning she needs a higher supplementation dose than a lean person to achieve the same blood level. Post-menopause, adequate vitamin D is critical for bone density, and her ALP of 96 suggests bone turnover is already increased. Supplementing with 4,000 IU of vitamin D3 daily, with a fat-containing meal, should bring this into the 80 to 100 range within three to four months.","low_causes":"Limited sun exposure, darker skin, obesity (fat sequesters it), malabsorption, northern latitude, ageing","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"1.463","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3617","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3378","upper_optimal_position":"0.5049","units":"pmol/L","description":"PTH (parathyroid hormone) is released by the parathyroid glands to regulate calcium and phosphate levels. When calcium drops, PTH rises to pull calcium from bone and increase its absorption. Sophie's PTH of 1.46 is low-normal, indicating the parathyroid glands are not being stressed. This is reassuring given her adequate calcium and means there is no compensatory bone breakdown occurring.","low_causes":"High calcium, hypoparathyroidism, magnesium deficiency (severe)","high_causes":"Low calcium, vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"507","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4665","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6152","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Sophie's level of 507 pg/mL is within the ideal range of 500 to 900. This rules out B12 deficiency as a cause of her fatigue and tingling feet, which is particularly important because B12 deficiency is one of the most common reversible causes of peripheral nerve symptoms.","low_causes":"Vegetarian/vegan diet, malabsorption (coeliac, Crohn's, gastric surgery), pernicious anaemia, medications (metformin, PPIs), ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is needed for DNA synthesis, red blood cell production and methylation, a key process in detoxification and mood regulation. Sophie's folate of 13 ng/mL is within the ideal range, indicating good dietary intake of green vegetables, legumes or fortified foods.","low_causes":"Poor dietary intake, alcohol, malabsorption, pregnancy, medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5988","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures all the cholesterol in the blood, including LDL, HDL and VLDL. Sophie's total cholesterol of 6.2 is above the desirable threshold of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk because it includes the protective HDL. Sophie's very high HDL of 2.4 accounts for a large portion of the total, which is why her TC/HDL ratio of 2.58 is actually very favourable. The focus should be on reducing the LDL and ApoB components rather than total cholesterol.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Dietary saturated fat, genetic predisposition, hypothyroidism, menopause, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2471","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and sugar intake. Sophie's triglycerides of 0.84 are excellent, well within the ideal range of below 1.0 mmol/L. Low triglycerides combined with high HDL is one of the most favourable metabolic signatures and confirms healthy carbohydrate and fat metabolism.","low_causes":"Malnutrition, malabsorption, hyperthyroidism","high_causes":"High sugar/refined carbohydrate intake, alcohol, obesity, insulin resistance, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2436","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. Sophie's VLDL of 0.38 is well within the ideal range, consistent with her excellent triglyceride level and healthy insulin sensitivity.","low_causes":"Low fat diet, malabsorption","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol removes excess cholesterol from artery walls and returns it to the liver for processing. Higher HDL is better. Sophie's HDL of 2.4 is exceptionally high, well above the ideal threshold of 1.6 for women. This is one of the strongest protective factors in her lipid panel and significantly mitigates the risk from her elevated LDL. Very high HDL is often partly genetic and partly driven by healthy triglyceride metabolism.","low_causes":"Sedentary lifestyle, smoking, obesity, high refined carbohydrate intake, metabolic syndrome","high_causes":"Genetics, regular exercise, moderate alcohol consumption, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is the primary carrier of cholesterol into artery walls, where it can accumulate and form plaques over decades. Sophie's LDL of 3.48 is above the target of 3.0 and above the optimal target of 2.6. Post-menopausal oestrogen decline is a significant contributor, as oestrogen helps the liver clear LDL particles. The Lp(a)-corrected LDL of 3.4 confirms that almost all of this elevation is modifiable through diet and lifestyle. Increasing soluble fibre, oily fish and plant sterols while reducing saturated fat can reduce LDL by 10 to 20%.","low_causes":"Hyperthyroidism, malabsorption, liver disease, malnutrition","high_causes":"Dietary saturated fat, genetic predisposition, hypothyroidism, menopause, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2867","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a more meaningful picture of cardiovascular risk than total cholesterol alone. Sophie's ratio of 2.58 is excellent, well below the target of 4.5 and within the ideal band. This very favourable ratio is driven by her exceptionally high HDL of 2.4.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.475","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the atherogenic (artery-damaging) cholesterol in one number. Sophie's non-HDL of 3.8 is within the laboratory range of below 4.0 but above the optimal threshold of 3.4. This is consistent with the LDL and ApoB findings and would benefit from the same dietary intervention.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High LDL, elevated triglycerides, menopause, dietary saturated fat","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7393","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein on HDL particles. Higher levels reflect more HDL particles and greater cholesterol removal capacity. Sophie's ApoA1 of 2.07 is excellent and consistent with her very high HDL. This is a genuinely protective finding.","low_causes":"Metabolic syndrome, smoking, sedentary lifestyle, familial hypoalphalipoproteinaemia","high_causes":"Genetics, exercise, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is the protein found on every LDL, VLDL and Lp(a) particle. Because each particle carries exactly one ApoB molecule, the ApoB level is a direct count of the number of atherogenic particles in the blood. It is considered the single best blood marker of cardiovascular risk. Sophie's ApoB of 1.01 is above the target of 0.9 and above the optimal target of 0.8, classified as borderline high. This means there are more cholesterol-carrying particles in her blood than ideal, and each one has the potential to enter an artery wall. The good news is that her Lp(a) is normal, meaning this elevation is entirely modifiable through diet. Increasing soluble fibre, omega-3 and plant sterols while reducing saturated fat should bring this below 0.9.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"High saturated fat diet, genetic hyperlipidaemia, hypothyroidism, menopause, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio summarises the balance between atherogenic (artery-damaging) and protective lipoproteins in a single number. Sophie's ratio of 0.49 is within the lower risk category of below 0.6 and within the optimal band of below 0.5 (female threshold). This means that despite the elevated ApoB, her exceptionally high ApoA1 and HDL provide a strong counterbalance. The ratio gives a more nuanced picture of cardiovascular risk than LDL alone.","low_causes":"High HDL, low LDL, healthy metabolic profile","high_causes":"High LDL/ApoB, low HDL/ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle similar to LDL but with an extra protein attached. It deposits cholesterol in artery walls, promotes clotting and drives inflammation. Unlike LDL, Lp(a) cannot be changed by diet, exercise or most medications, so the result is essentially permanent and should be recorded in Sophie's medical notes. Her Lp(a) is below 25 nmol/L, which is normal and below the risk threshold of 32. This is genuinely useful information because it confirms that her elevated LDL and ApoB are driven entirely by modifiable factors such as diet, body composition and post-menopausal hormonal changes, and should respond well to lifestyle intervention.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4114","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6048","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle and heart tissue, released into the blood when these tissues are damaged. Sophie's CK of 64 is within the ideal range, indicating no muscle damage or excessive breakdown. With no resistance training currently, this is expected.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, rhabdomyolysis, muscle injury, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6190","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3929","upper_optimal_position":"0.5833","units":"pmol/l","description":"Free T4 (thyroxine) is the inactive thyroid hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in tissues. Sophie's FT4 of 21 is within the reference range and towards the upper end, indicating the thyroid is producing plenty of hormone. Combined with a healthy TSH, this is a well-functioning thyroid.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, medication effects","high_causes":"Hyperthyroidism, thyroiditis, excessive levothyroxine, iodine excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4914","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4933","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how hard to work. A high TSH means the thyroid is underperforming; a low TSH means it is overproducing. Sophie's TSH of 2.56 is within the reference range of 0.55 to 4.78 and just marginally above the optimal band of 1.0 to 2.5. At 2.56, this is functionally normal and does not suggest thyroid underactivity, particularly given the healthy FT4 and FT3 levels.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, recovery from illness, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy production, body temperature and brain function. Sophie's FT3 of 5.6 is comfortably within the ideal range of 4.5 to 6.5 pmol/L. This is the most clinically meaningful thyroid marker for symptoms, and the fact that it is healthy helps rule out thyroid dysfunction as a cause of her fatigue.","low_causes":"Hypothyroidism, low T4-to-T3 conversion, calorie restriction, illness (sick euthyroid syndrome)","high_causes":"Hyperthyroidism, T3-dominant thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies that attack the thyroid's own enzyme, thyroid peroxidase. Elevated levels indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Sophie's result is below 6.6, which is negative, ruling out autoimmune thyroid disease as a cause of her symptoms.","low_causes":"No autoimmune thyroid activity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. Elevated levels can indicate autoimmune thyroid disease. Sophie's result is below 1.3, which is undetectable, consistent with the more than 80% of the population who have no thyroglobulin antibodies. This further confirms no autoimmune thyroid disease.","low_causes":"No autoimmune thyroid activity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.267","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4227","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio indicates how efficiently the body converts inactive thyroid hormone (T4) into the active form (T3). Sophie's ratio of 0.267 is within the reference range of 0.2 to 0.45 but just below the optimal band of 0.27 to 0.4. This is a borderline result and clinically the thyroid appears to be converting adequately, given the FT3 of 5.6 is well within the ideal range. No action needed.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.0176","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker used primarily in the context of pancreatic cancer monitoring, though it can be mildly elevated in a number of benign conditions. Sophie's result of 1.3 is very low and well within range, providing reassurance.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, bile duct obstruction, pancreatitis, liver disease, ovarian cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1609","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a protein that can be elevated in certain cancers, particularly bowel cancer, as well as in smokers and some benign conditions. Sophie's CEA of 0.74 is well within the non-smoker reference range of 0 to 2.3, providing reassurance.","low_causes":"Normal finding","high_causes":"Colorectal cancer, smoking, inflammatory bowel disease, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"8.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1435","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer and a range of benign conditions including endometriosis, fibroids and pelvic inflammation. Sophie's result of 8.9 is well within the reference range of below 31, providing reassurance.","low_causes":"Normal finding","high_causes":"Ovarian cancer, endometriosis, pelvic inflammatory disease, pregnancy, menstruation, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"10.15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1692","lower_normal":"0","upper_normal":"30","lower_optimal":"0" ions","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4409","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the antibody that protects mucous membranes in the gut, lungs and urinary tract. Sophie's IgA of 1.4 is within the reference range, indicating healthy mucosal immunity. Adequate IgA is also a prerequisite for the tissue transglutaminase coeliac test to be reliable, and Sophie's IgA level confirms the negative coeliac result is valid.","low_causes":"Selective IgA deficiency (common, usually benign), immunodeficiency","high_causes":"Liver disease, autoimmune conditions, chronic infection, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"20.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1015","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"IgE is the antibody associated with allergic responses and parasite defence. Sophie's IgE of 20.3 is well within the reference range of below 100, indicating no significant allergic activation.","low_causes":"Normal finding, immunodeficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, certain immune disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2857","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor is an autoantibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Sophie's result of 8 IU/mL is within the reference range of below 14, which is negative and argues against rheumatoid arthritis.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease, ageing (low-level positivity)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"Negative","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune reaction to gluten that damages the lining of the small intestine and can cause fatigue, bloating, malabsorption and anaemia. Sophie's result is negative at 0.395 CU (threshold below 7.19), conclusively ruling out coeliac disease as a contributor to her symptoms. Her IgA level of 1.4 confirms this is a valid result (IgA deficiency can cause false negatives).","low_causes":"Normal (no coeliac disease)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7128","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the overall capacity of blood to neutralise free radicals and oxidative stress. Sophie's result of 1.95 is above the reference range of 1.3 to 1.77. Elevated TAA is almost always driven by dietary antioxidant intake from tea, coffee, fruit, vegetables or supplements, and is not a concern. In fact, it reflects good antioxidant intake and capacity. No action is needed.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"High antioxidant dietary intake (tea, coffee, fruit, vegetables), antioxidant supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"536","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5531","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5361","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning and declining through the day. Sophie's morning cortisol of 536 is within the reference range of 145.4 to 619.4 but sits in the upper third, above the optimal band of 200 to 450. In the context of her reported overuse of caffeine, poor sleep and fatigue, this elevated cortisol is consistent with a stressed system running on stimulants. Caffeine directly stimulates cortisol release, and poor sleep prevents the normal overnight cortisol reset. Reducing caffeine intake and improving sleep quality should help lower cortisol into the optimal range.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, long-term steroid use","high_causes":"Stress, "one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"29.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3625","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and stimulates the ovaries. In post-menopausal women, LH rises because the pituitary produces more in an attempt to stimulate ovaries that are no longer responding. Sophie's LH of 29.76 is within the post-menopausal range of 15.9 to 54, confirming post-menopausal status.","low_causes":"Pituitary disease, hormonal contraception, hypothalamic amenorrhoea","high_causes":"Menopause, premature ovarian failure, PCOS (mildly), pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"100.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6137","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and stimulates the ovaries to produce eggs and oestrogen. In post-menopausal women, FSH rises significantly because the pituitary is trying harder to stimulate ovaries that no longer respond. Sophie's FSH of 100.26 is well within the post-menopausal range of 23 to 116.3 and confirms established post-menopausal status.","low_causes":"Pituitary disease, hormonal contraception, pregnancy, hypothalamic amenorrhoea","high_causes":"Menopause, premature ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3762","upper_optimal_position":"0.5476","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands. It supports energy, motivation, muscle maintenance, bone density and libido. Sophie's testosterone of 0.5 sits at the very bottom of the female reference range of 0.5 to 2.6, at the lower boundary. Combined with a free testosterone below range, this suggests her tissues have very little testosterone available. Post-menopausal testosterone decline is common but can contribute significantly to fatigue, difficulty maintaining muscle mass, low motivation and difficulty losing weight. Testosterone cream is available on prescription for post-menopausal women and is worth discussing with her GP.","low_causes":"Menopause, adrenal insufficiency, pituitary disease, oral contraceptive use, high SHBG","high_causes":"PCOS, congenital adrenal hyperplasia, ovarian or adrenal tumour, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3700","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index (FAI) estimates the proportion of testosterone that is biologically active by factoring in SHBG levels. Sophie's FAI of 0.72 is within the reference range but below the optimal band of 1.0 to 4.0, confirming that a very small proportion of her already-low testosterone is available for use by tissues. This is consistent with the below-range free testosterone and the high SHBG of 72.4.","low_causes":"High SHBG, low testosterone, menopause, thyroid dysfunction","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3519","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3495","upper_optimal_position":"0.5517","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to testosterone and oestrogen. Sophie's DHEA-S of 0.5 umol/L (184 ug/dL) is within the wide reference range but sits low. DHEA-S naturally declines with age, and at 57 a level at the lower end is common. However, combined with the bottom-of-range testosterone and below-range free testosterone, it contributes to the picture of low androgen availability post-menopause.","low_causes":"Ageing (natural decline), adrenal insufficiency, chronic illness, steroid use","high_causes":"PCOS, adrenal tumour, congenital adrenal hyperplasia, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"182","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4554","lower_normal":"38","upper_normal":"430","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3686","upper_optimal_position":"0.6157","units":"uIU/ml","description":"Prolactin is a hormone primarily associated with breast milk production but also influences immune function, mood and reproductive health. Sophie's prolactin of 182 is within the post-menopausal reference range of 38 to 430 and within the ideal band. This is a healthy finding with no sign of pituitary overproduction.","low_causes":"Dopamine agonist medications, pituitary hypofunction","high_causes":"Pituitary tumour (prolactinoma), medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"72.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4593","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3666","upper_optimal_position":"0.5350","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein that binds to testosterone and oestradiol, making them unavailable to tissues. Sophie's SHBG of 72.4 is within the reference range and within the optimal band. However, in the context of a total testosterone of just 0.5, the SHBG is binding most of what little testosterone is available, resulting in a free testosterone below range. Higher SHBG is common in leaner women and in post-menopausal women with good insulin sensitivity.","low_causes":"Insulin resistance, PCOS, obesity, hypothyroidism, androgens","high_causes":"Ageing, oestrogen therapy, hyperthyroidism, liver disease, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.005","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1667","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.01","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"nmol/l","description":"Free testosterone is the small fraction of total testosterone not bound to proteins, making it available to act on tissues. Sophie's free testosterone of 0.005 nmol/L is below the lower limit of 0.01. With total testosterone at the floor and SHBG binding most of it, virtually no testosterone is available to her muscles, brain and bones. This is the most clinically significant hormonal finding in the report and connects directly to Sophie's symptoms of fatigue, difficulty losing weight and feeling unable to get back on track. Testosterone replacement therapy using a transdermal cream is available for post-menopausal women and could be discussed with her GP.","low_causes":"High SHBG, low total testosterone, menopause, adrenal insufficiency","high_causes":"PCOS, low SHBG, exogenous testosterone, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3758","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and testosterone loosely bound to albumin, representing the portion of testosterone that can enter cells and exert its effects. Sophie's bioavailable testosterone of 0.12 sits right at the lower boundary of the optimal range of 0.12 to 0.55. While technically within the ideal band, it is at the absolute floor, and in conjunction with the below-range free testosterone, it confirms that very little testosterone is available to support energy, muscle maintenance and recovery.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"0.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol not bound to proteins. Sophie's index of 0.59 is reported for context and is consistent with her post-menopausal status, where both oestradiol and the free fraction are very low.","low_causes":"Menopause, high SHBG","high_causes":"Ovarian stimulation, HRT, obesity","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"6","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity or alkalinity of the urine. A pH of 6 is slightly acidic, which is within the normal range of 4.5 to 8. Normal urine pH varies throughout the day depending on diet and hydration.","low_causes":"High protein diet, dehydration, metabolic acidosis","high_causes":"Vegetarian diet, urinary tract infection, renal tubular acidosis, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineprotein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Protein in the urine can indicate kidney damage or disease. Sophie's result is negative, confirming he   if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
