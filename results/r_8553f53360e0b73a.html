<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Sophie Johnson","dob":"31/01/1969","report_date":"2026-09-28","summary":"Sophie is a 57-year-old post-menopausal female presenting with a BMI of 30.2, following a standard mixed diet rated 6 out of 10 for quality with a volume of 6 out of 10. She trains twice per week with cardio only and no resistance training, averaging 2,000 to 5,000 daily steps. She reports overuse of caffeine or energy drinks. She describes low energy, poor sleep, weight gain, tingling feet at night, and occasional dizziness on standing in the morning. Her goals are to improve energy levels, lose body fat, and improve long-term health and longevity. She is post-menopausal and trying to get back on track.\n\nThe finding in this report that should be discussed with her GP first is the urine result. Sophie's urine white blood cells are 90 per microlitre, well above the threshold of 10, and her red blood cells are 40 per microlitre, above the threshold of 25. Despite this, the urine culture showed no bacterial growth and nitrites were negative. White blood cells in the urine at this level indicate inflammation somewhere in the urinary tract. Red blood cells at 40, at age 57, need to be taken seriously because microscopic haematuria (blood in the urine not visible to the eye) in a post-menopausal woman warrants investigation to rule out bladder and kidney causes. It is possible that both findings share a single explanation, such as a low-grade urinary tract inflammation or irritation, but the GP should arrange a repeat midstream urine on a fresh sample, and if the red blood cells persist, a referral for urological assessment including imaging and cystoscopy is the standard pathway. This is not a reason for alarm, but it does need investigation.\n\nTurning to the positives, and there are many worth highlighting. Sophie's metabolic health is genuinely impressive for a BMI of 30.2 and is one of the strongest aspects of this report. Her fasting glucose is 5.1, comfortably within the ideal range. Her fasting insulin is 4.39, which is low and healthy, and her HOMA-IR, a measure of how resistant the body's cells are to insulin, is 0.97, which falls into the insulin-sensitive category. At a BMI of 30 with weight gain as a symptom, finding excellent insulin sensitivity is a real positive and means the weight gain is not being driven by metabolic dysfunction. Her HbA1c, a measure of average blood sugar over the past three months, is 38 mmol per mol, within the healthy range and showing no drift towards pre-diabetes. Her C-peptide, which reflects how much insulin the pancreas is producing, is 1.11 micrograms per litre (367 pmol/L), sitting right at the bottom of range, consistent with a pancreas that simply does not need to produce much insulin because her tissues respond to it efficiently.\n\nHer kidney function is solid. Cystatin C, a protein filtered by the kidneys that gives a more reliable measure of kidney function than creatinine alone, is 0.94, and the combined eGFR from both creatinine and cystatin C is 92, which is good for 57. Her electrolytes, sodium, potassium, chloride and bicarbonate, are all well balanced. Her uric acid at 325 is within range. Her calcium and corrected calcium are both healthy, and her parathyroid hormone (PTH), the hormone that regulates calcium and bone metabolism, is 1.46 pmol/L, sitting comfortably within range. Phosphate and magnesium are both within their ideal bands, magnesium at 0.96 falling nicely between 0.85 and 1.05.\n\nHer thyroid is working well. TSH (thyroid stimulating hormone, the signal from the brain telling the thyroid how hard to work) is 2.56, within range. Free T4, the inactive thyroid hormone, is 21, towards the upper end of the reference range and within the ideal band. Free T3, the active thyroid hormone that drives energy and metabolism, is 5.6, comfortably in the ideal zone. Her FT3 to FT4 ratio is 0.267, right at the border of optimal, indicating the thyroid is converting T4 to T3 adequately. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease as a cause of her fatigue. This is important because thyroid problems are one of the most common explanations for tiredness in post-menopausal women, and Sophie's thyroid has been comprehensively cleared.\n\nHer liver markers are mostly reassuring. Total protein, albumin and globulin are all well placed. Bilirubin is 8, healthy. AST at 27 is clean. The FIB-4 score, a calculation that screens for liver scarring using age, platelets, AST and ALT, is 0.95, well within the safe zone. The APRI and NAFLD fibrosis scores both confirm no sign of liver fibrosis. Amylase and lipase, the two pancreatic enzymes, are both within range, ruling out pancreatic inflammation.\n\nHer iron studies paint a healthy picture. Ferritin, the body's iron store, is 122, within the ideal range for women of 40 to 150. Serum iron is 16, transferrin is 2.58, and iron binding capacity is 59.9, all within range. Transferrin saturation at 24.69% is just below the optimal band of 25 to 40%, but only marginally so, and clinically this is adequate.\n\nHer immune markers are reassuring. IgG, IgA, IgM and IgE are all within range, showing no sign of immune deficiency or allergic activation. Rheumatoid factor is negative. Tissue transglutaminase IgA is negative, which rules out coeliac disease as a contributor to her symptoms. Her inflammation is well controlled: hs-CRP (high-sensitivity C-reactive protein, a marker of systemic inflammation) is 0.8, below the ideal threshold of 1.0, which at a BMI of 30.2 is a genuinely encouraging finding. All four tumour markers tested, CA125, CA15-3, CA19-9 and CEA, are well within their reference ranges, providing reassurance across the screening panel. Creatine kinase at 64 is healthy.\n\nHer total antioxidant activity (TAA) at 1.95 is above the laboratory range of 1.3 to 1.77. This is almost always driven by dietary antioxidants, tea, coffee, fruit and vegetables, or supplementation, and is not a concern. If anything, it reflects good antioxidant intake.\n\nNow to the findings that explain more of the picture Sophie describes. Her lipid panel shows a pattern that needs attention. Total cholesterol is 6.2, above the desirable threshold of 5.18. LDL cholesterol (low-density lipoprotein, the particles that deposit cholesterol into artery walls) is 3.48, above the target of 3.0, and when corrected for her Lp(a) contribution, the modifiable LDL is still 3.4. ApoB (apolipoprotein B, a direct count of the number of cholesterol-carrying particles in the blood, and a better predictor of cardiovascular risk than LDL alone) is 1.01, above the target of 0.9 and classified as borderline high. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 45, above the threshold of 40, driven primarily by the ApoB and LDL. However, there is a very important counterbalance. Her HDL cholesterol (high-density lipoprotein, the particles that remove cholesterol from artery walls and return it to the liver) is 2.4, which is exceptionally high and genuinely protective. Her ApoA1, the protein on HDL particles, is 2.07, also excellent. Her ApoB to ApoA1 ratio is 0.49, well within the lower risk category of below 0.6, and her TC to HDL ratio is 2.58, which is very favourable. Her triglycerides at 0.84 are excellent. Her Lp(a), a genetically inherited lipoprotein that cannot be changed by diet or exercise, is below 25, which is normal and means her elevated LDL is driven entirely by modifiable factors, predominantly diet and post-menopausal hormonal changes. After menopause, the fall in oestrogen reduces the liver's ability to clear LDL particles from the blood, and it is common to see LDL rise by 10 to 15% in the years following menopause. The combination of high LDL alongside exceptionally high HDL means the overall picture is far from catastrophic, but the ApoB at 1.01 does indicate more atherogenic particles than ideal, and bringing this below 0.9 with dietary changes is a worthwhile goal.\n\nHer GGT (gamma-glutamyl transferase, a liver enzyme sensitive to metabolic strain, alcohol and bile duct pressure) is 40, marginally above the female reference range of 38. Her ALT at 37 is within the laboratory range of below 56 but above the optimal threshold for women of 25. Together, these suggest the liver is under a small amount of metabolic strain, likely related to the BMI of 30 and possibly the caffeine load. This is mild and does not indicate liver disease. The FIB-4, APRI and NAFLD fibrosis scores all confirm no scarring, and the De Ritis ratio (AST divided by ALT) at 0.73 is below the optimal band but consistent with a mildly fatty liver pattern rather than anything more serious. Weight loss of even 5 to 7 kilograms would be expected to normalise both GGT and ALT.\n\nHer ESR (erythrocyte sedimentation rate, a measure of how quickly red blood cells settle in a tube, used as a general marker of inflammation) is 14, above the threshold of 12 for women. At 57, an ESR of 14 is very mildly elevated and is a non-specific finding. Her hs-CRP is 0.8, which argues against any significant systemic inflammation, so the ESR is most likely reflecting age rather than active disease.\n\nHer full blood count shows a few findings that warrant explanation. Her white blood cell count is 3.96, fractionally below the lower limit of 4.0, and her neutrophils (the most abundant white blood cell type, responsible for fighting bacterial infections) are 1.73, below the lower limit of 2.0. A white cell count of 3.96 with neutrophils of 1.73 is a pattern seen in a meaningful proportion of people and is termed benign ethnic neutropaenia in some populations, but in a white European woman it more likely reflects constitutional variation, viral suppression (a recent cold or virus can suppress the count for weeks), or low energy availability. Sophie's lymphocytes at 1.7 are healthy, her monocytes, eosinophils and basophils are all normal, and her hs-CRP is low, so there is no sign of active infection or immune compromise. This does not need immediate action, but it should be noted by the GP and rechecked at the next blood test to confirm it is Sophie's baseline rather than a temporary dip.\n\nHer absolute reticulocyte count (immature red blood cells freshly released from the bone marrow) is 41, below the lower limit of 50. Her reticulocyte percentage at 0.86% is within range, and her haemoglobin at 144 is healthy, so the bone marrow is producing enough red blood cells overall. A low absolute reticulocyte count with normal haemoglobin simply means the marrow is on low output because it does not need to produce more. This is consistent with good iron stores and no blood loss. Her MPV (mean platelet volume, a measure of the average size of platelets) is 10.6, above the range of 7.1 to 10.1. Marginally elevated MPV is a common finding and at this margin is usually laboratory variation or reflects slightly younger, more active platelets. It is not clinically significant in isolation.\n\nHer hormonal picture confirms post-menopausal status. FSH at 100.26 is well into the post-menopausal range, confirming the ovaries have stopped cycling. LH at 29.76 is consistent with this. Oestradiol is below 43 pmol/L, below the detection threshold and well within the post-menopausal range. Progesterone at 0.47 is within the post-menopausal range. Prolactin at 182 is within the post-menopausal range. These results are all expected and physiologically normal. However, her testosterone at 0.5 sits at the very bottom of the female range of 0.5 to 2.6, and her free testosterone, calculated at 0.005 nmol/L, is below the lower limit of 0.01. Her SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues) is 72.4, which is within the laboratory range but on the higher side, and this is what is binding most of her already-low testosterone. DHEA-S, the adrenal precursor to testosterone, is 0.5 micromol/L (184 micrograms per decilitre), at the lower end of the wide reference range. The clinical relevance of low free testosterone in post-menopausal women is fatigue, reduced motivation, difficulty building or maintaining muscle, low libido, and slow recovery from exercise. Several of Sophie's symptoms, her low energy, difficulty losing weight and general sense of being unable to get back on track, may be partly explained by this hormonal picture. This is worth discussing with her GP, particularly in the context of whether testosterone supplementation (available as a cream) might be appropriate alongside or separate from any HRT considerations.\n\nHer cortisol at 536 is within the morning reference range of 145.4 to 619.4 but sits in the upper third. Cortisol is the body's primary stress hormone, and a reading in the upper third is consistent with the high caffeine intake Sophie reports, with poor sleep quality, and with the \"wired but tired\" pattern that often accompanies both. It is not pathologically elevated, but it is not optimal, and the caffeine habit is very likely a contributor.\n\nHer vitamin D at 56 nmol/L is above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. At a BMI of 30, vitamin D is sequestered in fat tissue and higher supplementation doses are needed to reach the ideal range. Vitamin D plays a role in bone health (critical post-menopause), immune function, energy and mood, and bringing this into the 80 to 100 range should be a priority. Her B12 at 507 is within the ideal band. Folate at 13 is healthy.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 48, about 9 years younger than a calendar age of 57.\n\nSophie's bloods explain some of her symptoms but not all of them. The low free testosterone and post-menopausal hormone picture contribute to fatigue, difficulty with body composition and reduced drive. The mildly elevated cortisol pattern and caffeine dependency contribute to poor sleep and the wired-but-tired cycle. The sub-optimal vitamin D may contribute to tiredness and low mood. However, the tingling in her feet at night is not explained by anything in this panel. Her B12 is healthy at 507, her folate is 13, her glucose and HbA1c rule out diabetic neuropathy, and her kidney function is normal. The most common causes of tingling feet with normal bloods are positional (compression of nerves when lying still), peripheral small fibre neuropathy (which blood tests do not detect), restless legs (associated with iron status, which is healthy here), or simply poor circulation in the extremities. The dizziness on standing quickly, known as orthostatic hypotension, is common and is usually caused by blood pressure dropping momentarily when moving from lying to standing. Caffeine, poor sleep and mild dehydration all make it worse. Her GP should check her lying and standing blood pressure to confirm this is postural and benign. If the tingling persists, nerve conduction studies could be discussed.\n\nHer urea to creatinine ratio at 113 is above the reference range of 40 to 100. This can reflect mild dehydration, high protein intake relative to muscle mass, or simply a creatinine that sits low (61 in her case) because of smaller muscle mass. Given her other kidney markers are healthy, this is not a concern but does suggest she could benefit from drinking more water, particularly given the high caffeine intake which has a mild diuretic effect.","links":"The central theme in Sophie's results is the interaction between post-menopausal hormonal changes, body composition and cardiovascular risk. Oestrogen's decline after menopause has two direct metabolic consequences visible in this panel: LDL clearance by the liver slows, pushing LDL and ApoB above target, and testosterone, already low in women, falls further because the ovaries and adrenal glands produce less of it while SHBG remains relatively high, binding what little is produced. The low free testosterone connects directly to her symptoms of fatigue, difficulty losing weight and the sense of not being able to get back on track. The LDL and ApoB elevation connects to her goal of long-term health. Both are driven by the same hormonal transition.\n\nThe second thread is the caffeine, cortisol and sleep loop. Sophie reports overuse of caffeine, poor sleep, and low energy. Her cortisol at 536 sits in the upper third of the morning range, consistent with a system running on stimulants rather than rest. Caffeine blocks adenosine, the molecule that builds sleep pressure, so high caffeine intake, especially after midday, delays and fragments sleep. Poor sleep raises cortisol the next morning, which makes the person feel tired and reach for more caffeine. Breaking this cycle is one of the highest-value changes Sophie can make, and it will likely improve her sleep, her energy and her cortisol level without any medical intervention.\n\nThe third thread is the mild metabolic strain on the liver. GGT at 40 and ALT at 37 are both marginally above their respective optimal thresholds for women. With a FIB-4 of 0.95, APRI of 0.25, and NAFLD fibrosis score of minus 2.23, there is no scarring and no fibrosis. This pattern is consistent with early fatty infiltration of the liver driven by the BMI of 30.2. A modest weight loss of 5 to 7 kilograms would be expected to normalise both enzymes and reduce the ApoB at the same time, because the same dietary changes that reduce liver fat also reduce LDL particle count.\n\nThe urinary finding sits separately from these threads. White blood cells at 90 and red blood cells at 40 with no bacterial growth and negative nitrites could reflect a sterile inflammation, a stone, or a structural cause. The absence of bacteria makes infection unlikely, but the combination of elevated WBCs and RBCs at 57 requires a fresh repeat sample and, if persistent, urological investigation.\n\nThe findings that have been comprehensively excluded are equally important. Sophie's thyroid is fully normal with negative antibodies, ruling out one of the most common causes of fatigue and weight gain in post-menopausal women. Her blood sugar and insulin sensitivity are excellent, ruling out metabolic syndrome. Her inflammation is low despite the BMI, ruling out a systemic inflammatory driver. Her B12, folate and iron stores are all healthy, ruling out the main nutritional causes of tiredness. Coeliac disease has been excluded. Her kidney function is strong. These exclusions narrow the explanation for her symptoms to the hormonal picture, the sleep and caffeine cycle, the sub-optimal vitamin D, and the low training load, all of which are addressable.","lifestyle":"Set a caffeine cut-off at midday, no coffee, tea or energy drinks after 12 pm. Anchor: set a phone alarm at 11:45 as a reminder to have your last cup. Why: caffeine has a half-life of five to six hours, meaning a 2 pm coffee still has half its stimulant effect at 8 pm, and Sophie's cortisol at 536 and poor sleep suggest caffeine is disrupting her sleep architecture.\nAdd a palm-sized portion of protein to every meal, eggs, Greek yoghurt, chicken, fish or beans. Anchor: protein goes on the plate first before anything else. Why: protein preserves lean muscle mass, which drives metabolic rate, and Sophie's very low free testosterone at 0.005 means her body has less hormonal drive to maintain muscle, so dietary protein becomes even more important.\nAdd two portions of oily fish per week, salmon, mackerel, sardines or trout. Anchor: designate two fixed evenings as fish nights. Why: omega-3 fatty acids lower triglycerides (already good at 0.84) and reduce ApoB particle count, directly targeting the 1.01 that needs to come below 0.9.\nAdd a daily portion of soluble fibre: oats at breakfast, or a tablespoon of ground flaxseed stirred into yoghurt. Anchor: attach it to breakfast so it becomes automatic. Why: soluble fibre binds bile acids in the gut and forces the liver to pull LDL from the blood to make more, lowering the LDL of 3.48 and the ApoB of 1.01.\nStart two resistance training sessions per week, even bodyweight exercises at home: squats, press-ups, lunges and rows with a band. Anchor: attach them to two fixed days, before or after the existing cardio sessions. Why: resistance training is the single most effective intervention for maintaining bone density post-menopause, preserving muscle mass against declining testosterone, improving insulin sensitivity (already good, worth protecting), and lowering liver fat.\nWalk for fifteen minutes after your largest meal each day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers glucose and insulin responses and adds 1,500 to 2,000 steps per day, bringing the daily total from the current 2,000 to 5,000 range closer to 7,000.\nFix a wake time seven days a week and get outside within the first hour of waking, even for five minutes. Anchor: the alarm goes off, you go to the window or the door. Why: morning light resets the circadian clock, lowers evening cortisol, and improves sleep onset, targeting the poor sleep Sophie reports.\nDrink a large glass of water first thing in the morning and one with each meal. Anchor: keep a glass on the bedside table. Why: the urea to creatinine ratio of 113 suggests mild dehydration, caffeine has a diuretic effect, and better hydration supports kidney function and energy.","flags":"Urine WBCs 90 (threshold below 10) and urine RBCs 40 (threshold below 25) with no bacterial growth, negative nitrites, and sterile culture. This combination in a 57-year-old post-menopausal woman requires a repeat midstream urine on a fresh sample. If the microscopic haematuria persists, urological referral for imaging and cystoscopy is indicated to exclude bladder and renal tract pathology.\nFree testosterone 0.005 nmol/L, below the lower limit of 0.01, with total testosterone at the floor of range at 0.5 nmol/L and SHBG 72.4 binding what little is produced. DHEA-S 0.5 umol/L (184 ug/dL) at the low end. Post-menopausal hormonal picture confirmed with FSH 100.26 and oestradiol below 43. The low free testosterone may be contributing to fatigue, difficulty with body composition and low motivation, and testosterone cream could be discussed with the GP.\nApoB 1.01 g/L (target below 0.9), LDL 3.48 mmol/L (target below 3.0), total cholesterol 6.2 mmol/L (desirable below 5.18). HDL 2.4 is exceptionally protective, ApoB/A1 ratio 0.49 is low risk, and Lp(a) below 25 confirms the elevation is entirely modifiable. Cardiovascular Risk Score 45 out of 100, driven by the ApoB and LDL. Post-menopausal oestrogen decline is a likely contributor. Dietary intervention recommended first, with recheck in four to six months.\nGGT 40 IU/L (female range below 38) and ALT 37 IU/L (optimal for women below 25). FIB-4 0.95, APRI 0.25 and NAFLD fibrosis score minus 2.23 all rule out fibrosis. Pattern consistent with mild hepatic steatosis at BMI 30.2. Expected to normalise with weight loss.\nWhite blood cell count 3.96 (range 4.0 to 10.0) and neutrophils 1.73 (range 2.0 to 7.0). Lymphocytes, monocytes, eosinophils and basophils all normal. CRP 0.8. No sign of immune compromise. Likely constitutional or post-viral. Recommend recheck at next blood test to establish baseline.\nAbsolute reticulocytes 41 (range 50 to 100) with normal haemoglobin of 144 and reticulocyte percentage of 0.86%. Represents low-output marrow with no clinical anaemia. No action needed.\nMPV 10.6 fL (range 7.1 to 10.1). Marginally above range. Clinically insignificant in isolation.\nESR 14 mm/hour (threshold below 12). Mildly elevated, non-specific. CRP 0.8 argues against significant inflammation. Likely age-related.\nCortisol 536 nmol/L, within morning range but upper third. Consistent with high caffeine intake and poor sleep rather than pathology.\nVitamin D 56 nmol/L, sufficient but below optimal of 75 to 120. Supplementation recommended at higher dose given BMI 30.\nReassuring negatives: thyroid function fully normal with negative antibodies; fasting glucose 5.1, HbA1c 38 and HOMA-IR 0.97 ruling out insulin resistance and pre-diabetes; hs-CRP 0.8 ruling out systemic inflammation; B12 507, folate 13 and ferritin 122 ruling out nutritional deficiencies; coeliac screen negative; kidney function strong with combined eGFR 92; all tumour markers within range; immunoglobulins normal; rheumatoid factor negative.","recommendations":"Arrange a repeat midstream urine sample to confirm or clear the WBC and RBC findings. If the microscopic haematuria persists on a fresh sample, request urological referral for imaging and cystoscopy. Bring these numbers: urine WBC 90, urine RBC 40, culture no growth, nitrites negative.\nDiscuss the low free testosterone of 0.005 nmol/L (range 0.01 to 0.25) with total testosterone at the floor of 0.5 nmol/L. Ask whether transdermal testosterone cream is appropriate given her symptoms of fatigue, difficulty losing weight and low drive post-menopause. DHEA-S is also low at 0.5 umol/L.\nDiscuss the lipid picture: ApoB 1.01 (target below 0.9), LDL 3.48 (target below 3.0). The GP should note the exceptionally high HDL of 2.4 and low ApoB/A1 ratio of 0.49, which moderate the overall risk. Lp(a) below 25 confirms all of the elevation is diet and lifestyle modifiable. Request a recheck in four to six months after dietary changes.\nMention the GGT of 40 and ALT of 37, both mildly above female optimal thresholds, in the context of BMI 30.2. No fibrosis on scoring. Expected to improve with weight loss.\nAsk for a lying and standing blood pressure check to investigate the dizziness Sophie experiences on getting out of bed quickly. If the tingling feet persist, discuss whether nerve conduction studies are warranted.\nNote the white blood cell count of 3.96 and neutrophils of 1.73, both marginally below range, for rechecking at the next blood test.\nCalorie and protein targets for weight loss: Sophie's estimated maintenance calories are approximately 1,750 to 1,850 per day (BMR roughly 1,350 multiplied by an activity factor of 1.3 to 1.4 given her current low step count and twice-weekly cardio). A deficit of 300 to 400 calories per day, targeting 1,400 to 1,500 calories, would produce steady fat loss of 0.3 to 0.5 kg per week. Protein target: 91 to 105 grams per day (1.3 to 1.5 g per kg bodyweight), prioritised at every meal to preserve lean mass given her low testosterone. Target weight range: 58 to 63 kg, which would bring her BMI into the 25 to 27 range. Retest in four to six months with a focused panel: lipids with ApoB, liver enzymes (GGT, ALT), full blood count, vitamin D, and free testosterone.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with a meal containing fat. At a BMI of 30, fat tissue sequesters vitamin D, so the higher dose is needed to move from the current 56 up to the 80 to 100 range. Recheck in four to six months to confirm the level is rising.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside the vitamin D. K2 directs calcium into bone rather than into artery walls, which is particularly important post-menopause when bone density is declining.\nMagnesium glycinate: 300 to 400 mg taken before bed. Sophie's magnesium at 0.96 is within the ideal band, but supplemental magnesium in the glycinate form supports sleep quality, reduces muscle tension, and has a mild calming effect on the nervous system, directly targeting her poor sleep and the tingling in her feet.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This targets the ApoB of 1.01 and supports the anti-inflammatory environment her CRP of 0.8 already reflects.\nDo not take iron supplements. Sophie's ferritin is 122 and her iron stores are healthy. Additional iron at this level could push stores too high.\nThe most important changes from this report are not supplements. They are the caffeine cut-off at midday to break the poor sleep and high cortisol cycle, the addition of resistance training twice a week to protect bone and muscle post-menopause, and the dietary shifts to lower ApoB below 0.9.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 63.3; held to 49 by two or more systems rated \"See your GP\". Weakest systems: urinalysis 0%, lipids & cardiovascular 30%, inflammation 66%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Gamma GT, White Blood Cell Count.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3871","lower_normal":"","upper_normal":"62","lower_optimal":"","upper_optimal":"57","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4597","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built by current blood markers, without an age term, so it reflects modifiable risk rather than ten-year event probability. Sophie's score of 45 is above the threshold of 40, driven primarily by her ApoB of 1.01 and LDL of 3.48. The score does not fully capture the protective effect of her exceptional HDL of 2.4, which is reflected in her favourable ApoB/A1 ratio of 0.49 and TC/HDL ratio of 2.58. The dietary changes recommended in this report, increasing soluble fibre, oily fish and reducing saturated fat, should bring both the ApoB and LDL down and lower this score below 40 at retest.","low_causes":"Low ApoB, low LDL, high HDL, low triglycerides, low CRP, normal HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6093","units":"mmol/l","description":"Blood glucose is the concentration of sugar circulating in the bloodstream after fasting. Sophie's result of 5.1 sits comfortably within the ideal range of 4.0 to 5.4 mmol/L, which is a genuinely positive finding at a BMI of 30.2. It indicates that her body is regulating blood sugar efficiently and there is no sign of pre-diabetes or impaired fasting glucose.","low_causes":"Fasting too long, excessive exercise, insulin-producing tumour","high_causes":"Pre-diabetes, type 2 diabetes, stress, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6500","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar over the past two to three months. Sophie's result of 5.7% is within the normal range of below 6.0% and well below the pre-diabetic threshold of 6.0 to 6.4%. This confirms stable, healthy blood sugar control over the medium term.","low_causes":"Haemolytic anaemia, chronic blood loss, high red cell turnover","high_causes":"Pre-diabetes, type 2 diabetes, iron deficiency affecting red cell turnover","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the international standard unit. Sophie's result of 38 is within the normal range of below 42 and above the optimal threshold of 36 by a small margin. At 38, there is no concern about pre-diabetes, but there is a small amount of room for improvement. Dietary changes, particularly reducing refined carbohydrates and adding post-meal walks, would be expected to bring this into the low 30s.","low_causes":"Haemolytic anaemia, chronic blood loss","high_causes":"Pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4174","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5752","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. A lower number indicates better insulin sensitivity. Sophie's result of 4.39 is excellent, sitting within the optimal range of 2 to 8 mIU/L. At a BMI of 30.2 with weight gain as a reported symptom, this level of insulin sensitivity is a genuinely impressive finding and means the weight gain is not being driven by insulin resistance.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, PCOS, type 2 diabetes (early stage), high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3434","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_norm ithin the reference range of 3.8 to 4.8, sitting near the upper boundary. This is healthy and consistent with good iron stores and adequate erythropoiesis (red cell production).","low_causes":"Anaemia, blood loss, bone marrow suppression, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.422","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. Sophie's result of 0.422 is well within the reference range and the ideal band, indicating normal blood viscosity and hydration.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"13.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"%","description":"RDW measures the variation in size of red blood cells. A higher number means more variation. Sophie's result of 13.6% is within the reference range of 11.6 to 14.0% but above the optimal threshold of 13.2%. This slight variation is not clinically significant and does not suggest iron or B12 deficiency given her healthy ferritin and B12 levels.","low_causes":"Normal finding, iron deficiency anaemia (can be low early on)","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease, recent blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"88.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"fl","description":"MCV measures the average size of red blood cells. Small cells suggest iron deficiency, large cells suggest B12 or folate deficiency. Sophie's MCV of 88.3 is right in the middle of the ideal range, consistent with healthy red cell production and adequate iron, B12 and folate.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"30.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin inside each red blood cell. Sophie's result of 30.2 pg is within the ideal range, confirming that each red cell is well loaded with oxygen-carrying haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"341","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6222","lower_normal":"315","upper nally above the reference range of 7.1 to 10.1. At this margin, this is usually normal variation and reflects slightly younger, more active platelets being released by the bone marrow. It is not clinically significant on its own and does not require action.","low_causes":"Bone marrow suppression, medications, inflammatory conditions","high_causes":"Increased platelet turnover, inflammation, iron deficiency, myeloproliferative conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3244","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's first responders, fighting infection and clearing damaged tissue. Sophie's count of 3.96 is fractionally below the lower limit of 4.0. The differential (the breakdown of white cell types) shows that lymphocytes, monocytes, eosinophils and basophils are all normal, so the low total is driven entirely by the neutrophil count. With a CRP of 0.8 showing no active inflammation, this is most likely Sophie's constitutional baseline or a transient dip from a recent minor viral illness. It should be rechecked at the next blood test to confirm it is stable.","low_causes":"Viral infection, constitutional variation, medications, autoimmune conditions, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2800","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5. , hyperthyroidism","high_causes":"Allergic conditions, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3933","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells recently released from the bone marrow. The percentage reflects the proportion of new red cells being produced. Sophie's reticulocyte percentage of 0.86% is within the reference range, indicating the bone marrow is producing red cells at a normal rate.","low_causes":"Iron, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia, response to treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"41.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2870","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of immature red blood cells in circulation. Sophie's result of 41.1 is below the lower limit of 50. However, her haemoglobin is 144, which is healthy, and her reticulocyte percentage is within range. This means the bone marrow is producing enough red cells to maintain a healthy haemoglobin level but is running on lower output because there is no demand for more. With healthy iron stores (ferritin 122), adequate B12 (507) and folate (13), this is a physiological low output state rather than a marrow problem.","low_causes":"Adequate haemoglobin with low turnover demand, bone marrow suppression, iron or B12 deficiency, chronic kidney disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"18.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by the red blood cell count. It is used to distinguish between iron deficiency anaemia (index above 13) and thalassaemia trait (index below 13). Sophie's Mentzer index of 18.5 is reported for context and is consistent with her normal haemoglobin and MCV, with no suspicion of thalassaemia.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"14","within_norm rotein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4634","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a constant rate. Sophie's result of 61 umol/L is within the ideal range, indicating healthy kidney filtration.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, excessive protein, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) measures how well the kidneys filter waste from the blood. Sophie's creatinine-based eGFR is above 90, which is healthy kidney function. The cystatin C-based eGFR of 92 confirms this independently.","low_causes":"Chronic kidney disease, dehydration, medications, ageing","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4273","lower_normal":"0","upper_normal":"1.1","lower_optimal":" ce range of 40 to 100. The most common explanations are mild dehydration (consistent with her high caffeine intake and concentrated urine) and a creatinine that sits low because of smaller muscle mass. Her kidney function is healthy based on eGFR and cystatin C, so this is not a sign of kidney disease. Increasing water intake, particularly replacing some of the caffeine with water, would be expected to normalise this.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.08","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity CRP (C-reactive protein) is produced by the liver in response to inflammation anywhere in the body. It is one of the most useful markers of systemic inflammation and cardiovascular risk. Sophie's result of 0.8 mg/L is below the ideal threshold of 1.0, which at a BMI of 30.2 is a genuinely impressive finding. It means there is very little systemic inflammation despite the elevated body weight, which is reassuring for her cardiovascular and metabolic health.","low_causes":"Low inflammation, anti-inflammatory medications, statins","high_causes":"Infection, chronic inflammation, obesity, smoking, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.666 :"Chronic infection, inflammation, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5714","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys and gut. In post-menopausal women, a modest rise in ALP is common because bone turnover increases after oestrogen declines. Sophie's ALP of 96 is within the reference range but above the optimal threshold of 90. Given the post-menopausal status and the normal calcium, phosphate and PTH, this likely reflects increased bone remodelling rather than liver or bile duct pathology. It supports the case for adequate vitamin D, K2 and resistance training to maintain bone density.","low_causes":"Hypothyroidism, zinc deficiency, malnutrition","high_causes":"Bone turnover (post-menopause, Paget's, fracture healing), bile duct obstruction, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Sophie's bilirubin of 8 umol/L is within the ideal range, indicating normal red cell breakdown and liver clearance.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome (benign, inherited), liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3304","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is a liver enzyme released into the blood when liver cells are damaged or stressed. Sophie's ALT of 37 IU/L is within the laboratory range of below 56 but above the optimal threshold for women of 25. Combined with the GGT of 40, this pattern suggests the liver is under a small amount of metabolic strain, most likely from mild fatty infiltration related to the BMI of 30.2. The FIB-4 score of 0.95 confirms no scarring or fibrosis. This is expected to improve with weight loss.","low_causes":"B6 deficiency (rare)","high_causes":"Fatty liver, alcohol, hepatitis, medications, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST (aspartate aminotransferase) is found in the liver, heart and muscles. It is released into the blood when any of these tissues are damaged. Sophie's AST of 27 is within the ideal range, which is reassuring alongside the mildly elevated ALT, as it confirms the liver enzyme changes are mild.","low_causes":"B6 deficiency, uraemia","high_causes":"Liver nd inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is a more specific marker for pancreatic health than amylase. Sophie's lipase of 56 is within the reference range of 13 to 60, towards the upper end but not above the limit. No sign of pancreatic inflammation.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, bile duct obstruction, kidney disease, peptic ulcer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6023","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6158","units":"mmol/l","description":"Calcium is essential for bone strength, nerve transmission, muscle contraction and blood clotting. Sophie's calcium of 2.54 is within the ideal range, and her corrected calcium (adjusted for albumin) of 2.56 confirms this. With PTH at 1.46 and phosphate at 1.3, calcium metabolism is well regulated.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, sarcoidosis, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.5
