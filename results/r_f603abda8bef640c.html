const REPORT_DATA = {"patient_name":"Samson Juhasz","dob":"12/11/1998","report_date":"2026-09-11","summary":"Samson is a 27-year-old male presenting with a BMI of 27.1, following a standard mixed diet rated 6 out of 10 for quality with a volume of 7 out of 10. He trains once per week with cardio and does no resistance training, averaging 2,000 to 5,000 daily steps. He drinks more than 7 alcoholic drinks per week. He reports hair thinning and hair loss, weight gain and difficulty losing weight, and low mood and anxiety. His goals are to improve long-term health and longevity, balance hormones, and improve digestion and gut health. He has had persistent gut issues over the last few years including chronic constipation and diarrhoea, suspects he may be hypothyroid, and wonders whether small intestinal bacterial overgrowth could be behind his symptoms.\n\nThe good news is that his thyroid, which he was most concerned about, is working well. TSH, which is the signal the pituitary gland sends to the thyroid to tell it to produce more hormone, sits at 1.81, comfortably within the optimal window of 1.0 to 2.5. Free T4, the storage form of thyroid hormone, is 18.5, right in the middle of the optimal band. Free T3, the active form that cells actually use, is 4.9, which is within the optimal range. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out the autoimmune process called Hashimoto's thyroiditis that is the most common cause of an underactive thyroid. In short, his thyroid is not the explanation for his symptoms, and that is a genuinely useful thing to know.\n\nHis hormones are in excellent shape. Testosterone at 24.1 is well within the optimal range of 18 to 30 for a man his age, and free testosterone at 0.47, the portion not bound to carrier proteins and therefore available for the body to use, is healthy. SHBG, the protein that binds testosterone and takes it out of circulation, is 38.7, sitting neatly in the optimal window. LH and FSH, the pituitary hormones that drive testosterone production, are both within range, and oestradiol at 62 is well controlled. Cortisol at 278 is within the expected morning range. DHEA-S at 1,069 micrograms per decilitre (converted from 2.9 micromoles per litre) is healthy for his age. His hormonal axis is functioning as it should, and the hair thinning he describes is unlikely to be driven by a hormonal imbalance. It may be worth discussing with his GP whether androgenetic alopecia, which is genetic and common in men from the mid-twenties, could be the explanation, or whether other causes such as nutrient deficiencies should be explored.\n\nHis liver is in good health. ALT at 21 is within the optimal ceiling of 30, AST at 21 is well within range, and the FIB-4 score, a composite marker that estimates liver scarring, is 0.46, which is excellent. Bilirubin at 12 and albumin at 46 are both healthy. GGT, the enzyme most sensitive to alcohol exposure, is 26. This is within the laboratory range of 4 to 73 but sits just above the optimal threshold of 25. For a 27-year-old drinking more than seven drinks per week, this is worth noting. It is not alarming, but it does suggest the liver is seeing the alcohol. Amylase and lipase, which reflect pancreatic health, are both within range, with lipase sitting exactly at the upper limit of 60, which is fine but worth keeping an eye on over time.\n\nKidney function is excellent. Cystatin C, a protein filtered by the kidneys that gives a reliable picture of how well they are clearing waste, is 0.85, producing a Cystatin C-based eGFR of 106, well above the 90 threshold. Creatinine-based eGFR is also above 90. Electrolytes are all well balanced, with sodium, potassium, chloride, and bicarbonate all within their respective ranges. Uric acid at 278 is within the optimal range of 200 to 380 for a man.\n\nHis blood sugar control is mostly reassuring. Fasting glucose at 4.9 is within the optimal range. Fasting insulin at 5.02 is within the optimal band of 2 to 8, and HOMA-IR, the calculation that estimates how well his cells respond to insulin, is 1.09, which is healthy. His HbA1c, which reflects average blood sugar over the past two to three months, is 40 mmol per mol. The laboratory range considers anything below 42 normal, and above 42 pre-diabetic. At 40, he is within the normal band but not within the tighter optimal threshold of below 36 that we use. This is not pre-diabetes, but it does sit closer to the boundary than one would expect in a lean 27-year-old with good insulin sensitivity. It may reflect the quality of his carbohydrate intake, the alcohol, or simply day-to-day variation, but it is worth retesting in six months to confirm the trend. C-Peptide, which measures how much insulin the pancreas is actually producing, came back at 0.725 micrograms per litre, which converts to approximately 240 picomoles per litre. The laboratory flagged this as below range, but C-Peptide can degrade in samples that are not separated promptly, and the lab note on this result specifically highlights that point. Given that his glucose, HbA1c, insulin, and HOMA-IR are all reassuring, the most likely explanation is sample handling rather than a genuine shortfall in pancreatic output. This should be repeated on a fresh, promptly processed sample to confirm.\n\nHis full blood count is largely healthy. Haemoglobin at 165, haematocrit at 0.477, and MCV at 86.7 are all within range. White cell count at 5.75 with a healthy differential across neutrophils, lymphocytes, monocytes, eosinophils, and basophils shows a well-functioning immune system. Platelets at 270 are healthy. His red blood cell count at 5.51 is marginally above the upper limit of 5.5 by 0.01, which at this margin is laboratory rounding rather than a genuine abnormality. MCHC at 346, marginally above the upper limit of 345, is similarly trivial and most likely reflects a small temperature or storage effect on the sample, as the lab note itself suggests. His absolute reticulocyte count at 44.08 is just below the lower limit of 50. Reticulocytes are newly produced red blood cells released from the bone marrow, and a slightly low count here, alongside a haemoglobin that is already at 165, simply means the bone marrow has slowed production because it does not need to make more red cells. This is a normal physiological response rather than a sign of underproduction. ESR at 4, an inflammation marker based on how quickly red cells settle, is low and healthy.\n\nIron studies are well balanced. Ferritin at 125 is within the optimal range of 50 to 200 for a man. Serum iron at 24.8, transferrin at 2.29, and transferrin saturation at 43.12 percent are all within range. The saturation is towards the upper end of the optimal band of 25 to 40, sitting just above it at 43, but this is a single fasting reading and is not concerning in isolation given that ferritin is not elevated and the rest of the iron panel is clean.\n\nInflammation is low. High-sensitivity CRP, the most widely used marker of systemic inflammation, is 0.6, which is within the optimal range of below 1.0. This is reassuring, particularly given his gut symptoms, because it suggests that whatever is driving his digestive issues is not producing a measurable systemic inflammatory response in the blood.\n\nHis lipid profile is the area that needs the most attention. Total cholesterol at 5.7 is above the desirable threshold of 5.18. LDL cholesterol at 3.56, which is the form of cholesterol most strongly associated with plaque building up inside artery walls, is above the upper limit of 3.0 and well above the optimal target of below 2.6. Non-HDL cholesterol at 4.2 is above the 4.0 threshold. ApoB, which counts the actual number of cholesterol-carrying particles in the blood and is considered the most accurate single measure of cardiovascular risk, is 0.89, sitting just at the boundary of the desirable range of below 0.9 and above the optimal target of below 0.8. On the positive side, his HDL at 1.5 is healthy, ApoA1 at 1.56 is above the 1.20 target, and the ApoB to ApoA1 ratio at 0.57 is well within the lower-risk range of below 0.7. Triglycerides at 1.57 are within the fasting limit of 1.70 but above the optimal threshold of below 1.0, and the triglyceride-to-HDL ratio, a useful proxy for insulin resistance and small dense LDL particles, calculates to 1.05, which is above the optimal of below 0.87 but within the acceptable range of below 1.5. Remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.64, above the optimal of 0.5 but within the upper limit of 0.8. VLDL at 0.71 is within range. Lipoprotein(a), the inherited cholesterol particle that cannot be changed through lifestyle, is below 25, which is within the healthy range of below 32. This is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors, specifically diet composition, alcohol intake, body weight, and activity level. At 27, his cardiovascular risk over the next decade is low in absolute terms, but the trajectory of these numbers matters. Bringing LDL below 3.0 and ApoB below 0.8 through dietary changes, increased activity, moderate weight loss, and reducing alcohol is entirely achievable and would meaningfully reduce his lifetime cardiovascular risk.\n\nHis vitamin and mineral picture has two findings that need addressing. Vitamin D at 76 is within the sufficient range and just inside the lower end of the optimal band of 75 to 120, but only barely. At this level, a maintenance dose of vitamin D3 will help keep it from dipping below optimal, particularly over the winter months. Vitamin B12 at 263 is within the laboratory range of 193 to 982 but is well below the optimal threshold of 500. At this level, B12 is not deficient, but it is suboptimal, and low B12 is associated with fatigue, low mood, and neurological symptoms including brain fog. Given that Samson reports low mood and anxiety, optimising B12 may contribute to an improvement. Folate at 5 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. B12 and folate work together in a metabolic cycle that produces red blood cells and regulates a compound called homocysteine, which when elevated is itself a cardiovascular risk factor. Both being suboptimal at the same time suggests his diet may be light on leafy greens, legumes, and animal proteins. Magnesium at 0.92 is within the optimal range. Calcium and corrected calcium are both healthy, and phosphate is within range.\n\nParathyroid hormone, or PTH, is the finding that stands out as genuinely unusual. PTH is the hormone produced by the parathyroid glands that regulates calcium levels in the blood. When calcium drops, PTH should rise to bring it back up. Samson's PTH is 0.424 picomoles per litre, which is below the lower limit of 0.98, yet his corrected calcium at 2.42 is perfectly healthy. A suppressed PTH in the presence of normal calcium can occur when vitamin D is adequate, as vitamin D increases calcium absorption from the gut, reducing the need for PTH. At vitamin D of 76, this is a plausible explanation. However, the lab note on PTH states that results should be viewed with caution if the sample was not centrifuged and separated on the day of collection, and PTH is known to degrade in samples that sit on cells. The most likely explanation is a combination of adequate vitamin D reducing the physiological need for PTH and some sample degradation. We would recommend repeating PTH on a fresh, promptly processed sample to confirm whether it is genuinely suppressed. If it remains below range on repeat, his GP should investigate further, as persistently low PTH with normal calcium can indicate a condition called hypoparathyroidism.\n\nHis immune markers, IgG, IgM, IgA, and IgE, are all within their respective ranges. IgE at 88.7 is within the limit of 100 but is on the higher side, which can be associated with allergic sensitivity or environmental allergens, something worth noting given his gut symptoms. The coeliac screen, tissue transglutaminase IgA, is negative, which makes coeliac disease very unlikely as a cause of his digestive issues. Rheumatoid factor and bacterial culture are pending and will be reviewed when available.\n\nTotal antioxidant activity at 1.63 is within range. Creatine kinase at 83 is within range. PSA at 0.52 with a free PSA ratio of 0.519 is completely healthy. CA 19-9 and CEA, both tumour markers, are within range. Urinalysis is clean, with no protein, glucose, ketones, blood, or white cells detected.\n\nTurning to his gut symptoms, which are clearly his primary concern, it is important to be transparent about what blood tests can and cannot tell us. Blood work can rule out coeliac disease (ruled out), identify thyroid dysfunction (ruled out), detect systemic inflammation (CRP is low), and check for nutritional deficiencies that gut malabsorption might cause. His mildly suboptimal B12 and folate could reflect reduced absorption in the small intestine, which would be consistent with his suspicion of small intestinal bacterial overgrowth, or SIBO, though they could equally reflect dietary intake. Blood tests cannot diagnose SIBO directly. If he wishes to investigate this, a lactulose or glucose hydrogen and methane breath test, arranged through his GP or a gastroenterologist, is the appropriate next step. Given that his symptoms have persisted for several years and are significantly affecting his quality of life, we would recommend he discusses a referral to gastroenterology with his GP, bringing these results to show that coeliac, thyroid, and systemic inflammatory causes have been excluded.","links":"Samson's results point to four areas of action: lipid optimisation, nutritional correction, gut investigation, and lifestyle adjustment.\n\nStarting with his lipids, the goal is to bring LDL below 3.0 and ApoB below 0.8. Because his Lp(a) is normal, these numbers are entirely within his control. The most effective dietary changes are increasing soluble fibre intake to at least 10 grams per day from sources like oats, barley, lentils, chickpeas, flaxseed, and apples, as soluble fibre binds cholesterol in the gut and prevents it being reabsorbed. He should aim for two to three portions of oily fish per week, specifically salmon, mackerel, sardines, or anchovies, for their EPA and DHA content, which will also help bring triglycerides below 1.0. Reducing saturated fat is important: this means less red meat, less butter, less full-fat cheese, and less processed food, replacing these with olive oil, nuts, avocado, and the oily fish mentioned above. At his current weight of 85 kilograms and height of 177 centimetres, with light activity, his estimated maintenance calories sit around 2,350 to 2,500 per day. A modest deficit of 300 to 400 calories, targeting 2,000 to 2,150 per day, would produce gradual fat loss of 0.3 to 0.5 kilograms per week without being aggressive enough to affect energy or mood. Reaching a weight of 77 to 80 kilograms would bring his BMI into the 24 to 25 range and would itself improve LDL, triglycerides, and HbA1c. Protein intake should be at least 110 to 130 grams per day to preserve muscle mass during any weight loss, ideally from lean poultry, fish, eggs, legumes, and Greek yoghurt.\n\nAlcohol reduction is the single lifestyle change that would benefit the most markers simultaneously. Moving from more than seven drinks per week to fewer than seven, and ideally fewer than four, would help lower triglycerides, improve LDL clearance, reduce GGT towards its optimal level, support better sleep quality, and reduce the caloric load that contributes to weight gain. A pint of beer contains roughly 220 calories, a large glass of wine around 230. Seven drinks per week could represent 1,500 or more additional calories, which alone could account for much of the difficulty losing weight.\n\nIncreasing physical activity would complement these changes substantially. Adding two to three resistance training sessions per week would improve insulin sensitivity, support muscle mass, boost testosterone utilisation, and independently lower LDL cholesterol. Increasing his daily step count to 7,000 to 10,000 would improve metabolic rate, aid digestion, and support mood. Even a brisk 30-minute walk each day would make a measurable difference to his lipids, his HbA1c, and his reported low mood and anxiety. Exercise is one of the most effective interventions for anxiety, with evidence comparable to medication for mild to moderate symptoms.\n\nFor his gut symptoms, the next step is a conversation with his GP. He should bring this report and note that coeliac disease has been excluded by a negative tissue transglutaminase IgA, thyroid function is normal, and systemic inflammation is low. He should ask for a referral to gastroenterology or, at minimum, a SIBO breath test. In the meantime, keeping a food and symptom diary for two to three weeks, noting what he eats and when his constipation or diarrhoea occurs, would give a gastroenterologist useful information.\n\nFor his B12 and folate, supplementation will address the shortfall (detailed in the supplementation section), but he should also increase dietary sources: eggs, meat, fish, and dairy for B12, and dark leafy greens, lentils, chickpeas, and fortified cereals for folate.\n\nFor the low PTH, we recommend repeating this on a fresh, promptly processed sample. He should mention this to his GP and request that the repeat sample is centrifuged and separated on the same day. If PTH remains suppressed on repeat, further investigation is warranted.\n\nC-Peptide should also be repeated on a promptly separated sample, as the low result is most likely a sample handling artefact given his otherwise healthy glucose and insulin markers.\n\nA retest of the key markers in six months would be ideal. The repeat panel should include a full lipid profile with ApoB, HbA1c, fasting glucose, fasting insulin, PTH, C-Peptide, vitamin B12, folate, and GGT. This will show whether the dietary and lifestyle changes have moved his lipids and HbA1c in the right direction and confirm whether PTH and C-Peptide are genuinely abnormal or were affected by sample handling.","flags":"LDL cholesterol: 3.56 mmol/L, above the 3.0 upper limit and above the 2.6 optimal target. ApoB: 0.89 g/L, borderline at the 0.9 desirable threshold and above the 0.8 optimal target. Non-HDL cholesterol: 4.2, above the 4.0 limit. Lp(a) is normal, confirming these are driven by modifiable factors. Recommend lifestyle modification and retest in six months.\n\nHbA1c: 40 mmol/mol. Within the laboratory normal of below 42 but above the optimal threshold of below 36. Not pre-diabetic but worth monitoring, particularly given alcohol intake and diet quality.\n\nPTH: 0.424 pmol/L, below the lower limit of 0.98, with normal corrected calcium of 2.42. May reflect adequate vitamin D reducing PTH demand and/or sample degradation (lab note advises caution if not separated on day of collection). Recommend repeat on fresh, promptly processed sample. If confirmed low, investigate for hypoparathyroidism.\n\nC-Peptide: 0.725 ug/L (approximately 240 pmol/L), below the 1.1 ug/L lower limit. Lab note states samples not separated within 4 hours can degrade to 44% of baseline. Glucose, insulin, HbA1c, and HOMA-IR are all reassuring. Most likely sample artefact. Recommend repeat on promptly separated sample.\n\nVitamin B12: 263 pg/mL. Within range (193 to 982) but below the 500 optimal threshold. May contribute to fatigue and low mood. Supplement with sublingual methylcobalamin.\n\nFolate: 5 ng/mL. Within range (3 to 17) but below the 8 optimal threshold. Recommend dietary increase and supplementation.\n\nReticulocytes (absolute): 44.08, just below the 50 lower limit. Haemoglobin is 165, at the upper end of range. Low reticulocyte count reflects appropriate bone marrow downregulation when red cell mass is already adequate. Not pathological.\n\nRBC: 5.51, marginally above the 5.5 upper limit by 0.01. Clinically insignificant at this margin.\n\nMCHC: 346, marginally above the 345 upper limit. Most likely temperature or storage effect as noted by the lab. Clinically insignificant.\n\nGGT: 26 IU/L. Within the laboratory range (4 to 73) but above the optimal of below 25. Consistent with regular alcohol consumption.\n\nRheumatoid factor and urine culture are pending and should be reviewed when available.\n\nReassuring negatives: Thyroid function is normal with negative antibodies, ruling out Hashimoto's thyroiditis and hypothyroidism. Coeliac screen is negative. CRP is 0.6, ruling out significant systemic inflammation. Kidney function is excellent. Liver function is clean. Testosterone and the full hormonal axis are healthy. Iron studies are balanced. Lp(a) is normal. PSA and tumour markers are all within range. Urinalysis is clean.","recommendations":"1. Reduce alcohol intake to fewer than seven drinks per week, ideally fewer than four. This is the single change that would benefit the most markers: triglycerides, LDL, GGT, HbA1c, weight, sleep, and mood.\n\n2. Begin resistance training two to three times per week. Even bodyweight exercises at home would help. This will improve insulin sensitivity, support muscle mass, lower LDL, and support mood.\n\n3. Increase daily steps to 7,000 to 10,000. A daily 30-minute walk is the simplest starting point.\n\n4. Increase soluble fibre to at least 10 grams per day from oats, lentils, chickpeas, flaxseed, and apples. This directly lowers LDL cholesterol.\n\n5. Eat oily fish two to three times per week for EPA and DHA.\n\n6. Reduce saturated fat: less red meat, butter, full-fat cheese, and processed food. Replace with olive oil, nuts, avocado, and fish.\n\n7. Target 2,000 to 2,150 calories per day with at least 110 to 130 grams of protein to achieve gradual weight loss towards 77 to 80 kilograms.\n\n8. Increase dietary folate from dark leafy greens, lentils, and chickpeas.\n\n9. Discuss gut symptoms with GP, bringing this report. Request a referral to gastroenterology or a SIBO breath test. Keep a food and symptom diary for two to three weeks beforehand.\n\n10. Ask GP to repeat PTH and C-Peptide on a fresh, promptly separated sample to confirm whether these results are genuine or artefactual.\n\n11. Begin supplementation as outlined below.\n\n12. Retest in six months: full lipid profile with ApoB, HbA1c, fasting glucose, fasting insulin, PTH, C-Peptide, vitamin B12, folate, and GGT.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 micrograms daily, taken in the morning. His B12 at 263 is below the optimal threshold of 500. The sublingual form bypasses gut absorption, which is relevant given his digestive issues and the possibility of reduced small intestinal absorption. This may help with the low mood and fatigue he reports, as B12 plays a central role in nervous system function and energy metabolism.\n\nFolate: methylfolate (5-MTHF), 400 to 800 micrograms daily, taken with the B12. His folate at 5 is below the optimal threshold of 8. Folate works in tandem with B12 in the methylation cycle, and both being suboptimal at the same time means this cycle is not running as efficiently as it should. Methylfolate is the bioactive form and is better absorbed than folic acid.\n\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with his largest meal that contains fat. His vitamin D at 76 is just inside the optimal range of 75 to 120, but only barely. A maintenance dose will prevent it dropping below optimal over the autumn and winter months. Taking it with a fat-containing meal improves absorption.\n\nVitamin K2: MK-7 form, 100 micrograms daily, taken with the vitamin D3. K2 directs calcium into bones and teeth and away from soft tissues and artery walls. It should always accompany vitamin D supplementation.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This will support the reduction in triglycerides from 1.57 towards the optimal target of below 1.0, contribute to lowering LDL, and has established benefits for mood, brain function, and systemic inflammation. Look for a product that specifies the EPA and DHA content per capsule rather than just total fish oil.\n\nMagnesium: magnesium glycinate, 300 milligrams before bed. His magnesium at 0.92 is within the optimal range, so this is not correcting a deficiency, but magnesium glycinate specifically supports sleep quality, muscle recovery, and may help with the anxiety he reports. The glycinate form is well tolerated by the gut, which matters given his digestive sensitivity.\n\nDo NOT supplement with iron. His ferritin at 125 and transferrin saturation at 43 percent are both healthy, and additional iron when stores are adequate can cause oxidative stress and gastrointestinal irritation.\n\nThe most important changes from this report are not supplements. They are reducing alcohol, increasing physical activity, improving diet quality with more fibre, oily fish, and vegetables, and investigating his gut symptoms with his GP.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the amount of sugar circulating in the bloodstream after fasting. It is the body's primary fuel source, regulated by insulin. Samson's fasting glucose of 4.9 is within the optimal range of 4.0 to 5.4, indicating healthy blood sugar regulation at the time of the test. This is a good result and suggests his cells are responding appropriately to insulin signals.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, excessive alcohol consumption","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, high carbohydrate diet, medications such as steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4417","units":"%","description":"HbA1c reflects the average blood sugar level over the past two to three months by measuring how much glucose has attached itself to haemoglobin, the oxygen-carrying protein inside red blood cells. Samson's reading of 5.8% is within the normal range of below 6.0% but above the tighter optimal threshold. This means his average blood sugar has been slightly higher than ideal over the past few months, possibly influenced by diet composition and alcohol intake. It is not pre-diabetic but warrants monitoring.","low_causes":"Low carbohydrate diet, high red blood cell turnover, blood loss, haemolytic anaemia","high_causes":"High carbohydrate diet, insulin resistance, pre-diabetes, diabetes, alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised units of millimoles per mole. Samson's result of 40 is within the laboratory normal of below 42, meaning he is not in the pre-diabetic range. However, it is above the optimal threshold of below 36 that is associated with the lowest long-term metabolic risk. Lifestyle adjustments including dietary changes, increased activity, and alcohol reduction should help bring this number down towards the optimal zone.","low_causes":"Low carbohydrate diet, high red blood cell turnover, blood loss","high_causes":"High carbohydrate diet, insulin resistance, pre-diabetes, diabetes, alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"5.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3699","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3093","upper_optimal_position":"0.4096","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the bloodstream. A fasting insulin level reflects how hard the pancreas needs to work to keep blood sugar in check. Samson's insulin at 5.02 is within the optimal range of 2 to 8, meaning his pancreas is producing an appropriate amount of insulin without being overworked. This is a reassuring result and suggests good insulin sensitivity at present.","low_causes":"Low carbohydrate diet, very high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.725","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1947","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It provides an independent measure of how much insulin the pancreas is actually producing. Samson's C-Peptide of 0.725 micrograms per litre (approximately 240 picomoles per litre) is below the lower limit of 1.1. However, the laboratory specifically notes that C-Peptide can degrade to 44% of its baseline concentration in samples not separated within four hours. Given that his glucose, insulin, HbA1c, and HOMA-IR are all reassuring, the most likely explanation is sample degradation rather than a genuine shortfall in pancreatic output. This should be repeated on a fresh, promptly processed sample.","low_causes":"Sample degradation (most likely in this case), type 1 diabetes, low carbohydrate diet, very lean body composition, pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated score that estimates how resistant the body's cells are to insulin. It uses the fasting glucose and fasting insulin values together. A lower number means the cells respond well to insulin, requiring less of it to keep blood sugar in check. Samson's HOMA-IR of 1.09 is within the healthy range, indicating good insulin sensitivity. This is a positive finding, and although it sits just above the tightest optimal threshold of 1.0, it confirms he is not insulin resistant.","low_causes":"High insulin sensitivity, low carbohydrate diet, high activity level","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, obesity, sedentary lifestyle, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"71.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2310","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates how well the beta cells of the pancreas are functioning by looking at the relationship between fasting insulin and glucose. Samson's score of 71.7 is below the lower limit of 80. However, this calculation is heavily influenced by the fasting insulin value, and his insulin of 5.02 is within the optimal range. A HOMA-B below 80 in someone with a healthy glucose, healthy HbA1c, and good insulin sensitivity typically means the pancreas is being efficient rather than struggling. His beta cells are producing just enough insulin and no more, which at his age and with his glucose profile is more likely to reflect efficiency than early failure. This should be monitored over time alongside HbA1c.","low_causes":"Efficient insulin production in insulin-sensitive individuals, low carbohydrate diet, early beta cell decline (less likely if glucose is normal)","high_causes":"Insulin resistance causing compensatory overproduction, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.375","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Samson's ALT at 21 is well within the optimal threshold of below 30 for a man, indicating that his liver cells are healthy and under no metabolic strain. This is a reassuring result given his alcohol consumption.","low_causes":"Normal finding, vitamin B6 deficiency (rare)","high_causes":"Fatty liver disease, alcohol excess, hepatitis, medications, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT, so it is usually interpreted alongside ALT. Samson's AST at 21 is within the optimal range and matches his ALT exactly, which is a clean pattern indicating no liver, muscle, or cardiac stress.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, alcohol excess, muscle damage, intense exercise, heart disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3562","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4782","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol consumption and bile duct problems. It is often the first liver enzyme to rise in response to regular alcohol intake, even before other markers show any change. Samson's GGT at 26 is within the laboratory range of 4 to 73 but sits just above the optimal threshold of below 25. For a 27-year-old man, optimal would be well under 25. The slight elevation is consistent with his reported alcohol intake of more than seven drinks per week. The liver is handling the alcohol without overt damage, but this marker is worth watching.","low_causes":"Normal finding","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and gut. In adults, it primarily reflects liver and bone health. Samson's ALP at 50 is within range and unremarkable, indicating no bile duct obstruction or bone turnover issues.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency, pregnancy, growth (in young people)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and sends it into bile for excretion. Samson's bilirubin at 12 is comfortably within range, confirming healthy red blood cell turnover and good liver processing capacity.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome (benign), haemolytic anaemia, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins serve essential functions including maintaining fluid balance, transporting substances, and supporting immune function. Samson's total protein at 75 is healthy, indicating adequate protein intake and normal liver and immune system function.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, infection, dehydration, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and acts as a marker of liver synthetic function and nutritional status. Samson's albumin at 46 is within the optimal range, confirming good liver function and adequate protein nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/L","description":"Globulin is a group of proteins in the blood that includes antibodies (immunoglobulins) and transport proteins. It is calculated by subtracting albumin from total protein. Samson's globulin at 29 is within range, indicating normal immune function and protein production.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.6190","units":"","description":"The albumin-to-globulin ratio compares the two main protein types in the blood. A healthy ratio indicates a good balance between liver-produced albumin and immune-related globulins. Samson's ratio of 1.59 is well within the optimal range, reflecting healthy liver and immune balance.","low_causes":"Liver disease, chronic inflammation, autoimmune disease, kidney disease","high_causes":"Immune deficiency, genetic conditions (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1586","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. It is a screening tool, not a definitive diagnosis. Samson's FIB-4 of 0.46 is well below the 1.3 threshold that would prompt further investigation, indicating no evidence of liver fibrosis. This is an excellent result.","low_causes":"Young age, healthy liver, high platelet count","high_causes":"Liver fibrosis, cirrhosis, older age, low platelet count, chronic liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5530","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest starch. It is primarily used to assess pancreatic health. Samson's amylase at 98 is within range, indicating no pancreatic inflammation or obstruction.","low_causes":"Chronic pancreatitis, cystic fibrosis, pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down fats. It is a more specific marker of pancreatic health than amylase. Samson's lipase at 60 sits exactly at the upper limit of the laboratory range. This is not abnormal, but it is at the boundary. Given his gut symptoms, this is worth noting in the context of any future pancreatic assessment, though in isolation it does not indicate pancreatic disease.","low_causes":"Chronic pancreatitis (late stage), pancreatic insufficiency","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5504","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL. While it provides a broad overview, it is less informative than looking at its components individually, particularly LDL, HDL, and ApoB. Samson's total cholesterol at 5.7 is above the desirable threshold of 5.18. This is driven primarily by elevated LDL cholesterol.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, obesity, alcohol, sedentary lifestyle, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4618","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are a type of fat circulating in the blood that the body uses for energy. They rise after eating, which is why fasting levels are measured. Elevated triglycerides are associated with increased cardiovascular risk, particularly when combined with low HDL. Samson's triglycerides at 1.57 are within the fasting limit of 1.70 but above the optimal target of below 1.0. This level is commonly influenced by alcohol, refined carbohydrates, and excess calorie intake. Reducing alcohol and refined sugars, increasing omega-3 intake, and losing some weight would all help bring this down.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"Alcohol, refined carbohydrates, excess calories, obesity, insulin resistance, diabetes, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4551","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, is a type of cholesterol particle produced by the liver that carries triglycerides to tissues. It is a precursor to LDL. Samson's VLDL at 0.71 is within the laboratory range of below 0.78 but above the tighter optimal threshold of below 0.6, consistent with his triglycerides being above optimal.","low_causes":"Low-fat diet, malnutrition","high_causes":"High triglycerides, alcohol, obesity, insulin resistance, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4839","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"1.55","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"0.7452","units":"mmol/L","description":"HDL, or high-density lipoprotein, is often called 'good' cholesterol because it carries excess cholesterol away from artery walls and back to the liver for disposal. Higher levels are protective against cardiovascular disease. Samson's HDL at 1.5 is within the optimal range of above 1.4 for a man. This is a positive finding and provides meaningful protection against the elevated LDL.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, insulin resistance, genetics","high_causes":"Regular exercise, moderate alcohol consumption, genetics, medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7893","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol into artery walls where it can accumulate and form plaques over time, a process called atherosclerosis. It is the primary target for cardiovascular risk reduction. Samson's LDL at 3.56 is above the upper limit of 3.0 and well above the optimal target of below 2.6. At 27, this does not represent an immediate danger, but the trajectory matters. Each year of elevated LDL contributes to cumulative plaque burden. Bringing it below 3.0, and ideally below 2.6, through dietary changes, increased activity, and moderate weight loss would meaningfully reduce his lifetime cardiovascular risk. His normal Lp(a) confirms this is driven by modifiable lifestyle factors.","low_causes":"Hyperthyroidism, liver disease, malnutrition, very low-fat diet, medications","high_causes":"Diet high in saturated fat, obesity, sedentary lifestyle, genetic predisposition, hypothyroidism, alcohol, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk by comparing total cholesterol to the protective HDL fraction. A lower ratio is better. Samson's ratio of 3.8 is within the desirable range of below 4.5 and within the optimal range of below 4.0, which is a positive finding and reflects his healthy HDL level offsetting some of the LDL elevation.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"26.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4387","lower_normal":"20.0","upper_normal":"100","lower_optimal":"25.0","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5313","upper_optimal_position":"1","units":"%","description":"HDL percentage shows what proportion of total cholesterol is made up of the protective HDL fraction. A higher percentage indicates a more favourable cholesterol profile. Samson's 26.32% is above the 20% threshold, meaning more than a quarter of his total cholesterol is the protective type.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol, regular exercise, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5250","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all of the cholesterol in atherogenic particles, including LDL and VLDL, making it a broader measure of cardiovascular risk than LDL alone. Samson's non-HDL at 4.2 is above the 4.0 limit and above the 3.4 optimal target, consistent with the elevated LDL and above-optimal triglycerides.","low_causes":"Very low-fat diet, malnutrition, hyperthyroidism","high_causes":"High saturated fat diet, obesity, sedentary lifestyle, alcohol, insulin resistance, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"1.20","upper_normal":"100","lower_optimal":"1.40","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5067","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein found on HDL particles. It is a direct measure of the number of protective HDL particles rather than just the cholesterol they carry. Higher levels are better. Samson's ApoA1 at 1.56 is above the 1.20 threshold, confirming a healthy number of protective HDL particles.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL and VLDL particle. Because each particle carries exactly one ApoB molecule, this marker effectively counts the number of atherogenic particles in the blood, making it considered by many cardiologists as the single most accurate measure of cardiovascular risk. Samson's ApoB at 0.89 sits just under the 0.9 desirable threshold but above the 0.8 optimal target. The goal should be to bring this below 0.8 through the same dietary, activity, and weight loss changes that will lower LDL.","low_causes":"Hyperthyroidism, liver disease, malnutrition, very low-fat diet","high_causes":"High saturated fat diet, obesity, insulin resistance, genetics, sedentary lifestyle, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4071","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (harmful) particles to the number of protective HDL particles. It is considered one of the best single measures of cardiovascular risk balance. Samson's ratio of 0.57 is well within the lower-risk threshold of below 0.7 and within the optimal range of below 0.6. This means that although his absolute LDL and ApoB are elevated, the balance between harmful and protective particles is currently favourable.","low_causes":"High HDL, low LDL, healthy lifestyle, genetics","high_causes":"High LDL, low HDL, poor diet, obesity, insulin resistance, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined cholesterol particle that is essentially a modified version of LDL with an additional protein attached. Unlike other cholesterol markers, Lp(a) is almost entirely determined by genetics and cannot be meaningfully changed through diet, exercise, or most medications. It only needs to be measured once in a lifetime because it does not change. Samson's Lp(a) at below 25 is within the healthy range of below 32. This is genuinely useful information because it means his elevated LDL and ApoB are driven entirely by modifiable lifestyle factors rather than by an inherited particle that would add to his risk regardless of lifestyle.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable through lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3500","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful proxy for insulin resistance and the presence of small, dense LDL particles, which are more atherogenic than large, buoyant LDL. A lower ratio is better. Samson's ratio of 1.05 is within the acceptable range of below 1.5 but above the optimal threshold of below 0.87. This is consistent with his triglycerides being above optimal and suggests there may be some small dense LDL particles present. Reducing triglycerides through less alcohol, fewer refined carbohydrates, and more omega-3 would improve this ratio.","low_causes":"Low triglycerides, high HDL, healthy diet, regular exercise","high_causes":"High triglycerides, low HDL, insulin resistance, excess carbohydrates, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried in triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. These remnant particles are increasingly recognised as an independent cardiovascular risk factor. Samson's remnant cholesterol at 0.64 is within the laboratory range of below 0.8 but above the optimal target of below 0.5, consistent with his above-optimal triglyceride level.","low_causes":"Low triglycerides, healthy diet, good metabolic health","high_causes":"High triglycerides, insulin resistance, obesity, alcohol, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.06","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein is the most widely used blood marker of systemic inflammation. The liver produces CRP in response to inflammation anywhere in the body. It is also used as a cardiovascular risk marker, as chronic low-grade inflammation contributes to plaque formation. Samson's hs-CRP at 0.6 is within the optimal range of below 1.0, which is a reassuring finding. It indicates low systemic inflammation, and is particularly noteworthy given his gut symptoms, as it suggests that whatever is driving his digestive issues is not producing a measurable systemic inflammatory response.","low_causes":"Normal finding, low systemic inflammation","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular risk, smoking, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation. Samson's ESR at 4 is low and healthy, consistent with his low CRP, further confirming minimal systemic inflammation.","low_causes":"Normal finding, polycythaemia, sickle cell disease","high_causes":"Infection, inflammation, autoimmune disease, cancer, anaemia, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5256","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/L","description":"Sodium is a critical electrolyte that regulates fluid balance, nerve function, and muscle contractions. It is tightly controlled by the kidneys. Samson's sodium at 142 is within the optimal range, indicating well-regulated fluid balance.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, kidney disease, vomiting, diarrhoea","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is an electrolyte essential for normal heart rhythm, nerve impulses, and muscle contractions. It works in balance with sodium. Samson's potassium at 4.4 is within the optimal range, indicating healthy electrolyte balance.","low_causes":"Vomiting, diarrhoea, diuretics, excessive sweating, poor dietary intake","high_causes":"Kidney disease, sample haemolysis, medications (ACE inhibitors, potassium-sparing diuretics), adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"96","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and acid-base balance. Samson's chloride at 97 is within range, consistent with normal electrolyte regulation.","low_causes":"Vomiting, diuretics, metabolic alkalosis, SIADH","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"27.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5576","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is a buffer in the blood that helps maintain the body's acid-base balance (pH). The kidneys regulate bicarbonate levels. Samson's bicarbonate at 27.4 is within the optimal range, confirming healthy acid-base regulation.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"22.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"The anion gap is a calculated value derived from the difference between positively charged ions (sodium plus potassium) and negatively charged ions (chloride plus bicarbonate). It helps identify certain metabolic disturbances. Samson's calculated anion gap of 22.0 is above the standard range of 8 to 16. However, the anion gap can vary depending on the formula used by different laboratories, and albumin levels affect the result. Samson's albumin is 46, which is at the higher end and can itself raise the anion gap. This is not a clinically concerning finding in isolation when all individual electrolytes are within range, acid-base balance is normal (bicarbonate 27.4), kidney function is excellent, and there are no symptoms of metabolic acidosis.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Metabolic acidosis (lactic, ketoacidosis, renal), toxin ingestion, dehydration, high albumin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Blood calcium is tightly regulated by parathyroid hormone and vitamin D. Samson's calcium at 2.52 is within the optimal range, confirming healthy calcium regulation despite his low PTH.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D excess, cancer, dehydration, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium value for the albumin level in the blood, providing a more accurate measure of true calcium status. Since albumin binds calcium, total calcium alone can be misleading if albumin is high or low. Samson's corrected calcium at 2.42 is within the optimal range, confirming adequate calcium levels.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4560","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3816","upper_optimal_position":"0.6034","units":"mmol/L","description":"Phosphate works alongside calcium to maintain bone health and is involved in energy production and DNA synthesis. It is regulated by PTH and vitamin D. Samson's phosphate at 1.1 is within the optimal range.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malabsorption, refeeding syndrome, alcohol excess","high_causes":"Kidney disease, hypoparathyroidism, vitamin D excess, bone disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5575","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar regulation, and blood pressure control. It is also critical for sleep quality and mood regulation. Samson's magnesium at 0.92 is within the optimal range of 0.85 to 1.05, which is a positive finding.","low_causes":"Alcohol excess, poor dietary intake, diarrhoea, diuretics, malabsorption, diabetes","high_causes":"Kidney disease, magnesium supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"278","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3866","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4817","units":"umol/L","description":"Uric acid is a waste product formed when the body breaks down purines, which are found in certain foods and produced naturally by the body. The kidneys normally filter it out. Elevated levels can lead to gout and are associated with cardiovascular and metabolic disease. Samson's uric acid at 278 is within the optimal range of 200 to 380 for a man.","low_causes":"Low purine diet, liver disease, medications (allopurinol)","high_causes":"High purine diet (red meat, shellfish, alcohol), kidney disease, gout, obesity, dehydration, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. It provides a secondary measure of kidney function alongside creatinine. Samson's urea at 5.2 is within the optimal range, confirming healthy kidney excretion.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5812","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product produced by muscles at a fairly constant rate. The kidneys filter it from the blood, so creatinine levels reflect how well the kidneys are clearing waste. Samson's creatinine at 94 is within range, and combined with his eGFR of above 90, confirms excellent kidney function.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high protein diet, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"60","upper_no on":"Cystatin C is a small protein produced by all nucleated cells at a constant rate, freely filtered by the kidneys. Unlike creatinine, its production is not significantly affected by muscle mass, diet, or exercise, making it a more reliable marker of kidney function in many situations. Samson's Cystatin C at 0.85 is well within range.","low_causes":"Hyperthyroidism, steroid use (rare)","high_causes":"Kidney disease, hypothyroidism, inflammation, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"165","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6250","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to the tissues. It is the primary marker for anaemia. Samson's haemoglobin at 165 is within the optimal range for a male, indicating excellent oxygen-carrying capacity and no anaemia.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Dehydration, polycythaemia vera, living at altitude, smoking, sleep apnoea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.51","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6700","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^12/L","description":"Red blood cell count measures the total number of red cells per litre of blood. Samson's RBC at 5.51 is marginally above the upper limit of 5.5 by 0.01. At this margin, this is within the realm of laboratory measurement variation and is not clinically significant, particularly as his haemoglobin and haematocrit are both within range.","low_causes":"Anaemia, bone marrow disorders, chronic disease, blood loss, B12 or folate deficiency","high_causes":"Dehydration, polycythaemia vera, living at altitude, smoking, sleep apnoea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.477","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5900","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. A higher percentage means more red cells per volume of blood. Samson's haematocrit at 0.477 is within the optimal range, consistent with healthy red cell production.","low_causes":"Anaemia, overhydration, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, smoking, living at altitude, sleep apnoea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6095","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"Red cell distribution width measures how much variation there is in the size of red blood cells. A higher RDW means more variation, which can indicate iron deficiency, B12 or folate deficiency, or mixed nutritional deficiencies even before anaemia develops. Samson's RDW at 14.3 is within the laboratory range but above the optimal threshold of 13.5. Given his suboptimal B12 and folate, this mild elevation could reflect early effects of those deficiencies on red cell production. Correcting both nutrients may bring this down.","low_causes":"Normal finding","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"86.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3872","lower_normal":"83","upper_normal":"101","lower_optimal":"83","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"fL","description":"Mean corpuscular volume measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. Samson's MCV at 86.7 is within the optimal range, indicating normally sized red blood cells.","low_causes":"Iron deficiency, thalassaemia, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"27","upper_normal":"32","lower_optimal":"27","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin per red blood cell. Samson's MCH at 30 is within range, indicating each red cell carries a normal amount of haemoglobin.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver
