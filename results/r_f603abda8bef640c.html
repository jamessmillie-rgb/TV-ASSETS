<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Samson Juhasz","dob":"12/11/1998","report_date":"2026-09-11","summary":"Patient is a 27-year-old male presenting with a BMI of 27.1, following a standard mixed diet rated 6 out of 10 for quality with a volume of 7 out of 10. He trains once per week with cardio and does no resistance training, averaging 2,000 to 5,000 daily steps. He reports consuming more than 7 alcoholic drinks per week. He reports hair thinning or hair loss, weight gain or difficulty losing weight, and low mood or anxiety. His goals are to improve long-term health and longevity, balance hormones, and improve digestion and gut health. He adds important context: he has had persistent gut issues over the last few years with chronic constipation and diarrhoea, suspects he may be hypothyroid and that this has led to small intestinal bacterial overgrowth, which he believes is causing his symptoms, but he has never tested for either.\n\nThe first thing to address is the question he came in with, because the answer is clear: his thyroid is working well. Thyroid stimulating hormone, or TSH, is the signal the pituitary gland sends to the thyroid to tell it how hard to work; if the thyroid were underactive the pituitary would be shouting louder and TSH would be high. His TSH is 1.81, comfortably within the optimal range of 1.0 to 2.5. Free T4, the main hormone the thyroid produces, is 18.5, sitting in the upper half of the optimal band. Free T3, the active form the body converts T4 into, is 4.9, which is within range and within the laboratory range, and his FT3 to FT4 ratio of 0.265 is within the normal range, meaning conversion is happening adequately. Both thyroid antibody tests, thyroid peroxidase and thyroglobulin, are negative, which rules out autoimmune thyroid disease. So the thyroid is not the explanation for his symptoms, and that is genuinely useful information because it removes one variable and lets him focus on what is actually going on.\n\nThere is a great deal of good news in this report. His liver is in excellent health. ALT, the enzyme that rises first when liver cells are under strain, is 21, well within the optimal range for a male of under 30. AST is 21, and the De Ritis ratio of 1.0 is textbook. Gamma GT is 26, which is within range and below the optimal threshold of 25 by only a single unit; given that he is drinking more than 7 units a week, this is reassuring and means the liver is handling the alcohol without visible metabolic strain at present. The FIB-4 score, a composite that screens for liver scarring, is 0.46, which is very low and rules out any fibrosis. His kidney function is excellent. Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of filtration than creatinine alone, is 0.85, producing a Cystatin C eGFR of 106, exactly where it should be at 27. Creatinine-based eGFR is above 90, and the combined eGFR is 106. Urea, sodium, chloride, bicarbonate, potassium and uric acid are all within range. His anion gap of 22 is marginally above the upper reference limit of 20; with normal bicarbonate, healthy kidney function and a normal albumin, this is most likely a calculation effect and is not clinically significant. His blood sugar control is strong: fasting glucose is 4.9, within the optimal band, and HbA1c, which reflects average blood sugar over the past two to three months, is 40 mmol per mol, just under the 42 threshold for pre-diabetes but above the optimal level of under 36. Fasting insulin is 5.02, which is within the optimal range of 2 to 8, and HOMA-IR, the index that combines glucose and insulin to estimate insulin resistance, is 1.09, which is within the normal range and confirms he is insulin-sensitive. His inflammation markers are reassuringly low: high-sensitivity CRP, the most reliable blood marker of systemic inflammation, is 0.6, well below the 1.0 optimal ceiling, and ESR is 4. The systemic immune-inflammation index and platelet-to-lymphocyte ratio are both within their optimal bands. His immune system is balanced, with IgG, IgM, IgA and IgE all within range. Tissue transglutaminase IgA is negative, which rules out coeliac disease as a cause of his gut symptoms, and that is another important exclusion given his history of alternating constipation and diarrhoea. His full blood count is largely healthy: haemoglobin is 165, white cell count is 5.75, platelets are 270, and the differential white cell breakdown is unremarkable. Testosterone is 24.1, which is within the optimal range of 18 to 30 for a male, and free testosterone at 0.47 and bioavailable testosterone at 11.74 are both comfortably within range, with SHBG at 38.7 providing a healthy binding environment. LH and FSH are both within range, confirming the pituitary-gonadal axis is intact. DHEA-sulphate, oestradiol, progesterone, prolactin and cortisol are all within their respective ranges. Iron studies are well balanced: ferritin is 125, within the optimal range of 50 to 200 for a male, serum iron is 24.8, transferrin is 2.29, and transferrin saturation is 43, which is at the upper end of the optimal band of 25 to 40 but within the normal range of 18 to 55 and not a concern at this level. PSA is 0.52, which is excellent at 27 and essentially a baseline reading for the future. Tumour markers CA19-9 and CEA are both well within range. Urinalysis is completely clear: no protein, no glucose, no blood, no white cells, no nitrites, no bacterial growth, and urine culture shows no growth. Total antioxidant activity is 1.63, within range. Creatine kinase is 83, within range.\n\nTurning to the findings that need attention, the most significant is his lipid profile. Total cholesterol is 5.7, above the desirable threshold of 5.18. LDL cholesterol, the form that deposits cholesterol into artery walls, is 3.56, above the upper limit of 3.0. ApoB, which counts the actual number of cholesterol-carrying particles in the blood and is the single best predictor of cardiovascular risk from a blood test, is 0.89, just below the 0.9 threshold but above the optimal target of 0.8. Non-HDL cholesterol is 4.2, above the 4.0 limit. On the other side of the ledger, HDL cholesterol, the form that carries cholesterol away from artery walls for disposal, is 1.5, which is good and above the optimal male target of above 1.4. ApoA1 is 1.56, above the 1.20 floor, and the ApoB to ApoA1 ratio is 0.57, comfortably in the lower-risk zone below 0.7. Triglycerides at 1.57 are within the fasting target of under 1.70 but above the optimal level of under 1.0, and the TG to HDL ratio of 1.05 is within range but above the optimal of 0.87. Lipoprotein(a), which is entirely inherited and does not change with lifestyle, is below 25, which is ideal and means his elevated LDL is driven entirely by modifiable factors: diet, weight and activity. The Lp(a)-corrected LDL of 3.48 confirms this, with almost all of his LDL being the modifiable kind. The atherogenic index of plasma is 0.02, within the optimal band, which is a positive sign. At 27, his ten-year absolute cardiovascular risk is low simply because of his age, but the lipid pattern shows risk being built, and the value of catching it now is that diet, movement and modest weight loss can correct it before it becomes entrenched. The cardiovascular risk score from this report is driven primarily by the triglycerides, with LDL and ApoB also contributing.\n\nHis Lp(a) being below 25 is genuinely useful information. It means his cardiovascular risk profile is entirely within his control through lifestyle, and that is a strong position to be in at 27.\n\nHis C-peptide is 0.725 micrograms per litre, below the lower limit of the laboratory range of 1.1 micrograms per litre. C-peptide is released by the pancreas in equal amounts to insulin and reflects how much insulin the pancreas is producing. However, his fasting glucose is normal, his HbA1c is normal, and his fasting insulin is within the optimal range. In this context, a low C-peptide simply reflects low insulin demand: his pancreas does not need to produce much insulin because his cells are responding to it efficiently. This is not a sign of pancreatic failure. If glucose or HbA1c were elevated alongside a low C-peptide, the interpretation would be different, but here it is consistent with good insulin sensitivity and is not a concern.\n\nHis parathyroid hormone, or PTH, is 0.424 pmol/L, below the lower limit of 0.98. PTH is the hormone that regulates calcium levels in the blood: when calcium drops, PTH rises to pull calcium from bone and increase absorption from the gut. His corrected calcium is 2.42, which is within range and healthy, and his phosphate is 1.1, also within range. When calcium is normal and PTH is suppressed, the most common explanation is that the calcium level is adequate and the parathyroid glands are simply dialled down because they do not need to work hard. His vitamin D is 76, which is sufficient and within the lower end of the optimal range of 75 to 120, and vitamin D enhances calcium absorption from the gut, which may be part of why the parathyroid glands are quiet. This is worth mentioning to his GP for completeness, but in the setting of normal calcium and normal phosphate, a low PTH is usually benign.\n\nHis vitamin B12 is 263, which is within the laboratory range of 193 to 982 but below the optimal level of 500. B12 is essential for nerve function, red blood cell production and energy metabolism, and levels below 500 are associated with subtle neurological symptoms including low mood, brain fog and fatigue. His folate is 5, within range but below the optimal level of 8. B12 and folate work together in a biochemical cycle that produces the building blocks for DNA and the chemicals that regulate mood, and when both are suboptimal the effects can compound. Low B12 and folate are also associated with elevated homocysteine, which was not measured on this panel but would be worth checking at a future test. Given his symptoms of low mood and his gut issues, it is plausible that absorption is impaired, and supplementing both is sensible.\n\nHis red blood cell count is 5.51, marginally above the upper limit of 5.5. This is a trivial margin and at this level is not clinically significant; it is consistent with his haemoglobin of 165, which is at the upper end of the male range but within it. His MCHC at 346 is one point above the upper limit of 345, which at this margin is laboratory variation and not meaningful. His absolute reticulocyte count is 44.08, just below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a marginally low count in the presence of a healthy haemoglobin and adequate iron stores simply means the bone marrow is not being asked to produce red cells at a high rate because there is no need. None of these three findings require any action.\n\nHis rheumatoid factor is 16, marginally above the upper limit of 14. Rheumatoid factor is an antibody that can be associated with rheumatoid arthritis and other autoimmune conditions, but at this level it is a very common incidental finding: up to 10 to 15 percent of the healthy population have mildly positive rheumatoid factor without any disease. He does not report joint pain, swelling or stiffness, his inflammatory markers are low, and his CRP is 0.6. In this context, the result does not suggest rheumatoid arthritis. It is worth noting for his records so that if joint symptoms ever develop in the future, the baseline is known, but it does not need investigation now.\n\nHis vitamin D at 76 is sufficient and sits at the bottom of the optimal range. At a BMI of 27.1, vitamin D is slightly sequestered by body fat, and a modest supplementation dose through the winter months will keep him in the optimal zone.\n\nReturning to the question that brought him here: his gut symptoms. The bloods have ruled out coeliac disease, thyroid dysfunction, significant inflammation, liver disease, pancreatic insufficiency (amylase and lipase are both within range), and iron deficiency or anaemia that might accompany malabsorption. His IgA is normal, which means the coeliac test is reliable. What blood tests cannot measure is the composition of the gut microbiome, motility, visceral sensitivity, bile acid metabolism or the presence of small intestinal bacterial overgrowth. His pattern of alternating constipation and diarrhoea persisting over several years, in the context of normal inflammatory markers and a negative coeliac screen, is most consistent with either irritable bowel syndrome or, as he suspects, small intestinal bacterial overgrowth, which can present identically. A lactulose or glucose hydrogen breath test is the standard way to investigate SIBO and is available through most gastroenterology services. His GP can arrange this, and if SIBO is confirmed, a targeted course of antibiotics such as rifaximin is the usual treatment. If the breath test is negative, a structured low-FODMAP elimination diet supervised by a dietitian is the most evidence-based approach to managing IBS symptoms, and a food and symptom diary kept for two to three weeks before the appointment will give the GP or gastroenterologist much more to work with. His alcohol intake is also worth considering here: more than 7 drinks per week can alter gut motility and the microbiome, and reducing intake to under 7, ideally under 4, may improve his symptoms independently.\n\nHis PhenoAge is calculated from a combination of albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, and reflects the biological age his blood chemistry suggests. His calendar age is 27, and the values feeding into PhenoAge are largely favourable: low CRP, healthy albumin, good kidney function and a balanced blood count. His estimated average glucose of 6.6, which is derived from his HbA1c, is within range but above the optimal ceiling of 6.2, and this is the one input pulling PhenoAge slightly upward. Bringing HbA1c down from 40 to under 36 through dietary changes would improve this.\n\nIn summary, his thyroid is not the explanation for his symptoms, and that is one of the most valuable findings in this report because it closes a door he has been wondering about for years. His gut symptoms need investigation through a hydrogen breath test for SIBO, and coeliac disease has been excluded. His lipid profile shows early, entirely modifiable cardiovascular risk that diet, movement and modest weight loss will correct. His B12 and folate are both below optimal and worth supplementing. His hormones are healthy, his liver and kidneys are in excellent shape, his blood sugar control is good, and his inflammation is low. The path forward is clear: investigate the gut, improve the diet, move more, and retest in six months.","links":"The two stories running through this report are distinct but connected by lifestyle. The first is the lipid profile. At 27, with a BMI of 27.1, limited exercise and more than 7 drinks per week, the combination of LDL at 3.56, ApoB at 0.89 and triglycerides at 1.57 reflects a diet and activity pattern that is depositing more cholesterol into the bloodstream than the body is clearing. The positive side of this is substantial: Lp(a) is below 25, which means none of this is inherited and all of it is modifiable. HDL at 1.5 and an ApoB to ApoA1 ratio of 0.57 show the clearance system is working; it simply has too much to clear. The corrective levers are saturated fat reduction, increased soluble fibre, increased oily fish, more daily movement, modest weight loss and reduced alcohol, and every one of those will also improve the triglycerides and nudge HDL higher.\n\nThe second story is the gut. Coeliac disease has been excluded with a negative tissue transglutaminase in the presence of normal IgA. Inflammatory markers are low, which makes inflammatory bowel disease very unlikely. Liver enzymes, amylase and lipase are all normal, ruling out hepatobiliary or pancreatic causes. What remains is functional: either irritable bowel syndrome or small intestinal bacterial overgrowth, and the distinction matters because SIBO is treatable with a short course of antibiotics while IBS is managed through diet and lifestyle. A hydrogen breath test is the next step. The suboptimal B12 and folate could reflect impaired absorption from the gut, which would be consistent with either SIBO (where bacteria consume B12 before it can be absorbed) or with a diet that is adequate in variety but not rich enough in B12 sources and leafy greens.\n\nThe low PTH with normal calcium is a loose end that does not fit neatly into either story. It is most likely physiological, the parathyroid glands idling because calcium is adequate, but it should be mentioned to the GP so it is on record. If calcium were to drift low at a future test, the PTH response would need checking.\n\nThe rheumatoid factor at 16 is isolated and unsupported by any clinical feature of autoimmune disease. CRP is low, there are no joint symptoms, and immunoglobulins are balanced. This is almost certainly a background positive, seen in a significant minority of healthy people, but it is documented here so that if joint symptoms develop in future, the timeline is clear.\n\nThe minor haematological findings, a red blood cell count one hundredth above range, MCHC one point above, and absolute reticulocytes marginally below, are mathematically outside the reference intervals but clinically inert. They do not connect to any pattern and do not need follow-up.","lifestyle":"Add two portions of oily fish per week: salmon, mackerel or sardines, any form. Anchor: replace two of the meals that currently contain red or processed meat. Why: omega-3 fatty acids lower triglycerides and improve the LDL particle profile that is driving your ApoB of 0.89 and LDL of 3.56.\nAdd a source of soluble fibre to breakfast every day: oats, chia seeds stirred into yoghurt, or a handful of berries. Anchor: before anything else goes on the plate. Why: soluble fibre binds cholesterol in the gut and lowers LDL by 5 to 10 percent over 8 to 12 weeks, which at your current LDL of 3.56 could bring it close to target.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and triglyceride response to that meal, which will bring your triglycerides down from 1.57 and nudge your HbA1c from 40 toward the optimal range of under 36.\nAdd two resistance training sessions per week, starting with bodyweight or light weights. Anchor: pick two fixed days and treat them like appointments. Why: resistance training improves insulin sensitivity, raises HDL cholesterol, supports testosterone (which is healthy now but benefits from being maintained), and will help shift your BMI from 27.1 toward the 22 to 25 range.\nIncrease your daily step count to at least 7,000 steps. Anchor: track it on your phone and aim for 1,000 steps before 9am to set the pace. Why: consistent low-level movement improves lipid clearance, gut motility and mood, all three of your goals.\nReduce alcohol to under 7 drinks per week, ideally under 4. Anchor: set alcohol-free weekdays as the default. Why: alcohol above 7 units per week raises triglycerides, disrupts gut motility and microbiome balance, and contributes to the weight gain you are finding hard to shift. Your liver is handling it well now, but reducing intake gives your gut the best chance of settling.\nKeep a food and symptom diary for two to three weeks, noting what you eat, when your gut symptoms appear, and their severity. Anchor: use a simple notes app and log after each meal. Why: this is the single most useful thing you can bring to a GP or gastroenterology appointment for your SIBO or IBS investigation, and patterns often become obvious within a fortnight.\nAim for a calorie intake of approximately 2,200 to 2,400 kcal per day, with at least 110 to 130 grams of protein. Your estimated maintenance is around 2,500 kcal at your current activity level; a modest deficit of 300 to 500 kcal will produce gradual, sustainable weight loss of 0.3 to 0.5 kg per week, targeting a weight of 75 to 80 kg over 6 to 12 months. Protein at 1.4 to 1.6 grams per kilogram of bodyweight supports muscle retention while losing fat, and should come from lean meat, fish, eggs, dairy, legumes and pulses at every meal.","flags":"LDL cholesterol 3.56, above the 3.0 upper limit. ApoB 0.89, above the 0.8 optimal target and borderline at the 0.9 desirable threshold. Non-HDL cholesterol 4.2, above the 4.0 limit. Total cholesterol 5.7, above the 5.18 desirable threshold. Triglycerides 1.57, within the fasting limit of 1.70 but above the optimal of 1.0. Lp(a) below 25, which is ideal and confirms the lipid pattern is entirely modifiable. These findings together represent early, diet-and-lifestyle-driven cardiovascular risk that is highly correctable at 27.\nC-Peptide 0.725 ug/L, below the lower limit of 1.1. In the context of normal fasting glucose (4.9), normal HbA1c (40), and optimal fasting insulin (5.02), this reflects low insulin demand from good insulin sensitivity rather than pancreatic insufficiency. No action needed.\nIntact Parathyroid Hormone (PTH) 0.424 pmol/L, below the lower limit of 0.98. Corrected calcium is 2.42 (normal) and phosphate is 1.1 (normal). Most likely the parathyroid glands are appropriately suppressed because calcium is adequate. Worth mentioning to GP for documentation.\nVitamin B12 263 pg/mL, within laboratory range but below the optimal level of 500. Folate 5 ng/mL, within range but below the optimal level of 8. Both should be supplemented, particularly given chronic gut symptoms that may impair absorption.\nRheumatoid Factor 16 IU/mL, marginally above the upper limit of 14. No joint symptoms, no raised inflammatory markers, immunoglobulins normal. Most likely an incidental finding seen in up to 15 percent of the healthy population. No investigation needed unless joint symptoms develop.\nRed blood cell count 5.51, marginally above the upper limit of 5.5 by 0.01. MCHC 346, one point above the upper limit of 345. Absolute reticulocytes 44.08, marginally below the lower limit of 50. None of these are clinically significant at these margins; they represent laboratory variation in the context of a healthy haemoglobin and adequate iron stores.\nHbA1c 40 mmol/mol, within the normal range of under 42 but above the optimal of under 36. Estimated average glucose 6.6, above the optimal of 6.2. Dietary changes and increased activity should bring this into the optimal band.\nAnion gap 22, above the upper limit of 20 (formula including potassium). In the context of normal bicarbonate, kidney function and albumin, this is most likely a minor calculation effect and not clinically significant.\nReassuring negatives: thyroid function normal with both antibodies negative, coeliac disease excluded (tTG negative with normal IgA), liver function excellent (ALT 21, GGT 26, FIB-4 0.46), kidney function excellent (Cystatin C eGFR 106), fasting glucose and insulin optimal, HOMA-IR 1.09 within normal range, CRP 0.6, ESR 4, testosterone 24.1, PSA 0.52, tumour markers normal, urinalysis clear, iron studies balanced.\nNot reported on this occasion: homocysteine.","recommendations":"Ask your GP to arrange a lactulose or glucose hydrogen breath test to investigate small intestinal bacterial overgrowth. Bring your food and symptom diary to the appointment. Your bloods have excluded coeliac disease, thyroid dysfunction, inflammation and malabsorption-related anaemia, so SIBO and IBS are the remaining explanations for your chronic alternating constipation and diarrhoea.\nMention your PTH of 0.424 (below the lower limit of 0.98) to your GP. Your calcium and phosphate are normal, so this is most likely physiological, but it should be documented so that if calcium changes at a future test, the baseline is on record.\nDiscuss your lipid profile with your GP: LDL 3.56 (limit 3.0), ApoB 0.89 (optimal under 0.8), non-HDL 4.2 (limit 4.0), total cholesterol 5.7. Your Lp(a) is ideal, confirming these are entirely modifiable through diet, exercise and weight loss. The pattern should be tracked.\nMention the rheumatoid factor of 16 (limit 14) for documentation. No investigation is needed unless joint symptoms develop.\nBegin vitamin B12 and folate supplementation as described below. Consider requesting a homocysteine level at your next blood test to complete the methylation picture.\nTarget weight: 75 to 80 kg (BMI 24 to 25.5). Calorie target: 2,200 to 2,400 kcal per day, with at least 110 to 130 grams of protein. Retest in six months, repeating the lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB), HbA1c, B12, folate, vitamin D, and a full blood count to confirm the minor haematological findings have normalised.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. His B12 of 263 is below the optimal level of 500, and sublingual delivery bypasses any gut absorption issues that his chronic bowel symptoms may be causing.\nFolate: methylfolate (5-MTHF), 400 to 800 mcg daily, taken in the morning alongside B12. His folate of 5 is below the optimal level of 8, and folate and B12 work together in the methylation cycle. A food-first approach (dark leafy greens, lentils, chickpeas) should run alongside the supplement.\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with a meal containing fat. His vitamin D of 76 sits at the bottom of the optimal range of 75 to 120, and through the autumn and winter months in the UK, levels will fall without supplementation. At a BMI of 27.1, fat tissue sequesters some vitamin D, so a daily maintenance dose is appropriate.\nVitamin K2: MK-7, 100 mcg daily, taken with the vitamin D. K2 directs calcium into bone rather than soft tissue and should always accompany vitamin D supplementation.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. This supports the reduction of his triglycerides from 1.57 toward the optimal level of under 1.0 and provides an anti-inflammatory benefit for gut health.\nMagnesium glycinate: 300 mg daily, taken before bed. His magnesium of 0.92 is within the optimal range, but glycinate supports sleep quality, gut motility (which is directly relevant to his constipation) and stress management.\nDo not take iron supplements. His ferritin is 125, his transferrin saturation is 43 percent, and his iron stores are healthy. Additional iron would risk pushing saturation above the desirable range.\nThe most important changes from this report are not supplements. They are investigating his gut symptoms with a hydrogen breath test, reducing saturated fat and increasing soluble fibre and oily fish to correct his lipid profile, adding resistance training and daily movement, and reducing alcohol to under 7 drinks per week.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 73.8. Weakest systems: lipids & cardiovascular 44%, immunology 58%, vitamins & nutrients 60%. Biggest drags: LDL Cholesterol, C-Peptide, Total Cholesterol, Apolipoprotein B.","low_causes":"One or more systems well outside ideal, or a imal_position":"0.4870","units":"mIU/l","description":"TSH is the signal the pituitary gland sends to the thyroid to tell it how much hormone to produce. If the thyroid were underactive, TSH would rise as the pituitary shouts louder. His TSH of 1.81 is within the optimal range of 1.0 to 2.5, confirming the thyroid is working at exactly the right pace. This is one of the most important results in this report given his suspicion of hypothyroidism.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism (primary), iodine deficiency, thyroid autoimmunity","padding":"1","one_sided":"","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/l","description":"Free T4 is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, T3, in the tissues. His FT4 of 18.5 is within the optimal range of 14 to 20, sitting in the upper half of the ideal band. This confirms strong thyroid output.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness, medications","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5037","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism in every cell. His FT3 of 4.9 is within the laboratory range but just above the optimal lower threshold of 4.5. His FT3 to FT4 ratio of 0.265 is within the normal range, indicating adequate conversion from T4 to the active T3 form. While not in the top half of the optimal band, this is still a healthy level and does not suggest conversion difficulty.","low_causes":"Hypothyroidism, chronic illness, calorie restriction, selenium deficiency, medications","high_causes":"Hyperthyroidism, thyroiditis, excess T3 supplementation","padding":"1","one_sided":"","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies target an enzyme in the thyroid gland and are the hallmark of autoimmune thyroid disease, or Hashimoto's thyroiditis. His TPO antibodies are below 6.6, well under the 13.8 threshold, confirming no autoimmune attack on the thyroid. This rules out the most common cause of hypothyroidism in young adults.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target the protein used by the thyroid to produce hormones. Like tom of the optimal range of 75 to 120. Through the autumn and winter months in the UK, levels will fall without supplementation, and at a BMI of 27.1, fat tissue sequesters some vitamin D, meaning he needs a consistent maintenance dose to stay in the optimal zone.","low_causes":"Lack of sun exposure, dark skin, obesity, malabsorption, northern latitude, winter months","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"","range_type":"no upper"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"263","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3629","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, DNA synthesis, red blood cell production and energy metabolism. His B12 of 263 is within the laboratory range but well below the optimal level of 500. Levels below 500 are associated with subtle neurological symptoms including low mood, fatigue, brain fog and poor concentration, and his symptom of low mood may be partly related. B12 is absorbed in the terminal ileum of the small intestine, and his chronic gut issues may be impairing absorption. Sublingual methylcobalamin supplementation is recommended as it bypasses the gut entirely.","low_causes":"Inadequate dietary intake, malabsorption (gut disease, SIBO, coeliac), pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6190","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in DNA synthesis, red blood cell production and the methylation cycle that regulates mood and detoxification. His folate of 5 is within the laboratory range but below the optimal level of 8. Low folate, combined with low B12, can impair the methylation cycle and contribute to low mood, fatigue and elevated homocysteine. Increasing leafy green vegetables, legumes and lentils alongside a methylfolate supplement will help correct this.","low_causes":"Poor dietary intake, malabsorption, alcohol, medications (methotrexate, phenytoin), pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"","range_type":"normal"},{"key":"pth","name":"Intact Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"0.424","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2839","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.6018","units":"pmol/L","description":"Parathyroid hormone is produced by four small glands behind the thyroid and is the body's primary regulator of calcium. When blood calcium drops, PTH rises to release calcium from bone and increase gut absorption. His PTH of 0.424 is below the lower limit of 0.98. However, his corrected calcium is 2.42 (within range), his phosphate is 1.1 (within range), and his vitamin D is 76 (sufficient). When calcium is adequate and vitamin D is sufficient, the parathyroid glands may appropriately suppress their output because they are not needed. This is the most likely explanation. It is worth mentioning to his GP for documentation, but in the absence of symptoms of calcium imbalance, it is not a concern.","low_causes":"Adequate calcium suppressing PTH (physiological), hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, parathyroid adenoma","padding":"1","one_sided":"","range_type":"normal"},{"key":"ck","name":"Creatine Kinase (CK)","group":"CARDIAC MARKERS","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3845","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found in muscles and the heart. It rises after muscle damage, intense exercise or, rarely, heart injury. His CK of 83 is within the optimal range, consistent with his low exercise volume and confirming no muscle or cardiac damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myocardial infarction, hypothyroidism, statin use","padding":"1","one_sided":"","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity (TAA)","group":"SPECIALIZED TESTS","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5674","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.45","upper_optimal":"1.75","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4397","upper_optimal_position":"0.6525","units":"mmol/l","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which cause cellular damage and ageing. His TAA of 1.63 is within the optimal range, indicating a healthy antioxidant defence system.","low_causes":"Poor diet (low fruit and vegetable intake), chronic inflammation, oxidative stress, smoking","high_causes":"High antioxidant intake, supplementation","padding":"1","one_sided":"","range_type":"normal"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"10.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4807","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant antibody in the blood, responsible for long-term immunity against infections the body has previously encountered. His IgG of 10.7 is within the laboratory range, confirming a healthy adaptive immune response.","low_causes":"Immune deficiency, medications (immunosuppressants, steroids), protein-losing conditions","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"1.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5200","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. His IgM of 1.9 is within the laboratory range, indicating a healthy initial immune response capability.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune conditions","padding":"1","one_sided":"","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":" function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
