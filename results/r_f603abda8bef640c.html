w_causes":"Bone marrow disorders, medications","high_causes":"Chronic infection, inflammatory bowel disease, autoimmune disease, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. Samson's eosinophils at 0.05 are within range and low, which is normal.","low_causes":"Normal finding, steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infection, eosinophilic conditions, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic reactions and inflammation. Samson's basophils at 0.02 are within range.","low_causes":"Normal finding, steroid use, hyperthyroidism","high_causes":"Allergic reactions, chronic myeloid leukaemia, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5483","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a marker of systemic inflammation and immune balance. A higher ratio suggests the immune system is dealing with a greater inflammatory burden. Samson's NLR at 1.43 is within the optimal range of 1.0 to 2.0, consistent with his low CRP and ESR, confirming minimal systemic inflammation.","low_causes":"Normal finding, strong adaptive immunity","high_causes":"Bacterial infection, inflammation, physiological stress, chronic disease, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocyte percentage shows the proportion of circulating red blood cells that are newly produced. Samson's reticulocyte percentage at 0.8 is within range, indicating normal red blood cell production.","low_causes":"Bone marrow suppression, aplastic anaemia, nutritional deficiency (iron, B12, folate), chronic disease","high_causes":"Recovery from anaemia, blood loss, haemolytic anaemia, response to treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyte_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"44.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2145","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of new red blood cells being released from the bone marrow per litre of blood. Samson's absolute reticulocyte count at 44.08 is just below the lower limit of 50. However, this is a physiological response rather than a pathological finding. His haemoglobin is already at 165, near the top of the male range, and his haematocrit is 0.477. When the body has plenty of red blood cells, it appropriately reduces production. The bone marrow is simply not being asked to produce more because it does not need to.","low_causes":"Adequate red cell mass (appropriate physiological response), bone marrow suppression, aplastic anaemia, nutritional deficiency","high_causes":"Recovery from anaemia, blood loss, haemolytic anaemia, response to EPO","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"43.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5582","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3962","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. It reflects how much iron is available for use. Samson's saturation at 43.12 is within the laboratory range of 18 to 55 but sits above the upper end of the optimal band of 25 to 40. This is a single fasting reading and is not concerning in isolation. Iron intake on the day before the test, or timing of the blood draw, can influence this. His ferritin and transferrin are both within healthy ranges, confirming there is no iron overload.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, recent iron-rich meal, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"24.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5574","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6114","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin, transferrin, and saturation. Samson's serum iron at 24.8 is within the optimal range.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss, malabsorption","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3644","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.15","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the main protein that transports iron in the blood. The body increases transferrin production when iron stores are low and decreases it when stores are adequate. Samson's transferrin at 2.29 is within range, consistent with his adequate iron stores.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"52.4","within_normal":"TRUE", .4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, mood, energy, libido, and cognitive function. It is produced primarily in the testes and regulated by LH from the pituitary gland. Samson's testosterone at 24.1 is within the optimal range of 18 to 30 for a man his age. This is an excellent result and rules out low testosterone as a cause of his symptoms.","low_causes":"Ageing, obesity, stress, poor sleep, alcohol excess, pituitary disorders, medications, chronic illness","high_causes":"Exogenous testosterone or anabolic steroids, adrenal tumours, ovarian tumours (female)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4593","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3953","upper_optimal_position":"0.5790","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone that is not bound to proteins and is therefore biologically active, available for the body to use. Most testosterone circulates bound to SHBG or albumin. Samson's free testosterone at 0.47 is within the optimal range, confirming that not only is he producing adequate testosterone, but a healthy amount is available for his tissues to use.","low_causes":"High SHBG, ageing, obesity, liver disease, thyroid dysfunction","high_causes":"Low SHBG, exogenous testosterone, anabolic steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"38.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5107","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3862","upper_optimal_position":"0.5922","units":"nmol/L","description":"Sex hormone binding globulin is a protein produced by the liver that binds to testosterone and oestradiol, controlling how much of each is available for the body to use. Samson's SHBG at 38.7 is within the optimal range of 25 to 55, indicating a healthy balance between bound and free testosterone.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Ageing, hyperthyroidism, liver disease, oestrogen therapy, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"62.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5189","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The free androgen index is calculated from total testosterone and SHBG. It provides an estimate of the proportion of testosterone that is biologically active. Samson's FAI at 62.27 is within the optimal range, consistent with his healthy testosterone and SHBG levels.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"High testosterone, low SHBG, PCOS (in women), exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2123","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1370","upper_optimal_position":"0.4109","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, present in men in smaller amounts than in women. In men, it plays roles in bone health, brain function, and libido. It is produced partly by the conversion of testosterone via an enzyme called aromatase, which is more active in fat tissue. Samson's oestradiol at 62 is within the optimal range, indicating a healthy balance between testosterone and oestrogen.","low_causes":"Very low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity (increased aromatase activity), liver disease, alcohol excess, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4604","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role as a precursor to other hormones and has effects on mood and the nervous system. Samson's progesterone at 1.27 is within the male reference range.","low_causes":"Adrenal insufficiency, low cholesterol","high_causes":"Congenital adrenal hyperplasia, adrenal tumours, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3927","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5622","units":"mIU/mL","description":"Luteinising hormone is produced by the pituitary gland and signals the testes to produce testosterone. LH levels help determine whether low testosterone (if present) is due to a testicular problem or a pituitary problem. Samson's LH at 2.74 is within the optimal range, confirming normal pituitary signalling.","low_causes":"Pituitary dysfunction, exogenous testosterone or anabolic steroid use, severe stress, obesity","high_causes":"Primary hypogonadism (testicular failure), menopause (in women), Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3814","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"1.4","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5325","units":"mIU/mL","description":"Follicle stimulating hormone, produced by the pituitary gland, supports sperm production in men. Along with LH, it helps assess the function of the hypothalamic-pituitary-gonadal axis. Samson's FSH at 2.22 is within the optimal range.","low_causes":"Pituitary dysfunction, exogenous testosterone use, severe stress","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing, menopause (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"194","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4803","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5727","units":"uIU/mL","description":"Prolactin is a pituitary hormone best known for its role in lactation, but in men it influences immune function and reproductive health. Elevated prolactin can suppress testosterone production. Samson's prolactin at 194 is within the optimal range.","low_causes":"Dopamine agonist medications, pituitary insufficiency","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, SSRIs), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"278","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4280","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5808","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and declining through the day. A morning cortisol within range confirms the adrenal glands are functioning normally. Samson's cortisol at 278 is within the expected morning range and within the optimal band.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction, chronic fatigue","high_causes":"Chronic stress, Cushing's syndrome, medications (steroids), depression, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3895","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3684","upper_optimal_position":"0.5480","units":"umol/L","description":"DHEA sulphate is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It declines naturally with age. At 2.9 micromoles per litre (approximately 1,069 micrograms per decilitre), Samson's DHEA-S is within the optimal range for a man of 27.","low_causes":"Ageing, adrenal insufficiency, chronic illness, medications (steroids)","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5595","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4, or thyroxine, is the storage form of thyroid hormone circulating in the blood. The thyroid gland produces T4, which is then converted into the active form T3 in the tissues. Samson's FT4 at 18.5 is within the optimal range of 14 to 20, indicating the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4127","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4881","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland to tell the thyroid how much hormone to make. When thyroid function is low, TSH rises to push the thyroid harder. When thyroid function is adequate, TSH stays in a comfortable range. Samson's TSH at 1.81 is comfortably within the optimal range of 1.0 to 2.5, meaning the pituitary is satisfied with the thyroid's output. This effectively rules out hypothyroidism, which he suspected might be contributing to his symptoms.","low_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5037","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the biologically active thyroid hormone that cells actually use. T4 is converted into T3 in the tissues. Samson's FT3 at 4.9 is within the optimal range of 4.5 to 6.5, confirming that his body is effectively converting T4 to T3 and that his cells are receiving adequate active thyroid hormone.","low_causes":"Hypothyroidism, sick euthyroid syndrome, selenium deficiency, calorie restriction","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are immune proteins that attack thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence at elevated levels is the hallmark of Hashimoto's thyroiditis, the most common cause of hypothyroidism. Samson's TPO antibodies are below 6.6, which is well within the normal range of below 13.8, ruling out autoimmune thyroid disease.","low_causes":"Normal finding, absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce its hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Samson's result of below 1.3 is well within the normal range, further confirming no autoimmune thyroid process.","low_causes":"Normal finding, absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (sometimes)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3167","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a fat-soluble vitamin that acts more like a hormone in the body. It is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. The body produces it when skin is exposed to sunlight, but in the UK most people need supplementation, especially in autumn and winter. Samson's vitamin D at 76 is just inside the lower edge of the optimal range of 75 to 120. A maintenance dose of vitamin D3 will help keep it from dropping below this threshold over the darker months.","low_causes":"Insufficient sunlight exposure, poor dietary intake, darker skin, obesity (fat sequesters vitamin D), malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"0.424","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1465","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5547","units":"pmol/L","description":"Parathyroid hormone is produced by four small glands behind the thyroid. Its primary role is to regulate calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones, increase absorption from the gut, and reduce calcium loss through the kidneys. Samson's PTH at 0.424 is below the lower limit of 0.98, yet his corrected calcium is healthy at 2.42. This pattern can occur when vitamin D is adequate (as his is at 76), because vitamin D increases calcium absorption from the gut, reducing the need for PTH to maintain calcium levels. However, the lab notes that PTH can degrade if the sample is not centrifuged and separated on the day of collection. This result should be repeated on a fresh, promptly processed sample. If confirmed low, his GP should investigate for hypoparathyroidism.","low_causes":"Adequate vitamin D suppressing PTH demand, sample degradation, hypoparathyroidism, post-thyroid surgery, magnesium deficiency","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"263","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3614","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6148","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is obtained exclusively from animal products (meat, fish, eggs, dairy) or fortified foods. Samson's B12 at 263 is within the laboratory range of 193 to 982 but well below the optimal threshold of 500. At this level, B12 is not technically deficient, but it is suboptimal and may contribute to the low mood, anxiety, and fatigue he reports. B12 plays a central role in the production of neurotransmitters like serotonin and dopamine. Sublingual methylcobalamin supplementation is recommended.","low_causes":"Poor dietary intake (especially vegan or vegetarian diets), malabsorption (coeliac, Crohn's, SIBO), pernicious anaemia, medications (metformin, PPIs)","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and nervous system function. It works in a metabolic cycle with vitamin B12, and both being suboptimal at the same time suggests the methylation cycle is not running as efficiently as it should. This cycle is responsible for producing neurotransmitters, repairing DNA, and regulating a compound called homocysteine, which when elevated is a cardiovascular risk factor. Samson's folate at 5 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. Good dietary sources include dark leafy greens, lentils, chickpeas, and fortified cereals.","low_causes":"Poor dietary intake, alcohol excess (impairs absorption), malabsorption (coeliac, IBD), medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, B12 deficiency (folate trap), fortified food intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase is an enzyme found in muscles, including the heart and skeletal muscles. It leaks into the blood when muscles are damaged. CK rises after intense exercise, injury, or in muscle diseases. Samson's CK at 83 is within range, consistent with his low exercise volume.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5354","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which are unstable molecules that can damage cells. It reflects dietary antioxidant intake from fruits, vegetables, tea, and other sources. Samson's TAA at 1.63 is within the optimal range, suggesting adequate antioxidant intake.","low_causes":"Poor dietary antioxidant intake, chronic illness, oxidative stress","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4789","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood, providing long-term immunity against previously encountered infections. It is the antibody that vaccines stimulate. Samson's IgG at 10.7 is within the laboratory range, indicating healthy adaptive immunity.","low_causes":"Primary immunodeficiency, medications (immunosuppressants), protein-losing conditions","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5600","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. It provides early defence while the body develops the more targeted IgG response. Samson's IgM at 1.9 is within range.","low_causes":"Primary immunodeficiency, medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FAL function groupStatus(names) {
  let markers = [];

  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
