<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Gioia McGrory-Perich","dob":"05/06/1993","report_date":"2026-10-31","summary":"Customer is a 33-year-old female presenting with a BMI of 20.7, following a takeaway and convenience-based diet, eating 0 to 1 portions of vegetables and fruit a day with ultra-processed food weekly and sugary food daily; portions are slightly below average (volume 4 out of 10). She is on a progesterone-only pill or implant and has a regular cycle. She trains four times per week (two cardio, two resistance) at moderate intensity with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours but wakes tired most mornings, with energy at its lowest on waking. Stress feels hard to manage constantly. She drinks 10 to 14 alcoholic drinks per week, vapes nicotine, and reports recreational drug use. She reports brain fog, low mood and anxiety, low energy and fatigue, and bloating or digestive discomfort, and a previous blood test flagged something. Her goals are to reduce stress and anxiety, improve mood, and improve energy levels.\n\nHer PhenoAge, a biological ageing marker built from nine blood results including albumin, glucose, CRP and white cell count, comes back at 16.9 years against a calendar age of 33, a difference of over sixteen years in the favourable direction. This is an exceptionally strong result and reflects genuinely healthy underlying biology despite the symptoms she is experiencing. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from her lipid markers, inflammation and blood sugar, is 20, which sits right at the upper edge of the ideal band and confirms that her heart and blood vessel risk profile is in good shape.\n\nThere are several genuinely positive findings in this report and they are worth dwelling on, because the gap between how she feels and how her blood looks is one of the most important things to take from it. Her liver is in excellent health. ALT, which measures liver cell turnover, is 7, about as low as that enzyme gets and well inside the optimal range for women of below 25. Gamma GT, the enzyme most sensitive to alcohol, metabolic strain and medication effects, is 18, comfortably inside the optimal band of below 25 despite drinking 10 to 14 units a week. Her FIB-4 score, a composite that screens for liver scarring using age, platelets, ALT and AST, is 1.14, well below the 1.45 threshold, confirming no sign of fibrosis. Bilirubin, albumin and total protein are all within their ideal ranges. Given her alcohol intake and convenience-based diet, a completely clean liver panel is a genuine positive.\n\nHer kidney function is excellent. Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of kidney health than creatinine alone, is 0.93, giving a Cystatin C eGFR of 102, well above the 90 threshold for optimal function. Creatinine, urea, sodium, chloride and bicarbonate are all within range. Uric acid at 306 is within the female reference range and within the optimal band.\n\nHer blood sugar control is strong. Fasting glucose at 4.7 is within the optimal range of 4.0 to 5.4. HbA1c, which reflects average blood sugar over the past two to three months, is 38 mmol/mol, within the optimal band of below 42. Fasting insulin at 5.71 is within the ideal zone of 2 to 8, meaning her pancreas is producing a modest, efficient amount of insulin. HOMA-IR, a calculation that combines glucose and insulin to estimate how sensitive her cells are to insulin, is 1.19, within the healthy range. This means that despite daily sugar and a convenience-based diet, her body is handling glucose well for now.\n\nHer cardiovascular markers are in good shape. Total cholesterol at 5.2 sits marginally above the desirable threshold of 5.18 and is flagged by the laboratory, but in context this is driven almost entirely by an HDL of 2.1. HDL is the protective cholesterol that carries lipids away from artery walls, and 2.1 is well above the optimal threshold of 1.6 for women. Her LDL, the cholesterol fraction that deposits into artery walls, is 2.76, which is within the laboratory range of 0.5 to 3 but above the optimal target of below 2.6. ApoB, the protein that carries LDL and VLDL particles and is the single best measure of the number of particles capable of entering the artery wall, is 0.72, below the desirable threshold of 0.9 and below the optimal target of 0.8. Triglycerides at 0.82 are below the optimal threshold of 1.0, and her TG to HDL ratio, a surrogate for insulin resistance and small dense LDL, is an excellent 0.39. Lp(a), an inherited lipoprotein that adds cardiovascular risk and cannot be changed by diet or exercise, is below 25, which is below the ideal threshold of 32 and is genuinely useful information: it means that any future changes in her lipid profile will be entirely within her control. ApoA1 at 1.88 is healthy and her ApoB to A1 ratio at 0.38 is well within the lower-risk zone below 0.6. Remnant cholesterol at 0.27 is within the optimal band of below 0.5. The only lipid marker outside optimal is the LDL at 2.76, which is mildly above the 2.6 optimal target but well within the laboratory range and not a concern at her age and risk profile.\n\nHer thyroid is working well. TSH, the hormone the pituitary gland releases to tell the thyroid how hard to work, is 2.81, within the laboratory range though above the optimal band of 1.0 to 2.5 by a small margin. Free T4, the inactive thyroid hormone, is 20.9, sitting in the upper part of the reference range and marginally above the optimal band. Free T3, the active thyroid hormone that cells actually use for energy and metabolism, is 6.2, which is well within the optimal band of 4.5 to 6.5 and confirms excellent conversion from T4 to T3. Her FT3 to FT4 ratio at 0.297 is within the optimal range. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. The TSH sitting just above the optimal ceiling is a very minor finding in the context of negative antibodies and strong T3 and T4 output, and it does not explain her fatigue or brain fog.\n\nHer immune markers are reassuring. IgG, IgA and IgM, the three main classes of antibody, are all within their reference ranges. IgE, which rises with allergic responses and parasitic infections, is 2.57, very low and well within range. Rheumatoid factor is below 4, negative. Tissue transglutaminase IgA, the screening test for coeliac disease (an autoimmune reaction to gluten that causes gut inflammation and malabsorption), is negative at 0.643, ruling out coeliac as a cause of her bloating. Creatine kinase, the muscle enzyme that rises with training or muscle damage, is 141, within range and consistent with her moderate training.\n\nHer calcium and bone markers are healthy. Corrected calcium at 2.39 is within the ideal range. Phosphate at 1.4 and magnesium at 0.92 are both within their optimal bands. PTH (parathyroid hormone, the hormone that regulates calcium levels) is 1.007, at the very bottom of the reference range of 0.98 to 4.73 but just inside it, and consistent with the calcium being comfortably within range.\n\nTurning to findings that need attention. Her neutrophils are 1.96, just below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the body's first line of defence against bacterial infection. At 1.96 against a lower limit of 2.0, this is a marginal result. In women of European ancestry, a mild reduction in neutrophils (sometimes called benign ethnic neutropenia) is not uncommon, but given that she is White European, the more likely explanations here are her alcohol intake, recreational drug use, or simply natural variation at the time of the blood draw. Her total white cell count at 5.17 is healthy, and her lymphocytes at 2.62 are within the optimal range, so the immune system as a whole is functioning normally. This is worth mentioning to her GP but is not alarming at this margin.\n\nHer reticulocyte absolute count is 33.8, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count suggests the marrow is producing red cells at a slower rate than expected. Her haemoglobin at 124 is within range (120 to 150) but sits in the lower quarter, and her red blood cell count at 3.88 is at the very bottom of the range (3.8 to 4.8). Put together, the bone marrow is keeping her just above the line but without much reserve. The most likely explanations are her low dietary intake (volume 4 out of 10 on a convenience-based diet with minimal fruit and vegetables), her alcohol consumption at 10 to 14 drinks per week, and possibly her folate level, which at 7 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. Folate is essential for red blood cell production, and a diet with 0 to 1 portions of vegetables and fruit a day will struggle to supply enough. Her MCV at 97.9, while within range, is in the upper quarter and is consistent with either early folate insufficiency or an alcohol effect, both of which push red cells to be slightly larger. This is worth a GP review, particularly to repeat the count and check whether folate supplementation and dietary improvement bring it up.\n\nHer transferrin is 2.32, below the lower limit of 2.5. Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. A low transferrin alongside a normal ferritin (92, well within range) and a healthy transferrin saturation (35%, within the optimal band of 25 to 40%) is most commonly seen as a response to chronic low-grade inflammation or as a nutritional signal. Her CRP at 0.6 is low, which makes acute inflammation unlikely, but transferrin is a negative acute phase protein, meaning it can fall even with subtle inflammatory signals that CRP does not capture. Her ESR at 14 is above the upper limit of 12 for women, which adds a small signal of background inflammation. The combination of low transferrin, mildly raised ESR, and an adequate but not generous ferritin suggests her body's iron transport system is running lean. With her diet quality being poor and her alcohol intake elevated, improving both is likely to bring transferrin back into range.\n\nHer ESR (erythrocyte sedimentation rate, a non-specific marker of inflammation measured by how quickly red blood cells settle in a tube) is 14 against an upper limit of 12 for women. This is a mild elevation. ESR can rise with infection, inflammation, anaemia, or high protein levels, but it is also influenced by age, sex and menstrual cycle. At 14 against 12, and with a CRP of only 0.6, this does not point to any significant inflammatory process. It is consistent with the mildly low transferrin and may simply reflect the combination of moderate alcohol and a nutrient-poor diet.\n\nHer C-Peptide is 1.04 ug/L (344 pmol/L), marginally below the lower limit of 1.1 ug/L (364 pmol/L). C-Peptide is released by the pancreas in equal amounts to insulin and is used to measure how much insulin the pancreas is actually producing. In the context of a normal fasting glucose, a normal HbA1c, and a healthy fasting insulin of 5.71, this does not suggest pancreatic insufficiency. It reflects low insulin demand from a lean woman with good insulin sensitivity. This is not a concern.\n\nHer ALP (alkaline phosphatase, an enzyme found in bone, liver and bile ducts) is 42, below the lower limit of 46. A low ALP in a young woman with otherwise perfect liver markers is most commonly associated with low zinc, low magnesium, or low protein intake. Her magnesium is fine at 0.92, and zinc was not measured on this panel, but her diet, with minimal fruit and vegetables and a reliance on convenience food, could easily leave zinc intake below optimal. Low ALP can also be seen with low vitamin D, and her vitamin D at 70 is sufficient but below the optimal threshold of 75. This is a minor finding but it adds to the picture of a diet that is not supplying enough micronutrients.\n\nHer cortisol is 522 nmol/L. The morning reference range is 145 to 619, so this is within range, but it sits in the upper quarter. Cortisol is the body's primary stress hormone, released by the adrenal glands in response to physical and psychological stress. In a woman who reports that stress feels hard to manage constantly, wakes tired most mornings, and feels tired on waking with brain fog, an upper-quarter cortisol is worth noting. The pattern she describes, tired on waking but presumably more alert later in the day, combined with constant stress, is consistent with a cortisol rhythm that is running high but potentially shifted, with the body producing plenty of cortisol but the normal morning peak not translating into refreshed waking. This is not an abnormal result, but it is a finding that connects directly to her symptoms and goals.\n\nHer vitamin B12 at 352 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. B12 is essential for nerve function, energy production, red blood cell formation and mood regulation, and at 352 it is not deficient but not optimal either. A convenience-based diet with low vegetable intake may also be low in B12-rich foods (meat, fish, eggs, dairy), and alcohol impairs B12 absorption. Given her symptoms of brain fog, low energy, and low mood, bringing B12 into the optimal range is a worthwhile step.\n\nHer folate at 7 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. Folate is a B vitamin critical for DNA synthesis, red blood cell production, and methylation, the biochemical process that supports mood, detoxification and energy. At 0 to 1 portions of fruit and vegetables a day, her dietary folate intake is almost certainly inadequate. The below-optimal folate connects to her low reticulocyte count (the bone marrow needs folate to produce red cells), her MCV sitting in the upper quarter (early folate insufficiency causes red cells to enlarge), and potentially to her low mood and brain fog (folate is a cofactor in serotonin and dopamine production).\n\nHer vitamin D at 70 is sufficient by NHS standards (above 50) but below the optimal threshold of 75. At her BMI of 20.7, sequestration in fat tissue is not an issue, so a modest supplementation dose will bring this into the optimal range.\n\nHer oestradiol at 140 pmol/L falls within the follicular phase range of 71.6 to 529.2. Her progesterone at 2.55 nmol/L is within the follicular phase range and consistent with either follicular phase timing or suppression by her progesterone-only contraceptive. LH at 5.46 falls within the contraceptive range of 0.7 to 5.6, and FSH at 12.33 is mildly above the follicular range upper limit of 10.2 but consistent with normal variation and not suggestive of ovarian insufficiency at 33. Testosterone at 1.0, SHBG at 60, free androgen index at 1.67, DHEA-S at 4.3, and prolactin at 329 are all within their respective ranges. Her hormonal profile is consistent with her contraceptive use and does not explain her symptoms.\n\nHer RDW at 11.4 is marginally below the lower limit of 11.6. RDW measures the variation in red blood cell size, and a slightly low value simply means her red cells are very uniform in size. This is not a clinical concern.\n\nHer total antioxidant activity at 1.89 is above the upper limit of 1.77. This marker measures the blood's overall capacity to neutralise free radicals. A mildly elevated result can be seen with supplementation, certain dietary patterns, or simply natural variation, and is not a concern.\n\nHer De Ritis ratio (AST divided by ALT) is 3.0, above the upper normal limit of 1.6. This ratio is used to help distinguish causes of liver enzyme elevation, but it is only clinically meaningful when ALT or AST are themselves raised. Her ALT is 7 and her AST is 21, both well within range, and the ratio is high simply because the ALT is extremely low, making the denominator tiny. This is an arithmetic artefact, not a liver concern.\n\nHer urea to creatinine ratio at 104.9 is marginally above the upper normal limit of 100. This ratio can rise with dehydration, high protein intake, or upper gastrointestinal bleeding. In the context of normal urea, normal creatinine, and excellent kidney function, this is most likely a reflection of hydration status at the time of the blood draw and is not a concern.\n\nHer urinalysis is clean. Protein, glucose, ketones, urobilinogen, casts, nitrites, white cells and red cells are all negative. Urine culture and bacterial count are pending.\n\nCA-125, a tumour marker sometimes used in ovarian cancer screening, is 16.4, well within the normal range of below 35. Ca19-9, a marker associated with pancreatic and gastrointestinal conditions, is 30.36, within range but in the upper portion of the reference range below 37. This is not alarming in isolation; Ca19-9 can be mildly raised with benign conditions including inflammation, liver conditions, and ovarian cysts, and at 30.36 it does not warrant investigation on its own. \n\nThe central message of this report is a disconnect between how she feels and how her blood looks. Her major organ systems, liver, kidneys, thyroid, cardiovascular, immune, and blood sugar, are all working well. Her PhenoAge is sixteen years younger than her calendar age. The bloods do not reveal a single disease process behind her symptoms. This is actually useful information, because it narrows the search. The most likely drivers of her brain fog, fatigue, low mood and anxiety are not hidden disease but the cumulative effect of several lifestyle factors acting together. Her diet is built around convenience food with almost no fruit or vegetables, providing inadequate folate, likely inadequate zinc, and suboptimal B12. She drinks 10 to 14 units of alcohol a week, which disrupts sleep architecture even when total sleep hours look adequate, impairs B vitamin absorption, suppresses bone marrow output, and drives the low-grade inflammatory signal seen in the ESR and transferrin. She vapes nicotine, which constricts blood vessels, raises baseline cortisol, and impairs sleep quality. She reports recreational drug use, which depending on substance and frequency can profoundly disrupt serotonin and dopamine regulation, worsen anxiety, and impair recovery. Her stress is constant and unmanaged, and her cortisol reflects that. She sleeps 7 to 8 hours but wakes tired, which points to poor sleep quality rather than insufficient quantity, and alcohol, nicotine and stress are the three most common destroyers of sleep quality in someone her age. Each of these factors on its own might be manageable; together, they explain her symptom picture comprehensively. The path to feeling better runs through food, alcohol, stress management and sleep quality, not through medication or supplementation alone.","links":"The findings in this report cluster into two stories. The first is a nutritional deficit story. A diet built around convenience food with 0 to 1 portions of fruit and vegetables a day, eaten in slightly below-average quantities, is not supplying enough of the micronutrients that the bone marrow, nervous system and mood pathways need to function well. Folate at 7 is below optimal, B12 at 352 is below optimal, vitamin D at 70 is below optimal, and ALP at 42 is below range in a way that may reflect low zinc intake. The reticulocyte absolute count at 33.8 and the haemoglobin sitting in the lower quarter of range are the bone marrow's response to this shortfall: it is producing red blood cells, but only just enough. The MCV at 97.9 in the upper quarter of range is consistent with early folate insufficiency. Transferrin below range at 2.32 adds another layer, suggesting the iron transport system is running lean even though iron stores themselves are adequate.\n\nThe second story is the combined effect of alcohol, nicotine, recreational drug use and chronic unmanaged stress on sleep quality, mood and energy. Her cortisol at 522 is not abnormal, but it sits in the upper quarter of the morning range in a woman who reports constant stress, and the pattern of waking tired despite adequate sleep hours points to a cortisol rhythm that is not delivering a clean, refreshing wake signal. Alcohol at 10 to 14 units per week fragments deep sleep and REM sleep even when total hours are maintained, and this alone can explain morning fatigue and brain fog. Nicotine via vaping maintains a chronic low-level vasoconstriction and sympathetic drive that raises baseline stress hormones. Recreational drugs, depending on the substance, deplete serotonin and dopamine reserves and can cause rebound anxiety and low mood that persists for days after use. The mildly low neutrophils at 1.96 and the raised ESR at 14 may reflect alcohol's effect on immune cell production and low-grade systemic inflammation.\n\nWhat has been excluded is as important as what was found. Her thyroid is functioning well with negative antibodies, ruling out autoimmune thyroid disease as a cause of fatigue and brain fog. Her blood sugar and insulin are healthy, ruling out insulin resistance and early diabetes. Her liver is clean despite the alcohol load. Her kidneys are excellent. Coeliac disease has been excluded, so her bloating is not gluten-driven autoimmune gut damage. Her CRP is low, ruling out significant systemic inflammation. Her iron stores are adequate, ruling out iron-deficiency anaemia. Her hormones are consistent with her contraceptive use and show no pathology.\n\nThe loose end is the bloating. The bloods have excluded coeliac disease and significant inflammation, but blood tests cannot diagnose irritable bowel syndrome, food intolerances, small intestinal bacterial overgrowth (SIBO), or the gut motility effects of stress and poor diet. A diet high in processed food and sugar and low in fibre is one of the most common drivers of bloating and digestive discomfort, and the combination of alcohol and stress compounds this by altering gut motility and the gut microbiome. If dietary improvement does not resolve the bloating within two to three months, a hydrogen breath test for SIBO or lactose intolerance would be a proportionate next step.\n\nThe overall picture is of a woman whose underlying biology is strong, her organs are healthy, her cardiovascular risk is low, and her biological age is remarkably young, but whose daily inputs (diet, alcohol, nicotine, drugs, unmanaged stress) are eroding how she feels day to day. The good news is that every driver identified in this report is modifiable.","lifestyle":"Add a portion of vegetables or fruit to every meal, starting with whichever meal is easiest. A handful of spinach in a wrap, a banana with breakfast, cherry tomatoes as a snack. Anchor: before you eat anything else on the plate, put the vegetable or fruit there first. Why: at 0 to 1 portions a day, folate, zinc, magnesium, potassium and fibre are all running below what the body needs, and the low folate at 7, low ALP at 42, and low reticulocyte count at 33.8 are the blood's way of showing it.\nAdd a palm-sized portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, beans or lentils. Anchor: same rule, protein goes on the plate before anything else. Why: at a volume of 4 out of 10 on a convenience-based diet, total protein is likely well below the 72 to 88 grams per day her body needs to support training, mood and recovery. Protein also provides the B12 and iron her blood needs.\nSwap one convenience or takeaway meal per day for something home-cooked or assembled from whole ingredients. It does not need to be elaborate: a tin of sardines on toast with salad, a chicken stir-fry with frozen vegetables, overnight oats with fruit and yoghurt. Anchor: start with whichever meal is currently most processed. Why: this single change will raise folate, B12, zinc and fibre intake while reducing sugar and refined carbohydrate.\nReduce alcohol from 10 to 14 drinks per week to 7 or fewer, ideally 4 or fewer, starting by choosing three alcohol-free days per week. Anchor: pick the three days now and write them down. Why: alcohol at this level is fragmenting her deep sleep (explaining the tired-on-waking pattern despite 7 to 8 hours), suppressing bone marrow output (reticulocytes 33.8, neutrophils 1.96), impairing B vitamin absorption (B12 352, folate 7), and contributing to the low-grade inflammation behind the ESR of 14 and transferrin of 2.32.\nSet a fixed wake time seven days a week and get outside within 30 minutes of waking, even for five minutes. Anchor: alarm goes off, feet on floor, front door open. Why: morning light resets the cortisol rhythm that is currently running high (522) without delivering a clean wake signal, and a fixed wake time is the single most effective tool for improving sleep quality.\nSet a caffeine cut-off of 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine after early afternoon delays sleep onset and reduces deep sleep, compounding the effect of alcohol and stress on her sleep quality.\nBuild a ten-minute wind-down before bed: phone in another room, lights dimmed, and a brief breathing exercise (four counts in, six counts out, for two minutes). Anchor: set a phone alarm 30 minutes before intended sleep time; when it goes off, the phone goes to charge in the kitchen. Why: her stress is constant and unmanaged, and even a short parasympathetic routine before bed lowers cortisol and improves sleep quality, which is the gateway to better mood, energy and brain fog.\nCalorie target: approximately 1,750 to 1,950 kcal per day (BMR estimated at 1,340 kcal, multiplied by 1.45 to 1.6 for her activity level, with no deficit needed at BMI 20.7). Protein target: 72 to 88 grams per day (1.3 to 1.6g per kg at 55 kg with moderate training). She is currently under-eating; the goal is to eat more, not less, but to eat better.","flags":"Neutrophils 1.96, marginally below the lower limit of 2.0. Total white cell count is healthy at 5.17 and lymphocytes are normal. Most likely reflects alcohol intake, recreational drug use, or normal variation. Worth mentioning to GP for a baseline record but not alarming at this margin.\nReticulocyte absolute count 33.8, below the lower limit of 50. Haemoglobin 124 (lower quarter of range), RBC 3.88 (bottom of range), MCV 97.9 (upper quarter). The bone marrow is producing red cells at a reduced rate. Most likely driven by suboptimal folate (7, below optimal 8), poor diet quality, and alcohol effect. Recommend folate supplementation, dietary improvement, and a repeat full blood count in three months.\nTransferrin 2.32, below the lower limit of 2.5, alongside normal ferritin (92) and healthy transferrin saturation (35%). Likely reflects nutritional status and the mild inflammatory signal seen in the ESR. Not consistent with iron overload or deficiency.\nESR 14, above the upper limit of 12 for women. CRP 0.6 is low, so significant inflammation is excluded. The mild elevation is consistent with alcohol intake and suboptimal nutrition. Minor finding.\nC-Peptide 1.04 ug/L (344 pmol/L), marginally below the lower limit of 1.1 ug/L. Glucose, HbA1c and insulin are all healthy, so this reflects low insulin demand in a lean, insulin-sensitive woman rather than pancreatic insufficiency.\nALP 42, below the lower limit of 46. All other liver markers are clean. Most likely reflects low zinc intake from a diet with minimal fruit, vegetables and whole foods. Minor finding.\nFolate 7, within laboratory range (3 to 17) but below the optimal threshold of 8. Likely contributing to the low reticulocyte count and upper-quarter MCV. Dietary improvement and supplementation recommended.\nB12 352, within laboratory range (193 to 982) but below the optimal threshold of 500. May contribute to brain fog, low mood and fatigue. Supplementation recommended.\nVitamin D 70, sufficient but below the optimal threshold of 75. Supplementation recommended.\nDe Ritis ratio (AST:ALT) 3.0, above the upper limit of 1.6. This is an arithmetic artefact of a very low ALT (7); both liver enzymes are well within range and no liver concern exists.\nUrea:creatinine ratio 104.9, marginally above the upper limit of 100. Normal urea and creatinine, excellent kidney function. Most likely hydration status at the time of the draw.\nRDW 11.4, marginally below the lower limit of 11.6. Indicates very uniform red cell size. Not a clinical concern.\nTotal antioxidant activity 1.89, above the upper limit of 1.77. Not a concern; reflects the blood's capacity to neutralise free radicals.\n\nReassuring negatives: thyroid function normal with negative antibodies, coeliac screen negative, blood sugar and insulin healthy with no insulin resistance, liver function excellent with no fibrosis, kidney function excellent, CRP low ruling out significant inflammation, iron stores adequate, all immunoglobulins within range, rheumatoid factor negative, calcium and bone markers healthy, all tumour markers tested within range, urinalysis clean, cardiovascular risk profile favourable with Lp(a) below ideal threshold.\n","recommendations":"Discuss the low neutrophil count (1.96, below limit of 2.0) and low reticulocyte count (33.8, below limit of 50) with her GP. Bring the full blood count results and mention the dietary context and alcohol intake. The GP may wish to repeat these in three months after dietary changes to see whether they normalise.\nMention the below-range transferrin (2.32) alongside the normal ferritin and saturation. The GP may wish to check this on the repeat blood count to confirm it is nutritional rather than inflammatory.\nIf bloating and digestive discomfort persist after two to three months of dietary improvement, ask the GP about a hydrogen breath test for SIBO (small intestinal bacterial overgrowth) or lactose intolerance, as blood tests cannot diagnose these.\nDiscuss stress management options with the GP. With stress constantly hard to manage and cortisol in the upper quarter of range (522), the GP may be able to refer for cognitive behavioural therapy, counselling, or a structured stress management programme.\nMention the recreational drug use to the GP honestly; certain substances can suppress bone marrow output and deplete neurotransmitters, and the GP needs the full picture to interpret future blood tests.\nCalorie target: 1,750 to 1,950 kcal per day (no deficit; she is lean at BMI 20.7 and under-eating). Protein target: 72 to 88 grams per day. Retest: repeat full blood count, reticulocytes, transferrin, folate, B12 and vitamin D in three months to confirm the dietary and supplementation changes are working.","supplementation":"Methylfolate (5-MTHF), 400 to 800 mcg daily, taken with breakfast. Why: folate at 7 is below the optimal threshold of 8 and is the most likely driver of the low reticulocyte count and upper-quarter MCV. Methylfolate is the active form and is better absorbed than folic acid.\nVitamin B12, sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue in the morning. Why: B12 at 352 is below the optimal threshold of 500 and may be contributing to brain fog, low mood and fatigue. Sublingual delivery bypasses gut absorption, which alcohol can impair.\nVitamin D3 (cholecalciferol), 2,000 IU daily, taken with a meal containing fat. Why: vitamin D at 70 is sufficient but below the optimal threshold of 75. At her lean BMI, 2,000 IU will bring this into the optimal range within two to three months.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones and teeth and away from arteries, and should always accompany vitamin D supplementation.\nOmega-3 fish oil, 2 grams of combined EPA and DHA daily, taken with food. Why: a convenience-based diet is almost certainly low in omega-3 fatty acids, which support brain function, mood, and help modulate the low-grade inflammatory signal behind her ESR of 14. EPA in particular has evidence for mood support.\nMagnesium glycinate, 300 mg before bed. Why: her magnesium at 0.92 is within range but magnesium glycinate supports sleep quality (she wakes tired despite adequate hours), helps with stress and anxiety, and the glycinate form is gentle on the gut, which matters given her bloating.\nDo not take iron supplements. Her ferritin is 92 and her iron and saturation are healthy; additional iron is unnecessary and could cause gastrointestinal side effects.\nThe most important changes from this report are not supplements. They are eating real food with vegetables at every meal, reducing alcohol to under seven drinks per week, managing stress with a daily wind-down routine, and getting morning light to reset the cortisol rhythm that is currently leaving her tired on waking.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 83 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 82.9. Weakest systems: iron studies 62%, hematology 64%, inflammation 65%. Biggest drags: Reticulocyte Absolute Count, Alkaline Phosphatase, Transferrin, Erythrocyte Sedimentation Rate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"16.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2224","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 16.9 against a calendar age of 33, this places her biological age over sixteen years younger than her actual age. This is an exceptionally strong result, driven by her low CRP (0.6), healthy lymphocytes, good albumin, low creatinine and healthy white cell count. It confirms that despite her lifestyle concerns, her underlying biology is ageing slowly. The main factors that could push PhenoAge up over time would be sustained alcohol intake, poor nutrition and chronic stress, all of which are addressed in this report.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, so it measures the risk being built rather than the ten-year event probability. At 20, this sits right at the upper edge of the ideal band of 0 to 20. The score is held low by her excellent HDL (2.1), low triglycerides (0.82)
