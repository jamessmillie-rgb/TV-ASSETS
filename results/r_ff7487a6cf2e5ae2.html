mation. At 14, this is above the upper limit of 12 for women. However, her CRP at 0.6 is low, which rules out significant systemic inflammation. A mildly raised ESR with a low CRP is commonly seen with moderate alcohol intake and suboptimal nutrition. The menstrual cycle can also influence ESR. This is a minor finding and not concerning in isolation.","low_causes":"Normal, polycythaemia","high_causes":"Inflammation, infection, anaemia, pregnancy, autoimmune disease, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0600","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP (C-reactive protein) is a precise measure of low-grade systemic inflammation produced by the liver. At 0.6, this is well below the optimal threshold of 1.0 and well below the cardiovascular risk threshold of 3.0. This confirms there is no significant inflammatory process and that the mildly raised ESR is not driven by active disease. At her alcohol intake, a CRP this low is a genuinely positive finding.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"35.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4882","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. At 35%, this is within the optimal range of 25 to 40%, meaning the iron transport system is working efficiently and delivering iron to the bone marrow and tissues at an appropriate rate.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5125","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3801","upper_optimal_position":"0.6137","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the bloodstream. At 20.5, this is within the reference range and the optimal band, confirming adequate circulating iron.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2872","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. At 2.32, this is below the lower limit of 2.5. Transferrin is a negative acute phase protein, meaning it can fall with inflammation, but her CRP is low at 0.6, making acute inflammation an unlikely explanation. The more probable drivers are poor nutritional intake (transferrin production depends on adequate protein and overall nutrition) and the effect of regular alcohol on liver protein synthesis. Her ferritin and saturation are both healthy, so this is not an iron overload pattern. Improving diet quality and reducing alcohol should bring transferrin back into range.","low_causes":"Inflammation, liver disease, malnutrition, protein deficiency, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"53.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4351","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3749","upper_optimal_position":"0.6033","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron. At 53.8, this is within range and consistent with adequate iron status. TIBC tends to rise when iron stores are low and fall when they are high; at 53.8 with a ferritin of 92, this confirms balanced iron metabolism.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4306","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/mL","description":"Ferritin reflects the body's stored iron reserves. At 92, this is well within the optimal range of 40 to 150 for women, confirming healthy iron stores. Iron deficiency is not contributing to her fatigue or low red cell production.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Inflammation, infection, liver disease, haemochromatosis, iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"137","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4359","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance outside cells. At 136, this is within the reference range of 133 to 146 but marginally below the optimal band of 137 to 143. A sodium in the lower part of range can be seen with adequate hydration and is not a concern at this level.","low_causes":"Overhydration, SIADH, diuretics, vomiting, diarrhoea","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base status. At 98, this is within range and the optimal band.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, renal tubular acidosis, excessive saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5242","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the main buffer in the blood that maintains acid-base balance. At 26.3, this is within range and the optimal band, confirming healthy acid-base regulation.","low_causes":"Metabolic acidosis, diarrhoea, renal tubular acidosis","high_causes":"Vomiting, metabolic alkalosis, chronic respiratory disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is an electrolyte critical for nerve signalling and heart rhythm. At 4.9, this is within the reference range of 3.5 to 5.3 but marginally above the optimal band of 3.8 to 4.8. Her kidney function is excellent, so this is not a concern.","low_causes":"Diarrhoea, vomiting, diuretics, low potassium diet","high_causes":"Kidney disease, sample delay, ACE inhibitors, excessive supplementation, acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/L","description":"Urea is a waste product from protein metabolism filtered by the kidneys. At 6.4, this is within the reference range and the optimal band, confirming the kidneys are clearing waste efficiently.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4309","lower_normal":"49","upper_normal":"90","lower_optimal":"52","upper_optimal":"82","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3577","upper_optimal_position":"0.6016","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism cleared by the kidneys. At 61, this is within the reference range and the optimal band for a woman of her size and muscle mass. It confirms healthy kidney filtration.","low_causes":"Low muscle mass, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood. At above 90, this is above both the normal threshold of 60 and the optimal threshold of 90, confirming excellent kidney function. The Cystatin C-based eGFR of 102 provides a more precise figure and confirms this.","low_causes":"Kidney disease, dehydration, nephrotoxic medications","high_causes":"Hyperfiltration (early diabetes, pregnancy)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4227","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function in lean or highly muscular individuals. At 0.93, this is within the optimal range and gives a Cystatin C eGFR of 102, confirming excellent kidney health.","low_causes":"Very rare","high_causes":"Kidney disease, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"306","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4786","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by normal cell turnover. At 306, this is within the reference range and the optimal band for women, confirming the kidneys are clearing uric acid efficiently.","low_causes":"Low purine diet, Wilson's disease, SIADH","high_causes":"High purine diet, alcohol, gout, kidney disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and Cystatin C to give the most accurate estimate of kidney filtration. At 102, this is well above both the normal threshold of 60 and the optimal threshold of 90, confirming excellent kidney function at 33.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"104.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6939","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio divides urea by creatinine and can help distinguish causes of elevated urea. At 104.9, this is marginally above the upper limit of 100. A mildly elevated ratio with normal urea, normal creatinine and excellent kidney function is most likely a reflection of hydration status at the time of the blood draw. It can also be seen with relatively low muscle mass (lower creatinine denominator). This is not a clinical concern.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 76, this is within the reference range and the optimal band, confirming adequate protein status.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Dehydration, chronic infection, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and acts as an antioxidant. At 43, this is within the reference range and the optimal band, reflecting healthy liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin is a group of proteins that includes immunoglobulins (antibodies) and transport proteins. At 33, this is within the reference range of 18 to 36 but marginally above the optimal band of 22 to 32. A globulin in the upper part of range can reflect immune system activity and is not concerning, particularly when the individual immunoglobulin levels (IgG, IgA, IgM) are all within range, as hers are.","low_causes":"Immunodeficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3143","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in bone, liver and bile ducts. At 42, this is below the lower limit of 46. All other liver markers are clean, so this is not liver-related. A low ALP in a young woman is most commonly associated with low zinc, low magnesium, or low vitamin D. Her magnesium is within range at 0.92, and her vitamin D is sufficient but below optimal at 70. The most likely contributor is low zinc intake from a diet with minimal fruit, vegetables and whole foods. Zinc was not tested on this panel, but it is a common deficiency on a convenience-based diet. This is a minor finding and does not require GP action; improving dietary quality and potentially adding a zinc-containing supplement would be the first step.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, anaemia, Wilson's disease","high_causes":"Bone growth (youth), liver disease, bile duct obstruction, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 10, this is within range and the optimal band, confirming healthy red cell turnover and liver clearance.","low_causes":"Normal variation","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. At 7, this is well below the optimal threshold of 25 for women, which is about as clean as this marker gets. Despite a convenience-based diet and 10 to 14 alcoholic drinks per week, the liver shows no sign of metabolic strain.","low_causes":"Normal, very low muscle mass","high_causes":"Liver disease, fatty liver, alcohol, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. At 21, this is within the reference range and the optimal band. A healthy AST alongside a very low ALT confirms the liver is not under strain.","low_causes":"Normal variation","high_causes":"Liver disease, muscle damage, heart damage, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4706","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT is the liver enzyme most sensitive to alcohol intake, medication effects and metabolic strain. At 18, this is well within the optimal threshold of below 25 for women. Despite drinking 10 to 14 units per week, the liver is handling the alcohol load without visible enzyme elevation. This does not mean the alcohol is harmless (its effects on sleep, mood and bone marrow are still present), but the liver itself is coping well.","low_causes":"Normal variation","high_causes":"Alcohol, liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3931","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that combines age, platelets, ALT and AST to estimate the likelihood of liver fibrosis (scarring). At 1.14, this is below the 1.3 threshold for further investigation and well below 1.45, confirming no evidence of liver fibrosis.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis, age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch. At 52, this is within the reference range and optimal band, confirming the pancreas is functioning normally. This helps exclude pancreatic inflammation as a cause of her bloating.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6099","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. At 52, this is within the reference range and the optimal band. Along with the normal amylase, this confirms healthy pancreatic function.","low_causes":"Chronic pancreatitis","high_causes":"Acute pancreatitis, gallbladder disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.41, this is within the reference range and the optimal band, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive supplementation, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4917","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration to give a more accurate picture. At 2.39, this is within the reference range and the optimal band, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5709","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/L","description":"Phosphate works with calcium for bone mineralisation and energy metabolism. At 1.4, this is within the reference range and the optimal band.","low_causes":"Vitamin D deficiency, hyperparathyroidism, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5575","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions including muscle function, nerve signalling, blood sugar regulation and sleep. At 0.92, this is within the optimal range of 0.85 to 1.05. This is a reassuring finding given her training and stress levels.","low_causes":"Alcohol, poor diet, diuretics, diarrhoea, medications","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"70","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune function, mood and energy. It is produced in the skin by sunlight and is difficult to obtain in sufficient amounts from food alone. At 70, this is above the sufficiency threshold of 50 but below the optimal range of 75 to 120. Given that this blood was taken in late October, when UV levels in the UK are too low for vitamin D synthesis, supplementation through the winter months is particularly important. A daily dose of 2,000 IU of vitamin D3 taken with a fat-containing meal should bring this into the optimal range within two to three months.","low_causes":"Lack of sunlight, dark skin, obesity, malabsorption, low dietary intake","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.007","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3357","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3351","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid hormone) is released by four small glands behind the thyroid to regulate calcium and phosphate levels. It rises when calcium or vitamin D is low. At 1.007, PTH is at the bottom of the reference range and within the optimal band, which is consistent with her healthy calcium and sufficient vitamin D levels. There is no suggestion of parathyroid disease.","low_causes":"Normal, post-thyroidectomy, magnesium deficiency, autoimmune hypoparathyroidism","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"352","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4005","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, DNA synthesis, red blood cell formation and the production of neurotransmitters involved in mood and cognition. At 352, this is within the laboratory range of 193 to 982 but below the optimal threshold of 500. At this level, deficiency symptoms are unlikely but she may not be getting the full benefit of B12 for energy, mood and brain function, all of which are goals in this report. A convenience-based diet and regular alcohol (which impairs B12 absorption) are the likely explanations. Sublingual methylcobalamin at 1,000 mcg daily is recommended.","low_causes":"Poor dietary intake, alcohol, malabsorption, vegan diet, pernicious anaemia, metformin","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is critical for DNA synthesis, red blood cell production, and the methylation pathway that supports mood, detoxification and energy. At 7, this is within the laboratory range of 3 to 17 but below the optimal threshold of 8. At 0 to 1 portions of fruit and vegetables a day, dietary folate intake is almost certainly inadequate. Green leafy vegetables, beans, lentils and citrus fruits are the richest food sources. The below-optimal folate is likely contributing to her low reticulocyte count (the bone marrow needs folate to produce red cells) and her MCV sitting in the upper quarter (early folate insufficiency causes red cells to enlarge). It may also contribute to low mood, as folate is a cofactor for serotonin production. Methylfolate supplementation at 400 to 800 mcg daily is recommended alongside dietary improvement.","low_causes":"Poor dietary intake (low vegetables and fruit), alcohol, malabsorption, pregnancy, methotrexate","high_causes":"Supplementation, B12 deficiency (trap hypothesis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5019","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of HDL, LDL and VLDL cholesterol. At 5.2, this is marginally above the desirable threshold of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk; what matters is the breakdown. In her case, the elevation is driven by her excellent HDL of 2.1, which is protective. Her ApoB at 0.72 is below the desirable threshold, confirming a low number of atherogenic particles. In this context the elevated total cholesterol is driven by her high HDL rather than by an excess of atherogenic particles, and her ApoB at 0.72 confirms the particle burden is low.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2412","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the form in which fat circulates in the bloodstream. They rise with sugar intake, alcohol, and insulin resistance. At 0.82, this is below the optimal threshold of 1.0, which is an excellent result given her daily sugar intake and alcohol consumption. Low triglycerides alongside high HDL is a strong metabolic profile.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar diet, alcohol, insulin resistance, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2372","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. At 0.37, this is within range and the optimal band, consistent with her healthy triglyceride level.","low_causes":"Low triglycerides, malnutrition","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL is the protective cholesterol that removes excess cholesterol from artery walls and carries it back to the liver for disposal. At 2.1, this is well above the optimal threshold of 1.6 for women and is an excellent result. A high HDL is one of the strongest protective factors against cardiovascular disease and explains why her total cholesterol appears elevated while her actual risk is low.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, metabolic syndrome","high_causes":"Exercise, moderate alcohol, genetics, lean body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6347","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL is the cholesterol fraction that deposits into artery walls and drives atherosclerosis. At 2.76, this is within the laboratory range of 0.5 to 3 but above the optimal target of below 2.6. However, her ApoB at 0.72, which directly measures the number of atherogenic particles, is below the desirable threshold. This suggests the LDL particles may be larger and less dense (less harmful), consistent with her excellent triglycerides and HDL. At her age and risk profile, with a cardiovascular risk score of 20 and Lp(a) below 25, this is a monitor-and-improve situation, not a treatment situation. Increasing soluble fibre, oily fish and reducing saturated fat from convenience food will help bring this down.","low_causes":"Very low fat diet, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2756","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC:HDL ratio divides total cholesterol by HDL and is a quick measure of cardiovascular risk. At 2.48, this is well below both the laboratory threshold of 4.5 and the optimal ceiling of 3.5, driven by her excellent HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"40.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the total is protective. At 40%, this is excellent and well above the minimum of 20%. It confirms a favourable lipid balance.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the atherogenic (artery-damaging) cholesterol fractions combined. At 3.1, this is within the laboratory range of below 4 but above the optimal target of 2.6. This is consistent with the LDL of 2.76 being mildly above optimal and gives the same message: lifestyle improvement will bring this down, but the ApoB at 0.72 confirms the particle count is not high.","low_causes":"Low LDL, low triglycerides","high_causes":"High LDL, high triglycerides, diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6714","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles. It activates the enzyme that allows HDL to pick up cholesterol from artery walls. At 1.88, this is well above the healthy threshold of 1.4 and the optimal threshold of 1.6, consistent with her excellent HDL.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Exercise, genetics, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single protein present on every LDL, VLDL and Lp(a) particle. Because there is exactly one ApoB per particle, this marker directly counts the number of atherogenic particles in the blood, making it the single best predictor of cardiovascular risk. At 0.72, this is below both the desirable threshold of 0.9 and the optimal target of 0.8. This is an excellent result and confirms that despite the total cholesterol and LDL being marginally above optimal, the actual particle count is low.","low_causes":"Low LDL, hyperthyroidism, malabsorption","high_causes":"High LDL, familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB:A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.383","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3192","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB to A1 ratio balances the number of atherogenic particles (ApoB) against the protective particles (ApoA1). At 0.38, this is well within the lower-risk zone of below 0.6 and the optimal zone of below 0.5, confirming a favourable balance between harmful and protective lipoproteins.","low_causes":"High HDL, low LDL","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lp(a) is an inherited lipoprotein that adds cardiovascular risk independently of LDL and cannot be changed by diet, exercise or most medications. It deposits cholesterol, encourages clotting and drives inflammation. At below 25, this is below the ideal threshold of 32 nmol/L. This is genuinely useful information: it means that any change in her lipid profile in future will be driven entirely by modifiable factors such as diet and exercise, not by an inherited risk she cannot control.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5543","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6286","units":"U/L","description":"CK is an enzyme released when muscle cells are damaged, whether through exercise, injury or disease. At 141, this is within the reference range and the optimal band for women (25 to 200). This level is consistent with moderate training and shows the muscles are recovering well without excessive damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6131","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"FT4 is the inactive form of thyroid hormone circulating in the blood. The body converts it to the active form, T3, in the tissues. At 20.9, this is within the reference range but marginally above the optimal band ceiling of 20. In the context of a normal TSH and an excellent FT3, this simply reflects good thyroid output. No action needed.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, early thyroid disease, thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5114","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is released by the pituitary gland to tell the thyroid how hard to work. A high TSH means the pituitary is asking for more thyroid hormone; a low TSH means it is getting plenty. At 2.81, this is within the laboratory range of 0.55 to 4.78 but marginally above the optimal band of 1.0 to 2.5. However, with both antibodies negative and excellent FT4 and FT3 levels, this is not a clinical concern. TSH can vary with time of day, stress and sleep quality, all of which are relevant factors for her. No thyroid treatment is needed.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"FT3 is the active thyroid hormone that cells actually use for metabolism, energy production, brain function and temperature regulation. At 6.2, this is well within the optimal range of 4.5 to 6.5, confirming excellent thyroid hormone conversion and function. This is the most relevant thyroid marker for symptoms, and a strong FT3 rules out thyroid underperformance as a cause of her fatigue or brain fog.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, thyroid medication (T3 supplementation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are produced by the immune system when it attacks the thyroid gland, and are the primary marker for autoimmune thyroid disease (Hashimoto's thyroiditis). At below 6.6, this is well within the normal range and negative, ruling out autoimmune thyroid disease.","low_causes":"Normal, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid gland to produce hormones. At below 1.3, this is negative, which is consistent with more than 80% of the population. Combined with the negative TPO antibodies, autoimmune thyroid disease is confidently excluded.","low_causes":"Normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.297","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4627","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3:FT4 ratio measures how efficiently the body converts inactive T4 to active T3. At 0.297, this is within the optimal range of 0.27 to 0.4, confirming efficient thyroid hormone conversion. Good conversion is important for energy, mood and metabolism.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"30.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4103","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3378","units":"U/mL","description":"CA 19-9 is a tumour marker primarily associated with pancreatic cancer but also produced in small amounts by normal bile duct, pancreatic and gastrointestinal tissue. At 30.36, this is within the reference range of below 37 but in the upper portion. CA 19-9 can be mildly elevated with benign conditions including bile duct inflammation, pancreatitis, liver conditions, ovarian cysts and endometriosis. In the absence of symptoms pointing to pancreatic or gastrointestinal disease, and with normal amylase and lipase, this does not warrant investigation. It is worth noting for future reference, and a repeat at the next test will confirm it remains stable.","low_causes":"Normal, Lewis antigen negative blood type (some people cannot produce CA 19-9)","high_causes":"Pancreatic cancer, bile duct cancer, pancreatitis, liver disease, ovarian cysts","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"16.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2343","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"U/mL","description":"CA-125 is a protein produced by ovarian tissue and is used as a screening marker for ovarian cancer. It can also be raised by menstruation, endometriosis, fibroids and pelvic i d reflects a healthy adaptive immune system. It sits above the optimal band ceiling of 12, which simply reflects normal immune activity and is not a concern.","low_causes":"Immunodeficiency, medications (immunosuppressants)","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"g/L","description":"IgM is the first antibody the body produces in response to a new infection. At 1.2, this is within range and the optimal band, confirming a healthy acute immune response.","low_causes":"Immunodeficiency, medications","high_causes":"Acute infection, Waldenström's macroglobulinemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5269","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces: the gut, lungs, and urinary tract. At 2.2, this is within range and the optimal band. A healthy IgA is important for gut immunity, and it also validates the coeliac screening test (TTG-IgA), which requires adequate IgA levels to be reliable.","low_causes":"Selective IgA deficiency (genetic), immunosuppression","high_causes":"IgA nephropathy, liver disease, chronic infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group cription":"Cortisol is the body's primary stress hormone, released by the adrenal glands in a daily rhythm that peaks in the morning to help with alertness and falls in the evening to allow sleep. At 522, this is within the morning reference range of 145 to 619 but sits in the upper quarter. In a woman who reports that stress feels hard to manage constantly and wakes tired most mornings despite 7 to 8 hours of sleep, an upper-quarter cortisol is consistent with a stress response that is chronically activated. This is not an abnormal result, but the pattern of constant stress plus tired-on-waking energy suggests the cortisol rhythm may be shifted or flattened, delivering high levels at the wrong times. Stress management, fixed sleep-wake times, and morning light exposure are the most effective ways to restore a healthy cortisol rhythm.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid medication, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3832","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"71.6","upper_optimal":"529.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone in premenopausal women, essential for reproductive health, bone density, brain function and mood. At 140, this falls within the follicular phase range of 71.6 to 529.2. The level depends on where in the menstrual cycle the blood was drawn, and on her progesterone-only contraceptive, which can influence hormone levels. This is a normal result consistent with her age and contraceptive use.","low_causes":"Menopause, low body fat, excessive exercise, pituitary disease","high_causes":"Mid-cycle surge, pregnancy, PCOS, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5243","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is a hormone that rises significantly after ovulation in the luteal phase and is essential for menstrual regulation and pregnancy. At 2.55, this falls within the follicular phase range of 0 to 4.45, consistent with either follicular-phase timing or ovulation suppression by her progesterone-only contraceptive. This is a normal result in context.","low_causes":"Follicular phase, anovulation, contraceptive use, menopause","high_causes":"Luteal phase, pregnancy, adrenal overproduction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6571","lower_normal":"0.7","upper_normal":"5.6","lower_optimal":"0.7","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"LH is a pituitary hormone that triggers ovulation in women and supports the menstrual cycle. At 5.46, this is within the contraceptive reference range of 0.7 to 5.6, which is the appropriate range for a woman on a progesterone-only pill. This is a normal result.","low_causes":"Contraceptive use, pituitary disease, anorexia, stress","high_causes":"Menopause, PCOS, mid-cycle surge","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"12.33","within_norm function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
