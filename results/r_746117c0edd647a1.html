<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Chris Hill","dob":"13/12/1973","report_date":"2026-07-27","summary":"Chris is a 52-year-old male presenting with a BMI of 22.8, following a low-carb, high-protein diet rated 8 out of 10 for quality with a volume of 5 out of 10. He trains 6 times per week (3 cardio, 3 resistance) at very high intensity with 15,000 or more daily steps. He takes no medication and has no diagnosed conditions. He reports joint pain and stiffness, skin breakouts, and bloating and digestive discomfort. His goals are to improve long-term health and longevity, prevent disease, and boost his immune system.\n\nThere is a great deal of good news in this report. His cardiovascular profile is genuinely exceptional. His total cholesterol is 3.9, his LDL is 1.51, his HDL is 2.1, his triglycerides are 0.58, his ApoB is 0.75, his TC:HDL ratio is 1.86, and more than half of all the cholesterol he carries is the protective type. For a man whose primary goals are longevity and disease prevention, these are the numbers to be pleased about. His blood sugar control is excellent, with a glucose of 5.6, HbA1c of 38, and HOMA-IR of 0.68 showing his cells respond to insulin extremely well. His kidney function is healthy, confirmed by a Cystatin C of 0.98. His liver is in good health, with a Gamma GT of 7 that is about as clean as this marker gets. His vitamin D at 100 has reached the ideal range. His B12 at 608 is good. His iron stores are adequate with a ferritin of 67 and transferrin saturation of 33.77%. His thyroid is working well across all markers with negative antibodies. His prostate results are reassuring, with a PSA of 0.84 and a free ratio of 43%. His inflammation markers are low, with an ESR of 1 and CRP of 1.5. His rheumatoid factor at 4 rules out rheumatoid arthritis as a cause of the joint pain. His coeliac screen is negative. His immune antibodies are all normal. His cortisol at 317 is within the ideal range, which is genuinely reassuring given his training load. His urinalysis is normal.\n\nHowever, a pattern runs through several of the remaining findings, and it connects directly to his immune goal.\n\nHis white cell count is 3.7, below the range that starts at 4. His neutrophils, the immune cells that form the front line against bacterial infection, are 1.86 against a lower limit of 2. Sustained heavy training suppresses circulating white cells because immune cells leave the bloodstream to deal with muscle damage, and the cortisol released during exercise reduces how many new ones the bone marrow releases. With adequate recovery the count rebounds. With 6 sessions a week and 15,000 or more steps, it may not be getting the chance. This is not an immune deficiency in the medical sense, but it means the system is running with less reserve than it should, which is the opposite of what he is training for.\n\nHis reticulocyte absolute is 37.3, well below the lower limit of 50. Reticulocytes are brand new red blood cells, and this figure measures how quickly the bone marrow is producing replacements. His haemoglobin at 151 is healthy, so there is no shortage of red cells today. But production is running behind demand. His RDW is 15.2, marginally above range, which means his red blood cells are varying in size more than normal, another sign the bone marrow is working under pressure.\n\nHis ferritin at 67 is within the laboratory range but below the ideal level of 80. For a man in general this would be fine. For someone training 6 times a week, where iron demand is increased through sweat losses, mechanical destruction of red cells during impact exercise, and the raw material needed to build replacements, a ferritin nearer 100 would give more headroom. Read alongside the low reticulocyte count and the raised RDW, the iron stores are worth improving.\n\nHis testosterone is 16.2, below the ideal level of 18. Some decline at 52 is expected, but the more useful question is what is holding it there. Testosterone is sensitive to the balance between training load and available energy. When the body is working hard and not receiving quite enough fuel, it treats muscle building and reproduction as lower priorities, and testosterone production drops. His diet quality is excellent at 8 out of 10, but his volume is only 5 out of 10.\n\nPut those findings together, the suppressed white cells, the low reticulocyte production, the modest ferritin, the below-optimal testosterone, and one explanation covers all of them. He is eating a very good diet but not enough of it to support what his body is doing. The body responds by quietly downgrading the functions it can survive without in the short term: immune surveillance, red cell production, iron reserves, and sex hormones. Sports medicine calls this low energy availability, and the answer is more food and more recovery, not supplements.\n\nThe encouraging part is what is not here. His cortisol at 317 is comfortably normal. Cortisol is the marker that usually climbs once training load passes recovery capacity, and his has not. His thyroid is converting well, with a healthy free T3 of 4.8. He is close to the edge rather than well past it, and that is a much easier position to correct from.\n\nHis creatine kinase is 373, above the range that ends at 320. Creatine kinase is an enzyme stored inside muscle cells that leaks into the blood when muscle fibres are stressed and damaged, which is exactly what resistance training does. In someone who trains seriously it is normal to find it raised, particularly if the blood was taken within a couple of days of a hard session. It also explains why his ALT at 41 and AST at 42 are both at the upper end, since both enzymes are found in muscle as well as liver. His Gamma GT at 7 confirms this is muscle, not liver.\n\nHis joint pain has a clear negative answer. Rheumatoid factor is 4, CRP is 1.5, and ESR is 1. All three are low, which argues strongly against rheumatoid arthritis or any inflammatory joint condition. What is left is mechanical: training 6 times a week with incomplete recovery places sustained load on connective tissue, and the same energy shortfall that is suppressing his testosterone also reduces the raw materials available for tissue repair.\n\nHis sodium is 151, above the range that ends at 146, and his urea is 10, above its limit of 8.2. Both commonly rise together when there is not enough water in the blood relative to what is dissolved in it. Given 6 training sessions and 15,000 or more steps, sweat losses are the most likely explanation. His kidney function is normal, so this is about fluid rather than kidneys. At 151, sodium is worth confirming on a repeat test taken on a rest day.\n\nOn the bloating and digestive discomfort, his coeliac screen is negative, his amylase at 94 and lipase at 51 are both within their laboratory ranges, and his CA 19-9 is very low. There is nothing in his blood pointing to a specific digestive cause. Given the volume of protein he is eating and the training load, food volume and timing around sessions is the more likely explanation than anything structural.\n\nOn the skin breakouts, there is nothing in these results that explains them. His testosterone is not high, his inflammatory markers are low, his thyroid is normal and his allergic burden is minimal. If they persist, a GP or dermatologist is better placed than a blood test.\n\nThere is one cardiovascular finding that sits outside the otherwise excellent lipid profile. His Lipoprotein(a) is 62.25, close to twice the limit of 32. Lp(a) is a cholesterol particle similar to LDL but with an extra protein wrapped around it. That protein closely resembles one the body uses to break down blood clots, and because it is similar without being identical it interferes with clot clearance rather than helping. The result is that an Lp(a) particle deposits cholesterol, encourages clotting, and drives inflammation inside an artery wall. The level is inherited and fixed. It does not respond to le electrolytes but should be repeated when potassium is confirmed.\n\nHis ApoE genotype result is still with the laboratory and will be communicated separately.","links":"The central recommendation is straightforward: eat more of the already excellent diet, and build in genuine recovery time.\n\nAt 74kg and 180cm with 6 training sessions a week and 15,000 or more steps, caloric maintenance is approximately 2,900 to 3,300 calories. If the volume rating of 5 out of 10 is accurate, intake is likely well below that. Protein should be 118 to 148g per day, which may already be met given the high-protein approach, so most of the gap is total energy rather than protein specifically.\n\nSome reintroduction of carbohydrate around training would help. A low-carb approach is clearly working for blood sugar and triglycerides, but carbohydrate is what replaces the fuel stored in muscle. Placing 60 to 100g of carbohydrate in the two hours before or after training (rice, potatoes, oats, fruit) would support recovery without changing the rest of the diet.\n\nOne full rest day per week with no structured training and lower step count. Every fourth to sixth week, a deload: training volume reduced by roughly half for one week while keeping intensity. Deloads are standard practice for the picture this blood shows, and people almost always come back from them stronger.\n\nSleep should be 7 to 8 hours. Immune cell production and muscle repair both happen predominantly during sleep.\n\nFluid intake should be 3 to 4 litres a day given the sweat losses, with electrolytes rather than plain water alone on heavy or hot training days.\n\nIron intake should be improved through food (red meat, shellfish, dark leafy greens paired with vitamin C). Ferritin should be rechecked before supplementing, since eating more generally is likely to move it.\n\nThe Lipoprotein(a) of 62.25 should be recorded permanently in his medical notes and mentioned at the next GP visit. Close blood relatives should know it is inherited.\n\nThe sodium of 151 and urea of 10 are worth a repeat blood test on a rest day.\n\nA follow-up test in 12 weeks would show whether the changes are working. Worth repeating: full blood count with white cells and neutrophils, reticulocyte count, RDW, ferritin, testosterone, sodium and urea, creatine kinase taken at least 3 days after a hard session, and cortisol. The Lipoprotein(a) does not need repeating.","flags":"Lipoprotein(a) 62.25, against a limit of 32. Inherited cholesterol particle that promotes clotting and inflammation in artery walls. Fixed by genetics, unresponsive to diet, exercise or statins. Record permanently in medical notes. First-degree relatives may wish to be tested.\n\nWhite cell count 3.7 (below 4) and neutrophils 1.86 (below 2). Consistent with sustained training load without sufficient recovery. Immunoglobulins all normal. Not an immune deficiency, but reduced reserve.\n\nReticulocyte absolute 37.3 (below 50). Red cell production running behind demand. RDW 15.2, marginally above range. Haemoglobin normal at 151. Ferritin 67, adequate but modest for this training volume.\n\nTestosterone 16.2 (below ideal 18), with normal SHBG and LH. Consistent with low energy availability.\n\nCreatine kinase 373 (above 320). Muscle enzyme from training. ALT 41 and AST 42 at upper end from the same source. Gamma GT 7 excludes liver.\n\nSodium 151 (above 146) and urea 10 (above 8.2). Sweat losses and high protein intake. Kidney function normal (Cystatin C 0.98). Repeat on rest day.\n\nC-Peptide 123.5 (below 240), HOMA-B 26.1 (below 80), insulin 2.74 at bottom of range. All reflect low insulin demand in lean, heavily training, low-carbohydrate context. Glucose 5.6, HbA1c 38, HOMA-IR 0.68 confirm this is adaptation not insufficiency.\n\nFolate 18, marginally above range. Supplementation. Check for duplication.\n\nAnion gap 22.1 (above 16). Bicarbonate normal at 27.1. High protein and training load. Repeat.\n\nPotassium and phosphate not returned by the laboratory. Include at next test. Anion gap to be confirmed when potassium available.\n\nReassuring negatives: rheumatoid factor 4, CRP 1.5, ESR 1, all low, ruling out inflammatory joint disease. Coeliac negative and reliable. Cortisol 317 within ideal. Thyroid normal. PSA 0.84 with free ratio 43%. Urine clear.","recommendations":"Increase how much you eat. Your diet quality is good, the volume is not keeping pace with six training sessions a week and 15,000 or more steps a day. Aim for roughly 2,900 to 3,300 calories with 118 to 148g of protein.\n\nAdd 60 to 100g of carbohydrate around your training sessions, without changing the rest of your low-carbohydrate approach.\n\nTake one full rest day a week, and reduce training volume by about half for one week in every four to six.\n\nIncrease fluid intake to 3 to 4 litres a day, with electrolytes on heavy or hot training days.\n\nImprove iron intake through food, and recheck ferritin on your next test before considering a supplement.\n\nAsk your GP to record the Lipoprotein(a) of 62.25 permanently in your notes and to take it into account when assessing your cardiovascular risk. Let close blood relatives know it is inherited.\n\nAsk for a repeat blood test to confirm the sodium of 151 and urea of 10, taken on a rest day.\n\nPotassium and phosphate were not returned by the laboratory this time, so ask for both to be included at your next test.\n\nRetest in twelve weeks, covering the full blood count, reticulocytes, RDW, ferritin, testosterone, sodium, urea, cortisol and creatine kinase taken at least three days after training hard.","supplementation":"There is less to say here than usual, because your nutrient levels are largely good and the main change needed is food rather than supplements.\n\nVitamin D3 at 1,000 to 2,000 IU daily through the autumn and winter, taken with a meal containing fat since it is fat soluble, alongside vitamin K2 as MK-7 at 100 micrograms. Your level has reached 100, which is where we want it, so this is about holding position through the months when UK sunlight is too weak for your skin to make any. Vitamin D supports immune function, which is directly relevant to your white cell results.\n\nCreatine monohydrate at 3 to 5g daily if you are not already taking it. It is the most thoroughly researched supplement in sport, it supports strength and recovery, and there is growing evidence for benefit to cognition as well. Note that it raises creatine kinase and creatinine slightly, so mention it before any future blood test.\n\nMagnesium glycinate at 300 to 400mg before bed. You lose magnesium in sweat, and your level is good, so this is maintenance rather than correction. It supports sleep quality and muscle relaxation, both of which serve the recovery theme running through this report.\n\nBefore adding iron, recheck your ferritin at your next test. At 67 you are not deficient, and eating more generally may well lift it without supplementation. Iron supplements are worth taking only when there is a clear reason, since excess iron is not harmless.\n\nCheck your existing supplements for folate duplication, given your level came back marginally above range.\n\nThe most valuable changes in this report are not supplements. They are eating more, particularly around training, taking genuine rest, and drinking more. Those three would improve the immune markers, the red cell production, the iron stores, the testosterone and the hydration together, and no supplement will do that while the underlying gap between what you demand of your body and what you give it stays where it is.","biomarkers":[{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","units":"g/L","description":"Within the ideal range. Albumin is the main protein in blood and it falls when someone is genuinely underfed, so a healthy level here is worth noting given how much training you do.","low_causes":"Undernutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result": ed at 373 and your Gamma GT at 7, this is muscle rather than liver.","low_causes":"Rarely significant","high_causes":"Muscle release from training","padding":"1","one_sided":"0.5","result":"42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6354","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4583333333","range_type":"normal"},{"key":"gammagt","name":"Gamma GT","group":"LIVER & METABOLIC","units":"IU/l","description":"At 7 this is about as clean as this marker gets. Gamma GT is the liver enzyme most sensitive to alcohol, processed food and metabolic strain, and a result this low effectively rules the liver out as a source of the other raised enzymes.","low_causes":"Rarely significant","high_causes":"Alcohol, metabolic strain","padding":"1","one_sided":"0.5","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3478","lower_normal":"4","upper_normal":"73","lower_optimal":"10","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3623188406","upper_optimal_position":"0.4589371981","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","units":"umol/l","description":"Within the ideal range.","low_causes":"Rarely significant","high_causes":"Liver or gallbladder conditions","padding":"1","one_sided":"0.5","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5416666667","range_type":"normal"},{"key":"protein","name":"Total Protein","group":"LIVER & METABOLIC","units":"g/l","desc n":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333333333","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"The protective particle, which collects cholesterol back out of artery walls and returns it to the liver. At 2.1 this is a very good result and reflects the training volume, since regular exercise raises HDL more reliably than anything else.","low_causes":"Sedentary lifestyle","high_causes":"Exercise","padding":"1","one_sided":"0.5","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1","lower_normal":"1.0","upper_normal":"","lower_optimal":"1.2","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6","upper_optimal_position":"","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Excellent. Triglycerides are the form fat takes when travelling in the blood and they rise with refined carbohydrate and alcohol. A result this low reflects the low-carbohydrate approach working exactly as intended.","low_causes":"Rarely significant","high_causes":"Refined carbohydrate, alcohol","padding":"1","one_sided":"0.5","result":"0.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1706","lower_normal":"","upper_normal":"1.7","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2941176471","range_type":"no lower"},{"key":"cholesterolratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Outstanding. This compares your total cholesterol against the protective type, and 1.86 against a limit of 4.5 is about as good as this ratio gets.","low_causes":"Not significant","high_causes":"Low HDL","padding":"1","one_sided":"0.5","resu 0.3205128205","range_type":"no lower"},{"key":"apolipoproteina1","name":"Apolipoprotein A-1","group":"LIPIDS & CARDIOVASCULAR","units":"g/L","description":"Within the ideal range. ApoA-1 is the protein sitting on protective HDL particles, so it counts the protective side in the same way ApoB counts the harmful side. A strong result.","low_causes":"Sedentary lifestyle","high_causes":"Exercise","padding":"1","one_sided":"0.5","result":"1.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5612","lower_normal":"1.04","upper_normal":"2.02","lower_optimal":"1.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4897959184","upper_optimal_position":"0.6598639456","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","units":"g/L","description":"Within the target, marginally above the ideal level. ApoB counts the particles capable of depositing cholesterol into an artery wall, because each one carries exactly one ApoB protein. It is a more useful number than LDL, which only measures the cholesterol those particles are carrying between them. At 0.75 yours is good, and the small gap between this and your very low LDL is explained by the Lipoprotein(a) below, since those particles are counted here too.","low_causes":"Rarely significant","high_causes":"Lp(a) contribution, diet","padding":"1","one_sided":"0.5","result":"0.75","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3888888889","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Within the ideal range. This compares harmful particles against protective ones, and yours sits well on the right side of the line.","low_causes":"High ApoA-1","high_causes":"Elevated ApoB","padding":"1","one_sided":"0.5","result":"0.439","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3136","lower_normal":"","upper_normal":"0.7","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3571428571","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","units":"Ratio","description":"Excellent. This ratio is one of the better indicators of how well the body handles insulin, and a result this low is a strong sign.","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.276","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.092","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","units":"mmol/l","description":"Within the ideal range.","low_causes":"Not significant","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1812","lower_normal":"","upper_normal":"0.8","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3125","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","units":"nmol/l","description":"Above range at 62.25, close to twice the limit of 32, and this is the one cardiovascular finding in an otherwise excellent set of results.\n\nLp(a), said as lipoprotein little a, is a cholesterol particle similar to LDL but with an extra protein wrapped around it. That protein closely resembles one your body uses to break down blood clots, and because it is similar without being identical it gets in the way rather than helping. The result is that an Lp(a) particle does three things inside an artery wall where ordinary cholesterol does one. It deposits cholesterol, it encourages clotting at that spot, and it drives inflammation there.\n\nThe level is inherited. It was set before you were born, it does not shift with diet, exercise or weight, and statins do not lower it. That is worth saying plainly, because everything else in your lipid profile is already close to ideal. There is no lifestyle change left for you to make here. What matters instead is that the result is recorded on your medical notes and taken into account whenever your cardiovascular risk is assessed, since the standard risk calculators GPs use do not include it.\n\nIt is also inherited, so brothers, sisters and children have a meaningful chance of carrying a raised level and may want to ask about being tested. Treatments that lower Lp(a) directly are in late-stage clinical trials.","low_causes":"Genetics","high_causes":"Genetics, inherited and unchangeable","padding":"1","one_sided":"0.5","result":"62.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9727","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.21875","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"Within the laboratory range. Read alongside your HbA1c of 38 and your very low insulin, your blood sugar control is in good order.","low_causes":"Excess insulin","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"5.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.2","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4266666667","upper_optimal_position":"0.5333333333","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","units":"mmol/mol","description":"At 38, which is 5.6%. This reflects your average blood sugar over the previous three months, and anything under 42 is normal. A good result.","low_causes":"Anaemia","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4166666667","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","units":"mIU/L","description":"At the very bottom of the laboratory range. In most people a low insulin would prompt questions, but in your case it is the expected consequence of being lean, training six times a week and eating relatively few carbohydrates. Your body simply does not need much insulin to manage the sugar coming in.","low_causes":"Very high insulin sensitivity","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"2.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3354","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393124066","upper_optimal_position":"0.4439461883","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","units":"pmol/L","description":"Below range at 123.5. C-Peptide is released in equal amounts to insulin, so it measures how much insulin your pancreas is actually making, and it mirrors the low insulin above.\n\nIn someone with high or rising blood sugar this pairing would matter a great deal, because it could indicate a pancreas struggling to keep up. That is not your situation. Your blood glucose is 5.6 and your HbA1c is 38, both comfortably normal, and your HOMA-IR of 0.68 shows your cells respond to insulin extremely well. Your pancreas is producing little because little is being asked of it.\n\nThis is a normal adaptation to being lean, active and low in carbohydrate rather than a sign of anything failing. It is worth being aware of rather than acting on, and it is one of several markers in this report that would look concerning in a sedentary person and mean something quite different in you.","low_causes":"Low carbohydrate intake, high insulin sensitivity, lean body composition","high_causes":"High insulin demand","padding":"1","one_sided":"0.5","result":"123.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3025","lower_normal":"240","upper_normal":"1500","lower_optimal":"400","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3756613757","upper_optimal_position":"0.4814814815","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","units":"Ratio","description":"Within the ideal range at 0.68. This compares blood sugar against insulin to estimate how well your cells respond to it, and a low figure means they respond very well indeed. This is what good metabolic health looks like.","low_causes":"Very high sensitivity","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3933","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","range_type":"normal"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","units":"","description":"Below range at 26.1. This estimates how hard the insulin-producing cells of the pancreas are working. A low figure alongside normal blood sugar means the pancreas is not being asked to work hard, which follows directly from the low carbohydrate intake and the high insulin sensitivity. In the context of a normal glucose and HbA1c this is a reflection of demand rather than capacity.","low_causes":"Low demand, high insulin sensitivity","high_causes":"Overcompensation","padding":"1","one_sided":"0.5","result":"26.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1836","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity CRP","group":"INFLAMMATION","units":"mg/l","description":"Marginally above the ideal level, well within the laboratory range. CRP is made by the liver in response to inflammation anywhere in the body. In someone training at your volume a small amount of background inflammation from muscle repair is entirely expected, and this level is consistent with that rather than with anything pathological.","low_causes":"Rarely significant","high_causes":"Training load, infection, body fat","padding":"1","one_sided":"0.5","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.15","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.1","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","units":"mm/hour","description":"At 1, which is excellent. ESR is a broad measure of inflammation and a result this low argues strongly against any hidden inflammatory or autoimmune process. Relevant to the joint pain you describe.","low_causes":"Not significant","high_causes":"Infection, autoimmune conditions","padding":"1","one_sided":"0.5","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"","upper_normal":"12","lower_optimal":"","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2083333333","range_type":"no lower"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"INFLAMMATION","units":"Ratio","description":"Within the ideal range. This compares the two main white cell types and rises with physical stress. It is worth noting that this ratio looks normal only because both cell counts have fallen together, so it should be read alongside the individual counts rather than on its own.","low_causes":"Immune suppression","high_causes":"Physical stress, inflammation","padding":"1","one_sided":"0.5","result":"1.319","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3865","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Above range at 151, and this is the most likely candidate for a repeat test. Sodium rises when there is not enough water in the blood relative to the salt in it, which in your case is most easily explained by sweat losses across six training sessions and 15,000 or more steps a day.\n\nYour urea at 10 is raised too, and the two commonly move together when someone is running short of fluid. A single raised sodium is not something to act on by itself, but at this level it is worth confirming on a repeat sample, ideally taken on a rest day and after a normal drinking pattern rather than after training.","low_causes":"Overhydration","high_causes":"Sweat losses, insufficient fluid, high salt intake","padding":"1","one_sided":"0.5","result":"151","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7949","lower_normal":"133","upper_normal":"146","lower_optimal":"138","upper_optimal":"142","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4615384615","upper_optimal_position":"0.5641025641","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"At the lower end of the laboratory range.","low_causes":"Fluid loss","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3846","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"104","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4102564103","upper_optimal_position":"0.5641025641","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Within the ideal range. This is your main acid buffer, and a healthy level despite heavy training is a good sign.","low_causes":"Metabolic acid load","high_causes":"Not significant","padding":"1","one_sided":"0.5","result":"27.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5485","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939393939","upper_optimal_position":"0.5757575758","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"At the top of the ideal range.","low_causes":"Vitamin D deficiency","high_causes":"Parathyroid conditions","padding":"1","one_sided":"0.5","result":"2.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5789","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4619883041","upper_optimal_position":"0.5789473684","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","units":"mmol/L","description":"Marginally above the ideal ceiling, within the laboratory range. Corrected calcium adjusts the raw figure for your albumin level, making it the more accurate of the two. With a normal parathyroid hormone alongside it, this is not a concern.","low_causes":"Vitamin D deficiency","high_causes":"Concentrated blood, parathyroid conditions","padding":"1","one_sided":"0.5","result":"2.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","units":"mmol/l","description":"Toward the top of the range, which is a good place to be given how much you sweat. Magnesium is lost in sweat and supports muscle function, sleep quality and recovery.","low_causes":"Sweat losses, poor intake","high_causes":"Supplementation","padding":"1","one_sided":"0.5","result":"1.07","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6437","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172413793","upper_optimal_position":"0.6034482759","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","units":"umol/l","description":"At the top of the ideal range. Creatinine is a waste product generated by muscle, so a muscular, heavily-training man will naturally sit higher than average. This is a reflection of your build rather than your kidneys, and the Cystatin C result confirms it.","low_causes":"Low muscle mass","high_causes":"Muscle mass, training, kidney function","padding":"1","one_sided":"0.5","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.547","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3760683761","upper_optimal_position":"0.547008547","range_type":"normal"},{"key":"egfr","name":"eGFR","group":"KIDNEY FUNCTION","units":"ml/min/1.73m2","description":"At 84, marginally below the ideal 90. This estimate is calculated from creatinine, which is skewed upward by muscle mass, so it understates kidney function in someone built like you. The Cystatin C estimate of 88, which is not affected by muscle, is the more accurate figure.","low_causes":"Reduced kidney function","high_causes":"Higher is better","padding":"1","one_sided":"0.5","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin-C","group":"KIDNEY FUNCTION","units":"mg/l","description":"Within the laboratory range. Cystatin C is a protein made at a steady rate by nearly every cell in the body, which makes it a more reliable measure of kidney function than creatinine in muscular people, because it is not affected by muscle mass. The kidney function estimate from it comes out at 88, better than the creatinine-based figure of 84, which is exactly the pattern expected in a well-muscled man. Your kidneys are working properly.","low_causes":"Not significant","high_causes":"Reduced kidney function","padding":"1","one_sided":"0.5","result":"0.98","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"","upper_normal":"1.1","lower_optimal":"","upper_optimal":"0.85","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3863636364","range_type":"no lower"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","units":"mmol/l","description":"Above range at 10. Urea is the waste product left over when the body breaks down protein, and it rises for three reasons that all apply to you at once: a high-protein diet, heavy training that increases muscle protein turnover, and being short of fluid. Your kidneys are clearing it properly, as the Cystatin C confirms, so this is about intake and hydration rather than kidney function. It should come down with better fluid intake and is worth rechecking alongside the sodium.","low_causes":"Low protein intake","high_causes":"High protein diet, training load, insufficient fluid","padding":"1","one_sided":"0.5","result":"10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533333333","upper_optimal_position":"0.52","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","units":"umol/l","description":"Within the ideal range.","low_causes":"Low purine intake","high_causes":"High protein diet, dehydration","padding":"1","one_sided":"0.5","result":"350","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4659","lower_normal":"220","upper_normal":"547","lower_optimal":"280","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3944954128","upper_optimal_position":"0.5168195719","range_type":"normal"},{"key":"hemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","units":"g/L","description":"Within the ideal range. This is the protein in red blood cells that carries oxygen, and a healthy level means your training is well supported and there is no anaemia.","low_causes":"Iron, B12 or folate deficiency","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result":"151","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"130","upper_normal":"170","lower_optimal":"145","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583333333","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"hematocrit","name":"HCT","group":"HEMATOLOGY","units":"l/l","description":"Within the ideal range.","low_causes":"Anaemia","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result":"0.452","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.43","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333333333","upper_optimal_position":"0.6","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","units":"x10^12/l","description":"Within the ideal range.","low_causes":"Anaemia","high_causes":"Dehydration","padding":"1","one_sided":"0.5","result":"5.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","units":"fl","description":"Within the ideal range. MCV measures the average size of your red blood cells.","low_causes":"Iron deficiency","high_causes":"B12 or folate deficiency","padding":"1","one_sided":"0.5","result":"89.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4574","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703703704","upper_optimal_position":"0.5555555556","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","units":"pg","description":"Within the ideal range.","low_causes":"Iron deficiency","high_causes":"B12 or folate deficiency","padding":"1","one_sided":"0.5","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","units":"g/L","description":"Within the ideal range.","low_causes":"Iron deficiency","high_causes":"Concentrated blood","padding":"1","one_sided":"0.5","result":"334","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.6111111111","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","units":"%","description":"Marginally above range at 15.2. RDW measures how much your red blood cells vary in size from one another. When the bone marrow is producing cells under pressure, or is short of a raw material, some come out slightly different in size and the spread widens.\n\nThis is worth reading alongside two other results rather than on its own. Your reticulocyte count, which measures the rate at which new red cells are being made, is below range at 37.3. And your ferritin, the storage form of iron, is 67, which is fine for a man in general but modest for one training six times a week. Your haemoglobin is healthy, so nothing is wrong today. What these three together suggest is that red cell production is running slightly behind the demand your training places on it.","low_causes":"No deficiency","high_causes":"Iron demand from training, production under pressure","padding":"1","one_sided":"0.5","result":"15.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6857","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.380952381","upper_optimal_position":"0.5238095238","range_type":"normal"},{"key":"plateletcount","name":"Platelets","group":"HEMATOLOGY","units":"x10^9/L","description":"Within the ideal range.","low_causes":"Bone marrow conditions","high_causes":"Inflammation","padding":"1","one_sided":"0.5","result":"243","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4526","lower_normal":"150","upper_normal":"410","lower_optimal":"200","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974358974","upper_optimal_position":"0.5897435897","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","units":"fL","description":"Within the ideal range.","low_causes":"Bone marrow suppression","high_causes":"Platelet turnover","padding":"1","one_sided":"0.5","result":"8.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"8","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333333333","upper_optimal_position":"0.6555555556","range_type":"normal"},{"key":"wbc","name":"White cell count","group":"HEMATOLOGY","units":"x10^9/L","description":"Below range at 3.7. This is the total count of immune cells circulating in your blood, and it is one of the two findings that speak directly to your goal of strengthening your immune system.\n\nSustained heavy training suppresses circulating white cells. The mechanism is well described: during and after hard exercise, immune cells leave the bloodstream and move into tissues to deal with the damage training causes, and the cortisol released during exercise reduces how many are released from the bone marrow. With adequate recovery the count rebounds. With six sessions a week and 15,000 or more steps a day it may not be getting the chance to.\n\nThis is not an immune deficiency in the medical sense and it does not mean you are ill. It means the system is running with less spare capacity than it should have, which is the opposite of what you are training for.","low_causes":"Heavy training load, insufficient recovery, low energy availability","high_causes":"Infection","padding":"1","one_sided":"0.5","result":"3.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3167","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5555555556","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophils","group":"HEMATOLOGY","units":"x10^9/L","description":"Below range at 1.86. Neutrophils are the immune system's front line against bacterial infection, and they make up the largest share of your white cell count, so they explain most of the shortfall above.\n\nThis is the marker that most directly answers your goal of improving immune function. It is also the one most responsive to changing what you are already doing. Neutrophil counts recover with rest days, with sleep, and with eating enough to cover the cost of training. They do not respond to immune supplements.","low_causes":"Heavy training load, insufficient recovery","high_causes":"Bacterial infection","padding":"1","one_sided":"0.5","result":"1.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.324","lower_normal":"2","upper_normal":"7","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocytes","group":"HEMATOLOGY","units":"x10^9/L","description":"Within the laboratory range, marginally below the ideal level. Lymphocytes handle viral defence and long-term immune memory.","low_causes":"Heavy training, immune suppression","high_causes":"Viral infection","padding":"1","one_sided":"0.5","result":"1.41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4017","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"monocytecount","name":"Monocytes","group":"HEMATOLOGY","units":"x10^9/L","description":"Within the laboratory range, at the lower end.","low_causes":"Bone marrow suppression","high_causes":"Chronic infection","padding":"1","one_sided":"0.5","result":"0.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3542","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.375","upper_optimal_position":"0.5416666667","range_type":"normal"},{"key":"eosinophilcount","name":"Eosinophils","group":"HEMATOLOGY","units":"x10^9/L","description":"Within the ideal range.","low_causes":"Physical stress","high_causes":"Allergy","padding":"1","one_sided":"0.5","result":"0.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4236","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.1","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5277777778","range_type":"normal"},{"key":"basophilcount","name":"Basophils","group":"HEMATOLOGY","units":"x10^9/L","description":"Within the ideal range.","low_causes":"Not significant","high_causes":"Allergy","padding":"1","one_sided":"0.5","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703703704","upper_optimal_position":"0.5925925926","range_type":"normal"},{"key":"reticulocytecount","name":"Reticulocyte Count","group":"HEMATOLOGY","units":"%","description":"Within the laboratory range but below the ideal level, which is the percentage version of the result below.","low_causes":"Production under pressure","high_causes":"Blood loss","padding":"1","one_sided":"0.5","result":"0.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Retics Absolute","group":"HEMATOLOGY","units":"x10^9/L","description":"Below range at 37.3. Reticulocytes are brand new red blood cells, so this figure measures how quickly your bone marrow is turning out replacements.\n\nYour haemoglobin at 151 is healthy, so you are not short of red cells at present. What this shows is that the production line is running slower than it should be. In a man training six times a week with 15,000 or more steps a day, the demand on red cell production is high, and a low output alongside a raised RDW and a modest ferritin suggests the supply is not quite keeping pace.\n\nThis is not urgent, and it is a recovery and fuelling issue rather than a medical one. It is worth rechecking on your next test to see whether it has improved.","low_causes":"Low energy availability, iron demand from training","high_causes":"Blood loss","padding":"1","one_sided":"0.5","result":"37.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2486","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3666666667","upper_optimal_position":"0.5333333333","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","units":"umol/l","description":"Marginally above the ideal ceiling, well within the laboratory range.","low_causes":"Iron deficiency","high_causes":"Supplementation","padding":"1","one_sided":"0.5","result":"22.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5245","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"22","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3908629442","upper_optimal_position":"0.5093062606","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","units":"ng/ml","description":"Within the laboratory range but below the ideal level of 80. Ferritin is the storage form of iron and the best single measure of your iron reserves.\n\nAt 67 you are not iron deficient. But endurance and resistance training both increase iron demand, through the loss of small amounts in sweat, through the mechanical destruction of red cells in the feet during running, and through the raw material needed to build new red cells. For a man training at your volume, a ferritin toward 100 would give more headroom. Read alongside the low reticulocyte count and the raised RDW, this is worth attention.","low_causes":"Training demand, low intake, blood loss","high_causes":"Iron overload, inflammation","padding":"1","one_sided":"0.5","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3833","lower_normal":"22","upper_normal":"322","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3977777778","upper_optimal_position":"0.5311111111","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","units":"umol/l","description":"Within the ideal range.","low_causes":"Iron overload","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","result":"64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.541","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"65","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3956386293","upper_optimal_position":"0.5514018692","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","units":"%","description":"Within the ideal range. This shows what proportion of your iron transport system is carrying iron, and a healthy figure means iron is being absorbed and moved around properly. The issue is the size of the reserve rather than the transport.","low_causes":"Iron deficiency","high_causes":"Iron overload","padding":"1","one_sided":"0.5","result":"33.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":" function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}
