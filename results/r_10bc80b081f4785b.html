_optimal_position":"0.3889","upper_optimal_position":"0.6204","units":"fl","description":"MCV measures the average size of red blood cells. At 97.1, within the laboratory range but slightly above the optimal band of 80 to 95, the red cells are at the larger end. A mildly elevated MCV at 61 can reflect age-related changes. His B12 at 816 and folate at 11.2 are both adequate, ruling out the B-vitamin deficiencies that commonly cause large red cells.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, hypothyroidism, liver disease, age","padding":"1","one_sided":"0","range_type":"normal"},{"key":"redbloodcellcount","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3433","lower_normal":"4.5","upper_normal":"6.5","lower_optimal":"4.6","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"10^12/l","description":"The red blood cell count measures how many red cells are in each litre of blood. At 4.52, just inside the lower limit and slightly below the optimal band, this is consistent with the slightly larger cell size (MCV 97.1). The body compensates by making fewer, larger cells. Haemoglobin and haematocrit are both healthy, so oxygen delivery is not compromised.","low_causes":"Anaemia, B12 or folate deficiency, chronic disease","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0","range_type":"normal"},{"key":"basophilcount","name":"Basophil Count","group":"HEMATOLOGY","result":"0.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"10^9/l","description":"Basophils are white blood cells involved in allergic and inflammatory responses. At 0.04, within range, there is no allergic or inflammatory stimulation.","low_causes":"Corticosteroid use, acute infection, stress","high_causes":"Allergic reactions, hypothyroidism, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"eosinophilcount","name":"Eosinophil Count","group":"HEMATOLOGY","result":"0.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2583","lower_normal":"0.04","upper_normal":"0.4","lower_optimal":"0.04","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"10^9/l","description":"Eosinophils are white blood cells that fight parasites and play a role in allergic responses. At 0.01, below the lower limit of 0.04, this is very low but not clinically concerning in isolation. Cortisol (even at a normal level of 228) suppresses eosinophil production, and very low eosinophils are common when there is no allergic or parasitic stimulus. No action required.","low_causes":"Cortisol effect, acute stress, acute infection","high_causes":"Allergic conditions, parasitic infections, eosinophilic disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"1.02","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"1","upper_normal":"3.5","lower_optimal":"1.2","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"10^9/l","description":"Lymphocytes are immune cells including T cells, B cells and natural killer cells that fight infections and cancer. At 1.02, just inside the lower limit of 1.0 but below the optimal band, this is low-normal. In a 61-year-old with no exercise and a below-average dietary volume, this may reflect the body economising on immune cell production. It is not indicating immunodeficiency at this level.","low_causes":"Age, low caloric intake, viral infections, stress, immunosuppressive drugs","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4611","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.25","upper_optimal":"0.65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"10^9/l","description":"Monocytes are large white blood cells that migrate into tissues to become macrophages, engulfing pathogens and dead cells. At 0.43, within the optimal range, monocyte function is normal.","low_causes":"Bone marrow failure, aplastic anaemia","high_causes":"Chronic infections, autoimmune disease, haematological malignancy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophil Count","group":"HEMATOLOGY","result":"2.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4324","lower_normal":"2","upper_normal":"7.5","lower_optimal":"2.5","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"10^9/l","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 2.64, within the optimal range, the body's front-line defence is healthy.","low_causes":"Viral infections, bone marrow suppression, medications, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0","range_type":"normal"},{"key":"whitebloodcellcount","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3567","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"10^9/l","description":"The total white blood cell count measures all immune cells circulating in the blood. At 4.14, just inside the lower limit of 4.0, this is low-normal. The main contributors to the low total are the low eosinophils and lymphocytes at the bottom of range. In a man with no infections, no medications that suppress the immune system, and a low dietary volume, this is consistent with the body running lean on immune cell production. It is not a clinical concern at this level but reinforces the importance of eating adequate calories and protein.","low_causes":"Low caloric intake, viral infections, bone marrow suppression, medications, age","high_causes":"Infection, inflammation, stress, corticosteroids, leukaemia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"plateletcount","name":"Platelet Count","group":"HEMATOLOGY","result":"194","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3813","lower_normal":"150","upper_normal":"450","lower_optimal":"170","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5963","units":"10^9/l","description":"Platelets are cell fragments that help blood clot. At 194, within the optimal range, clotting function is normal.","low_causes":"Bone marrow disorders, medications, viral infections, liver disease","high_causes":"Inflammation, infection, iron deficiency, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"iron","name":"Iron","group":"IRON STUDIES","result":"13.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4278","lower_normal":"5.8","upper_normal":"34.5","lower_optimal":"10","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3822","upper_optimal_position":"0.5908","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates through the day and with meals. At 13.9, within the optimal range, iron availability is healthy.","low_causes":"Iron deficiency, chronic disease, poor absorption","high_causes":"Haemochromatosis, iron overload, haemolysis, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"66.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3888","lower_normal":"19.999","upper_normal":"300","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5476","units":"ug/l","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. At 66.45, within the optimal range of 50 to 200 for a male, iron stores are healthy and adequate.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"57.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4540","lower_normal":"44.8","upper_normal":"80.6","lower_optimal":"50","upper_optimal":"75","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3818","upper_optimal_position":"0.6156","units":"umol/l","description":"TIBC measures the maximum amount of iron ","name":"Testosterone","group":"HORMONES","result":"38.600","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8350","lower_normal":"6.68","upper_normal":"25.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5283","upper_optimal_position":"0.7225","units":"nmol/l","description":"Testosterone is the primary male sex hormone, driving muscle mass, bone density, libido, mood and energy. At 38.6 nmol/L, well above the upper limit of 25.7 for a male, this is an unusually high level at 61. In a man reporting no exogenous testosterone use, anabolic supplements or relevant medication, this warrants investigation. His LH at 4.9 and FSH at 2.07 are not suppressed, which would be expected if exogenous testosterone were being used. His DHEA-S is at the floor of its range, arguing against an adrenal source. His GP should repeat this on a fasting morning sample (8 to 9 am) and, if confirmed, arrange testicular ultrasound and consider adrenal imaging.","low_causes":"Ageing, obesity, chronic illness, medications, pituitary disorders","high_causes":"Exogenous testosterone, testicular or adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone","group":"HORMONES","result":"0.532","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7822","lower_normal":"0.127","upper_normal":"0.482","lower_optimal":"0.2","upper_optimal":"0.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3962","upper_optimal_position":"0.6420","units":"nmol/l","description":"Free testosterone is the small fraction of testosterone not bound to proteins, and it is the form that can act directly on tissues. At 0.532, above the upper limit of 0.482, this is elevated in line with the high total testosterone. Despite his SHBG being at the ceiling of its range (75.9), which usually binds and inactivates testosterone, there is so much testosterone that a significant amount remains free.","low_causes":"Ageing, high SHBG, obesity, chronic illness","high_causes":"High total testosterone, low SHBG, exogenous testosterone","padding":"1","one_sided":"0","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"172.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7039","lower_normal":"41.4","upper_normal":"159","lower_optimal":"50","upper_optimal":"140","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3561","upper_optimal_position":"0.6165","units":"pmol/l","description":"Oestradiol is the primary oestrogen, present in men in small amounts where it supports bone health, brain function and cardiovascular health. At 172 pmol/L, above the upper limit of 159, this elevation follows logically from the high testosterone. An enzyme called aromatase converts testosterone to oestradiol, so more testosterone naturally produces more oestradiol. If the testosterone normalises on repeat testing, the oestradiol is expected to follow.","low_causes":"Low testosterone (no substrate for aromatase), low body fat","high_causes":"High testosterone, obesity (more aromatase in fat tissue), liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6873","lower_normal":"0","upper_normal":"0.47","lower_optimal":"0","upper_optimal":"0.47","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Progesterone is primarily a female hormone but is present in small amounts in men, where it is produced by the adrenal glands and testes as an intermediate in testosterone synthesis. At 0.97, above the male upper limit of 0.47, this is elevated. In the context of the high testosterone picture, the elevated progesterone may share the same upstream explanation, as progesterone is a precursor in the steroid hormone pathway. This should be considered alongside the other hormone findings in GP investigation.","low_causes":"","high_causes":"Adrenal or testicular overproduction, congenital adrenal hyperplasia, tumour","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sexhormonebindingglobuli","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"75.90","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6609","lower_normal":"20.6","upper_normal":"76.7","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3596","upper_optimal_position":"0.5472","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, making them inactive. Higher SHBG means less free hormone available to act on tissues. At 75.9, at the very top of the range (20.6 to 76.7) and well above the optimal band, the body appears to be producing more SHBG to try to buffer the high testosterone. Despite this high SHBG, free testosterone is still above range, indicating just how much testosterone is being produced.","low_causes":"Obesity, insulin resistance, hypothyroidism, androgen excess","high_causes":"Ageing, liver disease, hyperthyroidism, low body weight, high oestrogen","padding":"1","one_sided":"0","range_type":"normal"},{"key":"igf1","name":"Insulin-like Growth Factor-1 (IGF-1)","group":"HORMONES","result":"14.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4682","lower_normal":"7.9","upper_normal":"24.9","lower_optimal":"10","upper_optimal":"22","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3804","upper_optimal_position":"0.6157","units":"nmol/l","description":"IGF-1 is a growth hormone mediator that promotes cell growth, muscle protein synthesis and tissue repair. At 14.8, within the optimal range, growth hormone signalling is healthy for 61.","low_causes":"Growth hormone deficiency, malnutrition, liver disease, ageing","high_causes":"Growth hormone excess (acromegaly), high protein intake","padding":"1","one_sided":"0","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"228","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3878","lower_normal":"138","upper_normal":"690","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3710","upper_optimal_position":"0.5520","units":"nmol/l","description":"Cortisol is the body's main stress hormone, regulating metabolism, immune function and the stress response. It follows a natural rhythm, peaking in the early morning and declining through the day. At 228, within the laboratory range, this is at the lower end. The time of the blood draw affects the interpretation: if drawn in the afternoon, 228 would be entirely expected. If drawn first thing in the morning, it would be on the lower side but still within range.","low_causes":"Adrenal insufficiency, late-day sampling","high_causes":"Stress, early morning sampling, Cushing's syndrome, medications","padding":"1","one_sided":"0","range_type":"normal"},{"key":"folliclestimulatinghormo","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"2.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3525","lower_normal":"1.5","upper_normal":"12.4","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3497","upper_optimal_position":"0.6117","units":"iu_l","description":"FSH stimulates sperm production in the testes. In men, it is also used to assess the pituitary-gonadal axis. At 2.07, within the optimal range, FSH is not suppressed, which is notable given the very high testosterone. If he were using exogenous testosterone, FSH would typically be suppressed below range.","low_causes":"Exogenous testosterone use, pituitary disease","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0","range_type":"normal"},{"key":"luteinisinghormone","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4928","lower_normal":"1.7","upper_normal":"8.6","lower_optimal":"2.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6141","units":"iu_l","description":"LH stimulates the Leydig cells in the testes to produce testosterone. At 4.9, mid-range and within optimal, this is not suppressed despite the very high testosterone. This means the pituitary gland has not detected excess testosterone and reduced its LH output, which is an important clue: it suggests the testes may be hyper-responsive to normal LH stimulation, or there is an additional production source.","low_causes":"Exogenous testosterone use, pituitary disease, severe illness","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"187","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4748","lower_normal":"86","upper_normal":"324","lower_optimal":"100","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3922","upper_optimal_position":"0.5798","units":"miu/l","description":"Prolactin is a pituitary hormone involved in immune function and reproductive health. Elevated levels can suppress testosterone and cause symptoms. At 187, within the optimal range, prolactin is healthy and not contributing to any hormonal imbalance.","low_causes":"","high_causes":"Pituitary adenoma (prolactinoma), medications, stress, hypothyroidism","padding":"1","one_sided":"0","range_type":"normal"},{"key":"dheas","name":"Dehydroepiandrosterone Sulphate (DHEAs)","group":"HORMONES","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"1.5","upper_normal":"17.7","lower_optimal":"3","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3426","upper_optimal_position":"0.5494","units":"umol/l","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 1.5 umol/L (approximately 553 ug/dL), at the very bottom of the reference range, this is low for 61 but DHEA-S naturally declines with age. The low DHEA-S is an important clue in the hormone picture: it argues against an adrenal source for the elevated testosterone, because an adrenal tumour would typically elevate DHEA-S along with testosterone.","low_causes":"Ageing, adrenal insufficiency","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (females)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"2.210","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"0.35","upper_normal":"5.5","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3730","upper_optimal_position":"0.4632","units":"miu/l","description":"TSH is produced by the pituitary gland to tell the thyroid how much hormone to make. A high TSH means the pituitary is shouting at a sluggish thyroid; a low TSH means the thyroid is producing too much. At 2.21, within the optimal range of 1.0 to 2.5, the pituitary is satisfied with thyroid output. This rules out thyroid dysfunction as a cause of his resting heart rate change.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, Hashimoto's thyroiditis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5587","lower_normal":"11.9","upper_normal":"21.6","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4052","upper_optimal_position":"0.6107","units":"pmol/l","description":"FT4 is the main hormone produced by the thyroid gland. It is converted to the more active FT3 in tissues. At 18.6, within the optimal range of 14 to 20, thyroid hormone production is healthy.","low_causes":"Hypothyroidism, pituitary disease","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3","name":"Free Tri-iodothyronine (FT3)","group":"THYROID","result":"4.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4653","lower_normal":"3.1","upper_normal":"6.8","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4586","upper_optimal_position":"0.6397","units":"pmol/l","description":"FT3 is the active thyroid hormone that drives metabolism in every cell. At 4.57, just inside the optimal range of 4.5 to 6.5, conversion from FT4 is working adequately.","low_causes":"Poor T4-to-T3 conversion, non-thyroidal illness, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tbg","name":"Thyroxine-binding globulin (TBG)","group":"THYROID","result":"8.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3474","lower_normal":"6.3","upper_normal":"22.7","lower_optimal":"10","upper_opti c injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hpylori","name":"H. pylori","group":"DIGESTIVE","result":"10.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0664","lower_normal":"0","upper_normal":"81.07","lower_optimal":"0","upper_optimal":"40","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2467","units":"u/ml","description":"This measures antibodies to Helicobacter pylori, a bacterium that can cause stomach ulcers, gastritis and, rarely, stomach cancer. At 10.76, well below the threshold of 81.07, there is no evidence of active or significant past H. pylori infection. This is relevant given his frequent NSAID use, which can damage the stomach lining; the absence of H. pylori reduces that risk.","low_causes":"","high_causes":"Active or past H. pylori infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"gastrin","name":"Gastrin","group":"DIGESTIVE","result":"7.10","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3370","lower_normal":"6","upper_normal":"55","lower_optimal":"10","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4150","upper_optimal_position":"0.5966","units":"pmol/l","description":"Gastrin is a hormone that stimulates stomach acid production. At 7.10, just inside the lower limit of 6, this is low and suggests the stomach is not overproducing acid. This is relevant because PPI medications lower gastrin over time, and his GP should confirm whether he takes a PPI.","low_causes":"PPI use, low stomach acid","high_causes":"Zollinger-Ellison syndrome, H. pylori, chronic gastritis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"coeliac","name":"Anti-Tissue Transglutaminase Antibodies (Coeliac)","group":"AUTOIMMUNE & CELIAC","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0286","lower_norm e most accurate non-invasive estimate of kidney function. At 89, just below the optimal threshold of 90, kidney function is solid for 61.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"59.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio helps distinguish between kidney and pre-renal causes of elevated urea. At 59.8, within the optimal range, hydration and kidney function are balanced.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"metabolic_assessment","name":"Metabolic Assessment","group":"GLUCOSE & INSULIN","result":"Excellent","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Glucose 4.95, HbA1c 30.6, HOMA-IR 0.83, fasting insulin 26.1 pmol/L and adiponectin 8.44. Exceptional insulin sensitivity and blood sugar control for age. The isolated fructosamine elevation at 325 is not supported by any other metabolic marker.","low_causes":"","high_causes":"","padding":"1","one_sided":"0","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3786","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and gives an approximation of what the average blood sugar has been over the past three months. At 5.3 mmol/L, within the optimal range, this confirms sustained healthy blood sugar levels.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4710","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG Index combines fasting triglycerides and glucose to estimate insulin resistance. It is an alternative to HOMA-IR that does not require an insulin measurement. At 8.29, within the optimal range, this confirms the healthy insulin sensitivity shown by HOMA-IR.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1660","lower_normal":"","upper_normal":"2.5","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) combines fasting glucose and insulin to estimate how resistant the body's cells are to insulin. A lower number means better insulin sensitivity. At 0.83, well below the optimal threshold of 1.5, his cells respond efficiently to insulin. This is one of the strongest metabolic results in the report.","low_causes":"High insulin sensitivity","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"60","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"%","description":"HOMA-B estimates beta cell function, meaning how hard the pancreatic cells that produce insulin are working. At 52, below the lower limit of 60, this looks low on paper. However, HOMA-B should be interpreted alongside glucose and HbA1c. With a fasting glucose of 4.95 and an HbA1c of 30.6, both optimal, the low HOMA-B reflects low insulin demand rather than pancreatic failure. The pancreas does not need to work hard because the body is very insulin-sensitive.","low_causes":"Beta cell exhaustion","high_causes":"Compensation for insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucoseinsulinratio","name":"Glucose:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"23.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"4.5","upper_normal":"","lower_optimal":"7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7778","upper_optimal_position":"1.0000","units":"mg/dL per mIU/L","description":"This ratio reflects how much glucose is circulating relative to the insulin needed to manage it. A higher number means less insulin is needed per unit of glucose, indicating better insulin sensitivity. At 23.7, well above the optimal floor of 7, this confirms excellent insulin sensitivity.","low_causes":"Insulin resistance","high_causes":"High insulin sensitivity, type 1 diabetes (if very high)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"adiponectininsulinratio","name":"Adiponectin:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"0.3","upper_normal":"","lower_optimal":"0.7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"1.0000","upper_optimal_position":"1.0000","units":"ratio","description":"This ratio combines adiponectin (which improves insulin sensitivity) with insulin (which rises with resistance). A higher ratio suggests better metabolic health. At 2.25, above the optimal floor of 0.7, this confirms the excellent metabolic picture seen across all glucose and insulin markers.","low_causes":"Low adiponectin with high insulin, metabolically unhealthy weight","high_causes":"High insulin sensitivity, leanness","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cardiac_assessment","name":"Cardiac Risk Assessment","group":"CARDIAC MARKERS","result":"Clear","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Troponin T below 3.0, CK-MB 0.924, myoglobin 17.39, FABP-3 1.68 and D-Dimer 0.289. No evidence of cardiac muscle damage, active clot formation or acute cardiovascular event. The resting heart rate increase is not explained by these markers.","low_causes":"","high_causes":"","padding":"1","one_sided":"0","range_type":"normal"},{"key":"immune_assessment","name":"Immune Assessment","group":"IMMUNOLOGY","result":"Low-normal","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lowe 0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"502","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6013","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines platelets, neutrophils and lymphocytes into a single inflammation score. At 502, within the laboratory range but above the optimal band of 150 to 450, this is again driven by the low lymphocyte count rather than by high inflammatory markers. His CRP being below 0.30 confirms there is no true systemic inflammation.","low_causes":"","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytehdlratio","name":"Monocyte:HDL Ratio","group":"INFLAMMATION","result":"0.41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3417","lower_normal":"","upper_normal":"0.6","lower_optimal":"","upper_optimal":"0.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"This ratio combines monocytes (inflammatory cells) with HDL (protective lipoproteins). A lower ratio is better. At 0.41, just above the optimal threshold of 0.4, this is mildly elevated because of the low HDL rather than high monocytes. Raising HDL would bring this into the optimal zone.","low_causes":"","high_causes":"Inflammation with low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroid_assessment","name":"Thyroid Assessment","group":"THYROID","result":"Working well","within_normal":"TRUE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"TSH 2.21 (optimal), FT4 18.6 (optimal), FT3 4.57 (within optimal), anti-TPO and anti-Tg both negative. Thyroid function is healthy with no autoimmune thyroid disease.","low_causes":"","high_causes":"","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.246","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"This ratio shows how efficiently FT4 is being converted to the active FT3. At 0.246, within the laboratory range but slightly below the optimal band of 0.27 to 0.40, conversion is adequate but not maximal. Selenium and zinc support the deiodinase enzymes that perform this conversion. His zinc at 12.3 is at the lower end of optimal; ensuring adequate selenium from diet (Brazil nuts, seafood) may help.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tshft4ratio","name":"TSH:FT4 Ratio","group":"THYROID","result":"0.119","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1983","lower_normal":"","upper_normal":"0.3","lower_optimal":"","upper_optimal":"0.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"ratio","description":"This ratio reflects how much TSH the pituitary needs to produce to maintain a given FT4 level. A lower ratio means the thyroid responds efficiently to a small TSH signal. At 0.119, within the optimal range, thyroid responsiveness is good.","low_causes":"","high_causes":"Pituitary working harder to maintain thyroid output","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hormonal_assessment","name":"Hormonal Assessment","group":"HORMONES","result":"Investigate","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Testosterone 38.6 (range 6.68-25.7), free testosterone 0.532, bioavailable testosterone 12.23, oestradiol 172 and progesterone 0.97 are all above range. LH and FSH are not suppressed. DHEA-S is at the floor of range. This pattern warrants GP investigation to identify the source of excess testosterone production.","low_causes":"","high_causes":"","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"12.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8205","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone is the sum of free testosterone and albumin-bound testosterone, representing the fraction that can enter tissues and exert effects. At 12.23 nmol/L, well above the upper limit of 9, this confirms that despite very high SHBG attempting to buffer the excess testosterone, a significant surplus remains biologically active. This reinforces the need for GP investigation of the testosterone source.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES" stosterone) and catabolic (cortisol) drive. At 169.3, well above the upper limit of 80, this is heavily skewed towards anabolic dominance, driven entirely by the exceptionally high testosterone rather than low cortisol. It does not require separate action; it follows from the testosterone finding.","low_causes":"High stress load, overtraining","high_causes":"Very high testosterone, low cortisol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cardiovascular_profile","name":"Cardiovascular Risk Profile","group":"LIPIDS & CARDIOVASCULAR","result":"Low HDL","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"ApoB 74, LDL 2.53, triglycerides 1.01, Lp(a) below 5.2 and CRP below 0.30 are all good. HDL at 1.04 is the single weak point in an otherwise excellent lipid profile. Cardiovascular Risk Score 10 out of 100 (ideal). Homocysteine at 21.7 is an independent risk factor that needs treating.","low_causes":"","high_causes":"","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4183","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This is the LDL cholesterol with the contribution of Lp(a) particles subtracted, showing the truly modifiable portion of LDL. At 2.51, virtually identical to his total LDL of 2.53, because his Lp(a) is so low that it contributes almost nothing to the LDL total. This confirms that all of his LDL is lifestyle-modifiable.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.013","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6052","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from triglycerides and HDL and reflects the balance between atherogenic and protective lipoproteins. A negative or low value indicates lower cardiovascular risk. At -0.013, within both the laboratory and optimal ranges, this is a favourable result despite the low HDL, because triglycerides are also low.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3471","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"This ratio divides LDL by HDL. A lower number means more protective HDL relative to harmful LDL. At 2.43, within the laboratory range but just below the optimal threshold of 2.5, this would move firmly into the optimal zone with an improvement in HDL from exercise.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdlcholesterol","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.99","within_normal":"TRUE","within_optimal":"TRUE"," const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
