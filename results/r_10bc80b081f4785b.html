<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Richard Guy Thomas","dob":"06/12/1964","report_date":"2026-10-22","summary":"Richard is a 61-year-old man with a BMI of 22.1. He follows a standard mixed diet with 0 to 1 portions of vegetables and fruit a day, rarely eats ultra-processed food and has something sugary on some days, with portions slightly below average. He does no structured cardio or resistance training and takes fewer than 2,000 steps a day. He sleeps 7 to 8 hours, is slow to get going in the morning, rarely finds stress hard to manage, has steady energy and drinks no alcohol. He has had bilateral chronic knee pain for four decades, with around 15 operations and an implanted spinal cord stimulator for pain management, and uses painkillers frequently. He takes zinc, vitamin D, magnesium and a multivitamin. His goals are long-term health and cardiovascular fitness. What prompted this test is a marked change in his resting pulse: for most of his life it sat a little below 60, and over the last few months it has been consistently around 80, without breathlessness or palpitations and with no family history of heart disease.\n\nStarting with his question, because it is the reason for the test. The blood tests that can explain a rising resting heart rate have been checked, and they are reassuring. An overactive thyroid is the most common blood-detectable cause, and his is working normally: TSH 2.21, free T4 18.6 and free T3 4.57 are all mid-range, and both thyroid antibodies are negative. Anaemia makes the heart beat faster to deliver oxygen, and he is not anaemic: haemoglobin 143, ferritin 66 and transferrin saturation 24%. There is no sign of heart muscle injury or strain: troponin T is below 3 (the limit is 14), and CK-MB, myoglobin and FABP-3, three further markers that rise when heart muscle is stressed, are all well within range. There is no inflammation or infection driving it (hsCRP below 0.30, D-dimer 0.289, white cells normal), his stress hormone cortisol is normal at 228, and his blood sugar is excellent. His potassium is mildly raised at 5.91 with normal kidney function. A high potassium would tend to slow the heart rather than speed it up, so it does not explain his question, and a routine repeat with his GP will confirm it.\n\nWhat blood tests cannot show is the heart's rhythm or structure, and that is the right next step. A simple ECG at his GP surgery, and if the GP thinks it appropriate a blood test called NT-proBNP (a heart strain marker not included in this panel), would complete the picture he is looking for. One factor in his own answers that commonly raises resting heart rate over months is fitness: with no structured cardio and fewer than 2,000 steps a day, the heart becomes less efficient and beats faster at rest. Given the knee history this is understandable, but it is also the most changeable part of the picture, and his goal of improving cardiovascular fitness is exactly the right one.\n\nHis cardiovascular blood profile is genuinely excellent, which matters for that same question. ApoB, the most accurate single count of the particles that deposit cholesterol in artery walls, is 0.74 g/L, comfortably low. Lipoprotein(a), the inherited cholesterol particle that raises heart risk regardless of lifestyle, is below 5.2, about as low as it is possible to measure. Small dense LDL, the most harmful subtype, is low at 16.3. His ApoB to ApoA-I ratio of 0.53 is in the low-risk band, triglycerides are 1.01, apolipoprotein E is normal and hsCRP is below 0.30, meaning there is no measurable inflammation in his arteries. His Cardiovascular Risk Score is 10 out of 100, in the ideal zone below 20. His metabolic health is outstanding: fasting glucose 4.95, HbA1c 30.6 and a HOMA-IR of 0.83 show very efficient blood sugar control with little insulin needed, and his adiponectin of 8.44, flagged as above range, is a favourable finding because adiponectin is a protective hormone released by healthy fat tissue that improves insulin sensitivity. His PhenoAge, a biological age calculated from nine blood markers, is 53.7, about seven years younger than his calendar age of 61. His liver is in excellent health (ALT 10.5, GGT 12.5, AST 20.4, bile acids and bilirubin normal), his kidneys are working well (cystatin C 0.92, combined eGFR 89, no protein in the urine), and his PSA is below 0.19 with a decreased prostate risk score. Vitamin D at 91 is good, which reflects his supplement.\n\nThe most important finding to act on is his homocysteine at 21.7, above the laboratory limit of 20 and well above the ideal of below 10. Homocysteine is an amino acid that builds up when the body's methylation process is not clearing it, and a raised level is an independent risk factor for heart disease, stroke and, over time, cognitive decline. The usual cause is low B12 or folate, but his are not low: B12 is 816, active B12 101, serum folate 11.2 and red cell folate 1157. That points to other causes. Vitamin B6 and vitamin B2 (riboflavin) are also needed to clear homocysteine, and neither is measured in this report. A common inherited variation in the MTHFR gene, which reduces how well folate is used, is another frequent cause, and riboflavin in particular helps people with that variant. His kidney function, which can also raise homocysteine, is normal. This is worth raising with his GP, who can check B6, and it is very responsive to the right B vitamins, so a recheck in three months will show whether it has come down.\n\nHis sex hormones are higher than expected for his age and should be reviewed by his GP. Total testosterone is 38.6, above the range that ends at 25.7, free testosterone is 0.532 (above 0.482), bioavailable testosterone is 12.23 (above 9) and oestradiol is 172 (above 159). Part of this is explained by his SHBG, the protein that carries testosterone in the blood, at 75.9, right at the top of its range: SHBG rises with age, a lean build and low insulin, all of which apply to him, and high SHBG makes total testosterone read high. But the free and bioavailable fractions are also above range, so it is not the whole explanation. His LH and FSH, the brain's signals to the testes, are normal at 4.9 and 2.07; if he were taking testosterone these would usually be suppressed, so this looks like his own production. If he does use any testosterone, hormone or bodybuilding product, he should tell his GP, because that would change the interpretation. Oestradiol is made from testosterone, so it rises in step with it. His sample was taken at 11:25; testosterone is highest early in the morning, so a repeat before 10am would give the GP the clearest picture. His DHEA-S at 1.5 is at the bottom of its range, which is typical at 61, and progesterone at 0.97 is marginally above the male range.\n\nThree markers on the tumour and neuroendocrine screen are mildly raised and need to be seen in context. AFP (alpha-fetoprotein) is 11.3, above the limit of 5.8. AFP is produced mainly by the liver, and his liver tests are entirely normal; mild AFP elevations in adults with healthy livers are often benign, as some people simply run higher. It should still be repeated through his GP, who may suggest a liver ultrasound if it stays raised. NSE is 17.8, just above 16.3, and pancreastatin is 77.4, above 25. NSE is also found inside red blood cells and platelets, and small rises at this margin are common and rarely meaningful on their own. Pancreastatin is commonly raised by acid-reducing medicines such as omeprazole or lansoprazole, which are often taken alongside regular painkillers, so it is worth checking whether he takes one. The other tumour markers, CEA, CA 19-9, hCG, mesothelin and PSA, are all normal. The sensible step is a routine repeat of AFP, NSE and pancreastatin, together with potassium, via his GP or at his next test.\n\nHis fructosamine is 325, above the range that ends at 300, while his HbA1c is a very low 30.6 and his glucose and insulin are excellent. These disagree, and the HbA1c, glucose and HOMA-IR together are the far more reliable picture: there is no sign of diabetes or blood sugar trouble. Fructosamine is affected by blood protein levels, so it is not a concern on its own.\n\nA few minor findings complete the picture. Complement C4 is 0.138, below the range that starts at 0.18. C4 is part of the immune system, and a low level on its own often reflects inherited variation in the number of C4 gene copies; with ANA and rheumatoid factor negative and no inflammation, it is of low significance, but worth mentioning to the GP if he gets frequent infections. His HDL is 1.04, below the ideal for long-term protection, although his ApoA-I (the protein on HDL particles) is normal at 138.8 and his total cholesterol to HDL ratio of 3.88 is good; regular aerobic exercise is the most effective way to raise HDL. B12 at 816 is above range because of his multivitamin and is harmless. Eosinophils at 0.01, beta-2-microglobulin at 0.81 and IL-8 below detection are not clinically meaningful. EBNA IgG is positive, which simply shows a past Epstein-Barr (glandular fever) infection, as in most adults.\n\nOn the knee pain and frequent painkillers: his liver and kidneys show no strain and there is no systemic inflammation, which is reassuring after four decades of use. Regular anti-inflammatory painkillers such as ibuprofen can raise blood pressure and, less commonly, heart rate, so it is worth asking his GP whether the current pain relief is the best option long term, particularly while the pulse is being looked into.\n\nTaking a step back, the overall picture is a very healthy 61-year-old with excellent cardiovascular, metabolic, liver and kidney markers. The blood tests rule out the common chemical causes of a rising resting heart rate; an ECG is the next step for that question, and rebuilding aerobic fitness in a knee-friendly way is the biggest lever he has. The things to act on are the raised homocysteine, which responds well to the right B vitamins, a GP review of the high testosterone and oestradiol, and a routine repeat of the handful of mildly raised markers (AFP, NSE, pancreastatin and potassium).","links":"Resting heart rate and the bloods: thyroid (TSH 2.21, FT4 18.6, FT3 4.57), haemoglobin (143) and iron, heart muscle markers (troponin T below 3, CK-MB, myoglobin, FABP-3), inflammation (hsCRP below 0.30) and cortisol (228) are all normal, so the common chemical causes are excluded. The remaining checks are electrical and structural: an ECG, and NT-proBNP if the GP thinks it appropriate.\nActivity and heart rate: fewer than 2,000 steps and no cardio is the most likely contributor visible in his answers; aerobic fitness lowers resting heart rate and also raises HDL (1.04), the one lipid below ideal.\nMildly raised markers: potassium (5.91), NSE (17.8) and fructosamine (325) are each only slightly above range and do not point to a single problem. A routine repeat together via his GP is the simple way to confirm them.\nHomocysteine (21.7) with normal B12 (816, active B12 101) and folate (11.2, red cell folate 1157): points to B6, B2 or an inherited folate-processing variant (MTHFR) rather than B12 or folate deficiency. Neither B6 nor B2 is measured in this report.\nSHBG (75.9) and low insulin (26.1, HOMA-IR 0.83): high SHBG explains part of the high total testosterone (38.6), but free (0.532) and bioavailable (12.23) testosterone are also above range, and oestradiol (172) rises in step with testosterone. Normal LH (4.9) and FSH (2.07) suggest his own production.\nPainkillers: frequent anti-inflammatory use can raise blood pressure and heart rate; liver (ALT 10.5, GGT 12.5) and kidneys (cystatin C 0.92) show no strain. If he also takes an acid-reducing medicine, that would explain the raised pancreastatin (77.4).","lifestyle":"Start a knee-friendly cardio habit: 20 minutes on an exercise bike, in the pool or on a rowing machine if his knees tolerate it, three times a week. Anchor: straight after his morning coffee on Monday, Wednesday and Friday. Why: aerobic fitness is the biggest single lever on resting heart rate, and it raises HDL (1.04).\nBuild daily walking gradually, in short bouts his knees allow, aiming for 5,000 steps within six weeks. Anchor: a 10-minute walk after lunch and after dinner. Why: fewer than 2,000 steps a day lets the heart lose efficiency; short bouts after meals add up without overloading the knees.\nAdd one vegetable or fruit portion to two meals a day, working towards five portions. Anchor: a handful of leafy greens or a piece of fruit with lunch and dinner. Why: leafy greens supply folate and B vitamins that help clear homocysteine (21.7), and at 0 to 1 portions a day there is a lot of room to improve.\nRecord his resting pulse each morning for two weeks before the GP appointment. Anchor: sitting on the edge of the bed, before getting up. Why: a two-week log gives the GP a far better picture than a single reading and helps judge whether an ECG or further monitoring is needed.","flags":"Homocysteine 21.7 (limit 20, ideal below 10) with normal B12 (816), active B12 (101), folate (11.2) and red cell folate (1157). Points to B6, B2 or an inherited MTHFR variant. GP to review; recheck in 3 months.\nResting heart rate risen from below 60 to around 80 (his report). Thyroid, haemoglobin, iron, heart muscle markers, inflammation and cortisol all normal. ECG via GP recommended; NT-proBNP at GP discretion.\nTestosterone 38.6 (above 25.7), free testosterone 0.532 (above 0.482), bioavailable testosterone 12.23 (above 9) and oestradiol 172 (above 159), with SHBG 75.9 at the top of range and normal LH (4.9) and FSH (2.07). Partly explained by high SHBG; normal LH and FSH suggest his own production. GP review with a repeat morning (before 10am) sample.\nAFP 11.3 (above 5.8) with entirely normal liver tests. Often benign in adults; repeat via GP, liver ultrasound if persistently raised.\nNSE 17.8 (above 16.3) and pancreastatin 77.4 (above 25). Small rises in NSE at this margin are common; pancreastatin is commonly raised by acid-reducing medicines. Routine repeat via the GP.\nPotassium 5.91 (above 5.3). Kidney function normal. Routine repeat with the markers above.\nFructosamine 325 (above 300) with HbA1c 30.6, glucose 4.95 and HOMA-IR 0.83 all excellent. No sign of diabetes; recheck.\nComplement C4 0.138 (below 0.18). Often inherited variation; low significance with negative ANA and no inflammation.\nHDL 1.04, below ideal; ApoA-I 138.8 normal and TC/HDL ratio 3.88 good. Aerobic exercise is the main lever.\nReassuring: Cardiovascular Risk Score 10, PhenoAge 53.7 (about seven years younger than his age), ApoB 0.74, Lp(a) below 5.2, small LDL 16.3, hsCRP below 0.30, HbA1c 30.6, HOMA-IR 0.83, liver and kidney markers excellent, PSA below 0.19, thyroid normal with negative antibodies, all heart muscle markers clear, vitamin D 91.\nNot reported on this occasion: vitamin B2 (glutathione reductase).","recommendations":"Book a GP appointment about the rise in resting heart rate and ask for an ECG. Take your two-week morning pulse log and this report; the GP may also consider NT-proBNP, a heart strain blood test not included in this panel.\nDiscuss the homocysteine of 21.7 with your GP. Your B12 and folate are not low, so ask whether vitamin B6 should be checked and whether testing for the MTHFR variant is worthwhile. Recheck homocysteine in 3 months.\nAsk your GP to repeat AFP, NSE, pancreastatin and potassium.\nTell your GP if you take an acid-reducing medicine such as omeprazole or lansoprazole, as this can raise pancreastatin.\nAsk your GP to review the testosterone (38.6), free and bioavailable testosterone, oestradiol (172) and SHBG (75.9) results, and to repeat them on a sample taken before 10am. If you use any testosterone, hormone or bodybuilding product, tell the GP, as it changes the interpretation.\nReview long-term pain relief with your GP, as regular anti-inflammatory painkillers can raise blood pressure and heart rate.\nRetest in 3 months: homocysteine, AFP, NSE, pancreastatin, potassium, fructosamine, HDL, and testosterone, oestradiol and SHBG on a morning sample.","supplementation":"Keep your current vitamin D, zinc, magnesium and multivitamin. Why: vitamin D at 91, zinc at 12.3 and magnesium at 0.88 are all in range, so your current routine is working.\nRiboflavin (vitamin B2), 10 to 25 mg daily with breakfast. Why: B2 is needed to clear homocysteine (21.7), it is particularly effective in people with the common MTHFR variant, and the laboratory did not process the B2 test on this sample.\nVitamin B6 (as pyridoxal-5-phosphate), up to 10 mg daily, including what your multivitamin already provides. Why: B6 is the other cofactor for clearing homocysteine; keep the total at or below 10 mg a day long term, the UK safe upper level.\nNo extra B12 or folate is needed. Why: B12 is already above range at 816 and folate stores are high (red cell folate 1157), so adding more would not lower homocysteine further.\nThe most important actions are not supplements: an ECG for the heart rate question, and building aerobic fitness in a way your knees allow.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 64.8; held to 59 by a system rated \"See your GP\". Weakest systems: specialized tests 0%, immunology 17%, tumor markers 20%. Biggest drags: Potassium, Fructosamine, Oestradiol, Testosterone.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"53.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4068","lower_normal":"","upper_normal":"66","lower_optimal":"","upper_optimal":"61","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4621","units":"years","description":"PhenoAge is a composite biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, alkaline phosphatase and white cell count. At 53.7 against a calendar age of 61, this puts him 7.3 years younger biologically. His very low CRP (below 0.30), healthy glucose (4.95) and good albumin (42.1) are the main drivers of this favourable gap. RDW is not measured on this panel, so a typical value of 13.0% was assumed; the effect on the estimate is small. Increasing exercise and dietary quality would likely widen this gap further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built in the arteries, not the ten-year chance of an event. At 10, well within the ideal zone of 20 or below, the low Lp(a), clean CRP, healthy ApoB and excellent HbA1c are the main drivers. The low HDL is the one input preventing a perfect score, and it is the most improvable through lifestyle change.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"Alanine Aminotransferase (ALT)","group":"LIVER & METABOLIC","result":"10.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0955","lower_normal":"0","upper_normal":"55","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2727","units":"IU/L","description":"ALT is an enzyme found mainly inside liver cells. When the liver is under strain, from alcohol, medication, fat deposits or infection, ALT leaks into the blood and the number rises. At 10.5, this is well below both the laboratory limit of 55 and the tighter optimal threshold of 30 for a male. For someone taking frequent paracetamol and ibuprofen, both of which the liver must process, this is genuinely reassuring and means the liver is handling its workload without visible stress.","low_causes":"","high_causes":"Liver disease, hepatitis, fatty liver, medications, obesity, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"30","upper_normal":"120","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5926","units":"IU/L","description":"ALP is an enzyme found in the liver, bile ducts and bone. It rises when bile flow is obstructed or when bone is turning over rapidly. At 52, this sits comfortably within both the laboratory range and the optimal band, indicating no biliary obstruction and normal bone metabolism.","low_causes":"Malnutrition, zinc deficiency","high_causes":"Bile duct obstruction, bone disease, Paget's disease, vitamin D deficiency","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ast","name":"Aspartate Aminotransferase (AST)","group":"LIVER & METABOLIC","result":"20.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2550","lower_normal":"0","upper_normal":"40","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"IU/L","description":"AST is an enzyme found in the liver, heart muscle and skeletal muscle. It leaks into the blood when any of these tissues are damaged. At 20.4, well below the laboratory limit of 40 and within the optimal range, this confirms that neither the liver nor the heart muscle is under strain.","low_causes":"","high_causes":"Liver disease, heart muscle damage, strenuous exercise, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma-Glutamyltransferase (GGT)","group":"LIVER & METABOLIC","result":"12.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1231","lower_normal":"10","upper_normal":"71","lower_optimal":"10","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4153","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. It is often the first liver marker to rise when something is challenging the liver. At 12.5, well below the optimal threshold of 25 and in a man who takes no alcohol, this is about as clean as GGT gets and confirms the liver is under no strain.","low_causes":"","high_causes":"Alcohol, medications, fatty liver, bile duct disease, metabolic syndrome","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ldh","name":"Lactate Dehydrogenase (LDH)","group":"LIVER & METABOLIC","result":"336","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4870","lower_normal":"230","upper_normal":"460","lower_optimal":"230","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5072","units":"IU/L","description":"LDH is an enzyme found in many tissues including the liver, heart, red blood cells and muscle. It rises when any of these tissues are damaged or turning over faster than normal. At 336, this is within the laboratory range and just within the upper part of the optimal band. It reflects normal tissue turnover.","low_causes":"","high_causes":"Tissue damage, haemolysis, liver disease, heart muscle damage, strenuous exercise","padding":"1","one_sided":"0","range_type":"normal"},{"key":"gldh","name":"Glutamate Dehydrogenase (GLDH)","group":"LIVER & METABOLIC","result":"<3.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"7","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"IU/L","description":"GLDH is an enzyme located deep within the mitochondria of liver cells. It rises only when there is significant damage to the inner structure of liver cells, making it more specific than ALT or AST. At less than 3.0, the liver cells are structurally intact.","low_causes":"","high_causes":"Severe liver damage, toxic hepatitis, drug-induced liver injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalbilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"6.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1664","lower_normal":"0","upper_normal":"21","lower_optimal":"0","upper_optimal":"17","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4048","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. At 6.99, this is low and healthy, showing normal red blood cell turnover and efficient liver processing.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"directbilirubin","name":"Direct Bilirubin","group":"LIVER & METABOLIC","result":"2.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1792","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"umol/l","description":"Direct bilirubin is the fraction of bilirubin that the liver has already processed and made water-soluble for excretion into bile. At 2.15, this is healthy and confirms normal bile flow.","low_causes":"","high_causes":"Bile duct obstruction, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"bileacids","name":"Bile Acids","group":"LIVER & METABOLIC","result":"7.70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3850","lower_normal":"0","upper_normal":"10","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"umol/l","description":"Bile acids are produced by the liver to help digest fats. Elevated levels can indicate impaired bile flow or liver dysfunction. At 7.70, within the reference range, bile acid metabolism is functioning normally.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, intrahepatic cholestasis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4904","lower_normal":"35","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6222","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins and medications around the body and maintains fluid balance. At 42.1, this is within the optimal range and confirms healthy liver synthetic function. Albumin is also one of the inputs to PhenoAge, and a good level here contributes to his favourable biological age estimate.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"23.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3389","lower_normal":"23","upper_normal":"35","lower_optimal":"25","upper_optimal":"33","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/l","description":"Globulins are proteins that include antibodies, transport proteins and inflammatory markers. At 23.8, this is just inside the laboratory range but below the optimal band of 25 to 33. A slightly low globulin often reflects lower immunoglobulin production or low total protein intake, both consistent with his below-average dietary volume. His individual immunoglobulins (IgG, IgA, IgM) are all within range, so this is not indicating immune deficiency.","low_causes":"Low protein intake, liver disease, immune deficiency","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"aldolase","name":"Aldolase","group":"LIVER & METABOLIC","result":"2.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1803","lower_normal":"0","upper_normal":"7.6","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"Aldolase is an enzyme involved in glucose metabolism found in muscle and liver tissue. It rises when these tissues are damaged. At 2.74, well within range, there is no sign of muscle or liver breakdown.","low_causes":"","high_causes":"Muscle damage, liver disease, myopathy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"pancreaticamylase","name":"Pancreatic Amylase","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"13","upper_normal":"53","lower_optimal":"15","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6000","units":"IU/L","description":"Pancreatic amylase is an enzyme produced by the pancreas to digest starch. It rises sharply during pancreatitis. At 24, mid-range and healthy, the pancreas is not inflamed.","low_causes":"Chronic pancreatitis (late stage), pancreatic insufficiency","high_causes":"Pancreatitis, pancreatic duct obstruction","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"32.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4614","lower_normal":"5","upper_normal":"65","lower_optimal":"10","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"IU/L","description":"Lipase is an enzyme produced by the pancreas to digest fats. Like amylase, it rises in pancreatitis. At 32.7, mid-range and healthy, confirming normal pancreatic function.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, gallstones, kidney disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4030","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL and VLDL. At 4.03, this is within the ideal range of below 5. However, total cholesterol alone does not tell the full story; the balance between LDL (harmful) and HDL (protective) matters more, and in this case HDL is low, which is discussed separately.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4217","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL is the lipoprotein that deposits cholesterol into artery walls, driving plaque formation over decades. At 2.53, this is within the laboratory range of below 3 and just below the optimal threshold of 2.6. This is a good level, and his very low Lp(a) means virtually all of this LDL is modifiable through diet and lifestyle.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Saturated fat intake, genetics, hypothyroidism, obesity, inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3355","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.4","upper_optimal":"2.8","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.4516","upper_optimal_position":"0.9032","units":"mmol/l","description":"HDL is the lipoprotein that removes cholesterol from artery walls and returns it to the liver for disposal. It is powerfully protective against cardiovascular disease. At 1.04, this is below the laboratory lower limit of 1.55 and well below the optimal threshold of 1.4 for a male. The most common drivers of low HDL are physical inactivity and excess refined carbohydrate. With fewer than 2,000 steps a day and no structured exercise, his body has no stimulus to produce more HDL. The excellent news is that HDL is one of the most exercise-responsive lipid markers: regular walking and increasing physical activity can raise it measurably within 8 to 12 weeks.","low_causes":"Physical inactivity, refined carbohydrate excess, smoking, genetics, obesity","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3880","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3500","units":"%","description":"This ratio divides total cholesterol by HDL. A lower number is better because it means more of the cholesterol is in the protective HDL fraction. At 3.88, this is within the laboratory range of below 5 but above the optimal threshold of 3.5, driven by the low HDL. Raising HDL through exercise would improve this ratio.","low_causes":"","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2196","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats in the blood that the body uses for energy. They rise with excess sugar, refined carbohydrates, alcohol and high caloric intake. At 1.01, this is within the laboratory range and just above the tight optimal threshold of 1.0. Given his low dietary volume and no alcohol, this is a healthy level. Reducing sugary food from 'some days' to 'rarely' would likely nudge this below 1.0.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"Excess sugar, refined carbohydrates, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"138.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5283","lower_normal":"73","upper_normal":"186","lower_optimal":"120","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4718","upper_optimal_position":"0.6490","units":"mg/dl","description":"ApoA-I is the main structural protein of HDL particles. It reflects the number and function of protective HDL particles. At 138.8, this is within both the laboratory and optimal ranges, which is reassuring given the low HDL cholesterol. It suggests the HDL particles he has are functioning adequately; there are simply fewer of them than ideal.","low_causes":"Physical inactivity, genetics, metabolic syndrome","high_causes":"Exercise, genetics","padding":"1","one_sided":"0","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2270","lower_normal":"0","upper_normal":"163","lower_optimal":"0","upper_optimal":"80","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2454","units":"mg/dl","description":"ApoB is the single best measure of atherogenic risk because every LDL, VLDL and Lp(a) particle carries exactly one ApoB molecule. The number tells you how many artery-damaging particles are circulating. At 74 mg/dL (approximately 0.74 g/L), this is well below both the laboratory range and the optimal threshold of 80 mg/dL (0.8 g/L). This is an excellent result and the single most reassuring number in the lipid panel.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, familial hypercholesterolaemia, diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2650","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3500","units":"","description":"This ratio compares atherogenic (ApoB) to protective (ApoA-I) particles. A lower number is better. At 0.53, well below the male threshold of 0.7, this indicates a favourable balance between harmful and protective lipoproteins.","low_causes":"","high_causes":"High ApoB, low ApoA-I","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"2.72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3432","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"3.0","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3824","upper_optimal_position":"0.5765","units":"mg/dl","description":"ApoE is a protein involved in clearing triglyceride-rich lipoproteins from the blood. It also plays a role in brain lipid metabolism. At 2.72, this is within the laboratory range but slightly below the optimal band. At this margin, no action is needed.","low_causes":"Genetics, low triglycerides","high_causes":"High triglycerides, familial dysbetalipoproteinaemia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"16.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1265","lower_normal":"0","upper_normal":"64.4","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2329","units":"mg/dl","description":"Small dense LDL particles are more atherogenic than large buoyant LDL because they penetrate the artery wall more easily and are more prone to oxidation. At 16.30, well within the optimal range, most of his LDL is the larger, less harmful type.","low_causes":"","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"<5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0347","lower_normal":"0","upper_normal":"75","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lp(a) is an inherited lipoprotein particle that deposits cholesterol, encourages clotting and drives inflammation in artery walls. Its level is genetically fixed and cannot be changed by diet, exercise or most medications. At less than 5.2 nmol/L, well below the 32 nmol/L optimal threshold and far below the 75 nmol/L concern level, this is genuinely useful information. It means that any lipid work that needs doing, particularly raising HDL, is entirely within his control through lifestyle changes. This result should be recorded permanently in his medical notes.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"21.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5850","lower_normal":"5","upper_normal":"20","lower_optimal":"5","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4000","units":"umol/l","description":"Homocysteine is an amino acid produced when the body processes protein. Normally it is recycled back into useful amino acids by enzymes that depend on vitamin B12, folate and vitamin B6. When these pathways run slowly, homocysteine accumulates and damages the lining of blood vessels, increasing the risk of cardiovascular disease, stroke and cognitive decline. At 21.7, above the laboratory upper limit of 20 and well above the optimal target of below 9, this is a modifiable cardiovascular risk factor that needs addressing. His B12 at 816 and folate at 11.2 are adequate, so a simple deficiency is not the cause. The most likely explanations are the mild age-related decline in kidney clearance (eGFR 87 to 89) and possibly a genetic MTHFR variant that reduces the efficiency of the recycling enzyme. Supplementation with the active forms of B vitamins (methylfolate, methylcobalamin and pyridoxal-5-phosphate) is the standard intervention, with a retest in three months to confirm the level has fallen.","low_causes":"","high_causes":"B12 deficiency, folate deficiency, B6 deficiency, MTHFR polymorphism, kidney function decline, hypothyroidism","padding":"1","one_sided":"0","range_type":"normal"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","result":"4.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4389","lower_normal":"4","upper_normal":"7","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4889","units":"mmol/l","description":"Fasting glucose measures the sugar level in the blood after an overnight fast. It reflects how well the body manages blood sugar between meals. At 4.95, within the optimal range of 4.0 to 5.4, this shows healthy blood sugar regulation.","low_causes":"Fasting too long, excessive insulin, adrenal insufficiency","high_causes":"Pre-diabetes, diabetes, stress, infection, medications","padding":"1","one_sided":"0","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"30.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached, reflecting average blood sugar over the past two to three months. At 30.6, well below the optimal threshold of 36 and far from the pre-diabetes threshold of 42, this is excellent long-term blood sugar control.","low_causes":"Haemolytic anaemia, blood loss, pregnancy","high_causes":"Pre-diabetes, diabetes, sustained high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"26.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3546","lower_normal":"17.8","upper_normal":"173","lower_optimal":"14","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3075","upper_optimal_position":"0.4571","units":"pmol/l","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar controlled. Lower is generally better because it indicates the body is sensitive to insulin. At 26.1 pmol/L, this is low and healthy, meaning the body responds well to insulin and the pancreas is not having to overwork.","low_causes":"High insulin sensitivity, low carbohydrate diet, pancreatic insufficiency","high_causes":"Insulin resistance, obesity, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","result":"0.620","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"mmol/l","description":"Non-esterified fatty acids (NEFAs) are free fatty acids released from fat stores when the body needs energy between meals. Elevated levels can indicate insulin resistance because insulin normally suppresses their release. At 0.620, within range, this confirms healthy insulin sensitivity. The result is consistent with his other metabolic markers.","low_causes":"","high_causes":"Insulin resistance, fasting, diabetes, stress","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","result":"1.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3394","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3455","upper_optimal_position":"0.5758","units":"ng/ml","description":"C-peptide is released by the pancreas in equal amounts to insulin and is a more stable measure of insulin production. At 1.12 ng/mL (approximately 371 pmol/L), this is just inside the lower limit of the range at 1.1. In the context of a fasting glucose of 4.95 and an HbA1c of 30.6, this low C-peptide reflects low insulin demand rather than pancreatic failure. The pancreas is producing exactly as much insulin as needed because blood sugar is well controlled.","low_causes":"High insulin sensitivity, low carbohydrate diet, Type 1 diabetes","high_causes":"Insulin resistance, insulinoma, obesity","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","result":"325","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7278","lower_normal":"151","upper_normal":"300","lower_optimal":"151","upper_optimal":"275","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6109","units":"umol/l","description":"Fructosamine measures glycated (sugar-coated) proteins in the blood and reflects average blood sugar over the preceding two to three weeks, a shorter window than HbA1c. At 325, above the upper limit of 300, this appears elevated. However, his HbA1c at 30.6, fasting glucose at 4.95, fasting insulin at 26.1 and HOMA-IR at 0.83 are all excellent, which makes this fructosamine hard to reconcile with the rest of the glucose picture. Fructosamine is affected by total protein and albumin levels, and his total protein at 65.9 is at the lower end. This isolated elevation, contradicted by every other glucose marker, does not suggest a blood sugar problem but should be noted and repeated at the next test.","low_causes":"Protein loss, nephrotic syndrome","high_causes":"Diabetes, sustained high blood sugar, assay artefact","padding":"1","one_sided":"0","range_type":"normal"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","result":"8.44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7233","lower_normal":"1.44","upper_normal":"7.27","lower_optimal":"3","upper_optimal":"7.27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4227","upper_optimal_position":"0.6667","units":"ug/ml","description":"Adiponectin is a hormone released by fat tissue that improves insulin sensitivity, reduces inflammation and protects blood vessels. Unlike most hormones from fat cells, higher adiponectin is better. At 8.44, above the laboratory upper limit of 7.27, this is consistent with his lean BMI of 22.1 and excellent insulin sensitivity. Elevated adiponectin in a lean, insulin-sensitive individual is a positive metabolic finding and not a concern.","low_causes":"Obesity, insulin resistance, metabolic syndrome, type 2 diabetes","high_causes":"Leanness, high insulin sensitivity, genetics","padding":"1","one_sided":"0","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"<0.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1500","lower_normal":"0","upper_normal":"1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mg/l","description":"hsCRP is the most widely used marker of systemic inflammation. It rises with infection, autoimmune disease, metabolic stress and cardiovascular risk. At less than 0.30, below the detection limit, this is as low as the assay can measure and rules out any systemic inflammatory process. For a man with decades of knee surgery and chronic pain, this is particularly reassuring and confirms that the joint problem is not generating body-wide inflammation.","low_causes":"","high_causes":"Infection, autoimmune disease, obesity, cardiovascular risk, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"25.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0640","lower_normal":"0","upper_normal":"200","lower_optimal":"0","upper_optimal":"150","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"iu/ml","description":"ASO measures antibodies against streptococcal bacteria, indicating recent or past strep infection. At 25.6, well within range, there is no evidence of recent streptococcal infection.","low_causes":"","high_causes":"Recent streptococcal infection, rheumatic fever, post-streptococcal glomerulonephritis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","result":"0.289","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3262","lower_normal":"0","upper_normal":"0.443","lower_optimal":"0","upper_optimal":"0.35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3950","units":"ug/ml","description":"D-Dimer is a protein fragment released when blood clots dissolve. It rises with active clot formation and breakdown, deep vein thrombosis, pulmonary embolism, surgery and inflammation. At 0.289, below the threshold, this effectively rules out active blood clot formation and is reassuring in the context of his sedentary lifestyle, which can increase clot risk.","low_causes":"","high_causes":"Blood clots (DVT, PE), recent surgery, inflammation, infection, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il5","name":"Interleukin-5 (IL-5)","group":"INFLAMMATION","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1745","lower_normal":"0","upper_normal":"1.49","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3356","units":"pg/ml","description":"IL-5 is a cytokine that stimulates eosinophil production. Elevated levels are associated with allergic conditions and parasitic infections. At 0.52, within range, there is no allergic or parasitic drive.","low_causes":"","high_causes":"Allergic conditions, asthma, parasitic infections, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il8","name":"Interleukin-8 (IL-8)","group":"INFLAMMATION","result":"<4.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"4.94","upper_normal":"240.09","lower_optimal":"4.94","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4677","units":"pg/ml","description":"IL-8 is a cytokine that attracts neutrophils to sites of infection or tissue damage. The result of less than 4.94 is at the assay's lower detection limit, which also happens to be the bottom of the reference range. This is not a genuine abnormality; it simply means IL-8 is below what the assay can measure, which is consistent with his very low systemic inflammation.","low_causes":"","high_causes":"Active infection, tissue injury, inflammatory conditions","padding":"1","one_sided":"0","range_type":"normal"},{"key":"il15","name":"Interleukin-15 (IL-15)","group":"INFLAMMATION","result":"1.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4490","lower_normal":"0.89","upper_normal":"2.02","l
