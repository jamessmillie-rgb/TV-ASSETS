sult":"510","baseline_date":"2026-03-20"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5545","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all cells in the body. Unlike creatinine, its level is not affected by muscle mass, diet or exercise, making it the most reliable single marker of kidney filtration. At 1.22, this is above the 1.1 threshold and identical to the March result. This confirms that the reduced eGFR is not a creatinine artefact and that kidney filtration is genuinely below the ideal level for Ben's age. This is the result that should be discussed with the GP.","low_causes":"Hyperthyroidism (can falsely lower levels)","high_causes":"Reduced kidney function, chronic kidney disease, acute kidney injury","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.22","baseline_date":"2026-03-20"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to calculate the most accurate estimate of kidney filtration available from a blood test. It balances the creatinine (which overestimates the problem in muscular people) with cystatin C (which is unaffected by muscle). At 65, this confirms that the true filtration rate sits above the 60 threshold for chronic kidney disease but below the 90 considered optimal for Ben's age. This is the number to discuss with the GP and to track on the next test.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"High cardiac output, early diabetic hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3556","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between pre-renal causes of raised creatinine (dehydration, heart failure) and intrinsic kidney disease. A very high ratio suggests dehydration or upper gastrointestinal bleeding; a very low ratio suggests liver disease or low protein intake. At 44, this is just below the optimal range of 45 to 90, driven by the high creatinine in the denominator. With urea at a healthy 5.5, this simply reflects Ben's higher muscle-driven creatinine.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pot","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5556","units":"mmol/L","description":"Potassium is essential for nerve conduction, muscle contraction and heart rhythm. At 4.2, this is within the optimal range and down from 4.9 in March. Both values are normal.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low dietary intake","high_causes":"Kidney disease, medications (ACE inhibitors, potassium-sparing diuretics), haemolysis, acidosis","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"4.9","baseline_date":"2026-03-20"},{"key":"crp","name":"HS-CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0800","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hsCRP) is produced by the liver in response to inflammation anywhere in the body. It is one of the strongest independent markers of cardiovascular risk when read alongside lipids. At 0.8, this is within the optimal range of less than 1.0, a major improvement from 2.2 in March. This reduction reflects the combined effect of lower alcohol intake, improved lipids, reduced body fat and lower metabolic inflammation. It is an excellent result.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, metabolic syndrome, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"2.2","baseline_date":"2026-03-20"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"57","upper_normal":"82","lower_optimal":"64","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3613","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. At 76, this is within the optimal range and down from 86 in March, where it was at the upper end. The normalisation is a positive sign, likely reflecting reduced inflammation (globulin tends to fall as inflammatory proteins decrease).","low_causes":"Malnutrition, liver disease, kidney disease (nephrotic syndrome)","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"86","baseline_date":"2026-03-20"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It maintains fluid balance, carries hormones and nutrients, and is a marker of liver synthetic function and nutritional status. At 44, this is within the optimal range and down from 50 in March (which was at the upper limit and may have reflected mild dehydration at that time). A mid-range albumin is a healthy result.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"50","baseline_date":"2026-03-20"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"g/L","description":"Globulin is a group of proteins that includes antibodies and inflammatory markers. At 32, this is within the reference range but above the optimal ceiling of 30, and down from 36 in March (which was at the upper limit). The drop parallels the improvements in CRP and ESR, suggesting the reduction reflects lower inflammatory protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"36","baseline_date":"2026-03-20"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3905","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bile ducts and bone. It rises when there is obstruction to bile flow, bone disease or liver damage. At 58, this is well within the optimal range and down from 66 in March. It confirms there is no bile duct obstruction or bone turnover issue.","low_causes":"Malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Liver disease, bile duct obstruction, bone disease, Paget's disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"66","baseline_date":"2026-03-20"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. At 12, this is within the optimal range and up from 8 in March. Both values are normal.","low_causes":"","high_causes":"Liver disease, gallstones, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"8","baseline_date":"2026-03-20"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4464","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"Alanine transaminase (ALT) is an enzyme found primarily in liver cells. When liver cells are stressed or damaged, ALT leaks into the blood. At 50, this is within the laboratory range of less than 56 but above the optimal threshold of less than 30 for men, and notably higher than the 37 recorded in March. With GGT improved and all fibrosis scores clear, this is unlikely to reflect significant liver disease. The most plausible explanations are the low calorie intake against heavy training (which can cause mild hepatocyte stress), or a transient effect of intense exercise in the days before sampling. It should be monitored on the next test, and if calorie intake increases it would be expected to improve.","low_causes":"","high_causes":"Liver disease, fatty liver, alcohol, medications, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"37","baseline_date":"2026-03-20"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"Aspartate transaminase (AST) is found in the liver, heart and muscles. It is less specific to the liver than ALT, so a rise can come from muscle damage as well. At 29, this is within the optimal range and slightly up from 24 in March. With creatine kinase normal, this is unlikely to be muscle-driven.","low_causes":"","high_causes":"Liver disease, muscle damage, heart attack, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"24","baseline_date":"2026-03-20"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3082","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"Gamma-glutamyl transferase (GGT) is the liver enzyme most sensitive to alcohol, bile duct problems and metabolic stress. It is the best single marker of whether the liver is under pressure. At 45, this is well within the male reference range of 4 to 73 but above the optimal ceiling of 25, and a major improvement from 78 in March, which was above the reference range. The drop from 78 to 45 is the clearest evidence that the reduction in alcohol intake has taken pressure off the liver. Continued moderation should bring it lower.","low_causes":"","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"78","baseline_date":"2026-03-20"},{"key":"amy","name":"Amylase","group":"DIGESTIVE","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3712","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels suggest pancreatic inflammation. At 34, this is at the lower end of the range, essentially unchanged from 36 in March, and confirms healthy pancreatic function.","low_causes":"Chronic pancreatitis (burnt-out), cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic obstruction, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"36","baseline_date":"2026-03-20"},{"key":"lip","name":"Lipase","group":"DIGESTIVE","result":"58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"U/L","description":"Lipase is a more specific pancreatic enzyme that breaks down fats. At 58, this is within the reference range but near the upper limit of 60 and above the optimal ceiling of 45. In March it was 65, which was above range. The improvement is modest but in the right direction. With amylase normal and no symptoms of pancreatic disease, this does not require investigation, but it is worth tracking. Long-term omeprazole use can affect digestive enzyme levels, and this is another reason to discuss its ongoing necessity with the GP.","low_causes":"","high_causes":"Pancreatitis, pancreatic obstruction, kidney disease, some medications","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"65","baseline_date":"2026-03-20"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5731","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6088","units":"mmol/L","description":"Calcium is essential for bone health, nerve conduction, muscle contraction and blood clotting. At 2.49, this is within the optimal range, up from 2.44 in March. With vitamin D now at 175 and PTH suppressed to 1.209, the calcium-vitamin D axis is working well.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"2.44","baseline_date":"2026-03-20"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, since about half of calcium in the blood is bound to albumin. With albumin at 44, the correction is minor, and at 2.44 the corrected calcium is well within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3816","upper_optimal_position":"0.5862","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bone and is essential for energy production in every cell. At 1.2, this is within the optimal range and up from 1.0 in March. A healthy result.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D intake","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1","baseline_date":"2026-03-20"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6264","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions including energy production, muscle and nerve function, and blood sugar control. At 1.04, this is within the optimal range, essentially unchanged from 1.03 in March. This is particularly reassuring given that omeprazole can impair magnesium absorption over time.","low_causes":"PPI use, alcohol, diuretics, diarrhoea, poor dietary intake","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.03","baseline_date":"2026-03-20"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"175","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. It is made in the skin when exposed to sunlight and is difficult to obtain from food alone. At 175, this is well above the optimal floor of 75 and a substantial improvement from 76 in March, when it was right at the borderline. The supplementation is clearly working well. There is no toxicity concern at this level (toxicity is generally above 375), but the dose can be reduced slightly during summer months.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, winter, indoor lifestyle","high_causes":"Excess supplementation (usually above 375 nmol/L)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Intact Parathormone Level","group":"ELECTROLYTES & MINERALS","result":"1.209","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3727","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5587","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium levels by controlling how much calcium the kidneys retain and how much the bones release. When vitamin D or calcium is low, PTH rises to compensate. At 1.209, this is low-normal and substantially down from 2.7 in March. The drop reflects the excellent vitamin D level: with plenty of vitamin D available to absorb calcium from the gut, the parathyroid glands can reduce their output. This is the expected and healthy response.","low_causes":"Excess vitamin D, high calcium, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, low calcium, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"2.7","baseline_date":"2026-03-20"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"536","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4351","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4558","upper_optimal_position":"0.6096","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. It is absorbed in the small intestine with the help of intrinsic factor and stomach acid. At 536, this is within the optimal range of 500 to 900 and up from 414 in March, which was below the optimal threshold. The improvement is notable because omeprazole suppresses stomach acid and can impair B12 absorption. The multivitamin appears to be compensating, but if the omeprazole is continued long-term, switching to sublingual methylcobalamin would bypass the absorption issue entirely.","low_causes":"Vegan diet, pernicious anaemia, PPI use, malabsorption, low dietary intake","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"414","baseline_date":"2026-03-20"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"> 24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and methylation (a process that regulates gene expression and detoxification). At greater than 24, this is above the laboratory reference range of 3 to 17. In March it was 11. The rise is almost certainly driven by folic acid in the multivitamin, and folate excess from supplements is not harmful. It does not require any action.","low_causes":"Poor diet, alcohol, malabsorption, pregnancy, certain medications (methotrexate)","high_causes":"Supplementation, high dietary intake, B12 deficiency (can falsely trap folate)","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"11","baseline_date":"2026-03-20"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4247","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood (HDL, LDL, VLDL). At 4.4, this is within the desirable range of less than 5.18 and a substantial drop from 5.6 in March. The reduction is driven by the fall in LDL and VLDL, reflecting the dietary and lifestyle changes Ben has made.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet, genetic factors, hypothyroidism, obesity, diabetes, medications","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"5.6","baseline_date":"2026-03-20"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5206","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the fats carried in the blood after meals. Persistently high levels are driven by excess carbohydrates, alcohol, sugar and excess calories, and they independently increase cardiovascular risk. At 1.77, this is marginally above the 1.7 fasting target and dramatically improved from 3.23 in March (which was nearly double the limit). The improvement is one of the most striking changes in this report and reflects the shift to a low-carb diet and reduced alcohol. At 1.77, it is practically at goal and is likely to fall below 1.7 with continued dietary consistency.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, sugar, obesity, insulin resistance, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"3.23","baseline_date":"2026-03-20"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5128","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"Very low-density lipoprotein (VLDL) carries triglycerides from the liver to tissues. High VLDL drives the production of small, dense LDL particles that are more atherogenic. At 0.8, this is marginally above the 0.78 threshold and dramatically improved from 1.47 in March. The residual elevation tracks with the triglycerides: as those fall to target, VLDL will follow.","low_causes":"Very low fat diet, malabsorption","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.47","baseline_date":"2026-03-20"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) cholesterol is the protective fraction that removes cholesterol from artery walls and returns it to the liver for disposal. Higher is better. At 1.2, this is above the 1.04 lower risk boundary but below the 1.4 optimal target for men. It has improved from 1.0 in March, which was in the low-risk zone. The rise reflects the reduced alcohol and improved metabolic health. HDL responds to exercise, moderate alcohol, weight management and omega-3 intake, so continued effort in these areas should push it above 1.4 over time.","low_causes":"Sedentary lifestyle, smoking, high carbohydrate diet, obesity, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper","baseline_result":"1.0","baseline_date":"2026-03-20"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4150","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol deposits in artery walls and drives atherosclerosis. At 2.49, this is within the laboratory range but above the optimal target of less than 2.0, and down from 3.28 in March. The improvement is substantial. With Lp(a) below 25, the entire LDL burden is modifiable through diet and lifestyle. Increasing soluble fibre (oats, beans, lentils, vegetables) and oily fish will continue to lower it.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet (saturated fat, trans fat), genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"3.28","baseline_date":"2026-03-20"},{"key":"hdlrat","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4078","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The TC:HDL ratio divides total cholesterol by HDL cholesterol and is a broad summary of cardiovascular balance. Lower is better. At 3.67, this is within the optimal range and a major improvement from 5.6 in March. The improvement is driven by both the fall in total cholesterol and the rise in HDL.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor cardiovascular risk profile","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"5.6","baseline_date":"2026-03-20"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"27.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4545","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol. A higher percentage indicates a larger proportion of protective cholesterol. At 27.3%, this is well above the 20% minimum and an improvement from the implied percentage of around 17.9% in March (1.0/5.6). This shift indicates better cardiovascular balance.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol, excellent cardiovascular health","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol fractions including LDL, VLDL and remnant particles. At 3.2, this is within the laboratory target of less than 4 but above the optimal target of less than 2.6, and improved from 4.6 in March. The improvement is excellent, and the residual elevation is driven by the same factors as the ApoB: the remaining triglyceride-rich particles and LDL.","low_causes":"Very low cholesterol, malnutrition","high_causes":"High LDL, high triglycerides, high VLDL, poor cardiovascular risk profile","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"4.6","baseline_date":"2026-03-20"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.3","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5417","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein in HDL particles and drives the protective reverse cholesterol transport process. Higher levels indicate more functional HDL particles. At 1.22, this is just above the 1.2 threshold and up from 1.08 in March. The improvement mirrors the HDL rise and confirms the HDL particles are increasing in number, not just in cholesterol content.","low_causes":"Low HDL, metabolic syndrome, genetic factors, smoking","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy metabolism","padding":"1","one_sided":"0.5","range_type":"no upper","baseline_result":"1.08","baseline_date":"2026-03-20"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein carried by every LDL and VLDL particle. Since each particle carries exactly one ApoB molecule, the ApoB level is a direct count of the number of atherogenic particles in the blood, making it the single best marker of cardiovascular risk from lipids. At 0.98, this is above the 0.9 desirable target and above the 0.8 optimal target, but it has improved substantially from 1.18 in March. With Lp(a) below 25 (ruling out an inherited particle contribution), the entire ApoB elevation is driven by modifiable factors: principally the remaining triglyceride-rich particles and dietary saturated fat. Continuing the current trajectory should bring it to target over the next six months.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, high triglycerides, familial hypercholesterolaemia, diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.18","baseline_date":"2026-03-20"},{"key":"apor","name":"ApoB:ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5714","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB, which carry cholesterol into artery walls) to the number of protective particles (ApoA1, which carry it away). Below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. At 0.80, Ben sits in the average risk band, down from 1.09 in March which was in the higher risk band. This is a major improvement. The ratio will continue to fall as ApoB drops towards 0.9 and HDL (and therefore ApoA1) continues to rise.","low_causes":"High HDL, low LDL, excellent cardiovascular health","high_causes":"High LDL, low HDL, metabolic syndrome, high cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined variant of LDL that independently drives cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls, it encourages blood clotting, and it promotes inflammation. The level is set by genetics and cannot be changed through diet, exercise or lifestyle. At below 25, Ben's Lp(a) is normal and well within the 32 nmol/L target. This is genuinely useful information: it means the elevated ApoB and LDL are entirely driven by modifiable factors (diet, weight, activity) rather than by an inherited particle that cannot be changed. It also means there is no need for the more aggressive lipid targets that apply when Lp(a) is raised.","low_causes":"","high_causes":"Genetic inheritance (cannot be modified through lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4012","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from muscle cells when they are damaged, whether by exercise, injury or disease. At 97, this is well within range and down from 175 in March, likely reflecting either a lighter training session before the blood draw or improved recovery. Both values are normal for someone who trains six times a week.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"175","baseline_date":"2026-03-20"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6990","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5905","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in the tissues. At 23, this is marginally above the upper limit of 22.7 and notably up from 17.4 in March. The TSH (the pituitary hormone that controls the thyroid) has dropped from 1.44 to 0.98 in response, which is the expected feedback: as T4 rises, the pituitary reduces its stimulating signal. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. There are no symptoms of overactive thyroid. At this margin (0.3 above the limit), this could be a laboratory fluctuation, but the direction of change warrants a repeat in three to six months to confirm it is not trending further upward.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis, early Graves' disease","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"17.4","baseline_date":"2026-03-20"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.98","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3673","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4610","units":"mIU/L","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland to control thyroid hormone production. High TSH means the thyroid is underperforming and the pituitary is pushing harder; low TSH means the thyroid is producing too much and the pituitary is backing off. At 0.98, this is within the reference range but just below the optimal band of 1.0 to 2.5, and down from 1.44 in March. The drop is consistent with the rise in FT4: the pituitary has reduced its signal because the thyroid is producing more hormone. In isolation, 0.98 is a perfectly normal TSH.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroiditis, iodine deficiency, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.44","baseline_date":"2026-03-20"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use to regulate metabolism, energy production and body temperature. At 4.7, this is within the optimal range of 4.5 to 6.5, up from 4.4 in March. The improvement is small but positive, and the level confirms adequate thyroid hormone is reaching the tissues.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, severe illness, low calorie intake","high_causes":"Hyperthyroidism, T3 thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"4.4","baseline_date":"2026-03-20"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a pattern seen in autoimmune thyroid disease (most commonly Hashimoto's thyroiditis). At below 6.6, this is well within range and rules out autoimmune thyroid disease as a cause of the elevated FT4.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"6.6","baseline_date":"2026-03-20"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce its hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. At below 1.3, this is well within range. More than 80% of the population have undetectable anti-thyroglobulin antibodies, and Ben is in that majority. This further confirms there is no autoimmune thyroid process.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.3","baseline_date":"2026-03-20"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.204","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3387","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3:FT4 ratio measures how efficiently the body converts the inactive thyroid hormone T4 into the active form T3. A low ratio suggests reduced conversion efficiency. At 0.204, this is at the very bottom of the reference range of 0.2 to 0.45 and below the optimal band of 0.27 to 0.4. The ratio is driven by the elevated FT4 at 23 with a relatively modest FT3 at 4.7. If FT4 normalises on retest, this ratio will improve automatically. Selenium, zinc and adequate calorie intake all support T4-to-T3 conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0720","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/mL","description":"Prostate-specific antigen (PSA) is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, infection or, less commonly, prostate cancer. At 0.36, this is very low and essentially unchanged from 0.38 in March. It is an excellent result for a 41-year-old and rules out any prostate concern.","low_causes":"","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.38","baseline_date":"2026-03-20"},{"key":"fpsa","name":"PSA (Free)","group":"PROSTATE","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the portion of PSA that circulates unbound. A high free-to-total ratio (above 25%) is reassuring. At 0.3 with a total PSA of 0.36, the free PSA ratio is 83.3%, which is excellent and consistent with a healthy prostate.","low_causes":"","high_causes":"Benign prostatic conditions (usually higher free ratio), prostate cancer (usually lower free ratio)","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.38","baseline_date":"2026-03-20"},{"key":"prat","name":"PSA Ratio","group":"PROSTATE","result":"0.833","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4384","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps distinguish between benign prostate conditions and prostate cancer when total PSA is elevated. A ratio above 0.19 is normal. At 0.833, this is very high, confirming that the tiny amount of PSA present is overwhelmingly in the free form, which is the reassuring pattern.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"c19","name":"CA 19-9","group":"TUMOR MARKERS","result":"7.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1076","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker used primarily in monitoring pancreatic and biliary cancers. It is not a screening test and can be elevated in non-cancerous conditions. At 7.96, this is well within range and down from 16.96 in March. A normal result that requires no action.","low_causes":"","high_causes":"Pancreatic cancer, biliary obstruction, pancreatitis, liver disease, some benign conditions","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"16.96","baseline_date":"2026-03-20"},{"key":"cea","name":"CEA Marker","group":"TUMOR MARKERS","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1174","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"Carcinoembryonic antigen (CEA) is a tumour marker used in monitoring colorectal and other cancers. At 0.54, this is well within the non-smoker range of 0 to 2.3 and essentially unchanged from 0.5 in March. A reassuring result.","low_causes":"","high_causes":"Colorectal cancer, smoking, liver disease, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.5","baseline_date":"2026-03-20"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5088","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/L","description":"Immunoglobulin G (IgG) is the most abundant antibody in the blood, providing long-term immune memory against infections the body has encountered before. At 11, this is within the reference range and down from 13.6 in March. Both values are normal, and the drop may reflect lower overall immune activation consistent with the reduced inflammatory markers.","low_causes":"Immune deficiency, medications (immunosuppressants), certain cancers","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"13.6","baseline_date":"2026-03-20"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4533","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"g/L","description":"Immunoglobulin M (IgM) is the first antibody produced in response to a new infection. At 1.4, this is within the reference range and unchanged from March. A normal result.","low_causes":"Immune deficiency, certain cancers","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.4","baseline_date":"2026-03-20"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"3.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6022","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"Immunoglobulin A (IgA) protects the mucous membranes of the gut, lungs and urinary tract. At 3.3, this is within the reference range but above the optimal ceiling of 3.0, and slightly down from 3.7 in March. The IgA level is used to validate the coeliac screen (low IgA can cause a false-negative tissue transglutaminase result). Ben's IgA is well within range, confirming the coeliac screen is reliable.","low_causes":"Selective IgA deficiency (most common primary immune deficiency)","high_causes":"Mucosal infection, liver disease, coeliac disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"3.7","baseline_date":"2026-03-20"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"93.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4680","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2500","units":"IU/mL","description":"Immunoglobulin E (IgE) is the antibody involved in allergic responses and parasitic infections. Elevated levels suggest the immune system is reacting to allergens. At 93.6, this is within the reference range of less than 100, down from 132 in March which was above range. The improvement is notable and may reflect reduced allergen exposure or reduced overall immune reactivity. It is no longer flagged as abnormal.","low_causes":"Immune deficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"132","baseline_date":"2026-03-20"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"< 4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. At below 4, this is well within range and rules out rheumatoid arthritis as a cause of any joint symptoms. Unchanged from March.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"4","baseline_date":"2026-03-20"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"1.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1050","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune condition where gluten triggers damage to the lining of the small intestine. It is only reliable if the person is eating gluten regularly and if IgA levels are normal (Ben's IgA at 3.3 confirms this). At 1.51, this is negative and well below the 7.19 threshold, ruling out coeliac disease. Improved from 3.29 in March.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"3.29","baseline_date":"2026-03-20"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8511","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4603","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals (reactive molecules that damage cells). At 1.99, this is above the upper limit of 1.77, up from 1.55 in March. The rise is driven by supplementation (the multivitamin, omega-3 and vitamin D all contribute antioxidant activity). An elevated TAA from supplementation is not a concern and does not require action.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.55","baseline_date":"2026-03-20"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"414","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4534","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5820","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, highest in the morning and lowest at night. A morning cortisol within range confirms the adrenal glands are functioning normally. At 414, this is well within the optimal range and essentially unchanged from 425 in March. It confirms a healthy stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid medication, severe illness","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"425","baseline_date":"2026-03-20"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"113","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3868","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, produced partly by the testes and partly by conversion of testosterone via the aromatase enzyme in fat tissue. In men, it plays a role in bone health, brain function and lipid metabolism. At 113, this is within range and up from 59 in March. The rise is expected given the increase in testosterone from 20.8 to 27.7: more testosterone means more substrate for aromatase to convert. At 113 it remains within the optimal band and is not high enough to cause symptoms.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"High testosterone (more conversion), obesity, liver disease, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"59","baseline_date":"2026-03-20"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"1.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3936","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3701","upper_optimal_position":"0.5201","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in testosterone production and brain function. At 1.43, this is within the reference range and up from 0.86 in March, where it was below the lower limit. The improvement is a positive sign and mirrors the overall hormonal improvement.","low_causes":"Adrenal insufficiency, low cholesterol (progesterone is made from cholesterol)","high_causes":"Adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"0.86","baseline_date":"2026-03-20"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4445","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3762","upper_optimal_position":"0.5905","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and signals the testes to produce testosterone. At 4.72, this is within the optimal range and up from 2.72 in March. The rise suggests the pituitary is driving the testes harder, and they are responding with the much-improved testosterone output. This is a healthy pattern.","low_causes":"Pituitary disease, anabolic steroid use, severe stress, obesity","high_causes":"Primary testicular failure, menopause (women), genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"2.72","baseline_date":"2026-03-20"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3572","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5480","units":"mIU/mL","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and, in men, stimulates the testes to produce sperm. At 2.61, this is within the reference range and essentially unchanged from 2.79 in March. A normal level.","low_causes":"Pituitary disease, anabolic steroid use, severe stress","high_causes":"Primary testicular failure, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"2.79","baseline_date":"2026-03-20"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"27.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6187","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, fat distribution, red blood cell production, libido and mood. At 27.7, this is in the optimal range of 18 to 30 and a major improvement from 20.8 in March. The improvement likely reflects a combination of reduced alcohol, improved body composition, better metabolic health and possibly reduced inflammation (all of which suppress testosterone). At 27.7, the hormonal axis is functioning well, which makes the reported low libido more puzzling and points to non-hormonal causes.","low_causes":"Ageing, obesity, alcohol, chronic illness, medications (opioids, PPIs), sleep deprivation, stress","high_causes":"Anabolic steroid use, testicular tumour, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"20.8","baseline_date":"2026-03-20"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"186","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4697","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.5818","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for stimulating milk production but also involved in immune function and reproductive regulation. Very high prolactin can suppress testosterone and cause low libido. At 186, this is mid-range and up from 109 in March, but both values are normal. At this level, prolactin is not suppressing testosterone or contributing to the low libido.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"109","baseline_date":"2026-03-20"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"69.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4442","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index (FAI) estimates the proportion of testosterone that is biologically active by dividing total testosterone by SHBG. At 69.95, this is within the optimal range and essentially unchanged from 69.57 in March. Despite the rise in SHBG from 29.9 to 39.6, the testosterone has risen proportionally, keeping the FAI stable.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"High testosterone, low SHBG, polycystic ovary syndrome (women)","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"69.57","baseline_date":"2026-03-20"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3683","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3532","upper_optimal_position":"0.5735","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 4 umol/L (equivalent to approximately 1,474 micrograms per decilitre), this is within the reference range. In March it was reported as 1,216 micrograms per litre. DHEA-S declines naturally with age, and the current level is healthy for 41.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, polycystic ovary syndrome (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"39.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4878","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3835","upper_optimal_position":"0.5787","units":"nmol/L","description":"Sex hormone binding globulin (SHBG) is a protein made by the liver that binds testosterone and oestradiol, regulating how much is available to tissues. At 39.6, this is within the optimal range and up from 29.9 in March. The rise is expected with improved liver health and reduced inflammation. At this level, SHBG is providing a healthy binding capacity without excessively restricting free testosterone.","low_causes":"Obesity, insulin resistance, hypothyroidism, liver disease","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen excess, low body weight","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"29.9","baseline_date":"2026-03-20"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.562","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5034","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3886","upper_optimal_position":"0.5604","units":"nmol/L","description":"Free testosterone is the small fraction of total testosterone (about 2 to 3%) that circulates unbound to proteins and is immediately available to tissues. At 0.562, this is within the optimal range and up from 0.434 in March, which was below the optimal threshold. The improvement confirms that despite the rise in SHBG, the overall increase in testosterone production means more free hormone is reaching the tissues.","low_causes":"Low testosterone, high SHBG, ageing, obesity","high_causes":"High testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"0.434","baseline_date":"2026-03-20"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"13.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone is the combined free and albumin-bound testosterone, representing the fraction that can enter tissues and exert its effects. It is calculated from total testosterone, SHBG and albumin. At 13.46, this is above the reference range of 2 to 9, reflecting the strong total testosterone of 27.7 with an SHBG of 39.6 that is not binding excessively. A high bioavailable testosterone is a positive finding and confirms that plenty of active hormone is reaching the tissues. This makes the low libido even less likely to have a hormonal cause.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"2.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is unbound and biologically active. It is reported for context and is not applicable as a standalone diagnostic marker at present. Ben's oestradiol and SHBG are both in healthy ranges, making this index informational.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"6","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity or alkalinity of the urine. A pH of 6 is mildly acidic, which is normal. Urine pH varies through the day depending on diet, hydration and metabolic state. A low-carb, high-protein diet tends to produce more acidic urine, and a pH of 6 is consistent with Ben's dietary pattern.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"6.5","baseline_date":"2026-03-20"},{"key":"pru","name":"Urine Protein","group":"URINALYSIS","result":"Trace","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine protein detects protein leaking into the urine, which can indicate kidney damage. A trace amount is common after exercise and is not significant in isolation. Given the cystatin C and eGFR findings, a formal urine albumin-to-creatinine ratio (ACR) would be more informative and is recommended as part of the kidney assessment.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ket","name":"Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urinary ketones are produced when the body burns fat for fuel instead of glucose, commonly seen in low-carb or ketogenic diets, fasting, or uncontrolled diabetes. A negative result on a low-carb diet simply means the body was not in significant ketosis at the time of sampling.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gu","name":"Urine Glucose","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_op
