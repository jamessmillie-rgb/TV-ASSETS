<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Ben Hall","dob":"07/05/1985","report_date":"2026-09-25","summary":"This is Ben's second TrueVitals report, taken six months after his baseline test in March 2026. Ben is a 41-year-old male presenting with a BMI of 27.2, following a low-carb, high-protein diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are small or he often skips meals (volume 2 out of 10). He trains six times per week, three cardio and three resistance at hard intensity, with 2,000 to 5,000 daily steps. He sleeps 6 to 7 hours and wakes refreshed with steady energy through the day. Stress rarely feels hard to manage. He drinks 1 to 4 alcoholic drinks per week and vapes nicotine. He takes allopurinol for gout and omeprazole (a proton pump inhibitor). He supplements with vitamin D, omega-3 fish oil, a multivitamin and protein powder. A previous blood test flagged something, and he has tested with TrueVitals before. He reports low sex drive lasting weeks. His goals are to improve long-term health and longevity and to prevent disease. He notes that he has made a number of lifestyle improvements since his last report, that his BMI will still show as overweight but he is stocky and not carrying a large amount of fat.\n\nThe most important change in this report is the lipid profile, which has improved substantially across every marker. His total cholesterol has dropped from 5.6 to 4.4, his LDL (the low-density lipoprotein cholesterol that deposits in artery walls) has fallen from 3.28 to 2.49, his triglycerides (the fat carried in the blood after meals) have dropped from 3.23 to 1.77, and his HDL (the protective cholesterol that carries lipids away from artery walls) has risen from 1.0 to 1.2. The TC:HDL ratio, a broad summary of cardiovascular balance, has improved from 5.6 to 3.67. His ApoB (apolipoprotein B, the protein that carries LDL and VLDL particles into the artery wall, and the single best measure of atherogenic particle number) has fallen from 1.18 to 0.98, and the ApoB:ApoA-I ratio has improved from 1.09 to 0.80. His Lp(a), the inherited lipoprotein particle that independently drives cardiovascular risk and cannot be changed through diet or exercise, is below 25, which is normal and genuinely useful: it means the residual ApoB elevation is entirely driven by modifiable factors. These are real, measurable improvements that reflect the dietary and lifestyle changes Ben has made over the past six months, and they deserve recognition.\n\nHis inflammatory markers have also improved meaningfully. High-sensitivity CRP (hsCRP, a marker of systemic inflammation and an independent cardiovascular risk factor) has dropped from 2.2 to 0.8, which brings it below the 1.0 threshold considered optimal. His ESR (erythrocyte sedimentation rate, another broad inflammation marker) has fallen from 22 to 6. These are both large improvements, and in combination with the lipid changes they significantly reduce the inflammatory burden on his blood vessels. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 55 out of 100. That score is above the 40 threshold but substantially better than it would have been six months ago, and the remaining elevation is driven primarily by the ApoB still sitting above the 0.9 target, the HDL still sitting below the 1.4 optimal level, and the triglycerides still marginally above the 1.7 fasting target. All three are modifiable, and the trajectory is clearly in the right direction.\n\nHis blood sugar control is excellent and has improved slightly. Fasting glucose is 4.1, HbA1c (the measure of average blood sugar over the previous three months) is 31 mmol/mol, and fasting insulin is 7.19, all comfortably within the optimal range. HOMA-IR (a calculated index of insulin resistance, where a higher number means the body's cells are responding less well to insulin) has improved from 1.7 to 1.31, which is now within the optimal band. His C-peptide (a marker of how much insulin the pancreas is actually producing) is 1.61 micrograms per litre, equivalent to 533 pmol/L, which is healthy. This is a strong result, particularly on a low-carb diet, and it means there is no insulin resistance and no early sign of blood sugar problems.\n\nHis liver function has improved across the board. His GGT (gamma-glutamyl transferase, the liver enzyme most sensitive to alcohol, metabolic strain and bile duct problems) has dropped from 78 to 45, which is now well within the male reference range. His ALT (alanine transaminase, the enzyme that rises when liver cells are under stress) has moved from 37 to 50, which is still within the laboratory range of less than 56 but is above the optimal threshold of 30 for men. This is worth watching: the direction is the wrong way, and although 50 is not alarming, the ideal is below 30. His AST has risen slightly from 24 to 29, which remains well within range. The FIB-4 score (a calculation that estimates liver scarring using age, AST, ALT and platelets) is 0.57, well below the 1.3 threshold, and his APRI score is 0.247, which rules out any significant fibrosis. Albumin has moved from 50 to 44, total protein from 86 to 76, and globulin from 36 to 32, all now sitting comfortably within their ranges where previously the albumin and globulin were at the very top of theirs. His bilirubin has risen from 8 to 12, which is perfectly normal and of no concern. The lipase is 58, just under the upper limit of 60 and essentially unchanged from the previous 65. The amylase is 34, marginally above the lower limit and normal. Overall, the liver picture is significantly better than six months ago, with the GGT improvement being the standout change, likely reflecting the reduction in alcohol from more than seven drinks per week to one to four.\n\nHis uric acid has dropped dramatically from 510 to 325, which is an excellent response to allopurinol. At 510 it was within the laboratory range but above the optimal ceiling of 380, and at 325 it is now well within the optimal band. This reduces the risk of gout flares and removes the contribution that high uric acid makes to cardiovascular risk and kidney stress.\n\nThe finding in this report that needs attention is the kidney function picture, because it has not improved and there is a genuine question that should go to Ben's GP. His cystatin C (a protein filtered by the kidneys that is a more reliable measure of kidney filtration than creatinine, particularly in muscular people) is 1.22, identical to the March result and above the 1.1 threshold. The cystatin C-based eGFR (estimated glomerular filtration rate, the calculation that converts the cystatin C into a filtration rate) is 65, which is below the 90 considered optimal although above the 60 that defines chronic kidney disease. The creatinine-based eGFR is 61. The combined eGFR using both creatinine and cystatin C is 65. Now, creatinine is well known to be falsely elevated in people with higher muscle mass: creatinine is a breakdown product of muscle, and a stocky, resistance-training man will produce more of it regardless of kidney health. That is why cystatin C is the better marker here, because it is not affected by muscle mass. The fact that the cystatin C eGFR also sits at 65 means the reduced filtration rate is not simply a creatinine artefact. At 41, an eGFR of 65 is below where it should be. This does not mean there is kidney disease: a single reading below 90 is not diagnostic, and the urea at 5.5 is improved from 8 and now mid-range, the electrolytes are all normal, and there is no protein or blood in the urine beyond a trace of protein which could be from training. But the fact that the cystatin C has not moved at all in six months, despite the improvements in uric acid, inflammation and blood pressure risk factors, means it should be discussed with the GP. The GP may wish to repeat the cystatin C in three months, check a urine albumin-to-creatinine ratio, and review whether the omeprazole or allopurinol could be contributing. Omeprazole can interfere with creatinine secretion and, in some studies, has been associated with reduced kidney function over time, so a conversation about whether it is still needed is reasonable. The urea-to-creatinine ratio at 44 is just below the optimal range of 45 to 90, driven by the high creatinine, and fits the same story.\n\nHis testosterone has improved substantially, from 20.8 to 27.7 nmol/L, which moves it from the lower half of the reference range into the optimal zone of 18 to 30. His free testosterone (the portion not bound to proteins and therefore available to tissues) has risen from 0.434 to 0.562, also now well within the optimal range. His SHBG (sex hormone binding globulin, the protein that binds testosterone and reduces its availability) has risen from 29.9 to 39.6, which is a healthy mid-range level. His bioavailable testosterone (the combined free and loosely-bound fraction) is calculated at 13.46, which is above the reference range and confirms there is plenty of testosterone reaching the tissues. His LH (luteinising hormone, the pituitary signal that tells the testes to produce testosterone) is 4.72, up from 2.72, suggesting the pituitary is driving the testes a little harder and getting a strong response. His oestradiol has risen from 59 to 113 pmol/L, which is within range and expected when testosterone rises, as some testosterone is converted to oestradiol by the aromatase enzyme. Progesterone has risen from 0.86 to 1.43, now within range where it was previously below. Prolactin has risen from 109 to 186, comfortably mid-range. DHEA-S is 4 micromol/L (equivalent to approximately 1,474 micrograms per decilitre), which is healthy. Despite these strong hormonal numbers, Ben reports low libido lasting weeks. The blood results exclude the hormonal causes: testosterone, free testosterone, oestradiol, prolactin, thyroid and cortisol are all in healthy territory. The most likely contributors to reduced libido that blood cannot measure include omeprazole (PPIs have been associated with reduced libido in some individuals), nicotine from vaping (nicotine constricts blood vessels and can impair arousal pathways), the relatively low calorie intake suggested by the diet volume of 2 out of 10 (the body can down-regulate sex drive when energy availability is low), and sleep duration of 6 to 7 hours (libido is sensitive to sleep, and testosterone production peaks during deep sleep, so even an extra 30 minutes could help). This is worth mentioning to the GP, particularly in the context of the omeprazole review.\n\nHis free T4 (thyroxine, the main hormone the thyroid produces) is 23, marginally above the upper limit of 22.7. His TSH (thyroid stimulating hormone, the pituitary signal that controls the thyroid) is 0.98, which is within the optimal range of 1.0 to 2.5 although just under. His FT3 (the active thyroid hormone that cells actually use) is 4.7, within range and within the optimal band. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. The FT3:FT4 ratio is 0.204, right at the lower boundary of the reference range, meaning that although the thyroid is producing plenty of T4, the conversion to the active T3 form is at the lower end of efficient. In March, FT4 was 17.4 and TSH was 1.44. The rise in FT4 from 17.4 to 23 with a fall in TSH from 1.44 to 0.98 is a pattern that could reflect the thyroid producing slightly more hormone and the pituitary responding by backing off. At 23, FT4 is only 0.3 above the limit and could be a laboratory fluctuation, but it is worth repeating in three to six months to check the trend. Ben reports no symptoms of overactive thyroid (no tremor, no racing heart, no unexplained weight loss, no anxiety), and the clinical picture is reassuring. This does not need a GP visit unless it persists on retest.\n\nHis vitamin D has improved dramatically from 76 to 175 nmol/L, reflecting good supplementation. This is well above the optimal floor of 75 and sits in the upper portion of the ideal range. His PTH (parathyroid hormone, which the parathyroid glands release when calcium or vitamin D is low) has dropped from 2.7 to 1.209, which is the expected response when vitamin D rises: the body no longer needs to pull calcium from bone. His B12 has risen from 414 to 536, now within the optimal range of 500 to 900. His folate is reported as greater than 24, above the laboratory range of 3 to 17, which is almost certainly driven by the multivitamin and is harmless. Calcium, phosphate and magnesium are all within their optimal ranges.\n\nHis full blood count is broadly healthy. Haemoglobin at 147, red cells at 4.74, MCV at 90.1, MCH at 31.1 and haematocrit at 0.427 are all within range. His white cell count has dropped from 6.72 to 4.23, which is within the reference range of 4 to 10 but at the lower end. His neutrophils have dropped from 3.98 to 2.24, also within range but notably lower. This degree of change is worth noting: a drop in white cells and neutrophils of this magnitude in six months could reflect a viral illness around the time of sampling, the lower calorie intake, or simply normal variation. It does not require action but is worth watching on the next test. His reticulocyte percentage is 0.95, within range, but the absolute reticulocyte count is 45, just below the lower limit of 50 and down from 62. At this margin, in the context of a stable haemoglobin and healthy iron stores, this is minor and most likely reflects the lower calorie intake rather than a bone marrow problem. The platelet count has dropped from 362 to 293, which is still mid-range and entirely normal. The ESR has improved from 22 to 6 as noted above.\n\nHis iron studies are healthy and have changed in an interesting way. Ferritin (the body's stored iron) has fallen from 94 to 53, which is still within the optimal range of 50 to 200 for men. Serum iron has risen from 14.3 to 25.4 and transferrin saturation has improved from 18.4% (which was at the lower boundary) to 36.9%, now well within the optimal band of 25 to 40%. Transferrin and total iron binding capacity are both mid-range. The improved saturation suggests the iron in circulation is better distributed now.\n\nHis immune markers are stable. IgG has dropped from 13.6 to 11, IgM is unchanged at 1.4, IgA has dropped from 3.7 to 3.3, and IgE has dropped from 132 to 93.6, now within the reference range of less than 100 where it was previously above. Rheumatoid factor is negative and the coeliac screen is negative. The PSA is 0.36 with a free PSA ratio of 0.833, both excellent and unchanged from March. Tumour markers CA 19-9 and CEA are both well within range. Creatine kinase is 97, down from 175, within range and reflecting a lower level of acute muscle damage at the time of sampling.\n\nHis total antioxidant activity (TAA) is 1.99, above the upper limit of 1.77. In March it was 1.55. This rise is consistent with the multivitamin and omega-3 supplementation and is not a concern; it simply reflects supplemental antioxidant intake.\n\nThe cortisol is 414, within the morning reference range and essentially unchanged from 425.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 40.7 against a calendar age of 41, so the blood chemistry reads as the calendar age.\n\nHis ApoB:ApoA-I ratio at 0.80 places him in the average risk band (0.7 to 0.9), down from 1.09 which was in the higher risk band. The atherogenic index of plasma is 0.169, within range but above the 0.11 optimal ceiling, driven by the triglycerides and HDL. The Castelli II ratio (LDL to HDL) is 2.08, within the optimal band. Remnant cholesterol (total cholesterol minus HDL minus LDL, representing the cholesterol carried by triglyceride-rich particles) is 0.71, within range but above the 0.5 optimal target, again driven by the triglycerides.\n\nThe De Ritis ratio (AST:ALT) is 0.58, just below the 0.6 lower boundary. When ALT is higher than AST, as it is here, the ratio falls below 1 and reflects mild hepatocellular activity. This is consistent with the ALT at 50 and is not a separate concern; it will normalise as the ALT improves.\n\nIn the urine, pH is 6, specific gravity is 1.025, there is a trace of protein (which can appear after exercise), no glucose, no ketones, no blood, no white cells, no nitrites. The bacterial culture and urine culture and sensitivities are pending.\n\nIn summary, Ben has made substantial, measurable improvements in the six months since his baseline. His lipids, inflammation, uric acid, vitamin D, B12, testosterone and liver enzymes have all moved in the right direction, many of them dramatically. The two areas that need continued attention are the kidney function, which has not changed and should be discussed with his GP, and the residual ApoB elevation, which will continue to respond to the dietary changes already underway. The low libido is unlikely to be hormonal given the excellent testosterone, and a conversation with the GP about the omeprazole and its ongoing necessity would be worthwhile.","links":"The central story in this report is the contrast between a cardiovascular and metabolic profile that has responded impressively to lifestyle change and a kidney filtration marker that has not moved at all. Six months ago, Ben's lipid panel was the primary concern: triglycerides above 3, HDL below 1, ApoB at 1.18, and an ApoB:ApoA-I ratio in the higher risk band. Today, every one of those markers is substantially better: triglycerides nearly halved, HDL up 20%, ApoB down 17%, and the ratio down from 1.09 to 0.80. The inflammatory markers followed the same trajectory, with hsCRP falling from 2.2 to 0.8 and ESR from 22 to 6. These changes are mutually reinforcing: lower triglycerides reduce the production of small, dense LDL particles, higher HDL improves reverse cholesterol transport, and lower CRP means less inflammation in the arterial wall where those particles deposit. The mechanism behind all of it is almost certainly the dietary shift, the reduction in alcohol from more than seven drinks per week to one to four, and possibly the increased training intensity.\n\nThe kidney story sits apart from this improvement. Cystatin C at 1.22 is unchanged, and the eGFR from both creatinine and cystatin C lands at 65. In a muscular 41-year-old, creatinine alone would be unreliable, but cystatin C is independent of muscle mass, and the fact that both methods converge at the same number makes the filtration rate more credible. The uric acid improvement from 510 to 325, thanks to allopurinol, removes one source of kidney stress, and the CRP improvement removes another. Yet the filtration has not budged. The two most likely explanations are either an intrinsic baseline that sits lower than average for Ben's age, or a contribution from the medications. Omeprazole has been associated with interstitial nephritis and reduced GFR in long-term use, and allopurinol, while generally kidney-protective, can occasionally contribute to renal impairment. The GP should assess whether omeprazole is still clinically necessary and should check a urine albumin-to-creatinine ratio to determine whether there is any protein leakage that would change the clinical significance of the eGFR.\n\nThe testosterone improvement from 20.8 to 27.7 is striking and parallels the metabolic improvements. Visceral fat, poor sleep, high alcohol and systemic inflammation all suppress testosterone production, and addressing each of those levers has allowed the hypothalamic-pituitary-gonadal axis to recover. The LH rising from 2.72 to 4.72 confirms the pituitary is driving harder and the testes are responding. Despite this, Ben reports low libido. The bloods have excluded the hormonal explanation, which is itself useful information: it narrows the search to non-hormonal causes. Omeprazole, nicotine, low energy availability and sleep duration are all plausible contributors, and they should be explored in that order of priority.\n\nThe marginally elevated FT4 at 23 with a TSH of 0.98 is a loose end. It does not fit a pattern of thyroid disease: both antibodies are negative, FT3 is normal, and there are no hyperthyroid symptoms. The most likely explanation is either a laboratory fluctuation or a transient shift in binding proteins. It should be repeated on the next test, and unless it persists or the TSH falls further, it does not change any clinical decision.\n\nThe remaining findings, the ALT at 50 and the low absolute reticulocyte count at 45, share a possible contributor: low calorie intake. A diet volume of 2 out of 10 with hard training six days a week creates a relative energy deficit that can stress the liver mildly and reduce the bone marrow's rate of new red cell production. Neither is alarming, but both would be expected to improve if calorie intake increases to match the training demand.","lifestyle":"Add at least two portions of vegetables or salad to your main meals every day, starting with lunch. Anchor: before you plate anything else, the vegetables go on first. Why: at 0 to 1 portions a day, Ben's fibre and micronutrient intake is the weakest link in the diet, and increasing vegetables provides the soluble fibre that lowers LDL, the potassium that supports kidney function, and the folate and antioxidants the blood needs.\nIncrease total calorie intake to approximately 2,500 to 2,700 calories per day, with at least 140 to 155 grams of protein. Anchor: add a mid-morning and a mid-afternoon snack built around protein (Greek yoghurt, nuts, a protein shake, cheese, cold meat) so you are eating four to five times rather than skipping meals. Why: a diet volume of 2 out of 10 with six hard training sessions a week is an energy deficit that could be suppressing libido, slowing red cell production, and contributing to the ALT rise.\nEat two to three portions of oily fish per week (salmon, mackerel, sardines, trout). Anchor: make two of your weekly dinners a fish meal. Why: omega-3 from food is the most effective way to continue the triglyceride improvement from 3.23 to 1.77 and push HDL above 1.4.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and triglyceride response to that meal, and it adds to the daily step count which at 2,000 to 5,000 is the one area of activity that lags behind the excellent gym work.\nAim for at least 7 hours of sleep on training nights, prioritising an earlier bedtime rather than a later wake-up. Anchor: set a phone alarm 30 minutes before target bedtime as a wind-down cue. Why: testosterone production peaks during deep sleep, and at 6 to 7 hours the sleep window is likely cutting into the last REM cycle, which could be contributing to the libido issue despite excellent testosterone levels.\nConsider a structured plan to stop vaping. Why: nicotine constricts blood vessels, impairs endothelial function, raises cardiovascular risk independently of the improvements in lipids and CRP, and is associated with reduced sexual function.\nMaintain alcohol at 1 to 4 drinks per week or less. Why: the reduction from more than 7 to 1 to 4 has driven the GGT from 78 to 45 and contributed to the CRP and triglyceride improvements; keeping it here or lower protects those gains.\nCalorie target: 2,500 to 2,700 kcal per day based on a BMR of approximately 1,870 kcal, a moderate-to-hard activity multiplier, and a small surplus to support recovery and red cell production. Protein target: 140 to 155 g per day (1.6 to 1.8 g per kg). Weight: maintain at 88 kg given the stocky, muscular build; focus on body composition rather than the scale.","flags":"Cystatin C 1.22 (above 1.1), creatinine 125 (above 104), creatinine-based eGFR 61, cystatin C eGFR 65, combined eGFR 65. All below the 90 optimal threshold. Unchanged from March 2026 (cystatin C 1.22, creatinine 104, eGFR 77). In a muscular 41-year-old, creatinine alone would be unreliable, but the cystatin C confirmation makes the reduced filtration rate credible. No proteinuria, no haematuria, electrolytes normal. Recommend urine ACR, review of omeprazole necessity, and repeat cystatin C in three months.\nApoB 0.98 (above 0.9 target), ApoB:ApoA-I ratio 0.80 (above 0.7 target), VLDL 0.8 (above 0.78), HDL 1.2 (below 1.4 optimal), triglycerides 1.77 (above 1.7 fasting target). All significantly improved from March (ApoB 1.18, ratio 1.09, VLDL 1.47, HDL 1.0, triglycerides 3.23). Lp(a) below 25, meaning the remaining elevation is entirely modifiable. Cardiovascular Risk Score 55 out of 100, driven by ApoB, HDL and triglycerides.\nFree T4 23 (above 22.7), TSH 0.98, FT3 4.7, both antibodies negative. Previously FT4 17.4, TSH 1.44. Marginal elevation with no clinical features of hyperthyroidism. Recommend repeat in three to six months.\nALT 50 (within lab range of less than 56 but above 30 optimal for men), up from 37 in March. De Ritis ratio 0.58 (below 0.6). GGT improved from 78 to 45, FIB-4 0.57, APRI 0.247, ruling out fibrosis. The ALT rise may reflect low energy availability against high training load.\nAbsolute reticulocytes 45 (below 50), down from 62. Haemoglobin stable at 147. Minor finding, likely reflecting low calorie intake.\nWBC 4.23 (within range but at floor), neutrophils 2.24 (within range but at floor), both notably lower than March (6.72, 3.98). Could reflect viral exposure near sampling, low energy availability, or normal variation. Not actionable but worth watching.\nFolate greater than 24 (above 17). Driven by multivitamin supplementation, not a concern.\nTAA 1.99 (above 1.77). Driven by supplementation, not a concern.\nReassuring negatives: HbA1c 31, fasting glucose 4.1, HOMA-IR 1.31 (all optimal), hsCRP 0.8 (optimal), uric acid 325 (well controlled on allopurinol), testosterone 27.7 (optimal), PSA 0.36 (excellent), thyroid antibodies negative, coeliac screen negative, liver fibrosis scores clear, all tumour markers normal, iron studies healthy, B12 and vitamin D well supplemented.","recommendations":"Discuss kidney function with the GP: cystatin C 1.22 unchanged from March, combined eGFR 65 at age 41. Request a urine albumin-to-creatinine ratio and a repeat cystatin C in three months. Ask whether the omeprazole could be contributing and whether it is still clinically necessary.\nAsk the GP to review the ongoing need for omeprazole. Long-term PPI use is associated with reduced kidney function, reduced magnesium and B12 absorption, and in some individuals reduced libido. If reflux symptoms have resolved, a step-down trial may be appropriate.\nRepeat thyroid function (TSH, FT4, FT3) in three to six months to confirm whether the FT4 at 23 was a one-off or a trend. No action needed now, but a persistent rise with a falling TSH would need further investigation.\nContinue the dietary and lifestyle changes that have driven the lipid improvement. The next target is ApoB below 0.9: increasing oily fish, maintaining the low-carb approach, and adding soluble fibre from vegetables and oats are the three most effective levers.\nDiscuss the low libido with the GP. Hormonal causes have been excluded by this panel. The conversation should cover omeprazole as a possible contributor, nicotine from vaping, and whether a structured cessation plan is appropriate.\nRetest in six months with the same panel. Key markers to track: cystatin C and eGFR (kidney trend), ApoB and HDL (lipid targets), ALT (liver direction), FT4 and TSH (thyroid trend), reticulocytes and WBC (recovery with increased calorie intake). Calorie target 2,500 to 2,700 kcal per day, protein 140 to 155 g per day.","supplementation":"Vitamin D3 (cholecalciferol): maintain current dose. At 175 nmol/L, levels are excellent and supplementation is working well. Continue 2,000 to 3,000 IU daily with a fat-containing meal through the year, reducing to 1,000 IU in summer if spending time outdoors. Always take with vitamin K2 (MK-7), 100 to 200 mcg daily, to direct the calcium into bone rather than arteries.\nOmega-3 fish oil: continue at 2 to 3 g combined EPA and DHA daily, ideally with the largest meal. Why: supports the ongoing triglyceride reduction from 3.23 to 1.77 and provides anti-inflammatory benefit that contributed to the CRP drop.\nMagnesium glycinate: 300 to 400 mg before bed. Why: magnesium at 1.04 is at the top of the range, which is ideal, and glycinate supports sleep quality and muscle recovery on a hard training schedule. This may also help protect kidney function.\nMultivitamin: continue, as it is maintaining folate and B12 in the optimal range. If the omeprazole is stepped down, B12 absorption should improve further. If it is continued, consider switching to sublingual methylcobalamin 1,000 mcg daily to bypass the absorption issue that PPIs create.\nDo not add an iron supplement. Ferritin at 53 and saturation at 37% are healthy. Additional iron is not needed.\nThe most important changes from this report are not supplements. They are increasing daily calorie intake to match the training load, adding vegetables to every meal, discussing the omeprazole and kidney function with the GP, and working towards stopping nicotine.","is_retest":true,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 72 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 71.6. Weakest systems: kidney function 48%, vitamins & nutrients 48%, lipids & cardiovascular 60%. Biggest drags: Apolipoprotein B, Free Thyroxine (FT4), Creatinine, eGFR (Creatinine + Cystatin C).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"40.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4424","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term: it measures the risk being built in the arteries right now, not the ten-year probability of an event. At 55, this is above the 40 threshold, driven primarily by the ApoB at 0.98 (above the 0.9 target), the HDL at 1.2 (below the 1.4 optimal), and the triglycerides at 1.77 (above the 1.7 fasting limit). Importantly, at 41, the ten-year event risk is still low, but the score captures the gap between that low short-term risk and the underlying burden of atherogenic particles. The score has improved substantially from what it would have been in March, and the remaining drivers are all modifiable. The continued dietary trajectory should bring it towards the 40 threshold over the next six to twelve months.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the sugar circulating in Ben's blood after an overnight fast. At 4.1, this is well within the optimal range of 4.0 to 5.4 and virtually unchanged from 4.3 in March. It confirms his blood sugar regulation is excellent, with no sign of impaired fasting glucose or pre-diabetes.","low_causes":"Prolonged fasting, excess insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection, steroid use","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"4.3","baseline_date":"2026-03-20"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"%","description":"HbA1c percentage is another way of expressing the same three-month average blood sugar as the mmol/mol value below. At 5%, this is well within the normal range of less than 6.0% and confirms excellent long-term blood sugar control.","low_causes":"","high_causes":"Sustained high blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose attached to it, giving a picture of average blood sugar over the past two to three months. At 31, this is well within the optimal range of less than 36 and slightly improved from 33 in March. It rules out any pre-diabetic trend and is an excellent result.","low_causes":"","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"33","baseline_date":"2026-03-20"},{"key":"ins","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"7.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3987","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3093","upper_optimal_position":"0.4153","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing to keep blood sugar in check. A high fasting insulin, even when glucose is normal, is an early sign of insulin resistance. At 7.19, Ben's insulin is within the optimal range of 2 to 8, improved from 8.91 in March. The pancreas is producing exactly the right amount of insulin to control blood sugar without overworking. This is an excellent result for someone on a low-carb diet.","low_causes":"Very low carbohydrate intake, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate diet, excess body fat, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3821","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4758","units":"ug/L","description":"C-peptide is released in equal amounts to insulin when the pancreas produces it, making it a reliable measure of how much insulin the body is actually making (as opposed to injected insulin, which would not produce C-peptide). At 1.61 micrograms per litre (equivalent to approximately 533 pmol/L), this is within the reference range and confirms healthy pancreatic output. It sits below the optimal ceiling of 2.5, indicating the pancreas is not being overworked.","low_causes":"Very low carbohydrate diet, type 1 diabetes, low insulin demand","high_causes":"Insulin resistance, metabolic syndrome, pancreatic tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4627","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and insulin to estimate how resistant the body's cells are to insulin's signal. A score below 1.0 is optimal, above 1.9 indicates early insulin resistance, and above 2.9 indicates significant resistance. At 1.31, Ben's HOMA-IR is within the healthy range and improved from 1.7 in March. The improvement reflects the combined effect of his dietary changes and reduced triglycerides. It is not yet in the optimal zone below 1.0, but the direction is positive.","low_causes":"High insulin sensitivity, very low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, excess visceral fat, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.7","baseline_date":"2026-03-20"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3786","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts HbA1c into a daily average blood sugar equivalent. At 5.3 mmol/L, this is well within the optimal range and confirms that Ben's blood sugar has averaged a healthy level over the past three months.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4920","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_o thin range and a substantial improvement from 14.3 in March, consistent with the improved transferrin saturation.","low_causes":"Iron deficiency, chronic disease, blood loss, poor absorption","high_causes":"Iron overload, haemochromatosis, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"14.3","baseline_date":"2026-03-20"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4627","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. The body produces more transferrin when iron stores are low and less when they are adequate. At 2.74, this is mid-range and slightly lower than 3.09 in March, which is expected given the improved iron status (the body no longer needs to produce as much transport capacity).","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"3.09","baseline_date":"2026-03-20"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"63.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5376","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3953","upper_optimal_position":"0.6043","units":"umol/L","description":"Total iron binding capacity (TIBC) measures the total capacity of transferrin to carry iron. It mirrors transferrin and rises when iron is low. At 63.6, this is comfortably within range and consistent with healthy iron .66, this is within the optimal range, lower than the 2.08 in March but a healthy level.","low_causes":"Viral infection (acute phase), steroid use, stress, HIV, autoimmune disease","high_causes":"Viral infection (recovery), chronic infection, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3542","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and help coordinate the immune response. At 0.25, this is within the reference range, slightly lower than 0.38 in March and just below the optimal band. This is a minor finding and not a concern.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3681","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic infections. At 0.07, this is low within the optimal range and consistent with no allergic or parasitic activity. Down from 0.22 in March.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.06","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5185","units":"x10^9/L","description":"Basophils are the rarest white blood cells and play a role in allergic reactions and inflammation. At 0.01, this is at the lower limit and entirely normal. Unchanged from March.","low_causes":"Steroid use, acute allergic reaction, hyperthyroidism","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"0.95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4083","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are newly made red blood cells released from the bone marrow. The percentage measures the proportion of red cells that are young. At 0.95%, this is within the reference range and lower than 1.27% in March. In the context of a stable haemoglobin, this is not a concern, but combined with the low absolute count it suggests the bone marrow is producing red cells at a slightly reduced pace.","low_causes":"Iron, B12 or folate deficiency, low energy availability, bone marrow suppression, chronic disease","high_causes":"Recovery from blood loss, haemolysis, response to treatment for anaemia","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.27","baseline_date":"2026-03-20"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"45.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2502","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Absolute reticulocyte count measures the total number of young red blood cells in circulation, not just the percentage. At 45, this is just below the lower limit of 50 and down from 62 in March. With haemoglobin stable at 147 and iron stores adequate, the bone marrow is not failing to produce red cells, but the rate of new cell production is slightly below ideal. The most likely contributor is the low calorie intake against a heavy training load: when energy is restricted, the body slows non-essential production, and red cell turnover is one of the functions it can safely reduce in the short term. Increasing calorie intake would be expected to bring this back above 50.","low_causes":"Low energy availability, iron or B12 deficiency, chronic disease, bone marrow suppression","high_causes":"Recovery from blood loss, haemolysis, high altitude acclimatisation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by the red blood cell count and is used to distinguish between iron deficiency anaemia and thalassaemia trait when MCV is low. At 19, with a normal MCV of 90.1, this is reported for context and confirms there is no suggestion of thalassaemia trait.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"Erythrocyte sedimentation rate (ESR) is a broad measure of inflammation in the body. Red cells settle faster when inflammatory proteins are present. At 6, this is well within the optimal range and a major improvement from 22 in March, which was above the optimal ceiling. The drop is consistent with the reduced hsCRP and reflects a genuine decrease in systemic inflammation.","low_causes":"","high_causes":"Infection, autoimmune disease, chronic inflammation, cancer, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"22","baseline_date":"2026-03-20"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance and blood pressure. At 141, this is well within the optimal range and essentially unchanged from 142 in March.","low_causes":"Overhydration, diuretics, kidney disease, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"142","baseline_date":"2026-03-20"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works with sodium to maintain fluid balance and acid-base equilibrium. At 105, this is within the optimal range and slightly up from 103 in March. Both values are normal.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"103","baseline_date":"2026-03-20"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"23.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4212","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the main buffer the body uses to maintain blood pH in the narrow range needed for normal function. At 23.9, this is within the optimal range and slightly up from 23 in March. It confirms normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"23","baseline_date":"2026-03-20"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product produced when the liver breaks down protein, and it is filtered out by the kidneys. It rises when kidney function declines or when protein intake is very high. At 5.5, this is well within the optimal range and improved from 8.0 in March. The drop reflects a healthier balance between protein intake and kidney clearance.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"8","baseline_date":"2026-03-20"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"125","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8462","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from the normal breakdown of creatine in muscle. The kidneys filter it out, so a rising level can indicate reduced kidney function. At 125, this is above the upper limit of 104 and up from 104 in March. However, creatinine is strongly influenced by muscle mass, and in a stocky, resistance-training male it is expected to run higher than in an average person. This is why cystatin C (which is independent of muscle) is the more reliable marker. The eGFR calculated from creatinine alone is 61, which is artificially low for Ben's build. The cystatin C-based eGFR of 65 gives a more accurate picture, though it still sits below the 90 optimal threshold.","low_causes":"Low muscle mass, muscle wasting, liver disease","high_causes":"Reduced kidney function, high muscle mass, high protein diet, dehydration, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"104","baseline_date":"2026-03-20"},{"key":"gfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"Estimated glomerular filtration rate (eGFR) uses creatinine to calculate how efficiently the kidneys filter blood. An eGFR above 90 is optimal, 60 to 89 is mildly reduced, and below 60 defines chronic kidney disease. At 61, this is just above the 60 threshold but below 90, and down from 77 in March. The fall is largely driven by the rise in creatinine from 104 to 125. In a muscular man, the creatinine-based eGFR underestimates true filtration, which is why the cystatin C-based calculation is more informative here.","low_causes":"Reduced kidney function, high muscle mass (falsely low), dehydration","high_causes":"High cardiac output, early diabetes, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cgfr","name":"Calculated Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"This eGFR is calculated from cystatin C rather than creatinine. Cystatin C is produced at a constant rate by all nucleated cells and is not affected by muscle mass, making it a more reliable filtration marker in muscular individuals. At 65, this is above the 60 threshold but below 90 and unchanged from March (which also produced a cystatin C of 1.22). This is the result that makes the reduced filtration rate credible: if it were only the creatinine that was elevated, muscle mass would be the likely explanation, but cystatin C confirms the filtration rate is genuinely below ideal.","low_causes":"Reduced kidney function, acute kidney injury, chronic kidney disease","high_causes":"Thyroid dysfunction (hyperthyroidism can falsely lower cystatin C and raise eGFR)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"325","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4954","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4893","units":"umol/L","description":"Uric acid is produced when the body breaks down purines from food and cell turnover. It is filtered by the kidneys, and when levels get too high it can form crystals in joints (gout) and contribute to kidney damage. At 325, this is well within the optimal range of 200 to 380 for men and a dramatic improvement from 510 in March. The allopurinol is clearly working well, and the level is now in a range that protects both joints and kidneys.","low_causes":"Low purine diet, some medications, Wilson's disease","high_causes":"Gout, high purine diet, kidney disease, metabolic syndrome, alcohol, diuretics","padding":"1","one_sided":"0.5","range_type":"normal","baseline_re
