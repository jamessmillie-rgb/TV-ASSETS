<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Daniel Goss-Custard","dob":"16/05/1973","report_date":"2026-10-02","summary":"This is Daniel's second TrueVitals report, taken approximately one month after his baseline test. His quiz answers are unchanged: he remains a 53-year-old male with a BMI of 25.5, following a standard mixed diet rated 8 out of 10 for quality with a volume of 7 out of 10, training five times per week across three cardio and two resistance sessions, and walking 10,000 to 15,000 steps a day. He continues to take a statin and warfarin. He still reports poor sleep and insomnia, hair thinning, and low energy and fatigue, and his goals remain building muscle, losing body fat, and improving long-term health and longevity.\n\nThe headline from this retest is that his liver markers have improved meaningfully, his testosterone has risen into a strong position, the majority of his results remain excellent, and the two persistent findings from last time, the elevated Lipoprotein(a) and the below-range absolute reticulocytes, are essentially unchanged, which is exactly what we would expect given that one is genetically fixed and the other is a stable mild finding. There is one new result that warrants attention: his homocysteine has come back at 20 umol/L, which is above the desirable level of below 15 and represents a genuine cardiovascular risk factor that, unlike his Lp(a), is modifiable.\n\nStarting with the positives, and there are many. His liver has responded well over the past month. ALT has dropped from 47 to 33, a meaningful improvement that brings it much closer to the optimal threshold of below 30 for a man. GGT has come down from 38 to 33. Both are still above optimal but the direction of travel is clear and encouraging, particularly given that his statin and warfarin are both metabolised through the liver. The FIB-4 score, a composite index that estimates the likelihood of liver scarring by combining age, platelet count, and liver enzymes, is 1.35, just above the 1.3 threshold but comfortably below any level that would suggest actual fibrosis, especially as his bilirubin, albumin, total protein, and alkaline phosphatase are all within range and his APRI score, another fibrosis index, is 0.37, well within the safe zone. At 53, age nudges the FIB-4 calculation upward on its own. There is no evidence of liver disease here.\n\nHis testosterone has risen from 19.1 to 22.9 nmol/L, a jump of nearly four points that places him firmly within the optimal band of 18 to 30. Testosterone is the primary male sex hormone responsible for muscle protein synthesis, bone density, energy, mood, and libido. At 53, a reading of 22.9 is genuinely strong. His free testosterone, the unbound fraction that is biologically active, has increased from 0.348 to 0.381 nmol/L, and his bioavailable testosterone, which includes both the free fraction and the loosely albumin-bound fraction, is 8.92 nmol/L against a range of 2 to 9. His SHBG, sex hormone binding globulin, the protein that binds testosterone and reduces its availability, is 50.7, within range but toward the upper end, which is worth noting because SHBG tends to rise with age and with warfarin use. The net effect is that despite a slightly high SHBG, enough testosterone is getting through. His DHEA-S, a precursor hormone produced by the adrenal glands that declines with age, is 4.8 umol/L, healthy for 53. His oestradiol, progesterone, LH, FSH, prolactin, and cortisol are all within their respective ranges and unchanged in any meaningful way from last time.\n\nHis thyroid remains in excellent working order. TSH, the signal the pituitary sends to the thyroid to request more hormone, is 1.8, sitting perfectly within the optimal 1.0 to 2.5 band. Free T4, the storage form of thyroid hormone, is 17.8, and free T3, the active form that cells actually use, is 5.5, both within their optimal ranges. The FT3 to FT4 ratio, which reflects how efficiently the body converts storage hormone into active hormone, is 0.31, right in the middle of the ideal 0.27 to 0.40 band. Both thyroid antibody tests, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. This is particularly useful given his symptoms of fatigue and hair thinning, because it tells us the thyroid is not contributing to either.\n\nHis blood sugar control is excellent and has actually improved. Fasting glucose has come down from 4.7 to 4.5, and HbA1c, which reflects average blood sugar over the preceding two to three months, has dropped from 40 to 37 mmol/mol, or from 5.8% to 5.6%. Both are now comfortably within the optimal zone. His fasting insulin is 4.49, his HOMA-IR, which estimates insulin resistance by combining fasting glucose and insulin, is 0.9, and these numbers together paint a picture of excellent insulin sensitivity. His C-Peptide, a marker released in equal amounts to insulin by the pancreas and used as a proxy for insulin production, is 0.995 ug/L, just below the lab range of 1.1 to 4.4 and essentially unchanged from 0.966 last time. In the context of a fasting glucose of 4.5 and an HbA1c of 37, this does not suggest the pancreas is struggling to keep up; it simply means Daniel's body requires very little insulin to maintain excellent blood sugar control. This is a metabolic positive.\n\nHis kidney function is solid. Cystatin C, a protein filtered by the kidneys that provides a more reliable estimate of kidney function than creatinine alone, particularly in people who are lean and active, is 1.04, within the limit of 1.1, giving a Cystatin C eGFR of 90. The combined eGFR using both creatinine and cystatin C is also 90, which sits exactly on the lower boundary of the optimal range. For context, his previous Cystatin C eGFR was 92 and the creatinine-based eGFR was above 90 both times, so kidney function is stable and adequate at 53. Sodium, potassium, chloride, and bicarbonate are all within range. His uric acid is 181, below the lab lower limit of 220, unchanged from 178 last time. Low uric acid is not a clinical concern and likely reflects good hydration and dietary pattern.\n\nHis full blood count is reassuring across the board. Haemoglobin is 153, red cells 5.12, haematocrit 0.444, MCV 86.7, MCH 29.9, all within range and stable. His white cell count is 5.51 with a normal differential, and the neutrophil to lymphocyte ratio, a marker of systemic inflammation and immune balance, is 1.36, firmly within the ideal 1 to 2 band. Platelets are 198, healthy and stable. The one persistent finding in the blood count is his absolute reticulocyte count at 41.5, just below the lower limit of 50 and essentially identical to last time's 42.5. Reticulocytes are newly made red blood cells released from the bone marrow, and a mildly low count at 53, with completely normal haemoglobin, iron studies, B12, and folate, most likely reflects a gentle age-related slowing of the rate at which the marrow produces red cells. His haemoglobin is not dropping, his iron stores are healthy, and there is no clinical consequence to this finding.\n\nHis iron studies are in good shape. Ferritin, the main marker of iron stores, is 118, down marginally from 126 but still comfortably within the optimal 50 to 200 range. Transferrin saturation has improved from 25.4% to 30.1%, sitting squarely in the ideal 25 to 40% band. Serum iron, transferrin, and total iron binding capacity are all within range.\n\nHis lipid profile remains exceptional, and this is particularly important context for the two cardiovascular findings that are not exceptional. Total cholesterol is 2.7, LDL is 0.53, ApoB is 0.39, HDL has risen from 1.7 to 1.8, triglycerides are 0.74, the TG/HDL ratio is 0.41, remnant cholesterol is 0.37, and the ApoB to A-I ratio is 0.23. Every single one of those numbers is within the optimal range, and the ApoB of 0.39 is outstandingly low by any standard. His Apolipoprotein A1 has risen from 1.4 to 1.7, a notable improvement in the protective lipoprotein fraction. The statin is clearly doing its job, and the underlying metabolic health, reflected in the insulin sensitivity and low triglycerides, is doing the rest.\n\nAgainst that backdrop, there are two cardiovascular findings that need attention. The first is unchanged from the last report: his Lipoprotein(a) is 166.37 nmol/L, up marginally from 156.46 but within the normal fluctuation for this marker. Lp(a) is a genetically inherited lipoprotein particle structurally similar to LDL but carrying an additional protein called apolipoprotein(a). It contributes to cardiovascular risk by depositing cholesterol into artery walls, promoting blood clot formation by interfering with the body's natural clot-dissolving process, and driving localised inflammation within the arterial lining. Because it is genetically determined, it does not change with diet, exercise, or standard medications, and it remains essentially fixed for life. At 166 nmol/L, Daniel sits in the moderate-risk category (90 to 200). This should remain permanently in his medical notes, and first-degree relatives should be tested. The Lp(a)-corrected LDL, which subtracts the cholesterol carried by Lp(a) particles from the total LDL figure to show what is truly modifiable, comes out at essentially zero, confirming that every bit of modifiable LDL cholesterol has been addressed. That is as good as it gets.\n\nThe second cardiovascular finding is new and is the most actionable result in this report. His homocysteine is 20 umol/L, above the desirable limit of 15. Homocysteine is an amino acid produced during the metabolism of methionine, which comes from dietary protein. Normally the body recycles homocysteine back into methionine using vitamin B12 and folate, or converts it into cysteine using vitamin B6. When any of those B vitamins are insufficient, or when the enzymes that use them are genetically less efficient, homocysteine accumulates. Elevated homocysteine is an independent risk factor for cardiovascular disease because it damages the lining of blood vessels, promotes oxidative stress, and encourages clot formation. In someone who already carries a high Lp(a) and is on warfarin for a clotting-related reason, an elevated homocysteine adds a second non-lipid cardiovascular risk factor that deserves attention. The good news is that unlike Lp(a), homocysteine is almost always modifiable. His B12 is 345, within the lab range of 193 to 982 but below the optimal threshold of 500, and his folate is 12, within range but not at the top. Both are plausible contributors to the elevated homocysteine. A course of methylated B vitamins, specifically methylcobalamin (the active form of B12), methylfolate (the active form of folic acid), and pyridoxal-5-phosphate (the active form of B6), should bring homocysteine down into the safe zone within two to three months, and this should be confirmed with a repeat test.\n\nHis Cardiovascular Risk Score, a TrueVitals composite index that combines ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c into a single number from 0 to 100, is 35 out of 100. This sits within the acceptable range of below 40 but above the ideal threshold of below 20, and the driver is almost entirely the Lp(a). Every modifiable input to this score is optimal or near-optimal. The hs-CRP, a sensitive marker of systemic inflammation, is 1.3, up from 0.7 last time. It remains below the cardiovascular risk threshold of 3.0, but it has moved above the optimal threshold of 1.0. At this level it could reflect anything from a minor viral exposure in the days before the test to a slightly harder training week. It is worth watching at the next retest but does not require action on its own.\n\nHis IgE remains elevated at 120 IU/ml against a limit of 100, down from 158 last time. IgE is the antibody class associated with allergic responses, and a persistently elevated level suggests an underlying allergic tendency, whether that is environmental allergens like dust mites or pollen, or a food sensitivity. It does not indicate anything dangerous, but if Daniel experiences any symptoms suggestive of allergy, such as nasal congestion, itchy eyes, skin reactions, or gut symptoms after certain foods, it would be worth exploring with his GP. The downward trend from 158 to 120 is mildly encouraging. IgG, IgM, and IgA are all within range, and his rheumatoid factor is well below the threshold, ruling out rheumatoid-type autoimmune activity. The tissue transglutaminase IgA test is negative, ruling out coeliac disease.\n\nHis vitamin D has come down from 133 to 115 nmol/L. Both are within the optimal range of 75 to 120, so this is not a concern, but it does suggest he should continue whatever supplementation regimen he is using to maintain it, particularly heading into autumn and winter when UVB exposure drops. His magnesium is 1.02, up from 0.97, and now sitting within the optimal 0.85 to 1.05 band. His calcium and corrected calcium are both within range. Parathyroid hormone is 2.6, up from 1.6 but still well within the normal range of 0.98 to 4.73, and the calcium-PTH axis is working as it should.\n\nHis prostate markers are stable and reassuring. Total PSA is 1.4, essentially identical to 1.43 last time, and well below the 3.5 threshold. Free PSA ratio is 0.39, well above the 0.19 cutoff, which is the pattern associated with benign prostate tissue rather than malignancy. CA 19-9 and CEA, both tumour markers used for screening, are within their respective ranges. His total antioxidant activity is 1.39, within the lab range of 1.3 to 1.77, down from 1.47 but still adequate. His creatine kinase is 94, within range and consistent with his training load.\n\nHis urinalysis is clean. No protein, glucose, ketones, blood, or white cells. The bacterial count and urine culture are pending and will be noted when they arrive.\n\nTurning to the symptoms Daniel reports. His fatigue and poor sleep are not explained by any of the obvious blood-based causes: his thyroid is working well, his haemoglobin and iron stores are healthy, his B12 and folate are within range (though B12 is suboptimal), his blood sugar and insulin are excellent, his testosterone is strong, and his cortisol is within the morning reference range. The mildly elevated homocysteine could contribute to fatigue through its effects on cellular energy metabolism and neurotransmitter production, but it is unlikely to be the sole driver. The most probable contributors to both the sleep difficulty and the fatigue are the sleep itself, since poor sleep quality directly impairs energy, recovery, and cognitive function, and potentially the warfarin, which can cause fatigue as a side effect in some people. Practical sleep interventions, specifically a fixed wake time seven days a week, morning light exposure within an hour of waking, a caffeine cutoff by early afternoon, and a cool, dark bedroom, are likely to have more impact than any supplement. If sleep remains poor despite good habits, a formal sleep study would be a reasonable next step, particularly given that at 53 with a BMI of 25.5, obstructive sleep apnoea is unlikely but not impossible. His hair thinning is similarly not explained by thyroid dysfunction, iron deficiency, or hormonal imbalance. At 53 with a strong testosterone and adequate iron, the most common cause is androgenetic alopecia, which is genetically driven and related to the sensitivity of hair follicles to dihydrotestosterone rather than to the total testosterone level. If this is a concern he wishes to address, his GP can discuss options.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 49.6, about 3 years younger than a calendar age of 53. His estimated average glucose, derived from his HbA1c, is 6.2 mmol/L, right at the upper boundary of the optimal range, consistent with excellent glycaemic control.\n\nIn summary, Daniel's retest shows clear improvement in liver enzymes, a meaningful rise in testosterone, stable and excellent metabolic and lipid profiles, and two findings that need action: the elevated homocysteine, which should respond to B vitamin supplementation and is worth rechecking in three months, and the persistently elevated Lp(a), which remains in his permanent medical record. The slightly low reticulocytes and below-range uric acid are stable, benign findings that need monitoring but no intervention.\n\nLate-arriving results: the full blood count markers confirm what the summary describes, with a stable mild reticulocyte count of 41.5 and all red cell indices within range, including an MCV of 86.7, MCH of 29.9, and haematocrit of 0.444 that together confirm oxygen delivery is fully intact; the RDW of 14.6 is within the laboratory range but sits above the tighter optimal threshold of 13.5, and the mildly suboptimal B12 of 345 remains the most plausible contributor, strengthening the case for methylcobalamin supplementation already recommended. Kidney, liver, lipid, insulin, and urinalysis results are all consistent with and supportive of the existing narrative: the FIB-4 of 1.35 is age-influenced rather than pathological, the HOMA-IR of 0.9 and fasting insulin of 4.49 confirm outstanding insulin sensitivity, the urinalysis is completely clean with no blood, white cells, nitrites, or casts, and the PSA of 1.4 with a free ratio of 0.393 remains reassuringly stable, with no result from this batch changing any recommendation or rating already made in the report.","links":"The thread that ties Daniel's results together runs through two distinct stories: one that is fixed and one that is fixable. The fixed story is his Lp(a). At 166 nmol/L, essentially unchanged from 156 last time, this genetically determined particle continues to be the dominant driver of his residual cardiovascular risk. Every modifiable lipid marker, his LDL, ApoB, triglycerides, HDL, remnant cholesterol, and the ApoB to A-I ratio, is not just within range but within the optimal zone. The Lp(a)-corrected LDL of effectively zero confirms that there is nothing more to achieve on the modifiable side of the lipid equation. The statin is working, his metabolic health is excellent, and the risk that remains is the risk he was born with.\n\nThe fixable story is the homocysteine. At 20 umol/L, this is a second, independent cardiovascular risk factor sitting alongside the Lp(a), and it matters more in Daniel's case precisely because of that Lp(a). In someone with a clean Lp(a), a homocysteine of 20 would still warrant correction, but the urgency would be lower. In someone who already carries an inherited risk factor that promotes clotting, inflammation, and cholesterol deposition, having a second marker that does much the same thing through a different mechanism makes the case for treating it stronger. The mechanism is almost certainly B vitamin availability. His B12 at 345 is within the lab range but below the 500 threshold where homocysteine recycling works most efficiently, and his folate at 12, while adequate, is not at the level that maximally supports the methylation cycle. A combination of methylcobalamin, methylfolate, and the active form of B6 should address this within two to three months.\n\nThe liver improvement connects to the overall metabolic picture. ALT dropping from 47 to 33 and GGT from 38 to 33 suggest that whatever was driving the mild elevation last time, whether it was a transient dietary factor, a period of higher alcohol intake, or simply variation in how the liver was handling the statin and warfarin, has eased. The absence of any fibrosis signal from the FIB-4, APRI, and NAFLD fibrosis scores confirms that the liver is healthy and that these enzyme fluctuations are surface-level metabolic activity rather than structural damage.\n\nThe testosterone rise from 19.1 to 22.9 is notable and positive. It may reflect improved sleep in the intervening month, a change in training stress, or simply natural variation, but the direction is welcome and places Daniel in a strong hormonal position for his goals of building muscle and losing body fat. The fact that his SHBG is slightly higher at 50.7 compared to 43.8 means that the rise in total testosterone has not fully translated into a proportional rise in free testosterone (0.348 to 0.381), but the bioavailable fraction at 8.92 is near the top of the range, confirming that enough is reaching the tissues.\n\nThe findings that were excluded are just as important as the findings that were flagged. Daniel's fatigue and poor sleep are not caused by thyroid dysfunction, anaemia, iron deficiency, B12 deficiency, blood sugar dysregulation, low testosterone, or systemic inflammation. That narrows the field considerably and points toward sleep architecture, stress, or medication effects as the most likely contributors. The hair thinning is not driven by thyroid disease, iron deficiency, or hormonal imbalance, which leaves androgenetic alopecia as the most probable explanation.","lifestyle":"Continue your current training pattern of three cardio and two resistance sessions with 10,000 to 15,000 steps. This is an excellent foundation and your metabolic markers reflect it. If you want to push muscle gain further, consider adding a third resistance session in place of one cardio session. Why: your testosterone at 22.9 and insulin sensitivity at HOMA-IR 0.9 mean your body is primed to respond to resistance training.\nIncrease foods rich in B vitamins, particularly folate and B12. Dark leafy greens (spinach, kale, broccoli), eggs, liver if tolerated, and oily fish (salmon, sardines, mackerel) twice a week. Anchor: add a portion of dark greens to lunch and dinner daily. Why: your homocysteine at 20 is driven partly by B vitamin availability, and dietary sources complement the supplements recommended below.\nAim for a protein intake of 117 to 144 grams per day (1.3 to 1.6 g per kg at 90 kg). Spread this across three to four meals rather than loading it into one. Anchor: include a palm-sized portion of protein at every meal and a post-training protein source within an hour of resistance sessions. Why: this supports your muscle-building goal and helps maintain the lean mass that underpins your excellent metabolic profile.\nYour calorie target for gradual fat loss while preserving muscle is approximately 2,200 to 2,400 kcal per day, based on a maintenance of roughly 2,640 (BMR of approximately 1,850 multiplied by a moderate activity factor of 1.6, adjusted down by roughly 10 to 15%). If fat loss stalls, drop to the lower end; if energy drops or training suffers, move to the upper end. Protein stays at 117 to 144g regardless.\nFix your wake time to the same time seven days a week, including weekends. This is the single most effective intervention for sleep quality. Anchor: set one alarm and do not deviate by more than 30 minutes. Why: your fatigue and insomnia are not explained by your blood results, which means sleep architecture is the most likely driver, and a consistent wake time is how the circadian clock anchors itself.\nGet outside within an hour of waking for at least 10 minutes of natural light, even on overcast days. Anchor: immediately after waking, before checking your phone. Why: morning light exposure suppresses melatonin and sets the cortisol awakening response, both of which improve alertness during the day and sleepiness at night.\nSet a caffeine cutoff at 1pm. Caffeine has a half-life of five to six hours, meaning a coffee at 3pm still has half its stimulant effect at 9pm. Anchor: after lunch, switch to water, herbal tea, or decaf. Why: caffeine after early afternoon is one of the most common hidden contributors to poor sleep quality.\nKeep your bedroom cool (16 to 18 degrees), dark, and free of screens for the last 30 minutes before sleep. Anchor: set a phone alarm labelled \"wind down\" 30 minutes before your target bedtime. Why: core body temperature needs to drop for sleep onset, and blue light from screens suppresses melatonin production.","flags":"CARDIOVASCULAR (HOMOCYSTEINE): Homocysteine 20 umol/L, above desirable limit of 15 (new finding, not tested at baseline). Independent cardiovascular risk factor that damages vessel lining, promotes oxidative stress, and encourages clot formation. Particularly relevant given the coexisting elevated Lp(a) and warfarin use. B12 at 345 (below optimal 500) and folate at 12 are plausible contributors. Should respond to methylated B vitamin supplementation. Recommend repeat in 3 months.\nCARDIOVASCULAR (Lp(a)): Lp(a) 166.37 nmol/L (limit below 32), moderate-risk category, essentially unchanged from 156.46 at baseline. Genetically inherited, non-modifiable. Remains a permanent medical record item. First-degree relatives should be tested if not already done. All modifiable lipid markers remain optimal: LDL 0.53, ApoB 0.39, HDL 1.8, triglycerides 0.74, ApoB/A-I ratio 0.23. Lp(a)-corrected LDL is effectively zero. Cardiovascular Risk Score 35/100, driven almost entirely by Lp(a).\nINFLAMMATION: hs-CRP 1.3 mg/L, up from 0.7, now above optimal threshold of 1.0 but well below cardiovascular risk threshold of 3.0. May reflect transient infection, training load, or normal variation. Monitor at next retest.\nGLUCOSE AND INSULIN: C-Peptide 0.995 ug/L (lab lower limit 1.1), essentially unchanged from 0.966 at baseline. In context of fasting glucose 4.5, HbA1c 37, and HOMA-IR 0.9, reflects low insulin demand in an insulin-sensitive individual rather than pancreatic insufficiency. No action required.\nHAEMATOLOGY: Absolute reticulocytes 41.5 x10^9/L (lower limit 50), stable from 42.5 at baseline. Haemoglobin 153, iron studies, B12, and folate all adequate. Likely mild age-related reduction in erythropoietic rate. Monitor.\nLIVER: ALT 33 (improved from 47, optimal below 30), GGT 33 (improved from 38, optimal below 25). FIB-4 1.35 (below 1.45 threshold), APRI 0.37, NAFLD fibrosis score -1.86. No evidence of fibrosis or liver disease. Direction of travel is positive. Both medications are hepatically metabolised.\nKIDNEY: Uric acid 181 umol/L (lower limit 220), stable from 178. Low uric acid is not clinically significant. Likely reflects good hydration and dietary pattern.\nIMMUNOLOGY: IgE 120 IU/ml (limit 100), down from 158 at baseline. Suggests underlying allergic tendency. No action unless symptomatic.\nVITAMINS: B12 345 pg/ml, within lab range (193 to 982) but below optimal threshold of 500. Contributing to elevated homocysteine. Supplementation recommended.\nReassuring negatives: thyroid function optimal with negative antibodies, HbA1c 37 (down from 40), HOMA-IR 0.9, testosterone 22.9 (up from 19.1), ferritin 118, PSA 1.4 with free ratio 0.39, eGFR 90, all tumour markers within range, coeliac screen negative, rheumatoid factor negative, urinalysis clean.","recommendations":"Discuss the homocysteine result of 20 umol/L with his GP. This is an independent cardiovascular risk factor, particularly relevant given his elevated Lp(a) and warfarin use. The GP should be aware that B12 is 345 (below the optimal 500 threshold) and that a course of methylated B vitamins is being started, with a repeat homocysteine test in three months to confirm it has responded.\nEnsure the Lp(a) result of 166.37 nmol/L is permanently recorded in his GP medical notes if not already done following the baseline report. This is a genetically fixed, lifelong cardiovascular risk factor. First-degree relatives (siblings and children) should be offered Lp(a) testing.\nDiscuss whether the GP considers it appropriate to check for the MTHFR gene polymorphism, given the elevated homocysteine. This common variant reduces the efficiency of the enzyme that converts folate into its active form and would explain why homocysteine is elevated despite adequate dietary folate. The result would guide whether methylfolate (the active form) is preferable to standard folic acid long-term.\nAt the next medication review, mention that ALT and GGT remain above optimal thresholds (33 and 33 respectively) despite improving. Both statin and warfarin are hepatically metabolised. No action is needed now, but the liver enzymes should continue to be monitored.\nIf sleep remains poor despite implementing the lifestyle changes in this report, discuss referral for a formal sleep study to exclude obstructive sleep apnoea or other sleep architecture disorders.\nIf hair thinning is a concern he wishes to address, the GP can discuss whether finasteride or minoxidil would be appropriate, given that thyroid, iron, and hormonal causes have been excluded.\nRetest in three months (January 2027), repeating at minimum: homocysteine, B12, folate, full lipid panel including Lp(a), hs-CRP, liver function (ALT, GGT), full blood count with reticulocytes, and HbA1c. Calorie target: 2,200 to 2,400 kcal/day for gradual fat loss. Protein target: 117 to 144g/day (1.3 to 1.6 g/kg).","supplementation":"Methylcobalamin (vitamin B12), sublingual, 1,000 mcg daily. Take in the morning, allow to dissolve under the tongue. Why: B12 at 345 is below the optimal threshold of 500 and is a likely contributor to the homocysteine of 20. Sublingual methylcobalamin bypasses gut absorption and provides the active form the methylation cycle needs.\nMethylfolate (5-MTHF), 400 to 800 mcg daily, taken with food. Why: folate at 12 is within range but not optimal for homocysteine recycling. Methylfolate is the bioactive form and is effective regardless of MTHFR gene status.\nPyridoxal-5-phosphate (active vitamin B6), 25 to 50 mg daily, taken with food. Why: B6 is required for the alternative pathway that converts homocysteine into cysteine. Together with methylcobalamin and methylfolate, this trio covers both recycling pathways and should bring homocysteine below 15 within two to three months.\nVitamin D3 (cholecalciferol), 2,000 IU daily with a meal containing fat. Pair with vitamin K2 (MK-7) 100 mcg. Why: vitamin D at 115 is within the optimal range but has dropped from 133, and heading into autumn and winter, continued supplementation will maintain the level. K2 directs calcium into bone rather than soft tissue.\nMagnesium glycinate, 300 to 400 mg before bed. Why: magnesium at 1.02 is within the optimal band but near the upper end, and glycinate specifically supports sleep quality, which is one of Daniel's primary symptoms. It also supports muscle recovery from his five training sessions per week.\nOmega-3 fish oil, 2g EPA+DHA daily, taken with food. Why: supports the anti-inflammatory and cardiovascular benefits alongside his statin, and may help with the mildly elevated hs-CRP of 1.3.\nThe most important changes from this report are not supplements. They are fixing the sleep routine with a consistent wake time, morning light, and a caffeine cutoff, and ensuring the homocysteine result is discussed with the GP and rechecked in three months.","is_retest":true,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 73 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 73.5. Weakest systems: lipids & cardiovascular 38%, immunology 42%, electrolytes & minerals 70%. Biggest drags: Lipoprotein(a), Reticulocytes (Absolute), Homocysteine, Cystatin C.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"48.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4147","lower_normal":"","upper_normal":"58","lower_optimal":"","upper_optimal":"53","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4569","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It measures the cardiovascular risk being built, not a ten-year event probability. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. Daniel's score of 35 sits within the acceptable range but above the ideal threshold of 20. The driver is almost entirely his Lp(a) at 166 nmol/L, since every other input to the score is within the optimal range. Every modifiable component of his cardiovascular risk is excellently controlled; the residual score reflects the inherited Lp(a) burden that cannot be changed through lifestyle or standard medication.","low_causes":"Optimal lipids, low inflammation, good glycaemic control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. Daniel's result of 4.5 mmol/L is within the optimal range of 4.0 to 5.4, improved from 4.7 at his baseline test. This confirms excellent blood sugar control and, alongside his low insulin and HbA1c, paints a picture of strong metabolic health.","low_causes":"Excess insulin, prolonged fasting, excessive exercise, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, infection, medications (e.g. corticosteroids)","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"4.7","baseline_date":"2026-09-04"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3111","lower_normal":"3.8","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3424","upper_optimal_position":"0.6197","units":"%","description":"HbA1c measures the percentage of haemoglobin that has been glycated, or coated with sugar, over the preceding two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. Daniel's result of 5.6% is within the normal range of below 6.0% and has improved from 5.8% at baseline. This is a clear positive shift.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Insulin resistance, prediabetes, type 2 diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"5.8","baseline_date":"2026-09-04"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c result expressed in mmol/mol, the international standard unit. Daniel's result of 37 mmol/mol is within the normal range of below 42 and has improved from 40 at baseline. A value below 42 is classified as normal, 42 to 47 as prediabetes, and above 48 as diabetes. At 37, Daniel is comfortably in the normal zone and moving in the right direction.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Insulin resistance, prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4186","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5754","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Lower is generally better, as it indicates the body's cells are responding efficiently to insulin's signal. Daniel's result of 4.49 mIU/L is within the optimal range of 2 to 8 and essentially unchanged from 4.25 at baseline. This confirms excellent insulin sensitivity.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate intake, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"4.25","baseline_date":"2026-09-04"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.995","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2276","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5242","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin and is used as a proxy for how much insulin the body is producing. Daniel's result of 0.995 ug/L (approximately 329 pmol/L) is marginally below the lab lower limit of 1.1 and essentially unchanged from 0.966 at baseline. In the context of a fasting glucose of 4.5, an HbA1c of 37, and a HOMA-IR of 0.9, this does not suggest pancreatic insufficiency. It simply means Daniel's body requires very little insulin to maintain excellent blood sugar, and the C-Peptide reflects that low demand.","low_causes":"Low insulin demand in insulin-sensitive individuals, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"0.966","baseline_date":"2026-09-04"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0","upper_normal":"15","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"umol/L","description":"Homocysteine is an amino acid produced during the metabolism of methionine ic inflammation, obesity, metabolic syndrome, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.7","baseline_date":"2026-09-04"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6133","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. Daniel's result of 68 g/L is within the optimal range and identical to baseline, confirming adequate protein synthesis by the liver and a healthy balance between albumin and globulins.","low_causes":"Malnutrition, liver disease, kidney disease (nephrotic syndrome), malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"68","baseline_date":"2026-09-04"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6042","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and drugs, and serves as a marker of liver synthetic function and nutritional status. Daniel's result of 43 g/L is within the optimal range, up from 41 at baseline. This confirms healthy liver function and adequate nutrition.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation, burns","high_causes":"Dehydration","padding ","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.6","baseline_date":"2026-09-04"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"345","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5264","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5224","upper_optimal_position":"0.6609","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and the methylation cycle that recycles homocysteine. Daniel's result of 345 pg/ml is within the lab range of 193 to 982 but below the optimal threshold of 500, and up from 283 at baseline. In the context of his elevated homocysteine at 20, this suboptimal B12 is a plausible contributing factor. Supplementation with sublingual methylcobalamin, the active form of B12, is recommended to bring B12 above 500 and support the reduction of homocysteine.","low_causes":"Poor dietary intake (especially in vegetarians/vegans), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"283","baseline_date":"2026-09-04"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, works alongside B12 to support DNA synthesis, red blood cell production, and the methylation cycle. Daniel's result of 12 ng/ml is within the optimal range, up from 11 at baseline fraction that removes excess cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. Daniel's result of 1.8 mmol/L is within the optimal range for a man (above 1.4), up from 1.7 at baseline. This is an excellent level and provides meaningful cardiovascular protection.","low_causes":"Sedentary lifestyle, obesity, smoking, insulin resistance, poor diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper","baseline_result":"1.7","baseline_date":"2026-09-04"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0883","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL cholesterol is the primary carrier of cholesterol to the tissues and, when elevated, deposits it into artery walls, driving atherosclerosis. Daniel's result of 0.53 mmol/L is exceptionally low, down from 1.09 at baseline. The statin is doing an outstanding job of reducing LDL. When adjusted for the cholesterol carried by his Lp(a) particles, his Lp(a)-corrected LDL is effectively zero, meaning all modifiable LDL has been addressed.","low_causes":"Statin therapy, low saturated fat diet, hyperthyroidism, malabsorption","high_causes":"Genetics, high saturated fat diet, obesity, hypothyroidism, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.09","baseline_date":"2026-09-04"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol to give a summary measure of lipid balance. Lower is better. Daniel's result of 1.5 is excellent, below the desirable limit of 4.5 and improved from 1.82 at baseline, driven by both a lower total cholesterol and a higher HDL.","low_causes":"High HDL, low total cholesterol, statin therapy","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.82","baseline_date":"2026-09-04"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic cholesterol fractions (LDL, VLDL, and remnant cholesterol) in one number. Daniel's result of 0.9 mmol/L is excellent, well below the desirable limit of 4, and down from 1.4 at baseline.","low_causes":"Statin therapy, low saturated fat diet, good metabolic health","high_causes":"Genetics, high saturated fat diet, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.4","baseline_date":"2026-09-04"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and is a marker of the protective lipoprotein fraction. Higher levels indicate more HDL particles available for reverse cholesterol transport. Daniel's result of 1.7 g/L is within the optimal range (above 1.4), up from 1.4 at baseline, a notable improvement that parallels his HDL rise.","low_causes":"Sedentary lifestyle, obesity, smoking, insulin resistance, genetic factors","high_causes":"Exercise, moderate alcohol, oestrogen, genetics","padding":"1","one_sided":"0.5","range_type":"no upper","baseline_result":"1.4","baseline_date":"2026-09-04"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein that sits on every LDL, VLDL, and Lp(a) particle, making it the single best measure of how many atherogenic particles are in the blood. Each harmful particle carries exactly one ApoB molecule, so the ApoB count is effectively a particle count. Daniel's result of 0.39 g/L is outstandingly low, well below the desirable limit of 0.9 and the optimal limit of 0.8, and up only marginally from 0.32 at baseline. This confirms that the number of potentially harmful particles is exceptionally well controlled.","low_causes":"Statin therapy, low saturated fat diet, hyperthyroidism, malabsorption","high_causes":"Genetics (familial hypercholesterolaemia), high saturated fat diet, insulin resistance, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.32","baseline_date":"2026-09-04"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.229","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1636","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB/A1 ratio compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1) and is considered one of the best single predictors of cardiovascular risk from lipids. Lower is better. Daniel's result of 0.23 is excellent, well below the lower risk threshold of 0.7, and essentially unchanged from 0.23 at baseline. This is an outstanding lipid risk profile.","low_causes":"High HDL, low LDL, statin therapy, good metabolic health","high_causes":"High LDL, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.23","baseline_date":"2026-09-04"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"166.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"2.5997","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), commonly written as Lp(a), is a genetically inherited lipoprotein particle structurally similar to LDL but carrying an additional protein called apolipoprotein(a). It contributes to cardiovascular risk through three mechanisms: depositing cholesterol into artery walls, promoting blood clot formation by interfering with the body's natural clot-dissolving process (fibrinolysis), and driving localised inflammation. Because it is genetically determined, Lp(a) does not change with diet, exercise, or standard medications, and it remains essentially fixed for life. Daniel's result of 166.37 nmol/L places him in the moderate-risk category (90 to 200), essentially unchanged from 156.46 at baseline. This should remain permanently in his medical notes, and first-degree relatives should have their own Lp(a) tested.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), cannot be modified by diet, exercise, or standard medications","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"156.46","baseline_date":"2026-09-04"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3976","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"CK is an enzyme released from muscle cells when they are damaged or stressed, including during normal exercise. It is also monitored in people taking statins, as statins can occasionally cause muscle breakdown. Daniel's result of 94 U/L is within the optimal range and down from 122 at baseline. This confirms that his statin is not causing significant muscle stress, which is reassuring given his training programme.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin-induced myopathy, rhabdomyolysis, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"122","baseline_date":"2026-09-04"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5225","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"FT4 is the storage form of thyroid hormone that circulates in the blood and is converted into the active form FT3 at the tissue level. Daniel's result of 17.8 pmol/L is within the optimal range of 14 to 20, marginally down from 18.6 at baseline but still in a healthy position.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, medications","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"18.6","baseline_date":"2026-09-04"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4115","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.4746","units":"mIU/L","description":"TSH is the hormone released by the pituitary gland to signal the thyroid to produce more thyroid hormone. A high TSH suggests the thyroid is underperforming and the pituitary is having to push harder; a low TSH suggests the thyroid is overproducing. Daniel's result of 1.8 mIU/L is within the optimal range of 1.0 to 2.5, essentially identical to 1.87 at baseline. This confirms that the pituitary is satisfied with thyroid output.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroiditis, pituitary tumour (rare)","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.87","baseline_date":"2026-09-04"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3 is the active thyroid hormone that cells use directly to regulate me 667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333"},{"name":"RDW (Red Cell Distribution Width)","group":"HEMATOLOGY","result":"14.6","units":"%","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","within_normal":"TRUE","within_optimal":"FALSE","description":"RDW measures the variation in size among circulating red blood cells. A high RDW means the cells are inconsistent in size, which can reflect a nutritional deficiency or early mixed anaemia. At 14.6, Daniel's RDW is within the laboratory range but sits in the upper portion of it, outside the tighter optimal band of 11.5 to 13.5. This is a mild finding. His B12, folate, and iron studies are all adequate, so there is no single obvious driver. The mildly suboptimal B12 of 345 is the most plausible contributor, and improving B12 status with methylcobalamin supplementation is likely to help this over time. It is also one of the nine inputs to PhenoAge, and bringing it down would have a small favourable effect on that score.","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, haemolysis, chronic disease","low_causes":"Not clinically relevant","range_type":"normal","result_position":"0.6286","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238"},{"name":"MCV (Mean Corpuscular Volume)","group":"HEMATOLOGY","result":"86.7","units":"fL","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","within_normal":"TRUE","within_optimal":"TRUE","description":"MCV is the average size of a red blood cell. Cells that are too small suggest iron deficiency; cells that are too large suggest B12 or folate deficiency. At 86.7, Daniel's red cells are a healthy, normal size and sit within the optimal band. This is reassuring alongside his iron and B vitamin results and confirms there is no developing nutritional anaemia.","high_causes":"B12 or folate defi
