const REPORT_DATA = {"patient_name":"Casper Lewis","dob":"31/10/2001","report_date":"2026-09-10","summary":"Casper is a 24-year-old female presenting with a BMI of 30.1, following a standard mixed diet rated 5 out of 10 for quality with a volume of 4 out of 10. She does not currently perform any structured cardio or resistance training, and walks between 2,000 and 5,000 steps per day. She takes 90mg duloxetine daily, 80 to 160mg propranolol daily, occasional pregabalin, and occasional common painkillers including paracetamol, ibuprofen and naproxen for a spine injury. She supplements with iron and a B-complex vitamin. She reports sleeping less than six hours most nights and using painkillers frequently. She reports low energy and fatigue, brain fog, and weight gain with difficulty losing weight. She has a diagnosis of either ME/CFS or fibromyalgia, with her GPs uncertain which is correct, and an undiagnosed cardiac issue causing tachycardia and palpitations managed by propranolol. She has previously tried sertraline, fluoxetine, citalopram, mirtazapine and amitriptyline without benefit, and while duloxetine has helped somewhat with fatigue it has not improved her mood. She has had thyroid disease and rheumatoid arthritis ruled out previously, and a prior test showed elevated androgens that were not treated. Her goals are to improve energy levels, improve mood, and balance hormones. She is particularly concerned that her diagnosis may be incorrect and that an autoimmune condition may have been missed.\n\nThe most clinically significant finding in this report is a clear pattern of iron deficiency. Her serum iron is 8.4, below the lower limit of 9. Her transferrin saturation, which measures what proportion of the body's iron-carrying capacity is actually loaded with iron, is 11.86%, well below the lower limit of 18%. Her ferritin, which measures the body's stored iron reserves, sits at 15, technically within the laboratory range of 10 to 291 but functionally depleted for a woman of 24 with fatigue as her dominant symptom. Ferritin below 30 is widely recognised as a level at which symptoms of deficiency, particularly fatigue, brain fog, exercise intolerance and low mood, become likely, and many guidelines now use 30 as the threshold for treatment. Her red cell distribution width (RDW) of 15.4%, above the upper limit of 14%, and her mean corpuscular volume (MCV) of 80.3, below the lower limit of 83, together tell the same story: her bone marrow is producing smaller-than-normal red cells and cells of uneven sizes, which is the hallmark of iron-restricted red cell production. Her red blood cell count is actually elevated at 5.03 against an upper limit of 4.8, which is the body's compensatory response to this. When each red cell carries less oxygen because it is smaller and less well filled with haemoglobin, the body produces more of them to compensate, and this is exactly what is happening here. Her haemoglobin is holding at 140, which is healthy, but it is being maintained by sheer numbers of red cells rather than by well-built individual cells. This is the stage before anaemia develops rather than established anaemia, but it is already enough to contribute meaningfully to her fatigue, brain fog and low mood. This finding is important for several reasons. Iron deficiency is a treatable cause of fatigue that can mimic or worsen the symptoms of ME/CFS and fibromyalgia. It may not be the whole explanation for how she feels, but correcting it could make a significant difference to her energy, cognition and mood. Her GP should be aware of this pattern, and a therapeutic iron replacement plan should be discussed, ideally with a repeat ferritin, iron studies and full blood count in 10 to 12 weeks to confirm improvement. Her current iron supplement may not be adequate in dose or form, and her frequent use of ibuprofen and naproxen is relevant because NSAIDs can cause microscopic gastrointestinal blood loss that quietly drains iron stores over time.\n\nHer HOMA-IR, which estimates how hard insulin has to work to control blood sugar, is 2.11 against an upper limit of 1.5. The lab note places this in the early insulin resistance category, which begins at 1.9. Her fasting glucose at 4.5 and HbA1c at 30 mmol/mol are both excellent, so blood sugar control itself is not yet affected, but the insulin level of 10.54 suggests the pancreas is working harder than it should need to in order to maintain that control. At a BMI of 30.1, with no structured exercise, a diet volume of only 4 out of 10 and sleep restricted to under six hours most nights, there are clear and modifiable explanations. Sleep restriction alone is strongly associated with increased insulin resistance, and the combination of low activity, moderate BMI and poor sleep creates a metabolic environment where insulin has to push harder. The encouraging aspect is that every one of these drivers is changeable, and HOMA-IR responds well to even modest increases in daily movement, sleep duration and diet quality. This does not require dramatic changes. Adding a 20-minute walk after meals, extending sleep by even 45 minutes and increasing her diet volume with protein and fibre-rich foods could shift this number meaningfully within three to six months.\n\nHer lipid profile shows a pattern that needs careful interpretation because of her very high lipoprotein(a). Her LDL cholesterol, the form that deposits in artery walls, is 3.11 against a target of below 3.0, and her apolipoprotein B (ApoB), which counts the actual number of cholesterol-carrying particles in the blood, is 0.91 against a target of below 0.9. Her ApoB to ApoA-I ratio, which is the single best lipid ratio for cardiovascular risk, is 0.75, which falls in the average risk category between 0.6 and 0.8. Taken alone, these would be only marginally above target and easily addressed through diet and lifestyle. However, her lipoprotein(a), usually written Lp(a), is 182.32 nmol/L against a target of below 32. This is a moderately high result and it changes the context significantly. Lp(a) is entirely genetically determined. It does not change with diet, exercise, weight loss or any lifestyle intervention. It is set at birth and remains essentially constant throughout life. Lp(a) particles carry cholesterol in the same way LDL does, but they also promote clotting and inflammation in artery walls, which means they are particularly damaging. A significant portion of her measured LDL and ApoB is likely being contributed by Lp(a) rather than by conventional LDL, which means that her lifestyle-modifiable LDL is probably lower than the headline number suggests. This is an important finding for her permanent medical record. It means that her cardiovascular risk is being driven partly by a genetic factor that she cannot change, and it means that keeping her modifiable risk factors, blood pressure, weight, blood sugar, smoking status and conventional LDL, as optimal as possible becomes more important rather than less. Her GP should be made aware of this result, and first-degree relatives, parents and siblings, should be offered Lp(a) testing because this trait is inherited. On the positive side of her lipids, her triglycerides are excellent at 0.67, her HDL at 1.4 is in a reasonable place, and her VLDL at 0.3 is low. These reflect the fact that her metabolic handling of dietary fat is working well despite the insulin resistance signal.\n\nHer testosterone is 2.7 nmol/L, above the female upper limit of 2.6, and her free androgen index (FAI), which measures how much testosterone is biologically active rather than bound up by carrier proteins, is 7.42 against an upper limit of 6.5. Her SHBG, the carrier protein sex hormone binding globulin that determines how much testosterone is free to act on tissues, is 36.4, which is within the laboratory range of 27.8 to 146 but sitting in the lower quarter. Lower SHBG means more testosterone is free and active. She mentions that a prior test also showed elevated androgens, and the fact that this pattern persists makes it worth investigating. In a 24-year-old woman with elevated androgens, difficulty losing weight and a BMI of 30, the pattern raises the possibility of polycystic ovary syndrome (PCOS), a hormonal condition in which the ovaries produce excess androgens. PCOS is also associated with insulin resistance, and the HOMA-IR of 2.11 is consistent with this. Her oestradiol at 580 and progesterone at 17.09 suggest she was in the luteal phase of her cycle at the time of sampling, and her LH and FSH are within luteal ranges, so the reproductive hormones themselves are cycling. However, PCOS can exist alongside normal cycling, and the combination of persistent androgen elevation plus insulin resistance plus difficulty losing weight plus BMI of 30 is a pattern that her GP should evaluate. A pelvic ultrasound and a formal PCOS assessment using the Rotterdam criteria would be the usual next steps. If confirmed, PCOS would also provide a unifying explanation for the weight resistance she describes, and targeted management including addressing insulin resistance could help with both the hormonal and the metabolic picture.\n\nHer IgE, which is the immunoglobulin most associated with allergic responses, is 213 against an upper limit of 100. This is more than double the reference ceiling. IgE elevation at this level suggests an active allergic process, and in someone reporting joint pain, fatigue and brain fog, it is worth exploring. Common causes include environmental allergies such as dust mites, moulds, animal dander or pollen, food sensitivities, eczema or allergic asthma. It can also be raised in parasitic infections, though this is less common in the UK. She previously had elevated eosinophils, and eosinophils are the white cells that work most closely with IgE in allergic and parasitic responses, so the two findings are connected. Her eosinophils in this blood test are 0.34, which is within the laboratory range of 0.02 to 0.5, sitting in the upper half but not flagged. The elevated IgE alongside a history of raised eosinophils suggests that allergic activation has been present for some time. This is worth discussing with her GP, and referral for allergy testing, either skin prick or specific IgE panels, could identify a trigger that may be contributing to her inflammatory burden and potentially to some of her symptoms.\n\nHer ESR, the erythrocyte sedimentation rate, is 19 against an upper limit of 12. ESR measures how quickly red blood cells settle in a tube over an hour, and it rises when inflammation is present. Her hs-CRP, a more specific inflammation marker, is 1.7, which is within the laboratory range of below 5 but above the optimal threshold of below 1.0. Together these suggest a low-grade inflammatory state. In someone with chronic pain, fatigue and joint stiffness, a mildly elevated ESR is not unexpected, and several factors could be contributing: the iron deficiency itself (iron-deficient red cells change shape and settle differently), the allergic activation shown by the IgE, the BMI of 30, the chronic pain condition, or the frequent NSAID use which paradoxically can indicate ongoing tissue inflammation. The ESR is not high enough to suggest a serious inflammatory or autoimmune disease process, and importantly, her rheumatoid factor is negative at less than 4, her tissue transglutaminase IgA is negative ruling out coeliac disease, her immunoglobulins IgG, IgM and IgA are all within normal ranges, and her thyroid antibodies are both negative. These results are genuinely reassuring in the context of her concern that an autoimmune condition may have been missed. They do not completely exclude every autoimmune possibility, but the major ones, rheumatoid arthritis, coeliac disease, autoimmune thyroid disease, have been convincingly ruled out. If her GP wanted to be thorough, an antinuclear antibody (ANA) test could be considered to screen for connective tissue diseases such as lupus, which can present with fatigue, joint pain and brain fog in young women, but the overall picture here does not strongly suggest it.\n\nTurning to the reassuring findings, and there are many. Her thyroid is working well. TSH at 1.17 is in the optimal zone between 1.0 and 2.5, free T4 at 15.6 is within the ideal range, free T3 at 4.7 is within the optimal range, and both thyroid antibody tests are negative. This comprehensively rules out thyroid disease as a contributor to her symptoms, which is valuable information. Her liver is in excellent health. ALT at 14 and GGT at 22 are both well within range, her FIB-4 fibrosis score is 0.49 which is very low, and her bilirubin, albumin, total protein, ALP, AST, amylase and lipase are all healthy. This is particularly reassuring given the number of medications she takes, because it shows the liver is handling them without strain. Her kidney function is good, with a Cystatin C-derived eGFR of 100 and creatinine of 59, both appropriate for her age. Her cortisol at 208 is within the morning reference range, her prolactin is normal, and her DHEA-S at 7.6 is within range. Her calcium, phosphate and parathyroid hormone are all healthy. Her vitamin D at 84 is sufficient and within the optimal range of 75 to 120, which is a positive finding especially at a BMI of 30 where fat tissue tends to sequester vitamin D. Her B12 at 362 is within the laboratory range, likely supported by her B-complex supplement, though it sits below the optimal threshold of 500. Her folate at 13 is healthy. Her platelets, white cell count, neutrophils, lymphocytes, monocytes and reticulocyte percentage are all normal. Her tumour markers CA-125, CA 15-3, CA 19-9 and CEA are all within range. Her urinalysis shows negative protein, glucose, ketones, nitrites, no casts and no bacterial growth, with red blood cells below 1. Her urine white cells at 30 are above the significance threshold of 10, but in the absence of nitrites, bacteria, symptoms or positive culture, this is most likely a contaminant finding and is not clinically concerning.\n\nHer MCHC at 346 is marginally above the upper limit of 345, which at a margin of one unit is within the range of laboratory variation and not a concern in itself, though it is consistent with the broader iron-deficiency picture affecting red cell characteristics. Her magnesium at 0.77 is within the laboratory range but below the optimal band of 0.85 to 1.05, and given her sleep difficulties, pain and fatigue, optimising magnesium through supplementation could offer a modest benefit.","links":"The single most impactful change from this report would be correcting Casper's iron deficiency properly, because iron is the thread that runs through her most troublesome symptoms. Her current iron supplement should be reviewed with her GP. Ferrous bisglycinate at 25mg taken every other day with a source of vitamin C, such as a small glass of orange juice, is better absorbed and better tolerated than daily ferrous sulphate, and the every-other-day dosing has been shown in research to improve absorption. She should avoid taking iron within two hours of her duloxetine, and should avoid taking it with tea, coffee or dairy which inhibit absorption. Her GP should repeat her ferritin, full iron studies, full blood count and reticulocytes in 10 to 12 weeks to confirm that stores are rising and the red cell indices are normalising. The target ferritin should be at least 50, ideally above 70. If oral supplementation does not raise her ferritin adequately, an intravenous iron infusion may be appropriate, and this is something her GP can arrange.\n\nHer frequent use of ibuprofen and naproxen is worth discussing with her GP in the context of her iron status. NSAIDs can cause microscopic bleeding from the stomach lining, and in someone who is already iron-depleted, even small ongoing losses make it harder for supplements to catch up. If her pain management allows, reducing NSAID frequency or using paracetamol preferentially where adequate, and discussing gastroprotection such as omeprazole if NSAIDs remain necessary, would support her iron recovery.\n\nFor the insulin resistance signal, the most effective interventions are sleep, movement and diet composition, in roughly that order of impact. Sleep restriction below six hours is one of the strongest modifiable drivers of insulin resistance, and extending her sleep even modestly, aiming for seven hours initially, could improve insulin sensitivity within weeks. Practical steps include setting a fixed wake time seven days a week, getting outside within an hour of waking to anchor her circadian rhythm, cutting caffeine after midday, keeping her bedroom cool and dark, and if her propranolol dose allows flexibility, discussing with her prescriber whether the timing of her dose could support sleep. Propranolol suppresses melatonin production, and taking it earlier in the day rather than at bedtime may help, but this must be discussed with her prescribing doctor rather than changed independently.\n\nFor movement, she does not need to begin an exercise programme. Walking is the most evidence-based intervention for insulin resistance, and increasing her daily steps from the current 2,000 to 5,000 range toward 5,000 to 7,000 gradually would be meaningful. A 10 to 15-minute walk after her main meal of the day specifically blunts the post-meal glucose spike and reduces insulin demand. If her fatigue and pain allow it, even one session of light resistance work per week, bodyweight exercises at home, would begin to build the muscle mass that acts as a glucose sink.\n\nFor her diet, increasing volume from 4 to 6 out of 10 is important, particularly protein. At 66kg, she should aim for 85 to 105 grams of protein per day, which supports muscle maintenance, satiety and blood sugar stability. Her maintenance calories at her current activity level are approximately 1,700 to 1,800 per day. She should not restrict below 1,500, as undereating with chronic fatigue will worsen energy, mood and metabolic function. Prioritising protein at every meal, adding fibrous vegetables and reducing ultra-processed foods would improve both diet quality and the insulin resistance signal without requiring calorie counting. Soluble fibre from oats, beans, lentils and root vegetables specifically helps lower LDL cholesterol and slows glucose absorption.\n\nFor the lipid findings, her LDL and ApoB are only marginally above target, and some of the elevation is being contributed by her Lp(a) which cannot be changed. The dietary changes above, increasing soluble fibre, adding oily fish once or twice per week (salmon, mackerel, sardines), and modestly reducing saturated fat from processed and fried foods, would address the modifiable component. Her GP should record the Lp(a) of 182 permanently and ensure it is factored into any future cardiovascular risk assessment. Standard risk calculators like QRISK do not account for Lp(a), so her true risk is higher than the calculator suggests. First-degree relatives should be offered Lp(a) testing.\n\nFor the elevated androgens and the question of PCOS, her GP should be made aware that testosterone remains elevated on repeat testing and that her free androgen index is above range, alongside early insulin resistance and difficulty losing weight. A pelvic ultrasound and formal assessment against the Rotterdam criteria for PCOS would be the appropriate next steps. If PCOS is confirmed, management of the insulin resistance through the lifestyle measures above becomes even more important, as insulin resistance drives ovarian androgen production.\n\nFor the elevated IgE, her GP could arrange allergy testing, either skin prick testing or a specific IgE panel to common environmental and food allergens. Identifying and reducing exposure to a trigger allergen could reduce her inflammatory burden and potentially improve some of her symptoms.\n\nFor her B12, although it is within the laboratory range at 362, it sits below the optimal threshold of 500 where neurological symptoms including brain fog and fatigue can occur. Her B-complex supplement is helping but may not contain enough B12 in the right form. Switching to or adding a sublingual methylcobalamin at 1,000 mcg daily would be more effective than the B12 in a standard B-complex tablet, as sublingual delivery bypasses the gut.\n\nHer vitamin D at 84 is in a good place. Maintaining this with 2,000 IU of vitamin D3 daily through the autumn and winter months, taken with a meal containing fat, alongside 100 mcg of vitamin K2 as MK-7, would prevent the seasonal decline that is common in the UK and particularly common at higher BMIs.\n\nThe numbers Casper should bring to her GP are: ferritin 15 with transferrin saturation 11.86% and serum iron 8.4, indicating iron deficiency; HOMA-IR 2.11, indicating early insulin resistance; testosterone 2.7 and free androgen index 7.42, both above range, with a history of prior androgen elevation; Lp(a) 182.32 for permanent recording; IgE 213, more than double the upper limit; and ESR 19, mildly elevated. She should mention that rheumatoid factor, thyroid antibodies and coeliac screen are all negative in this report, confirming the prior exclusions of those conditions.","flags":"IRON DEFICIENCY PATTERN: Serum iron 8.4 (range 9 to 30.4), transferrin saturation 11.86% (range 18 to 55%), ferritin 15 (functionally depleted, target above 50). RDW 15.4% (range 11.6 to 14%), MCV 80.3 (range 83 to 101), RBC 5.03 (range 3.8 to 4.8) reflecting compensatory erythropoiesis with microcytic, anisocytic indices. Pre-anaemic iron deficiency with clear symptom correlation. Review iron supplementation adequacy, consider IV iron if oral fails. Repeat in 10 to 12 weeks. Frequent NSAID use may be contributing to ongoing iron loss.\n\nINSULIN RESISTANCE: HOMA-IR 2.11 (range 0.5 to 1.5). Fasting glucose 4.5 and HbA1c 30 are normal, indicating compensated insulin resistance. Contributing factors include BMI 30.1, sedentary lifestyle, chronic sleep restriction. Lifestyle intervention is first line.\n\nLIPOPROTEIN(a) ELEVATED: Lp(a) 182.32 nmol/L (target below 32). Genetically determined, not modifiable. Moderate risk category (90 to 200). Should be recorded permanently. First-degree relatives should be tested. Conventional risk calculators will underestimate her cardiovascular risk.\n\nLDL AND APOB MARGINALLY ELEVATED: LDL 3.11 (target below 3.0), ApoB 0.91 (target below 0.9), ApoB/A-I ratio 0.75 (target below 0.6, average risk 0.6 to 0.8). Some LDL/ApoB elevation is contributed by Lp(a). Dietary optimisation for modifiable component.\n\nELEVATED ANDROGENS: Testosterone 2.7 nmol/L (range 0.5 to 2.6), free androgen index 7.42 (range 0.5 to 6.5), with prior history of elevated androgens. SHBG 36.4 in the lower quarter of range. In combination with insulin resistance, BMI 30 and difficulty losing weight, PCOS should be formally assessed (pelvic ultrasound, Rotterdam criteria).\n\nIgE ELEVATED: 213 IU/ml (range below 100). More than double the upper limit. History of prior eosinophil elevation. Suggests ongoing allergic activation. Consider allergy testing to identify trigger.\n\nESR MILDLY ELEVATED: 19 mm/hour (range below 12). hs-CRP 1.7 (range below 5, optimal below 1.0). Low-grade inflammation. Multiple potential contributors: iron deficiency, allergic activation, BMI, chronic pain, NSAID use.\n\nURINE WBC 30: Above significance threshold of 10, but nitrites negative, culture shows no growth, no urinary symptoms. Most likely incidental finding. No action required unless symptoms develop.\n\nMCHC 346 (range 315 to 345): Marginal elevation of 1 unit. Consistent with iron-deficiency red cell changes. Not independently significant.\n\nReassuring negatives: Rheumatoid factor negative. Thyroid antibodies (TPO and thyroglobulin) both negative. Tissue transglutaminase IgA negative, excluding coeliac disease. Thyroid function normal (TSH 1.17, FT4 15.6, FT3 4.7). Liver function entirely normal despite polypharmacy. Kidney function normal (Cystatin C eGFR 100). Tumour markers CA-125, CA 15-3, CA 19-9 and CEA all within range. Immunoglobulins IgG, IgM and IgA all normal. Cortisol within morning range. Glucose and HbA1c normal.","recommendations":"1. Discuss iron deficiency with GP urgently. Current supplementation is not keeping up with demand. Review dose and form, consider ferrous bisglycinate 25mg every other day with vitamin C. If ferritin does not reach 50 within 12 weeks, discuss intravenous iron. Repeat ferritin, iron studies, FBC and reticulocytes in 10 to 12 weeks.\n\n2. Discuss NSAID use with GP in context of iron depletion. Consider reducing frequency where pain allows, or adding gastroprotection if continued use is necessary.\n\n3. Request formal PCOS assessment from GP, including pelvic ultrasound and Rotterdam criteria evaluation, given persistent androgen elevation, insulin resistance and difficulty losing weight.\n\n4. Record Lp(a) of 182.32 nmol/L permanently in medical notes. Offer Lp(a) testing to parents and siblings.\n\n5. Request allergy testing through GP to investigate the elevated IgE and history of raised eosinophils.\n\n6. Prioritise sleep extension toward seven hours. Set a fixed wake time, get daylight exposure within an hour of waking, cut caffeine after midday, and discuss propranolol timing with prescriber in relation to melatonin suppression.\n\n7. Increase daily steps gradually toward 5,000 to 7,000. Add a 10 to 15-minute walk after the main meal of the day.\n\n8. Increase dietary protein to 85 to 105 grams per day. Increase overall diet volume from 4 to at least 6 out of 10. Do not restrict calories below 1,500. Add soluble fibre sources and oily fish once or twice per week.\n\n9. Begin sublingual methylcobalamin 1,000 mcg daily to bring B12 above 500.\n\n10. Begin magnesium glycinate 300mg before bed to support sleep, pain and bring levels into the optimal range.\n\n11. Maintain vitamin D with 2,000 IU D3 daily through autumn and winter, with 100 mcg vitamin K2 MK-7.\n\n12. Retest in six months: full iron studies, FBC, HOMA-IR (fasting glucose and insulin), lipid profile including ApoB, testosterone, FAI, IgE, ESR, hs-CRP, B12 and vitamin D.","supplementation":"Iron as ferrous bisglycinate, 25mg every other day, taken with a small glass of orange juice or another vitamin C source to enhance absorption. Take on an empty stomach or with a light meal, at least two hours away from duloxetine, tea, coffee and dairy. This is the priority supplement from this report. Her current iron supplement may be ferrous sulphate, which is less well absorbed and causes more gastrointestinal side effects. Every-other-day dosing has been shown to improve the percentage of iron absorbed compared to daily dosing. If she notices significant stomach upset, taking it with food is acceptable despite slightly reduced absorption. Her GP should be involved in monitoring progress.\n\nSublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue ideally in the morning. Sublingual delivery is more effective than the oral B12 in her current B-complex because it is absorbed directly through the mucous membranes and bypasses the gut. Her B12 at 362 is within the laboratory range but below the optimal level of 500 where neurological symptoms including brain fog and fatigue are less likely. She can continue her B-complex alongside this for the other B vitamins it provides.\n\nMagnesium glycinate, 300mg elemental magnesium, taken before bed. Glycinate is the form best suited to sleep support and is gentle on the stomach. Her magnesium at 0.77 is below the optimal band of 0.85 to 1.05, and magnesium supports muscle relaxation, sleep quality, pain modulation and insulin sensitivity, all of which are relevant to her situation.\n\nVitamin D3 as cholecalciferol, 2,000 IU daily, taken with her largest meal to ensure it is absorbed with dietary fat. Her level of 84 is within the optimal range, and this dose is a maintenance dose to prevent the seasonal decline through autumn and winter. At a BMI of 30, fat tissue sequesters vitamin D, so she needs a slightly higher maintenance dose than a leaner person would.\n\nVitamin K2 as MK-7, 100 mcg daily, taken with the vitamin D. K2 directs calcium into bones and teeth and away from soft tissues and arteries. It should always accompany vitamin D supplementation.\n\nOmega-3 fish oil providing 2g of combined EPA and DHA daily, taken with food. This supports cardiovascular health in the context of her elevated Lp(a) and marginally elevated LDL, and has anti-inflammatory properties that may modestly help with her joint pain and the low-grade inflammation shown by her ESR and CRP.\n\nThe most important changes from this report are not supplements. They are correcting the iron deficiency with GP involvement and monitoring, extending sleep toward seven hours per night, gradually increasing daily movement, increasing dietary protein and overall food volume, and investigating the persistent androgen elevation and the elevated IgE with her GP.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5333","upper_optimal_position":"0.6093","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after a period without eating. At 4.5, Casper's glucose is within the optimal range of 4.0 to 5.4, indicating that her body is maintaining healthy blood sugar levels. This is a reassuring result and shows that despite the early insulin resistance signal from her HOMA-IR, her blood sugar control itself has not yet been affected.","low_causes":"Excess insulin, prolonged fasting, intense exercise, certain medications","high_causes":"Insulin resistance, prediabetes, diabetes, stress, infection, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.45","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the past two to three months. At 4.9%, Casper's result is well within the normal range and below the pre-diabetes threshold of 6.0%. This confirms that her blood sugar has been well controlled over recent months.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Prediabetes, diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. At 30 mmol/mol, this is comfortably below the normal threshold of 42 and below the optimal threshold of 36. This confirms excellent long-term blood sugar control.","low_causes":"Anaemia, blood loss, haemolysis","high_causes":"Prediabetes, diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"10.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5475","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to control blood sugar. At 10.54, Casper's level is within the laboratory range of 2.6 to 24.9 but above the optimal range of 2 to 8. When insulin is higher than optimal alongside a normal glucose, it suggests the body is having to produce more insulin than ideal to keep blood sugar in check, which is an early sign of insulin resistance. This is reflected in her elevated HOMA-IR score. Contributing factors in Casper's case include her BMI of 30.1, sedentary lifestyle and chronic sleep restriction.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, PCOS, sleep deprivation, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"605.73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4748","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5245","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, so it provides a reliable measure of how much insulin the body is producing. At 605.73 pmol/L (converted from 1.83 ug/L), Casper's result is within the laboratory range and indicates her pancreas is functioning normally. It is consistent with the insulin level and confirms that the elevated insulin is due to increased demand rather than a pancreatic abnormality.","low_causes":"Type 1 diabetes, low insulin production, fasting","high_causes":"Insulin resistance, type 2 diabetes, obesity, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8700","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated score that estimates how resistant the body's cells are to the effects of insulin. It is calculated from fasting glucose and fasting insulin. At 2.11, Casper's result is above the upper limit of 1.5 and falls into the early insulin resistance category, which the lab defines as above 1.9. This means her cells are not responding to insulin as efficiently as they should, forcing the pancreas to produce more. Her BMI of 30.1, sedentary lifestyle and chronic sleep restriction of under six hours are the most likely drivers. The encouraging news is that HOMA-IR is highly responsive to lifestyle changes, particularly sleep extension, increased daily movement and dietary improvements.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting","high_causes":"Obesity, sedentary lifestyle, sleep deprivation, PCOS, high carbohydrate diet, chronic stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"210.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6757","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates how well the beta cells of the pancreas are functioning by looking at the relationship between fasting insulin and fasting glucose. At 210.8, Casper's result is marginally above the upper reference of 200. In the context of insulin resistance, a slightly elevated HOMA-B simply means the pancreas is working harder than normal to compensate for the reduced insulin sensitivity of her cells. The pancreas is not failing; it is overworking. This is consistent with the early insulin resistance picture and would be expected to normalise as insulin sensitivity improves.","low_causes":"Pancreatic beta cell dysfunction, type 1 diabetes, late type 2 diabetes","high_causes":"Insulin resistance (compensatory), obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6587","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 75, Casper's result is within the optimal range, indicating healthy protein production by the liver and a normal immune protein contribution.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, nutrients and medications, and helps maintain fluid balance. At 42, Casper's albumin is within the optimal range, confirming healthy liver synthetic function.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. At 33, Casper's globulin is within the laboratory range but sitting in the upper quarter. This is consistent with some immune activation, which could relate to the allergic activity suggested by her elevated IgE.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, allergic conditions, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4190","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main types of protein in the blood. At 1.27, this is within the laboratory range of 1.1 to 2.5 but just below the optimal threshold of 1.3. The slightly lower ratio reflects the globulin being in the upper part of its range, which is consistent with the immune activation signals seen elsewhere in this report.","low_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver, bones and other tissues. At 68, this is well within range and indicates healthy liver and bone metabolism.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Liver disease, bile duct obstruction, bone disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 6, this is within the optimal range, indicating normal red cell turnover and healthy liver processing.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that is released into the blood when liver cells are damaged. At 14, this is well below both the laboratory upper limit and the optimal threshold of 25 for females. This indicates the liver is healthy and not under strain from her medications, which is particularly reassuring given the number of drugs she takes.","low_causes":"Not clinically significant","high_causes":"Liver disease, fatty liver, medication effects, alcohol, obesity, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. At 21, it is within the optimal range, confirming healthy liver function. AST is less liver-specific than ALT, but both being healthy together provides strong reassurance.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1690","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score estimates the degree of liver fibrosis (scarring) using a calculation based on age, ALT, AST and platelet count. At 0.49, this is very low and confidently rules out significant liver fibrosis. No further liver investigation is needed.","low_causes":"Not clinically significant, indicates healthy liver","high_causes":"Liver fibrosis, cirrhosis, age-related calculation artefact","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2895","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. At 22, this is within the optimal range of below 25 for females. Given that Casper takes several medications including duloxetine and propranolol, a clean GGT confirms the liver is processing these drugs without difficulty.","low_causes":"Not clinically significant","high_causes":"Alcohol, medications, fatty liver, bile duct disease, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. At 67, this is within the optimal range and indicates healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5248","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5887","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. At 45, it is within the optimal range and confirms healthy pancreatic function alongside the normal amylase.","low_causes":"Not clinically significant","high_causes":"Pancreatitis, gallbladder disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including HDL (protective), LDL (harmful) and VLDL. At 4.8, Casper's total cholesterol is below the desirable limit of 5.18. The total number is less informative than the breakdown into its components, which are detailed separately.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, hypothyroidism, genetics, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1971","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, largely influenced by recent diet, carbohydrate intake and metabolic health. At 0.67, Casper's triglycerides are well within the optimal range of below 1.0. This is an excellent result and shows healthy fat metabolism, which is a genuinely positive finding alongside the insulin resistance signal because it indicates the metabolic picture has not yet affected lipid handling.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar/carbohydrate diet, obesity, insulin resistance, alcohol, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1923","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to the tissues. At 0.3, this is well within range and consistent with her excellent triglyceride level.","low_causes":"Not clinically significant","high_causes":"High carbohydrate diet, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.6","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5080","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver. At 1.4, Casper's HDL is above the minimum desirable level of 1.04 but below the optimal threshold of 1.6 for females. HDL responds well to increased physical activity, and even modest increases in daily movement could raise it. The lab has flagged this as high, but in the context of female reference ranges, 1.4 is adequate rather than elevated.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol consumption, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5183","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6107","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol most associated with cardiovascular disease because it deposits cholesterol in artery walls. At 3.11, Casper's LDL is marginally above the upper limit of 3.0. However, a significant portion of her measured LDL is likely contributed by her genetically elevated Lp(a), which means the lifestyle-modifiable LDL component is probably lower than 3.11 suggests. Dietary changes including increased soluble fibre, oily fish and reduced saturated fat would help bring the modifiable component down.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, Lp(a) contribution","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3811","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The ratio of total cholesterol to HDL cholesterol gives a quick estimate of cardiovascular risk. At 3.43, this is within the desirable range of below 4.5 and within the optimal range. A lower ratio indicates a better balance between harmful and protective cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor cardiovascular risk profile","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3646","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5063","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL. At 29.17%, this is above the minimum desirable level of 20%, indicating a reasonable proportion of her cholesterol is the protective type.","low_causes":"Low HDL, elevated LDL or triglycerides","high_causes":"High HDL relative to total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4250","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol includes all the potentially harmful cholesterol fractions (LDL, VLDL and others) by subtracting HDL from total cholesterol. At 3.4, this is within the laboratory range of below 4.0 but above the optimal target of below 3.0. As with her LDL, part of this elevation is contributed by her genetically elevated Lp(a).","low_causes":"Low-fat diet, excellent metabolic health","high_causes":"Diet, genetics, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4321","lower_normal":"1.4","upper_normal":"100","lower_optimal":"1.5","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5036","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein component of HDL cholesterol and reflects the functional capacity of the protective cholesterol pathway. At 1.21, this is below the desirable threshold of 1.4. A lower ApoA1 means fewer HDL particles available to remove cholesterol from artery walls. This is consistent with her HDL being below the optimal level and is relevant in the context of her elevated ApoB, as the ApoB/A1 ratio is the best single predictor of cardiovascular risk. Increasing physical activity is the most effective way to raise ApoA1.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol intake, oestrogen, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle. It is now considered a more accurate measure of cardiovascular risk than LDL cholesterol because it counts the actual number of atherogenic particles rather than the cholesterol they carry. At 0.91, Casper's ApoB is marginally above the desirable threshold of 0.9. Importantly, each Lp(a) particle also carries one ApoB molecule, so her significantly elevated Lp(a) is contributing to the ApoB count. The truly modifiable ApoB (from conventional LDL) is likely below 0.9.","low_causes":"Low-fat diet, hyperthyroidism, excellent metabolic health","high_causes":"High saturated fat diet, genetics, obesity, insulin resistance, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is considered the single best lipid marker for cardiovascular risk. It compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1). At 0.75, Casper's ratio falls in the average risk category (0.6 to 0.8) for females. Ideally this would be below 0.6. Both increasing ApoA1 through exercise and reducing ApoB through dietary changes would improve this ratio.","low_causes":"Excellent cardiovascular risk profile","high_causes":"High LDL/ApoB, low HDL/ApoA1, poor metabolic health, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"182.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but also promotes blood clotting and artery wall inflammation. At 182.32, Casper's Lp(a) is significantly elevated, falling in the moderate risk category (90 to 200 nmol/L). Lp(a) levels are entirely inherited and cannot be changed by diet, exercise, weight loss or any currently available medication. This is a permanent finding that should be recorded in her medical notes. It means that a portion of her measured LDL and ApoB is being contributed by Lp(a) particles, and that her cardiovascular risk is higher than standard calculators would suggest. First-degree relatives (parents and siblings) should be offered Lp(a) testing because the trait is inherited. The practical implication is that keeping all modifiable cardiovascular risk factors, including blood pressure, weight, blood sugar, LDL and physical activity, as optimal as possible becomes especially important.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), not modifiable by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1600","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a useful marker for insulin resistance and metabolic health. At 0.48, this is well within the optimal range of below 0.87. A low ratio indicates healthy metabolic fat handling despite the insulin resistance signal seen in HOMA-IR, suggesting the metabolic picture has not yet progressed to affect lipid metabolism.","low_causes":"Excellent metabolic health, low triglycerides, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1813","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. At 0.29, this is well within the optimal range of below 0.5. Low remnant cholesterol is associated with lower cardiovascular and inflammatory risk.","low_causes":"Healthy lipid metabolism","high_causes":"Insulin resistance, metabolic syndrome, high triglycerides, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver. At 1.7, Casper's result is within the laboratory range of below 5 but above the optimal threshold of below 1.0. Values between 1 and 3 are associated with moderate cardiovascular risk and suggest low-grade systemic inflammation. In Casper's case, multiple factors could be contributing: her BMI of 30.1, chronic pain condition, iron deficiency, allergic activation shown by elevated IgE, and frequent NSAID use indicating ongoing tissue inflammation.","low_causes":"Excellent health, low inflammation","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7917","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle in a tube over one hour. A faster rate indicates more inflammation. At 19, Casper's ESR is above the upper limit of 12. ESR is a non-specific marker, meaning it rises with many types of inflammation, infection, autoimmune disease, tissue damage and even iron deficiency (iron-deficient red cells can alter sedimentation). The mild elevation here is consistent with her chronic pain condition and low-grade inflammatory state but is not high enough to suggest a serious acute inflammatory or autoimmune process.","low_causes":"Low inflammation, polycythaemia, sickle cell disease","high_causes":"Infection, chronic inflammation, autoimmune disease, anaemia, iron deficiency, malignancy, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"134","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4103","lower_
