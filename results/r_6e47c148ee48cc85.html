tter sleep.","low_causes":"Poor dietary intake, medications (PPIs, diuretics), alcohol, stress, chronic illness","high_causes":"Kidney disease, excess supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"303","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5333","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in certain foods and in the body's own cells. At 303, this is within the optimal range for females. Healthy uric acid levels reduce the risk of gout and kidney stones and are associated with lower cardiovascular risk.","low_causes":"Low purine diet, Wilson's disease, Fanconi syndrome","high_causes":"High purine diet, obesity, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3733","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.2","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. At 3.8, this is within the optimal range, indicating normal kidney filtration and adequate hydration.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4146","lower_normal":"49","upper_normal":"90","lower_optimal":"49","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. At 59, this is within the optimal range and appropriate for a 24-year-old female, indicating normal kidney function.","low_causes":"Low muscle mass, malnutrition","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) estimates how well the kidneys filter waste from the blood. Reported as greater than 90, this confirms healthy kidney function. The Cystatin C-derived eGFR of 100 provides a more precise measurement and confirms excellent renal performance at 24.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8333","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"This eGFR is calculated from Cystatin C, a protein produced at a constant rate by all cells. Unlike creatinine-based eGFR, it is not affected by muscle mass, making it a more reliable kidney function marker. At 100, this confirms excellent kidney function.","low_causes":"Kidney disease, chronic illness","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4591","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein used to estimate kidney function. At 1.01, this is within the laboratory range of below 1.1. While it is above the optimal threshold of 0.9, the derived eGFR of 100 confirms healthy kidney function, and the Cystatin C value at this level is not a concern.","low_causes":"Not clinically significant","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. At 140, Casper's haemoglobin is within the optimal range for females. This is a reassuring result because it shows that despite clear iron deficiency, the body is maintaining its haemoglobin level by producing extra red blood cells. However, this compensatory mechanism means the individual red cells are smaller and less well filled than they should be.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7100","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the number of red cells per litre of blood. At 5.03, Casper's count is above the female upper limit of 4.8. In the context of her blood results, this is a compensatory response to iron deficiency. When each red cell is smaller (low MCV) and carries less haemoglobin (borderline MCH), the bone marrow produces more cells to maintain the total oxygen-carrying capacity. This is the body's way of compensating before anaemia develops.","low_causes":"Iron deficiency (advanced), B12/folate deficiency, chronic disease, blood loss, bone marrow failure","high_causes":"Iron deficiency (compensatory), dehydration, polycythaemia, chronic hypoxia, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.404","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.404, this is within the optimal range, indicating appropriate blood viscosity and red cell volume.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"15.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8611","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6250","units":"%","description":"RDW measures the variation in size among red blood cells. A higher number means the cells are more uneven in size. At 15.4%, above the upper limit of 14%, this indicates anisocytosis, which means the red cells vary considerably in size. This is a classic finding in iron deficiency: as iron stores deplete, new red cells are made smaller while older, normally-sized cells remain in circulation, creating a mixed population of different sizes. The RDW is often the first blood count marker to become abnormal in developing iron deficiency.","low_causes":"Not clinically significant, indicates uniform cell size","high_causes":"Iron deficiency, B12/folate deficiency, mixed nutritional deficiency, chronic disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume","group":"HEMATOLOGY","result":"80.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2861","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"MCV measures the average size of red blood cells. At 80.3, below the lower limit of 83, this indicates microcytosis, meaning the red cells are smaller than normal. This is the hallmark of iron-deficient red cell production: without enough iron to build full-sized haemoglobin molecules, the bone marrow produces smaller cells. This finding, alongside the elevated RDW and low transferrin saturation, confirms that iron deficiency is actively affecting red cell production.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12/folate deficiency, alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin","group":"HEMATOLOGY","result":"27.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3867","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 27.8, this is just within the laboratory range of 27 to 32 but below the optimal threshold of 28. The borderline result is consistent with the developing iron deficiency pattern, where each red cell carries slightly less haemoglobin than ideal.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12/folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Corpuscular Haemoglobin Concentration","group":"HEMATOLOGY","result":"346","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6778","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the concentration of haemoglobin within each red blood cell. At 346, this is marginally above the upper limit of 345 by one unit. This marginal elevation is within the range of laboratory variation and can also be affected by sample temperature and storage. It is not independently significant.","low_causes":"Iron deficiency (advanced), thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, sample handling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"277","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3628","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are cell fragments that help blood clot. At 277, this is within the optimal range, indicating healthy platelet production and no signs of excessive clotting or bleeding risk.","low_causes":"Viral infection, medications, autoimmune conditions, liver disease, bone marrow disorders","high_causes":"Iron deficiency (reactive), infection, inflammation, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"7.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4111","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6111","units":"fL","description":"MPV measures the average size of platelets. At 7.8, this is within the optimal range. Smaller or larger platelets can indicate various conditions, but a normal MPV alongside a normal platelet count is reassuring.","low_causes":"Bone marrow suppression, aplastic anaemia, certain medications","high_causes":"Immune thrombocytopenia, myeloproliferative disorders, inflammation recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4613","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's front line. At 6.34, Casper's total white cell count is within the optimal range, indicating a normally functioning immune system.","low_causes":"Viral infection, medications, autoimmune conditions, bone marrow disorders, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, medications (steroids), smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4447","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 3.67, this is within the optimal range.","low_causes":"Viral infection, medications, autoimmune conditions, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"1","upper_normal":"3","lower_optimal":"1.3","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells involved in adaptive immunity, including fighting viral infections and producing antibodies. At 1.86, this is within the optimal range.","low_causes":"Viral infection (acute), medications (immunosuppressants), stress, malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4542","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and help coordinate the immune response. At 0.39, this is within the optimal range.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, chronic inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and fighting parasitic infections. At 0.34, this is within the laboratory range but sitting in the upper portion, above the optimal threshold of 0.3. Casper reports a prior test showing elevated eosinophils, and the current value, while technically within range, is consistent with the elevated IgE finding and suggests ongoing low-level allergic activation.","low_causes":"Stress (cortisol), Cushing's syndrome","high_causes":"Allergies, parasitic infections, asthma, eczema, drug reactions, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.07","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5417","units":"x10^9/L","description":"Basophils are the least common white blood cells and play a role in allergic and inflammatory responses. At 0.08, this is within the laboratory range but in the upper portion. Casper mentions a prior result showing elevated basophils. Combined with the elevated IgE and upper-range eosinophils, the basophil level is consistent with an allergic tendency.","low_causes":"Stress, acute allergic reactions (temporary drop), hyperthyroidism","high_causes":"Allergic conditions, chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage indicates how actively the marrow is producing new cells. At 1%, this is within the normal range.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss recovery, haemolysis, effective treatment of anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"50.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3393","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells in the blood. At 50.3, this sits right at the lower boundary of the laboratory range of 50 to 100. In the context of iron deficiency with a compensatory elevated red cell count, a reticulocyte count at the floor of the range suggests the bone marrow is producing red cells at its baseline capacity rather than mounting the accelerated response that might be expected. This may reflect that iron availability is limiting how quickly the marrow can produce new cells.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss recovery, haemolysis, treatment response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4900","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a calculated marker of systemic inflammation and immune balance. At 1.97, this is within the optimal range of 1.0 to 2.0. A healthy NLR suggests the immune system is balanced between its innate (neutrophil) and adaptive (lymphocyte) arms.","low_causes":"Not clinically significant in this range","high_causes":"Bacterial infection, physiological stress, systemic inflammation, chronic illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"11.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2277","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4225","upper_optimal_position":"0.6126","units":"%","description":"Transferrin saturation measures what proportion of the body's iron-transport capacity is actually loaded with iron. At 11.86%, this is well below the lower limit of 18% and far below the optimal range of 25 to 40%. This confirms that there is insufficient iron circulating in the blood to meet the body's needs. The transport protein transferrin has plenty of empty carrying capacity but not enough iron to fill it. This is one of the clearest markers of functional iron deficiency.","low_causes":"Iron deficiency, chronic disease, blood loss, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, iron overload, excessive supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"8.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3067","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3800","upper_optimal_position":"0.5800","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 8.4, this is below the lower limit of 9, confirming that circulating iron is depleted. Serum iron fluctuates throughout the day and with recent meals, but when it is low alongside a low transferrin saturation and low ferritin, it confirms a genuine deficit rather than a timing artefact.","low_causes":"Iron deficiency, chronic disease, blood loss, poor dietary intake, malabsorption, frequent NSAID use","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4128","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. At 2.82, this is within range. In iron deficiency, transferrin often rises as the body produces more transport protein to try to capture more iron. Casper's transferrin is not elevated, which may reflect the early-to-moderate stage of her deficiency or may be influenced by her chronic illness.","low_causes":"Chronic disease, inflammation, iron overload, malnutrition, liver disease","high_causes":"Iron deficiency (compensatory), pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"56.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"44","upper_normal":"76.1","lower_optimal":"44","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6143","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron. At 56.9, this is within range. A TIBC in the mid-range with low saturation confirms that the carrying capacity is available but not being filled due to insufficient iron supply.","low_causes":"Chronic disease, iron overload, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3511","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4401","upper_optimal_position":"0.6238","units":"ng/ml","description":"Ferritin measures the body's stored iron reserves. At 15, this is technically within the laboratory range of 10 to 291 but far below the optimal range of 40 to 150 for females and below the widely used clinical threshold of 30 at which symptoms of iron deficiency typically become apparent. Ferritin is the body's iron savings account, and at 15 that account is nearly empty. Symptoms of low ferritin include fatigue, brain fog, poor concentration, breathlessness on exertion, low mood, restless legs and poor exercise tolerance, many of which overlap with Casper's reported symptoms. Her current iron supplement is not maintaining adequate stores, and a review of the dose, form and timing is needed.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption, frequent NSAID use, heavy periods","high_causes":"Haemochromatosis, inflammation (acute phase reactant), liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"208","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3523","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5816","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning cortisol should be at its highest as it follows a daily rhythm. At 208, Casper's cortisol is within the morning reference range of 145.4 to 619.4 and within the optimal range. This rules out adrenal insufficiency, which can cause fatigue similar to ME/CFS, and is a reassuring finding.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic steroid use","high_causes":"Stress, Cushing's syndrome, steroid medications, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"580","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"204.8","upper_normal":"786.1","lower_optimal":"204.8","upper_optimal":"786.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"pmol/L","description":"Oestradiol is the primary female oestrogen hormone. At 580, this falls within the luteal phase range of 204.8 to 786.1, which is consistent with the progesterone level and suggests she was in the second half of her menstrual cycle at the time of sampling. A healthy oestradiol level is reassuring for bone health, cardiovascular protection and cognitive function.","low_causes":"Perimenopause/menopause, low body fat, intense exercise, PCOS (sometimes), pituitary dysfunction","high_causes":"Mid-cycle peak, pregnancy, obesity (aromatisation), liver disease, ovarian cysts","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"17.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4248","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"10.62","upper_optimal":"81.28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone is produced by the ovaries after ovulation and is essential for the second half of the menstrual cycle and for supporting early pregnancy. At 17.09, this falls within the luteal phase range of 10.62 to 81.28, confirming that ovulation has occurred in this cycle. This is a positive finding because it shows the reproductive system is cycling, even in the context of elevated androgens.","low_causes":"Anovulation, luteal phase defect, perimenopause, PCOS","high_causes":"Pregnancy, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"6.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5040","lower_normal":"0.5","upper_normal":"16.9","lower_optimal":"0.5","upper_optimal":"16.9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"LH is a pituitary hormone that triggers ovulation and stimulates the ovaries to produce hormones. At 6.07, this is within the luteal phase range of 0.5 to 16.9. In PCOS, the LH to FSH ratio is sometimes elevated (greater than 2:1), and Casper's ratio of 6.07/2.68 = 2.26 is worth noting, as it may support a PCOS assessment, though this ratio alone is not diagnostic.","low_causes":"Pituitary dysfunction, extreme exercise, severe malnutrition, stress","high_causes":"Perimenopause/menopause, PCOS (sometimes elevated ratio), pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3913","lower_normal":"1.5","upper_normal":"9.1","lower_optimal":"1.5","upper_optimal":"9.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"FSH is a pituitary hormone that stimulates the growth of ovarian follicles. At 2.68, this is within the luteal phase range of 1.5 to 9.1 and confirms normal pituitary-ovarian communication. FSH below 10 at age 24 is reassuring for ovarian reserve.","low_causes":"PCOS (sometimes), pituitary dysfunction, extreme exercise, malnutrition","high_causes":"Perimenopause/menopause, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"2.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6825","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays roles in energy, mood, libido and muscle maintenance. At 2.7, Casper's level is above the female upper limit of 2.6. She reports that a previous test also showed elevated androgens. Persistent testosterone elevation in a young woman, alongside difficulty losing weight, a BMI of 30 and insulin resistance, raises the possibility of polycystic ovary syndrome (PCOS). This should be formally assessed by her GP.","low_causes":"Ageing, oral contraceptives, adrenal insufficiency, pituitary dysfunction","high_causes":"PCOS, adrenal hyperplasia, ovarian tumour (rare), exogenous androgens, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"7.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8187","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.5","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active (not bound to carrier proteins). It is calculated from total testosterone and SHBG. At 7.42, this is above the female upper limit of 6.5. A high FAI means more testosterone is free to act on tissues, which can manifest as acne, excess hair growth, hair thinning and difficulty losing weight. The elevated FAI here is driven by both the high total testosterone and the relatively low SHBG of 36.4, which leaves more testosterone unbound. This is a key finding that supports the recommendation for PCOS assessment.","low_causes":"High SHBG (oral contraceptives, pregnancy), low testosterone","high_causes":"PCOS, low SHBG, insulin resistance, obesity, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"7.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5590","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3495","upper_optimal_position":"0.5561","units":"umol/L","description":"DHEA-S (converted: approximately 2,800.6 ug/dL) is an androgen precursor produced mainly by the adrenal glands. At 7.6 umol/L, this is within the laboratory range. DHEA-S can contribute to the overall androgen pool, and while it is within range here, it sits in the upper half, which is consistent with the elevated testosterone picture. If the androgens were being driven purely by the adrenal glands (a condition called non-classic congenital adrenal hyperplasia), DHEA-S would typically be more significantly elevated.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"PCOS, adrenal hyperplasia, adrenal tumour, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4196","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5427","units":"uIU/ml","description":"Prolactin is a pituitary hormone primarily associated with milk production, but it also affects the menstrual cycle, mood and immune function. At 138, this is within the normal range for a non-pregnant woman. Very high prolactin can suppress ovulation and cause menstrual irregularity, but at this level it is not a concern.","low_causes":"Not clinically significant in most cases","high_causes":"Stress, medications (especially antidepressants, antipsychotics), pituitary tumour, hypothyroidism, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"36.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3586","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3600","upper_optimal_position":"0.5267","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds to sex hormones, particularly testosterone, and controls how much is free and active in the body. At 36.4, this is within the laboratory range of 27.8 to 146 but sits in the lower quarter and below the optimal threshold of 40. Lower SHBG means more testosterone is free and biologically active, which explains why her Free Androgen Index is elevated even though her total testosterone is only marginally above range. SHBG is suppressed by insulin resistance and obesity, both of which are present here, creating a cycle where insulin resistance lowers SHBG, which raises free androgens, which can worsen insulin resistance. Addressing the insulin resistance through sleep, movement and diet would be expected to raise SHBG and help normalise the androgen balance.","low_causes":"Insulin resistance, obesity, PCOS, hypothyroidism, high androgen levels","high_causes":"Ageing, liver disease, hyperthyroidism, oral contraceptives, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.0468","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3847","lower_normal":"0.013","upper_normal":"0.25","lower_optimal":"0.013","upper_optimal":"0.04","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.3714","units":"nmol/L","description":"Free testosterone is the small fraction of total testosterone that is not bound to proteins and is therefore biologically active. At 0.0468, this is within the laboratory range but above the optimal threshold of 0.04. This is consistent with the elevated total testosterone and free androgen index, and confirms that more testosterone than ideal is available to act on tissues.","low_causes":"High SHBG, oral contraceptives, low total testosterone","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3726","upper_optimal_position":"0.4781","units":"mIU/L","description":"TSH is produced by the pituitary gland and controls how hard the thyroid works. At 1.17, this is within the optimal range of 1.0 to 2.5. A TSH in this zone indicates the pituitary is not having to push the thyroid to produce enough hormone, which means the thyroid is functioning well. This comprehensively rules out thyroid disease as a cause of Casper's fatigue, which is valuable given that thyroid problems are a common and treatable cause of similar symptoms.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4553","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the main hormone produced by the thyroid gland. It circulates to tissues where it is converted into the more active T3. At 15.6, this is within the optimal range of 14 to 20, confirming healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the most active thyroid hormone, produced mainly by conversion of T4 in the tissues. At 4.7, this is within the optimal range of 4.5 to 6.5. T3 drives metabolism, energy production and cognitive function, so a healthy T3 level rules out thyroid-related causes of fatigue and brain fog.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, low-calorie diets","high_causes":"Hyperthyroidism, excess thyroid medication, T3-producing nodule","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies target thyroid peroxidase, an enzyme essential for thyroid hormone production. Elevated levels indicate autoimmune thyroid disease (Hashimoto's thyroiditis). At less than 6.6, Casper's result is well below the threshold of 13.8, confirming no autoimmune attack on the thyroid. This is an important negative finding given her concern about autoimmune conditions.","low_causes":"No autoimmune thyroid disease (reassuring)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1591","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used in thyroid hormone production. At 1.4, this is well below the autoimmune threshold of 4.4. More than 80% of the population have undetectable levels (below 1.3), so at 1.4 Casper's level is just above the detection limit, which is entirely normal and not suggestive of autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (reassuring)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.42","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation and muscle function. At 84, Casper's level is within the optimal range of 75 to 120. This is a positive finding, especially at a BMI of 30 where fat tissue tends to sequester vitamin D, making it harder to maintain good levels. Maintaining this through the darker months with a daily supplement of 2,000 IU would be wise.","low_causes":"Insufficient sun exposure, dark skin, obesity (sequestration), malabsorption, kidney or liver disease","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.898","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4112","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5387","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate balance. At 1.898, this is within the optimal range. A normal PTH alongside normal calcium and adequate vitamin D confirms healthy calcium regulation and no parathyroid disease.","low_causes":"Hypoparathyroidism, high calcium, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"362","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3547","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5816","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 362, Casper's B12 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Levels below 500 are associated with subtle neurological symptoms including brain fog, poor concentration and fatigue, which are among Casper's reported symptoms. Her B-complex supplement is likely providing some B12, but the level suggests it is not enough or is not in the most absorbable form. Switching to or adding sublingual methylcobalamin at 1,000 mcg daily would be more effective.","low_causes":"Poor dietary intake (vegetarian/vegan), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and nervous system function. At 13, this is within the optimal range of above 8. A healthy folate level is important alongside B12 for neurological function and red cell production.","low_causes":"Poor dietary intake, malabsorption, alcohol, medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"U/L","description":"CK is an enzyme found in muscles that is released into the blood when muscle tissue is damaged. At 62, this is within the optimal range, indicating no significant muscle breakdown. This is reassuring in the context of chronic pain and fatigue, as conditions causing muscle inflammation (such as polymyositis) would typically show an elevated CK.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism, inflammatory myopathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5284","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals and protect cells from oxidative damage. At 1.58, this is within the optimal range, indicating healthy antioxidant defences.","low_causes":"Poor diet, oxidative stress, chronic disease, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"11.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1643","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer but also in many benign conditions including endometriosis, fibroids, menstruation and pelvic inflammation. At 11.5, this is well within the normal range of below 35, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammation, menstruation, pregnancy, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 15-3 is a protein primaril function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){

  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');

  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);

  requestAnimationFrame(step);

  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
