<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Charlotte Harrison-Gates","dob":"12/03/1998","report_date":"2026-10-20","summary":"Customer is a 28-year-old female presenting with a BMI of 20.5, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food daily; portions are about average (volume 5 out of 10). She trains three times per week (two cardio sessions and one resistance session at moderate intensity) with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress rarely feels hard to manage. She drinks 1 to 4 alcoholic drinks per week and reports overuse of caffeine or energy drinks. She reports low energy and fatigue, bloating and digestive discomfort, low sex drive, and skin breakouts, all of which she describes as having been present always. She has had scans on her gallbladder which were normal, but on certain days when she is stressed or overeats she feels pressure there like a ball. She has regular cycles and is trying to conceive. Her goals are to improve cardiovascular fitness, improve long-term health and longevity, and improve energy levels.\n\nHer PhenoAge is 18.6 against a calendar age of 28, placing her biological age nearly a decade younger than her years. That is an excellent result and reflects genuinely healthy metabolic and immune markers across the board. The drivers of that favourable score are a very low CRP, healthy albumin, good kidney function and a well-balanced white cell count.\n\nBefore moving to the positives, there is one finding that needs to go to her GP promptly, and that is the Lp(a) result. Lipoprotein(a), pronounced lipoprotein little a, is a genetically inherited particle that behaves like a particularly sticky form of LDL cholesterol. It deposits cholesterol into artery walls, encourages blood clotting, and promotes inflammation at the vessel lining. Her Lp(a) is 130.66 nmol/L, which sits in the moderate risk category (90 to 200). The critical thing about Lp(a) is that it is entirely inherited, it does not change with diet, exercise or weight, and it stays at roughly the same level for life. No lifestyle change will lower it. This result should be recorded permanently in her medical notes, and her GP should be made aware so that all other modifiable cardiovascular risk factors are managed as tightly as possible. It also means her first-degree relatives, parents and siblings, should have their own Lp(a) tested because there is a roughly 50 percent chance they carry the same variant. The good news is that knowing about it at 28, and especially before conception, means there is a very long runway to keep every other risk factor in the ideal range, which is the single most effective strategy for someone with elevated Lp(a).\n\nThis finding also reframes her cholesterol results. Her total cholesterol is 6.1, above the desirable threshold of 5.18, and her LDL cholesterol is 3.59, above the upper limit of 3.0. Her ApoB, which is the protein carried on every atherogenic particle and the single best measure of how many particles are in the bloodstream, is 0.88, just under the 0.9 desirable threshold. However, a proportion of those LDL particles are actually Lp(a) particles, which look like LDL on a standard blood test. When the Lp(a) contribution is subtracted, her corrected LDL falls to 3.17, which is still above the ideal of 2.0 but meaningfully lower than the headline number. This means roughly 0.42 mmol/L of what looks like LDL is actually Lp(a), and that portion cannot be changed. The remaining 3.17 is modifiable through diet and lifestyle, and this is where effort should be focused. Her Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 40 out of 100, which sits right at the upper boundary of acceptable. The score is being driven almost entirely by the Lp(a) and the LDL; everything else feeding into it is excellent.\n\nAnd there is a great deal that is excellent. Her HDL cholesterol is 2.2, which is outstanding. HDL is the particle that carries cholesterol away from artery walls back to the liver for disposal, and a level this high is genuinely protective. Her triglycerides are 0.81, well within the ideal range of below 1.0, which tells us that the liver is processing dietary fat efficiently and there is no insulin-driven overproduction of these particles. Her TG/HDL ratio, one of the best markers of metabolic health, is 0.37, which is superb. Her ApoA1, the protein on HDL particles, is 1.85, and her ApoB/A1 ratio is 0.48, comfortably in the lower risk category. Her atherogenic index of plasma is deeply negative at minus 0.434, which is ideal. So the lipid picture is genuinely split: the modifiable, metabolic side of her lipids is in excellent shape, and the inherited Lp(a) is pushing the headline numbers up.\n\nHer blood sugar control is very good. Fasting glucose is 4.7, right in the middle of the ideal range. Her HbA1c, which reflects average blood sugar over the past two to three months, is 38 mmol/mol, just above the optimal threshold of 36 but comfortably within the normal range of below 42. Her fasting insulin is 3.06, which is low and healthy, and her HOMA-IR, a calculation that estimates how resistant the body's cells are to insulin, is 0.64, confirming excellent insulin sensitivity. Her C-Peptide, which the pancreas releases alongside insulin as a measure of how much insulin is being produced, came back at 0.787 ug/L, which is below the laboratory range of 1.1 to 4.4. In pmol/L this converts to roughly 260, which is low. However, in the context of a fasting glucose of 4.7 and an HbA1c of 38, this simply reflects a pancreas that does not need to produce much insulin because her cells are responding to it so efficiently. It is not a sign of pancreatic failure; it is a sign of metabolic efficiency. This is not a concern.\n\nHer liver is in excellent health. ALT is 15 and GGT is 16, both well within the ideal range. Her FIB-4 score, a calculation that estimates liver scarring from age, platelets, ALT and AST, is 0.75, ruling out any significant fibrosis. Her APRI score is 0.258, also reassuringly low. Her NAFLD fibrosis score is minus 2.928, deep in the healthy range. The liver is under no metabolic strain at all.\n\nHer total bilirubin is 38 umol/L, nearly double the upper limit of 21, and this looks alarming in isolation. However, every other liver marker, ALT, AST, GGT, ALP, albumin, is perfectly healthy. This pattern is the hallmark of Gilbert's syndrome, a harmless inherited variation in how the liver processes bilirubin. It affects roughly 5 to 10 percent of the population, does not progress to liver disease, does not need treatment, and is not a concern for pregnancy. The only practical implication is that it can cause mild yellowing of the eyes when she is fasting, dehydrated, unwell or stressed, and that some medications are processed slightly differently. It is worth recording in her notes but is entirely benign.\n\nHer amylase is 121, marginally above the upper limit of 118. Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. A marginally elevated amylase with a completely normal lipase at 38, lipase being the more specific marker for pancreatic inflammation, is not a sign of pancreatitis. This is consistent with normal variation, and given her history of gallbladder-area pressure when stressed or after large meals, it is worth noting but does not suggest active pancreatic disease. The gallbladder scans were normal, and the pressure she describes is likely functional, related to how the gallbladder contracts in response to fat and stress, rather than structural disease.\n\nHer thyroid is working well. TSH is 0.86, in the lower half of the ideal range of 1.0 to 2.5, which means the pituitary gland is not having to push the thyroid hard. Free T4 is 16.5 and free T3 is 5.2, both within the ideal range, and the FT3 to FT4 ratio is 0.315, confirming good conversion of the storage hormone T4 into the active hormone T3. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which rules out autoimmune thyroid disease. The thyroid is not contributing to her fatigue.\n\nHer kidney function is healthy. Cystatin C, which is a more reliable marker of kidney filtration than creatinine in lean individuals, is 1.06, and her combined eGFR from creatinine and cystatin C is 83. At 28, an eGFR of 83 is slightly below the optimal threshold of 90, but the creatinine-based eGFR is above 90, and cystatin C can be affected by thyroid function, inflammation and muscle mass. Given that every other kidney marker is normal, sodium 140, potassium 4.7, urea 5.1, uric acid 288, and the urinalysis shows no protein, no blood and no casts, this is most likely a reflection of normal physiological variation rather than early kidney disease. It is worth repeating on a future test to confirm it remains stable.\n\nHer bicarbonate is 31.4, just above the upper limit of 31. Bicarbonate is a buffer that the body uses to regulate blood acidity. A marginal elevation of 0.4 above range is not clinically significant and most likely reflects the timing of the sample or mild dehydration.\n\nHer immune system is well balanced. IgG at 14.2, IgM at 2.1 and IgA at 1.4 are all within their respective ranges. IgE is 1.4, very low, which is reassuring and suggests no significant allergic drive. Rheumatoid factor is negative at 6. Her coeliac screen, tissue transglutaminase IgA, is negative, which is useful information given her bloating symptoms as it rules out coeliac disease as a cause.\n\nHer inflammation markers are excellent. High-sensitivity CRP, which measures low-grade systemic inflammation, is 0.3, well under the optimal threshold of 1.0. ESR is 6, also well within range. The platelet-to-lymphocyte ratio and systemic immune-inflammation index are both ideal. There is no inflammatory signal in this blood panel at all.\n\nHer hormones are consistent with the time in her cycle. The oestradiol of 1639 pmol/L and LH of 17.87 suggest the sample was taken around the midcycle surge or just after ovulation, which is consistent with the elevated oestradiol above the standard follicular range. Progesterone at 2.02 is consistent with a follicular or very early post-surge reading; it would need to be measured on day 21 of her cycle to confirm ovulation, and this is particularly important given that she is trying to conceive. FSH at 7.39 is healthy. Testosterone is 1.3, within the female range of 0.5 to 2.6, and her free androgen index is 2.04, also normal. SHBG is 63.8, healthy. DHEA-S is 4.6 umol/L, which converts to roughly 1,695 ug/dL, well within range. Prolactin is 165, normal for a non-pregnant female. Cortisol is 328, within the morning reference range, which is reassuring given her afternoon crash pattern. Her bioavailable testosterone is 0.36, within the ideal range. Overall the hormonal picture is healthy, but a day-21 progesterone should be arranged through her GP to confirm ovulation since she is trying to conceive.\n\nHer full blood count is largely healthy but has a few findings worth explaining. Her haemoglobin is 147, near the top of the female range of 120 to 150, which is a good level and rules out anaemia. Her red blood cell count is 4.9, marginally above the female upper limit of 4.8. This is a very small overshoot and at this margin is almost always normal variation, especially in someone who is well hydrated with a haematocrit of 0.417 that is comfortably within range. Her MCHC, which measures the concentration of haemoglobin inside each red cell, is 352, above the upper limit of 345. MCHC is one of the least clinically significant indices on a blood count and at this margin is not a concern. Her MPV, the average size of her platelets, is 10.3, marginally above the 10.1 upper limit, which again at this margin is normal variation. Her reticulocyte percentage is 0.76, within range, but her absolute reticulocyte count is 37.24, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count alongside a healthy haemoglobin and healthy iron stores simply means the bone marrow does not need to produce red cells at a high rate because the existing ones are lasting well. It is not a concern.\n\nHer ferritin, which is the body's iron store, is 21. While this falls within the laboratory range of 10 to 291, it is below the optimal threshold of 40 for women. At this level, iron stores are not depleted but they are not robust either, and in a woman with regular periods who is trying to conceive, building ferritin to at least 50 to 70 is important. Low iron stores are one of the most common causes of fatigue in premenopausal women, and her ferritin of 21 could genuinely be contributing to her low energy, her afternoon crash, and possibly even her skin breakouts, since iron is involved in oxygen delivery to every tissue including the skin. Her serum iron at 29.8 and transferrin saturation at 41.5 percent are both healthy, which means she is absorbing iron well from her diet but not storing enough of it, most likely because menstrual losses are outpacing intake. This is the most actionable finding in the report for her energy symptoms.\n\nHer vitamin D is 100, right at the lower boundary of the optimal range of 75 to 120. This is a good level, likely maintained by supplementation or sun exposure, and should be maintained. Her B12 is 380, within the laboratory range but below the optimal threshold of 500. At this level B12 is adequate but not ideal, and given that she is trying to conceive, optimising B12 before and during pregnancy is important for neural tube development. Folate is 12, above the optimal threshold of 8, which is a good level for conception. Magnesium is 0.9, within the optimal range of 0.85 to 1.05. Calcium, phosphate and parathyroid hormone are all normal.\n\nHer total antioxidant activity is 1.94, above the upper limit of 1.77. This is not a concern and simply reflects dietary or supplemental antioxidant intake.\n\nHer tumour markers are all reassuringly normal. CA125 is 6.2, CA15-3 is 11.27, CA19-9 is 7.03, and CEA is below 0.5. Her urinalysis is clean with no protein, no glucose, no blood, no white cells and no nitrites. The urine culture result has now arrived: heavily mixed growth, probable contamination.\n\nNow, to her symptoms. She reports fatigue, bloating, low libido and skin breakouts, all lifelong. The bloods do explain some of this but not all of it. The ferritin of 21 is the most likely contributor to the fatigue and afternoon crash, and correcting it over the next three to four months should produce a noticeable improvement in energy. The B12 at 380, while adequate, is below optimal and could be contributing at the margins. The daily sugar intake is worth addressing because it drives the insulin spikes that produce the classic afternoon crash pattern: blood sugar rises quickly after sugary food, insulin overshoots to bring it down, and energy drops. Her caffeine overuse is compounding this, because caffeine masks the crash temporarily but worsens the rebound. Beyond that, the bloods have positively excluded thyroid disease as a cause of fatigue, ruled out anaemia from a haemoglobin perspective, ruled out coeliac disease, ruled out significant inflammation, ruled out diabetes or insulin resistance, and shown healthy cortisol. The bloating and gallbladder-area pressure, with normal scans and normal lipase, are most likely functional. Stress and overeating trigger gallbladder contraction, and in some people this produces a pressure sensation even when the gallbladder is structurally normal. A food and symptom diary over two to three weeks would help identify whether specific foods, particularly fatty meals, trigger the episodes. If the bloating is persistent and not explained by food triggers, a hydrogen breath test for SIBO (small intestinal bacterial overgrowth) or lactose intolerance through her GP would be the next step. The low libido, with entirely normal hormones and no hormonal contraception, is unlikely to have a blood-based explanation; it may relate to energy levels, stress, sleep quality or other factors that blood cannot measure, and should improve as energy improves with iron repletion. The skin breakouts with normal androgens and normal inflammation are most likely driven by diet, particularly the daily sugar, or by a topical factor rather than a hormonal one.\n\nLate-arriving results: Bacterial Count: 10^4; Urine Culture and Sensitivities: Heavily mixed growth, probable contamination.","links":"The central thread running through this report is a young woman whose metabolic health is genuinely excellent but whose inherited cardiovascular risk, via Lp(a), means she needs to manage every modifiable factor with more care than average. Her insulin sensitivity is superb, her inflammation is negligible, her liver is pristine, and her thyroid and immune system are working well. The Lp(a) of 130.66 is the single most important finding because it is permanent, it meaningfully increases lifetime cardiovascular risk, and it reframes what would otherwise be a mildly elevated cholesterol into something that needs proactive management. The corrected LDL of 3.17 shows that most of her LDL is genuinely modifiable, and her outstanding HDL and triglycerides show that the metabolic side of her lipid profile is already in excellent shape.\n\nThe second thread is the low ferritin of 21 connecting to her symptoms. In a menstruating 28-year-old who is trying to conceive, a ferritin of 21 is the most likely single explanation for the chronic fatigue, afternoon energy crash, and possibly the skin breakouts. The iron absorption markers are healthy, which means the issue is simply that intake is not keeping pace with menstrual losses. This is highly correctable with supplementation and dietary iron, and it is the change most likely to produce a noticeable difference in how she feels within two to three months.\n\nThe third thread is the daily sugar and caffeine overuse driving the afternoon crash pattern. Even with excellent insulin sensitivity, the rapid rise and fall of blood sugar from sugary foods produces an energy dip, and caffeine masks the dip temporarily before worsening the rebound. Addressing these two habits will work alongside iron repletion to resolve the afternoon crash.\n\nThe Gilbert's syndrome, the marginally elevated bilirubin with a perfectly clean liver, is an incidental inherited finding that explains a number on the report but requires no action. The marginally elevated amylase with a normal lipase and normal gallbladder imaging is consistent with normal variation and does not suggest pancreatic disease. The low absolute reticulocyte count, the marginal red cell count, and the marginal MCHC and MPV are all within the range of normal laboratory variation in someone with a healthy haemoglobin and no signs of haematological disease.\n\nWhat was excluded matters. Coeliac disease is negative, thyroid disease is ruled out with undetectable antibodies and ideal function, there is no insulin resistance, there is no inflammation, there is no kidney disease, there is no liver disease, and there is no autoimmune signal. These exclusions are valuable because they narrow the explanation for her symptoms to the ferritin, the diet pattern, and functional factors that blood cannot measure.","lifestyle":"Build iron-rich food into your meals daily: red meat two to three times a week, eggs, lentils, dark leafy greens, and pair plant-based iron sources with something containing vitamin C (a glass of orange juice, some peppers, or tomatoes) to increase absorption. Anchor: plan three dinners a week around red meat or lentils. Why: your ferritin of 21 is below optimal for a menstruating woman trying to conceive, and dietary iron alongside supplementation is the fastest way to build it.\nReduce sugary food from daily to two to three times a week, and when you do have something sweet, have it after a meal rather than on its own. Anchor: the rule is simple, sugar follows protein, never replaces a meal. Why: eating sugar on an empty stomach drives the rapid insulin spike and crash behind your afternoon energy dip, even with your excellent insulin sensitivity.\nSet a caffeine cut-off at 1pm and cap intake at two cups of coffee or equivalent before then. Anchor: after lunch, switch to water or herbal tea. Why: caffeine after early afternoon disrupts sleep architecture even when you fall asleep fine, and the overuse you report is compounding the afternoon crash by masking fatigue and worsening the rebound.\nAdd a palm-sized portion of protein to every meal and snack: eggs or Greek yoghurt at breakfast, chicken or fish at lunch, meat or legumes at dinner. Anchor: protein goes on the plate before anything else. Why: protein slows glucose absorption, stabilises energy between meals, and supports the muscle-building your resistance training needs. Your target is 75 to 95 grams of protein per day.\nIncrease your vegetable and fruit portions from 2 to 3 per day to at least 5. Anchor: add one portion to breakfast (berries on yoghurt or spinach in eggs) and one to lunch (a side salad or extra vegetables). Why: the fibre will help with bloating by supporting gut motility, and the micronutrients support the fertility and energy goals.\nAdd one more resistance training session per week, moving from one to two. Anchor: pick a fixed day and time that does not compete with your cardio days. Why: resistance training builds the lean mass that supports metabolic health long-term, and at a BMI of 20.5 with moderate training, two sessions a week is the minimum to see meaningful progress.\nKeep a food and symptom diary for two to three weeks, noting what you ate, when the bloating or gallbladder pressure occurred, and what was happening that day (stress, meal size, fat content). Anchor: a notes app entry after each meal takes 30 seconds. Why: this will reveal whether specific foods or meal sizes trigger the gallbladder-area pressure and bloating, which normal scans suggest is functional rather than structural.\nMaintenance calories are approximately 1,900 to 2,050 per day at your current activity level. You do not need to lose weight at a BMI of 20.5. Focus on food quality and protein targets rather than calorie restriction, especially while trying to conceive.","flags":"Lp(a) 130.66 nmol/L, moderate risk category (normal below 32). Entirely inherited and unchangeable. This is the most important finding in the report for long-term cardiovascular risk. Should be recorded permanently in her medical notes. First-degree relatives should be tested. All modifiable risk factors should be managed aggressively to compensate.\nLDL 3.59 (above 3.0 limit), total cholesterol 6.1 (above 5.18 desirable), ApoB 0.88 (just under 0.9 desirable). Lp(a)-corrected LDL is 3.17, confirming that roughly 0.42 mmol/L of the LDL is Lp(a)-driven and unmodifiable. The remainder is diet-modifiable. HDL 2.2 and triglycerides 0.81 are both excellent, confirming the metabolic side of the lipid profile is healthy.\nCardiovascular Risk Score 40/100, at the upper boundary of acceptable, driven almost entirely by Lp(a) and LDL. All other inputs (HDL, triglycerides, CRP, HbA1c) are ideal.\nFerritin 21 ng/ml, within laboratory range but below the optimal threshold of 40 for women. In a menstruating woman trying to conceive, this is suboptimal and is the most likely contributor to her fatigue and afternoon energy crash. Supplementation and dietary iron recommended.\nC-Peptide 0.787 ug/L (approximately 260 pmol/L), below range of 1.1 to 4.4 ug/L. In the context of normal glucose, normal HbA1c and excellent HOMA-IR, this reflects low insulin demand rather than pancreatic insufficiency.\nTotal bilirubin 38 umol/L, nearly double the upper limit of 21, with all liver enzymes normal. Pattern consistent with Gilbert's syndrome, a benign inherited condition affecting 5 to 10 percent of the population. No treatment needed.\nAmylase 121 IU/L, marginally above the upper limit of 118, with lipase 38 completely normal. Not suggestive of pancreatic disease. Consistent with normal variation.\nBicarbonate 31.4, marginally above the upper limit of 31. Clinically insignificant at this margin.\nRed blood cell count 4.9, marginally above the female upper limit of 4.8. Haematocrit 0.417 is comfortably within range. Not significant.\nMCHC 352, above the upper limit of 345. At this margin, usually an artefact of sample temperature or handling.\nMPV 10.3, marginally above the upper limit of 10.1. Normal variation.\nAbsolute reticulocyte count 37.24, below the lower limit of 50. With a healthy haemoglobin of 147 and no signs of haemolysis or blood loss, this reflects reduced marrow output because it is not needed rather than marrow suppression.\nTotal antioxidant activity 1.94, above the upper limit of 1.77. Reflects dietary or supplemental antioxidant intake and is not a concern.\nB12 380 pg/ml, within laboratory range but below optimal of 500. Should be optimised to above 500 before and during pregnancy.\nCombined eGFR (creatinine plus cystatin C) 83 mL/min, slightly below the optimal threshold of 90. All other kidney markers normal, urinalysis clean. Most likely physiological variation. Worth repeating on future testing.\nOestradiol 1639 pmol/L, above the standard follicular range, consistent with midcycle surge. Progesterone 2.02 consistent with follicular phase. A day-21 progesterone is needed to confirm ovulation given she is trying to conceive.\nReassuring negatives: thyroid function ideal with undetectable antibodies, coeliac screen negative, CRP 0.3 (excellent), ESR 6, fasting glucose 4.7, HbA1c 38, HOMA-IR 0.64, all liver enzymes clean, all tumour markers normal, all immunoglobulins normal, rheumatoid factor negative, urinalysis clean, cortisol normal, all hormones appropriate for cycle phase.","recommendations":"Discuss the Lp(a) result of 130.66 nmol/L with your GP. This is an inherited cardiovascular risk factor that should be recorded permanently in your medical notes. Ask about testing first-degree relatives (parents and siblings) as there is a roughly 50 percent chance they carry the same variant. At 28, the ten-year cardiovascular risk is low, but the lifetime risk is meaningfully increased, so all modifiable factors (LDL, blood pressure, blood sugar, weight, smoking, exercise) should be kept in the ideal range.\nRequest a day-21 progesterone blood test through your GP to confirm ovulation. This is the standard test for ovulatory function and is particularly important now that you are trying to conceive. The progesterone in this sample at 2.02 is consistent with the follicular phase and does not confirm or exclude ovulation.\nDiscuss the corrected LDL of 3.17 (modifiable portion) with your GP. In someone with elevated Lp(a), keeping LDL as low as possible is the primary compensatory strategy. Dietary changes (increasing soluble fibre, oily fish twice a week, reducing saturated fat from dairy and red meat) are the first step, with lipid-lowering medication a conversation for the future if diet does not bring ApoB below 0.8.\nMention the ferritin of 21 to your GP, particularly in the context of trying to conceive. Iron stores should be built to at least 50 to 70 before pregnancy. Supplementation with ferrous bisglycinate 25mg daily is recommended alongside dietary iron.\nMention the Gilbert's syndrome pattern (bilirubin 38 with all liver enzymes normal) so it is recorded in your notes. This avoids future concern if bilirubin is tested again and appears high.\nIf bloating and gallbladder-area pressure persist despite dietary changes, ask your GP about a hydrogen breath test for SIBO or lactose intolerance as a next investigation.\nRetest in four to six months with ferritin, full lipid panel including Lp(a), B12, cystatin C, and a day-21 progesterone. The ferritin should be above 50 by then if supplementation and diet are working. Aim for protein intake of 75 to 95 grams per day at a maintenance calorie range of 1,900 to 2,050 calories.","supplementation":"Iron as ferrous bisglycinate, 25mg, taken with a source of vitamin C (a glass of orange juice or a vitamin C tablet) on an empty stomach in the morning or at least two hours away from tea, coffee or calcium. Why: your ferritin of 21 is below optimal for a menstruating woman trying to conceive, and this is the most likely driver of your fatigue. Retest ferritin in three to four months and stop once it is above 70.\nVitamin B12 as sublingual methylcobalamin, 1,000mcg daily, dissolved under the tongue. Why: your B12 of 380 is adequate but below the optimal level of 500, and optimising B12 before and during pregnancy is important for neural tube development and energy production.\nVitamin D3 as cholecalciferol, 2,000 IU daily, taken with your fattiest meal. Why: your vitamin D is 100, right at the lower edge of the optimal range. Maintaining this level requires ongoing supplementation, especially through the autumn and winter months.\nVitamin K2 as MK-7, 100mcg daily, taken alongside vitamin D. Why: K2 directs calcium into bone rather than soft tissue and is always recommended alongside vitamin D supplementation.\nOmega-3 fish oil providing 2g of combined EPA and DHA daily, taken with food. Why: omega-3 supports the cardiovascular system, which matters more than usual given your Lp(a) of 130.66, and supports fertility and fetal brain development. Choose a high-quality triglyceride-form fish oil.\nFolate: ensure you are taking at least 400mcg of folic acid or methylfolate daily as part of your preconception plan. Your serum folate of 12 is good, but consistent supplementation before and during early pregnancy is essential for neural tube development.\nDo not take high-dose antioxidant supplements. Your total antioxidant activity is already above range at 1.94, and additional supplementation is unnecessary.\nThe most important changes from this report are not supplements. They are building your iron stores through diet and supplementation, reducing daily sugar to stabilise your afternoon energy, cutting caffeine after 1pm, and discussing the Lp(a) result with your GP so it is recorded and managed for life.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 59.7; held to 59 by a system rated \"See your GP\". Weakest systems: lipids & cardiovascular 24%, liver & metabolic 30%, digestive 66%. Biggest drags: Total Bilirubin, Lipoprotein(a), LDL Cholesterol, Bicarbonate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"18.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2818","lower_normal":"","upper_normal":"33","lower_optimal":"","upper_optimal":"28","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4242","uni function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){

  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');

    runIntro();

    gerr.style.display='block'; dob.classList.add('shake');

}
