<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"James Worrall","dob":"22/02/1985","report_date":"2026-10-22","summary":"Customer is a 41-year-old male presenting with a BMI of 23.1, following a high-carb, low-fat diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains 6 times per week (3 cardio, 3 resistance) at hard intensity with 5,000 to 7,500 daily steps. He sleeps 6 to 7 hours and wakes feeling refreshed, with steady energy through the day. Stress feels hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week and supplements with creatine and protein powder. He has no diagnosed conditions and takes no medications. This is his first blood test. He reports no symptoms. His goals are to prevent disease and improve long-term health and longevity.\n\nThe single most important finding in this report is his Lipoprotein(a), which at 153 nmol/L sits in the moderate risk category. Lipoprotein(a), usually written Lp(a), is a particle in the blood that looks like LDL cholesterol but carries an extra protein tail that makes it stickier. It deposits cholesterol into artery walls, encourages blood clotting, and drives local inflammation, all of which accelerate cardiovascular disease independently of standard cholesterol. The critical thing to understand is that Lp(a) is entirely genetic. It does not change with diet, exercise, weight loss or any supplement. It is set by DNA, and the level he has today is the level he will always have. At 153 nmol/L he is above the 32 nmol/L ideal and above the approximately 125 nmol/L threshold at which most lipid specialists consider the additional risk to be clearly meaningful. This does not mean cardiovascular disease is inevitable; it means one inherited risk factor is working against him, which makes everything else in the report, the factors he can control, more important. He should record this result permanently, mention it to his GP, and have his first-degree relatives (parents, siblings, children) tested, because if the gene runs in his family, early awareness allows early action. We would recommend discussing this with his GP so that his overall cardiovascular risk profile can be assessed in context.\n\nThe good news is that almost everything he can control looks excellent. His standard lipid panel is genuinely impressive. Total cholesterol is 4.7, HDL is 1.8 which is comfortably above the 1.4 optimal threshold for men, LDL is 2.5 which is within the ideal range, triglycerides are 0.97 which is below the 1.0 optimal cutoff, and his ApoB, the count of atherogenic particles and the single best predictor of cardiovascular risk after Lp(a), is 0.74, well below the 0.8 optimal target. His ApoB to ApoA1 ratio is 0.45, which is excellent. His Lp(a)-corrected LDL, which strips out the cholesterol carried on Lp(a) particles and shows only the portion driven by diet and metabolism, is 2.01, right at the edge of ideal. This means that the cholesterol machinery he can influence through lifestyle is working about as well as it can. His TG to HDL ratio is 0.54, his atherogenic index of plasma is negative at minus 0.27, and his Castelli II ratio is 1.39. Every modifiable cardiovascular marker is optimal. That is the context for the Lp(a): one inherited factor is elevated, but everything around it is as clean as it gets, and keeping it that way is the most powerful thing he can do.\n\nHis Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), high-sensitivity CRP and HbA1c, is 25 out of 100. Without the Lp(a) contribution that score would be very low indeed. The score reflects the risk being built in the arteries right now rather than a ten-year event probability, and at 41 with otherwise excellent markers, his ten-year risk remains low, but the gap between the two is the window for acting.\n\nHis inflammation markers are outstanding. High-sensitivity CRP, the most sensitive general marker of systemic inflammation, is 0.2, which is about as low as the assay measures. ESR is 4. His platelet-to-lymphocyte ratio is 110.7 and his systemic immune-inflammation index is 484, both within the optimal range. There is no detectable inflammatory burden anywhere in his system.\n\nHis blood sugar control is excellent. Fasting glucose is 4.6, right in the middle of the optimal 4.0 to 5.4 band. HbA1c, the three-month average of blood sugar, is 37 mmol/mol, below the 42 threshold for pre-diabetes and within the optimal zone below 36 by only a whisker. His HOMA-IR, a calculation that estimates how sensitive his cells are to insulin, is 0.53, which places him firmly in the insulin-sensitive category. His TyG index is 8.18, well within range. His fasting insulin is 2.6, sitting right at the bottom of the laboratory range. This is not a concern; it reflects a pancreas that does not need to produce much insulin because his cells respond to it efficiently. His C-Peptide, a molecule released in equal amounts to insulin and used to confirm how much insulin the pancreas is actually making, came back at 1.03 micrograms per litre which converts to approximately 341 pmol/L. The laboratory flagged this as marginally below the reference range of 1.1 to 4.4 micrograms per litre, but in the context of a perfectly normal fasting glucose, a normal HbA1c, and a HOMA-IR that confirms excellent insulin sensitivity, this simply tells us that his pancreas is producing a small, appropriate amount of insulin because that is all the body needs. This is the hallmark of a lean, active, insulin-sensitive man and is a positive finding.\n\nHis thyroid is working well. TSH, the hormone the pituitary gland sends to tell the thyroid how hard to work, is 1.44, sitting in the sweet spot of the optimal 1.0 to 2.5 range. Free T4 is 19.7, towards the upper end of the optimal 14 to 20 band, and Free T3, the active thyroid hormone, is 5.3, within the optimal 4.5 to 6.5 range. His FT3 to FT4 ratio is 0.269, right at the bottom edge of optimal, meaning conversion from the storage form to the active form is adequate. Both thyroid antibody tests, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease.\n\nHis kidney function is strong. Cystatin C, a protein filtered by the kidneys that gives a more accurate picture of filtration than creatinine alone (especially in muscular men who produce more creatinine through normal muscle metabolism), is 0.84, and the eGFR calculated from it is 98, which is excellent for 41. The creatinine-based eGFR of 80 is lower, but this is expected in someone who trains hard and carries good muscle mass; creatinine is a byproduct of muscle turnover, so more muscle means more creatinine and a falsely lower eGFR. The combined creatinine and cystatin C eGFR of 98 confirms that the kidneys are filtering exactly as they should. His urea-to-creatinine ratio is 73, within the optimal band. Uric acid is 312, within the optimal range of 200 to 380 for men. Sodium, chloride and bicarbonate are all within range, and his calculated serum osmolality of 293.9 sits within the reference band.\n\nHis liver panel is largely clean. GGT is 16, well below the optimal 25 cutoff, which tells us the liver is under no significant metabolic strain. Total bilirubin is 11, albumin 40, alkaline phosphatase 91, and the NAFLD fibrosis score is minus 2.63, all reassuring. His AST, an enzyme found in the liver but also in muscle and heart tissue, is 53, above the laboratory upper limit of 45. His ALT, which is more liver-specific, is 48, within the laboratory range but above the optimal threshold of 30 for men. His creatine kinase (CK) is 664, more than double the upper limit of 320, which is the key to interpreting the AST. CK is an enzyme released when muscle fibres are broken down and rebuilt, and after hard resistance training it can stay elevated for 48 to 72 hours. The fact that his CK is markedly elevated while his GGT is pristine and his bilirubin and albumin are normal strongly suggests that the raised AST is coming from skeletal muscle rather than from the liver. AST is present in high concentrations in muscle tissue as well as the liver, so when CK is elevated after training, AST typically follows. His De Ritis ratio (AST to ALT) is 1.1, which is within the optimal band and consistent with a muscular source. His FIB-4 score, a fibrosis screening tool, is 1.32, just below the 1.45 threshold, and his APRI is 0.557, above the optimal 0.5 but well below the 1.5 concern level. Given the muscle contribution to AST, neither score suggests liver scarring. If he had rested from training for 72 hours before the blood draw, both the AST and CK would very likely be within range. This is worth knowing for future tests: a 72-hour break from resistance training before the sample gives a cleaner picture of liver-specific enzymes.\n\nHis full blood count is healthy. Haemoglobin is 158, right in the middle of the male range. Red cells, haematocrit, MCV, platelets, MPV, white cell count and the differential (neutrophils, lymphocytes, monocytes, eosinophils, basophils) are all within range. His neutrophil-to-lymphocyte ratio is 2.03, within the optimal 1.0 to 2.0 band by a hair. His reticulocyte percentage is 1.02, within range, though the absolute reticulocyte count is 49.7, a fraction below the 50 lower limit. At this margin, this is laboratory rounding; the bone marrow is producing red cells at a normal rate. His MCH at 32.5 is marginally above the upper limit of 32, and his MCHC at 347 is marginally above the upper limit of 345. At these margins, both are most likely the result of normal laboratory variation and the minor effects of sample temperature and storage on red cell volume measurements, as the lab itself notes. Neither warrants any action.\n\nHis iron studies are interesting. Ferritin, the storage form of iron, is 74, which is within the optimal range of 50 to 200 for men. Transferrin and total iron binding capacity are both normal. However, his serum iron is 33.9, above the upper limit of 31.3, and his transferrin saturation is 52.3 percent, within the laboratory range of 18 to 55 but above the optimal band of 25 to 40 percent. Serum iron fluctuates considerably with meals and time of day; a single elevated reading in the context of a normal ferritin, normal transferrin and normal TIBC does not point to iron overload. If this had been drawn in the morning shortly after a meal, the iron would be expected to be higher. This is worth noting and worth rechecking on a fasting morning sample at his next test, but it does not require GP action today.\n\nHis hormone profile is healthy. Testosterone is 19.4, within the optimal range of 18 to 30 for men. Free testosterone, the unbound fraction available to tissues, is 0.43, within range, and bioavailable testosterone is 9.41, at the top of the reference band. SHBG, the protein that binds testosterone and reduces its availability, is 33.2, within the optimal 25 to 55 range. His free androgen index is 58.4, within range. LH and FSH, the pituitary hormones that drive testosterone production, are both normal, confirming the system is working well from top to bottom. Oestradiol is 94, within range. Cortisol is 363, within the morning reference range. DHEA-S is 4.3 micromol per litre (approximately 1,585 micrograms per decilitre), healthy for his age. Prolactin and progesterone are both within their male reference ranges.\n\nHis immune markers are mostly normal. IgG is 9.3 and IgE is 19.7, both well within range. Rheumatoid factor is negative. Coeliac screening (tissue transglutaminase IgA) is negative, ruling out coeliac disease on a gluten-containing diet. His IgA is 3.6, marginally above the upper limit of 3.5. IgA is the antibody class that guards mucosal surfaces, the gut, the airways, the urinary tract. A marginal elevation in isolation, with a normal CRP, normal ESR and no symptoms, is almost always a normal variant and does not suggest disease. His IgM is 0.4, just below the lower limit of 0.5. IgM is the first-responder antibody the immune system produces when it encounters a new infection. A mildly low IgM in isolation, with IgG and IgA normal and no history of recurrent infections, is a common normal variant seen in around 5 percent of healthy adults. It does not indicate immunodeficiency. Both are worth noting for the record so that if either moves further on a future test, there is a baseline to compare against.\n\nHis folate is 18, marginally above the upper limit of 17. Folate (vitamin B9) is a water-soluble B vitamin essential for DNA synthesis and red cell production. A level slightly above range simply means he is getting plenty from his diet or from fortified foods. There is no toxicity risk from dietary folate; the body excretes what it does not need. His B12 is 553, within the optimal range. His total antioxidant activity is 1.83, marginally above the upper limit of 1.77, which may reflect his supplementation with creatine and protein powder, dietary antioxidants, or the hard training itself driving adaptive antioxidant responses. This is not a concern.\n\nHis vitamin D is 55, which clears the sufficiency threshold of 50 but sits below the optimal range of 75 to 120. At his lean BMI of 23.1, fat sequestration is not a factor; this is likely a straightforward shortfall in sun exposure or dietary intake, common in the UK. A supplementation dose of 2,000 to 3,000 IU of vitamin D3 daily through the autumn and winter months would be expected to bring this into the optimal zone.\n\nHis prostate markers are clean. PSA is 0.39 with a free-to-total ratio of 51 percent, both entirely normal. Tumour markers CA19-9 and CEA are both undetectable. His urinalysis is clear: no protein, no glucose, no ketones, no blood, no white cells, no nitrites. Bacterial culture and sensitivities are pending.\n\nHis PhenoAge, a biological ageing score calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 38.9 against his calendar age of 41, meaning his blood markers suggest a body that is biologically about two years younger than his passport says. The markers driving this favourable gap are his very low CRP, healthy glucose, strong albumin and good white cell count. With the lifestyle adjustments in this report, particularly optimising vitamin D and maintaining the training, that gap should widen further.\n\nIn summary, this is a strong set of results from a healthy, active man. The modifiable risk factors are almost all optimal. The single finding that matters most is the Lp(a) at 153, because it is the one risk factor he cannot change through lifestyle, which makes it essential that his GP knows about it and that every other cardiovascular marker stays where it is or improves. The vitamin D needs topping up, the iron is worth rechecking fasted, and the CK and AST should be retested after a 72-hour training break to confirm the muscle explanation. Everything else is either optimal or close to it.","links":"The dominant finding in this report is the elevated Lipoprotein(a) at 153 nmol/L, a genetically fixed cardiovascular risk factor that cannot be modified by any lifestyle intervention. What makes this particularly important to understand is the contrast with every other cardiovascular marker. His ApoB at 0.74, his LDL at 2.5, his HDL at 1.8, his triglycerides at 0.97, and his hsCRP at 0.2 are all optimal. The Lp(a)-corrected LDL of 2.01 confirms that the portion of his LDL driven by diet and metabolism is right at the ideal threshold. This means the risk carried by his Lp(a) is not being amplified by anything else in his system. The cardiovascular risk score of 25 is being pulled up almost entirely by the Lp(a); without it, the score would sit comfortably below 20.\n\nThe second thread is the AST and CK elevation. His AST at 53 and CK at 664 form a coherent pattern: hard resistance training 3 times per week causes muscle fibre breakdown, CK leaks into the bloodstream, and because AST is present in both liver and muscle tissue, it follows. The liver-specific markers, GGT at 16, bilirubin at 11, albumin at 40, and the NAFLD fibrosis score at minus 2.63, are all clean. This is exercise-induced enzyme release, not liver disease. The slightly above-optimal ALT at 48 may have a small muscular contribution as well, though ALT is more liver-specific. A retest after 72 hours of rest from training would settle this definitively.\n\nThe third thread is the insulin and C-Peptide at the bottom of range. At first glance, a C-Peptide below the laboratory lower limit could suggest inadequate pancreatic insulin production, but the context excludes this completely. His fasting glucose is 4.6, his HbA1c is 37, and his HOMA-IR is 0.53, all of which show that his blood sugar control is excellent with minimal insulin. The pancreas is producing less insulin because less is needed. This is the metabolic signature of a lean, active, insulin-sensitive individual and is one of the strongest protective factors in the entire report.\n\nThe vitamin D at 55, while sufficient, is the one nutritional marker that is not yet optimal. Given his goals of disease prevention and longevity, pushing this into the 75 to 120 range is worthwhile because vitamin D plays roles in immune regulation, bone density, and possibly cardiovascular protection, all of which align with his stated aims.\n\nThe marginal immunoglobulin findings, IgA at 3.6 and IgM at 0.4, are isolated, asymptomatic, and very close to their respective limits. They do not connect to each other or to any other finding in the report. Their most likely explanation is normal biological variation. They are recorded here as a baseline.\n\nWhat has been positively excluded is as important as what was found. Thyroid disease, autoimmune thyroid disease, coeliac disease, diabetes, insulin resistance, significant liver disease, kidney disease, anaemia, iron deficiency, iron overload, B12 deficiency, folate deficiency, prostate pathology, systemic inflammation, and immunodeficiency have all been ruled out by this panel.","lifestyle":"Add 2,000 to 3,000 IU of vitamin D3 daily with your largest meal (which contains fat for absorption), paired with 100 mcg of vitamin K2 (MK-7). Anchor: next to your plate at dinner. Why: your vitamin D is 55, sufficient but below the 75 to 120 optimal range, and in the UK from October to March there is not enough UVB to make it through the skin.\nIncrease vegetables and fruit from 2 to 3 portions to at least 5 per day, adding one portion to lunch and one to dinner this week, then building. Aim for colour variety: dark greens, reds, oranges. Anchor: make it the first thing on your plate before the carbohydrate. Why: higher vegetable intake increases soluble fibre which binds cholesterol in the gut, provides potassium that supports kidney and blood pressure health, and broadens the antioxidant and micronutrient base your body draws from.\nInclude 2 to 3 portions of oily fish per week (salmon, mackerel, sardines, anchovies). If you already eat some, increase to this target. Anchor: plan two fish-based dinners at the start of the week. Why: omega-3 fatty acids lower triglycerides (yours are already excellent, so this is maintenance), reduce inflammation, and may help offset some of the risk carried by your Lp(a) by improving endothelial function.\nHit a daily protein target of 103 to 126 grams (1.3 to 1.6 grams per kilogram at 79 kg) spread across at least three meals, using the protein powder as a top-up rather than a replacement for whole-food protein. Anchor: a palm-sized portion of protein at every meal. Why: protein supports muscle repair after hard training (which explains the CK of 664), preserves lean mass as you age, and supports immune function.\nRest from resistance training for at least 72 hours before your next blood test to get a clean read on liver enzymes. Anchor: schedule the blood draw for Monday morning, with your last weights session on Thursday. Why: the AST at 53 and CK at 664 are almost certainly from training, and a rested sample will confirm it.\nMaintain your current calorie intake at approximately 2,500 to 2,700 kcal per day (maintenance TDEE for your weight, height and training load at a multiplier of around 1.6 to 1.7), which keeps you at your current lean BMI of 23.1. Why: your metabolic, insulin and inflammatory markers are all excellent at this body composition, so the goal is to hold it rather than cut.\nKeep daily steps at or above 7,500 and aim to push towards 10,000. Anchor: a 15-minute walk after lunch or dinner. Why: post-meal walking improves glucose disposal and adds low-grade cardiovascular work that complements your structured training.\nContinue the current sleep pattern of 6 to 7 hours if you genuinely wake refreshed, but if possible experiment with an extra 30 minutes (a 10pm bedtime instead of 10.30) for two weeks to see whether recovery and energy improve further. Anchor: a fixed lights-out time. Why: sleep is the primary recovery window, and at 6 hours you are at the lower boundary of what supports hard training.","flags":"Lipoprotein(a) 153 nmol/L, above the 32 nmol/L ideal and in the moderate risk category (90 to 200). This is a genetically fixed cardiovascular risk factor that deposits cholesterol, promotes clotting and drives arterial inflammation independently of LDL. It cannot be modified by lifestyle. First-degree relatives should be tested. GP should assess overall cardiovascular risk in context.\nCreatine Kinase 664 U/L, more than double the upper limit of 320, consistent with hard resistance training. AST 53 IU/L, above the upper limit of 45, likely muscular in origin given the CK elevation and clean GGT of 16. ALT 48 is within the laboratory range but above the male optimal of 30, and may have a minor muscular contribution. Recommend retesting after 72 hours rest from training to confirm.\nSerum Iron 33.9 umol/L, above the upper limit of 31.3, with transferrin saturation at 52.3 percent (within range but above optimal). Ferritin, transferrin and TIBC are normal. Single elevated serum iron is commonly a timing or meal artefact. Recommend rechecking on a fasting morning sample at next test.\nC-Peptide 1.03 ug/L (approximately 341 pmol/L), marginally below the laboratory lower limit of 1.1 ug/L, with fasting insulin at 2.6 (bottom of range). In the context of glucose 4.6, HbA1c 37 and HOMA-IR 0.53, this reflects appropriate low insulin production in a lean insulin-sensitive individual, not pancreatic insufficiency.\nIgA 3.6 g/L, marginally above the upper limit of 3.5. IgM 0.4 g/L, marginally below the lower limit of 0.5. Both isolated, asymptomatic, and likely normal variants. Recorded as baseline for future comparison.\nVitamin D 55 nmol/L, sufficient but below optimal range of 75 to 120. Supplementation recommended.\nMCH 32.5 pg (upper limit 32) and MCHC 347 g/L (upper limit 345) are marginally above range and represent laboratory variation, not pathology.\nFolate 18 ng/ml, marginally above the upper limit of 17. Reflects adequate dietary intake with no clinical significance.\nTotal Antioxidant Activity 1.83 mmol/L, marginally above the upper limit of 1.77. Likely reflects supplementation and training-driven antioxidant adaptation.\nReticulocyte absolute count 49.7, a fraction below the lower limit of 50, with reticulocyte percentage within range at 1.02. This is laboratory rounding and not clinically significant.\nReassuring negatives: thyroid function and antibodies normal, coeliac screen negative, PSA and tumour markers clean, kidney function excellent by cystatin C (eGFR 98), no diabetes or insulin resistance, no anaemia, no iron overload pattern, no systemic inflammation (CRP 0.2, ESR 4), no immunodeficiency, urinalysis clear.","recommendations":"Discuss the Lp(a) result of 153 nmol/L with your GP. Bring this report showing that all modifiable lipid markers are optimal (ApoB 0.74, LDL 2.5, HDL 1.8, triglycerides 0.97, hsCRP 0.2) and ask for a formal cardiovascular risk assessment that accounts for the Lp(a). Ask whether any additional risk reduction strategies are appropriate given your age and family history.\nHave your first-degree relatives (parents, siblings, and in due course children) tested for Lp(a), as it is inherited and early detection allows early risk management.\nRetest AST, ALT, CK and GGT after 72 hours of rest from resistance training. If AST normalises, the elevation is confirmed as muscular. If it remains elevated, the GP should investigate further.\nRecheck serum iron and transferrin saturation on a fasting morning sample at your next blood test to confirm whether the elevated serum iron was a timing artefact.\nNote the marginal IgA (3.6, upper limit 3.5) and IgM (0.4, lower limit 0.5) as a baseline. No action is needed now, but if either moves further outside range on a future test, the GP should reassess.\nSupplement vitamin D3 at 2,000 to 3,000 IU daily with vitamin K2 (MK-7) 100 mcg, recheck in 3 to 4 months to confirm the level has reached the 75 to 120 optimal range.\nRetest in 6 months with an Ultimate Male panel, specifically to recheck Lp(a) (to confirm the baseline), serum iron and transferrin saturation (fasted), AST and CK (rested), vitamin D (after supplementation), and IgA and IgM (trend). Daily calorie target: approximately 2,500 to 2,700 kcal. Protein target: 103 to 126 grams per day (1.3 to 1.6 g/kg).","supplementation":"Vitamin D3 (cholecalciferol): 2,000 to 3,000 IU daily, taken with your largest meal that contains fat. Why: your vitamin D is 55, below the optimal range of 75 to 120, and in the UK there is insufficient UVB from October to March to maintain levels through sun exposure alone.\nVitamin K2 (MK-7): 100 mcg daily, taken alongside vitamin D3. Why: K2 directs the calcium that vitamin D helps absorb into bones and teeth rather than into artery walls, which is particularly relevant given the Lp(a) finding and your goal of cardiovascular disease prevention.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 supports endothelial function and has anti-inflammatory properties. Your triglycerides and CRP are already excellent, so this is a maintenance and prevention dose, especially relevant alongside the elevated Lp(a).\nMagnesium glycinate: 300 mg before bed. Why: your serum magnesium is 0.91, within range but sitting in the middle of the optimal band. At your training volume (6 sessions per week at hard intensity), magnesium supports muscle recovery, sleep quality and blood pressure regulation. The glycinate form is well absorbed and less likely to cause gut disturbance.\nContinue creatine monohydrate at 3 to 5 grams daily. Why: creatine supports training performance and recovery, is well-studied for safety, and may have cognitive benefits. It does not affect kidney function despite raising creatinine slightly; your cystatin C confirms your kidneys are working perfectly.\nDO NOT supplement with iron. Your ferritin is 74, your transferrin saturation is already above optimal at 52 percent, and your serum iron is elevated. Additional iron supplementation could push stores into an unhealthy range.\nThe most important changes from this report are not supplements. They are increasing vegetable and fruit intake to at least 5 portions a day, including 2 to 3 portions of oily fish per week, recording the Lp(a) result and discussing it with your GP, and resting before your next blood test to get a clean read on the liver enzymes.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 72 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 72.2. Weakest systems: specialized tests 10%, lipids & cardiovascular 38%, iron studies 65%. Biggest drags: Lipoprotein(a), Creatine Kinase (CK), Transferrin Saturation, Vitamin D 25(OH).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"38.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4228","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 38.9 against a calendar age of 41, his blood markers suggest a body that is biologically about two years younger. The main drivers of this favourable gap are his very low CRP (0.2), healthy glucose (4.6), strong albumin (40) and normal white cell count (7.45). Continuing his current training and optimising vitamin D and vegetable intake should help maintain or widen this gap.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3125","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built in the arteries right now, not a ten-year event probability. At 25, this is within the acceptable range below 40 but above the 20 ideal threshold. The score is being driven almost entirely by the Lp(a) at 153; every other input is optimal. At 41, his ten-year cardiovascular event risk remains low, but the gap between the score and the ten-year risk is the window for acting.","low_causes":"Optimal lipids, low inflammation, excellent metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. At 4.6, this sits comfortably within the optimal range of 4.0 to 5.4, indicating that his body is regulating blood sugar efficiently. Combined with his excellent HbA1c and low insulin, this confirms strong metabolic health.","low_causes":"Fasting, excessive exercise, insulin overproduction, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6179","units":"%","description":"HbA1c measures the percentage of haemoglobin that has been glycated (coated with sugar) over the past two to three months, giving a longer-term picture of blood sugar control than a single fasting glucose reading. At 5.5%, this is well below the 6.0% pre-diabetes threshold, confirming healthy blood sugar regulation over the past quarter.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, high sugar intake, sedentary lifestyle, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol. At 37, it is within the normal range (below 42) but just above the optimal threshold of 36. This is a very minor margin and in the context of a fasting glucose of 4.6 and a HOMA-IR of 0.53, it does not indicate any meaningful glycaemic issue. It may reflect the higher carbohydrate content of his diet.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, high sugar intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5754","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. At 2.6, sitting right at the bottom of the laboratory range, this shows that his cells are highly responsive to insulin so the pancreas barely needs to work. In a lean, active man with a normal fasting glucose, low insulin is a positive marker of excellent insulin sensitivity, not a sign of pancreatic underperformance.","low_causes":"High insulin sensitivity (positive), low carbohydrate intake, very lean body composition","high_causes":"Insulin resistance, obesity, high carbohydrate diet, polycystic ovary syndrome, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3121","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a molecule released by the pancreas in equal measure to insulin. It confirms how much insulin the body is actually producing. At 1.03 ug/L (approximately 341 pmol/L), this is marginally below the laboratory lower limit of 1.1. However, in the context of a fasting glucose of 4.6, an HbA1c of 37 and a HOMA-IR of 0.53, this simply confirms that the pancreas is making a small and entirely appropriate amount of insulin because that is all this insulin-sensitive body requires. This is a sign of metabolic health, not pancreatic insufficiency.","low_causes":"High insulin sensitivity (in context of normal glucose), exogenous insulin use, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into the average blood sugar level over the past two to three months. At 6.2 mmol/L, this sits right at the optimal threshold, confirming healthy blood sugar regulation over time.","low_causes":"Very low carbohydrate diet, frequent intense exercise, haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4648","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG (triglyceride-glucose) index is a surrogate marker of insulin resistance calculated from fasting triglycerides and glucose. At 8.18, this is within the optimal range, consistent with the excellent HOMA-IR and confirming insulin sensitivity.","low_causes":"High insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"52.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5952","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation shows what proportion of the iron-carrying protein transferrin is currently loaded with iron. At 52.3%, this is within the laboratory range of 18 to 55% but above the optimal band of 25 to 40%. In the context of a normal ferritin (74) and normal transferrin (2.58), this is likely driven by the elevated serum iron on this sample rather than an iron overload condition. Worth rechecking on a fasting morning sample.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, recent iron-rich meal, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"33.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7159","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3740","upper_optimal_position":"0.6106","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the draw. At 33.9, this is above the upper limit of 31.3. Serum iron is one of the most variable markers in the panel: it fluctuates with meals (especially red meat), time of day (higher in the morning), and even inflammation. A single elevated reading with normal ferritin, normal transferrin and normal TIBC does not indicate iron overload. It should be rechecked on a fasting morning sample at the next test to confirm.","low_causes":"Iron deficiency, chronic disease, vegetarian diet, heavy exercise, blood loss","high_causes":"Haemochromatosis, iron supplementation, recent iron-rich meal, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to where it is needed. At 2.58, this sits within the optimal range, confirming that the body's iron transport system is functioning normally. A normal transferrin alongside the elevated serum iron helps rule out haemochromatosis, where transferrin is typically low because the body is overwhelmed with iron.","low_causes":"Haemochromatosis, liver disease, malnutrition, chronic inflammation","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"umol/L","description":"Total Iron Binding Capacity measures how much iron the blood could carry if all the transferrin were fully loaded. At 62, this is well within the optimal range, indicating a normal capacity for iron transport. In iron overload conditions, TIBC tends to fall because the body downregulates its iron-carrying capacity; a normal TIBC here is reassuring.","low_causes":"Haemochromatosis, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4056","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3933","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the storage form of iron. Think of it as the body's iron savings account: a low level means stores are depleted, a very high level can mean iron overload or inflammation. At 74, this is within the optimal range of 50 to 200 for men, indicating healthy iron stores that are neither depleted nor excessive.","low_causes":"Iron deficiency, vegetarian diet, blood loss, heavy exercise, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"158","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 158, this sits comfortably within the optimal range for men, confirming there is no anaemia and oxygen delivery is healthy.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, smoking, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4567","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^12/L","description":"Red blood cell count measures the total number of oxygen-carrying cells in the blood. At 4.87, this is within the optimal range, confirming healthy red cell production from the bone marrow.","low_causes":"Anaemia, nutritional deficiency, bone marrow suppression, chronic disease","high_causes":"Dehydration, polycythaemia, smoking, testosterone use, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit (HCT)","group":"HEMATOLOGY","result":"0.456","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5200","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is occupied by red cells. At 0.456 (45.6%), this is within the optimal range, meaning the blood has a healthy balance between red cells and plasma for efficient oxygen delivery.","low_causes":"Anaemia, overhydration, blood loss, nutritional deficiency","high_causes":"Dehydration, polycythaemia, smoking, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"HEMATOLOGY","result":"13.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5048","lower_normal":"11.5","upper_normal":"15","lower_optimal ions, medications, autoimmune conditions, liver disease, bone marrow disorders","high_causes":"Inflammation, infection, iron deficiency, post-surgery, certain cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume (MPV)","group":"HEMATOLOGY","result":"8.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6111","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. At 8.8, this is within the optimal range, indicating normal platelet turnover.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Increased platelet destruction, inflammation, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"7.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's army. The total count reflects the body's overall immune readiness. At 7.45, this is within the optimal range, indicating a healthy, active immune system without signs of infection or suppression.","low_causes":"Viral infections, bone marrow suppression, autoimmune conditions, low energy availability","high_causes":"Infection, inflammation, stress, smoking, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"4.37","within_normal":"TRUE","within_opti
