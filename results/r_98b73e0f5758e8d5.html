L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Kellie's result of 69 IU/L is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5816","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3757","upper_optimal_position":"0.5816","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. Kellie's result of 52 U/L is within the laboratory range but slightly above the optimal ceiling of 50. This marginal finding is not a concern and does not suggest pancreatic problems, particularly with amylase within range.","low_causes":"Generally not clinically significant","high_causes":"Pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5706","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL (protective), LDL (atherogenic) and VLDL. Kellie's result of 5.9 mmol/L is above the desirable threshold of 5.18. However, total cholesterol is a poor summary metric because it includes HDL, and Kellie's excellent HDL of 2.1 accounts for 35.6% of her total cholesterol. The more meaningful markers are LDL, ApoB and Lp(a), discussed elsewhere in this report.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3059","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood, mainly from dietary carbohydrates and fats. Kellie's result of 1.04 mmol/L is within the laboratory range and very close to the optimal ceiling of 1.0. This is a good result that reflects adequate metabolic handling of dietary fats and carbohydrates.","low_causes":"Low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate or sugar diet, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3013","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. Kellie's result of 0.47 mmol/L is within the optimal range, reflecting good triglyceride metabolism.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6731","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. Kellie's result of 2.1 mmol/L is well above the optimal threshold of 1.6 for a woman, and this is an excellent result. High HDL provides meaningful cardiovascular protection and partially offsets the risk from her elevated LDL and Lp(a).","low_causes":"Sedentary lifestyle, smoking, obesity, high carbohydrate diet, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5650","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL is the cholesterol particle that deposits cholesterol into artery walls when present in excess. Kellie's result of 3.39 mmol/L is above the upper limit of 3.0 and above the optimal of 2.6. With her Lp(a) at 135, approximately 0.44 mmol/L of this LDL reading is carried on Lp(a) particles and is not modifiable. The Lp(a)-corrected LDL of 2.95 represents the portion that can be reduced through diet and, if needed, medication. This modifiable LDL still needs to come down, ideally below 2.0, given the Lp(a) risk.","low_causes":"Hyperthyroidism, malnutrition, very low fat diet","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3122","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC:HDL ratio divides total cholesterol by HDL cholesterol. A lower number is better. Kellie's ratio of 2.81 is well within the optimal range thanks to her excellent HDL of 2.1. This ratio is one of the more reassuring metrics in her lipid panel.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"35.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5932","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of protective HDL. At 35.6%, more than a third of Kellie's total cholesterol is the beneficial type. This is an excellent result, with anything above 25% considered optimal.","low_causes":"Low HDL, sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Excellent HDL levels, regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol in one number. Kellie's result of 3.8 mmol/L is within the laboratory range of below 4.0 but above the optimal of 3.0. This reflects the elevated LDL and includes the Lp(a)-carried cholesterol.","low_causes":"Very low LDL, low triglycerides","high_causes":"Elevated LDL, elevated triglycerides, elevated Lp(a), high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6607","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the number of protective cholesterol carriers. Kellie's result of 1.85 g/L is well above the 1.4 threshold, confirming that her HDL particle number is high and genuinely protective.","low_causes":"Sedentary lifestyle, smoking, genetic factors, metabolic syndrome","high_causes":"Regular exercise, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein that sits on every LDL, VLDL and Lp(a) particle. It is the single best measure of how many atherogenic (artery-damaging) particles are circulating. Kellie's result of 1.2 g/L is above the target of 0.9 and classified as high. With her Lp(a) at 135 nmol/L, the ApoB target should ideally be below 0.7 to compensate for the inherited risk. Dietary changes, specifically increasing soluble fibre, reducing saturated fat, and eating oily fish twice a week, are the first step. If these are insufficient after four to six months, statin therapy should be discussed with the GP.","low_causes":"Hyperthyroidism, malnutrition, very low fat diet","high_causes":"Elevated LDL, elevated Lp(a), high saturated fat diet, genetic factors, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aporatio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.648649","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5405","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio summarises the balance between atherogenic and protective particles. A ratio below 0.6 is lower risk for women. Kellie's ratio of 0.65 places her in the average risk category (0.6 to 0.8). The ratio is driven by the elevated ApoB (1.2) partly offset by the excellent ApoA1 (1.85). Reducing ApoB through diet and potentially medication will bring this ratio into the ideal range.","low_causes":"Low LDL, high HDL, healthy lipid profile","high_causes":"Elevated ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"135.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined cholesterol particle that deposits cholesterol into artery walls more aggressively than ordinary LDL, promotes blood clot formation, and drives local inflammation. Unlike LDL, Lp(a) levels are almost entirely determined by genetics and cannot be meaningfully changed by diet, exercise or most medications. Kellie's result of 135 nmol/L is well above the normal threshold of 32 and places her in the moderate risk category (90 to 200). This is a permanent part of her medical record. It means every other modifiable cardiovascular risk factor, particularly ApoB, LDL, blood pressure and CRP, should be driven to lower targets than usual. First-degree relatives should be offered Lp(a) testing.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited), cannot be changed by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4571","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"U/L","description":"CK is an enzyme released when muscle cells are damaged or stressed. Kellie's result of 73 U/L is within the optimal range, confirming no significant muscle damage. This is useful baseline information, particularly if statin therapy is discussed in the future, as statins can sometimes raise CK.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin therapy, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5223","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the main hormone produced by the thyroid gland, available in the bloodstream to be converted into the active form (T3). Kellie's result of 17.8 pmol/L is within the optimal range of 14 to 20, confirming that the thyroid is currently producing adequate hormone despite the elevated TSH and positive TPO antibodies.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5271","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4392","upper_optimal_position":"0.5546","units":"mIU/L","description":"TSH is the signal the pituitary gland in the brain sends to the thyroid to produce more hormone. A higher TSH means the brain is pushing harder to get the thyroid to keep up. Kellie's result of 3.12 mIU/L is within the laboratory range but above the optimal ceiling of 2.5. In isolation this would be a minor finding, but combined with her positive TPO antibodies, it suggests the early stages of autoimmune thyroid disease where the immune system is beginning to damage thyroid tissue, requiring the brain to push a little harder. Annual monitoring is recommended.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use for energy, temperature regulation and metabolism. Kellie's result of 5.3 pmol/L is within the optimal range of 4.5 to 6.5, confirming that her body is converting T4 to T3 effectively. This is reassuring and means that despite the autoimmune process, thyroid function is currently maintained.","low_causes":"Hypothyroidism, low T4, poor conversion, severe illness, low calorie intake","high_causes":"Hyperthyroidism, thyroiditis, excessive T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"TPO Antibodies","group":"THYROID","result":"66.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are proteins produced by the immune system that attack the thyroid gland. Their presence is the hallmark of autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Kellie's result of 66.6 U/mL is nearly five times the upper limit of 13.8, confirming a significant autoimmune process directed at the thyroid. Combined with her TSH of 3.12 drifting above optimal, this suggests early Hashimoto's. The thyroid is coping for now (FT4 and FT3 are both in the optimal range), but over time the antibodies may damage enough tissue to cause overt hypothyroidism. Given that Kellie already has rheumatoid arthritis, this second autoimmune condition fits the pattern of autoimmune clustering. Annual thyroid monitoring is recommended.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"U/mL","description":"Thyroglobulin antibodies are a second type of thyroid autoantibody. Kellie's result of below 1.3 U/mL is well within the normal range and negative. While her TPO antibodies are significantly elevated, negative thyroglobulin antibodies mean only one of the two thyroid antibody types is positive. TPO antibodies alone are sufficient to suggest autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.298","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4640","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts T4 (the storage form) into T3 (the active form). Kellie's ratio of 0.298 is within the optimal range, confirming good conversion. This is reassuring in the context of her positive TPO antibodies, as poor conversion would suggest the thyroid was struggling further.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"112","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7467","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1.0","units":"nmol/L","description":"Vitamin D is essential for bone health, immune regulation, mood and muscle function. Kellie's result of 112 nmol/L is within the optimal range of 75 to 120, reflecting effective supplementation. This is a positive finding, particularly important given her rheumatoid arthritis (vitamin D supports immune regulation), post-menopausal status (bone health) and prednisolone use (which can reduce bone density).","low_causes":"Insufficient sun exposure, low dietary intake, malabsorption, obesity, dark skin","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.018","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3370","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4253","upper_optimal_position":"0.5587","units":"pmol/L","description":"PTH is produced by the parathyroid glands to regulate calcium levels in the blood. When calcium or vitamin D are low, PTH rises to pull calcium from the bones. Kellie's PTH at 1.018 pmol/L is at the very bottom of the range, which makes physiological sense: with her excellent vitamin D (112) and good calcium (2.54), the parathyroid glands do not need to work hard. This is a reassuring finding for bone health.","low_causes":"Good vitamin D and calcium status, hypoparathyroidism","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"692","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5452","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.6155","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Kellie's result of 692 pg/mL is within the optimal range of 500 to 900, confirming her B vitamin supplementation is maintaining healthy levels. Good B12 status supports energy production and cognitive function.","low_causes":"Vegan or vegetarian diet, malabsorption, pernicious anaemia, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7857","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and neural function. Kellie's result of 22 ng/mL is above the upper limit of 17, driven by her B vitamin supplementation. Excess folate is water-soluble and excreted by the kidneys, so this elevation is not harmful. No change to supplementation is needed; the current dose is maintaining a healthy level.","low_causes":"Poor dietary intake, malabsorption, alcohol excess, certain medications, coeliac disease","high_causes":"Supplementation, high dietary intake of fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"516","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5482","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5830","units":"nmol/L","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. Kellie's morning cortisol of 516 nmol/L is within the morning reference range but above the optimal ceiling of 500. Importantly, the laboratory notes that prednisolone can cause falsely elevated cortisol results, meaning this number cannot be reliably interpreted while she is on corticosteroid therapy. Her true cortisol level may be lower.","low_causes":"Adrenal insufficiency, pituitary disease, long-term corticosteroid use (suppression)","high_causes":"Stress, corticosteroid use (cross-reactivity), Cushing's syndrome, sleep deprivation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"80","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4476","lower_normal":"0","upper_normal":"118.2","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4742","upper_optimal_position":"0.6154","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. In post-menopausal women on HRT, this level reflects the replacement dose. Kellie's result of 80 pmol/L falls within the post-menopausal reference range and suggests a modest level of replacement. If her symptoms of fatigue, brain fog, joint stiffness and low energy are not adequately controlled, it may be worth discussing with her HRT prescriber whether the dose or delivery could be optimised to achieve a higher oestradiol level.","low_causes":"Menopause, low HRT dose, ovarian failure, anorexia","high_causes":"HRT, pregnancy, ovarian hyperstimulation, oestrogen-producing tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4370","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6195","units":"nmol/L","description":"Progesterone is a hormone that in pre-menopausal women rises after ovulation. In post-menopausal women, it is expected to be low. Kellie's result of 0.76 nmol/L is within the post-menopausal reference range and is entirely normal for her status.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Pregnancy, luteal phase, progesterone supplementation, ovarian cysts","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"39.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5177","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"LH is a pituitary hormone that stimulates the ovaries. In post-menopausal women, LH rises because the ovaries are no longer producing enough hormones to suppress it. Kellie's result of 39.94 mIU/mL is within the post-menopausal reference range, confirming her menopausal status.","low_causes":"HRT suppression, pituitary disease, anorexia","high_causes":"Menopause, premature ovarian failure, PCOS (midcycle)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"121.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"FSH is a pituitary hormone that stimulates the ovaries to produce oestrogen and eggs. In menopause, FSH rises significantly because the ovaries are no longer responding. Kellie's result of 121.42 mIU/mL is above the post-menopausal upper limit of 116.3, confirming established menopause. The fact that FSH remains very high despite HRT tells us that the HRT is not fully suppressing the menopausal hormonal drive, which is common and not a concern in itself, but supports the possibility that her HRT dose could be optimised.","low_causes":"HRT suppression, pregnancy, pituitary disease, anorexia","high_causes":"Menopause, premature ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333333333","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone is not just a male hormone; it plays important roles in women for energy, mood, libido, muscle maintenance, bone density and cognitive function. Kellie's result of 0.5 nmol/L is at the very bottom of the female reference range. Combined with her very low free testosterone and low DHEA-S, this pattern may be contributing to her fatigue, brain fog and reduced capacity for physical recovery. Testosterone supplementation alongside HRT is increasingly offered for women with these symptoms.","low_causes":"Menopause, adrenal insufficiency, corticosteroid use, ageing, low DHEA-S","high_causes":"PCOS, adrenal hyperplasia, androgen-producing tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333333333","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates how much testosterone is biologically available by accounting for SHBG binding. Kellie's FAI of 0.5 is at the very bottom of the range, driven by both low total testosterone and high SHBG (99.2). This confirms very little testosterone is available for her tissues to use.","low_causes":"Low testosterone, high SHBG, menopause, oral HRT","high_causes":"PCOS, excess androgen production, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA-S","group":"HORMONES","result":"0.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3370","lower_normal":"0.26","upper_normal":"11","lower_optimal":"1.0","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4023","upper_optimal_position":"0.5619","units":"umol/L","description":"DHEA-S is a precursor hormone produced by the adrenal glands that the body converts into both testosterone and oestrogen. Kellie's result of 0.3 umol/L (equivalent to approximately 111 ug/dL) is at the very bottom of the range and well below optimal. DHEA-S naturally declines with age, but at 55 this level is lower than expected. Chronic corticosteroid use (prednisolone) can suppress adrenal hormone production, which may be contributing. Low DHEA-S alongside low testosterone and low free testosterone creates a pattern of androgen deficiency that may explain some of her fatigue, brain fog and reduced resilience.","low_causes":"Ageing, adrenal suppression from corticosteroids, adrenal insufficiency","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"417","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5663","lower_normal":"38","upper_normal":"430","lower_optimal":"50","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3561","upper_optimal_position":"0.6490","units":"uIU/mL","description":"Prolactin is a pituitary hormone best known for its role in breast milk production. In post-menopausal women, it is expected to be lower. Kellie's result of 417 uIU/mL is within the post-menopausal range of 38 to 430, at the higher end but within range.","low_causes":"Pituitary hypofunction","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"99.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5690","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4359","upper_optimal_position":"0.5583","units":"nmol/L","description":"SHBG is a protein that binds to sex hormones (testosterone, oestradiol) in the blood, making them unavailable to tissues. Kellie's SHBG at 99.2 nmol/L is within the laboratory range but above the optimal ceiling of 90. High SHBG means more of her already low testosterone is being bound up, reducing the amount available to tissues. This contributes to the very low free testosterone (0.004) and free androgen index (0.5). SHBG tends to rise with age, oral HRT and low body weight.","low_causes":"Obesity, insulin resistance, hypothyroidism, androgen excess","high_causes":"Ageing, oral HRT, low body weight, hyperthyroidism, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.004","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1222","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.015","upper_optimal":"0.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"nmol/L","description":"Free testosterone is the small fraction of testosterone not bound to proteins, and therefore available for the body to use. Kellie's result of 0.004 nmol/L is below the lower limit of 0.01, meaning very little testosterone is reaching her tissues. This is driven by both low total testosterone (0.5, bottom of range) and high SHBG (99.2) binding what little there is. Free testosterone is important for energy, cognitive function, libido, muscle maintenance and bone density. Her very low level may be contributing to several of her reported symptoms and is worth discussing with her HRT prescriber.","low_causes":"Low total testosterone, high SHBG, menopause, corticosteroid use, ageing","high_causes":"PCOS, low SHBG, androgen-producing tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailablet // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
