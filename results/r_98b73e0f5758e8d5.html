<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kellie Mackenzi","dob":"01/05/1971","report_date":"2026-09-26","summary":"Kellie is a 55-year-old female presenting with a BMI of 20.4, following a standard mixed diet rated 3 out of 10 for quality with a volume of 4 out of 10. She does not currently do any structured cardio or resistance training but walks 10,000 to 15,000 steps a day. She takes HRT and corticosteroids (prednisolone) for rheumatoid arthritis, and supplements with omega oils, vitamin D, B vitamins and magnesium glycinate. She reports sleeping fewer than six hours most nights. She reports low energy and fatigue, joint pain and stiffness, and brain fog. Her goals are to reduce stress and anxiety, improve energy levels, and improve long-term health and longevity.\n\nThis report contains one finding that should go to Kellie's GP as a priority. Her Lp(a), which is lipoprotein(a), a genetically inherited particle that carries cholesterol into artery walls and promotes clotting, is 135 nmol/L. The threshold for normal is below 32. At 135 she sits in the moderate-risk category, and because Lp(a) is entirely inherited and does not change with diet, exercise or lifestyle, this is a permanent part of her medical record. Her GP needs to know this number because it changes the way every other cardiovascular risk factor is managed: the thresholds for treating LDL cholesterol and ApoB become lower, blood pressure control becomes more important, and first-degree relatives should be offered testing. What Lp(a) does is deposit cholesterol into the artery wall more aggressively than ordinary LDL, encourage small clots to form, and drive local inflammation, all of which accelerate plaque formation over decades. It cannot be lowered by anything Kellie can do herself, but its impact can be blunted by getting every modifiable risk factor as low as possible, and that is where the rest of the lipid story matters.\n\nHer ApoB, which is the protein that sits on every LDL particle and is the single best measure of how many cholesterol-carrying particles are in the bloodstream, is 1.2 g/L against a target of below 0.9. With an Lp(a) this high, the ideal ApoB target drops further, to below 0.7. Her LDL cholesterol is 3.39 against an ideal of below 2.6, and the Lp(a)-corrected LDL, which strips out the cholesterol carried on the Lp(a) particles themselves, is 2.95, still above the 2.0 optimal target but showing that roughly 0.44 mmol/L of the LDL reading is Lp(a)-driven and not modifiable. The remaining 2.95 is modifiable through diet and, if needed, medication. Her cardiovascular risk score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 95 out of 100, which is very high. This is not a ten-year event probability; it measures the amount of risk being built right now, and the Lp(a) is the largest single driver. But three other inputs are also contributing and those can be changed. The positive side of her lipid panel deserves recognition: her HDL cholesterol is 2.1, which is excellent and strongly protective, her triglycerides are 1.04, well controlled, her ApoA1 is 1.85, well above the 1.4 floor, and her TC:HDL ratio is 2.81, which is low risk. These are genuinely good numbers and they mean the modifiable part of her cardiovascular profile responds well to the right interventions.\n\nHer inflammatory markers tell an important story in the context of her rheumatoid arthritis. Her ESR, erythrocyte sedimentation rate, which measures how quickly red cells settle in a tube and rises with systemic inflammation, is 60 mm/hour against an upper limit of 12. Her hs-CRP, high-sensitivity C-reactive protein, which is a liver-produced protein that rises in response to inflammation anywhere in the body, is 7.1 mg/L against an upper limit of 5, with an optimal below 1.0. Her rheumatoid factor, an antibody associated with autoimmune joint disease, is above 90 IU/mL against an upper limit of 14. Together these three results confirm that her rheumatoid arthritis is active and generating significant systemic inflammation despite the prednisolone. This matters beyond the joints: chronic inflammation at this level accelerates cardiovascular disease, drives fatigue and brain fog, suppresses red blood cell production (which may be contributing to her low reticulocyte count), and makes it harder for the body to recover from daily activity. Her GP or rheumatologist should review whether the current treatment is adequately controlling the disease, because these markers suggest it may not be.\n\nHer ESR at 60 also provides context for another finding. Her transferrin, the protein that carries iron in the blood, is 2.31 g/L against a lower limit of 2.5. Transferrin is what is called a negative acute-phase protein, meaning the liver reduces its production when inflammation is high. With an ESR of 60 and a CRP of 7.1, the low transferrin is almost certainly inflammation-driven rather than reflecting an iron metabolism problem. Her ferritin at 28 is within the laboratory range of 10 to 291 but below the optimal of 40 for a woman, and in the presence of active inflammation, ferritin can be falsely normal or even elevated because it is itself an acute-phase protein. This means her true iron stores may be lower than 28 suggests. Her transferrin saturation at 20.5% is just above the lower limit of 18%, which is consistent with functional iron restriction, where there is enough iron in storage but it is not being effectively mobilised for red cell production. Her absolute reticulocyte count, which measures how many new red blood cells the bone marrow is releasing, is 32.7 against a lower limit of 50, confirming that red cell production is indeed suppressed. Her haemoglobin at 123 is within range but at the lower end. Her haematocrit, which is the proportion of blood made up of red cells, is 0.359, fractionally below the lower limit of 0.36. Taken together, this is a pattern called anaemia of chronic disease, where ongoing inflammation suppresses iron availability and red cell production without the classic signs of iron deficiency. This is very likely contributing to her fatigue and low energy. Her GP should be aware that the iron panel needs interpreting in the context of her inflammatory state, and a trial of gentle iron supplementation may help if her rheumatologist agrees, but the primary solution is better control of the underlying inflammation.\n\nHer lymphocyte count at 3.52 is mildly above the upper limit of 3.0. In the context of active rheumatoid arthritis and significant inflammation, a mildly elevated lymphocyte count is expected as part of the immune activation driving the disease. It does not suggest a separate problem but is worth noting for context.\n\nHer blood sugar results present an interesting picture. Her fasting glucose at 4.5 is excellent, sitting well within the optimal range. Her fasting insulin at 3.45 is within range and her HOMA-IR, which estimates insulin resistance from the relationship between glucose and insulin, is 0.69, which is optimal and means she is very insulin-sensitive. However, her HbA1c, which measures average blood sugar over the preceding two to three months by looking at how much sugar has attached to her red blood cells, is 43 mmol/mol, one point above the pre-diabetes threshold of 42. This appears contradictory: excellent fasting glucose and insulin sensitivity alongside a borderline HbA1c. There are two likely explanations. First, prednisolone is well known to raise blood sugar, particularly after meals, even when fasting glucose remains normal. Kellie's fasting glucose is fine, but the prednisolone may be causing post-meal glucose spikes that the HbA1c is picking up over time. Second, her low red cell production (reticulocytes at 32.7) means her red blood cells are circulating for longer than usual before being replaced, which gives sugar more time to attach to them and can artificially inflate the HbA1c reading. Both mechanisms may be contributing. This is not diabetes, and with a HOMA-IR of 0.69 there is no underlying metabolic dysfunction, but the GP should be aware because prednisolone-related glucose excursions deserve monitoring. Her C-peptide at 1.1 ug/L (364 pmol/L) is at the very bottom of the reference range, which is consistent with low insulin demand in someone who is lean and insulin-sensitive.\n\nHer thyroid needs attention. Her TSH, thyroid stimulating hormone, which is the signal the brain sends to the thyroid gland to produce more hormone, is 3.12 mIU/L. This is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5, meaning the brain is having to push a little harder than ideal to get the thyroid to produce enough hormone. Her free T4, the main hormone the thyroid produces, is 17.8, comfortably within the ideal range, and her free T3, the active form the body converts T4 into, is 5.3, also within the ideal range. So the thyroid is still producing adequately for now. However, her thyroid peroxidase antibodies (TPO antibodies) are 66.6 U/mL against an upper limit of 13.8. TPO antibodies are proteins the immune system produces that attack the thyroid gland, and when they are elevated alongside a TSH that is drifting upward, this pattern is associated with a condition called Hashimoto's thyroiditis, an autoimmune inflammation of the thyroid. Her thyroglobulin antibodies are negative at below 1.3, which means one of the two thyroid antibody types is negative, but positive TPO antibodies alone are sufficient to suggest autoimmune thyroid disease. Given that Kellie already has one autoimmune condition, rheumatoid arthritis, having a second is more common than it would be in the general population, because autoimmune conditions tend to cluster. Her TSH is not yet high enough to require medication, and her actual hormone levels are good, but this needs monitoring because over time the antibodies may damage enough thyroid tissue to push the TSH higher and the hormones lower. Her GP should record the TPO antibody result and recheck TSH and FT4 annually. If her fatigue, brain fog or energy levels worsen, a repeat thyroid panel sooner would be warranted. It is also worth noting that an underactive thyroid slows the clearance of LDL cholesterol from the bloodstream, so if her thyroid function does decline, it could worsen her lipid profile further.\n\nHer hormonal picture confirms she is post-menopausal. Her FSH at 121 mIU/mL is well above the 40 threshold that confirms menopause, and her LH at 39.9 is in the post-menopausal range. She is on HRT, and her oestradiol at 80 pmol/L falls within the post-menopausal reference range of 0 to 118, suggesting the HRT is providing some oestrogen replacement but at a relatively modest level. If her symptoms of fatigue, brain fog and joint stiffness are not adequately controlled, it may be worth discussing with her HRT prescriber whether the dose or delivery method could be optimised. Her total testosterone at 0.5 nmol/L is at the very bottom of the female reference range, and her free testosterone, which is the portion not bound to proteins and therefore available to tissues, is 0.004 nmol/L, below the lower limit of 0.01. Her SHBG, sex hormone binding globulin, is 99.2, which is at the higher end and is binding most of the small amount of testosterone she produces. Her bioavailable testosterone is 0.08, within the laboratory range but below the optimal of 0.12. Her DHEA-S, a precursor hormone produced by the adrenal glands, is 0.3 umol/L (110.6 ug/dL), which is at the very bottom of the range and low for age. Low free testosterone and low DHEA-S together may be contributing to her fatigue, brain fog, joint stiffness and reduced capacity for muscle recovery. These are worth discussing with her HRT prescriber as testosterone supplementation is increasingly offered alongside HRT for women with these symptoms. Her progesterone at 0.76 nmol/L is consistent with post-menopausal status and not a concern. Her prolactin at 417 is within the post-menopausal range. Her cortisol at 516 nmol/L is within the morning reference range but the lab notes that prednisolone can cause falsely elevated cortisol results, so this number cannot be reliably interpreted while she is taking corticosteroids.\n\nHer liver is in excellent health. Her ALT at 15 and GGT at 13 are both well within the optimal range, her bilirubin at 7 is normal, her albumin at 35 is just above the lower limit, her FIB-4 score at 0.83 rules out any liver scarring, and her APRI at 0.146 confirms no fibrosis. This is reassuring, particularly given that she is on long-term prednisolone which can sometimes affect the liver. Her amylase at 69 and lipase at 52 are both within range, confirming her pancreas is healthy.\n\nHer kidney function is adequate but worth monitoring. Her creatinine-based eGFR is 84, her cystatin C-based eGFR is 79, and the combined eGFR is 79 mL/min. All three sit below the optimal threshold of 90. At 55, some decline from peak kidney function is expected, and these numbers are within the normal range, but they are not optimal. Her prednisolone and the chronic inflammation from rheumatoid arthritis can both affect kidney function over time, so annual monitoring is sensible. Her urea, creatinine, sodium, potassium, chloride and bicarbonate are all within range, and her uric acid at 236 is within the optimal range for a woman.\n\nHer vitamin D at 112 nmol/L is excellent and within the optimal range of 75 to 120, reflecting her supplementation. Her B12 at 692 is healthy, well within the optimal range, supported by her B vitamin supplements. Her folate at 22 ng/mL is above the upper limit of 17, which is likely from her B vitamin supplementation and is not a concern at this level; the body excretes excess folate in urine. Her magnesium at 0.92 is within the optimal range of 0.85 to 1.05, confirming her magnesium glycinate supplement is doing its job. Her corrected calcium at 2.54 is within the ideal range. Her PTH at 1.018 is at the very bottom of the range, which makes sense given her good calcium and vitamin D levels; the parathyroid glands do not need to work hard when both are well supplied.\n\nHer total antioxidant activity at 1.87 is above the upper limit of 1.77, which is driven by her supplementation with omega oils and vitamins. This is not a concern.\n\nHer immune markers are healthy where they should be. Her IgG, IgA, IgM and IgE are all within range, and her coeliac screen (tissue transglutaminase IgA) is negative, which rules out coeliac disease as a contributor to her symptoms. Her tumour markers, CA125 at 8.7, CA15-3 at 18.35, CA19-9 at 10.58 and CEA at 0.77, are all comfortably within range, which is reassuring. Her urinalysis is clean, with no protein, glucose, blood or signs of infection. The bacterial count and culture are pending.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 50.3, about 5 years younger than a calendar age of 55. Her creatine kinase at 73 is within range, confirming no significant muscle damage.\n\nIn terms of what is driving Kellie's symptoms of fatigue, brain fog and joint stiffness, the bloods provide several plausible contributors. The active rheumatoid arthritis with an ESR of 60 and CRP of 7.1 is the most powerful driver of fatigue and brain fog; systemic inflammation at this level is exhausting for the body. The functional iron restriction with low reticulocytes means she is not producing red blood cells as efficiently as she should be. The very low free testosterone and DHEA-S reduce her capacity for energy, mental clarity and tissue repair. The emerging thyroid autoimmunity, while not yet causing overt hypothyroidism, may be contributing. And the sleep restriction of fewer than six hours most nights is profoundly important: even with perfect blood results, fewer than six hours of sleep consistently impairs energy, cognitive function, immune regulation, pain perception and mood. The sleep is the one factor she can begin to change tonight, and it is likely to produce the most noticeable improvement in how she feels day to day.","links":"The central thread running through Kellie's results is autoimmune inflammation and its downstream effects. Rheumatoid arthritis is driving an ESR of 60 and a CRP of 7.1, and these in turn are suppressing transferrin (2.31, below range), restricting iron availability (saturation 20.5%, borderline), and reducing red blood cell production (absolute reticulocytes 32.7, below range). This is the classic pattern of anaemia of chronic disease, and it explains a significant portion of her fatigue and low energy. Her haemoglobin at 123 and haematocrit at 0.359 are both at or just below their lower limits, consistent with this picture. The rheumatoid factor above 90 confirms seropositive rheumatoid arthritis, and the fact that inflammatory markers remain elevated despite prednisolone suggests the disease is not optimally controlled.\n\nThe autoimmune tendency does not stop at the joints. Her TPO antibodies at 66.6, nearly five times the upper limit, with a TSH of 3.12 drifting above the optimal ceiling, suggest early Hashimoto's thyroiditis. This is a second autoimmune condition, and it is common for autoimmune diseases to cluster. The thyroid is still producing adequate hormone levels (FT4 17.8, FT3 5.3), so this is subclinical at present, but it is a marker to watch. If the thyroid function declines over the coming years, it will add to the fatigue, worsen the lipid profile by slowing LDL clearance, and may contribute to weight gain, brain fog and joint stiffness.\n\nThe cardiovascular picture is dominated by Lp(a) at 135 nmol/L. This is entirely genetic, cannot be changed, and acts as a permanent multiplier of cardiovascular risk. It means the ApoB of 1.2, the LDL of 3.39 and the Lp(a)-corrected LDL of 2.95 all need to be driven lower than they would for someone with a normal Lp(a). The excellent HDL of 2.1, the healthy triglycerides of 1.04 and the strong ApoA1 of 1.85 are genuine positives that partially offset the risk, but with a cardiovascular risk score of 95 out of 100, the modifiable inputs, particularly ApoB and CRP, need attention. The CRP contribution is partly driven by the rheumatoid arthritis rather than metabolic inflammation, which the GP should factor in when interpreting the score.\n\nThe HbA1c of 43 sitting above a fasting glucose of 4.5 and a HOMA-IR of 0.69 is explained by two mechanisms: prednisolone-induced post-meal glucose spikes and prolonged red cell lifespan from low reticulocyte production. Neither suggests true pre-diabetes, but both deserve monitoring because prednisolone can cause genuine glucose dysregulation over time.\n\nThe hormonal picture, with FSH at 121 confirming post-menopausal status, very low free testosterone at 0.004 nmol/L, and low DHEA-S at 0.3 umol/L, adds another layer to the fatigue and brain fog. The oestradiol of 80 on HRT is providing some replacement but may not be at the optimal level for symptom control, and the absence of testosterone support means one of the key drivers of energy, mental clarity and joint recovery is almost absent.\n\nThe loose end is sleep. Fewer than six hours most nights compounds every one of these problems: it worsens inflammation, impairs immune regulation (which matters in two autoimmune conditions), reduces pain thresholds (worsening joint stiffness), impairs cognitive function (worsening brain fog), and disrupts cortisol rhythm. The cortisol result of 516 cannot be interpreted because of prednisolone interference, but the pattern of sleep restriction alongside the symptom profile suggests the sleep deficit is a major contributor that blood tests alone cannot quantify.","lifestyle":"Set a fixed bedtime that gives you at least seven hours in bed, starting this week. Anchor: set an alarm 30 minutes before the target bedtime as your wind-down cue. Why: fewer than six hours of sleep worsens inflammation (your CRP is 7.1 and ESR is 60), impairs brain fog, lowers pain thresholds for your joints, and disrupts every hormone in this report.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, chicken. Anchor: protein goes on the plate before anything else. Why: at a diet volume of 4 out of 10 and quality of 3 out of 10 with a BMI of 20.4, you are likely under-eating protein, which is needed for immune function, muscle maintenance and red blood cell production.\nEat two portions of oily fish a week (salmon, mackerel, sardines) or keep your current omega supplement. Anchor: pick two fixed days as fish days. Why: omega-3 lowers inflammation, supports joint health in rheumatoid arthritis, and helps bring ApoB and triglycerides down.\nAdd two to three portions of dark leafy greens and colourful vegetables a day. Spinach, broccoli, peppers, sweet potato. Anchor: add a handful to whatever you are already eating at lunch and dinner. Why: your diet quality at 3 out of 10 suggests very little plant matter, and the folate, magnesium, potassium and fibre from vegetables support every system flagged in this report.\nWalk for ten to fifteen minutes after your largest meal each day. Anchor: plate in the sink, shoes on. Why: a post-meal walk blunts the glucose spikes that prednisolone may be causing, which is the mechanism behind your HbA1c of 43.\nBegin two short resistance sessions a week, even ten to fifteen minutes of bodyweight exercises or resistance bands at home. Anchor: attach to a fixed day and time, such as after your morning walk on Tuesday and Thursday. Why: resistance training improves insulin sensitivity, builds the muscle that protects joints in rheumatoid arthritis, supports bone density at post-menopausal age, and helps clear LDL cholesterol.\nCut caffeine after midday. Anchor: switch to herbal tea or decaf after lunch. Why: caffeine after noon delays sleep onset by up to an hour, and your sleep is already the shortest variable in this report.\nAim for approximately 1,500 to 1,600 calories a day with at least 75 to 90 grams of protein (1.3 to 1.6 g per kg). Your estimated maintenance is around 1,750 calories. You are lean and should not lose weight, so the goal is to eat enough of the right food rather than restricting.","flags":"Lp(a) 135 nmol/L (target below 32, moderate risk category). Entirely genetic, unchangeable, permanent medical record. Increases cardiovascular risk by accelerating cholesterol deposition, promoting clotting and driving arterial inflammation. First-degree relatives should be tested. All modifiable cardiovascular risk factors should be optimised to lower thresholds.\nApoB 1.2 g/L (target below 0.9, high category), LDL 3.39 mmol/L (target below 3.0), Lp(a)-corrected LDL 2.95 mmol/L (optimal below 2.0). With Lp(a) at 135, the treatment target for ApoB drops to below 0.7. The modifiable portion of LDL (2.95 after Lp(a) correction) is amenable to dietary change and, if insufficient, statin therapy. Cardiovascular risk score 95/100.\nESR 60 mm/hour (limit below 12), hs-CRP 7.1 mg/L (limit below 5), rheumatoid factor above 90 IU/mL (limit below 14). Active seropositive rheumatoid arthritis with significant systemic inflammation despite prednisolone. Rheumatology review recommended to assess whether current treatment is adequately controlling disease activity.\nTPO antibodies 66.6 U/mL (limit below 13.8) with TSH 3.12 mIU/L (optimal below 2.5). Pattern associated with Hashimoto's thyroiditis. FT4 and FT3 currently adequate. Recommend annual thyroid monitoring and earlier recheck if symptoms worsen.\nHbA1c 43 mmol/mol (pre-diabetes threshold 42) with fasting glucose 4.5 and HOMA-IR 0.69. Likely driven by prednisolone-induced post-meal glucose excursions and prolonged red cell lifespan from low reticulocyte production. Not consistent with true metabolic pre-diabetes at present but warrants monitoring.\nAbsolute reticulocytes 32.7 (lower limit 50), haematocrit 0.359 (lower limit 0.36), haemoglobin 123 (range 120 to 150), transferrin 2.31 g/L (lower limit 2.5), ferritin 28 ng/mL (optimal above 40), transferrin saturation 20.5% (optimal above 25%). Pattern consistent with anaemia of chronic disease secondary to rheumatoid arthritis inflammation. Low transferrin is a negative acute-phase response. True iron stores may be lower than ferritin suggests.\nFree testosterone 0.004 nmol/L (lower limit 0.01), bioavailable testosterone 0.08 nmol/L (optimal above 0.12), DHEA-S 0.3 umol/L (bottom of range). Post-menopausal hormonal picture with very low androgen levels contributing to fatigue and brain fog. Discuss testosterone supplementation with HRT prescriber.\nLymphocytes 3.52 (upper limit 3.0). Mildly elevated, consistent with immune activation from active rheumatoid arthritis. Not suggestive of a separate pathology at this margin.\nFolate 22 ng/mL (upper limit 17). Supplement-driven, not a concern. Excess is renally excreted.\nTotal antioxidant activity 1.87 mmol/L (upper limit 1.77). Supplement-driven, not a concern.\nCortisol 516 nmol/L. Within morning reference range but cannot be reliably interpreted while on prednisolone, which causes falsely elevated readings.\nReassuring negatives: liver function excellent (ALT 15, GGT 13, FIB-4 0.83), kidney function adequate (combined eGFR 79), pancreas healthy (amylase 69, lipase 52), coeliac screen negative, tumour markers all within range (CA125 8.7, CA15-3 18.35, CA19-9 10.58, CEA 0.77), immunoglobulins normal, urinalysis clean, vitamin D optimal at 112, B12 healthy at 692, magnesium optimal at 0.92, calcium and PTH normal.","recommendations":"Record Lp(a) at 135 nmol/L permanently in your medical records and discuss with your GP. This is an inherited cardiovascular risk factor that cannot be changed but means all other modifiable risk factors, particularly ApoB and LDL, need to be driven to lower targets (ApoB below 0.7). Statin therapy may be appropriate given the combined picture. First-degree relatives should be offered Lp(a) testing.\nAsk your rheumatologist to review disease control. Your ESR at 60, CRP at 7.1 and rheumatoid factor above 90 suggest active inflammation despite prednisolone. The inflammation is driving anaemia, fatigue and contributes to cardiovascular risk. Disease-modifying therapy escalation may be warranted.\nDiscuss the TPO antibody result of 66.6 with your GP. This suggests early autoimmune thyroid disease (Hashimoto's). Request annual monitoring of TSH and FT4, and earlier recheck if fatigue or brain fog worsen.\nDiscuss the HbA1c of 43 with your GP, noting that prednisolone is the most likely driver via post-meal glucose spikes. A home glucose monitor worn for two weeks would show whether significant post-meal spikes are occurring and help your GP decide whether dose adjustment or dietary changes are sufficient.\nDiscuss testosterone and DHEA-S levels with your HRT prescriber. Free testosterone at 0.004 and DHEA-S at 0.3 are very low and may be contributing to fatigue, brain fog and joint stiffness. Testosterone gel or cream is increasingly offered alongside HRT for these symptoms.\nAsk your GP to check a full iron panel (ferritin, transferrin, saturation) once inflammatory markers improve, to see whether true iron deficiency is present beneath the inflammation. If ferritin remains below 40 with symptoms, a trial of gentle iron supplementation may be warranted.\nAim for approximately 1,500 to 1,600 calories per day with 75 to 90 grams of protein (1.3 to 1.6 g/kg). Do not restrict calories below maintenance as your BMI is 20.4. Retest in four to six months with a focus on: hs-CRP, ESR, full blood count with reticulocytes, TSH, FT4, HbA1c, ApoB, LDL and iron studies.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 IU daily with a meal containing fat. Your level at 112 nmol/L is optimal and the current dose is maintaining it well. Take with vitamin K2 (MK-7) 100 mcg daily, which directs calcium into bone rather than arteries.\nContinue magnesium glycinate at 300 to 400 mg before bed. Your level at 0.92 is in the optimal range, and magnesium glycinate specifically supports sleep quality, which is your most important lifestyle change.\nContinue your B vitamin complex. Your B12 at 692 and folate at 22 are both healthy, confirming the supplement is working. No change needed.\nContinue omega-3 fish oil at 2 to 3 g of combined EPA and DHA daily with food. This supports joint inflammation in rheumatoid arthritis, helps lower ApoB and triglycerides, and provides anti-inflammatory benefit against a CRP of 7.1.\nConsider adding iron (ferrous bisglycinate, 25 mg every other day, taken with vitamin C) only after discussion with your GP or rheumatologist. Your ferritin at 28 is below optimal and true stores may be lower than this number suggests due to inflammation, but iron supplementation during active inflammatory disease should be guided by your clinical team.\nDo not take high-dose individual folate supplements. Your folate at 22 is already above range from your B vitamin complex, and further supplementation is unnecessary.\nThe most important changes from this report are not supplements. They are extending sleep to at least seven hours, improving diet quality and protein intake, starting gentle resistance training, and working with your GP and rheumatologist to better control the rheumatoid arthritis inflammation that is driving the majority of the abnormal findings.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 49.4. Weakest systems: inflammation 5%, lipids & cardiovascular 20%, thyroid 47%. Biggest drags: Apolipoprotein B, Lipoprotein(a), LDL Cholesterol, HbA1c (mmol/mol).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"50.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4192","lower_normal":"","upper_normal":"60","lower_optimal":"","upper_optimal":"55","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4583","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term and measures the amount of cardiovascular risk being built right now, not the ten-year probability of an event. Kellie's score of 95 out of 100 is very high, driven primarily by her Lp(a) at 135 (inherited and unchangeable), ApoB at 1.2, hs-CRP at 7.1 (largely from rheumatoid arthritis), and HbA1c at 43. Her excellent HDL (2.1) and triglycerides (1.04) are protective inputs but cannot fully offset the other factors. The modifiable inputs, ApoB and CRP, are the targets for intervention.","low_causes":"Low ApoB, high HDL, low triglycerides, low CRP, normal Lp(a)","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose is the amount of sugar circulating in the bloodstream after an overnight fast. Kellie's result of 4.5 mmol/L is excellent, sitting comfortably within the optimal range of 4.0 to 5.4. This tells us that her body is managing blood sugar effectively in the fasting state and there is no sign of insulin resistance or impaired fasting glucose.","low_causes":"Prolonged fasting, excessive insulin, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, corticosteroid use, stress, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin, the oxygen-carrying protein in red blood cells, that has sugar permanently attached to it. Because red blood cells live for about three months, it reflects average blood sugar over that period. Kellie's result of 6.1% places her just into the pre-diabetes range (6.0 to 6.4%). However, this needs careful interpretation: her fasting glucose and insulin sensitivity are both excellent, which makes true pre-diabetes unlikely. Prednisolone is well known to cause post-meal glucose spikes that inflate HbA1c, and her low reticulocyte count means her red blood cells are circulating longer than usual, giving sugar more time to attach. Both mechanisms likely contribute to this reading.","low_causes":"Shortened red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Elevated average blood sugar, corticosteroid use, prolonged red cell lifespan, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7143","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol rather than percentage. Kellie's result of 43 mmol/mol is one point above the pre-diabetes threshold of 42. As discussed, this is most likely driven by prednisolone-induced post-meal glucose excursions and prolonged red cell lifespan from low reticulocyte production, rather than true metabolic pre-diabetes. Her fasting glucose of 4.5 and HOMA-IR of 0.69 confirm she is very insulin-sensitive.","low_causes":"Shortened red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Elevated average blood sugar, corticosteroid use, prolonged red cell lifespan, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3712","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5751","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check overnight. Kellie's result of 3.45 mIU/L is low within the reference range and within the optimal band of 2 to 8, meaning her pancreas is working efficiently with very little effort. This is a positive finding that confirms strong insulin sensitivity.","low_causes":"Low carbohydrate diet, very lean body composition, type 1 diabetes","high_causes":"Insulin resistance, excess carbohydrate intake, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333333333","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3697","upper_optimal_position":"0.5515","units":"ug/L","description":"C-Peptide is a protein released in equal amounts to insulin when the pancreas produces insulin. It is a useful confirmation of how much insulin the pancreas is making. Kellie's result of 1.1 ug/L (equivalent to approximately 364 pmol/L) is at the very bottom of the reference range. This is consistent with her low insulin level and reflects low insulin demand in someone who is lean (BMI 20.4) and very insulin-sensitive, rather than any failure of the pancreas to produce insulin.","low_causes":"Low carbohydrate diet, lean body composition, type 1 diabetes","high_causes":"Insulin resistance, excess insulin production, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5071","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over the past two to three months. Kellie's result of 7.1 mmol/L is marginally above the normal threshold of 7.0, driven by the same HbA1c of 43 that is likely artefactually elevated by prednisolone and prolonged red cell lifespan. Her actual fasting glucose of 4.5 and HOMA-IR of 0.69 confirm excellent metabolic health.","low_causes":"Low average blood sugar, shortened red cell lifespan","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4676","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lowe "normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"88.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4963","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"fL","description":"MCV measures the average size of each red blood cell. Kellie's result of 88.9 fL is within the optimal range, confirming that her red cells are a normal size. This rules out both microcytic anaemia (small cells, typically from iron deficiency) and macrocytic anaemia (large cells, typically from B12 or folate deficiency).","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"30.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. Kellie's result of 30.3 pg is within the optimal range, confirming that each cell is carrying an appropriate amount of oxygen-transporting protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"341","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_norm rage size of platelets. Kellie's result of 9.2 fL is within the optimal range, indicating healthy platelet production.","low_causes":"Bone marrow suppression, inflammatory conditions","high_causes":"Platelet destruction, immune thrombocytopenia, large young platelets in response to demand","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"8.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5857","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's front line. Kellie's total white cell count of 8.54 is within the laboratory range but above the optimal ceiling of 8.0. In the context of active rheumatoid arthritis with elevated inflammatory markers, a mildly elevated white cell count reflects immune activation rather than a separate problem. Prednisolone can also raise the white cell count.","low_causes":"Viral infection, bone marrow suppression, autoimmune conditions, medications","high_causes":"Infection, inflammation, corticosteroid use, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4663","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell type and are the first responders to bacterial infection and tissue damage. Kellie's result of 3.99 is within the optimal range, confirming adequate neutrophil numbers.","low_causes":"Viral infection, medications, bone marrow suppression, autoimmune neutropenia","high_causes":"Bacterial infection, inflammation, corticosteroid use, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"3.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7533","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for the adaptive immune response, including producing antibodies. Kellie's result of 3.52 is mildly above the upper limit of 3.0. In the context of active rheumatoid arthritis, where the immune system is chronically activated, a mild lymphocyte elevation is expected and reflects the autoimmune drive rather than a separate condition.","low_causes":"Viral infection, corticosteroid use, immunosuppressive medications, stress","high_causes":"Viral infection, autoimmune disease, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5042","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that help clean up damaged tissue and present foreign material to the immune system. Kellie's result of 0.61 is within the optimal range.","low_causes":"Bone marrow suppression, corticosteroid use","high_causes":"Chronic inflammation, infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.05","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6250","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic defence. Kellie's result of 0.4 is within range, at the upper end of the optimal band but not elevated.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333333333","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cell type and are involved in allergic and inflammatory responses. Kellie's result of 0.02 is at the lower end of the range and is normal.","low_causes":"Corticosteroid use, acute allergic reactions, hyperthyroidism","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4873","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"1.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5500","units":"%","description":"Reticulocytes are newly formed red blood cells released from the bone marrow. The percentage at 0.81% is within range. However, the absolute count (below) provides a more clinically useful measure of actual red cell production.","low_causes":"Bone marrow suppression, chronic disease, iron deficiency, B12 or folate deficiency","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"32.724","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2181","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of new red blood cells being released into the bloodstream. Kellie's result of 32.7 is well below the lower limit of 50, confirming that her bone marrow is producing fewer new red cells than normal. In the context of her active rheumatoid arthritis with an ESR of 60 and CRP of 7.1, this is most likely suppression of red cell production by chronic inflammation, a hallmark of anaemia of chronic disease. The low ferritin (28) and borderline transferrin saturation (20.5%) suggest functional iron restriction may also be contributing.","low_causes":"Chronic inflammation, iron deficiency, bone marrow suppression, chronic disease, B12 or folate deficiency","high_causes":"Blood loss, haemolysis, recovery from anaemia, erythropoietin therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":""," 333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. Kellie's result of 20.5% is within the laboratory range but below the optimal of 25%, indicating that less iron than ideal is being transported to where it is needed. In the context of inflammation-driven low transferrin and borderline ferritin, this reflects functional iron restriction rather than absolute iron deficiency.","low_causes":"Iron deficiency, chronic inflammation, chronic disease","high_causes":"Iron overload, haemochromatosis, liver disease, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"11.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3801","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3801","upper_optimal_position":"0.5827","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. Kellie's result of 11.9 umol/L is within range but at the lower end and just below the optimal of 12. Serum iron fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin and transferrin saturation. All three are at the lower end, consistent with functional iron restriction in the setting of chronic inflammation.","low_causes":"Iron deficiency, chronic inflammation, poor dietary intake, blood loss","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.31","within_normal":"FALSE","within_optima l_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys are filtering waste, calculated from creatinine, age, sex and ethnicity. Kellie's creatinine-based eGFR of 84 is above the clinical threshold of 60 but below the optimal of 90. At 55, some decline from peak kidney function is expected. The cystatin C-based and combined eGFR values (79) give a similar picture. These numbers are adequate and not concerning but worth monitoring annually given her long-term medications.","low_causes":"Chronic kidney disease, dehydration, nephrotoxic medications, ageing","high_causes":"Hyperfiltration (early diabetes), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4773","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all cells that is filtered by the kidneys at a constant rate. Unlike creatinine, it is not affected by muscle mass, making it a more reliable kidney marker in people with very low or very high muscle. Kellie's result of 1.05 mg/L is within the laboratory range but above the optimal of 0.9, which is consistent with the mildly reduced eGFR values. This is not concerning at present but supports annual monitoring.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Reduced kidney function, ageing, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"60","upper_normal":"","lower_o imal of 38. Albumin is a negative acute-phase protein, meaning chronic inflammation drives it down. With her ESR at 60 and CRP at 7.1, the low-normal albumin is most likely inflammation-driven. Low dietary protein intake (diet rated 3 out of 10 for quality, 4 out of 10 for volume) may also be contributing.","low_causes":"Chronic inflammation, liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin is a group of proteins including immunoglobulins (antibodies) and transport proteins. Kellie's result of 34 g/L is within range but at the higher end and above the optimal of 32. In the context of active rheumatoid arthritis and elevated rheumatoid factor, higher globulin reflects increased antibody production from the autoimmune process. This is expected and not a separate concern.","low_causes":"Immunodeficiency, malnutrition, liver disease","high_causes":"Chronic inflammation, autoimmune disease, infection, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5429","units":"IU/L","description":"ALP is an enzyme found in the liver and bones. Kellie's result of 61 IU
