<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Patricia M-A McEvoy","dob":"23/04/1971","report_date":"2026-11-10","summary":"Patient is a 55-year-old female presenting with a BMI of 28.3, following an ultra-processed and fast food heavy diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food several times a day; portions are larger than average (volume 7 out of 10). She does not exercise, with zero cardio and zero resistance sessions per week, and walks between 2,000 and 5,000 steps daily. She sleeps 6 to 7 hours, wakes exhausted or waking in the night, and her energy pattern is tired on waking. Stress feels hard to manage most days. She drinks 10 to 14 alcoholic drinks per week and reports overuse of caffeine or energy drinks. She has diagnosed asthma, hypertension and chronic kidney disease, and takes HRT, testosterone replacement therapy and an ACE inhibitor. She has a family history of dementia and thyroid disease. This is her first blood test. She reports brain fog, poor sleep and insomnia, low energy and fatigue, and weight gain with difficulty losing weight, all lasting over a year. Her goals are to lose body fat, improve energy levels and improve mood. She describes a stressful job in healthcare and says she does not find the time or motivation to look after herself.\n\nThe finding that should be discussed with her GP first is the combination of a significantly raised Lipoprotein(a) and an elevated Apolipoprotein B, because together they represent a genuinely increased cardiovascular risk that needs a medical conversation. Lipoprotein(a), often written Lp(a), is a particle in the blood that carries cholesterol, encourages clotting and drives inflammation in blood vessel walls. It is entirely inherited; nothing in diet, exercise or lifestyle changes it. Her level is 207.61 nmol/L, well above the 32 nmol/L ideal threshold and into the raised risk category. This is a number she should record permanently, and it is worth testing first-degree relatives, because the gene is inherited. Apolipoprotein B (ApoB) is a protein that sits on every LDL particle, and it is the single best measure of how many cholesterol-carrying particles are circulating. Her ApoB is 1.05 g/L, above the 0.9 target and in the borderline-high category. With an Lp(a) this high, a portion of the LDL reading is locked inside Lp(a) particles and cannot be lowered by lifestyle changes. The Lp(a)-corrected LDL, which removes that inherited fraction, comes out at 2.05 mmol/L, which is close to ideal. This means the modifiable part of her cholesterol is not far off target, and the risk is being driven predominantly by the Lp(a) itself. Her total cholesterol is 6.0 mmol/L, above the desirable threshold of 5.18, and her LDL is 2.72 mmol/L, within the laboratory range but above the optimal level of 2.6 for someone with this Lp(a) burden. The Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that measures the risk being built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes in at 60, well above the ideal threshold of 20 and above the acceptable limit of 40. The main drivers are the Lp(a) and the ApoB. This is important because a score this high at 55 means the risk is accumulating now, not in the distant future, and the GP needs to assess overall cardiovascular risk formally, including blood pressure management given her existing hypertension, and decide whether lipid-lowering medication is warranted alongside the lifestyle changes in this report. The very good news within the lipid panel is that her HDL cholesterol, the protective fraction, is 3.0 mmol/L, which is genuinely exceptional. HDL carries cholesterol away from artery walls and back to the liver for disposal. A level this high is strongly protective and explains why her TC:HDL ratio is only 2.0, her ApoB:A1 ratio is 0.35 (well within the lower risk category below 0.6), and her Atherogenic Index of Plasma is minus 0.62, a very favourable reading. Her triglycerides are 0.72 mmol/L, comfortably within the ideal range below 1.0. So the lipid picture is one of genuine inherited risk from Lp(a) layered on top of an otherwise excellent balance between protective and harmful lipid fractions.\n\nThe second finding for the GP is her kidney function. She has a diagnosis of chronic kidney disease, and the numbers here are consistent with stage 2 CKD. Her creatinine-based eGFR is 67, and the cystatin C-based eGFR, which is more reliable because it is not affected by muscle mass, is 71. The combined eGFR from both markers is 71 mL/min per 1.73 square metres. Stage 2 CKD sits between 60 and 89, so she is within that band but in the lower portion. This is not an emergency, but at 55 the trajectory matters. Her cystatin C is 1.06 mg/L, just below the upper limit of 1.1, and her urea and creatinine are within range. The ACE inhibitor she is taking is the right class of medication for protecting the kidneys in the context of hypertension and CKD, and the GP should continue to monitor kidney function at regular intervals. Her bicarbonate is 35.2 mmol/L, above the upper limit of 31. Bicarbonate is a buffer in the blood that helps regulate acidity. A raised level can sometimes be seen with the ACE inhibitor class of medication or with a metabolic alkalosis. In the context of CKD, the GP should be aware of this reading and may wish to check acid-base status.\n\nThe urine sample shows red blood cells at 40 per microlitre, above the threshold of 25 where investigation is recommended. At 55 with existing CKD and hypertension, microscopic haematuria, the medical term for blood in the urine that is not visible to the naked eye, should be investigated by the GP. The nitrites are negative, the bacterial count is insignificant and the culture showed insignificant growth, so infection is not the explanation. There is a trace of protein in the urine, which in the context of CKD and hypertension is something the GP should quantify properly with a urine albumin-to-creatinine ratio. White cells at 10 are at the borderline of significance. The GP should arrange a formal urinalysis with microscopy and consider a urology referral to investigate the source of the red blood cells.\n\nHer TSH, thyroid stimulating hormone, is 0.45 mIU/L, below the lower limit of 0.55. TSH is the signal the pituitary gland sends to the thyroid to tell it how hard to work; a low TSH suggests the thyroid is producing more hormone than the pituitary wants, or that something is suppressing the signal. Her free T4 is 16.3 pmol/L, solidly within the ideal range, and her free T3 is 4.8 pmol/L, also within the ideal range. Both thyroid antibodies are negative, which makes autoimmune thyroid disease unlikely, and this is particularly reassuring given her family history of thyroid disease. The most likely explanation for the suppressed TSH in this context is that HRT can influence thyroid binding proteins and TSH, or it may simply be her set point sitting fractionally below the laboratory range. This is not an urgent finding, but given the family history the GP should note it and repeat thyroid function in three to six months to confirm it is stable rather than trending downward.\n\nHer testosterone is 8.4 nmol/L, more than three times the upper limit of 2.6 for women, and the Free Androgen Index, which measures the proportion of testosterone that is active in the body, is 8.96, above the upper limit of 6.5. She is taking testosterone replacement therapy, and these levels are a direct consequence of that. However, they are supraphysiological, meaning they are well above the range that would occur naturally in a woman. The bioavailable testosterone, the fraction available to act on tissues, is 1.75 nmol/L, also significantly above the female range. This degree of excess may contribute to side effects, and the GP or prescriber managing the TRT should review the dose. It is worth noting that her SHBG, sex hormone binding globulin, is 93.7 nmol/L, which is in the upper half of the range and is likely being driven upward by the oestradiol from HRT; SHBG binds testosterone and reduces its activity, so even with very high total testosterone the binding protein is providing some buffer, but the free androgen index still shows excess.\n\nHer oestradiol is 416 pmol/L, which is above the postmenopausal baseline of 0 to 118.2, confirming that the HRT is producing significant oestrogen replacement. Her FSH at 39.11 mIU/mL is in the postmenopausal range (above 23), which means the HRT is not fully suppressing the menopausal hormonal signal. Her progesterone is 8.93 nmol/L, above the postmenopausal baseline of 0 to 2.32, which likely reflects the progestogen component of her HRT. Her LH at 21.86 mIU/mL is in the postmenopausal range. These hormone levels should be discussed with the prescriber managing her HRT to confirm the regimen is balanced correctly.\n\nHer IgE is 837 IU/mL, more than eight times the upper limit of 100. IgE is the antibody the immune system produces in response to allergens. A level this high suggests a significant allergic process. She has diagnosed asthma, which is strongly associated with elevated IgE, and the eosinophils at 0.36 are within range but in the upper half, which fits an allergic picture. The GP or respiratory team should be aware of this level because it may influence asthma management. Biologic therapies for severe asthma, such as anti-IgE treatment, use IgE levels to determine eligibility, so this number has practical clinical relevance.\n\nHer neutrophils are 1.47 x10 to the power of 9 per litre, below the lower limit of 2.0. Neutrophils are the white blood cells that form the first line of defence against bacterial infection. In people of Black African or Caribbean ethnicity, a lower neutrophil count is a recognised and well-documented normal variant called benign ethnic neutropenia. It does not carry the infection risk that a genuinely low count would in other populations. Her total white cell count is 4.33, just above the lower limit of 4.0, and lymphocytes, monocytes, eosinophils and basophils are all within range. The low neutrophil count is almost certainly benign ethnic neutropenia and does not require treatment, but the GP should have it noted in her records so that future blood tests are not flagged unnecessarily.\n\nHer PTH, parathyroid hormone, is 4.8 pmol/L, marginally above the upper limit of 4.73. PTH controls calcium balance in the blood by pulling calcium from bone when levels drop. Her corrected calcium is 2.42 mmol/L, comfortably within the normal range, and her phosphate is 1.0, also within range. A very mildly raised PTH with normal calcium can be seen in vitamin D insufficiency, because the body raises PTH to compensate for lower vitamin D. Her vitamin D is 56 nmol/L, which is above the sufficiency threshold of 50 but below the optimal level of 75. Improving vitamin D will likely bring PTH back within range. Given the family history of dementia, it is worth noting that vitamin D status has been associated with cognitive health in observational studies, so optimising it is relevant to more than just bone health.\n\nHer C-Peptide is 0.926 ug/L, below the lower limit of 1.1. C-Peptide is released by the pancreas in exactly the same quantity as insulin, so it is a measure of how much insulin the pancreas is making. Her fasting glucose is 4.6 mmol/L, which is ideal, her HbA1c is 28 mmol/mol, which is excellent and well below the optimal threshold of 36, and her fasting insulin is 3.88 mIU/L, within range. Her HOMA-IR, a measure of insulin resistance calculated from fasting glucose and insulin, is 0.79, which places her in the insulin-sensitive category. The low C-Peptide in the context of a completely healthy glucose and insulin picture simply means the pancreas is not being asked to work hard. It is producing exactly what is needed. This is a positive finding rather than a concern.\n\nHer RDW, red cell distribution width, is 14.3%, marginally above the upper limit of 14.0%. RDW measures how much variation there is in the size of red blood cells. A marginal elevation like this, just 0.3% above the limit, is often a laboratory finding of no clinical significance. Her haemoglobin, MCV, MCH and red cell count are all within range, and her iron studies are healthy, so there is no pattern suggesting anaemia or a nutritional deficiency driving it.\n\nHer De Ritis ratio, AST divided by ALT, is 1.78, above the upper normal limit of 1.6. This ratio is sometimes used to assess liver health, but it is only meaningful when liver enzymes are themselves elevated. Her ALT is 9 IU/L, well within range, and her AST is 16, within range. When ALT is this low, the denominator of the ratio becomes very small, which inflates the number. Her GGT at 32 is within the female range of 4 to 38, her bilirubin is 13, her albumin is 42, her FIB-4 score is 1.02, her APRI is 0.139 and her NAFLD Fibrosis Score is minus 1.732. Every single liver marker and liver scoring system is within range. The De Ritis ratio is being driven by the arithmetic, not by any sign of liver disease.\n\nHer transferrin is 2.46 g/L, marginally below the lower limit of 2.5. Transferrin is the protein that carries iron around the blood. A fractionally low transferrin with normal iron at 19.3 umol/L, healthy ferritin at 96 ng/mL, normal transferrin saturation at 31.24% and a normal iron binding capacity is not a concern. Transferrin can be mildly suppressed by chronic inflammation or simply by being at the lower end of individual variation.\n\nHer total antioxidant activity is 2.02 mmol/L, above the upper limit of 1.77. This is almost certainly being driven by the HRT, the supplements she may be taking or the alcohol. It is not a harmful finding.\n\nNow to the genuinely encouraging results, because there are several that matter. Her blood sugar control is excellent. A fasting glucose of 4.6, an HbA1c of 28 mmol/mol and a HOMA-IR of 0.79 mean that despite a diet heavy in ultra-processed food and sugar, with a BMI of 28.3 and no exercise, her body is handling glucose and insulin beautifully. This is a meaningful positive because it means metabolic disease has not taken hold, and the window to change her diet and activity is wide open. Her liver is in good health despite the dietary pattern and the 10 to 14 drinks per week. An ALT of 9, a GGT of 32, a FIB-4 of 1.02 and an APRI of 0.139 show no fatty change, no inflammation and no scarring. The liver is managing the load it is being given, but this is the time to reduce that load rather than wait for the numbers to move. Her amylase and lipase, the pancreatic enzymes, are both within range. Her tumour markers CA125 at 5.6, CA15-3 at 11.03, CA19-9 at 19.73 and CEA at 1.13 are all well within range, which is reassuring. Her immunoglobulins IgG, IgM and IgA are all within range, her rheumatoid factor is negative, and her coeliac screen is negative. Her cortisol at 258 nmol/L is within the morning reference range, which is reassuring given the level of stress she describes. Her DHEA-S at 2.4 umol/L is within range. Her prolactin at 420 uIU/mL is within the postmenopausal range. Her creatine kinase at 102 U/L is within range. Her platelets, MCV, MCH, haematocrit and haemoglobin are all within range. Her ESR at 10 is within range. Her magnesium at 0.89 mmol/L is within the optimal range. Her calcium and phosphate are within range. Her B12 at 492 pg/mL is within range though below the optimal threshold of 500. Her folate at 7 ng/mL is within range but below the optimal level of 8 ng/mL.\n\nHer PhenoAge, a biological ageing score calculated from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 50.3 years against a calendar age of 55, placing her biological age nearly five years younger than her actual age. This is driven by her excellent glucose control, reasonable albumin and CRP. It means that despite the lifestyle challenges she describes, her body is ageing well at a cellular level, and the changes in this report should widen that gap further.\n\nHer folate at 7 ng/mL is fractionally below the optimal threshold of 8. Given the diet pattern with only 2 to 3 portions of fruit and vegetables a day, this is not surprising. A small increase in leafy green vegetables or a supplement would bring this into the optimal range. Her B12 at 492 pg/mL is reasonable but below the 500 optimal floor. These are minor findings that a small dietary shift or supplement will address.\n\nHer hsCRP is 1.3 mg/L, within the laboratory range of below 5 but above the optimal level of below 1.0. hsCRP is a measure of low-grade inflammation in the body. At a BMI of 28.3 with a heavily processed diet, alcohol at 10 to 14 drinks per week and chronic stress, a low-grade inflammatory signal above the ideal level is expected. Reducing ultra-processed food, reducing alcohol and increasing omega-3 intake are the three most effective levers for bringing this down.","links":"The central thread in this report is a woman whose blood markers are surprisingly resilient given what she describes as a demanding lifestyle with little time for self-care, but who carries two significant risks that need medical attention: a very high inherited Lp(a) driving cardiovascular risk, and an established kidney disease that needs continued monitoring.\n\nThe cardiovascular story ties together several findings. The Lp(a) at 207.61 nmol/L is the inherited driver. The ApoB at 1.05 and total cholesterol at 6.0 sit above their targets, but when the Lp(a)-bound LDL is subtracted, the correctable LDL falls to 2.05, which is close to optimal. The HDL at 3.0 and triglycerides at 0.72 are genuinely excellent and provide a strong counterbalance. The Cardiovascular Risk Score of 60 out of 100 is high, but it is being inflated predominantly by the Lp(a) and hsCRP rather than by a classical dyslipidaemia pattern. This means that lifestyle changes can lower the modifiable portion (ApoB, hsCRP, and the small excess in LDL), but the Lp(a) component requires a medical conversation about whether lipid-lowering therapy is warranted to push ApoB and LDL as low as possible to compensate for the inherited risk that cannot be changed.\n\nThe kidney function findings form a second coherent story. The creatinine-based eGFR of 67, cystatin C-based eGFR of 71 and combined eGFR of 71 are consistent with each other and with her known CKD diagnosis. The raised bicarbonate at 35.2 may relate to compensatory mechanisms in CKD or to the ACE inhibitor, and the trace of protein in the urine and the red blood cells at 40 in the urine both sit within the same renal and urological territory. These findings do not represent a crisis, but they do represent a kidney that needs protecting, and every lifestyle change in this report, reducing weight, reducing processed food, reducing alcohol, improving blood pressure control, feeds into that protection.\n\nThe hormonal picture is dominated by exogenous therapy. The oestradiol at 416 confirms HRT is producing oestrogen well above postmenopausal baseline. The testosterone at 8.4 and Free Androgen Index at 8.96 are supraphysiological for a woman, driven by the TRT. The FSH at 39.11 confirms the menopausal transition. The suppressed TSH at 0.45 with normal free T4 and T3 and negative antibodies most likely reflects the influence of HRT on thyroid binding proteins or her individual set point rather than hyperthyroidism, but the family history of thyroid disease means it should be tracked.\n\nThe IgE at 837 stands alone and connects to her asthma diagnosis. It is not part of the cardiovascular or kidney stories; it is an allergic and respiratory finding that may influence how her asthma is managed.\n\nWhat is excluded is as important as what is found. Diabetes and insulin resistance are not present. Liver disease is not present despite the dietary and alcohol load. Autoimmune thyroid disease is not present despite the family history. Coeliac disease is not present. Rheumatological disease is not present. The tumour markers are all clear. The blood count is normal apart from the benign ethnic neutropenia. Iron stores and iron transport are healthy.\n\nThe loose end is the urinary red blood cells at 40. In a 55-year-old woman with CKD and hypertension, microscopic haematuria must be investigated to exclude a urological cause, even though the most likely explanation is the kidney disease or hypertension itself. The GP should arrange further investigation.","lifestyle":"Cut sugary food and drinks to once a day maximum, then once a week over the next month. Anchor: every time you reach for something sweet, have a glass of water and a handful of nuts first. Why: sugar several times a day is fuelling the hsCRP of 1.3 and the ApoB of 1.05, and reducing it is the single biggest lever in this report for both cardiovascular and kidney protection.\nSwap one ultra-processed meal a day for a home-cooked meal built around protein and vegetables. Start with whichever meal is easiest, usually dinner. Anchor: batch-cook on your day off so the option is already in the fridge. Why: ultra-processed food most days is driving low-grade inflammation and excess sodium, both of which stress the kidneys and blood vessels.\nAdd a palm-sized portion of protein to every meal: eggs, Greek yoghurt, chicken, fish, beans or lentils. Anchor: protein goes on the plate first, everything else goes around it. Why: at 80 kg with a goal to lose body fat, you need roughly 104 to 128 grams of protein a day (1.3 to 1.6 g per kg) to preserve muscle while losing fat, and a processed-food diet almost certainly falls short of this.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers glucose and insulin response, supports kidney blood flow, and at 2,000 to 5,000 steps a day, this single habit could add 2,000 steps and bring meaningful cardiovascular benefit.\nBuild to 7,000 steps a day within four weeks by adding a second short walk, anchored to a break at work or arriving home. Why: step count is one of the strongest predictors of cardiovascular and all-cause health outcomes, and you are currently well below the threshold where benefit accelerates.\nSet a caffeine cut-off at 1pm. No coffee, tea or energy drinks after that time. Anchor: set a phone alarm at 12:45 for your last caffeine. Why: caffeine has a half-life of five to six hours, and drinking it in the afternoon is contributing to the exhausted waking and broken sleep you describe, which in turn drives the fatigue, brain fog and stress.\nFix your wake time to the same time every day, including days off, within a 30-minute window. Get outside within the first hour of waking for at least 10 minutes of natural light. Anchor: alarm goes off, curtains open, step outside with your first (and perhaps only morning) coffee. Why: a fixed wake time and morning light reset the cortisol rhythm, which is the mechanism behind the tired-on-waking and wired-at-night pattern.\nReduce alcohol to under 7 drinks per week, ideally under 4, with at least three consecutive alcohol-free days. Anchor: designate Monday to Wednesday as alcohol-free and do not negotiate with yourself on those days. Why: at 10 to 14 drinks a week, alcohol is contributing to the hsCRP of 1.3 and placing additional load on the liver and kidneys. Your GGT at 32 is within range but in the upper portion for a woman, and reducing alcohol will bring it down and protect kidney function.","flags":"Lipoprotein(a) 207.61 nmol/L (high risk threshold above 200 nmol/L, ideal below 32). This is inherited, unchangeable by lifestyle, and at this level it significantly increases cardiovascular risk through cholesterol deposition, clotting promotion and vascular inflammation. Should be recorded permanently and first-degree relatives should be offered testing.\nApolipoprotein B 1.05 g/L (target below 0.9, borderline high 1.0 to 1.19). This is the modifiable portion of the lipid risk. With Lp(a) this high, pushing ApoB as low as possible is important to compensate for the inherited burden. The Lp(a)-corrected LDL is 2.05, showing the modifiable fraction is close to target.\nTotal cholesterol 6.0 mmol/L (desirable below 5.18). Driven partly by the very high HDL of 3.0, partly by LDL at 2.72 and partly by Lp(a)-bound cholesterol. TC:HDL ratio of 2.0 and ApoB:A1 ratio of 0.35 are both excellent.\nCardiovascular Risk Score 60 out of 100 (ideal below 20, acceptable below 40). Driven primarily by Lp(a) and ApoB. The GP should formally assess overall cardiovascular risk including blood pressure control.\nUrinary red blood cells 40 rbc/uL (threshold for investigation below 25). In a 55-year-old woman with CKD and hypertension, microscopic haematuria requires investigation to exclude a urological cause. Nitrites negative, culture insignificant.\nTrace urine protein. In the context of CKD and hypertension, a formal urine albumin-to-creatinine ratio should be performed to quantify proteinuria.\nCombined eGFR 71 mL/min/1.73m2 (CKD stage 2). Consistent with her known CKD diagnosis. Cystatin C 1.06 mg/L (below 1.1). The ACE inhibitor is the appropriate class. Regular monitoring should continue.\nBicarbonate 35.2 mmol/L (upper limit 31). May relate to the ACE inhibitor or to a compensatory metabolic alkalosis in CKD. The GP should assess acid-base status.\nTSH 0.45 mIU/L (lower limit 0.55) with normal FT4 16.3 and FT3 4.8, both antibodies negative. Most likely reflects HRT influence or individual set point. Given family history of thyroid disease, repeat in three to six months to confirm stability.\nTestosterone 8.4 nmol/L (female upper limit 2.6) and Free Androgen Index 8.96 (upper limit 6.5), driven by testosterone replacement therapy. Supraphysiological levels; the prescriber should review the TRT dose.\nIgE 837 IU/mL (upper limit 100). More than eight times the limit, consistent with her asthma diagnosis and likely reflecting significant allergic sensitisation. Relevant to asthma management and potential eligibility for biologic therapy.\nPTH 4.8 pmol/L (upper limit 4.73) with vitamin D 56 nmol/L (sufficient but below optimal 75). Mildly raised PTH is likely driven by suboptimal vitamin D. Supplementation should bring PTH within range.\nhsCRP 1.3 mg/L (laboratory range below 5, optimal below 1.0). Low-grade inflammation likely driven by BMI, ultra-processed diet and alcohol. Lifestyle changes should lower this.\nNeutrophils 1.47 x10^9/L (lower limit 2.0). In a patient of Black African or Caribbean ethnicity, this is consistent with benign ethnic neutropenia, a recognised normal variant. Should be documented in the GP record to prevent unnecessary investigation on future tests.\nC-Peptide 0.926 ug/L (lower limit 1.1). In the context of normal glucose 4.6, excellent HbA1c 28, normal insulin 3.88 and HOMA-IR 0.79, this reflects low insulin demand rather than pancreatic insufficiency.\nTransferrin 2.46 g/L (lower limit 2.5). Marginally below range with all other iron markers normal. Not clinically significant.\nRDW 14.3% (upper limit 14.0%). Marginally above range with normal haemoglobin and iron studies. Not clinically significant at this margin.\nDe Ritis ratio 1.78 (upper limit 1.6). Driven by a very low ALT of 9 making the denominator small. All liver markers and scores are within range; this is a mathematical artefact.\nTotal Antioxidant Activity 2.02 mmol/L (upper limit 1.77). Likely driven by HRT or dietary antioxidants. Not harmful.\nOestradiol 416 pmol/L (postmenopausal reference 0 to 118.2) and Progesterone 8.93 nmol/L (postmenopausal reference 0 to 2.32). Both above postmenopausal baseline ranges, reflecting active HRT. The prescriber should confirm the regimen is balanced.\nReassuring negatives: diabetes and insulin resistance are not present (glucose 4.6, HbA1c 28, HOMA-IR 0.79). Liver disease is unlikely (ALT 9, GGT 32, FIB-4 1.02, APRI 0.139). Autoimmune thyroid disease is unlikely (both antibodies negative). Coeliac disease is unlikely (tTG negative). Rheumatological disease is unlikely (RF 7). Tumour markers CA125, CA15-3, CA19-9 and CEA are all well within range. Iron overload and iron deficiency are both unlikely.\nNot reported on this occasion: Reticulocyte Count, Reticulocyte Absolute.","recommendations":"Discuss the Lp(a) of 207.61 nmol/L with your GP. This is inherited, cannot be changed by lifestyle, and at this level significantly increases cardiovascular risk. The GP should record it permanently, assess overall cardiovascular risk including blood pressure control with the existing hypertension, and consider whether lipid-lowering medication is appropriate to push ApoB and LDL as low as possible to compensate. First-degree relatives should be offered Lp(a) testing.\nAsk the GP to investigate the urinary red blood cells at 40 rbc/uL. In a 55-year-old woman with CKD and hypertension, microscopic haematuria should be investigated to exclude a urological cause. A urine albumin-to-creatinine ratio should also be performed to quantify the trace protein.\nAsk the GP to check the bicarbonate of 35.2 in the context of CKD and the ACE inhibitor. An acid-base assessment (venous blood gas) would clarify whether this is a compensatory alkalosis or medication-related.\nDiscuss the TSH of 0.45 with the GP. It is marginally below range with normal thyroid hormones and negative antibodies, likely related to HRT, but given the family history of thyroid disease it should be repeated in three to six months.\nAsk the TRT prescriber to review the testosterone dose. Total testosterone at 8.4 and Free Androgen Index at 8.96 are well above the female reference range.\nDiscuss the IgE of 837 with the GP or respiratory team. In the context of asthma, this level may influence management decisions including eligibility for biologic therapy.\nAsk the GP to note benign ethnic neutropenia (neutrophils 1.47) in the medical record so future tests are not flagged unnecessarily.\nCalorie target: approximately 1,650 to 1,800 kcal per day (TDEE of roughly 2,100 at sedentary multiplier 1.3 with BMR around 1,580, minus a moderate deficit of 300 to 400 kcal). Protein target: 104 to 128 grams per day (1.3 to 1.6 g per kg at 80 kg). Weight target: 68 to 72 kg (BMI 24 to 25.5), pursued gradually at 0.5 kg per week. Retest in four to six months with a repeat of: kidney function (eGFR, cystatin C, urea, creatinine), full lipid panel including ApoB and Lp(a), hsCRP, thyroid function (TSH, FT4, FT3), testosterone, vitamin D and a urine albumin-to-creatinine ratio. These markers will show whether the lifestyle changes and any medication adjustments are working.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with a meal containing fat. Why: vitamin D is 56 nmol/L, above the sufficiency floor of 50 but below the optimal level of 75, and the PTH of 4.8 is marginally above range, likely because vitamin D is suboptimal. At a BMI of 28.3, a higher dose is needed because fat tissue sequesters vitamin D. Reassess after three to four months with a target of 75 to 100 nmol/L.\nVitamin K2 (MK-7): 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone and away from blood vessels. It should always accompany vitamin D supplementation, and it is particularly relevant here given the cardiovascular risk profile and the CKD.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (already excellent at 0.72, so the benefit here is anti-inflammatory), reduces hsCRP, and supports kidney function. The hsCRP of 1.3 and the ApoB of 1.05 are both markers that omega-3 can help lower.\nMagnesium glycinate: 300 mg before bed. Why: magnesium is 0.89 mmol/L, within the optimal range, but at this dose it supports sleep quality, stress management and blood pressure, all of which are relevant given her reports of broken sleep, daily stress and hypertension.\nFolate (methylfolate): 400 mcg daily. Why: serum folate is 7 ng/mL, fractionally below the optimal level of 8. This is a small shortfall easily corrected with a supplement or increased green vegetables.\nDo not take iron supplements. Ferritin is 96 ng/mL and iron studies are healthy. Additional iron is not needed and would not help.\nThe most important changes from this report are not supplements. They are reducing ultra-processed food and sugar, reducing alcohol to under 7 drinks per week, building to 7,000 steps a day, and discussing the Lp(a) and urinary findings with the GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 55.1; held to 49 by two or more systems rated \"See your GP\". Weakest systems: immunology 19%, lipids & cardiovascular 21%, hormones 25%. Biggest drags: Apolipoprotein B, Lipoprotein(a), TSH, Total Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"50.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4192","lower_normal":"","upper_normal":"60","lower_optimal":"","upper_optimal":"55","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4583","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 50.3 years against a calendar age of 55 places her biological age nearly five years younger than her actual age. This is driven by the excellent glucose, reasonable albumin and low CRP. The lifestyle changes in this report, particularly reducing processed food, increasing activity and improving sleep, should widen this gap further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built, not the ten-year chance of an event. Her score of 60 is well above the ideal threshold of 20 and above the acceptable limit of 40. The main drivers are the Lp(a) at 207.61 and the ApoB at 1.05. Lifestyle changes can lower the modifiable contributors (ApoB, hsCRP), but the Lp(a) component requires a medical conversation about overall cardiovascular risk management.","low_causes":"Low Lp(a), low ApoB, high HDL, low hsCRP, low HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. Her result of 4.6 mmol/L sits within the optimal range of 4.0 to 5.4, confirming excellent blood sugar regulation. Despite a diet heavy in ultra-processed food and sugar several times a day, the body is keeping fasting glucose tightly controlled. This is a genuinely encouraging finding at a BMI of 28.3 with no exercise.","low_causes":"Prolonged fasting, excess insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, insulin resistance, stress, medications, high-sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3917","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"%","description":"HbA1c percentage is an alternative way of reporting the same glycated haemoglobin result. Her 4.7% is well within the normal range of below 6.0% and comfortably within optimal. This confirms excellent average blood sugar control over the past two to three months.","low_causes":"Haemolytic anaemia, blood loss, some haemoglobin variants","high_causes":"Diabetes, prediabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar over the past two to three months. Her result of 28 mmol/mol is well below the normal threshold of 42 and below the optimal level of 36. This is an excellent result that makes diabetes and prediabetes very unlikely.","low_causes":"Haemolytic anaemia, blood loss, some haemoglobin variants","high_causes":"Diabetes, prediabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3525","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone released by the pancreas to move glucose out of the blood and into cells. Her fasting insulin of 3.88 mIU/L is within the optimal range of 2 to 8, confirming that the pancreas is producing just the right amount and the body is responding to it efficiently. At a BMI of 28.3 with a heavily processed diet, this is a surprisingly positive finding.","low_causes":"Low carbohydrate diet, very high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, prediabetes, PCOS, excess carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name": ivity, low carbohydrate diet","high_causes":"Insulin resistance, obesity, high-sugar diet, sedentary lifestyle, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate average blood sugar over the past two to three months. Her estimated average of 4.9 mmol/L is within the optimal range, confirming excellent glucose control.","low_causes":"Very tight blood sugar control, haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4477","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is calculated from fasting triglycerides and glucose and is used as a surrogate marker of insulin resistance. Her index of 7.88 is well within the optimal range of below 8.5, consistent with the excellent HOMA-IR and confirming insulin sensitivity.","low_causes":"High insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"134","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"120","uppe e low neutrophil count, which in a person of Black African or Caribbean ethnicity is a recognised normal variant called benign ethnic neutropenia. The other white cell subtypes are all within range.","low_causes":"Viral infection, medications, autoimmune conditions, bone marrow disorders, benign ethnic neutropenia","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"1.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2980","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. Her count of 1.47 is below the laboratory lower limit of 2.0. In people of Black African or Caribbean ethnicity, a lower baseline neutrophil count is a well-documented and benign normal variant known as benign ethnic neutropenia. It does not carry the same infection risk as a genuinely pathological low count and does not require treatment. It should be documented in the GP record so that future blood tests are interpreted correctly.","low_causes":"Benign ethnic neutropenia, viral infections, medications, autoimmune conditions, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5050","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position icating well-maintained calcium balance.","low_causes":"Vitamin D deficiency, parathyroid insufficiency, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium reading for albumin levels, giving a more accurate picture of the true calcium in the blood. Her result of 2.42 mmol/L is within the normal range and within optimal. The normal calcium alongside the mildly raised PTH suggests that the PTH elevation is compensatory, likely driven by the suboptimal vitamin D.","low_causes":"Vitamin D deficiency, parathyroid insufficiency, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4176","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3602","upper_optimal_position":"0.5900","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bones and teeth, and plays a role in energy production. Her result of 1.0 mmol/L is within the normal range and within optimal.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D","padding" th better cognitive health.","low_causes":"Low sun exposure, darker skin pigmentation, obesity, malabsorption, winter months","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"4.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6729","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.6018","units":"pmol/L","description":"PTH, parathyroid hormone, is released by four small glands behind the thyroid. It controls calcium balance by pulling calcium from bone, increasing absorption in the gut and reducing excretion by the kidneys. Her result of 4.8 pmol/L is marginally above the upper limit of 4.73. With corrected calcium normal at 2.42 and phosphate normal at 1.0, this is most likely a compensatory response to the suboptimal vitamin D of 56 nmol/L. When vitamin D is low, the body raises PTH to maintain calcium. Improving vitamin D to the 75 to 100 range should bring PTH back within range. Given her CKD, the GP should also monitor calcium and PTH as part of renal care.","low_causes":"Excess vitamin D, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, hyperparathyroidism, kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"492","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4597","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red eans that half of all the cholesterol in her blood is the good kind. This is an outstanding proportion.","low_causes":"Low HDL, metabolic syndrome","high_causes":"Very high HDL, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol-carrying particles including LDL, VLDL and Lp(a). Her result of 3.0 mmol/L is within the laboratory range of below 4 but above the optimal level of below 2.6. Part of this is driven by the Lp(a)-bound cholesterol which cannot be changed.","low_causes":"Very low LDL, statins","high_causes":"High LDL, high triglycerides, Lp(a), diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"3.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and is essential for the reverse cholesterol transport that removes cholesterol from artery walls. Her result of 3.03 g/L is well above the normal threshold of 1.4 and reflects the very high HDL level. This is an exceptionally high reading and a strong cardiovascular positive.","low_causes":"Genetic factors, metabolic syndrome, smoking, sedentary lifestyle","high_causes":"Genetics, exercise, oestrogen, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is a protein found on every LDL, VLDL and Lp(a) particle. It is the single best measure of how many atherogenic (artery-damaging) particles are circulating, because each particle carries exactly one ApoB molecule. Her result of 1.05 g/L is above the target of below 0.9 and in the borderline-high category (1.0 to 1.19). With an Lp(a) of 207.61, a significant number of those ApoB-carrying particles are Lp(a) particles that cannot be reduced by lifestyle. The modifiable ApoB can be lowered by reducing saturated fat, increasing soluble fibre, omega-3 and potentially with medication if the GP decides overall risk warrants it.","low_causes":"Statins, very low fat diet, hyperthyroidism","high_causes":"High saturated fat diet, genetics, hypothyroidism, Lp(a), diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB:A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.346535","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2888","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio is one of the best overall measures of the balance between harmful and protective lipid particles. Her ratio of 0.35 is well within the lower risk category of below 0.6 and within optimal. Despite the elevated ApoB, the exceptionally high ApoA1 driven by her remarkable HDL keeps this ratio very favourable.","low_causes":"Very high HDL, very low LDL","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"207.61","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a cholesterol-carrying particle similar to LDL but with an additional protein attached called apolipoprotein(a). It deposits cholesterol in artery walls, encourages blood clot formation and drives inflammation in blood vessels. It is entirely genetically determined and does not change with diet, exercise or lifestyle. Her level of 207.61 nmol/L is in the raised risk category. This is the finding with the greatest relevance to her long-term cardiovascular health. She should record this number permanently, discuss it with her GP as part of an overall cardiovascular risk assessment, and first-degree relatives should be offered testing because the gene is inherited.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited from one or both parents)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase is an enzyme found in muscles that is released into the blood when muscle tissue is damaged or under heavy use. Her result of 102 U/L is within the normal range and within optimal, indicating no significant muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"16.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4, free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. Her result of 16.3 pmol/L is within the normal range and within the optimal band of 14 to 20, indicating healthy thyroid hormone output.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3255","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is released by the pituitary gland to tell the thyroid how much hormone to produce. A low TSH suggests the pituitary senses enough or too much thyroid hormone and is turning down the signal. Her result of 0.45 mIU/L is below the lower limit of 0.55. However, her free T4 at 16.3 and free T3 at 4.8 are both within the function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
