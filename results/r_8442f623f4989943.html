<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Sophie Crates","dob":"02/03/1993","report_date":"2026-08-14","summary":"Sophie is a 33-year-old female presenting with a BMI of 25.6, following a standard mixed diet rated 4 out of 10 for quality with a volume of 4 out of 10. She does two sessions of cardio per week with no resistance training and walks between 5,000 and 7,500 steps per day. She takes an SSRI (sertraline or fluoxetine) and ferrous sulphate for known anaemia. She reports low energy and fatigue, poor sleep and insomnia, and low mood and anxiety. She has a diagnosis of polycystic ovary syndrome (PCOS). Her goals are to improve digestion and gut health, improve mood, and improve energy levels. She describes being unable to sleep before 2am, waking around 9 to 9:30am, and feeling so exhausted by 4pm that she wants to sleep in the afternoon, despite taking iron supplements.\n\nThe most pressing finding in this report is a confirmed urinary tract infection. The urine sample has grown a heavy count of Escherichia coli, a common bacterium responsible for the majority of UTIs, with 180 white blood cells per microlitre confirming that the body is actively fighting this infection. The sensitivity panel shows the organism is responsive to most standard antibiotics including nitrofurantoin, trimethoprim, and amoxicillin/clavulanic acid, with intermediate sensitivity to ciprofloxacin and temocillin. Sophie should contact her GP promptly to arrange a prescription. It is worth noting that the sample was received in a plain bottle without boric acid preservative, which can allow bacterial overgrowth in transit, but the combination of a very high white cell count alongside the heavy growth makes this a genuine infection rather than a contamination artefact. A UTI of this nature can itself contribute to fatigue and general malaise, so treating it may deliver some early relief.\n\nThe second finding that needs GP attention is her vitamin B12 at 139 pg/ml, which is significantly below the lower limit of 193 and well below the optimal floor of 500. B12 is essential for red blood cell production, nerve function, and energy metabolism. At this level it is genuinely depleted, and this is almost certainly contributing to her fatigue, low mood, and poor concentration. SSRIs work less effectively when B12 is deficient because B12 is needed to produce the neurotransmitters that SSRIs are designed to support. The fact that she is already exhausted despite iron supplementation makes B12 the most likely missing piece. Her folate (vitamin B9, which works hand in hand with B12 to build red blood cells) is 3 ng/ml, sitting right at the bottom of the laboratory range of 3 to 17 and well below the optimal threshold of 8. Low B12 and low folate together impair DNA synthesis in developing red blood cells, and this is visible in her blood count: her MCH (mean corpuscular haemoglobin, the average weight of haemoglobin packed into each red blood cell) is 32.4 pg against an upper limit of 32, and her MCV (the average size of each red cell) is 95.3, which while within range is towards the upper end. Both of these are characteristic of early megaloblastic change, where the bone marrow produces fewer but larger red cells because it lacks the vitamins to divide them properly. Her absolute reticulocyte count (the number of brand new red blood cells being released from the bone marrow) is 21.9, significantly below the lower limit of 50, confirming that the marrow is not producing red cells at the rate it should. This is the clearest explanation for why iron supplementation alone has not resolved her fatigue. The iron is arriving but the marrow cannot use it efficiently without adequate B12 and folate. Her GP should consider a course of B12 injections given the severity of the deficiency, and folate supplementation should begin alongside. Sophie should also be investigated for the cause of the B12 deficiency, whether dietary insufficiency, absorption issues, or an effect of her SSRI, as some evidence suggests long-term SSRI use may impair B12 absorption.\n\nHer parathyroid hormone (PTH) is 0.9 pmol/L, marginally below the lower limit of 0.98. PTH is the hormone that regulates calcium levels in the blood, and it is produced by four small glands behind the thyroid. Her corrected calcium at 2.47 is healthy and within the optimal range of 2.2 to 2.6, and her vitamin D at 71 is sufficient though below the optimal threshold of 75. PTH being suppressed while calcium is normal is a pattern sometimes seen when calcium intake is adequate and vitamin D is reasonable, so the parathyroid glands simply do not need to work hard. However, it should be noted to the GP for a baseline record, particularly as vitamin D levels climb with supplementation, because rising vitamin D can further suppress PTH.\n\nTurning to what is working well: Sophie's liver is in excellent health. Her ALT at 15 is comfortably below the optimal ceiling of 25 for women, her Gamma GT at 12 is well within the optimal range of below 25, and her FIB-4 score at 0.53 shows no sign of any fibrotic change. Her AST, ALP, bilirubin, and amylase are all unremarkable. Her kidneys are functioning well, with a creatinine-based eGFR above 90 and a Cystatin C-based eGFR of 92, both confirming healthy filtration. Her Cystatin C itself at 1.06 is within range. Her inflammation is exceptionally low, with a high-sensitivity CRP (a marker of systemic inflammation) at 0.2 mg/L, which is well below the optimal ceiling of 1.0 and about as low as this marker gets. This is particularly reassuring in someone with PCOS, where chronic low-grade inflammation is common. Her lipid profile is genuinely strong: total cholesterol at 4.0, LDL at 2.08 which is below the optimal ceiling of 2.6, HDL at 1.4 which sits right at the boundary between adequate and optimal for women, ApoB (the protein that carries LDL particles and the single best predictor of cardiovascular risk) at 0.75 which is below the optimal threshold of 0.8, and an ApoB to ApoA1 ratio of 0.54 which places her in the lower risk category. Her Lp(a), an inherited and unchangeable cardiovascular risk factor, is below 25 nmol/L, well within the safe range. This is a permanently useful piece of information: it means her cardiovascular risk profile is driven entirely by modifiable lifestyle factors and is currently very well managed. Her triglycerides at 1.27 are within the laboratory range but above the optimal ceiling of 1.0, and her triglyceride-to-HDL ratio calculates to 0.91, marginally above the optimal ceiling of 0.87. In the context of PCOS these are worth keeping an eye on because insulin resistance and triglycerides tend to track together, but they are far from concerning. Her thyroid function is healthy, with TSH at 2.31 sitting within the optimal range of 1.0 to 2.5, free T4 at 14.2 which is at the lower edge of the optimal band, and free T3 at 5.0 which is within the optimal range. Both thyroid antibody panels are negative, ruling out autoimmune thyroid disease. Her immune system markers (IgG, IgM, IgA, IgE, and rheumatoid factor) are all within range. Her coeliac screen is negative. Her tumour markers (CA-125, CA 15-3, CA 19-9, and CEA) are all reassuringly low. Her creatine kinase at 63 is normal. Her total antioxidant activity at 1.4 is within range. Her ESR (erythrocyte sedimentation rate, another inflammation marker) at 8 is well within the limit of 12.\n\nHer HOMA-IR (a calculation that estimates insulin resistance using fasting glucose and insulin together) is 1.79, above the upper optimal limit of 1.5. The lab flags concern above 1.9, so she sits just below that threshold, but this is nonetheless a marker to take seriously in the context of PCOS. Insulin resistance is the metabolic engine that drives many PCOS symptoms, including weight gain around the middle, irregular cycles, acne, and fatigue. Her fasting glucose at 5.0 and HbA1c at 32 mmol/mol are both excellent, so blood sugar control is currently well maintained, but the insulin level of 8.06 suggests the pancreas is working a little harder than ideal to achieve that control. The good news is that HOMA-IR is one of the most responsive markers to lifestyle change. Increasing daily step count, adding resistance training, and improving diet quality would all be expected to bring this number down.\n\nHer hormonal picture tells a story consistent with PCOS. Her testosterone at 0.4 nmol/L is below the lower limit of 0.5, which at first glance seems the opposite of what one expects with PCOS, but her SHBG (sex hormone binding globulin, the protein that carries testosterone in the blood) is also low at 26.4 against a lower limit of 27.8. Low SHBG is a hallmark of insulin resistance and PCOS, and it means that a greater proportion of whatever testosterone is circulating is free and active. Her free androgen index at 1.52 is within range but positioned in the context of very low total testosterone, so the ratio of free to bound androgen is shifted. Her DHEA-S at 2.2 umol/L (approximately 811 ug/dL) is within range. Her oestradiol at 49 pmol/L and progesterone at 1.13 nmol/L, alongside LH of 7.84 and FSH of 7.47, are consistent with early follicular phase or an anovulatory cycle, which is common in PCOS. The LH-to-FSH ratio is approximately 1.05, which is within normal limits; in classical PCOS this ratio is often elevated above 2, suggesting that Sophie's PCOS may be more of the metabolic or insulin-resistant phenotype than the classic high-androgen phenotype. Her prolactin at 320 is within the non-pregnant range of 59 to 619. Her cortisol at 232 nmol/L is within the expected morning range.\n\nHer iron studies tell an important story when read alongside the B12 and folate deficiency. Her ferritin is 21 ng/ml, which is within the laboratory range of 10 to 291 but well below the optimal floor of 40 for women. Despite being on ferrous sulphate, her stores have not climbed to a level that would support good energy, exercise recovery, or immune function. Her serum iron at 18.1 and transferrin saturation at 21.5% are both within range but below the optimal floor of 25% for saturation. Her transferrin at 3.35 and total iron binding capacity at 70.6 are both within range and appropriately elevated, as the body upregulates transferrin when it needs more iron. The fact that ferritin remains low on supplementation raises the question of whether she is absorbing the ferrous sulphate effectively. Ferrous sulphate is the most commonly prescribed form but also the least well tolerated and absorbed. Switching to ferrous bisglycinate, taken with vitamin C on an empty stomach, may improve uptake. Her GP should also consider whether B12 and folate deficiency are themselves limiting the body's ability to use the iron it absorbs, because all three nutrients are needed together for effective red blood cell production.\n\nHer haemoglobin at 125 is within the female range of 120 to 150 but at the lower end, and her red blood cell count at 3.85 is at the floor of the range. Combined with the low reticulocyte output, low ferritin, depleted B12, and borderline folate, this is a picture of a bone marrow that has the raw material for iron (just about) but lacks the B12 and folate to use it efficiently. Correcting all three deficiencies should produce a meaningful improvement in her energy levels over the coming 8 to 12 weeks.\n\nHer magnesium at 0.99 is within the optimal range of 0.85 to 1.05, which is a genuine positive. Her corrected calcium at 2.47 is healthy. Her potassium at 4.4, sodium at 144, and chloride at 106 are all within range. Her uric acid at 239 is within the female optimal range. Her bicarbonate at 20.6 is at the lower end of the range (20 to 31), which is not clinically significant but does contribute to an anion gap calculation of 21.8, which is above the standard range of 8 to 16. Mild elevations in the anion gap can be seen with dehydration, mild ketosis from poor dietary intake, or simply from the metabolic stress of an active infection. In the context of her low diet volume, active UTI, and otherwise normal kidney function, this is not alarming but should normalise once the infection is treated and hydration improves.\n\nHer vitamin D at 71 nmol/L is sufficient but below the optimal range of 75 to 120. At her current BMI this will respond well to supplementation.\n\nIn summary, Sophie's fatigue has at least four identifiable contributors: a confirmed urinary tract infection, significant vitamin B12 deficiency, low folate, and suboptimal iron stores despite supplementation. Her disrupted sleep pattern (unable to sleep before 2am, waking at 9:30, crashing at 4pm) is characteristic of a delayed circadian rhythm, and while the nutritional deficiencies and infection are compounding this, addressing sleep timing directly will be important. Her PCOS is manifesting primarily through insulin resistance and low SHBG rather than through classical androgen excess, and this is the phenotype most responsive to lifestyle intervention. The immediate priorities are treating the UTI, correcting the B12 deficiency (ideally with GP-administered injections initially), beginning folate supplementation, optimising iron absorption, and building a sleep and exercise routine that addresses the insulin resistance and circadian disruption together.","links":"Sophie's results point to several clear actions, and addressing them in the right order will give her the best chance of feeling measurably better within two to three months.\n\nThe first step is to contact her GP this week to arrange treatment for the confirmed E. coli urinary tract infection. She should mention that the sensitivity panel shows the organism is responsive to nitrofurantoin, trimethoprim, ampicillin, and amoxicillin/clavulanic acid. She should also bring the B12 result of 139 pg/ml (lower limit 193) to the GP's attention and request B12 injections. Given the severity of the deficiency, a loading course of intramuscular hydroxocobalamin (typically six injections over two weeks) followed by maintenance injections is more reliable than oral supplementation for initial correction. Once levels have been restored, she can maintain with sublingual methylcobalamin at 1,000 mcg daily. She should ask the GP whether investigation into the cause of the B12 deficiency is warranted, including intrinsic factor antibodies to exclude pernicious anaemia and a review of whether her SSRI may be contributing to poor absorption. She should also mention the low PTH of 0.9 (lower limit 0.98) for the clinical record, alongside the normal calcium.\n\nFor folate, she should begin supplementation with methylfolate (the active form, also called 5-MTHF) at 400 to 800 mcg daily. This is preferable to folic acid because it bypasses the MTHFR conversion step that a significant proportion of the population handles inefficiently. Folate and B12 must be corrected together, as supplementing folate alone in the presence of B12 deficiency can mask the deficiency while neurological damage continues.\n\nFor iron, she should discuss switching from ferrous sulphate to ferrous bisglycinate (also called iron bisglycinate or gentle iron), which is better absorbed and causes fewer gastrointestinal side effects. A dose of 25 mg elemental iron taken with 500 mg of vitamin C on an empty stomach, ideally in the morning, will maximise absorption. She should avoid taking iron within two hours of tea, coffee, dairy, or calcium supplements, as these block absorption. She should also avoid taking iron at the same time as her SSRI. Once B12 and folate are corrected, the iron should be more effectively utilised by the bone marrow, and ferritin should begin to climb towards the target of 50 to 80.\n\nFor vitamin D, she should take 2,000 IU of vitamin D3 (cholecalciferol) daily with her largest meal containing fat. She should pair this with 100 mcg of vitamin K2 in the MK-7 form, which directs the calcium that vitamin D helps absorb into bones rather than arteries.\n\nFor her sleep, the pattern she describes (unable to sleep before 2am, waking at 9:30, crashing at 4pm) is a delayed circadian rhythm and is one of the most impactful things she can change. The recommendations are: set a fixed wake time of 8am regardless of when she fell asleep and protect it seven days a week; get outside into natural daylight within 30 minutes of waking, even on overcast days, for at least 15 minutes; cut caffeine entirely after 12 noon; keep the bedroom cool (16 to 18 degrees); avoid screens for 60 minutes before her target sleep time; and consider 300 to 400 mg of magnesium glycinate 30 to 60 minutes before bed, which supports both sleep quality and insulin sensitivity. The 4pm crash should begin to lift as the circadian rhythm resets and the nutritional deficiencies are corrected.\n\nFor her PCOS and insulin resistance, the single most effective intervention is resistance training. She currently does none, and adding two sessions per week of progressive resistance work (squats, deadlifts, rows, presses) would improve insulin sensitivity, increase muscle mass (which acts as a glucose sink), support mood through the neurochemical effects of strength training, and improve sleep quality. She should aim to build to three sessions per week over two to three months. Her daily step count of 5,000 to 7,500 is a reasonable base but increasing to 8,000 to 10,000 would further improve insulin sensitivity and energy levels. Walking after meals, even for 10 to 15 minutes, has a disproportionate effect on post-meal glucose and insulin.\n\nFor nutrition, Sophie's diet quality of 4 out of 10 and volume of 4 out of 10 both need attention. Her estimated maintenance calories at her current activity level (light, multiplier 1.45) are approximately 1,580 kcal per day based on a BMR of around 1,490 (Mifflin-St Jeor). At a diet volume of 4 she is likely eating inconsistently, with long gaps followed by larger meals, which worsens insulin resistance. She should aim for 1,500 to 1,600 kcal spread across three meals and one snack, with protein at 1.3 g per kg of body weight, giving a target of 96 g per day. Protein at every meal stabilises blood sugar, supports muscle preservation, and improves satiety. She should prioritise 25 to 30 g of fibre per day from vegetables, oats, lentils, and berries, which will support her digestion goal and help manage the PCOS-related insulin resistance. Reducing refined carbohydrates and processed foods in favour of whole food sources will improve both her diet quality score and her metabolic markers.\n\nFor her mood, correcting B12 deficiency alone may produce a noticeable improvement, as B12 is a cofactor in serotonin and dopamine production and its deficiency can blunt the effectiveness of SSRIs. The addition of regular exercise, improved sleep, and better nutrition should compound this effect. She should discuss with her GP whether her SSRI dose needs review once the deficiencies are corrected.\n\nRetesting should be scheduled for 10 to 12 weeks after beginning B12 injections, folate, and optimised iron supplementation. The retest should include: full blood count with reticulocytes, vitamin B12, serum folate, ferritin, transferrin saturation, HOMA-IR, fasting insulin, fasting glucose, PTH, vitamin D, and a repeat urine culture to confirm clearance of the UTI. If symptoms persist despite normalisation of these markers, further investigation into gut absorption (coeliac has been excluded but small intestinal bacterial overgrowth or other causes remain possible) would be appropriate.","flags":"URGENT: Urine culture has grown heavy Escherichia coli (10^5 CFU/ml) with 180 WBC/ul confirming active urinary tract infection. Sensitivity panel available. Requires antibiotic treatment. Note: plain bottle received, absence of boric acid acknowledged, but WBC count and clinical picture support genuine infection.\n\nVitamin B12: 139 pg/ml (range 193 to 982). Significantly deficient. Likely contributing to fatigue, low mood, and impaired red cell production. Loading course of intramuscular hydroxocobalamin recommended. Investigate cause: consider intrinsic factor antibodies, SSRI effect on absorption, and dietary intake.\n\nSerum Folate: 3 ng/ml (range 3 to 17). At the floor of the laboratory range, well below optimal of 8. Combined B12 and folate deficiency explains the macrocytic red cell indices and low reticulocyte output. Supplement with methylfolate 400 to 800 mcg daily.\n\nAbsolute Reticulocytes: 21.9 x10^9/L (range 50 to 100). Significantly below range, confirming suppressed red cell production consistent with B12 and folate deficiency.\n\nMCH: 32.4 pg (range 27 to 32). Marginally above range. Early megaloblastic change consistent with B12 and folate deficiency.\n\nFerritin: 21 ng/ml (range 10 to 291, optimal 40 to 150). Suboptimal despite ferrous sulphate supplementation. Consider switching to ferrous bisglycinate for improved absorption. Target ferritin above 50.\n\nTransferrin Saturation: 21.5% (range 18 to 55, optimal 25 to 40). Below optimal, consistent with iron stores that are functional but not replete.\n\nHOMA-IR: 1.79 (optimal below 1.5, lab flags concern above 1.9). Mildly elevated, consistent with the insulin-resistant phenotype of PCOS. Responsive to lifestyle intervention.\n\nTestosterone: 0.4 nmol/L (range 0.5 to 2.6). Below range. In context of PCOS with low SHBG, the free androgen index (1.52) is within range, suggesting relative androgen activity may be higher than total testosterone implies.\n\nSHBG: 26.4 nmol/L (range 27.8 to 146). Marginally below range. Low SHBG is characteristic of insulin resistance and PCOS.\n\nPTH: 0.9 pmol/L (range 0.98 to 4.73). Marginally below range with normal corrected calcium (2.47) and sufficient vitamin D (71). Likely physiological suppression. Record as baseline and monitor as vitamin D supplementation begins.\n\nVitamin D: 71 nmol/L. Sufficient but below optimal range of 75 to 120. Supplement with 2,000 IU cholecalciferol daily.\n\nAnion Gap (calculated): 21.8 mmol/L (range 8 to 16). Elevated. Most likely explained by active infection, possible mild dehydration, and low dietary volume. Should normalise with UTI treatment and improved hydration.\n\nReassuring negatives: Liver function excellent (ALT 15, GGT 12, FIB-4 0.53). CRP 0.2 confirming no systemic inflammation beyond the localised UTI. Thyroid function normal with negative antibodies. Lipid profile strong with ApoB 0.75 and Lp(a) below 25. HbA1c 32 and fasting glucose 5.0 confirming no diabetes. Coeliac screen negative. All tumour markers normal. Kidney function normal (eGFR above 90, Cystatin C eGFR 92). No haematuria. Immunoglobulins normal.","recommendations":"1. Contact GP this week for antibiotic prescription to treat confirmed E. coli UTI. Bring the sensitivity panel results.\n\n2. Request B12 injection loading course from GP (hydroxocobalamin, six injections over two weeks, then maintenance). Discuss investigating the cause of deficiency including intrinsic factor antibodies.\n\n3. Begin methylfolate supplementation at 400 to 800 mcg daily alongside B12 correction.\n\n4. Discuss switching from ferrous sulphate to ferrous bisglycinate 25 mg with vitamin C, taken on an empty stomach in the morning, away from tea, coffee, and SSRI.\n\n5. Begin vitamin D3 2,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 100 mcg.\n\n6. Fix sleep timing: set 8am wake time seven days a week, get outside within 30 minutes, cut caffeine after noon, screens off 60 minutes before bed.\n\n7. Add two resistance training sessions per week, building to three over two to three months.\n\n8. Increase daily steps to 8,000 to 10,000, including a 10 to 15 minute walk after meals.\n\n9. Aim for 1,500 to 1,600 kcal daily across three meals and one snack, with 96 g protein per day (1.3 g/kg) and 25 to 30 g fibre.\n\n10. Retest in 10 to 12 weeks: FBC with reticulocytes, B12, folate, ferritin, transferrin saturation, HOMA-IR, fasting insulin, fasting glucose, PTH, vitamin D, urine culture.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. This is for maintenance after the GP-administered loading injections. Her B12 at 139 is significantly depleted and oral supplementation alone is unlikely to correct the deficiency quickly enough, which is why injections should come first. Once levels are above 500, the sublingual form will maintain them.\n\nMethylfolate (5-MTHF): 400 to 800 mcg daily, taken in the morning. Her folate at 3 is at the floor of the range and needs to rise above 8 for optimal red blood cell production and neurotransmitter support. The methylated form is preferable to synthetic folic acid.\n\nIron (ferrous bisglycinate): 25 mg elemental iron, taken on an empty stomach in the morning with 500 mg vitamin C to enhance absorption. Take at least two hours away from tea, coffee, dairy, calcium, and her SSRI. This replaces her current ferrous sulphate, which despite ongoing use has only achieved a ferritin of 21. Ferrous bisglycinate is better absorbed and better tolerated. Target ferritin is 50 to 80.\n\nVitamin D3 (cholecalciferol): 2,000 IU daily, taken with her largest meal that contains fat. Her level of 71 is sufficient but below the optimal threshold of 75. This dose should bring her into the 80 to 100 range over 8 to 12 weeks.\n\nVitamin K2 (MK-7): 100 mcg daily, taken with vitamin D3. This ensures the calcium that vitamin D helps absorb is directed into bones rather than soft tissues and arteries.\n\nMagnesium glycinate: 300 to 400 mg, taken 30 to 60 minutes before bed. Her serum magnesium at 0.99 is within the optimal range, but magnesium glycinate specifically supports sleep quality, reduces muscle tension, and improves insulin sensitivity, all of which are relevant to her PCOS and sleep difficulties.\n\nOmega-3 fish oil: 2 g combined EPA and DHA daily, taken with food. This supports the mild triglyceride elevation (1.27, optimal below 1.0), provides anti-inflammatory support, and has evidence for mood improvement alongside SSRIs.\n\nThe most important changes from this report are not supplements. They are treating the UTI, correcting the B12 deficiency through GP-administered injections, fixing the sleep schedule by anchoring a consistent 8am wake time with morning daylight, and beginning resistance training to address the insulin resistance that is driving her PCOS.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6093","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar at rest. Sophie's result of 5.0 mmol/L falls within the optimal range of 4.0 to 5.4, indicating that her blood sugar regulation is working well at this point in time. In the context of PCOS and a mildly elevated HOMA-IR, this is a reassuring finding that confirms glucose control is currently well maintained even if insulin is working a little harder to achieve it.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin-producing tumours","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress response, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Sophie's result of 5.0% is well within the normal range (below 6.0%) and optimal, confirming excellent long-term blood sugar control. This is reassuring alongside her PCOS diagnosis.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Pre-diabetes, type 2 diabetes, sustained high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. Sophie's result of 32 mmol/mol is well below the normal threshold of 42 and below the optimal ceiling of 36, confirming excellent average blood sugar levels over the past two to three months.","low_causes":"Haemolytic anaemia, chronic blood loss, recent transfusion","high_causes":"Pre-diabetes, type 2 diabetes, sustained high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"8.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4148","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3107","upper_optimal_position":"0.5751","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is releasing while fasting. Insulin is the hormone that tells cells to absorb glucose from the blood. Sophie's result of 8.06 mIU/L is within the laboratory range of 2.6 to 24.9 but just above the optimal ceiling of 8. This means the pancreas is working slightly harder than ideal to maintain her excellent blood sugar levels. In the context of PCOS, where insulin resistance is a core driver of the condition, this mild elevation is consistent with her diagnosis and is the kind of marker that responds well to resistance training, increased steps, and dietary changes.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, PCOS, high carbohydrate diet, excess body fat, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"516.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4636","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4957","units":"pmol/L","description":"C-Peptide is released from the pancreas in equal amounts to insulin and serves as a reliable marker of how much insulin the body is actually producing (as opposed to insulin injected externally). Sophie's result of 516.36 pmol/L (converted from 1.56 ug/L) is within the normal range of 364.1 to 1456.4 pmol/L. It confirms appropriate pancreatic insulin secretion.","low_causes":"Type 1 diabetes, very low carbohydrate diet, advanced pancreatic insufficiency","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7627","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's signal. A lower number means cells respond well to insulin; a higher number means the pancreas has to produce more insulin to get the same glucose-lowering effect. Sophie's result of 1.79 is above the optimal range of 0.5 to 1.5. The lab notes that above 1.9 indicates early insulin resistance, so she sits just below that threshold. In the context of PCOS, this mild insulin resistance is a key driver of the condition and is the most responsive marker to lifestyle change, particularly resistance training and dietary improvement.","low_causes":"High insulin sensitivity, very low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, PCOS, excess body fat, sedentary lifestyle, high refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"107.47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5582","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5278","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, the cells responsible for producing insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Sophie's result of 107.5 is within the normal range of 80 to 200, indicating healthy pancreatic function. The beta cells are producing an appropriate amount of insulin for the glucose levels present.","low_causes":"Beta cell dysfunction, type 1 diabetes, advanced type 2 diabetes, very low carbohydrate diet with very low insulin","high_causes":"Insulin resistance (compensatory increase), high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform essential functions including transporting hormones and nutrients, fighting infection, and maintaining fluid balance. Sophie's result of 66 g/L is within the laboratory range of 57 to 82 but below the optimal band of 63 to 79, sitting in the lower portion of the range. This may reflect her low dietary volume (rated 4/10) and suboptimal protein intake.","low_causes":"Low protein diet, malabsorption, liver disease, kidney disease","high_causes":"Dehydration, chronic infection, inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and keeps fluid from leaking out of blood vessels. Sophie's result of 38 g/L is within the laboratory range of 34 to 50 but below the optimal floor of 40. This likely reflects her low dietary protein intake and volume. Improving protein intake to the recommended 96 g per day should help this marker.","low_causes":"Low protein diet, liver disease, kidney disease, inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"23","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4259","upper_optimal_position":"0.6481","units":"g/L","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. They play important roles in immune function and carrying substances through the blood. Sophie's result of 28 g/L is within the normal range and within the optimal band, indicating healthy immune protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3857","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main types of protein in the blood. It is calculated by dividing albumin by globulin. Sophie's result of 1.36 is within the normal range of 1.1 to 2.5 and within the optimal band, indicating a healthy balance between these two protein types.","low_causes":"Liver disease, kidney disease, autoimmune conditions, chronic inflammation","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5143","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and digestive system. It is involved in breaking down proteins and is used as a marker of liver and bone health. Sophie's result of 84 IU/L is within the normal range of 46 to 116.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone growth, liver disease, bile duct obstruction, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Elevated levels can indicate liver problems or excessive red cell destruction. Sophie's result of 5 umol/L is at the lower boundary of the range, which is entirely normal and indicates healthy liver clearance.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (GPT)","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1339","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Sophie's result of 15 IU/L is well below both the laboratory limit of 56 and the optimal female ceiling of 25, indicating that her liver is under no metabolic strain at all.","low_causes":"Not clinically significant","high_causes":"Liver inflammation, fatty liver disease, alcohol excess, medication effects, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (GOT)","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4896","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. Sophie's result of 17 IU/L is within the normal and optimal ranges, confirming healthy liver and muscle tissue.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1828","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculation that estimates the likelihood of liver fibrosis (scarring) using age, AST, ALT, and platelet count. Sophie's score of 0.53 is well below the threshold of 1.3, indicating no evidence of liver fibrosis whatsoever. This is an excellent result.","low_causes":"Not clinically significant, indicates healthy liver","high_causes":"Liver fibrosis, cirrhosis, age-related changes, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1579","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems, and metabolic stress on the liver. Sophie's result of 12 IU/L is well within both the female laboratory range (4 to 38) and the optimal ceiling of 25. This confirms the liver is healthy and under no strain.","low_causes":"Not clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4394","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.66  healthy total cholesterol level.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"High saturated fat diet, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3735","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are a type of fat in the blood that the body uses for energy. They rise after meals, particularly those rich in carbohydrates and sugar. Chronically elevated levels are associated with cardiovascular risk and insulin resistance. Sophie's result of 1.27 mmol/L is within the fasting laboratory range (below 1.7) but above the optimal ceiling of 1.0. In the context of PCOS and mild insulin resistance, this mild elevation is consistent and should improve with dietary changes and increased physical activity.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate/sugar diet, insulin resistance, PCOS, obesity, alcohol excess, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3718","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) is a type of cholesterol particle made by the liver that carries triglycerides through the bloodstream. It is considered atherogenic (contributing to arterial plaque). Sophie's result of 0.58 mmol/L is within the range of below 0.78 and within the optimal band.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4516","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.6","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is often called 'good' cholesterol because it carries cholesterol away from the arteries back to the liver for disposal. Higher levels are protective against cardiovascular disease. Sophie's result of 1.4 mmol/L is above the minimum desirable level of 1.04 but below the optimal threshold of 1.6 for women. Regular exercise, particularly resistance training and increased step count, would be expected to raise HDL.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4427","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) carries cholesterol to the tissues and, when elevated, deposits it in arterial walls contributing to atherosclerosis. Sophie's result of 2.08 mmol/L is within the laboratory range and below the optimal ceiling of 2.6, which is an excellent result.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, genetic factors, hypothyroidism, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3178","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a widely used measure of cardiovascular risk. A lower number indicates a better balance of protective to harmful cholesterol. Sophie's ratio of 2.86 is well within the desirable range of below 4.5 and within the optimal ceiling of 3.5, indicating favourable cardiovascular risk.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, elevated total cholesterol, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"20","upper_normal":"100","lower_optimal":"28","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"This represents the proportion of total cholesterol made up by protective HDL. A higher percentage indicates better cardiovascular protection. Sophie's result of 35% is above the desirable floor of 20% and well above the optimal floor of 28%, indicating that a good proportion of her cholesterol is the protective type.","low_causes":"Low HDL, sedentary lifestyle, metabolic syndrome","high_causes":"Regular exercise, healthy diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol fractions (LDL, VLDL, and remnants) in one number and is considered a better predictor of cardiovascular risk than LDL alone. Sophie's result of 2.6 mmol/L is within the desirable range of below 4 and within the optimal band.","low_causes":"Very low cholesterol diet, malnutrition, hyperthyroidism","high_causes":"High saturated fat diet, obesity, insulin resistance, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"1.4","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles and is involved in reverse cholesterol transport, the process by which cholesterol is removed from arteries. Higher levels are protective. Sophie's result of 1.4 g/L meets the desirable threshold.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, oestrogen, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B" ipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined particle similar to LDL but with an additional protein (apolipoprotein(a)) attached. It promotes atherosclerosis and blood clotting. Levels are almost entirely inherited and cannot be changed through diet or exercise. Sophie's result of below 25 nmol/L is well within the normal range (below 32). This is a permanently useful piece of information: it means her cardiovascular risk is driven entirely by modifiable lifestyle factors, and there is no inherited Lp(a) burden to manage.","low_causes":"Genetic (inherited low levels)","high_causes":"Genetic (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3033","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a simple but powerful marker of insulin resistance and cardiovascular risk. It is calculated by dividing triglycerides by HDL cholesterol. A lower ratio indicates better insulin sensitivity and lower cardiovascular risk. Sophie's result of 0.91 is within the laboratory range of below 1.5 but marginally above the optimal ceiling of 0.87. In the context of PCOS and mild insulin resistance this is consistent and should improve with lifestyle changes.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, regular exercise","high_causes":"Insulin resistance, PCOS, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich remnant particles (total cholesterol minus HDL minus LDL). These particles are increasingly recognised as an independent cardiovascular risk factor. Sophie's result of 0.52 mmol/L is within the laboratory range of below 0.8 but marginally above the optimal ceiling of 0.5. This small elevation is consistent with her mildly raised triglycerides.","low_causes":"Low triglycerides, healthy lipid metabolism","high_causes":"Elevated triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver. It rises in response to infection, injury, or chronic inflammatory conditions. Levels below 1.0 are considered low cardiovascular risk. Sophie's result of 0.2 mg/L is exceptionally low and well within the optimal range. This is particularly reassuring in someone with PCOS, where chronic low- 6667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5524","units":"umol/L","description":"Uric acid is a waste product created when the body breaks down purines, which are found in certain foods and produced naturally by the body. It is filtered by the kidneys. Sophie's result of 239 umol/L is within the normal female range and within the optimal band of 160 to 320.","low_causes":"Low purine diet, kidney tubular defect, Wilson's disease","high_causes":"High purine diet, gout, kidney disease, dehydration, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"21.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8392","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is a calculated value ((sodium + potassium) minus (chloride + bicarbonate)) that helps identify certain metabolic disturbances. Sophie's result of 21.8 is above the normal range of 8 to 16. In her case, this is most likely driven by the combination of a low bicarbonate (20.6, at the floor of range), an active urinary tract infection, and possible mild dehydration from low dietary and fluid intake. It is not suggestive of a serious metabolic disorder given her normal kidney function and normal blood glucose, but should normalise once the infection is treated and hydration improves.","low_causes":"Low albumin, laboratory error","high_causes":"Metabolic acidosis, ketoacidosis, lactic acidosis, kidney disease, dehydration, toxin ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal
