const REPORT_DATA = {"patient_name":"Andrew Welford","dob":"24/12/1980","report_date":"2026-09-08","summary":"Andrew is a 45-year-old male presenting with a BMI of 21.6, following a high-carb, low-fat diet rated 2 out of 10 for quality with a volume of 5 out of 10. He trains ten or more times per week, with five or more cardio sessions and five or more resistance sessions, alongside 10,000 to 15,000 daily steps. He reports no medications, no stated habits such as alcohol or smoking, and describes low energy and fatigue, low sex drive and libido, and brain fog. His goals are to build muscle, balance hormones, and reduce stress and anxiety.\n\nThe finding that needs attention first is the iron picture. His serum iron is 42, well above the upper limit of 31.3, and his transferrin saturation is 59%, above the upper limit of 55%. His transferrin itself, the protein that carries iron in the blood, is 2.82, which is within range, and his ferritin, the storage form of iron, is only 48. This is an unusual combination. In classic iron overload conditions such as hereditary haemochromatosis, a genetic condition where the body absorbs too much iron from food, ferritin tends to climb alongside saturation. Here, saturation is clearly elevated while ferritin remains modest. One possibility is that Andrew's very high training volume is depleting iron stores through sweat, foot-strike haemolysis and muscle repair, keeping ferritin low while dietary iron floods the transport system. Another possibility is early-stage haemochromatosis where the saturation rises first and the ferritin has not yet caught up. The distinction matters because haemochromatosis is common, affecting roughly one in 200 people of European ancestry, and is easily confirmed with a simple genetic test called HFE genotyping. We would recommend Andrew discusses this with his GP and requests the HFE gene test. In the meantime, he should not take any iron-containing supplements.\n\nThe second finding that warrants a GP conversation is his kidney function. His Cystatin C, a small protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, is 1.19, above the upper limit of 1.1. The eGFR calculated from Cystatin C is 77, which is below the 90 threshold that marks fully normal kidney function. His creatinine-based eGFR is 87, also below 90. At a BMI of 21.6 with heavy training, creatinine can be influenced by muscle mass, but Cystatin C is not affected by muscle, so this reading carries weight. An eGFR of 77 at 45 is not alarming, but it is lower than expected and should be tracked. His GP should be aware so that kidney function can be monitored over time, and a repeat in three to six months would help establish whether this is a stable baseline or a trend.\n\nHis C-Peptide is 0.285 ug/L, which converts to approximately 94 pmol/L, well below the lower limit of the laboratory range. C-Peptide is a byproduct of insulin production and reflects how much insulin the pancreas is making. His fasting insulin is 2.61, sitting right at the bottom of the reference range. His HOMA-IR, a calculation that estimates insulin resistance, is 0.63, which is excellent and indicates strong insulin sensitivity. His fasting glucose at 5.4 is within range but sits at the upper boundary of optimal, and his HbA1c at 38 mmol/mol is within the normal band but just above the optimal threshold of 36. The lab has noted that C-Peptide can degrade in samples not separated within four hours, so sample handling may partly explain the very low value. However, taking the picture together, Andrew's pancreas is producing very little insulin because his body does not need much, which is a sign of good insulin sensitivity. The slight upward drift in glucose and HbA1c alongside very low insulin output is worth watching. It does not suggest diabetes, but it does warrant a repeat to confirm the C-Peptide value and to track whether glucose regulation remains stable.\n\nHis cortisol at 518 is within the morning reference range of 145 to 619, so despite being flagged, this is a normal morning cortisol level. However, it sits in the upper half of the range, and given that Andrew reports stress and anxiety as a concern, this is worth noting. High training volume, particularly ten or more sessions per week, is a significant physiological stressor, and the cortisol level may reflect the cumulative load his body is under.\n\nTurning to what is working well, and there is a great deal here. His inflammation is essentially undetectable. His hs-CRP, the most sensitive marker of systemic inflammation, is below 0.2, which is as low as the assay can read. His ESR, another inflammation marker measuring how quickly red blood cells settle in a tube, is 2, barely registering. For someone training at this intensity, this is genuinely excellent and suggests his body is recovering well from sessions despite the volume.\n\nHis liver is in superb health. His ALT at 24 and GGT at 18 are both well within optimal ranges, and his AST at 30 is comfortably within range. His FIB-4 score, a calculation that screens for liver fibrosis, is 1.12, comfortably below the threshold. His bilirubin, albumin, amylase and lipase are all healthy. There is no sign of any liver strain whatsoever.\n\nHis thyroid is functioning well. TSH at 0.97 is in the optimal zone between 1.0 and 2.5, sitting just fractionally below. His Free T3 at 5.7 is in the sweet spot of the optimal range, which is the active thyroid hormone that drives energy and metabolism. His Free T4 at 13.3 is within the laboratory range but sits below the optimal band of 14 to 20, suggesting the thyroid is converting T4 to T3 efficiently but not producing a large reserve of T4. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. Given his symptoms of fatigue and brain fog, it is reassuring that the thyroid is not the cause.\n\nHis testosterone at 24.5 is excellent, sitting firmly within the optimal range of 18 to 30. His free androgen index at 45.37 is healthy, and his SHBG, the protein that binds testosterone and makes it unavailable, is 54, within range but toward the upper end. His calculated free testosterone is 0.382 nmol/L. His DHEA-S at 6.7 umol/L, which converts to approximately 2,469 ug/dL, is within range. His LH and FSH, the pituitary hormones that drive testosterone production, are both within range, confirming the hormonal axis is functioning normally. His oestradiol at 144 is just below the upper limit of 146, which is on the higher side for a male. At this level it is not necessarily problematic, but it may contribute to some of his symptoms, particularly low libido, and is worth monitoring. His prolactin is well within range, which is reassuring. Overall, the hormonal picture does not point to a hormonal cause for his low libido and fatigue. The testosterone is strong. The more likely explanation for his symptoms lies in the combination of a very poor quality diet, possible under-fuelling relative to his enormous training volume, and the physiological stress of that training load.\n\nHis full blood count is largely healthy. Haemoglobin at 156, red blood cells at 5.1, haematocrit at 0.443, and platelets at 247 are all in excellent positions. His white blood cell count at 5.29 is within range with a healthy differential. His reticulocyte percentage at 0.82 is within range, but his absolute reticulocyte count at 41.82 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count can suggest the bone marrow is producing red cells at a slightly reduced rate. In the context of borderline ferritin at 48, which is within the laboratory range but below the optimal threshold of 50, and his very high training volume, this may reflect the early stages of the body's iron supply not quite keeping pace with demand. His MCHC at 352 is marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin within each red blood cell, and at this margin the most common explanation is a temperature or storage effect during sample transport, as the lab note itself acknowledges. This is not a clinical concern.\n\nHis lipid profile tells a mixed story. His HDL at 1.7 is excellent, well above the optimal threshold of 1.4 for men, reflecting genuinely protective cardiovascular fitness. His triglycerides at 1.19 are within the desirable range. His ApoA1 at 1.54 is healthy, and his ApoB to ApoA1 ratio at 0.60 is below the lower risk threshold of 0.7, which is a positive finding. However, his total cholesterol at 5.4 is above the desirable threshold of 5.18, his LDL at 3.22 is above the upper limit of 3.0 and well above the optimal target of 2.6, and his ApoB at 0.92 is above the desirable limit of 0.9. ApoB is considered the single best marker of atherogenic particle burden because each LDL particle carries exactly one ApoB molecule, so this number effectively counts the particles that can deposit cholesterol in artery walls. The critical finding here is his Lipoprotein(a), often written Lp(a). At 114.63 nmol/L, this is in the moderate risk category, sitting above the 90 nmol/L threshold. Lp(a) is an inherited lipoprotein that behaves like a particularly sticky form of LDL. It deposits cholesterol in artery walls, promotes blood clotting, and drives inflammation at the vessel surface. Crucially, it cannot be changed by diet, exercise, or any currently available supplement. It is entirely genetically determined. This is permanent medical information that should be recorded in Andrew's medical file and discussed with his GP. His first-degree relatives, parents, siblings, and children, should also be tested because they each have a 50% chance of carrying the same elevated level. With Lp(a) at this level, the modifiable part of his lipid profile becomes more important. His LDL and ApoB should ideally be brought lower to compensate for the fixed Lp(a) risk. His high-carb, low-fat diet rated only 2 out of 10 for quality is very likely contributing to the LDL elevation. Improving the quality of his carbohydrate sources, increasing soluble fibre from oats, beans, lentils and vegetables, eating oily fish two to three times per week, and reducing processed and refined carbohydrates would all help bring LDL and ApoB down.\n\nHis vitamin D at 81 is within the optimal range of 75 to 120, which is a good result. His B12 at 273 is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and cognitive clarity, and suboptimal levels can contribute to the fatigue and brain fog Andrew describes. On a high-carb, low-fat diet rated 2 for quality, B12 intake from food may be insufficient, particularly if animal protein sources are limited. Supplementing with sublingual methylcobalamin would be worthwhile. His folate at 9 is above the optimal threshold of 8, which is adequate. His magnesium at 1.21 is above the upper limit of 1.11. Magnesium is rarely elevated from dietary intake alone, and supplementation is the most common cause. If Andrew is taking a magnesium supplement, he should reduce or pause the dose and retest. If he is not supplementing, this should be mentioned to his GP as persistently elevated magnesium without supplementation is unusual and warrants investigation. His corrected calcium at 2.44 and PTH at 1.3 are both within range, confirming normal calcium and parathyroid function.\n\nHis uric acid at 249 is within the laboratory range but below the optimal band of 200 to 380, sitting in a healthy position. His prostate markers are excellent, with PSA at 0.17 and a free PSA ratio of 0.765, both in very reassuring territory. His tumour markers CA 19-9 and CEA are both well within normal limits. His immune system markers, IgG, IgM, IgA and IgE, are all within their respective ranges, with IgM at 2.8 sitting near the top of its range but still within it. His coeliac screen is negative.\n\nThe urine culture has returned significant growth of Staphylococcus saprophyticus. However, the sample was received in a plain bottle without boric acid preservative, and the lab has noted that the absence of boric acid may cause overgrowth of organisms. There are no white blood cells in the urine, no nitrites, and no symptoms of urinary infection reported. In this context, the growth most likely represents contamination or overgrowth in the sample rather than a true urinary tract infection. The antibiotic sensitivity panel shows the organism is sensitive to most antibiotics tested, with resistance only to fusidic acid and intermediate sensitivity to ciprofloxacin. If Andrew develops any urinary symptoms such as burning, frequency, or discomfort, a repeat mid-stream urine sample in a boric acid bottle should be submitted. In the absence of symptoms, no treatment is needed.\n\nHis rheumatoid factor and total antioxidant activity results are pending and will be reviewed when available.\n\nPulling the picture together, Andrew's blood work reveals a fundamentally healthy 45-year-old man whose fitness is evident in his inflammation markers, HDL cholesterol, insulin sensitivity, and testosterone. The findings that need attention are the elevated transferrin saturation requiring an HFE gene test, the Cystatin C suggesting kidney function should be monitored, the elevated Lp(a) which is a permanent cardiovascular risk factor to record and manage around, and the LDL and ApoB that should be brought down through dietary quality improvements. His symptoms of fatigue, low libido, and brain fog are most likely explained not by any single blood marker but by the combination of an extremely high training load, a diet rated only 2 out of 10 for quality, and a food volume of only 5 out of 10, which at his training level almost certainly means he is under-fuelling. At 70kg and 180cm with ten or more training sessions per week and 10,000 to 15,000 daily steps, his energy expenditure is very high, and a poor quality diet at moderate volume simply cannot support that output without something giving way.","links":"Andrew's most important next steps fall into two categories: GP conversations and lifestyle changes.\n\nFor the GP, three items should be discussed. First, the elevated transferrin saturation of 59% and serum iron of 42 alongside a modest ferritin of 48 should prompt an HFE gene test to rule out hereditary haemochromatosis. This is a simple blood test that the GP can order. Second, his Cystatin C at 1.19 giving a Cystatin C eGFR of 77 should be noted so that kidney function can be tracked over time, with a repeat in three to six months to establish a baseline. Third, his Lp(a) at 114.63 nmol/L should be permanently recorded in his medical notes. The GP should be aware that this is an inherited, unchangeable cardiovascular risk factor, and Andrew's first-degree relatives should be offered testing. Given the Lp(a) level, the GP may wish to discuss whether more aggressive LDL management is appropriate.\n\nFor nutrition, this is where the biggest gains will come. Andrew's diet quality of 2 out of 10 is the single most impactful thing he can change. At 70kg, 180cm, and 45 years old, with his training volume of ten or more sessions per week and high step count, his estimated total daily energy expenditure is in the region of 2,800 to 3,200 calories per day. He should be eating at least 2,600 to 2,800 calories daily to support his training, recovery, and muscle-building goals. If he is currently under-eating relative to this, which a volume rating of 5 out of 10 suggests, increasing food intake is essential. His protein target should be 1.6 to 2.0 grams per kilogram of bodyweight, which means 112 to 140 grams of protein per day, spread across at least three meals. Protein sources rich in B12 such as eggs, red meat, poultry, fish and dairy will help address his suboptimal B12 at the same time.\n\nTo address his LDL of 3.22 and ApoB of 0.92, the quality of his carbohydrate intake matters enormously. He should shift from processed and refined carbohydrates toward whole grains, oats, beans, lentils, sweet potatoes, and vegetables. Soluble fibre from oats, beans and lentils specifically helps reduce LDL by binding bile acids in the gut. He should aim for at least 10 grams of soluble fibre per day. Oily fish such as salmon, mackerel or sardines two to three times per week will provide omega-3 fatty acids that support cardiovascular health and may help with the brain fog and mood symptoms. Reducing processed food, refined sugar, and low-quality carbohydrates will likely make a meaningful difference to both his lipid profile and his energy levels.\n\nFor training load, Andrew should honestly assess whether ten or more sessions per week is sustainable and productive, or whether it is contributing to his fatigue and brain fog. More training is not always better. Overtraining suppresses recovery, elevates cortisol chronically, and can paradoxically reduce the muscle-building stimulus he is seeking. Two rest days per week with genuine recovery, adequate sleep, and proper nutrition will likely produce better results than his current volume. If he is not already prioritising sleep, a fixed wake time, limited caffeine after midday, a cool dark bedroom, and seven to nine hours of sleep opportunity per night are foundational.\n\nFor stress and anxiety management, which is one of his stated goals, the combination of reducing training volume slightly, improving diet quality, ensuring adequate caloric intake, and prioritising sleep will address the physiological contributors. Morning sunlight exposure within the first hour of waking helps regulate the cortisol awakening response and supports circadian rhythm, which benefits both anxiety and sleep quality.\n\nIf Andrew is currently taking a magnesium supplement, he should reduce or stop it given his magnesium level of 1.21 is above the upper limit, and retest in six to eight weeks. If he is not supplementing magnesium, this should be mentioned to the GP.\n\nA retest in three to four months focusing on a full iron panel, Cystatin C, kidney function, lipid profile with ApoB, B12, magnesium, and C-Peptide would help track the response to dietary changes and confirm the findings that need monitoring.","flags":"GP-URGENT ITEMS:\n\n1. Transferrin saturation 59.31% (range 18-55%) with serum iron 42 umol/L (range 11.6-31.3). Ferritin is only 48 ng/ml. The combination of elevated saturation with normal-range ferritin is atypical but does not exclude early haemochromatosis. HFE gene test recommended to exclude hereditary haemochromatosis.\n\n2. Lipoprotein(a) 114.63 nmol/L (desirable below 32). Moderate risk category. Inherited, non-modifiable. Should be permanently recorded. First-degree relatives should be tested. Combined with LDL 3.22 (above 3.0) and ApoB 0.92 (above 0.9), total atherogenic burden is above target. Given fixed Lp(a) risk, LDL reduction through diet or pharmacological intervention should be discussed.\n\n3. Cystatin C 1.19 mg/L (above 1.1) giving Cystatin C eGFR of 77. Creatinine-based eGFR also below 90 at 87. At 45, lean, and without medications affecting creatinine, both estimates suggesting sub-90 filtration warrants monitoring. Recommend repeat in 3-6 months to establish trajectory.\n\nFOR MONITORING:\n\n4. C-Peptide 0.285 ug/L (approximately 94 pmol/L, range 1.1-4.4 ug/L or 364-1456 pmol/L). Well below range. Lab notes sample degradation possible if not separated within 4 hours. Fasting insulin 2.61 mIU/L at bottom of range. Glucose 5.4 and HbA1c 38 are within normal limits. HOMA-IR 0.63 confirms insulin sensitivity. Pattern is consistent with low insulin demand rather than pancreatic insufficiency, but repeat C-Peptide on a fresh, promptly separated sample is advised.\n\n5. Magnesium 1.21 mmol/L (range 0.53-1.11). Above upper limit. If supplementing, reduce dose and retest. If not supplementing, investigate cause.\n\n6. LDL 3.22 mmol/L (above 3.0), ApoB 0.92 g/L (above 0.9), total cholesterol 5.4 (above 5.18). Modifiable lipid markers above target, compounded by fixed Lp(a) risk.\n\n7. Free T4 13.3 pmol/L. Within laboratory range (11.5-22.7) but below optimal band (14-20). TSH 0.97, FT3 5.7, antibodies negative. No thyroid pathology, but worth tracking.\n\n8. B12 273 pg/ml. Within laboratory range (193-982) but below optimal (500). Supplementation recommended.\n\n9. Reticulocytes absolute 41.82 x10^9/L (range 50-100). Mildly below range. In context of borderline ferritin and high training volume, may reflect early functional iron limitation for erythropoiesis.\n\n10. MCHC 352 g/L (range 315-345). Marginally above range. Most likely temperature or storage artefact as noted by the lab.\n\n11. Oestradiol 144 pmol/L (upper limit 146.1). At the top of range. Not pathological but worth monitoring.\n\n12. Urine culture: significant growth of Staphylococcus saprophyticus, but sample received in plain bottle without boric acid, no WBCs, no nitrites, no urinary symptoms. Likely contamination or overgrowth artefact. Repeat in boric acid bottle only if symptoms develop.\n\n13. Cortisol 518 nmol/L. Within morning reference range (145-619). Upper half of range but not abnormal.\n\nPENDING: Rheumatoid Factor and Total Antioxidant Activity results to follow.\n\nReassuring negatives: hs-CRP below 0.2 (exceptional), ESR 2, liver function entirely clean (ALT 24, GGT 18, FIB-4 1.12), thyroid antibodies negative, PSA 0.17 with free ratio 0.765, coeliac screen negative, testosterone 24.5 in optimal range, HOMA-IR 0.63 confirming insulin sensitivity, HDL 1.7 (excellent), ApoB/A1 ratio 0.60 (below lower risk threshold), urine clear of blood and protein, all immunoglobulins within range.","recommendations":"1. See GP to request HFE gene test for haemochromatosis. Bring the transferrin saturation of 59% and serum iron of 42 to the appointment.\n\n2. Record Lp(a) of 114.63 nmol/L permanently in medical notes. Discuss with GP whether LDL-lowering intervention is warranted given the combined risk. Test first-degree relatives for Lp(a).\n\n3. Inform GP of Cystatin C 1.19 and eGFR 77 for monitoring. Repeat kidney function in 3-6 months.\n\n4. Improve diet quality urgently. Current rating of 2 out of 10 is the single biggest lever for change. Focus on whole food sources of carbohydrate, increase protein to 112-140g per day, add oily fish 2-3 times weekly, and increase soluble fibre from oats, beans and lentils to at least 10g daily.\n\n5. Increase caloric intake to 2,600-2,800 calories per day to match training expenditure. Under-fuelling is the most likely explanation for fatigue and brain fog.\n\n6. Supplement sublingual methylcobalamin 1,000mcg daily to address B12 of 273.\n\n7. If currently supplementing magnesium, reduce or stop and retest in 6-8 weeks. If not supplementing, discuss elevated magnesium of 1.21 with GP.\n\n8. Do not take iron supplements given elevated transferrin saturation and serum iron.\n\n9. Consider reducing training volume from ten-plus sessions to seven or eight per week, incorporating at least two genuine rest days. Assess whether fatigue and brain fog improve.\n\n10. Prioritise sleep: 7-9 hours opportunity, fixed wake time, outside within an hour of waking, caffeine cut-off by midday, cool dark bedroom.\n\n11. Retest in 3-4 months: full iron panel, Cystatin C, kidney function, lipid profile with ApoB and Lp(a), B12, magnesium, C-Peptide (ensure prompt sample separation), FT4.","supplementation":"DO NOT take iron supplements. Andrew's serum iron at 42 and transferrin saturation at 59% are both above the upper limits. Adding supplemental iron could be harmful, particularly until haemochromatosis has been excluded by the HFE gene test.\n\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. His B12 at 273 is below the optimal threshold of 500, and suboptimal B12 can contribute directly to the fatigue and brain fog he describes. Sublingual methylcobalamin bypasses gut absorption and delivers the active form of B12 directly. On a high-carb, low-fat diet with poor quality, dietary B12 intake is likely insufficient.\n\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with a meal containing some fat to aid absorption. His vitamin D at 81 is within the optimal range of 75 to 120, so this is a maintenance dose to keep it there through the winter months. Always pair vitamin D with vitamin K2 (MK-7), 100 mcg daily, which directs calcium into bones rather than arteries.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports cardiovascular health, which is particularly important given his elevated Lp(a) and above-target LDL and ApoB. Omega-3 fatty acids also support brain function and may help with the brain fog, and have mild anti-inflammatory properties. If Andrew increases oily fish intake to two to three portions per week as recommended, the supplement dose can be reduced to 1 to 2 grams.\n\nMagnesium: do NOT supplement at present. His magnesium at 1.21 is above the upper limit of 1.11. If he is currently taking magnesium, he should stop and retest in six to eight weeks. Once levels normalise, magnesium glycinate at 200 to 300mg before bed can be reintroduced if sleep quality is an issue, but only after confirming levels have come back within range.\n\nThe most important changes from this report are not supplements. They are improving his diet quality from 2 out of 10 to something that can actually support his training load, increasing his total caloric intake to at least 2,600 to 2,800 calories per day with 112 to 140 grams of protein, and honestly assessing whether ten or more training sessions per week is helping or hindering his goals.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5467","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar in the absence of recent food. Andrew's level of 5.4 sits at the very top edge of the optimal range. While it is within the normal laboratory range of 3.5 to 6.0, keeping fasting glucose below 5.4 is ideal. Given his very low insulin levels, this suggests his body is maintaining glucose with minimal insulin output, which is a sign of good insulin sensitivity, but it is a value worth watching over time.","low_causes":"Prolonged fasting, excessive exercise, reactive hypoglycaemia, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, medications such as steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. A level below 6.0% is classified as normal, 6.0 to 6.4% as pre-diabetes, and above 6.5% as diabetes. Andrew's 5.6% is normal and consistent with good blood sugar management.","low_causes":"Low carbohydrate intake, blood loss, haemolytic anaemia","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in different units. Below 42 mmol/mol is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Andrew's 38 is within the normal range but sits above the optimal threshold of 36. This is not a concern in isolation but, combined with his glucose at the upper edge of optimal, it supports the recommendation to monitor blood sugar regulation over time.","low_causes":"Low carbohydrate intake, blood loss, haemolytic anaemia","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"2.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3339","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5756","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing when no food has been eaten recently. Insulin is the hormone that moves glucose out of the blood and into cells. Andrew's level of 2.61 sits right at the bottom of the laboratory range. This is not a sign of pancreatic failure; rather, it reflects that his body is so insulin-sensitive that very little insulin is needed to manage his blood sugar. This is generally a positive finding, though it should be viewed alongside the C-Peptide result and glucose levels.","low_causes":"High insulin sensitivity, low carbohydrate intake, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate intake, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.285","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0288","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"4.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"ug/l","description":"C-Peptide is a byproduct released in equal amounts to insulin when the pancreas produces insulin. It provides a more stable measure of insulin production because it is not cleared from the blood as quickly as insulin itself. Andrew's level of 0.285 ug/L (approximately 94 pmol/L) is well below the lower limit of 1.1. The lab has noted that C-Peptide can degrade significantly in samples not separated within four hours, so sample handling may partly explain this very low reading. Given that his glucose and HbA1c are normal and his HOMA-IR confirms excellent insulin sensitivity, the most likely interpretation is very low insulin demand rather than pancreatic insufficiency. However, a repeat on a promptly separated sample is recommended to confirm.","low_causes":"High insulin sensitivity, low carbohydrate intake, sample degradation, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to the effects of insulin. A lower number is better. Below 1.0 indicates excellent insulin sensitivity. Andrew's score of 0.63 is excellent and confirms that his body responds very efficiently to insulin. This is one of the strongest positives in his report.","low_causes":"High insulin sensitivity, low carbohydrate intake, athletic conditioning","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate intake, physical inactivity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"27.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0572","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, the cells responsible for producing insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Andrew's score of 27.47 is well below the reference range of 80 to 200, which reflects the very low insulin output from his pancreas. In the context of normal glucose and HbA1c, this indicates that his pancreas does not need to produce much insulin because his cells are highly responsive to it. This is consistent with his excellent HOMA-IR. However, because his glucose is at the upper edge of optimal while insulin production is so low, this balance should be monitored over time to ensure the pancreas continues to keep pace with demand.","low_causes":"High insulin sensitivity requiring minimal insulin output, low carbohydrate intake, beta cell dysfunction in late-stage diabetes","high_causes":"Insulin resistance causing compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood, so higher levels suggest liver stress. Andrew's ALT at 24 is well within both the laboratory range and the tighter optimal range of below 30 for men. This indicates his liver is under no metabolic strain.","low_causes":"Generally not clinically significant when low","high_causes":"Fatty liver disease, alcohol excess, medications, viral hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It rises with liver damage but also with intense exercise or muscle damage. Andrew's AST at 30 is well within range. Given his very high training volume, a modest AST is reassuring and suggests he is recovering well from training.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, intense exercise, muscle damage, heart attack, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1233","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol intake, bile duct problems, and metabolic stress. It is often the first liver marker to rise when the liver is under strain. Andrew's GGT at 18 is well within the optimal range of below 25, indicating his liver is in excellent health with no signs of metabolic stress.","low_causes":"Generally not clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5619","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bones, kidneys, and intestines. It helps assess liver and bone health. Andrew's level of 51 is within the laboratory range. It sits just at the lower edge, which is normal and not a concern.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disorders, vitamin D deficiency, Paget's disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. Elevated levels can indicate liver disease, bile duct problems, or increased red blood cell breakdown. Andrew's level of 16 is comfortably within range and within optimal limits, confirming healthy liver processing.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.5853","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins are essential for immune function, fluid balance, and transporting substances through the blood. Andrew's level of 76 is in a healthy position within range.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and maintains fluid balance. A healthy albumin level confirms that the liver's protein-producing function is working well. Andrew's level of 46 is in an excellent position.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/l","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. They play a central role in immune function and carrying substances through the blood. Andrew's level of 30 is well within range.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It helps assess liver function and immune status. A healthy ratio indicates a good balance between the liver's protein production and immune system activity. Andrew's ratio of 1.53 is in a healthy position.","low_causes":"Overproduction of globulins (infection, inflammation, autoimmune), underproduction of albumin (liver disease)","high_causes":"Underproduction of globulins (immune deficiency)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3862","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a screening calculation that combines age, AST, ALT, and platelet count to estimate the likelihood of liver fibrosis (scarring). A score below 1.3 in people under 65 suggests a low risk of significant liver fibrosis. Andrew's score of 1.12 is comfortably in the low-risk category, confirming no evidence of liver scarring.","low_causes":"Not clinically significant when low","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"103","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4148","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.5833","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands to digest starch. Elevated levels can indicate pancreatic inflammation. Andrew's level of 103 is within the laboratory range, sitting in the upper portion but well within normal limits.","low_causes":"Chronic pancreatitis with pancreatic damage, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5319","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5887","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase. Andrew's level of 41 is well within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatic insufficiency","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5213","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL (protective), LDL (atherogenic), and VLDL. A total below 5.18 is considered desirable. Andrew's level of 5.4 is slightly above this threshold, but total cholesterol alone is a blunt tool. The breakdown between HDL, LDL, and triglycerides is far more informative, and in Andrew's case the picture is mixed, with an excellent HDL but above-target LDL.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.19","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3500","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are a type of fat in the blood. They come from dietary fat and are also produced by the liver from excess carbohydrate intake. Elevated levels are associated with cardiovascular risk, metabolic syndrome, and insulin resistance. Andrew's fasting triglycerides at 1.19 are within the desirable range of below 1.7 but above the optimal target of below 1.0. On a high-carb diet, triglycerides can be driven up by excess carbohydrate intake, and improving diet quality may bring this into the optimal range.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate intake, alcohol, obesity, insulin resistance, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3462","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to tissues. It is considered atherogenic, meaning it contributes to the build-up of plaque in arteries. Andrew's VLDL at 0.54 is within the desirable range, consistent with his acceptable triglyceride levels.","low_causes":"Very low fat diet, malnutrition","high_causes":"High carbohydrate intake, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5484","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein, is often called 'good' cholesterol because it carries excess cholesterol away from artery walls back to the liver for disposal. Higher levels are protective against cardiovascular disease. Andrew's HDL at 1.7 is excellent, well above both the minimum desirable level of 1.04 and the optimal threshold of 1.4 for men. This reflects his high level of physical activity and is one of the strongest cardiovascular positives in his report.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5367","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4200","units":"mmol/l","description":"LDL, or low-density lipoprotein, carries cholesterol to tissues and can deposit it in artery walls, forming plaques that narrow the arteries over time. It is the primary driver of atherosclerotic cardiovascular disease. Andrew's LDL at 3.22 is above the upper limit of 3.0 and well above the optimal target of 2.6. Given his elevated Lp(a), bringing LDL down through dietary changes becomes particularly important because the Lp(a) component of his cardiovascular risk cannot be modified.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Diet high in saturated and refined carbohydrates, genetics, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a useful summary of cardiovascular risk. It accounts for both the total burden of cholesterol and the protective effect of HDL. A ratio below 4.5 is desirable. Andrew's ratio of 3.18 is good, reflecting the protective effect of his excellent HDL level.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"High LDL, low HDL, combined dyslipidaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3935","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL fraction. Above 20% is desirable. Andrew's 31.48% is a healthy proportion, reflecting his strong HDL level.","low_causes":"Low HDL, high LDL and total cholesterol","high_causes":"Very high HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic (artery-damaging) cholesterol fractions, including LDL, VLDL, and Lp(a). Below 4.0 is desirable. Andrew's non-HDL at 3.7 is within the desirable range but above the optimal target of 3.4, reflecting his elevated LDL.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High LDL, high triglycerides, genetics, poor diet quality","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6417","lower_normal":"1.2","upper_normal":"2.5","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5769","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein component of HDL particles. It reflects the number and function of protective HDL particles. Andrew's level of 1.54 is healthy, confirming that his HDL particles are present in good numbers.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is a protein found on every LDL, VLDL, and Lp(a) particle. Since each atherogenic particle carries exactly one ApoB molecule, this effectively counts the number of particles that can deposit cholesterol in artery walls. Many cardiologists consider ApoB the single best marker of cardiovascular risk. Andrew's ApoB at 0.92 is above the desirable threshold of 0.9 and above the optimal target of 0.8. With his elevated Lp(a) contributing to the ApoB count, reducing the modifiable portion through diet is the priority.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, high Lp(a), diet high in saturated fat and refined carbohydrates, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA1). It is considered one of the best summary measures of cardiovascular risk. Below 0.7 is lower risk. Andrew's ratio of 0.60 is in the lower risk category, which is a genuinely positive finding. His strong ApoA1 (reflecting excellent HDL) is counterbalancing his above-target ApoB.","low_causes":"High HDL, low LDL, regular exercise","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"114.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a specialised lipoprotein particle that is entirely genetically determined. Unlike LDL cholesterol, it cannot be changed by diet, exercise, or any currently available supplement. It behaves like a particularly sticky form of LDL: it deposits cholesterol in artery walls, promotes blood clot formation, and drives inflammation at the vessel surface. Andrew's Lp(a) at 114.63 nmol/L is in the moderate risk category (90 to 200 nmol/L). This is permanent medical information that should be recorded in his medical notes. His first-degree relatives (parents, siblings, children) should be tested because they each have a 50% chance of inheriting the same elevated level. Because Lp(a) cannot be modified, reducing the controllable risk factors, particularly LDL and ApoB, becomes more important.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, non-modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2333","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a useful surrogate marker for insulin resistance and small dense LDL particles. A lower ratio is better. Below 0.87 is optimal. Andrew's ratio of 0.70 is in the optimal range, confirming good metabolic health and suggesting his LDL particles are likely of the larger, less dangerous type.","low_causes":"Excellent metabolic health, high HDL, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate intake, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3000","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as independent drivers of cardiovascular disease. Below 0.5 is optimal. Andrew's remnant cholesterol of 0.48 is within the optimal range, which is a positive finding.","low_causes":"Low triglycerides, good metabolic health","high_causes":"High triglycerides, insulin resistance, obesity, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.02","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein is the most sensitive blood marker of systemic inflammation. It is produced by the liver in response to inflammation anywhere in the body. Below 1.0 is considered low cardiovascular risk, 1.0 to 3.0 is moderate risk, and above 3.0 is high risk. Andrew's hs-CRP is below 0.2, which is essentially undetectable and about as low as this marker can read. For someone training at his intensity, this is an exceptional result and confirms that his body is not in a state of chronic inflammation.","low_causes":"Absence of significant inflammation, good recovery","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions, overtraining","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates inflammation because inflammatory proteins make red blood cells clump together. Andrew's ESR at 2 is very low, confirming the absence of significant inflammation, consistent with his excellent hs-CRP.","low_causes":"Absence of inflammation, polycythaemia","high_causes":"Infection, autoimmune disease, cancer, chronic inflammation, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6256","units":"mmol/l","description":"Sodium is an essential electrolyte that regulates fluid balance, nerve function, and muscle contraction. Andrew's sodium at 144 is within a healthy range.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/l","description":"Chloride is an electrolyte that works closely with sodium and bicarbonate to maintain fluid balance and acid-base status. Andrew's chloride at 96 is within the laboratory range, sitting just above the lower limit. This is not a concern.","low_causes":"Vomiting, metabolic alkalosis, diuretics, adrenal insufficiency","high_causes":"Dehydration, metabolic acidosis, kidney disease, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"25.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4970","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a buffer that helps the body maintain a stable pH. It is part of the acid-base balance system. Andrew's level of 25.4 is in a healthy mid-range position.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, intense exercise","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5836","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction, and heart rhythm. Most calcium is stored in bones, and the blood level is tightly regulated. Andrew's total calcium at 2.54 is in a healthy position within both the laboratory and optimal ranges.","low_causes":"Vitamin D deficiency, hypoparathyroidism, magnesium deficiency, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium reading for albumin levels, giving a more accurate picture of how much calcium is actually available in the blood. Andrew's corrected calcium at 2.44 is comfortably within both normal and optimal ranges, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7264","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5189","upper_optimal_position":"0.6108","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, bone health, and sleep regulation. Andrew's magnesium at 1.21 is above the upper limit of 1.11. Elevated serum magnesium is uncommon from dietary sources alone and is most often caused by magnesium supplementation. If Andrew is taking a magnesium supplement, he should reduce or stop it and retest. If he is not supplementing, this finding should be discussed with his GP, as persistently elevated magnesium can affect heart rhythm and nerve function.","low_causes":"Poor dietary intake, heavy sweating, alcohol, diuretics, diabetes, malabsorption","high_causes":"Magnesium supplementation, kidney disease, adrenal insufficiency, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"249","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3568","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5227","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, substances found in certain foods and produced by the body. Elevated levels can cause gout and are associated with cardiovascular risk and kidney stones. Andrew's uric acid at 249 is within a healthy optimal range.","low_causes":"Low purine diet, liver disease, Fanconi syndrome","high_causes":"High purine diet, gout, kidney disease, obesity, alcohol, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5933","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5960","units":"mmol/l","description":"Urea is a waste product from protein metabolism, produced by the liver and excreted by the kidneys. It reflects both protein intake and kidney function. Andrew's urea at 7.1 is within the laboratory range but above the optimal upper bound of 6.5, which may reflect his protein intake or training-related muscle breakdown. In the context of his elevated Cystatin C, this is another gentle indicator that kidney function should be monitored.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, intense exercise, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6308","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism. The kidneys filter it out of the blood, so rising levels suggest reduced kidney function. It can also be influenced by muscle mass and meat intake. Andrew's creatinine at 91 is within a healthy range.","low_causes":"Low muscle mass, low protein diet","high_causes":"Kidney disease, dehydration, high muscle mass, high protein intake, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.725","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate, or eGFR, estimates how efficiently the kidneys are filtering waste from the blood. Above 90 is considered fully normal, 60 to 89 is mildly reduced, and below 60 warrants investigation. Andrew's creatinine-based eGFR at 87 is mildly below the fully normal threshold of 90. On its own this would not be a major concern, as creatinine can be influenced by muscle mass and exercise, but it is consistent with his Cystatin C eGFR of 77, and together they suggest kidney function should be monitored.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"Hyperfiltration (early diabetes, pregnancy), high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5409","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet, or exercise, making it a more reliable marker of kidney function, particularly in lean or muscular individuals. Andrew's Cystatin C at 1.19 is above the upper limit of 1.1, and his Cystatin C eGFR of 77 is below the 90 threshold. This confirms that kidney filtration is mildly reduced and should be discussed with his GP for monitoring.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Reduced kidney function, inflammation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"77","within_normal":"TRUE","within_optimal":"FALSE","result l":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, measures the average concentration of haemoglobin within each red blood cell. Andrew's MCHC at 352 is marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and storage during sample transport. At this margin, the most common explanation is a pre-analytical artefact rather than a genuine clinical finding. This is not a concern.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Spherocytosis, sample artefact from temperature or storage, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"247","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4487","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small blood cells that help form clots to stop bleeding. Andrew's platelet count at 247 is in a healthy mid-range position.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, medications, alcohol","high_causes":"Iron deficiency, inflammation, infection, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"8.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4778","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV, der-fuelling","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells that include T cells, B cells, and natural killer cells. They are responsible for adaptive immunity, the body's targeted response to specific pathogens. Andrew's lymphocyte count at 1.88 is in a healthy position.","low_causes":"HIV, autoimmune disorders, corticosteroids, stress, overtraining","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4208","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5417","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest pathogens and dead cells. They also play a role in tissue repair and inflammation regulation. Andrew's monocyte count at 0.41 is within a healthy range.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic infections, autoimmune disorders, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"
