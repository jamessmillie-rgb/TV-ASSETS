ets are typically younger and more reactive. Andrew's MPV of 8.4 is within the optimal range, indicating normal platelet turnover.","low_causes":"Bone marrow disorders, cytotoxic medications, aplastic anaemia","high_causes":"Immune thrombocytopenia (large young platelets compensating), sepsis, pre-eclampsia, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"5.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3817","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5667","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells circulating in the blood. Andrew's count of 5.29 is within the optimal range, indicating a healthy and appropriately active immune system without signs of infection or immune suppression.","low_causes":"Viral infection, bone marrow disorders, autoimmune conditions, severe nutritional deficiency, medications","high_causes":"Bacterial infection, inflammation, stress, corticosteroid use, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3960","lower_normal":"2","upper_normal":"7","lower_optimal":"2.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and are the first responders to bacterial infection. Andrew's neutrophil count of 2.94 is within the optimal range, confirming a healthy innate immune response.","low_causes":"Viral infection, nutritional deficiency (B12, folate, copper), autoimmune neutropenia, medications, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, corticosteroids, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including recognising and remembering specific pathogens and producing antibodies. Andrew's count of 1.88 is within the optimal range.","low_causes":"HIV, autoimmune disease, corticosteroid use, chemotherapy, severe malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4208","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Monocytes are white blood cells that engulf pathogens and dead cells. They also play a role in tissue repair and immune regulation. Andrew's count of 0.41 is within the optimal range.","low_causes":"Bone marrow disorders, corticosteroid use","high_causes":"Chronic infection, autoimmune disease, chronic inflammatory conditions, certain cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Andrew's count of 0.03 is at the low end of normal, which is typical in the absence of allergies or parasitic infection.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, eczema, drug reactions, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and are involved in allergic reactions and inflammatory responses. Andrew's count of 0.03 is within the normal range.","low_causes":"Acute allergic reaction (consumed into tissues), hyperthyroidism, corticosteroids","high_causes":"Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3827","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage indicates how actively the bone marrow is producing new red cells. Andrew's percentage of 0.82% is within the normal and optimal range, indicating steady and appropriate red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic kidney disease (reduced EPO), aplastic anaemia","high_causes":"Blood loss (bone marrow compensating), haemolytic anaemia, recovery from iron/B12 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"41.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2703","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells per litre of blood. Andrew's result of 41.82 is just below the lower limit of 50. In the context of a completely normal haemoglobin (156), red cell count (5.1), and haematocrit (0.443), this simply means the bone marrow does not need to produce red cells at a high rate because there is no increased demand. This is not a clinically significant finding.","low_causes":"Adequate red cell mass (no stimulus to increase production), iron deficiency, B12/folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Blood loss, haemolytic anaemia, recovery from nutritional deficiency treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-to-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4700","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is a calculated marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, with the optimal range being 1.0 to 2.0. Andrew's NLR of 1.56 is within the optimal range, confirming a well-balanced immune system with no inflammatory signal.","low_causes":"Not typically clinically significant","high_causes":"Infection, inflammation, physiological stress, cardiovascular disease, cancer (as a prognostic marker)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"59.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7790","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3522","upper_optimal_position":"0.4928","units":"%","description":"Transferrin saturation measures the percentage of the body's iron-carrying protein (transferrin) that is loaded with iron. It is a key marker for detecting iron overload. Andrew's result of 59.31% is above the upper limit of 55% and significantly above the optimal range of 25 to 40%. Elevated transferrin saturation can indicate hereditary haemochromatosis, a genetic condition where the body absorbs too much iron from food. An HFE gene test is recommended to investigate this finding.","low_causes":"Iron deficiency, chronic disease, inflammation (transferrin rises, saturation falls)","high_causes":"Hereditary haemochromatosis, iron supplementation, transfusion iron overload, recent high-iron meal (transient), liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8222","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3455","upper_optimal_position":"0.6152","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. Andrew's result of 42 is significantly above the upper limit of 31.3. Serum iron can be transiently elevated by a recent iron-rich meal or by the time of day (iron is highest in the morning), but when combined with a transferrin saturation of 59%, this is a finding that warrants further investigation with an HFE gene test.","low_causes":"Iron deficiency, chronic disease, inflammation, poor dietary intake, malabsorption","high_causes":"Hereditary haemochromatosis, iron supplementation, liver disease, haemolytic anaemia, recent iron-rich meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4820","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6167","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. Its level is regulated by iron status: it rises when iron stores are low (to capture more iron) and falls when stores are high. Andrew's transferrin of 2.82 is within the normal range, which is somewhat reassuring. In haemochromatosis, transferrin often remains in the normal range while saturation rises because the body is absorbing more iron than it needs.","low_causes":"Iron overload, chronic inflammation (negative acute phase protein), liver disease, malnutrition, nephrotic syndrome","high_causes":"Iron deficiency (body produces more to capture available iron), pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"62.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4996","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3520","upper_optimal_position":"0.6392","units":"umol/L","description":"Total iron binding capacity (TIBC) measures the maximum amount of iron that transferrin can carry. It reflects the body's capacity to transport iron. Andrew's TIBC of 62.8 is within the normal range. In haemochromatosis, TIBC is typically normal or low-normal because the body does not need to increase its iron-carrying capacity when iron is already abundant.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3622","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3426","upper_optimal_position":"0.5260","units":"ng/mL","description":"Ferritin is the body's main iron storage protein. It reflects the total amount of iron held in reserve in the liver, spleen, and bone marrow. Andrew's result of 48 is within the laboratory range but just below the optimal floor of 50 for males. This is an interesting finding given his elevated serum iron and transferrin saturation. If haemochromatosis is confirmed, ferritin is expected to rise over time as excess absorbed iron accumulates in storage. The current relatively low ferritin may indicate that the overload process is in its early stages. This is precisely why early detection through genetic testing is valuable.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, heavy exercise, malabsorption","high_causes":"Iron overload (haemochromatosis), inflammation (acute phase protein), liver disease, infection, metabolic syndrome, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"518","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5452","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5948","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal rhythm, peaking in the early morning (when this sample was likely taken) and falling throughout the day. Andrew's result of 518 is within the morning reference range of 145 to 619 but sits above the optimal ceiling of 500. A single cortisol reading cannot diagnose chronic stress, but in someone whose goals include stress and anxiety reduction, this upper-half value is consistent with a system running at a higher baseline. Lifestyle measures around sleep quality, recovery, and training load management may help bring cortisol into a more restful range.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction, chronic stress (eventual burnout)","high_causes":"Acute or chronic stress, intense exercise, morning sampling (physiological peak), Cushing's syndrome, corticosteroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"144","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4928","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men and is produced by the conversion of testosterone through an enzyme called aromatase, mainly in fat tissue. In men, moderate oestradiol levels are important for bone health, brain function, and cardiovascular protection, but excessively high levels can suppress testosterone production and contribute to symptoms like low libido and fatigue. Andrew's result of 144 is within the laboratory range (below 146.1) but above the optimal ceiling of 120. At his testosterone level of 24.5, the ratio is acceptable but worth monitoring. His lean BMI of 21.6 makes aromatase conversion in fat tissue an unlikely explanation, so this may simply reflect individual metabolic variation.","low_causes":"Low body fat, aromatase inhibitor use, hypogonadism, menopause (in women)","high_causes":"High body fat (increased aromatase activity), liver disease (reduced clearance), exogenous testosterone, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5109","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small quantities by the adrenal glands and testes. It plays a role in regulating other hormones and supporting brain function. Andrew's result of 2.48 is within the reference range for males.","low_causes":"Adrenal insufficiency, generally not clinically significant in males","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, exogenous progesterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3979","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3397","upper_optimal_position":"0.5513","units":"mIU/mL","description":"Luteinising hormone (LH) is produced by the pituitary gland and stimulates the testes to produce testosterone. Andrew's LH of 2.89 is within the optimal range, indicating healthy pituitary signalling.","low_causes":"Pituitary dysfunction, exogenous testosterone or anabolic steroid use, severe stress, extreme exercise","high_causes":"Primary hypogonadism (testes not responding to LH), Klinefelter syndrome, age-related decline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"6.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4989","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5685","units":"mIU/mL","description":"Follicle stimulating hormone (FSH) is produced by the pituitary gland and supports sperm production in men. Andrew's FSH of 6.86 is within the optimal range, indicating healthy reproductive hormone signalling.","low_causes":"Pituitary dysfunction, exogenous testosterone use, severe stress","high_causes":"Primary testicular failure, Klinefelter syndrome, age-related decline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"24.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, fat distribution, libido, energy, and mood. Andrew's result of 24.5 is excellent for a 45-year-old male, sitting comfortably in the optimal range of 18 to 30. This rules out low testosterone as a cause of his reported low libido and fatigue, which are more likely related to his diet quality, training volume, and stress levels.","low_causes":"Ageing, obesity, chronic stress, sleep deprivation, alcohol excess, opioid use, pituitary dysfunction, testicular disorders","high_causes":"Exogenous testosterone or anabolic steroid use, adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3485","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5515","units":"uIU/mL","description":"Prolactin is a pituitary hormone that in men should remain relatively low. Elevated prolactin can suppress testosterone and libido. Andrew's prolactin of 72 is at the lower end of the range, which is ideal for a male. This rules out hyperprolactinaemia as a contributor to his low libido symptoms.","low_causes":"Dopamine agonist medications (cabergoline, bromocriptine)","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, SSRIs, PPIs), hypothyroidism, stress, chest wall irritation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"45.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4612","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3375","upper_optimal_position":"0.5917","units":"","description":"The free androgen index (FAI) is calculated from testosterone and SHBG to estimate the proportion of testosterone that is biologically active (not bound to proteins). Andrew's FAI of 45.37 is within the optimal range, indicating a healthy balance between total testosterone and SHBG binding.","low_causes":"Low testosterone, high SHBG (from ageing, liver disease, hyperthyroidism, oestrogen)","high_causes":"High testosterone, low SHBG, anabolic steroid use, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"6.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4820","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3531","upper_optimal_position":"0.5731","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It declines naturally with age. Andrew's result of 6.7 umol/L (approximately 2,470 ug/dL) is within the optimal range for his age, indicating healthy adrenal function and hormone precursor availability.","low_causes":"Ageing (natural decline from age 30+), adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (in women), DHEA supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5877","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3825","upper_optimal_position":"0.5777","units":"nmol/L","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds to testosterone and oestradiol, controlling how much of these hormones is free to act on tissues. Andrew's SHBG of 54 is at the upper end of the optimal range. Higher SHBG can reduce the amount of free (active) testosterone, but in Andrew's case his free testosterone and FAI are both healthy, so the SHBG level is not causing any functional limitation.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use, high-dose corticosteroids","high_causes":"Ageing, hyperthyroidism, liver disease, low body fat, anticonvulsant medications, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.382","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8640","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.01","upper_optimal":"0.25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone is the fraction of total testosterone that is not bound to SHBG or albumin and is available to act on tissues. Andrew's calculated free testosterone of 0.382 is above the laboratory upper limit of 0.25. This is a calculated value and reflects his excellent total testosterone of 24.5 combined with an SHBG that, while at the upper end of range, still leaves a generous amount of testosterone unbound. The lab reference range for calculated free testosterone can be conservative. In the context of healthy LH, FSH, and no exogenous hormone use, this is simply a reflection of strong endogenous testosterone production and is not a clinical concern.","low_causes":"Ageing, high SHBG, obesity, chronic illness, hypogonadism","high_causes":"High total testosterone with normal or low SHBG, exogenous testosterone, anabolic steroid use, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"13.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3494","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3560","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues throughout the body. Andrew's FT4 of 13.3 is within the laboratory range but just below the optimal floor of 14. With a TSH of 0.97 and an excellent FT3 of 5.7, this suggests that Andrew's body is efficiently converting T4 to T3, which is the biologically active form. The thyroid is functioning well overall.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency, sick euthyroid syndrome","high_causes":"Hyperthyroidism (Graves' disease), thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3663","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4496","units":"mIU/L","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland and acts as a thermostat for the thyroid. When thyroid hormone levels drop, TSH rises to stimulate more production. Andrew's TSH of 0.97 is within the laboratory range but just below the optimal floor of 1.0. This is an extremely marginal difference and is functionally optimal. A very low TSH (below 0.55) would suggest an overactive thyroid, but at 0.97 this simply indicates that the pituitary is satisfied with the current thyroid hormone output.","low_causes":"Hyperthyroidism (Graves' disease), thyroiditis (early phase), excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, iodine deficiency, Hashimoto's thyroiditis, thyroid hormone resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5630","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the most biologically active thyroid hormone. Most T3 is produced by converting T4 in peripheral tissues rather than directly by the thyroid. Andrew's FT3 of 5.7 is within the optimal range of 4.5 to 6.5, confirming excellent thyroid hormone conversion and activity. This is the thyroid hormone that most directly drives metabolism, energy, and body temperature regulation.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion (selenium or zinc deficiency), chronic illness (sick euthyroid syndrome), caloric restriction","high_causes":"Hyperthyroidism, thyroiditis, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Elevated levels are the hallmark of Hashimoto's thyroiditis, the most common cause of hypothyroidism. Andrew's result is below 6.6, well within the negative range (below 13.8), ruling out autoimmune thyroid disease.","low_causes":"Absence of autoimmune thyroid disease (desirable)","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, they are markers of autoimmune thyroid disease. Andrew's result is below 1.3, which is undetectable in over 80% of the population. This confirms no autoimmune thyroid activity.","low_causes":"Absence of autoimmune thyroid disease (desirable)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3375","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7292","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. Andrew's result of 81 is within the optimal range of 75 to 120. Given that this sample was taken in September (when UVB exposure is still available in the UK), a maintenance dose of vitamin D3 through the autumn and winter will help maintain this level.","low_causes":"Insufficient sun exposure, dark skin, obesity (fat sequesters vitamin D), malabsorption, kidney disease, liver disease","high_causes":"Excessive supplementation, granulomatous disease (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3419","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"0.98","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5688","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate levels in the blood. It is produced by the parathyroid glands and rises when calcium is low, stimulating the bones to release calcium and the kidneys to retain it. Andrew's PTH of 1.3 is at the lower end of the range, which is appropriate given his healthy calcium and vitamin D levels. The parathyroid glands do not need to work hard when calcium is already adequate.","low_causes":"Adequate calcium and vitamin D (appropriate suppression), hypoparathyroidism, post-thyroid surgery","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism (primary), chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"273","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3671","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3723","upper_optimal_position":"0.5851","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy metabolism. It is found primarily in animal products (meat, fish, eggs, dairy). Andrew's result of 273 is within the laboratory range (193 to 982) but significantly below the optimal threshold of 500. At this level, the body has enough B12 to prevent clinical deficiency (anaemia, nerve damage) but may not have enough for optimal cellular function. Below-optimal B12 is associated with fatigue, brain fog, and impaired concentration, all of which Andrew reports. A sublingual methylcobalamin supplement is recommended.","low_causes":"Inadequate dietary intake (especially vegetarian/vegan), pernicious anaemia, malabsorption (coeliac, Crohn's, low stomach acid), metformin use, proton pump inhibitors, ageing","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell formation, and neural tube development. It works closely with B12. Andrew's folate of 9 is within the optimal range of above 8, indicating adequate folate status from dietary intake.","low_causes":"Poor dietary intake (low vegetable/legume consumption), alcohol excess, coeliac disease, certain medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, fortified foods, occasionally B12 deficiency (folate accumulates when B12 is absent)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"172","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in skeletal muscle, heart muscle, and brain. It is released into the blood when muscle cells are damaged, most commonly from intense exercise. Andrew's result of 172 is within the optimal range for a male who trains heavily. This indicates that while he is training hard, his muscles are recovering adequately and there is no excessive damage.","low_causes":"Low muscle mass, sedentary lifestyle, muscle wasting","high_causes":"Intense exercise (most common), rhabdomyolysis, heart attack, muscle disease (myositis), statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7200","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity (TAA) measures the overall capacity of the blood to neutralise free radicals and oxidative stress. Andrew's result of 1.97 is above the upper reference limit of 1.77. This is almost always caused by antioxidant supplementation (vitamin C, vitamin E, alpha-lipoic acid, N-acetyl cysteine, or polyphenol-rich supplements like curcumin or resveratrol). It is not a clinical concern and simply reflects a high antioxidant intake from supplements or a diet very rich in antioxidant compounds.","low_causes":"Poor dietary antioxidant intake, chronic illness, oxidative stress","high_causes":"Antioxidant supplementation (most common), high polyphenol diet, uric acid (itself an antioxidant)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.034","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"1.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"ng/mL","description":"Prostate-specific antigen (PSA) is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, inflammation, or prostate cancer. Andrew's PSA of 0.17 is very low and provides strong reassurance about prostate health at age 45.","low_causes":"Not clinically significant (desirable to be low)","high_causes":"Benign prostatic hyperplasia (BPH), prostatitis, prostate cancer, recent ejaculation, cycling, urinary tract infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"PSA (Free)","group":"PROSTATE","result":"0.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the portion of PSA circulating unbound to proteins. The ratio of free to total PSA helps distinguish benign prostate conditions from prostate cancer. A higher free PSA ratio is more reassuring. Andrew's free PSA ratio of 76.5% is very high, which is entirely reassuring.","low_causes":"Not clinically significant when total PSA is low","high_causes":"Benign prostatic hyperplasia, normal variation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Free/Total Ratio","group":"PROSTATE","result":"0.765","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3825","lower_normal":"0.19","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"","description":"The PSA ratio expresses free PSA as a proportion of total PSA. A ratio above 0.19 is considered normal, and a higher ratio is reassuring because prostate cancer tends to produce more bound (non-free) PSA. Andrew's ratio of 0.765 (76.5%) is excellent.","low_causes":"Prostate cancer (tends to lower the free/total ratio)","high_causes":"Benign prostatic hyperplasia, normal prostate health","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker primarily associated with pancreatic cancer but also elevated in bile duct, stomach, and colon cancers, as well as benign conditions like pancreatitis and bile duct obstruction. Andrew's result is below 1.2, well within the normal range, providing reassurance.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, pancreatitis, bile duct obstruction, other gastrointestinal cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1087","lower_normal":"0","upper_normal":"2.3"," // ============================================================
//  TrueVitals report engine — builds everything from REPORT_DATA
// ============================================================
const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}

document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

dob.addEventListener('input',function(){

  this.value=f;
});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
