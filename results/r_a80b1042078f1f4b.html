const REPORT_DATA = {"patient_name":"Andrew Welford","dob":"24/12/1980","report_date":"2026-09-08","summary":"Andrew is a 45-year-old male presenting with a BMI of 21.6, following a high-carb, low-fat diet rated 2 out of 10 for quality with a volume of 5 out of 10. He trains more than five times per week in both cardio and resistance, with 10,000 to 15,000 daily steps. He reports no medications, no habitual alcohol or tobacco use, and no known medical conditions. His reported symptoms are low energy, low libido, and brain fog. His goals are to build muscle, balance hormones, and reduce stress and anxiety.\n\nThe finding that needs to go to Andrew's GP first is the iron picture. His serum iron is 42, well above the upper limit of 31.3, and his transferrin saturation is 59%, above the upper limit of 55%. Transferrin saturation is a measure of how much of the body's iron-carrying protein is loaded with iron, and at 59% the transport system is close to full. What makes this more than a one-off dietary spike is that it occurs despite a ferritin of only 48, which is relatively modest. Ferritin is the storage form of iron, and if this were simply a case of a high-iron meal the night before, ferritin would typically be elevated as well. The combination of very high circulating iron, high saturation, and a ferritin that has not yet climbed raises the possibility of hereditary haemochromatosis, a genetic condition affecting how the body regulates iron absorption. Around 1 in 200 people of European ancestry carry two copies of the relevant gene variant (HFE C282Y), and those individuals absorb more iron from food than the body needs. The GP should arrange an HFE gene test. If the gene test is positive, regular monitoring and phlebotomy (controlled blood donation) can prevent iron accumulating in the liver, heart, and pancreas over the decades ahead. If the gene test is negative, a repeat fasting iron panel in eight weeks would confirm whether this was a transient finding. Andrew should not take any iron-containing supplements until this has been resolved.\n\nThere is a great deal of positive news in this report. Andrew's inflammation is essentially undetectable. His hs-CRP, the most sensitive marker of systemic inflammation, came back below 0.2, which is about as low as the assay can measure. His ESR, a second and older measure of inflammation, is just 2. Together these confirm that there is no inflammatory process running in the background, which is relevant both to the iron picture (it makes an inflammatory cause of the iron changes very unlikely, because the acute-phase proteins are completely quiet) and to his cardiovascular risk. His liver is in excellent health. ALT at 24 and GGT at 18 are both comfortably within optimal territory, his FIB-4 score is 1.12, and his amylase and lipase are normal, meaning the liver and pancreas are under no metabolic strain at all. His thyroid is working well, with a TSH of 0.97 sitting right in the sweet spot between 1.0 and 2.5, a free T3 of 5.7 which is squarely in the optimal zone, and both thyroid antibodies negative, ruling out autoimmune thyroid disease. His testosterone is 24.5, which at 45 is an excellent result and sits comfortably in the optimal band of 18 to 30. His free androgen index is 45.4, and his calculated free testosterone is 0.382, both healthy. DHEA-S, the adrenal precursor to testosterone, is 6.7, also well within range. His prostate is clean, with a PSA of just 0.17 against a limit of 2.5 and a free-to-total ratio of 76.5%, which is extremely reassuring. His immune system panels, IgG, IgM, IgA and IgE, are all within their reference ranges, and his coeliac screen (tissue transglutaminase IgA) is negative. His uric acid at 249 is within range, his platelets are healthy at 247, and his full blood count is overwhelmingly normal with haemoglobin of 156, a red cell count of 5.1, and a haematocrit of 0.443.\n\nTurning to his lipid profile, there is a finding here that is important because it is permanent. His Lp(a), lipoprotein(a), is 114.63, which places him in the moderate-risk category (the threshold for concern is 32, and moderate risk runs from 90 to 200). Lp(a) is an inherited lipoprotein particle that the body produces at a genetically fixed rate. It cannot be changed by diet, exercise, or most medications. It works by attaching to LDL particles and making them stickier, encouraging them to lodge in artery walls, and it also has properties that promote clotting. This is a result that should go on Andrew's permanent medical record, and his first-degree relatives (parents, siblings, children) should be tested as well, because if they carry the same variant they would benefit from knowing early. Because Lp(a) itself cannot be lowered, the clinical strategy is to reduce every other modifiable cardiovascular risk factor as aggressively as possible, making LDL and ApoB the primary targets. His LDL is 3.22, above the 3.0 upper limit, and his ApoB (apolipoprotein B, the protein that sits on every atherogenic particle and is considered the single best measure of cardiovascular risk) is 0.92, above the 0.9 threshold. With an Lp(a) in this range, the target for ApoB ideally drops below 0.8 rather than simply below 0.9. The encouraging news is that his HDL is 1.7, which is excellent, his triglycerides are 1.19, his ApoB-to-ApoA1 ratio is 0.60 which is below the 0.7 lower-risk threshold, and his remnant cholesterol (total cholesterol minus HDL minus LDL) calculates to 0.48, which is within optimal. His total cholesterol of 5.4 is mildly above the desirable threshold of 5.18, but total cholesterol is a blunt instrument and the ApoB and Lp(a) are the numbers that matter most here. The combination of an elevated Lp(a) with a borderline ApoB means dietary changes to bring LDL and ApoB down are genuinely important for Andrew and are covered in the recommendations below.\n\nHis kidney function deserves a careful look. His Cystatin C is 1.19, above the upper limit of 1.1. Cystatin C is a small protein filtered by the kidneys at a constant rate regardless of muscle mass, making it a more reliable measure of kidney filtration than creatinine in lean, muscular individuals. His Cystatin C-based eGFR is 77, and his creatinine-based eGFR is 87. Neither is alarming in isolation, but the Cystatin C-based figure sitting below 90 at age 45 is worth noting. At Andrew's age, lean build, and training volume, both figures would ideally be above 90. This does not indicate kidney disease, but it does warrant a repeat in six months. Andrew should ensure he is well hydrated on the morning of any future blood draw, and the GP should be aware of this finding.\n\nHis C-Peptide came back at 0.285 ug/L, which converts to approximately 94 pmol/L, well below the lower limit of the reference range (1.1 ug/L or 364 pmol/L). C-Peptide is released by the pancreas in a 1:1 ratio with insulin and is a measure of how much insulin the pancreas is producing. His fasting insulin is 2.61, sitting right at the bottom of the laboratory range of 2.6 to 24.9. His HOMA-IR, a calculation that estimates insulin resistance, is 0.63, which is in the insulin-sensitive and optimal zone. His fasting glucose is 5.4, which is at the upper edge of the optimal window (4.0 to 5.4), and his HbA1c is 38 mmol/mol, which is healthy. The lab noted that C-Peptide can degrade significantly if the sample is not separated within four hours, and this is the most likely explanation for the very low reading. However, taken alongside an insulin that is barely within range and a glucose sitting at the top of optimal, there is a pattern here that suggests Andrew's pancreas is producing relatively little insulin. For a lean, heavily training individual on a high-carb diet, this is most likely a reflection of excellent insulin sensitivity: the body simply does not need much insulin to clear glucose. But given the C-Peptide result, a repeat fasting insulin and C-Peptide on a fresh, promptly separated sample would be prudent to confirm this interpretation.\n\nHis vitamin D at 81 is within the sufficient and optimal range of 75 to 120, which is a good result. His B12 at 273 is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism, and at 273 a sublingual methylcobalamin supplement would be worthwhile, particularly given his reported brain fog and fatigue. His folate at 9 is above the optimal threshold of 8. His magnesium at 1.21 is above the upper limit of 1.11. This is unusual and worth clarifying. If Andrew is supplementing magnesium, this is the most likely explanation. High magnesium from supplementation alone is generally well tolerated but can cause loose stools at excessive doses. If he is not supplementing, the GP should be made aware, although in the absence of symptoms such as muscle weakness, low blood pressure, or slowed heart rate, this is unlikely to be clinically significant.\n\nHis cortisol at 518 is within the morning reference range of 145 to 619 and is not abnormal, though it sits in the upper half. Given his goals around stress and anxiety reduction, this is worth noting. Cortisol is the body's primary stress hormone, and while a single morning reading cannot diagnose chronic stress, a value in the upper portion of the range in someone reporting stress-related goals is consistent with a system that is running at a higher baseline. His oestradiol at 144 is just within the upper limit of 146.1. At his testosterone level this is acceptable, but the ratio is worth monitoring. Progesterone at 2.48 is within range for a male.\n\nHis MCHC at 352 is marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and storage, and at this margin this is almost certainly a specimen handling artifact rather than a clinical finding. His reticulocyte absolute count at 41.82 is just below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a mildly low count in the context of a completely normal haemoglobin, red cell count, and haematocrit suggests the bone marrow is producing red cells at a pace that matches demand and simply does not need to accelerate. This is not a concern but is noted for completeness.\n\nHis total antioxidant activity at 1.97 is above the upper limit of 1.77. This is typically driven by antioxidant supplementation (vitamin C, vitamin E, polyphenol-rich supplements) and is not a clinical concern.\n\nThe urine culture returned significant growth of Staphylococcus saprophyticus. However, the specimen was received in a plain bottle without boric acid preservative, and the lab has noted that the absence of boric acid may cause overgrowth of organisms. His urinary white cells are below 1, his nitrites are negative, and he reports no urinary symptoms. Taken together, this is most likely a specimen contamination or overgrowth artifact rather than a genuine urinary tract infection. If Andrew develops urinary symptoms such as burning, frequency, or urgency, a repeat mid-stream urine in a boric acid bottle should be submitted. The sensitivity panel returned alongside this culture shows the organism is sensitive to most antibiotics tested but resistant to fusidic acid, which is noted for reference only.\n\nPulling the threads together for Andrew's symptoms: his low energy and brain fog are most plausibly connected to his diet quality, which he rates at just 2 out of 10, and his below-optimal B12. A diet rated 2 out of 10 in quality, at a volume of only 5 out of 10, in a man who trains more than ten sessions per week with 10,000 to 15,000 daily steps, is very likely to be providing insufficient micronutrients and possibly insufficient total calories and protein. His low libido is harder to explain from the bloods alone, because his testosterone, free testosterone, and DHEA-S are all healthy. The combination of very high training volume, potentially inadequate caloric intake, and reported stress and anxiety may be contributing factors that are not fully captured by a single hormone panel. Improving diet quality and ensuring adequate caloric intake are the most impactful changes Andrew can make.","links":"Andrew's report highlights three areas that need attention: the iron picture, the cardiovascular lipid profile, and his overall nutrition strategy. Each of these is addressed below with specific actions.\n\nThe iron findings should be discussed with his GP as a priority. Andrew should request an HFE gene test to screen for hereditary haemochromatosis. He should bring the following numbers to his appointment: serum iron 42 (limit 31.3), transferrin saturation 59% (limit 55%), ferritin 48. If the gene test is negative, a repeat fasting iron panel in eight weeks will confirm whether this was transient. Until this is resolved, Andrew should avoid iron-fortified cereals and supplements containing iron, and should not take vitamin C supplements alongside iron-rich meals as vitamin C enhances iron absorption.\n\nFor the cardiovascular profile, Andrew's elevated Lp(a) at 114.63 means that reducing every other modifiable risk factor becomes more important than it would be for someone with a normal Lp(a). His ApoB target should ideally be below 0.8 rather than simply below 0.9. Dietary changes that specifically lower ApoB and LDL include increasing soluble fibre intake to 10 to 15 grams per day from sources such as oats, barley, lentils, chickpeas, beans, apples, and flaxseed. Oily fish two to three times per week (salmon, mackerel, sardines) provides EPA and DHA which improve the overall lipid profile. Reducing saturated fat by replacing butter and coconut oil with olive oil and rapeseed oil, and replacing some red meat servings with fish or legumes, will help bring LDL down. A plant sterol or stanol-enriched spread or yoghurt drink providing 2 grams per day of plant stanols can reduce LDL by a further 7 to 10%. Andrew should ask his GP to record his Lp(a) result permanently and should encourage his parents, siblings, and any children to be tested.\n\nAndrew's nutrition is the single most important area for improvement. At 70kg, 180cm, and his training volume (10+ sessions per week plus 10,000 to 15,000 steps), his estimated maintenance calorie requirement is approximately 2,800 to 3,100 calories per day using a very active multiplier of 1.75 to 1.9 on a basal metabolic rate of approximately 1,650 calories. A diet volume of 5 out of 10 and quality of 2 out of 10 at this activity level is almost certainly leaving him in a caloric deficit with poor micronutrient coverage. If his goal is to build muscle, he needs to be at maintenance or in a slight surplus of 200 to 300 calories above maintenance, targeting 2,800 to 3,400 calories per day depending on training intensity. His protein intake should be 1.6 to 2.0 grams per kilogram, which translates to 112 to 140 grams of protein per day, spread across at least four meals. His current high-carb, low-fat approach is not inherently problematic for muscle building, but the quality rating of 2 suggests the carbohydrate sources are likely processed and low in micronutrient density. Shifting to whole grains, root vegetables, fruits, legumes, and oats as primary carbohydrate sources would improve micronutrient intake substantially. Fat should not be restricted below 20% of total calories (approximately 60 to 75 grams per day), as fat is essential for hormone production, and excessively low fat intake can impair testosterone synthesis despite his current healthy testosterone level.\n\nFor his Cystatin C and kidney function, Andrew should ensure he is well hydrated on the morning of any blood draw and should request a repeat Cystatin C and creatinine in six months. He should aim for at least 2 to 2.5 litres of water daily, more on heavy training days.\n\nFor his B12, a sublingual methylcobalamin supplement at 1,000 micrograms daily will bring his levels into the optimal range over eight to twelve weeks. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets.\n\nFor stress and anxiety, which are goals Andrew has specifically identified, practical strategies include maintaining a fixed wake time seven days a week, getting outside within the first hour of waking for natural light exposure, setting a caffeine cut-off at 1pm, and keeping the bedroom cool (16 to 18 degrees). Given his very high training volume, Andrew should also consider whether his current load is supporting recovery or working against it. More than ten training sessions per week in someone reporting low energy, brain fog, and stress symptoms may be tipping the balance from beneficial training stress into chronic under-recovery. Introducing one or two full rest days per week and monitoring how his energy and mood respond over four weeks would be a worthwhile experiment.\n\nA retest in four to six months should include: fasting iron panel (iron, transferrin, saturation, ferritin), Cystatin C and creatinine, ApoB, LDL, fasting insulin and C-Peptide (requesting prompt sample separation), and B12.","flags":"IRON STUDIES: Serum iron 42 umol/L (limit 31.3), transferrin saturation 59.3% (limit 55%), with ferritin 48 (within range) and transferrin 2.82 (within range). High circulating iron and high saturation with unremarkable ferritin and no inflammatory signal (CRP below 0.2) raises the possibility of hereditary haemochromatosis. Recommend HFE gene test. If negative, repeat fasting iron panel in 8 weeks.\n\nLIPIDS AND CARDIOVASCULAR: Lp(a) 114.63 nmol/L (limit 32), moderate-risk category. This is genetically determined and unmodifiable. LDL 3.22 mmol/L (limit 3.0), ApoB 0.92 g/L (limit 0.9). With Lp(a) in this range, ApoB target should ideally be below 0.8. First-degree relatives should be tested for Lp(a). Total cholesterol 5.4 (desirable below 5.18). Mitigating factors: HDL 1.7, triglycerides 1.19, ApoB/A1 ratio 0.60, remnant cholesterol 0.48.\n\nKIDNEY FUNCTION: Cystatin C 1.19 mg/L (limit 1.1), Cystatin C eGFR 77, creatinine eGFR 87. At 45 in a lean individual, both eGFR values would ideally be above 90. No proteinuria, urea normal. Recommend repeat in 6 months with hydration.\n\nGLUCOSE AND INSULIN: C-Peptide 0.285 ug/L (range 1.1 to 4.4), significantly below range. Lab notes sample degradation if not separated within 4 hours. Fasting insulin 2.61 (lower boundary of 2.6 to 24.9). Glucose 5.4, HbA1c 38, HOMA-IR 0.63. Pattern is consistent with high insulin sensitivity, but C-Peptide should be repeated on a promptly separated sample to exclude early beta-cell insufficiency.\n\nMAGNESIUM: 1.21 mmol/L (limit 1.11). Likely supplementation-driven. If not supplementing, GP should be aware.\n\nFREE TESTOSTERONE (CALCULATED): 0.382 nmol/L (limit 0.25). Mildly above range. In context of total testosterone 24.5, SHBG 54, and no exogenous hormone use, this is a physiological finding and not a concern.\n\nURINALYSIS: Significant growth of Staphylococcus saprophyticus on plain bottle (no boric acid). WBC below 1, nitrites negative, no urinary symptoms reported. Most likely overgrowth artifact from absence of preservative. Repeat in boric acid bottle only if symptoms develop. Organism resistant to fusidic acid only.\n\nMINOR FINDINGS: MCHC 352 (limit 345), likely specimen handling artifact. Reticulocyte absolute count 41.82 (limit 50), mild and clinically insignificant with normal haemoglobin. TAA 1.97 (limit 1.77), likely supplementation-driven. Cortisol 518, within morning range, upper half.\n\nReassuring negatives: CRP below 0.2, ESR 2, liver enzymes all clean (ALT 24, GGT 18, FIB-4 1.12), thyroid function normal with negative antibodies, testosterone 24.5 optimal, PSA 0.17 with free ratio 76.5%, coeliac screen negative, all immunoglobulins within range, urinalysis otherwise clean, HbA1c 38, HOMA-IR 0.63.","recommendations":"1. See GP for HFE gene test to investigate elevated serum iron (42) and transferrin saturation (59%). Bring this report. Do not take iron supplements until resolved.\n\n2. Record Lp(a) of 114.63 nmol/L on permanent medical record. Test first-degree relatives for Lp(a).\n\n3. Reduce ApoB and LDL through dietary changes: increase soluble fibre to 10 to 15 grams per day, eat oily fish two to three times per week, replace saturated fat sources with olive oil and rapeseed oil, consider 2 grams per day of plant stanols.\n\n4. Increase overall diet quality from 2 out of 10. Shift to whole food carbohydrate sources: oats, sweet potatoes, brown rice, legumes, fruits. Ensure at least five servings of vegetables daily.\n\n5. Increase calorie intake to 2,800 to 3,400 calories per day to support training volume and muscle-building goal. Current intake appears insufficient.\n\n6. Ensure protein intake of 112 to 140 grams per day (1.6 to 2.0 g/kg), spread across at least four meals.\n\n7. Do not restrict dietary fat below 60 to 75 grams per day to support hormone production.\n\n8. Begin sublingual methylcobalamin 1,000 micrograms daily to raise B12 from 273 toward the optimal range of 500 to 900.\n\n9. Repeat Cystatin C, creatinine, and eGFR in six months. Ensure adequate hydration before blood draw.\n\n10. Repeat fasting C-Peptide and insulin on a promptly separated sample in the next blood panel.\n\n11. If not already supplementing magnesium, mention the elevated magnesium (1.21, limit 1.11) to GP. If supplementing, consider reducing dose.\n\n12. If urinary symptoms develop (burning, frequency, urgency), submit a repeat mid-stream urine sample in a boric acid bottle.\n\n13. Consider reducing training frequency from 10+ sessions to 8 per week, introducing one to two full rest days, and monitoring energy, mood, and libido over four weeks.\n\n14. For stress and anxiety: fix wake time seven days per week, get outside within the first hour of waking, cut caffeine by 1pm, keep bedroom at 16 to 18 degrees.","supplementation":"Based on Andrew's results, the following supplements are recommended:\n\nVitamin B12 as sublingual methylcobalamin, 1,000 micrograms daily, taken in the morning. His B12 at 273 is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve conduction, red blood cell maturation, and energy metabolism. Sublingual delivery is preferred over oral tablets because it is absorbed directly through the mucous membranes, bypassing any variation in gut absorption. This should bring his levels into the 500 to 900 optimal range within eight to twelve weeks.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with a meal containing fat. This supports the effort to lower ApoB and LDL, which is particularly important given his elevated Lp(a). EPA and DHA also have anti-inflammatory properties and support brain function, which may help with his reported brain fog.\n\nVitamin D3 as cholecalciferol, 2,000 IU daily, taken with a fat-containing meal. His current level of 81 is within the optimal window of 75 to 120, and this maintenance dose will help keep it there through the autumn and winter months when UVB exposure in the UK drops to near zero. Vitamin D should always be paired with vitamin K2.\n\nVitamin K2 as MK-7, 100 micrograms daily, taken alongside vitamin D3. K2 directs calcium into bones and teeth and away from soft tissues and artery walls, complementing vitamin D's role in calcium absorption.\n\nIf Andrew is currently supplementing magnesium, he should reduce his dose or pause supplementation given his magnesium of 1.21 is above the upper limit of 1.11. If he is not supplementing magnesium, no magnesium supplement is needed and the elevated level should be mentioned to his GP.\n\nDO NOT take iron supplements. Andrew's serum iron and transferrin saturation are elevated, and iron supplementation could worsen a potential iron overload condition. This includes multivitamins or greens powders that contain iron. Check labels carefully.\n\nThe most important changes from this report are not supplements. They are improving diet quality from its current rating of 2 out of 10, increasing total calorie and protein intake to match his very high training demands, making the specific dietary changes to lower ApoB and LDL, and getting the HFE gene test through his GP to investigate the elevated iron markers.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. It is one of the primary screening tools for diabetes and pre-diabetes. Andrew's result of 5.4 sits right at the upper edge of the optimal window of 4.0 to 5.4. This is not a concern in isolation, particularly with an HbA1c of 38 and a HOMA-IR of 0.63 confirming excellent glucose control over time, but it is worth monitoring alongside the insulin and C-Peptide findings discussed in the summary.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, excessive alcohol consumption","high_causes":"Insulin resistance, type 2 diabetes, stress, infection, medications such as corticosteroids, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, providing an average picture of blood sugar control over the preceding two to three months. Andrew's result of 5.6% is well within the normal range (below 6.0%) and indicates healthy glucose management over the medium term.","low_causes":"Haemolytic anaemia, chronic blood loss, blood transfusion","high_causes":"Sustained high blood sugar, pre-diabetes, type 2 diabetes, iron deficiency anaemia (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised units of mmol/mol. Andrew's result of 38 is below the normal threshold of 42 and above the optimal ceiling of 36 by a small margin. This is a healthy result that confirms stable blood sugar control. Pre-diabetes begins at 42, and diabetes at 48.","low_causes":"Haemolytic anaemia, chronic blood loss, blood transfusion","high_causes":"Sustained high blood sugar, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3337","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3306","upper_optimal_position":"0.3547","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing when the body has not eaten for several hours. It is one of the earliest indicators of insulin resistance, often becoming elevated years before blood sugar itself rises. Andrew's result of 2.61 sits right at the bottom of the laboratory range (2.6 to 24.9) and within the optimal window of 2 to 8. This is a very lean insulin output, consistent with high insulin sensitivity in a lean, active individual. The body is managing blood sugar with minimal insulin, which is metabolically efficient. However, when read alongside the very low C-Peptide, it warrants a confirmatory retest on a properly handled sample.","low_causes":"High insulin sensitivity, low carbohydrate intake, lean body composition, high physical activity, early type 1 diabetes (rare in adults)","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes (early stages), obesity, PCOS, excessive refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0224","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1456","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"C-Peptide is a byproduct released by the pancreas in a one-to-one ratio with insulin. It is a more stable measure of insulin production than insulin itself because it is not cleared by the liver on first pass. Andrew's result converts to approximately 94 pmol/L (from 0.285 ug/L), which is significantly below the lower limit of 364 pmol/L. The laboratory has noted that C-Peptide can degrade to 44% of baseline if the sample is not centrifuged and separated within four hours of collection. This degradation is the most likely explanation. However, given the simultaneously borderline insulin, a repeat on a promptly separated sample is recommended to confirm.","low_causes":"Sample degradation (most common with delayed processing), high insulin sensitivity with low demand, exogenous insulin use, late type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation that uses fasting glucose and fasting insulin to estimate how resistant the body's cells are to the effects of insulin. A lower number indicates better insulin sensitivity. Andrew's result of 0.63 is excellent, confirming that his cells respond efficiently to insulin. Below 1.0 is considered optimal, above 1.9 suggests early insulin resistance, and above 2.9 indicates significant insulin resistance. This is one of the strongest positives in the report.","low_causes":"High insulin sensitivity, lean body composition, regular exercise, low carbohydrate intake","high_causes":"Insulin resistance, obesity, sedentary lifestyle, metabolic syndrome, high refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"27.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1049","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates the functional capacity of the insulin-producing beta cells in the pancreas. It is calculated as (20 x Insulin) / (Glucose - 3.5). Andrew's result of 27.5 is below the reference range of 80 to 200, indicating that the pancreas is producing a relatively low amount of insulin for his glucose level. In the context of a normal glucose (5.4), normal HbA1c (38), and excellent HOMA-IR (0.63), this most likely reflects very efficient insulin usage rather than pancreatic failure. The C-Peptide sample degradation may also be pulling this calculation artificially low. A repeat panel with properly processed samples will clarify.","low_causes":"High insulin sensitivity with low insulin demand, sample degradation of insulin/C-Peptide, late-onset autoimmune diabetes (LADA), pancreatic insufficiency","high_causes":"Insulin resistance (pancreas compensating by producing more insulin), early type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform a wide range of functions including transporting hormones and nutrients, fighting infection, and maintaining fluid balance. Andrew's result of 76 is well within both the laboratory and optimal ranges, indicating healthy protein synthesis by the liver and adequate nutritional protein intake.","low_causes":"Malnutrition, liver disease, kidney disease (nephrotic syndrome), malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3708","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood and is produced exclusively by the liver. It transports hormones, vitamins, and medications through the bloodstream and maintains the osmotic pressure that keeps fluid inside blood vessels. Andrew's result of 46 is healthy and confirms good liver synthetic function and adequate protein nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, burns","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins are a group of proteins that include antibodies (immunoglobulins) and transport proteins. They are produced by the liver and the immune system. Andrew's result of 30 is well within range, reflecting a healthy and balanced immune protein pool.","low_causes":"Immunodeficiency, liver disease, malnutrition, nephrotic syndrome","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver cirrhosis, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5714","units":"","description":"The albumin-to-globulin ratio compares the two main protein groups in the blood. A healthy ratio indicates balanced liver function and immune activity. Andrew's ratio of 1.53 is well within the optimal range.","low_causes":"Liver disease, autoimmune conditions, chronic infection, kidney disease","high_causes":"Immunodeficiency (genetic or acquired)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and intestines. Elevated levels can indicate bile duct obstruction, bone disease, or liver damage. Andrew's result of 51 is within the healthy range, indicating no biliary or bone issues.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease (Paget's, fractures), liver disease, vitamin D deficiency, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Andrew's result of 16 is within both the laboratory and optimal ranges, indicating normal red blood cell turnover and healthy liver clearance.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome (benign, inherited), liver disease, bile duct obstruction, haemolytic anaemia, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. It is one of the most sensitive markers of liver cell injury. Andrew's result of 24 is well within the optimal range for males (below 30), confirming that his liver cells are healthy and not under metabolic strain.","low_causes":"Generally not clinically significant; can be seen in vitamin B6 deficiency","high_causes":"Fatty liver disease, alcohol-related liver damage, viral hepatitis, medication toxicity, intense exercise (transient), obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5521","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is fairly specific to the liver, AST can be elevated by muscle damage from intense exercise. Andrew's result of 30 is within the optimal range, and when read alongside his clean ALT and GGT, confirms a healthy liver.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver disease, heart attack, intense exercise, muscle damage, alcohol consumption, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3862","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis (scarring) using age, platelet count, AST, and ALT. A score below 1.3 in people under 65 suggests no significant liver fibrosis. Andrew's score of 1.12 is reassuringly within the safe zone, indicating no evidence of liver scarring.","low_causes":"Not clinically significant; indicates absence of fibrosis","high_causes":"Liver fibrosis or cirrhosis, chronic hepatitis, fatty liver disease, age above 65 (inflates score), low platelet count, low ALT (inflates score)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1233","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct problems, and metabolic strain on the liver. It is often the first liver marker to rise when the liver is under pressure. Andrew's result of 18 is well within the optimal range of below 25, indicating that his liver is handling its metabolic workload comfortably.","low_causes":"Not clinically significant","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"103","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5511","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starches into sugars. Elevated levels can indicate pancreatitis or salivary gland problems. Andrew's result of 103 is within the laboratory range though just above the optimal ceiling of 100. This is not a concern, particularly with his lipase also being normal.","low_causes":"Chronic pancreatitis (burnt-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4929","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5603","units":"U/L","description":"Lipase is an enzyme produced almost exclusively by the pancreas that breaks down dietary fats. It is the most specific marker for pancreatic inflammation. Andrew's result of 41 is well within range, confirming a healthy pancreas.","low_causes":"Not clinically significant","high_causes":"Acute pancreatitis, chronic pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5213","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL (often called 'bad' cholesterol), HDL ('good' cholesterol), and VLDL. Andrew's result of 5.4 is mildly above the desirable threshold of 5.18. However, total cholesterol alone is a blunt instrument. The breakdown into LDL, HDL, and the more informative ApoB and Lp(a) provides a much clearer picture of cardiovascular risk, and those are discussed in their own sections.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption, certain medications","high_causes":"Diet high in saturated fat, genetic hypercholesterolaemia, hypothyroidism, kidney disease, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.19","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.35","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the most common form of fat in the blood. They come from dietary fat and are also produced by the liver from excess carbohydrate and alcohol. Andrew's result of 1.19 is within the fasting reference range of below 1.7 but above the optimal threshold of 1.0. Given his high-carb diet, this is not surprising, as excess carbohydrate is converted to triglycerides by the liver. Improving diet quality and shifting from refined to complex carbohydrate sources should help bring this into the optimal range.","low_causes":"Malnutrition, hyperthyroidism, malabsorption, very low-fat diet","high_causes":"High carbohydrate intake (especially refined), alcohol, obesity, insulin resistance, metabolic syndrome, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3462","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues around the body. It is a precursor to LDL and is considered an atherogenic particle. Andrew's result of 0.54 is within both the laboratory and optimal ranges, reflecting healthy triglyceride transport.","low_causes":"Not clinically significant","high_causes":"High triglycerides, obesity, insulin resistance, metabolic syndrome, excess carbohydrate or alcohol intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5484","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.4","upper_optimal":"2.5","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because it collects excess cholesterol from artery walls and transports it back to the liver for disposal. Higher HDL is protective against cardiovascular disease. Andrew's result of 1.7 is excellent, well above both the desirable threshold of 1.55 and the optimal floor for males of 1.4. This is a strong protective factor in his lipid profile and is likely supported by his high level of physical activity.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, high refined carbohydrate diet, certain medications","high_causes":"Regular aerobic exercise, moderate alcohol consumption, genetic factors, very high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5587","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol carries cholesterol from the liver to the body's tissues. When present in excess, LDL particles can penetrate artery walls and trigger plaque formation. Andrew's result of 3.22 is above the upper limit of 3.0 and above the optimal target of 2.6. With his elevated Lp(a), reducing LDL becomes particularly important because Lp(a) particles carry their own LDL-like cholesterol that adds to the total atherogenic burden. Dietary changes focused on increasing soluble fibre and reducing saturated fat are the first-line approach.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, very low-fat diet, statin use","high_causes":"Diet high in saturated fat, genetic hypercholesterolaemia, hypothyroidism, kidney disease, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. A lower ratio indicates a more favourable balance between total cholesterol and protective HDL. Andrew's ratio of 3.18 is well within the desirable range of below 4.5 and within the optimal window of below 4.0, reflecting the strong protective effect of his high HDL.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"31.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3935","lower_normal":"20","upper_normal":"100","lower_optimal":"28","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6","upper_optimal_position":"1","units":"%","description":"This expresses HDL cholesterol as a percentage of total cholesterol. A higher percentage indicates a greater proportion of protective HDL. Andrew's 31.48% is well above the 20% floor, confirming a healthy cholesterol distribution.","low_causes":"Low HDL relative to total cholesterol, metabolic syndrome","high_causes":"Very high HDL, very low LDL, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4625","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic (artery-damaging) cholesterol in one number, including LDL, VLDL, and Lp(a)-carried cholesterol. Andrew's result of 3.7 is within the laboratory limit of 4.0 but above the optimal target of 3.4. Given his elevated Lp(a), part of this non-HDL value is coming from Lp(a) particles that cannot be reduced by lifestyle changes. Reducing the modifiable LDL component through diet is the appropriate strategy.","low_causes":"Very low LDL, hyperthyroidism, malnutrition","high_causes":"Elevated LDL, elevated triglycerides, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"1.2","upper_normal":"2.0","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6167","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein of HDL particles and is a direct measure of the body's protective cholesterol transport capacity. Higher levels are associated with lower cardiovascular risk. Andrew's result of 1.54 is above the 1.2 desirable threshold and within the optimal range, consistent with his excellent HDL cholesterol level.","low_causes":"Genetic factors, smoking, sedentary lifestyle, metabolic syndrome, very low-fat diet","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, ApoB is effectively a count of all the particles that can penetrate artery walls. It is considered the single best blood marker for predicting cardiovascular risk. Andrew's result of 0.92 is above the desirable limit of 0.9 and above the optimal target of 0.8. Given his Lp(a) of 114.63, some of these ApoB-carrying particles are Lp(a) particles that cannot be reduced by lifestyle. The goal is to bring the modifiable component (LDL-carried ApoB) down through dietary changes and, if needed, medication in consultation with his GP.","low_causes":"Hyperthyroidism, malnutrition, statin therapy, very low-fat diet","high_causes":"High LDL, familial hypercholesterolaemia, high saturated fat diet, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (harmful) particles to the number of protective HDL particles. It is considered one of the best summary measures of cardiovascular risk from a lipid panel. Below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Andrew's ratio of 0.60 falls in the lower-risk category, reflecting the protective effect of his strong HDL and ApoA1 partially offsetting his elevated ApoB.","low_causes":"Very high HDL, very low LDL, high physical activity","high_causes":"High LDL/ApoB, low HDL/ApoA1, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"114.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It promotes atherosclerosis (artery plaque formation) through three mechanisms: it deposits cholesterol in artery walls like LDL, it has pro-inflammatory properties, and it inhibits the body's natural clot-dissolving system, encouraging blood clots to form. Andrew's result of 114.63 places him in the moderate-risk category (90 to 200 nmol/L). This is an inherited trait that cannot be changed by diet, exercise, or most currently available medications. It should be recorded on his permanent medical record, and his first-degree relatives should be tested. The clinical strategy is to minimise every other modifiable cardiovascular risk factor.","low_causes":"Genetic (low-producing variants)","high_causes":"Genetic (inherited, fixed level throughout life). Cannot be meaningfully altered by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2333","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin resistance and cardiovascular risk. A lower ratio indicates better metabolic health. Andrew's ratio of 0.70 (1.19 divided by 1.7) is within the optimal range of below 0.87, confirming good metabolic function and insulin sensitivity. This is a strong positive finding.","low_causes":"High HDL, low triglycerides, excellent insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles (VLDL remnants and chylomicron remnants), which are increasingly recognised as an independent driver of cardiovascular disease. Andrew's result of 0.48 is within the optimal range of below 0.5, indicating that his remnant particle clearance is efficient.","low_causes":"Excellent metabolic health, efficient remnant clearance","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate intake, obesity, familial dyslipidaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.02","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is one of the most important markers for detecting low-grade chronic inflammation, which is associated with increased cardiovascular risk, metabolic disease, and accelerated ageing. Andrew's result is below 0.2, which is essentially at the floor of detection. This is an excellent result and confirms the absence of any systemic inflammatory process.","low_causes":"Absence of inflammation (desirable)","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular disease risk, smoking, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates inflammation because inflammatory proteins cause red cells to clump together. Andrew's ESR of 2 is very low, confirming the hs-CRP finding that there is no inflammatory activity in the body.","low_causes":"Absence of inflammation (desirable), polycythaemia","high_causes":"Infection, autoimmune disease, inflammatory conditions, anaemia, malignancy, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6487","units":"mmol/L","description":"Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve function. Andrew's result of 144 is within the optimal range, indicating healthy fluid balance and kidney regulation.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, SIADH, vomiting/diarrhoea","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Andrew's result of 96 is within the laboratory range though just below the optimal band. This is not a concern and simply reflects the lower end of normal electrolyte variation.","low_causes":"Vomiting, diuretics, metabolic alkalosis, adrenal insufficiency","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"25.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4970","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is the body's primary acid buffer, maintaining blood pH within a very narrow range. Andrew's result of 25.4 is within the optimal range, indicating healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, severe diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, prolonged vomiting, diuretic use, COPD","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5848","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6158","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Andrew's total calcium of 2.54 is within the optimal range, confirming healthy calcium metabolism.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation, dehydration, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3458","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the patient's albumin concentration, giving a more accurate picture of biologically active calcium. Andrew's corrected calcium of 2.44 is within the optimal range, confirming healthy calcium homeostasis.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7839","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5185","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, protein synthesis, and blood sugar regulation. Andrew's result of 1.21 is above the upper limit of 1.11. Elevated magnesium is most commonly caused by magnesium supplementation, which is very common in people who train heavily. If Andrew is supplementing, he should reduce his dose. If he is not supplementing, this finding should be mentioned to his GP, although in the absence of symptoms (muscle weakness, low blood pressure, nausea, slow heart rate) it is unlikely to be clinically significant.","low_causes":"Poor dietary intake, excessive sweating, alcohol, diuretics, proton pump inhibitors, malabsorption, diabetes","high_causes":"Magnesium supplementation (most common), kidney disease (impaired excretion), adrenal insufficiency, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"249","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3630","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5224","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in many foods and in the body's own DNA. Elevated levels can crystallise in joints, causing gout, and are associated with increased cardiovascular and kidney disease risk. Andrew's result of 249 is within both the laboratory and optimal ranges, indicating healthy uric acid metabolism.","low_causes":"Low purine diet, medications (allopurinol), liver disease, Fanconi syndrome","high_causes":"High purine diet (red meat, organ meats, shellfish, beer), gout, kidney disease, dehydration, metabolic syndrome, rapid cell turnover","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5800","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5993","units":"mmol/L","description":"Urea is a waste product produced when the liver breaks down protein. It is filtered by the kidneys and excreted in urine. Elevated levels can indicate reduced kidney function, dehydration, or very high protein intake. Andrew's result of 7.1 is within the laboratory range but above the optimal ceiling of 6.5. This is a minor finding and may reflect his training-driven protein turnover. It is not a concern in isolation.","low_causes":"Low protein diet, severe liver disease, overhydration","high_causes":"Dehydration, high protein intake, kidney disease, gastrointestinal bleeding, heart failure, catabolic states","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism that is filtered by the kidneys at a relatively constant rate. It is used to estimate kidney filtration rate (eGFR). Andrew's creatinine of 91 is within both the laboratory and optimal ranges. In a lean, muscular individual who trains heavily, creatinine can be slightly higher due to greater muscle mass, which is why the Cystatin C-based eGFR provides a more reliable picture.","low_causes":"Low muscle mass, muscle wasting, severe liver disease","high_causes":"Reduced kidney function, high muscle mass, creatine supplementation, dehydration, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.725","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) uses creatinine to estimate how efficiently the kidneys are filtering waste from the blood. Above 90 is considered normal, 60 to 89 is mildly reduced, and below 60 may indicate chronic kidney disease. Andrew's creatinine-based eGFR is 87, which is mildly below the optimal threshold of 90. At 45, this could reflect his muscle mass slightly inflating creatinine, but the Cystatin C-based eGFR of 77 provides additional context and is discussed separately.","low_causes":"Kidney disease, dehydration, medications (NSAIDs, ACE inhibitors), urinary obstruction, diabetes, hypertension","high_causes":"Pregnancy, high cardiac output states (generally not clinically significant when high)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5409","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells at a near-constant rate. Unlike creatinine, its level is not affected by muscle mass, diet, or exercise, making it a more reliable marker of kidney filtration, particularly in lean, muscular, or very active individuals. Andrew's result of 1.19 is above the upper limit of 1.1. His Cystatin C-based eGFR is 77. At 45 with no known kidney disease, hypertension, or diabetes, this is not alarming but does warrant monitoring. Adequate hydration before blood draws is important, as dehydration can transiently elevate Cystatin C. A repeat in six months is recommended.","low_causes":"Hyperthyroidism (can lower production slightly), corticosteroid use","high_causes":"Reduced kidney filtration, hypothyroidism, inflammation, high-dose corticosteroids, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6417","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR provides a muscle-mass-independent estimate of kidney filtration. Andrew's result of 77 is above the 60 threshold for concern but below the 90 optimal threshold. The discrepancy between this and his creatinine-based eGFR of 87 may suggest that creatinine is underestimating the degree of filtration reduction due to his lean build and training. This warrants a repeat test in six months to establish a trend.","low_causes":"Kidney disease, dehydration, medications, urinary obstruction","high_causes":"Not clinically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"156","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6292","units":"g/L","description":"Haemoglobin is the iron-containing protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Andrew's result of 156 is well within both the laboratory and optimal ranges for a male, confirming healthy oxygen-carrying capacity.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, chronic lung disease, testosterone/anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Andrew's count of 5.1 is in the middle of the healthy range, confirming adequate red cell production by the bone marrow.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.443","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.4","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Andrew's result of 0.443 (44.3%) is within the optimal range, confirming a healthy balance between red cells and plasma.","low_causes":"Anaemia, overhydration, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"13.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5310","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"Red cell distribution width (RDW) measures how much variation there is in the size of red blood cells. A high RDW can indicate iron deficiency, B12/folate deficiency, or mixed anaemia. Andrew's result of 13.6% is well within range, indicating that his red blood cells are uniform in size.","low_causes":"Not clinically significant","high_causes":"Iron deficiency, B12/folate deficiency, mixed nutritional deficiency, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3519","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lo
