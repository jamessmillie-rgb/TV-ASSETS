<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Utomi Odozi","dob":"03/05/1974","report_date":"2026-11-10","summary":"Patient is a 52-year-old male of Black/African/Caribbean ethnicity, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). He does no structured cardio or resistance training, with 2,000 to 5,000 daily steps. He sleeps under 6 hours, feels slow to get going on waking and tired on waking through the day, with stress that feels hard to manage some weeks. He does not drink alcohol. He takes no medications. He supplements with vitamin D, omega-3 fish oil and probiotics. He has no reported family history. This is his first blood test. He reports joint pain and stiffness, poor sleep and insomnia, and headaches, all present for over a year. His main concerns are persistent shoulder and joint pain with inflammation, difficulty getting back to sleep and waking several times during the night. His goals are to lose body fat, improve sleep quality and improve energy levels.\n\nThe most important finding in this report is a thyroid pattern that should go to his GP before anything else. His TSH, which is thyroid stimulating hormone, the signal the pituitary gland sends to tell the thyroid to produce more hormone, is 6.09, above the upper limit of 5.5. On its own, a mildly raised TSH could be a temporary fluctuation. What makes this significant is that both thyroid antibodies are strongly positive: anti-TPO (antibodies against thyroid peroxidase, the enzyme the thyroid uses to make its hormones) is 357 against an upper limit of 20, and anti-thyroglobulin (antibodies against the protein the thyroid stores hormone in) is 276 against an upper limit of 115. This pattern is strongly associated with autoimmune thyroid disease (often called Hashimoto's thyroiditis), which only his GP can confirm: an autoimmune process in which the immune system gradually damages the thyroid gland, reducing its ability to produce hormones. His free T4 at 15.0 is within the laboratory range of 11.9 to 21.6 but sitting in the lower half, and his free T3 at 3.95 is also in the lower portion of its 3.1 to 6.8 range. The FT3 to FT4 ratio is 0.263, just below the optimal band of 0.27 to 0.40, suggesting conversion from T4 to the active T3 form is beginning to slow. His TSH to FT4 ratio of 0.406 is above the 0.3 upper limit, confirming the pituitary is working harder than it should to maintain thyroid output. The thyroid is still producing enough hormone to function, but it is being pushed hard to do so, and with antibodies at this level it may progress over time, which is why monitoring matters. Many of his symptoms, particularly the fatigue, the difficulty sleeping, the poor energy on waking, the joint stiffness and the headaches, are recognised features of subclinical hypothyroidism. His GP should see these results and will very likely want to start monitoring, and may consider treatment given the symptom burden.\n\nAlongside the positive ANA result, which is discussed below, the thyroid antibodies also raise a broader autoimmune question. His ANA, which stands for anti-nuclear antibodies, a screening test for autoimmune activity, has come back positive with a homogenous pattern at a titre of 1 in 160. A positive ANA means the immune system is producing antibodies that target the body's own cell nuclei. The homogenous pattern is the most common and is seen in several autoimmune conditions. At a titre of 1 in 160, this is a genuine positive rather than a borderline finding. However, a positive ANA does not by itself diagnose any specific condition. A positive ANA is seen more often in people with autoimmune thyroid disease, so the two findings may be related. That cannot be assumed, though, because he has had joint pain and stiffness for over a year, and a positive ANA alongside joint symptoms is something a GP will usually want to look into in its own right. His rheumatoid factor is negative and his anti-CCP antibodies, which are the more specific test for rheumatoid arthritis, are also negative. This makes rheumatoid arthritis less likely as the cause of his joint pain, which is useful information given how long he has been living with it. The ANA result should be shown to his GP together with the joint symptoms, so they can decide whether further autoimmune tests or a rheumatology opinion are needed.\n\nThere is a great deal of good news in this report, and it is worth spending time on it. His liver is in excellent health. ALT at 13.5 is well below the optimal threshold of 30, GGT at 16 is comfortably below the optimal 25 mark, AST at 19.7 is clean, bilirubin is low, albumin is strong at 45.1, and both the FIB-4 index (a fibrosis screening score) at 1.78 and the APRI (another liver scarring estimate) at 0.314 are within their reference ranges. The FIB-4 is above the 1.3 optimal cutoff, but with an ALT of only 13.5 and platelets at the lower end of range, the calculation is being pushed up by those inputs, and every measured liver marker is normal. His blood sugar control is excellent. Glucose at 4.58 is within the optimal range of 4.0 to 5.4, HbA1c (which reflects average blood sugar over the previous three months) at 36.7 is very close to the optimal threshold of 36, and his HOMA-IR (a measure of insulin resistance calculated from glucose and insulin) at 1.23 is within the healthy range below 2, and his insulin at 42 pmol/L is within the optimal band. These two depend on the sample being fasted, which we do not know for this 08:15 sample, although an early morning draw makes it likely. His C-peptide, a marker of how much insulin the pancreas is producing, is 1.52 ng/ml, within its range. There is no sign of a blood sugar problem. His heart markers are all clean. Troponin T at 6.08 is well below the 14 threshold, CK-MB is below the detection limit, creatine kinase at 127 is mid-range, and myoglobin is low. There is no cardiac strain. His inflammation is genuinely impressive. High-sensitivity CRP (a marker of systemic inflammation) is 0.48, below the optimal threshold of 1.0, which is surprising and reassuring given the joint symptoms he describes. His interleukin panel, which measures a broad range of inflammatory signalling molecules, is clean across the board. The systemic immune-inflammation index at 207 is within the optimal range. His prostate results are reassuring, with a total PSA of 0.73, well below the 3.1 threshold, and a decreased risk on the prostate cancer risk score. His coeliac screen is negative. His folate is excellent at 19.8, and red cell folate at 1,085 confirms good long-term folate stores. His iron studies are well balanced, with ferritin at 237, transferrin saturation at 27.9 percent (within the optimal 25 to 40 band), and iron at 16 with adequate TIBC. His uric acid at 338 is within the optimal range of 200 to 380, which is relevant because uric acid can contribute to joint inflammation when elevated, and his is not. His EBV serology shows past infection (both VCA IgG and EBNA IgG are positive, VCA IgM is negative), which is the expected pattern in the vast majority of adults and does not indicate active infection. His tumour markers are all within range. His urinalysis is largely clean, with negative protein, glucose, bilirubin, nitrites and white cells.\n\nHis PhenoAge, a biological ageing score calculated from nine blood markers, is 48.3 against his calendar age of 52, meaning his blood is ageing nearly four years younger than his birthday suggests. This is a strong result, and the clean inflammation, good blood sugar control and healthy liver function are the main drivers.\n\nTurning to the lipid picture, his total cholesterol at 5.57 is above the 5.0 target, and his LDL cholesterol at 4.08 is above the 3.0 target. His ApoB (apolipoprotein B, the protein that sits on every LDL particle and is the best single measure of the number of cholesterol-carrying particles in the blood) is 117 mg/dL, above the optimal target of below 80 mg/dL. His HDL cholesterol at 1.19 is below the 1.55 lower limit for men. His Lp(a)-corrected LDL, which strips out the small contribution of lipoprotein(a) particles to show the LDL carried by particles other than Lp(a), is 3.99, still above target. His non-HDL cholesterol at 4.38 is above the 3.8 upper limit. His cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 35 out of 100, below the 40 threshold but above the ideal of 20. The drivers are the elevated LDL and ApoB and the low HDL. On the positive side, his triglycerides at 0.65 are excellent, his TG to HDL ratio at 0.55 is within the optimal band, his Lp(a) at 27.1 is below the 32 ideal threshold which means that inherited risk factor is not adding to the picture, his remnant cholesterol at 0.30 is optimal, and his VLDL cholesterol at 0.3 is low. His small LDL at 35.2 mg/dL (22.3 percent of total LDL) is within range, meaning his LDL particles are mostly the larger, less atherogenic type. The lipid picture is one of elevated particle count with a favourable particle profile. The low HDL is worth noting: with no alcohol intake, no exercise and a modest vegetable intake, the most effective interventions are adding regular aerobic activity and increasing omega-3 intake. It is also worth noting that subclinical hypothyroidism, the pattern his thyroid results suggest, slows the liver's clearance of LDL cholesterol from the bloodstream. Treating the thyroid may improve the lipid numbers independently of any dietary change.\n\nHis kidney function shows a split between two markers. His creatinine at 118 is above the upper limit of 104, and the creatinine-based eGFR at 64 is only just above the 60 threshold. However, his cystatin C, a second marker of kidney filtration that is not affected by muscle mass or diet, is 0.73, giving a cystatin C-based eGFR of 113, and the combined eGFR is 92, within the optimal range. Both markers can be shifted by an underactive thyroid, which tends to push creatinine up and cystatin C down, so the true picture is likely to sit between the two. His urea at 4.69, beta-2-microglobulin at 1.07 and microalbumin-to-creatinine ratio at 5.9 are all normal, which is reassuring. The sensible step is for his GP to note the creatinine and repeat kidney function once the thyroid has been assessed. The urea-to-creatinine ratio at 39.7 is just below the lower limit of 40, which follows from the higher creatinine.\n\nHis sodium at 147.4 is marginally above the upper limit of 146, and his calculated serum osmolality at 304 is above the 275 to 295 range. This combination suggests mild dehydration rather than a sodium handling problem. His chloride at 107.7 is at the top of its range. His bicarbonate at 27.6 and potassium at 4.23 are both within range. His magnesium at 0.82 is within the laboratory range but below the optimal band of 0.85 to 1.05. Magnesium is involved in sleep regulation and muscle relaxation, and at this level with his sleep difficulties and joint stiffness, supplementation is worth considering.\n\nHis zinc at 7.0 is significantly below the lower limit of 11.1, and his copper at 6.2 is significantly below the lower limit of 11. Both are markedly low. Zinc is essential for immune function, wound healing, testosterone production and thyroid hormone conversion. Copper is required for iron metabolism, connective tissue integrity and antioxidant defence. Both being low together raises the possibility of a shared cause, such as poor absorption in the gut, although diet can also play a part. His H. pylori antibody level at 349 is well above the 81 upper limit, indicating either current or past infection with Helicobacter pylori, the bacterium that lives in the stomach lining and can cause inflammation, reduced acid production and impaired mineral absorption. A long-standing H. pylori infection can reduce stomach acid, and zinc and copper are absorbed less well when acid is low, so the two findings could be connected. An antibody test cannot tell a current infection from a past one, so his GP should test for active infection (a urea breath test or stool antigen test) and treat it if confirmed. Copper at this level is low enough that his GP should see it directly, because low copper can itself contribute to a low red cell count.\n\nHis adiponectin at 0.99 is below the lower limit of 1.44. Adiponectin is a hormone produced by fat cells that improves insulin sensitivity and has anti-inflammatory properties. Lower levels are associated with higher visceral fat (fat around the organs), increased cardiovascular risk and metabolic syndrome. Despite his good HOMA-IR and blood sugar numbers, the low adiponectin suggests that his body composition could be improved, which aligns with his goal of losing body fat. Exercise, particularly regular aerobic activity, is one of the most effective ways to raise adiponectin.\n\nAt his clinic appointment he measured 173.5 cm and 86.5 kg, giving a BMI of 28.7, above the 24.9 upper limit for a healthy weight. For people of Black African or African-Caribbean family background, NICE advises using lower BMI thresholds (27.5 instead of 30 for the higher-risk band), because health risks begin at a lower BMI. His waist measured 95 cm and his hips 101 cm, giving a waist-to-hip ratio of 0.94 and a waist-to-height ratio of 0.55. For men, a waist above 94 cm and a waist-to-height ratio above 0.5 mean weight is being carried around the middle, which fits the low adiponectin and the raised oestradiol in his bloods and supports his goal of losing body fat. From these measurements his estimated energy use is about 2,200 kcal a day, so a target of about 1,900 kcal a day with 112 g of protein gives steady fat loss. A first milestone of 82 kg is sensible, with around 75 kg as the eventual target. An underactive thyroid can lower energy use a little, so these figures may need adjusting once the thyroid has been assessed. His blood pressure and pulse were not recorded at the appointment, so his GP should check his blood pressure when he goes in about the thyroid results.\n\nHis red blood cell count at 4.28 is below the lower limit of 4.5, and his haematocrit (the proportion of blood that is red cells) at 39.8 percent is just below the 40 lower limit. His haemoglobin at 133 is within range but at the lower end. His MCV at 93 and MCH at 31.1 are both normal, meaning the red cells he does make are the right size and carry the right amount of haemoglobin. This is a mild normocytic picture. In the context of subclinical hypothyroidism, this is a recognised finding: thyroid hormone stimulates red blood cell production in the bone marrow, and when thyroid function is reduced, the marrow makes slightly fewer cells. His iron stores are adequate, his B12 is high and his folate is excellent, so those causes are unlikely. His low copper is another possible contributor, because copper is needed to make red cells. His GP can review the blood count alongside the thyroid and copper results.\n\nHis vitamin B12 at 1,004 and active B12 at 212 are both above the upper limits of their ranges. He is not supplementing B12, which makes this worth noting. A raised B12 without supplements can come from diet, fortified foods or energy drinks, and less commonly from liver or blood conditions; his liver markers are normal. It is not harmful in itself, but an unexplained high B12 is worth showing to his GP. His intrinsic factor antibodies and gastric parietal cell antibodies are both negative.\n\nHis oestradiol at 198 is above the upper limit of 159 for men. Oestradiol is the main oestrogen, and in men it is produced by conversion of testosterone through an enzyme called aromatase, which is found in fat tissue. A common reason for a raised level is higher aromatase activity in body fat, which would fit with his clinic measurements (BMI 28.7, waist 95 cm) and his goal of losing body fat. His testosterone at 17.6 is within the laboratory range of 6.68 to 25.7, sitting just below the optimal threshold of 18. His free testosterone at 0.413 and bioavailable testosterone at 10.14 are both within range. His SHBG (sex hormone binding globulin, the protein that carries testosterone in the blood) at 25.5 is at the lower end of its range. The combination of testosterone just below optimal and raised oestradiol, with SHBG towards the lower end, would fit that pattern. Losing body fat is the usual first step, and the oestradiol is worth mentioning to his GP so it can be rechecked.\n\nHis progesterone at 0.53 is marginally above the 0.47 upper limit. In men, progesterone circulates at very low levels and minor fluctuations above the reference range are common and clinically insignificant.\n\nHis Epidermal Growth Factor (EGF) is below 7, below the lower limit of 29. EGF is involved in tissue repair and cell growth. Blood levels of EGF vary with platelet count (his platelets at 157 are at the lower end of range), and a low result on its own has no established clinical meaning. It is noted for completeness.\n\nHis IgM at 0.424 is below the lower limit of 0.6. IgM is the first antibody the immune system produces in response to a new infection. A low level can be seen in some autoimmune conditions, chronic infections, or as a normal variant. His IgG, IgA and complement are all within range. It is not concerning on its own but should be noted by his GP alongside the autoimmune results.\n\nHis aldolase at 12.87 is above the upper limit of 7.6. Aldolase is an enzyme found in muscle tissue, and elevated levels can indicate muscle damage, though it is less specific than creatine kinase (which is normal at 127). Mild elevations can also be seen in liver disease (excluded) or in inflammatory myopathy. A mild rise like this, with a normal CK, is often not significant. The normal CK makes significant muscle inflammation less likely. Given his joint pain and the positive ANA, his GP should still be aware of it.\n\nHis calcium at 2.24 is within range, just above the 2.2 lower limit, and his PTH at 4.0 is normal. Phosphate at 1.009 is within range. His vitamin D at 148 is within the laboratory range and reflects his supplementation.\n\nA trace of intact red blood cells was found on urine dipstick testing. The white cells, nitrites and protein are all negative, and there is no suggestion of infection. A trace finding is very common and often has no clinical significance. It does not need urgent investigation, but the usual next step is a repeat urine dipstick with his GP, who can decide what to do if it is still present.\n\nIn summary, the most important action from this report is a GP appointment to discuss the thyroid antibody and TSH results, which are consistent with autoimmune thyroid disease. The positive ANA should be discussed at the same appointment, together with his joint symptoms. The low zinc and copper and the H. pylori result may be connected, and both can be acted on. The lipid profile needs attention through diet and exercise, and may partly improve with thyroid treatment. The sleep, energy and joint symptoms have plausible explanations in the thyroid picture, the mineral deficiencies and the sleep debt, all of which are addressable.","links":"The central finding in this report is autoimmune thyroid disease. The TSH is above range, both thyroid antibodies are strongly positive, free T3 and free T4 are sitting in the lower portions of their ranges, and the FT3 to FT4 conversion ratio is below optimal. This single process connects to several other findings. Subclinical hypothyroidism reduces LDL clearance by the liver, which contributes to the elevated LDL and ApoB. It can reduce bone marrow stimulation, which may contribute to the mildly low red blood cell count and haematocrit; his low copper may contribute too. It may also slow red cell production. And many of the symptoms that have persisted for over a year, fatigue on waking, poor sleep, joint stiffness, headaches and low energy, are all recognised features of an underactive thyroid. The positive ANA with a homogenous pattern at 1 in 160, may be related to the thyroid autoimmunity, but with over a year of joint pain it deserves its own assessment by his GP. The negative rheumatoid factor and anti-CCP make rheumatoid arthritis less likely, which is helpful given the chronic joint pain.\n\nThe second thread is the mineral absorption story. Zinc and copper are both significantly below range, and H. pylori antibodies are elevated more than four times the upper limit. A long-standing H. pylori infection can reduce acid production, and zinc and copper are absorbed less well when acid is low. Whether the infection is active needs a breath or stool test. If it is, treating it may help absorption, and supplementation can help in the meantime. The low zinc also feeds back into the thyroid picture, because zinc is a cofactor for the enzyme that converts T4 to T3. Correcting the zinc deficiency is worthwhile in its own right.\n\nThe third thread is metabolic and body composition. Despite good blood sugar control and a healthy HOMA-IR, the low adiponectin and the elevated oestradiol suggest excess visceral fat and increased aromatase activity. Testosterone is just below the optimal band, and SHBG is at the floor of its range. The adiponectin-to-insulin ratio at 0.16 is below the 0.3 lower limit, confirming that the body composition side of the metabolic picture needs attention even though the glucose and insulin numbers are good. Losing body fat will raise adiponectin, lower oestradiol, improve the testosterone-to-oestradiol balance and raise HDL cholesterol.\n\nThe things that were excluded are clinically valuable. Rheumatoid factor and anti-CCP are both negative, making rheumatoid arthritis less likely. The coeliac screen is negative. CRP is below 1.0, so there is no sign of systemic inflammation despite chronic joint symptoms. The liver markers are normal. The kidney markers are reassuring overall, with a repeat advised once the thyroid has been assessed. There is no sign of cardiac strain. The prostate results are reassuring. Tumour markers are all within range. Iron stores are balanced with no sign of deficiency or overload. There is no active EBV infection. The immune system is functioning, with the specific exception of the low IgM.\n\nThe loose ends are the elevated B12 and active B12 without supplementation, which do not have an obvious explanation given the clean liver and negative parietal cell and intrinsic factor antibodies, and the raised aldolase with a normal CK, which may be an effect of the sample waiting overnight before analysis. Both are worth the GP being aware of but neither requires urgent action.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish or leftover chicken. Anchor: protein goes on the plate before anything else. Why: protein supports muscle preservation during fat loss, helps raise the testosterone that is sitting just below optimal at 17.6, and keeps you full between meals so total intake stays controlled.\nSwap sugary snacks and refined carbohydrates (white bread, pastry, sugary cereals) for oats, rye bread or wholegrain alternatives, one meal at a time, starting with whichever meal currently has the most sugar. Anchor: do it this week for one meal, next week for two. Why: reducing sugar frequency from some days toward rarely will lower the insulin demand on your pancreas, help reduce visceral fat (the driver of your low adiponectin at 0.99), and improve the oestradiol-to-testosterone balance.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, helps with fat loss, and is the single easiest way to raise HDL cholesterol from its current 1.19 toward the 1.55 target. At 2,000 to 5,000 steps a day with no structured training, this one habit could add 2,000 steps and begin shifting both the lipid and body composition picture.\nBuild toward three 30-minute resistance sessions per week. Start with bodyweight movements (squats, press-ups against a wall if the shoulder allows, step-ups) or resistance bands to protect the joints. Anchor: pick three fixed days and a fixed time. Why: resistance training raises testosterone, raises adiponectin, preserves muscle during fat loss, and improves sleep quality, all four of which are goals in this report.\nSet a fixed wake time seven days a week, even on weekends, within a 30-minute window. Get outside into natural light within an hour of waking. Anchor: alarm goes off, curtains open immediately. Why: a fixed wake time resets the circadian rhythm that drives your cortisol and melatonin cycles. With under 6 hours of sleep and waking several times a night, the body clock is the first thing to stabilise. Light exposure in the morning suppresses melatonin and shifts the cortisol peak earlier, so you feel more alert on waking instead of slow to get going.\nStop caffeine after 1pm. If you drink coffee or tea in the afternoon or evening, switch to decaf or herbal from lunchtime. Anchor: 1pm is the cut-off, no exceptions. Why: caffeine has a half-life of 5 to 7 hours, meaning a 3pm coffee still has half its effect at 9pm. With your sleep fragmentation, removing this variable may be the simplest improvement.\nIncrease vegetable and fruit intake from 2 to 3 portions toward 5 or more a day, adding one extra portion per week. Anchor: add a portion to lunch this week, to dinner next week. Why: vegetables provide soluble fibre (which lowers LDL cholesterol), magnesium, zinc and antioxidants. Soluble fibre from oats, beans, lentils and vegetables is one of the most effective dietary tools for the LDL of 4.08.\nAim for about 1,900 kcal per day, roughly 300 below your estimated daily energy use of 2,200 kcal, with a protein target of 112 grams per day (1.3 grams per kilogram of bodyweight at 86.5 kg). Anchor: track food in an app for two weeks to calibrate portion sizes, then stop counting. Why: a modest deficit gives steady fat loss of roughly 0.25 to 0.5 kg per week while protecting muscle. The first milestone is 82 kg and the eventual target is around 75 kg, with a waist below 87 cm.","flags":"TSH 6.09 (above the 5.5 upper limit) with strongly positive anti-TPO at 357 (limit 20) and anti-thyroglobulin at 276 (limit 115). Free T4 at 15.0 and free T3 at 3.95 are in the lower portions of their ranges. FT3:FT4 ratio 0.263 is below the 0.27 optimal. TSH:FT4 ratio 0.406 is above 0.3. This pattern is strongly associated with Hashimoto's thyroiditis and should be discussed with his GP, who will likely want to monitor and may consider treatment given the symptom burden.\nANA positive, homogenous pattern, titre 1:160. A positive ANA is more common with autoimmune thyroid disease, but with over a year of joint pain it should be assessed in its own right. Rheumatoid factor and anti-CCP are both negative, making rheumatoid arthritis less likely. His GP should see this result with the joint symptoms and decide on further autoimmune tests or referral.\nZinc 7.0 (lower limit 11.1) and copper 6.2 (lower limit 11), both significantly below range. Possibly related to reduced absorption if the H. pylori finding below reflects an active infection. Low copper can contribute to a low red cell count. His GP should see both results; supplementation is advised in the meantime.\nH. pylori antibodies 349 (upper limit 81), more than four times the threshold. This indicates current or past H. pylori infection, which may be contributing to the low zinc and copper. A urea breath test or stool antigen test should confirm active infection, followed by eradication therapy if positive.\nLDL cholesterol 4.08 (target below 3.  would confirm.\nCreatinine 118 (upper limit 104) with creatinine-based eGFR 64 (just above 60), but cystatin C 0.73 gives an eGFR of 113 and the combined eGFR is 92. Both markers can be shifted by an underactive thyroid, which tends to push creatinine up and cystatin C down, so the true picture is likely to sit between the two. Urea, beta-2-microglobulin and urine albumin are all normal. The GP should note the creatinine and repeat kidney function once the thyroid has been assessed.\nIgM 0.424 (lower limit 0.6). Mildly low, with IgG, IgA and complement in range. Worth noting for the GP but not concerning in isolation.\nVitamin B12 1,004 (upper limit 771) and active B12 212 (upper limit 165), elevated without B12 supplementation. The liver panel is normal and intrinsic factor and parietal cell antibodies are negative. An unexplained high B12 is worth showing to the GP.\nAldolase 12.87 (upper limit 7.6) with normal creatine kinase at 127. A mild rise with a normal CK is often not significant. The normal CK makes significant muscle inflammation less likely. His GP should be aware given the joint pain and positive ANA.\nEGF below 7 (lower limit 29). Blood EGF varies with platelet count, and a low result on its own has no established clinical meaning.\nProgesterone 0.53 (upper limit 0.47) is marginally above range. In men, minor fluctuations in progesterone at this level are common and clinically insignificant.\nUrine red blood cells: trace of intact red blood cells on dipstick. White cells, nitrites and protein all negative. A trace finding is very common. The usual next step is a repeat urine dipstick with the GP.\nReassuring negatives: rheumatoid factor and anti-CCP negative, making rheumatoid arthritis less likely; coeliac screen negative; hsCRP 0.48 making significant systemic inflammation unlikely; all cardiac markers clean; prostate PSA 0.73 with decreased risk score; all tumour markers within range; liver markers normal (ALT 13.5, GGT 16, APRI 0.31); kidney markers reassuring overall (see above); iron stores balanced; no active EBV; intrinsic factor and parietal cell antibodies negative; interleukin panel clean.\nNot reported on this occasion: Apolipoprotein CII, Apolipoprotein CIII, Pan-ProBNP, Leptin, Resistin, Interleukin-6, TNFa, Cystatin C (Urine), NGAL, KIM-1, Pepsinogen I, Pepsinogen II, PGI/PGII Ratio, Gastrin-17, Glutathione Reductase, D-Dimer, IL-1a, IL-1b, IL-2, IL-4, IL-10, IL-23, TGF-a, VEGF, MIP-1a, E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1, PD-1, HER2 ECD, Pancreastatin, Nicked PSA, FABP-4, FABP-5, FABP-6, FABP-7, FABP-9, G-CSF Autoantibodies, GM-CSF Autoantibodies, IFN-a Autoantibodies, IL-10 Autoantibodies, IL-12p35 Autoantibodies, IL-12p40 Autoantibodies, IL-17A Autoantibodies, IL-17F Autoantibodies, IL-18 Autoantibodies, IL-1a Autoantibodies, IL-1b Autoantibodies, IL-2 Autoantibodies, IL-22 Autoantibodies, IL-4 Autoantibodies, IL-6 Autoantibodies, IL-7 Autoantibodies, IL-8 Autoantibodies, IFN-gamma Autoantibodies, IFN-omega Autoantibodies, TNFa Autoantibodies, Reticulocyte count.","recommendations":"Book a GP appointment to discuss the thyroid results. Bring the TSH of 6.09, the anti-TPO of 357, the anti-thyroglobulin of 276, and the free T4 and free T3 values. The GP will likely want to repeat TSH and may consider treatment given the symptom burden of fatigue, poor sleep, joint stiffness and headaches lasting over a year.\nAsk the GP to arrange a urea breath test or stool antigen test for active H. pylori infection. If positive, the GP can prescribe eradication therapy. Show the GP the low zinc (7.0) and low copper (6.2) at the same time.\nShow the GP the ANA positive result (homogenous, 1:160) alongside the thyroid antibodies. Tell the GP about the joint and shoulder pain of over a year, so they can decide whether further autoimmune tests or a rheumatology referral are needed.\nMention the low IgM (0.424, lower limit 0.6) and the elevated B12 (1,004) and active B12 (212) to the GP. Neither is urgent, but both are worth recording.\nMention the mildly raised sodium (147.4) and ask for a routine repeat after ensuring good hydration the day before, to confirm it is a hydration effect.\nDiscuss the lipid results: LDL 4.08, ApoB 117 mg/dL, HDL 1.19. Note that treating the thyroid may improve LDL clearance. If lifestyle changes and thyroid treatment do not improve the lipids over six months, the GP can reassess and consider further intervention. Blood pressure was not recorded at the clinic appointment, so ask the GP to check it at the same visit.\nMention the elevated aldolase (12.87, limit 7.6) with normal CK, the creatinine of 118 with a normal cystatin C, the raised oestradiol (198) and the trace of blood on the urine dipstick, so the GP can repeat these as they see fit.\nRetest in four to six months: TSH, free T4, free T3, full blood count, zinc, copper, lipid panel including ApoB, and a repeat urea breath test if H. pylori eradication is completed. The markers that will show the plan is working are a falling TSH, rising free T3, zinc and copper returning to range, LDL and ApoB dropping, HDL rising, and red blood cell count normalising. Calorie target about 1,900 kcal per day, protein target 112 grams per day, weight target 75 kg with a first milestone of 82 kg.","supplementation":"Zinc bisglycinate, 25 mg daily, taken with a meal containing protein (lunch or dinner, not at the same time as any future thyroid medication). Why: zinc is 7.0 against a lower limit of 11.1, and zinc is a cofactor for T4-to-T3 thyroid conversion. Bisglycinate is the best-absorbed form and least likely to cause nausea. Take for at least three months and retest.\nCopper bisglycinate, 2 mg daily, taken at a different meal from the zinc (they compete for absorption). Why: copper is 6.2 against a lower limit of 11. Do not exceed 2 mg daily without GP guidance, and take it away from the zinc supplement.\nMagnesium glycinate, 300 to 400 mg taken 30 to 60 minutes before bed. Why: magnesium is 0.82, below the 0.85 optimal band, and magnesium glycinate supports both sleep quality and muscle relaxation, directly relevant to the sleep fragmentation and joint stiffness.\nVitamin D3 (cholecalciferol), continue your current dose with a meal containing fat. Why: vitamin D is 148, within the laboratory range and above the ideal band of 75 to 120, so there is no need to increase it.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones and teeth rather than arteries, and is commonly taken alongside vitamin D.\nOmega-3 fish oil, 2 to 3 grams of combined EPA and DHA daily with food. Continue current supplementation and ensure the dose is at least 2 grams of EPA plus DHA (not 2 grams of fish oil, which may contain less). Why: omega-3 supports HDL (currently 1.19, target above 1.55), reduces inflammation and supports joint health.\nDO NOT take iron supplements. Ferritin is 237 and transferrin saturation is 27.9 percent. Iron stores are adequate and additional iron could push them toward overload.\nDO NOT take vitamin B12 supplements. B12 is already 1,004 and active B12 is 212, both above range. Additional B12 is unnecessary.\nThe most important changes from this report are not supplements. They are the GP appointment for the thyroid and H. pylori results, adding regular exercise, improving the diet quality, and fixing the sleep routine.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 52 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 51.6. Weakest systems: digestive 7%, autoimmune & celiac 7%, immunology 18%. Biggest drags: LDL Cholesterol, Creatinine, Oestradiol, Non-HDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"48.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4237","lower_normal":"","upper_normal":"57","lower_optimal":"","upper_optimal":"52","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4561","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count). His PhenoAge of 48.3 against a calendar age of 52 means his blood is ageing nearly four years younger than his birthday suggests. The clean CRP, healthy glucose, good albumin and normal blood cell parameters are the main drivers of this favourable result. Improving the thyroid function, mineral deficiencies and lipid profile should maintain or improve this score further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, not a ten-year event probability. His score of 35 is below the 40 acceptable threshold but above the 20 ideal level. The drivers are the elevated LDL and ApoB and the low HDL. The protective factors (excellent triglycerides, ideal Lp(a), low CRP, healthy HbA1c) are keeping the score below the flag threshold. Addressing the lipids through diet, exercise and thyroid treatment should bring this toward the ideal range.","low_causes":"Healthy lipids, low inflammation, good metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"133.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3533","lower_normal":"130","upper_normal":"180","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"g/l","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. His level of 133 is within the laboratory range of 130 to 180 but sits at the lower end, below the optimal band of 140 to 170. Together with the mildly low red blood cell count and haematocrit, this can be seen with an underactive thyroid, which slows red cell production; his low copper is another possible contributor. His haemoglobin itself is within range, and his iron, B12 and folate stores are all adequate.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, hypothyroidism, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"39.800","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3286","lower_normal":"40","upper_normal":"54","lower_optimal":"42","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"%","description":"Haematocrit measures the percentage of blood volume that is made up of red blood cells. His level of 39.8% is just below the lower limit of 40%. This mirrors the mildly low red blood cell count and is consistent with reduced red cell production from subclinical hypothyroidism. His iron stores, B12 and folate are all adequate; his low copper is another possible contributor.","low_causes":"Anaemia, hypothyroidism, overhydration, bone marrow suppression, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"31.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6067","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. His level of 31.1 pg is within the optimal range, meaning each red cell is carrying the right amount of oxygen-carrying protein. This makes iron, B12 or folate deficiency unlikely as the cause of the mild reduction in red cell numbers.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","resu per_optimal_position":"0.5500","units":"10^12/l","description":"The red blood cell count measures how many red cells are in a litre of blood. His count of 4.28 is below the lower limit of 4.5. The cells that are being produced are the right size (MCV 93) and carry the right amount of haemoglobin (MCH 31.1), so the marrow is making good cells, just slightly fewer of them. In the context of subclinical hypothyroidism, thyroid hormone stimulates red cell production in the bone marrow, and when thyroid output is reduced, the marrow makes fewer cells. His iron, B12 and folate stores are all adequate; his low copper is another possible contributor, because copper is needed to make red cells.","low_causes":"Hypothyroidism, iron or B12 deficiency, chronic disease, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophilcount","name":"Basophil Count","group":"HEMATOLOGY","result":"0.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5926","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"10^9/l","description":"Basophils are white blood cells involved in allergic and inflammatory responses. His count of 0.08 is within range, confirming no allergic or inflammatory activation.","low_causes":"Stress, acute infection, steroid use","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophilcount","name":"Eosinophil Count","group":"HEMATOLOGY","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"0.04","upper_normal":"0.4","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"10^9/l","description":"Eosinophils are white blood cells involved in parasitic infections and allergic responses. His count of 0.26 is within range, showing no sign of allergic disease or parasitic infection.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, parasitic infection, asthma, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytecount","name":"Lymphocyte Count","group":"HEMATOLOGY","result":"1.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4307","lower_normal":"1","upper_normal":"3.5","lower_optimal":"1.2","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.6000","units":"10^9/l","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including fighting viruses and producing antibodies. His count of 1.73 is within the optimal range, showing a healthy immune system.","low_causes":"Viral infection, immunodeficiency, steroid use, stress","high_causes":"Viral infection, chronic inflammation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"10^9/l","description":"Monocytes are white blood cells that engulf and destroy pathogens and damaged cells. His count of 0.56 is within range, indicating healthy immune surveillance.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Chronic infection, inflammatory disease, haematological malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophil Count","group":"HEMATOLOGY","result":"2.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3503","lower_normal":"2","upper_normal":"7.5","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"10^9/l","description":"Neutrophils are the most abundant white blood cells and are the first responders to bacterial infection. His count of 2.28 is within the laboratory range but toward the lower end, below the optimal band of 2.5 to 6.0. A count at the lower end of the normal range is a common normal variant and does not indicate infection risk or immune deficiency.","low_causes":"Benign ethnic neutropenia, viral infection, medications, autoimmune disease","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"whitebloodcellcount","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3839","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"10^9/l","description":"The white blood cell count is the total number of immune cells circulating in the blood. His count of 4.91 is within the laboratory range but in the lower portion. This follows from the neutrophil count, which is the largest contributor to the total and is within range.","low_causes":"Benign ethnic neutropenia, viral infection, medications, bone marrow suppression","high_causes":"Infection, inflammation, stress, steroid use, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plateletcount","name":"Platelet Count","group":"HEMATOLOGY","result":"157","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3411","lower_normal":"150","upper_normal":"450","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5556","units":"10^9/l","description":"Platelets are the small cells that help blood clot. His count of 157 is within the laboratory range but at the lower end, just below the optimal band of 170. A count at the lower end of the range is common and is not a concern on its own.","low_causes":"Ethnic variation, viral infection, liver disease, medications, autoimmune","high_causes":"Infection, inflammation, iron deficiency, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"SPECIALIZED TESTS","result":"13.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"11","upper_normal":"16","lower_optimal":"11.5","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"%","description":"RDW measures the variation in the size of red blood cells. A low RDW means the cells are uniform in size, which is healthy. His value of 13.9% is within the optimal range, confirming that the red cells being produced are consistent in size.","low_causes":"Normal finding","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemias, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Iron","group":"IRON STUDIES","result":"16.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4518","lower_normal":"5.8","upper_normal":"34.5","lower_optimal":"10","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5912","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the sample. His level of 16.0 is within the optimal range, showing adequate iron availability for red blood cell production and energy metabolism.","low_causes":"Iron deficiency, chronic disease, poor absorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"237.48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5922","lower_normal":"19.999","upper_normal":"300","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5476","units":"ug/l","description":"Ferritin is the main storage form of iron in the body. His level of 237 is within the laboratory range of 20 to 300 but above the optimal band of 50 to 200 for men. Ferritin is also an acute phase protein, meaning it can rise with inflammation, but his CRP is low at 0.48, so this is more likely a genuine reflection of adequate to high iron stores. There is no indication for iron supplementation, and iron supplements should be avoided.","low_causes":"Iron deficiency, blood loss, poor absorption, coeliac disease","high_causes":"Iron overload, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"57.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4497","lower_normal":"44.8","upper_normal":"80.6","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3818","upper_optimal_position":"0.5866","units":"umol/l","description":"TIBC measures the total capacity of the blood to transport iron, reflecting how much transferrin is available. His level of 57.3 is within the optimal range, confirming a balanced iron transport system.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4278","lower_normal":"2","upper_normal":"3.8","lower_optimal":"2.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/l","description":"Transferrin is the protein that carries iron through the blood to the bone marrow and other tissues. His level of 2.51 is within the optimal range, confirming healthy iron transport.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"27.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4211","lower_normal":"20","upper_normal":"50","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying protein transferrin is actually loaded with iron. His level of 27.9% is within the optimal band of 25 to 40%, confirming a balanced supply-and-demand for iron.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholestero const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
