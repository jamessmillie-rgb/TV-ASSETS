<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Georgi Sykes","dob":"17/08/1973","report_date":"2026-09-22","summary":"Georgi is a 53-year-old female presenting with a BMI of 21.2, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. She trains four times per week, split evenly between two cardio and two resistance sessions at moderate intensity, with 5,000 to 7,500 daily steps. She has a hormonal coil (IUS) in place, her periods have stopped consistent with perimenopause or menopause, and she supplements with vitamin D, protein powder and creatine. She does not take any prescription medication. She drinks one to four alcoholic drinks per week. She reports low sex drive as her only symptom. Her goals are to build muscle, improve long-term health and longevity, and prevent disease. She has a family history of bowel, breast, prostate or ovarian cancer, and reports a previous blood test where everything was normal.\n\nThe finding that stands out most in this report is her Lipoprotein(a), measured at 118 nmol/L against a target of below 32. Lipoprotein(a), often shortened to Lp(a), is a type of lipoprotein particle that carries cholesterol into artery walls, encourages blood clot formation, and drives local inflammation. Unlike LDL cholesterol, which responds to diet, exercise and medication, Lp(a) is almost entirely genetically determined. The level someone has at 20 is broadly the level they will have at 70, regardless of lifestyle. At 118, Georgi sits in what is classified as the moderate risk band (90 to 200), and this is information she should record permanently in her medical notes and share with any clinician assessing her cardiovascular risk in the future. It also means her first-degree relatives, including siblings and children, should be tested, because roughly half will have inherited the same trait. Importantly, nothing she has done has caused this and nothing she can change will lower it. What she can do, and what this report strongly supports, is keep every modifiable cardiovascular risk factor as low as possible, because Lp(a) adds a fixed amount of risk that sits on top of everything else.\n\nThe genuinely encouraging news is that her modifiable cardiovascular markers are already in excellent shape. Her ApoB, a protein that sits on every atherogenic lipoprotein particle and is the single best measure of how much cholesterol is being deposited into artery walls, is 0.68, comfortably below the 0.9 threshold and even below the tighter 0.8 optimal target. Her LDL cholesterol is 2.39, within the laboratory range, and when the cholesterol carried by Lp(a) is stripped out, her Lp(a)-corrected LDL falls to 2.01, which is right at the optimal ceiling. Her HDL cholesterol, the lipoprotein that removes cholesterol from artery walls and returns it to the liver, is 2.3, which is outstanding. Her triglycerides at 0.73 are excellent, well below the 1.0 optimal ceiling. Her ApoB to ApoA-I ratio, which summarises the balance between particles depositing cholesterol and particles removing it, is 0.36, deep in the low-risk zone. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that weighs ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c with no age adjustment, comes in at 30 out of 100. That score is above the ideal ceiling of 20 but below the flagged threshold of 40, and the Lp(a) is the input driving it upward. Without the Lp(a) contribution, her modifiable lipid profile would place her well inside the ideal band.\n\nHer liver is working well overall. ALT at 27 is within the laboratory range but sits just above the tighter optimal ceiling of 25 for women, which at this margin is not a concern on its own. AST at 31 is healthy, bilirubin at 15 is normal, alkaline phosphatase at 69 is mid-range, and albumin at 44 is strong. Her FIB-4 score, which combines age, platelets, AST and ALT to screen for liver scarring, is 1.18, comfortably below the threshold. Her APRI score, another fibrosis screening tool, is 0.29, well within the safe range. Her Gamma GT (GGT) is 42, above the female upper limit of 38. GGT is an enzyme produced by the liver and bile ducts, and it rises in response to alcohol, certain medications, fatty liver, bile duct problems, or metabolic stress. At 42 with only one to four drinks per week, a healthy BMI, clean bilirubin, and all other liver markers in good shape, this is a marginal elevation. The hormonal coil releases a small amount of levonorgestrel, a synthetic progestogen, and hormonal shifts around menopause can also nudge GGT slightly. This does not need investigation but is worth noting for the retest comparison.\n\nHer kidney function is solid. Cystatin C, a protein filtered by the kidneys that gives a more accurate picture of filtration than creatinine alone, is 0.93, giving a Cystatin C eGFR of 84. The combined creatinine and Cystatin C eGFR is also 84, which is above the 60 threshold for concern but below the 90 optimal floor. At 53, some decline in filtration rate from the peak is entirely expected, and 84 sits within the normal trajectory for her age. Her urea at 7.7 is toward the top of its range, and the urea to creatinine ratio at 101 is marginally above the upper limit of 100, which can simply reflect hydration status at the time of the blood draw or a slightly higher protein intake. Sodium, chloride and bicarbonate are all within range, and uric acid at 210 is healthy.\n\nHer blood sugar control is excellent. Fasting glucose at 4.5 is right in the optimal window, and HbA1c at 39 mmol/mol (5.7%) is within the normal band and below the 42 pre-diabetes threshold. Her insulin, however, is 1.4, below the laboratory lower limit of 2.6, and her C-Peptide is 0.285 ug/L (approximately 94 pmol/L), also below the lower limit of 1.1 ug/L. C-Peptide is a fragment released by the pancreas in a one-to-one ratio with insulin, so it confirms that insulin production is genuinely low rather than being an artefact. Her HOMA-IR, a calculation that estimates insulin resistance from fasting glucose and insulin, is 0.28, which is below the laboratory's lower boundary of 0.5 but firmly in the insulin-sensitive zone. The lab itself notes that below 1.0 is optimal. In a lean, active woman with a BMI of 21.2, a healthy fasting glucose, a normal HbA1c, and no signs of blood sugar dysregulation, this pattern reflects a pancreas that simply does not need to produce much insulin because the body is highly sensitive to it. Her cells respond efficiently to small amounts of insulin, so the pancreas obliges by making less. This is a metabolically favourable picture and is not a sign of pancreatic failure. Were glucose creeping up alongside low insulin, the interpretation would be different, but glucose at 4.5 and HbA1c at 39 rule that out.\n\nHer thyroid needs a brief discussion. TSH, the hormone the pituitary gland sends to the thyroid to tell it how hard to work, is 0.51, just below the laboratory lower limit of 0.55. Free T4, the main hormone the thyroid produces, is 17.8, comfortably within the optimal range of 14 to 20. Free T3, the active form that cells actually use, is 4.7, within the laboratory range though just below the tighter optimal floor of 4.5 when the FT3 to FT4 ratio is considered (the ratio is 0.264, marginally below the optimal floor of 0.27 but within the laboratory range of 0.2 to 0.45). Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. A TSH marginally below range with normal thyroid hormones and negative antibodies is most often a physiological variant, particularly around menopause when hormonal shifts can transiently suppress TSH. The hormonal coil's levonorgestrel may also play a small role. This does not suggest hyperthyroidism, there is no clinical picture to support that, but it is worth re-checking at her next test to confirm it remains stable.\n\nHer full blood count is reassuring overall. Haemoglobin at 129 is within the female range, red blood cells, haematocrit, MCV and MCH are all normal, and her white cell count at 7.78 with a healthy differential is exactly where it should be. Her immune system looks well balanced, with IgG, IgM, IgA and IgE all within range, and tissue transglutaminase IgA is negative, ruling out coeliac disease. Her ESR, a broad inflammation marker, is 1, essentially as low as it gets. Her reticulocyte percentage at 0.82 is within range, but the absolute reticulocyte count at 33.7 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. At 53 with a normal haemoglobin and adequate iron stores, this likely reflects a bone marrow that is producing red cells at a steady but unhurried pace because there is no demand for more. It is not a concern in isolation but is worth monitoring at retest.\n\nHer iron studies tell a mixed story. Ferritin at 66 is within the optimal range for women (40 to 150), serum iron at 25.9 is healthy, iron binding capacity is normal, and transferrin saturation at 44.5% is within range though toward the upper end. Transferrin, the protein that transports iron in the blood, is 2.32, just below the lower limit of 2.5. Low transferrin can occur when iron stores are adequate and the body downregulates production because less transport capacity is needed, or it can be a mild negative acute phase response. Her CRP at 1.5 is low enough that a significant acute phase response is unlikely, and her ferritin is not elevated in a way that suggests iron overload. The most likely explanation is that with adequate iron stores and good saturation, the liver has simply dialled back transferrin production. This does not need investigation but adds context to the slightly low reticulocyte count: with iron delivery well covered, the marrow is producing at a comfortable pace.\n\nHer hormonal picture is consistent with postmenopause. FSH at 61.8, well above the 23 threshold for postmenopausal status, confirms that the ovaries have ceased regular cycling. LH at 30.1 is in the postmenopausal range. Oestradiol is reported as below 43 pmol/L, which is within the postmenopausal reference of 0 to 118 and confirms very low circulating oestrogen. Progesterone at 0.86 is consistent with postmenopausal levels and with the presence of the hormonal coil, which delivers progestogen locally rather than systemically. Her total testosterone at 1.0 is within the female range of 0.5 to 2.6, and her free testosterone at 0.015 is within range, though both sit toward the lower end. SHBG at 44 is healthy and is not excessively binding testosterone. Her bioavailable testosterone, calculated at 0.36, is within the optimal band. DHEA-S at 3.4 umol/L (approximately 1,253 ug/dL) is within range and represents reasonable adrenal reserve for her age. Cortisol at 192 is within the morning reference range. Prolactin at 107 is normal.\n\nGeorgi reports low libido as her only symptom, and the blood results provide a partial explanation but not the whole picture. Postmenopausal oestrogen levels are associated with reduced libido in many women, and while her testosterone is within range, it is in the lower third. The combination of very low oestrogen and lower-end testosterone may contribute to reduced sexual desire, though libido is also influenced by factors blood cannot measure: sleep quality, relationship dynamics, stress, mood, and general energy. Her sleep of six to seven hours with refreshing quality is reasonable, she reports steady energy, and her stress levels are low. Given her goals around long-term health and the confirmed postmenopausal status, it would be worth discussing with her GP whether any form of hormone support might be appropriate, particularly given that low oestrogen also affects bone density, cardiovascular protection, and muscle recovery, all of which intersect with her goals of building muscle and preventing disease.\n\nHer vitamin D at 77 is within the sufficient range and inside the optimal band of 75 to 120, which reflects her supplementation. Her B12 at 273 is within the laboratory range but below the optimal floor of 500. At this level, stores are not depleted but are lower than ideal, particularly for someone whose goals include longevity and cognitive health. B12 is essential for nerve function, red blood cell production, and DNA synthesis, and levels below 300 are associated with subtle deficits in energy and cognition even when they do not cause frank deficiency. Her folate at 15 is healthy. Magnesium at 1.03 is within the optimal range, and corrected calcium at 2.39 is normal. Her parathyroid hormone (PTH) at 0.774 is below the lower limit of 0.98. PTH is produced by the parathyroid glands and regulates calcium levels in the blood, telling the body to release calcium from bone and absorb more from food when levels drop. A suppressed PTH alongside a normal calcium suggests that calcium is adequate and the parathyroid glands have no reason to push it higher. Vitamin D supplementation can suppress PTH by improving calcium absorption from the gut, and this is the most likely explanation here. It is not a concern but is noted for completeness.\n\nHer tumour markers are all reassuring, and this is particularly relevant given her family history of bowel, breast, prostate or ovarian cancer. CA125 at 6.1, CA15-3 at 12.4, CA19-9 below 1.2, and CEA at 1.62 are all comfortably within their respective ranges. These markers are screening tools rather than diagnostic tests, but clean results across all four provide genuine reassurance.\n\nHer PhenoAge, a biological ageing estimate derived from blood markers, will be computed by the pipeline and is worth reviewing when the final report is assembled.\n\nHer hs-CRP at 1.5 is within the laboratory range of below 5 but above the tighter optimal ceiling of 1.0. CRP is a protein produced by the liver in response to inflammation anywhere in the body. At 1.5 in a lean, active woman with no signs of infection or autoimmune disease, this is a mild elevation that could reflect anything from a recent minor illness or intense training session to low-grade systemic inflammation. It is not alarming but is worth tracking at retest to see whether it trends downward.\n\nHer MCHC at 349 is marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin inside each red blood cell, and at this margin, laboratory variation and sample temperature during transport are the usual explanation. Her MPV at 11 is above the upper limit of 10.1. MPV measures the average size of platelets, and a mildly elevated MPV with a normal platelet count simply means her bone marrow is producing slightly larger, younger platelets, which is a normal variant and not a clinical concern. Her basophils at 0.01 are marginally below the lower limit of 0.02, which is clinically insignificant as basophils make up the smallest fraction of white blood cells and vary widely from sample to sample. None of these three findings requires any action.\n\nHer total antioxidant activity at 1.69 is within range, and her creatine kinase at 158 is healthy for someone doing regular resistance training. Her urinalysis is clean, with no protein, glucose, ketones, nitrites, significant bacteria, or red blood cells. White cells at 10 sit at the threshold of significance, and the urine culture shows insignificant growth, so there is no evidence of urinary tract infection.\n\nIn summary, Georgi's blood paints the picture of a metabolically healthy, lean, active 53-year-old woman whose body is managing the postmenopausal transition well. The single most important finding is the elevated Lp(a), which is inherited and permanent but sits alongside an otherwise excellent modifiable lipid profile. Her low libido has a plausible partial explanation in her postmenopausal hormone levels, and this is something her GP can help with. Her B12 would benefit from supplementation to move it into the optimal range, and her GGT and hs-CRP are minor elevations worth tracking. Everything else, from her blood sugar control to her liver, kidneys, thyroid, immune system, iron stores, and tumour markers, is working well.","links":"The central thread in this report is the interplay between an inherited cardiovascular risk factor and an otherwise exemplary set of modifiable markers. Georgi's Lp(a) at 118 nmol/L adds a fixed, genetically determined layer of atherogenic risk that no lifestyle change or conventional statin therapy can reduce. However, her ApoB at 0.68, HDL at 2.3, triglycerides at 0.73, and Lp(a)-corrected LDL at 2.01 collectively show that the cholesterol trafficking she can influence is already close to optimal. Her Cardiovascular Risk Score of 30 out of 100 is being pushed above the ideal ceiling of 20 almost entirely by the Lp(a). This means the strategy is straightforward: keep every modifiable input as low as possible so the fixed Lp(a) burden sits on the smallest possible base of additional risk. Her clean blood sugar, low BMI, active lifestyle, and low alcohol intake are already doing this.\n\nThe second thread connects her hormonal status to her reported symptom. FSH at 61.8 confirms she is postmenopausal. Oestradiol below 43 and testosterone at 1.0 (lower third of range) together create a hormonal environment where reduced libido is a recognised and common consequence. The hormonal coil delivers progestogen locally to the uterus and does not provide systemic oestrogen replacement, so the systemic effects of low oestrogen on libido, bone density, cardiovascular protection, and muscle protein synthesis are not being addressed. Given her goals of building muscle and preventing disease, these downstream effects of oestrogen deficiency are relevant beyond the libido concern alone.\n\nThe third thread is a minor metabolic one. Her insulin and C-Peptide are both below their laboratory lower limits, but her glucose and HbA1c are textbook normal. Rather than signalling a problem, this confirms exceptional insulin sensitivity in a lean, active individual. The pancreas is doing less work because it needs to do less work. Her suppressed PTH follows the same logic: vitamin D supplementation has optimised calcium absorption, so the parathyroid glands have no stimulus to produce more PTH.\n\nWhat has been positively excluded is worth noting, especially given her family history of cancer. All four tumour markers are clean. Coeliac disease is ruled out. There is no sign of autoimmune thyroid disease. There is no evidence of liver scarring, kidney impairment, anaemia, iron deficiency, or immune dysfunction. These negatives are as valuable as the positives.","lifestyle":"Add a palm-sized portion of protein to every meal and snack, aiming for at least 85 to 95 grams of protein per day. Anchor: before putting anything else on the plate, the protein goes on first. Why: at 58.5 kg with a goal of building muscle, protein is the single most important dietary lever, and a volume score of 5 out of 10 suggests meals may not consistently hit this target.\nIncrease total daily calories to approximately 1,800 to 2,000 per day to support muscle gain and recovery. Anchor: use the protein powder you already take to bridge the gap between meals if appetite is average. Why: building muscle in a postmenopausal hormonal environment requires a small caloric surplus or at least maintenance, and undereating will work against your training.\nEat two portions of oily fish per week (salmon, mackerel, sardines, anchovies) or supplement with omega-3. Anchor: designate two evening meals per week as fish nights. Why: omega-3 supports HDL function, lowers triglycerides further, reduces the hs-CRP of 1.5, and provides anti-inflammatory support that is especially relevant with an elevated Lp(a).\nAdd 10 grams of soluble fibre daily from oats, flaxseed, beans or psyllium husk. Anchor: stir a tablespoon of ground flaxseed into your breakfast or protein shake. Why: soluble fibre binds cholesterol in the gut and lowers LDL, which is the modifiable part of your cardiovascular risk.\nIncrease daily steps to 7,500 to 10,000 by adding a 15-minute walk after your largest meal. Anchor: plate in the sink, shoes on. Why: post-meal walking lowers glucose and improves insulin sensitivity, and the additional movement supports bone density, which matters with low circulating oestrogen.\nContinue your four weekly training sessions and prioritise progressive overload in your resistance work. Anchor: track weights and reps in a simple log. Why: resistance training is the strongest stimulus for muscle protein synthesis and bone density preservation in postmenopause, and progressive overload ensures adaptation continues.\nMaintain your six to seven hours of sleep and protect it as a recovery tool. Anchor: set a fixed wake time seven days a week and cut caffeine after 1 pm. Why: sleep is when growth hormone peaks and muscle repair occurs, and consistency matters more than total hours.\nLimit alcohol to no more than four drinks per week and aim for two to three alcohol-free days in a row. Anchor: choose your drinking days at the start of the week. Why: even moderate alcohol can raise GGT and hs-CRP, and your GGT at 42 is already marginally above range.","flags":"Lipoprotein(a) 118 nmol/L, moderate risk band (target below 32). This is genetically determined and permanent. It adds a fixed layer of cardiovascular risk independent of lifestyle. First-degree relatives should be tested. Should be recorded permanently in her medical notes and factored into any future cardiovascular risk assessment.\nTSH 0.51, marginally below the lower limit of 0.55, with FT4 17.8 and FT3 4.7 both within range and both thyroid antibodies negative. Most likely a physiological variant or menopausal hormonal influence. Recommend repeat at next test to confirm stability. Does not suggest hyperthyroidism at present.\nGamma GT 42, above the female upper limit of 38, with all other liver markers clean and FIB-4 1.18. Marginal elevation likely related to hormonal changes or minor metabolic stress. Monitor at retest.\nInsulin 1.4 (below 2.6) and C-Peptide 0.285 ug/L (below 1.1), with fasting glucose 4.5 and HbA1c 39. Pattern consistent with high insulin sensitivity in a lean individual rather than pancreatic insufficiency. HOMA-IR 0.28 confirms insulin sensitivity.\nTransferrin 2.32, marginally below the lower limit of 2.5, with ferritin 66, iron 25.9, and transferrin saturation 44.5%. Likely physiological downregulation with adequate iron stores. No action needed.\nReticulocyte absolute count 33.7, below the lower limit of 50, with normal haemoglobin and adequate iron. Likely reflects low-demand marrow production. Monitor at retest.\nPTH 0.774, below the lower limit of 0.98, with corrected calcium 2.39 normal. Most likely suppressed by adequate vitamin D supplementation and good calcium absorption. Not a concern.\nhs-CRP 1.5, within the laboratory range of below 5 but above the optimal target of below 1.0. Mild elevation worth tracking at retest.\nVitamin B12 273, within the laboratory range but below the optimal floor of 500. Supplementation recommended.\nFSH 61.8 and oestradiol below 43 confirm postmenopausal status. Testosterone 1.0 in lower third of range. Relevant to reported low libido and to bone and muscle goals. GP discussion recommended regarding hormone support options.\nMCHC 349 marginally above 345, MPV 11 above 10.1, basophils 0.01 below 0.02. All clinically insignificant at these margins.\nReassuring negatives: all four tumour markers clean (CA125 6.1, CA15-3 12.4, CA19-9 below 1.2, CEA 1.62), coeliac screen negative, thyroid antibodies negative, liver fibrosis scores normal, kidney function adequate for age, no anaemia, immunoglobulins balanced, urinalysis clean, ESR 1.","recommendations":"Record the Lp(a) result of 118 nmol/L permanently in her medical notes and ensure it is included in any future cardiovascular risk assessment. Discuss whether first-degree relatives should be tested. Ask the GP whether any specific intervention is warranted given the moderate-risk Lp(a) alongside otherwise excellent modifiable lipid markers.\nDiscuss the confirmed postmenopausal status (FSH 61.8, oestradiol below 43) and low libido with her GP. Explore whether systemic hormone replacement therapy might be appropriate, given that the hormonal coil provides only local progestogen. The conversation should cover not only libido but also bone density preservation, cardiovascular protection, and muscle recovery, all of which align with her stated goals.\nRepeat TSH at the next blood test (3 to 6 months) to confirm the marginally low value of 0.51 is stable. No action needed now, but a sustained downward trend would warrant further thyroid investigation.\nBegin sublingual methylcobalamin 1,000 mcg daily to bring B12 from 273 into the optimal range above 500. Recheck B12 at the next test.\nAim for a daily calorie intake of approximately 1,800 to 2,000 kcal with a protein target of 85 to 95 grams per day (1.4 to 1.6 g per kg of body weight) to support muscle building and postmenopausal bone health. Retest in 6 months, repeating the full panel, with particular attention to Lp(a) (to confirm baseline), TSH, GGT, hs-CRP, B12, reticulocyte count, and hormonal markers.","supplementation":"Vitamin D3 (cholecalciferol): continue current supplementation at 2,000 IU daily, taken with a fat-containing meal. Her level of 77 nmol/L is within the optimal range and this dose is maintaining it well. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 mcg daily, taken with vitamin D. Why: K2 directs calcium into bone rather than arteries, which is especially important with confirmed postmenopausal status and the cardiovascular context of elevated Lp(a).\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: her B12 at 273 is below the optimal floor of 500, and sublingual delivery bypasses any absorption variability in the gut.\nOmega-3 fish oil: 2 grams combined EPA and DHA daily, taken with food. Why: supports HDL function, helps lower hs-CRP from its current 1.5, and provides cardiovascular protection that is particularly valuable alongside an elevated Lp(a).\nMagnesium glycinate: 300 mg before bed. Why: her magnesium at 1.03 is within range but magnesium supports sleep quality, muscle recovery after resistance training, and bone mineralisation, all of which align with her goals.\nCreatine monohydrate: continue current supplementation at 3 to 5 grams daily. Why: creatine supports muscle strength and power output during resistance training, and emerging evidence suggests cognitive benefits. Her creatine kinase at 158 is healthy, confirming no muscle damage concern.\nDo not take iron supplements. Her ferritin at 66 is in the optimal range and her transferrin saturation at 44.5% is already toward the upper end. Additional iron could push saturation above the desirable ceiling.\nThe most important changes from this report are not supplements. They are increasing total calorie and protein intake to support muscle building, adding oily fish and soluble fibre for cardiovascular protection, and having the GP conversation about postmenopausal hormone support.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 56 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 55.9. Weakest systems: glucose & insulin 33%, lipids & cardiovascular 39%, hematology 39%. Biggest drags: C-Peptide, Lipoprotein(a), Gamma GT, Insulin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"43.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3759","lower_normal":"","upper_normal":"58","lower_optimal":"","upper_optimal":"53","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4569","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the risk being built in the arteries right now, not the ten-year chance of a cardiac event. Georgi's score of 30 is above the ideal ceiling of 20 but below the flagged threshold of 40. The elevated Lp(a) at 118 is the primary input driving the score above ideal. Her modifiable lipid markers (ApoB 0.68, HDL 2.3, triglycerides 0.73) are all excellent and are keeping the score from rising higher.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6093","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the bloodstream after fasting. Georgi's result of 4.5 mmol/L sits right in the middle of the optimal range of 4.0 to 5.4, which is exactly where it should be. This means her body is regulating blood sugar efficiently, keeping it neither too high nor too low overnight. Combined with her excellent HbA1c, this confirms healthy glucose metabolism.","low_causes":"Prolonged fasting, excessive exercise, reactive hypoglycaemia, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, corticosteroid use, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.475","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c expressed as a percentage. Georgi's 5.7% is below the 6.0% pre-diabetes threshold. This is the percentage format of the same measurement reported in mmol/mol below.","low_causes":"","high_causes":"Chronic hyperglycaemia, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, giving an average picture of blood sugar control over the past two to three months. Georgi's result of 39 mmol/mol is within the normal range (below 42) but above the tighter optimal ceiling of 36. At 39 she is well clear of the pre-diabetes threshold, but there is a small margin to improve. Her excellent fasting glucose and very low insulin suggest this is not driven by insulin resistance but rather reflects normal dietary glucose exposure over the preceding weeks.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Chronic hyperglycaemia, pre-diabetes, diabetes, iron deficiency (falsely elevated)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"1.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2803","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5489","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. Georgi's result of 1.4 mIU/L is below the laboratory lower limit of 2.6. In a lean, active woman with a fasting glucose of 4.5 and an HbA1c of 39, this reflects excellent insulin sensitivity rather than pancreatic failure. Her cells respond to very small amounts of insulin, so the pancreas does not need to produce more. This is confirme ng at a comfortable pace because there is no increased demand for red cells. It is worth monitoring at her next test to confirm stability.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease, low erythropoietin","high_causes":"Recovery from blood loss, haemolytic anaemia, high altitude adaptation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"21.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by red blood cell count and is used to differentiate between iron deficiency anaemia and thalassaemia trait when MCV is low. Georgi's index of 21.8 is reported for context. With her MCV at 89.7 (normal), the Mentzer Index is not applicable at present.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","withi erfiltration, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"210","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3595","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3238","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced naturally by the body. Georgi's 210 umol/L is within the normal range and within the female optimal range. Low uric acid in a lean, active woman is a positive finding.","low_causes":"Low purine diet, kidney over-excretion, medications","high_causes":"High purine diet, alcohol, obesity, kidney impairment, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4227","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and filtered by the kidneys. Unlike creatinine, its level is not affected by muscle mass, creatine supplementation, diet, or exercise, making it a cleaner measure of kidney filtration. Georgi's 0.93 is well within the normal range of below 1.1 and within the optimal range.","low_causes":"","high_causes":"Kidney impairment, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"84","within_norma ical functions. Georgi's 2.39 is within the optimal range, confirming good calcium balance. With her PTH suppressed, this normal calcium is reassuring and suggests the parathyroid glands are correctly sensing that calcium is adequate.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6207","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.5862","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions, including energy production, muscle function, and nerve signalling. Georgi's 1.03 is within the optimal range of 0.85 to 1.05, which is a positive finding given how commonly magnesium is depleted by exercise and stress.","low_causes":"Poor dietary intake, alcohol, diuretics, intense exercise, chronic stress","high_causes":"Kidney impairment, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-Corrected Sodium is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolalit ange.","low_causes":"Poor dietary intake (vegan or vegetarian diets), pernicious anaemia, malabsorption, ageing, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, kidney impairment, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6190","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6666666667","units":"ng/mL","description":"Folate (vitamin B9) is critical for cell division, DNA repair, and red blood cell production. Georgi's 15 is within the optimal range, reflecting a diet that includes adequate folate sources such as green vegetables, which is consistent with her four to five daily portions of vegetables.","low_causes":"Poor dietary intake, alcohol, medications (methotrexate), malabsorption, coeliac disease","high_causes":"Supplementation, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.15","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP measures low-grade systemic inflammation. CRP is produced by the liver in response to inflammatory signals from anywhere in the body. Georgi's 1.5 mg/L is within the laboratory range of below 5 but above the optimal target of below 1.0. In a lean, active woman with no signs of infection or autoimmune disease, this mild elevation could reflect a recent minor illness, intense training returned to the liver for disposal.","low_causes":"Low HDL, high LDL or VLDL","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-clogging) cholesterol fractions including LDL, VLDL and Lp(a). Georgi's 2.7 is within the optimal range of below 3.4 and comfortably below the 4.0 upper limit.","low_causes":"Low LDL, low VLDL, hyperthyroidism","high_causes":"Elevated LDL, high triglycerides, obesity, diabetes, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6714","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and is essential for reverse cholesterol transport. Georgi's 1.88 is well above the 1.4 target, consistent with her excellent HDL level. A high ApoA1 provides cardiovascular protection.","low_causes":"Genetic factors, smoking, obesity, sedentary lifestyle","high_causes":"Regular exercise, moderate alcohol, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein that sits on every atherogenic lipoprotein particle (LDL, VLDL, and Lp(a)). Each particle has exactly one ApoB molecule, making it the single most accurate measure of how many cholesterol-depositing particles are in the bloodstream. Georgi's 0.68 is comfortably below both the 0.9 desirable limit and the tighter 0.8 optimal target. This is a strong result that shows the modifiable component of her cardiovascular risk is well controlled.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High LDL, familial hypercholesterolaemia, obesity, diabetes, high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3000","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio summarises the balance between particles depositing cholesterol into artery walls (ApoB) and particles removing it (ApoA1). Georgi's 0.36 is deep in the low-risk zone (below 0.6), indicating the balance is strongly tilted toward cholesterol removal rather than deposition.","low_causes":"","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"118.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a type of LDL particle with an extra protein (apolipoprotein(a)) attached. It deposits cholesterol in artery walls, promotes blood clot formation, and drives inflammation at the vessel lining. Unlike LDL, Lp(a) is almost entirely genetically determined and does not respond to diet, exercise, or conventional statin therapy. Georgi's 118 nmol/L places her in the moderate risk band (90 to 200). This is the most significant finding in the report. It is inherited and permanent, should be recorded in her medical notes, and her first-degree relatives should be tested. The strategy is to keep every modifiable cardiovascular risk factor as low as possible, which she is already doing well.","low_causes":"","high_causes":"Genetic inheritance (primary cause), kidney disease (can elevate slightly)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"158","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5524","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6190","units":"U/L","description":"CK is an enzyme released from muscle cells when they are damaged or worked hard. Georgi's 158 is within the normal range and consistent with her regular resistance training. It confirms that her muscles are being challenged but not excessively damaged.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, rhabdomyolysis, muscle injury, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"17.8","within_normal":"TRUE","within_optimal": ","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use for metabolism, energy production and temperature regulation. Georgi's 4.7 is within the laboratory range and within the optimal band of 4.5 to 6.5, confirming adequate conversion of T4 to active T3.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, selenium or zinc deficiency, chronic illness, caloric restriction","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies attack an enzyme in the thyroid gland. When elevated, they indicate autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Georgi's result of below 6.6 is well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_o   if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
