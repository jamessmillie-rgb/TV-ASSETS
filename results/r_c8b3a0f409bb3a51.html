 insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein, is the protective cholesterol fraction that removes cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. Gary's HDL of 1.6 is in the desirable range above 1.55 and within the optimal range for men of above 1.4. This is the one genuinely positive finding in his lipid panel and suggests his body's cholesterol removal system is functioning well. However, the volume of harmful particles (LDL, VLDL, remnant cholesterol) is overwhelming this protective mechanism.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol intake, genetics, medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8567","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, low-density lipoprotein, is the cholesterol fraction most directly responsible for plaque formation in artery walls. Each LDL particle can cross the artery lining and deposit cholesterol, gradually building up the plaques that cause heart attacks and strokes. Gary's LDL of 5.14 is well above the upper limit of 3.0 and nearly double the optimal target of below 2.6. This, combined with his elevated ApoB, represents a significant and sustained exposure of his artery walls to atherogenic particles.","low_causes":"Low saturated fat diet, hyperthyroidism, malabsorption, liver disease, genetic factors","high_causes":"High saturated fat diet, genetic predisposition, hypothyroidism, obesity, diabetes, kidney disease, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio expresses cardiovascular risk as a single number. A ratio below 4.5 is desirable. Gary's ratio of 5.25 is above this threshold, reflecting the combined effect of his elevated total cholesterol and the fact that even his good HDL level cannot compensate for the volume of harmful cholesterol.","low_causes":"High HDL, low total cholesterol, healthy lipid profile","high_causes":"High total cholesterol, low HDL, metabolic syndrome, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"19.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6250","upper_optimal_position":"1","units":"%","description":"HDL percentage expresses how much of total cholesterol is the protective HDL fraction. A value above 20% is desirable. Gary's result of 19.05% is just below this threshold, not because his HDL is low (it is actually healthy at 1.6) but because his total cholesterol is so elevated that HDL represents a smaller proportion of the whole.","low_causes":"Very high total cholesterol, low HDL, metabolic syndrome","high_causes":"Healthy lipid profile, high HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol fractions including LDL, VLDL, and remnant particles. Many cardiologists now consider this a better predictor of cardiovascular risk than LDL alone. Gary's non-HDL of 6.8 is well above the target of below 4.0 and reflects the combined burden of his elevated LDL, VLDL, and remnant cholesterol.","low_causes":"Healthy lipid profile, low saturated fat diet","high_causes":"High LDL, high triglycerides, high VLDL, poor diet, obesity, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"1.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A-I is the main structural protein on HDL particles and drives the reverse cholesterol transport process. Gary's ApoA-I of 1.44 is above the desirable threshold of 1.20 and within the optimal range above 1.4. This confirms that his HDL particles are well-structured and functional, which is the positive counterbalance in his lipid profile.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein found on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this measurement gives a direct count of the total number of atherogenic particles in the blood, making it arguably the best single predictor of cardiovascular risk. Gary's ApoB of 1.41 is classified as very high (above 1.4) against a desirable target of below 0.9 and an optimal target of below 0.8. This means there is a very large number of cholesterol-carrying particles circulating in his blood, each capable of entering artery walls and contributing to plaque.","low_causes":"Low cholesterol diet, hyperthyroidism, malabsorption, liver disease","high_causes":"High saturated fat diet, genetic predisposition, hypothyroidism, obesity, insulin resistance, high triglycerides","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio compares the number of harmful cholesterol particles (ApoB) to the number of protective particles (ApoA-I). It is considered one of the best single summary measures of cardiovascular risk. Gary's ratio of 0.98 is in the higher risk category (above 0.9), with a target of below 0.7 for men. Despite having healthy ApoA-I, the sheer volume of ApoB particles overwhelms the balance.","low_causes":"Healthy lipid profile, high HDL, low LDL","high_causes":"High LDL, high triglycerides, low HDL, metabolic syndrome, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a specialised cholesterol particle that is entirely genetically determined. It cannot be meaningfully changed by diet, exercise, or most medications. It promotes plaque formation and blood clotting. Gary's Lp(a) is below 25, which is in the normal range below 32 nmol/L. This is a genuinely important and positive finding because it confirms that his elevated LDL and ApoB are driven entirely by modifiable factors, namely diet, body composition, and lifestyle, rather than by an inherited lipoprotein risk. This result only needs to be tested once in a lifetime as it does not change.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7600","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that serves as a proxy for insulin resistance and small dense LDL particles. A ratio above 1.5 suggests a predominance of small, dense LDL particles which are more atherogenic than large buoyant ones. Gary's ratio of 2.28 is above the threshold and suggests his LDL particles are likely to be predominantly of the small, dense type, increasing their ability to penetrate artery walls. This ratio is expected to improve significantly with triglyceride reduction through dietary changes and omega-3 supplementation.","low_causes":"Good insulin sensitivity, healthy triglycerides, high HDL","high_causes":"Insulin resistance, high triglycerides, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL and represents the cholesterol carried by triglyceride-rich lipoproteins (VLDL and intermediate-density particles). Gary's remnant cholesterol of 1.66 is more than double the upper limit of 0.8 and more than triple the optimal target of 0.5. Remnant cholesterol is increasingly recognised as a causal risk factor for cardiovascular disease, independent of LDL, because remnant particles can be directly taken up by artery wall cells without needing to cross the endothelial barrier. This high level is directly driven by his elevated triglycerides.","low_causes":"Healthy triglyceride levels, low VLDL","high_causes":"High triglycerides, excess calories, refined carbohydrates, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein measures systemic inflammation in the body. It is produced by the liver in response to inflammatory signals and is used as a cardiovascular risk marker. Gary's hs-CRP of 1.0 sits right at the boundary of the optimal range. While it is well within the laboratory limit of 5, a level between 1 and 3 is considered moderate cardiovascular risk by the American Heart Association classification. In the context of his elevated lipids, the combination of borderline inflammation and high atherogenic particle count compounds his cardiovascular risk.","low_causes":"Absence of significant inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, obesity, metabolic syndrome, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"Erythrocyte sedimentation rate measures how quickly red blood cells settle in a test tube over one hour. A faster rate indicates more inflammation in the body. Gary's ESR of 22 is nearly double the upper limit of 12. ESR is a non-specific marker, meaning it rises with many different types of inflammation including infection, autoimmune conditions, chronic illness, and metabolic inflammation. In Gary's case, his elevated triglycerides and BMI of 27 may be sufficient to explain this result, but the GP should be aware and may wish to investigate further if it persists on repeat testing.","low_causes":"Polycythaemia, sickle cell disease, very low fibrinogen","high_causes":"Infection, autoimmune disease, chronic inflammation, malignancy, elevated lipids, obesity, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"INFLAMMATION","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4775","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a calculated marker of systemic inflammation and immune balance. Neutrophils are the first responders to infection, while lymphocytes handle longer-term immune memory. A ratio between 1 and 3 is normal, with 1 to 2 being optimal. Gary's NLR of 1.63 is within the optimal range, which is a reassuring finding that suggests his immune system is in a balanced, non-stressed state despite the elevated ESR.","low_causes":"Viral infection, autoimmune conditions","high_causes":"Bacterial infection, physiological stress, chronic inflammation, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is the primary electrolyte that regulates fluid balance and blood pressure. Gary's result of 142 is within the optimal range. Given his history of slightly elevated blood pressure, a normal sodium level is reassuring and suggests he is not consuming excessive dietary salt relative to his kidney's ability to manage it.","low_causes":"Excessive fluid intake, diuretics, heart failure, kidney disease, adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1795","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. Gary's chloride of 93 is below the lower limit of 95. Low chloride, particularly combined with his low bicarbonate, can indicate a metabolic acidosis or a chloride-losing condition. Common explanations include recent vomiting (which Gary has not reported), diuretic use (which he denies), or a metabolic acid load from diet, exercise, or early kidney tubular dysfunction. This should be repeated on a fresh fasting sample to determine whether it is a persistent finding.","low_causes":"Vomiting, metabolic alkalosis, diuretics, excessive sweating, metabolic acidosis with compensatory chloride loss","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"16.8" 666666667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation shows what percentage of the iron transport capacity is being used. Gary's saturation of 48.2% is within the laboratory range of 18 to 55% but above the optimal ceiling of 40%. This is elevated alongside his high serum iron and likely reflects the same cause (recent dietary iron intake). Persistently elevated transferrin saturation above 55%, particularly with rising ferritin, would warrant investigation for haemochromatosis. At 48%, this is worth monitoring but not yet concerning.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Iron supplementation, haemochromatosis, liver disease, haemolysis, recent high-iron meal","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3678","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/mL","description":"Ferritin reflects the body's total iron stores. It is the most reliable single marker of long-term iron status. Gary's ferritin of 53 is within the optimal range for men of 50 to 200. This confirms his iron stores are adequate, and importantly, the normal ferritin alongside the elevated serum iron makes haemochromatosis less likely (haemochromatosis typically shows rising ferritin alongside rising saturation).","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"9.5","wit  to tissues. Gary's free testosterone of 0.202 is within the laboratory range but below the optimal threshold. This is consistent with his low total testosterone and confirms that the amount of testosterone available for use by his muscles, brain, and other tissues is suboptimal.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"Exogenous testosterone, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"27.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3712","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3838","upper_optimal_position":"0.5786","units":"nmol/L","description":"SHBG is a protein that binds testosterone and oestradiol, controlling how much of each hormone is available for use by tissues. Gary's SHBG of 27.2 is within the optimal range. This means that excessive binding is not the cause of his low free testosterone. The problem is that there is not enough total testosterone being produced in the first place.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"34.93","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3744","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a ratio of total testosterone to SHBG that provides another measure of androgen availability. Gary's FAI of 34.93 is within the laboratory range but below the optimal range of 40 to 100, consistent with the suboptimal testosterone picture throughout his hormonal profile.","low_causes":"Low testosterone, high SHBG, ageing, obesity","high_causes":"High testosterone, low SHBG, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"to follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"146.1","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. In men, it is produced by the conversion (aromatisation) of testosterone in fat tissue. This result is pending and will be reviewed when available. In the context of Gary's low testosterone and BMI of 27, the oestradiol result is important: if elevated, it would indicate excessive aromatisation, meaning fat tissue is converting his already-limited testosterone into oestrogen, further reducing available testosterone and contributing to symptoms.","low_causes":"Low testosterone (substrate), low body fat, aromatase inhibitors","high_causes":"Obesity (increased aromatisation), liver disease, medications, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3897","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mIU/mL","description":"Luteinising hormone is produced by the pituitary gland and signals the testes to produce testosterone. Gary's LH of 2.66 is within the laboratory range but below the optimal range. In the context of low testosterone, we would expect LH to be elevated if the brain were detecting insufficient testosterone and trying to push the testes harder. The fact that LH is not elevated suggests that the hypothalamic-pituitary axis itself is underperforming, consistent with functional hypogonadism driven by metabolic factors rather than a primary testicular problem.","low_causes":"Pituitary suppression from obesity, stress, opioids, anabolic steroids, hyperprolactinaemia","high_causes":"Primary testicular failure, Klinefelter syndrome, age-related decline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3683","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.5175","units":"mIU/mL","description":"Follicle stimulating hormone is produced by the pituitary gland and in men supports sperm production in the testes. Gary's FSH of 3.14 is within the laboratory range but in the lower portion. Like his LH, the pituitary is not driving reproductive function aggressively. In men of 56, FSH tends to rise gradually with age, so a low reading is somewhat unusual and further supports the functional hypogonadism pattern.","low_causes":"Pituitary suppression from obesity, stress, opioids, anabolic steroids","high_causes":"Primary testicular failure, age-related decline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3848","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6061","units":"uIU/mL","description":"Prolactin is a pituitary hormone that in men is relevant because elevated levels can suppress testosterone and libido. Gary's prolactin of 96 is within the optimal range. This is reassuring because it rules out hyperprolactinaemia as a cause of his low testosterone and low libido.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"220","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3785","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"170","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3852","upper_optimal_position":"0.5820","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. A morning cortisol within range confirms the adrenal glands are functioning normally. Gary's cortisol of 220 is within the optimal range, sitting in the lower portion. This does not suggest adrenal dysfunction or chronic stress driving his symptoms.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4803","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5716","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role as a precursor to other hormones. Gary's progesterone of 1.31 is within the normal range for men and is not clinically significant.","low_causes":"Normal variation in men, adrenal insufficiency","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2285.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4626","lower_normal":"162.1","upper_normal":"4940.9","lower_optimal":"700","upper_optimal":"3500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4459","upper_optimal_position":"0.5317","units":"ug/dL","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. Gary's DHEA-S of approximately 2,286 ug/dL (converted from 6.2 umol/L) is within the optimal range and suggests healthy adrenal function. This is a positive finding for a 56-year-old and indicates that the adrenal contribution to hormone production is adequate.","low_causes":"Ageing, adrenal insufficiency, chronic stress, medications","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3393","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4795","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how hard to work. A high TSH means the thyroid is underperforming and needs more stimulation. Gary's TSH of 0.6 is within the laboratory range but below the optimal range of 1.0 to 2.5. At this level with normal free T4 and T3, this is not concerning and does not indicate hyperthyroidism. Some individuals naturally run at the lower end of TSH. The negative thyroid antibodies provide further reassurance.","low_causes":"Hyperthyroidism, excessive thyroid medication, subclinical hyperthyroidism, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5268","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form (T3) in tissues. Gary's FT4 of 18.1 is within the optimal range of 14 to 20, confirming healthy thyroid output.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the biologically active thyroid hormone that drives metabolism, energy production, and temperature regulation at the cellular level. Gary's FT3 of 5.0 is within the optimal range of 4.5 to 6.5, confirming that his body is converting T4 to T3 effectively. His thyroid is not contributing to his fatigue symptoms.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, severe illness, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as seen in autoimmune thyroid disease (Hashimoto's thyroiditis). Gary's TPO antibodies are below 6.6, which is well within the normal range and confirms no autoimmune thyroid activity.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies, like TPO antibodies, are a marker of autoimmune thyroid disease. Gary's thyroglobulin antibodies are below 1.3, which is well within the normal range. More than 80% of the population have undetectable levels, and Gary falls into this majority. Combined with the negative TPO antibodies, autoimmune thyroid disease is effectively ruled out.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5497","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3871","upper_optimal_position":"0.6140","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve function, and blood clotting. Gary's calcium of 2.45 is within the optimal range, confirming healthy calcium metabolism.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the calcium result for albumin levels, giving a more accurate picture of true calcium status. Gary's corrected calcium of 2.38 is within the optimal range and confirms that his calcium regulation is working normally. His normal PTH of 1.4 supports this.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function, nerve signalling, and blood pressure regulation. Gary's magnesium of 1.0 is within the optimal range of 0.85 to 1.05. This is a genuinely positive finding, particularly given his blood pressure concerns, as adequate magnesium supports healthy blood pressure.","low_causes":"Poor dietary intake, alcohol, diuretics, diabetes, gastrointestinal losses","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2750","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for bone health, immune function, testosterone production, mood, and cardiovascular health. Gary's vitamin D of 66 is classified as sufficient (above 50) but below the optimal range of 75 to 120. Vitamin D is sequestered in fat tissue, so at a BMI of 27, a higher supplementation dose is needed compared to a lean individual. Given Gary's low testosterone, blood pressure concerns, and goal of improving energy, optimising vitamin D is particularly important because it supports testosterone production and cardiovascular health.","low_causes":"Insufficient sun exposure, poor dietary intake, obesity (fat sequestration), dark skin, malabsorption, kidney or liver disease","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3697","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.6033","units":"pmol/L","description":"Parathyroid hormone regulates calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. Gary's PTH of 1.4 is within the optimal range and, together with his normal corrected calcium, confirms healthy calcium-parathyroid regulation.","low_causes":"Hypoparathyroidism, high calcium, magnesium deficiency, vitamin D excess","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"279","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3695","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4559","upper_optimal_position":"0.5820","units":"pg/mL","description":"Vitamin B12 is essential for red blood cell formation, nerve function, DNA synthesis, and energy metabolism. Gary's B12 of 279 is within the laboratory range of 193 to 982 but well below the optimal threshold of 500. Suboptimal B12 may be contributing to his fatigue and is the most likely explanation for his elevated RDW (red cell size variation). B12 absorption naturally declines with age as stomach acid production decreases, making supplementation increasingly important for men over 50. Sublingual methylcobalamin is recommended as it bypasses the gut for more reliable absorption.","low_causes":"Poor dietary intake (especially vegan/vegetarian diets), reduced stomach acid (age, PPIs), pernicious anaemia, malabsorption, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) works alongside B12 to produce red blood cells and synthesise DNA. Gary's folate of 10 is within the optimal range above 8, confirming adequate intake from his diet. This is reassuring and means the elevated RDW is more likely related to suboptimal B12 than folate deficiency.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications (methotrexate, anticonvulsants), pregnancy","high_causes":"Supplementation, high dietary intake of leafy greens and fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"HEMATOLOGY","result":"127","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4369","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found in muscle tissue that is released into the blood when // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;

const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
