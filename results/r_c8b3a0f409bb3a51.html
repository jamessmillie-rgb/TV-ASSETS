<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Gary Jackson","dob":"14/05/1970","report_date":"2026-08-29","summary":"Gary is a 56-year-old male presenting with a BMI of 27.1, following a standard mixed diet rated 5 out of 10 for quality with a volume of 7 out of 10. He trains four times per week, three cardio sessions and one resistance session, with 5,000 to 7,500 daily steps. He takes no medication despite a previous diagnosis of high cholesterol and slightly elevated blood pressure, preferring to manage these naturally. He does not report any specific habits. He reports low energy and fatigue, low sex drive, and difficulty losing weight. His goals are to lose body fat, improve energy levels, and improve cardiovascular fitness. He has stated that he wants to reduce his cholesterol and blood pressure through lifestyle changes rather than medication.\n\nThe most important finding in this report is the lipid profile, and given Gary's decision to manage his cholesterol without medication, these results need honest appraisal. His total cholesterol is 8.4, well above the desirable threshold of 5.18. His LDL cholesterol, the fraction that deposits cholesterol into artery walls, is 5.14 against a target of below 3.0. His ApoB, which is a direct count of the number of cholesterol-carrying particles capable of entering artery walls, is 1.41, classified as very high against a target of below 0.9. His triglycerides are 3.64, more than double the fasting target of 1.7, and his VLDL cholesterol, calculated from the triglycerides, is 1.65 against a target of below 0.78. His non-HDL cholesterol, which captures everything harmful, is 6.8 against a target of below 4.0. His ApoB to ApoA-I ratio, which is considered one of the best single summary measures of cardiovascular risk, is 0.98 against a target of below 0.7, placing him in the higher risk category. His remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 1.66, well above the target of below 0.8, and this is significant because remnant cholesterol is increasingly recognised as a driver of cardiovascular inflammation independent of LDL. The one genuinely positive finding within the lipid panel is his Lp(a), lipoprotein(a), which is below 25 against a threshold of 32. Lp(a) is entirely inherited and cannot be changed by diet, exercise, or most medications. The fact that his is low is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors, namely diet, body composition, and activity. This is important context for his decision to manage things naturally, because it means lifestyle changes have the full capacity to bring these numbers down. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls, is 1.6, which is actually in the desirable range above 1.55 and is a genuine bright spot. His ApoA-I, the protein on HDL particles, is 1.44, which is healthy. These suggest his body's reverse cholesterol transport system is working, but it is being overwhelmed by the volume of atherogenic particles on the other side of the equation. Gary should discuss these results with his GP. We respect his preference for natural management, but he and his GP need to make that decision together with the full picture in front of them, and the full picture is that his ApoB at 1.41 represents a meaningfully elevated cardiovascular risk that should not be left unaddressed.\n\nTurning to what is working well, and there is plenty of good news here. His glucose regulation is in good shape. His fasting glucose is 5.4, his HbA1c, which reflects average blood sugar over the preceding two to three months, is 41 mmol/mol, just under the pre-diabetes threshold of 42, and his fasting insulin is 3.89, which is low and reflects good insulin sensitivity. His HOMA-IR, a calculated index of insulin resistance, is 0.93, which is in the optimal zone below 1.0. This means his cells are responding well to insulin and clearing glucose efficiently, which is a genuine positive at a BMI of 27 with elevated triglycerides. His C-peptide, a marker of how much insulin the pancreas is producing, is 1.11, right at the lower limit of range, and his HOMA-B, calculated at 40.9, is below the reference range of 80 to 200. In the context of normal glucose and excellent insulin sensitivity, the low HOMA-B and borderline C-peptide reflect low insulin demand rather than pancreatic insufficiency, but this is worth monitoring over time because his HbA1c at 41 is approaching the pre-diabetes boundary, and a pancreas that is producing relatively little insulin may struggle if demand increases with age or weight gain.\n\nHis liver is in excellent health. His GGT, gamma-glutamyl transferase, is 13, which is exceptionally clean and well within the optimal range of below 25. His ALT is 33, within the laboratory range of below 56, though marginally above the tighter optimal threshold of 30 for men. His AST is 30, comfortably within range. His FIB-4 score, a calculated index that screens for liver fibrosis using age, platelets, ALT, and AST, is 1.11, well within the safe threshold. His alkaline phosphatase, bilirubin, albumin, and total protein are all healthy. His amylase and lipase, markers of pancreatic function, are both within range, confirming the pancreas and liver are working well.\n\nHis thyroid function is healthy. TSH, thyroid stimulating hormone, which is the signal from the brain telling the thyroid how hard to work, is 0.6, at the lower end of the reference range but not suppressed. His free T4 is 18.1, comfortably within the optimal range of 14 to 20. His free T3, the active thyroid hormone, is 5.0, within the optimal range. Both thyroid antibody tests, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. This means his thyroid is not contributing to his fatigue or weight difficulties.\n\nHis kidney function is sound. His creatinine-based eGFR is above 90, and his Cystatin C, which is a more precise measure of kidney filtration that is not affected by muscle mass, gives an eGFR of 86. At 56, a Cystatin C eGFR of 86 is acceptable and represents normal age-related kidney function. His urea, uric acid, and creatinine are all within range. His PSA, prostate-specific antigen, is 0.48, very low, and his free PSA ratio is 43.8%, which is strongly reassuring. His prostate markers are excellent.\n\nHis immune system is largely healthy. IgG and IgA are within range, and his IgE is low, suggesting no significant allergic activity. His rheumatoid factor is negative. His coeliac screen, tissue transglutaminase IgA, is negative. However, his IgM is 0.3, below the reference range of 0.5 to 3.0. IgM is the first antibody the immune system produces in response to a new infection. A low level in isolation can be a normal variant, particularly in middle-aged men, but it can also be associated with certain immune conditions or chronic infections. Given that it is an isolated finding with IgG and IgA both healthy, this is most likely a benign variant, but it should be noted and repeated on the next test to confirm it is stable.\n\nHis testosterone is 9.5 against a reference range of 8.4 to 28.7, and the lab itself notes that a recommended level is above 12. This places him in the lower reaches of the laboratory range and well below the optimal threshold of 18. His free testosterone, calculated at 0.202, and his free androgen index at 34.93 are within range, and his SHBG, sex hormone binding globulin, at 27.2 is not excessively high, so the issue is total production rather than excessive binding. His LH and FSH, the pituitary hormones that stimulate the testes, are both in the lower half of range at 2.66 and 3.14 respectively, which suggests the brain is not pushing the testes particularly hard. This pattern is consistent with what is sometimes called functional hypogonadism, where excess body fat, poor sleep, stress, or suboptimal nutrition suppress the hypothalamic signal rather than there being a primary testicular problem. This is very likely connected to his reported low libido and may also be contributing to his fatigue and difficulty losing weight, because testosterone plays a direct role in energy, motivation, fat metabolism, and muscle maintenance. Losing body fat, increasing resistance training, improving sleep quality, and ensuring adequate zinc and vitamin D are the most effective natural levers for improving testosterone.\n\nHis inflammatory markers tell a mixed story. His hs-CRP, high-sensitivity C-reactive protein, which measures systemic inflammation, is 1.0, which sits right at the boundary between optimal (below 1.0) and mildly elevated. This is not alarming, but it is not clean either, and in the context of elevated triglycerides and excess body fat, it is consistent with low-grade metabolic inflammation. His ESR, erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and rises with inflammation, is 22 against a limit of below 12. This is meaningfully elevated and warrants attention. ESR can rise with chronic low-grade inflammation, infection, autoimmune conditions, or sometimes with elevated cholesterol and triglycerides themselves. In Gary's case, the combination of elevated triglycerides, borderline CRP, and excess body fat may be sufficient to explain it, but his GP should be aware of the result, particularly in the context of the elevated lipids and known blood pressure issues.\n\nHis iron studies show a serum iron of 35.1, above the upper limit of 31.3, with a transferrin saturation of 48.2%, which is within the laboratory range of 18 to 55% but above the optimal ceiling of 40%. His ferritin is 53, which is within the optimal range for men. His transferrin and total iron binding capacity are both healthy. A single elevated serum iron reading is most commonly explained by recent red meat intake, a meal close to the blood draw, or normal day-to-day variation. The transferrin saturation at 48% is not in the concerning zone for haemochromatosis, which typically presents with saturation persistently above 55% alongside rising ferritin. However, this should be noted and monitored, and if the next test shows iron and saturation rising further with ferritin climbing, the GP may wish to request an HFE gene test to exclude hereditary haemochromatosis.\n\nHis full blood count is largely healthy. Haemoglobin at 154, red cell count at 5.28, haematocrit at 0.455, and platelets at 263 are all comfortably within range. His white cell count at 4.98 is within range, and the differential, including neutrophils, lymphocytes, monocytes, eosinophils, and basophils, is all normal. His NLR, neutrophil-to-lymphocyte ratio, calculates to 1.63, which is within the optimal range and suggests no significant inflammatory or stress response at the cellular level. However, two red cell indices are worth noting. His RDW, red cell distribution width, which measures the variation in size of his red blood cells, is 16% against an upper limit of 15%. RDW can rise with early iron deficiency, B12 or folate deficiency, or chronic inflammation. His ferritin is adequate and his MCV is normal, so iron deficiency is unlikely to be the cause. His B12 at 279 is within the laboratory range but below the optimal threshold of 500, and this marginal B12 could be contributing to the elevated RDW. His reticulocyte absolute count is 38.5, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count suggests the marrow is producing red cells at a slightly reduced rate. At 56, this can reflect age-related marrow slowing, but it can also be connected to suboptimal B12 or the chronic low-grade inflammation suggested by the raised ESR. This is not urgent but adds weight to the recommendation to optimise B12.\n\nHis electrolytes show two abnormalities that should be reviewed. His chloride is 93 against a lower limit of 95, and his bicarbonate is 16.8 against a lower limit of 20. Low bicarbonate with low chloride can indicate a metabolic acidosis, where the blood is slightly more acidic than it should be. Common causes include lactic acid from recent exercise, dietary acid load, mild kidney tubular dysfunction, or chronic low-grade metabolic stress. His kidney function is otherwise normal, and this may reflect the timing of the sample relative to exercise or diet, but the combination should be flagged for his GP, and a repeat fasting sample with a fresh metabolic panel would help clarify whether this is a persistent finding.\n\nHis vitamin D is 66, which is classified as sufficient by the laboratory (above 50) but below the optimal range of 75 to 120. At a BMI of 27, vitamin D is sequestered in fat tissue, so supplementation needs to be at a sufficient dose to overcome this. His magnesium is 1.0, within the optimal range of 0.85 to 1.05, which is reassuring. His calcium and corrected calcium are both healthy. His PTH, parathyroid hormone, at 1.4 is within range, confirming calcium regulation is working normally. His folate at 10 is within range and above the optimal floor of 8. His B12 at 279, as noted, is within the laboratory range of 193 to 982 but below optimal and should be supplemented.\n\nHis cortisol at 220 is within the expected morning range and does not suggest adrenal dysfunction. His DHEA-S at 6.2 umol/L, equivalent to approximately 2,285 ug/dL, is within range. His prolactin at 96 is normal, which is relevant because elevated prolactin can suppress testosterone and would have warranted further investigation. His progesterone at 1.31 is within the male reference range and is not clinically significant. His creatine kinase at 127 is within range, confirming no significant muscle damage from his training.\n\nHis total antioxidant activity is 1.77, at the very top of the reference range, which is a positive finding and suggests his diet, despite being rated only 5 out of 10, is providing reasonable antioxidant coverage. His urine analysis is clean, with no protein, glucose, blood, white cells, or nitrites detected. The bacterial culture and sensitivities are pending.\n\nHis oestradiol result is marked as to follow and will be reviewed separately when available. This is an important marker in the context of his low testosterone, because if oestradiol is elevated relative to testosterone, it can indicate excessive aromatisation of testosterone to oestrogen in fat tissue, which would both lower testosterone and contribute to difficulty losing weight.\n\nIn summary, Gary's most significant finding is a substantially elevated lipid profile that represents genuine cardiovascular risk, and this needs to be discussed with his GP regardless of his preference for natural management. The good news is that his Lp(a) is normal, which means every element of his lipid risk is modifiable. His low testosterone is very likely contributing to his fatigue, low libido, and difficulty with body composition, and the most effective interventions are weight loss, increased resistance training, and optimising his micronutrient status. His glucose regulation is currently good but the HbA1c at 41 is approaching the pre-diabetes threshold and should be watched. The elevated ESR and borderline CRP suggest low-grade inflammation that is consistent with his metabolic picture. The low bicarbonate and chloride warrant a repeat to exclude a persistent metabolic acidosis. His B12 should be supplemented, his vitamin D should be increased into the optimal range, and his diet quality, currently rated 5 out of 10, is the single biggest lever he has for improving nearly every finding in this report.","links":"Gary's results point to three main areas of action: cardiovascular risk reduction, testosterone optimisation, and metabolic health improvement. The encouraging thread running through all three is that the same lifestyle changes address all of them simultaneously.\n\nStarting with the lipids, because this is the most clinically significant finding. Gary's ApoB at 1.41 and LDL at 5.14 represent a meaningfully elevated cardiovascular risk, and his triglycerides at 3.64 compound this. The conversation with his GP should include the following numbers: total cholesterol 8.4, LDL 5.14, ApoB 1.41, triglycerides 3.64, ApoB/A-I ratio 0.98, remnant cholesterol 1.66, and the positive Lp(a) below 25. Gary should ask his GP whether, given these numbers and his blood pressure history, a cardiovascular risk assessment (QRISK3) should be performed, and whether a trial of intensive lifestyle modification with retesting in three to four months is reasonable before reconsidering medication. If his GP agrees to a lifestyle trial, the dietary changes should be specific. Gary should increase soluble fibre intake to 10 to 15 grams per day through oats, barley, beans, lentils, flaxseed, and psyllium husk, as soluble fibre directly binds cholesterol in the gut and reduces LDL. He should eat oily fish (salmon, mackerel, sardines) at least three times per week, as omega-3 fatty acids are the most effective dietary intervention for reducing triglycerides. He should reduce saturated fat by switching from butter to olive oil, reducing red meat to once or twice per week, and minimising processed foods. He should increase plant sterol intake through fortified spreads or supplements, aiming for 2 grams per day, as this can reduce LDL by 7 to 10 percent. He should also consider adding a handful of almonds or walnuts daily, as tree nuts have a consistent LDL-lowering effect.\n\nFor body composition, Gary's BMI of 27.1 at 83kg places him in the overweight category. A target weight of 73 to 76kg would bring him into the healthy BMI range of 23.8 to 24.8. Based on his age, height, weight, and activity level (moderate, with four training sessions and 5,000 to 7,500 steps), his estimated maintenance calories are approximately 2,350 to 2,450 per day. To lose body fat at a sustainable rate of 0.5kg per week, he should target 1,850 to 1,950 calories per day. His protein intake should be 1.4 to 1.6 grams per kilogram of body weight, which is 116 to 133 grams per day. This protein floor is non-negotiable during a calorie deficit because it protects lean muscle mass, supports testosterone production, and improves satiety. He should prioritise protein at every meal, aiming for 30 to 40 grams per sitting.\n\nGary's resistance training frequency of once per week is insufficient to support his goals of fat loss, cardiovascular fitness, and testosterone improvement. He should aim for a minimum of two, ideally three, resistance sessions per week focusing on compound movements: squats, deadlifts, bench press, rows, and overhead press. These large multi-joint movements produce the greatest hormonal response and the most significant improvements in body composition. His three cardio sessions are good, but he should ensure at least one includes higher-intensity intervals, as this has been shown to improve insulin sensitivity and cardiovascular fitness more effectively than steady-state cardio alone. His daily step count of 5,000 to 7,500 should increase to a target of 8,000 to 10,000, as this is one of the simplest and most effective interventions for improving metabolic health and supporting weight loss.\n\nFor sleep and recovery, which directly affect testosterone, cortisol, and inflammation: Gary should aim for 7 to 8 hours of sleep per night, maintain a fixed wake time even on weekends, get outside within an hour of waking for natural light exposure, cut caffeine after 1pm, keep the bedroom cool (16 to 18 degrees), and avoid screens for 30 to 60 minutes before bed. Poor sleep is one of the most common drivers of low testosterone in men over 50, and addressing it can produce measurable improvements within weeks.\n\nFor the GP specifically, the following items should be discussed: the lipid profile with the numbers listed above and a request for QRISK3 assessment; the ESR at 22 against a limit of 12, to determine whether further investigation is warranted or whether it is attributed to the metabolic picture; the low chloride at 93 and bicarbonate at 16.8, with a request for a repeat fasting metabolic panel; the testosterone at 9.5 with a recommendation from the lab of above 12, to discuss whether further investigation or monitoring is appropriate; and the low IgM at 0.3 for documentation and repeat testing.\n\nRetesting should be performed in 12 to 16 weeks and should include as a minimum: full lipid panel with ApoB and ApoA-I, HbA1c, fasting glucose and insulin, full blood count with reticulocytes, ESR, CRP, testosterone, B12, vitamin D, and a repeat metabolic panel (sodium, chloride, bicarbonate). If the lifestyle changes have been implemented consistently, we would expect to see meaningful improvements in triglycerides, some improvement in LDL and ApoB, improved HbA1c trajectory, reduced ESR, and potentially improved testosterone.","flags":"LIPID PROFILE, SIGNIFICANTLY ELEVATED: Total cholesterol 8.4 (target below 5.18), LDL 5.14 (target below 3.0), ApoB 1.41 (target below 0.9, classified very high), triglycerides 3.64 (target below 1.7 fasting), VLDL 1.65 (target below 0.78), non-HDL 6.8 (target below 4.0), TC/HDL ratio 5.25 (target below 4.5), ApoB/A-I ratio 0.98 (higher risk category above 0.9), remnant cholesterol 1.66 (target below 0.8), HDL percentage 19.05% (target above 20%). Lp(a) is normal at below 25 nmol/L, confirming risk is entirely modifiable. HDL at 1.6 and ApoA-I at 1.44 are in the desirable range. Patient has declined medication; GP should perform formal cardiovascular risk assessment (QRISK3) and agree a structured lifestyle modification trial with defined retesting.\n\nESR ELEVATED: 22 mm/hour against a limit of below 12. In the context of elevated triglycerides, borderline CRP at 1.0, and BMI 27, this may reflect low-grade metabolic inflammation. However, other causes including occult infection, autoimmune conditions, or paraproteinaemia should be considered if the finding persists on repeat testing.\n\nLOW BICARBONATE AND CHLORIDE: Bicarbonate 16.8 (range 20 to 31), chloride 93 (range 95 to 108). This combination suggests a possible metabolic acidosis. Kidney function is otherwise normal. Recommend repeat fasting sample with venous blood gas or fresh metabolic panel to confirm or exclude persistent finding.\n\nTESTOSTERONE LOW-NORMAL: 9.5 nmol/L against a range of 8.4 to 28.7, below the lab-recommended level of 12. LH 2.66 and FSH 3.14 suggest the pituitary drive is not elevated in compensation, consistent with functional hypogonadism. Patient reports low libido and fatigue. Consider monitoring with repeat testing after lifestyle optimisation.\n\nIgM BELOW RANGE: 0.3 g/L against a range of 0.5 to 3.0. Isolated finding with IgG and IgA normal. Most likely benign variant but should be documented and repeated.\n\nSERUM IRON ELEVATED: 35.1 umol/L against a range of 11.6 to 31.3. Transferrin saturation 48.2% (within range but above optimal 40%). Ferritin 53 (normal). Likely dietary or sample-timing related. Monitor on repeat; if saturation exceeds 55% or ferritin rises, consider HFE gene testing.\n\nRDW ELEVATED: 16% against a range of 11.5 to 15%. MCV normal at 86.1. May reflect suboptimal B12 (279, below optimal 500) or chronic low-grade inflammation. Monitor with repeat.\n\nRETICULOCYTES ABSOLUTE LOW: 38.5 against a range of 50 to 100. Suggests mildly reduced red cell production, possibly related to suboptimal B12, chronic inflammation, or age-related marrow changes.\n\nHbA1c APPROACHING PRE-DIABETES: 41 mmol/mol against a pre-diabetes threshold of 42. Currently normal but should be actively monitored. HOMA-B low at 40.9 (range 80 to 200), in context of normal glucose and low insulin this reflects low demand but warrants observation.\n\nOESTRADIOL PENDING: Result marked as to follow. Clinically relevant in context of low testosterone.\n\nReassuring negatives: Lp(a) normal, ruling out inherited lipoprotein risk. PSA 0.48 with free ratio 43.8%, excellent prostate health. Thyroid function normal with negative antibodies. Liver function excellent with GGT 13 and FIB-4 1.11. HOMA-IR 0.93, confirming insulin sensitivity. Coeliac screen negative. Rheumatoid factor negative. Cystatin C eGFR 86, confirming adequate renal function. Urinalysis clean.","recommendations":"1. Book a GP appointment to discuss the lipid profile results. Bring the specific numbers: ApoB 1.41, LDL 5.14, triglycerides 3.64, and request a formal QRISK3 cardiovascular risk assessment. Discuss whether a structured three to four month lifestyle trial with retesting is appropriate before reconsidering medication.\n\n2. Increase dietary quality from the current rating of 5 out of 10. Specifically: eat oily fish three times per week, add 10 to 15 grams of soluble fibre daily (oats, flaxseed, beans, lentils, psyllium), switch to olive oil as the primary cooking fat, reduce red meat to once or twice per week, add a daily handful of almonds or walnuts, and consider plant sterol supplementation at 2 grams per day.\n\n3. Target 1,850 to 1,950 calories per day for sustainable fat loss of approximately 0.5kg per week. Ensure a minimum of 116 to 133 grams of protein per day, spread across meals at 30 to 40 grams per sitting.\n\n4. Increase resistance training from once to a minimum of twice, ideally three times per week. Focus on compound movements: squats, deadlifts, rows, presses. This is the single most effective intervention for improving testosterone, body composition, and metabolic health simultaneously.\n\n5. Increase daily steps to 8,000 to 10,000. This supports fat loss, improves insulin sensitivity, and helps reduce triglycerides.\n\n6. Supplement vitamin D at 3,000 to 4,000 IU daily with vitamin K2 to bring levels from 66 into the optimal range of 75 to 120.\n\n7. Supplement B12 as sublingual methylcobalamin 1,000 mcg daily to bring levels from 279 into the optimal range above 500.\n\n8. Supplement omega-3 fish oil at 2 to 3 grams of combined EPA and DHA daily to support triglyceride reduction and reduce inflammation.\n\n9. Prioritise sleep: aim for 7 to 8 hours, fixed wake time, morning light exposure, caffeine cut-off at 1pm, cool bedroom at 16 to 18 degrees.\n\n10. Ask the GP to repeat chloride and bicarbonate on a fasting sample to assess whether the low readings are persistent.\n\n11. Retest in 12 to 16 weeks: full lipid panel with ApoB, HbA1c, fasting glucose and insulin, FBC with reticulocytes, ESR, CRP, testosterone, B12, vitamin D, and a metabolic panel including chloride and bicarbonate.","supplementation":"Vitamin D3: 3,000 to 4,000 IU of cholecalciferol daily, taken with the largest fat-containing meal. Gary's level is 66 nmol/L, below the optimal range of 75 to 120. At a BMI of 27, a standard 2,000 IU dose may be insufficient as some vitamin D is sequestered in fat tissue. The higher dose should bring him into the optimal range within 8 to 12 weeks. Vitamin D supports testosterone production, immune function, bone health, and mood, all relevant to his symptoms and goals.\n\nVitamin K2: 200 mcg of MK-7 daily, taken alongside the vitamin D supplement. K2 directs calcium into bones and teeth and away from artery walls. This is particularly important when supplementing vitamin D, and given Gary's cardiovascular risk profile, arterial calcification prevention is an additional benefit.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This is the most evidence-based supplement for reducing triglycerides, which at 3.64 are more than double the fasting target. At therapeutic doses, omega-3 can reduce triglycerides by 15 to 30 percent. It also has anti-inflammatory properties that may help bring the ESR and CRP down.\n\nVitamin B12: 1,000 mcg of sublingual methylcobalamin daily, dissolved under the tongue. Gary's B12 at 279 is within the laboratory range but below the optimal threshold of 500. Sublingual delivery bypasses the gut and is more reliable than oral tablets, particularly in men over 50 where gastric acid production declines and B12 absorption can be reduced. Optimising B12 may help with his fatigue and should improve the elevated RDW.\n\nMagnesium glycinate: 300 mg before bed. Gary's magnesium at 1.0 is within the optimal range, but magnesium glycinate supports sleep quality, muscle recovery, and blood pressure regulation, all three of which are relevant to his goals. The glycinate form is well absorbed and has a mild calming effect that supports sleep onset.\n\nPlant sterols: 2 grams per day, either through a fortified spread or a standalone supplement taken with meals. Plant sterols compete with cholesterol for absorption in the gut and can reduce LDL cholesterol by 7 to 10 percent. In the context of Gary's decision to manage cholesterol naturally, this is one of the most effective non-pharmaceutical interventions available.\n\nThe most important changes from this report are not supplements. They are increasing resistance training to at least twice per week, improving diet quality with a focus on soluble fibre and oily fish, achieving a sustained calorie deficit to bring his weight from 83kg toward 73 to 76kg, and having an honest conversation with his GP about the lipid results and cardiovascular risk.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5600","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Gary's result of 5.4 is within the laboratory range but sits right at the ceiling of the optimal range of 4.0 to 5.4. This is not elevated, but it is not as low as it could be. In the context of his excellent insulin sensitivity (HOMA-IR 0.93), this suggests glucose clearance is adequate but could be improved with dietary changes, particularly reducing refined carbohydrates and increasing fibre intake.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin excess","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4917","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c reflects average blood sugar levels over the preceding two to three months by measuring the percentage of haemoglobin that has glucose attached to it. Gary's result of 5.9% is classified as normal (below 6.0%) but is right at the upper boundary, just one decimal point below the pre-diabetes range of 6.0 to 6.4%. This warrants attention and active monitoring, particularly as his diet quality is only rated 5 out of 10.","low_causes":"Low carbohydrate intake, blood loss, haemolytic conditions","high_causes":"Insulin resistance, pre-diabetes, diabetes, high sugar/refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised IFCC units. Gary's result of 41 mmol/mol is just below the pre-diabetes threshold of 42. The optimal level is below 36 mmol/mol. While currently classified as normal, this is a marker to actively improve through dietary changes and increased physical activity rather than simply monitor.","low_causes":"Low carbohydrate intake, blood loss, haemolytic conditions","high_causes":"Insulin resistance, pre-diabetes, diabetes, high sugar/refined carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3537","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3107","upper_optimal_position":"0.3875","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. Gary's result of 3.89 is within both the laboratory range and the optimal range of 2 to 8. A low fasting insulin with normal blood glucose is the hallmark of good insulin sensitivity, meaning his cells are responding well to insulin's signal without needing excess amounts. This is a genuinely positive finding.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate diet, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"367.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3528","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"500","upper_optimal":"1200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3705","upper_optimal_position":"0.5617","units":"pmol/L","description":"C-peptide is released in equal amounts alongside insulin and serves as a reliable marker of how much insulin the pancreas is actually producing. Gary's result of 367.4 pmol/L (converted from 1.11 ug/L) is right at the lower boundary of the reference range. In the context of his normal blood glucose and excellent HOMA-IR, this low C-peptide reflects low insulin demand rather than pancreatic insufficiency. However, it should be monitored because if glucose levels rise over time while C-peptide remains low, it could indicate that the pancreas lacks reserve capacity.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index of insulin resistance derived from fasting glucose and fasting insulin. A value below 1.0 indicates optimal insulin sensitivity. Gary's result of 0.93 confirms that his cells are responding efficiently to insulin. At a BMI of 27 with elevated triglycerides, this is a genuinely reassuring finding and suggests that insulin resistance has not yet developed despite the metabolic strain evident in his lipid profile.","low_causes":"High insulin sensitivity, low carbohydrate intake","high_causes":"Insulin resistance, metabolic syndrome, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"40.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1704","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates pancreatic beta-cell function, calculated as (20 x Insulin) / (Glucose - 3.5). Gary's result of 40.9 is below the reference range of 80 to 200. In isolation, this would be concerning, but in the context of a normal fasting glucose, low insulin, and excellent HOMA-IR, it reflects that the pancreas is simply not being asked to produce much insulin because his cells are clearing glucose efficiently. This is not pancreatic failure. However, with his HbA1c sitting at 41 and approaching the pre-diabetes boundary, this low beta-cell output should be monitored to ensure the pancreas has sufficient reserve if insulin demand increases with age.","low_causes":"Low insulin demand due to high sensitivity, low carbohydrate intake, early pancreatic decline","high_causes":"Insulin resistance driving compensatory insulin production","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2946","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Gary's result of 33 is within the laboratory range of below 56 but slightly above the tighter optimal threshold of below 30 for men. This is a very minor elevation and does not indicate liver disease, particularly given his excellent GGT and normal bilirubin. It may reflect mild metabolic strain from the elevated triglycerides or dietary factors.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Fatty liver disease, alcohol, medications, viral hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4271","lower_normal":"13","upper_normal":"45","lower_optimal":"10","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2396","upper_optimal_position":"0.5833","units":"IU/L","description":"AST, aspartate aminotransferase, is found in the liver, heart, and muscles. It is less liver-specific than ALT but is used alongside it to assess liver health. Gary's result of 30 is comfortably within both the laboratory and optimal ranges. The AST to ALT ratio is approximately 0.91, which is normal and does not suggest alcoholic liver disease or advanced fibrosis.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0890","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT, gamma-glutamyl transferase, is the most sensitive liver enzyme for detecting biliary obstruction, alcohol-related liver damage, and metabolic liver stress. Gary's result of 13 is excellent, well within the optimal threshold of below 25. This is a particularly reassuring finding because GGT is often the first enzyme to rise with fatty liver disease, alcohol use, or metabolic syndrome. Despite his elevated triglycerides, his liver is showing no signs of metabolic strain.","low_causes":"Normal finding","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"46","upper_normal":"116","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver and bones. It is used to detect bile duct problems and bone disorders. Gary's result of 78 is within the optimal range and is entirely normal.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, Paget's disease, vitamin D deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"5","upper_normal":"21","lower_optimal":"3","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2083","upper_optimal_position":"0.5625","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Gary's result of 18 is within the laboratory range but slightly above the optimal ceiling of 17. With all liver enzymes clean, this minor elevation is most likely a normal variant. Bilirubin at this level, particularly with a clean GGT and ALT, can be seen in Gilbert's syndrome, a harmless inherited condition affecting 5 to 10% of people, though formal diagnosis would require the level to be consistently above range.","low_causes":"Normal finding","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting nutritional status and immune function. Gary's result of 75 is within the optimal range and confirms adequate protein nutrition and normal liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance and transports hormones, vitamins, and medications. Gary's result of 45 is within the optimal range and confirms healthy liver synthetic function and adequate nutritional status.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/L","description":"Globulin encompasses the immune proteins (immunoglobulins) and transport proteins in the blood. Gary's result of 30 is within the optimal range and reflects a healthy immune system and adequate protein production.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. Gary's calculated ratio of 1.50 is within the optimal range, confirming a healthy balance between nutritional protein (albumin) and immune protein (globulin).","low_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","high_causes":"Immune deficiency, high protein diet with adequate liver function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3828","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis (scarring) using age, platelet count, ALT, and AST. Gary's score of 1.11 is well below the threshold of 1.45, confirming no evidence of significant liver fibrosis. This is managed in primary care without further investigation.","low_causes":"Normal finding, healthy liver","high_causes":"Liver fibrosis, cirrhosis, advanced age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"30","upper_normal":"118","lower_optimal":"25","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2765","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. It is used to detect pancreatic inflammation or damage. Gary's result of 96 is within the normal range and confirms healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis, pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4681","lower_normal":"13","upper_normal":"60","lower_optimal":"10","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2766","upper_optimal_position":"0.6170","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase and is the preferred marker for detecting pancreatic inflammation. Gary's result of 32 is within the optimal range and confirms healthy pancreatic function.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease, gallstones","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"8.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8108","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the combined amount of all cholesterol in the blood, including the protective HDL and the harmful LDL and VLDL fractions. Gary's result of 8.4 is significantly above the desirable threshold of 5.18. While total cholesterol alone does not tell the full story, at this level it reflects a substantial excess of cholesterol-carrying particles, as confirmed by the LDL, ApoB, and non-HDL results. This is the central finding driving the cardiovascular risk in this report.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetic predisposition (familial hypercholesterolaemia), hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"3.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats
