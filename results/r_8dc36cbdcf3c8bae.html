<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Richard Abbott","dob":"07/07/1958","report_date":"2026-11-06","summary":"Patient is a 68-year-old male presenting with a BMI of 22.3, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). He does not report any regular cardio or resistance training sessions and his daily step count is not recorded. He sleeps 7 to 8 hours and wakes feeling refreshed, with no energy pattern concerns noted. Stress feels hard to manage most days. He drinks 1 to 4 alcoholic drinks a week, takes no medications and reports no diagnosed conditions. His previous blood test was normal. He has not reported specific symptoms or goals.\n\nThe finding in this report that warrants the most attention is kidney function. Cystatin C, a protein produced at a steady rate by all cells in the body and filtered exclusively by the kidneys, is 1.34, above the upper limit of 1.1. Unlike creatinine, which is influenced by muscle mass and can underestimate kidney decline in a lean person, cystatin C gives a more accurate picture of filtration. From this result the laboratory has calculated a cystatin C eGFR of 69, which means the kidneys are filtering at roughly 69 percent of what a young, healthy kidney would manage. The creatinine-based eGFR of 87 looks more reassuring, but at a BMI of 22.3 with no resistance training to build extra muscle, the creatinine is expected to be low, and this flatters the creatinine eGFR. When both measurements are combined, the blended eGFR is 69, below the 90 threshold generally considered fully healthy. This is a mildly reduced filtration rate; on its own, with no protein in the urine, it is not a diagnosis of kidney disease, which is why a repeat test matters. The reassuring context is that urea, electrolytes, bicarbonate and uric acid are all within range, and there is no protein in the urine, so the kidneys are coping well with their workload at present. However, this result should be discussed with his GP. A repeat cystatin C in three months, along with a urine albumin-to-creatinine ratio and a blood pressure check, would establish whether this is stable or progressive. At 68, some decline in filtration rate is expected, but a cystatin C eGFR below 70 is worth tracking.\n\nHis blood glucose is 6.2, marginally above the upper limit of 6.0, and his HbA1c, a measure of average blood sugar over the preceding two to three months, is 40 mmol/mol. That HbA1c sits within the normal range (below 42), but is approaching the pre-diabetic threshold. Insulin at 7.61 is within the laboratory range and within the optimal band. However, when glucose and insulin are combined into the HOMA-IR score, a measure of how hard the pancreas has to work to keep blood sugar controlled, the result is 2.1, above the upper limit of 1.5.  This means his cells are becoming less responsive to insulin's signal, so the pancreas produces slightly more to compensate, and fasting glucose drifts upward. At a BMI of 22.3 this is not being driven by excess body fat, which is the most common cause. More likely contributors at his weight are the sugary foods consumed some days, overall carbohydrate composition, stress (which raises cortisol, and cortisol directly opposes insulin's action), and age-related decline in insulin sensitivity. His estimated average glucose, derived from HbA1c, is 6.6, within range but above the optimal ceiling of 6.2. The TyG index, another insulin resistance marker built from triglycerides and glucose, is 8.63, also within range but above the optimal of 8.5. These three indices all point the same way: early insulin resistance that is not yet pre-diabetes, but is heading in that direction. The good news is that at this stage, dietary changes and movement reverse it reliably.\n\nThere is a great deal of good news in this report. His testosterone is 25.9, which at 68 is genuinely excellent, sitting well within the optimal band of 18 to 30. Free testosterone, the fraction not bound to proteins and available for the body to use, is 0.3715, comfortably within range. Bioavailable testosterone at 8.32 is healthy. SHBG, the protein that binds testosterone, is 64.9, at the top of the range but not above it, and his free androgen index at 39.91 is normal. For a man of 68 with no testosterone-related symptoms, this is as good as it gets. His thyroid is working well, with TSH at 3.84, free T4 at 14.5, free T3 at 5.2, and both antibody tests negative. TSH is above the optimal ceiling of 2.5, and free T4 at 14.5 sits at the lower end of the optimal band, which means the pituitary is pushing a little harder to maintain thyroid output. This is a common pattern with age and is not a concern at present, but is worth monitoring over time. The FT3 to FT4 ratio of 0.359 shows good conversion of the storage hormone to its active form.\n\nHis liver is in excellent health. ALT at 16 and GGT at 29 are both within range, and GGT below 25 would be optimal, so at 29 it is slightly above the ideal but well within the laboratory range and not a concern. AST at 23 is normal. Bilirubin, albumin and total protein are all healthy. The FIB-4 score, which estimates liver scarring from age, platelets, ALT and AST, is 1.44, just below the upper limit of 1.45. At 68, age inflates this calculation, and for people over 65 a cut-off of 2.0 is generally used instead. With every liver enzyme clean, this score is being driven by the formula rather than by any sign of liver disease. The APRI score at 0.211 and the NAFLD fibrosis score at minus 0.748 both make liver scarring very unlikely.\n\nHis lipid profile is largely encouraging. Total cholesterol at 4.6 is below the desirable threshold. Triglycerides at 1.13 are within the target and not far above the optimal ceiling of 1.0. HDL cholesterol, the protective form that carries cholesterol away from artery walls, is 1.5, just below the desirable threshold of 1.55 but well above the high-risk floor of 1.04. LDL cholesterol at 2.63 is within the laboratory range of 0.5 to 3.0, though above the optimal target of 2.6 by a small margin. The TC to HDL ratio at 3.07 is healthy. ApoA1, the protein on HDL particles, is 1.59, which is good. Non-HDL cholesterol at 3.1 is within the target of below 4. The atherogenic index of plasma at minus 0.123 is within the optimal range, and the Castelli II ratio at 1.75 is well within the optimal ceiling of 2.5. However, Apolipoprotein B, the protein that sits on every LDL particle and is considered the best single measure of how many cholesterol-carrying particles are in the bloodstream, is 0.99, above the desirable target of 0.9. The ApoB to ApoA1 ratio at 0.623 remains below the lower risk threshold of 0.7, which is reassuring. The Lp(a)-corrected LDL, which strips out the LDL contributed by Lp(a) to show the modifiable portion, is 2.46, within both the reference range and the optimal ceiling of 2.6, confirming that most of his LDL is modifiable through diet and lifestyle.\n\nLipoprotein(a), often written Lp(a), is 51.31 nmol/L, above the ideal of 32. Lp(a) is entirely inherited and does not change with diet, exercise or medication. At 51 it sits above the laboratory reference of 32 and well below the level of about 125 nmol/L at which it is generally considered to add meaningful cardiovascular risk. It is worth knowing and worth mentioning to his GP alongside the other lipid results and any family history, but it is not a concern on its own.\n\nThe cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 30 out of 100. This is within the acceptable range (below 40) but above the ideal threshold of 20. The two inputs driving it are the ApoB at 0.99 and the Lp(a) at 51.31. With the Lp(a) fixed by genetics, the lever here is ApoB, and bringing that below 0.9 through diet would pull the score closer to 20.\n\nHis inflammatory markers are reassuring. High-sensitivity CRP, which measures low-grade inflammation throughout the body, is 0.8, within the optimal range of below 1.0. ESR at 8 is well within range. However, some of the derived inflammatory indices are above their optimal bands. The platelet-to-lymphocyte ratio is 245 against an optimal ceiling of 160, and the systemic immune-inflammation index is 988 against an optimal ceiling of 450. Both are being driven by the lymphocyte count, which at 1.11 is within the laboratory range of 1 to 3 but sits near the floor. At 68, a lymphocyte count at the lower end of range is common and reflects the gradual decline in adaptive immune cell production with age. With CRP, ESR and all immunoglobulins within range, there is no evidence of active inflammation or immune compromise, and these elevated ratios reflect the low lymphocyte count rather than a genuine inflammatory process.\n\nImmunoglobulins are within range. IgG at 15.7 is near the top of its range of 6.5 to 16, which is not a concern. IgM at 0.6 is just above the lower limit and IgA at 1.8 is mid-range. IgE at 6.25 is low and reassuring, making an allergic process very unlikely. Rheumatoid factor at 6 is negative, and the tissue transglutaminase IgA test for coeliac disease is negative.\n\nHis iron studies are healthy. Ferritin at 84 is within the optimal band of 50 to 200 for a man, serum iron at 17.2 is within range, transferrin saturation at 28.9 percent falls within the optimal band of 25 to 40 percent, and transferrin and iron binding capacity are both normal. His full blood count is broadly normal, with haemoglobin at 148, red cell count, haematocrit, MCV, MCH and MCHC all within range. Platelets at 272 and MPV at 9.3 are healthy. White cell count at 5.8 is mid-range. The one flagged finding in the blood count is the absolute reticulocyte count at 35.264, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A low absolute count with a normal percentage (0.76 percent, within range) and normal haemoglobin means the bone marrow is producing enough red cells to maintain healthy haemoglobin but at a slightly slower rate than the reference population. At 68, this is most likely age-related slowing of marrow turnover. With no anaemia, no low iron and no B12 or folate deficiency, it does not need treatment, but it is worth noting for future comparison.\n\nVitamin D at 65 nmol/L is sufficient but below the optimal range of 75 to 120. At his lean BMI, a supplement dose of 2,000 to 3,000 IU daily should bring it into the optimal range comfortably. Vitamin B12 at 298 is within the laboratory range but below the optimal floor of 500. At 68, B12 absorption from food declines because the stomach produces less intrinsic factor, the protein needed to absorb B12 from the gut. A sublingual methylcobalamin supplement is the most reliable way to raise this. Folate at 13 is healthy, within the optimal range.\n\nCalcium, corrected calcium, phosphate, magnesium, sodium, chloride, bicarbonate and potassium are all within range. Magnesium at 0.94 is within the optimal band of 0.85 to 1.05. Serum osmolality at 289.4 is within the optimal range. Uric acid at 355 is within the optimal band for a man.\n\nCortisol at 434 is within the morning reference range. His morning cortisol is healthy, though with stress reported as hard to manage most days, the issue is likely the pattern of cortisol through the day rather than the morning peak. Oestradiol at 85 is within range for a man. Progesterone at 0.8 is marginally below the lower limit of 0.89. In men, progesterone is produced in small amounts and has a minor role; a level marginally below range is not clinically significant. LH and FSH are both within range, confirming normal pituitary signalling. DHEA-S at 1.2 umol/L is within range. Prolactin at 171 is normal.\n\nHis prostate screen is excellent. PSA at 0.65 is very low for any age and especially reassuring at 68. The free PSA ratio at 0.6, well above 0.19, is entirely normal. The tumour markers CA19-9 at 20.54 and CEA at 2.76 are both worth noting. CA19-9 is within range. CEA, a marker sometimes associated with bowel, lung and other cancers but also raised by inflammation and benign conditions, is 2.76, above the reference of 2.3. A marginally raised CEA in isolation, without symptoms, weight loss or any other pointer, is most commonly a benign finding, but given his age it is worth mentioning to his GP and repeating in three to six months to confirm it is stable. Creatine kinase at 63 is normal.\n\nTotal antioxidant activity at 1.87 is above the upper limit of 1.77. This marker measures the combined antioxidant capacity of the blood, and a result above range is not a concern. It is most commonly raised by a diet rich in fruit, vegetables and polyphenols, or by supplementation, and at 4 to 5 portions of vegetables and fruit a day, his diet explains it.\n\nHis urinalysis is clean. No protein, glucose, ketones, blood, nitrites, casts or urobilinogen. White cells at 10 sit at the threshold of significance and are not a concern in isolation.\n\nHis PhenoAge, a biological ageing score derived from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 68.6 against a calendar age of 68, a difference of just 0.6 years. This means his blood markers place him almost exactly at his chronological age biologically. The glucose of 6.2 and the low lymphocyte count are the two inputs nudging PhenoAge slightly above his calendar age; addressing the insulin resistance should bring the two into line or tip PhenoAge below his actual age.\n\nIn summary, the priorities from this report are threefold. First, kidney function: the cystatin C eGFR of 69 needs a GP conversation, a repeat in three months, and a urine albumin-to-creatinine ratio to establish a baseline. Second, early insulin resistance: blood glucose at 6.2, HOMA-IR at 2.1 and the direction of travel toward pre-diabetes need dietary and movement changes now, while they are fully reversible. Third, cardiovascular optimisation: ApoB at 0.99 is above target and is modifiable through diet. Beyond these, vitamin D and B12 need supplementation, the CEA result should be repeated, and the stress that feels hard to manage most days deserves attention because cortisol is a direct driver of insulin resistance.","links":"The three main findings in this report are connected by a common thread: metabolic health and its downstream effects. The blood glucose of 6.2, the HOMA-IR of 2.1 and the early insulin resistance they represent sit at the centre of the picture. Insulin resistance drives glucose upward, which contributes to glycation of proteins (reflected in the HbA1c drifting toward the pre-diabetic zone), promotes arterial wall damage (creating the environment in which ApoB-carrying particles do harm), and over time can contribute to kidney decline through damage to the small blood vessels that make up the kidney's filtration units. This does not mean the kidney finding is caused by the insulin resistance, but it means that reversing the insulin resistance protects the kidneys from further decline.\n\nThe ApoB at 0.99 and the Lp(a) at 51 together drive the cardiovascular risk score of 30. The Lp(a) is genetic and fixed, which makes the modifiable portion, the ApoB, more important to address. Bringing ApoB below 0.9 with dietary changes, particularly increasing soluble fibre and oily fish while reducing saturated fat, would lower the cardiovascular risk score meaningfully. The LDL itself at 2.63 is borderline, and the Lp(a)-corrected LDL of 2.46 confirms that most of his LDL burden is diet-responsive.\n\nThe low lymphocyte count at 1.11, the low absolute reticulocyte count at 35, and the mildly above-optimal PLR and SII indices all trace back to a single explanation: age-related slowing of bone marrow and immune cell production. With CRP at 0.8, ESR at 8, no anaemia and no infection, there is no pathological process at work. These findings are expected at 68 and do not need treatment, but they do mean the immune system has less reserve, which makes sleep, nutrition and stress management more important for maintaining immune competence.\n\nThe stress reported as hard to manage most days is the one lifestyle factor that reaches into multiple systems. Cortisol opposes insulin, so chronic stress worsens insulin resistance. Cortisol suppresses lymphocyte production, which may be contributing to the low lymphocyte count alongside age. And cortisol raises blood pressure, which is relevant when kidney filtration is already reduced. Addressing stress is not a soft recommendation in this report; it connects directly to the three clinical priorities.\n\nWhat has been positively excluded is important. There is no diabetes: HbA1c is below 42. There is no liver disease: every enzyme is clean and three fibrosis scores make scarring very unlikely. There is no thyroid disease: antibodies are negative and hormone levels are adequate. There is no iron deficiency or overload. There is no prostate concern: PSA is exceptionally low. There is no coeliac disease. There is no rheumatological condition. There is no significant inflammation. The blood count is normal apart from the benign reticulocyte finding. The urinalysis is clean.","lifestyle":"Add two portions of oily fish a week (salmon, mackerel, sardines or trout), ideally replacing a red meat meal. Anchor: the weekly shop, buy it on the same day each week so it is in the fridge. Why: omega-3 fatty acids lower ApoB-carrying particles and triglycerides, directly targeting the ApoB of 0.99 and reducing the cardiovascular risk score.\nAdd a tablespoon of ground flaxseed or a bowl of oats to breakfast each morning. Anchor: before any other food. Why: soluble fibre binds cholesterol in the gut and lowers LDL and ApoB. It also slows glucose absorption, directly helping the blood glucose of 6.2.\nReduce sugary foods from some days to once a week at most. Anchor: when the craving hits, replace with a piece of fruit, a handful of nuts or dark chocolate (85 percent or above). Why: sugar drives the insulin resistance behind the HOMA-IR of 2.1 and the elevated blood glucose.\nWalk for at least 20 minutes after your largest meal of the day, every day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal by 20 to 30 percent, which is the simplest way to bring the HOMA-IR back below 1.5.\nAdd two resistance training sessions a week, even bodyweight exercises at home (squats, press-ups, step-ups, rows with a band). Anchor: fixed days, same time. Why: muscle is the largest consumer of glucose in the body, and resistance training improves insulin sensitivity for 48 hours after each session. At 70 kg with a BMI of 22.3, preserving and building muscle is also the best protection against age-related frailty.\nFind one daily stress-management practice and anchor it to something that already happens. Options: 10 minutes of box breathing after the morning cup of tea, a 10-minute walk in daylight before 9am, or a guided meditation app before bed. Why: stress most days raises cortisol, which directly worsens insulin resistance and suppresses immune function, two of the findings in this report.\nKeep caffeine before midday only, and keep alcohol to 3 or fewer drinks a week. Anchor: no coffee after lunch, no alcohol on weeknights. Why: caffeine after midday disrupts deep sleep even when it does not prevent falling asleep, and alcohol impairs glucose control the following morning.\nAim for 1.3 to 1.6 grams of protein per kilogram of body weight per day, which at 70 kg means 91 to 112 grams. Spread it across three meals: a palm-sized portion at each. Calorie target for maintenance at his activity level (sedentary to light, multiplier 1.3 to 1.45) is approximately 1,900 to 2,050 kcal per day. At a BMI of 22.3 there is no need for a calorie deficit; the goal is to improve the composition of what is eaten, not to eat less.","flags":"Cystatin C is 1.34, above the upper limit of 1.1, giving a cystatin C eGFR of 69, below the 90 threshold for fully healthy filtration. The creatinine-based eGFR of 87 is likely overestimating function at his lean body mass. This should be discussed with his GP with a repeat cystatin C in three months and a urine albumin-to-creatinine ratio to establish a baseline.\nBlood glucose is 6.2, above the upper limit of 6.0, and HOMA-IR is 2.1, above the upper limit of 1.5, indicating early insulin resistance. HbA1c at 40 mmol/mol is within the normal range but approaching the pre-diabetic threshold of 42. Lifestyle intervention now is the most effective way to reverse this.\nApoB is 0.99, above the desirable target of 0.9. ApoB is the best single measure of atherogenic particle number and the primary modifiable lipid target in this report. The ApoB to ApoA1 ratio at 0.623 remains in the lower-risk category.\nLp(a) is 51.31 nmol/L, above the laboratory reference of 32 and below the level of approximately 125 at which it is generally considered to add meaningful risk. This is inherited and cannot be changed by lifestyle. Worth mentioning to the GP alongside the lipid results.\nCEA is 2.76, above the reference of 2.3. In isolation and without symptoms this is most commonly benign, but given his age it should be mentioned to the GP and repeated in three to six months to confirm stability.\nAbsolute reticulocyte count is 35.264, below the lower limit of 50, with normal haemoglobin and reticulocyte percentage. Most likely age-related slowing of marrow turnover. No action needed but noted for future comparison.\nProgesterone is 0.8, marginally below the lower limit of 0.89. In men, this is not clinically significant at this margin.\nTotal antioxidant activity is 1.87, above the upper limit of 1.77. This reflects his good fruit and vegetable intake and is not a concern.\nVitamin D is 65, sufficient but below the optimal range of 75 to 120. Supplementation recommended.\nVitamin B12 is 298, within the laboratory range but below the optimal floor of 500. Sublingual supplementation recommended.\nTSH is 3.84, within the laboratory range but above the optimal ceiling of 2.5, with FT4 at the lower end of the optimal band at 14.5. Antibodies are negative. This is consistent with age-related thyroid slowing and does not need treatment, but should be monitored.\nNeutrophil-to-lymphocyte ratio 3.63 (upper limit 3.53), platelet-to-lymphocyte ratio 245 (upper limit 210) and systemic immune-inflammation index 988 (upper limit 600) are raised. All three are driven by a lymphocyte count of 1.11, at the low end of its range (1 to 3), rather than by high neutrophils or platelets. With CRP 0.8 and ESR 8 both normal, this is unlikely to reflect active inflammation. Worth repeating at the next test.\nReassuring negatives: diabetes is unlikely (HbA1c 40), liver disease is very unlikely (all enzymes clean, FIB-4 1.44, APRI 0.211, NAFLD score minus 0.748), thyroid autoimmunity is unlikely (both antibodies negative), prostate cancer is very unlikely (PSA 0.65 with free ratio 0.6), coeliac disease is unlikely (tTG negative), rheumatological disease is unlikely (RF 6), significant inflammation is unlikely (CRP 0.8, ESR 8), iron deficiency and overload are unlikely (ferritin 84, saturation 28.9 percent).\n","recommendations":"Discuss the cystatin C result of 1.34 and the cystatin C eGFR of 69 with your GP. Request a repeat cystatin C in three months, a urine albumin-to-creatinine ratio, and a blood pressure check to establish a kidney function baseline.\nMention the glucose of 6.2 and HOMA-IR of 2.1 to your GP. If the dietary and movement changes below do not bring blood glucose below 6.0 and HOMA-IR below 1.5 within six months, a repeat glucose and HbA1c should guide next steps.\nMention the ApoB of 0.99 to your GP alongside the Lp(a) of 51.31. The GP may wish to calculate a formal cardiovascular risk score (QRISK) and discuss whether the combination of ApoB above target plus Lp(a) above ideal warrants further intervention beyond diet.\nRequest a repeat CEA in three to six months to confirm the 2.76 result is stable. No action is needed now, but a rising trend would need investigation.\nMonitor thyroid function with a repeat TSH and FT4 in twelve months given TSH at 3.84 and FT4 at the lower end of optimal.\nCalorie target: approximately 1,900 to 2,050 kcal per day for maintenance at current activity. Protein target: 91 to 112 grams per day (1.3 to 1.6 g/kg). No weight loss needed at BMI 22.3. Retest in six months with: glucose, HbA1c, insulin, HOMA-IR, lipid panel with ApoB, cystatin C, CEA, vitamin D, B12 and a full blood count.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 to 3,000 IU daily, taken with a meal containing fat. Why: vitamin D is 65, below the optimal range of 75 to 120. At his lean BMI, 2,000 to 3,000 IU should be sufficient. Always take with vitamin K2 (see below) to ensure calcium is directed to bone rather than arteries.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with the vitamin D. Why: K2 activates the proteins that move calcium into bone and teeth and away from soft tissue. Essential whenever supplementing vitamin D.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: B12 at 298 is below the optimal floor of 500, and at 68 stomach acid and intrinsic factor decline, making sublingual absorption more reliable than swallowing a tablet.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: supports the reduction of ApoB-carrying particles and triglycerides, and provides an anti-inflammatory effect that benefits the kidneys and cardiovascular system.\nMagnesium glycinate: 300 mg before bed. Why: magnesium at 0.94 is within the optimal range, but supplementation supports insulin sensitivity (directly relevant to the HOMA-IR of 2.1), sleep quality, and stress resilience, all priorities in this report.\nThe most important changes from this report are not supplements. They are the dietary shifts to lower ApoB and blood glucose, the daily post-meal walk, the addition of resistance training, and the daily stress management practice.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 55 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 56.7; held to 55 by cystatin C above 1.3. Weakest systems: tumor markers 8%, inflammation 38%, lipids & cardiovascular 40%. Biggest drags: Lipoprotein(a), HOMA-IR, Cystatin C, Apolipoprotein B.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"68.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4699","lower_normal":"","upper_normal":"73","lower_optimal":"","upper_optimal":"68","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4658","units":"years","description":"PhenoAge is a biological ageing score derived from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge is 68.6 against a calendar age of 68, a difference of just 0.6 years. This means his blood markers place him almost exactly at his chronological age. The inputs nudging PhenoAge slightly above his calendar age are the glucose of 6.2 and the low lymphocyte percentage. Addressing the insulin resistance through dietary change and exercise should bring PhenoAge in line with or below his calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk being built rather than the ten-year chance of an event. His score of 30 is within the acceptable range (below 40) but above the ideal threshold of 20. The two inputs driving the score are the ApoB at 0.99 and the Lp(a) at 51.31. Since Lp(a) is fixed by genetics, the modifiable lever is ApoB, and dietary changes to bring it below 0.9 would reduce this score toward 20.","low_causes":"Excellent lipid profile, low inflammation, low HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood. His result of 6.2 is above the upper limit of 6.0 and above the optimal ceiling of 5.4. Glucose is the body's primary fuel, and levels above 6.0 indicate the liver is releasing more glucose than the body can clear, typically because cells have become less responsive to insulin. At a BMI of 22.3 this is not driven by excess body fat; stress, dietary sugar and age-related decline in insulin sensitivity are the most likely contributors. Reducing sugary foods, adding post-meal movement and managing stress should bring this below 6.0.","low_causes":"Fasting, excessive exercise, insulin overdose, reactive hypoglycaemia","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, high sugar intake, medications such as steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it, and reflects average blood sugar over the preceding two to three months. His result of 5.8 percent is below the pre-diabetic threshold of 6.0 percent but above the optimal level, indicating blood sugar has been running at the upper end of normal. This is consistent with the blood glucose of 6.2 and the HOMA-IR of 2.1.","low_causes":"Low carbohydrate intake, hypoglycaemia, some haemoglobin variants","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol. His result of 40 is within the normal range (below 42) but above the optimal ceiling of 36 mmol/mol. It is not pre-diabetic, but it is trending in that direction. Dietary changes and increased physical activity are the most effective interventions to bring this below 36.","low_causes":"Low carbohydrate intake, hypoglycaemia, some haemoglobin variants","high_causes":"Pre-diabetes, type 2 diabetes, insulin resistance, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4082","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. Fasting insulin reflects how much the pancreas needs to produce overnight to keep blood sugar controlled. His result of 7.61 is within both the laboratory range and the optimal band of 2 to 8, meaning the pancreas is not overworking. The concern emerges when this is paired with the glucose of 6.2: the HOMA-IR calculation shows that while insulin output is appropriate, glucose is still elevated, indicating early cellular resistance to insulin's signal.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, high carbohydrate intake, obesity, pre-diabetes, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3828","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747","units":"ug/L","description":"C-Peptide is released in equal amounts to insulin when the pancreas produces insulin, making it a reliable measure of pancreatic insulin output that is not affected by external insulin use. His result of 1.59 ug/L is within the laboratory range and consistent with normal pancreatic function. It confirms the insulin level is genuine and that the pancreas is working normally.","low_causes":"Type 1 diabetes, low insulin demand, low carbohydrate diet","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8667","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index derived from glucose and insulin that estimates how resistant the body's cells are to insulin. A value below 1.0 means excellent insulin sensitivity. His result of 2.1 is above the u iency, hyperparathyroidism, chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"298","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3777","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. His result of 298 is within the laboratory range but well below the optimal floor of 500. At 68, stomach acid production and intrinsic factor, the protein needed to absorb B12 from food, both decline. A sublingual methylcobalamin supplement at 1,000 mcg daily is recommended, as it is absorbed directly through the mucosa under the tongue, bypassing the stomach.","low_causes":"Ageing (reduced absorption), vegan or vegetarian diet, pernicious anaemia, metformin, proton pump inhibitors","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis and red blood cell production, and works closely with vitamin B12. His result of 13 is within the optimal range, reflecting good intake from his 4 to 5 daily portions of fruit and vegetables.","low_causes":"Poor dietary intake, alcohol, pregnancy, malabsorption, medications","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4440","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of HDL, LDL and VLDL cholesterol. His result of 4.6 is below the desirable threshold of 5.18 and within the optimal range. Total cholesterol on its own is a crude measure; the breakdown into LDL, HDL and ApoB matters more.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, hypothyroidism, familial hypercholesterolaemia, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3324","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat circulating in the blood, packaged in VLDL particles. They rise after meals, with sugar and refined carbohydrate intake, and with alcohol. His result of 1.13 is within the laboratory range but above the optimal ceiling of 1.0. The slightly elevated level is consistent with the early insulin resistance pattern: insulin drives triglyceride production in the liver. Reducing sugar and refined carbohydrate will bring this into the optimal band.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate and sugar intake, alcohol, obesity, insulin resistance, hypothyroidism, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3269","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. His result of 0.51 is within the optimal range, consistent with his triglyceride level being reasonably controlled.","low_causes":"Very low fat diet, malabsorption","high_causes":"High carbohydrate intake, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7212","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL cholesterol is the protective form that carries excess cholesterol from artery walls back to the liver for disposal. Higher is better. His result of 1.5 is above the high-risk threshold of 1.04 and approaching the desirable threshold of 1.55, but above the optimal floor of 1.4 for a man. Regular exercise, particularly brisk walking and resistance training, is the most effective way to raise HDL.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.63"," ":"0.8153","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the cholesterol pool is protective. His result of 32.61 percent is well above the minimum of 20 percent, indicating a healthy proportion of protective cholesterol.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, regular exercise, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the potentially harmful cholesterol fractions (LDL, VLDL, Lp(a)). His result of 3.1 is within the laboratory target of below 4 but above the optimal ceiling. This is driven primarily by the LDL and Lp(a) contributions.","low_causes":"Very low LDL, low VLDL","high_causes":"High LDL, high triglycerides, Lp(a), diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6625","lower_normal":"1.20","upper_normal":"","lower_optimal":"1.40","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Higher levels indicate more protective HDL particles. His result of 1.59 is above the normal threshold of 1.20 and above the optimal floor of 1.40, indicating a healthy number of protective particles.","low_causes":"Smoking, sedentary lifestyle, obesity, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein that sits on every LDL, VLDL and Lp(a) particle, making it the best single measure of how many atherogenic (artery-damaging) particles are in the bloodstream. His result of 0.99 is above the desirable target of 0.9 and above the optimal target of 0.8. Each ApoB-carrying particle can embed in an artery wall and contribute to plaque formation. The target is below 0.9, and ideally below 0.8. Dietary changes, specifically increasing soluble fibre, eating oily fish twice a week and reducing saturated fat from red meat and dairy, are the first-line approach.","low_causes":"Low LDL, low fat diet, hyperthyroidism, liver disease","high_causes":"High LDL, diet (saturated fat), familial hypercholesterolaemia, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.623","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4450","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between harmful (ApoB) and protective (ApoA1) lipoprotein particles. His result of 0.623 is within the lower risk category (below 0.7), though above the optimal ceiling of 0.6. The ApoA1 at 1.59 is doing its protective job; the priority is bringing the ApoB numerator below 0.9.","low_causes":"High HDL, low LDL, regular exercise","high_causes":"High LDL, low HDL, insulin resistance, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"51.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8017","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a modified LDL particle with an extra protein tail. It is entirely genetically determined and cannot be changed by diet, exercise or currently available medications. His result of 51.31 is above the ideal threshold of 32 but well below the level of approximately 125 nmol/L at which it is generally considered to add meaningful cardiovascular risk. It sits in the slightly increased risk category (32 to 90). This is worth knowing and mentioning to his GP alongside the other lipid results, but it is not a major concern on its own.","low_causes":"Genetic factors (favourable)","high_causes":"Entirely genetic; cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3607","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5238","units":"U/L","description":"Creatine kinase is an enzyme found in muscle and heart tissue, released into the blood when muscle is damaged. His result of 63 is within the optimal range, indicating no muscle damage. The low level is consistent with his current absence of resistance training.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin use, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"14.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4226","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone circulating unbound in the blood. His result of 14.5 is within the optimal range of 14 to 20 but sits at the lower end. With TSH at 3.84 (the pituitary pushing a little harder), this pattern suggests the thyroid is maintaining adequate output but not generating a surplus. Antibodies are negative, so this is not autoimmune. It is most likely an age-related change.","low_causes":"Hypothyroidism, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how much hormone to make. A higher TSH means the pituitary is pushing the thyroid harder. His result of 3.84 is within the laboratory range but above the optimal ceiling of 2.5. With FT4 at the lower end of optimal and FT3 at 5.2, the thyroid is maintaining adequate hormone levels but the pituitary is having to work harder than ideal to achieve this. Both thyroid antibody tests are negative, making autoimmune thyroid disease unlikely. This is consistent with gradual age-related thyroid slowing and does not require treatment at present, but should be monitored annually.","low_causes":"Hyperthyroidism, pituitary disease, excessive thyroid medication","high_causes":"Hypothyroidism, iodine deficiency, ageing, subclinical hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism in every cell. His result of 5.2 is within the optimal range of 4.5 to 6.5, indicating good conversion of the storage hormone T4 to the active T3. This is reassuring despite the above-optimal TSH.","low_causes":"Hypothyroidism, non-thyroidal illness, poor conversion, selenium deficiency","high_causes":"Hyperthyroidism, Graves' disease, T3 thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
