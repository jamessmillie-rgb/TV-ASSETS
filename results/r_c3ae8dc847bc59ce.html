<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Lauren Leader","dob":"10/04/1984","report_date":"2026-11-03","summary":"Patient is a 42-year-old female presenting with a BMI of 33.9, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food daily; portions are larger than average (volume 7 out of 10). She trains four days a week (four cardio, no resistance) at moderate intensity with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours but wakes exhausted or during the night, with an afternoon energy crash; stress feels hard to manage some weeks. She drinks 1 to 4 alcoholic drinks a week. She takes Levothyroxine, prescribed by her fertility clinic to optimise thyroid levels ahead of a planned frozen embryo transfer. She supplements with vitamin D, vitamin B12, magnesium, a multivitamin and probiotics. A previous blood test flagged very low IgA at less than 0.1 g/L. She has had a recent colonoscopy for irregular bowel issues which appeared normal, with the colonoscopy consultant reporting all looked fine. Her symptoms are weight gain and difficulty losing weight, bloating and digestive discomfort, low libido and poor sleep, present for over a year. Her goals are to improve long-term health and longevity, lose body fat and prevent disease. She is particularly interested in understanding whether thyroid function or other underlying factors are contributing to persistent fatigue, disrupted sleep and difficulty losing weight.\n\nThere are two findings in this report that should be discussed with her GP promptly, and we will address those first.\n\nThe first is her IgA, which at less than 0.3 g/L is below the laboratory range of 0.4 to 3.5, confirming the pattern from her previous test where it was less than 0.1. IgA, or Immunoglobulin A, is the antibody that protects the mucosal surfaces of the body: the gut lining, the respiratory tract, the urinary tract and the saliva. It is the immune system's first line of defence at every surface that meets the outside world. A very low IgA can be an isolated finding called selective IgA deficiency, which is the most common primary immune deficiency and affects roughly 1 in 500 people of European ancestry. In many people it causes no symptoms at all, but it is associated with a higher frequency of gut symptoms, bloating and irregular bowel habits, which is directly relevant to the digestive discomfort she describes and to the colonoscopy she has recently undergone. It is also associated with a higher rate of respiratory and urinary tract infections and with autoimmune conditions. Importantly, very low IgA makes the standard coeliac screening test, tissue transglutaminase IgA (tTG-IgA), unreliable. Her tTG-IgA result is negative at 0.2, but because the test depends on the body producing enough IgA to generate the antibody being measured, a negative result in someone with IgA deficiency does not reliably exclude coeliac disease. If coeliac disease has not already been excluded by another method, her GP or gastroenterologist should consider an IgG-based coeliac test or a duodenal biopsy, which may already be covered by the colonoscopy investigation. Her IgG, the other major immunoglobulin, is elevated at 20.4 against an upper limit of 16. This is a recognised compensatory response: when IgA is deficient, the immune system upregulates IgG production to try to fill the gap. The combination of very low IgA with elevated IgG is a classic pattern of selective IgA deficiency with compensatory IgG overproduction, and it should be documented in her medical record so that future clinicians are aware.\n\nThe second finding for her GP is her kidney function. Her cystatin C is 1.19 against an upper limit of 1.1, and the estimated glomerular filtration rate calculated from cystatin C is 67, below the ideal threshold of 90. Cystatin C is a small protein produced at a constant rate by all cells in the body, and because it is filtered by the kidneys and not affected by muscle mass, sex or diet, it gives a more reliable estimate of kidney filtration than creatinine alone, particularly at a higher BMI where creatinine-based calculations can be less accurate. Her creatinine-based eGFR is 71, and the combined creatinine and cystatin C eGFR is 67, so both methods agree that filtration is below the ideal level. At 42 with no history of kidney disease, diabetes or hypertension, an eGFR in the high 60s is not an emergency, but it is below what would be expected and warrants a conversation with her GP. They may wish to check a urine albumin-to-creatinine ratio to look for any protein leak, repeat the kidney markers in three months and check her blood pressure. The reassuring finding here is that her urine is completely clean: no protein, no blood, no casts, no glucose, no bacterial growth, which means there is no sign of active kidney damage at present. Her urea at 6.5, sodium at 135, chloride at 96 and bicarbonate at 24.3 are all within their laboratory ranges, and her uric acid at 355 is within range. This is a finding to monitor rather than to worry about, but it does need to be on the GP's radar.\n\nTurning to the positives in this report, and there are many. Her thyroid function looks excellent on Levothyroxine. TSH, or thyroid stimulating hormone, which is the brain's signal telling the thyroid to produce more hormone, is 1.96, sitting within the optimal range of 1.0 to 2.5 and exactly where a fertility clinic would want it ahead of an embryo transfer. Her free T4, the main hormone the thyroid releases, is 19, comfortably within the optimal band of 14 to 20. Her free T3, the active form that cells actually use, is 5.4, within the optimal range of 4.5 to 6.5, which tells us she is converting T4 to T3 efficiently. Both thyroid antibodies are negative: TPO antibodies are less than 6.6 against a threshold of 13.8, and thyroglobulin antibodies are less than 1.3 against a threshold of 4.4. This means there is no autoimmune attack on the thyroid, which is genuinely reassuring in the context of fertility planning. The thyroid is not the explanation for her fatigue, weight difficulty or poor sleep.\n\nHer liver is in excellent health. ALT at 28 is within the optimal range for women (below 25 is ideal, and 28 is very close), AST at 21 is well within range, and Gamma GT at 18 is comfortably below the optimal threshold of 25. Her FIB-4 score, which estimates liver scarring, is 0.49, well below the threshold of 1.45, and her APRI score is 0.155, confirming no sign of fibrosis. At BMI 33.9, a clean liver panel is a genuine positive because fatty liver disease becomes increasingly common above a BMI of 30, and her liver shows no metabolic strain at all. Her bilirubin at 9 and total protein at 80 are both within range. Albumin at 41 is healthy. Amylase at 66 and lipase at 45, which measure pancreatic function, are both within their ranges, ruling out any pancreatic inflammation.\n\nHer blood count is reassuringly normal. Haemoglobin at 134 is healthy for a woman, red blood cells at 4.41 and haematocrit at 0.392 are within range, and her MCV at 89, MCH at 30.5 and MCHC at 343 show well-formed red cells of normal size and haemoglobin content. Platelets at 339 and MPV at 8.2 are within range. White cell count at 6.01 is healthy, with a good distribution across neutrophils at 2.86, lymphocytes at 2.71, monocytes at 0.33, eosinophils at 0.09 and basophils at 0.02. Reticulocytes, the young red blood cells that show the bone marrow is producing new cells at a healthy rate, are 1.65%, within range. Her IgE at 1.27 is very low, which rules out any significant allergic drive, and her rheumatoid factor at 6 is negative, ruling out rheumatoid arthritis.\n\nHer lipid profile is strong. Total cholesterol at 4.2 is well below the 5.18 threshold. Triglycerides at 0.61 are excellent, well below the ideal of 1.0. HDL, the protective cholesterol that clears excess from the arteries, is 1.5, just below the optimal threshold of 1.6 for women but a healthy level. LDL at 2.41 is within range and below the 3.0 upper limit. Her ApoB, which counts the number of cholesterol-carrying particles in the blood and is the best single measure of cardiovascular risk from lipids, is 0.89, just below the 0.9 threshold, and her ApoB-to-ApoA1 ratio is 0.59, within the lower risk band below 0.6. Her Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) particles to show what is truly modifiable by diet and lifestyle, is 2.13, within range. These are good numbers.\n\nHer cortisol at 439 is within the morning reference range and appropriate. Her oestradiol at 126, progesterone at 1.37, LH at 7.51 and FSH at 8.16 are consistent with the follicular phase of her cycle, which is the phase before ovulation when oestradiol is rising and progesterone remains low. FSH at 8.16 is within the follicular range and does not suggest diminished ovarian reserve at this point, which is relevant to her fertility plans. Testosterone at 1.3 is within the female range of 0.5 to 2.6, and free testosterone at 0.027 is within range. DHEA-S at 5.8 is healthy. Prolactin at 197 is within the non-pregnant range. Her vitamin B12 at 735 is within the optimal range of 500 to 900, reflecting her supplementation. Magnesium at 0.96 is within the optimal range of 0.85 to 1.05. Calcium at 2.44 and corrected calcium at 2.47 are both within range. Creatine kinase at 112 is within range. Her CEA tumour marker at 0.56 is well within range.\n\nHer PhenoAge, a composite biological ageing score built from nine blood markers, is 32.9 against her calendar age of 42, putting her biological age nine years younger than her actual age. This is an excellent result and suggests that despite the symptoms she is experiencing, her underlying biology is in good shape.\n\nNow to the findings that need attention. Her HOMA-IR is 3.25, which is significantly above the threshold of 1.5 and above the 2.9 level that indicates significant insulin resistance. HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting insulin and fasting glucose. Her fasting glucose at 4.8 is within the optimal range, and her HbA1c at 41 mmol/mol is within the normal range below 42, so blood sugar control is currently being maintained. But her fasting insulin at 15.22, while within the laboratory range of 2.6 to 24.9, is nearly double the upper optimal level of 8. What this means is that her pancreas is having to produce a large amount of insulin to keep her blood sugar normal. The glucose looks fine on the surface, but the cost of keeping it fine is high. Insulin resistance is the single most likely explanation for her difficulty losing weight despite eating well and staying active. When insulin is chronically elevated, the body is in storage mode: it preferentially stores fat, resists releasing fat for energy and drives afternoon energy crashes because blood sugar regulation becomes less smooth. This connects directly to three of her four symptoms: the weight that will not shift, the afternoon exhaustion and, through its effects on sex hormone binding globulin, potentially the low libido. Her C-peptide at 2.04 ug/L confirms that the pancreas is genuinely producing this much insulin rather than it being a measurement artefact. Her TyG index at 7.76, another measure of insulin resistance, is within range, and her estimated average glucose at 6.8 is within the normal range but above the optimal of 6.2, which shows glucose control is beginning to drift upwards even though the HbA1c has not crossed the pre-diabetes threshold. This is the stage where lifestyle intervention is most powerful, because the trajectory can be completely reversed. At BMI 33.9 with daily sugar intake and larger-than-average portions, the explanation is straightforward: the diet is providing more glucose than the cells can comfortably absorb, and the pancreas is compensating by producing more insulin. The good news is that this is entirely modifiable.\n\nHer SHBG is 27.3, just below the lower limit of 27.8. SHBG, or sex hormone binding globulin, is a protein produced by the liver that binds to sex hormones and controls how much is free to act on tissues. When insulin is high, SHBG falls, because insulin directly suppresses its production. A low SHBG increases the amount of free testosterone relative to total testosterone, which can contribute to weight gain around the middle, skin changes and hormonal imbalance. Her free androgen index at 4.76 is within range but sits in the upper half, consistent with the low SHBG making more testosterone available. This is driven by the insulin resistance rather than by a primary hormonal problem, and as insulin improves, SHBG should rise.\n\nHer Lp(a) is 86.94 nmol/L, above the ideal of 32 and sitting in the mildly raised band between 75 and 124. Lp(a), or lipoprotein little a, is a type of LDL particle with an additional protein attached that makes it stickier and more inflammatory. Unlike regular LDL, Lp(a) is almost entirely inherited and does not change meaningfully with diet, exercise or weight loss. At 86.94 it is mildly raised and worth mentioning to her GP alongside the rest of her lipid profile. The reassuring context is that her other lipid markers are good: ApoB is below threshold, triglycerides are excellent, and the ApoB-to-ApoA1 ratio is in the lower risk band. Her cardiovascular risk score, a TrueVitals composite index scored from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 35 out of 100, within the acceptable range below 40 but above the ideal of 20, driven primarily by the Lp(a) and the hsCRP at 1.3. The Lp(a) cannot be changed, but the modifiable inputs, particularly hsCRP and HbA1c, can be improved with the lifestyle changes outlined below.\n\nHer ESR is 22, above the upper limit of 12. ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour and is a general marker of inflammation. Her hsCRP at 1.3 is within the laboratory range of less than 5 but above the optimal of less than 1.0, so there is a mild inflammatory signal from two independent markers. At BMI 33.9, a mildly elevated ESR and an above-optimal CRP are most commonly explained by adiposity itself: fat tissue is metabolically active and produces inflammatory signalling molecules. This is not a sign of infection or autoimmune disease given the clinical picture, but it does contribute to the insulin resistance and reinforces the value of gradual fat loss.\n\nHer transferrin at 2.48 is marginally below the lower limit of 2.5. Transferrin is the protein that carries iron in the blood. At 2.48 the shortfall is 0.02, which is within laboratory variation and not clinically significant. Her ferritin at 83 is within the optimal range for women of 40 to 150, serum iron at 13.8 is within range, iron binding capacity at 57.6 is within range, and transferrin saturation at 22.16% is within the laboratory range but just below the optimal of 25%. Iron stores are adequate.\n\nHer Ca19-9 is 46.62, above the upper limit of 37. Ca19-9 is a tumour marker most associated with pancreatic and biliary cancers, but it is one of the least specific tumour markers in routine panels. It can be elevated by benign conditions including ovarian cysts, endometriosis, liver and biliary inflammation, and any condition affecting the gut or peritoneum. Given that she has been under investigation for irregular bowel symptoms and has recently had a colonoscopy, a mildly elevated Ca19-9 is most likely related to whatever gut or gynaecological process has been causing her symptoms. Her pancreatic enzymes, amylase and lipase, are both within range, which argues against a pancreatic cause. Her CEA, the other tumour marker in this panel, is 0.56, well within range, which is additionally reassuring. This result should be mentioned to her GP, and if her colonoscopy biopsies and gynaecological review are unremarkable, a repeat in three to six months to confirm it has settled would be sensible.\n\nHer CA-125 at 31.1 is within the laboratory range of less than 35. CA-125 is a marker associated with ovarian pathology but is also elevated by endometriosis, fibroids, pelvic inflammation and even menstruation. At 31.1 it is within range but sitting in the upper portion, which is worth noting in the context of her fertility journey and bowel symptoms but is not abnormal.\n\nHer vitamin D at 178 nmol/L is well above the sufficient threshold of 50 and above the optimal range of 75 to 120. This reflects her supplementation and is not harmful at this level, but she could reduce her dose to a maintenance level of 1,000 to 2,000 IU daily rather than continuing a loading dose. Her PTH, or parathyroid hormone, which controls calcium balance, is 0.89 against a lower limit of 0.98. PTH is suppressed by high vitamin D levels because when vitamin D drives calcium absorption up, the body reduces PTH to prevent calcium going too high. Her corrected calcium at 2.47 is healthy and within range, so the low PTH is an appropriate physiological response to her high vitamin D rather than a parathyroid problem.\n\nHer folate at 20 is above the upper limit of 17. This is almost certainly from her multivitamin, which typically contains folic acid. In the context of trying to conceive, adequate folate is important for neural tube development, and a level of 20 is not harmful. No action is needed.\n\nHer ALP, or alkaline phosphatase, is 44 against a lower limit of 46. ALP is an enzyme found in the liver, bones and gut. A marginally low ALP at this level is not clinically significant and can be seen with low zinc intake, hypothyroidism (though her thyroid is well managed), or simply normal variation. Her total antioxidant activity at 2.07 is above the upper limit of 1.77, which reflects her supplementation with vitamin D, multivitamin and probiotics. This is a positive finding rather than a concern.\n\nHer globulin at 39 is above the upper limit of 36, but this is entirely explained by the elevated IgG of 20.4. Globulin is calculated by subtracting albumin from total protein, and since IgG makes up the largest fraction of globulin, the elevated IgG from compensatory overproduction in the setting of IgA deficiency pushes globulin above range. This is not a separate finding.\n\nRegarding her symptoms that the blood does not fully explain: her poor sleep and insomnia are the most significant gap between what she reports and what the bloods show. The thyroid is well controlled and not the cause. Cortisol is within the morning range. There is no anaemia, no iron deficiency, no B12 or folate deficiency, no thyroid dysfunction, no significant hormonal imbalance and no evidence of an inflammatory or autoimmune process driving the insomnia. Lifelong intermittent insomnia with multiple night wakings, including nocturia, at 42 with a BMI of 33.9 raises the possibility of sleep-disordered breathing. Obstructive sleep apnoea becomes more common above a BMI of 30 and is a well-recognised cause of unrefreshing sleep, night waking, nocturia, daytime fatigue and afternoon crashes. It is worth discussing with her GP whether a sleep study would be appropriate, particularly given that the fatigue pattern she describes, feeling exhausted despite adequate hours, is characteristic. The daily sugar intake may also be contributing to the afternoon crash through post-meal glucose and insulin spikes, and the insulin resistance itself can drive fatigue through less efficient cellular energy production. Her bloating and digestive discomfort may be partly explained by the IgA deficiency, which reduces mucosal immunity in the gut, but given the ongoing gastroenterological investigation, this is best assessed in conjunction with the biopsy results. Her low libido could be partly related to the chronically disrupted sleep and fatigue rather than a hormonal cause, as her sex hormones are within expected ranges for her cycle phase.","links":"The central thread in this report connects insulin resistance, weight, inflammation and energy. Her HOMA-IR of 3.25 confirms significant insulin resistance, and this is the metabolic engine behind several of her symptoms. When cells become less responsive to insulin, the pancreas compensates by producing more, and chronically elevated insulin drives fat storage, suppresses fat burning, pushes SHBG down (hers is 27.3, just below range) and promotes a low-grade inflammatory state. Her hsCRP at 1.3 and ESR at 22 both show mild inflammation, which at BMI 33.9 is most likely driven by adiposity itself. Adipose tissue produces inflammatory cytokines, and those cytokines in turn worsen insulin resistance, creating a self-reinforcing cycle. The afternoon energy crashes she describes fit neatly into this picture: when insulin is high and glucose regulation is less smooth, post-meal energy dips become more pronounced.\n\nThe second thread is the IgA deficiency with compensatory IgG elevation. Her IgA at less than 0.3 confirms the previous finding of less than 0.1, and her IgG at 20.4, well above the upper limit of 16, shows the immune system compensating. This is a stable inherited pattern rather than a progressive disease, but it has practical consequences: it invalidates the standard coeliac test (her tTG-IgA is negative but cannot be relied upon), it may contribute to the gut symptoms she is being investigated for, and it should be permanently documented. The elevated globulin at 39 is simply a downstream effect of the high IgG and does not represent a separate concern.\n\nThe third thread is the kidney function finding. Her cystatin C at 1.19 and eGFR values in the high 60s stand apart from the insulin and immune stories. At 42 with no known kidney disease, this needs investigation to establish whether it is a true baseline or a transient finding. The clean urinalysis is reassuring, as is the normal urea and the absence of protein in the urine, but the GP should confirm there is no underlying cause such as undiagnosed hypertension.\n\nWhat was excluded matters as much as what was found. Her thyroid is optimally controlled on Levothyroxine with negative antibodies, so it is not driving her symptoms. Her liver is clean despite the elevated BMI. Her iron stores are adequate. There is no anaemia, no B12 or folate deficiency, no coeliac disease detectable by standard screening (though IgG-based testing may be needed), no rheumatoid or autoimmune signal beyond the known IgA deficiency, no evidence of ovarian pathology, and her pancreatic enzymes are normal despite the mildly raised Ca19-9.\n\nThe loose ends are the Ca19-9 at 46.62, which most likely relates to her current bowel investigation or a benign gynaecological process, and the Lp(a) at 86.94, which is inherited and unchangeable but should be noted in her cardiovascular risk profile. Neither needs urgent action, but both need to be recorded and followed.","lifestyle":"Cut the daily sugary food to two or three days a week, then to weekends only. Anchor: when the craving hits on a weekday, replace it with a piece of fruit, a handful of nuts or a square of dark chocolate. Why: daily sugar is the single biggest driver of the fasting insulin of 15.22 and the HOMA-IR of 3.25, and reducing sugar frequency is the fastest way to lower insulin.\nAdd a palm-sized portion of protein to every meal and eat it first, before carbohydrates. Eggs, Greek yoghurt, chicken, fish, cottage cheese or lentils. Anchor: protein goes on the plate before anything else. Why: protein blunts the post-meal insulin spike and keeps you full for longer, which will help with the larger portions and the afternoon crash.\nWalk for 15 minutes after your largest meal of the day. Anchor: plate in the sink, shoes on, even if it is just around the block. Why: a post-meal walk lowers the glucose and insulin response to that meal, directly targeting the insulin resistance.\nAdd two short resistance sessions per week, 20 minutes each. Bodyweight is fine: squats, lunges, press-ups, rows with a resistance band. Anchor: while your son naps or plays, two fixed days. Why: muscle is the body's largest glucose sink, and resistance training improves insulin sensitivity more than any other form of exercise. You have done this before and know it works.\nKeep your morning dog walk at 30 to 60 minutes and try to get outside within the first hour of waking. Why: morning light resets the circadian clock, which directly helps the insomnia and night waking you have experienced most of your life.\nSet a fixed wake time seven days a week, even on weekends, within a 30-minute window. Anchor: alarm at the same time, then outside with the dog. Why: a consistent wake time is the single most effective behavioural intervention for chronic insomnia.\nCut caffeine after midday. If you drink coffee or tea in the afternoon, switch to decaf or herbal. Why: caffeine has a half-life of five to six hours, and afternoon caffeine is a common hidden driver of night waking and unrefreshing sleep.\nAim for a calorie intake of approximately 1,650 to 1,800 kcal per day, with at least 115 to 130 g of protein daily (1.3 to 1.4 g per kg of body weight). This creates a moderate deficit from your estimated maintenance of around 2,200 kcal at your current activity level, enough to lose 0.5 to 0.75 kg per week without compromising energy or fertility. A target weight range of 70 to 75 kg would bring your BMI into the 26 to 28 range, and even the first 5 to 10 kg of loss will meaningfully improve insulin sensitivity.","flags":"IgA less than 0.3 g/L, below the lower limit of 0.4. This confirms previous testing showing less than 0.1 and is consistent with selective IgA deficiency. IgG is 20.4 g/L, above the upper limit of 16, representing compensatory overproduction. The standard coeliac screen (tTG-IgA) is unreliable at this IgA level. GP should document the IgA deficiency permanently, consider IgG-based coeliac testing if not already excluded by biopsy, and be aware of increased mucosal infection susceptibility.\nCystatin C 1.19 mg/L, above the upper limit of 1.1. Creatinine-based eGFR 71, cystatin C eGFR 67, combined eGFR 67, all below the ideal of 90. Urinalysis is clean with no proteinuria. GP should check blood pressure, request a urine albumin-to-creatinine ratio and repeat kidney markers in three months to determine whether this is a stable baseline or requires further investigation.\nHOMA-IR 3.25, above the upper limit of 1.5 and above the 2.9 threshold for significant insulin resistance. Fasting insulin 15.22 mIU/L (within lab range but above optimal of 8). Fasting glucose 4.8 and HbA1c 41 are within normal limits, so glucose control is being maintained at the cost of high insulin output. Lifestyle intervention is the primary treatment at this stage.\nESR 22 mm/hour, above the upper limit of 12. hsCRP 1.3 mg/L, within lab range but above optimal of 1.0. Both consistent with low-grade inflammation driven by adiposity at BMI 33.9.\nCa19-9 46.62 U/mL, above the upper limit of 37. Pancreatic enzymes (amylase 66, lipase 45) are within range. CEA 0.56 is well within range. Most likely related to current bowel investigation or benign gynaecological process. Should be repeated in three to six months once colonoscopy biopsies are reviewed to confirm resolution.\nLp(a) 86.94 nmol/L, above the ideal of 32, in the mildly raised band (75 to 124). Inherited and not modifiable by lifestyle. Other lipid markers are good: ApoB 0.89, triglycerides 0.61, ApoB/A1 ratio 0.59. Worth recording and mentioning to GP in the context of overall cardiovascular risk.\nSHBG 27.3 nmol/L, marginally below the lower limit of 27.8. Driven by insulin resistance suppressing hepatic SHBG production. Expected to improve as insulin sensitivity improves.\nTransferrin 2.48 g/L, marginally below the lower limit of 2.5. Clinically insignificant at this margin, with ferritin, iron and saturation all within range.\nPTH 0.89 pmol/L, below the lower limit of 0.98. Appropriate physiological suppression by vitamin D at 178 nmol/L. Corrected calcium 2.47 is within range. Not a parathyroid problem.\nFolate 20 ng/mL, above the upper limit of 17. From supplementation. Appropriate in the context of trying to conceive.\nGlobulin 39 g/L, above the upper limit of 36. Entirely explained by elevated IgG from compensatory overproduction in IgA deficiency. Not a separate concern.\nALP 44 IU/L, marginally below the lower limit of 46. Not clinically significant at this margin.\nTotal antioxidant activity 2.07 mmol/L, above the upper limit of 1.77. Reflects supplementation. A positive finding.\nCardiovascular Risk Score 35 out of 100, within acceptable range (below 40) but above ideal of 20, driven by Lp(a) and hsCRP. The Lp(a) component is not modifiable.\nReassuring negatives: thyroid function optimal on Levothyroxine with negative antibodies, liver enzymes clean with no fibrosis, no anaemia, iron stores adequate, B12 and folate replete, fasting glucose and HbA1c within normal limits, cortisol appropriate, sex hormones consistent with follicular phase, FSH not suggestive of diminished ovarian reserve, CEA normal, CA-125 within range, IgE low, rheumatoid factor negative, urinalysis clean, creatine kinase normal.","recommendations":"Discuss the confirmed IgA deficiency with your GP. Ask for it to be permanently documented in your medical record, and ask whether IgG-based coeliac testing is needed given that the standard tTG-IgA test is unreliable at your IgA level. This may already be covered by the colonoscopy biopsies.\nDiscuss the kidney function findings: cystatin C 1.19, combined eGFR 67. Ask the GP to check your blood pressure, request a urine albumin-to-creatinine ratio and plan a repeat of kidney markers in three months.\nMention the Ca19-9 at 46.62 to your GP, particularly in the context of the colonoscopy and biopsy results. If biopsies are clear and symptoms settle, a repeat Ca19-9 in three to six months will confirm it has normalised.\nDiscuss the HOMA-IR of 3.25 and fasting insulin of 15.22. Ask whether a formal glucose tolerance test would be useful to check for impaired glucose tolerance, particularly in the context of your fertility plans, as insulin resistance can affect implantation outcomes.\nMention the Lp(a) of 86.94 to your GP for permanent recording in your cardiovascular risk profile. No treatment is needed at present, but it should be factored into any future risk assessment.\nRaise the possibility of a sleep study with your GP. Lifelong insomnia with multiple night wakings, nocturia and unrefreshing sleep at BMI 33.9 fits the profile for obstructive sleep apnoea, which is treatable.\nAim for approximately 1,650 to 1,800 kcal per day with 115 to 130 g of protein, two resistance sessions per week, and the sugar and walking habits described in the lifestyle section. Retest in four to six months with a focus on fasting insulin, HOMA-IR, HbA1c, hsCRP, cystatin C, eGFR, Ca19-9 and a repeat lipid panel to track progress.","supplementation":"Vitamin D3 (cholecalciferol): reduce to 1,000 to 2,000 IU daily, taken with your largest meal. Your vitamin D is 178, well above the optimal range of 75 to 120, so a maintenance dose is all that is needed. Continue through winter and recheck in four to six months to ensure it stays above 75.\nVitamin K2 (MK-7): 100 mcg daily, taken with your vitamin D. K2 directs calcium into bones and teeth rather than soft tissues, and it should always accompany vitamin D supplementation.\nMagnesium glycinate: 300 to 400 mg before bed. Your magnesium at 0.96 is within the optimal range, so this is a maintenance dose. Glycinate is the best form for sleep quality, which is directly relevant to your insomnia.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Your B12 at 735 is within the optimal range of 500 to 900, reflecting your current supplementation. Continue to maintain this level.\nOmega-3 fish oil: 2 g of combined EPA and DHA daily, taken with food. This supports the reduction of hsCRP from 1.3 towards the optimal of below 1.0 and provides a mild anti-inflammatory effect that complements the dietary changes.\nConsider replacing the multivitamin with the targeted supplements above. Multivitamins often contain low doses of many nutrients and may be contributing to the above-range folate and total antioxidant activity without providing therapeutic doses of the things you actually need.\nDo not take iron supplements. Your ferritin at 83 and iron at 13.8 are healthy, and additional iron is not needed.\nThe most important changes from this report are not supplements. They are reducing daily sugar, adding protein to every meal, starting two resistance sessions per week and getting a GP assessment of your kidney function and IgA deficiency.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"54","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4909","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 54 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 54. Weakest systems: immunology 24%, inflammation 35%, vitamins & nutrients 38%. Biggest drags: HOMA-IR, Lipoprotein(a), Vitamin D, Cystatin C.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"32.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"","upper_normal":"47","lower_optimal":"","upper_optimal":"42","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4468","units":"years","description":"PhenoAge is a composite biological ageing score built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 32.9 against a calendar age of 42 means her biological age is nine years younger than her actual age. This is an excellent result and reflects the many positive findings in this report: healthy blood counts, good albumin, well-controlled glucose, low inflammatory markers and normal kidney function by the markers PhenoAge uses. The gap would widen further as hsCRP and glucose control improve.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the risk currently being built, not the ten-year probability of an event. Her score of 35 is within the acceptable range of below 40 but above the ideal of 20. The two main drivers are her Lp(a) at 86.94, which is inherited and ency","high_causes":"Bacterial infection, acute inflammation, stress, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6183","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for targeted immune responses, including antibody production and fighting viruses. Her count of 2.71 is within the optimal range, indicating a well-functioning adaptive immune system.","low_causes":"Viral infections (e.g. HIV), corticosteroids, autoimmune conditions, stress, malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3875","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf pathogens and dead cells, and they play a role in presenting threats to the adaptive immune system. Her count of 0.33 is within the optimal range.","low_causes":"Bone marrow disorders, overwhelming infection","high_causes":"Chronic infection, autoimmune conditions, chronic inflammation, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","low ","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells, filtered freely by the kidneys and not affected by muscle mass, sex or diet. This makes it a more reliable measure of kidney filtration than creatinine, especially at a higher BMI where creatinine can be less accurate. Her cystatin C of 1.19 is above the upper limit of 1.1, and the eGFR calculated from it is 67, below the ideal of 90. This is a finding that should be discussed with her GP. The clean urinalysis is reassuring, as it rules out active kidney inflammation or damage, but the reduced filtration rate needs to be monitored.","low_causes":"Hyperthyroidism, high-dose corticosteroids","high_causes":"Reduced kidney function, inflammation, obesity, diabetes, hypothyroidism, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This is the most accurate eGFR calculation, combining both creatinine and cystatin C to estimate kidney filtration. Her combined eGFR of 67 is above the threshold of 60 that defines chronic kidney disease but below the ideal of 90. Both the creatinine-based eGFR (71) and the cystatin C-based eGFR (67) agree on reduced filtration, making this a consistent and reliable finding. At 42 with no known kidney disease, this needs GP assessment to determine the cause and plan monitoring.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"u
