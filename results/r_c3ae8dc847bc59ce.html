thin_normal":"TRUE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. Her level of 178 is well above the sufficient threshold of 50 and above the optimal ceiling of 120. This reflects her vitamin D supplementation and is not harmful at this level, but she could reduce her dose to 1,000 to 2,000 IU daily as a maintenance level. At BMI 33.9, fat tissue sequesters vitamin D, so she will need to continue supplementing to maintain good levels, but a lower dose should be sufficient now that stores are well built.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption, liver or kidney disease","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"0.89","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3253","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3529","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH, or parathyroid hormone, is released by the four small parathyroid glands behind the thyroid. Its job is to raise calcium levels when they fall too low, by pulling calcium from bone, increasing absorption from the gut (via vitamin D) and reducing calcium loss through the kidneys. Her PTH of 0.89 is just below the lower limit of 0.98. However, this is an appropriate physiological response to her high vitamin D level of 178. When vitamin D is high, calcium absorption increases, and the body correctly reduces PTH to prevent calcium going too high. Her corrected calcium at 2.47 is healthy and within range, confirming that the low PTH is doing its job properly rather than indicating a parathyroid problem.","low_causes":"High vitamin D levels, high calcium, hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, chronic kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"135","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the measured sodium for blood sugar levels, as high glucose can artificially dilute sodium readings. Her corrected sodium of 135 is reported for context. With her normal fasting glucose of 4.8, the correction makes no difference, and the measured sodium of 135 is accurate.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"281.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality measures the concentration of dissolved particles in the blood and reflects hydration and electrolyte balance. Her calculated osmolality of 281.3 is within the optimal range, confirming good hydration and electrolyte balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"735","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5623","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Her level of 735 is within the optimal range of 500 to 900, reflecting her B12 supplementation. This is a healthy level to maintain.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, metformin use, gastric surgery","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7381","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, or vitamin B9, is essential for cell division, DNA synthesis and red blood cell formation. It is critically important in the preconception period and early pregnancy for preventing neural tube defects. Her level of 20 is above the laboratory upper limit of 17, almost certainly from her multivitamin, which typically contains folic acid. In the context of trying to conceive, a good folate level is exactly what is wanted, and 20 is not harmful. No action is needed.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, alcohol, pregnancy, medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, fortified foods, B12 deficiency (folate trapped in cells)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP, or C-reactive protein, is one of the most useful markers of low-grade systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Her level of 1.3 is within the laboratory range of less than 5 but above the optimal of less than 1.0. At BMI 33.9, this level of mild inflammation is most commonly driven by adipose tissue, which produces inflammatory cytokines. A hsCRP between 1 and 3 is associated with moderate cardiovascular risk in population studies. Gradual fat loss and the addition of omega-3 fatty acids should help bring this below 1.0.","low_causes":"Normal finding, weight loss, exercise, statins, omega-3 supplementation","high_causes":"Obesity, infection, autoimmune conditions, cardiovascular risk, metabolic syndrome, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"31.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4443","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA-125 is a protein that can be elevated in ovarian cancer but is also raised by many benign conditions including endometriosis, fibroids, pelvic inflammatory disease, menstruation and liver disease. Her level of 31.1 is within the laboratory range of less than 35. While it is within range, it sits in the upper portion, which is worth noting in the context of her fertility journey and bowel symptoms, but it is not abnormal.","low_causes":"Normal finding","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, menstruation, liver disease, peritoneal inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"3.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting insulin and fasting glucose. It estimates how resistant the body's cells are to insulin's signal to absorb glucose. A score below 1.0 is optimal, below 1.5 is acceptable, above 1.9 indicates early insulin resistance and above 2.9 indicates significant insulin resistance. Her score of 3.25 confirms significant insulin resistance. Her fasting glucose at 4.8 is healthy, which means her pancreas is currently producing enough insulin to keep blood sugar controlled, but the cost of doing so is high: her fasting insulin of 15.22 is nearly double the optimal upper limit of 8. This is the metabolic finding that most directly explains her difficulty losing weight and her afternoon energy crashes. The good news is that insulin resistance at this stage is completely reversible with dietary changes, resistance training and gradual weight loss.","low_causes":"High insulin sensitivity, low carbohydrate diet, very active lifestyle, lean body composition","high_causes":"Obesity, excess carbohydrate and sugar intake, sedentary lifestyle, genetics, polycystic ovary syndrome, chronic stress, poor sleep","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4054","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL, LDL and VLDL. Her level of 4.2 is well within the desirable range of below 5.18 and within the optimal band. Cholesterol is essential for hormone production, cell membranes and vitamin D synthesis; the goal is not to eliminate it but to keep the balance between good and bad cholesterol healthy, which her results show.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, kidney disease, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1794","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily from dietary carbohydrate and sugar. They are the most diet-responsive lipid marker. Her level of 0.61 is excellent, well within the optimal range of below 1.0. This suggests her regular meals are not generating excess triglycerides, which is a genuine positive despite the insulin resistance, as triglycerides are often the first lipid to rise with metabolic problems.","low_causes":"Low fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"Excess carbohydrate and sugar, alcohol, obesity, insulin resistance, hypothyroidism, kidney disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1795","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to tissues. Her level of 0.28 is within the optimal range, consistent with her excellent triglycerides.","low_causes":"Low triglycerides, low fat diet","high_causes":"Excess carbohydrate, obesity, insulin resistance, alcohol, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7212","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective cholesterol that removes excess cholesterol from the arteries and returns it to the liver for processing. Higher is better. Her level of 1.5 is above the desirable minimum of 1.04 but below the optimal threshold of 1.6 for women. Resistance training and moderate weight loss are the most effective ways to raise HDL.","low_causes":"Obesity, inactivity, smoking, high carbohydrate diet, insulin resistance, genetics","high_causes":"Exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5880","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol to tissues. When there is too much LDL, it can deposit cholesterol in artery walls and contribute to cardiovascular disease. Her level of 2.41 is within the optimal range of below 2.6, which is a good result.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3111","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick measure of cardiovascular risk balance. Lower is better. Her ratio of 2.8 is within the optimal range of below 3.5, indicating a healthy balance between total cholesterol and protective HDL.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL Percentage of Total","group":"LIPIDS & CARDIOVASCULAR","result":"35.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8928","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"This shows what percentage of total cholesterol is made up of the protective HDL. Her result of 35.71% is above the minimum of 20% and above the optimal of 28%, meaning more than a third of her cholesterol is the protective type. This is a strong result.","low_causes":"Obesity, inactivity, smoking, insulin resistance","high_causes":"Exercise, genetics, moderate alcohol, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the potentially harmful cholesterol-carrying particles, including LDL, VLDL and Lp(a). Her level of 2.7 is within the optimal range of below 3.2, which is a good result.","low_causes":"Low total cholesterol, high HDL","high_causes":"High LDL, high triglycerides, obesity, insulin resistance, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5357","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5000","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles and is a measure of the number of protective cholesterol carriers in the blood. Her level of 1.5 is above the normal threshold of 1.4, confirming a healthy number of HDL particles.","low_causes":"Low HDL, smoking, obesity, inactivity, insulin resistance, genetics","high_causes":"Exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single best measure of cardiovascular risk from lipids because it counts the actual number of cholesterol-carrying particles that can penetrate and damage artery walls. Every LDL, VLDL and Lp(a) particle carries one ApoB molecule. Her level of 0.89 is just below the desirable threshold of 0.9 but above the optimal of 0.8. Part of this ApoB count is driven by Lp(a) particles (which carry ApoB but cannot be reduced by lifestyle), and her Lp(a)-corrected LDL of 2.13 shows that the modifiable portion of her LDL is actually quite good. Small improvements in diet and the addition of omega-3 fatty acids could help bring this into the optimal band.","low_causes":"Low cholesterol, hyperthyroidism, liver disease","high_causes":"High LDL, genetics, obesity, insulin resistance, hypothyroidism, high saturated fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB:ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.593","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4942","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"","description":"The ApoB-to-ApoA1 ratio compares the number of harmful cholesterol particles to protective ones. It is one of the most powerful predictors of cardiovascular risk. Her ratio of 0.59 is within the lower risk band of below 0.6 for women, which is a positive finding.","low_causes":"High HDL, low LDL, exercise, healthy diet","high_causes":"High LDL, low HDL, obesity, insulin resistance, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"86.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a type of LDL cholesterol particle with an additional protein called apolipoprotein(a) attached to it. This extra protein makes the particle stickier and more prone to depositing in artery walls, and it also promotes blood clotting and inflammation. Unlike regular LDL, Lp(a) is almost entirely genetically determined and does not change meaningfully with diet, exercise or weight loss. Her level of 86.94 is above the ideal of 32, placing her in the mildly raised band between 75 and 124. The reassuring context is that her other lipid markers are good: ApoB is just below threshold, triglycerides are excellent, LDL is within the optimal range and the ApoB-to-ApoA1 ratio is in the lower risk band. This result should be mentioned to her GP and recorded permanently. It is a factor in her overall cardiovascular risk profile but does not require treatment in isolation at this level.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), niacin can reduce levels modestly, kidney disease can raise levels","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"112","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4990","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5905","units":"U/L","description":"Creatine kinase is an enzyme found in muscles, heart and brain. It rises when muscle is damaged, either from injury, intense exercise or certain medications (particularly statins). Her level of 112 is within the optimal range, confirming no muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose permanently attached to it, giving an average blood sugar picture over the previous two to three months. Her result of 6.0% sits right at the upper boundary of normal (below 6.0%), at the threshold of the pre-diabetes range (6.0 to 6.4%). This is consistent with her insulin resistance pattern: the pancreas is currently keeping average blood sugar just within the normal zone, but the trajectory is concerning. With the lifestyle changes in this report, particularly reducing daily sugar and adding resistance training, this number should come down on retest.","low_causes":"Low blood sugar, blood loss, haemolytic anaemia, pregnancy","high_causes":"Insulin resistance, pre-diabetes, diabetes, high sugar diet, stress, illness, some medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Her result of 41 mmol/mol is within the normal range of below 42 but above the optimal of below 36. The pre-diabetes threshold is 42, so she is one point below it. This confirms the insulin resistance pattern and reinforces the importance of the dietary and exercise changes outlined in this report.","low_causes":"Low blood sugar, blood loss, haemolytic anaemia","high_causes":"Insulin resistance, pre-diabetes, diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"15.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5220","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to maintain blood sugar after an overnight fast. Her level of 15.22 is within the wide laboratory range of 2.6 to 24.9 but nearly double the optimal upper limit of 8. This means her pancreas is working hard to keep blood sugar under control, which is the hallmark of insulin resistance. The higher the fasting insulin, the more resistant the cells have become to its signal, and the harder the pancreas must work. This is the most important driver of her difficulty losing weight, as chronically elevated insulin keeps the body in fat-storage mode.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting, type 1 diabetes","high_causes":"Insulin resistance, obesity, high carbohydrate diet, polycystic ovary syndrome, metabolic syndrome, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4283","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is released by the pancreas in equal amounts to insulin. It confirms how much insulin the body is actually producing, as opposed to injected insulin. Her C-peptide of 2.04 ug/L is within the optimal range, confirming that the elevated fasting insulin is genuinely being produced by her pancreas. This rules out any measurement artefact and supports the insulin resistance diagnosis.","low_causes":"Type 1 diabetes, advanced type 2 diabetes (pancreatic exhaustion), fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucose","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting glucose measures the blood sugar level after an overnight fast. Her level of 4.8 is within the optimal range of 4.0 to 5.4. The fact that glucose is well controlled despite significant insulin resistance tells us her pancreas is still compensating successfully. The insulin is doing its job, but the body is requiring too much of it to achieve this result.","low_causes":"Fasting, insulin overdose, adrenal insufficiency, liver disease, alcohol","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, illness, medications (steroids)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4857","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is calculated from HbA1c and gives a picture of what average blood sugar has been over the previous two to three months. Her estimated average glucose of 6.8 mmol/L is within the normal range of below 7 but above the optimal of below 6.2. This is consistent with her HbA1c of 41 sitting just below the pre-diabetes threshold and confirms that blood sugar, while currently controlled, is running higher than ideal and trending in the wrong direction.","low_causes":"Low HbA1c, tight blood sugar control","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is calculated from fasting triglycerides and fasting glucose and is used as a surrogate marker of insulin resistance. Her TyG of 7.76 is within the optimal range, consistent with her excellent triglycerides. Interestingly, the TyG and HOMA-IR can give different signals: the TyG reflects how well the liver is handling fat metabolism (which is good in her case), while HOMA-IR reflects peripheral insulin resistance more directly.","low_causes":"High insulin sensitivity, low triglycerides, low glucose","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5565","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. On Levothyroxine, this is the hormone being replaced. Her level of 19 is within the optimal range of 14 to 20, confirming the dose is providing the right amount of thyroid hormone. This is exactly where a fertility clinic would want it ahead of an embryo transfer.","low_causes":"Hypothyroidism, pituitary disease, non-thyroidal illness, medications","high_causes":"Hyperthyroidism, excessive thyroxine replacement, early pregnancy, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland in the brain. It tells the thyroid how much hormone to produce. When thyroid hormone is low, TSH rises to push the thyroid harder; when thyroid hormone is sufficient, TSH falls. On Levothyroxine, TSH is the key monitoring marker. Her level of 1.96 is within the optimal range of 1.0 to 2.5, and for preconception purposes, a TSH below 2.5 is the recommended target. This confirms her Levothyroxine dose is well-titrated.","low_causes":"Hyperthyroidism, excessive thyroxine replacement, pituitary disease","high_causes":"Hypothyroidism, insufficient thyroxine replacement, recovery from illness, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use for energy, metabolism and temperature regulation. T4 must be converted to T3 before it can work. Her level of 5.4 is within the optimal range of 4.5 to 6.5, confirming that she is converting T4 to T3 efficiently despite taking exogenous thyroxine. This rules out a T4-to-T3 conversion problem as a cause of her fatigue.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, non-thyroidal illness, selenium or zinc deficiency, stress","high_causes":"Hyperthyroidism, T3 supplementation, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies target thyroid peroxidase, an enzyme essential for thyroid hormone production. When positive, they indicate autoimmune thyroid disease (Hashimoto's thyroiditis). Her result of less than 6.6 is well below the threshold of 13.8, confirming no autoimmune attack on the thyroid. This is reassuring and suggests her hypothyroidism may be subclinical or non-autoimmune in origin, or that the Levothyroxine was prescribed purely for preconception optimisation.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, the protein from which thyroid hormones are made. Like TPO antibodies, when positive they indicate autoimmune thyroid disease. Her result of less than 1.3 is well below the threshold of 4.4, confirming no autoimmune thyroid process. Both thyroid antibodies being negative is a genuinely reassuring finding.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.284","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio measures how efficiently the body converts the storage form of thyroid hormone (T4) into the active form (T3). Her ratio of 0.284 is within the optimal range, confirming efficient conversion. This is reassuring on Levothyroxine, as some people on thyroxine replacement do not convert T4 to T3 well, which can leave them symptomatic despite normal TSH and FT4. Her conversion is working well.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca199","name":"Ca19-9","group":"TUMOR MARKERS","result":"46.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6300","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Ca19-9 is a tumour marker most associated with cancers of the pancreas and bile ducts, but it is one of the least specific tumour markers available. It can be elevated by a wide range of benign conditions including ovarian cysts, endometriosis, pancreatitis, cholangitis, any inflammatory process affecting the gut or peritoneum and even benign liver conditions. Her level of 46.62 is above the upper limit of 37. Given that she has been under investigation for irregular bowel symptoms with a recent colonoscopy, this mildly elevated result is most likely related to whatever process has been causing her symptoms. Her pancreatic enzymes, amylase at 66 and lipase at 45, are both within range, which argues against a pancreatic cause. Her CEA at 0.56 is well within range, which is additionally reassuring. This should be mentioned to her GP, and if the colonoscopy biopsies and gynaecological review are unremarkable, a repeat in three to six months to confirm normalisation would be sensible.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, biliary cancer, ovarian cysts, endometriosis, pancreatitis, liver disease, bowel inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1217","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/mL","description":"CEA, or carcinoembryonic antigen, is a tumour marker used in screening for bowel, stomach and other cancers. It can also be raised by smoking and some benign conditions. Her level of 0.56 is well within range, which is a reassuring normal result.","low_causes":"Normal finding","high_causes":"Bowel cancer, stomach cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G","group":"IMMUNOLOGY","result":"20.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8211","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.6316","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections. It is the antibody produced after vaccination and after recovering from an infection. Her level of 20.4 is above the upper limit of 16. This elevation is a recognised compensatory response to her IgA deficiency. When the body cannot produce enough IgA to protect mucosal surfaces, it upregulates IgG production to try to fill the gap. This is not a sign of infection, liver disease or myeloma; it is the immune system adapting to a known deficiency.","low_causes":"Immunodeficiency, medications (immunosuppressants), nephrotic syndrome","high_causes":"Chronic infection, autoimmune conditions, IgA deficiency with compensatory overproduction, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M","group":"IMMUNOLOGY","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. It is the earliest responder and is later replaced by IgG for long-term protection. Her level of 0.8 is within the laboratory range but in the lower portion. IgM is not part of the compensatory response seen with IgA deficiency, so this level is normal.","low_causes":"Immunodeficiency, chronic lymphocytic leukaemia, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A","group":"IMMUNOLOGY","result":"< 0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3226","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects the mucosal surfaces of the body: the gut lining, the respiratory tract, the urinary tract and the saliva. It is the immune system's first line of defence at every surface that meets the outside world. Her IgA at less than 0.3 is below the lower limit of 0.4, confirming the finding from her previous test where it was less than 0.1. This is consistent with selective IgA deficiency, the most common primary immune deficiency, affecting roughly 1 in 500 people of European ancestry. Many people with IgA deficiency have no symptoms at all, but it is associated with a higher frequency of gut symptoms, bloating and irregular bowel habits, which is directly relevant to the digestive discomfort she describes. It is also associated with a higher rate of respiratory and urinary infections and with autoimmune conditions. Critically, very low IgA makes the standard coeliac screening test (tTG-IgA) unreliable. This finding should be permanently documented in her medical record.","low_causes":"Selective IgA deficiency (genetic), medications (immunosuppressants, some anticonvulsants), coeliac disease","high_causes":"Chronic infection, IgA nephropathy, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E","group":"IMMUNOLOGY","result":"1.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0063","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"IgE is the antibody involved in allergic reactions and parasitic infections. Her level of 1.27 is very low, essentially ruling out any significant allergic drive, hay fever, asthma or parasitic infection as contributors to her symptoms.","low_causes":"Normal finding, immunodeficiency","high_causes":"Allergies, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"Rheumatoid factor is an antibody that can target the body's own tissues and is associated with rheumatoid arthritis and other autoimmune conditions. Her level of 6 is well below the threshold of 14, ruling out rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infections, liver disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0139","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the standard screening test for coeliac disease, an autoimmune condition where the immune system attacks the gut lining in response to gluten. Her result of 0.2 is negative at well below the threshold of 7.19. However, this test relies on the body producing adequate IgA to generate a positive result. With her IgA deficiency (less than 0.3), a negative tTG-IgA cannot reliably exclude coeliac disease. If coeliac has not already been excluded by another method such as a duodenal biopsy, an IgG-based coeliac test should be considered.","low_causes":"No coeliac disease, gluten-free diet (can cause false negative)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8794","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the unstable molecules that cause cell damage and ageing. Her level of 2.07 is above the upper limit of 1.77. This is almost certainly from her supplementation with vitamin D, multivitamin and probiotics, which boost antioxidant capacity. An above-range result from supplementation is a positive finding rather than a concern.","low_causes":"Oxidative stress, poor diet, smoking, chronic disease, low fruit and vegetable intake","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca153","name":"CA 15-3","group":"SPECIALIZED TESTS","padding":"1","one_sided":"0.5","low_causes":"","high_causes":"","result":"16","units":"U/ml","lower_normal":"","upper_normal":"30","lower_optimal":"","upper_optimal":"30","within_normal":"TRUE","within_optimal":"TRUE","description":"The result is 16 U/ml, below the laboratory limit of 30.","range_type":"no lower","result_position":"0.2667","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"439","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5398","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and falling through the day. Her morning cortisol of 439 is within the optimal range of 200 to 500, confirming healthy adrenal function. This rules out adrenal insufficiency as a cause of her fatigue.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, long-term steroid use withdrawal","high_causes":"Stress, Cushing's syndrome, steroid use, depression, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"126","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3730","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3540","upper_optimal_position":"0.5726","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen and plays a central role in the menstrual cycle, fertility, bone health, brain function and cardiovascular protection. Her level of 126 is within the follicular phase range of 71.6 to 529.2, which is the phase before ovulation when oestradiol is rising. This is consistent with her regular cycle and appropriate for fertility planning.","low_causes":"Menopause, premature ovarian failure, low body fat, excessive exercise, pituitary disease","high_causes":"Ovulation, pregnancy, oestrogen therapy, ovarian cysts, obesity (aromatisation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4360","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is the hormone that rises after ovulation to prepare the uterine lining for pregnancy. In the follicular phase, before ovulation, it is expected to be low. Her level of 1.37 is within the follicular phase range of 0 to 4.45, confirming she was in the first half of her cycle at the time of testing. To confirm ovulation, progesterone should be tested on day 21 of the cycle, when it should be above 10.62 in the luteal phase.","low_causes":"Follicular phase (normal), anovulation, luteal phase defect, stress","high_causes":"Luteal phase, pregnancy, congenital adrenal hyperplasia, ovarian tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"7.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5097","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"2.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3522","upper_optimal_position":"0.5881","units":"mIU/mL","description":"LH, or luteinising hormone, is produced by the pituitary gland and triggers ovulation in women. In the follicular phase, LH is relatively low before surging to trigger egg release. Her level of 7.51 is within the follicular phase range, consistent with her cycle phase at the time of testing.","low_causes":"Pituitary disease, eating disorders, excessive exercise, stress","high_causes":"Ovulation (midcycle surge), menopause, polycystic ovary syndrome, pituitary tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"8.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5784","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":" function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
