er_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick measure of the balance between total cholesterol and protective HDL. A lower ratio indicates better cardiovascular protection. Daniel's ratio of 1.82 is excellent, reflecting both a low total cholesterol and a high HDL.","low_causes":"Very high HDL, very low total cholesterol, statin therapy","high_causes":"Low HDL, high total cholesterol, metabolic syndrome, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"54.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5484","lower_normal":"20","upper_normal":"100","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5625","upper_optimal_position":"1","units":"%","description":"This expresses how much of Daniel's total cholesterol is composed of the protective HDL fraction. At 54.84%, more than half of his total cholesterol is HDL, which is an exceptionally favourable ratio. In a typical population, HDL makes up around 25 to 30% of total cholesterol.","low_causes":"Low HDL, high LDL or triglycerides, metabolic syndrome","high_causes":"High HDL relative to total cholesterol, statin therapy lowering LDL, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1750","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions, including LDL, VLDL, and remnant cholesterol, in a single number. Daniel's result of 1.4 mmol/L is excellent, well below the 4.0 limit, reflecting the combined success of his statin therapy and metabolic health.","low_causes":"Statin therapy, very low LDL, hyperthyroidism","high_causes":"High LDL, high triglycerides, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"1.2","upper_normal":"2.0","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL cholesterol particles. Higher levels indicate more HDL particles available for reverse cholesterol transport, the process by which cholesterol is removed from artery walls. Daniel's result of 1.4 g/L meets the optimal threshold, consistent with his strong HDL level.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein that sits on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, the ApoB level directly tells us how many potentially harmful particles are circulating, making it arguably the single best marker of cardiovascular risk from lipoproteins. Daniel's result of 0.32 g/L is outstanding, far below both the laboratory limit of 0.9 and the optimal target of 0.8. This means the total number of atherogenic particles in his bloodstream is very low, which is exactly where it needs to be given his elevated Lp(a).","low_causes":"Statin therapy, very low LDL, hyperthyroidism, malabsorption","high_causes":"High LDL particle count, familial hypercholesterolaemia, metabolic syndrome, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1643","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (harmful) particles to protective particles. It is considered one of the strongest predictors of cardiovascular risk from blood lipids. Daniel's ratio of 0.23 is excellent, well below the lower risk threshold of 0.7 and the optimal target of 0.5. This reflects a very favourable balance between harmful and protective lipoproteins.","low_causes":"Very low LDL/ApoB, high HDL/ApoA1, statin therapy","high_causes":"High LDL particle count, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"156.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically inherited lipoprotein particle similar to LDL but with an additional protein called apolipoprotein(a) attached. It contributes to cardiovascular risk through three mechanisms: depositing cholesterol into artery walls, promoting blood clot formation by interfering with the body's clot-dissolving system, and driving inflammation within arteries. Daniel's result of 156.46 nmol/L places him in the moderate-risk category (90 to 200). Lp(a) is determined almost entirely by genetics and does not change meaningfully with diet, exercise, or currently available medications. This result should be recorded permanently in his medical notes and discussed with his GP. First-degree relatives should be offered testing. The positive context here is that all of Daniel's modifiable lipid markers are exceptional, which provides the best possible counterbalance to this inherited risk factor.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (not modifiable by lifestyle or most medications)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1938","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles (VLDL and intermediate-density lipoproteins). These particles are increasingly recognised as independently atherogenic. Daniel's remnant cholesterol of 0.31 mmol/L is within the optimal range of below 0.5, reflecting excellent clearance of triglyceride-rich particles.","low_causes":"Low triglycerides, excellent metabolic health, statin therapy","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, obesity, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1133","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a powerful surrogate marker for insulin resistance and small dense LDL particles. A lower ratio indicates better insulin sensitivity and larger, less harmful LDL particles. Daniel's ratio of 0.34 is excellent, well within the optimal range of below 0.87, and is consistent with his outstanding HOMA-IR and overall metabolic profile.","low_causes":"High insulin sensitivity, low triglycerides, high HDL, excellent metabolic health","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0700","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. It is one of the best single markers of systemic inflammatory burden and is independently associated with cardiovascular risk. Daniel's result of 0.7 mg/L is below the optimal 1.0 threshold, indicating very low systemic inflammation. This is a reassuring finding that speaks to overall metabolic and cardiovascular health.","low_causes":"Low inflammatory burden, healthy lifestyle, statin use (statins have mild anti-inflammatory effects)","high_causes":"Acute infection, chronic inflammation, obesity, metabolic syndrome, autoimmune disease, cardiovascular disease, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red blood cells to clump together and fall more quickly. Daniel's ESR of 2 mm/hour is about as low as this marker gets, confirming the absence of significant systemic inflammation alongside his low hs-CRP.","low_causes":"Low inflammatory burden, polycythaemia, sickle cell disease","high_causes":"Infection, autoimmune disease, cancer, chronic kidney disease, anaemia, pregnancy, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5513","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5179","units":"mmol/L","description":"Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve function. Daniel's result of 144 mmol/L is within the optimal range, indicating well-regulated fluid balance.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, severe vomiting or diarrhoea, heart failure, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, kidney disease, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Both high and low levels can be dangerous, particularly for the heart. Daniel's result of 4.4 mmol/L is within the optimal range, indicating well-balanced potassium levels.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low dietary intake, certain medications","high_causes":"Kidney disease, potassium-sparing diuretics, ACE inhibitors, excessive supplementation, haemolysed blood sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5179","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. Daniel's result of 99 mmol/L is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, diuretics, overhydration","high_causes":"Dehydration, kidney disease, meta nge_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result for the albumin level, giving a more accurate picture of biologically active calcium. Since calcium binds to albumin in the blood, low albumin can make total calcium appear falsely low. Daniel's corrected calcium of 2.53 mmol/L is within the optimal range and consistent with his uncorrected calcium, confirming healthy calcium homeostasis.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5718","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3471","upper_optimal_position":"0.6161","units":"mmol/L","description":"Phosphate works with calcium for bone health and plays a critical role in energy production (ATP), DNA synthesis, and acid-base balance. Daniel's result of 1.4 mmol/L is within the optimal range.","low_causes":"Vitamin D deficiency, hyperparathyroidism, refeeding syndrome, alcoholism, diabetic ketoacidosis","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5862","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar regulation, blood pressure control, and protein synthesis. It is also essential for sleep quality. Daniel's result of 0.97 mmol/L is within the optimal range of 0.85 to 1.05. Despite adequate serum levels, supplementing with magnesium glycinate at bedtime could still benefit his reported sleep difficulties, as serum magnesium does not fully reflect intracellular stores.","low_causes":"Alcohol use, diuretics, proton pump inhibitors, poor dietary intake, intense exercise, diabetes","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"178","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1830","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2721","upper_optimal_position":"0.8224","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods (red meat, organ meats, shellfish) and produced naturally by the body. High levels can lead to gout and kidney stones and are associated with cardiovascular risk. Daniel's result of 178 umol/L is below the laboratory lower limit of 220. Low uric acid is rarely clinically significant and can be seen with good hydration, lower purine intake, or individual variation. Some research suggests low uric acid may actually be favourable for cardiovascular and kidney health. No action is needed.","low_causes":"Good hydration, low purine diet, Wilson's disease (rare), Fanconi syndrome (rare), high-dose aspirin","high_causes":"High purine diet, alcohol (especially beer), kidney disease, metabolic syndrome, gout, dehydration, certain medications (diuretics)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate and reflects the balance of measured and unmeasured ions in the blood. It helps identify metabolic acidosis and its causes. Daniel's calculated anion gap of 24.0 mmol/L is above the standard 8 to 16 range. However, the standard anion gap formula using potassium can yield higher values, and different laboratories use different reference ranges (some use 3 to 22 when potassium is included). Importantly, Daniel's bicarbonate is completely normal at 25.4, which rules out significant metabolic acidosis. His individual electrolytes are all within their respective ranges. This elevated value is most likely an artefact of the calculation rather than a clinical concern, but it is noted for completeness.","low_causes":"Low albumin, bromide poisoning (rare), laboratory error","high_causes":"Metabolic acidosis (diabetic ketoacidosis, lactic acidosis, renal failure, toxin ingestion), dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.2","within_normal":"TR 5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"FT3 (free triiodothyronine) is the most biologically active thyroid hormone. It is produced primarily by converting FT4 in the liver, kidneys, and other tissues. Daniel's FT3 of 5.6 pmol/L is within the optimal range of 4.5 to 6.5, confirming that his body is effectively converting T4 to T3 and that his tissues are receiving adequate thyroid hormone stimulation.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion (illness, low selenium, ageing), calorie restriction","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are autoantibodies that target the thyroid enzyme responsible for producing thyroid hormones. Their presence suggests autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Daniel's result is below 6.6 U/ml, well within the normal range, ruling out TPO-mediated autoimmune thyroid disease.","low_causes":"Normal finding, no autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyrogl rs vitamin D), malabsorption, kidney disease, inadequate supplementation","high_causes":"Supplementation, excessive sun exposure, granulomatous diseases (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5555","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to release calcium from bones, increase kidney reabsorption, and activate vitamin D. Daniel's PTH of 1.6 pmol/L is within the optimal range, which is expected given his excellent vitamin D and calcium levels. The calcium-PTH-vitamin D axis is functioning well.","low_causes":"Hypoparathyroidism (post-surgery, autoimmune), high calcium, high vitamin D","high_causes":"Hyperparathyroidism (adenoma), vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"283","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3781","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6160","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and cellular energy production. It is found primarily in animal products and can become deficient in people with poor absorption (common with age), certain medications, or restrictive diets. Daniel's result of 283 pg/ml is bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

  if(norm(dob.value)===norm(data.dob)){

    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
