<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Daniel Goss-Custard","dob":"16/05/1973","report_date":"2026-09-04","summary":"Daniel is a 53-year-old male presenting with a BMI of 25.5, following a standard mixed diet rated 8 out of 10 for quality with a volume of 7 out of 10. He trains five times per week, three cardio sessions and two resistance sessions, with 10,000 to 15,000 daily steps. He takes a statin and an oral anticoagulant (warfarin). He reports poor sleep and insomnia, hair thinning and hair loss, and low energy and fatigue. His goals are to build muscle, lose body fat, and improve long-term health and longevity.\n\nThe single most important finding in this report is a significantly elevated Lipoprotein(a), commonly written as Lp(a). His result is 156.46 nmol/L, well above the 32 nmol/L threshold and placing him in the moderate-risk category. Lp(a) is a genetically inherited lipoprotein particle that is structurally similar to LDL cholesterol but carries an additional protein called apolipoprotein(a). It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls much like LDL does, it promotes blood clot formation by interfering with fibrinolysis (the body's natural clot-dissolving process), and it drives localised inflammation within the arterial lining. Because Lp(a) is genetically determined, it does not change with diet, exercise, or standard medications, and it remains essentially fixed for life. This result should be recorded permanently in Daniel's medical notes and discussed with his GP. It would also be worth recommending that first-degree relatives, particularly siblings and children, have their own Lp(a) tested, since approximately half will carry the same elevated level. The good news, and it is genuinely significant good news, is that every other lipid marker in this report is exceptional, meaning the modifiable component of Daniel's cardiovascular risk is extremely well controlled.\n\nThat lipid profile deserves proper recognition. His total cholesterol is 3.1, his LDL is just 1.09, and his ApoB, the protein that sits on every atherogenic lipoprotein particle and is considered the single best measure of how many potentially harmful particles are circulating, is 0.32 g/L against a target of below 0.9. That is outstandingly low. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls and returns it to the liver, is 1.7, comfortably within the optimal range for a man. His triglycerides are 0.57, his TG/HDL ratio is a near-perfect 0.34, and his remnant cholesterol, the fraction left after subtracting LDL and HDL from total cholesterol, is just 0.14. His ApoB to ApoA-I ratio is 0.23, which is about as low as that ratio gets. The statin is clearly doing excellent work here, and these numbers represent some of the cleanest modifiable lipid markers we see. In the context of his elevated Lp(a), this is precisely where his modifiable lipids need to be, and they are there already.\n\nHis glucose metabolism is in excellent shape. Fasting glucose is 4.7 mmol/L, sitting within the optimal range. His HbA1c, a measure of average blood sugar over the preceding two to three months, is 40 mmol/mol, just under the 42 threshold that marks the beginning of pre-diabetes. His fasting insulin is 4.25 mIU/L, and his HOMA-IR, a calculation that estimates how sensitive his cells are to insulin, is 0.89, firmly in the insulin-sensitive category. His C-Peptide, a byproduct of insulin production that reflects how much insulin the pancreas is making, came back at 0.966 ug/L (approximately 320 pmol/L), marginally below the laboratory lower limit of 1.1 ug/L. In the context of a normal fasting glucose, an HbA1c that is well controlled, and excellent insulin sensitivity, this low C-Peptide simply reflects that the pancreas does not need to produce much insulin because the body is using what it makes very efficiently. His HOMA-B, a calculation estimating beta cell function, is 70.8, which sits below the 80 to 200 reference range, but again this is consistent with low insulin demand rather than pancreatic insufficiency. These are markers to keep an eye on over time, but at present they paint a picture of a metabolically efficient system.\n\nHis kidney function is solid. His creatinine-based eGFR is above 90, and his Cystatin C-based eGFR, which is a more precise measurement that is not influenced by muscle mass, is 92. That is right at the threshold of the optimal range for a 53-year-old and represents healthy kidney function. Electrolytes are well balanced, with sodium, potassium, chloride, and bicarbonate all within their respective ranges, and his anion gap calculates to 24, which sits above the standard 8 to 16 range. However, anion gap can be influenced by albumin concentration, and given that every individual electrolyte is normal and there is no metabolic acidosis (his bicarbonate is 25.4, completely normal), this is not clinically significant. His uric acid at 178 umol/L is below the laboratory lower limit of 220. Low uric acid is rarely a concern and can be seen with good hydration, lower purine intake, or simply individual variation. It does not require any action.\n\nHis liver panel is largely reassuring but warrants a closer look at one marker. His GGT at 38 is within the laboratory range of 4 to 73, but it sits above the optimal threshold of 25 IU/L. His ALT, the enzyme most specific to liver cell stress, is 47, which is within the laboratory upper limit of 56 but above the optimal male threshold of 30. AST is 33, alkaline phosphatase is 90, bilirubin is 13, and albumin is 41, all within range. His FIB-4 score, a calculation that combines age, platelets, ALT, and AST to estimate the likelihood of liver fibrosis, is 1.23, comfortably below the 1.45 threshold. His amylase and lipase, markers of pancreatic health, are both normal. The combination of an ALT of 47 and a GGT of 38 is not alarming, but both being above their optimal thresholds suggests the liver is doing a bit more metabolic work than ideal. Daniel is on both a statin and warfarin, both of which are metabolised through the liver, and this alone could explain the mild elevation. It would be worth mentioning these values to his GP at his next medication review simply as context, but they do not suggest liver disease.\n\nHis inflammation markers are reassuring. High-sensitivity CRP (hs-CRP), a measure of systemic inflammation, is 0.7 mg/L, below the optimal 1.0 threshold, which indicates very low inflammatory burden. His ESR, the erythrocyte sedimentation rate, is just 2, about as low as that marker goes. Together these suggest no significant chronic inflammation.\n\nHis thyroid is working well. TSH at 1.87 sits within the optimal 1.0 to 2.5 range, FT4 at 18.6 is within the optimal band, and FT3 at 5.6 is also optimal. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. Given that Daniel reports fatigue and poor sleep, it is useful to know that the thyroid is not the explanation.\n\nHis full blood count is largely healthy. Haemoglobin at 151 is well within the male range, red blood cell count, haematocrit, MCV, MCH, and MCHC are all normal. His white cell count is 5.58 with a healthy differential, giving a neutrophil-to-lymphocyte ratio (NLR) of 1.64, within the optimal range. Platelets at 207 and MPV at 8.8 are both normal. The one finding of note is his absolute reticulocyte count at 42.5, which is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a count below 50 suggests the marrow is producing red cells at a slightly reduced rate. Given that his haemoglobin, iron studies, B12, and folate are all adequate, this is most likely a mild age-related slowing of erythropoiesis and is not clinically significant in isolation. It is worth tracking at his next blood test.\n\nHis iron studies are well balanced. Ferritin at 126 ng/ml sits within the optimal male range of 50 to 200, serum iron is 16.2, transferrin is 2.54, and transferrin saturation is 25.4%, right at the lower edge of the optimal 25 to 40% band. There is no suggestion of iron overload or deficiency.\n\nHis testosterone at 19.1 nmol/L is within the optimal male range of 18 to 30, which is a strong result at 53. His SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues) is 43.8, within the optimal range, and his free androgen index at 43.6 and calculated free testosterone at 0.348 nmol/L both reflect adequate free hormone availability. LH and FSH, the pituitary hormones that drive testicular function, are both normal, and oestradiol at 98 is within range. Progesterone at 1.44 is within the male reference range. Cortisol at 285 nmol/L falls within the expected morning range and does not suggest adrenal dysfunction. DHEA-S at 4.3 umol/L (approximately 1,585 ug/dL) is within range. Prolactin is normal. In short, the hormonal picture is healthy and is unlikely to be contributing to his symptoms.\n\nHis vitamin D at 133 nmol/L is excellent, well within the optimal 75 to 120 range and actually above it, suggesting he is supplementing effectively. His B12 at 283 pg/ml is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism, and sub-optimal levels can contribute to fatigue, which is one of Daniel's reported symptoms. This is an easy win. Folate at 11 ng/ml is within the optimal range. Calcium, corrected calcium, phosphate, magnesium, and PTH are all normal, with magnesium at 0.97 sitting within the optimal 0.85 to 1.05 band.\n\nHis IgE at 158 IU/ml is above the upper limit of 100. IgE is the immunoglobulin associated with allergic responses and, less commonly, parasitic infections. An elevated IgE in a 53-year-old man in the UK most commonly reflects an underlying allergic tendency, which could be environmental (dust mites, pollen, animal dander) or dietary. It does not require urgent action but is worth noting. If Daniel experiences any allergic symptoms such as hay fever, eczema, or unexplained skin reactions, this result provides context. His IgG, IgM, and IgA are all within their respective ranges, and his tissue transglutaminase IgA is negative, effectively ruling out coeliac disease.\n\nHis prostate markers are reassuring. PSA at 1.43 is well below the 3.5 threshold, and his free PSA ratio at 0.287 (28.7%) is above the 0.19 threshold, which is a favourable pattern. His tumour markers CEA and CA 19-9 are both within normal limits. His antioxidant activity is within range at 1.47, and creatine kinase at 122 is normal, suggesting his muscles are recovering adequately from training.\n\nHis urinalysis is entirely clean, with no protein, glucose, blood, white cells, bacteria, or nitrites detected, and urine culture showed no growth.\n\nRheumatoid factor is marked as pending and will need to be reviewed when the result is available.\n\nPutting the whole picture together, Daniel's blood work is predominantly very healthy. His cardiovascular risk from modifiable factors is exceptionally well managed, his glucose metabolism is excellent, his kidneys and thyroid are functioning well, his testosterone is strong for his age, and his inflammation is low. The elevated Lp(a) is the key finding because it represents an inherited, non-modifiable cardiovascular risk factor that should sit permanently on his medical record. His sub-optimal B12 is a straightforward correction that may help with his fatigue. The mildly elevated ALT and GGT are worth monitoring in the context of his medications. The low reticulocyte count and below-range C-Peptide are worth tracking but are not concerning at present. His symptoms of poor sleep, hair thinning, and low energy do not have an obvious single biochemical explanation in this panel. His thyroid is healthy, his testosterone is good, his iron is adequate, and his cortisol is normal. The sub-optimal B12 could be contributing to fatigue, and poor sleep itself is often the primary driver of daytime energy levels, so addressing sleep quality directly may yield the greatest benefit.","links":"Daniel's blood work highlights several areas where targeted action can make a meaningful difference, alongside one finding that needs to go on his permanent medical record.\n\nThe most important conversation to have with his GP is about his Lp(a) result of 156.46 nmol/L. This is a genetically inherited cardiovascular risk factor that does not respond to diet, exercise, or currently available medications including statins. The GP should record this on his medical notes permanently, and Daniel should ensure that any future cardiovascular risk assessments take this into account. First-degree relatives, particularly his children and siblings, should be offered Lp(a) testing because approximately half will carry the same elevated level. There are clinical trials underway for medications that specifically target Lp(a), and this is a space worth watching. In the meantime, the fact that his modifiable lipid markers are outstanding provides the best possible counterbalance.\n\nFor his B12, which at 283 pg/ml is below the optimal 500 threshold, he should start sublingual methylcobalamin at 1,000 mcg daily. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets. This is particularly relevant given his fatigue, as B12 plays a direct role in cellular energy production. A retest in three to four months would confirm levels have risen into the optimal range.\n\nRegarding his sleep, which he reports as poor with insomnia, there is no single blood marker driving this, but practical steps can make a significant difference. Fixing his wake time to the same time every day, including weekends, is the single most powerful intervention for sleep architecture. Getting outside within the first hour of waking exposes the eyes to natural light and anchors the circadian clock. Caffeine should be cut off by early afternoon, as its half-life means a 2pm coffee still has a quarter of its caffeine circulating at 10pm. The bedroom should be cool, around 18 degrees, and as dark as possible. Magnesium glycinate taken 30 to 60 minutes before bed can support sleep onset and is already worth considering for his training recovery. If these measures do not improve his sleep within four to six weeks, a conversation with his GP about further investigation would be worthwhile.\n\nFor his goals of building muscle and losing body fat, his current training structure of three cardio and two resistance sessions with 10,000 to 15,000 daily steps is excellent. At 90 kg and 188 cm with a BMI of 25.5, he is close to a healthy composition already. If fat loss is the priority, a modest caloric deficit of 300 to 500 calories below maintenance would be appropriate. His estimated maintenance calories, based on his weight, height, age, and activity level, are approximately 2,700 to 2,850 kcal per day using a moderate activity multiplier of 1.6. A target of 2,300 to 2,500 kcal per day would create a sustainable deficit. His protein intake should be at least 1.6 g per kg of body weight, which means a minimum of 144 grams of protein per day, ideally spread across three to four meals. Given his goals of muscle building alongside fat loss, pushing closer to 2.0 g per kg (180 grams) would be even better. Protein is the one macronutrient that should not be compromised in a deficit because it preserves lean tissue and supports training recovery.\n\nFor his hair thinning, this panel does not reveal a clear biochemical driver. His iron, ferritin, thyroid function, testosterone, and zinc-related markers are all adequate. Hair thinning in men at 53 is most commonly androgenetic (pattern-related) rather than nutritional. If it is progressing or concerning him, his GP can assess whether further investigation or treatment options are appropriate.\n\nThe mildly elevated ALT of 47 and GGT of 38 should be mentioned at his next medication review. Both his statin and warfarin are liver-metabolised, and these values are consistent with the expected hepatic workload of those medications rather than liver disease. His FIB-4 score is reassuring, but periodic monitoring is sensible for anyone on long-term hepatically cleared medications.\n\nFor retesting, a follow-up panel in six months would be ideal to confirm that B12 has responded to supplementation, to recheck ALT and GGT trends, to track the reticulocyte count, and to monitor the C-Peptide and HOMA-B trajectory. Lp(a) does not need retesting as it is genetically fixed.","flags":"CARDIOVASCULAR: Lp(a) 156.46 nmol/L (limit below 32). Moderate-risk category. Genetically inherited, non-modifiable. Should be recorded permanently in medical notes. First-degree relatives should be tested. All modifiable lipid markers are excellent: LDL 1.09, ApoB 0.32, HDL 1.7, triglycerides 0.57, ApoB/A-I ratio 0.23.\n\nGLUCOSE AND INSULIN: C-Peptide 0.966 ug/L (approximately 320 pmol/L), below lab lower limit of 1.1 ug/L. HOMA-B calculates to 70.8, below the 80 to 200 range. In context of fasting glucose 4.7, HbA1c 40, and HOMA-IR 0.89, this reflects low insulin demand in an insulin-sensitive individual rather than pancreatic insufficiency. Monitor over time.\n\nLIVER: ALT 47 IU/L (lab limit 56, optimal below 30). GGT 38 IU/L (lab limit 73, optimal below 25). Both above optimal thresholds. Patient takes statin and warfarin, both hepatically metabolised. FIB-4 1.23 (below 1.45), AST 33, ALP 90, bilirubin 13, albumin 41 all within range. No evidence of liver disease, but worth monitoring at medication review.\n\nHAEMATOLOGY: Absolute reticulocytes 42.5 x10^9/L (lower limit 50). Haemoglobin 151, iron studies, B12, and folate all adequate. Likely mild age-related reduction in erythropoietic rate. Monitor.\n\nKIDNEY: Uric acid 178 umol/L (lower limit 220). Low uric acid is rarely clinically significant and may reflect good hydration or dietary pattern. No action needed.\n\nIMMUNOLOGY: IgE 158 IU/ml (upper limit 100). Suggests underlying allergic tendency. IgG, IgM, IgA all normal. No action unless symptomatic.\n\nVITAMINS: B12 283 pg/ml, within lab range but below optimal 500. Supplementation recommended.\n\nPENDING: Rheumatoid factor result to follow.\n\nReassuring negatives: Thyroid function optimal with negative antibodies. Testosterone 19.1 in optimal range. PSA 1.43 with free ratio 28.7%. hs-CRP 0.7, ESR 2. eGFR 92 (Cystatin C). HbA1c 40. HOMA-IR 0.89. Ferritin 126 in optimal range. Coeliac screen negative. Tumour markers normal. Urinalysis clean.","recommendations":"1. Discuss the Lp(a) result of 156.46 nmol/L with your GP and ask for it to be recorded permanently in your medical notes. Recommend Lp(a) testing for your children and siblings.\n\n2. Begin sublingual methylcobalamin (vitamin B12) at 1,000 mcg daily to bring your B12 from 283 into the optimal range above 500. This may help with your fatigue.\n\n3. Mention your ALT of 47 and GGT of 38 at your next medication review with your GP, as both your statin and warfarin are processed through the liver.\n\n4. Address your sleep with fixed wake times, morning light exposure, a caffeine cut-off by early afternoon, and a cool dark bedroom. Consider magnesium glycinate before bed.\n\n5. Target 2,300 to 2,500 kcal per day for gradual fat loss, with a minimum of 144 grams of protein daily, ideally closer to 180 grams.\n\n6. Maintain your current training frequency of five sessions per week and 10,000 to 15,000 daily steps. Consider adding a third resistance session if recovery allows, as this would better support muscle-building goals.\n\n7. Continue your current vitamin D supplementation, as your level of 133 nmol/L confirms it is working well. A maintenance dose of 2,000 IU daily through winter should hold this level.\n\n8. Retest in six months with a focus on B12, ALT, GGT, reticulocyte count, C-Peptide, and the pending rheumatoid factor if not yet received.\n\n9. If hair thinning progresses or is a concern, discuss with your GP for assessment of androgenetic alopecia, as this blood panel does not reveal a nutritional or hormonal cause.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning or with a meal. Daniel's B12 is 283 pg/ml, below the optimal 500 threshold. Sublingual delivery is preferred over oral tablets because it absorbs directly through the mucosa under the tongue, bypassing any potential gut absorption issues. B12 is essential for nerve function, red blood cell maturation, and cellular energy production, and correcting sub-optimal levels may help with his reported fatigue.\n\nMagnesium glycinate: 300 to 400 mg taken 30 to 60 minutes before bed. Daniel's serum magnesium at 0.97 is within the optimal range, but magnesium glycinate specifically supports sleep quality by activating the parasympathetic nervous system and helping to quiet neural activity. Given his reports of poor sleep and insomnia, and given his training load of five sessions per week, this form of magnesium serves a dual purpose of supporting both sleep and muscular recovery. The glycinate form is chosen because it is the least likely to cause gastrointestinal upset and has the best evidence for sleep support.\n\nVitamin D3 (cholecalciferol): 2,000 IU daily, taken with a meal containing fat. Daniel's current level of 133 nmol/L is excellent and above the optimal range, indicating effective current supplementation. A maintenance dose of 2,000 IU through the autumn and winter months should keep his levels in the 75 to 120 optimal band. Always pair with vitamin K2.\n\nVitamin K2 (MK-7): 100 mcg daily, taken alongside vitamin D3. K2 directs calcium into bones and teeth and away from soft tissues and arterial walls. It works synergistically with vitamin D and should always be taken alongside it. Note: Daniel is on warfarin, which works by inhibiting vitamin K-dependent clotting factors. He should discuss vitamin K2 supplementation with his GP or anticoagulation clinic before starting, as it could affect his INR. A consistent, low dose may be manageable with INR adjustment, but this must be medically supervised.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. While Daniel's triglycerides are already excellent at 0.57 and his inflammation is low, omega-3 fatty acids provide cardiovascular benefit that is particularly relevant given his elevated Lp(a). EPA and DHA support endothelial function, reduce platelet aggregation, and have mild anti-inflammatory properties. Again, given his warfarin use, he should mention this to his anticoagulation clinic as fish oil can have a mild additive effect on bleeding risk, though at standard doses this is generally well tolerated.\n\nDaniel should NOT take iron supplements. His ferritin at 126 is in the optimal range and additional iron would risk pushing stores unnecessarily high.\n\nThe most important changes from this report are not supplements. They are recording the Lp(a) result permanently, fixing his sleep routine, hitting his protein targets consistently, and maintaining his excellent training and activity habits.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5893","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body maintains blood sugar balance at rest. Daniel's result of 4.7 mmol/L sits within the optimal range of 4.0 to 5.4, indicating that his body is regulating blood sugar efficiently. This is a key marker for metabolic health and, combined with his HbA1c and HOMA-IR results, paints a picture of excellent glucose control.","low_causes":"Excessive fasting, over-medication with insulin or diabetes drugs, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress response, high carbohydrate intake before testing, certain medications including steroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar levels over the preceding two to three months. Daniel's result of 5.8% is within the normal range (below 6.0%) but above the optimal threshold of 5.4%. This is a longer-term view of glucose control compared to a single fasting glucose reading. While not pre-diabetic, it suggests his average blood sugar is slightly higher than ideal over time, which is worth monitoring.","low_causes":"Iron deficiency anaemia (can falsely lower), haemolytic anaemia, recent blood loss, chronic kidney disease","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes, high carbohydrate diet, reduced physical activity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the internationally standardised unit. Daniel's result of 40 mmol/mol is below the 42 threshold that marks the beginning of pre-diabetes. The optimal range is below 36. While he is safely within the normal range, the result sits above optimal, consistent with the percentage reading. This is not a concern but is a marker to watch at future tests to ensure it trends downward rather than upward.","low_causes":"Iron deficiency anaemia, haemolytic conditions, recent blood transfusion","high_causes":"Sustained elevated blood sugar, insulin resistance, high carbohydrate intake, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3945","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4081","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Lower levels in the context of normal blood glucose indicate excellent insulin sensitivity, meaning the body's cells respond efficiently to insulin's signal. Daniel's result of 4.25 mIU/L is within both the laboratory range and the tighter optimal range of 2 to 8, reflecting that his cells are highly responsive to insulin and the pancreas does not need to work hard. This is one of the most important metabolic markers in the panel.","low_causes":"Very low carbohydrate diet, extended fasting, high insulin sensitivity, type 1 diabetes (in context of high glucose)","high_causes":"Insulin resistance, metabolic syndrome, obesity, high refined carbohydrate diet, polycystic ovarian syndrome, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.966","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2350","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is produced by the pancreas in equal amounts to insulin and serves as a reliable marker of how much insulin the body is making. Daniel's result of 0.966 ug/L (approximately 320 pmol/L) is marginally below the laboratory lower limit of 1.1. However, this needs to be interpreted in context. His fasting glucose is normal, his HbA1c is controlled, and his HOMA-IR shows excellent insulin sensitivity. The low C-Peptide simply reflects that his pancreas does not need to produce much insulin because his tissues are using it so efficiently. This is a marker to track over time rather than a current concern.","low_causes":"High insulin sensitivity with low insulin demand, very low carbohydrate diet, extended fasting, type 1 diabetes (in context of high glucose)","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's effects. A lower score indicates better insulin sensitivity. Daniel's result of 0.89 is firmly in the insulin-sensitive category (below 1.0 is optimal). This means his cells respond efficiently to insulin, requiring less of it to maintain normal blood sugar. At 53 with a BMI of 25.5, this is an excellent finding that speaks to good metabolic health.","low_causes":"Very high insulin sensitivity, very low carbohydrate intake, lean body composition, high physical activity","high_causes":"Insulin resistance, metabolic syndrome, obesity, sedentary lifestyle, high refined carbohydrate diet, chronic stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"70.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2553","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates beta cell function, meaning how effectively the insulin-producing cells of the pancreas are working. It is calculated as (20 x Insulin) / (Glucose - 3.5). Daniel's result of 70.8 sits below the 80 to 200 reference range. In isolation this could suggest the pancreas is underperforming, but in context it tells a different story. When insulin sensitivity is very high, as Daniel's is, the pancreas simply does not need to produce much insulin, and the HOMA-B calculation reflects this low demand rather than true pancreatic insufficiency. His normal fasting glucose and HbA1c confirm the system is working well.","low_causes":"High insulin sensitivity with correspondingly low insulin production, very low carbohydrate diet, early beta cell decline (in context of rising glucose)","high_causes":"Insulin resistance driving compensatory insulin overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4196","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When liver cells are stressed or damaged, ALT leaks into the bloodstream, making it one of the most specific markers of liver health. Daniel's result of 47 IU/L is within the laboratory upper limit of 56 but above the optimal threshold of 30 for men. This mild elevation is most likely related to the metabolic workload of his statin and warfarin, both of which are processed through the liver. His other liver markers and FIB-4 score are reassuring, suggesting no underlying liver disease.","low_causes":"Normal finding, very healthy liver, B6 deficiency (rare)","high_causes":"Fatty liver disease, medications (statins, paracetamol, warfarin), alcohol, viral hepatitis, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3594","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. Unlike ALT, it is not exclusive to the liver, so elevations can come from muscle damage as well as liver stress. Daniel's result of 33 IU/L is well within the laboratory range and within the optimal band. This is reassuring in the context of his mildly elevated ALT, as it suggests the liver is not under significant strain.","low_causes":"Normal finding, B6 deficiency (rare)","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, medications, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2603","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to biliary obstruction, alcohol use, and metabolic stress on the liver. Daniel's result of 38 IU/L is within the male laboratory range of 4 to 73 but above the optimal threshold of 25. GGT is one of the earliest markers to rise when the liver is under increased metabolic demand. In Daniel's case, the most likely explanation is the combined hepatic workload of his statin and warfarin. This is not alarming but is worth monitoring at future blood tests.","low_causes":"Normal finding, very healthy liver","high_causes":"Alcohol consumption, fatty liver disease, medications (especially enzyme-inducing drugs), bile duct obstruction, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6048","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and intestines. Elevated levels can indicate bile duct problems, bone disorders, or liver disease. Daniel's result of 90 IU/L is within both the laboratory range and the optimal band, indicating no biliary or bone-related concerns.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease (Paget's, fractures), liver disease, vitamin D deficiency, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells break down. The liver processes bilirubin for excretion. Elevated levels can indicate liver dysfunction, bile duct obstruction, or excessive red blood cell breakdown. Daniel's result of 13 umol/L is comfortably within range and optimal, indicating healthy bilirubin processing.","low_causes":"Not clinically significant when low","high_causes":"Gilbert's syndrome (benign inherited condition), liver disease, bile duct obstruction, haemolytic anaemia, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6173","units":"g/L","description":"Total protein measures the combined concentration of albumin and globulin in the blood. It reflects nutritional status, liver synthetic function, and immune activity. Daniel's result of 68 g/L is within the optimal range, indicating adequate protein nutrition and healthy liver function.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Chronic inflammation, infection, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and minerals, and maintains fluid balance. It is also one of the best markers of liver synthetic capacity and nutritional status. Daniel's result of 41 g/L is within the optimal range, confirming healthy liver production and adequate nutrition.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), chronic inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulins are a group of proteins including immunoglobulins (antibodies) and transport proteins. They reflect immune function and inflammatory status. Daniel's result of 27 g/L is within the optimal range, suggesting a well-balanced immune system without chronic inflammatory drive.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver cirrhosis, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin/globulin ratio compares the two main protein fractions in the blood. A healthy ratio indicates balanced liver function and immune activity. Daniel's calculated ratio of 1.52 is within the optimal range, confirming healthy protein balance.","low_causes":"Liver disease, immune overactivation, chronic infection, autoimmune disease","high_causes":"Immune deficiency (reduced globulin production)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4241","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis (scarring) using age, platelet count, ALT, and AST. Daniel's score of 1.23 is below the 1.45 threshold, indicating a low probability of significant liver fibrosis. This is reassuring in the context of his mildly elevated ALT and GGT, confirming that while the liver may be working harder due to medications, there is no evidence of structural damage.","low_causes":"Young age, high platelets, low liver enzymes (all positive)","high_causes":"Liver fibrosis or cirrhosis, age over 60 (can inflate score), low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4129","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6129","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. Elevated levels can indicate pancreatic inflammation (pancreatitis). Daniel's result of 51 IU/L is well within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (burned-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4781","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. It is more specific to the pancreas than amylase and is the preferred marker for detecting pancreatic inflammation. Daniel's result of 39 U/L is within the optimal range, confirming healthy pancreatic function alongside his normal amylase.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic cancer, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2994","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL, and VLDL. While the total number matters less than the breakdown between protective HDL and harmful LDL, a level below 5.18 mmol/L is considered desirable. Daniel's result of 3.1 mmol/L is excellent, reflecting the combined effect of his statin therapy and healthy lifestyle. The breakdown of this total is what really matters, and his individual fractions are all in excellent positions.","low_causes":"Statin therapy, hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1676","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the most common form of fat in the bloodstream, derived from dietary fat and carbohydrates. Elevated fasting triglycerides are associated with insulin resistance, metabolic syndrome, and increased cardiovascular risk. Daniel's result of 0.57 mmol/L is well within the optimal range of below 1.0, reflecting excellent metabolic health, good insulin sensitivity, and a well-managed diet.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High carbohydrate or sugar intake, alcohol, obesity, insulin resistance, metabolic syndrome, certain medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides through the bloodstream. It is a precursor to LDL and is associated with cardiovascular risk when elevated. Daniel's result of 0.26 mmol/L is well within the optimal range, consistent with his excellent triglyceride level.","low_causes":"Low triglyceride production, very low fat or carbohydrate diet","high_causes":"High triglycerides, metabolic syndrome, insulin resistance, obesity, alcohol, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5469","lower_normal":"1.04","upper_normal":"2.07","lower_optimal":"1.4","upper_optimal":"2.07","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is often called 'good' cholesterol because it removes excess cholesterol from artery walls and transports it back to the liver for disposal, a process called reverse cholesterol transport. Higher levels are protective against cardiovascular disease. Daniel's resu
