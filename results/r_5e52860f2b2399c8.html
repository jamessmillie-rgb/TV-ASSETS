<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Michael Woodford","dob":"12/11/1986","report_date":"2026-08-24","summary":"Michael is a 39-year-old male presenting with a BMI of 34.7, following a standard mixed diet rated 5 out of 10 for quality with a volume of 7 out of 10. He does not currently engage in any structured cardio or resistance training and averages between 2,000 and 5,000 daily steps. He reports overuse of caffeine or energy drinks. He reports weight gain and difficulty losing weight, low sex drive and libido, and low energy and fatigue. His goals are to lose body fat, build muscle, and improve long-term health and longevity. Michael has added important context: he does not feel his GP has historically given him the full picture when results sit at the low end of the laboratory range, he is going through a demanding work phase, and he wants to know whether he is doing damage that cannot be undone and where he can supplement shortfalls, because in his own words he feels bloody horrendous.\n\nThe finding that needs attention before anything else in this report is his high-sensitivity C-reactive protein, which sits at 15.6 mg/L against an upper limit of 5. CRP is a protein the liver produces in response to inflammation anywhere in the body, and at this level it is significantly elevated. There are two broad explanations. The first is that Michael was fighting an infection or had any kind of acute illness, injury, dental issue, or muscle strain around the time of the blood draw. Even a heavy cold or a pulled muscle can push CRP into the teens for a week or two. The second, if there was no obvious acute trigger, is that this reflects chronic systemic inflammation, which at a BMI of 34.7 with no exercise is a recognised pattern: visceral fat tissue is metabolically active and produces inflammatory signalling molecules continuously. At 15.6, the level is high enough that Michael should mention it to his GP. The most useful next step would be to repeat CRP in six to eight weeks when he is feeling well, to distinguish between an acute spike and a chronic baseline. If it remains elevated on repeat, it changes the cardiovascular risk picture meaningfully.\n\nAlongside the CRP, his IgA is 6.01 g/L against an upper limit of 3.5. IgA is an antibody produced by the immune system, concentrated in the mucous membranes of the gut, airways, and urinary tract. It is the body's first-line defender at surfaces exposed to the outside world. A level this far above range, at nearly twice the upper limit, is unusual and not explained by lifestyle alone. The most common causes are chronic mucosal irritation or stimulation, which can come from gut inflammation, chronic sinusitis, heavy alcohol use, liver disease, or occasionally an underlying immune condition. His liver markers are not severely deranged and his tissue transglutaminase antibody is negative, which makes coeliac disease very unlikely. His IgG and IgE are within range and his IgM sits right at the lower boundary. This isolated, significantly elevated IgA should be discussed with his GP, who may want to repeat it, check serum protein electrophoresis to rule out a monoclonal cause, and consider whether there is a mucosal source of chronic stimulation.\n\nTurning to what is working well, and there is more good news here than Michael might expect. His kidney function is solid: Cystatin C, which is a more reliable measure of kidney filtration than creatinine in someone carrying extra weight, gives an eGFR of 93, which is comfortably above the 90 threshold for full function. His creatinine-based eGFR is above 90 as well. Urea, sodium, chloride, and potassium are all within range, and his urine shows no protein, no glucose, no blood, and no casts, confirming the kidneys are filtering cleanly. His fasting glucose at 4.7 mmol/L is within the ideal range, and his HbA1c at 39 mmol/mol, which reflects average blood sugar over the past three months, sits below the 42 threshold for pre-diabetes. That is a genuine positive at his current weight. His full blood count is reassuringly healthy: haemoglobin at 157, red cells at 5.39, and white cells at 7.35 are all exactly where they should be, and the differential, the breakdown of white cell types, shows a balanced immune system with no suppression or excess in any lineage. His neutrophil-to-lymphocyte ratio calculates to 1.28, which is within the optimal band and suggests the immune system is not under chronic stress from a cellular perspective, even if the CRP tells a different story at the protein level. His iron studies are well balanced: ferritin at 225 sits comfortably in the healthy male range, transferrin saturation at 37.5% is within the ideal window of 25 to 40%, and serum iron and iron binding capacity are both normal. His thyroid is functioning well. TSH at 0.65 sits just above the lower limit, Free T4 at 14.6 and Free T3 at 5.4 are both within range, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His pancreatic enzymes, amylase and lipase, are both comfortably mid-range. His liver shows no sign of fibrosis, with a FIB-4 score of 0.88, and his bilirubin, ALP, and AST are all within range. His PSA at 0.49 is very low, and the free PSA ratio of 32.7% is healthy, meaning the prostate is in excellent shape. His tumour markers CA 19-9 and CEA are both at the bottom of their ranges. His cortisol at 197 is within the morning reference range, his LH and FSH are normal, his prolactin is normal, and his DHEA-S at 6.5 umol/L, which converts to approximately 2,395 ug/dL, is within range. His calcium, corrected calcium, phosphate, and magnesium are all within range, and PTH is normal, meaning calcium metabolism is working as it should. His creatine kinase at 131 is mid-range, his rheumatoid factor is negative, his tissue transglutaminase is negative, and his ESR at 10 is within the normal limit.\n\nNow to the areas that deserve attention and connect directly to how Michael is feeling. His lipid profile paints a consistent picture of cardiovascular risk that is modifiable. His total cholesterol is 5.6 mmol/L, above the desirable threshold of 5.18. His LDL cholesterol, the type that deposits into artery walls, is 3.87 against an upper limit of 3.0. His ApoB, which counts the actual number of atherogenic particles in the blood and is considered a more accurate measure of cardiovascular risk than LDL alone, is 1.09 g/L against a desirable limit of 0.9. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls, is 1.0 mmol/L, which falls below the desirable threshold of 1.04. His Apolipoprotein A1, the protein carried on HDL particles, is 1.1 g/L, just below the 1.2 target. This means the ratio of harmful to protective particles, the ApoB to A1 ratio, is 0.99, which places him in the higher risk category above 0.9. His triglycerides at 1.76 are marginally above the 1.7 fasting threshold, and his VLDL at 0.8 is just above range. His non-HDL cholesterol is 4.6 against a limit of 4.0, and his TC/HDL ratio is 5.6 against a limit of 4.5. Remnant cholesterol calculates to 0.73, which is above the 0.5 optimal target but within the 0.8 upper range. His TG/HDL ratio calculates to 1.76, above the 1.5 upper limit. His Lipoprotein(a) result is pending; this is an inherited marker that will help determine how much of this lipid picture is genetic versus lifestyle-driven, and we will update the report when it arrives. The positive news within this picture is that every single one of these lipid markers is modifiable through the changes Michael wants to make. Weight loss, regular exercise, dietary improvement, and potentially omega-3 supplementation can move all of these numbers meaningfully.\n\nHis HOMA-IR, which is a calculation using fasting insulin and glucose to estimate how sensitive the body's cells are to insulin, is 1.63 against an upper limit of 1.5. His fasting insulin at 7.82 is within the laboratory range but sits above the optimal ceiling of 8, and his C-Peptide at 1.24 ug/L, which converts to 410 pmol/L, confirms the pancreas is producing a moderate amount of insulin to keep glucose controlled. His HOMA-B, which estimates how hard the pancreas is working, calculates to approximately 130, which is within the healthy range of 80 to 200. What this tells us is that at his current weight and activity level, the body is beginning to need more insulin than ideal to keep blood sugar in check. His glucose and HbA1c are still well controlled, so this is not diabetes or pre-diabetes. It is early insulin resistance, the metabolic state that precedes those conditions, and it is entirely reversible with weight loss and exercise. This is exactly the kind of finding Michael was looking for: something that is not yet causing damage but will if left unchecked.\n\nHis ALT at 43 is within the laboratory range of less than 56, but the optimal threshold for men is below 30. ALT is a liver enzyme that rises when liver cells are under stress, and in the context of a BMI of 34.7 with early insulin resistance and elevated triglycerides, a mildly raised ALT is consistent with early non-alcoholic fatty liver, where fat begins to accumulate in liver cells. His GGT at 36 is within the male laboratory range but above the optimal threshold of 25, which fits the same pattern. His AST at 28 is within range, his FIB-4 is reassuringly low at 0.88, and his albumin and bilirubin are normal, so there is no sign of established liver damage or fibrosis. This is the liver telling Michael it is under mild metabolic strain, and like the insulin resistance, it is reversible with weight loss.\n\nHis globulin at 37 is marginally above the upper limit of 36. Globulin includes all the non-albumin proteins in the blood, including immunoglobulins, and his elevated IgA alone would be enough to push this number over the line. The albumin-to-globulin ratio calculates to 1.05, which is just below the lower optimal limit of 1.1, again explained by the high IgA pulling globulin up. This is worth the GP reviewing alongside the IgA finding.\n\nHis testosterone at 15.5 nmol/L is within the laboratory range of 8.4 to 28.7 but falls below the optimal threshold of 18 nmol/L. This is exactly the kind of finding Michael was concerned about: technically in range, but at a level that is associated with the symptoms he is experiencing, specifically low libido, fatigue, and difficulty losing weight. His SHBG at 33.4 is within range, and his free androgen index at 46.4 and calculated free testosterone at 0.334 nmol/L suggest that the testosterone he does have is reasonably available to tissues. The issue is the total level. At 39 with a BMI of 34.7 and no exercise, this is most likely weight-driven: visceral fat contains an enzyme called aromatase that converts testosterone to oestradiol, and his oestradiol at 89 pmol/L, while within range, is on the higher side for a male. Losing body fat and beginning resistance training are the two most effective ways to raise testosterone naturally, and Michael may see a meaningful improvement from those changes alone. If testosterone remains below 18 after six months of consistent weight loss and training, it would be worth discussing with his GP.\n\nHis bicarbonate at 19.9 is fractionally below the lower limit of 20. Bicarbonate is part of the body's acid-base buffering system. At 0.1 below the lower limit, this is almost certainly within normal day-to-day variation, but it can be gently pushed down by high caffeine intake, which Michael reports, because caffeine increases kidney excretion of bicarbonate. It could also reflect mild metabolic stress from carrying extra weight. It is not clinically concerning at this margin but is worth noting.\n\nHis vitamin D at 75 nmol/L is sufficient but sits right at the lower boundary of the optimal range of 75 to 120. At a BMI of 34.7, vitamin D is sequestered in fat tissue and less available to the body, so a level of 75 in someone of his weight is functionally lower than the same level in a lean person. Supplementation through the autumn and winter months would be sensible. His B12 at 364 pg/mL is within the laboratory range but below the optimal threshold of 500. This is another example of the pattern Michael described: technically in range but not at a level associated with optimal energy and neurological function. Given his fatigue, optimising B12 is worthwhile. His folate at 22 ng/mL is above the upper limit of 17, which is not harmful and typically reflects either a folate-rich diet or supplementation.\n\nHis MPV at 12.3 fL is above the upper limit of 10.1. MPV stands for mean platelet volume, which measures the average size of platelets. Larger platelets are younger and more metabolically active, and a raised MPV is associated with increased platelet turnover. It has been linked in research to obesity, insulin resistance, and systemic inflammation, all of which are present in Michael's results. It is a supportive finding rather than something that needs treatment in its own right, and it would be expected to improve as the metabolic picture improves.\n\nHis total antioxidant activity at 1.8 is marginally above the upper limit of 1.77. This measures the blood's overall capacity to neutralise oxidative stress, and a slightly high reading is not a concern. It may reflect dietary antioxidants or the body upregulating its defences in response to the inflammatory state suggested by the CRP.\n\nHis triglycerides at 1.76 are only marginally above the 1.7 fasting threshold, and it is worth noting that even a non-fasting or imperfectly fasted sample can push triglycerides up slightly. His VLDL at 0.8, calculated from triglycerides, is correspondingly marginally above its 0.78 limit. These are not alarming in isolation but contribute to the overall lipid picture.\n\nTo bring this together for Michael: the blood work shows a body that is fundamentally healthy in its organs and major systems. His kidneys, thyroid, pancreas, prostate, bone marrow, and immune cell counts are all working well. The pattern across his results, the elevated CRP, the early insulin resistance, the lipid profile, the mildly raised liver enzymes, the below-optimal testosterone, and the raised MPV, tells one coherent story. It is the metabolic consequence of carrying excess weight at a sedentary activity level during a period of high work stress and high caffeine use. The genuinely reassuring news is that none of this has crossed into disease. His HbA1c is not pre-diabetic. His FIB-4 shows no liver fibrosis. His blood pressure medications are not listed, suggesting he is not yet on treatment for hypertension. He is at the stage where making changes now will have the greatest return, and five years from now he would look back on this report as the moment he caught things early. The two findings that should go to his GP are the CRP at 15.6 for repeat testing, and the IgA at 6.01 for investigation. His Lipoprotein(a) result is still pending and will be added to this report when it arrives; this is an important piece of the cardiovascular puzzle.\n\nLate-arriving results: Lipoprotein(a): 51.52; Bacterial Count: 10^4; Urine Culture and Sensitivities: Moderate growth of Enterococcus faecalis. Your urine culture showed moderate growth of Enterococcus faecalis. This is worth showing to your GP, who can decide whether any treatment is needed, particularly if you have urinary symptoms.","links":"Michael's results point to a clear set of actions, and the good news is that the single most impactful change, losing body fat, will improve almost every flagged marker simultaneously.\n\nStarting with weight and nutrition: at 110 kg and 178 cm with essentially no structured exercise, his estimated maintenance calories sit around 2,750 to 2,850 per day. To lose body fat at a sustainable rate of 0.5 to 0.75 kg per week, a daily intake of 2,100 to 2,300 calories would be appropriate. This is not a crash diet. It is a moderate deficit that preserves muscle and keeps energy levels manageable during a demanding work period. His protein intake should be at least 140 to 160 grams per day, ideally closer to 170 grams, which protects muscle tissue during weight loss and improves satiety. Protein sources should include lean meats, fish, eggs, Greek yoghurt, and legumes. He rated his diet quality at 5 out of 10, and specific improvements that would directly address his lipid profile include increasing soluble fibre intake through oats, barley, beans, lentils, and psyllium husk, which binds cholesterol in the gut and reduces LDL; eating oily fish such as salmon, mackerel, or sardines at least twice per week for omega-3 fatty acids; reducing saturated fat from processed meats, full-fat dairy, and fried foods; and increasing vegetables to at least five portions per day. A realistic initial weight target would be 95 to 100 kg over six to nine months, which would bring his BMI below 30 and is the range where insulin sensitivity, testosterone, and liver fat typically show the most dramatic improvements.\n\nFor exercise, Michael currently does zero structured sessions and walks 2,000 to 5,000 steps per day. The priority is to start, not to start perfectly. A realistic first target would be three resistance training sessions per week, even 30 to 40 minutes each, focusing on compound movements like squats, deadlifts, rows, and presses. Resistance training is specifically recommended over cardio as the primary modality because it directly improves insulin sensitivity in muscle tissue, raises testosterone, builds the metabolically active tissue that burns calories at rest, and has the strongest evidence base for reducing visceral fat. Alongside this, increasing daily steps to 7,000 to 10,000 would add meaningful calorie expenditure without requiring dedicated cardio sessions. Walking after meals is particularly effective for improving post-meal blood sugar handling.\n\nFor his GP, Michael should bring the following specific findings. First, hs-CRP at 15.6 mg/L, which needs a repeat in six to eight weeks when he is well, to establish whether this is an acute spike or a chronic baseline. If it remains elevated on repeat, cardiovascular risk assessment should be updated accordingly. Second, IgA at 6.01 g/L, nearly twice the upper limit of 3.5, which warrants investigation including consideration of serum protein electrophoresis and a review for mucosal sources of chronic immune stimulation. Third, the lipid profile: LDL 3.87, ApoB 1.09, HDL 1.0, ApoB/A1 ratio 0.99, with a note that Lp(a) is pending. The GP should see the full lipid picture and may want to calculate a QRISK score. Michael can explain that he is making lifestyle changes and would like to retest in four to six months before considering pharmacological intervention. Fourth, if lifestyle changes over six months do not bring testosterone above 18 nmol/L, this should be formally reviewed.\n\nFor caffeine, Michael reports overuse of caffeine or energy drinks. High caffeine intake contributes to cortisol dysregulation, sleep disruption, and can worsen anxiety and fatigue in a paradoxical cycle where more caffeine is needed to compensate for the poor sleep it causes. A practical target would be to cap caffeine at 200 to 300 mg per day, equivalent to two to three cups of coffee, consumed before midday. Energy drinks should be replaced with water, sparkling water, or electrolyte drinks without sugar.\n\nFor retesting, the key markers to repeat in four to six months are hs-CRP, full lipid profile including ApoB and Lp(a) if it has not returned by then, HbA1c, fasting insulin with HOMA-IR, ALT and GGT, testosterone, and IgA. This timeframe allows enough time for lifestyle changes to register in the blood work while being soon enough to track progress and catch anything that worsens.","flags":"URGENT FOR GP REVIEW:\n\nhs-CRP: 15.6 mg/L (limit <5). Significantly elevated. Could represent an acute phase response if illness or injury was present at the time of sampling, or chronic systemic inflammation driven by visceral adiposity. Recommend repeat in 6-8 weeks when well. If persistently elevated, cardiovascular risk assessment should be updated.\n\nIgA: 6.01 g/L (range 0.4-3.5). Nearly twice the upper limit. Isolated elevation with IgG and IgE within range and IgM at the lower boundary. Coeliac screen (tTG IgA) is negative. Recommend serum protein electrophoresis to exclude monoclonal gammopathy. Consider mucosal sources of chronic stimulation including gut, respiratory, and hepatic causes.\n\nLIPID PROFILE:\nTotal cholesterol: 5.6 mmol/L (desirable <5.18). LDL: 3.87 mmol/L (range 0.5-3.0). ApoB: 1.09 g/L (desirable <0.9). HDL: 1.0 mmol/L (desirable >1.04). ApoA1: 1.1 g/L (desirable >1.2). ApoB/A1 ratio: 0.99 (desirable <0.7, higher risk >0.9). TC/HDL ratio: 5.6 (desirable <4.5). Non-HDL cholesterol: 4.6 (desirable <4.0). Triglycerides: 1.76 (desirable <1.7 fasting). Lp(a) is pending. Consistent dyslipidaemic pattern with elevated atherogenic particles and low protective particles. Lifestyle modification recommended as first-line intervention with repeat in 4-6 months.\n\nMETABOLIC:\nHOMA-IR: 1.63 (range 0.5-1.5). Early insulin resistance. Fasting glucose 4.7 and HbA1c 39 mmol/mol are both within range, confirming this has not progressed to pre-diabetes. Reversible with weight loss and exercise.\n\nALT: 43 IU/L. Within laboratory range (<56) but above optimal threshold of 30 for males. GGT: 36 IU/L, within range but above optimal of 25. In context of BMI 34.7 with early insulin resistance and elevated triglycerides, consistent with early hepatic steatosis. FIB-4 0.88 is reassuring against fibrosis.\n\nGlobulin: 37 g/L (range 18-36). Marginally above range, likely driven by the elevated IgA.\n\nHORMONAL:\nTestosterone: 15.5 nmol/L. Within laboratory range (8.4-28.7) but below optimal of 18. Consistent with obesity-related suppression with aromatase-driven conversion. Symptomatic (low libido, fatigue, difficulty losing weight). Recommend lifestyle intervention and retest in 6 months.\n\nMINOR:\nBicarbonate: 19.9 mmol/L (range 20-31). Fractionally below range by 0.1. Likely insignificant.\nMPV: 12.3 fL (range 7.1-10.1). Elevated. Associated with obesity, insulin resistance, and systemic inflammation.\nFolate: 22 ng/mL (range 3-17). Above range. Not harmful. Likely dietary or supplemental.\nTAA: 1.8 mmol/L (range 1.3-1.77). Marginally above range. Not clinically significant.\nVLDL: 0.8 mmol/L (desirable <0.78). Marginally above, driven by triglycerides.\n\nPENDING:\nLipoprotein(a): to follow. Report will be updated when result is available.\nUrine bacterial count and culture: to follow.\n\nREASSURING NEGATIVES:\nKidney function preserved (Cystatin C eGFR 93, creatinine eGFR >90). Thyroid function normal with negative antibodies. HbA1c 39, not pre-diabetic. FIB-4 0.88, no liver fibrosis. PSA 0.49 with healthy free ratio. Iron studies balanced. Full blood count normal. Coeliac screen negative. Rheumatoid factor negative. Tumour markers CA 19-9 and CEA at baseline. Urine clean for protein, glucose, blood, and casts.","recommendations":"1. Book a GP appointment to discuss the CRP of 15.6 and the IgA of 6.01. Bring this report. Ask for a repeat CRP in six to eight weeks and serum protein electrophoresis for the IgA.\n\n2. Begin a calorie deficit of 2,100 to 2,300 calories per day with at least 140 to 170 grams of protein daily. Target a weight of 95 to 100 kg over six to nine months.\n\n3. Start resistance training three times per week, focusing on compound movements. This is the single most effective intervention for insulin resistance, testosterone, and body composition.\n\n4. Increase daily steps to 7,000 to 10,000, including a 10 to 15 minute walk after main meals.\n\n5. Improve dietary quality: increase soluble fibre from oats, beans, and lentils; eat oily fish twice per week; reduce processed and saturated fat; increase vegetables to five or more portions daily.\n\n6. Reduce caffeine to no more than 200 to 300 mg per day, consumed before midday. Replace energy drinks with water or sugar-free electrolyte drinks.\n\n7. Begin the supplementation plan outlined below.\n\n8. Retest in four to six months: hs-CRP, full lipid panel with ApoB and Lp(a), HbA1c, fasting insulin, HOMA-IR, ALT, GGT, testosterone, and IgA.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with the largest meal containing fat. At a BMI of 34.7, fat tissue sequesters vitamin D and reduces its availability, so the higher end of the supplementation range is appropriate. His level of 75 nmol/L is at the lower boundary of optimal and will fall through autumn and winter without supplementation. This should be paired with Vitamin K2 (MK-7) at 200 mcg daily, taken at the same time, which directs calcium into bones and teeth rather than allowing it to deposit in arteries.\n\nOmega-3 fish oil: 3 grams of combined EPA and DHA daily, split across two doses with meals. This will help lower triglycerides, raise HDL, reduce systemic inflammation contributing to the elevated CRP, and support cardiovascular health. Choose a high-concentration product to avoid taking excessive capsules.\n\nMagnesium glycinate: 400 mg before bed. His serum magnesium at 0.96 is within the optimal range, but magnesium glycinate specifically supports sleep quality, stress management, and insulin sensitivity, all of which are relevant given his high caffeine intake, demanding work schedule, and early insulin resistance.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. His B12 at 364 pg/mL is within the laboratory range but below the optimal threshold of 500 that is associated with the best energy levels and neurological function. Sublingual delivery bypasses gut absorption variability.\n\nSoluble fibre supplement (psyllium husk): 5 to 10 grams daily, mixed into water and taken before a main meal. This directly lowers LDL cholesterol by binding bile acids in the gut, improves blood sugar handling after meals, and supports the gut microbiome. Start with 5 grams and increase gradually to avoid bloating.\n\nThe most important changes from this report are not supplements. They are losing body fat through a moderate calorie deficit with high protein intake, starting resistance training three times per week, increasing daily movement, and reducing caffeine. These four changes will address the insulin resistance, the lipid profile, the liver enzymes, the testosterone, and likely the CRP and MPV as well. Supplements support the process, but they cannot replace it.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5893","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after a period without eating. It is the body's primary fuel source, and the level is tightly controlled by the hormone insulin. Michael's result of 4.7 mmol/L sits within the ideal range of 4.0 to 5.4, indicating that his blood sugar regulation is functioning well at this point. At a BMI of 34.7, maintaining a healthy fasting glucose is a genuinely positive finding and means the pancreas is keeping up with demand despite the early insulin resistance suggested by his HOMA-IR.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c expressed as a percentage reflects the average blood sugar level over the past two to three months. It measures the proportion of haemoglobin in red blood cells that has glucose attached to it. Below 6.0% is considered normal, 6.0 to 6.4% indicates pre-diabetes, and above 6.5% suggests diabetes. Michael's result of 5.7% is within the normal range, confirming that his long-term blood sugar control has been good over recent months despite the early insulin resistance seen in other markers.","low_causes":"Blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, sustained hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised unit for measuring glycated haemoglobin, which reflects average blood sugar over two to three months. Below 42 is normal, 42 to 47 indicates pre-diabetes, and above 48 suggests diabetes. Michael's result of 39 mmol/mol falls within the normal range, which at his BMI is a reassuring finding confirming that blood sugar management has not yet crossed into pre-diabetic territory.","low_causes":"Blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, sustained hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4115","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4265","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing to keep blood sugar under control in a fasted state. Insulin is the hormone that allows glucose to enter cells for energy. Lower levels generally indicate better insulin sensitivity, meaning the body's cells respond efficiently to insulin's signal. Michael's result of 7.82 mIU/L is within both the laboratory and optimal ranges. However, when combined with his glucose in the HOMA-IR calculation, it reveals that slightly more insulin is needed than ideal to maintain his healthy glucose level, pointing to early insulin resistance.","low_causes":"Type 1 diabetes, low carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, obesity, metabolic syndrome, polycystic ovary syndrome, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"410","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3905","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4663","units":"pmol/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It is a reliable indicator of how much insulin the body is actually producing, because unlike insulin itself, C-Peptide is not cleared by the liver on first pass. Michael's original result of 1.24 ug/L converts to 410 pmol/L. This sits within the laboratory range and indicates that the pancreas is producing a healthy amount of insulin. It is neither overproducing, which would suggest significant insulin resistance, nor underproducing, which would raise concern about pancreatic function.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7100","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or the Homeostatic Model Assessment of Insulin Resistance, is a calculated score using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 indicates excellent insulin sensitivity, 1.0 to 1.5 is acceptable, above 1.9 suggests early insulin resistance, and above 2.9 indicates significant insulin resistance. Michael's score of 1.63 sits above the upper reference limit of 1.5 and is approaching the 1.9 threshold for early clinical insulin resistance. At his current BMI and activity level, this is an expected finding and is fully reversible with weight loss and exercise.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Obesity, sedentary lifestyle, metabolic syndrome, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"130","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5278","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, which are the cells that produce insulin. It is calculated from fasting insulin and glucose. A result within the 80 to 200 range indicates the pancreas is producing an appropriate amount of insulin for the glucose level. Michael's HOMA-B of approximately 130 confirms that his pancreas is working within a healthy capacity and is not being overstressed. The pancreas is keeping up with the insulin demand created by his current metabolic state.","low_causes":"Pancreatic beta cell decline, late-stage type 2 diabetes, type 1 diabetes","high_causes":"Insulin resistance with compensatory hypersecretion, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3839","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so elevated levels indicate liver stress. Michael's result of 43 IU/L falls within the laboratory range of less than 56 but exceeds the optimal threshold of 30 for men. In the context of his BMI, early insulin resistance, and mildly elevated triglycerides, this level is consistent with early hepatic steatosis, where fat begins to accumulate in liver cells. This is reversible with weight loss, and even a 5 to 10% reduction in body weight typically normalises ALT.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver disease, alcohol use, viral hepatitis, medications, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when cells are damaged, but it is less specific to the liver because it is present in other tissues. Michael's AST of 28 is within both the laboratory and optimal ranges, which is reassuring. The fact that his ALT is higher than his AST is a typical pattern in early fatty liver disease, where the liver is mildly stressed but not severely damaged.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver disease, heart attack, muscle damage, alcohol, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2466","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"Gamma GT, or gamma-glutamyl transferase, is an enzyme found in the liver and bile ducts. It is one of the most sensitive markers for liver stress and is particularly responsive to alcohol use, metabolic strain, and fatty liver. Michael's result of 36 IU/L is within the male laboratory range of 4 to 73 but sits above the optimal threshold of 25. In combination with the mildly elevated ALT, this supports the picture of mild metabolic liver strain consistent with his current weight and insulin resistance. It is not at a level that suggests significant liver disease.","low_causes":"Generally not clinically significant","high_causes":"Alcohol use, fatty liver, bile duct obstruction, medications, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and intestines. It is primarily used to assess liver and bone health. Elevated levels can indicate bile duct obstruction, bone disorders, or liver disease. Michael's result of 75 IU/L is comfortably within range, confirming there is no bile duct issue or bone metabolic problem.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, Paget's disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3521","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. It is processed by the liver and excreted in bile. Elevated levels can indicate liver dysfunction, bile duct obstruction, or increased red blood cell breakdown. Michael's bilirubin of 8 umol/L is well within range, confirming healthy liver processing and normal red blood cell turnover.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"62","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins are essential for maintaining fluid balance, transporting substances, and supporting immune function. Michael's total protein of 76 g/L is within range. However, the balance between albumin and globulin is shifted slightly toward globulin, which is discussed in those individual markers.","low_causes":"Liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, immune disorders, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and serves as a marker of liver synthetic function and nutritional status. Michael's albumin of 39 g/L is within the laboratory range but sits just below the optimal threshold of 40. Albumin can be mildly suppressed during inflammation, and given his significantly elevated CRP, this may be contributing to the slightly lower level. It is also a negative acute phase reactant, meaning the body produces less of it when inflammation is active.","low_causes":"Liver disease, inflammation, malnutrition, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin represents all non-albumin proteins in the blood, including immunoglobulins (antibodies), transport proteins, and clotting factors. Michael's globulin of 37 g/L is marginally above the upper limit of 36. This is primarily explained by his significantly elevated IgA of 6.01 g/L, which alone accounts for the excess. The GP should interpret the globulin elevation in the context of the IgA finding.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, immune disorders, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3095","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood and serves as a marker of immune and liver health. A ratio below 1.1 suggests either low albumin or elevated globulin. Michael's ratio of 1.05 is marginally below the lower limit, driven by his elevated globulin from the high IgA. This is not a separate finding but a mathematical consequence of the IgA elevation and mild albumin suppression from inflammation.","low_causes":"Elevated globulin from infection or immune conditions, low albumin from liver disease or inflammation","high_causes":"Immune deficiency, underproduction of globulins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3034","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. A score below 1.3 in adults under 65 suggests low risk of significant fibrosis. Michael's FIB-4 of 0.88 is reassuringly low, indicating that despite the mildly elevated liver enzymes consistent with early fatty liver, there is no evidence of liver fibrosis or scarring. This means the liver changes are early and reversible.","low_causes":"Healthy liver with no fibrosis","high_causes":"Liver fibrosis, cirrhosis, age-related calculation artefact, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4848","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6061","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest carbohydrates. Elevated levels can indicate pancreatic inflammation or obstruction. Michael's amylase of 46 IU/L is comfortably within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis with pancreatic insufficiency, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is a more specific marker for pancreatic health than amylase because it is produced almost exclusively by the pancreas. Michael's lipase of 34 U/L is comfortably within range, further confirming that the pancreas is functioning normally.","low_causes":"Chronic pancreatitis with pancreatic insufficiency","high_causes":"Acute pancreatitis, pancreatic obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5415","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the combined amount of all cholesterol types in the blood, including LDL, HDL, and VLDL. While cholesterol is essential for building cell membranes, producing hormones, and making vitamin D, elevated total cholesterol increases cardiovascular risk. Michael's total cholesterol of 5.6 mmol/L exceeds the desirable threshold of 5.18. The more important detail is the breakdown between harmful and protective fractions, which is covered in the individual lipid markers below.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, obesity, sedentary lifestyle, genetics, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5176","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are a type of fat in the blood that the body uses for energy storage. They rise after eating and are influenced by diet, weight, alcohol, and insulin sensitivity. Michael's triglycerides of 1.76 mmol/L are marginally above the 1.7 fasting threshold. This is consistent with his early insulin resistance, because insulin resistance impairs the liver's ability to clear triglyceride-rich particles efficiently. Reducing refined carbohydrates, losing weight, and increasing omega-3 intake are the most effective ways to lower triglycerides.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, alcohol, insulin resistance, medications, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5128","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, is a cholesterol particle produced by the liver that carries triglycerides to tissues. It is calculated from the triglyceride level and is considered an atherogenic particle, meaning it contributes to plaque formation in arteries. Michael's VLDL of 0.8 is marginally above the 0.78 threshold, consistent with his slightly elevated triglycerides. This is a minor finding that will improve as triglycerides come down with lifestyle changes.","low_causes":"Low-fat diet, good metabolic health","high_causes":"High triglycerides, insulin resistance, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"1.04","upper_normal":"2.08","lower_optimal":"1.4","upper_optimal":"2.08","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is often called the protective cholesterol because it carries excess cholesterol away from artery walls back to the liver for disposal. Higher levels are associated with lower cardiovascular risk. Michael's HDL of 1.0 mmol/L falls below the desirable threshold of 1.04 for men. Low HDL is one of the hallmarks of metabolic syndrome and is strongly associated with obesity, inactivity, and insulin resistance. Regular exercise, particularly aerobic activity, is the single most effective way to raise HDL.","low_causes":"Obesity, sedentary lifestyle, smoking, high carbohydrate diet, insulin resistance, genetics","high_causes":"Regular exercise, moderate alcohol intake, genetics, weight loss","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6573","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the primary carrier of cholesterol to tissues. When LDL particles are in excess, they penetrate artery walls and drive the formation of atherosclerotic plaques, which narrow arteries and increase the risk of heart attack and stroke. Michael's LDL of 3.87 mmol/L is well above the 3.0 upper limit. However, Lp(a) is still pending, and once that result arrives it will clarify how much of this LDL burden is modifiable through lifestyle versus genetically driven. In the meantime, dietary changes, weight loss, and omega-3 supplementation can all meaningfully reduce LDL.","low_causes":"Hyperthyroidism, liver disease, malnutrition, genetic variants","high_causes":"High saturated fat diet, obesity, sedentary lifestyle, genetics, hypothyroidism, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6222","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a summary measure of cardiovascular risk that accounts for both the total cholesterol burden and the protective HDL fraction. A ratio below 4.5 is desirable, and lower is better. Michael's ratio of 5.6 is above the desirable limit, reflecting both elevated total cholesterol and low HDL. This ratio will improve as both components are addressed through weight loss and exercise.","low_causes":"High HDL, low total cholesterol, good metabolic health","high_causes":"Low HDL, high total cholesterol, obesity, sedentary lifestyle, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"17.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4465","lower_normal":"20","upper_normal":"60","lower_optimal":"25","upper_optimal":"60","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6250","upper_optimal_position":"1","units":"%","description":"HDL percentage indicates what proportion of total cholesterol is made up of protective HDL. A value above 20% is desirable, and higher is better. Michael's HDL makes up only 17.86% of his total cholesterol, which is below the 20% minimum. This reflects both the low absolute HDL and the elevated total cholesterol. Improving both through exercise and dietary changes will raise this percentage.","low_causes":"Low HDL, high total cholesterol, obesity, sedentary lifestyle","high_causes":"High HDL, exercise, moderate alcohol intake, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol, and it captures all the atherogenic cholesterol fractions, including LDL and VLDL. Many clinicians consider it a better summary measure of cardiovascular risk than LDL alone because it includes triglyceride-rich remnant particles. Michael's non-HDL of 4.6 exceeds the 4.0 limit, consistent with the overall lipid pattern.","low_causes":"Low total cholesterol, high HDL","high_causes":"Elevated LDL, elevated VLDL, high triglycerides, obesity, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, measuring ApoB effectively counts the total number of particles capable of depositing cholesterol in artery walls. Many experts consider ApoB the single best measure of cardiovascular risk. Michael's ApoB of 1.09 g/L is above the 0.9 desirable limit and in the borderline high category of 1.0 to 1.19. This confirms that there are too many atherogenic particles in his circulation and supports the need for active lipid management.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"High LDL, obesity, insulin resistance, high saturated fat diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4583","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6667","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the primary protein ca
