rried on HDL particles and is essential for reverse cholesterol transport, the process by which excess cholesterol is removed from artery walls and returned to the liver. Higher levels indicate more protective HDL capacity. Michael's ApoA1 of 1.1 g/L is below the 1.2 desirable threshold, consistent with his low HDL. Exercise and weight loss are the most effective ways to raise ApoA1.","low_causes":"Sedentary lifestyle, obesity, smoking, insulin resistance, genetics","high_causes":"Regular exercise, moderate alcohol intake, oestrogen, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7071","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the strongest predictors of cardiovascular risk because it compares the number of harmful atherogenic particles (ApoB) directly against the protective particles (ApoA1). Below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Michael's ratio of 0.99 places him in the higher risk category. This is driven by both an excess of ApoB particles and a deficit of ApoA1. Both sides of this ratio are modifiable through lifestyle changes.","low_causes":"High HDL/ApoA1, low LDL/ApoB, good cardiovascular health","high_causes":"High LDL/ApoB, low HDL/ApoA1, obesity, insulin resistance, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"51.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8050","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), often written Lp(a), is a genetically determined cholesterol particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It is entirely inherited and does not change with diet, exercise, or most medications. Elevated Lp(a) independently increases cardiovascular risk by depositing cholesterol in artery walls, promoting blood clot formation, and driving inflammation. This is an important piece of the puzzle because it will clarify how much of his elevated LDL is genetic versus lifestyle-driven. This result arrived after your report was first published.","low_causes":"Genetic (inherited low levels)","high_causes":"Genetic (inherited high levels), not modifiable by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin resistance and cardiovascular risk. A lower ratio indicates better metabolic health. Michael's TG/HDL ratio of 1.76 is above the 1.5 upper limit, consistent with his early insulin resistance and low HDL. This ratio is one of the most responsive to lifestyle change and should improve meaningfully with weight loss and exercise.","low_causes":"Low triglycerides, high HDL, good insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich remnant lipoproteins, calculated as total cholesterol minus HDL minus LDL. These remnant particles are highly atherogenic and have been shown to directly cause inflammation in artery walls. Michael's remnant cholesterol of 0.73 is within the laboratory range but above the optimal threshold of 0.5 mmol/L. This is consistent with his mildly elevated triglycerides and will improve with the same lifestyle interventions that lower triglycerides.","low_causes":"Low triglycerides, good metabolic health","high_causes":"High triglycerides, insulin resistance, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"15.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is a protein produced by the liver in response to inflammation anywhere in the body. It is the most widely used blood marker for systemic inflammation. Below 1.0 is optimal, 1.0 to 3.0 is average risk, 3.0 to 5.0 is elevated, and above 5.0 suggests either significant chronic inflammation or an acute inflammatory event such as infection or injury. Michael's hs-CRP of 15.6 mg/L is more than three times the upper limit, which is significantly elevated. This could represent an acute event around the time of blood sampling or chronic inflammation driven by visceral adiposity. A repeat test in six to eight weeks when well is essential to distinguish between the two. If chronically elevated, this level substantially increases cardiovascular risk and should inform management alongside the lipid findings.","low_causes":"Good metabolic health, absence of inflammation or infection","high_causes":"Acute infection, injury, obesity, insulin resistance, autoimmune conditions, cardiovascular disease, chronic inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a tube over one hour. It is a non-specific marker of inflammation. A faster rate indicates more inflammation, as inflammatory proteins cause red cells to clump and fall more quickly. Michael's ESR of 10 mm/hour is within range. Interestingly, the ESR being normal while CRP is markedly elevated may suggest an acute inflammatory event rather than a chronic process, as CRP rises and falls much more quickly than ESR. This supports the recommendation to retest CRP in a few weeks.","low_causes":"Polycythaemia, sickle cell disease, extreme leukocytosis","high_causes":"Infection, inflammation, autoimmune disease, malignancy, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5949","units":"mmol/L","description":"Sodium is the major positively charged electrolyte in the blood and is essential for maintaining fluid balance, nerve function, and muscle contraction. It is tightly regulated by the kidneys. Michael's sodium of 140 mmol/L is in the middle of the optimal range, confirming healthy fluid and electrolyte balance.","low_causes":"Excessive fluid intake, heart failure, kidney disease, diuretics, SIADH","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is an essential electrolyte that regulates heart rhythm, nerve signals, and muscle contraction. Levels that are too high or too low can cause dangerous heart rhythm abnormalities. Michael's potassium of 4.6 mmol/L is within the optimal range, confirming healthy electrolyte balance and proper kidney regulation.","low_causes":"Diarrhoea, vomiting, diuretics, excessive sweating","high_causes":"Kidney disease, potassium supplements, ACE inhibitors, haemolysis in sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4744","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.5949","units":"mmol/L","description":"Chloride is a negatively charged electrolyte that works with sodium to maintain fluid balance and acid-base equilibrium. It is the most abundant anion in blood. Michael's chloride of 99 mmol/L is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, SIADH","high_causes":"Dehydration, metabolic acidosis, kidney disease, excessive saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3030","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.6152","units":"mmol/L","description":"Bicarbonate is a key component of the body's acid-base buffering system. It is regulated by the kidneys and lungs to maintain blood pH within a very tight range. Low bicarbonate can indicate metabolic acidosis, where the blood is more acidic than it should be. Michael's bicarbonate of 19.9 mmol/L is fractionally below the lower limit of 20 by just 0.1 mmol/L. At this margin, this is almost certainly within normal day-to-day variation and is not clinically significant. High caffeine intake may contribute marginally by increasing renal bicarbonate excretion.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis, high caffeine intake","high_causes":"Metabolic alkalosis, vomiting, diuretics, COPD","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"25.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9563","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (Sodium + Potassium) minus (Chloride + Bicarbonate) and represents the unmeasured anions in the blood. It helps identify causes of metabolic acidosis. Michael's anion gap calculates to 25.7, which is above the normal range of 8 to 16. However, this calculation is sensitive to the bicarbonate level, and his fractionally low bicarbonate of 19.9 contributes to the elevation. Additionally, his elevated globulin and high IgA could contribute unmeasured anionic proteins. This should be interpreted by the GP in the context of the overall metabolic picture rather than in isolation.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Lactic acidosis, ketoacidosis, renal failure, toxins, unmeasured anions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5263","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. About 99% of the body's calcium is stored in bones, with the remaining 1% circulating in the blood under tight hormonal control by PTH and vitamin D. Michael's calcium of 2.4 mmol/L is within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement to account for the albumin level, because about half of circulating calcium is bound to albumin. When albumin is low, total calcium may appear falsely low. Michael's corrected calcium of 2.48 mmol/L is within the optimal range, confirming that calcium metabolism is healthy.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5311","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3471","upper_optimal_position":"0.6161","units":"mmol/L","description":"Phosphate is a mineral essential for bone formation, energy metabolism (ATP production), and DNA structure. It works in partnership with calcium and is regulated by PTH and vitamin D. Michael's phosphate of 1.3 mmol/L is within the optimal range, confirming healthy mineral metabolism.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5287","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4425","upper_optimal_position":"0.5862","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar regulation, and sleep quality. It is one of the most commonly deficient minerals. Michael's magnesium of 0.96 mmol/L sits within the optimal range of 0.85 to 1.05, which is a positive finding. However, serum magnesium only reflects about 1% of total body magnesium (the rest is in bones and cells), so supplementation is still recommended for its benefits to sleep, stress management, and insulin sensitivity.","low_causes":"Poor diet, alcohol, diuretics, diabetes, chronic diarrhoea, high caffeine intake","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"415","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5306","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5469","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods like red meat, organ meats, and shellfish, as well as produced naturally by the body. High uric acid can crystallise in joints, causing gout, and is also associated with cardiovascular disease, kidney stones, and metabolic syndrome. Michael's uric acid of 415 umol/L is within the laboratory range but above the optimal ceiling of 380. At his BMI and with early insulin resistance, mildly elevated uric acid is common because insulin resistance impairs the kidneys' ability to excrete uric acid efficiently. Weight loss and reducing purine-rich foods and fructose-sweetened drinks will help lower this.","low_causes":"Low purine diet, liver disease, Fanconi syndrome","high_causes":"High purine diet, obesity, insulin resistance, kidney disease, gout, alcohol, fructose intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product formed in the liver when the body breaks down protein. It is filtered out of the blood by the kidneys. Elevated urea can indicate reduced kidney function or dehydration, while low urea may suggest low protein intake or liver disease. Michael's urea of 5.5 mmol/L is well within the optimal range, confirming healthy protein metabolism and kidney clearance.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5470","units":"umol/L","description":"Creatinine is a waste product produced by muscles during normal metabolism and is filtered by the kidneys at a relatively constant rate. It is the standard marker for estimating kidney filtration. Michael's creatinine of 74 umol/L is within the optimal range. In someone with a high BMI but no resistance training, creatinine production is lower than in a muscular individual, which is why Cystatin C provides a more accurate picture of kidney function at this body composition.","low_causes":"Low muscle mass, very lean body composition","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Estimated glomerular filtration rate is calculated from the creatinine level and estimates how efficiently the kidneys are filtering blood. Above 90 is considered normal kidney function, 60 to 89 is mildly reduced, and below 60 requires investigation. Michael's eGFR is reported as greater than 90, confirming healthy kidney filtration from the creatinine perspective.","low_causes":"Kidney disease, dehydration, medications affecting kidney function","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7750","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Cystatin C-based eGFR provides a more accurate estimate of kidney filtration than creatinine-based eGFR because Cystatin C is produced by all nucleated cells at a constant rate and is not influenced by muscle mass, diet, or body composition. This makes it particularly valuable in someone like Michael who carries significant body weight but does no resistance training, where creatinine may underestimate or overestimate kidney function. His Cystatin C eGFR of 93 confirms healthy kidney function above the 90 threshold.","low_causes":"Kidney disease, dehydration, medications affecting kidney function","high_causes":"High cardiac output, hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4909","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all cells and filtered by the kidneys. Unlike creatinine, its production is independent of muscle mass, making it a more reliable marker of kidney function in people with unusual body compositions. Michael's Cystatin C of 1.08 mg/L is within the laboratory range of less than 1.1 but near the upper boundary. This is reflected in his Cystatin C eGFR of 93, which while above the normal threshold of 90 is not as strong as one might expect at 39. Obesity and systemic inflammation can both slightly elevate Cystatin C. This is worth monitoring on the retest to ensure it does not trend upward.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Kidney disease, inflammation, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"157","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Low levels indicate anaemia, which causes fatigue and breathlessness, while very high levels can increase blood viscosity. Michael's haemoglobin of 157 g/L is within the optimal range for a male, confirming that his blood is carrying oxygen efficiently.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, living at high altitude, smoking, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"5.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6297","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. These cells are the primary carriers of haemoglobin and oxygen. Michael's RBC of 5.39 is within the optimal range, confirming healthy red cell production by the bone marrow.","low_causes":"Anaemia, blood loss, bone marrow disorders, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.459","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.49","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6433","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. It correlates closely with haemoglobin and is used to assess hydration status and red cell mass. Michael's haematocrit of 0.459 is within the optimal range.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"83","upper_normal":"101","lower_optimal":"83","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"fL","description":"Mean corpuscular volume measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) may indicate B12 or folate deficiency. Michael's MCV of 85 fL is within the optimal range, indicating normally sized red cells and no nutritional deficiency affecting red cell production.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 deficiency, folate deficiency, alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"29.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin inside each red blood cell. It reflects how well each cell is loaded with oxygen-carrying protein. Michael's MCH of 29.1 pg is within the optimal range.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 deficiency, folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"343","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures the average concentration of haemoglobin within red blood cells. It is one of the most tightly controlled haematological values. Michael's MCHC of 343 g/L is within the laboratory range but near the upper boundary and just above the optimal ceiling of 340. At this margin, this is most likely a minor laboratory variation and is not clinically significant.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, severe dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5905","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"Red cell distribution width measures the variation in size among red blood cells. A higher RDW indicates more variation, which can be an early sign of nutritional deficiency or chronic disease even before MCV becomes abnormal. Michael's RDW of 14.2% is within the laboratory range but above the optimal ceiling of 13.5%. This mild elevat yroidism, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a calculated marker of systemic immune balance. A low ratio indicates a balanced immune system, while a high ratio can indicate acute stress, bacterial infection, or chronic inflammation. Michael's NLR of 1.28 is within the optimal range, which is a positive finding suggesting that at the cellular level the immune system is well balanced despite the elevated CRP.","low_causes":"Good immune health, balanced inflammatory response","high_causes":"Bacterial infection, acute stress, chronic inflammation, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3483","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, immature red blood cells freshly released from the bone marrow. Their percentage reflects how actively the bone marrow is producing new red cells. Michael's reticulocyte percentage of 1.35% is within the optimal range, confirming healthy red cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia, response to EPO","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"72.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5218","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red cells in the blood per litre, providing a more accurate measure of bone marrow red cell production than the percentage alone. Michael's absolute reticulocyte count of 72.77 is within the optimal range.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"37.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5269","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5279","units":"%","description":"Transferrin saturation measures the percentage of the iron transport protein transferrin that is currently loaded with iron. It provides a snapshot of iron availability in the blood. Michael's transferrin saturation of 37.49% sits within the optimal range of 25 to 40%, indicating that iron is being transported efficiently and there is neither a deficiency nor an overload of iron in the circulation.","low_causes":"Iron deficiency, chronic inflammation, chronic disease","high_causes":"Haemochromatosis, iron overload, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4908","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455","upper_optimal_position":"0.6162","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside ferritin, transferrin, and saturation. Michael's serum iron of 20.9 umol/L is within the optimal range.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3489","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6167","units":"g/L","description":"Transferrin is the main protein that transports iron in the blood. The body adjusts transferrin production based on iron needs: when iron is low, transferrin increases to capture more; when iron is plentiful, transferrin decreases. Michael's transferrin of 2.22 g/L is within the laboratory range but at the lower end and below the optimal threshold of 2.3. This is consistent with adequate iron stores (his ferritin is 225), meaning the body has no need to produce extra transport protein. Transferrin is also a negative acute phase reactant, so it can be mildly suppressed by the inflammation indicated by his elevated CRP.","low_causes":"Iron overload, inflammation, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oestrogen use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"51.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4938","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3364","upper_optimal_position":"0.6144","units":"umol/L","description":"Total iron binding capacity measures the maximum amount of iron that transferrin in the blood can carry. It reflects the availability of transferrin and is inversely related to iron stores. Michael's TIBC of 51.9 umol/L is within the optimal range, consistent with balanced iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"225","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5594","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3427","upper_optimal_position":"0.5927","units":"ng/mL","description":"Ferritin is the body's iron storage protein. Each molecule can hold thousands of iron atoms, making it the best single marker of how much iron the body has in reserve. Michael's ferritin of 225 ng/mL is within the laboratory range for men (22 to 322) but sits above the optimal ceiling of 200. Ferritin is also an acute phase reactant that rises during inflammation, so his elevated CRP of 15.6 may be contributing to the level. If CRP normalises on repeat testing and ferritin remains above 200, it is worth monitoring but does not require action at this level. There is no suggestion of iron overload given his normal transferrin saturation.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"197","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3088","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3554","upper_optimal_position":"0.5832","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning to prepare the body for the day and declining through the afternoon and evening. Michael's cortisol of 197 nmol/L is within the morning reference range of 145.4 to 619.4 but sits toward the lower end. However, cortisol is very sensitive to the exact time of blood draw, and if the sample was taken later in the morning, a lower level is expected. This does not indicate adrenal insufficiency in the context of otherwise normal electrolytes and blood pressure.","low_causes":"Adrenal insufficiency, pituitary dysfunction, late morning blood draw","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid use, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3047","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3424","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen, present in small amounts in men where it plays a role in bone health, brain function, and libido. In men, it is primarily produced by the enzyme aromatase converting testosterone to oestradiol, and this conversion increases with body fat. Michael's oestradiol of 89 pmol/L is within the laboratory range but toward the upper end of what is desirable in a male. At his BMI, higher aromatase activity in visceral fat may be converting more testosterone to oestradiol than ideal, contributing to his lower testosterone and symptoms of low libido. Weight loss reduces aromatase activity and typically improves the testosterone-to-oestradiol balance.","low_causes":"Low body fat, low testosterone, aromatase inhibitor use","high_causes":"Obesity, liver disease, aromatase excess, exogenous oestrogen exposure","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4272","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5706","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes and plays a role in modulating the effects of oestrogen and supporting neurological function. Michael's progesterone of 1.73 nmol/L is within the normal range for a male.","low_causes":"Adrenal insufficiency, low hormone production","high_causes":"Adrenal hyperplasia, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4407","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3397","upper_optimal_position":"0.5821","units":"mIU/mL","description":"Luteinising hormone is produced by the pituitary gland and signals the testes to produce testosterone in men. Michael's LH of 4.06 is within the optimal range. The fact that LH is not elevated despite a below-optimal testosterone level suggests the pituitary is not yet sensing a significant testosterone deficit. This pattern is typical of obesity-related testosterone suppression, where the hypothalamic-pituitary axis is blunted by excess oestrogen from aromatase activity rather than there being a primary testicular problem.","low_causes":"Pituitary dysfunction, anabolic steroid use, obesity, hyperprolactinaemia","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"5.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4154","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5369","units":"mIU/mL","description":"Follicle stimulating hormone is produced by the pituitary gland and in men supports sperm production by the testes. Michael's FSH of 5.57 is within the optimal range, confirming normal pituitary-gonadal signalling.","low_causes":"Pituitary dysfunction, anabolic steroid use, obesity","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"15.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4532","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, fat distribution, libido, energy, mood, and cognitive function. Michael's testosterone of 15.5 nmol/L falls within the laboratory range of 8.4 to 28.7 but below the optimal threshold of 18 nmol/L. This is exactly the kind of finding he was concerned about: technically in range but at a level associated with his symptoms of low libido, fatigue, and difficulty losing weight. At 39 with a BMI of 34.7 and no exercise, the most likely driver is obesity-related suppression through increased aromatase conversion of testosterone to oestradiol. Weight loss and resistance training are the most effective ways to raise testosterone naturally.","low_causes":"Obesity, ageing, chronic illness, sleep deprivation, medications, pituitary dysfunction","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"117","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4061","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5470","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland that is best known for its role in milk production in women but is also present in men, where very high levels can suppress testosterone and libido. Michael's prolactin of 117 is within the optimal range, ruling out hyperprolactinaemia as a contributor to his symptoms.","low_causes":"Dopamine excess, medications","high_causes":"Pituitary adenoma, medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"46.41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4701","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a calculation using total testosterone and SHBG to estimate the proportion of testosterone available to tissues. Michael's FAI of 46.41 is within the laboratory range but below the optimal threshold of 50, consistent with his below-optimal total testosterone. The SHBG level of 33.4 is not excessively high, meaning the issue is the total testosterone production rather than excessive binding.","low_causes":"Low testosterone, high SHBG, obesity, ageing","high_causes":"Steroid use, PCOS (in women), low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"2395","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5123","lower_normal":"162","upper_normal":"4940","lower_optimal":"800","upper_optimal":"4000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6137","units":"ug/dL","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It declines gradually with age and is a marker of adrenal function. Michael's original result of 6.5 umol/L converts to approximately 2,395 ug/dL, which is within the optimal range. This confirms healthy adrenal function and adequate precursor hormone production.","low_causes":"Ageing, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumour, PCOS (in women), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"33.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4440","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3525","upper_optimal_position":"0.5811","units":"nmol/L","description":"Sex hormone binding globulin is a protein produced by the liver that binds to testosterone and oestradiol, controlling how much of each is free and available to tissues. Higher SHBG means less free hormone. Michael's SHBG of 33.4 nmol/L is within the optimal range. Interestingly, SHBG tends to be lower in obesity due to insulin resistance (insulin suppresses SHBG production), so his mid-range SHBG is a positive sign that insulin has not yet significantly impacted SHBG regulation.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.334","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4563","lower_normal":"0.2","upper_normal":"0.6","lower_optimal":"0.35","upper_optimal":"0.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3708","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone represents the fraction of total testosterone that is not bound to proteins and is therefore immediately available to act on tissues. It is typically 1 to 3% of total testosterone. Michael's calculated free testosterone of 0.334 nmol/L is within the laboratory range but just below the optimal threshold of 0.35. This is consistent with the below-optimal total testosterone and further supports the picture of mild androgen deficiency contributing to his symptoms.","low_causes":"Low total testosterone, high SHBG, obesity, ageing","high_causes":"Steroid use, low SHBG, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"0.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3412","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3367","upper_optimal_position":"0.4554","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how hard to work. When TSH is high, the pituitary is asking for more thyroid hormone; when TSH is low, it is satisfied or the thyroid is overproducing. Michael's TSH of 0.65 is within the laboratory range but below the optimal band of 1.0 to 2.5. A TSH this low with normal FT4 and FT3 is not concerning and does not suggest hyperthyroidism. It may simply reflect his individual pituitary set point. With negative thyroid antibodies and normal thyroid hormone levels, no action is needed.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction, non-thyroidal illness","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4260","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. It is converted to the more active T3 in tissues. Michael's FT4 of 14.6 is within the optimal range. While it sits toward the lower end of the optimal band, in the context of a low-normal TSH, this is consistent: the pituitary is not asking for more, suggesting this level is adequate for his body's needs.","low_causes":"Hypothyroidism, pituitary dysfunction, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the most biologically active thyroid hormone and drives metabolism, energy production, and cognitive function. Michael's FT3 of 5.4 is within the optimal range, confirming that thyroid hormone conversion from T4 to T3 is working efficiently. This rules out poor conversion as a contributor to his fatigue.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a pattern seen in autoimmune thyroid conditions such as Hashimoto's thyroiditis. Michael's TPO antibodies are below 6.6, well within the normal range of less than 13.8, confirming no autoimmune thyroid activity.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Michael's thyroglobulin antibodies are below 1.3, well within the normal range, further confirming no autoimmune thyroid activity.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone essential for calcium absorption, bone health, immune function, and mood regulation. It is primarily produced in the skin upon sun exposure and can also be obtained from food and supplements. Michael's vitamin D of 75 nmol/L is sufficient and sits right at the lower boundary of the optimal range of 75 to 120. At his BMI of 34.7, vitamin D is sequestered in fat tissue, meaning a level of 75 is functionally lower than the same level in a lean individual. Supplementation at 4,000 IU daily through autumn and winter is recommended to maintain and ideally improve this level.","low_causes":"Insufficient sun exposure, dark skin, obesity, malabsorption, liver or kidney disease","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5211","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5472","units":"pmol/L","description":"Parathyroid hormone is produced by the parathyroid glands and regulates calcium and phosphate balance. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. Michael's PTH of 3.1 pmol/L is within the laboratory range but marginally above the optimal ceiling of 3.0. In the context of a borderline-optimal vitamin D of 75 and adequate calcium at 2.48, a slightly elevated PTH may reflect the body working a little harder to maintain calcium homeostasis. Improving vitamin D to well above 75 nmol/L would be expected to bring PTH down.","low_causes":"Hypercalcaemia, hypoparathyroidism, magnesium deficiency, excess vitamin D","high_causes":"Vitamin D deficiency, chronic kidney disease, hyperparathyroidism, low calcium intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"364","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3883","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.6157","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. Deficiency can cause fatigue, cognitive impairment, and eventually nerve damage. Michael's B12 of 364 pg/mL is within the laboratory range of 193 to 982 but below the optimal threshold of 500. This is the pattern Michael was concerned about with his GP: technically not deficient, but at a level where optimising it could make a noticeable difference to energy and cognitive sharpness. Sublingual methylcobalamin at 1,000 mcg daily is recommended.","low_causes":"Poor dietary intake, vegetarian/vegan diet, pernicious anaemia, malabsorption, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6471","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate, also known as vitamin B9, is essential for DNA synthesis, red blood cell production, and homocysteine metabolism. Michael's folate of 22 ng/mL is above the upper limit of 17. Elevated folate is not harmful and typically reflects a folate-rich diet or supplementation. If Michael is taking a multivitamin or B-complex supplement, this is the most likely explanation. There is no action needed.","low_causes":"Poor diet, alcohol, malabsorption, pregnancy, medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, high dietary intake, B12 deficiency masking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"131","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4411","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found in muscles, including the heart. It rises when muscle tissue is damaged, whether from exercise, injury, or disease. Michael's CK of 131 U/L is within the optimal range. Given that he does no resistance training, this level is expected and confirms no significant muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4912","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and provides long-term immunity against bacteria and viruses. It is the antibody type produced after vaccination and previous infections. Michael's IgG of 11 g/L is within range, confirming a healthy adaptive immune system with no evidence of immune deficiency or overproduction of this particular antibody class.","low_causes":"Immune deficiency, medications (corticosteroids, immunosuppressants)","high_causes":"Chronic infection, autoimmune conditions, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody produced by the immune system in response to a new infection. It is present in the blood in relatively low concentrations compared to IgG. Michael's IgM of 0.6 g/L sits just above the lower limit of 0.5, within the laboratory range but at the lower end. A low-normal IgM is not typically clinically significant on its own. In the context of the very high IgA, it may warrant monitoring on the retest.","low_causes":"Selective IgM deficiency, medications, chronic lymphocytic leukaemia","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"6.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8587","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is an antibody concentrated in mucosal surfaces including the gut lining, respiratory tract, saliva, and urinary tract. It acts as the body's first line of immune defence at surfaces exposed to the outside world. Michael's IgA of 6.01 g/L is nearly twice the upper limit of 3.5, which is a significant elevation. This is not explained by lifestyle factors alone and warrants investigation by his GP. Common causes include chronic mucosal stimulation from conditions such as gut inflammation, chronic sinusitis, or liver disease, and occasionally IgA nephropathy or a plasma cell disorder. His negative coeliac screen rules out that particular cause. The GP should consider serum protein electrophoresis to characterise the IgA elevation and exclude a monoclonal cause.","low_causes":"Selective IgA deficiency, medications, coeliac disease","high_causes":"Chronic mucosal infection or inflammation, IgA nephropathy, liver disease, myeloma, chronic respiratory or gut inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"96.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4820","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"75","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"IU/mL","description":"IgE is the antibody involved in allergic reactions and defence against parasites. Elevated levels are associated with allergic conditions such as asthma, eczema, hay fever, and food allergies. Michael's IgE of 96.4 is within the laboratory range of less than 100 but close to the upper boundary. This suggests some degree of allergic sensitisation, though it is not significantly elevated. If Michael has any allergy-like symptoms, this could be explored further.","low_causes":"Immune deficiency, selective IgE deficiency","high_causes":"Allergic conditions, asthma, eczema, parasitic infection, atopic dermatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2143","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Michael's RF of 6 IU/mL is well within the normal range of less than 14, making rheumatoid arthritis unlikely as a cause of any joint symptoms.","low_causes":"Absence of rheumatoid arthritis or autoimmune conditions","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"2.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1968","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA is the primary screening antibody for coeliac disease, an autoimmune condition triggered by gluten. A negative result, as in Michael's case at 2.83 CU against a positive threshold of 8.8, effectively rules out coeliac disease, provided he has been eating a gluten-containing diet, which as a standard mixed diet he has been. This is particularly useful given his elevated IgA, confirming that the IgA excess is not being driven by coeliac disease.","low_causes":"Absence of coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0980","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/mL","description":"Prostate-specific antigen is a protein produced by the prostate gland. While elevated levels can indicate prostate cancer, they are also raised by benign prostatic hyperplasia (enlarged prostate), prostatitis (prostate infection), and even vigorous exercise or sexual activity before the test. Michael's PSA of 0.49 ng/mL is very low and well within the optimal range, confirming a healthy prostate at 39.","low_causes":"Normal prostate health","high_causes":"Prostate cancer, benign prostatic hyperplasia, prostatitis, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA measures the portion of PSA circulating unbound in the blood. A higher proportion of free PSA relative to total PSA is associated with benign conditions rather than malignancy. Michael's free PSA of 0.16 is within range.","low_causes":"Normal prostate health","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Ratio","group":"PROSTATE","result":"0.327","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3270","lower_normal":"0.19","upper_normal":"1","lower_optimal":"0.19","upper_optimal":"1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps distinguish between benign and potentially malignant causes of elevated PSA. A ratio above 0.19 (19%) is reassuring. Michael's ratio of 0.327 (32.7%) is healthy and, alongside the very low total PSA, confirms excellent prostate health.","low_causes":"Prostate cancer (lower free-to-total ratio)","high_causes":"Benign prostatic hyperplasia (higher free-to-total ratio)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1

}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
