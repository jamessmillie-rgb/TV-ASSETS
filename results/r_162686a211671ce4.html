<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Robbie Tomlin","dob":"06/09/1993","report_date":"2026-10-08","summary":"Robbie is a 33-year-old male presenting with a BMI of 21.7, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food some days; portions are slightly below average (volume 4 out of 10). He trains once per week with resistance training at moderate intensity and does no dedicated cardio, with fewer than 2,000 daily steps. He sleeps 8 or more hours but is slow to get going on waking, with energy that feels wired at night. Stress feels hard to manage most days. He does not drink alcohol. He is on testosterone replacement therapy and reports frequent painkiller use such as ibuprofen or paracetamol. He also reports use of anabolic steroids or PEDs. His family history includes osteoporosis. A previous blood test flagged something, and he notes that ferritin was 235 with a serum iron of 9.9 and transferrin of 1.91 on that occasion. He reports water retention in his face, a round or cortisol-type facial appearance that has persisted despite losing 60 pounds of body weight. His symptoms are hair thinning and hair loss, low sex drive and libido, and joint pain and stiffness. His goals are to balance his hormones and improve long-term health and longevity.\n\nThe most important finding in this report is the hormonal picture, and it tells a very clear story. Robbie's testosterone is 24.6, which sits within the optimal range of 18 to 30 for a man of his age. However, his luteinising hormone, known as LH, which is the signal the pituitary gland sends to the testes to produce testosterone, is 0.88, well below the lower limit of 1.5. His follicle-stimulating hormone, known as FSH, which drives sperm production, is 0.97, also well below the lower limit of 1.4. This is entirely expected on testosterone replacement therapy. When testosterone is supplied externally, the brain detects adequate levels and switches off its own signalling, so LH and FSH fall to near zero. This is not a problem in terms of testosterone levels, but it does mean natural testicular function is suppressed: the testes are not being asked to produce testosterone or maintain sperm, and this suppression is the likely explanation for his low libido despite a healthy testosterone number. Libido is not driven by testosterone alone; it depends on the interplay between LH, FSH, oestradiol, prolactin, SHBG and neurological signalling, and when the hypothalamic-pituitary-gonadal axis is shut down by exogenous testosterone, the subjective experience of drive can be blunted even when the headline number looks fine. His oestradiol is 110, which is within range at below 146.1, but it is on the higher side for a man on TRT and could be contributing to water retention and the facial puffiness he describes. Oestradiol is made when the body converts testosterone into oestrogen through an enzyme called aromatase, and at higher testosterone doses or with more body fat, this conversion increases. Even at a lean BMI of 21.7, exogenous testosterone provides more substrate for aromatase than the body would produce naturally. His SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable for use, is 32.4, which is within range but at the lower end. A lower SHBG means more free testosterone is available, and his calculated free testosterone at 0.541 confirms this, sitting comfortably in the upper half of the reference range. His bioavailable testosterone, the fraction actually available to tissues, is calculated at 13.23, which is above the upper limit of the reference range, again confirming that tissue exposure to testosterone is high. His free androgen index is 75.93, which is healthy. His DHEA-S, a precursor hormone produced by the adrenal glands, is 6.6 micromoles per litre, converting to approximately 2,433 micrograms per decilitre, which is within range and shows his adrenal hormone production is intact. His prolactin at 107 is normal, ruling out a prolactin-driven cause for his low libido. His progesterone at 1.7 is within the male reference range. We would recommend Robbie discusses the suppressed LH and FSH with his TRT prescriber, particularly in the context of his low libido and the possibility that a protocol adjustment, dose reduction, or the addition of a gonadotropin such as hCG could restore some of the axis signalling that drives subjective wellbeing. If fertility is a consideration now or in the future, this conversation becomes especially important because sperm production is effectively paused while FSH is this low.\n\nHis cortisol is 422, taken as a morning sample, which places it in the upper half of the morning reference range of 145 to 619. This is not abnormally high, but it is worth noting given his description of a round, cortisol-type facial appearance and persistent water retention despite substantial weight loss. Cortisol at this level does not on its own explain Cushingoid features. However, if the cortisol is sitting in the upper half consistently, day after day, driven by chronic stress that he reports as hard to manage most days, and compounded by being wired at night and slow to get going in the morning, the cumulative effect on fluid distribution, facial fat deposition and sleep architecture can be meaningful. The pattern he describes, wired at night and sluggish on waking, is the classic signature of a shifted cortisol rhythm: cortisol should peak within an hour of waking and fall steadily through the day, reaching its lowest point in the evening. When that curve flattens or inverts, sleep onset is delayed, sleep quality suffers despite adequate duration, and morning energy is poor. This is not a disease; it is a stress and lifestyle pattern, and it responds well to the habits outlined in the lifestyle section below. If his facial appearance does not improve with lifestyle changes and stress management, it would be worth asking his GP about a 24-hour urinary free cortisol or a late-night salivary cortisol to formally exclude Cushing's syndrome, though at this morning cortisol level that is very unlikely.\n\nHis parathyroid hormone, known as PTH, which regulates calcium and bone metabolism, is 4.8, marginally above the upper limit of 4.73. His corrected calcium is 2.31, comfortably within range, and his phosphate is 1.1, also within range. A PTH marginally above the upper limit with a normal calcium is a very common finding and at this margin is unlikely to represent primary hyperparathyroidism, where PTH drives calcium dangerously high. The most likely explanation is vitamin D that is adequate but not optimal: his vitamin D is 81, which is above the sufficiency threshold of 50 but below the optimal range of 100 to 120. When vitamin D is below optimal, the body sometimes nudges PTH upward to maintain calcium absorption from the gut and calcium release from bone. Given his family history of osteoporosis, optimising vitamin D and ensuring calcium intake is adequate are both important long-term strategies, and raising his vitamin D into the 100 to 120 range with supplementation should bring PTH back into range. This is worth repeating in six months to confirm.\n\nThere is a great deal of good news in this report. His blood sugar control is excellent. Fasting glucose is 4.7, HbA1c is 30 millimoles per mole, well below the 42 threshold for pre-diabetes, and his fasting insulin is 3.02, sitting at the very bottom of the reference range. His HOMA-IR, a calculated index of insulin resistance where lower is better, is 0.63, which is outstanding. His C-peptide, a molecule released alongside insulin that confirms how much insulin the pancreas is actually making, is 1.16 micrograms per litre, converting to approximately 384 picomoles per litre, right at the lower edge of range. This insulin picture says his pancreas is producing very little insulin because very little is needed: his tissues are highly sensitive to it. At a BMI of 21.7 this is expected, and it is a genuine strength.\n\nHis liver is in excellent health. ALT at 15 and GGT at 16 are both well within optimal limits, which is reassuring given his reported frequent use of painkillers such as ibuprofen and paracetamol. Paracetamol is metabolised by the liver and at high or sustained doses can cause liver stress, but there is no sign of that here. AST at 21 is healthy. His FIB-4 score, a fibrosis screening index, is 0.77, well below the threshold, confirming no sign of liver scarring. His APRI score is 0.225, also reassuring. Bilirubin at 6 is normal. Alkaline phosphatase at 48 is at the lower end of the reference range, which is fine. Amylase at 53 and lipase at 44, both markers of pancreatic health, are well within range.\n\nHis lipid profile is genuinely excellent. Total cholesterol is 3.6, LDL, the cholesterol fraction most associated with arterial plaque, is 2.09, which is within the optimal range of below 2.6. His ApoB, apolipoprotein B, the protein that carries LDL and VLDL particles into the artery wall and is considered the single best marker of cardiovascular risk, is 0.74, below the optimal target of 0.8. His triglycerides are 0.62, well below the optimal target of 1.0. His HDL, the cholesterol fraction that removes cholesterol from arteries, is 1.2, which is above the lower risk threshold of 1.04 but below the optimal level of 1.4 for a man. His ApoA1, the protein on HDL particles, is 1.31, above the target of 1.20. His ApoB to A1 ratio is 0.56, well within the lower risk category. His Lp(a), lipoprotein(a), a genetically determined particle that increases cardiovascular risk independently of LDL, is below 25, which is normal and below the 32 threshold. This is genuinely useful information because it means his entire lipid profile is driven by modifiable factors, and there is no inherited Lp(a) burden to worry about. His Lp(a)-corrected LDL is 2.01, and his cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 10, which is ideal. The only area for improvement in the lipid panel is HDL: raising it above 1.4 through regular exercise, particularly cardiovascular exercise which he currently does none of, and increasing omega-3 intake would complete an already strong picture.\n\nHis kidney function is healthy. Cystatin C, a more reliable marker of kidney filtration than creatinine alone, is 1.01, giving a cystatin C-derived eGFR of 97, and the combined creatinine and cystatin C eGFR is also 97, well above the 90 threshold for full function. Urea, creatinine, sodium, potassium and chloride are all within range. Uric acid at 348 is within the optimal range. His serum osmolality is calculated at 294, at the upper edge of the reference range of 275 to 295, which is consistent with adequate but not generous hydration.\n\nHis bicarbonate is 31.3, marginally above the upper limit of 31. At this margin, this is almost certainly not clinically significant. It can be influenced by delayed sample processing and is not a concern in isolation with normal kidney function and normal electrolytes.\n\nHis thyroid is working well. TSH, the signal from the pituitary to the thyroid, is 1.64, sitting within the optimal range of 1.0 to 2.5. Free T4 at 18.4 and free T3 at 5.4 are both within the optimal range, and the FT3 to FT4 ratio of 0.293 confirms healthy conversion of the storage hormone T4 into the active hormone T3. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease.\n\nHis full blood count is largely healthy. Haemoglobin at 146, red blood cells at 4.73, haematocrit at 0.42, MCV at 88.9, MCH at 30.9, platelets at 233, and white cell count at 6.35 are all within range. Reticulocytes, the young red blood cells that show how actively the bone marrow is producing new cells, are at 1.69 percent with an absolute count of 79.9, both healthy. His neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within range. His neutrophil to lymphocyte ratio is 2.66, within the reference range of 1 to 3, and his platelet to lymphocyte ratio is 147.5, also within range. His systemic immune-inflammation index is 621, marginally above the upper limit of 600 for the optimal range but within the laboratory reference range of 100 to 600. The ESR, erythrocyte sedimentation rate, a general marker of inflammation, is 12, sitting right at the upper boundary. His hsCRP, high-sensitivity C-reactive protein, a more specific marker of low-grade inflammation, is 1.1, which is above the optimal target of below 1.0 but well within the laboratory limit of 5. Taken together, these mild inflammation markers are not alarming but they are worth noting. Chronic stress, poor diet quality with ultra-processed food most days, very low vegetable intake, and frequent NSAID use such as ibuprofen can all contribute to a low-grade inflammatory background. Improving diet quality and managing stress are the levers here.\n\nHis MCHC at 347 is marginally above the upper limit of 345. At this margin, this is almost always a laboratory artefact related to sample temperature and storage, as the lab note itself indicates. It is not a concern.\n\nHis iron studies tell an interesting story in the context of his previous results. His ferritin is 215, down from 235 on his previous test, within the reference range of 22 to 322 but above the optimal ceiling of 200. His serum iron is 15.9, a significant improvement from the 9.9 flagged on his previous test. His transferrin, the protein that carries iron in the blood, is 2.1, marginally below the lower limit of 2.15 and also improved from the previous 1.91. His transferrin saturation is 30.15 percent, well within the optimal range of 25 to 40. His iron binding capacity is 50.7, within range. The previous picture of high ferritin with very low serum iron and low transferrin can indicate either iron being trapped in storage rather than being available for use, often due to inflammation, or early iron overload. The current picture is much improved: serum iron has normalised, transferrin saturation is healthy, and ferritin has come down slightly. The mildly low transferrin warrants monitoring but is not far enough below range to suggest pathology at present. Given his previous flagged results, it would be worth asking his GP whether haemochromatosis screening with an HFE gene test has been done, simply to exclude the inherited condition definitively, but the current iron picture does not suggest active iron overload.\n\nHis immune markers are reassuring. IgG, IgA and IgM are all within range. IgE at 16.6 is low, which is a positive finding indicating no significant allergic burden. Rheumatoid factor is below 4, effectively negative, which is worth noting given his joint pain and stiffness. Tissue transglutaminase IgA is negative at 1.9, ruling out coeliac disease. His total antioxidant activity is 2.0, above the upper limit of 1.77. This marker measures the overall antioxidant capacity of the blood and can be elevated by supplementation, certain foods, or uric acid levels. It is not a concern.\n\nHis vitamin B12 at 496 is within range but below the optimal target of 500. His folate at 4 is within the laboratory range of 3 to 17 but below the optimal level of 8, which is low enough to be clinically relevant. Folate, also known as vitamin B9, is essential for DNA synthesis, red blood cell production, methylation pathways and mood regulation. At 0 to 1 portions of vegetables and fruit a day, this low folate is entirely explained by diet. Green leafy vegetables, beans, lentils and cruciferous vegetables are the primary dietary sources, and none of these feature heavily in a diet relying on ultra-processed food. Supplementation will correct the number, but increasing vegetable intake is the sustainable fix.\n\nHis vitamin D at 81 is sufficient but below the optimal range of 100 to 120. Given his family history of osteoporosis and the marginally raised PTH, optimising this is a priority.\n\nHis prostate markers are excellent. PSA at 0.66, free PSA at 0.31, and a PSA ratio of 0.47 are all healthy. His tumour markers CA19-9 at 15.38 and CEA at 0.85 are both well within range. His creatine kinase at 142 is within the normal range for a man, showing no excessive muscle damage.\n\nHis urinalysis is entirely clear. No protein, glucose, ketones, blood, white cells, nitrites or bacterial growth, and no casts. The urine culture confirms no growth.\n\nHis PhenoAge, a biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase, is 24.8 years against a calendar age of 33, placing him 8.2 years younger biologically. This is a strong result driven by his excellent glucose control, low CRP, healthy kidney function and good blood count parameters. It confirms that despite the dietary and lifestyle patterns that have room for improvement, his underlying metabolic health is in a good position.\n\nTo summarise the picture: Robbie's metabolic health, liver, kidneys, thyroid, blood sugar control and cardiovascular risk profile are all in excellent shape. His lipids are genuinely strong for his age. The key areas for action are the suppressed LH and FSH from TRT, which his prescriber should review in the context of his low libido; optimising vitamin D to address the marginally raised PTH and protect bone health given his family history of osteoporosis; increasing folate through diet and supplementation; the inflammatory markers that are mildly elevated and linked to diet quality, stress and NSAID use; the HDL that would benefit from cardiovascular exercise; and the cortisol rhythm pattern suggested by his wired-at-night, slow-to-start mornings, which stress management and circadian habits can address. The water retention and facial puffiness are most likely a combination of oestradiol on the higher side from TRT aromatisation, a persistently elevated cortisol rhythm from chronic stress, and possibly sodium and fluid handling. These should improve with the lifestyle changes below and the TRT protocol review.","links":"The central thread in this report is the hormonal picture created by testosterone replacement therapy. Robbie's testosterone is in the optimal range at 24.6, but the exogenous supply has switched off the pituitary signals that drive natural production: LH at 0.88 and FSH at 0.97 are both below range. This suppression is expected on TRT, but it carries consequences. The most immediately relevant for Robbie is that libido depends on more than just the testosterone number; it depends on the pulsatile signalling from LH and the interplay between the hypothalamic-pituitary-gonadal axis, dopamine, and oestradiol. When that axis is pharmacologically silenced, subjective drive can be flat despite adequate circulating testosterone. His oestradiol at 110, while within range, is on the higher side and may be contributing to water retention and the facial puffiness he describes. This aromatisation effect is a direct consequence of TRT: more exogenous testosterone means more substrate for the aromatase enzyme to convert into oestradiol.\n\nThe second thread is the stress and circadian pattern. Cortisol at 422 is not pathologically high, but Robbie describes stress as hard to manage most days, he feels wired at night and sluggish in the morning, and he has a round facial appearance that has persisted after losing 60 pounds. This combination points to a cortisol rhythm that is shifted or flattened: instead of peaking sharply in the morning and falling through the day, it stays elevated into the evening, which delays sleep onset, impairs sleep quality despite good duration, and leaves him unrefreshed. This is not an adrenal disease; it is a stress-driven pattern that responds to circadian habits, stress management and exercise, all of which are currently minimal in his routine.\n\nThe third thread is diet quality. At 0 to 1 portions of vegetables and fruit a day with ultra-processed food most days, the diet is low in the micronutrients that blood tests can measure: folate at 4, vitamin D at 81, and magnesium at 0.85, the floor of the optimal range, all reflect this. The mildly elevated inflammation markers, hsCRP at 1.1, ESR at 12, and SII at 621, are consistent with a pro-inflammatory dietary pattern compounded by chronic stress and frequent NSAID use. His metabolic health is outstanding despite this, with a HOMA-IR of 0.63 and HbA1c of 30, so his body is handling the dietary pattern well for now, but the micronutrient gaps and inflammatory signal will accumulate over time.\n\nThe iron studies have improved significantly from his previous test: serum iron has risen from 9.9 to 15.9 and transferrin from 1.91 to 2.1, while ferritin has edged down from 235 to 215. The previous pattern of high ferritin with very low serum iron and low transferrin suggested either inflammation trapping iron in storage or an early haemochromatosis pattern. The improvement makes the inflammatory explanation more likely, but an HFE gene test to exclude haemochromatosis definitively has not been mentioned and would be a straightforward step to take.\n\nThe marginally raised PTH at 4.8 with normal calcium and a vitamin D of 81 fits a simple explanation: vitamin D is adequate but not optimal, and the parathyroid is gently compensating. Given his family history of osteoporosis, this is the area where doing nothing carries the most long-term risk. Optimising vitamin D, ensuring adequate calcium intake, and adding resistance training and weight-bearing exercise are the interventions that protect bone density over the decades ahead.\n\nThe loose end in this report is the hair thinning. None of the blood markers point to a clear cause: his thyroid is working well, his iron is adequate, his B12 is reasonable, and his testosterone is optimal. On TRT, hair thinning is often driven by the conversion of testosterone to dihydrotestosterone, known as DHT, which miniaturises hair follicles in genetically susceptible men. This conversion is amplified by exogenous testosterone, and it is worth discussing with his TRT prescriber whether DHT levels should be checked or whether a 5-alpha reductase inhibitor has been considered.","lifestyle":"Add at least two portions of vegetables to your meals every day, starting with one at lunch and one at dinner. A handful of spinach stirred into whatever you are eating, a side of broccoli, or a bag of pre-prepared salad all count. Anchor: when you plate your main meal, vegetables go on first. Why: your folate is 4, below the optimal level of 8, and vegetables are the primary dietary source; they also contain the magnesium, potassium and fibre that your current diet is low in.\nReplace one ultra-processed meal per day with a whole-food alternative. If lunch is currently a meal deal or fast food, swap it for eggs on toast, a chicken wrap you made, or a tin of sardines on sourdough. Anchor: the meal you default to when you are busy. Why: ultra-processed food drives the low-grade inflammation behind your hsCRP of 1.1 and ESR of 12, and it displaces the nutrients your blood is showing you need.\nEat a palm-sized portion of protein at every meal: eggs, chicken, fish, Greek yoghurt, or beans. Anchor: it goes on the plate before anything else. Why: at 71.2 kilograms you need at least 93 to 114 grams of protein a day to support recovery and lean mass, and at a diet volume of 4 out of 10 with low vegetable and high processed food intake, you are very likely falling short.\nWalk for 20 minutes within an hour of waking, outside, without sunglasses. Anchor: before your first cup of tea or coffee. Why: morning light resets the cortisol rhythm that is currently leaving you wired at night and sluggish in the morning; it also contributes to vitamin D production and counts toward the daily movement your body is not getting at fewer than 2,000 steps.\nAdd two sessions of cardiovascular exercise per week, starting with brisk walking, cycling or swimming for 20 to 30 minutes. Anchor: attach it to your one existing resistance session as a warm-up or cool-down, then add a standalone day. Why: cardiovascular exercise is the single most effective way to raise your HDL from 1.2 toward the optimal 1.4, and it lowers cortisol, improves sleep quality and reduces the low-grade inflammation your markers are showing.\nSet a hard caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, and any consumed after early afternoon will still be active in your system when you are trying to wind down, reinforcing the wired-at-night pattern you describe.\nCreate a wind-down routine starting 60 minutes before bed: dim the lights, put your phone in another room, and do something low-stimulation. Anchor: set an alarm for one hour before your target bedtime. Why: your sleep duration is good at 8 or more hours but you are slow to get going, which suggests the quality is not matching the quantity; reducing light and screen exposure before bed allows melatonin to rise and cortisol to fall.\nAim for a daily calorie intake of approximately 2,100 to 2,300 calories to maintain your current weight of 71.2 kilograms at your activity level, with at least 93 to 114 grams of protein per day. If weight loss is not a goal, staying at the higher end is appropriate; if you want to add lean mass, a small surplus of 200 to 300 calories with increased resistance training is the approach.","flags":"LH 0.88 (below range of 1.5 to 9.3) and FSH 0.97 (below range of 1.4 to 18.1): both are suppressed by exogenous testosterone replacement therapy. This is expected on TRT but is the most likely explanation for his low libido despite a healthy testosterone of 24.6. His TRT prescriber should review the protocol, consider whether hCG or a dose adjustment is appropriate, and discuss fertility implications.\nOestradiol 110 (within range at below 146.1 but on the higher side for a man on TRT): may be contributing to water retention and facial puffiness through increased aromatisation of exogenous testosterone. Worth discussing with TRT prescriber alongside the LH and FSH suppression.\nPTH 4.8 (marginally above upper limit of 4.73) with corrected calcium 2.31 (normal) and vitamin D 81 (sufficient but below optimal 100 to 120): most likely a compensatory response to suboptimal vitamin D. Given family history of osteoporosis, vitamin D should be optimised to 100 to 120 and PTH rechecked in six months.\nFolate 4 (within laboratory range of 3 to 17 but below optimal of 8): low dietary intake of vegetables and fruit is the clear explanation. Supplementation and dietary improvement recommended.\nTransferrin 2.1 (marginally below lower limit of 2.15) with ferritin 215 (within range but above optimal ceiling of 200), serum iron 15.9 (normal), and transferrin saturation 30.15 percent (optimal): improved significantly from previous test where serum iron was 9.9 and transferrin was 1.91. HFE gene test to exclude haemochromatosis would be a prudent step given the previous pattern.\nhsCRP 1.1 (above optimal target of below 1.0), ESR 12 (at upper boundary), SII 621 (marginally above optimal upper limit of 450): low-grade inflammatory signal consistent with poor diet quality, chronic stress and frequent NSAID use. Not alarming but worth addressing through diet and lifestyle.\nBicarbonate 31.3 (marginally above upper limit of 31): at this margin and with normal kidney function and electrolytes, this is not clinically significant and may reflect sample processing.\nMCHC 347 (marginally above upper limit of 345): almost certainly a laboratory artefact related to sample temperature and storage as per the lab note. Not a concern.\nTotal antioxidant activity 2.0 (above upper limit of 1.77): can be elevated by supplementation, certain dietary factors or uric acid levels. Not a concern.\nCortisol 422 (within morning reference range of 145 to 619 but upper half): not pathologically elevated, but combined with symptoms of facial puffiness, feeling wired at night and slow mornings, the pattern suggests a shifted cortisol rhythm driven by chronic stress. Circadian and stress management habits are the first-line intervention; if facial appearance does not improve, 24-hour urinary free cortisol or late-night salivary cortisol could be considered to formally exclude Cushing's syndrome.\nReassuring negatives: thyroid function excellent with negative antibodies; blood sugar control outstanding with HbA1c 30, fasting glucose 4.7, HOMA-IR 0.63; liver fully healthy with ALT 15, GGT 16, FIB-4 0.77; kidney function healthy with cystatin C eGFR 97; lipid profile strong with ApoB 0.74, LDL 2.09, triglycerides 0.62; Lp(a) below 25, ruling out inherited lipoprotein risk; PSA 0.66, CEA 0.85, CA19-9 15.38 all clear; rheumatoid factor negative; coeliac screen negative; urinalysis entirely clear; PhenoAge 24.8, 8.2 years younger than calendar age; cardiovascular risk score 10 out of 100, ideal.","recommendations":"Discuss the suppressed LH (0.88) and FSH (0.97) with your TRT prescriber. The low libido despite a healthy testosterone of 24.6 is most likely caused by the shutdown of pituitary signalling from exogenous testosterone. Ask whether adding hCG to restore some axis function, adjusting the TRT dose, or checking DHT levels in the context of your hair thinning would be appropriate. If fertility is relevant now or in the future, raise this specifically.\nAsk your TRT prescriber about the oestradiol level of 110 and whether this could be driving the water retention and facial puffness. Discuss whether managing aromatisation is appropriate.\nAsk your GP whether an HFE gene test for haemochromatosis has been done, given the previous pattern of high ferritin (235) with very low serum iron (9.9) and low transferrin (1.91). The current picture has improved significantly but the inherited condition should be excluded definitively.\nDiscuss the marginally raised PTH (4.8) with your GP in the context of your family history of osteoporosis. A DEXA bone density scan would establish a baseline. Vitamin D supplementation to optimise levels to 100 to 120 should bring PTH into range; recheck both in six months.\nDiscuss your frequent painkiller use with your GP. Ibuprofen in particular, taken regularly, increases the risk of gastric irritation, kidney stress and cardiovascular events over time. Your kidneys and liver are handling it well at present, but a review of whether the dose, frequency or type could be modified is worthwhile, especially given the joint pain that prompts it.\nIf the facial puffiness and water retention do not improve within three to four months of the lifestyle changes and TRT protocol review, ask your GP about a 24-hour urinary free cortisol or late-night salivary cortisol to formally exclude Cushing's syndrome.\nAim for approximately 2,100 to 2,300 calories per day with at least 93 to 114 grams of protein. Retest in six months with vitamin D, PTH, folate, full blood count, iron studies, hsCRP, and a hormone panel including LH, FSH, oestradiol and testosterone to assess progress.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal that contains fat. Why: your vitamin D is 81, below the optimal range of 100 to 120, and your marginally raised PTH of 4.8 suggests the body is compensating for suboptimal levels. Given your family history of osteoporosis, optimising vitamin D is a priority for bone health.\nVitamin K2 (MK-7): 100 micrograms daily, taken alongside your vitamin D. Why: K2 directs calcium into bone and teeth and away from arteries. It should always accompany vitamin D supplementation, especially with a family history of osteoporosis.\nMethylfolate (5-MTHF): 400 to 800 micrograms daily with food. Why: your folate is 4, below the optimal level of 8. Methylfolate is the active form and is better absorbed than folic acid. This supplements the dietary improvement that is the long-term fix.\nVitamin B12 (sublingual methylcobalamin): 1,000 micrograms daily, dissolved under the tongue. Why: your B12 at 496 is just below the optimal threshold of 500. Sublingual methylcobalamin bypasses gut absorption and is the most effective form.\nMagnesium (glycinate): 300 to 400 milligrams taken 30 to 60 minutes before bed. Why: your magnesium at 0.85 is at the floor of the optimal range of 0.85 to 1.05. Magnesium glycinate supports sleep quality, stress resilience, muscle recovery and bone density, all of which are relevant given your symptoms, stress level and family history.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: your HDL at 1.2 is below optimal and your diet is low in oily fish. Omega-3 supports HDL, reduces low-grade inflammation, and benefits joint health, which is relevant given your joint pain and stiffness.\nDo not take iron supplements. Your ferritin at 215 is above the optimal ceiling of 200 and your previous test showed elevated ferritin. Additional iron supplementation would drive ferritin higher and increase the risk of iron overload.\nThe most important changes from this report are not supplements. They are increasing your vegetable intake to at least two portions a day, replacing ultra-processed food with whole food, adding cardiovascular exercise, and addressing the cortisol rhythm through morning light, stress management and an evening wind-down routine.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 86; held to 74 by a system rated \"Needs attention\". Weakest systems: hormones 58%, inflammation 77%, iron studies 80%. Biggest drags: Bicarbonate, Luteinising Hormone (LH), C-Peptide, Follicle Stimulating Hormone (FSH).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"24.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3263","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a biological age estimate built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase. Robbie's PhenoAge is 24.8 years against a calendar age of 33, placing him 8.2 years younger biologically. This strong result is driven by his excellent blood sugar control, low CRP, healthy kidney function, normal blood count parameters and low ALP. It confirms that his underlying metabolic health is in a genuinely good position.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"10"," f his total cholesterol, which is a healthy proportion reflecting his low total cholesterol.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic lipoproteins in one number. It is considered a better predictor of cardiovascular risk than LDL alone. Robbie's non-HDL cholesterol at 2.4 is within the optimal range, confirming his overall lipid picture is healthy.","low_causes":"","high_causes":"High LDL, high VLDL, high triglycerides, poor diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5458","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.3","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5417","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein on HDL particles. Higher levels indicate more HDL particles and greater cholesterol clearance capacity. Robbie's ApoA1 at 1.31 is above both the reference threshold of 1.20 and the optimal level of 1.30, a healthy result.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key" ing insulin with normal glucose means tissues are highly sensitive to insulin, which is the ideal state. Robbie's insulin at 3.02 is at the lower end of the reference range, reflecting outstanding insulin sensitivity at his lean BMI of 21.7.","low_causes":"High insulin sensitivity, low carbohydrate diet, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"384","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4005","lower_normal":"364","upper_normal":"1456","lower_optimal":"500","upper_optimal":"1200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3790","upper_optimal_position":"0.6143","units":"pmol/L","description":"C-peptide is released by the pancreas in equal amounts to insulin and confirms how much insulin the body is actually producing. Robbie's C-peptide converts to approximately 384 pmol/L, which is at the lower edge of the reference range. Combined with his low fasting insulin and normal glucose, this confirms his pancreas is producing very little insulin because very little is needed. This is a sign of excellent insulin sensitivity, not pancreatic failure.","low_causes":"High insulin sensitivity, low carbohydrate diet, type 1 diabetes, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3714","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description
