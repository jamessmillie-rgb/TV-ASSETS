<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"dob":"25/09/1979","flags":"Lipoprotein(a) 133.1 nmol/L, nearly double the 75 nmol/L upper limit. Genetically determined and lifelong. Combined with ApoB 139 mg/dL (above 90 target), LDL 4.62 (above 3.0), Lp(a)-corrected LDL 4.19 (above 3.0), HDL 1.20 (below 1.55), ApoB/ApoA-I ratio 1.23 (above 1.0), total cholesterol/HDL ratio 5.37 (above 5.0), Castelli II 3.85 (above 3.5), non-HDL cholesterol 5.24 (above 3.8), atherogenic coefficient 4.37 (above 3.0), estimated LDL particle count 1,390 (above 1,300) and Cardiovascular Risk Score 85/100. GP appointment recommended to discuss overall cardiovascular risk and whether lipid-lowering therapy is appropriate. First-degree relatives may wish to have Lp(a) tested once. Rapid fat loss may be transiently raising LDL; recheck lipids once weight is stable.\nOmega-3 Index 6.77% (below 8% target) and AA:EPA ratio 21.1 (above 11.1 limit). Increase oily fish and consider EPA/DHA supplementation. Relevant to cardiovascular risk management given the Lp(a) finding.\nOestradiol 177 pmol/L (above 159 male upper limit) and progesterone 1.45 nmol/L (above 0.47 male upper limit). Testosterone 16.9 is within range but below the 18 optimal floor. May be contributing to low libido and low energy. Calorie deficit, training load and peptides/supplements are possible contributors. Recommend hormonal review with GP or specialist and recheck once weight is stable.\nNEFA 1.22 mmol/L (above 0.9 limit) with trace urine ketones. Expected signature of active fat mobilisation during a calorie deficit. Not pathological.\nFerritin 328.77 ug/L (above 300 limit) with normal iron 19.9, transferrin saturation 40.2%, CRP 0.60 and clean liver. Does not suggest iron overload. Likely reflects previous alcohol use and training load. Recheck in three to four months; if persistent, GP to consider HFE gene test.\nCreatinine 106.5 umol/L (marginally above 104 limit). Cystatin C 0.83 and eGFR (cystatin C) 105 confirm normal kidney function. Elevated creatinine reflects muscle mass and 200 g/day protein intake.\nPTH 1.4 pmol/L (just below 1.6 lower limit) with normal calcium 2.38 and optimal vitamin D 98. Likely physiological suppression. Recheck alongside calcium at next test.\nGlobulin 21.5 g/L (below 23 lower limit) with IgG 6.59 and IgM 0.624 at the lower end of their ranges. May reflect calorie restriction. Recheck once calorie intake returns to maintenance.\nHB-EGF 137.63 pg/ml (marginally above 136 upper limit). Not clinically significant in isolation at this margin.\nIGF-1 13.6 nmol/L, lower part of the range (11.3 to 28). Consistent with sustained calorie deficit. Expected to recover when energy intake returns to maintenance.\nHOMA-B 38 (below 60 lower limit). Reflects very low insulin demand due to excellent insulin sensitivity, not pancreatic insufficiency. Glucose 4.92 and HbA1c 36 are both normal.\nEpstein-Barr: EBNA IgG 216 and VCA IgG 1,248 positive, VCA IgM 0.564 negative. Past infection, not current. Normal finding present in approximately 90% of UK adults.\nReassuring negatives: hsCRP 0.60, homocysteine 8.8, troponin T 5.36, all cardiac markers normal, thyroid normal with negative antibodies, full blood count normal, HbA1c 36, HOMA-IR 0.59, liver enzymes all clean with FIB-4 0.75, coeliac negative, rheumatoid factor negative, anti-CCP negative, ANA negative, H. pylori negative, pancreatic enzymes normal, all tumour markers normal, PSA 0.80 with decreased prostate risk, vitamin D 98, B12 590, folate 8.9, zinc 15.6, magnesium 1.05, D-dimer undetectable, urinalysis clear.","links":"The findings in this report arrange themselves into three connected threads, and understanding how they relate to each other is more useful than looking at each marker in isolation.\n\nThe first and most important thread is cardiovascular. Lewis carries a genetically elevated Lp(a) at 133.1 nmol/L, which is fixed and will not change regardless of what he does with diet, exercise or supplements. On its own, raised Lp(a) deposits cholesterol and encourages clotting, but its impact is multiplied when the overall number of atherogenic particles is also high. That is the case here: ApoB at 139 mg/dL, LDL at 4.62, Lp(a)-corrected LDL still at 4.19, HDL low at 1.20, and every ratio (ApoB/ApoA-I 1.23, total cholesterol/HDL 5.37, Castelli II 3.85, atherogenic coefficient 4.37, non-HDL cholesterol 5.24) pointing in the same direction. The Cardiovascular Risk Score of 85 out of 100 reflects this clustering. What is reassuring, and genuinely important, is that the damage markers are clean: hsCRP 0.60, homocysteine 8.8, troponin T 5.36, CK-MB 2.79, D-dimer undetectable. The arteries are under long-term pressure from too many particles, but there is no sign of active inflammation, heart muscle strain or clotting activation right now. The Omega-3 Index at 6.77 percent and the AA:EPA ratio at 21.1 add a nutritional dimension to the cardiovascular thread: raising EPA and DHA intake is one of the few actions that independently benefits both inflammation and membrane health in someone with a fixed Lp(a) risk. Rapid fat loss during a calorie deficit can temporarily raise LDL as the liver processes mobilised fat, so a lipid recheck once weight stabilises will clarify how much of the LDL is transient and how much is baseline.\n\nThe second thread runs through hormones, energy and the calorie deficit. Lewis is running a deficit of roughly 800 kcal below his estimated maintenance, training at high intensity four to five times a week, and has lost 10 lb in five weeks. The body responds to sustained energy restriction by conserving resources: it reduces sex hormone production, lowers IGF-1 to slow tissue building, and begins mobilising fat stores aggressively. His blood shows exactly this pattern. Testosterone at 16.9 is within range but below optimal, IGF-1 at 13.6 is in the lower part of the range, NEFA at 1.22 confirms heavy fat mobilisation, and urine ketones are present. At the same time, oestradiol at 177 is above the male range and progesterone at 1.45 is above range, which is an unusual hormonal environment that could be contributing to his symptoms of low libido and low energy. The calorie deficit, the high training load, and possibly the peptides and supplements he is taking could all be influencing this picture. The low HOMA-B at 38 and the very low insulin at 18.7 pmol/L are not part of this problem; they reflect exceptionally good insulin sensitivity in someone eating relatively few carbohydrates and running a deficit. DHEA-S in the lower part of its range is consistent with the overall pattern of a system that is prioritising survival over reproduction and growth.\n\nThe third thread is minor and metabolic. Ferritin at 328.77 is mildly above range with no iron overload pattern and no inflammation, most likely reflecting his previous alcohol intake and high training load, and should normalise or stabilise now that alcohol has been stopped. Globulin at 21.5 is marginally low with IgG and IgM at the bottom of their ranges, which can be a consequence of calorie restriction. PTH at 1.4 is marginally below range with perfect calcium and vitamin D, which is physiologically appropriate suppression rather than disease. These are monitoring points rather than action points.\n\nWhat was excluded matters. Thyroid function is normal with negative antibodies, ruling out the most common medical cause of fatigue and brain fog. Coeliac disease, rheumatoid arthritis and systemic autoimmune disease have been excluded. H. pylori is negative and pancreatic enzymes are normal, which is relevant to his digestion goal. Liver disease has been comprehensively ruled out. There is no iron deficiency, no B12 or folate deficiency, no vitamin D deficiency, and no kidney impairment. The Epstein-Barr results confirm a past infection with no reactivation. The tumour marker and PSA screen is clear. The one loose end that sits outside the blood results is whether his improving symptoms, brain fog, energy and libido, are being driven by the dietary and lifestyle changes (cutting alcohol, processed food and sugar, eating cleanly, losing weight) or by the peptides, or by both. The honest answer is that separating those effects is not possible from a single blood test. The recheck once his weight is stable and the deficit ends will be the most informative data point.","summary":"Lewis Field is a 47-year-old male presenting with a BMI of 23.8, following a standard mixed diet rated 8 out of 10 for quality with a volume of 8 out of 10. He trains 4 to 5 days per week at high intensity, combining resistance and cardio sessions, with 7,500 to 10,000 daily steps. He is currently taking retatrutide 1 mg weekly (four weeks in) and KLOW 1 mg twice daily. He has cut out alcohol, processed food and sugar over the past five weeks, during which he has lost 10 lb on a strict 1,850 to 1,950 kcal intake with 200 g protein, 150 g carbohydrate and 50 g fat. He reports brain fog, low energy and low libido, though notes all three have been improving recently. His goals are to build muscle, improve long-term health and longevity, and support digestion and gut health.\n\nThe most important finding in this report is cardiovascular, and it is the one Lewis should take to his GP. His lipoprotein(a), often written Lp(a), is 133.1 nmol/L, nearly double the upper limit of 75. Lp(a) is a specialised form of LDL particle that carries an extra protein called apolipoprotein(a). It deposits cholesterol in artery walls, encourages blood clots and drives local inflammation, which is why it is one of the strongest inherited risk factors for heart disease. The key word is inherited: Lp(a) is genetically determined, present from birth, and is not changed by diet, exercise, weight loss or any currently available supplement. It is a permanent part of Lewis's medical record, and his first-degree relatives, parents, siblings and children, may wish to have their own Lp(a) checked once, since approximately half will carry the same trait. On its own, a raised Lp(a) would be important. What makes it the standout finding here is that it sits alongside an ApoB of 139 mg/dL. ApoB is a protein carried by every LDL particle (and every Lp(a) particle); it is the best single measure of how many atherogenic, artery-damaging, particles are circulating. At 139 mg/dL his ApoB is well above the 90 mg/dL target, and because each ApoB molecule represents one particle, that translates to an estimated LDL particle count of around 1,390 nmol/L, above the 1,300 threshold. His total cholesterol is 6.44, LDL is 4.62 and when the cholesterol carried inside Lp(a) particles is subtracted, his Lp(a)-corrected LDL is still 4.19, well above the 3.0 limit and well above the 2.0 optimal target. His HDL, the protective fraction, is 1.20, below the 1.55 lower limit and below the 1.40 optimal floor for men, so there is less of the cholesterol that clears artery walls and more of the cholesterol that builds up in them. His ApoB to ApoA-I ratio, the single best summary of that balance, is 1.23 against a limit of 1.0 and an optimal below 0.7. Triglycerides at 1.37 and VLDL cholesterol at 0.62 are both within range, and his small dense LDL fraction at 21 percent of total LDL is within the healthy zone, which means the particles are not unusually small or dense, there are simply too many of them. His TrueVitals Cardiovascular Risk Score, which is built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c and runs from 0 to 100, is 85, which is high. This score has no age term: it measures the risk being built rather than the ten-year probability of an event, and at 47 the gap between the two is the window Lewis has for acting. The inputs driving the score are the Lp(a), the ApoB and the low HDL. There is important context here. Lewis has lost 10 lb in five weeks on a significant calorie deficit, and rapid fat loss is known to temporarily raise LDL as the liver processes mobilised fat. That means some of the LDL elevation may settle once his weight stabilises, and a recheck at that point is sensible. But even if LDL comes down somewhat, the Lp(a) will not, and the combination of a fixed genetic risk factor with a modifiable but currently elevated ApoB is exactly the situation where a GP conversation about overall cardiovascular risk and whether lipid-lowering treatment is appropriate should happen sooner rather than later. The reassuring side of the cardiovascular picture deserves emphasis. His high-sensitivity C-reactive protein, a marker of systemic inflammation that independently predicts cardiovascular events, is 0.60, comfortably below the 1.0 optimal ceiling. His homocysteine, an amino acid that at high levels damages artery walls, is 8.8, within the ideal range below 9. His troponin T at 5.36 is well below the 14 limit, CK-MB, myoglobin and FABP-3 are all normal, and his D-dimer is undetectable. There is no sign of current heart muscle strain, no clotting activation and no active arterial inflammation. The risk here is long-term and cumulative, not acute.\n\nTurning to what is working well, and there is a great deal. Lewis's liver is in excellent health. His ALT at 25 and AST at 25 are both well within range, his GGT at 10 is about as low as that marker gets, and his bilirubin, bile acids, direct bilirubin, GLDH, aldolase, LDH and alkaline phosphatase are all clean. The FIB-4 score, a composite that estimates liver scarring from age, platelets, AST and ALT, is 0.75, and the APRI score is 0.20, both comfortably in the no-fibrosis zone. The NAFLD Fibrosis Score is minus 3.72, which effectively rules out any meaningful liver scarring. Given the intensity of his training, the recent dietary overhaul and the fact that he has cut out alcohol entirely, this is an outstanding liver profile. His thyroid is working well. TSH at 1.11 sits in the optimal zone between 1.0 and 2.5, free T4 at 19.6 is in the upper part of the ideal range, and free T3 at 4.72 is within range. Both anti-TPO and anti-thyroglobulin antibodies are negative, so there is no autoimmune thyroid process. His FT3 to FT4 ratio at 0.24 is within range, confirming adequate conversion of the storage hormone to the active form. His kidney function is normal. His creatinine at 106.5 is marginally above the 104 upper limit, but creatinine is produced by muscle and influenced by protein intake. At 82.5 kg with substantial lean mass, training four to five days a week and eating 200 g of protein a day, a creatinine just over range is entirely expected and does not indicate kidney impairment. The proof is his cystatin C at 0.83, a kidney marker that is completely independent of muscle mass and diet, which gives an eGFR of 105, well above the 90 optimal floor. The combined creatinine and cystatin C eGFR is 93, also above optimal. His urea at 6.70 is normal, microalbumin was not detected, and his urinalysis is clean across the board: no protein, no blood, no glucose, no nitrites, no white cells. His blood sugar control is excellent. HbA1c at 36.17, a measure of average blood sugar over the preceding two to three months, is within the optimal zone below 36 (just barely above, effectively at the line). His fasting glucose at 4.92 is within the ideal range. His fasting insulin at 18.7 pmol/L is at the very bottom of the laboratory range, and his HOMA-IR, a calculated index of insulin resistance, is 0.59, well below the 2.0 limit. This means his cells respond to insulin with exceptional efficiency; the pancreas barely needs to produce any to keep blood sugar perfectly controlled. His C-peptide at 1.13 ng/ml, which equates to approximately 374 pmol/L, confirms low but adequate insulin production. His fructosamine at 238 is normal. His estimated average glucose is 6.1. His full blood count is normal across every line. Haemoglobin at 144, haematocrit at 44.1, red cell count at 4.51 and all red cell indices, MCV, MCH and MCHC, are within range. His white cell count at 8.93, neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within their respective ranges. Platelets at 304 are healthy. His neutrophil-to-lymphocyte ratio at 2.16 and platelet-to-lymphocyte ratio at 119 are both within the optimal zone. His vitamin D at 98 is solidly within the 75 to 120 optimal range, which is exactly where it should be. His B12 at 590 is in the optimal zone, active B12 at 96.8 confirms good tissue delivery, folate at 8.9 and red cell folate at 950 are healthy, and gastric parietal cell antibodies are negative. Zinc at 15.6 is optimal, copper at 15.7 is within range, magnesium at 1.05 is within the optimal band, and total antioxidant status at 1.58 is above the lower limit. Red cell selenium at 114.9 is within range. His coeliac screen is negative, rheumatoid factor is negative, anti-CCP antibodies are negative and ANA is negative, which together effectively rule out coeliac disease, rheumatoid arthritis and the common systemic autoimmune conditions. His pancreatic amylase at 24 and lipase at 36 are both normal, and H. pylori antibodies are negative, which is relevant to his digestion goal: the stomach and pancreas show no sign of the infections or enzyme problems that commonly cause digestive symptoms. Gastrin at 7.39 is normal. His tumour markers are all within range: AFP, CEA, CA 19-9, hCG, mesothelin, calcitonin and NSE at 16.30 are all within their respective limits. His PSA at 0.80 is low and the prostate cancer risk score is decreased, which at 47 is reassuring. His inflammatory cytokine panel is clean: IL-5, IL-8, IL-15, IL-17A, IL-17F, IL-22, GM-CSF, EGF, MCP-1, D-dimer and ASO are all within range. Complement C4, haptoglobin and IgE are normal. Adiponectin at 3.44 is within range. His trans fat index at 0.83 is low, which is a positive dietary signal.\n\nNow the findings that need attention beyond the cardiovascular picture. Lewis reports low libido, low energy and brain fog as his main symptoms, and the hormonal profile offers a plausible contribution. His testosterone at 16.9 nmol/L is within the laboratory range of 8.64 to 29 but sits below the 18 optimal floor for a man of his age. His calculated free testosterone at 0.357 and bioavailable testosterone at 8.91 are both within range, and his SHBG at 30.4 is mid-range, so the testosterone that is available to tissues is adequate. However, his oestradiol at 177 pmol/L is above the male upper limit of 159. In men, oestradiol, the primary oestrogen, is produced by an enzyme called aromatase that converts testosterone into oestradiol, and this process occurs mainly in fat tissue. When oestradiol is elevated relative to testosterone, it can dampen libido, contribute to low energy, affect mood and even cause some fluid retention or breast tissue sensitivity. His progesterone at 1.45 nmol/L is above the male upper limit of 0.47, which is unusual and worth noting. His LH at 6.5 and FSH at 2.74 are both within range, confirming that the brain's signalling to the testes is functioning normally. His LH to FSH ratio at 2.37 is mildly above the 2.0 limit, though this is of minor significance in isolation. His DHEA-S at 3.3 umol/L, equivalent to approximately 1,216 ug/dL, is in the lower portion of its range, which at 47 is not unusual but is consistent with the overall picture of a hormonal environment that is not fully optimised. His dihydrotestosterone, DHT, at 0.7 is within range. There are several factors that could be contributing to this hormonal picture. A sustained calorie deficit of the magnitude Lewis is running, roughly 800 kcal below his estimated maintenance of 2,700 kcal, combined with high-intensity training four to five days a week, is a significant physiological stress. The body responds to prolonged energy restriction by downregulating functions it can survive without in the short term, and sex hormone production is one of the first to be dialled back. Some peptides and supplements can also affect oestrogen, progesterone and the hypothalamic-pituitary-gonadal axis. Lewis should discuss the hormonal picture with his GP or a specialist, and the plan should include a recheck of testosterone, oestradiol and progesterone once his weight is stable and he is eating at or near maintenance, because the deficit alone could account for much of what is being seen. His cortisol at 323 is mid-range and his prolactin at 146 is normal, so neither of those is contributing.\n\nHis IGF-1 at 13.6 nmol/L sits in the lower portion of the range, which is relevant to his goal of building muscle. IGF-1, insulin-like growth factor 1, is the main mediator of growth hormone's effects on muscle, bone and tissue repair. During a sustained calorie deficit the liver produces less IGF-1, because the body redirects resources away from growth and repair toward maintaining essential functions. This is a normal physiological response and not a disease state, but it does mean that muscle building will be harder while the deficit continues. IGF-1 tends to recover when energy intake returns to maintenance or a modest surplus, and that recovery is one of the signals that the body is ready to build again.\n\nHis NEFA, non-esterified fatty acids, at 1.22 is above the 0.9 upper limit, and there is a trace of ketones in his urine. Together these are the expected biochemical signature of active fat mobilisation during a calorie deficit. The body is breaking down stored fat for fuel, releasing fatty acids into the bloodstream faster than they are being burned, and some are being converted to ketone bodies. This is not a problem; it is the mechanism by which the weight loss he is achieving actually happens. It confirms that the deficit is real and the fat loss is genuine.\n\nHis HOMA-B, which estimates how hard the beta cells of the pancreas are working to produce insulin, is 38 against a range of 60 to 200. In the context of a fasting glucose of 4.92, an HbA1c of 36 and a HOMA-IR of 0.59, this does not indicate pancreatic insufficiency. It means demand for insulin is so low, because his cells are so sensitive to it, that the pancreas simply does not need to work hard. This is a favourable finding.\n\nHis Omega-3 Index at 6.77 percent is below the 8 percent target. The Omega-3 Index measures the proportion of EPA and DHA in red blood cell membranes and is one of the best markers of long-term omega-3 status. Below 8 percent is associated with a higher risk of cardiovascular events, and given the cardiovascular findings in this report, bringing it above 8 is a straightforward and meaningful action. His AA to EPA ratio at 21.1 is above the 11.1 upper limit, which reflects a relative excess of the omega-6 fatty acid arachidonic acid compared to the omega-3 EPA. Increasing EPA intake through oily fish or a high-quality fish oil supplement will bring both the Index and the ratio into range over three to four months. His omega-6 to omega-3 ratio at 3.4 is actually within range, and his trans fat index at 0.83 is low, confirming that the dietary issue is specifically insufficient omega-3 rather than excess trans or omega-6 fats.\n\nHis ferritin at 328.77 is mildly above the 300 upper limit. Ferritin is the body's iron storage protein and can be raised by iron overload, inflammation, liver disease, heavy alcohol use or intense exercise. In Lewis's case, CRP is low, the liver is clean, transferrin saturation at 40.2 percent is at the top of the optimal range but not above the 50 percent limit, serum iron at 19.9 and transferrin at 2.23 are both within range, and TIBC at 49.5 is normal. This pattern does not suggest iron overload or haemochromatosis, and there is no inflammatory signal driving it up. The most likely explanation is a combination of his previous alcohol intake (which he has now stopped), intense training, and a high-protein, meat-containing diet. It is worth rechecking ferritin in three to four months now that alcohol has been removed, and if it remains above 300 or climbs further, his GP can consider an HFE gene test to formally exclude haemochromatosis. In the meantime, he should not take any iron supplements.\n\nHis PTH, parathyroid hormone, at 1.4 pmol/L is just below the lower limit of 1.6. PTH regulates calcium and phosphate balance by signalling the bones, kidneys and gut. His corrected calcium at 2.38 is perfectly normal and his vitamin D at 98 is optimal, so the most likely explanation is that adequate calcium and excellent vitamin D have simply suppressed PTH to the point where the parathyroid glands do not need to produce much. This is usually of no clinical significance but is worth rechecking alongside calcium at the next blood test to confirm it remains stable.\n\nHis globulin at 21.5 is slightly below the 23 lower limit. Globulin is a broad protein fraction that includes immunoglobulins and transport proteins. His IgG at 6.59 is at the lower end of its range, and his IgM at 0.624 is just inside its range. IgA at 1.123 is within range. Mildly low globulin can be seen during calorie restriction, particularly at high protein intakes where albumin, which is measured separately, is well maintained but the globulin fraction dips. It is not a sign of immune deficiency at these levels, but it is worth rechecking once his calorie intake returns to maintenance.\n\nHis Epstein-Barr virus antibodies show the pattern of a past infection: EBNA IgG at 216 and VCA IgG at 1,248 are both positive, confirming that his immune system has encountered the virus before, while VCA IgM at 0.564 is negative, confirming there is no current or recent active infection. This is entirely normal. Epstein-Barr virus causes glandular fever (infectious mononucleosis) and is carried by approximately 90 percent of UK adults, most of whom were infected in childhood without knowing it. The positive IgG results simply mean his immune system has a memory of that infection and would respond if re-exposed. This is not a cause of his current symptoms.\n\nHis creatine kinase at 300 is at the top of the 40 to 320 range, which is expected for someone training at high intensity four to five days a week. CK is released from muscle fibres during exercise, and a result near the top of range in a heavy trainer simply reflects training volume. CK-MB, the cardiac-specific fraction, is normal at 2.79, confirming that the CK is skeletal muscle in origin.\n\nHis HB-EGF, heparin-binding epidermal growth factor-like growth factor, at 137.63 is marginally above the 136 upper limit. This is an inflammatory and growth-factor marker that at this margin is of no clinical significance in isolation. His NSE at 16.30 sits exactly at the upper limit and is not flagged; it is a tumour marker that can be mildly elevated by haemolysis or intense exercise and is not a concern at this level. His calculated serum osmolality at 299 is marginally above the 295 upper limit, which reflects normal hydration variation and is not clinically significant. His systemic immune-inflammation index at 657 is marginally above the 600 upper limit; given that every individual inflammatory marker (CRP, D-dimer, all interleukins) is normal, this composite is being pushed by the high-normal neutrophil count and does not indicate a problem.\n\nLewis's PhenoAge, a biological age estimated from nine blood markers (Levine 2018), is 44.9 against a calendar age of 47, so his blood chemistry reads about two years younger than he is. Randox does not report red cell distribution width, so a typical value of 13 percent was assumed for that input. The score is helped by his low CRP, excellent glucose control, good albumin and healthy liver markers, and held back slightly by a creatinine that reflects his muscle mass rather than his kidneys. It is a useful number to track from test to test; the biggest lever for his long-term health in this report remains the lipid picture.\n\nLewis mentioned he has five years of Medichecks results. These would be valuable for tracking his long-term trends, particularly for lipids, ferritin and hormones. We would encourage him to send those to his account manager so that future reports can show the trajectory over time.\n\nIn summary, the headline action from this report is a GP appointment to discuss the raised Lp(a) alongside the elevated ApoB and LDL, and whether lipid-lowering treatment is appropriate given his longevity goal. The hormonal picture suggests that the calorie deficit and training load are suppressing testosterone and allowing oestradiol to sit above the male range, which could be contributing to his symptoms of low libido and low energy, and this should be reviewed with his GP or a specialist and rechecked once his weight is stable. His Omega-3 Index needs raising. His ferritin is mildly raised and should be rechecked. Beneath those findings, a great deal is working in his favour: an exceptional liver, excellent insulin sensitivity, strong kidney function, a clean thyroid, a healthy full blood count, good vitamin and mineral status, and no sign of autoimmune disease, coeliac disease or infection.","is_retest":false,"lifestyle":"Increase oily fish to three portions a week, choosing salmon, mackerel, sardines or anchovies. Anchor: build two fish meals into your weekly meal prep and keep tinned sardines for a quick option. Why: your Omega-3 Index is 6.77 percent, below the 8 percent target, and your AA:EPA ratio at 21.1 is high; three portions a week plus the supplement below should bring both into range within three to four months, which matters more than usual given your Lp(a) finding.\nAdd a portion of soluble fibre to your first meal each day: oats, ground flaxseed stirred into yoghurt, or a handful of beans or lentils. Anchor: add it alongside the protein you are already eating at breakfast. Why: soluble fibre binds bile acids in the gut and forces the liver to pull LDL cholesterol out of the blood to make more, which is one of the most effective dietary tools for lowering ApoB alongside the Lp(a).\nKeep your protein at 200 g per day while in the deficit, then reduce to 135 to 150 g once you return to maintenance calories. Anchor: your current meal prep routine. Why: 200 g supports muscle preservation during the deficit but is more than needed at maintenance, and the excess contributes to your slightly elevated creatinine and urea load.\nOnce you reach your target weight, increase calories to 2,400 to 2,500 kcal per day rather than jumping straight to the full 2,700 maintenance estimate. Hold there for two weeks to let hormones stabilise. Why: testosterone, oestradiol, IGF-1 and libido often recover within four to six weeks of ending a deficit, and a controlled step-up avoids overshooting.\nReduce red and processed meat to two portions a week and replace with fish, poultry or plant protein. Anchor: swap the protein source in two existing meals. Why: this reduces haem iron intake, which is relevant while your ferritin sits above range, and reduces saturated fat, which contributes to ApoB.\nContinue avoiding alcohol. Why: your liver profile is outstanding and your ferritin is already trending in the right direction; alcohol would work against both.\nFix your wake time to the same hour every day, including rest days, and get outside within 30 minutes of waking. Anchor: shoes on before you check your phone. Why: a fixed circadian anchor improves sleep quality, morning cortisol rhythm and energy pattern, all of which support the brain fog and low energy you have been experiencing.\nOn rest days, walk for 30 to 45 minutes at a moderate pace rather than doing nothing. Anchor: the same time slot you would normally train. Why: low-intensity movement on rest days supports recovery, keeps NEAT (non-exercise activity thermogenesis) up during the deficit, and supports HDL production without the cortisol cost of another high-intensity session.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","units":"/100","result":"59","padding":"1","one_sided":"0.5","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","range_type":"no upper","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 58.8. Weakest systems: lipids & cardiovascular 25%, immunology 30%, hormones 43%. Biggest drags: LDL Cholesterol, Lipoprotein (a), Non-HDL Cholesterol, Oestradiol.","high_causes":"","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","units":"years","result":"44.9","padding":"1","one_sided":"0.5","low_causes":"Low inflammation, healthy blood counts","range_type":"no lower","description":"PhenoAge is a biological age estimated from nine blood markers (Levine 2018). Randox does not report red cell distribution width, so a typical value of 13 percent was assumed for that input. At 44.9 against a calendar age of 47, his blood chemistry reads about two years younger than he is, helped by a low CRP, excellent glucose control, a good albumin and healthy liver markers, and held back slightly by a creatinine that reflects his muscle mass and protein intake rather than his kidneys. It is a useful number to track from test to test; the biggest lever for his long-term health in this report remains the lipid picture.","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","lower_normal":"","upper_normal":"52","lower_optimal":"","upper_optimal":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4317     if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
