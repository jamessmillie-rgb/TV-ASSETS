he bone marrow is producing red cells at a slower rate than expected. In the context of normal haemoglobin and adequate iron stores, this is not acutely concerning but may be related to his reduced kidney function, as the kidneys produce erythropoietin (EPO), the hormone that stimulates red blood cell production. Reduced kidney function can lead to reduced EPO and therefore slower red cell production. This should be monitored on repeat testing.","low_causes":"Kidney disease (reduced EPO), bone marrow suppression, nutritional deficiency, aplastic anaemia","high_causes":"Blood loss (recovery), haemolysis, after treatment for anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a simple but powerful marker of systemic inflammation and immune balance. Elevated ratios indicate inflammation or physiological stress. Kamlesh's NLR at 1.80 is within the optimal range, consistent with his low CRP and ESR.","low_causes":"Low neutrophils (ethnic neutropenia, viral infection)","high_causes":"Bacterial infection, physiological stress, chronic inflammation, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"41.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5449","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5279","units":"%","description":"Transferrin saturation measures the percentage of the iron-transport protein transferrin that is carrying iron. It reflects how much iron is available for use in the blood. The optimal range is 25 to 40%. Kamlesh's saturation at 41.32% is marginally above the optimal range but within the laboratory range. It does not suggest iron overload at this level.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, excess iron intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"30.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6170","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.5821","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. It fluctuates throughout the day and with meals. Kamlesh's serum iron at 30.3 is near the upper end of the reference range, which combined with adequate ferritin and normal transferrin, indicates healthy iron status. It is above the optimal range but within the lab range.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss","high_causes":"Haemochromatosis, liver disease, excess iron intake, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. The body produces more transferrin when iron stores are low (to capture more iron) and less when stores are adequate. Kamlesh's transferrin at 2.92 is within the normal and optimal ranges, indicating appropriate iron transport capacity.","low_causes":"Iron overload, chronic disease, inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5195","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3720","upper_optimal_position":"0.5780","units":"umol/L","description":"TIBC (total iron binding capacity) measures the total capacity of the blood to bind and transport iron. It rises in iron deficiency and falls in iron overload. Kamlesh's TIBC at 62 is within the normal and optimal ranges.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3953","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects total body iron reserves. Low ferritin means depleted iron stores, while very high ferritin can indicate iron overload, inflammation, or liver disease. Kamlesh's ferritin at 78 is within the optimal range of 50 to 200 for men, indicating healthy iron reserves.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, inflammation, liver disease, infection, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"22.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5580","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, mood, libido, and body fat distribution. It naturally declines with age from the early 30s. Kamlesh's testosterone at 22.1 is within the optimal range of 18 to 30 for a man of his age, which is a genuinely strong result at 57 with a sedentary lifestyle. This means that low testosterone is not contributing to his fatigue or difficulty losing weight.","low_causes":"Aging, obesity, chronic illness, sleep deprivation, stress, medications (opioids, corticosteroids), hypogonadism","high_causes":"Exogenous testosterone use, androgen-secreting tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"39.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4884","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3849","upper_optimal_position":"0.6103","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to testosterone and other sex hormones, controlling how much is available for the body to use. High SHBG means less free testosterone; low SHBG means more. Kamlesh's SHBG at 39.8 is within the optimal range, meaning a healthy proportion of his testosterone is available for use.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen use, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index","group":"HORMONES","result":"55.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5462","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The free androgen index (FAI) estimates the proportion of testosterone that is unbound and biologically active. It is calculated from total testosterone and SHBG. Kamlesh's FAI at 55.53 is within the optimal range, confirming adequate bioavailable testosterone.","low_causes":"Low testosterone, high SHBG, aging","high_causes":"High testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.442","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5525","lower_normal":"0.2","upper_normal":"0.6","lower_optimal":"0.3","upper_optimal":"0.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"nmol/L","description":"Free testosterone is the fraction of testosterone that is not bound to SHBG or albumin and is immediately available for the body to use. Kamlesh's calculated free testosterone at 0.442 is within the optimal range, confirming that enough testosterone is reaching his tissues.","low_causes":"Low total testosterone, high SHBG, aging","high_causes":"High total testosterone, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"141","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4828","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4108","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In men, small amounts are produced by the testes and through conversion of testosterone by an enzyme called aromatase, which is found in fat tissue. Kamlesh's oestradiol at 141 is within the laboratory range but near the upper limit and above the optimal threshold. This is consistent with his body composition; even at a BMI of 26.6, if he carries visceral fat as he suspects, aromatase activity in that fat tissue can convert testosterone to oestradiol at a slightly higher rate. Losing visceral fat through improved diet and activity could naturally reduce this.","low_causes":"Low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity (increased aromatase), liver disease, exogenous oestrogen, testicular tumours","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3456","upper_optimal_position":"0.6003","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in sleep quality, mood, and as a precursor to other hormones. Kamlesh's progesterone at 0.89 sits right at the lower boundary of the reference range. In men, this is a minor finding and does not typically require intervention.","low_causes":"Normal variation in men, adrenal insufficiency","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4821","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6038","units":"mIU/ml","description":"LH (luteinising hormone) is released by the pituitary gland in the brain and signals the testes to produce testosterone. Kamlesh's LH at 4.35 is within the optimal range, indicating that the pituitary-testicular axis is functioning normally.","low_causes":"Pituitary disease, steroid use, obesity, stress","high_causes":"Primary hypogonadism (testicular failure), aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"5.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5293","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5693","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is released by the pituitary gland and in men stimulates the testes to produce sperm. Kamlesh's FSH at 5.94 is within the optimal range.","low_causes":"Pituitary disease, steroid use, obesity","high_causes":"Primary testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4636","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6212","units":"uIU/ml","description":"Prolactin is a pituitary hormone primarily known for stimulating milk production in women, but in men it also influences immune function and sexual health. Very high levels in men can suppress testosterone. Kamlesh's prolactin at 142 is within the normal and optimal ranges.","low_causes":"Dopamine agonist medication","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"185","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3901","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"170","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5767","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal pattern, peaking in the early morning and falling through the day. An early morning result in the range of 145 to 619 is normal. Kamlesh's cortisol at 185 is at the lower end of the morning range but within normal. Low-normal cortisol alongside chronic fatigue is worth noting but does not indicate adrenal insufficiency at this level.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic stress (adrenal fatigue pattern)","high_causes":"Acute stress, Cushing's syndrome, corticosteroid medication, depression, severe illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"811","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3866","lower_normal":"162","upper_normal":"4940","lower_optimal":"500","upper_optimal":"3500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4040","upper_optimal_position":"0.6311","units":"ug/dL","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to testosterone and oestrogen. It naturally declines with age and is sometimes considered a marker of biological aging. Kamlesh's original result of 2.2 umol/L converts to approximately 811 ug/dL, which is within the laboratory range but below the optimal threshold of 500 ug/dL has already been exceeded. At 57, some decline in DHEA-S is expected and this level does not require intervention.","low_causes":"Aging, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS (women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5449","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and signals the thyroid to produce hormones. It is the most sensitive marker of thyroid function. The optimal range is 1.0 to 2.5. Kamlesh's TSH at 1.99 sits in the middle of the optimal range, indicating that the pituitary is not having to push the thyroid hard to maintain output. This rules out thyroid dysfunction as a cause of his fatigue.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, thyroid failure, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"15.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4717","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, T3, in tissues. The optimal range is 14 to 20. Kamlesh's FT4 at 15.8 is within the optimal range.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, pituitary disease, severe illness","high_causes":"Hyperthyroidism, Graves' disease, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4815","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that directly drives metabolism, energy production, and body temperature. It is converted from T4 in tissues. The optimal range is 4.5 to 6.5. Kamlesh's FT3 at 4.6 is just inside the optimal range, indicating adequate conversion from T4 and sufficient active thyroid hormone availability.","low_causes":"Hypothyroidism, severe illness (sick euthyroid), fasting, aging","high_causes":"Hyperthyroidism, Graves' disease, T3 toxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies directed against thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Kamlesh's TPO antibodies are below 6.6, well within the normal limit of 13.8, ruling out autoimmune thyroid disease.","low_causes":"Normal (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Elevated levels, like TPO antibodies, indicate autoimmune thyroid disease. Kamlesh's result is below 1.3, which is undetectable and normal. More than 80% of the population have undetectable levels.","low_causes":"Normal (no autoimmune thyroid disease)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3509","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.5614","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling, and heart rhythm. The body tightly regulates blood calcium through PTH and vitamin D. Kamlesh's uncorrected calcium at 2.09 is technically within the laboratory range at 2.08 but only just. The lab notes that calcium can be falsely reduced in older specimens.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement for the albumin level, giving a more accurate reflection of true calcium status. Kamlesh's corrected calcium at 2.12 is below the lower limit of 2.2. Mild hypocalcaemia can cause muscle cramps, numbness, and fatigue. His history of leg cramps is worth noting in this context. His PTH at 2.3 is within range, and his vitamin D at 55, while sufficient, is sub-optimal. Improving vitamin D levels may help normalise calcium. However, because the lab notes that calcium can be falsely reduced in older specimens, a repeat on a fresh sample is recommended before drawing firm conclusions.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, sample handling","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5862","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is essential for over 300 enzymatic reactions in the body, including muscle and nerve function, blood sugar control, and energy production. Kamlesh's magnesium at 1.03 is within the optimal range of 0.85 to 1.05. His supplementation with magnesium tablets appears to be working well and likely explains both the healthy level and the resolution of his leg cramps.","low_causes":"Poor dietary intake, alcohol, diabetes, diuretics, proton pump inhibitors, chronic diarrhoea","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1.0","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. It is produced in the skin from sunlight and obtained from diet. The NHS considers above 50 sufficient, but the optimal range for health and disease prevention is 75 to 120. Kamlesh's vitamin D at 55 is sufficient by NHS standards but below the optimal threshold. As a South Asian male, he produces less vitamin D from sunlight due to higher melanin content in the skin, making supplementation especially important. His sub-optimal vitamin D may also be contributing to his borderline-low corrected calcium, as vitamin D is required for calcium absorption in the gut.","low_causes":"Insufficient sunlight, dark skin pigmentation, obesity (fat sequesters vitamin D), malabsorption, aging, indoor lifestyle","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4507","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4057","upper_optimal_position":"0.5610","units":"pmol/L","description":"PTH (parathyroid hormone) is released by the parathyroid glands to raise blood calcium when levels drop. It does this by releasing calcium from bones, increasing calcium absorption in the gut (via vitamin D), and reducing calcium loss through the kidneys. Kamlesh's PTH at 2.3 is within the normal and optimal ranges. In the context of his borderline-low corrected calcium, a normal PTH is somewhat unexpected. Typically, low calcium should trigger a PTH rise. However, the lab has noted that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection, so this may be a sample handling artefact.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, calcium deficiency, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"371","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3892","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4559","upper_optimal_position":"0.6159","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy metabolism. It is found primarily in animal products. The laboratory range starts at 193, but levels below 500 are considered sub-optimal and may contribute to fatigue, brain fog, and reduced nerve health. Kamlesh's B12 at 371 is within the laboratory range but below optimal. Supplementation with sublingual methylcobalamin is recommended to bring this into the 500 to 900 range.","low_causes":"Vegetarian/vegan diet, pernicious anaemia, malabsorption, metformin use, aging, proton pump inhibitors","high_causes":"Excess supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in red blood cell production, DNA synthesis, and the methylation cycle that regulates gene expression and detoxification. Low folate contributes to fatigue, poor concentration, and elevated homocysteine. The optimal level is above 8. Kamlesh's folate at 5 is within the laboratory range but below optimal, likely reflecting inadequate intake of folate-rich foods such as dark leafy greens, lentils, chickpeas, and fortified grains.","low_causes":"Poor dietary intake, alcohol, malabsorption, coeliac disease, certain medications","high_causes":"Excess supplementation, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles that leaks into the blood when muscle tissue is damaged. It rises after intense exercise, physical trauma, or in muscle diseases. Kamlesh's CK at 138 is within the normal and optimal ranges, consistent with his sedentary lifestyle.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.23","lower_normal":"0","upper_normal":"3.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"ng/ml","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement (BPH), prostatitis, or prostate cancer. Kamlesh's PSA at 1.61 is well within the age-appropriate limit of 3.5, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the fraction of PSA that is not bound to proteins. The ratio of free to total PSA helps distinguish between benign prostate conditions and prostate cancer. A higher free PSA ratio (above 19%) favours a benign cause. Kamlesh's free PSA at 0.36 is within range.","low_causes":"Not applicable in isolation","high_causes":"Benign prostatic hyperplasia, prostatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Ratio","group":"PROSTATE","result":"0.224","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.56","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps assess prostate cancer risk when PSA is elevated. A ratio above 0.19 (19%) is considered normal and favours benign causes. Kamlesh's ratio at 0.224 (22.4%) is above the 0.19 threshold, which is a reassuring pattern. However, it falls just below the tighter optimal threshold of 0.25.","low_causes":"Increased risk of prostate cancer (when PSA is elevated)","high_causes":"Favours benign prostatic hyperplasia (when PSA is elevated)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"38.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4054","units":"U/ml","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic cancer but also found in other gastrointestinal cancers. It is a screening tool, not a diagnostic one, and can be mildly elevated in benign conditions including pancreatitis, gallstones, bile duct obstruction, liver disease, and even normal variation. Kamlesh's CA 19-9 at 38.15 is marginally above the upper limit of 37. This   if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const t0=performance.now(), dur=1400;

    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
