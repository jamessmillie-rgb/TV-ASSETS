const REPORT_DATA = {"patient_name":"Kamlesh Patel","dob":"26/02/1969","report_date":"2026-08-13","summary":"Kamlesh is a 57-year-old male presenting with a BMI of 26.6, following a standard mixed diet rated 5 out of 10 for quality with a volume of 6 out of 10. He does not currently train, performing zero cardio and zero resistance sessions per week, with 5,000 to 7,500 daily steps. He is a mild asthmatic and takes creatine at 10mg daily. He consumes no alcohol. He reports low energy and fatigue, weight gain and difficulty losing weight, and poor exercise recovery. His goals are to lose body fat, improve energy levels, and improve long-term health and longevity. He describes a very sedentary lifestyle with extreme lethargy. He was previously prescribed statins for high cholesterol but stopped due to side effects, and notes that prior testing showed his LDL particle sizes were within range. He has a history of yo-yo dieting and believes he may have fatty liver and significant visceral fat. He also reports a history of leg cramps previously resolved with potassium and magnesium supplementation, and a shoulder impingement and painful feet that prevent gym attendance and running respectively.\n\nThe finding in this report that should be discussed with his GP as a priority is his kidney function. His Cystatin C, a protein filtered by the kidneys that gives a more accurate picture of kidney health than creatinine alone, is 1.34, above the upper limit of 1.1. This gives a Cystatin C-based eGFR (estimated glomerular filtration rate, which measures how many millilitres of blood the kidneys filter per minute) of 62, and his creatinine-based eGFR is 67. Both sit in the stage 2 chronic kidney disease range, which runs from 60 to 89. This is not an emergency, and at 57 some decline in kidney filtration is expected, but a result in the low 60s is below what would be considered normal age-related change and warrants a conversation with his GP, particularly because his urea is also elevated at 9.9 against an upper limit of 8.2. The urea rise could reflect mild dehydration at the time of the sample, a higher protein intake, or genuine reduced clearance by the kidneys. His bicarbonate is also low at 18.5, below the lower limit of 20, which can occur when the kidneys are not reabsorbing bicarbonate as efficiently as they should, resulting in a mild metabolic acidosis. His urine is reassuringly clean, with no protein, no red or white blood cells, and no casts, which means there is no sign of active kidney damage or inflammation. The GP should repeat the kidney panel in 6 to 8 weeks on a well-hydrated morning sample to confirm whether this is a consistent finding or whether dehydration or other transient factors played a role.\n\nTurning to the positives, and there are several genuine ones here. His glucose control is excellent. Fasting glucose at 4.5 is right in the middle of the ideal range and HbA1c at 38, which reflects average blood sugar over the past three months, is comfortably below the pre-diabetic threshold of 42. His HOMA-IR, a calculated score that estimates insulin resistance, is 0.41, which is actually below the lower end of the reference range and firmly in the insulin-sensitive category. For a man who describes years of yo-yo dieting and junk food, this is a genuinely reassuring finding. His metabolism has not been ruined. His cells are responding to insulin efficiently, and his blood sugar regulation is working well. His insulin is low at 2.06 against a lower limit of 2.6, and his C-Peptide, a molecule released alongside insulin that confirms how much insulin the pancreas is actually producing, is low at 0.602 against a lower limit of 1.1. However, in the context of a perfectly normal fasting glucose and a healthy HbA1c, these low values simply reflect that his pancreas does not need to produce much insulin to keep his blood sugar controlled, which is actually the hallmark of good metabolic health. This is the opposite of a ruined metabolism.\n\nHis inflammatory markers are genuinely impressive. High-sensitivity CRP, the most sensitive measure of systemic inflammation, is 0.8, well below the cardiovascular risk threshold of 1.0 and far below the lab upper limit of 5.0. His ESR (erythrocyte sedimentation rate), another marker of inflammation, is just 1. For a man concerned about visceral fat and fatty liver, having virtually no measurable inflammation is a strong positive. His total antioxidant activity is elevated at 2.18 against an upper limit of 1.77, which is likely being driven by his creatine supplementation and is not a concern.\n\nHis testosterone is 22.1, sitting comfortably in the optimal range of 18 to 30 for a man of his age, and his free androgen index at 55.5 with an SHBG (sex hormone binding globulin, the protein that carries testosterone in the blood) of 39.8 means a healthy proportion of that testosterone is available for use. At 57 with a sedentary lifestyle, this is better than expected and means hormonal function is not contributing to his fatigue or difficulty losing weight. His thyroid is working well. TSH at 1.99 is in the sweet spot, both free thyroid hormones are within their reference ranges, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease as a cause of his fatigue. His cortisol at 185 is within the normal morning range, his prolactin, LH, and FSH are all unremarkable, and his oestradiol at 141 is within the male reference range.\n\nHis full blood count is broadly healthy. Haemoglobin at 148, red cell count at 4.73, and haematocrit at 0.428 are all within range. His platelets at 251 are healthy, and his white cell count at 4.49 is within range, as are all the individual white cell subtypes. His iron studies are reassuring, with ferritin at 78, transferrin saturation at 41%, serum iron at 30.3, and transferrin at 2.92, all sitting comfortably within their respective ranges. His creatine kinase at 138 is mid-range and unremarkable.\n\nHis liver panel needs careful interpretation in light of his concern about fatty liver. His ALT at 38 is within the laboratory range of under 56 but is above the optimal threshold of 30 for men, and his AST at 36 is within range. His GGT at 34 is within the lab range but above the optimal threshold of 25. His FIB-4 score, a calculated marker that estimates liver fibrosis by combining age, platelets, and liver enzymes, is 1.33, which sits just above the 1.3 threshold that would prompt consideration of a FibroScan. His bilirubin at 10, albumin at 41, total protein at 76, ALP at 97, amylase at 73, and lipase at 47 are all normal. The overall picture is not one of significant liver disease, but the slightly elevated ALT and GGT combined with his concern about visceral fat and his history of poor diet do raise the possibility of early non-alcoholic fatty liver disease (NAFLD). A liver ultrasound or FibroScan would give a definitive answer and is worth requesting through his GP.\n\nNow to the finding that has understandably been on his mind for some time: his cholesterol. His total cholesterol is 6.7, his LDL (low-density lipoprotein, the particles that deposit cholesterol into artery walls) is 4.34 against an upper limit of 3.0, and his ApoB (apolipoprotein B, a direct count of the number of atherogenic particles in the blood) is 1.15 against a target of below 0.9. His non-HDL cholesterol is 4.7 against a target of below 4.0. These are genuinely elevated and represent real cardiovascular risk. However, the picture is more nuanced than a simple statin conversation. His HDL (high-density lipoprotein, the particles that remove cholesterol from artery walls) is 2.0, which is exceptionally high for a man and reflects excellent reverse cholesterol transport. His ApoA1 at 1.74 is strong, and his ApoB to ApoA1 ratio at 0.66 is below the 0.7 lower-risk threshold. His triglycerides at 0.95 are excellent, and his TG to HDL ratio will calculate at 0.48, which is outstanding. His VLDL at 0.43 is low. So the pattern here is one of elevated LDL particle number alongside exceptionally efficient cholesterol clearance, which is exactly the pattern he described when he said his LDL particle sizes were previously found to be within range.\n\nThe critical piece of new information is his Lp(a), or lipoprotein(a). This is 89.69 against a limit of 32. Lp(a) is an inherited lipoprotein that behaves like a particularly sticky form of LDL. It deposits cholesterol into artery walls, promotes blood clotting, and drives local inflammation around plaques. It cannot be changed by diet, exercise, or any currently available medication. It is genetically fixed and will remain at this level for life. This is important information for Kamlesh because it means that a significant portion of his elevated LDL and ApoB is being driven by a factor that is not modifiable through lifestyle. South Asian men already carry a higher baseline cardiovascular risk, and an elevated Lp(a) adds to that. This result should be recorded permanently in his medical notes, and his first-degree relatives, particularly any brothers, sons, or his father if still alive, should be tested. The combination of elevated Lp(a) alongside his elevated ApoB means that despite his excellent HDL and triglycerides, his net cardiovascular risk is higher than average and he should discuss this with his GP. Given he could not tolerate statins, there are other options worth exploring, including PCSK9 inhibitors which also lower Lp(a) by around 20 to 30 percent, bempedoic acid which works differently from statins and does not cause muscle side effects, and ezetimibe which blocks cholesterol absorption in the gut.\n\nHis CA 19-9, a tumour marker sometimes associated with pancreatic or gastrointestinal cancers, is marginally elevated at 38.15 against an upper limit of 37. This is a very small exceedance and CA 19-9 is well known for producing mildly elevated results due to benign causes including inflammation, gallstones, liver conditions, and even normal variation. His CEA at 4.01 is above the non-smoker reference of 2.3 but within the smoker reference of 4.1, and mild elevations in CEA can occur with benign gastrointestinal conditions, inflammation, or fatty liver. Neither of these results in isolation is alarming, but because there are two mildly elevated tumour markers rather than one, it would be prudent to mention both to his GP and repeat them in 8 to 12 weeks. If they remain stable or fall, that is reassuring. If either rises, the GP can investigate further.\n\nHis corrected calcium is 2.12, marginally below the lower limit of 2.2. The lab has noted that calcium can be falsely reduced in older specimens, and his uncorrected calcium at 2.09 is only just inside the reference range at 2.08. His PTH (parathyroid hormone, which regulates calcium levels) is 2.3, which is within range. This marginal result may reflect a sample handling effect, but because it sits below the reference range, it should be repeated on a fresh, promptly processed sample. His magnesium at 1.03 is within the optimal range and his vitamin D at 55 is sufficient by NHS standards but below the optimal threshold of 75. Given that vitamin D plays a direct role in calcium absorption, improving his vitamin D level may help normalise his calcium.\n\nHis vitamin B12 at 371 is within the laboratory range but below the optimal threshold of 500. B12 is essential for energy production, nerve function, and red blood cell formation, and at his current level, topping it up could contribute to improved energy. His folate at 5 is within the laboratory range but below the optimal level of 8, and given his diet is rated only 5 out of 10 for quality, this likely reflects insufficient intake of leafy greens, pulses, and other folate-rich foods.\n\nHis IgE (immunoglobulin E, the antibody involved in allergic responses) is elevated at 164 against an upper limit of 100. This is consistent with his known asthma, as IgE is the antibody class most closely associated with allergic and atopic conditions. It does not require specific action but is worth noting for his GP's records. His other immunoglobulins are within range and his coeliac screen is negative.\n\nHis reticulocyte percentage at 0.66 is within range, but the absolute reticulocyte count at 31.2 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count suggests the bone marrow is producing red cells at a slightly slower rate than expected. In the context of normal haemoglobin and adequate iron stores, this is not concerning on its own but is worth monitoring on repeat testing. His MCHC at 347 is marginally above the upper limit of 345, which at this margin is laboratory variation and not clinically significant.\n\nHis prostate markers are reassuring. PSA at 1.61 is well within the age-appropriate limit, and his free PSA ratio at 0.224 is above the 0.19 threshold, which is a favourable pattern. His urine shows heavy growth of commensals, but the lab has noted this was a plain bottle without boric acid preservative, and in the absence of white blood cells, nitrites, or any symptoms, this almost certainly represents overgrowth due to the sample conditions rather than infection. His rheumatoid factor is negative and his tissue transglutaminase is negative, ruling out coeliac disease.","links":"Kamlesh's report highlights three areas that need attention: kidney function, cardiovascular risk, and nutritional optimisation. Here is what to do about each.\n\nThe kidney function finding is the most important conversation to have with his GP. He should bring the Cystatin C result of 1.34, the Cystatin C eGFR of 62, the creatinine-based eGFR of 67, the urea of 9.9, and the bicarbonate of 18.5 to his appointment. The GP should repeat the kidney panel, ideally with an early morning well-hydrated sample, in 6 to 8 weeks. If the eGFR remains in the low 60s on repeat, this confirms stage 2 CKD and the GP can put monitoring in place. In the meantime, Kamlesh should aim to drink at least 2 litres of water daily, as dehydration alone can reduce eGFR readings and raise urea. He should avoid regular use of NSAIDs such as ibuprofen, which can impair kidney function over time.\n\nFor cardiovascular risk, the conversation with his GP should cover the elevated Lp(a) at 89.69, the ApoB at 1.15, and the LDL at 4.34. The key point is that the Lp(a) is inherited and not modifiable, which means that despite his excellent HDL and triglycerides, his atherogenic particle burden is higher than ideal. He should ask about alternatives to statins given his previous side effects. Bempedoic acid and ezetimibe are two options that do not cause muscle side effects. PCSK9 inhibitors are another option and have the additional benefit of lowering Lp(a) by 20 to 30 percent. Regardless of medication, dietary changes will help reduce the modifiable portion of his LDL. He should increase soluble fibre intake to 10 to 15 grams per day through oats, barley, beans, lentils, and psyllium husk. He should eat oily fish such as salmon, mackerel, or sardines at least twice per week. He should reduce saturated fat by switching to olive oil for cooking, reducing processed and red meat, and choosing lower-fat dairy where possible. His Lp(a) result should be recorded permanently in his medical notes, and he should encourage his first-degree male relatives to have their Lp(a) tested.\n\nFor the mildly elevated tumour markers, he should mention the CA 19-9 of 38.15 and CEA of 4.01 to his GP. These are very marginal elevations and are most likely benign, but they should be repeated in 8 to 12 weeks. If either rises on repeat, the GP can arrange further investigation such as imaging.\n\nFor the corrected calcium of 2.12, a repeat on a fresh sample processed promptly will confirm whether this is genuine. Improving his vitamin D level will support calcium absorption.\n\nFor nutrition and body composition, Kamlesh describes himself as skinny fat, having gained from 130 to 160 pounds. At 72.6kg and 165.1cm with no resistance training, his estimated maintenance calories are approximately 2,000 to 2,100 per day using a sedentary multiplier of 1.3 against a basal metabolic rate of around 1,550. To lose body fat gradually while preserving lean mass, he should eat between 1,600 and 1,800 calories per day. His protein intake should be at least 95 to 115 grams per day, which equates to roughly 1.3 to 1.6 grams per kilogram. This is especially important because without resistance training, the body preferentially loses muscle during a calorie deficit, and adequate protein is the single most important factor in preventing that. Good protein sources that also support his cardiovascular health include chicken breast, turkey, fish, eggs, Greek yoghurt, lentils, and chickpeas. He should focus on improving his diet quality from its current rating of 5 out of 10 by increasing vegetable, legume, and whole grain intake while reducing processed food.\n\nFor movement, his shoulder impingement and painful feet are real barriers to traditional exercise, but they do not prevent all activity. Walking is low-impact and he is currently achieving 5,000 to 7,500 steps. A target of 7,500 to 10,000 would be a meaningful improvement. Swimming or water-based exercise would eliminate the impact on his feet while providing both cardio and some resistance. A physiotherapist could assess his shoulder impingement and design a rehabilitation programme that allows him to begin upper body resistance work within safe ranges. Even bodyweight exercises like wall push-ups, band pull-aparts, and seated rows can build strength without aggravating a shoulder impingement. Lower body resistance work such as goblet squats, leg press, or seated leg curls can be done without involving the shoulder or feet. Building any amount of lean muscle will directly improve his metabolic rate, his insulin sensitivity, and his energy levels.\n\nFor his fatigue and low energy, the blood results actually rule out several common causes. His thyroid is working well, his testosterone is healthy, his iron stores are adequate, and his blood sugar regulation is excellent. The most likely drivers of his fatigue are his sedentary lifestyle, his sub-optimal diet quality, his below-optimal vitamin D and B12 levels, and potentially poor sleep. He should prioritise a fixed wake time, get outside within an hour of waking for natural light exposure, cut caffeine after midday, and keep his bedroom cool and dark. Improving vitamin D and B12 through supplementation may also help.\n\nHis creatine dose of 10mg appears to be a misreport and he likely means 10 grams, which is above the standard maintenance dose of 3 to 5 grams. The research on creatine and brain health is promising but the studied doses are typically 3 to 5 grams daily. He could reduce to 5 grams daily and still receive the potential cognitive and muscular benefits. If he does begin resistance training, creatine at 5 grams daily will support recovery and strength development.","flags":"GP-URGENT:\n\n1. Kidney function: Cystatin C 1.34 (limit under 1.1), Cystatin C eGFR 62, creatinine-based eGFR 67, urea 9.9 (limit 8.2), bicarbonate 18.5 (limit 20.0). Both eGFR measures sit in stage 2 CKD range. Urine is clean with no proteinuria, haematuria, or casts. Recommend repeat renal panel on well-hydrated morning sample in 6 to 8 weeks.\n\n2. Corrected calcium 2.12 (limit 2.2) with PTH 2.3 (within range). Lab notes calcium can be falsely reduced in older specimens. Recommend repeat on fresh, promptly processed sample.\n\nCARDIOVASCULAR:\n\n3. Lp(a) 89.69 nmol/L (limit under 32). Inherited, non-modifiable. South Asian male with additional genetic cardiovascular risk factor. Should be recorded permanently. First-degree relatives should be tested. Consider PCSK9 inhibitor therapy which also lowers Lp(a) by 20 to 30 percent.\n\n4. ApoB 1.15 g/L (target under 0.9), LDL 4.34 mmol/L (limit 3.0), total cholesterol 6.7, non-HDL 4.7 (limit 4.0). Elevated atherogenic particle burden. Partially driven by Lp(a). Previously intolerant of statins. Consider bempedoic acid, ezetimibe, or PCSK9 inhibitor. ApoB/A1 ratio 0.66 (under 0.7 lower risk threshold) provides some mitigation due to HDL of 2.0 and ApoA1 of 1.74.\n\nTUMOUR MARKERS:\n\n5. CA 19-9 at 38.15 (limit 37), CEA 4.01 (non-smoker limit 2.3). Both marginally elevated. Most likely benign but recommend repeat in 8 to 12 weeks. If either rises, arrange further investigation.\n\nMETABOLIC:\n\n6. Insulin 2.06 (range 2.6 to 24.9), C-Peptide 0.602 ug/L or 199 pmol/L (range 1.1 to 4.4 ug/L), HOMA-IR 0.41. All below range but in the context of fasting glucose 4.5 and HbA1c 38, this reflects high insulin sensitivity and low insulin demand, not pancreatic insufficiency.\n\n7. Bicarbonate 18.5 (range 20 to 31). Mild metabolic acidosis, likely related to reduced renal bicarbonate reabsorption. Contextualise with kidney findings above.\n\nLIVER:\n\n8. ALT 38 (lab range under 56 but above optimal of 30), GGT 34 (lab range under 73 but above optimal of 25), FIB-4 1.33 (threshold 1.3). Patient reports concern about fatty liver and visceral fat. Consider liver ultrasound or FibroScan.\n\nIMMUNOLOGY:\n\n9. IgE 164 (limit 100). Consistent with known asthma and atopic tendency.\n\nHAEMATOLOGY:\n\n10. Absolute reticulocytes 31.2 (range 50 to 100). Low production rate despite adequate iron and normal haemoglobin. Monitor on repeat.\n\n11. MCHC 347 (limit 345). Marginal, likely laboratory variation.\n\nNUTRITION:\n\n12. Vitamin D 55 nmol/L, sufficient but below optimal of 75. B12 371 pg/ml, within range but below optimal of 500. Folate 5 ng/ml, within range but below optimal of 8.\n\nReassuring negatives: Fasting glucose 4.5, HbA1c 38, HOMA-IR 0.41 rule out insulin resistance and pre-diabetes. CRP 0.8 and ESR 1 rule out systemic inflammation. Thyroid function normal with negative antibodies. Testosterone 22.1 is optimal for age. PSA 1.61 with free ratio 0.224 is reassuring. Coeliac screen negative. Rheumatoid factor negative. Urine clean for protein, blood, and casts. Iron studies normal. Haemoglobin and red cell indices normal.","recommendations":"1. Book a GP appointment to discuss kidney function (Cystatin C 1.34, eGFR 62 to 67, urea 9.9, bicarbonate 18.5). Request repeat renal panel on a well-hydrated morning sample in 6 to 8 weeks.\n\n2. Request the GP record the Lp(a) result of 89.69 permanently in medical notes. Discuss lipid-lowering options given statin intolerance: bempedoic acid, ezetimibe, or PCSK9 inhibitor.\n\n3. Ask first-degree male relatives to have their Lp(a) tested.\n\n4. Mention the CA 19-9 of 38.15 and CEA of 4.01 to the GP and request a repeat in 8 to 12 weeks.\n\n5. Request a repeat corrected calcium on a fresh, promptly processed sample.\n\n6. Request a liver ultrasound or FibroScan to assess for fatty liver disease.\n\n7. Eat 1,600 to 1,800 calories per day with at least 95 to 115 grams of protein. Increase diet quality by adding more vegetables, legumes, oily fish, and whole grains while reducing processed food and saturated fat.\n\n8. Increase daily steps to 7,500 to 10,000. Explore swimming or water-based exercise. See a physiotherapist for shoulder rehabilitation and consider lower body resistance training.\n\n9. Increase soluble fibre intake to 10 to 15 grams per day through oats, barley, beans, lentils, and psyllium husk to support LDL reduction.\n\n10. Drink at least 2 litres of water daily, particularly given the kidney findings.\n\n11. Begin vitamin D3 supplementation at 3,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 at 100 to 200 mcg.\n\n12. Begin sublingual methylcobalamin B12 at 1,000 mcg daily.\n\n13. Reduce creatine from 10 grams to 5 grams daily. Note: creatine supplementation can raise creatinine levels, which may be contributing to the elevated creatinine reading. Mention this to the GP.\n\n14. Retest in 8 to 12 weeks: kidney panel (creatinine, Cystatin C, urea, bicarbonate, eGFR), corrected calcium, CA 19-9, CEA, vitamin D, B12, folate.","supplementation":"Vitamin D3: 3,000 IU daily of cholecalciferol, taken with the largest fat-containing meal of the day. His current level of 55 is sufficient by NHS standards but below the optimal threshold of 75. As a South Asian male, Kamlesh produces less vitamin D from sunlight due to higher melanin levels, making supplementation especially important. A dose of 3,000 IU rather than the standard 2,000 IU is appropriate to bring his level into the 75 to 100 range.\n\nVitamin K2: 100 to 200 mcg daily of the MK-7 form, taken alongside his vitamin D. Vitamin K2 directs calcium into bones and teeth rather than allowing it to deposit in blood vessel walls. Given his marginally low corrected calcium and his elevated cardiovascular risk, this is particularly relevant.\n\nVitamin B12: 1,000 mcg daily of sublingual methylcobalamin, dissolved under the tongue. Sublingual delivery bypasses the gut and provides better absorption than oral tablets. His B12 at 371 is within the laboratory range but below the optimal threshold of 500. Improving this may contribute to better energy levels and supports red blood cell production, which is relevant given his low absolute reticulocyte count.\n\nFolate: A methylfolate supplement at 400 to 800 mcg daily, or preferably through increased dietary intake of dark leafy greens, lentils, chickpeas, and fortified foods. His folate at 5 is below the optimal level of 8 and folate works alongside B12 in energy metabolism and red blood cell formation.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. While his triglycerides are already excellent, omega-3 has anti-inflammatory properties, supports arterial health, and may modestly improve the function of HDL particles. Given his elevated Lp(a) and ApoB, any additional cardiovascular protection is worthwhile.\n\nMagnesium glycinate: 300 to 400mg taken in the evening before bed. His serum magnesium at 1.03 is within the optimal range, and he has already found that magnesium supplementation helps his leg cramps. Magnesium glycinate is the best-absorbed form, supports sleep quality, muscle relaxation, and may help with recovery as he begins to increase his activity.\n\nCreatine monohydrate: Continue at a reduced dose of 5 grams daily rather than 10 grams. The emerging research on creatine and brain health uses doses of 3 to 5 grams daily, and 5 grams is the well-established maintenance dose for muscular benefits. Important note: creatine supplementation raises creatinine levels as creatine is metabolised to creatinine, and this may be contributing to his elevated creatinine of 106. His GP should be made aware that he takes creatine, as this context is essential for interpreting his kidney markers.\n\nHe should NOT begin iron supplementation. His ferritin at 78 and transferrin saturation at 41% mean his iron stores are healthy and additional iron could push saturation above the optimal range.\n\nThe most important changes from this report are not supplements. They are addressing the kidney findings with his GP, discussing lipid-lowering alternatives given his elevated Lp(a) and ApoB, improving his diet quality from 5 to at least 7 out of 10, increasing his protein intake to 95 to 115 grams per day, and finding a form of exercise that works around his shoulder and foot limitations.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5893","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood at the time of the sample. It is the body's primary fuel source, regulated by insulin. A fasting level between 4.0 and 5.4 is considered optimal, as it reflects tight blood sugar control without the pancreas needing to work hard. Kamlesh's result of 4.5 sits right in the middle of the optimal range, confirming that his blood sugar regulation is excellent despite his concerns about a ruined metabolism.","low_causes":"Fasting, excess insulin production, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, infection, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.475","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c as a percentage reflects average blood sugar levels over the previous two to three months by measuring the proportion of haemoglobin molecules that have sugar attached to them. Below 6.0% is normal, 6.0 to 6.4% is pre-diabetic, and above 6.5% is diabetic. Kamlesh's result of 5.7% is within the normal range, confirming consistent blood sugar control over recent months.","low_causes":"Low blood sugar, anaemia, blood loss","high_causes":"Sustained elevated blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Below 42 is normal, 42 to 47 is pre-diabetic, and above 48 is diabetic. Kamlesh's result of 38 is comfortably below the pre-diabetic threshold, though it is above the tighter optimal threshold of 36. This is a borderline-optimal result that still represents good glycaemic control.","low_causes":"Low blood sugar, anaemia, blood loss","high_causes":"Sustained elevated blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2723","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3243","upper_optimal_position":"0.4054","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to absorb glucose from the blood. A fasting insulin level reflects how much insulin the body needs to keep blood sugar under control. High levels suggest insulin resistance, while low levels alongside normal blood sugar indicate high insulin sensitivity. Kamlesh's insulin at 2.06 is technically below the laboratory lower limit of 2.6, but in the context of a perfect fasting glucose of 4.5 and an HbA1c of 38, this simply means his pancreas is efficiently controlling blood sugar with minimal insulin output. This is a sign of good metabolic health, not pancreatic failure.","low_causes":"High insulin sensitivity, low carbohydrate intake, intermittent fasting, pancreatic insufficiency (when glucose is also elevated)","high_causes":"Insulin resistance, pre-diabetes, obesity, excess carbohydrate intake, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"199","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2013","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5187","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It confirms how much insulin the pancreas is actually producing, independent of any external insulin. Kamlesh's original result of 0.602 ug/L converts to approximately 199 pmol/L, which is below the lower limit. However, the lab has noted that samples not separated within 4 hours can see C-Peptide degrade to 44% of baseline, so this may be artificially low. Combined with normal glucose and low insulin, this most likely reflects efficient, low-demand insulin production rather than pancreatic disease.","low_causes":"High insulin sensitivity, low carbohydrate intake, fasting, sample degradation, type 1 diabetes (when glucose is elevated)","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.41","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.2467","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.3","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2133","upper_optimal_position":"0.5133","units":"","description":"HOMA-IR (Homeostatic Model Assessment for Insulin Resistance) is a calculated score using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. Below 1.0 indicates excellent insulin sensitivity. Above 1.9 suggests early insulin resistance. Above 2.9 indicates significant insulin resistance. Kamlesh's score of 0.41 places him firmly in the insulin-sensitive category. This is a genuinely positive result, particularly given his concern that years of yo-yo dieting have damaged his metabolism. His cells are responding efficiently to insulin.","low_causes":"High insulin sensitivity, low carbohydrate intake, fasting","high_causes":"Insulin resistance, obesity, sedentary lifestyle, excess carbohydrate intake, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"41.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1593","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B (Homeostatic Model Assessment for Beta-cell function) estimates the functional capacity of the insulin-producing beta cells in the pancreas. It is calculated as (20 x Insulin) / (Glucose - 3.5). Kamlesh's score of 41.2 is below the reference range of 80 to 200. However, HOMA-B can be misleadingly low when fasting insulin is very low due to high insulin sensitivity rather than beta-cell failure. Because his fasting glucose and HbA1c are both normal, the low HOMA-B reflects low demand on the pancreas rather than an inability to meet demand.","low_causes":"High insulin sensitivity, low carbohydrate intake, fasting, early beta-cell decline (if glucose is also rising)","high_causes":"Insulin resistance (compensatory increase), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3393","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that leaks into the bloodstream when liver cells are damaged or inflamed. It is one of the most sensitive markers for liver health. While the laboratory upper limit is 56, the optimal threshold for men is below 30. Kamlesh's result of 38 is within the lab range but above optimal, suggesting some degree of liver cell stress. Given his concern about fatty liver and visceral fat, this mild elevation is consistent with early non-alcoholic fatty liver disease, though it could also reflect dietary factors or the effects of creatine supplementation.","low_causes":"Normal liver function, vitamin B6 deficiency","high_causes":"Fatty liver disease, alcohol, viral hepatitis, medications, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4531","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5312","units":"IU/L","description":"AST (aspartate aminotransferase) is another enzyme found in the liver but also in the heart and muscles. It rises when any of these tissues are damaged. Kamlesh's AST at 36 is within the laboratory range but above the optimal threshold of 30. In combination with the ALT, this mild elevation supports the possibility of early fatty liver changes.","low_causes":"Normal tissue health, vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart damage, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2329","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT (gamma-glutamyltransferase) is a liver enzyme particularly sensitive to bile duct obstruction, alcohol, and metabolic stress on the liver. The laboratory range extends to 73 for men, but the optimal threshold is below 25. Kamlesh's GGT at 34 is within the laboratory range but above optimal. Given that he does not drink alcohol, this mild elevation is most likely related to metabolic factors such as visceral fat, dietary quality, or early fatty liver changes.","low_causes":"Normal liver function","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5552","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/L","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, and bile ducts. Elevations can indicate bile duct obstruction, bone disease, or liver disease. Kamlesh's ALP at 97 is within the reference range and not concerning.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Elevated levels can indicate liver disease, bile duct problems, or excessive red blood cell breakdown. Kamlesh's bilirubin at 10 is comfortably within the normal and optimal ranges.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications, and helps maintain fluid balance. It is also a marker of liver synthetic function and nutritional status. Kamlesh's albumin at 41 is within the optimal range, confirming that the liver's protein-manufacturing capacity is intact.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein is the combined measurement of albumin and globulin in the blood. It reflects liver function, immune function, and nutritional status. Kamlesh's result at 76 is within the optimal range.","low_causes":"Liver disease, malnutrition, kidney disease","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin includes the immune proteins (immunoglobulins) and transport proteins in the blood. It is calculated by subtracting albumin from total protein. Kamlesh's globulin at 35 is within the laboratory range but at the upper end, sitting just outside the optimal range. This is not concerning but may reflect immune system activity, possibly related to his atopic tendency as reflected by his elevated IgE.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3738","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. A low ratio can indicate liver disease, immune system overactivity, or kidney protein loss. Kamlesh's ratio at 1.17 is within the laboratory range but below optimal, reflecting the relatively high globulin level. This is a minor finding.","low_causes":"Liver disease, chronic inflammation, autoimmune disease, multiple myeloma","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4586","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3448","units":"","description":"FIB-4 is a calculated score that estimates the degree of liver fibrosis (scarring) using age, platelet count, ALT, and AST. A score below 1.3 (or below 2.0 in those over 65) generally allows liver fibrosis to be excluded. Kamlesh's score of 1.33 sits just above the 1.3 threshold. At 57, age is pushing this score upward, and the relatively elevated ALT of 38 is also contributing. The lab notes suggest considering a FibroScan at scores above 1.3. Given his concern about fatty liver, a FibroScan or liver ultrasound would provide a definitive answer.","low_causes":"Healthy liver, young age, high platelet count","high_causes":"Liver fibrosis, cirrhosis, increasing age, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels can indicate pancreatitis or salivary gland inflammation. Kamlesh's result at 73 is comfortably within the normal and optimal ranges, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis (advanced), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5745","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase and is the preferred marker for suspected pancreatitis. Kamlesh's result at 47 is within range, confirming healthy pancreatic function.","low_causes":"Not clinically significant","high_causes":"Pancreatitis, pancreatic obstruction, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6472","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the combined measurement of all cholesterol fractions in the blood, including HDL, LDL, and VLDL. A desirable level is below 5.18. Kamlesh's total cholesterol at 6.7 is elevated, but this number alone is misleading because it includes his exceptionally high HDL of 2.0. The more meaningful measures are his LDL and ApoB, which are discussed separately.","low_causes":"Malnutrition, hyperthyroidism, liver disease, certain medications","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2794","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats circulating in the blood, primarily derived from dietary fat and carbohydrate. Elevated triglycerides are a marker of metabolic dysfunction, insulin resistance, and cardiovascular risk. Kamlesh's fasting triglycerides at 0.95 are excellent, well below the upper limit and within the optimal range of below 1.0. This is consistent with his excellent insulin sensitivity.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2756","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues. It is a precursor to LDL and its level reflects triglyceride metabolism. Kamlesh's VLDL at 0.43 is well within range and optimal, consistent with his excellent triglyceride level.","low_causes":"Low fat diet, genetic factors","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6452","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol fraction that removes excess cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is protective against cardiovascular disease. Kamlesh's HDL at 2.0 is exceptionally high for a man, well above both the desirable threshold of 1.55 and the optimal threshold of 1.4. This is one of the strongest positives in his lipid panel and provides genuine cardiovascular protection.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7233","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.42","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol fraction that deposits cholesterol into artery walls, driving atherosclerosis (plaque buildup). The target for cardiovascular health is below 3.0, and the optimal target is below 2.6. Kamlesh's LDL at 4.34 is significantly elevated. However, LDL alone does not tell the full story. ApoB, which directly counts the number of atherogenic particles, is a more accurate predictor of risk and is discussed below.","low_causes":"Hyperthyroidism, malnutrition, liver disease, very low-fat diet, genetic factors","high_causes":"Diet high in saturated fat, genetic factors (familial hypercholesterolaemia), hypothyroidism, obesity, sedentary lifestyle, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a simple measure of cardiovascular risk. Lower ratios indicate that a greater proportion of total cholesterol is the protective HDL fraction. Kamlesh's ratio of 3.35 is within the desirable range of under 4.5 and within optimal, driven by his exceptionally high HDL. This ratio provides a more balanced view of his cardiovascular risk than total cholesterol alone.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, high LDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7463","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This expresses HDL as a percentage of total cholesterol. Above 20% is desirable, and above 25% is optimal. Kamlesh's HDL percentage at 29.85% is excellent, meaning nearly a third of his total cholesterol is the protective HDL fraction.","low_causes":"Low HDL, metabolic syndrome, sedentary lifestyle","high_causes":"High HDL, healthy metabolism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5875","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL. It captures all the atherogenic (artery-damaging) cholesterol fractions in one number, including LDL, VLDL, and Lp(a). The target is below 4.0. Kamlesh's non-HDL at 4.7 is elevated, consistent with his raised LDL and elevated Lp(a).","low_causes":"Low LDL, low triglycerides, statin therapy","high_causes":"High LDL, high Lp(a), elevated triglycerides, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.725","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 (apolipoprotein A1) is the main structural protein of HDL particles. It reflects the number and function of HDL particles, making it a more precise measure than HDL cholesterol alone. Kamlesh's ApoA1 at 1.74 is well above the 1.2 threshold and above the optimal threshold of 1.4, confirming excellent reverse cholesterol transport capacity.","low_causes":"Metabolic syndrome, sedentary lifestyle, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy metabolism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is the protein found on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, it provides a direct count of the total number of atherogenic particles in the blood. It is considered a more accurate predictor of cardiovascular risk than LDL cholesterol alone. The target is below 0.9, and the optimal target is below 0.8. Kamlesh's ApoB at 1.15 is significantly elevated, indicating a high number of atherogenic particles. Part of this is being driven by his elevated Lp(a), which also carries ApoB and cannot be reduced through lifestyle changes.","low_causes":"Statin therapy, very low-fat diet, malnutrition, hyperthyroidism","high_causes":"High LDL, elevated Lp(a), familial hypercholesterolaemia, diet high in saturated fat, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the best single measures of cardiovascular risk because it captures the balance between atherogenic particles (ApoB) and protective particles (ApoA1). Below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Kamlesh's ratio at 0.66 falls into the lower-risk category, which is reassuring. His exceptionally high ApoA1 of 1.74 is pulling this ratio into a favourable range despite the elevated ApoB. However, this does not eliminate the risk from his elevated ApoB and Lp(a); it means the balance between deposition and clearance is better than the ApoB alone would suggest.","low_causes":"High ApoA1, low ApoB, statin therapy","high_causes":"Low ApoA1, high ApoB, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"89.69","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lp(a) (lipoprotein a) is a genetically determined lipoprotein that behaves like a particularly sticky and dangerous form of LDL. It deposits cholesterol into artery walls, promotes blood clot formation, and drives local inflammation around plaques. It is entirely inherited, cannot be changed by diet, exercise, or most medications, and remains at the same level throughout life. Kamlesh's Lp(a) at 89.69 is significantly above the 32 nmol/L threshold, placing him in the slightly-to-moderately increased risk category. This is an important finding because it means a portion of his elevated LDL and ApoB is being driven by a factor he cannot modify through lifestyle. This result should be recorded permanently in his medical notes. His first-degree blood relatives should also be tested. PCSK9 inhibitors are currently the only medications that lower Lp(a), typically by 20 to 30 percent.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.16","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a simple but powerful marker of insulin resistance and metabolic health. A lower ratio indicates better insulin sensitivity and a more favourable metabolic profile. The optimal threshold is below 0.87. Kamlesh's ratio of 0.48 is outstanding and reflects his excellent triglycerides and high HDL. This is one of the strongest metabolic markers in his report.","low_causes":"High HDL, low triglycerides, excellent insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.225","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich lipoprotein remnants, calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent cardiovascular risk factor. Kamlesh's remnant cholesterol at 0.36 is within the optimal range of below 0.5, consistent with his healthy triglyceride metabolism.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.08","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP (C-reactive protein) is the most sensitive blood marker for systemic inflammation. It is produced by the liver in response to inflammatory signals throughout the body and is a well-established independent risk factor for cardiovascular disease. Below 1.0 is low cardiovascular risk, 1.0 to 3.0 is moderate, and above 3.0 is high. Kamlesh's hs-CRP at 0.8 places him in the low-risk category, which is genuinely impressive and means there is no significant systemic inflammation despite his concern about visceral fat.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling occurs when inflammatory proteins in the blood cause red cells to clump together. Kamlesh's ESR at 1 is as low as this marker gets, confirming the absence of any significant inflammatory process.","low_causes":"Normal, low inflammation","high_causes":"Infection, inflammation, autoimmune disease, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5897","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6487","units":"mmol/L","description":"Sodium is the primary electrolyte that controls fluid balance and blood pressure. The kidneys tightly regulate sodium levels. Kamlesh's sodium at 144 is within the normal and optimal ranges.","low_causes":"Excess fluid intake, heart failure, kidney disease, diuretics, SIADH","high_causes":"Dehydration, excess sodium intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance, blood pressure, and the body's acid-base balance. Kamlesh's chloride at 99 is within the normal and optimal ranges.","low_causes":"Vomiting, excess sweating, metabolic alkalosis, diuretics","high_causes":"Dehydration, kidney disease, metabolic acidosis, excess saline intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"18.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2879","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, regulated by the kidneys and lungs. It neutralises acids produced by normal metabolism. Low bicarbonate indicates the blood is more acidic than it should be, a state called metabolic acidosis. Kamlesh's bicarbonate at 18.5 is below the lower limit of 20. In the context of his reduced kidney function (eGFR 62 to 67), this likely reflects the kidneys' reduced ability to reclaim bicarbonate from the urine. Mild metabolic acidosis can contribute to fatigue, muscle weakness, and reduced exercise capacity, all of which Kamlesh reports.","low_causes":"Kidney disease, diabetic ketoacidosis, severe diarrhoea, strenuous exercise, renal tubular acidosis","high_causes":"Vomiting, diuretics, Cushing's syndrome, metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"9.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7787","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product produced when the body breaks down protein. The kidneys filter it out of the blood for excretion in urine. Elevated urea can indicate reduced kidney function, dehydration, or high protein intake. Kamlesh's urea at 9.9 is above the upper limit of 8.2. In the context of his reduced eGFR, this likely reflects reduced renal clearance. Dehydration at the time of the sample could also be contributing, which is why a repeat on a well-hydrated sample is recommended.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein intake, kidney disease, gastrointestinal bleeding, catabolism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"106","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7179","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism that the kidneys filter out of the blood. It is used to estimate kidney function (eGFR). Kamlesh's creatinine at 106 is marginally above the upper limit of 104. An important consideration is that he takes creatine supplementation, which is metabolised to creatinine and can raise this result independently of kidney function. However, his Cystatin C (which is not affected by creatine supplementation) is also elevated, confirming that the reduced eGFR is genuine and not solely a creatine artefact.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, dehydration, high protein diet, creatine supplementation, high muscle mass, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine-based)","group":"KIDNEY FUNCTION","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how many millilitres of blood the kidneys can filter per minute. It is calculated from creatinine, age, sex, and ethnicity. Above 90 is normal, 60 to 89 is stage 2 CKD (mildly reduced), 30 to 59 is stage 3, and below 30 is severe. Kamlesh's creatinine-based eGFR of 67 sits in the stage 2 range. Creatine supplementation could be inflating his creatinine and therefore lowering this estimate, but his Cystatin C eGFR of 62 (which is not affected by creatine) corroborates the finding. This should be discussed with his GP.","low_causes":"Kidney disease, dehydration, creatine supplementation (falsely lowers), aging","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6091","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all cells in the body and filtered by the kidneys. Unlike creatinine, its level is not affected by muscle mass, diet, or creatine supplementation, making it a more reliable marker of kidney function. Kamlesh's Cystatin C at 1.34 is above the upper limit of 1.1, giving a Cystatin C-based eGFR of 62. This confirms that his reduced kidney filtration is genuine and not an artefact of creatine supplementation.","low_causes":"Hyperthyroidism, high muscle mass (minor effect)","high_causes":"Kidney disease, inflammation, corticosteroid use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"This is the eGFR calculated from Cystatin C rather than creatinine. It is not influenced by muscle mass or creatine supplementation and is considered more accurate in people with atypical body composition. Kamlesh's Cystatin C eGFR of 62 aligns with his creatinine-based eGFR of 67, both sitting in the stage 2 CKD range. The GP should repeat this in 6 to 8 weeks to confirm.","low_causes":"Kidney disease, aging","high_causes":"Healthy kidneys","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"307","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4277","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5167","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in foods like red meat, organ meats, and alcohol. The kidneys excrete uric acid, and high levels can cause gout and kidney stones and are associated with cardiovascular risk. Kamlesh's uric acid at 307 is within the normal and optimal ranges. Given his reduced kidney function, it is reassuring that uric acid clearance is still adequate.","low_causes":"Low purine diet, certain medications, Wilson's disease","high_causes":"High purine diet, alcohol, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"148","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein in red blood cells. Low haemoglobin means anaemia and insufficient oxygen delivery to tissues, causing fatigue. Kamlesh's haemoglobin at 148 is within the normal and optimal ranges for men, confirming that anaemia is not contributing to his fatigue.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss, bone marrow disorders",
