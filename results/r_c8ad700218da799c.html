<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"dob":"16/03/1982","flags":"Urinary red blood cells above 500 per microlitre (threshold for significance is 25). No infection markers (WBC below 1, nitrites negative, insignificant growth on culture). At 44 this requires urgent GP referral for urological investigation to exclude structural and other causes. If the sample was collected during or near a menstrual period, a repeat mid-cycle sample is needed, but given the level, investigation should not be delayed.\nhs-CRP 8 mg/L (limit below 5, ideal below 1). Significant systemic inflammation. In the context of Crohn's disease, this most likely reflects active mucosal inflammation and warrants reassessment by her GP or gastroenterologist, including consideration of faecal calprotectin or imaging.\nIron deficiency: ferritin 13 ng/ml (optimal above 40), transferrin saturation 11.7% (limit above 18%), MCV 74.5 fL (limit above 83), MCH 24.3 pg (limit above 27), RDW 16.6% (limit below 14%), red blood cell count 5.41 (limit below 4.8, compensatory), reticulocyte absolute 37.87 (limit above 50). Not yet anaemic (haemoglobin 131) but iron stores are depleted. Crohn's-related malabsorption and possible gut blood loss are the likely mechanisms. GP to assess whether oral iron will be absorbed or whether intravenous iron is more appropriate.\nHbA1c 44 mmol/mol (pre-diabetic range 42 to 47). Fasting glucose 4.0 is normal. Fasting insulin 9.67 (optimal below 8), HOMA-IR 1.72 (optimal below 1.5). Iron deficiency can falsely elevate HbA1c. Repeat after iron repletion (3 to 4 months). Family history of type 2 diabetes increases significance. Dietary changes recommended in the interim.\nApoB 1.08 g/L (desirable below 0.9, borderline high 1.0 to 1.19). Lp(a) 28.03 nmol/L is ideal, confirming the ApoB elevation is modifiable. Cardiovascular risk score 75 out of 100, driven primarily by CRP and ApoB. Triglycerides 1.71 at the fasting boundary. LDL 2.62 marginally above optimal. HDL 1.5 is reasonable. ApoB/A1 ratio 0.517 is within the reference range and low risk. Dietary intervention with increased soluble fibre, oily fish twice a week, and reduced sugar frequency. Retest after inflammation is addressed to separate inflammatory from metabolic drivers.\nCortisol 85 nmol/L, below the 7 to 9 am reference floor of 145.4. May reflect late sampling time, but alongside exhaustion on waking, persistent low energy, stress most days and sleep under 6 hours, adrenal function should be assessed. GP to arrange a fasting morning cortisol between 8 and 9 am, and a short Synacthen test if that is low.\nTSH 0.51 mIU/L, marginally below the lower limit of 0.55. Free T4 17.7 and free T3 5.0 are both within ideal ranges. Both thyroid antibodies negative. Most likely transient or stress-related. Not suggestive of hyperthyroidism. Worth noting for future thyroid monitoring.\nFree testosterone 0.0069 nmol/L, below the lower limit of 0.013. Total testosterone 0.6 is at the low end of range. SHBG 66.8 is on the higher side, binding more testosterone. May contribute to low mood and difficulty building muscle. Worth discussing with GP alongside the hormonal and cortisol picture.\nCystatin C 1.14 mg/L (limit below 1.1), giving a Cystatin C eGFR of 87 and combined eGFR of 87 (optimal above 90). At 44 this is mildly below optimal and may reflect the recent hypertension or inflammatory burden. Should be monitored alongside blood pressure treatment.\nIgA 5.2 g/L (limit below 3.5). Elevated mucosal immunoglobulin, consistent with Crohn's disease and possibly asthma. Globulin 42 (limit below 36) is a consequence of the raised IgA. Not a separate concern.\nWhite cell count 10.18 (limit below 10). Driven by neutrophils at the upper end of range. Consistent with the inflammatory picture. Systemic Immune-Inflammation Index 754 (reference below 600). All part of the Crohn's-driven inflammation rather than a separate process.\nPhenoAge 48 against a calendar age of 44. The four-year gap is driven primarily by the CRP, white cell count and metabolic markers. Expected to improve with Crohn's management and iron repletion.\nReassuring negatives: liver function is excellent with ALT 17, AST 17, GGT 23, FIB-4 0.56 and a clear liver scan, making liver disease very unlikely. Thyroid antibodies are both negative, making autoimmune thyroid disease very unlikely. Coeliac screen is negative with adequate IgA, making coeliac disease very unlikely as a cause of iron deficiency or gut symptoms. All tumour markers (CA125, CA15-3, CA19-9, CEA) are well within limits. Rheumatoid factor is negative. Lp(a) is ideal. Vitamin D at 94 is within optimal range. Calcium, phosphate and PTH are healthy. Pancreatic enzymes are normal.\nNot reported on this occasion: potassium.","links":"The central thread running through this report is Crohn's disease and the inflammatory and nutritional consequences it creates, even when it may feel relatively quiet day to day. The hs-CRP at 8, the elevated IgA at 5.2, the raised white cell count and the Systemic Immune-Inflammation Index at 754 all point to active mucosal inflammation. The gut is the most likely source given the diagnosis, and the bloating and digestive discomfort she reports support this.\n\nThat same gut inflammation creates the second thread: iron deficiency. The depleted ferritin at 13, the transferrin saturation at 11.7%, the microcytic red cells with an MCV of 74.5 and MCH of 24.3, the compensatory high red cell count and the low reticulocyte absolute count all tell a story of iron stores that have been drained, most likely through a combination of poor absorption across an inflamed gut wall and low-grade blood loss from the intestinal lining. This iron deficiency is almost certainly the largest single contributor to her fatigue, and it also means her HbA1c may be artificially elevated because iron-deficient red blood cells live longer and accumulate more glycated haemoglobin.\n\nThe metabolic thread is therefore harder to read with confidence until the iron is corrected. The HbA1c of 44 sits in the pre-diabetic range, but some of that elevation may be artefactual. The fasting insulin at 9.67 and HOMA-IR at 1.72 suggest genuine early insulin resistance that is mild but real, and her family history of type 2 diabetes raises the stakes. Once iron is repleted and the HbA1c repeated, the true metabolic position will become clear. In the meantime, dietary changes that reduce sugar frequency and increase protein and fibre will address both the metabolic risk and the gut health simultaneously.\n\nThe cardiovascular risk score of 75 looks alarming but is driven largely by the CRP and HbA1c rather than by catastrophic lipid numbers. Her Lp(a) is ideal, her ApoB/A1 ratio is low risk, and her HDL is reasonable. The ApoB at 1.08 is genuinely elevated and represents real particle burden, but if the inflammation settles and the metabolic markers improve, the overall risk profile should shift substantially. This is a score that responds to treatment.\n\nThe hormonal picture and the cortisol raise separate but connected questions. The low cortisol could reflect sample timing, but alongside exhaustion on waking, persistent low energy, stress that feels unmanageable most days, and sleep under six hours with night waking, it is worth investigating properly. If adrenal output is genuinely low, it would connect to the fatigue, the low mood and the difficulty managing stress. The low free testosterone may compound the low mood and the sense of training hard without reward. These need clinical assessment rather than supplementation.\n\nThe haematuria is a standalone finding that does not connect to the other threads. It requires its own investigation regardless of the menstrual cycle timing, given the level is above 500.","summary":"Customer is a 44-year-old female following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). She trains 6 times per week (3 cardio, 3 resistance) at moderate intensity. Her step count was not recorded. She sleeps under 6 hours a night, wakes feeling exhausted or waking in the night, and her energy is low all day. Stress feels hard to manage most days. She does not drink alcohol. She takes two asthma inhalers and was recently started on blood pressure medication approximately two weeks before this test, following investigations that included a liver scan, chest X-ray and ECG, all of which were clear. She has Crohn's disease but is not currently on medication for it. She supplements with magnesium and vitamin D. She has a family history of type 2 diabetes and an autoimmune condition. She has had a previous blood test but never saw the results. Her periods are irregular. She reports low mood and anxiety, bloating and digestive discomfort, irregular periods and low energy and fatigue, lasting months. Her goals are to balance her hormones, improve digestion and gut health, and reduce stress and anxiety.\n\nThe finding that should be discussed with her GP first is the urine result. Her urinary red blood cells are above 500 per microlitre, which is far above the threshold of 25 considered significant. This is called significant haematuria, meaning there is a substantial level of blood in the urine. The nitrites are negative, the white blood cells are below 1 and the culture shows insignificant growth, so infection is not the explanation. At 44 with no signs of urinary infection, blood in the urine at this level needs urological investigation. The GP should arrange a referral. It is worth noting that if this sample was collected during or very close to a menstrual period, contamination is one possibility, but given the level is above 500, it should not be assumed and should be confirmed with a repeat sample taken mid-cycle and then investigated if it persists.\n\nThe second finding for her GP is the hs-CRP, which is the high-sensitivity C-reactive protein, a marker of systemic inflammation. Hers is 8 mg/L, above the upper limit of 5 and well above the ideal of below 1. CRP rises in response to active inflammation anywhere in the body. In the context of Crohn's disease, this is the most likely driver. Even when Crohn's feels quiet symptomatically, it can produce low-grade inflammation that CRP detects. The bloating and digestive discomfort she reports may reflect more active disease than she realises. This result, together with her symptoms, suggests a conversation with her GP or gastroenterologist about whether her Crohn's needs reassessment, potentially including faecal calprotectin or imaging to check for subclinical inflammation.\n\nThe CRP also has implications for several other results. The Systemic Immune-Inflammation Index, which combines neutrophils, platelets and lymphocytes into a single score reflecting immune activation, is 754, above the upper ideal of 450 and the upper reference of 600. Her white blood cell count is 10.18, just above the upper limit of 10, driven by neutrophils at 6.64 which are within range but at the higher end. These are consistent with an active inflammatory process rather than infection, and Crohn's is the most plausible source.\n\nThe third important cluster is iron deficiency. Her ferritin is 13, which is within the laboratory range of 10 to 291 but far below the optimal floor of 40 for a woman. Ferritin is the body's iron storage protein, and at 13 the stores are essentially depleted. Her transferrin saturation, which measures how much of the iron-carrying protein transferrin is actually loaded with iron, is 11.7%, below the lower limit of 18% and well below the optimal of 25%. The iron-binding capacity is 71.7, near the top of its range, which means the body is making more transport protein because it is desperate for iron. And the full blood count tells the same story: her MCV, the average size of a red blood cell, is 74.5, below the lower limit of 83, and her MCH, the average amount of haemoglobin per cell, is 24.3, below the lower limit of 27. Small, pale red blood cells are the hallmark of iron-deficient red cell production. Her red blood cell count is actually high at 5.41 against an upper limit of 4.8, which is the body's compensatory response: when each cell carries less oxygen because it is iron-starved, the bone marrow produces more cells to make up the difference. Her RDW, which measures the variation in red cell size, is 16.6% against an upper limit of 14%, confirming that the marrow is producing a mix of older normal-sized cells and newer smaller ones. Her reticulocytes, the youngest red blood cells just released from the bone marrow, are low in absolute terms at 37.87 against a lower limit of 50, suggesting the marrow is struggling to keep up without adequate iron supply. Haemoglobin is still holding at 131, within range, so she is not yet anaemic, but this is iron deficiency that has not quite tipped into iron-deficiency anaemia.\n\nIn someone with Crohn's disease, iron deficiency has two potential mechanisms: malabsorption from the inflamed gut and chronic blood loss from the gut lining. The raised CRP supports the possibility that Crohn's is active enough to cause both. Her GP should check whether oral iron will be absorbed adequately given the Crohn's, or whether intravenous iron is more appropriate. This is the single change most likely to improve her fatigue and low energy.\n\nHer HbA1c, which measures average blood sugar over the preceding two to three months, is 44 mmol/mol, above the threshold of 42 that marks the pre-diabetic range. Her fasting glucose at 4 is excellent, and her fasting insulin at 9.67 is within the reference range of 2.6 to 24.9 but above the optimal ceiling of 8, giving a HOMA-IR of 1.72 against an ideal of below 1.5. HOMA-IR estimates how hard the body has to work to keep blood sugar controlled; at 1.72 the system is working harder than it should. The combination of a normal fasting glucose, a mildly raised insulin and an HbA1c in the pre-diabetic zone suggests that blood sugar is being kept in check, but at a cost, and the system is beginning to lose ground. Given her family history of type 2 diabetes, this is an important finding. The estimated average glucose, a calculation derived from the HbA1c, is 7.2 mmol/L, above the ideal of 6.2. It is worth noting that iron deficiency itself can falsely raise HbA1c by extending the lifespan of red blood cells, so some of this elevation may resolve once her iron is corrected. Her GP should repeat the HbA1c after iron has been repleted for three to four months to get a true reading. The TyG index, another insulin resistance estimate built from triglycerides and glucose, is 8.6, above the ideal of 8.5 but within the reference limit of 8.8, which is consistent with early metabolic strain rather than established resistance.\n\nHer cardiovascular markers tell a mixed story. Total cholesterol at 4.8 is below the desirable threshold of 5.18. Her HDL at 1.5 is above the risk threshold of below 1.04 but below the optimal of 1.6 for a female. Triglycerides at 1.71 are marginally above the upper limit of 1.70, essentially at the boundary. Her LDL at 2.62 is within the laboratory range but above the optimal of below 2.6 by a tiny margin. The more important number is ApoB, apolipoprotein B, which counts the actual number of potentially harmful cholesterol-carrying particles in the blood. Hers is 1.08, above the desirable limit of 0.9 and in the borderline high category of 1.0 to 1.19. ApoB is a better predictor of cardiovascular risk than LDL alone because it counts particles rather than measuring cholesterol content. Her ApoB to ApoA1 ratio at 0.517 is within the reference range and below the risk threshold of 0.6, which is reassuring because ApoA1 at 2.09 is strong, reflecting good protective particle numbers. Her Lp(a), lipoprotein(a), is 28.03 nmol/L, below the ideal threshold of 32. Lp(a) is genetically determined and is not meaningfully changed by diet or exercise, so this is genuinely useful information: it means the elevated ApoB is driven by modifiable factors such as diet and metabolic health rather than by an inherited particle. Her Lp(a)-corrected LDL is 2.53, within the reference range, confirming that her modifiable LDL burden is real but modest. The cardiovascular risk score, a TrueVitals index from 0 to 100 that weighs ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c together, is 75 out of 100, which is high. The two main drivers are the hs-CRP at 8 and the ApoB at 1.08, with the HbA1c contributing as well. If the CRP comes down with Crohn's management, and the metabolic markers improve with iron repletion and dietary changes, this score should fall substantially on retest.\n\nHer IgA, immunoglobulin A, is 5.2 against an upper limit of 3.5. IgA is the antibody that patrols mucosal surfaces including the gut, lungs and urinary tract. An elevated IgA is well recognised in Crohn's disease as the immune system upregulates mucosal defence. It may also reflect her asthma. Her IgG and IgM are both within range, and her IgE at 66.8 is within the limit of 100 but is the atopic marker, consistent with her asthma. This pattern fits her clinical picture rather than suggesting a new diagnosis. The coeliac screen (tissue transglutaminase IgA) is negative, which, combined with an IgA that is clearly not deficient, makes coeliac disease very unlikely as a contributor to her gut symptoms or iron deficiency.\n\nHer thyroid function is mostly reassuring but worth a note. TSH at 0.51 is just below the lower limit of 0.55. Free T4 at 17.7 is within the ideal range of 14 to 20, and free T3 at 5 is within the ideal range of 4.5 to 6.5. The FT3 to FT4 ratio at 0.282 is within optimal, confirming good conversion. Both thyroid antibodies are negative. A marginally low TSH with normal free hormones is most often a transient finding and may relate to the recent physiological stress of newly diagnosed hypertension, the inflammatory burden, or simply laboratory variation at this margin. It does not suggest hyperthyroidism, but it is worth the GP noting for any future thyroid check.\n\nHer cortisol is 85 nmol/L, which is below the morning reference floor of 145.4. Cortisol is the body's primary stress hormone, produced by the adrenal glands, and it normally peaks in the early morning. A low cortisol on a single blood test can mean the sample was taken later in the day when cortisol naturally falls, or it can reflect genuinely reduced adrenal output. Given that she reports stress being hard to manage most days, exhaustion on waking, and low energy all day, this result deserves a proper assessment. The GP should arrange a morning cortisol taken between 8 and 9 am, and if that is also low, a short Synacthen test to assess adrenal reserve. It is important not to over-interpret a single low reading, but equally important not to ignore it alongside her symptom profile.\n\nHer free testosterone is 0.0069 nmol/L, below the lower limit of 0.013. Total testosterone at 0.6 is within range but at the bottom, and SHBG at 66.8 is within range but on the higher side, which means more testosterone is being bound and less is available to the tissues. The free androgen index at 0.9 is within range. Bioavailable testosterone at 0.14 is within the reference range. The low free testosterone could contribute to low mood, reduced motivation and difficulty building muscle despite training six times a week. This is worth discussing with her GP in the context of her overall hormonal picture.\n\nHer reproductive hormones suggest she is in the follicular phase of her cycle: oestradiol at 286 is within the follicular range of 71.6 to 529.2, FSH at 7.96 is within the follicular range, LH at 2.58 is within the follicular range, and progesterone at 0.57 is consistent with the follicular phase when progesterone is naturally low. At 44 with irregular periods, the question of perimenopause arises, but her FSH is not elevated (it would typically need to be above 25 to 40 to suggest perimenopause), so on this snapshot, the ovarian axis appears to be cycling. The irregular periods may relate to the inflammatory and metabolic burden rather than to ovarian decline. A repeat in the luteal phase, roughly seven days before an expected period, would confirm whether she is ovulating and producing adequate progesterone.\n\nHer PhenoAge is 48 against a calendar age of 44, placing her biological age four years ahead. The main drivers of this gap are the CRP at 8, the elevated white cell count, and the RDW at 16.6. This is not a fixed number; it responds to the same changes that will improve her CRP and metabolic markers. If the Crohn's inflammation is brought under control and the iron deficiency corrected, PhenoAge should move back towards or below her calendar age on retest.\n\nHer kidney function is worth a careful note. Creatinine at 51 is within range, and the creatinine-based eGFR is above 90, which looks normal. However, Cystatin C, a more accurate marker of kidney filtration that is not affected by muscle mass, is 1.14 against an upper limit of 1.1, giving a Cystatin C eGFR of 87 and a combined eGFR of 87, which is below the optimal threshold of 90. At 44, the ideal eGFR is well above 90. This may reflect the recent hypertension, which can reduce kidney filtration, or the inflammatory burden, or both. It is not alarming, but it should be monitored alongside her blood pressure treatment to ensure it improves rather than declines.\n\nHer globulin at 42 is above the upper limit of 36. Globulin includes all the immunoglobulins, and since her IgA alone is 5.2, this accounts for the elevation. The albumin to globulin ratio is low as a consequence. This is driven by the same immune activation as the IgA and does not represent a separate concern.\n\nHer liver is in good health. ALT at 17 and AST at 17 are both well within range, GGT at 23 is within range and below the optimal of 25, bilirubin at 7 is normal, and the FIB-4 score at 0.56 is well below the threshold, confirming no sign of liver fibrosis. This is consistent with her recent clear liver scan. The APRI score at 0.13 and the De Ritis ratio at 1.0 are both optimal. Given the recent blood pressure medication, the liver handling everything cleanly is reassuring.\n\nHer calcium and bone markers are healthy. Corrected calcium at 2.52 is within optimal range, phosphate at 1.5 is within range, and parathyroid hormone at 2.8 is mid-range. Magnesium at 0.91 is within the optimal band of 0.85 to 1.05, which is good and likely reflects her supplementation. Vitamin D at 94 is within the optimal range of 75 to 120, showing her supplementation is working well. Vitamin B12 at 398 is within the laboratory range but below the optimal floor of 500, and could be contributing to her fatigue and low mood. Folate at 16 is within range and close to optimal.\n\nHer tumour markers are all reassuring. CA125 at 15.9, CA15-3 at 5.47, CA19-9 at 3.17 and CEA below 0.5 are all well within their respective limits. Rheumatoid factor at 6 is within range. Creatine kinase at 48 is within range. Amylase at 47 and lipase at 40 are both within range, suggesting the pancreas is working normally.\n\nHer total antioxidant activity at 1.82 is marginally above the upper limit of 1.77, which most likely reflects her vitamin D and magnesium supplementation and is not a concern. Her prolactin at 195, DHEA-S at 0.8 and the remaining hormonal markers are all within their respective ranges.\n\nHer uric acid at 296 is within the optimal range for a female. Sodium, chloride, bicarbonate and the calculated osmolality at 285.9 are all within optimal ranges. The urine shows no protein, no glucose, no ketones, no casts, a healthy pH and specific gravity, and the culture shows insignificant growth.\n\nIn summary, the priorities from this report are: urgent GP referral for the significant haematuria, reassessment of Crohn's disease activity given the CRP and IgA, iron repletion with consideration of intravenous iron given the Crohn's, a repeat HbA1c after iron correction to get a true metabolic reading, a morning cortisol to investigate the low reading alongside her fatigue and stress symptoms, and monitoring of kidney function alongside blood pressure treatment. The positives are real: her liver is excellent, her Lp(a) is ideal, her thyroid antibodies are negative, her tumour markers are clear, her coeliac screen is negative, her vitamin D is well managed, and her bone and mineral markers are healthy.","is_retest":false,"lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish or leftover chicken. Anchor: protein goes on the plate before anything else. Why: protein blunts the insulin response behind your HOMA-IR of 1.72, supports muscle recovery from your six training sessions, and helps with satiety so the sugary snacks become less appealing.\nReduce sugary food from some days to once a week or less, and swap for whole fruit, nuts or dark chocolate when the craving hits. Anchor: keep the alternative visible where the sugary option used to sit. Why: your HbA1c is 44, in the pre-diabetic range, and your family history of type 2 diabetes makes this the most important dietary lever in this report.\nAdd one extra portion of vegetables to lunch and dinner, aiming for 4 to 5 portions a day. Cooked vegetables may be better tolerated than raw given the Crohn's. Anchor: add them to whatever you are already eating rather than replacing anything. Why: soluble fibre feeds beneficial gut bacteria, supports digestion, and lowers the insulin response to meals.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin spike from that meal, which directly addresses the HOMA-IR and the HbA1c.\nFix your wake time to the same time every day, including weekends, even if you slept badly. Get outside within 30 minutes of waking, even on overcast days. Anchor: alarm goes off, curtains open, then outside. Why: morning light resets the cortisol rhythm, and your cortisol at 85 and your pattern of exhaustion on waking suggest that rhythm may have flattened.\nSet a caffeine cut-off at noon. No coffee, tea or energy drinks after 12 pm. Anchor: after lunch, switch to decaf or herbal. Why: under 6 hours of sleep with night waking is the backdrop to most of the fatigue and low mood in this report, and caffeine after noon is the most common hidden barrier to deeper sleep.\nAim for a wind-down routine starting 60 minutes before bed: dim lights, no screens or use night mode, a warm shower or bath. Anchor: set a phone alarm for wind-down time. Why: sleep under 6 hours with night waking is contributing to the elevated CRP, the cortisol pattern, the metabolic strain and the low mood. Improving sleep quality is as important as any supplement in this report.\nKeep your six training sessions but consider reducing to five if fatigue is severe until the iron is repleted. Prioritise the three resistance sessions as they are the most effective for insulin sensitivity and bone health. Anchor: if energy is very low, swap one cardio session for a long walk instead. Why: training on depleted iron stores costs more than it gives back, and your reticulocyte count shows the bone marrow is already struggling to keep up.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","units":"/100","result":"49","padding":"1","one_sided":"0.5","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","range_type":"no upper","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 48.6. Weakest systems: inflammation 8%, immunology 13%, hematology 29%. Biggest drags: hs-CRP, Apolipoprotein B, Cortisol, Transferrin Saturation.","high_causes":"","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","units":"years","result":"48","padding":"1","one_sided":"0.5","low_causes":"Low inflammation, healthy blood counts","range_type":"no lower","description":"PhenoAge is a biological age estimate calculated from a panel of blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. At 48 against a calendar age of 44, the biological age is four years ahead. The main drivers of this gap are the CRP at 8 (reflecting Crohn's inflammation), the elevated white cell count, and the RDW at 16.6 (reflecting iron deficiency). PhenoAge is not a fixed number. It responds to changes in the underlying markers. If the Crohn's inflammation is brought under control and the iron deficiency corrected, PhenoAge should move back towards or below the calendar age on retest.","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","lower_normal":"","upper_normal":"49","lower_optimal":"","upper_optimal":"44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4898","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4490"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","units":"/100","result":"75","padding":"1","one_sided":"0.5","low_causes":"Low ApoB, high HDL, low CRP, low triglycerides, healthy HbA1c","range_type":"no lower","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built right now, not a ten-year event probability. At 75, this is high, with the two main drivers being the hs-CRP at 8 (reflecting active Crohn's inflammation) and the ApoB at 1.08 (reflecting elevated harmful particle numbers), with the HbA1c of 44 also contributing. Importantly, the Lp(a) is ideal, meaning the modifiable inputs are what is driving the score. If the Crohn's inflammation is addressed and CRP falls, and the dietary changes improve ApoB and HbA1c, this score should fall substantially. At 44, the ten-year cardiovascular event risk is still relatively low, but the score shows that risk is being built and the window for acting is now.","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/L","result":"4","padding":"1","one_sided":"0.5","low_causes":"Fasting too long, excessive insulin production, adrenal insufficiency, liver disease","range_type":"normal","description":"Blood glucose measures the concentration of sugar in the blood after fasting. At 4.0 mmol/L, this is at the lower edge of the optimal range of 4.0 to 5.4, which is an excellent fasting reading. It means the body is clearing sugar from the blood efficiently, and the pancreas and liver are working well together to maintain a healthy baseline. This is especially reassuring alongside the mildly raised HbA1c, as it shows the fasting glucose itself is well controlled.","high_causes":"Insulin resistance, type 2 diabetes, stress response, medications, high carbohydrate intake","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","units":"%","result":"6.2","padding":"1","one_sided":"0.5","low_causes":"Iron supplementation, blood loss, haemolytic conditions","range_type":"normal","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the past two to three months. At 6.2%, this is above the normal threshold of 6.0% and sits in the pre-diabetic range of 6.0 to 6.4%. However, iron deficiency, which is clearly present in this report, can artificially raise HbA1c because iron-deficient red blood cells live longer and accumulate more glycated haemoglobin. The true HbA1c will need to be confirmed with a repeat test after iron stores have been repleted for three to four months.","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, type 2 diabetes, iron deficiency (artefactual elevation)","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","units":"mmol/mol","result":"44","padding":"1","one_sided":"0.5","low_causes":"Iron supplementation, blood loss, haemolytic conditions","range_type":"normal","description":"This is the same HbA1c measurement expressed in the international standard units. At 44 mmol/mol, this is above the normal threshold of 42 and sits in the pre-diabetic zone of 42 to 47. The lab uses a threshold of 48 for diabetes. Given the family history of type 2 diabetes, this is a clinically important result. However, iron deficiency can artificially inflate this number, so a repeat after iron repletion will give the true reading.","high_causes":"Sustained high blood sugar, insulin resistance, pre-diabetes, type 2 diabetes, iron deficiency (artefactual elevation)","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6970","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","units":"mIU/L","result":"9.67","padding":"1","one_sided":"0.5","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","range_type":"normal","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. Fasting insulin shows how much insulin the body needs to produce to keep blood sugar stable overnight. At 9.67, this is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8. This means the pancreas is working harder than ideal to maintain the normal fasting glucose of 4.0. It is an early signal of insulin resistance, where the cells are becoming less responsive to insulin and the pancreas compensates by producing more.","high_causes":"Insulin resistance, high carbohydrate diet, obesity, physical inactivity, PCOS, pre-diabetes","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4390","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","units":"ug/L","result":"1.36","padding":"1","one_sided":"0.5","low_causes":"Type 1 diabetes, low carbohydrate intake, fasting","range_type":"normal","description":"C-Peptide is released in equal amounts to insulin when the pancreas produces insulin, and it is a reliable measure of how much insulin the pancreas is actually making. At 1.36 ug/L, this is within the laboratory range and consistent with the insulin level, confirming the pancreas is producing insulin appropriately. It is not elevated enough to suggest excessive production, which is reassuring.","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3596","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","units":"g/L","result":"131","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","range_type":"normal","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. At 131 g/L, this is within the female reference range of 120 to 150. She is not anaemic. However, the body is maintaining this level by producing a higher-than-normal number of smaller red blood cells, a compensatory response to iron deficiency. If iron stores are not repleted, haemoglobin may eventually fall below range.","high_causes":"Dehydration, chronic hypoxia, smoking, polycythaemia","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4556","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","units":"x10^12/L","result":"5.41","padding":"1","one_sided":"0.5","low_causes":"Anaemia, blood loss, bone marrow failure, chronic disease","range_type":"normal","description":"The red blood cell count measures how many red blood cells are circulating per litre of blood. At 5.41, this is above the upper limit of 4.8 for women. Rather than indicating a primary blood disorder, this is the body's compensatory response to iron deficiency: because each individual red cell is smaller and carries less haemoglobin, the bone marrow produces more cells to try to maintain adequate oxygen delivery. This pattern, a high red cell count with low MCV and MCH, is characteristic of iron-deficient red cell production.","high_causes":"Iron deficiency (compensatory), dehydration, polycythaemia vera, chronic hypoxia, smoking","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8700","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","units":"L/L","result":"0.403","padding":"1","one_sided":"0.5","low_causes":"Anaemia, overhydration, blood loss","range_type":"normal","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.403, this is within both the reference and optimal ranges. Despite the high number of red blood cells, the haematocrit is normal because the individual cells are smaller than usual due to iron deficiency, so they occupy less volume collectively.","high_causes":"Dehydration, polycythaemia, chronic hypoxia","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","units":"%","result":"16.6","padding":"1","one_sided":"0.5","low_causes":"Generally not clinically significant","range_type":"normal","description":"RDW measures the variation in size among red blood cells. At 16.6%, this is above the upper limit of 14%, meaning there is a wide range of cell sizes circulating. This is characteristic of iron deficiency: the bone marrow is producing new, smaller cells (because there is not enough iron to make them full size) alongside older, normal-sized cells. The result is a mixed population that shows up as a high RDW. This will normalise as iron stores are repleted and the marrow can produce consistently sized cells again.","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, chronic disease, liver disease","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5972"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","units":"fL","result":"74.5","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","range_type":"normal","description":"MCV measures the average volume of a single red blood cell. At 74.5 fL, this is below the lower limit of 83, meaning the red blood cells are smaller than they should be. This is called microcytosis and is the hallmark of iron deficiency. When iron is scarce, the bone marrow produces smaller cells because there is not enough iron to build full-sized haemoglobin molecules. This is one of the clearest indicators in the report that iron stores need to be replenished.","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism, alcohol excess, medications","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1759","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","units":"pg","result":"24.3","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","range_type":"normal","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 24.3 pg, this is below the lower limit of 27. This confirms that each red blood cell is carrying less haemoglobin than normal, which is a direct consequence of insufficient iron. Haemoglobin needs iron at its core to bind oxygen, so when iron is deficient, each cell is built with less haemoglobin. This works alongside the low MCV to confirm the iron deficiency pattern.","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1533","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","units":"g/L","result":"326","padding":"1","one_sided":"0.5","low_causes":"Severe iron deficiency, thalassaemia","range_type":"normal","description":"MCHC measures the concentration of haemoglobin within each red blood cell. At 326, this is within both the reference and optimal ranges. Despite the cells being smaller and carrying less total haemoglobin, the concentration within each cell is maintained, which is typical of iron deficiency as opposed to some other causes of microcytosis.","high_causes":"Hereditary spherocytosis, laboratory artefact","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4556","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","units":"x10^9/L","result":"326","padding":"1","one_sided":"0.5","low_causes":"Viral infections, medications, liver disease, autoimmune conditions, bone marrow disorders","range_type":"normal","description":"Platelets are small cell fragments that help the blood clot. At 326, this is within both the reference and optimal ranges. Iron deficiency can sometimes cause a reactive increase in platelets, but at 326 the count is comfortably within range and not a concern.","high_causes":"Iron deficiency (reactive), inflammation, infection, post-surgery","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"380","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5590","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6282"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","units":"fL","result":"9.1","padding":"1","one_sided":"0.5","low_causes":"Chronic inflammation, some autoimmune conditions","range_type":"normal","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. At 9.1, this is within both the reference and optimal ranges, indicating normal platelet production and turnover.","high_causes":"Rapid platelet turnover, inflammation, iron deficiency","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6333"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","units":"x10^9/L","result":"10.18","padding":"1","one_sided":"0.5","low_causes":"Viral infections, medications, autoimmune conditions, bone marrow disorders, low energy availability","range_type":"normal","description":"White blood cells are the immune system's front line, responsible for fighting infection and managing inflammation. At 10.18, this is just above the upper limit of 10. The differential shows neutrophils are the main contributor at 6.64, which is within their own range but pushing the total count over the line. In the context of Crohn's disease and a CRP of 8, this mildly elevated white cell count is consistent with the body's inflammatory response rather than an acute infection.","high_causes":"Infection, inflammation, stress response, smoking, corticosteroids, chronic inflammatory disease","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6767","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","units":"x10^9/L","result":"6.64","padding":"1","one_sided":"0.5","low_causes":"Viral infections, medications, autoimmune conditions, low energy availability","range_type":"normal","description":"Neutrophils are the most abundant type of white blood cell and are the first responders to bacterial infection and tissue inflammation. At 6.64, this is within the reference range of 2 to 7 but above the optimal ceiling of 5.5. In the context of active inflammation from Crohn's disease, neutrophils at this level are expected and do not represent a separate concern.","high_causes":"Bacterial infection, inflammation, stress, corticosteroids, smoking","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6427","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","units":"x10^9/L","result":"2.87","padding":"1","one_sided":"0.5","low_causes":"Viral infections (acute), corticosteroids, stress, HIV, autoimmune conditions","range_type":"normal","description":"Lymphocytes are white blood cells responsible for the adaptive immune response, including fighting viral infections and producing antibodies. At 2.87, this is within the reference range but above the optimal ceiling of 2.8, so it is just outside the optimal band. The immune system's lymphocyte arm is functioning normally.","high_causes":"Viral infections (recovery), chronic inflammation, autoimmune conditions","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","units":"x10^9/L","result":"0.45","padding":"1","one_sided":"0.5","low_causes":"Corticosteroid use, bone marrow disorders","range_type":"normal","description":"Monocytes are white blood cells that develop into macrophages in the tissues, clearing debris and fighting chronic infections. At 0.45, this is within both the reference and optimal ranges, indicating normal monocyte activity.","high_causes":"Chronic infections, autoimmune conditions, chronic inflammation, recovery from infection","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","units":"x10^9/L","result":"0.11","padding":"1","one_sided":"0.5","low_causes":"Corticosteroid use, acute infection, stress","range_type":"normal","description":"Eosinophils are white blood cells involved in fighting parasites and mediating allergic responses. At 0.11, this is within both the reference and optimal ranges. Given her asthma, the eosinophils being low is a positive sign, suggesting the allergic component is well controlled.","high_causes":"Allergies, asthma, parasitic infections, eosinophilic conditions, drug reactions","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","units":"x10^9/L","result":"0.04","padding":"1","one_sided":"0.5","low_causes":"Corticosteroid use, acute allergic reactions, hyperthyroidism","range_type":"normal","description":"Basophils are the rarest type of white blood cell and play a role in allergic and inflammatory responses. At 0.04, this is within both the reference and optimal ranges. Normal basophils alongside controlled eosinophils is reassuring.","high_causes":"Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","units":"mm/hour","result":"6","padding":"1","one_sided":"0.5","low_causes":"Polycythaemia, sickle cell disease, low fibrinogen","range_type":"no lower","description":"ESR measures how quickly red blood cells settle in a tube over an hour, which increases when inflammation is present. At 6 mm/hour, this is within the normal range of below 12 and within optimal. Interestingly, the ESR is normal while the CRP is elevated. This can happen because ESR responds more slowly to inflammation and is influenced by different proteins. The CRP is the more sensitive and specific marker for acute inflammation, and the CRP finding takes precedence here.","high_causes":"Infection, inflammation, autoimmune disease, cancer, anaemia, pregnancy","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","units":"%","result":"0.7","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","range_type":"normal","description":"Reticulocytes are newly released red blood cells from the bone marrow, and their percentage reflects how actively the marrow is producing new cells. At 0.7%, this is within the reference range but below the optimal of 0.8%. In the context of iron deficiency, one might expect the marrow to produce more reticulocytes to compensate, but the percentage being low suggests the marrow is constrained by the lack of iron.","high_causes":"Blood loss (acute recovery), haemolysis, treatment of deficiency","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833"},{"key":"reticulocytesabsolute","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","units":"x10^9/L","result":"37.87","padding":"1","one_sided":"0.5","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease, aplastic anaemia","range_type":"normal","description":"The absolute reticulocyte count gives the actual number of new red blood cells being released per litre. At 37.87, this is below the lower limit of 50. Despite having a high total red blood cell count, the marrow is not releasing enough new cells. This is characteristic of iron deficiency where the marrow has the drive to produce cells but lacks the raw material. Once iron is repleted, this count should rise as the marrow responds.","high_causes":"Blood loss recovery, haemolysis, response to iron or B12 treatment","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2525","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","units":"index","result":"13.8","padding":"1","one_sided":"0.5","low_causes":"Thalassaemia trait","range_type":"informational","description":"The Mentzer Index divides the MCV by the red blood cell count and helps distinguish between iron deficiency and thalassaemia trait as causes of small red blood cells. An index above 13 leans towards iron deficiency rather than thalassaemia. At 13.8, this supports iron deficiency as the explanation for the microcytic blood picture, which is consistent with the depleted ferritin and low transferrin saturation. This is for a GP to confirm.","high_causes":"Iron deficiency","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":""},{"key" function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
