minaemia, laboratory error","high_causes":"Metabolic acidosis (lactic, ketoacidosis, renal), dehydration, toxin ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4912","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4211","upper_optimal_position":"0.5965","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Approximately 99% of the body's calcium is in bones, with only 1% in the blood. Blood calcium is tightly regulated by parathyroid hormone (PTH) and vitamin D. Iluta's calcium at 2.35 mmol/L is within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result for the albumin level, because calcium binds to albumin in the blood. If albumin is low, total calcium may appear falsely low. Iluta's corrected calcium at 2.45 mmol/L is within the optimal range, confirming that calcium metabolism is healthy. Combined with a normal PTH, his calcium regulation is working well.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5326","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4023","upper_optimal_position":"0.5977","units":"mmol/L","description":"Phosphate works alongside calcium in bone formation and energy production. It is regulated by PTH and the kidneys. Iluta's phosphate at 1.3 mmol/L is within the optimal range, consistent with his healthy calcium and PTH results.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5115","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions in the body, including energy production, muscle and nerve function, blood sugar control, and sleep regulation. Blood magnesium only reflects about 1% of total body stores, so even a level within the laboratory range can coexist with tissue deficiency. Iluta's magnesium at 0.84 mmol/L is within the laboratory range but just below the optimal floor of 0.85. Given his sleep difficulties, joint stiffness, and training load, supplementation is recommended.","low_causes":"Poor dietary intake, alcohol, stress, medications (diuretics, proton pump inhibitors), excessive sweating","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"389","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5055","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2724","upper_optimal_position":"0.5020","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced naturally by the body. High levels can crystallise in joints (causing gout) and damage blood vessels. Iluta's uric acid at 389 umol/L is within the laboratory range but just above the optimal male ceiling of 380. Given his joint pain and stiffness, this is worth noting. Reducing purine-rich foods such as red meat, organ meats, shellfish, and sugary drinks, along with weight loss, can help lower uric acid.","low_causes":"Low purine diet, kidney disease (in some cases), medications","high_causes":"High purine diet, obesity, alcohol, kidney impairment, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6200","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys and excreted in urine. It reflects both protein intake and kidney function. Iluta's urea at 5.7 mmol/L is within the optimal range, indicating that the kidneys are clearing protein waste effectively.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"112","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7350","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3676","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a constant rate. It is the most commonly used marker for estimating kidney function. However, creatinine levels are strongly influenced by muscle mass, body size, and ethnicity. In individuals of African heritage, muscle creatinine production tends to be higher, which can make creatinine-based kidney function estimates appear worse than they truly are. Iluta's creatinine at 112 umol/L is above the laboratory upper limit of 104, but his Cystatin C-based eGFR of 82 provides a more accurate picture of his kidney function.","low_causes":"Low muscle mass, severe liver disease, malnutrition","high_causes":"Kidney disease, high muscle mass, high meat intake, dehydration, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine-based)","group":"KIDNEY FUNCTION","result":"68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"60","upper_normal":"60","lower_optimal":"90","upper_optimal":"90","lower_normal_position":"0.5","upper_normal_position":"0.5","lower_optimal_position":"0.7500","upper_optimal_position":"0.7500","units":"ml/min/1.73m2","description":"eGFR, estimated glomerular filtration rate, estimates how much blood the kidneys filter per minute. Above 90 is considered optimal, 60 to 89 is mildly reduced, and below 60 suggests possible chronic kidney disease. Iluta's creatinine-based eGFR is 68, which appears mildly reduced. However, as the laboratory notes, for patients of African origin this should be multiplied by 1.21, giving approximately 82. This is consistent with his Cystatin C-based eGFR of 82. His true kidney function is likely around 82 ml/min, which is mildly below optimal but not in the concerning range.","low_causes":"Kidney disease, dehydration, medications, ageing, high creatinine from muscle mass","high_causes":"Early diabetes (hyperfiltration), pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6833","lower_normal":"60","upper_normal":"60","lower_optimal":"90","upper_optimal":"90","lower_normal_position":"0.5","upper_normal_position":"0.5","lower_optimal_position":"0.7500","upper_optimal_position":"0.7500","units":"","description":"The Cystatin C-based eGFR uses a different protein, Cystatin C, to estimate kidney filtration. Unlike creatinine, Cystatin C is not affected by muscle mass, body size, or ethnicity, making it a more reliable measure in many people. Iluta's Cystatin C eGFR of 82 is the more accurate reflection of his kidney function. While it is above 60 and therefore not in the chronic kidney disease range, it is below the optimal threshold of 90. This should be monitored over time, and the planned kidney scan will provide additional structural information.","low_causes":"Kidney disease, ageing","high_causes":"Hyperthyroidism, steroid use","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4318","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4545","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells in the body at a constant rate and filtered by the kidneys. Because its production is not influenced by muscle mass, diet, or ethnicity, it provides a more accurate assessment of kidney function than creatinine in many individuals. Iluta's Cystatin C at 0.95 mg/L is within the healthy range of below 1.1.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Kidney disease, hypothyroidism, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"155","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to the body's tissues. It is the most important marker of oxygen-carrying capacity. Iluta's haemoglobin at 155 g/L is within the healthy male range of 130 to 170 and within the optimal band. Despite his small red cells, the total haemoglobin is healthy because the body has compensated by producing more red cells.","low_causes":"Iron deficiency, chronic disease, kidney disease, blood loss, B12/folate deficiency","high_causes":"Dehydration, polycythaemia, high altitude, chronic lung disease, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"6.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8833","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Iluta's RBC at 6.15 is above the upper limit of 5.5. When considered alongside his low MCV (small cells), this pattern, called microcytosis with compensatory erythrocytosis, means the body is making more cells to compensate for each cell being smaller. This pattern is characteristic of either iron-deficient red cell production or alpha-thalassaemia trait, an inherited and harmless condition that is common in people of African heritage.","low_causes":"Anaemia, blood loss, bone marrow disorders, chronic disease","high_causes":"Thalassaemia trait, dehydration, polycythaemia, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.459","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5300","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.49","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Despite the elevated red cell count, Iluta's haematocrit at 0.459 is within the normal range because each cell is smaller than average. This confirms that the total red cell volume is appropriate.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"74.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1722","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV, mean corpuscular volume, measures the average size of each red blood cell. A low MCV means the cells are smaller than normal, which is called microcytosis. Iluta's MCV at 74.6 fL is below the lower limit of 83. The two most common causes of microcytosis are iron deficiency (even when ferritin stores are adequate, if the iron available for active use is low, new red cells are made smaller) and thalassaemia trait. Given Iluta's African heritage, alpha-thalassaemia trait is a strong possibility and should be investigated with haemoglobin electrophoresis.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 deficiency, folate deficiency, alcohol, hypothyroidism, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"25.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2333","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"pg","description":"MCH, mean corpuscular haemoglobin, measures the average amount of haemoglobin packed into each red blood cell. A low MCH follows logically from a low MCV, as smaller cells contain less haemoglobin. Iluta's MCH at 25.2 pg is below the lower limit of 27, consistent with his microcytic picture.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 deficiency, folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"338","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5889","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, mean corpuscular haemoglobin concentration, measures the average concentration of haemoglobin within each red blood cell. Unlike MCH which measures the total amount, MCHC measures the concentration, how densely packed the haemoglobin is. Iluta's MCHC at 338 g/L is within the normal and optimal range, indicating that while each cell is small, the haemoglobin within it is packed at a normal density. This is more typical of thalassaemia trait than iron deficiency, where MCHC tends to fall.","low_causes":"Iron deficiency","high_causes":"Hereditary spherocytosis, dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"15.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6929","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"14.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"%","description":"RDW, red cell distribution width, measures the variation in size among red blood cells. A higher number means more variation. Iluta's RDW at 15.3% is marginally above the upper limit of 15%. A slightly elevated RDW alongside a low MCV can suggest that both normal-sized and small cells are present, which is sometimes seen when iron deficiency is developing alongside thalassaemia trait, or when there is a mixed picture. The elevation is mild and consistent with the overall red cell findings.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"221","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4244","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4487","upper_optimal_position":"0.5513","units":"x10^9/L","description":"Platelets are small cell fragments that help the blood to clot. They are produced by the bone marrow. Iluta's platelet count at 221 is within the healthy and optimal range, indicating normal clotting potential.","low_causes":"Bone marrow disorders, liver disease, viral infections, medications, autoimmune conditions","high_causes":"Iron deficiency, infection, inflammation, splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV, mean platelet volume, measures the average size of platelets. Larger platelets are generally younger and more reactive. Iluta's MPV at 9.2 fL is within the optimal range, indicating normal platelet production and turnover.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Increased platelet production, inflammation, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4711","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"x10^9/L","description":"White blood cells are the immune system's front line. The total count reflects overall immune activity. Iluta's WBC at 6.48 is within the optimal range, indicating a healthy and balanced immune system.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications","high_causes":"Infection, inflammation, stress, smoking, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3920","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. Iluta's neutrophils at 2.59 are within the laboratory range and within the optimal band. It is worth noting that benign ethnic neutropenia, a harmless condition where people of African descent naturally carry lower neutrophil counts, is common. His level is healthy.","low_causes":"Benign ethnic neutropenia (African heritage), viral infections, medications, bone marrow disorders","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.99","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6633","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including antibody production and fighting viral infections. Iluta's lymphocytes at 2.99 are at the top of the reference range and slightly above the optimal ceiling of 2.8. This could reflect mild immune activation consistent with his elevated immunoglobulins, but is not a concern at this level.","low_causes":"HIV, immunosuppressive drugs, corticosteroids, severe infection","high_causes":"Viral infection, chronic immune activation, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5375","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"x10^9/L","description":"Monocytes are white blood cells that clean up cellular debris and fight certain infections. They also play a role in chronic inflammation. Iluta's monocytes at 0.69 are within the optimal range.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, chronic inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and mediating allergic responses. Despite Iluta's significantly elevated IgE (the allergy antibody), his eosinophils at 0.19 are within range. This means the allergic tendency is being expressed through antibodies rather than through eosinophil activation at present.","low_causes":"Corticosteroid use, acute stress","high_causes":"Allergies, parasitic infections, asthma, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells and play a role in allergic and inflammatory responses. Iluta's basophils at 0.02 are within the optimal range.","low_causes":"Generally not clinically significant","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage reflects how actively the bone marrow is producing new red cells. A normal reticulocyte count alongside an elevated RBC count suggests that the bone marrow is maintaining steady production rather than being driven into overdrive. Iluta's reticulocyte count at 1.16% is within the healthy range.","low_causes":"Bone marrow suppression, iron deficiency, B12/folate deficiency, chronic kidney disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"71.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4756","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6333","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells in the blood. Iluta's at 71.34 is within the healthy range, confirming normal bone marrow output.","low_causes":"Bone marrow failure, iron/B12/folate deficiency, chronic kidney disease","high_causes":"Haemolytic anaemia, acute blood loss, bone marrow recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"0.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2233","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio, or NLR, compares innate immune cells (neutrophils) to adaptive immune cells (lymphocytes). It is used as a marker of systemic inflammation and immune balance. A ratio of 1 to 3 is normal, and 1 to 2 is optimal. Iluta's NLR at 0.87 is below the lower reference of 1, which reflects his relatively lower neutrophil count compared to lymphocytes. In people of African heritage, benign ethnic neutropenia (naturally lower neutrophil counts) is common and shifts this ratio downward. This is not a concern.","low_causes":"Benign ethnic neutropenia, lymphocytosis","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"19.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3856","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation measures what percentage of the body's iron-transporting protein (transferrin) is currently carrying iron. It reflects how much iron is actively available for use. A level of 18 to 55% is within the laboratory range, but 25 to 40% is optimal. Iluta's transferrin saturation at 19.49% is barely above the lower limit and below the optimal floor of 25%. This means that while his iron stores (ferritin) are adequate at 104, the iron available for active use is running low. This could contribute to his microcytic red cell picture and may benefit from dietary iron optimisation.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"11.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6118","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and is affected by recent meals. Iluta's serum iron at 11.6 umol/L is sitting exactly on the lower limit of the reference range. Combined with his borderline transferrin saturation, this confirms that his circulating iron supply is at the low end. Including more iron-rich foods such as red meat, dark leafy greens, lentils, and fortified cereals, alongside vitamin C to enhance absorption, would help optimise this.","low_causes":"Iron deficiency, chronic disease, inflammation, poor dietary intake","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.2","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5778","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. The body increases transferrin production when it needs more iron and reduces it when iron is plentiful. Iluta's transferrin at 2.37 g/L is within the healthy range, suggesting the body's iron transport system is functioning normally.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency (compensatory increase), pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"53.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4292","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6143","units":"umol/L","description":"TIBC, total iron binding capacity, measures the total amount of iron that transferrin in the blood could carry if it were fully loaded. It is an indirect measure of transferrin availability. Iluta's TIBC at 53.2 umol/L is within the healthy range.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"104","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4244","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4267","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects total iron reserves, with most ferritin stored in the liver, spleen, and bone marrow. Iluta's ferritin at 104 ng/ml is within the optimal male range of 50 to 200. This means his iron stores are adequate, even though the iron being actively delivered to the bone marrow (as shown by transferrin saturation) is running low. This disconnect can occur when inflammation redirects iron into storage rather than into active circulation, or when thalassaemia trait affects how iron is used.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, coeliac disease","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"14.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4381","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for libido, erectile function, muscle mass, bone density, mood, and energy. It is produced primarily by the testes, with small amounts from the adrenal glands. Iluta's testosterone at 14.8 nmol/L is within the laboratory range of 8.4 to 28.7 and above the minimum recommended level of 12, but it is below the optimal range of 18 to 30. At a BMI of 29.4, increased aromatase enzyme activity in fat tissue converts more testosterone to oestradiol, which reduces the available testosterone. This below-optimal level is strongly consistent with his symptoms of low libido, absent morning erections, and erectile difficulty. Weight loss is the most impactful way to improve testosterone naturally.","low_causes":"Obesity (aromatase conversion), ageing, poor sleep, stress, opioid use, pituitary disorders","high_causes":"Exogenous testosterone, anabolic steroids, tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.327","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Free testosterone is the portion of testosterone not bound to proteins in the blood and therefore available for the body to use. Only about 2 to 3% of testosterone circulates freely. Iluta's calculated free testosterone is 0.327 nmol/L. Without a laboratory-specific reference range, this is interpreted in the context of his total testosterone, SHBG, and symptoms. Given that his total testosterone is already below optimal, his free testosterone is also likely below the ideal level, contributing to his reported symptoms.","low_causes":"Low total testosterone, elevated SHBG, obesity, ageing","high_causes":"Supplementation, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"32.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4379","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3854","upper_optimal_position":"0.5885","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds to sex hormones, including testosterone, and makes them unavailable for use by the body. Higher SHBG means less free testosterone, and lower SHBG means more. Iluta's SHBG at 32.5 nmol/L is within the optimal range of 25 to 55. At his BMI, SHBG tends to run lower (obesity suppresses SHBG), so this level is appropriate.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroids","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"45.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3795","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a calculation that estimates the ratio of testosterone to SHBG, giving a rough indication of how much testosterone is available for use. Iluta's FAI at 45.54 is within range. However, because the absolute testosterone level is below optimal, a normal FAI does not fully compensate for the low total testosterone in terms of symptom impact.","low_causes":"Low testosterone, elevated SHBG","high_causes":"High testosterone, low SHBG, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"141","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4826","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4108","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. In men, it is produced by converting testosterone through an enzyme called aromatase, which is concentrated in fat tissue. Small amounts are necessary for bone health, brain function, and cardiovascular protection, but excessive levels suppress testosterone's effects and can contribute to sexual dysfunction. Iluta's oestradiol at 141 pmol/L is within the laboratory range but very close to the upper limit of 146.1 and above the optimal threshold of 120. At a BMI of 29.4, increased fat mass drives more aromatase activity, converting more testosterone to oestradiol. This creates a vicious cycle: less testosterone, more oestradiol, which then signals the pituitary to reduce stimulation of the testes. Weight loss would directly reduce aromatase activity.","low_causes":"Low body fat, aromatase inhibitors, menopause (women)","high_causes":"Obesity (aromatase in fat tissue), liver disease, medications, testicular tumours","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4002","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5711","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in mood, sleep, and may influence libido. Iluta's progesterone at 1.49 nmol/L is within the normal male range.","low_causes":"Adrenal insufficiency, ageing","high_causes":"Adrenal hyperplasia, testicular tumours, HCG-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4066","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"mIU/ml","description":"LH is a pituitary hormone that signals the testes to produce testosterone. In a man with below-optimal testosterone, the expected response is for LH to rise as the pituitary tries harder to stimulate production. Iluta's LH at 3.38 is in the lower half of the range, suggesting that the pituitary is not aggressively compensating for the low testosterone. This could indicate that the pituitary is being suppressed by the elevated oestradiol (oestrogen suppresses LH release) or that there is a degree of hypothalamic-pituitary blunting.","low_causes":"Pituitary dysfunction, oestrogen excess, obesity, opioid use, stress","high_causes":"Primary hypogonadism (testicular failure), ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3728","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"1.5","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5702","units":"mIU/ml","description":"FSH is a pituitary hormone that in men stimulates the testes to produce sperm. Like LH, it is expected to rise when testicular function is declining. Iluta's FSH at 3.21 is in the lower half of the range, consistent with the LH finding and suggesting pituitary suppression rather than primary testicular failure.","low_causes":"Pituitary dysfunction, oestrogen excess, obesity, anabolic steroids","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"122","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4106","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a pituitary hormone that in men should remain at low to moderate levels. Elevated prolactin can suppress testosterone, reduce libido, and cause erectile dysfunction. Iluta's prolactin at 122 uIU/ml is within the healthy range, which is reassuring. This rules out prolactinoma (a benign pituitary tumour) as a cause of his sexual symptoms.","low_causes":"Generally not clinically significant in men","high_causes":"Prolactinoma, medications (antipsychotics, antidepressants), stress, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"375","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4843","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4186","upper_optimal_position":"0.6023","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning levels should be at their highest, declining throughout the day. Iluta's cortisol at 375 nmol/L is within the healthy morning range, indicating normal adrenal function and a healthy stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid use, depression, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2359","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4978","lower_normal":"162.1","upper_normal":"4940.9","lower_optimal":"500","upper_optimal":"4000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4040","upper_optimal_position":"0.5373","units":"ug/dL","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It declines naturally with age, so a healthy level at 46 is a positive indicator of adrenal function. The lab result of 6.4 umol/L converts to approximately 2,359 ug/dL, which is within the healthy range. This suggests the adrenal glands are contributing adequately to hormone production.","low_causes":"Ageing, adrenal insufficiency, chronic disease","high_causes":"Adrenal tumours, PCOS (women), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"3.46","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5625","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4392","upper_optimal_position":"0.5446","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland to tell the thyroid how hard to work. Higher TSH means the pituitary is pushing the thyroid harder to produce hormones. Iluta's TSH at 3.46 is within the laboratory range of 0.55 to 4.78 but above the optimal range of 1.0 to 2.5. This means the pituitary is having to push a little harder than ideal to maintain thyroid hormone output. Given that both FT4 and FT3 are within optimal ranges and both thyroid antibodies are negative, this is subclinical and not currently actionable, but should be monitored. An underperforming thyroid can impair LDL cholesterol clearance, which could be contributing marginally to his lipid picture.","low_causes":"Hyperthyroidism, pituitary disease, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's disease, iodine deficiency, thyroid recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6055","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"pmol/L","description":"FT4, free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, T3, in tissues throughout the body. Iluta's FT4 at 20.6 pmol/L is within the optimal range of 14 to 20, sitting at the upper end. This shows the thyroid is producing adequate hormone output despite the slightly elevated TSH.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3, free triiodothyronine, is the active thyroid hormone that drives metabolism in every cell. It is produced mainly by converting FT4 in the liver, kidneys, and other tissues. Iluta's FT3 at 5.3 pmol/L is within the optimal range of 4.5 to 6.5, confirming that the conversion of T4 to T3 is working well and that cells are receiving adequate active thyroid hormone.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a condition called autoimmune thyroiditis or Hashimoto's disease. A negative result, as Iluta has at below 6.6, rules out autoimmune thyroid disease as a cause of his slightly elevated TSH.","low_causes":"Normal immune function (desirable)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. Like TPO antibodies, a negative result rules out autoimmune thyroiditis. Iluta's result of below 1.3 is negative and reassuring.","low_causes":"Normal immune function (desirable)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"50","upper_normal":"50","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"0.5","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, and testosterone production. It is produced in the skin when exposed to sunlight and obtained from diet and supplements. Iluta's vitamin D at 56 nmol/L is classified as sufficient (above 50) by the laboratory, but it is below the optimal range of 75 to 120. Given his darker skin pigmentation, which significantly reduces vitamin D synthesis from sunlight, and his BMI approaching 30, which means fat tissue absorbs and stores vitamin D reducing its availability in the blood, a supplementation dose of 4,000 IU daily is recommended rather than the standard 2,000 IU.","low_causes":"Limited sun exposure, dark skin pigmentation, obesity, northern latitude, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5573","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6272","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium and phosphate levels in the blood. It is produced by the parathyroid glands in the neck. When calcium drops, PTH rises to release calcium from bones and increase absorption from the gut. Iluta's PTH at 3.7 pmol/L is within the normal and optimal range. Combined with his healthy calcium and phosphate, this indicates normal calcium metabolism. The PTH is in the upper portion of the range, which can be seen with suboptimal vitamin D levels, as the body produces slightly more PTH to compensate for reduced vitamin D-driven calcium absorption.","low_causes":"Hypoparathyroidism, excess calcium, vitamin D toxicity","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"307","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3812","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5556","upper_optimal_position":"0.5891","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy production. It is found primarily in animal products. Iluta's B12 at 307 pg/ml is within the laboratory range of 193 to 982 but below the optimal floor of 500. Suboptimal B12 can contribute to fatigue, mood disturbance, and poor nerve function. Supplementation with sublingual methylcobalamin at 1,000 mcg daily is recommended to bring this into the optimal range.","low_causes":"Vegetarian/vegan diet, malabsorption, pernicious anaemia, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_positi hy, muscle injury, rhabdomyolysis, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.04","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7660","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the combined antioxidant capacity of the blood. It reflects dietary antioxidant intake, endogenous antioxidant production, and supplementation. Iluta's TAA at 2.04 mmol/L is above the upper reference of 1.77. This is typically driven by dietary antioxidants or supplementation and is not a cause for concern. If anything, it suggests good dietary antioxidant intake.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"17.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7035","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody class in the blood, providing long-term protection against infections the body has previously encountered or been vaccinated against. Iluta's IgG at 17.3 g/L is marginally above the upper limit of 16. This mild elevation could reflect a persistent immune response to a past or ongoing infection, chronic low-grade immune activation, or simply be at the upper end of his personal normal. Given his e   if (b.within_normal === 'FALSE') return 'flag';

  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

//  INTERACTIONS
// ============================================================
function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');

  }
}
