<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

sses this pattern with his GP, including the below-optimal testosterone, the near-ceiling oestradiol, and the symptom burden, to explore whether further investigation or intervention is appropriate.\n\nHis thyroid function is adequate. TSH, the hormone the pituitary sends to stimulate the thyroid, is 3.46 mIU/L, within the laboratory range of 0.55 to 4.78 but above the optimal range of 1.0 to 2.5. Free T4, the main thyroid hormone, is 20.6 pmol/L, which is within the optimal range. Free T3, the active form of thyroid hormone, is 5.3 pmol/L, also within the optimal range. Both thyroid antibody tests are negative, TPO antibodies below 6.6 and thyroglobulin antibodies below 1.3, which rules out autoimmune thyroid disease. The slightly elevated TSH with normal T4 and T3 suggests the thyroid is working but requires a little more stimulation than ideal. This is not clinically actionable at present but is worth monitoring over time, particularly because suboptimal thyroid function can contribute to fatigue, weight gain difficulty, and could impair LDL cholesterol clearance.\n\nHis vitamin D is 56 nmol/L, which the laboratory classifies as sufficient at above 50, but which is below the optimal range of 75 to 120. Given his darker skin pigmentation, which reduces vitamin D synthesis from sunlight, and his BMI approaching 30, which means fat tissue sequesters vitamin D, he will need a higher supplementation dose to reach optimal levels. His vitamin B12 is 307 pg/ml, within the laboratory range but below the optimal floor of 500. His folate is 7 ng/ml, within the laboratory range but below the optimal floor of 8. Both of these B vitamins are important for energy production, nerve function, and red blood cell formation, and suboptimal levels could contribute to his fatigue and the mild red cell changes.\n\nHis creatine kinase, CK, is 401 U/L against an upper limit of 320. CK is an enzyme released from muscle cells when they are damaged or stressed. Given that Iluta does two resistance sessions per week, a mildly elevated CK is likely exercise-related and is not a concern unless it persists at rest. It is worth noting that statins can also raise CK, and he should mention any muscle pain, cramping, or weakness to his GP, as statin-related muscle effects should be monitored. His total antioxidant activity at 2.04 mmol/L is above the upper reference of 1.77, which may reflect dietary antioxidant intake or supplementation and is not a concern.\n\nHis calcium metabolism is healthy, with corrected calcium at 2.45 mmol/L and PTH at 3.7 pmol/L, both within their respective ranges. Phosphate at 1.3 and magnesium at 0.84 are within range, though magnesium is below the optimal floor of 0.85. Given his sleep difficulties and joint stiffness, supplementing magnesium would be worthwhile.\n\nHis tumour markers are all reassuring. PSA is 0.8 ng/ml, well below the threshold of 2.5, with a free PSA ratio of 0.35, which is comfortably above the 0.19 normal threshold. CA 19-9 at 8.84 U/ml is within range, and CEA is below 0.5 ng/ml. These are all within healthy limits.\n\nHis urinalysis is clean. Protein, glucose, ketones, urobilinogen, casts, and nitrites are all negative. White blood cells and red blood cells are both below 1 per microlitre, which is normal. This is encouraging given his GP's previous concern about an unclear urine sample, as this sample shows no evidence of blood, protein, or infection. The bacterial count and urine culture are pending and should be reviewed when available. The urine specific gravity of 1.02 and pH of 6 are both within normal parameters.","links":"The most important action from this report is to book an appointment with the GP and bring three specific findings. First, the Lp(a) result of greater than 212.5 nmol/L. This is a permanent, inherited cardiovascular risk factor that should be recorded in his medical notes for life. It means that a portion of his elevated ApoB and LDL will not respond to statin therapy, and the GP may wish to consider intensifying lipid treatment, adding ezetimibe, or referring to a specialist lipid clinic. Every first-degree relative should also be tested. Second, the red blood cell picture showing a high count of 6.15 with small cells at MCV 74.6, borderline iron availability with transferrin saturation at 19.49%, and the recommendation for haemoglobin electrophoresis to check for alpha-thalassaemia trait. Third, the kidney findings: creatinine-based eGFR of 68 but Cystatin C eGFR of 82, with the Cystatin C being the more reliable measure. This should be discussed in the context of the planned kidney scan. Additionally, the below-optimal testosterone at 14.8 with oestradiol near the ceiling at 141, alongside the significant symptom burden of lost libido and erectile difficulty, should be raised with the GP to explore whether further hormonal investigation or intervention is warranted.\n\nFor weight management, Iluta's estimated maintenance calories at his current activity level of four training sessions per week and low daily steps sit around 2,500 to 2,600 calories per day. To lose body fat at a sustainable rate of 0.5 to 0.75 kg per week, a target of 2,000 to 2,200 calories per day would be appropriate. Protein should be prioritised at 1.4 to 1.6 grams per kilogram of bodyweight, which translates to 126 to 144 grams of protein per day. This level of protein protects muscle mass during weight loss, supports testosterone production, and improves satiety. Weight loss is the single most impactful change Iluta can make. Reducing from 90 kg toward a target of 78 to 82 kg would lower aromatase activity and improve the testosterone to oestradiol ratio, reduce the inflammatory load driving CRP and ESR, improve uric acid clearance which may help his joint pain, raise HDL cholesterol, and support kidney function. Even a 5 kg loss would produce measurable improvements across multiple markers.\n\nFor cardiovascular risk reduction beyond weight loss, increasing soluble fibre intake would help. Good sources include oats, barley, lentils, beans, aubergine, and okra. Aiming for 10 to 15 grams of soluble fibre per day can reduce LDL by 5 to 10%. Eating oily fish such as salmon, mackerel, sardines, or trout two to three times per week provides EPA and DHA omega-3 fatty acids that reduce inflammation, lower triglycerides, and improve endothelial function. Reducing saturated fat intake by switching from butter to olive oil, choosing leaner cuts of meat, and limiting processed foods would also help. Given that his statin is not achieving target LDL levels, and given the Lp(a) burden, dietary changes alone will not be sufficient, but they provide additional benefit on top of medication.\n\nFor sleep, which directly affects testosterone production and recovery, Iluta should aim for a fixed wake time seven days a week, get outside within an hour of waking for natural light exposure, set a caffeine cut-off of 1pm at the latest, keep the bedroom cool at around 16 to 18 degrees Celsius, and avoid screens for 30 to 60 minutes before bed. Magnesium glycinate taken before bed can support sleep quality and muscle relaxation.\n\nFor daily activity, increasing steps from the current 2,000 to 5,000 range toward a target of 7,500 to 10,000 per day would meaningfully improve cardiovascular health, insulin sensitivity, and calorie expenditure. This does not need to be structured exercise; walking after meals, taking stairs, and parking further away all contribute.\n\nFor his joint pain and stiffness, the combination of weight loss to reduce mechanical load, omega-3 supplementation for its anti-inflammatory properties, and magnesium for muscle and joint support would be the first-line approach. If the elevated IgE is contributing to an allergic or inflammatory component, the GP may wish to investigate further.\n\nA retest is recommended in 12 to 16 weeks, focusing on a lipid panel including ApoB following any medication changes, a full blood count to reassess the red cell picture after iron optimisation, kidney function including Cystatin C, testosterone and oestradiol to assess the impact of weight loss, hs-CRP and ESR to track inflammation, and vitamin D and B12 to check supplementation response. The pending urine culture results should be reviewed as soon as they become available and acted upon if they show significant growth.","flags":"URGENT FOR GP:\n\nLp(a) greater than 212.5 nmol/L (target below 32 nmol/L): Genetically determined, permanently elevated. Places patient in the high-risk category (200 to 400 nmol/L). Cannot be modified by lifestyle or standard lipid therapy. Contributes directly to atherogenic particle count (ApoB). Recommend permanent recording in medical notes, testing of first-degree relatives, and consideration of intensified lipid management including possible lipid clinic referral.\n\nLipid panel despite statin therapy: LDL 4.43 (target below 3.0), ApoB 1.22 (target below 0.9), non-HDL 4.9 (target below 4.0), TC/HDL ratio 4.77 (target below 4.5), ApoB/A-I ratio 0.98 (target below 0.7). A portion of ApoB elevation is Lp(a)-driven and statin-resistant. Consider statin dose optimisation, addition of ezetimibe, or referral.\n\nFOR GP DISCUSSION:\n\nRed cell indices: RBC 6.15 (range 4.5 to 5.5), MCV 74.6 (range 83 to 101), MCH 25.2 (range 27 to 32), RDW 15.3 (range 11.5 to 15). Microcytic picture with compensatory erythrocytosis. Transferrin saturation 19.49% (borderline low). Ferritin 104 (adequate stores). Pattern consistent with alpha-thalassaemia trait (common in African heritage) and/or functional iron deficiency. Recommend haemoglobin electrophoresis.\n\nKidney function: Creatinine 112 (range 65 to 104), creatinine-based eGFR 68. However, Cystatin C eGFR is 82, which is more reliable given body composition and ethnicity. Mildly reduced but not CKD stage 3. Context: GP has already requested kidney scan. Clean urinalysis on this sample.\n\nESR 18 mm/hour (limit below 12): Mildly elevated. Likely multifactorial: BMI-related inflammation, possible contribution from microcytic red cell changes (small cells sediment differently). hs-CRP 1.6 supports low-grade inflammation.\n\nTestosterone 14.8 nmol/L: Within laboratory range but below optimal (18 to 30). Oestradiol 141 pmol/L, near ceiling of 146.1. LH 3.38 and FSH 3.21 suggest pituitary is not compensating. Significant symptom burden: absent morning erections, erectile dysfunction, low libido, anxiety. BMI-driven aromatase conversion is the most likely mechanism.\n\nIgG 17.3 g/L (range 6.5 to 16): Marginally elevated. Could reflect chronic immune activation.\n\nIgE 272 IU/ml (limit below 100): Significantly elevated. Suggests atopic tendency. Consider allergy investigation if clinically relevant.\n\nGlobulin 40 g/L (range 18 to 36): Elevated, explained by raised IgG and IgE. A/G ratio 0.95 (range 1.1 to 2.5).\n\nCK 401 U/L (range 40 to 320): Likely exercise-related given twice-weekly resistance training. Monitor for statin myopathy symptoms (pain, weakness, dark urine).\n\nTSH 3.46 mIU/L: Within lab range but above optimal (1.0 to 2.5). FT4 and FT3 both optimal. Antibodies negative. Subclinical, not actionable now but worth monitoring.\n\nUric acid 389 umol/L: Within lab range but above optimal (380). Could contribute to joint symptoms.\n\nAnion gap calculated at 20.8 (range 8 to 16): Mildly elevated. May be methodological. Worth reviewing with GP.\n\nPending results: Urine bacterial count and culture to follow.\n\nReassuring negatives: PSA 0.8 with free ratio 0.35, ruling out prostate concern. HbA1c 41, glucose 4.6, HOMA-IR 0.93, excellent glucose control. Thyroid antibodies negative. Rheumatoid factor negative. Coeliac screen negative. Liver enzymes all within range with FIB-4 0.97. Prolactin normal. Urinalysis clean with no blood, protein, or infection markers.","recommendations":"1. Book a GP appointment to discuss the Lp(a) result of greater than 212.5 nmol/L. This is a permanent cardiovascular risk factor that should be recorded in the medical notes. Ask about intensifying lipid-lowering therapy and whether referral to a lipid clinic is appropriate.\n\n2. Ask the GP about testing first-degree relatives for Lp(a), as it is inherited.\n\n3. Request haemoglobin electrophoresis from the GP to check for alpha-thalassaemia trait, which would explain the high red cell count and small cell size.\n\n4. Discuss kidney findings with the GP in the context of the planned kidney scan, noting that the Cystatin C eGFR of 82 is more reliable than the creatinine-based eGFR of 68.\n\n5. Discuss the testosterone and oestradiol findings with the GP alongside the sexual function symptoms to explore whether further investigation or treatment is warranted.\n\n6. Mention the elevated IgE of 272 to the GP, who may wish to investigate for allergic conditions.\n\n7. Report any muscle pain, weakness, or dark urine to the GP, as the elevated CK of 401 should be monitored in the context of statin use.\n\n8. Begin a calorie deficit targeting 2,000 to 2,200 calories per day with 126 to 144 grams of protein per day. Aim for a weight target of 78 to 82 kg over the next 6 to 12 months.\n\n9. Increase daily steps from the current 2,000 to 5,000 range toward 7,500 to 10,000 per day.\n\n10. Increase dietary quality from 5 out of 10 by adding oily fish two to three times per week, increasing vegetables and soluble fibre sources such as oats, lentils, and beans, and reducing processed and high-saturated-fat foods.\n\n11. Implement sleep hygiene practices: fixed wake time, morning light exposure, caffeine cut-off at 1pm, cool bedroom, and screen-free wind-down.\n\n12. Begin supplementation as outlined below.\n\n13. Review the pending urine culture results when available.\n\n14. Retest in 12 to 16 weeks: lipid panel with ApoB, full blood count, kidney function with Cystatin C, testosterone and oestradiol, hs-CRP, ESR, vitamin D, B12, and folate.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with a meal containing fat. Iluta's level of 56 nmol/L is above the deficiency threshold but below the optimal range of 75 to 120 nmol/L. A higher dose of 4,000 IU rather than the standard 2,000 IU is recommended because darker skin pigmentation reduces vitamin D synthesis from sunlight, and a BMI approaching 30 means fat tissue sequesters a proportion of supplemented vitamin D, reducing its availability. Vitamin D supports immune function, bone health, mood, and has been associated with improved testosterone levels.\n\nVitamin K2 (MK-7): 200 mcg daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bones and teeth and away from arteries. It should always accompany vitamin D supplementation, and is particularly important given Iluta's cardiovascular risk profile.\n\nMagnesium glycinate: 400 mg before bed. Iluta's magnesium is 0.84 mmol/L, just below the optimal floor of 0.85. Magnesium glycinate is the preferred form for sleep support because glycine itself has calming properties. It supports muscle relaxation, may help with joint stiffness, and can improve sleep quality, all of which are relevant to his reported symptoms.\n\nOmega-3 fish oil: 3 grams of combined EPA and DHA daily, taken with food. This supports cardiovascular health by reducing inflammation, improving endothelial function, and lowering triglycerides. Given the elevated Lp(a), ApoB, and hs-CRP, and the joint pain, omega-3 supplementation is well justified. Look for a product that specifies the EPA and DHA content per capsule rather than just total fish oil.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Iluta's B12 at 307 pg/ml is within the laboratory range but below the optimal floor of 500. Sublingual methylcobalamin bypasses the digestive system for better absorption. B12 supports energy production, nerve function, and red blood cell formation.\n\nFolate (methylfolate): 400 to 800 mcg daily. His folate at 7 ng/ml is below the optimal floor of 8. Folate works alongside B12 in red blood cell production and homocysteine metabolism. Methylfolate is the active form and is preferred over folic acid.\n\nThe most important changes from this report are not supplements. They are losing weight toward 78 to 82 kg through a modest calorie deficit with high protein intake, increasing daily steps to 7,500 to 10,000, improving diet quality with more oily fish, vegetables, and soluble fibre, fixing sleep habits, and having the GP conversation about Lp(a) management, the red cell picture, kidney function, and testosterone. These changes will produce far greater improvements across his blood markers than any supplement.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body is managing blood sugar levels at rest. Iluta's result of 4.6 mmol/L sits within the optimal range of 4.0 to 5.4, indicating excellent blood sugar regulation. At a BMI approaching 30, this is a genuinely positive finding and suggests his cells are responding well to insulin.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, infection, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4615","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c expressed as a percentage reflects the proportion of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the previous two to three months. Below 6.0% is considered normal, 6.0 to 6.4% is pre-diabetes, and above 6.5% is diabetes. Iluta's result of 6.0% sits right at the boundary between normal and pre-diabetes. While this is within the normal classification, it is at the upper edge and worth monitoring alongside his mmol/mol result.","low_causes":"Shortened red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Sustained elevated blood sugar, pre-diabetes, diabetes, iron deficiency (can falsely elevate)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the international standard unit for measuring glycated haemoglobin. Below 42 is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Iluta's result of 41 mmol/mol is just under the pre-diabetes threshold. It is important to note that his microcytic red cell picture, with smaller red cells, can slightly inflate HbA1c values because the smaller cells may have a longer lifespan. Even so, this result warrants monitoring over time.","low_causes":"Shortened red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Sustained elevated blood sugar, pre-diabetes, diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3609","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5751","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing at rest. Insulin is the hormone that allows cells to absorb glucose from the blood. A low-normal level in the context of normal blood sugar indicates that the body is managing glucose efficiently without needing to produce excessive insulin. Iluta's result of 4.56 mIU/L is within the optimal range of 2 to 8, indicating excellent insulin sensitivity.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, early type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, pre-diabetes, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"370.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3721","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"1000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5485","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is a reliable indicator of how much insulin the body is actually producing, unaffected by external insulin injections. The lab reported 1.12 ug/L, which converts to 370.7 pmol/L. This is just within the normal range, reflecting that the pancreas is producing an appropriate amount of insulin to match Iluta's modest glucose demands. Combined with his healthy glucose and insulin levels, this is a reassuring result.","low_causes":"Type 1 diabetes, advanced type 2 diabetes, low carbohydrate intake","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to the effects of insulin. A score below 1.0 indicates excellent insulin sensitivity. Iluta's HOMA-IR of 0.93 means his cells are responding well to insulin, which is a particularly encouraging finding at a BMI of 29.4 where insulin resistance is common.","low_causes":"High insulin sensitivity, very low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, physical inactivity, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"82.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3580","lower_normal":"80","upper_normal":"200","lower_optimal":"100","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6111","units":"","description":"HOMA-B estimates the functional capacity of the pancreatic beta cells, the cells that produce insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Iluta's HOMA-B is approximately 82.9, which sits just within the lower end of the reference range of 80 to 200. This indicates that his pancreas is producing an adequate but not excessive amount of insulin, matching his modest demand. Given his excellent glucose and HOMA-IR, this is appropriate rather than concerning.","low_causes":"Pancreatic beta cell decline, long-standing diabetes, very low carbohydrate intake","high_causes":"Insulin resistance causing compensatory overproduction, early metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2589","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. It is the most sensitive routine marker of liver cell damage. Iluta's ALT at 29 IU/L is within the laboratory range and just under the tighter optimal male threshold of below 30. This indicates the liver is functioning well with no evidence of significant cellular damage, which is particularly reassuring given statin use.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver disease, alcohol, medications including statins, viral hepatitis, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5729","units":"IU/L","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is fairly specific to the liver, AST can be elevated by muscle damage as well. Iluta's AST at 25 IU/L is well within range and consistent with a healthy liver. The CK elevation from exercise would not typically raise AST significantly at this level of training.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver disease, muscle damage, heart attack, strenuous exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2055","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT, gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol intake, bile duct problems, and metabolic strain on the liver. It is often the first enzyme to rise when the liver is under stress. Iluta's GGT at 30 IU/L is within the laboratory range for males of 4 to 73, though above the tighter optimal threshold of below 25. This is a reassuring result given his statin use and BMI, though there is room for improvement.","low_causes":"Generally not clinically significant","high_causes":"Alcohol, fatty liver disease, bile duct obstruction, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP, alkaline phosphatase, is an enzyme found in the liver, bones, kidneys, and digestive system. In the liver, it is concentrated in the bile ducts. A normal ALP alongside normal GGT helps confirm that the bile duct system is functioning well. Iluta's ALP at 59 IU/L is comfortably within range.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, Paget's disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when the body breaks down old red blood cells. It is processed by the liver and excreted in bile. A normal bilirubin level indicates healthy red blood cell turnover and effective liver processing. Iluta's bilirubin at 9 umol/L is within the healthy range.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures all the proteins in the blood, primarily albumin (produced by the liver) and globulins (produced by the immune system). Iluta's total protein at 78 g/L is within range, though the balance between albumin and globulin is shifted toward globulin, which is discussed in those individual markers.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, inflammation, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4167","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, nutrients, and medications around the body, and helps maintain fluid balance. A healthy albumin level reflects good liver synthetic function and adequate nutrition. Iluta's albumin at 38 g/L is within the laboratory range but below the optimal floor of 40. Albumin can be slightly suppressed in the presence of inflammation, which is consistent with his mildly elevated inflammatory markers.","low_causes":"Liver disease, inflammation, malnutrition, kidney disease (nephrotic syndrome)","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7778","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin is a collective term for the immune system proteins in the blood, including all antibody classes (IgG, IgA, IgM, IgE). When globulin is elevated, it means the immune system is producing more antibodies than usual. Iluta's globulin at 40 g/L is above the upper limit of 36, and this is explained by his elevated IgG at 17.3 and significantly elevated IgE at 272. The immune system is in an activated state, possibly reflecting an allergic tendency or chronic low-grade immune stimulation.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, allergies, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"0.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2262","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4048","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the liver-produced protein (albumin) to the immune-produced proteins (globulins). A low ratio suggests that either albumin is reduced or globulins are elevated, or both. Iluta's ratio of 0.95 is below the lower reference of 1.1 because his globulin is elevated while his albumin sits at the lower end of its range. This pattern is consistent with immune activation rather than liver disease, given that his liver enzymes are all healthy.","low_causes":"Elevated immunoglobulins, chronic inflammation, liver disease, kidney disease","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3345","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation using age, platelet count, ALT, and AST to estimate the likelihood of liver fibrosis, or scarring. A score below 1.3 in those under 65 indicates a low probability of significant fibrosis. Iluta's FIB-4 at 0.97 is reassuringly low and, combined with his normal liver enzymes, confirms no evidence of liver scarring.","low_causes":"Not applicable, lower is better","high_causes":"Liver fibrosis, cirrhosis, age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5379","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4470","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps digest starch. Elevated levels can indicate pancreatic inflammation. Iluta's amylase at 85 IU/L is comfortably within range, indicating normal pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5248","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase. Iluta's lipase at 40 U/L is within range, confirming healthy pancreatic function.","low_causes":"Generally not clinically significant","high_causes":"Acute pancreatitis, pancreatic disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5985","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the combined amount of all cholesterol in the blood, including LDL, HDL, and VLDL. A level below 5.18 is considered desirable. Iluta's total cholesterol at 6.2 mmol/L is above the desirable threshold, despite statin therapy. The Lp(a) elevation is contributing to this total, and the result should be interpreted alongside the individual cholesterol fractions rather than in isolation.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes, familial hypercholesterolaemia, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3382","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and sugar intake. They are the main energy storage fat. Fasting levels below 1.7 are considered normal, and below 1.0 is optimal. Iluta's triglycerides at 1.15 mmol/L are within the healthy range, suggesting that his diet is not driving excessive fat production. This is a positive finding.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar diet, alcohol, obesity, insulin resistance, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, very low-density lipoprotein cholesterol, is produced by the liver and carries triglycerides around the body. It is a precursor to LDL. Iluta's VLDL at 0.52 mmol/L is within range and within the optimal band, consistent with his healthy triglyceride level.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"High triglycerides, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"1.04","upper_normal":"1.04","lower_optimal":"1.4","upper_optimal":"1.4","lower_normal_position":"0.5","upper_normal_position":"0.5","lower_optimal_position":"0.6731","upper_optimal_position":"0.6731","units":"mmol/L","description":"HDL, high-density lipoprotein, is often called 'good' cholesterol because it carries cholesterol away from artery walls and back to the liver for disposal. Higher levels are associated with lower cardiovascular risk. The high-risk threshold for men is below 1.04. Iluta's HDL at 1.3 mmol/L is above the risk threshold, which is positive, but below the optimal level of above 1.4. Increasing physical activity, particularly his daily step count, and losing body fat are the most effective ways to raise HDL.","low_causes":"Physical inactivity, obesity, smoking, high refined carbohydrate diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, certain medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7387","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, low-density lipoprotein, is the main carrier of cholesterol into artery walls where it can form plaques. It is often called 'bad' cholesterol, though it performs essential functions at normal levels. The target is below 3.0, with an optimal level below 2.6. Iluta's LDL at 4.43 mmol/L is significantly above target despite statin therapy. A portion of this elevation is driven by Lp(a) particles, which each carry LDL cholesterol and cannot be reduced by statins. His GP should review whether the statin dose needs adjusting or additional medication such as ezetimibe should be considered.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5300","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a quick summary of cardiovascular risk by comparing total cholesterol to protective HDL. A ratio below 4.5 is desirable. Iluta's ratio of 4.77 is above target, reflecting both his elevated total cholesterol and his below-optimal HDL. Improving both sides of this ratio through diet, exercise, and optimised medication would bring it down.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Elevated LDL, low HDL, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"20.97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5243","lower_normal":"20","upper_normal":"20","lower_optimal":"25","upper_optimal":"25","lower_normal_position":"0.5","upper_normal_position":"0.5","lower_optimal_position":"0.6250","upper_optimal_position":"0.6250","units":"%","description":"HDL as a percentage of total cholesterol indicates what proportion of cholesterol in the blood is the protective, artery-clearing type. Above 20% is the minimum target, and above 25% is optimal. Iluta's HDL percentage at 20.97% just clears the floor, but there is considerable room for improvement. Increasing exercise and reducing body fat would help shift this proportion upward.","low_causes":"Low HDL, elevated LDL or triglycerides","high_causes":"Regular exercise, healthy weight, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol fractions, including LDL, VLDL, IDL, and Lp(a). Many cardiologists consider it a better risk indicator than LDL alone because it includes all atherogenic particles. Iluta's non-HDL at 4.9 is above the target of below 4.0, consistent with his overall lipid picture.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Elevated LDL, elevated triglycerides, genetics, elevated Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"1.2","upper_normal":"1.2","lower_optimal":"1.4","upper_optimal":"1.4","lower_normal_position":"0.5","upper_normal_position":"0.5","lower_optimal_position":"0.5833","upper_optimal_position":"0.5833","units":"g/L","description":"ApoA-I is the main structural protein of HDL particles. It is the mirror image of ApoB: where ApoB counts atherogenic particles, ApoA-I counts protective particles. A level above 1.20 is the minimum target. Iluta's ApoA-I at 1.24 g/L clears the floor, but is below the optimal level of above 1.4 that would indicate robust cardiovascular protection. Increasing physical activity and losing body fat are the most effective ways to raise it.","low_causes":"Physical inactivity, obesity, smoking, genetics","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic lipoprotein particle, including LDL, VLDL, IDL, and Lp(a). Each particle carries exactly one ApoB molecule, so this test effectively counts the total number of particles capable of depositing cholesterol into artery walls. Many experts consider ApoB the single best predictor of cardiovascular risk. Iluta's ApoB at 1.22 g/L is above the desirable level of below 0.9 and classified as 'high' by the laboratory. Importantly, each Lp(a) particle carries one ApoB, so a portion of his elevated ApoB is genetically driven and will not respond to statin therapy.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Elevated LDL, familial hypercholesterolaemia, elevated Lp(a), obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio compares the number of atherogenic particles to protective particles. It is considered by many researchers to be the best single summary measure of cardiovascular risk from lipids. A ratio below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Iluta's ratio of 0.98 places him in the higher risk category. Reducing ApoB through medication optimisation and dietary changes while raising ApoA-I through exercise and weight loss would improve this ratio.","low_causes":"Favourable lipid balance","high_causes":"High atherogenic particle count, low HDL particles, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a specialised lipoprotein particle that is entirely genetically determined. Unlike LDL, which can be lowered by diet, exercise, and statins, Lp(a) levels are set by inherited genes and remain essentially fixed throughout life. Lp(a) promotes cardiovascular disease through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clotting by interfering with the body's natural clot-dissolving system (it shares structural similarity with plasminogen), and it drives inflammation within vessel walls. Iluta's Lp(a) is greater than 212.5 nmol/L, placing him in the high-risk category (200 to 400 nmol/L). This result should be permanently recorded in his medical notes and his first-degree relatives should be tested. It fundamentally changes how his other lipid results should be interpreted and managed.","low_causes":"Genetics (favourable)","high_causes":"Genetics (unfavourable, inherited from one or both parents)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2933","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful proxy for insulin resistance and small, dense LDL particles. A lower ratio suggests larger, less harmful LDL particles and better metabolic health. Below 1.5 is the healthy range, and below 0.87 is optimal. Iluta's ratio of 0.88 is within the healthy range and just fractionally above the optimal threshold, consistent with his excellent insulin sensitivity as shown by his HOMA-IR.","low_causes":"Excellent metabolic health, low carbohydrate diet","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2938","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich lipoproteins, calculated as total cholesterol minus HDL minus LDL. It has emerged as an independent cardiovascular risk factor. Below 0.8 is within range, and below 0.5 is optimal. Iluta's remnant cholesterol at 0.47 is within the optimal range, indicating that his triglyceride metabolism is not contributing significantly to his cardiovascular risk. His risk is being driven by LDL, ApoB, and Lp(a) rather than by remnant particles.","low_causes":"Efficient triglyceride metabolism","high_causes":"Elevated triglycerides, insulin resistance, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1600","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"hs-CRP, high-sensitivity C-reactive protein, is a marker of systemic inflammation produced by the liver. It is used both as a general inflammation marker and as a cardiovascular risk indicator. A level below 1.0 is considered low cardiovascular risk, 1.0 to 3.0 is moderate risk, and above 3.0 is higher risk. Iluta's hs-CRP at 1.6 mg/L places him in the moderate risk category. At a BMI of 29.4, visceral fat tissue produces inflammatory signalling molecules that drive CRP upward. Weight loss is the most effective way to bring this down.","low_causes":"Low inflammation, healthy weight, anti-inflammatory diet, statin use","high_causes":"Obesity, infection, chronic inflammation, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation. It is a non-specific marker, meaning many conditions can raise it. Iluta's ESR at 18 mm/hour is above the upper limit of 12. This mild elevation could reflect his BMI-related systemic inflammation, his elevated immunoglobulins, or even be influenced by his microcytic red cell picture. It is consistent with the moderately elevated hs-CRP and supports a picture of low-grade inflammation rather than acute disease.","low_causes":"Polycythaemia, sickle cell disease, very low fibrinogen","high_causes":"Infection, inflammation, autoimmune disease, obesity, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance in the body. It is tightly regulated by the kidneys. Iluta's sodium at 141 mmol/L is within the optimal range, indicating normal fluid and electrolyte balance.","low_causes":"Excessive water intake, diuretics, kidney disease, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for nerve signalling, muscle contraction, and heart rhythm. The kidneys carefully control potassium levels. Iluta's potassium at 4.2 mmol/L is within the optimal range, indicating healthy electrolyte function.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, haemolysis in sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4744","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. It is usually measured as part of the electrolyte panel. Iluta's chloride at 100 mmol/L is within the optimal range.","low_causes":"Vomiting, diuretics, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, helping to maintain the blood's pH within a very narrow range. It is regulated by the kidneys and lungs. Iluta's bicarbonate at 24.4 mmol/L is within the optimal range, indicating normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"20.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is a calculated value using sodium, potassium, chloride, and bicarbonate to detect unmeasured acids in the blood. It is calculated as (sodium + potassium) minus (chloride + bicarbonate). Iluta's anion gap at 20.8 is above the upper reference of 16. This can be influenced by albumin levels, laboratory methodology, and the inclusion of potassium in the calculation (some laboratories exclude it, which gives a lower number). Given that his other metabolic markers are healthy, this is likely methodological rather than pathological, but is worth discussing with his GP for completeness.","low_causes":"Hypoalbu
