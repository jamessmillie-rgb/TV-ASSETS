<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Matthew Philip Tolson","dob":"23/09/1977","report_date":"2026-11-02","summary":"Customer is a 49-year-old male presenting with a BMI of 25.2, following a Mediterranean diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). He trains 6 times per week (3 cardio, 3 resistance) at a hard intensity with 2,000 to 5,000 daily steps. He sleeps 6 to 7 hours, feels tired most mornings, and reports an afternoon energy crash. Stress feels hard to manage rarely. He drinks 1 to 4 alcoholic drinks per week and reports overuse of caffeine or energy drinks. He takes vitamin D, magnesium, omega-3, creatine, protein powder and zinc. He has no diagnosed conditions and takes no medications. He reports low libido, hair thinning and joint pain. His goals are to improve energy levels and long-term health. He notes that he has had low libido for over fifteen years despite a testosterone result in 2020 that was higher than average, which has left him baffled. This is his first TrueVitals report. It is worth noting at the outset that this sample was drawn in the late afternoon (around 16:30 to 17:30) and was not fasted, which affects the interpretation of certain markers, particularly lipids, cortisol and testosterone; these are discussed individually below.\n\nThe finding that needs attention first in this report is his lipid profile, which shows a pattern of significantly elevated cholesterol that warrants a conversation with his GP. His total cholesterol is 8.7, which is well above the desirable threshold of 5.18. His LDL cholesterol, the fraction that drives plaque formation in artery walls, is 5.95, nearly double the upper limit of 3.0. Most importantly, his Apolipoprotein B (ApoB) is 1.78, which is classified as very high and is more than double the 0.9 target. ApoB is a direct count of the number of potentially harmful cholesterol particles circulating in the blood, and it is widely regarded as the single best predictor of cardiovascular risk from a blood test. His ApoB to ApoA-I ratio, which compares harmful to protective particles, is 0.973, placing him in the higher risk category (above 0.9). However, there is context that softens the picture slightly. His HDL cholesterol, the protective fraction that carries cholesterol away from artery walls, is 2.0, which is excellent and well above the desirable threshold of 1.55. His Apolipoprotein A-I, the protein that builds HDL particles, is 1.83, also strong. His HDL percentage of total cholesterol is 23%, above the 20% floor. His triglycerides are 1.76, which is marginally above the 1.70 fasting threshold but this sample was not fasted, and triglycerides rise after eating; a non-fasting level below 2.0 is considered acceptable, so this is not a concern. His atherogenic index of plasma is negative at minus 0.056, which is within the ideal range and reflects the favourable triglyceride-to-HDL balance. His LDL-to-HDL ratio (Castelli II) is 2.98, within the laboratory range of up to 3.5 but above the optimal threshold of 2.5, driven entirely by the high LDL. So the picture is one of very high LDL particle number alongside genuinely protective HDL levels. The net balance still leans towards risk, and the ApoB at 1.78 is the number that matters most. This panel does not include Lp(a), a genetically inherited lipoprotein that can contribute to elevated LDL and ApoB, so it is not possible to say how much of the LDL is modifiable through diet and how much is inherited. That would be worth testing separately. His diet is already excellent in terms of quality, so the usual advice about reducing saturated fat and increasing soluble fibre may yield only modest reductions, and his GP may want to discuss whether further investigation or intervention is appropriate given the ApoB level.\n\nHis CK-MB is 5.82, above the upper limit of 4.9. CK-MB is a form of creatine kinase found predominantly in heart muscle, and when it is elevated it can indicate cardiac muscle stress. However, in someone who trains 6 times per week at a hard intensity, CK-MB can be released from skeletal muscle during intense exercise, particularly resistance training. His total creatine kinase (CK) is 393, above the upper limit of 320, which supports the explanation that this is exercise-driven muscle breakdown rather than cardiac damage. His myoglobin, another marker of muscle injury, is 65.43, within the normal range but in the upper half, which is consistent with heavy training. The CK-MB to total CK ratio here is about 1.5%, which is low and typical of skeletal muscle origin; in a genuine cardiac event, this ratio tends to be higher, and the absolute CK-MB would usually be accompanied by symptoms such as chest pain or breathlessness. His hs-CRP (high-sensitivity C-reactive protein, a marker of systemic inflammation) is below 0.2, which is as low as this marker can read and effectively rules out any active inflammatory or cardiac process. Taken together, the most likely explanation is that the elevated CK and CK-MB reflect his training load rather than any cardiac concern, but given the significantly elevated ApoB, it would be reasonable to mention the CK-MB to his GP when discussing the lipid results so it can be noted in context.\n\nTurning to what is working well, and there is a great deal to feel positive about. His blood sugar control is excellent. His HbA1c, which measures the average blood sugar over the past two to three months, is 34 mmol/mol (5.3%), comfortably within the optimal range and well below the pre-diabetes threshold of 42. His estimated average glucose derived from this is 5.8, within the ideal range. This means his Mediterranean diet and training are keeping his metabolic health in very good shape. His liver is in excellent health. ALT at 28 is within the optimal range for a male (below 30), GGT at 20 is well within the optimal range (below 25), AST at 36 is within range, and total bilirubin at 12 is healthy. His FIB-4 score, which estimates the likelihood of liver scarring using age, platelets, AST and ALT, is 1.25, below the 1.3 threshold that would prompt further investigation. His APRI score is 0.337, well within the optimal range, and his NAFLD Fibrosis Score is minus 2.591, also comfortably in the low-risk zone. His De Ritis ratio (AST divided by ALT) is 1.29, within the optimal band. Albumin at 44, total protein at 74, and globulin at 30 are all healthy, and his albumin-to-globulin ratio is normal. The liver is handling his training load, his supplements and his modest alcohol intake without any visible strain.\n\nHis kidney function is good. Creatinine at 95 is within range, and his creatinine-based eGFR is 81, which is above 60 but below the 90 threshold that would be considered fully optimal. At 49 with a solid training history, creatinine can be pushed up by muscle mass, which lowers the eGFR calculation without reflecting any true kidney impairment. Urea at 7.8 is within range, and the urea-to-creatinine ratio at 82.1 is healthy. Uric acid at 360 is within the optimal range. His urinalysis is completely clean: no protein, no glucose, no blood, no white cells, no bacteria and no growth on culture. This is reassuring.\n\nHis full blood count is textbook. Haemoglobin at 150 is right in the middle of the male range, haematocrit at 0.434 is healthy, and his red cell indices (MCV, MCH, MCHC, RDW) are all within normal limits. His MCHC sits exactly at the upper boundary of 345, which is not a concern. His white cell count at 6.4 is healthy, with a good balance across neutrophils, lymphocytes, monocytes, eosinophils and basophils. His neutrophil-to-lymphocyte ratio (NLR), a marker that reflects the balance between the innate immune response and the adaptive immune system, is 1.19, within the optimal range and a sign that there is no chronic inflammatory drive. His platelet-to-lymphocyte ratio is 99.6 and his systemic immune-inflammation index is 317, both within optimal ranges. Platelets at 267 and MPV at 9.5 are healthy. His iron studies are solid: ferritin at 56 is within the optimal range for a male (50 to 200), serum iron at 24 is healthy, transferrin at 2.23 is within range, transferrin saturation at 42.86% is within the laboratory range but marginally above the optimal band of 25 to 40%; iron levels fluctuate through the day and this degree of variation is not a concern, and total iron binding capacity at 55.5 is within range.\n\nHis thyroid is working well. TSH (thyroid stimulating hormone, the signal from the brain that tells the thyroid how hard to work) is 2.0, within the optimal range of 1.0 to 2.5. Free T4, the main hormone the thyroid produces, is 16.9, within the optimal band. Free T3, the active form that cells actually use, is 4.7, within the optimal range. His FT3-to-FT4 ratio is 0.278, within the optimal band, meaning his body is converting T4 to T3 efficiently. The thyroid is not contributing to his fatigue or low libido.\n\nHis inflammation markers are exceptional. hs-CRP below 0.2 is as low as it gets. His platelet-to-lymphocyte ratio and systemic immune-inflammation index are both well within optimal ranges. There is no detectable systemic inflammation, which at a BMI of 25.2 with a clean diet is what one would hope for but is still worth noting as a genuine positive.\n\nHis vitamin D at 116 nmol/L is within the optimal range of 75 to 120 and reflects his supplementation working effectively. Folate at 11 is within range and above the optimal threshold of 8. Active B12 is reported as above 292, which is above the laboratory upper limit of 165. Active B12 (holotranscobalamin) measures the fraction of B12 that is available for cells to use. A result this high is almost always explained by supplementation, and since his protein powder or a multivitamin may contain B12, this is not a concern and does not indicate any disease process. Magnesium at 0.9 is within the optimal range of 0.85 to 1.05, reflecting his supplementation. Corrected calcium at 2.47 is healthy.\n\nHis cortisol is 359 nmol/L. Cortisol follows a strong daily rhythm, peaking in the early morning and falling through the afternoon. The morning reference range is 145 to 619, and the afternoon range is 95 to 462. Given that this sample was drawn between 16:30 and 17:30, 359 is within the expected afternoon range but sits in the upper half, which may reflect the caffeine intake he reports. Cortisol is not concerning here but is worth noting in the context of his afternoon crash and morning tiredness, which could be related to a caffeine-driven pattern of artificially sustained alertness followed by a rebound dip.\n\nNow to the question that brought him to this test: his low libido, which has persisted for over fifteen years. His total testosterone at 24.2 nmol/L is genuinely excellent for 49, sitting well within the optimal range of 18 to 30 and consistent with his previous result from 2020. His free testosterone, the fraction not bound to proteins and therefore available to act on tissues, is 0.347, within the laboratory range of 0.138 to 1.04. His bioavailable testosterone, which includes both the free fraction and the loosely bound fraction, is 8.32 nmol/L, within the optimal range. His free androgen index is 39.29, within range. His SHBG (sex hormone binding globulin), the protein that binds testosterone and makes it unavailable, is 61.6, which is within the laboratory range of 17.3 to 65.8 but sits in the upper quarter. SHBG at this level is not abnormal, but it does mean that a meaningful proportion of his excellent total testosterone is being bound up rather than acting on tissues. His LH (luteinising hormone, the brain signal that drives testosterone production) is 2.23, which is within the laboratory range but sits in the lower quarter. This is not low enough to suggest a pituitary problem, but it does suggest the brain is not pushing hard for more testosterone, which is appropriate given the total level is already high. DHEA-S at 4.2 umol/L is within range.\n\nSo the blood results do not provide a straightforward hormonal explanation for his low libido. Total testosterone is high, free testosterone is within range, and there is no thyroid, blood sugar or inflammatory cause. This is actually useful information because it narrows the field considerably. A libido that has been low for fifteen years despite consistently high testosterone suggests the cause sits outside what a blood test can measure. The most likely contributors, given what he has told us, are sleep and recovery. Six to seven hours with waking tired most mornings means he is not getting enough restorative sleep, and this has been shown to affect libido independently of testosterone levels. His caffeine overuse may be compounding this by fragmenting sleep quality even if the quantity feels adequate. Stress is reportedly low, which is good, but the afternoon energy crash pattern, combined with caffeine dependence and insufficient sleep, suggests a rhythm issue: he may be running on stimulants through the day and not recovering properly at night. His SHBG at 61.6, while within range, is on the higher side, and SHBG can be influenced by training volume and body composition; it may be worth monitoring. The Advanced panel does not include oestradiol (the primary oestrogen), which in men can influence libido, mood and body composition, and this would be worth testing on a future panel. A GP conversation about the persistent low libido, perhaps with a sexual health or endocrinology referral, would be worthwhile given that the obvious hormonal causes have now been excluded twice.\n\nHis hair thinning is another symptom that the bloods partially address. Iron deficiency and thyroid dysfunction are two common reversible causes of hair loss, and both have been excluded: ferritin is healthy and the thyroid is optimal. In men at 49, the most common cause of hair thinning is androgenetic alopecia (male-pattern hair loss), which is driven by the conversion of testosterone to dihydrotestosterone (DHT) in the hair follicle. His testosterone is high, which paradoxically provides more substrate for DHT conversion. This is a genetic sensitivity, not a disease, and the blood test cannot measure scalp DHT. If the thinning is progressive and concerning, a GP or dermatologist can discuss options.\n\nHis joint pain and stiffness, the third symptom he reports, also lacks a clear blood-based explanation. His inflammation is undetectable (hs-CRP below 0.2), his uric acid is within the optimal range (ruling out gout as a driver), and his calcium and magnesium are healthy. At 49 with a hard training load six days a week, joint wear from accumulated training volume is the most common explanation, particularly if the pain is in load-bearing joints or joints he trains heavily. His omega-3 supplementation may be helping to manage low-grade joint inflammation, and ensuring adequate recovery between sessions, including sleep, is the most effective non-pharmacological approach.\n\nHis PhenoAge, a biological ageing estimate built from nine blood markers including albumin, creatinine, CRP, white cell count, lymphocyte percentage, MCV, RDW, alkaline phosphatase and estimated average glucose, is 44.1 years against a calendar age of 49, putting him nearly five years younger biologically. This reflects his excellent inflammation, blood sugar control, liver function and blood count. The significantly elevated ApoB and LDL reinforce the importance of addressing the lipid findings.\n\nHis VLDL cholesterol at 0.8 is marginally above the 0.78 threshold. VLDL carries triglycerides, and in a non-fasted sample this marginal elevation is expected and not meaningful. His sodium at 140, chloride at 96 and corrected calcium at 2.47 are all healthy. His urine pH at 7 is neutral and normal.","links":"The dominant finding in this report is the lipid profile, and it stands largely alone. His total cholesterol at 8.7, LDL at 5.95 and ApoB at 1.78 represent a significant burden of atherogenic particles, and this is the system that needs action. What makes the picture more nuanced is the strength of his HDL at 2.0 and ApoA-I at 1.83, which provide genuine protection on the other side of the equation. The ApoB-to-ApoA-I ratio at 0.973 is the best single summary: it is in the higher-risk category despite the excellent HDL, because the sheer volume of LDL particles outweighs the protective effect. His triglycerides are not contributing to the problem, and his atherogenic index is actually favourable. This is not a metabolic-syndrome lipid pattern driven by insulin resistance and poor diet; his HbA1c is 34, his CRP is undetectable, his liver is clean, his BMI is 25.2 and his diet is genuinely good. This raises the question of whether there is a genetic component, either familial hypercholesterolaemia or an elevated Lp(a), neither of which can be assessed from this panel. His GP should consider testing Lp(a) to assess whether there is a genetic contribution to the elevated LDL.\n\nThe second thread connects his symptoms, specifically the low libido, morning tiredness and afternoon crash, and this thread runs through sleep and recovery rather than through the blood results. His testosterone is excellent at 24.2, his thyroid is optimal, his iron is healthy, his B12 and folate are fine, his blood sugar is well controlled, and his inflammation is undetectable. The bloods have systematically excluded the common causes of low energy and low libido. What remains is a pattern that blood cannot measure: 6 to 7 hours of sleep with waking tired, caffeine dependence to get through the day, an afternoon energy crash that may represent the caffeine wearing off, and a training load of six hard sessions per week that demands recovery his sleep is not providing. The SHBG at 61.6, while within range, is in the upper quarter and may be worth watching over time, as it can increase with endurance training and effectively reduces the testosterone available to tissues despite a high total level.\n\nThe elevated CK at 393 and CK-MB at 5.82 fit neatly into the training explanation. Both are consistent with skeletal muscle breakdown from resistance training, and the undetectable CRP rules out any inflammatory or cardiac process. These would be expected to normalise after 48 to 72 hours of rest, and if the sample had been taken on a rest day, they would very likely have been within range.\n\nThe third thread is the hair thinning and joint pain, both of which the bloods help with by exclusion rather than explanation. Iron, thyroid and inflammation have been ruled out as contributors to the hair loss, pointing towards androgenetic alopecia as the most likely cause. Joint pain at 49 with six hard training sessions per week and low step count (suggesting prolonged sitting between sessions) is most likely mechanical rather than inflammatory, supported by the undetectable CRP and healthy uric acid. Omega-3 supplementation and adequate recovery are the most effective tools here.","lifestyle":"Prioritise sleep above every other change in this report. Set a fixed bedtime that gives you 7.5 to 8 hours in bed, even if it means cutting a training session short. Anchor: set a phone alarm 30 minutes before your target bedtime as a wind-down cue. Why: 6 to 7 hours with waking tired is the most likely explanation for your afternoon crash, your low libido and your joint stiffness, and no supplement or diet change will fix what insufficient sleep is causing.\nSet a hard caffeine cut-off at 1pm, no exceptions. Replace afternoon caffeine with water, herbal tea or sparkling water. Anchor: after lunch, the coffee machine is closed. Why: caffeine has a half-life of 5 to 6 hours, so a 3pm coffee still has half its stimulant effect at 9pm, fragmenting sleep quality even if you fall asleep, and driving the tired-on-waking and afternoon-crash cycle you describe.\nAdd 2g of soluble fibre to breakfast and dinner. Oats, ground flaxseed stirred into yoghurt, or a handful of beans or lentils with dinner. Anchor: goes into the bowl or onto the plate before you sit down. Why: soluble fibre binds cholesterol in the gut and reduces LDL absorption; at your ApoB of 1.78 this is one of the few dietary levers available given your already excellent diet quality.\nEat oily fish (salmon, mackerel, sardines) at least three times per week, and continue your omega-3 supplement on the other days. Anchor: batch-cook or buy tinned fish for easy meals. Why: omega-3 fatty acids support HDL function and have a modest LDL-lowering effect, and they also help with the joint stiffness you report.\nReduce saturated fat where you can without dismantling your Mediterranean diet: swap butter for olive oil, choose leaner cuts of meat, and limit cheese to a few portions per week. Why: saturated fat is the strongest dietary driver of LDL cholesterol, and even on an excellent diet there is usually room to tighten this.\nIncrease your daily steps to 7,000 to 10,000. A 20-minute walk after your largest meal and a 10-minute walk at another point in the day will get you there. Anchor: plate in the sink, shoes on. Why: regular walking improves cholesterol metabolism independently of structured exercise, and post-meal walking specifically supports glucose and lipid clearance.\nConsider a deload week every four to six weeks where training volume drops by 40 to 50 percent. Why: your CK at 393 and CK-MB at 5.82 suggest your muscles are not fully recovering between sessions, which can contribute to joint stiffness and fatigue. A structured deload allows repair without losing fitness.\nCalorie target: approximately 2,500 to 2,700 kcal per day to maintain your current weight at your activity level (BMR roughly 1,780 kcal multiplied by an activity factor of 1.6 for moderate-to-hard training, adjusted down slightly for lower daily step count). Protein target: 104 to 128g per day (1.3 to 1.6g per kg of bodyweight), which your protein powder and Mediterranean diet should be achieving. Ensure protein is spread across three or four meals rather than concentrated in one.","flags":"Total cholesterol 8.7 (desirable below 5.18), LDL 5.95 (limit 3.0), ApoB 1.78 (desirable below 0.9, classified very high), ApoB/A-I ratio 0.973 (higher risk, above 0.9). Significantly elevated atherogenic particle count despite excellent HDL of 2.0 and ApoA-I of 1.83. This lipid profile warrants a GP conversation to assess cardiovascular risk, consider Lp(a) testing, and discuss whether dietary optimisation alone is sufficient or whether pharmacological intervention should be considered.\nCK 393 (limit 320) and CK-MB 5.82 (limit 4.9). In the context of six hard training sessions per week, these are consistent with skeletal muscle breakdown rather than cardiac pathology. hs-CRP below 0.2 and myoglobin within range support this interpretation. Worth mentioning to the GP alongside the lipid results for completeness.\nActive B12 above 292 (upper limit 165). Almost certainly reflects supplementation (likely from protein powder or a multivitamin). Not a clinical concern.\nVLDL 0.8 (limit 0.78). Marginal elevation in a non-fasted sample; clinically insignificant.\nSHBG 61.6 (range 17.3 to 65.8). Within range but in the upper quarter, which increases the proportion of total testosterone that is bound and unavailable to tissues. Not abnormal, but relevant context for the persistent low libido despite high total testosterone.\nReassuring negatives: liver function fully normal with all fibrosis scores in the low-risk zone, HbA1c 34 (excellent blood sugar control), hs-CRP below 0.2 (no systemic inflammation), thyroid optimal (TSH 2.0, FT4 16.9, FT3 4.7), iron stores healthy (ferritin 56, saturation 43%, in range but marginally above the optimal band of 25 to 40%), vitamin D 116 (optimal), kidney function adequate (eGFR 81, likely underestimated by creatinine in a muscular male), full blood count and differential entirely normal, urinalysis completely clear.\nNot reported on this occasion: potassium, bicarbonate, glucose, fasting insulin.","recommendations":"Discuss the lipid profile with your GP, bringing these numbers: total cholesterol 8.7, LDL 5.95, ApoB 1.78, ApoB/A-I ratio 0.973, alongside HDL 2.0. Ask about Lp(a) testing to determine how much of the elevated LDL is genetically driven and how much is modifiable. \nAsk your GP whether a formal cardiovascular risk assessment (such as QRISK3) is appropriate given the ApoB level, and whether dietary changes alone are likely to bring the ApoB below 0.9 or whether a statin or other lipid-lowering medication should be considered.\nMention the CK-MB of 5.82 (above the 4.9 limit) in the context of your training. The GP may wish to repeat this on a rest day (48 to 72 hours without training) to confirm it normalises, which would confirm the skeletal muscle explanation.\nDiscuss the persistent low libido with your GP. Testosterone has now been confirmed as high on two occasions (24.2 in this test, high in 2020), thyroid and metabolic causes have been excluded, and the cause likely sits outside what blood tests measure. Consider a referral to endocrinology or sexual health for further investigation, including oestradiol testing and a review of whether SHBG at 61.6 is functionally limiting tissue testosterone exposure.\nRequest a fasted morning blood draw for the lipid markers and glucose on the next test, ideally within three to six months after implementing the dietary changes above. The key markers to repeat are total cholesterol, LDL, ApoB, triglycerides and fasting glucose, alongside Lp(a) if not tested separately. This will give a true fasting baseline for the lipids and allow the dietary changes to be assessed.\nCalorie target: 2,500 to 2,700 kcal per day to maintain weight. Protein target: 104 to 128g per day (1.3 to 1.6g per kg). These should be reviewed if training volume or goals change.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 to 3,000 IU daily, taken with a fat-containing meal. Your level at 116 nmol/L is in the optimal range, so this dose maintains rather than builds. Pair with vitamin K2 (MK-7) at 100 to 200 mcg daily, which directs calcium into bones and away from arteries.\nContinue magnesium glycinate at 300 to 400mg, taken before bed. Your level at 0.9 is in the optimal range, and magnesium glycinate specifically supports sleep quality, which is the most important change in this report.\nContinue omega-3 fish oil at a dose providing 2 to 3g of combined EPA and DHA daily. Given the significantly elevated ApoB and LDL, omega-3 supports HDL function, has a modest anti-inflammatory effect on the vascular wall, and may help with the joint stiffness you report. Take with your largest meal.\nContinue creatine monohydrate at 3 to 5g daily. This supports training performance and recovery and is well evidenced for muscle and brain function. It does raise creatinine slightly, which may explain part of the eGFR reading of 81; this is not a kidney concern.\nContinue zinc supplementation at 15 to 25mg daily (as zinc picolinate or zinc bisglycinate), taken with food to avoid nausea. Your training load increases zinc losses through sweat, and zinc supports testosterone metabolism and immune function.\nContinue protein powder to help meet your daily target of 104 to 128g. Spread intake across meals rather than taking it all post-workout.\nConsider adding plant sterols or stanols at 2g per day (available as fortified foods or supplements). These block cholesterol absorption in the gut and can reduce LDL by 7 to 10%, which at your current LDL of 5.95 would be a meaningful contribution.\nDo not add iron supplements. Your ferritin at 56 and transferrin saturation at 43% show healthy iron stores, and additional iron would risk pushing saturation above the desirable range.\nThe most important changes from this report are not supplements. They are fixing sleep to 7.5 to 8 hours, cutting caffeine after 1pm, adding soluble fibre and oily fish to address the lipid profile, and having the GP conversation about cardiovascular risk and the persistent low libido.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 59.6; held to 59 by a system rated \"See your GP\". Weakest systems: cardiac markers 13%, lipids & cardiovascular 23%, hormones 88%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Total Cholesterol, ApoB/A1 Ratio.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"44.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"","upper_normal":"54","lower_optimal":"","upper_optimal":"49","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4537","units":"years","description":"PhenoAge is a biological ageing estimate derived from nine blood markers: albumin, creatinine, glucose (estimated from HbA1c in this case, as fasting glucose was not returned), CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 44.1 years against a calendar age of 49, this places him nearly five years younger biologically. The drivers of this favourable result are his exceptionally low CRP, healthy albumin, good white cell count, optimal MCV and RDW, and well-controlled blood sugar. This reflects the genuine health benefits of his Mediterranean diet, training and supplement regimen.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"42.86","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5573","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures how much of the iron-carrying protein transferrin is loaded with iron. At 42.86%, this is within the laboratory range but above the optimal band of 25 to 40%. In a non-fasted afternoon sample, iron levels naturally fluctuate, and a reading in this range is healthy and shows the body has adequate iron supply without overload.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serumiron","name":"Serum Iron","group":"IRON STUDIES","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5431","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6108","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the draw. At 24 umol/L, this is well within both the laboratory and optimal ranges. Iron is essential for oxygen transport in red blood cells, energy production in mitochondria, and immune function. This healthy level, alongside good ferritin and transferrin, confirms iron status is not contributing to his fatigue or other symptoms.","low_causes":"Iron deficiency, poor absorption, chronic blood loss, heavy training","high_causes":"Haemochromatosis, iron supplementation, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3511","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to where it is needed. At 2.23 g/L, this is just within the laboratory range but slightly below the optimal band of 2.3 to 3.3. The body produces more transferrin when it needs more iron and less when stores are adequate, so a lower-range transferrin alongside healthy ferritin and saturation simply reflects that iron supply is sufficient and the body is not demanding more transport capacity. This is not a concern.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3711","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein, and it is the single best indicator of overall iron reserves. At 56 ng/ml, this is within the optimal range of 50 to 200 for a male. This level rules out iron deficiency as a contributor to his fatigue, hair thinning or low energy. It also shows he does not need iron supplementation, and additional iron would not be beneficial.","low_causes":"Iron deficiency, heavy training, poor dietary intake, blood loss","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ironbindingcapacity","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"55.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4528","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6033","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the total capacity of the blood to bind and transport iron. At 55.5 umol/L, this is comfortably within both the laboratory and optimal ranges. TIBC rises when the body is iron-deficient (creating more binding capacity to grab whatever iron is available) and falls when iron stores are high. A mid-range TIBC alongside healthy ferritin and serum iron confirms well-balanced iron metabolism.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"150","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 150 g/L, this is right in the middle of the healthy male range and within the optimal band. Good haemoglobin means good oxygen delivery to muscles during training, to the brain for cognitive function, and to every organ. This rules out anaemia as a cause of his fatigue.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, altitude living","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"redbloodcount","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures the total number of red cells per litre of blood. At 4.84, this is within both the laboratory and optimal ranges. Combined with healthy haemoglobin, MCV and MCH, this shows the bone marrow is producing red cells at the right rate and the cells are the right size and carrying the right amount of haemoglobin.","low_causes":"Anaemia, bone marrow suppression, chronic disease, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.434","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.434 (43.4%), this is within both the laboratory and optimal ranges. A healthy haematocrit means blood viscosity is well balanced: enough red cells to carry oxygen efficiently without the blood being too thick, which would strain the cardiovascular system.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"89.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4537","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"Mean corpuscular volume measures the average size of each red blood cell. At 89.5 fl, this is within the optimal range. Small cells (low MCV) point towards iron deficiency, while large cells (high MCV) point towards B12 or folate deficiency. A normal MCV confirms that neither deficiency is affecting red cell production.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5933","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin in each red blood cell. At 30.9 pg, this is within d at the top of the optimal band. In someone who trains with resistance six times per week and takes creatine, creatinine is expected to be higher because the body converts supplemental creatine into creatinine. This means the creatinine-based eGFR of 81 likely underestimates true kidney function.","low_causes":"Low muscle mass, liver disease","high_causes":"High muscle mass, creatine supplementation, dehydration, reduced kidney function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"ml/min/1.73m2","description":"Estimated glomerular filtration rate (eGFR) estimates how well the kidneys filter waste from the blood. At 81, this is above the 60 threshold for concern but below the 90 level considered fully optimal. However, this calculation uses creatinine, which is elevated by his muscle mass and creatine supplementation. His true kidney filtration rate is very likely above 90. A cystatin C-based eGFR, which is not affected by muscle mass, would give a more accurate reading and is included in the Ultimate panel. There is no cause for concern here.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"Hyperfiltration (early diabetes), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"360","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4760","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","u
