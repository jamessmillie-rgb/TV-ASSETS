,"lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL (harmful), HDL (protective) and VLDL. At 8.7 mmol/L, this is significantly above the desirable threshold of 5.18. While total cholesterol alone does not tell the full story (a high HDL pulls the total up), at this level the number is being driven overwhelmingly by the elevated LDL at 5.95. This requires a GP conversation alongside ApoB.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4400","lower_normal":"0","upper_normal":"2","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"mmol/l","description":"Triglycerides are fats carried in the blood, used for energy. At 1.76 mmol/L, this is above the fasting threshold of 1.70 but well within the non-fasting threshold of 2.0. This sample was not fasted and was drawn in the late afternoon, so triglycerides are expected to be higher following meals eaten through the day. This result is not a concern and should not be interpreted as abnormal. A fasted morning draw would give a more meaningful baseline.","low_causes":"Malnutrition, hyperthyroidism, low-carb diet","high_causes":"High-carb diet, alcohol, obesity, metabolic syndrome, non-fasted sample","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5128","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues. At 0.8 mmol/L, this is marginally above the 0.78 threshold. VLDL is calculated from triglycerides, and since this is a non-fasted afternoon sample, the marginal elevation reflects the non-fasted state rather than any metabolic concern. In a fasted morning draw, this would very likely be within range.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"High-carb diet, insulin resistance, non-fasted sample, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9615","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol that carries excess cholesterol away from artery walls and back to the liver for disposal. At 2.0 mmol/L, this is excellent, well above both the desirable threshold of 1.55 and the optimal threshold of 1.4 for a male. This is one of the strongest positives in the lipid panel and reflects his Mediterranean diet, exercise habit and healthy metabolic function. It provides genuine protection against the elevated LDL.","low_causes":"Sedentary lifestyle, smoking, obesity, high-carb diet, metabolic syndrome","high_causes":"Regular exercise, healthy diet, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the cholesterol fraction that deposits in artery walls and drives atherosclerosis (the gradual build-up of plaque that narrows blood vessels). At 5.95 mmol/L, this is nearly double the upper limit of 3.0 and significantly above the optimal target of 2.6. This is the main driver of the cardiovascular risk in this report. LDL is calculated rather than directly measured, and in a non-fasted sample the calculation can be slightly affected, but the degree of elevation here is too large to be explained by fasting status alone. This needs a GP conversation.","low_causes":"Statin therapy, hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. At 4.35, this is within the laboratory limit of 4.5, which is only the case because the HDL is so high. Despite total cholesterol of 8.7, the exceptional HDL of 2.0 keeps this ratio in range. However, the ratio should not provide false reassurance: the absolute LDL and ApoB levels are more important for assessing actual risk.","low_causes":"High HDL, low total cholesterol","high_causes":"High total cholesterol, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"22.99","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5747","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"HDL percentage shows what proportion of total cholesterol is the protective HDL type. At 23%, this is above the 20% laboratory floor but below the optimal level of 25%. In the context of a very high total cholesterol, even a good HDL level gets diluted as a percentage. The absolute HDL of 2.0 is the more meaningful figure here.","low_causes":"Low HDL, very high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apolipoproteinA1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7625","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A-I is the main structural protein of HDL particles. At 1.83 g/L, this is well above the 1.20 normal threshold and the 1.40 optimal level. A strong ApoA-I supports efficient reverse cholesterol transport, the process by which excess cholesterol is removed from artery walls. This is a genuine positive in the lipid profile.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetics","high_causes":"Exercise, healthy diet, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apolipoproteinB","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on each LDL, VLDL and intermediate-density lipoprotein particle. Because there is exactly one ApoB molecule per particle, ApoB is a direct count of the total number of atherogenic (artery-damaging) particles in the blood. At 1.78 g/L, this is classified as very high (above 1.4) and is more than double the 0.9 target. ApoB is widely considered the single most important lipid marker for cardiovascular risk, more predictive than LDL alone, because it captures the total atherogenic particle burden. At this level, a GP conversation is essential to assess overall cardiovascular risk and discuss whether dietary changes, Lp(a) testing and potentially pharmacological intervention are warranted.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"Genetics, familial hypercholesterolaemia, high saturated fat diet, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.973","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6950","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A-I ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA-I). At 0.973, this is in the higher-risk category (above 0.9 for a male). This ratio is regarded as one of the best summary measures of cardiovascular risk from blood lipids. Despite the excellent ApoA-I of 1.83, the sheer volume of ApoB particles at 1.78 pushes this ratio well above the desirable threshold. This is driven entirely by the elevated LDL and ApoB.","low_causes":"Healthy lipid balance, high HDL, low LDL","high_causes":"High LDL/ApoB, low HDL, metabolic syndrome, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar over the past two to three months. At 5.3%, this is well within the normal range (below 6.0%) and below the optimal threshold. This is not affected by fasting status and gives a reliable picture of long-term blood sugar control. His Mediterranean diet and training are keeping metabolic health in excellent shape.","low_causes":"Hypoglycaemia, haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes, insulin resistance, high-carb diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the SI unit equivalent of the percentage above. At 34 mmol/mol, this is comfortably below the 42 threshold for pre-diabetes and within the optimal range (below 36). This confirms excellent long-term blood sugar control.","low_causes":"Hypoglycaemia, haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar level over the past two to three months. At 5.8 mmol/L, this is within the optimal range (below 6.2), confirming excellent long-term blood sugar control. This is not affected by fasting status.","low_causes":"Hypoglycaemia, haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4940","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. At 16.9 pmol/L, this is within the optimal range of 14 to 20, meaning the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4476","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/l","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland in the brain and tells the thyroid how hard to work. At 2.0 mIU/L, this is within the optimal range of 1.0 to 2.5. A TSH in this band means the brain is satisfied with the amount of thyroid hormone being produced, and the thyroid is not being pushed to over- or under-perform. The thyroid is not contributing to his fatigue, weight or energy patterns.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary suppression","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use for metabolism, energy production and temperature regulation. At 4.7 pmol/L, this is within the optimal range of 4.5 to 6.5. The body is converting T4 to T3 efficiently, confirmed by the FT3:FT4 ratio of 0.278 which is also optimal.","low_causes":"Hypothyroidism, sick euthyroid syndrome, low energy availability, chronic illness","high_causes":"Hyperthyroidism, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.278","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.278, this is within the optimal range of 0.27 to 0.40, confirming efficient thyroid hormone conversion. Poor conversion can cause fatigue and sluggish metabolism even with normal TSH and FT4, but this is not the case here.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"< 0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is the most sensitive blood marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. At below 0.2 mg/L, this is as low as the test can read and is well within the optimal range (below 1.0). This is an exceptional result that rules out any significant systemic inflammation, whether from infection, autoimmune activity, metabolic stress or cardiovascular inflammation. It also means his joint pain is unlikely to have an inflammatory cause.","low_causes":"Not clinically significant, reflects healthy state","high_causes":"Infection, autoimmune disease, cardiovascular inflammation, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"activeb12","name":"Active B12","group":"VITAMINS & NUTRIENTS","result":"> 292","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9693","lower_normal":"25.1","upper_normal":"165","lower_optimal":"70","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4403","upper_optimal_position":"0.6667","units":"pmol/L","description":"Active B12 (holotranscobalamin) measures the fraction of vitamin B12 that is available for cells to use. At above 292 pmol/L, this is well above the laboratory upper limit of 165. This is almost certainly explained by supplementation, most likely from his protein powder, a fortified food or a multivitamin. A high active B12 from supplementation is not harmful and does not indicate any disease process. B12 is water-soluble and excess is excreted by the kidneys. No action is needed.","low_causes":"Poor dietary intake (especially vegan/vegetarian), malabsorption, pernicious anaemia, metformin","high_causes":"B12 supplementation, fortified foods, liver disease (rare), myeloproliferative disorders (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ckmb","name":"CK-MB","group":"CARDIAC MARKERS","result":"5.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5939","lower_normal":"0","upper_normal":"4.9","lower_optimal":"0","upper_optimal":"4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4082","units":"ug/L","description":"CK-MB is the creatine kinase isoenzyme found predominantly in cardiac muscle. When elevated, it can indicate damage to heart muscle cells. At 5.82 ug/L, this is above the upper limit of 4.9. However, in someone who trains with resistance three times per week at a hard intensity, CK-MB can be released from skeletal muscle, which also contains small amounts of this isoenzyme. His total CK is also elevated at 393, and his hs-CRP is undetectable, making cardiac damage extremely unlikely. The CK-MB to total CK ratio is approximately 1.5%, which is typical of skeletal muscle origin. This is worth mentioning to the GP for documentation alongside the lipid results, but in this context it is most likely a training effect.","low_causes":"Not clinically significant","high_causes":"Cardiac muscle damage (myocardial infarction), intense resistance training, skeletal muscle injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"myoglobin","name":"Myoglobin","group":"CARDIAC MARKERS","result":"65.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6201","lower_normal":"25","upper_normal":"72","lower_optimal":"25","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"ug/l","description":"Myoglobin is a protein found in both skeletal and cardiac muscle that stores oxygen. At 65.43 ug/L, this is within the normal range but in the upper half, consistent with regular intense training. A myoglobin above 110 would be highly suggestive of cardiac damage; at 65 this simply reflects the expected muscle turnover from his training load.","low_causes":"Not clinically significant","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myocardial infarction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"24.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5928","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"28.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4910","upper_optimal_position":"0.6667","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, energy, mood, libido and sexual function. At 24.2 nmol/L, this is an excellent result for a 49-year-old male, well within the optimal range of 18 to 30. This sample was drawn in the late afternoon (around 16:30 to 17:30), when testosterone is typically 20 to 30% lower than its morning peak, which means his morning level is likely even higher. This confirms the 2020 finding that his testosterone production is strong. The persistent low libido despite consistently high testosterone suggests the cause lies elsewhere, likely in sleep, recovery, stress pathways or oestrogen balance rather than testosterone production itself.","low_causes":"Ageing, obesity, sleep deprivation, chronic illness, pituitary disease, medications","high_causes":"Exogenous testosterone, anabolic steroids, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeandrogen","name":"Free Androgen Index","group":"HORMONES","result":"39.29","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3591","lower_normal":"30","upper_normal":"150","lower_optimal":"45","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) estimates the proportion of testosterone that is not bound to SHBG and is therefore biologically available. At 39.29, this is within the laboratory range but below the optimal band of 45 to 120. This is because his SHBG at 61.6 is on the higher side, binding a larger proportion of his total testosterone and leaving less free. Despite excellent total testosterone of 24.2, the FAI suggests that tissue exposure to testosterone may be lower than the total number implies. This could be a contributing factor to his low libido and is worth discussing with a GP or endocrinologist.","low_causes":"High SHBG, ageing, liver disease, hyperthyroidism","high_causes":"Low SHBG, obesity, insulin resistance, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"61.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6378","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3863","upper_optimal_position":"0.5924","units":"nmol/l","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds testosterone (and oestrogen) in the blood, making them unavailable to act on tissues. At 61.6 nmol/L, this is within the laboratory range but above the optimal band of 25 to 55 and in the upper quarter of the reference range. Higher SHBG means more testosterone is bound and less is free to act on receptors in the brain, muscles and sexual organs. This is the most likely hormonal contributor to his low libido despite excellent total testosterone. SHBG tends to be higher in lean men with regular endurance training, and it can also be influenced by thyroid status (though his thyroid is optimal). An oestradiol level, not included in this panel, would help complete the picture.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Lean body composition, ageing, hyperthyroidism, liver disease, endurance training","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.3473","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4107","lower_normal":"0.138","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3932","upper_optimal_position":"0.5410","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone that is not bound to any protein and can directly enter cells and act on androgen receptors. At 0.347 nmol/L, this is within the laboratory range but in the lower portion. Despite a total testosterone of 24.2, the high SHBG at 61.6 is binding most of it, leaving relatively little free. This is consistent with the below-optimal Free Androgen Index and may be a contributing factor to the low libido. It is not below range, so it does not meet the clinical threshold for testosterone deficiency, but it is on the lower side for a man with this total level.","low_causes":"High SHBG, ageing, obesity, chronic illness","high_causes":"Low SHBG, exogenous testosterone, obesity (paradoxically through low SHBG)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3645","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6111","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and signals the testes to produce testosterone. At 2.23 mIU/ml, this is within the laboratory range but in the lower portion. A lower LH in the presence of high testosterone is physiologically appropriate: the brain detects adequate testosterone and does not need to push hard for more production. This is a normal negative-feedback loop and is not a sign of pituitary dysfunction. However, the afternoon draw may also contribute to a slightly lower reading, as LH has a pulsatile pattern.","low_causes":"High testosterone (feedback suppression), pituitary disease, medications, afternoon sampling","high_causes":"Primary hypogonadism (testicular failure), menopause (in women), Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"359","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5729","lower_normal":"94.9","upper_normal":"462.4","lower_optimal":"94.9","upper_optimal":"462.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a strong circadian rhythm, peaking in the early morning (145 to 619 nmol/L) and falling through the day (afternoon range 95 to 462 nmol/L). This sample was drawn between 16:30 and 17:30, so the afternoon reference range applies. At 359 nmol/L, this is within the expected afternoon range but sits in the upper half. Caffeine stimulates cortisol release, and his reported overuse of caffeine may be keeping cortisol higher than it would otherwise be at this time of day. This is not abnormal, but a cortisol that stays elevated into the late afternoon may contribute to difficulty winding down for sleep and poorer sleep quality.","low_causes":"Adrenal insufficiency, pituitary disease, chronic fatigue","high_causes":"Stress, caffeine, Cushing's disease, steroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3735","upper_optimal_position":"0.5792","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is the most abundant steroid hormone in the body and serves as a precursor to both testosterone and oestrogen. At 4.2 umol/L, this is within the optimal range. DHEA-S declines naturally with age, so a healthy level at 49 reflects good adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic illness, long-term corticosteroid use","high_causes":"Adrenal tumour, PCOS (females), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"8.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4263","lower_normal":"3.8","upper_normal":"20","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3580","upper_optimal_position":"0.5638","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and the testosterone loosely bound to albumin, which can dissociate and become active. At 8.32 nmol/L, this is within the optimal range of 5 to 15. This is a more comprehensive measure of testosterone available to tissues than free testosterone alone. While it is within optimal, it is in the lower half, which is consistent with the moderately high SHBG binding a significant proportion of the total.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"393","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7536","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from muscle cells when they are damaged or under stress. At 393 U/L, this is above the upper limit of 320 for a male. In someone who trains with resistance three times per week at a hard intensity, CK elevation is expected and reflects normal muscle breakdown and repair from training. CK levels can remain elevated for 24 to 72 hours after a hard session. If this sample had been taken after 48 to 72 hours of rest, the result would very likely be within range. There are no symptoms of concern (no muscle pain out of proportion to training, no dark urine), and the hs-CRP is undetectable, ruling out an inflammatory process.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statins, myocardial infarction, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineph","name":"Urine pH","group":"URINALYSIS","result":"7","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures the acidity or alkalinity of the urine. At 7, this is neutral and within the normal range of 4.5 to 8.0. Diet, hydration and metabolic status influence urine pH. A neutral pH is unremarkable.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineprotein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/l","description":"Urine protein screens for protein leaking through the kidney filter. A negative result is normal and confirms the kidneys are retaining protein as they should.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineglucose","name":"Urine Glucose","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine glucose screens for glucose spilling into the urine, which occurs when blood sugar exceeds the kidney's reabsorption capacity. A negative result is normal and consistent with his excellent HbA1c of 34.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ketones","name":"Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Ketones in urine indicate the body is burning fat for fuel rather than glucose, which can occur during fasting, low-carb diets or uncontrolled diabetes. A negative result is expected on a Mediterranean diet with adequate carbohydrate intake.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinewbc","name":"Urine WBCs","group":"URINALYSIS","result":"< 1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"wbc/ul","description":"White blood cells in urine indicate inflammation or infection in the urinary tract. At below 1 (below 10 is not significant), this is completely normal and rules out urinary tract infection.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinerbc","name":"Urine RBCs","group":"URINALYSIS","result":"< 1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"rbc/ul","description":"Red blood cells in urine can indicate kidney disease, bladder problems or urinary tract infection. At below 1 (below 25 is not significant), this is completely normal.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"casts","name":"Casts","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Casts are cylindrical structures formed in the kidney tubules. Their presence can indicate kidney disease. A negative result is normal and consistent with healthy kidney function.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bacterialcount","name":"Bacterial Count","group":"URINALYSIS","result":"< 1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CFU/ml","description":"Bacterial count measures the number of bacteria in the urine sample. At below 1 CFU/ml, this is completely clear and confirms no urinary tract infection.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineculture","name":"Urine Culture and Sensitivities","group":"URINALYSIS","result":"No growth","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"The urine culture tests for bacterial growth by incubating the sample. No growth confirms the absence of urinary tract infection.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"1.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3830","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.4812","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is calculated by dividing the neutrophil count by the lymphocyte count. It reflects the balance between the innate immune response (neutrophils) and the adaptive immune system (lymphocytes). At 1.19, this is within the optimal range of 1.0 to 2.0, confirming there is no chronic inflammatory drive, infection or immune stress.","low_causes":"Not typically significant in the absence of other findings","high_causes":"Bacterial infection, systemic inflammation, physiological stress, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"99.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4213","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio is a marker of systemic inflammation. At 99.6, this is within the optimal range of 80 to 160. A healthy PLR alongside undetectable hs-CRP and a normal NLR confirms there is no chronic inflammatory process.","low_causes":"Not typically significant","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"317","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4780","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index combines platelets, neutrophils and lymphocytes into a single composite measure of immune and inflammatory activity. At 317, this is within the optimal range of 150 to 450. This confirms healthy immune balance and no systemic inflammation.","low_causes":"Not typically significant","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2933","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"","description":"The triglyceride-to-HDL ratio is a marker of insulin resistance and metabolic health. At 0.88, this is within the laboratory range and marginally below the optimal threshold of 0.9. In a non-fasted sample, triglycerides are expected to be higher, so the true fasted ratio may be even more favourable. This suggests good insulin sensitivity and metabolic function.","low_causes":"Excellent metabolic health, low-carb diet, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high-carb diet, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4688","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, and it represents the cholesterol carried in triglyceride-rich particles (VLDL and intermediate-density lipoproteins). At 0.75 mmol/L, this is within the laboratory range (below 0.8) but above the optimal threshold of 0.5. In a non-fasted sample, remnant cholesterol is expected to be higher because triglyceride-rich particles increase after eating. A fasted morning draw would give a more accurate reading. Even so, this is on the higher side and contributes to the overall atherogenic burden alongside the elevated LDL and ApoB.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, non-fasted sample, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.056","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5934","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from the log of the triglyceride-to-HDL ratio and estimates the balance between pro-atherogenic and anti-atherogenic lipoproteins. At minus 0.056, this is within the optimal range (below 0.11). A negative value is a positive finding and reflects the strong HDL and relatively controlled triglycerides. This index captures a different dimension of lipid risk from ApoB: while the atherogenic index reflects the metabolic health of lipid metabolism (triglyceride const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>

  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
