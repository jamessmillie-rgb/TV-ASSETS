<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Matthew Oakley","dob":"13/10/1998","report_date":"2026-10-01","summary":"Matthew is a 27-year-old male presenting with a BMI of 22.3, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are slightly below average (volume 4 out of 10). He trains twice a week, one cardio and one resistance session at moderate intensity, with 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress feels hard to manage constantly. He does not drink alcohol. He takes nortriptyline 30 mg nightly for vestibular migraines and uses frequent painkillers such as ibuprofen or paracetamol. He supplements vitamin D, iron and vitamin B12. He reports headaches, low energy and fatigue, low libido, and bloating or digestive discomfort. His symptoms have been present alongside near-constant vestibular migraines for over a year, and the nortriptyline has reduced the severity but not enough to allow him to work on a laptop. He finds it hard to gain weight and feels his libido is lower than it used to be. His goals are to balance his hormones, improve his energy levels, and improve his digestion and gut health.\n\nThere is a lot to feel good about in this panel. Matthew's liver is in excellent health. ALT at 26, AST at 22, Gamma GT at 18 and alkaline phosphatase at 55 are all comfortably within range, and the FIB-4 score, an index that combines age, platelets and liver enzymes to screen for scarring, is 0.61, well below the 1.45 threshold. The APRI and NAFLD fibrosis scores confirm the same picture: there is no sign of fatty liver disease or fibrosis. This is worth noting because frequent painkiller use, particularly paracetamol, can stress the liver over time, and his liver is showing no strain at all. His kidney function is strong, with a cystatin C of 0.94 giving a combined eGFR of 104, exactly where it should be at 27. Uric acid at 305 is comfortably within the ideal window. Sodium, chloride, potassium and magnesium are all within range, and corrected calcium at 2.36 is healthy. His blood sugar control is excellent. Fasting glucose at 4.9 and HbA1c at 33 mmol per mol are both within the ideal range, meaning his average blood sugar over the last three months has been well controlled. Fasting insulin at 7.3 is within the optimal band of 2 to 8, and C-peptide at 467 pmol/L confirms the pancreas is producing the right amount of insulin. His thyroid is working well. TSH at 3.82 is within the laboratory range, free T4 at 18.1 is within the ideal window, free T3 at 5.8 is excellent, and both thyroid antibodies are negative, meaning there is no autoimmune thyroid process. The FT3 to FT4 ratio of 0.32 confirms the thyroid is converting its stored hormone into the active form efficiently. His inflammation markers are reassuring: hs-CRP at 0.8 is below 1.0, which is optimal, and ESR at 4 is very low. The systemic immune-inflammation index and platelet-to-lymphocyte ratio are both within ideal ranges. His immune system is balanced, with IgG, IgA, IgM and IgE all within range, rheumatoid factor negative, and coeliac screening negative. His prostate markers are excellent, with a PSA of 0.29 and a free-to-total ratio of 0.517, which is as reassuring as it gets. Both tumour markers, CA19-9 and CEA, are well within range. Creatine kinase at 61 confirms no muscle damage. Cortisol at 352 on a morning sample sits comfortably in the expected range, which argues against the adrenal axis being a major driver of his fatigue. His Lp(a), a genetically determined particle that accelerates cardiovascular disease and cannot be changed by diet or exercise, is below 25 nmol/L, under the 32 threshold. This is genuinely useful information because it means any future lipid management is entirely about modifiable factors. His urinalysis is completely clean: no protein, no blood, no white cells, no nitrites, no bacterial growth.\n\nTurning to the findings that need attention. Matthew's ApoB, which stands for apolipoprotein B and represents the number of potentially harmful cholesterol-carrying particles in the bloodstream, is 0.93, above the 0.9 threshold and above the 0.8 optimal target. His LDL cholesterol at 2.53 is within the laboratory range but above the optimal ceiling of 2.0 when corrected for Lp(a), sitting at 2.45. His HDL cholesterol at 1.0 is below the 1.04 threshold the laboratory flags as low risk and well below the 1.4 optimal for a male. HDL is the particle that carries cholesterol away from the artery wall back to the liver for disposal, so a low HDL means less of that reverse transport is happening. The ApoB to ApoA1 ratio, which is one of the best single summaries of cardiovascular balance, is 0.77, above the 0.7 lower-risk threshold. The TC to HDL ratio at 4.0 and the Castelli II ratio at 2.53 both sit at the upper edge of their ranges. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 35 out of 100. This is within the acceptable range of 40 or below but above the ideal ceiling of 20, and the two inputs driving it are the ApoB and the low HDL. At 27, his ten-year absolute risk of a cardiovascular event is very low, but the score tells us that risk is being built faster than it should be, and the gap between his age and the score is the window for acting. The good news is that his triglycerides at 1.09 are healthy, his Lp(a) is low, and his hs-CRP is optimal, so the levers here are dietary: increasing soluble fibre from oats, beans, lentils and barley, adding two to three portions of oily fish a week for omega-3, and reducing saturated fat from red meat and full-fat dairy. Exercise is the single most reliable way to raise HDL, and at one cardio session a week, there is significant room to build. Even adding two brisk 30-minute walks a week on top of his existing sessions would start to shift the HDL upward.\n\nMatthew's testosterone at 16 nmol/L is within the laboratory range of 8.4 to 28.7 but below the 18 optimal threshold for a 27-year-old male. His free testosterone, the fraction not bound to proteins and available for the body to use, is 0.364, which is within range, and bioavailable testosterone calculated at 9.3 is at the very top of its range. His SHBG at 25.1 is at the lower end of the range, which means a higher proportion of his total testosterone is free, partially compensating for the lower total. Nevertheless, at 27, a total testosterone of 16 is below where it should sit, and it connects directly to his reported low libido and low energy. Nortriptyline, as a tricyclic antidepressant, can suppress libido through its effects on serotonin and noradrenaline pathways, and it is difficult to separate how much of his reduced sex drive is the medication and how much is the testosterone level. However, the testosterone itself may be partly explained by his chronically elevated stress, his low training volume and his below-average food intake. Chronic psychological stress raises cortisol, and sustained cortisol elevation suppresses the hypothalamic-pituitary-gonadal axis, the signalling chain from the brain to the testes. His LH at 3.19 and FSH at 2.22 are both within range but sitting in the lower half, which is consistent with the brain not sending as strong a signal to the testes as it could. This is not a pathological pattern; it is a functional one, meaning the machinery is intact but the inputs, food, sleep quality, stress and exercise, are holding the output down. We would recommend discussing the testosterone level with his GP, particularly if the libido and fatigue do not improve with the lifestyle changes below, because a repeat fasting morning testosterone and an LH and FSH would confirm whether this is a persistent finding.\n\nHis progesterone at 0.75 is below the laboratory range of 0.89 to 3.88. In men, progesterone plays a supporting role in mood regulation, sleep quality and as a precursor to other hormones. At this margin, and in the context of low-normal testosterone, it is consistent with the same picture: the hormonal axis is producing less across the board, likely driven by stress and under-eating rather than by a primary hormonal disease.\n\nMoving to the blood count, Matthew's red cell indices show a pattern worth understanding. His MCV at 79.4 is below the lower limit of 83. MCV stands for mean corpuscular volume, the average size of a red blood cell, and a low MCV means the red cells are smaller than they should be. His RDW at 17.6, which measures the variation in red cell size, is above the upper limit of 15, meaning the red cells are not only small on average but more variable in size than normal. His MCHC at 361, the average concentration of haemoglobin packed into each red cell, is above the upper limit of 345. The combination of low MCV and high RDW classically points toward either iron deficiency or a thalassaemia trait, which is an inherited variation in haemoglobin production common in people of Mediterranean, South Asian and Middle Eastern descent but also present in people of European ancestry. However, his iron studies tell a different story: ferritin at 114 is healthy, serum iron at 13.2 is within range, and transferrin saturation at 23.5% is just below the 25% optimal floor but within the laboratory range. This means he is not iron deficient. The Mentzer index, which divides MCV by red blood cell count and helps distinguish iron deficiency from thalassaemia trait, is 15.6, which falls above the 13 threshold that would strongly suggest thalassaemia. At 15.6 it is in an intermediate zone, so it does not confirm thalassaemia trait, but the low MCV with adequate iron stores does raise the possibility. The fact that his haemoglobin at 145 and red blood cell count at 5.08 are both healthy makes this less clinically urgent, but we would recommend mentioning the low MCV and raised RDW to his GP, who can arrange a haemoglobin electrophoresis, a simple blood test that definitively identifies or rules out a thalassaemia trait. If confirmed, it is not a disease and does not need treatment, but it is useful to have on his permanent medical record.\n\nHis absolute reticulocyte count at 46 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a slightly low count at this margin, in someone whose haemoglobin and red cell count are healthy, simply means the bone marrow is not being asked to produce more because there is no demand. If a thalassaemia trait is present, a slightly lower reticulocyte output can be part of that pattern. It is not a concern in isolation.\n\nHis neutrophils at 1.93 are marginally below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the first responder to bacterial infection. A count of 1.93 against a limit of 2.0 is a very small margin, and in people of European ancestry, benign ethnic neutropenia, a harmless inherited pattern of slightly lower neutrophil counts, is present in around 5% of the population. His total white cell count at 4.31 is just above the lower limit of 4.0, and lymphocytes, monocytes, eosinophils and basophils are all within range. The most likely explanation at this margin is either benign variation or a reflection of low energy availability: when the body is not receiving quite enough fuel, it can quietly downregulate white cell production. Given his below-average food intake and the weight he finds difficult to gain, this is plausible.\n\nHis MPV at 11.1 is above the upper limit of 10.1. MPV stands for mean platelet volume, the average size of a platelet. Larger platelets are younger and more active, and a raised MPV can sometimes indicate that the bone marrow is producing platelets faster, often in response to mild inflammation or simply as a normal variant. With his platelet count at 192, which is healthy, and his hs-CRP at 0.8, which is optimal, this is most likely a normal variant for him and not a concern.\n\nHis bicarbonate at 31.7 is marginally above the upper limit of 31. Bicarbonate is the main buffer the body uses to maintain blood pH. A marginally raised bicarbonate can reflect mild dehydration, the sample sitting before processing, or a compensatory response to chronic low-grade respiratory changes. At this margin it has no clinical significance and does not need action.\n\nHis HOMA-IR, which stands for the homeostatic model assessment of insulin resistance and is calculated from fasting glucose and fasting insulin, is 1.59, above the upper limit of 1.5 but below the 1.9 threshold that the laboratory defines as early insulin resistance. His fasting glucose is 4.9, his HbA1c is 33, and his fasting insulin is 7.3, all within ideal ranges. The HOMA-IR is sitting just above the reference ceiling, and at this margin, with every input in the ideal range, this does not represent meaningful insulin resistance. It is a mathematical artefact of a glucose and insulin that are both in the upper half of their ideal bands. There is nothing to act on here beyond the general dietary advice below.\n\nHis PTH at 0.7 is below the lower limit of 0.98. PTH stands for parathyroid hormone, produced by four small glands behind the thyroid, and it regulates calcium and phosphate levels. When calcium is sufficient, PTH drops because the body does not need to mobilise more. His corrected calcium at 2.36 is healthy, and his phosphate at 1.2 is within range, so the low PTH is almost certainly a physiological suppression: the calcium is adequate, so the parathyroid glands have turned down their output. His vitamin D at 85 is in the sufficient range and within the optimal window of 75 to 120, and vitamin D enhances calcium absorption from the gut, which further reduces the need for PTH. This is a reassuring pattern, not a concern.\n\nHis vitamin B12 at 380 is within the laboratory range but below the 500 optimal threshold. He is already supplementing B12, which means either the dose, the form, or the absorption route may not be delivering enough. Oral B12 tablets are poorly absorbed compared to sublingual methylcobalamin, which dissolves under the tongue and enters the bloodstream directly. We would recommend switching to sublingual methylcobalamin 1,000 mcg daily. Folate at 10 is within range and above the 8 optimal floor, which is good.\n\nHis total antioxidant activity at 1.79 is marginally above the upper limit of 1.77. This marker measures the overall capacity of the blood to neutralise free radicals, and a marginally elevated level is a positive finding, likely reflecting his fruit and vegetable intake and his supplementation. It does not need action.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 32.8, about 6 years older than a calendar age of 27. His vitamin D at 85 is within the optimal range and his supplementation is working well at the current dose. His iron stores with a ferritin of 114 are healthy, and given that he is not iron deficient, we would recommend stopping the iron supplement he is currently taking, as continued supplementation when stores are adequate can push ferritin above ideal over time.\n\nNow, the symptoms that brought Matthew to this test: near-constant vestibular migraines, fatigue, low energy, low libido, and bloating. The bloods have excluded thyroid disease, significant anaemia, iron deficiency, coeliac disease, liver disease, kidney disease, diabetes, significant inflammation, and cortisol abnormality. The testosterone at 16 and the low-normal hormonal axis may contribute to the fatigue and the low libido, but they are unlikely to explain the full picture, and they are unlikely to be the primary driver of the migraines or the bloating. The most probable drivers of his symptoms are the vestibular migraines themselves, the nortriptyline, the chronic stress, and his below-average food intake. Vestibular migraines are profoundly fatiguing because the brain is expending enormous energy managing a constant mismatch between what the eyes see and what the vestibular system reports. Nortriptyline, while effective for migraine prevention, causes drowsiness, weight gain resistance, constipation and reduced gut motility, which directly explains the bloating and the difficulty gaining weight despite wanting to. Chronic unmanaged stress, which Matthew reports as constant, suppresses testosterone production, disrupts sleep architecture even when sleep duration is adequate, and commonly produces the afternoon energy crash he describes: cortisol should peak on waking and decline steadily, but chronic stress can flatten or shift that curve, leaving energy high at night and low in the afternoon. His sleep quality confirms this: 7 to 8 hours but slow to get going, which suggests the sleep is not restorative. The bloating specifically warrants further investigation beyond blood markers. A food and symptom diary kept for two to three weeks would identify whether specific foods trigger it. If the diary points to a pattern, a hydrogen breath test for lactose intolerance or small intestinal bacterial overgrowth could be discussed with his GP. The nortriptyline slowing gut motility is the most likely single explanation, but it is worth confirming there is nothing layered on top of it.","links":"The thread running through Matthew's results is a body that is fundamentally healthy but under-fuelled, under-trained and over-stressed, with a medication that is helping his migraines but contributing to some of the symptoms he wants to resolve.\n\nThe hormonal picture ties together most directly. A total testosterone of 16 at 27 is not a disease state, but it is below where it should sit, and the LH and FSH in the lower half of their ranges suggest the brain is not driving testicular output as hard as it could. Chronic psychological stress suppresses the hypothalamic-pituitary-gonadal axis, and Matthew reports stress that feels hard to manage constantly. A diet volume of 4 out of 10 in a lean man with a BMI of 22.3 who finds it difficult to gain weight confirms that energy availability is low. When the body does not receive enough fuel, it economises by reducing the functions it can survive without in the short term, and reproductive hormone output is one of the first things it turns down. The low progesterone fits the same pattern. The marginally low neutrophils and the low-end reticulocyte count could also be part of this picture, though both are at such small margins that normal variation is equally likely.\n\nThe cardiovascular findings, ApoB at 0.93, HDL at 1.0 and an ApoB to ApoA1 ratio of 0.77, are not driven by obesity, alcohol or metabolic syndrome. His triglycerides are healthy, his blood sugar is excellent, and his BMI is lean. The most likely explanation is dietary saturated fat intake combined with low aerobic exercise volume. HDL responds powerfully to regular aerobic exercise, and at one cardio session a week with moderate steps, there is significant room to move that number. The ApoB is only marginally above target and would likely respond to the combination of more soluble fibre, more omega-3 from oily fish, and a modest reduction in saturated fat.\n\nThe red cell indices, low MCV with raised RDW and adequate iron, stand somewhat apart from the rest of the picture. They raise the possibility of an alpha or beta thalassaemia trait, which is inherited and has nothing to do with diet, stress or medication. A haemoglobin electrophoresis would settle this in a single test, and if confirmed, it simply becomes a permanent note on his record with no treatment needed.\n\nThe symptoms that are not explained by the bloods, the migraines, the fatigue, the bloating, and the afternoon crash, are most likely driven by the vestibular migraines themselves, the anticholinergic effects of nortriptyline on gut motility and energy, the chronic stress, and the energy deficit from under-eating. These are not blood test diagnoses; they are clinical and lifestyle explanations that the blood results support by exclusion. The fact that thyroid, anaemia, coeliac, inflammation, cortisol, liver and kidney are all clear is genuinely useful because it narrows the field to what is most actionable.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, or leftover meat. Anchor: protein goes on the plate before anything else. Why: at a diet volume of 4 out of 10 and a BMI of 22.3, the single biggest lever in this report is eating more, and protein is the priority because it supports testosterone production, muscle recovery from training, and immune cell turnover behind the low-end neutrophils of 1.93.\nAdd a mid-morning and mid-afternoon snack, even a small one: a handful of nuts with fruit, a protein bar, toast with peanut butter. Anchor: set a phone alarm for 10:30 and 15:00 until it becomes habit. Why: the afternoon energy crash he describes at 3pm lines up with a fuel gap, and a 27-year-old male at 76 kg who trains twice a week needs roughly 2,400 to 2,600 calories a day to maintain weight. At volume 4 out of 10 he is likely falling short by several hundred calories, which suppresses testosterone and recovery.\nEat oily fish twice a week: salmon, mackerel, sardines or trout. Anchor: pick two fixed evenings. Why: omega-3 raises HDL, lowers ApoB-containing particles, and has anti-inflammatory effects relevant to migraine frequency.\nAdd a source of soluble fibre daily: oats at breakfast, beans or lentils with lunch or dinner, or a handful of almonds. Anchor: swap one refined carbohydrate portion per day for one of these. Why: soluble fibre binds cholesterol in the gut and lowers ApoB, and it also feeds beneficial gut bacteria, which may help the bloating.\nAdd one extra cardio session per week, starting with a 30-minute brisk walk. Anchor: straight after the working day on a fixed day. Why: HDL at 1.0 is below optimal, and regular aerobic exercise is the most reliable way to raise it. A second resistance session would also help testosterone.\nGet outside within 30 minutes of waking for at least 10 minutes of daylight. Anchor: before the first cup of tea. Why: morning light resets the circadian cortisol rhythm, which is the mechanism behind the slow-to-get-going mornings and the afternoon crash. It is free and it works.\nSet a caffeine cut-off at 1pm. Anchor: switch to decaf or herbal tea after lunch. Why: caffeine after early afternoon fragments sleep architecture even when sleep duration looks adequate, and poor sleep quality drives fatigue, stress sensitivity and hormonal suppression.\nBuild in one daily stress-management practice: 10 minutes of box breathing, a guided meditation app, or a walk without a phone. Anchor: attach it to an existing daily event such as arriving home or finishing dinner. Why: chronic unmanaged stress suppresses the hormonal axis driving his testosterone of 16, and no supplement will override that signal.","flags":"ApoB 0.93 g/L (above 0.9 target, above 0.8 optimal), HDL 1.0 mmol/L (below 1.04 desirable threshold, below 1.4 optimal), ApoB/A1 ratio 0.77 (above 0.7 lower-risk threshold). These three findings form one cardiovascular story. Triglycerides, Lp(a), blood sugar and hs-CRP are all favourable, so the drivers are low HDL and mildly elevated ApoB, likely diet and exercise-responsive. Cardiovascular Risk Score 35/100, within acceptable range but above 20 ideal.\nTestosterone 16 nmol/L, within laboratory range (8.4 to 28.7) but below optimal (18 to 30) for a 27-year-old male. LH 3.19 and FSH 2.22 are in the lower half of range, consistent with a functional suppression of the hypothalamic-pituitary-gonadal axis rather than primary testicular failure. Likely driven by chronic stress, low energy availability and low training volume. Connects to reported low libido and fatigue.\nProgesterone 0.75 nmol/L, below range (0.89 to 3.88). In men, progesterone supports mood and sleep and serves as a precursor to other steroid hormones. Below range at this margin, consistent with the same functional hormonal suppression pattern.\nMCV 79.4 fL (below 83), RDW 17.6% (above 15), MCHC 361 g/L (above 345), with adequate iron stores (ferritin 114, transferrin saturation 23.5%). This combination, low MCV with raised RDW and no iron deficiency, raises the possibility of an alpha or beta thalassaemia trait. Haemoglobin electrophoresis recommended. Haemoglobin and red cell count are both healthy.\nNeutrophils 1.93 x10^9/L, marginally below range (2.0 to 7.0). Total WBC 4.31 is just above the lower limit. At this margin, most likely benign variation or a reflection of low energy availability. No clinical concern in isolation.\nReticulocytes absolute 46 x10^9/L, marginally below range (50 to 100). Reticulocyte percentage 0.91% is within range. Haemoglobin is healthy, so the marrow is not being asked to produce more. No action needed unless the MCV investigation reveals a haemoglobinopathy.\nHOMA-IR 1.59, marginally above the 1.5 upper limit but below the 1.9 threshold for early insulin resistance. Fasting glucose 4.9, HbA1c 33 and fasting insulin 7.3 are all within ideal ranges. Not clinically significant at this margin.\nMPV 11.1 fL, above range (7.1 to 10.1). Platelet count 192 is healthy, hs-CRP 0.8 is optimal. Most likely a normal variant.\nBicarbonate 31.7 mmol/L, marginally above range (20 to 31). No clinical significance at this margin.\nPTH 0.7 pmol/L, below range (0.98 to 4.73). Corrected calcium 2.36 and vitamin D 85 are both healthy. This is physiological suppression: calcium is adequate, so the parathyroid glands have turned down their output. Not a concern.\nVitamin B12 380 pg/mL, within laboratory range (193 to 982) but below optimal (500). Already supplementing; recommend switching to sublingual methylcobalamin.\nTotal Antioxidant Activity 1.79 mmol/L, marginally above range (1.3 to 1.77). Likely reflects good dietary antioxidant intake and supplementation. Positive finding.\nReassuring negatives: Thyroid function normal with negative antibodies. Liver function excellent across all markers including FIB-4 0.61. Kidney function excellent with combined eGFR 104. Blood sugar excellent with HbA1c 33, glucose 4.9, insulin 7.3. hs-CRP 0.8 and ESR 4, no systemic inflammation. Cortisol 352, normal morning level. Coeliac screen negative. All immunoglobulins within range. IgE 24.6, no allergic signal. Rheumatoid factor negative. PSA 0.29 with free ratio 0.517, prostate health excellent. CA19-9 and CEA within range. Lp(a) below 25, inherited cardiovascular risk factor excluded. Urinalysis completely clear.","recommendations":"Discuss the testosterone level of 16 nmol/L with the GP, particularly if fatigue and low libido persist after three months of the lifestyle changes. A repeat fasting morning testosterone with LH and FSH would confirm whether this is a persistent finding or whether it improves with more food, less stress and more exercise.\nRequest a haemoglobin electrophoresis to investigate the low MCV of 79.4 with raised RDW of 17.6 and adequate iron stores. This will confirm or rule out an alpha or beta thalassaemia trait. If confirmed, it needs no treatment but should be recorded permanently.\nDiscuss the bloating and digestive discomfort with the GP if a two-to-three-week food and symptom diary does not identify the trigger. Nortriptyline slows gut motility and is the most likely explanation, but a hydrogen breath test for lactose intolerance or small intestinal bacterial overgrowth may be worthwhile if symptoms persist.\nDiscuss the migraine management with the prescriber. The nortriptyline is helping but the migraines remain disabling, and the medication's anticholinergic effects are contributing to the bloating, low energy and possible weight gain resistance. There may be scope to add or switch to a medication with fewer gastrointestinal side effects.\nShare the lipid findings with the GP: ApoB 0.93, HDL 1.0, ApoB/A1 ratio 0.77. These are mildly unfavourable and diet-and-exercise-responsive at 27, but the GP should have them on record. No medication is needed at this stage.\nStop the iron supplement. Ferritin is 114 and transferrin saturation is 23.5%; continued supplementation when stores are adequate can push ferritin above ideal over time.\nAim for approximately 2,400 to 2,600 calories per day and at least 100 to 120 grams of protein per day (1.3 to 1.6 g per kg at 76 kg with moderate training). Retest in six months, repeating the full blood count with reticulocytes, testosterone, LH, FSH, lipid panel with ApoB, and vitamin B12.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily with a meal that contains fat. Continue his current supplementation. His vitamin D at 85 is within the optimal range of 75 to 120, so the current dose is maintaining good levels. Always take with vitamin K2 (see below).\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. K2 directs calcium into bones and teeth rather than into artery walls, and it should always accompany vitamin D supplementation.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. His B12 at 380 is below the 500 optimal threshold despite supplementation, so the form and route matter. Sublingual methylcobalamin bypasses gut absorption and delivers the active form directly.\nMagnesium glycinate, 300 to 400 mg before bed. Magnesium supports sleep quality, stress resilience, and has evidence for migraine prevention, which is directly relevant to his vestibular migraines. His magnesium at 0.86 is within range but at the lower end of the optimal band.\nOmega-3 fish oil, 2 g of combined EPA and DHA daily with food. This will help raise his HDL from 1.0, lower his ApoB-containing particles, and omega-3 has anti-inflammatory properties relevant to migraine.\nDO NOT continue taking the iron supplement. His ferritin at 114 is healthy, his serum iron is within range, and his transferrin saturation at 23.5% does not indicate deficiency. Continued iron supplementation when stores are adequate can cause ferritin to rise above ideal and may contribute to gastrointestinal discomfort and constipation, which is the opposite of what he needs given his bloating.\nThe most important changes from this report are not supplements. They are eating more food, particularly protein, adding aerobic exercise to raise HDL, getting morning daylight to reset the cortisol rhythm, and finding a sustainable way to manage the chronic stress that is suppressing his hormonal axis.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 77; held to 74 by a system rated \"Needs attention\". Weakest systems: vitamins & nutrients 38%, hematology 39%, lipids & cardiovascular 68%. Biggest drags: Bicarbonate, Apolipoprotein B, HDL Cholesterol, MCV.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"32.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5125","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"27","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4219","units":"years","description":"PhenoAge is calculated from your measured results. It sits outside the ideal range. It is being driven by RDW, which sits outside the ideal range.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term, so it measures the risk being built rather than the ten-year probability of an event. Matthew's score of 35 is within the acceptable range of 40 or below but above the ideal ceiling of 20. The two inputs driving the score are his ApoB at 0.93 and his HDL at 1.0. At 27, his absolute ten-year cardiovascular risk is very low, but the score shows that modifiable risk factors are present, and the gap between his age and his score is the window for acting through diet and exercise.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC" y","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4900","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including antibody production and viral defence. Matthew's lymphocytes at 1.94 are within the optimal range.","low_causes":"Viral infection, immunodeficiency, medications, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3742","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf bacteria and debris and play a role in tissue repair and inflammation. Matthew's monocytes at 0.33 are within the optimal range.","low_causes":"Bone marrow suppression, medications","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3583","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic reactions and parasitic infections. Matthew's eosinophils at 0.09 are within the optimal range and very low, consistent with no allergic or parasitic process.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infection, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5556","units":"x10^9/L","description":"Basophils are the least common white blood cells, involved in allergic and inflammatory responses. Matthew's basophils at 0.02 are within the optimal range.","low_causes":"Acute allergic reaction, steroid use","high_causes":"Allergic reaction, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"23.47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3818","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3946","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying protein transferrin is actually loaded with iron. Matthew's saturation at 23.47% is within the laboratory range but just below the 25% optimal floor. This is a minor shortfall that does not indicate iron deficiency (his ferritin and serum iron are healthy) but suggests that on the day of the test, iron availability in the bloodstream was at the lower end of ideal.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron overload, liver disease","padding":"1","one_sided":"0","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"13.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3748","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455","upper_optimal_position":"0.5138","units":"umol/l","description":"Serum iron is the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals. Matthew's serum iron at 13.2 is within the laboratory range but slightly below the 14 optimal floor. This does not indicate deficiency, as his ferritin stores are healthy at 114, but it is consistent with fasting and morning sampling when iron can be at its lowest.","low_causes":"Iron deficiency, chronic disease, inflammation, poor absorption","high_causes":"Haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.2","upper_optimal":"3.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6111","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream. The body produces more transferrin when iron stores are low and less when they are adequate. Matthew's transferrin at 2.24 is within the optimal range. The fact that it is at the lower end is consistent with his adequate ferritin stores: the body does not need to produce extra transport capacity.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"52.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4219","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6035","units":"umol/l","description":"TIBC measures the total capacity of the blood to bind and transport iron. It reflects transferrin availability. Matthew's TIBC at 52.5 is within the optimal range, consistent with healthy iron transport and adequate stores.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"114","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4356","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. Matthew's ferritin at 114 is within the optimal range of 50 to 200 for a male, indicating healthy iron stores. This is an important finding because it rules out iron deficiency as the cause of his low MCV and raised RDW, pointing instead toward a possible thalassaemia trait. It also means he should stop his current iron supplementation, as continued supplementation when stores are adequate can push ferritin above the ideal range over time.","low_causes":"Iron deficiency, blood loss, poor absorption, vegetarian or vegan diet","high_causes":"Haemochromatosis, inflammation, liver disease, excessive supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"16","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4532","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, energy, mood, libido and reproductive function. Matthew's testosterone at 16 nmol/L is within the laboratory range of 8.4 to 28.7 but below the 18 optimal threshold for a 27-year-old. This connects directly to his reported low libido and fatigue. The most likely explanation is a functional suppression driven by chronic stress, low energy availability from eating below his needs, and low training volume, rather than a primary testicular problem. His LH and FSH are in the lower half of their ranges, consistent with the brain not sending the strongest signal to the testes.","low_causes":"Chronic stress, low energy availability, obesity, ageing, hypogonadism, medications, sleep deprivation","high_causes":"Exogenous testosterone, adrenal tumours","padding":"1","one_sided":"0","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.364","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4256","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.225","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3663","upper_optimal_position":"0.5604","units":"nmol/l","description":"Free testosterone is the fraction of testosterone not bound to proteins, making it directly available for the body to use. It is calculated from total testosterone, SHBG and albumin. Matthew's free testosterone at 0.364 is within the optimal range. His SHBG at 25.1 is at the lower end of range, which means a higher proportion of his total testosterone is biologically active, partially compensating for the below-optimal total.","low_causes":"Low total testosterone, high SHBG, ageing","high_causes":"Low SHBG, exogenous testosterone","padding":"1","one_sided":"0","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"25.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3494","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3838","upper_optimal_position":"0.6026","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, making them inactive. Matthew's SHBG at 25.1 is at the lower end of the optimal range. A low SHBG increases the proportion of free and bioavailable testosterone, which is why his bioavailable testosterone is at the top of range despite a below-optimal total. Low SHBG can be associated with insulin resistance and metabolic syndrome, but in Matthew's case, with excellent blood sugar and a lean BMI, this is likely his natural set point.","low_causes":"Insulin resistance, obesity, hypothyroidism, high-dose androgens","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen excess","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"63.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"30","upper_normal":"150","lowe o cortisol and other hormones. Matthew's progesterone at 0.75 is below the lower limit of 0.89. In the context of a below-optimal testosterone and the same low-normal LH and FSH, this is consistent with a functional suppression of the entire steroid hormone pathway, most likely driven by chronic stress and low energy availability. It is a minor finding in men and does not require standalone treatment.","low_causes":"Chronic stress, low energy availability, low gonadotropin drive","high_causes":"Adrenal hyperplasia, medications, supplementation","padding":"1","one_sided":"0","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3694","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mIU/ml","description":"LH is a pituitary hormone that stimulates the testes to produce testosterone. Matthew's LH at 3.19 is within the optimal range, but it is sitting in the lower half, which suggests the brain is not driving testosterone production as hard as it could. This is consistent with functional suppression from stress and low energy availability, and it argues against primary testicular failure as the cause of the below-optimal testosterone.","low_causes":"Pituitary disease, severe stress, low energy availability, medications, obesity","high_causes":"Primary testicular failure, ageing, menopause (women)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"2.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3577","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"1.5","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","low le morning cortisol can appear normal because the test captures one moment rather than the 24-hour rhythm. Chronic stress more commonly flattens the cortisol curve, resulting in normal or even low morning levels but elevated evening levels, which a single blood test cannot detect.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, medications (prednisolone)","padding":"1","one_sided":"0","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4437","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2.0","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3453","upper_optimal_position":"0.5703","units":"umol/L","description":"DHEA-S is a steroid hormone produced by the adrenal glands. It is a precursor to testosterone and oestrogen and is a marker of adrenal function. Matthew's DHEA-S at 4.3 umol/L (approximately 1,585 ug/dL) is within the optimal range for a 27-year-old male, confirming healthy adrenal function.","low_causes":"Adrenal insufficiency, ageing, chronic stress","high_causes":"Adrenal tumour, PCOS (in women), congenital adrenal hyperplasia","padding":"1","one_sided":"0","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"9.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6810","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone includes both free testosterone and the fraction loosely bound to albumin, representing the total testosterone available for biological activity. Matthew's bioavailable testosterone aning there is no autoimmune thyroid disease. A TSH in this range with excellent free hormones and negative antibodies does not indicate thyroid dysfunction. It may reflect his stress levels, recent illness, or simply his natural set point. It does not need treatment but is worth monitoring at the next test.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, autoimmune thyroid disease, iodine deficiency, recovery from illness, stress","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"18.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5268","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5714","units":"pmol/l","description":"Free T4, or free thyroxine, is the thyroid's main output hormone. It circulates in the blood and is converted into the active form, T3, in the tissues. Matthew's FT4 at 18.1 is within the optimal range of 14 to 20, confirming the thyroid is producing an adequate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, medications","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5704","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy, body temperature and brain function. It is converted from T4 in the tissues. Matthew's FT3 at 5   const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });

    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',

  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
