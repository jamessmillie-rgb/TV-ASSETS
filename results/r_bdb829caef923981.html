<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Iqwinder Kaur","dob":"08/08/1984","report_date":"2026-10-05","summary":"Iqwinder is a 42-year-old female presenting with a BMI of 35.1, following a vegetarian diet that includes eggs and dairy, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are larger than average (volume 7 out of 10). She does no structured exercise, no cardio and no resistance training, and walks between 2,000 and 5,000 steps a day. She sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress feels hard to manage some weeks. She drinks no alcohol. She takes no medications and reports no diagnosed conditions. This is her first blood test. She reports low energy and fatigue that has persisted for over a year. Her goals are to lose body fat, improve her energy levels, and improve her long-term health and longevity. She has described her situation honestly and clearly: she knows her lifestyle is sedentary, she wants to change it, and she feels her quality of life is suffering from low energy and low mood during the day.\n\nThis report contains several findings that need to go to her GP, and together they tell a coherent story. The most important is a clear iron deficiency anaemia. Her haemoglobin is 110, below the female lower limit of 120, meaning she does not have enough haemoglobin to carry oxygen efficiently. Her MCV, which measures the size of each red blood cell, is 66.8, well below the lower limit of 83, and her MCH, the amount of haemoglobin packed into each cell, is 22.3 against a lower limit of 27. These small, pale red blood cells are the hallmark of iron deficiency. Her ferritin, the body's iron store, is just 11, technically inside the laboratory range of 10 to 291 but functionally depleted; optimal ferritin for a menstruating woman is above 40. Her transferrin, the protein the body makes to hunt for iron, is 3.95, above the upper limit of 3.8, and her total iron binding capacity is 92.5 against an upper limit of 76.1, both of which confirm that the body is desperately trying to scavenge more iron from every meal. Her transferrin saturation, which shows how much of that carrying capacity is actually loaded with iron, is just 10.08 percent against a lower limit of 18 and an optimal of 25 percent. Her RDW, which measures variation in red blood cell size, is 17.1 percent against an upper limit of 14, and this is because the bone marrow is producing a mix of old, normal-sized cells and new, smaller iron-starved cells. Her red blood cell count is actually elevated at 4.93 against an upper limit of 4.8, which is the body's compensatory response: when each cell carries less oxygen, the marrow makes more cells to try to keep up. Her Mentzer index, calculated by dividing the MCV by the red cell count, is 13.5; a value below 13 would raise suspicion of thalassaemia trait, which is more common in people of South Asian heritage, and at 13.5 this sits right at the boundary. The iron studies strongly favour iron deficiency as the primary driver, but given her ethnicity the GP should consider checking a haemoglobin electrophoresis to rule out a coexisting thalassaemia trait, because the two can overlap and the treatment is different.\n\nThis iron deficiency is almost certainly the main driver of her fatigue. Iron is needed not just for haemoglobin but for energy production inside every cell in the body, and when stores are this low the symptoms arrive long before the blood count falls: brain fog, afternoon crashes, feeling slow to get going in the morning, and low mood are all recognised consequences of iron depletion. On a vegetarian diet, iron comes in its non-haem form, which is absorbed at roughly 2 to 5 percent compared with 15 to 35 percent for haem iron from meat and fish. Combined with regular menstrual losses and a diet with only 0 to 1 portions of vegetables and fruit a day, the deficit has built up over time. This is treatable, and she should feel a meaningful difference within 8 to 12 weeks of starting supplementation, though it will take 3 to 6 months to fully rebuild her stores.\n\nHer vitamin B12 is 192, just below the lower limit of 193 and well below the optimal threshold of 500. B12 is found almost exclusively in animal products, and while a vegetarian diet that includes eggs and dairy can provide some, it often falls short. B12 is essential for nerve function, energy metabolism, and the production of healthy red blood cells, and deficiency can cause fatigue, low mood, brain fog, and tingling in the hands and feet. Her folate result came back as insufficient, which means the laboratory was unable to produce a reliable number. Folate works alongside B12 in cell division and red blood cell production, and with only 0 to 1 portions of vegetables and fruit a day, a low result would not be surprising. The GP should repeat the folate on a fresh sample. Between the iron deficiency and the B12 deficiency, two of the three nutrients the body needs to build healthy red blood cells are depleted, and this combination is more than enough to explain her fatigue.\n\nHer vitamin D is 18, which falls into the deficient category (below 30). Vitamin D is important for bone health, immune function, mood regulation, and muscle strength. At a BMI of 35, vitamin D is sequestered in fat tissue, meaning the body needs a higher dose to achieve adequate blood levels. Deficiency contributes to fatigue, low mood, and muscle weakness, and it is especially common in people with darker skin living in the UK because melanin reduces the skin's ability to synthesise vitamin D from sunlight. This needs correcting with a loading dose followed by maintenance, and at her BMI the dose needs to be at the higher end.\n\nHer HbA1c is 43 mmol/mol (6.1 percent), which places her in the pre-diabetic range. HbA1c measures the average blood sugar over the previous two to three months by looking at how much glucose has attached itself to haemoglobin. A normal HbA1c is below 42, pre-diabetes is 42 to 47, and diabetes is 48 or above. However, there is an important caveat here. Iron deficiency anaemia artificially raises HbA1c because when the body has fewer healthy red blood cells, those cells live longer in the circulation and accumulate more glucose on their surface, inflating the reading. Her fasting glucose of 4.2 is excellent, sitting well within the ideal range of 4.0 to 5.4. Her fasting insulin of 3.99 is low and healthy, and her HOMA-IR, which combines glucose and insulin to measure insulin resistance, is 0.74, which is optimal. Her C-peptide, a molecule released alongside insulin that reflects how much insulin the pancreas is producing, came back at 0.97 against a lower limit of 1.1; the laboratory has noted that samples not separated within four hours can see C-peptide fall to 44 percent of baseline, so this low result may be a sample handling artefact rather than a true finding. Taking these together, her actual blood sugar control appears to be very good, and the raised HbA1c is most likely being driven upwards by the iron deficiency. Once her iron is corrected and the anaemia resolves, the HbA1c should fall. The GP should repeat the HbA1c in four to six months after iron replacement to get a true reading.\n\nHer CRP, a marker of inflammation in the body, is 10 against an upper limit of 5 and well above the optimal threshold of 1.0. CRP can be elevated by infection, obesity, metabolic stress, or acute illness, and at a BMI of 35 some elevation is expected because fat tissue is metabolically active and produces inflammatory signals. However, 10 is higher than BMI alone typically produces, and it is worth noting that her urine culture grew a moderate growth of Group B Streptococcus. There were no white blood cells, no nitrites, and no red blood cells in the urine, which means this is most likely sample contamination rather than a urinary tract infection, and in the absence of urinary symptoms it does not need treatment. The CRP may reflect a low-grade inflammatory process related to her weight and metabolic state, or she may have had a minor illness around the time of the test. The GP should repeat the CRP in three months to see whether it settles. Her ESR, another inflammation marker that measures how quickly red blood cells settle in a tube, is 28 against an upper limit of 12. The ESR is influenced by anaemia itself (smaller, lighter cells settle differently), by inflammation, and by elevated globulin, so in the context of iron deficiency anaemia and a raised CRP, the elevated ESR is consistent rather than introducing a new concern.\n\nHer bicarbonate is 16.3, below the lower limit of 20, which indicates a mild metabolic acidosis. Bicarbonate is a buffer the body uses to maintain the correct pH in the blood. A low level can result from the kidneys compensating for metabolic stress, from ketosis, from chronic kidney disease, or from gastrointestinal bicarbonate loss. Her urea is 3.1, marginally below the lower limit of 3.2, which on a vegetarian diet with lower protein intake is unremarkable. Her cystatin C, a protein filtered by the kidneys that gives a more accurate measure of kidney function than creatinine alone (especially at higher body weight), is 1.16 against an upper limit of 1.1. The eGFR calculated from cystatin C is 84, below the optimal threshold of 90 but above 60. At 42 with no kidney disease, diabetes, or hypertension, this is mildly below where it should be. It may reflect the acute inflammatory state (CRP of 10 can transiently raise cystatin C), dehydration, or the early metabolic effects of carrying excess weight. The creatinine-based eGFR was reported as above 90, and the combined creatinine-cystatin C eGFR is 84. This is not alarming, but the GP should be aware and should repeat the cystatin C when the CRP has settled to get a true baseline. The low bicarbonate paired with the mildly reduced kidney function and the raised CRP is a pattern the GP should see together.\n\nHer lymphocyte count is 3.02, marginally above the upper limit of 3.0. At this margin, this is not clinically significant and may reflect the body's response to the low-grade inflammation or a minor viral exposure around the time of the test.\n\nTurning to the positives, and there are genuine ones here. Her thyroid is working well. TSH, the hormone the brain sends to tell the thyroid how hard to work, is 1.79, sitting comfortably within the optimal range of 1.0 to 2.5. Free T4, the main thyroid hormone, is 15.7, within the optimal range of 14 to 20. Free T3, the active form the body actually uses, is 4.8, within the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. The FT3 to FT4 ratio is 0.306, within the optimal range, confirming good conversion. Her thyroid is not the cause of her fatigue. Her liver is working adequately. ALT is 39 and AST is 41, both within range, and the FIB-4 score of 0.76 and APRI of 0.282 both indicate no liver scarring. Her GGT is 47, above the female upper limit of 38, which suggests mild metabolic strain on the liver, most likely related to her weight and the inflammatory load rather than alcohol, which she does not drink. Her bilirubin, albumin, and total protein are all within range. Her ALP at 114 is within the laboratory range of 46 to 116. Her pancreatic enzymes, amylase and lipase, are both within range. Her HOMA-IR of 0.74 is an impressive finding at a BMI of 35 and means that despite carrying significant excess weight, her body is still highly sensitive to insulin. This is a genuine metabolic strength and represents a window of opportunity: acting now, before insulin resistance develops, means that weight loss and dietary change will be substantially easier and more effective than if she waits. Her hormones are reassuring for a 42-year-old woman with a regular cycle. Her progesterone of 19.63 falls within the luteal phase range of 10.62 to 81.28, and her LH of 0.8 and FSH of 1.95 are consistent with a luteal phase sample, confirming she is not perimenopausal. Her testosterone, DHEA-S, SHBG, and free androgen index are all within range. Her oestradiol result came back as insufficient, so the laboratory was unable to produce a number; this is not unusual with some assays and is not a concern in the context of a regular cycle and normal LH, FSH, and progesterone. Her cortisol at 280 is within the morning reference range and does not suggest adrenal dysfunction. Her prolactin at 162 is within range. Her coeliac screen, tissue transglutaminase IgA, is negative, ruling out coeliac disease. Her immunoglobulins IgG, IgM, IgA, and IgE are all within range, and her rheumatoid factor is within range. Her tumour markers CA125, CA15-3, CA19-9, and CEA are all within range and reassuring. Her calcium, corrected calcium, phosphate, magnesium, and parathyroid hormone are all within range. Her creatine kinase is within range. Her urine is clean: no protein, no glucose, no ketones, no blood, no white cells, no nitrites. Her lipid profile shows elevated total cholesterol at 6.5, an LDL of 4.2 against a target below 3.0, an ApoB of 1.37 against a target below 0.9, non-HDL cholesterol of 4.7 against a target below 4.0, and an ApoB to ApoA1 ratio of 0.85 against a target below 0.6. Her HDL at 1.8 is excellent and genuinely protective, her ApoA1 at 1.61 is above the desirable level, her triglycerides at 1.24 are within range, her VLDL at 0.56 is within range, and her TC to HDL ratio at 3.61 is within range. The atherogenic index of plasma is negative at minus 0.162, which is optimal and reflects the favourable triglyceride to HDL relationship. Her LDL to HDL ratio is 2.33, within the optimal range. The concern is the ApoB. ApoB is a protein that sits on the surface of every LDL particle, and each particle carries one ApoB molecule, making it the most accurate count of the number of potentially harmful cholesterol particles in the blood. At 1.37 it is well above the 0.9 target and in the high category. Her Lp(a) result came back as insufficient, so the laboratory could not produce a number; Lp(a) is an inherited cholesterol particle that contributes to cardiovascular risk and cannot be changed by lifestyle, and it would be worth requesting this on a repeat sample because it determines how much of her LDL burden is modifiable. The lipid picture is one where the HDL and triglyceride side is excellent but the LDL particle count is too high, and this is the pattern most responsive to dietary change: increasing soluble fibre, reducing saturated fat from dairy and processed food, and adding plant sterols.\n\nHer PhenoAge is 41.9, essentially matching her calendar age of 42, which means that despite the anaemia, the inflammation, and the elevated cholesterol, her overall biological ageing profile is on track. The main markers pulling it in the right direction are her albumin, glucose, and lymphocyte count, while the CRP and the white cell count are the ones that would bring it down further if improved.\n\nHer total antioxidant activity result came back as insufficient, meaning the laboratory could not produce a number, and her serum folate also came back as insufficient. Neither can be interpreted and both should be repeated.\n\nIn summary, the story of this report is clear. Iqwinder has a significant iron deficiency anaemia and a B12 deficiency that together explain her fatigue, her afternoon crashes, and her low mood. Her vitamin D is deficient. Her HbA1c appears pre-diabetic but is almost certainly inflated by the anaemia, and her actual glucose control is excellent. Her CRP is elevated, partly from her weight and possibly from an acute process around the time of the test. Her cystatin C and kidney function are mildly below optimal and should be rechecked when the inflammation has settled. Her cholesterol and ApoB need attention through diet. Her thyroid, hormones, liver structure, coeliac screen, and tumour markers are all reassuring. The path forward is to correct the deficiencies, improve the diet substantially, begin moving, and retest in four to six months to see the true HbA1c and CRP once the anaemia has resolved.","links":"The central thread running through this report is iron deficiency. Iron is depleted (ferritin 11, transferrin saturation 10 percent), the bone marrow is producing small, pale red blood cells as a result (MCV 66.8, MCH 22.3, haemoglobin 110), and the body is compensating by making more cells (red cell count 4.93) and building more transport protein to hunt for iron (transferrin 3.95, iron binding capacity 92.5). The RDW of 17.1 confirms that red cell production is disordered. On a vegetarian diet with very low vegetable and fruit intake and regular menstrual losses, this deficiency has built up gradually, and it is the most likely explanation for the fatigue, the afternoon energy crashes, the low mood, and the difficulty getting going in the morning that Iqwinder has experienced for over a year.\n\nThe iron deficiency connects directly to the HbA1c of 43. When red blood cells are iron-starved, they survive longer in the circulation than normal cells, and the longer a red cell circulates, the more glucose attaches to its haemoglobin. This inflates the HbA1c reading. The fact that her fasting glucose is an excellent 4.2, her fasting insulin is a healthy 3.99, and her HOMA-IR is an optimal 0.74 all point strongly towards the HbA1c being a false positive for pre-diabetes. This is a well-recognised phenomenon in iron deficiency anaemia and is the reason the GP should not act on the HbA1c alone but should repeat it after iron correction. The C-peptide of 0.97, marginally below range, is most likely a sample handling artefact given the laboratory's own note about degradation in unseparated samples.\n\nThe CRP of 10 and ESR of 28 form a second thread. At a BMI of 35, chronic low-grade inflammation from metabolically active fat tissue is expected, but a CRP of 10 is higher than weight alone usually produces. The ESR is additionally influenced by the anaemia itself. The urine culture grew Group B Streptococcus but with no white cells, no nitrites, and no symptoms, this is most likely contamination rather than infection, so it does not convincingly explain the CRP. The CRP may have been pushed up by a minor illness around the time of the blood draw, or it may reflect the combined metabolic burden of obesity, iron deficiency, and a diet low in protective plant foods. A repeat in three months will clarify whether this is transient or chronic. The mildly elevated cystatin C of 1.16 and the eGFR of 84 may be partly influenced by this inflammatory state, as CRP can transiently raise cystatin C; repeating both together will give a clearer picture.\n\nThe vitamin B12 deficiency at 192 is a separate finding from the iron deficiency but compounds it. Both nutrients are needed for healthy red blood cell production, and both are harder to obtain on a vegetarian diet. B12 deficiency causes its own fatigue, mood changes, and neurological symptoms that overlap with iron deficiency, so correcting one without the other will produce an incomplete recovery. The folate result was insufficient, meaning the laboratory could not report a value, and since folate is the third nutrient in this triad, it should be repeated.\n\nThe lipid findings, with an ApoB of 1.37, LDL of 4.2, and non-HDL of 4.7, are driven by dietary saturated fat (likely from dairy and processed vegetarian food) and by the metabolic environment of excess weight. They are partially offset by an excellent HDL of 1.8 and healthy triglycerides, which reflect the absence of alcohol and the absence of insulin resistance. The Lp(a), which would reveal how much of the LDL burden is inherited and unchangeable, could not be measured and should be repeated. Without it, the working assumption is that the elevated ApoB is modifiable through diet and, if needed, medication.\n\nThe vitamin D deficiency at 18 is a standalone finding but fits the broader picture. Darker skin pigmentation, a BMI of 35 (fat tissue sequesters vitamin D), a sedentary indoor lifestyle, and the UK climate combine to produce significant deficiency. Low vitamin D contributes to fatigue, low mood, muscle weakness, and impaired immune function, all of which overlap with her reported symptoms.","lifestyle":"Add one palm-sized portion of protein to every meal: eggs, paneer, Greek yoghurt, lentils, chickpeas, tofu, or beans. Anchor: before anything else goes on the plate. Why: protein supports iron absorption when paired with vitamin C, helps preserve muscle during weight loss, and keeps you fuller for longer, reducing the sugary snacks that are currently part of most days.\nIncrease vegetables and fruit from your current 0 to 1 portions a day to at least 4 to 5. Start by adding one portion to lunch and one to dinner this week, then build. Choose dark leafy greens (spinach, kale, broccoli) and coloured vegetables. Anchor: every meal has at least one portion of colour on the plate. Why: vegetables provide folate (which the lab could not measure), iron (pair with lemon or peppers for vitamin C to boost absorption), fibre to lower your ApoB, and antioxidants to bring your CRP down.\nReplace sugary snacks with a small handful of nuts, seeds, or fruit with yoghurt. Anchor: when you reach for something sweet between meals, swap it. Why: reducing added sugar lowers triglycerides, reduces inflammatory load, and helps create the calorie deficit you need for fat loss without leaving you hungry.\nSwap white rice, white bread, and refined carbohydrates for wholegrain versions: brown rice, wholemeal chapatti, oats, and sweet potato. Start with one meal a day. Why: soluble fibre from wholegrains directly lowers LDL cholesterol and ApoB, and slows glucose absorption to keep your afternoon energy stable instead of crashing.\nWalk for 15 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose spike from that meal and is the single easiest way to start moving from 2,000 to 5,000 steps up towards 7,500. Your HOMA-IR is excellent at 0.74, and daily walking will protect that.\nAdd one 20-minute walk on a separate occasion each day, building to a total of 7,500 steps. Anchor: morning daylight walk within an hour of waking. Why: morning light resets your circadian rhythm, which directly addresses the slow-to-get-going mornings and the afternoon crash, and the walking builds the baseline fitness that will let you add structured exercise later.\nAim for a calorie intake of approximately 1,550 to 1,700 kcal per day, with at least 104 g of protein. Your estimated maintenance calories are around 2,050 (BMR of approximately 1,580 multiplied by a sedentary activity factor of 1.3). A deficit of 400 to 500 kcal per day will produce a steady fat loss of roughly 0.4 to 0.5 kg per week, targeting a body weight of 68 to 72 kg over 12 to 18 months. Track portions for two weeks to calibrate, then rely on the plate structure: half vegetables, a quarter protein, a quarter wholegrain carbohydrate.\nSet a fixed wake time seven days a week and get outside within an hour of waking. Cut caffeine after 1pm. Keep the bedroom cool and dark. Why: your sleep quantity is adequate at 7 to 8 hours, but the quality (slow to get going, afternoon crash) suggests the circadian rhythm is not well anchored. Morning light is the strongest signal to fix this.","flags":"Iron deficiency anaemia: haemoglobin 110 (lower limit 120), MCV 66.8 (lower limit 83), MCH 22.3 (lower limit 27), ferritin 11 (optimal above 40), transferrin saturation 10.08% (lower limit 18%), transferrin 3.95 (upper limit 3.8), TIBC 92.5 (upper limit 76.1), RDW 17.1% (upper limit 14%), red cell count 4.93 (upper limit 4.8). Classic microcytic iron deficiency picture. Mentzer index 13.5 sits at the boundary; given South Asian heritage, haemoglobin electrophoresis should be considered to exclude coexisting thalassaemia trait.\nVitamin B12 192 pg/ml (lower limit 193, optimal above 500). Below range and significantly below optimal. Consistent with vegetarian diet. Causes fatigue, low mood, and neurological symptoms independently of the anaemia.\nVitamin D 18 nmol/L, deficient (below 30). Requires loading dose followed by higher-dose maintenance given BMI of 35 and darker skin pigmentation.\nHbA1c 43 mmol/mol (pre-diabetic range 42 to 47). However, fasting glucose 4.2, fasting insulin 3.99, and HOMA-IR 0.74 are all excellent. The raised HbA1c is very likely inflated by the iron deficiency anaemia (longer red cell lifespan increases glycation). Should be repeated after iron correction.\nCRP 10 mg/L (upper limit 5, optimal below 1.0) and ESR 28 mm/hour (upper limit 12). Elevated inflammation. Partly attributable to BMI of 35 but higher than weight alone usually produces. ESR additionally influenced by anaemia. Repeat in 3 months.\nCystatin C 1.16 mg/L (upper limit 1.1); cystatin C eGFR 84 (optimal above 90); combined eGFR 84. Mildly reduced kidney filtration. May be transiently elevated by the CRP of 10. Repeat with CRP to establish true baseline.\nBicarbonate 16.3 mmol/L (lower limit 20). Low, indicating mild metabolic acidosis. Should be interpreted alongside the kidney function and repeated.\nGGT 47 IU/L (female upper limit 38). Mild elevation in a non-drinker suggests metabolic strain from excess weight. ALT 39 (optimal below 25 for females) and AST 41 are within laboratory range but above ideal.\nLipids: ApoB 1.37 g/L (target below 0.9), LDL 4.2 mmol/L (target below 3.0), non-HDL 4.7 (target below 4.0), total cholesterol 6.5, ApoB/A1 ratio 0.85 (target below 0.6). Offset by excellent HDL 1.8, ApoA1 1.61, triglycerides 1.24, and atherogenic index of plasma minus 0.162. Dietary modification is the first-line intervention; Lp(a) should be measured to determine how much is modifiable.\nC-peptide 0.97 ug/L (lower limit 1.1). Marginally below range. Laboratory notes sample degradation if not separated within 4 hours; likely artefact given normal glucose, insulin, and HOMA-IR.\nLymphocytes 3.02 (upper limit 3.0). Marginally above range. Not clinically significant at this margin; may reflect inflammatory response.\nUrea 3.1 mmol/L (lower limit 3.2). Marginally below range. Expected on a vegetarian diet with lower protein intake.\nFolate reported as insufficient by the laboratory. Repeat on fresh sample. Oestradiol, Lp(a), and total antioxidant activity also reported as insufficient. Lp(a) should be specifically requested on repeat.\nUrine culture: moderate growth of Group B Streptococcus, but no WBCs, no nitrites, no RBCs, no symptoms. Most likely sample contamination. Sensitivities reported for reference. No treatment indicated in the absence of symptoms.\nReassuring negatives: thyroid function normal with negative antibodies (TSH 1.79, FT4 15.7, FT3 4.8), coeliac screen negative, HOMA-IR optimal at 0.74, liver fibrosis scores normal (FIB-4 0.76, APRI 0.282), tumour markers CA125 11.5, CA15-3 25.61, CA19-9 4.07, CEA below 0.5 all within range, immunoglobulins normal, rheumatoid factor normal, hormones consistent with luteal phase with regular cycle, PhenoAge 41.9 matching calendar age, urinalysis clean.","recommendations":"Discuss the iron deficiency anaemia with the GP. Bring the following numbers: haemoglobin 110, MCV 66.8, ferritin 11, transferrin saturation 10%. Request iron replacement (likely oral ferrous bisglycinate or ferrous fumarate with vitamin C) and ask whether a haemoglobin electrophoresis is appropriate given South Asian heritage and a Mentzer index of 13.5, to exclude coexisting thalassaemia trait.\nAsk the GP to note the vitamin B12 of 192 and consider B12 injections (hydroxocobalamin) to correct the deficiency quickly, followed by sublingual methylcobalamin for maintenance. In the context of vegetarian diet and anaemia, injections may be preferable to oral supplementation initially.\nAsk the GP to repeat the folate, oestradiol, Lp(a), and total antioxidant activity on a fresh sample, as these were returned as insufficient by the laboratory.\nDiscuss the HbA1c of 43 with the GP and explain that the iron deficiency is likely inflating it. Request a repeat HbA1c in 4 to 6 months after iron correction to get a true reading. No diabetes treatment should be started on this result alone given the excellent fasting glucose and HOMA-IR.\nAsk the GP to repeat CRP (currently 10), ESR (currently 28), cystatin C (currently 1.16), and bicarbonate (currently 16.3) in 3 months to see whether these normalise as the anaemia is corrected and weight loss begins.\nDiscuss the ApoB of 1.37 and LDL of 4.2 with the GP. Dietary changes are the first-line approach; if ApoB remains above 0.9 after 6 months of dietary change and weight loss, the GP may consider statin therapy, particularly once the Lp(a) result is available.\nAim for a daily calorie intake of 1,550 to 1,700 kcal with at least 104 g of protein (1.3 g per kg of body weight), targeting a body weight of 68 to 72 kg. Retest in 5 to 6 months with the following markers to track progress: full blood count, ferritin, transferrin saturation, B12, folate, HbA1c, CRP, cystatin C, bicarbonate, lipid profile with ApoB, Lp(a), vitamin D, and liver function.","supplementation":"Iron: ferrous bisglycinate, 25 mg elemental iron, taken with 500 mg vitamin C (ascorbic acid) on an empty stomach or with a meal rich in vitamin C, once daily. Take at least 2 hours apart from any calcium, tea, or coffee. Why: ferritin of 11 and transferrin saturation of 10% indicate depleted iron stores. If the GP prescribes a different form or dose (such as ferrous fumarate 210 mg), follow the GP's recommendation over this one. Continue for at least 3 to 6 months and retest ferritin before stopping.\nVitamin B12: sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Why: B12 of 192 is below range and vegetarian diets provide limited B12. Sublingual bypasses any absorption issues in the gut. If the GP initiates loading injections first, continue sublingual as maintenance afterwards.\nVitamin D3: cholecalciferol, 4,000 IU daily for the first 12 weeks as a loading phase, then reassess. Take with a meal containing fat. At her BMI of 35 and vitamin D of 18, the higher dose is needed because fat tissue sequesters the vitamin. Why: vitamin D of 18 is deficient and contributes to fatigue, low mood, and impaired immune function.\nVitamin K2: MK-7, 100 to 200 mcg daily, taken alongside the vitamin D. Why: vitamin K2 directs calcium into bones and teeth rather than soft tissue and arteries, and should always accompany vitamin D supplementation, especially with the corrected calcium already at 2.48.\nMagnesium: magnesium glycinate, 300 to 400 mg before bed. Why: magnesium supports sleep quality (slow to get going on waking), muscle relaxation, and energy production. Her serum magnesium of 1.05 is at the top of range, but serum levels do not reflect intracellular stores, and glycinate is the best-tolerated form for sleep.\nOmega-3: fish oil (or algae-based EPA and DHA if preferred on a vegetarian diet), 2 g combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides, reduces CRP, and supports cardiovascular health. With an ApoB of 1.37 and CRP of 10, the anti-inflammatory and lipid benefits are both relevant.\nFolate: methylfolate, 400 to 800 mcg daily. Why: the laboratory could not produce a folate result, and with only 0 to 1 portions of vegetables a day and evidence of anaemia, supplementation is a sensible interim measure until the repeat result is available. Folate works alongside B12 in red blood cell production.\nThe most important changes from this report are not supplements. They are increasing vegetable and protein intake dramatically, reducing sugary food, moving from under 5,000 steps to at least 7,500, and creating a modest calorie deficit to begin losing body fat. The supplements correct what is depleted; the food and movement prevent it from happening again.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3545","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 39 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Needs medical attention. Raw 39.4. Weakest systems: inflammation 3%, lipids & cardiovascular 15%, hematology 18%. Biggest drags: Haemoglobin, Bicarbonate, High-Sensitivity CRP, LDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"41.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4457","lower_normal":"","upper_normal":"47","lower_optimal":"","upper_optimal":"42","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4468","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count). Iqwinder's PhenoAge is 41.9, essentially matching her calendar age of 42 (difference of minus 0.1 years). This is a positive finding: despite the anaemia, elevated CRP, and metabolic stress, her overall biological ageing is on track. Her albumin, glucose, and lymphocyte count are pulling the score in a favourable direction, while the CRP and elevated MCV and RDW (from the anaemia) are the markers that would improve this further once corrected.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Blood glucose is the concentration of sugar in the blood at the moment the sample is taken, measured after an overnight fast. Iqwinder's fasting glucose is 4.2, sitting comfortably within the ideal range of 4.0 to 5.4. This is an excellent result, especially at a BMI of 35, and shows that her body is managing blood sugar very well in the fasting state.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress response, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6100","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar control over the previous two to three months. Iqwinder's HbA1c is 6.1%, which falls in the pre-diabetic range (6.0 to 6.4%). However, iron deficiency anaemia is a well-recognised cause of falsely elevated HbA1c because iron-starved red blood cells live longer, accumulating more glucose on their surface. With her fasting glucose at 4.2 and HOMA-IR at 0.74, her actual glucose control appears excellent, and this reading should be repeated after her iron stores have been corrected.","low_causes":"Iron supplementation, haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Pre-diabetes, diabetes, iron deficiency anaemia (artefactual elevation), chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5119","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the standard international unit. A normal HbA1c is below 42, pre-diabetes is 42 to 47, and diabetes is 48 or above. Iqwinder's result of 43 places her just into the pre-diabetic range. As explained above, iron deficiency anaemia artificially inflates HbA1c, and with her excellent fasting glucose and insulin sensitivity, this result should be repeated after iron correction before any conclusions are drawn about her glucose control.","low_causes":"Iron supplementation, haemolytic anaemia, blood loss","high_causes":"Pre-diabetes, diabetes, iron deficiency anaemia (artefactual), chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3954","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3066","upper_optimal_position":"0.4488","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar under control. Iqwinder's fasting insulin of 3.99 is well within the ideal range of 2 to 8 and is an impressive result at a BMI of 35. A low fasting insulin with a normal fasting glucose means the pancreas does not have to work hard to maintain blood sugar control, reflecting excellent insulin sensitivity. This is a genuine metabolic strength.","low_causes":"Low carbohydrate diet, very high insulin sensitivity, type 1 diabetes or late-stage type 2","high_causes":"Insulin resistance, pre-diabetes, excess carbohydrate intake, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2382","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin, and it is a reliable marker of how much insulin the body is producing. Iqwinder's C-peptide is 0.97, marginally below the lower limit of 1.1. The laboratory has noted that C-peptide can degrade to 44% of baseline if the sample is not separated within four hours, so this low result is most likely a sample handling artefact rather than a genuine finding. Her normal fasting glucose and healthy insulin level both confirm the pancreas is functioning well. In pmol/L (multiplied by 331), this equates to approximately 321 pmol/L.","low_causes":"Sample degradation, low insulin demand, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5071","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and represents what the average blood sugar has been over the past two to three months. Iqwinder's estimated average glucose is 7.1 mmol/L, marginally above the normal ceiling of 7.0. As with the HbA1c from which it is calculated, this is very likely inflated by the iron deficiency anaemia. Her actual fasting glucose of 4.2 and HOMA-IR of 0.74 indicate excellent glucose control, and this number should normalise once the iron deficiency is corrected.","low_causes":"Iron supplementation, haemolytic anaemia, recent blood loss","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose to estimate insulin resistance without needing an insulin measurement. Iqwinder's TyG is 8.33, within both the normal and optimal range. This confirms her insulin sensitivity from a different angle, consistent with the excellent HOMA-IR of 0.74.","low_causes":"High insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"110","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Iqwinder's haemoglobin is 110, below the female lower limit of 120, confirming anaemia. This means her blood is carrying less oxygen than it should, and this directly explains her fatigue, afternoon energy crashes, and difficulty getting going in the morning. The cause is iron deficiency, as confirmed by the rest of her blood count and iron studies.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, thalassaemia","high_causes":"Dehydration, chronic lung disease, polycythaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7433","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Iqwinder's count is 4.93, above the female upper limit of 4.8. This is the body's compensatory response to iron deficiency: when each red cell carries less oxygen (low MCH), the bone marrow produces more cells to try to maintain oxygen delivery. This elevated count alongside a low MCV and low MCH is a classic feature of iron deficiency and is also consistent with thalassaemia trait, which is why a haemoglobin electrophoresis should be considered.","low_causes":"Anaemia, bone marrow disease, chronic kidney disease, nutritional deficiency","high_causes":"Iron deficiency (compensatory), thalassaemia trait, dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.329","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0233","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. Iqwinder's haematocrit is 0.329, below the lower limit of 0.36. This is low because although she has plenty of red blood cells (count elevated at 4.93), those cells are abnormally small (MCV 66.8) due to iron deficiency, so they occupy less volume. This confirms the iron deficiency anaemia picture seen across her blood count.","low_causes":"Iron deficiency anaemia, B12 or folate deficiency, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"17.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8806","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6250","units":"%","description":"RDW measures the variation in size among red blood cells. A higher number means more variation. Iqwinder's RDW is 17.1%, well above the upper limit of 14%. This is because the bone marrow is producing a mix of older, normal-sized cells and newer, smaller iron-starved cells, creating a wide spread of sizes. An elevated RDW with a low MCV is a hallmark of iron deficiency anaemia and helps distinguish it from thalassaemia trait, where the RDW is often normal.","low_causes":"Uniform red cell population (normal finding)","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease, recent transfusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"66.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of each red blood cell. Iqwinder's MCV is 66.8, well below the lower limit of 83. Small red blood cells (microcytosis) occur when the body does not have enough iron to build normal-sized cells. This is one of the most reliable indicators of iron deficiency and is a key part of the anaemia picture in this report. Very low MCV values can also be seen in thalassaemia trait.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"22.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin packed into each red blood cell. Iqwinder's MCH is 22.3, below the lower limit of 27. This means each cell is carrying less oxygen-transporting haemoglobin than normal. Combined with the low MCV, this confirms hypochromic microcytic anaemia, the type caused by iron deficiency.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"334","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. Iqwinder's MCHC is 334, within the normal range of 315 to 345 and within the optimal range. Despite the low MCV and MCH, the concentration of haemoglobin within each (smaller) cell is maintained, which is typical of iron deficiency.","low_causes":"Iron deficiency (severe), thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"363","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5487","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the tiny blood cells that help the blood clot. Iqwinder's platelet count is 363, within the laboratory range of 150 to 410 but above the optimal range of 180 to 350. Mild thrombocytosis (raised platelets) is a common reactive finding in iron deficiency anaemia, as the bone marrow is stimulated and produces extra platelets alongside its attempt to make more red cells. This is expected to normalise as the iron deficiency is corrected.","low_causes":"Viral infections, bone marrow disorders, medications, liver disease","high_causes":"Iron deficiency (reactive), inflammation, infection, essential thrombocythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets tend to be younger and more active. Iqwinder's MPV is 9.5, within both the normal and optimal range. This is unremarkable.","low_causes":"Bone marrow suppression, older platelet population","high_causes":"Platelet activation, inflammation, iron deficiency, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"7.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"9.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"x10^9/L","description":"White blood cells are the immune system's front line, defending the body against infection and disease. Iqwinder's total white cell count is 7.48, within both the normal range of 4 to 10 and the optimal range. This is reassuring and shows her immune system is functioning normally.","low_causes":"Viral infections, bone marrow suppression, autoimmune disease, medications","high_causes":"Infection, inflammation, stress, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4493","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. Iqwinder's neutrophil count is 3.74, within both the normal and optimal range. This is healthy and unremarkable.","low_causes":"Viral infections, medications, autoimmune conditions, bone marrow disease","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"3.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6733","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for targeted immune responses, including fighting viruses and producing antibodies. Iqwinder's lymphocyte count is 3.02, marginally above the upper limit of 3.0. At this tiny margin, this is not clinically significant and may reflect the body's response to the low-grade inflammation seen in her CRP, or a minor viral exposure around the time of the test.","low_causes":"Viral infections (acute phase), corticosteroid use, autoimmune disease, stress","high_causes":"Viral infection, chronic inflammation, autoimmune conditions, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4958","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells, and also help coordinate the immune response. Iqwinder's monocyte count is 0.43, within both the normal and optimal range. This is healthy.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic infection, autoimmune disease, inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasites and in allergic responses. Iqwinder's eosinophil count is 0.26, within both the normal and optimal range. This is healthy and shows no sign of allergic activation or parasitic infection.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, eczema, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and are involved in allergic reactions and inflammatory responses. Iqwinder's basophil count is 0.03, within both the normal and optimal range. This is normal.","low_causes":"Steroid use, acute allergic reaction, hyperthyroidism","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4983","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are newly formed red blood cells released from the bone marrow. The percentage reflects how actively the marrow is producing new cells. Iqwinder's reticulocyte count is 1.49%, within both the normal and optimal range. In the context of iron deficiency anaemia, a normal reticulocyte count suggests the marrow is trying to produce cells but is limited by the lack of iron, rather than there being a bone marrow problem.","low_causes":"Iron deficiency (severe), B12 or folate deficiency, bone marrow failure, aplastic anaemia","high_causes":"Recovery from anaemia, blood loss, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"
