<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Iqwinder Kaur","dob":"08/08/1984","report_date":"2026-10-05","is_retest":false,"summary":"Iqwinder is a 42-year-old South Asian female presenting with a BMI of 35.1, following a vegetarian diet that includes eggs and dairy, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are larger than average (volume 7 out of 10). She does no structured cardio or resistance training, walks 2,000 to 5,000 steps a day, sleeps 7 to 8 hours but is slow to get going on waking, experiences an afternoon energy crash, and finds stress hard to manage some weeks. She drinks no alcohol, takes no medications, has no diagnosed conditions, and has not had blood tests before. She reports low energy and fatigue lasting over a year. Her goals are to lose body fat, improve energy levels, and improve long-term health and longevity. She writes that she knows her lifestyle is sedentary and wants to change it, and that her quality of life currently lacks energy with low mood moments during the day.\n\nThe finding that should go to her GP first is a clear iron deficiency anaemia. Her haemoglobin is 110, below the female lower limit of 120. Her MCV is 66.8, well below the lower limit of 83, meaning her red blood cells are abnormally small. Her MCH is 22.3, below the lower limit of 27, meaning each cell carries less haemoglobin than it should. Her RDW is 17.1, above the upper limit of 14, which tells us the bone marrow is producing red cells of very uneven sizes as it struggles with insufficient iron. Her haematocrit is 0.329, below the lower limit of 0.36. Her red blood cell count is actually raised at 4.93, above the female upper limit of 4.8, and this is the body's compensatory response: when each cell carries less oxygen, the marrow makes more of them to try to keep up. The iron studies confirm the mechanism. Her ferritin is 11, technically just inside the laboratory range of 10 to 291 but functionally depleted; for a woman of 42, iron stores below 30 are associated with fatigue and below 50 are considered suboptimal. Her transferrin saturation is 10.08 percent, well below the lower limit of 18, meaning only a tenth of her iron-carrying protein is loaded with iron. Her transferrin itself is raised at 3.95, above the upper limit of 3.8, and her total iron binding capacity is 92.5, above the upper limit of 76.1. Both of these are the liver's response to iron deficiency: it produces more of the transport protein in an attempt to scavenge every available iron molecule. Her serum iron at 10 is at the very floor of the range. This is a textbook iron deficiency picture, and it is almost certainly the primary driver of her fatigue, her afternoon energy crashes, and her low mood moments. Iron is essential for oxygen delivery to every tissue, and when the body cannot deliver enough oxygen, energy production falls, concentration drops, and mood suffers. In a vegetarian woman with regular cycles, the combination of no dietary haem iron and monthly menstrual losses is the most common explanation. Her GP should confirm this with a clinical review and will very likely start iron replacement. We have included specific guidance in the supplementation section, but this degree of deficiency may need a higher dose or even intravenous iron depending on how she responds, and that decision sits with her GP.\n\nHer ESR, the erythrocyte sedimentation rate, is 28, above the upper limit of 12. ESR measures how quickly red blood cells settle in a tube over one hour, and a raised value indicates inflammation somewhere in the body. Her high-sensitivity CRP, another inflammation marker, is also raised at 10, above the upper limit of 5. CRP is produced by the liver in response to inflammation and is a more specific marker than ESR. At a BMI of 35.1, adipose tissue itself is a source of chronic low-grade inflammation, and this is the most likely explanation for both markers being elevated. However, the combination of raised CRP, raised ESR, iron deficiency anaemia, and raised lymphocytes at 3.02 (marginally above the upper limit of 3) means her GP should check whether there is another inflammatory process contributing, particularly given she is South Asian and iron deficiency of this degree warrants investigation of absorption as well as intake. A coeliac screen has been done and is negative, which is reassuring, but her GP may wish to check for other causes of malabsorption or occult blood loss.\n\nHer vitamin B12 is 192, just below the lower limit of 193. This is a second nutritional deficiency and is very common in vegetarian diets because B12 is found almost exclusively in animal products. Eggs and dairy provide some, but often not enough for optimal levels. B12 is essential for nerve function, red blood cell production, and energy metabolism, and deficiency contributes to fatigue, brain fog, and low mood, all of which she reports. Her folate result was returned as insufficient by the laboratory, meaning the level was too low to quantify accurately, which again fits with a diet containing only 0 to 1 portions of vegetables and fruit a day, since folate comes primarily from green leafy vegetables, legumes, and fortified foods. B12 and folate deficiency together can mask each other's effects on the blood count because both cause large red cells while iron deficiency causes small ones, and her blood count is dominated by the iron deficiency picture. Once iron is replaced, if B12 and folate remain low, her MCV may actually rise. Her GP should be aware of all three deficiencies together.\n\nHer HbA1c is 43 mmol per mol, which sits just above the pre-diabetes threshold of 42. HbA1c, or glycated haemoglobin, measures the average blood sugar over the preceding two to three months by looking at how much sugar has attached to haemoglobin molecules. A value of 42 to 47 is classified as pre-diabetes, meaning blood sugar regulation is beginning to drift. However, there is an important caveat here. Iron deficiency anaemia artificially raises HbA1c because when haemoglobin is lower and red blood cells live slightly longer (as they do in iron deficiency), each molecule accumulates more sugar even if actual blood sugar levels are normal. Her fasting glucose of 4.2 is well within the ideal range of 4.0 to 5.4, her fasting insulin is 3.99 which is within range, and her HOMA-IR, a calculated index of insulin resistance, is 0.74 which is excellent and means she is insulin-sensitive. Her C-peptide, a marker of how much insulin the pancreas is producing, came back at 0.97 micrograms per litre (321 pmol/L), which is below the laboratory range of 1.1 to 4.4. In the context of a normal fasting glucose and low insulin, this simply reflects low insulin demand rather than pancreatic failure, and is consistent with insulin sensitivity. The laboratory noted that C-peptide can degrade if the sample is not separated within four hours, so the value may be slightly lower than the true level. Taken together, this means her actual blood sugar control is probably better than the HbA1c suggests, and once the iron deficiency is corrected, the HbA1c should fall. Her GP should recheck it in three to four months after iron treatment. That said, at a BMI of 35.1, with a sedentary lifestyle, a South Asian background (which carries a higher genetic risk for type 2 diabetes), and a diet that includes sugary food some days with minimal vegetables, the metabolic trajectory is heading in a direction that needs attention regardless of whether the current HbA1c is artificially inflated. The fact that her insulin sensitivity is still excellent is genuinely good news, it means the window for preventing progression to true insulin resistance is wide open, but it will not stay open indefinitely without changes to diet and activity.\n\nHer bicarbonate is 16.3, below the lower limit of 20. Bicarbonate is part of the body's acid-base buffering system, and a low value suggests a mild metabolic acidosis. In the context of her other results, the most likely explanation is the combination of her raised CRP and ESR indicating an inflammatory state, and possibly her diet composition. Her GP should be aware of this finding, particularly if she reports any breathlessness, nausea, or muscle weakness, as it may warrant a venous blood gas to confirm.\n\nHer lipid profile needs attention. Her total cholesterol is 6.5, above the desirable limit of 5.18. Her LDL cholesterol is 4.2, above the upper limit of 3.0. LDL, low-density lipoprotein, is the particle that deposits cholesterol into artery walls, and her level is meaningfully elevated. Her ApoB, apolipoprotein B, is 1.37, well above the target of 0.9. ApoB is a more accurate measure of cardiovascular risk than LDL because it counts the actual number of atherogenic particles in the blood, and at 1.37 she has roughly 50 percent more particles than ideal. Her non-HDL cholesterol is 4.7, above the target of 4.0. Her ApoB to ApoA1 ratio is 0.85, above the higher risk threshold of 0.8, meaning the balance between harmful and protective particles has tipped in the wrong direction. Her Lp(a) result was returned as insufficient by the laboratory, which is unfortunate because Lp(a) is an inherited marker that tells us whether part of the LDL elevation is genetic and unchangeable; we would recommend requesting this on a future test. The positive side of her lipid profile is her HDL at 1.8, which is excellent and above the desirable threshold of 1.55. HDL, high-density lipoprotein, removes cholesterol from artery walls and returns it to the liver, and a level of 1.8 is genuinely protective. Her triglycerides at 1.24 are within the desirable range, and her triglyceride to HDL ratio and atherogenic index are both within the ideal range, which tells us that the lipid problem is driven by LDL particle number rather than by metabolic syndrome or insulin resistance. The dietary levers for lowering LDL are soluble fibre (oats, lentils, beans, barley), reducing saturated fat (full-fat dairy and cheese in a vegetarian diet are common sources), and increasing omega-3 intake. These are addressed in the lifestyle section.\n\nHer liver shows one finding worth noting. Her GGT is 47, above the female upper limit of 38. GGT, gamma-glutamyl transferase, is an enzyme that rises with liver strain from various causes including excess weight, fatty liver, and metabolic stress. At a BMI of 35.1 with raised inflammatory markers and elevated cholesterol, a mildly raised GGT is consistent with early metabolic strain on the liver. Her ALT at 39 is above the female optimal threshold of 25 but within the laboratory range. Her AST at 41 is within range. Her FIB-4 score is 0.76, well within the safe range, and her APRI is 0.28, also well within range, meaning there is no sign of liver scarring. Her alkaline phosphatase at 114 is within range but near the upper limit of 116; in the context of normal calcium and phosphate, this is not a concern. Her bilirubin, albumin, total protein, amylase, and lipase are all within the healthy range, confirming the liver and pancreas are structurally sound.\n\nHer Cystatin C is 1.16, above the upper limit of 1.1. Cystatin C is a protein filtered by the kidneys that provides a more reliable estimate of kidney function than creatinine, particularly at higher body weights. Her Cystatin C-based eGFR is 84, which is below the optimal threshold of 90. Her creatinine-based eGFR is above 90. The combined eGFR from both markers is 84. At 42, an eGFR of 84 is mildly below optimal but not in the reduced range (below 60). The most likely explanation is her BMI and the inflammatory load placing mild strain on the kidneys. Her urea is 3.1, marginally below the lower limit of 3.2, which is not clinically significant. Her electrolytes including sodium, chloride, and potassium are within range, with potassium at 5.1 sitting near the upper end of the range of 3.5 to 5.3; the laboratory noted this should be reviewed with caution if the sample was delayed, which is common with posted samples. Her uric acid at 330 is within range.\n\nHer thyroid is working well. TSH at 1.79 is within the ideal range of 1.0 to 2.5, free T4 at 15.7 is within the ideal range, free T3 at 4.8 is within the ideal range, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. Her FT3 to FT4 ratio of 0.306 confirms good conversion of the inactive thyroid hormone to the active form. This is reassuring given her fatigue, because it means the thyroid is not contributing to her symptoms.\n\nHer hormonal profile is consistent with the luteal phase of her menstrual cycle. Her progesterone at 19.63 falls within the luteal range of 10.62 to 81.28, confirming she ovulated this cycle. Her LH at 0.8 and FSH at 1.95 are consistent with the luteal phase when these hormones are at their lowest. Her oestradiol was returned as insufficient by the laboratory. Her testosterone at 0.8, free androgen index at 2.09, DHEA-S at 2.1, SHBG at 38.3, and prolactin at 162 are all within their respective female ranges. Her bioavailable testosterone at 0.31 is within the healthy range. Her cortisol at 280 is within the morning reference range and does not suggest adrenal dysfunction.\n\nHer vitamin D is critically low at 18, classified as deficient (below 30). Vitamin D is essential for bone health, immune function, mood regulation, and energy, and at 18 she is significantly depleted. At a BMI of 35.1, fat tissue sequesters vitamin D, meaning she needs a higher replacement dose than a lean person. South Asian skin pigmentation also reduces vitamin D synthesis from sunlight. Her parathyroid hormone at 1.9 is within range, which is reassuring as the body has not yet started pulling calcium from bone to compensate, but this will happen if vitamin D remains this low. Her calcium and corrected calcium are both within the healthy range, and her phosphate and magnesium are also within range, with magnesium at 1.05 sitting at the top of the optimal band.\n\nHer immune markers are reassuring. IgG, IgM, IgA, and IgE are all within range, meaning there is no sign of immune deficiency, allergic activation, or myeloma. Her rheumatoid factor is negative. Her coeliac screen (tissue transglutaminase IgA) is negative, ruling out coeliac disease as a cause of her iron and nutrient deficiencies.\n\nHer urine sample grew a moderate amount of Group B Streptococcus. However, there were no white blood cells detected (less than 1), no nitrites, and no red blood cells, and she reports no urinary symptoms. In the absence of clinical signs of infection, a positive culture without supporting inflammatory markers most likely represents sample contamination rather than a urinary tract infection. Her GP should be aware but this does not require treatment unless she develops urinary symptoms.\n\nHer tumour markers are all within the normal range. CA125 at 11.5, CA15-3 at 25.61, CA19-9 at 4.07, and CEA below 0.5 are all reassuring.\n\nHer PhenoAge is 46 against a calendar age of 42, meaning her blood markers place her biological age four years older than her actual age. The markers driving this gap are her raised CRP, her raised white cell count relative to lymphocyte percentage, and her estimated average glucose from the HbA1c. The plan outlined below, particularly the iron correction, weight loss, dietary improvement, and introduction of movement, should bring this number down significantly over the next six to twelve months.\n\nHer Cardiovascular Risk Score is driven by her elevated ApoB, LDL, and raised CRP. Her excellent HDL and healthy triglycerides provide meaningful protection, but the particle number and inflammatory load mean cardiovascular risk is a priority to address through diet and lifestyle.\n\nTo bring the whole picture together: Iqwinder's fatigue, afternoon crashes, and low mood have a clear and treatable explanation. She has significant iron deficiency anaemia with depleted stores, vitamin B12 just below range, folate insufficient, and vitamin D severely deficient. These four nutritional deficiencies, in a vegetarian woman with regular periods eating fewer than one portion of vegetables and fruit a day, are driving her symptoms. Correcting them should produce a noticeable improvement in energy within six to eight weeks. Beyond the deficiencies, her metabolic trajectory at a BMI of 35.1 with a sedentary lifestyle and South Asian ethnicity is a concern: elevated cholesterol and ApoB, raised inflammatory markers, a borderline HbA1c (likely inflated by the anaemia but still a warning), and a mildly reduced Cystatin C eGFR. None of these are emergencies, and the fact that her insulin sensitivity is still excellent is a genuine strength, but they form a pattern that will worsen without intervention. The lifestyle changes below are designed to address all of them together.","links":"The central thread in this report is nutritional deficiency against a background of metabolic risk. Iqwinder is eating enough food in terms of volume, she rates portions as larger than average, but the composition of that food is not providing what her body needs. A vegetarian diet with fewer than one portion of vegetables or fruit a day and sugary food on some days means she is likely getting most of her calories from refined carbohydrates, dairy, and processed vegetarian foods rather than from the iron-rich pulses, dark leafy greens, and whole grains that make vegetarian eating nutritionally complete. The result is a body that is simultaneously overfed in calories and underfed in iron, B12, folate, and vitamin D.\n\nThe iron deficiency anaemia is the dominant finding and connects directly to her primary complaint of fatigue. Every marker in the iron pathway points in the same direction: ferritin depleted, transferrin saturation at 10 percent, transferrin and iron binding capacity both raised as the body tries to compensate, haemoglobin below range, red cells small and pale. Her bone marrow is working hard, producing an above-normal number of red cells to try to maintain oxygen delivery, but each cell carries less haemoglobin than it should. The afternoon crash she describes is a classic pattern in iron deficiency: energy is just adequate in the morning when cortisol is highest, then falls away as the day progresses and the oxygen-carrying deficit takes its toll. The low mood moments are also recognised in iron deficiency, because iron is a cofactor for the enzymes that produce serotonin and dopamine.\n\nThe B12 and folate deficiencies compound the iron picture. B12 at 192 is below range and folate is insufficient, meaning two of the three nutrients essential for healthy red blood cell production are depleted alongside the iron. Once iron replacement begins, the B12 and folate deficiencies may become more apparent in the blood count, so all three need correcting simultaneously.\n\nThe raised inflammatory markers, CRP at 10 and ESR at 28, are most likely driven by her BMI of 35.1. Adipose tissue is metabolically active and produces inflammatory cytokines, and a CRP of 10 at this weight is unfortunately common. However, the inflammation also connects to the lipid findings: chronic inflammation accelerates atherosclerosis independently of cholesterol levels, so the combination of an ApoB of 1.37 and a CRP of 10 means the cardiovascular risk is greater than either number alone would suggest. The GGT at 47 and the Cystatin C at 1.16 are also consistent with metabolic strain from excess weight and inflammation.\n\nThe HbA1c of 43 sits in the pre-diabetic range, but the excellent fasting glucose of 4.2, low insulin of 3.99, and HOMA-IR of 0.74 argue strongly that true blood sugar dysregulation has not yet begun. Iron deficiency is known to falsely elevate HbA1c, and this is the most likely explanation for the discrepancy. Repeating HbA1c after three to four months of iron replacement will give a true reading. Nevertheless, at her BMI and ethnicity, pre-diabetes vigilance is appropriate regardless.\n\nThe vitamin D deficiency at 18 is a separate finding with its own consequences. At this level, immune function, bone mineralisation, mood regulation, and muscle function are all compromised. Her South Asian skin pigmentation and high BMI both reduce vitamin D availability, and aggressive supplementation is needed.\n\nWhat has been excluded is important. Her thyroid is working well with negative antibodies, ruling out hypothyroidism as a cause of fatigue and weight gain. Her coeliac screen is negative, ruling out gluten-mediated malabsorption. Her kidney function, while mildly below optimal on Cystatin C, is not in a concerning range. Her liver shows no scarring. Her immune system is functioning normally. Her hormones are consistent with a normal ovulatory cycle. Her tumour markers are all clear. The urine culture finding is most likely contamination and does not explain her symptoms.","lifestyle":"Add one portion of dark leafy greens (spinach, kale, broccoli, or spring greens) to your largest meal every day, cooked or raw. Anchor: goes on the plate before anything else. Why: dark greens provide iron, folate, and fibre, addressing three deficiencies in this report at once, and the vitamin C in greens helps your body absorb the iron.\nSwap one refined carbohydrate at each meal for a whole food alternative: white rice for brown rice or quinoa, white bread for wholegrain roti, sugary cereal for porridge oats with nuts. Start with breakfast this week. Why: whole grains provide more iron and fibre, lower the glycaemic load that is pushing your HbA1c to 43, and the soluble fibre in oats actively lowers LDL cholesterol, which at 4.2 needs to come down.\nAdd a palm-sized portion of protein to every meal: eggs, paneer, Greek yoghurt, lentils, chickpeas, tofu, or beans. Anchor: protein goes on the plate first. Why: protein keeps you full so portions naturally reduce over time, supports muscle maintenance during weight loss, and lentils and chickpeas are among the richest vegetarian sources of iron and folate.\nWalk for 20 minutes after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the blood sugar response to that meal, supports weight loss, and at your current step count of 2,000 to 5,000 this alone could double your daily movement.\nBuild to 7,000 steps a day within four weeks, then 10,000 within eight weeks. Track with your phone or a watch. Why: increasing daily movement from 3,000 to 10,000 steps is the single most effective change for reducing the inflammatory markers (CRP 10, ESR 28) and improving the cholesterol profile without medication.\nReduce full-fat cheese and cream-based dishes to two or three times a week rather than daily. Replace with lower-saturated-fat protein sources like lentil dhal, chickpea curry, or egg-based dishes. Why: saturated fat from dairy is the most likely driver of your LDL at 4.2 and ApoB at 1.37 on a vegetarian diet, and reducing it is the most direct dietary lever for lowering cardiovascular risk.\nCut sugary food and drinks to once a week or less. Anchor: pick one day as your treat day and keep the rest clean. Why: frequent sugar raises average blood glucose, contributes to the HbA1c of 43, drives insulin demand, and adds calories without nutrients.\nFix your wake time to the same time every day, including weekends, and get outside within 30 minutes of waking for at least 10 minutes. Why: morning light resets your circadian rhythm, which governs cortisol timing, and a fixed wake time is the single most effective change for improving the slow-to-get-going feeling she describes and reducing the afternoon crash.","flags":"Iron deficiency anaemia: haemoglobin 110 (range 120 to 150), MCV 66.8 (range 83 to 101), MCH 22.3 (range 27 to 32), haematocrit 0.329 (range 0.36 to 0.46), RDW 17.1 (range 11.6 to 14), red blood cell count 4.93 (range 3.8 to 4.8, raised as a compensatory response). Iron studies confirm: ferritin 11 (functionally depleted), transferrin saturation 10.08 percent (range 18 to 55), transferrin 3.95 (range 2.5 to 3.8), iron binding capacity 92.5 (range 44 to 76.1). Classical iron deficiency anaemia in a vegetarian woman with regular cycles. GP should confirm and initiate iron replacement, consider investigation of absorption or occult blood loss.\nVitamin B12 192 pg/ml, below the lower limit of 193. Vegetarian diet is the most likely cause. Folate returned as insufficient by the laboratory. Both deficiencies need correcting alongside the iron.\nVitamin D 18 nmol/L, classified as deficient (below 30). Needs aggressive replacement at 4,000 IU daily with fat-containing meal, higher dose may be needed given BMI 35.1 and South Asian skin pigmentation.\nHbA1c 43 mmol/mol, just above the pre-diabetes threshold of 42. However, fasting glucose 4.2, insulin 3.99, HOMA-IR 0.74 are all excellent, and iron deficiency anaemia is known to falsely elevate HbA1c. Repeat after three to four months of iron replacement to obtain a true reading. Metabolic vigilance appropriate given BMI and South Asian ethnicity.\nC-Peptide 0.97 ug/L (321 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. In context of normal glucose and low insulin, this reflects low insulin demand, not pancreatic insufficiency. Laboratory noted possible sample degradation.\nRaised inflammatory markers: hs-CRP 10 mg/L (limit 5), ESR 28 mm/hour (limit 12). Most likely driven by BMI 35.1 with adipose-mediated inflammation. GP should consider whether additional inflammatory cause warrants investigation given degree of iron deficiency.\nLymphocytes 3.02 (range 1 to 3), marginally above range. In context of raised inflammatory markers, likely reactive. Not significant in isolation.\nBicarbonate 16.3 mmol/L (range 20 to 31), below range, suggesting mild metabolic acidosis. GP should assess clinically and consider venous blood gas if symptoms present.\nLipids: LDL 4.2 (target below 3.0), ApoB 1.37 (target below 0.9), non-HDL 4.7 (target below 4.0), total cholesterol 6.5, ApoB/A1 ratio 0.85 (higher risk threshold 0.8). Driven by dietary saturated fat in a vegetarian diet. HDL 1.8 is excellent and triglycerides 1.24 are within range. Dietary modification is first-line, with reassessment in six months.\nGGT 47 IU/L (female range 4 to 38), mildly elevated. ALT 39 above female optimal of 25 but within lab range. FIB-4 0.76 and APRI 0.28 rule out fibrosis. Consistent with metabolic strain at BMI 35.1.\nCystatin C 1.16 (limit 1.1), eGFR (Cystatin C) 84, combined eGFR 84. Mildly below optimal of 90 but not in reduced range. Likely related to BMI and inflammatory load. Monitor on retest.\nUrea 3.1 (range 3.2 to 8.2), marginally below range. Not clinically significant.\nPotassium 5.1 (range 3.5 to 5.3), near upper end. Laboratory noted result should be reviewed with caution if sample delayed. Likely artefactual but GP should note.\nUrine culture: moderate growth of Group B Streptococcus with no white blood cells, no nitrites, no red blood cells, and no urinary symptoms. Most likely sample contamination. No treatment indicated unless urinary symptoms develop.\nLp(a) returned as insufficient by the laboratory. Recommend requesting on a future test given elevated LDL and ApoB, as an elevated Lp(a) would change risk stratification.\nOestradiol returned as insufficient. Folate returned as insufficient. Total antioxidant activity returned as insufficient. These markers could not be quantified by the laboratory.\nPhenoAge 46 against calendar age 42, a four-year gap driven by raised CRP, estimated average glucose, and white cell parameters.\nReassuring negatives: thyroid function normal with negative antibodies, coeliac screen negative, tumour markers (CA125, CA15-3, CA19-9, CEA) all clear, immunoglobulins normal, rheumatoid factor negative, liver architecture intact (FIB-4 0.76, APRI 0.28), hormonal profile consistent with normal ovulatory cycle, urinalysis clear for protein, glucose, and blood, fasting glucose and insulin sensitivity excellent.","recommendations":"Discuss the iron deficiency anaemia with your GP as the priority. Bring the numbers: haemoglobin 110, ferritin 11, transferrin saturation 10 percent. The GP will likely start prescription iron replacement and may wish to investigate absorption or occult blood loss, particularly given the degree of depletion on a vegetarian diet.\nAsk the GP to check and replace vitamin B12 and folate alongside the iron, given B12 is 192 (below range) and folate was insufficient. All three deficiencies need correcting together.\nDiscuss the vitamin D level of 18 with the GP. A loading dose may be appropriate before maintenance supplementation given the severity of deficiency.\nAsk the GP to recheck HbA1c in three to four months once iron stores are replenished, to obtain a true reading. Mention that fasting glucose was 4.2 and HOMA-IR was 0.74, which suggest the 43 may be falsely elevated by the anaemia.\nMention the bicarbonate of 16.3 (below range of 20) and ask whether a venous blood gas is warranted to assess acid-base balance.\nMention the hs-CRP of 10 and ESR of 28 as markers of inflammation, likely driven by weight but worth the GP being aware of in the context of the iron deficiency.\nAim for a target weight of 55 to 65 kg over 12 to 18 months (BMI 24 to 28.5). A calorie target of 1,500 to 1,700 kcal per day with at least 100 to 120 grams of protein per day (1.3 to 1.6 g/kg target weight) will support fat loss while preserving muscle. Retest in six months with a focus on: full blood count, iron studies, ferritin, B12, folate, vitamin D, HbA1c, hs-CRP, lipid profile with ApoB, Cystatin C, GGT, ALT, and Lp(a).","supplementation":"Ferrous bisglycinate 25 mg taken with a vitamin C source (glass of orange juice or 250 mg vitamin C tablet) on an empty stomach, once daily. Why: ferritin is 11 and transferrin saturation is 10 percent, indicating significant iron depletion. Bisglycinate is better tolerated than ferrous sulphate. If the GP prescribes a different form or dose, follow their guidance as this degree of deficiency may need higher-dose or intravenous replacement.\nSublingual methylcobalamin 1,000 mcg daily, dissolved under the tongue, not swallowed as a tablet. Why: B12 is 192, just below range, and sublingual delivery bypasses any absorption issues in the gut. On a vegetarian diet, ongoing supplementation is likely needed long-term.\nVitamin D3 (cholecalciferol) 4,000 IU daily taken with a meal that contains fat. Why: vitamin D is 18, classified as deficient, and at a BMI of 35.1 with South Asian skin pigmentation, a higher dose is needed because fat tissue sequesters vitamin D and darker skin produces less from sunlight. If the GP prescribes a loading dose, complete that first then continue with 4,000 IU daily.\nVitamin K2 (MK-7) 100 mcg daily, taken at the same time as vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than into blood vessel walls. Always pair with vitamin D.\nMethylfolate (5-MTHF) 400 to 800 mcg daily. Why: serum folate was returned as insufficient, and methylfolate is the active form that does not require conversion.\nOmega-3 fish oil providing 2 g of combined EPA and DHA daily, taken with food. If she prefers a vegetarian source, algal omega-3 providing the same dose. Why: her ApoB is 1.37 and CRP is 10, and omega-3 at this dose lowers triglycerides, reduces inflammation, and has a modest effect on LDL particle size.\nMagnesium glycinate 300 mg taken before bed. Why: her magnesium at 1.05 is at the top of range but glycinate supports sleep quality and stress resilience, both of which she reports as issues, and is well tolerated.\nDo not take a general multivitamin or additional iron beyond what is listed above without GP guidance, as the specific doses above are tailored to her results.\nThe most important changes from this report are not supplements. They are correcting the iron deficiency with her GP, increasing vegetable and protein intake from whole food sources, reducing refined carbohydrates and sugary foods, and building daily movement from her current level to 10,000 steps.","system_ratings":{"blood":{"level":"red","label":"See your GP","note":"Iron deficiency anaemia with haemoglobin 110, MCV 66.8, ferritin 11, transferrin saturation 10 percent"},"vitamins":{"level":"red","label":"See your GP","note":"Vitamin D deficient at 18, B12 below range at 192, folate insufficient"},"cardio":{"level":"orange","label":"Needs attention","note":"ApoB 1.37 and LDL 4.2 well above target, offset by excellent HDL 1.8"},"liver":{"level":"amber","label":"Room to improve","note":"GGT 47 above female range of 38, ALT 39 above female optimal, no fibrosis"},"gut":{"level":"amber","label":"Room to improve","note":"HbA1c 43 borderline pre-diabetic but likely inflated by iron deficiency anaemia, excellent HOMA-IR 0.74"},"kidney":{"level":"amber","label":"Room to improve","note":"Cystatin C 1.16 and eGFR 84, mildly below optimal, likely BMI-related"},"minerals":{"level":"amber","label":"Room to improve","note":"Bicarbonate 16.3 below range, potassium 5.1 near upper limit"},"immune":{"level":"lime","label":"Mostly good","note":"Immunoglobulins and IgE normal, lymphocytes 3.02 marginally above range"},"thyroid":{"level":"green","label":"Optimal","note":"TSH 1.79, FT4 15.7, FT3 4.8, antibodies negative"},"hormones":{"level":"green","label":"Optimal","note":"Luteal phase profile with confirmed ovulation, testosterone and SHBG within range"},"screening":{"level":"green","label":"Optimal","note":"CA125, CA15-3, CA19-9 and CEA all within normal limits"},"urinary":{"level":"lime","label":"Mostly good","note":"Dipstick clear, culture grew Group B Streptococcus but no inflammatory markers or symptoms"}},"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"40","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 40 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 40. Weakest systems: inflammation 5%, lipids & cardiovascular 12%, hematology 18%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Gamma GT, Urea.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"41.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4457","lower_normal":"","upper_normal":"47","lower_optimal":"","upper_optimal":"42","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4468","units":"years","description":"PhenoAge is a measure of biological ageing calculated from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count. Iqwinder's PhenoAge is 46 against a calendar age of 42, meaning her blood markers place her four years older than her actual age. The markers driving this gap are her raised CRP of 10, her estimated average glucose of 7.1 (derived from HbA1c, which is likely inflated by iron deficiency), and her RDW of 17.1 and MCV of 66.8 from the anaemia. Correcting the iron deficiency, losing weight to reduce inflammation, and improving dietary quality should bring her PhenoAge down toward or below her calendar age. Note: as fasting glucose was not returned by the laboratory, the estimated average glucose from HbA1c (6.1 mmol/L) was used in its place.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Iqwinder's result of 4.2 is well within the ideal range of 4.0 to 5.4, meaning her body is clearing glucose from the bloodstream efficiently. This is a genuinely positive finding at a BMI of 35.1 and suggests her pancreas and insulin signalling are working well at present.","low_causes":"Fasting, excess insulin, liver disease","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin molecules in the blood that have sugar attached to them, giving an average picture of blood sugar control over the previous two to three months. Iqwinder's result of 6.1 percent (43 mmol/mol) sits just above the pre-diabetes threshold of 6.0 percent (42 mmol/mol). However, iron deficiency anaemia is known to falsely elevate HbA1c because when haemoglobin levels are low, red blood cells circulate for longer and accumulate more sugar. Given her excellent fasting glucose of 4.2 and her HOMA-IR of 0.74, the true HbA1c may be lower than reported. This should be rechecked after iron stores are replenished.","low_causes":"Haemolytic anaemia, recent blood loss, blood transfusion","high_causes":"Pre-diabetes, diabetes, iron deficiency anaemia (artefactual elevation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5394","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised units of mmol/mol. A value below 42 is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Iqwinder's result of 43 sits just inside the pre-diabetic range, but as explained above, iron deficiency anaemia artificially inflates this number. Her fasting glucose and insulin sensitivity are both excellent, so the true value is likely in or near the normal range. Repeat testing after iron replacement is essential.","low_causes":"Haemolytic anaemia, recent blood loss","high_causes":"Pre-diabetes, diabetes, iron deficiency (artefactual elevation)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"3.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3555","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_positi ey":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index of insulin resistance derived from fasting glucose and fasting insulin. A value below 1.0 indicates excellent insulin sensitivity. Iqwinder's result of 0.74 is well within the optimal range and is a genuinely surprising positive at a BMI of 35.1. It means her body needs very little insulin to maintain normal blood sugar, and true insulin resistance has not yet developed. This is the strongest metabolic positive in the report and represents an important window of opportunity.","low_causes":"Insulin sensitivity, low-carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5071","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose is derived from the HbA1c and represents the average blood sugar over the past two to three months. Iqwinder's estimated average glucose of 7.1 is marginally above the upper limit of 7, driven by her HbA1c of 43. As discussed, iron deficiency anaemia artificially elevates HbA1c, so the true average glucose is likely lower. Her fasting glucose of 4.2 supports this interpretation.","low_causes":"Low HbA1c, haemolytic anaemia","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"TyG Index is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"110","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2222","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Iqwinder's result of 110 is below the female lower limit of 120, confirming anaemia. At this level, the blood's oxygen-carrying capacity is reduced, which directly explains her fatigue, afternoon energy crashes, and low mood. The small, pale red cells (MCV 66.8, MCH 22.3) confirm this is iron deficiency anaemia, the most common type in women of menstruating age.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.93","within_normal":"FALSE","within_optimal":"FA key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"17.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8806","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"%","description":"RDW measures the variation in size among red blood cells. A high value means the marrow is producing cells of very inconsistent sizes. Iqwinder's result of 17.1 is well above the upper limit of 14, which is a hallmark of iron deficiency anaemia. The marrow is producing a mix of old, normal-sized cells alongside new, abnormally small iron-depleted cells. This will normalise as iron stores recover.","low_causes":"Rarely clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemias, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"66.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0333","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of red blood cells. Iqwinder's result of 66.8 is well below the lower limit of 83, meaning her red blood cells are significantly smaller than normal. This is the defining feature of microcytic anaemia, and iron deficiency is by far the most common cause. Her Mentzer index of 13.5 (above 13) confirms the pattern is consistent with iron deficiency rather than thalassaemia trait, which is important to distinguish in someone of South Asian heritage where thalassaemia trait is more prevalent.","low_causes":"Iron deficiency, thalassaemia trait, chro
