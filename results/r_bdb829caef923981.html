r limit of 3. A mildly elevated lymphocyte count can occur with chronic inflammation, recent minor infection, or as a normal variant. At this margin, it is not a concern in itself but is consistent with the raised inflammatory markers seen elsewhere in the report.","low_causes":"Viral infections (acutely), HIV, autoimmune conditions, medications, stress","high_causes":"Chronic inflammation, viral infections, autoimmune conditions, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf pathogens and dead cells and present them to the immune system. Iqwinder's result of 0.43 is within the healthy range.","low_causes":"Bone marrow suppression, medications","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Iqwinder's result of 0.26 is within the healthy range, with no sign of allergic activation or parasitic infection.","low_causes":"Acute stress, corticosteroid use","high_causes":"Allergic conditions, parasitic infections, autoimmune diseases, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and play a role in allergic responses and inflammation. Iqwinder's result of 0.03 is within the normal range.","low_causes":"Acute allergic reactions, medications","high_causes":"Allergic conditions, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4983","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly released red blood cells. Their proportion tells us how actively the bone marrow is producing new cells. Iqwinder's result of 1.49 percent is within the normal range. In iron deficiency, the reticulocyte count may not rise as much as expected because the marrow lacks the iron needed to produce fully formed cells. Once iron is replaced, a rise in reticulocytes would confirm the marrow is responding.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression","high_causes":"Blood loss, haemolytic anaemia, response to iron or B12 replacement","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"73.457","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4897","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells being produced per litre. Iqwinder's result of 73.5 is within the normal range. This suggests the bone marrow is producing cells at a normal rate, but the cells it produces are small and poorly loaded with haemoglobin due to insufficient iron supply.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow failure","high_causes":"Haemolytic anaemia, acute blood loss, response to treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"13.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3353","lower_normal":"13","upper_normal":"99","lower_optimal":"13","upper_optimal":"99","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"index","description":"The Mentzer index (MCV divided by red blood cell count) helps distinguish between iron deficiency anaemia and thalassaemia trait, both of which produce small red blood cells. A value above 13 favours iron deficiency, while below 13 favours thalassaemia trait. Iqwinder's index of 13.5 sits above the threshold, supporting iron deficiency as the primary cause of her microcytic anaemia. This is an important distinction in someone of South Asian heritage, where beta-thalassaemia trait is more common.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1825","lower_normal":"2","upper_normal":"","lower_optimal":"3","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"index","description":"Reticulocyte Production Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Haematocrit, which sits outside the ideal range.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, the erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a tube over one hour. A faster rate indicates more inflammation because inflammatory proteins in the blood cause red cells to clump and settle faster. Iqwinder's ESR of 28 is well above the upper limit of 12, indicating significant inflammation. At a BMI of 35.1, adipose tissue is the most likely source, producing inflammatory cytokines that drive both ESR and CRP upward. Iron deficiency anaemia itself can also raise ESR because the altered red cell shape affects sedimentation. Weight loss and iron correction should both help bring this down.","low_causes":"Polycythaemia, sickle cell disease, low fibrinogen","high_causes":"Obesity, inflammation, infection, autoimmune disease, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is a protein produced by the liver in response to inflammation anywhere in the body. It is one of the most useful markers for chronic low-grade inflammation and cardiovascular risk. Iqwinder's result of 10 is above the upper limit of 5 and well above the ideal of below 1.0. At a BMI of 35.1, this is most likely driven by adipose tissue inflammation. CRP at this level independently increases cardiovascular risk and is one of the markers driving her PhenoAge four years above her calendar age. Weight loss is the most effective way to bring CRP down.","low_causes":"No inflammation, good metabolic health","high_causes":"Obesity, infection, chronic inflammation, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"10.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1810","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3955","upper_optimal_position":"0.5286","units":"%","description":"Transferrin saturation tells us what proportion of the body's iron-carrying protein (transferrin) is actually loaded with iron. Iqwinder's result of 10.08 percent is well below the lower limit of 18, meaning barely a tenth of her transport capacity is being used. This is a key diagnostic marker for iron deficiency and confirms that her body's iron supply is severely depleted. The ideal range is 25 to 40 percent.","low_causes":"Iron deficiency, chronic disease, vegetarian diet, blood loss","high_causes":"Haemochromatosis, iron overload, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"10","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3489","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3800","upper_optimal_position":"0.5822","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. Iqwinder's result of 10 is just above the lower limit of 9, placing it at the very floor of the range. Serum iron fluctuates through the day and with meals, but in the context of her other iron markers all pointing to deficiency, this low-normal value confirms the picture.","low_causes":"Iron deficiency, chronic disease, vegetarian diet, malabsorption","high_causes":"Haemochromatosis, liver disease, excessive supplementation, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"3.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7051","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3846","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream. The liver produces more transferrin when iron stores are low, trying to capture every available iron molecule. Iqwinder's result of 3.95 is above the upper limit of 3.8, confirming that her body is responding to iron deficiency by increasing its iron-transport capacity. This will normalise once iron stores are replenished.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"92.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8472","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5813","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron. A high value means there is a lot of empty iron-carrying capacity, which is a hallmark of iron deficiency. Iqwinder's result of 92.5 is well above the upper limit of 76.1, confirming significant iron depletion. This is the mirror image of her low transferrin saturation and will normalise with iron replacement.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3369","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4399","upper_optimal_position":"0.8312","units":"ng/ml","description":"Ferritin is the body's iron storage protein, and its level reflects how much iron is held in reserve. Iqwinder's result of 11 is technically within the laboratory range of 10 to 291, but functionally this represents depleted stores. For a woman of 42, ferritin below 30 is associated with fatigue, and below 50 is considered suboptimal. At 11, her body has almost no iron reserve left, and this is the root cause of her anaemia. The ideal range for women is 40 to 150. Iron replacement should aim to bring ferritin above 50 at minimum.","low_causes":"Iron deficiency, vegetarian diet, blood loss, malabsorption, heavy menstruation","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"mmol/L","description":"Sodium is the primary electrolyte that regulates fluid balance and blood pressure. Iqwinder's result of 141 is within the ideal range, indicating well-regulated fluid balance.","low_causes":"Excess fluid intake, heart failure, kidney disease, medications","high_causes":"Dehydration, excess salt intake, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"104","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. Iqwinder's result of 104 is within the ideal range.","low_causes":"Vomiting, metabolic alkalosis, excess fluid","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"16.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is one of the body's main buffers for maintaining blood pH in the correct range. Iqwinder's result of 16.3 is below the lower limit of 20, suggesting a mild metabolic acidosis. This means the blood is slightly more acidic than it should be. Possible causes include the chronic inflammatory state (CRP 10), the iron deficiency anaemia, or dietary factors. Her GP should assess this clinically and may wish to perform a venous blood gas if she reports any symptoms such as breathlessness, nausea, or unusual fatigue beyond what the anaemia explains.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, medications","high_causes":"Metabolic alkalosis, vomiting, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pot","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for nerve signalling, muscle contraction, and heart rhythm. Iqwinder's result of 5.1 is within the laboratory range but sitting near the upper limit of 5.3. The laboratory noted that potassium can be falsely elevated if the sample is delayed in transit or left on the cells, which is common with posted blood samples. A vegetarian diet rich in potassium-containing foods may also contribute. This is not a concern at this level but her GP should be aware for context.","low_causes":"Vomiting, diarrhoea, medications, excessive sweating","high_causes":"Sample delay artefact, kidney disease, medications, acidosis, excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3600","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. Iqwinder's result of 3.1 is marginally below the lower limit of 3.2. Low urea is common in vegetarian diets because plant proteins produce less urea than animal proteins. At this margin, it has no clinical significance.","low_causes":"Low protein diet, vegetarian diet, liver disease, overhydration","high_causes":"Dehydration, kidney disease, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3905","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. Iqwinder's result of 56 is within the healthy range. Creatinine tends to be lower in people with less muscle mass and in vegetarians, which fits her profile.","low_causes":"Low muscle mass, vegetarian diet, pregnancy","high_causes":"Kidney disease, dehydration, high protein diet, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from the creatinine level. A value above 90 is considered normal. Iqwinder's creatinine-based eGFR is reported as above 90, which is reassuring. However, Cystatin C provides a more reliable estimate at higher BMI, and that gives a somewhat lower figure of 84, so both are considered in this report.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"Low muscle mass (creatinine-based estimate may overestimate in this case)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cgfr","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from Cystatin C, a protein filtered by the kidneys that is not affected by muscle mass, making it more reliable than creatinine-based eGFR in people with a higher BMI. Iqwinder's result of 84 is above the normal threshold of 60 but below the optimal threshold of 90. This suggests mild kidney strain, most likely related to her BMI and inflammatory load. It is not in the concerning range but is worth monitoring on retest.","low_causes":"Kidney disease, inflammation, obesity, ageing","high_causes":"Thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"330","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5524","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. Iqwinder's result of 330 is within the laboratory range but slightly above the female optimal upper limit of 320. Elevated uric acid is associated with metabolic syndrome, insulin resistance, and gout, though her level is not high enough to be a concern. Maintaining good hydration and reducing sugary foods will help keep it in check.","low_causes":"Low purine diet, medications","high_causes":"Obesity, high purine diet, kidney disease, metabolic syndrome, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5273","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all cells in the body and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate kidney marker at higher BMI. Iqwinder's result of 1.16 is above the upper limit of 1.1, suggesting her kidneys are filtering slightly less efficiently than ideal. The most likely cause at 42 with a BMI of 35.1 is the metabolic and inflammatory burden of excess weight. This should improve with weight loss and will be rechecked on retest.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Reduced kidney function, obesity, inflammation, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C to estimate kidney filtration rate, providing the most reliable single measure of kidney function. Iqwinder's combined eGFR of 84 is above the normal threshold of 60 but below the optimal of 90. At 42, this is mildly below where it should be and is most likely related to her BMI and chronic inflammatory load. Weight loss should improve this. It will be rechecked on retest.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Low muscle mass, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"55.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4189","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal (dehydration, heart failure) and intrinsic kidney causes of abnormal kidney function. Iqwinder's ratio of 55.4 is within the ideal range, suggesting no pre-renal component to her mildly reduced eGFR.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total al_position":"0.5926","units":"g/L","description":"Globulin includes antibodies and other proteins involved in immune function and inflammation. Iqwinder's result of 34 is within the laboratory range but above the optimal upper limit of 32. A mildly elevated globulin is consistent with her raised inflammatory markers (CRP 10, ESR 28) and is likely driven by the same chronic inflammatory process. Not a concern in itself.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"114","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6381","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver, bones, and other tissues. It can be elevated in liver or bone conditions. Iqwinder's result of 114 is within the laboratory range but near the upper limit of 116 and above the optimal of 100. In the context of normal calcium, phosphate, and PTH, this is unlikely to reflect bone disease. It may be related to her vitamin D deficiency, as low vitamin D can mildly elevate ALP through its effects on bone metabolism. This should be rechecked after vitamin D correction.","low_causes":"Hypothyroidism, zinc deficiency, anaemia","high_causes":"Liver disease, bone disease, vitamin D deficiency, pregnancy, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_norm ptimal_position":"0.5104","units":"IU/L","description":"AST is an enzyme found in the liver, heart, and muscles. It rises when these tissues are damaged. Iqwinder's result of 41 is within the laboratory range but above the optimal of 30. In the context of her raised ALT and GGT, this is consistent with mild liver strain related to her BMI. The De Ritis ratio (AST:ALT) of 1.05 is within the normal range, suggesting the elevation is metabolic rather than progressive liver disease.","low_causes":"B6 deficiency, uraemia","high_causes":"Fatty liver, liver disease, muscle damage, heart attack, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6184","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to metabolic stress, fatty liver, and alcohol. Iqwinder drinks no alcohol, so that is excluded as a cause. Her GGT of 47 is above the female upper limit of 38, and combined with her ALT of 39 (above female optimal), this suggests the liver is under mild metabolic strain. At a BMI of 35.1, the most likely explanation is non-alcoholic fatty liver. The good news is that the FIB-4 and APRI scores show no scarring, and GGT responds well to weight loss and dietary improvement.","low_causes":"Rarely significant","high_causes":"Fatty liver, obesity, metabolic syndrome, medications, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"DIGESTIVE","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.33333333 n":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions including energy production, muscle function, and nerve signalling. Iqwinder's result of 1.05 is at the very top of the optimal range, which is excellent. Adequate magnesium supports sleep quality and stress resilience, both of which are priorities for her.","low_causes":"Poor diet, alcohol, medications, diabetes, malabsorption","high_causes":"Kidney disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1200","lower_normal":"50","upper_normal":"175","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4667","upper_optimal_position":"0.5867","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, and energy. It is produced in the skin from sunlight and obtained from oily fish, eggs, and fortified foods. Iqwinder's level of 18 is classified as deficient (below 30) and far below the optimal range of 75 to 120. Two factors explain the severity: South Asian skin pigmentation produces less vitamin D from sunlight, and at a BMI of 35.1, fat tissue sequesters vitamin D, reducing the amount available in the blood. At this level, bone health is at risk long-term, and immune function and mood are compromised. She needs aggressive supplementation at 4,000 IU daily, taken with a fat-containing meal, and her GP may consider a loading dose.","low_causes":"Limited sunlight, darker skin pigmentation, obesity, malabsorption, inadequate diet","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3922","upper_optimal_position":"0.5720","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate balance. When vitamin D is very low, PTH typically rises to maintain calcium levels by pulling calcium from bones. Iqwinder's PTH at 1.9 is within the ideal range, which is reassuring as it means secondary hyperparathyroidism has not yet developed. However, if vitamin D remains this low for an extended period, PTH will eventually rise and bone density will suffer.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"192","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3312","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.7224","upper_optimal_position":"0.9294","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, DNA synthesis, and red blood cell production. It is found almost exclusively in animal products, which makes vegetarians vulnerable to deficiency. Iqwinder's result of 192 is just below the lower limit of 193 and well below the optimal range of 500 to 900. At this level, B12 deficiency may be contributing to her fatigue, low mood, and brain fog. Sublingual methylcobalamin 1,000 mcg daily is recommended, as the sublingual route bypasses any absorption issues in the gut.","low_causes":"Vegetarian/vegan diet, malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and neural tube development. It is found in green leafy vegetables, legumes, and fortified foods. The laboratory returned Iqwinder's result as insufficient, meaning the level was too low to quantify accurately. This is consistent with her diet of fewer than one portion of vegetables and fruit a day. Folate deficiency, alongside her B12 and iron deficiencies, may be contributing to her fatigue and low mood. Methylfolate supplementation is recommended.","low_causes":"Poor vegetable and fruit intake, malabsorption, alcohol, pregnancy, medications","high_causes":"Supplementation, excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6285","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol-carrying particles in the blood, including LDL, HDL, and VLDL. Iqwinder's result of 6.5 is above the desirable limit of 5.18. While total cholesterol is a crude measure, the breakdown into LDL and HDL is more informative. Her elevated total is driven primarily by her LDL of 4.2, as her HDL of 1.8 is excellent.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3647","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily influenced by carbohydrate intake, alcohol, and excess body weight. Iqwinder's result of 1.24 is within the laboratory range of below 1.7 but above the optimal of below 1.0. At a BMI of 35.1, triglycerides below 1.7 is a reasonable result, and reducing refined carbohydrates and sugary foods should bring this into the optimal range.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism","high_causes":"Excess carbohydrate, alcohol, obesity, metabolic syndrome, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to tissues. Iqwinder's calculated VLDL of 0.56 is within the ideal range, consistent with her reasonable triglyceride level.","low_causes":"Low triglycerides, fasting bohydrates. Increasing soluble fibre (oats, lentils, beans) and reducing saturated fat are the most effective dietary interventions.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption, medications","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4011","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4222","units":"","description":"The total cholesterol to HDL ratio gives a quick snapshot of cardiovascular risk by comparing total cholesterol against the protective HDL fraction. Iqwinder's ratio of 3.61 is within the desirable range of below 4.5, pulled down by her excellent HDL of 1.8. This is a positive finding, but the ApoB provides a more accurate particle count and that remains elevated.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"27.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is protective HDL. Iqwinder's HDL makes up 27.69 percent of her total cholesterol, above the desirable threshold of 20 percent and above the optimal of 25 percent. This is a healthy ratio.","low_causes":"Obesity, sedentary lifestyle, metabolic syndrome","high_causes":"Exercise, healthy diet, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus the protective HDL, giving a single number for all the atherogenic (artery-damaging) particles. Iqwinder's result of 4.7 is above the target of below 4.0 and above the optimal of below 3.4. This confirms the elevated particle count seen in her ApoB and LDL.","low_causes":"Low LDL, low triglycerides","high_causes":"High LDL, high triglycerides, diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.575","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the number of protective cholesterol particles. Iqwinder's result of 1.61 is above the desirable threshold of 1.4, consistent with her excellent HDL level. This is a positive finding.","low_causes":"Sedentary lifestyle, metabolic syndrome, obesity, smoking","high_causes":"Exercise, healthy diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single most important marker of cardiovascular risk in this panel. Each LDL, VLDL, and Lp(a) particle carries exactly one ApoB molecule, so it gives a direct count of all the particles that can enter the artery wall and deposit cholesterol. Iqwinder's result of 1.37 is well above the desirable limit of 0.9 and the optimal of below 0.8, meaning she has roughly 70 percent more atherogenic particles than ideal. Combined with her CRP of 10, this means both the particle number and the inflammatory environment that accelerates atherosclerosis are elevated. Dietary changes, specifically reducing saturated fat and increasing soluble fibre, are the first-line approach.","low_causes":"Low LDL, medications (statins)","high_causes":"Diet high in saturated fat, genetic hyperlipidaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective particles in a single number. Iqwinder's ratio of 0.85 is above the higher-risk threshold of 0.8, indicating the balance has tipped toward risk. For context, the female lower-risk threshold is below 0.6. This ratio is driven by her elevated ApoB and will improve as LDL comes down with dietary changes.","low_causes":"Good lipid balance, high HDL","high_causes":"High LDL/ApoB, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipop const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
