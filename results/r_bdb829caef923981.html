Reticulocytes Absolute","group":"HEMATOLOGY","result":"73.457","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4897","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"This is the absolute count of reticulocytes per litre of blood, giving a more precise measure than the percentage. Iqwinder's absolute reticulocyte count is 73.5, within the normal range of 50 to 100. This confirms that the bone marrow is producing red blood cells at a normal rate; the problem is not production capacity but the raw material (iron) needed to build them.","low_causes":"Iron deficiency (severe), bone marrow suppression, nutritional deficiency","high_causes":"Active blood loss, haemolytic anaemia, response to iron or B12 replacement","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"13.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3353","lower_normal":"13","upper_normal":"99","lower_optimal":"13","upper_optimal":"99","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"index","description":"The Mentzer index divides MCV by the red blood cell count. A value below 13 favours thalassaemia trait, while above 13 favours iron deficiency as the cause of microcytic anaemia. Iqwinder's Mentzer index is 13.5, sitting just above the threshold and favouring iron deficiency. However, given her South Asian heritage and the very low MCV of 66.8, the GP should consider a haemoglobin electrophoresis to exclude coexisting thalassaemia trait, as the two conditions can overlap.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1825","lower_normal":"2","upper_normal":"","lower_optimal":"3","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"index","description":"Reticulocyte Production Index is calculated from your measured results. It sits outside the ideal range. It is being driven by Haemoglobin, which sits outside the ideal range.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle in a tube over one hour, which rises when there is inflammation or changes in blood protein composition. Iqwinder's ESR is 28, well above the upper limit of 12. ESR is influenced by several factors in her case: the iron deficiency anaemia itself (smaller, lighter cells can settle differently), the raised CRP indicating inflammation, and her globulin level. In this context, the elevated ESR is consistent with the iron deficiency and inflammatory picture rather than introducing a separate concern.","low_causes":"Polycythaemia, sickle cell disease, very low fibrinogen","high_causes":"Anaemia, inflammation, infection, autoimmune disease, obesity, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"10.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0908","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5171","units":"%","description":"Transferrin saturation shows what percentage of the body's iron-carrying capacity is actually loaded with iron. Think of transferrin as a fleet of delivery trucks: this number tells you how full those trucks are. Iqwinder's transferrin saturation is just 10.08%, below the lower limit of 18% and well below the optimal range of 25 to 40%. This means the body has plenty of iron transport capacity (transferrin is elevated) but almost no iron to load onto it. This is one of the most important markers confirming significant iron deficiency.","low_causes":"Iron deficiency, chronic disease, malabsorption, vegetarian diet, menstrual loss","high_causes":"Haemochromatosis, iron overload, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"10","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3489","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3474","upper_optimal_position":"0.5816","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the sample. Iqwinder's serum iron is 10, just above the lower limit of 9 but well below the optimal range of 12 to 25. Serum iron fluctuates throughout the day and with meals, so it is less reliable than ferritin and transferrin saturation for assessing iron status, but in her case it adds to the consistent picture of iron depletion.","low_causes":"Iron deficiency, chronic disease, malabsorption, vegetarian diet","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7436","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is a protein made by the liver to transport iron through the blood. When the body is low on iron, the liver produces more transferrin to try to capture whatever iron is available. Iqwinder's transferrin is 3.95, above the upper limit of 3.8. This elevated transferrin is a direct response to iron deficiency and confirms that her body is actively trying to compensate for the shortfall.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"92.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8506","lower_normal":"44","upper_normal":"76.1","lower_optimal":"44","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6143","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind iron. It rises when iron stores are low because the body produces more transferrin. Iqwinder's TIBC is 92.5, well above the upper limit of 76.1. This is one of the clearest signs of iron deficiency: the body has ramped up its capacity to carry iron because there is so little iron available. Together with a low ferritin, low transferrin saturation, and elevated transferrin, this confirms significant iron depletion.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3369","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4401","upper_optimal_position":"0.5313","units":"ng/mL","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. Iqwinder's ferritin is 11, just above the laboratory lower limit of 10 but functionally depleted. For a menstruating woman, optimal ferritin is above 40, and below 30 is considered deficient by most guidelines regardless of the laboratory range. At 11, her iron reserves are essentially empty. Ferritin is also an acute phase protein that rises with inflammation, so the CRP of 10 may actually be propping up the ferritin: the true stores may be even lower than 11 suggests. This needs to be corrected with supplementation and dietary changes.","low_causes":"Iron deficiency, vegetarian diet, heavy menstruation, malabsorption, chronic blood loss","high_causes":"Iron overload, inflammation, infection, liver disease, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is the main electrolyte that controls fluid balance outside cells and is essential for nerve and muscle function. Iqwinder's sodium is 141, within both the normal and optimal range. This is healthy.","low_causes":"Excess water intake, heart failure, kidney disease, medications, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is an electrolyte essential for heart rhythm, muscle contraction, and nerve signalling. Iqwinder's potassium is 5.1, within the laboratory range of 3.5 to 5.3 but above the optimal range of 3.8 to 5.0. The laboratory notes that potassium can rise in delayed or stored samples, so this mildly elevated result may reflect sample handling rather than a true elevation. It is not a concern but is worth noting.","low_causes":"Diuretics, vomiting, diarrhoea, excess sweating","high_causes":"Delayed sample processing, kidney disease, acidosis, medications, excess intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"104","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works with sodium to maintain fluid balance and acid-base status. Iqwinder's chloride is 104, within both the normal and optimal range. This is healthy.","low_causes":"Vomiting, metabolic alkalosis, excess sweating","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"16.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, keeping blood pH in a safe range. Iqwinder's bicarbonate is 16.3, below the lower limit of 20, indicating a mild metabolic acidosis. This means there is more acid in the blood than normal. Possible causes include the metabolic effects of excess weight, the kidney working harder than ideal (cystatin C eGFR 84), or gastrointestinal bicarbonate losses. The GP should review this alongside the kidney function and consider repeating both.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Vomiting, dehydration, medications (diuretics), metabolic alkalosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2600","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. Iqwinder's urea is 3.1, marginally below the lower limit of 3.2. On a vegetarian diet with lower protein intake, a low urea is expected and is not a concern. It simply reflects that less protein is being broken down.","low_causes":"Low protein diet, vegetarian diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3902","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. It is used to estimate kidney function. Iqwinder's creatinine is 56, within both the normal and optimal range. However, creatinine can underestimate kidney impairment in people with less muscle mass or higher body fat, which is why cystatin C is a more reliable marker in her case.","low_causes":"Low muscle mass, pregnancy, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood. Iqwinder's creatinine-based eGFR is reported as above 90, which is normal. However, at a BMI of 35 with low muscle mass and no exercise, creatinine can underestimate kidney impairment. The cystatin C-based eGFR of 84 provides a more accurate picture in her case.","low_causes":"Kidney disease, dehydration, medications, obstruction","high_causes":"Pregnancy, high cardiac output (rare)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5273","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all cells in the body at a constant rate and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate measure of kidney function in people who are sedentary or carry excess weight. Iqwinder's cystatin C is 1.16, above the upper limit of 1.1, giving a cystatin C-based eGFR of 84. At 42 with no kidney disease or diabetes, this is mildly below the optimal threshold of 90. CRP of 10 can transiently raise cystatin C, so a repeat when the inflammation has settled will give a true baseline.","low_causes":"Hyperthyroidism, steroid use (rare)","high_causes":"Reduced kidney function, inflammation (transient), hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This is the estimated glomerular filtration rate calculated from cystatin C rather than creatinine. Iqwinder's cystatin C eGFR is 84, above 60 (the threshold for chronic kidney disease) but below the optimal threshold of 90. At 42, this is mildly below ideal. The raised CRP of 10 may be transiently elevating cystatin C and suppressing this number, so a repeat after the inflammation has settled is recommended.","low_causes":"Kidney disease, dehydration, inflammation, medications","high_causes":"Pregnancy, hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"330","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5524","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3181","upper_optimal_position":"0.5181","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. Iqwinder's uric acid is 330, within the laboratory range of 184 to 464 but above the female optimal range of 160 to 320. Mildly elevated uric acid is associated with metabolic syndrome, insulin resistance, and cardiovascular risk. At her weight, some elevation is expected, and it should improve with weight loss and increased fruit and vegetable intake.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"Obesity, high purine diet, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR uses both creatinine and cystatin C to estimate kidney filtration, providing the most accurate single measure of kidney function. Iqwinder's combined eGFR is 84, above the chronic kidney disease threshold of 60 but below the optimal of 90. At 42, this is mildly below ideal. The elevated CRP of 10 may be transiently raising cystatin C and suppressing this number. A repeat after the inflammation settles will confirm whether this reflects a true baseline or a temporary dip.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"55.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4189","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio helps distinguish between pre-renal (dehydration, low protein intake) and renal causes of abnormal kidney markers. Iqwinder's ratio is 55.4, within both the normal and optimal range. This is consistent with normal kidney function and adequate hydration.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"10","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP (C-reactive protein) is a marker of systemic inflammation produced by the liver. Iqwinder's CRP is 10, above the laboratory upper limit of 5 and well above the optimal target of below 1.0. At a BMI of 35, some chronic low-grade inflammation is expected because fat tissue produces inflammatory signals, but 10 is higher than BMI alone typically explains. A minor infection, illness around the time of the test, or the metabolic burden of iron deficiency and nutritional gaps may be contributing. This should be repeated in three months. Sustained elevation above 3 is associated with increased cardiovascular risk.","low_causes":"Good health, anti-inflammatory diet, exercise, statin therapy","high_causes":"Obesity, infection, chronic inflammation, autoimmune disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"11.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1643","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA-125 is a protein that can be elevated in ovarian cancer but also rises with menstruation, endometriosis, fibroids, and pelvic inflammation. Iqwinder's CA-125 is 11.5, well within the normal range of below 35. This is reassuring.","low_causes":"","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, menstruation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"25.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4268","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"U/mL","description":"CA 15-3 is a protein used primarily to monitor breast cancer treatment response. It is not a screening test for breast cancer. Iqwinder's CA 15-3 is 25.61, within the laboratory range of below 30. This is reassuring.","low_causes":"","high_causes":"Breast cancer, ovarian cancer, liver disease, benign breast conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6253","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. Iqwinder's total protein is 78, within both the normal and optimal range. This reflects adequate protein synthesis by the liver and a balanced immune system.","low_causes":"Liver disease, kidney disease (protein loss), malabsorption, malnutrition","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6042","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins, and medications, and maintains fluid balance. Iqwinder's albumin is 44, within both the normal and optimal range. This indicates good liver synthetic function and nutritional status.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin includes a mix of immune and transport proteins. Iqwinder's globulin is 34, within the laboratory range of 18 to 36 but above the optimal range of 20 to 32. A globulin at the higher end often reflects immune activation or chronic inflammation, which is consistent with her elevated CRP of 10.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic inflammation, infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"114","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6619","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver, bone, and bile ducts. Iqwinder's ALP is 114, within the laboratory range of 46 to 116 but above the optimal range. In a 42-year-old woman with vitamin D deficiency, a mildly elevated ALP can reflect increased bone turnover as the body tries to maintain calcium and phosphate balance. The corrected calcium and phosphate are both within range, and the PTH is normal, which is reassuring. Correcting the vitamin D deficiency should help bring the ALP down.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bone disease, vitamin D deficiency, liver disease, bile duct obstruction, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. It is processed by the liver and excreted in bile. Iqwinder's bilirubin is 7, within both the normal and optimal range. This is healthy and shows the liver is clearing bilirubin normally.","low_causes":"Not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3482","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or stressed. The laboratory range goes up to 56, but for women, a level above 25 suggests the liver is under some strain. Iqwinder's ALT is 39, within the laboratory range but above the female optimal of 25. This mild elevation, alongside the GGT of 47, suggests metabolic strain on the liver from carrying excess weight. There is no evidence of liver scarring (FIB-4 0.76, APRI 0.282), and this is expected to improve with weight loss.","low_causes":"Normal liver function, B6 deficiency","high_causes":"Fatty liver disease, obesity, medications, viral hepatitis, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4063","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5104","units":"IU/L","description":"AST is an enzyme found in the liver, heart, and muscles. Iqwinder's AST is 41, within the laboratory range of 13 to 45 but above the optimal range. AST is less specific to the liver than ALT and can rise from muscle damage, but in the context of an elevated ALT and GGT and no exercise to explain muscle release, this is consistent with the liver carrying metabolic strain from excess weight. The De Ritis ratio (AST:ALT) is 1.05, within the optimal range, which is reassuring and does not suggest advanced liver disease.","low_causes":"Normal liver function, B6 deficiency","high_causes":"Fatty liver disease, muscle damage, heart disease, medications, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6184","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is sensitive to metabolic stress, bile duct problems, and alcohol. Iqwinder's GGT is 47, above the female upper limit of 38 and above the optimal of 25. She does not drink alcohol, so this elevation is most likely driven by metabolic fatty liver disease associated with her BMI of 35. GGT is one of the earliest enzymes to rise with fatty liver and is expected to improve with weight loss and dietary improvement.","low_causes":"Normal liver function","high_causes":"Fatty liver disease, obesity, alcohol, bile duct disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4811","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that digests starch. Iqwinder's amylase is 69, within both the normal and optimal range. This shows the pancreas is functioning normally.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5106","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6238","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. Iqwinder's lipase is 49, within both the normal and optimal range. Together with the normal amylase, this confirms healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5491","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3737","upper_optimal_position":"0.6099","units":"mmol/L","description":"Calcium is essential for bones, teeth, nerve signalling, muscle contraction, and blood clotting. Iqwinder's calcium is 2.53, within both the normal and optimal range. This is reassuring, particularly given her severe vitamin D deficiency, because it shows the body is maintaining calcium levels adequately for now, with PTH at a normal level.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium value for the albumin level, giving a more accurate picture of the biologically active calcium in the blood. Iqwinder's corrected calcium is 2.48, within both the normal and optimal range. This confirms that calcium balance is well maintained despite her vitamin D deficiency.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6092","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3471","upper_optimal_position":"0.6092","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bones and teeth, and it plays a role in energy production. Iqwinder's phosphate is 1.5, within both the normal and optimal range. This is healthy.","low_causes":"Hyperparathyroidism, vitamin D deficiency (severe), refeeding syndrome, antacids","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6322","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle relaxation, and sleep quality. Iqwinder's serum magnesium is 1.05, at the top of both the normal and optimal range. This is a good result, though serum magnesium does not fully reflect intracellular stores. Given her sleep quality (slow to get going) and fatigue, magnesium glycinate supplementation may still benefit her.","low_causes":"Poor diet, alcohol, diarrhoea, medications (proton pump inhibitors, diuretics)","high_causes":"Kidney disease, excess supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is produced in the skin in response to sunlight and is essential for bone health, immune function, mood regulation, and muscle strength. Iqwinder's vitamin D is 18, falling into the deficient category (below 30). Optimal is above 75. Several factors contribute: South Asian skin pigmentation reduces vitamin D synthesis from sunlight, the UK has limited UVB light for much of the year, her BMI of 35 means fat tissue sequesters vitamin D, and her sedentary indoor lifestyle limits sun exposure. Vitamin D deficiency contributes to fatigue, low mood, muscle weakness, and increased susceptibility to infection. This needs correcting with a higher-dose loading regimen given her BMI.","low_causes":"Lack of sunlight, dark skin pigmentation, obesity, malabsorption, indoor lifestyle","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4117","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels by controlling how much calcium the bones release, how much the kidneys retain, and how much vitamin D the kidneys activate. Iqwinder's PTH is 1.9, within both the normal and optimal range. In the context of her vitamin D deficiency (18), it is reassuring that PTH has not risen to compensate. However, if the vitamin D remains uncorrected, PTH may eventually rise to pull calcium from the bones.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency (severe)","high_causes":"Vitamin D deficiency, primary hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"192","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3180","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4557","upper_optimal_position":"0.5817","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. It is found almost exclusively in animal products. Iqwinder's B12 is 192, just below the lower limit of 193 and well below the optimal range of 500 to 900. On a vegetarian diet that includes eggs and dairy, B12 intake is often insufficient because dairy and eggs provide lower amounts than meat and fish. B12 deficiency causes fatigue, brain fog, low mood, tingling in the extremities, and impaired red blood cell production. Combined with her iron deficiency, this is contributing to her anaemia and fatigue.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, atrophic gastritis, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ng/mL","description":"Folate (vitamin B9) is essential for cell division, red blood cell production, and DNA repair. It is found in green leafy vegetables, legumes, and fortified foods. The laboratory was unable to produce a result for Iqwinder's folate, returning it as insufficient. With only 0 to 1 portions of vegetables and fruit a day, a low folate would not be surprising. This should be repeated on a fresh sample, and in the meantime supplementation with methylfolate is a sensible precaution given the anaemia.","low_causes":"Low vegetable intake, malabsorption, coeliac disease, pregnancy, alcohol, medications","high_causes":"Supplementation, excess intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6274","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL (protective), LDL (potentially harmful), and VLDL. Iqwinder's total cholesterol is 6.5, above the desirable level of below 5.18. However, total cholesterol alone is a crude measure. What matters more is the breakdown: her HDL is excellent at 1.8, but her LDL and ApoB are elevated. The total cholesterol figure confirms there is work to do on the LDL side, but the high HDL is genuinely protective.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3647","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood that the body uses for energy. They rise after meals, with excess sugar and refined carbohydrate intake, and with insulin resistance. Iqwinder's triglycerides are 1.24, within the fasting target of below 1.7 but above the optimal target of below 1.0. At a BMI of 35 with some sugary food intake, this is a reasonable result and reflects her good insulin sensitivity. Reducing sugary food and refined carbohydrates should bring this into the optimal range.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"Excess sugar and refined carbs, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. Iqwinder's VLDL is 0.56, within both the normal and optimal range. This is consistent with her healthy triglyceride level and good insulin sensitivity.","low_causes":"Low fat diet, malnutrition","high_causes":"Excess carbohydrate intake, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8654","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from the arteries and returns it to the liver for disposal. Iqwinder's HDL is 1.8, well above the desirable level of 1.55 and above the female optimal of 1.6. This is an excellent result and is one of the genuine strengths in this report. A high HDL provides meaningful cardiovascular protection even when LDL is elevated.","low_causes":"Sedentary lifestyle, obesity, smoking, high sugar diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) carries cholesterol from the liver to the tissues. When there is too much, it deposits cholesterol in artery walls, forming plaques that narrow the arteries over time. Iqwinder's LDL is 4.2, above the upper target of 3.0 and well above the optimal of 2.6. This is the type of cholesterol that dietary changes can meaningfully reduce: increasing soluble fibre (oats, beans, lentils), reducing saturated fat (cheese, butter, cream, processed foods), and adding plant sterols. Her Lp(a) could not be measured, so the proportion that is genetically fixed is unknown.","low_causes":"Low fat diet, hyperthyroidism, malabsorption, statins","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4011","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The TC:HDL ratio divides total cholesterol by HDL. A lower ratio indicates a more favourable balance. Iqwinder's ratio is 3.61, within both the normal range of below 4.5 and the optimal range of below 4.0. This is a positive finding and reflects her excellent HDL of 1.8 partially offsetting the elevated total cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"27.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6923","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This shows what percentage of total cholesterol is the protective HDL type. Iqwinder's HDL makes up 27.69% of her total cholesterol, which is above both the minimum of 20% and the optimal of 25%. This is a good result and reflects the strength of her HDL.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, exercise, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol particles (LDL, VLDL, and remnants) in one number. Iqwinder's non-HDL is 4.7, above the target of below 4.0 and above the optimal of 3.4. This is driven by her elevated LDL. Non-HDL is considered a better predictor of cardiovascular risk than LDL alone because it includes triglyceride-rich particles.","low_causes":"Healthy diet, statins, hyperthyroidism","high_causes":"High saturated fat diet, obesity, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5750","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein on HDL particles. A higher ApoA1 means more functional HDL particles clearing cholesterol from the arteries. Iqwinder's ApoA1 is 1.61, above both the desirable level of 1.4 and the optimal of 1.5. This confirms the strength of her HDL system.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance","high_causes":"Exercise, healthy diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein carried on each LDL, VLDL, and Lp(a) particle. Because there is exactly one ApoB molecule per particle, this number is effectively a particle count. Iqwinder's ApoB is 1.37, in the high category (1.2 to 1.39) and well above both the desirable target of below 0.9 and the optimal target of below 0.8. ApoB is the single most accurate predictor of cardiovascular risk among the cholesterol markers. This is the number that needs to come down, and dietary changes, specifically increasing soluble fibre and reducing saturated fat, are the first step. If Lp(a) turns out to be elevated on repeat testing, some of these particles will be genetically driven, but the LDL component is modifiable.","low_causes":"Healthy diet, statins, hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio compares the number of potentially harmful cholesterol particles (ApoB) to the protective ones (ApoA1). It is one of the best summary measures of cardiovascular risk from cholesterol. Iqwinder's ratio is 0.85, above the lower risk target of below 0.6 and in the higher risk category (above 0.8). Although her ApoA1 is excellent, the elevated ApoB pushes this ratio up. Bringing the ApoB down through dietary changes will improve this ratio significantly.","low_causes":"Low LDL, high HDL, healthy diet","high_causes":"High LDL/ApoB, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"32","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Lp(a) is a genetically determined cholesterol particle that increases cardiovascular risk and cannot be changed by diet or lifestyle. The laboratory was unable to produce a result for Iqwinder's Lp(a). This is an important marker to have, because if it is elevated it means a portion of her raised LDL and ApoB is inherited and unchangeable, which affects the treatment strategy. It should be specifically requested on a repeat blood draw.","low_causes":"","high_causes":"Genetic inheritance (cannot be changed by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"155","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5810","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6238","units":"U/L","description":"CK (creatine kinase) is an enzyme released from muscles when they are damaged or stressed. Iqwinder's CK is 155, within both the normal range of 25 to 200 and the optimal range. This is unremarkable and confirms no muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, statin therapy, rhabdomyolysis, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"15.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5871","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It is converted into the active form, T3, in the tissues. Iqwinder's Free T4 is 15.7, within both the normal range of 11.5 to 22.7 and the optimal range of 14 to 20. This shows the thyroid is producing an adequate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, early thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4313","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3692","upper_optimal_position":"0.4882","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain to tell the thyroid how hard to work. A high TSH means the brain is asking the thyroid to produce more hormone (suggesting underactivity), while a low TSH means the brain is telling the thyroid to slow down (suggesting overactivity). Iqwinder's TSH is 1.79, sitting comfortably within the optimal range of 1.0 to 2.5. This is an excellent result and confirms the thyroid is functioning well.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroid underactivity, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4963","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4704","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that controls metabolism, energy, and temperature. Iqwinder's Free T3 is 4.8, within both the normal range and the optimal range of 4.5 to 6.5. This confirms the body is converting T4 into the active T3 adequately.","low_causes":"Hypothyroidism, sick euthyroid syndrome, calorie restriction, chronic illness","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as seen in Hashimoto's thyroiditis. Iqwinder's TPO antibodies are below 6.6, well within the normal range of below 13.8. This is negative, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2273","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies, like TPO antibodies, indicate autoimmune activity against the thyroid. Iqwinder's result is 2, well within the normal range of below 4.4. This is negative. Together with the negative TPO antibodies, this confirms no autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.306","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3:FT4 ratio shows how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Iqwinder's ratio is 0.306, within both the normal and optimal range. This confirms good thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"4.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0550","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a protein that can be elevated in pancreatic, gastrointestinal, and bile duct cancers. It is used for monitoring rather than screening. Iqwinder's CA 19-9 is 4.07, well within the normal range of below 37. This is reassuring.","low_causes":"","high_causes":"Pancreatic cancer, bile duct cancer, gallstones, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"<0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1087","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_o  The laboratory was unable to produce a result for Iqwinder, returning it as insufficient. With her very low fruit and vegetable intake (0 to 1 portions a day), a low antioxidant level would be expected. This should be repeated on a fresh sample. Increasing vegetable, fruit, and nut intake will improve this marker.","low_causes":"Low fruit and vegetable intake, poor diet, oxidative stress, smoking","high_causes":"High antioxidant diet, supplementation (vitamin C, E, selenium)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"280","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4273","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"170","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5816","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. Iqwinder's cortisol is 280, within both the morning reference range of 145 to 619 and the optimal range. This is a healthy level and does not suggest adrenal dysfunction. Her reported afternoon crash and wired-at-night pattern could reflect a cortisol rhythm that is flatter than ideal, but a single morning sample cannot confirm this. Morning light exposure and a fixed wake time will help anchor the rhythm.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Stress, Cushing's syndrome, medications (prednisolone), depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary oestrogen produced by the ovaries and plays a central role in reproductive function, bone health, cardiovascular protection, and mood. The laboratory was unable to produce a result, returning it as insufficient. In the context of a regular cycle with normal FSH, LH, and progesterone suggesting a luteal phase sample, the absence of this result is not alarming but is a gap. It can be repeated on a fresh sample if needed.","low_causes":"Menopause, low body fat, PCOS, pituitary dysfunction","high_causes":"Pregnancy, ovarian cysts, obesity, HRT, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"19.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"10.62","upper_optimal":"81.28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is produced after ovulation and is essential for maintaining the uterine lining and supporting early pregnancy. Iqwinder's progesterone is 19.63, within the luteal phase range of 10.62 to 81.28. This confirms she is in the luteal phase of her cycle and has ovulated, which is reassuring for reproductive function at 42.","low_causes":"Anovulation, luteal phase deficiency, perimenopause, PCOS","high_causes":"Pregnancy, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3516","lower_normal":"0.5","upper_normal":"16.9","lower_optimal":"0.5","upper_optimal":"16.9","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"LH is produced by the pituitary gland and triggers ovulation. During the luteal phase, LH falls to its lowest levels. Iqwinder's LH is 0.8, within the luteal phase range of 0.5 to 16.9. This is consistent with the luteal phase and a normal cycle. An LH this low in a post-menopausal range would be abnormal, but in the luteal phase it is expected. Her FSH is also low at 1.95, confirming she is not perimenopausal.","low_causes":"Luteal phase (normal), pituitary disease, anorexia, stress","high_causes":"Menopause, perimenopause, PCOS, ovulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"1.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3605","lower_normal":"1.5","upper_normal":"9.1","lower_optimal":"1.5","upper_optimal":"9.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"FSH stimulates the growth of ovarian follicles and oestrogen production. During the luteal phase, FSH is suppressed by the high progesterone. Iqwinder's FSH is 1.95, within the luteal phase range of 1.5 to 9.1. Importantly, this low FSH (well below the post-menopausal range of 23 to 116) confirms she is not perimenopausal. Her ovarian function is intact at 42.","low_causes":"Luteal phase (normal), pregnancy, PCOS, pituitary disease","high_causes":"Menopause, perimenopause, premature ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667", nary symptoms, this does not require treatment. Sensitivities have been reported for reference.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The NLR divides neutrophils by lymphocytes to give a snapshot of the balance between the innate (neutrophil) and adaptive (lymphocyte) immune systems. A ratio between 1 and 3 is normal, and below 2 is optimal. Iqwinder's NLR is 1.24, within both the normal and optimal range. This is reassuring, especially in the context of her elevated CRP, because a normal NLR suggests the inflammation is more likely chronic and metabolic (from weight) than from an acute infection or immune activation.","low_causes":"Lymphocyte predominance, viral infection, autoimmune disease","high_causes":"Acute infection, physiological stress, systemic inflammation, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"120.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4671","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The PLR is an inflammation marker that combines platelet and lymphocyte counts. Iqwinder's PLR is 120.2, within both the normal and optimal range. Despite her elevated CRP and ESR, this ratio is reassuring and does not suggest severe systemic inflammation.","low_causes": stance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3329","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II ratio divides LDL by HDL. A lower ratio indicates better cardiovascular protection. Iqwinder's ratio is 2.33, within both the normal range of below 3.5 and the optimal range of below 2.5. Despite her elevated LDL, the excellent HDL of 1.8 keeps this ratio in a good place. Reducing LDL through dietary changes will improve this further.","low_causes":"Low LDL, high HDL, healthy diet, statin therapy","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"agratio","name":"Albumin:Globulin Ratio","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4690","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The A:G ratio compares albumin to globulin. A low ratio can indicate liver disease, chronic inflammation, or immune overactivation. Iqwinder's A:G ratio is 1.29, within both the normal and optimal range. While her globulin is at the higher end (34), the albumin of 44 maintains a healthy ratio.","low_causes":"Liver disease, chronic inflammation, myeloma, nephrotic syndrome","high_causes":"Immune deficiency, high albumin (dehydration)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"0.76","wit       flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

  let markers = [];

  if (!markers.length) return null;

  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

function statusColor(s, st) {

  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1

    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
