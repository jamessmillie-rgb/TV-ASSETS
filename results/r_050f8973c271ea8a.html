<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Plamen Parvanov","dob":"13/03/1975","report_date":"2026-09-04","summary":"Plamen is a 51-year-old male presenting with a BMI of 29.9, following a low-carb, high-protein diet rated 6 out of 10 for quality with a volume of 9 out of 10. He trains seven times per week, four cardio sessions and three resistance sessions, but records fewer than 2,000 daily steps outside of structured exercise. He smokes tobacco and uses anabolic steroids or PEDs, and sleeps fewer than six hours on most nights. He reports bloating and digestive discomfort, low sex drive and libido, low energy and fatigue. His goals are to lose body fat, improve digestion and gut health, and balance hormones. His blood results carry one finding that warrants prompt discussion with his GP, several findings that are fully explained by exogenous testosterone use, and a handful of genuinely positive markers worth acknowledging.\n\nThe finding that needs GP attention first is the urine result. His urinary red blood cell count is 40 per microlitre, which is above the significance threshold of 25. At 51, isolated microscopic haematuria, meaning blood in the urine that is not visible to the naked eye, should be investigated. The most common explanations are benign: vigorous exercise, a urinary tract infection, or prostate-related causes. His bacterial culture and sensitivities are still pending, and if they come back showing infection, that may explain the finding entirely. However, until that is confirmed, the GP should be made aware so that the standard pathway, usually a repeat urinalysis and if persistent a referral for urological assessment, can be initiated. His PSA, the prostate-specific antigen used to screen for prostate disease, is reassuringly low at 1.63 against a threshold of 3.5, though his free-to-total PSA ratio at 18.4% sits just below the 19% cut-off. At this PSA level the ratio is less clinically meaningful, but it is worth noting for the GP record.\n\nThe second cluster of findings that should be discussed with his GP relates to his kidney markers. His Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of kidney function than creatinine alone, is 1.11, marginally above the 1.1 upper limit, and the eGFR calculated from it is 84, which sits below the 90 threshold that defines fully normal kidney function. His creatinine-based eGFR is above 90, but Cystatin C is less influenced by muscle mass and is generally the more accurate measure. An eGFR of 84 at 51 is only mildly reduced and may simply reflect normal age-related decline, but combined with a urea of 9.4, above the 8.2 upper limit, it suggests the kidneys are working a little harder than ideal. His very high protein intake, rated 9 out of 10 for volume on a high-protein diet, will increase urea production because urea is the waste product of protein metabolism. The combination of high dietary protein load, anabolic steroid use, smoking, and a BMI just under 30 could all contribute to mild kidney strain. This does not suggest kidney disease, but it does warrant a conversation with his GP about monitoring, and it argues against pushing protein intake any higher.\n\nNow for the positives, because there are genuine strengths in this blood work. His blood sugar control is excellent. Fasting glucose at 4.4 is within the optimal range of 4.0 to 5.4, and his HbA1c at 33 mmol per mol, which reflects average blood sugar over the preceding three months, is well below the 36 optimal ceiling. His C-Peptide, a marker of how much insulin the pancreas is producing, converts to approximately 390 pmol per litre, which is within the normal range and confirms adequate pancreatic output. His insulin result was returned as insufficient sample, so HOMA-IR and HOMA-B cannot be calculated, but the glucose and HbA1c together paint a reassuring picture of metabolic health. His liver is in good shape. ALT at 33, AST at 37, GGT at 35, bilirubin at 11, albumin at 44, and a FIB-4 score of 1.06 all sit comfortably within range. For someone using anabolic steroids, which are processed by the liver and can cause significant hepatic strain, this is a genuinely positive finding. His amylase and lipase, the two pancreatic enzymes, are both well within range, suggesting no pancreatic stress. His thyroid is working well, with a TSH of 1.07, which is within the optimal 1.0 to 2.5 band, free T4 at 15.4 within the optimal 14 to 20 range, and free T3 at 4.8, also within the optimal 4.5 to 6.5 range. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. His iron studies are balanced. Ferritin at 83 sits within the optimal 50 to 200 range, transferrin saturation at 34.7% is within the ideal 25 to 40% band, serum iron, transferrin, and total iron binding capacity are all comfortably within range. His full blood count is broadly normal for white cells and platelets: white cell count, neutrophils, lymphocytes, monocytes, eosinophils, basophils, reticulocytes, and platelets are all within their respective ranges. His ESR, a broad inflammation marker, is just 2, which is very low and reassuring. His IgG, IgM, and IgE immunoglobulins are within range, and his tissue transglutaminase antibody is negative, effectively ruling out coeliac disease as a cause of his bloating. His cortisol at 292 is within the expected morning range, and his DHEA-S at 3.5 umol per litre, equivalent to roughly 1,290 micrograms per decilitre, is healthy for his age.\n\nThe hormonal picture tells a very clear story and explains several of his reported symptoms and several of his abnormal results. His testosterone is 28.7, sitting right at the top of the laboratory range. His LH, luteinising hormone, which is the pituitary signal that tells the testes to produce testosterone, is suppressed below 0.07 against a lower limit of 1.5. His FSH, follicle-stimulating hormone, which drives sperm production, is 0.32 against a lower limit of 1.4. This pattern, high testosterone with completely suppressed LH and FSH, confirms that the testosterone in his blood is coming from an external source rather than from his own production. When the body detects high testosterone, the pituitary gland shuts down its own signalling because it no longer needs to stimulate the testes. His SHBG, sex hormone binding globulin, the protein that carries testosterone in the blood and controls how much is free and active, is profoundly low at 9.2 against a lower limit of 17.3. Low SHBG is driven by insulin resistance, obesity, and particularly by exogenous androgens, which suppress SHBG production by the liver. With SHBG this low, a very large proportion of his testosterone is unbound and active, which is reflected in a free androgen index of 312, more than double the upper limit of 150, and a calculated free testosterone of 1.01 nmol per litre, which is very high. His oestradiol, the primary oestrogen, is 151 pmol per litre, above the male upper limit of 146. This is a direct consequence of excess testosterone being converted to oestrogen by an enzyme called aromatase, which is found in fat tissue. At a BMI of 29.9, there is enough adipose tissue to drive meaningful aromatisation. Elevated oestradiol in men is associated with water retention, mood changes, and reduced libido, which may be contributing to the low sex drive he reports. This entire hormonal pattern, the suppressed gonadotropins, the crushed SHBG, the elevated oestradiol, and the sky-high free androgen index, is the expected consequence of exogenous testosterone or anabolic steroid use and should be discussed openly with his GP so that it can be properly monitored and managed.\n\nHis red blood cell indices tell the same story from a different angle. Haemoglobin at 180 is above the 170 upper limit, red blood cell count at 6.16 is above the 5.5 upper limit, and haematocrit at 0.525 is above the 0.50 upper limit. This is polycythaemia, an increase in red cell mass, and it is one of the most well-recognised side effects of testosterone and anabolic steroid use. Testosterone stimulates erythropoietin production in the kidneys, which in turn drives the bone marrow to produce more red blood cells. The clinical concern with polycythaemia is that thicker blood increases the risk of clotting events, including deep vein thrombosis, pulmonary embolism, and stroke. At a haematocrit of 0.525, this is above the 0.50 threshold where most clinicians monitoring testosterone replacement would intervene, either by reducing the dose or by arranging therapeutic venesection, which is the removal of a unit of blood to bring levels down. This is not optional monitoring; it is a safety issue that needs to be discussed with his GP or prescribing clinician. His RDW at 14.8 is within range but towards the upper end, which can reflect the bone marrow being pushed hard to produce red cells.\n\nHis lipid profile is unfavourable and carries genuine cardiovascular risk. Total cholesterol at 5.2 is above the desirable 5.18 threshold. LDL cholesterol at 3.74 is well above the 3.0 upper limit and far above the 2.6 optimal ceiling. ApoB, apolipoprotein B, which counts the actual number of atherogenic particles in the blood and is a better predictor of cardiovascular risk than LDL alone, is 1.08 against a target below 0.9 and an optimal target below 0.8. His HDL, high-density lipoprotein, the protective cholesterol that removes LDL from arterial walls, is only 1.0, below the 1.04 low-risk threshold and well below the 1.4 optimal target for men. ApoA1, the protein component of HDL, is 0.97 against a desirable level above 1.20, confirming that his protective cholesterol capacity is genuinely low. The ApoB to ApoA1 ratio at 1.11 is above the 0.7 target and above the 0.9 threshold that defines higher risk. His Lp(a), lipoprotein(a), is 39.18 nmol per litre, above the 32 threshold. Lp(a) is entirely genetically determined; it cannot be changed by diet, exercise, or any currently available medication. It is a particle that deposits cholesterol in artery walls, promotes clotting, and drives local inflammation. At 39 it represents a slightly increased risk rather than a dramatically elevated one, but it means that the elevated LDL and ApoB are not solely driven by modifiable factors. This result should be recorded permanently in his medical notes, and first-degree relatives should be offered testing. Remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.46, which is within the optimal range below 0.5, and his triglycerides at 1.11 are acceptable, though above the optimal 1.0 target. The TG to HDL ratio at 1.11 is above the optimal 0.87 threshold. The overall lipid picture is one where the atherogenic burden, the particles that damage artery walls, significantly outweighs the protective capacity. Anabolic steroids are well known to worsen lipid profiles by suppressing HDL and raising LDL, and this is likely a major driver of the pattern seen here. Smoking compounds this risk substantially.\n\nHis hs-CRP, high-sensitivity C-reactive protein, a marker of systemic inflammation and an independent cardiovascular risk factor, is 3.4 mg per litre. While this sits within the laboratory range of below 5, it is well above the optimal threshold of below 1.0 and above the 3.0 level that the American Heart Association classifies as higher cardiovascular risk. Combined with smoking, anabolic steroid use, a BMI approaching 30, sleep deprivation, and an unfavourable lipid profile, the inflammatory burden is adding to an already elevated cardiovascular risk picture.\n\nHis uric acid at 169 is below the lower limit of 220. Low uric acid is uncommon and is usually benign. It can be seen with high-volume fluid intake, low purine diets, or occasionally with kidney tubular issues. On a high-protein diet one might expect uric acid to be normal or elevated, so a level this low is slightly unusual. It is not dangerous, but it is worth mentioning to the GP in the context of the kidney discussion.\n\nHis parathyroid hormone, PTH, at 0.7 is below the lower limit of 0.98. PTH regulates calcium and phosphate balance. Low PTH with what appears to be adequate vitamin D at 74, though below optimal, is an unusual combination. It may reflect recent calcium intake before the blood draw suppressing PTH, or it may warrant investigation if it persists on repeat testing. His GP should be aware of this finding.\n\nHis vitamin D at 74 nmol per litre is sufficient but below the optimal range of 75 to 120. At a BMI of 29.9, fat tissue sequesters vitamin D, meaning he needs a higher dose to reach and maintain optimal levels. His vitamin B12 at 370 is within the laboratory range but below the optimal threshold of 500. His folate result was returned as insufficient sample, so we cannot assess this marker, and it should be retested.\n\nHis creatine kinase, CK, is 347, marginally above the 320 upper limit. CK is released from muscles during exercise and after muscle damage. With three resistance sessions per week and anabolic steroid use driving greater muscle mass and harder training, a CK marginally above range is entirely expected and not a concern. His IgA at 3.5 sits right at the upper limit of the range, which is borderline but not abnormal. His IgM at 0.6 is at the lower end of range. Neither requires action. His magnesium at 1.09 is within the laboratory range and above the 1.05 optimal upper limit, which is reassuringly strong. His total antioxidant activity at 1.47 is within range. His progesterone at 2.28 is within the male reference range. His prolactin at 174 is within range.\n\nTo pull this together: Plamen's blood sugar control, liver function, thyroid, iron stores, and immune markers are all in good health. The findings that need attention fall into three categories. First, the urinary blood needs GP investigation and should not be ignored once the pending culture results return. Second, the polycythaemia, the suppressed gonadotropins, the crushed SHBG, the elevated oestradiol, and the unfavourable lipid profile are all directly related to anabolic steroid use, and these carry real health risks, particularly the haematocrit above 0.50 and the atherogenic lipid burden compounded by smoking. Third, the mildly reduced Cystatin C eGFR and raised urea suggest the kidneys are under some strain from the combined load of high protein intake, PED use, and smoking. The single most impactful change Plamen could make for his long-term health would be to stop smoking. The second would be to work with his GP or prescribing clinician to review and potentially reduce his PED use, or at minimum to ensure it is properly monitored with regular haematocrit checks and venesection when needed.","links":"Plamen's results point to several practical steps that would make a meaningful difference to his health, and the most important ones do not involve supplements.\n\nThe most urgent action is a GP visit. He should bring this report and specifically discuss three things: the urinary red blood cells at 40 per microlitre, which need investigation once the pending culture results are available; the haematocrit at 0.525, which is above the safety threshold for someone using exogenous testosterone and may require venesection or dose adjustment; and the Cystatin C eGFR of 84 with urea at 9.4, which suggests mild kidney strain that should be monitored. The GP should also be made aware of the suppressed LH and FSH, the low SHBG, and the elevated oestradiol, all of which are consequences of PED use and should be on his medical record.\n\nFor cardiovascular risk reduction, smoking cessation is the single highest-impact intervention available to him. Smoking damages the endothelium, the lining of blood vessels, accelerates atherosclerosis, raises inflammatory markers, and compounds every other risk factor in his profile. His GP can offer nicotine replacement therapy, varenicline, or referral to a smoking cessation service. Beyond smoking, his lipid profile needs active management. His LDL at 3.74 and ApoB at 1.08 are both well above target, his HDL at 1.0 is below the protective threshold, and his Lp(a) at 39 adds a fixed genetic component to his risk. Dietary changes that would help include increasing soluble fibre intake through oats, beans, lentils, and flaxseed, aiming for at least 10 grams of soluble fibre daily; eating oily fish such as salmon, mackerel, or sardines at least three times per week for the EPA and DHA content; and reducing saturated fat from red meat and dairy, replacing some with olive oil, nuts, and avocado. If dietary changes and a review of PED use do not bring his ApoB below 0.9 within three to six months, statin therapy should be discussed with his GP, particularly given the combination of elevated Lp(a), smoking history, and an hs-CRP of 3.4.\n\nFor body composition, Plamen is 100 kg at 183 cm with a BMI of 29.9. Given his anabolic steroid use, some of that weight is muscle mass that would not be present in a natural trainee, so a realistic target weight range is 88 to 93 kg, which would bring his BMI into the 26 to 28 range while accounting for above-average lean mass. His basal metabolic rate is approximately 2,050 calories. With four cardio sessions and three resistance sessions per week, his maintenance is approximately 3,075 to 3,280 calories. For fat loss at roughly 0.5 kg per week, a daily intake of 2,500 to 2,700 calories would be appropriate. His protein intake should be 1.6 to 2.0 grams per kilogram of body weight, which at 100 kg means 160 to 200 grams per day. However, given his urea at 9.4 and Cystatin C eGFR of 84, he should aim for the lower end of this range, 160 grams, rather than pushing higher. His diet is currently rated 6 out of 10 for quality, which suggests there is room to improve the composition of what he eats. On a low-carb, high-protein approach, ensuring adequate fibre is a common challenge and is particularly relevant for his bloating symptoms and his lipid profile.\n\nFor his digestive symptoms, the bloating he reports could be related to several factors: insufficient fibre on a low-carb diet, very high protein intake straining digestive capacity, or the effects of PED use on gut motility. Practical steps include adding fermented foods such as kefir, sauerkraut, or kimchi; ensuring at least 25 grams of fibre daily from low-carb sources like flaxseed, chia seeds, leafy greens, and cruciferous vegetables; and eating more slowly to reduce air swallowing. If bloating persists despite these changes, a GP referral for further investigation would be appropriate.\n\nFor sleep, he reports fewer than six hours most nights, and this is quietly undermining almost every system in his body. Chronic sleep restriction raises cortisol, increases insulin resistance, impairs immune function, raises inflammatory markers including CRP, and reduces testosterone production, though the last point is less relevant while on exogenous testosterone. Practical steps include setting a fixed wake time seven days a week; getting outside within an hour of waking for natural light exposure; cutting caffeine entirely after midday; keeping the bedroom cool, ideally 16 to 18 degrees Celsius; avoiding screens for at least 30 minutes before bed; and aiming to increase sleep duration by 30 minutes per week until reaching seven hours consistently.\n\nHis daily step count of fewer than 2,000 is very low, even with structured exercise. Non-exercise activity thermogenesis, the calories burned through general movement throughout the day, is a significant contributor to metabolic health and fat loss. Aiming for a minimum of 7,000 steps daily, building to 10,000 over four to six weeks, would meaningfully improve his cardiovascular health, insulin sensitivity, and energy levels without adding training stress.\n\nHis Lp(a) at 39 nmol per litre should be recorded permanently in his medical notes. This is a genetically inherited lipoprotein that cannot be changed by any lifestyle intervention or currently available medication. It is a fixed cardiovascular risk factor. His first-degree relatives, siblings and children, should be offered Lp(a) testing.\n\nHis vitamin D should be retested alongside folate in eight to twelve weeks after supplementation begins. His B12 should be rechecked at the same time. His full blood count, kidney function, and liver function should be monitored every three to six months while he continues PED use, with particular attention to haematocrit, urea, and Cystatin C eGFR. His lipid profile should be repeated in three to four months to assess the impact of dietary changes.","flags":"URGENT FOR GP:\n\n1. Urinary RBCs 40 per microlitre (threshold 25). Isolated microscopic haematuria at age 51. Bacterial culture and sensitivities pending. If culture is negative and haematuria persists on repeat, standard urological investigation pathway is indicated.\n\n2. Haematocrit 0.525 (range 0.40 to 0.50), haemoglobin 180 g/L (range 130 to 170), RBC 6.16 (range 4.5 to 5.5). Polycythaemia secondary to exogenous testosterone or anabolic steroid use. Haematocrit above 0.50 increases thromboembolic risk. Venesection or dose reduction should be considered.\n\n3. Cystatin C 1.11 mg/L (upper limit 1.1), Cystatin C eGFR 84 (below 90 threshold), urea 9.4 mmol/L (upper limit 8.2). Mildly reduced kidney function. High dietary protein load and PED use are likely contributors. Monitoring recommended.\n\nHORMONAL (PED-RELATED):\n\n4. LH below 0.07 mIU/ml (range 1.5 to 9.3) and FSH 0.32 mIU/ml (range 1.4 to 18.1). Complete suppression of gonadotropins consistent with exogenous androgen use. Natural testosterone production and spermatogenesis are suppressed.\n\n5. SHBG 9.2 nmol/L (range 17.3 to 65.8). Profoundly suppressed, driven by exogenous androgen use. Results in very high free testosterone and free androgen index of 312 (upper limit 150).\n\n6. Oestradiol 151 pmol/L (upper limit 146.1). Mildly elevated, consistent with peripheral aromatisation of excess testosterone. May contribute to reported low libido and water retention.\n\nCARDIOVASCULAR:\n\n7. LDL 3.74 mmol/L (upper limit 3.0), ApoB 1.08 g/L (target below 0.9), HDL 1.0 mmol/L (desirable above 1.04), ApoA1 0.97 g/L (desirable above 1.20), ApoB/A1 ratio 1.11 (target below 0.7), non-HDL cholesterol 4.2 (target below 4.0), TC/HDL ratio 5.2 (target below 4.5). Unfavourable lipid profile with high atherogenic burden and low protective capacity. Anabolic steroid use, smoking, and diet are likely contributors. Lp(a) at 39.18 nmol/L adds a fixed genetic risk component.\n\n8. hs-CRP 3.4 mg/L. Above optimal threshold of 1.0 and above the 3.0 higher cardiovascular risk level. Contributes to overall cardiovascular risk alongside lipids, smoking, and PED use.\n\nOTHER:\n\n9. PTH 0.7 pmol/L (range 0.98 to 4.73). Below range. Unusual with vitamin D at 74. May warrant repeat testing.\n\n10. Uric acid 169 umol/L (range 220 to 547). Below range. Usually benign. Consider in context of kidney findings.\n\n11. PSA ratio 0.184 (threshold 0.19). Marginally below cut-off but with a low total PSA of 1.63. Low clinical significance at this PSA level.\n\n12. Folate and insulin returned as insufficient sample. Recommend repeat.\n\nREASSURING NEGATIVES: Fasting glucose 4.4 and HbA1c 33 rule out diabetes and prediabetes. Liver enzymes, bilirubin, and FIB-4 are all normal despite PED use. Thyroid function is optimal with negative antibodies. Iron studies are balanced with ferritin in the optimal range. PSA is low. CEA and CA 19-9 tumour markers are normal. Coeliac screen is negative. ESR is very low. Immunoglobulins are within range.","recommendations":"1. Book a GP appointment within the next two weeks. Bring this report. Discuss the urinary red blood cells at 40, the haematocrit at 0.525, the Cystatin C eGFR of 84 with urea at 9.4, the suppressed LH and FSH, the low SHBG, the elevated oestradiol, and the lipid profile. Ask the GP to record the Lp(a) result of 39.18 permanently in medical notes.\n\n2. Stop smoking. This is the single most impactful change for cardiovascular risk reduction. Speak to the GP about cessation support.\n\n3. Discuss PED use openly with the GP or prescribing clinician. Request regular monitoring including haematocrit, liver function, kidney function, and lipid profile every three to six months. If haematocrit remains above 0.50, venesection or dose adjustment should be arranged.\n\n4. Increase daily steps to a minimum of 7,000, building to 10,000 over four to six weeks.\n\n5. Increase sleep duration. Aim for seven hours minimum. Set a fixed wake time, get outside light within an hour of waking, cut caffeine after midday, cool the bedroom to 16 to 18 degrees.\n\n6. Adjust diet to 2,500 to 2,700 calories daily with 160 grams of protein. Add soluble fibre from oats, flaxseed, beans, and lentils aiming for 10 grams of soluble fibre and 25 grams total fibre daily. Eat oily fish three times per week. Reduce saturated fat and replace with olive oil, nuts, and avocado.\n\n7. Add fermented foods for digestive health: kefir, sauerkraut, or kimchi daily.\n\n8. Begin vitamin D3 supplementation at 4,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 at 200 mcg.\n\n9. Begin sublingual methylcobalamin B12 at 1,000 mcg daily.\n\n10. Retest folate, insulin, and rheumatoid factor (all returned as insufficient sample). Repeat vitamin D, B12, full blood count, kidney function, liver function, and lipid profile in three to four months.\n\n11. Offer Lp(a) testing to first-degree relatives.","supplementation":"Based on Plamen's results, the following supplements would be of benefit.\n\nVitamin D3 in the cholecalciferol form, at 4,000 IU daily taken with his largest fat-containing meal. His level at 74 nmol per litre is just below the optimal threshold of 75, and at a BMI of 29.9, fat tissue sequesters vitamin D, meaning he needs a higher dose than a lean individual to reach and maintain the 75 to 120 optimal range. This should always be paired with vitamin K2 in the MK-7 form at 200 mcg daily, taken at the same time. Vitamin K2 directs calcium into bones and teeth and away from soft tissues and arterial walls, which is particularly important given his cardiovascular risk profile.\n\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue rather than swallowed. His B12 at 370 pg per ml is within the laboratory range but below the optimal threshold of 500. The sublingual route bypasses digestive absorption, which is more reliable, especially if there is any digestive inefficiency contributing to his bloating.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports cardiovascular health by modestly lowering triglycerides, has anti-inflammatory properties that may help reduce his hs-CRP from 3.4, and supports HDL function. Given his lipid profile, this is one of the more important supplements in his stack.\n\nMagnesium glycinate, 400 mg before bed. His serum magnesium at 1.09 is within range, but magnesium glycinate specifically supports sleep quality, and with his sleep restricted to fewer than six hours most nights, this could help both sleep onset and sleep depth. The glycinate form is the best tolerated for sleep and is least likely to cause digestive upset.\n\nA high-quality soluble fibre supplement such as psyllium husk, 5 to 10 grams daily mixed into water or a shake, taken with plenty of fluid. This would support his digestive symptoms, help lower LDL cholesterol, and address the fibre gap that commonly occurs on low-carb diets. Start at 5 grams and increase gradually to avoid worsening bloating.\n\nHe should not take iron supplements. His ferritin at 83, transferrin saturation at 34.7%, and serum iron at 26 are all well within range, and additional iron with a haematocrit already at 0.525 would risk worsening the polycythaemia.\n\nThe most important changes from this report are not supplements. They are stopping smoking, addressing sleep duration, increasing daily movement outside of structured training, discussing PED monitoring with his GP, and making the dietary adjustments that will bring his lipid profile and inflammatory markers into a healthier range.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2946","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found primarily in liver cells. When the liver is damaged or inflamed, ALT leaks into the bloodstream, making it one of the most sensitive markers of liver cell health. At 33, Plamen's ALT is within the laboratory range of below 56 but sits above the optimal threshold of below 30 for men. For someone using anabolic steroids, which are processed through the liver and can cause hepatic strain, an ALT only marginally above the optimal ceiling is a reassuring result. This does not indicate liver disease but sits in the zone where continued monitoring is sensible.","low_causes":"","high_causes":"Liver disease, hepatitis, alcohol excess, medications, obesity, strenuous exercise, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in liver cells, heart muscle, and skeletal muscle. It is less specific to the liver than ALT because muscle damage also releases AST. At 37, Plamen's result is within range and within optimal. With three resistance training sessions per week and anabolic steroid use driving greater muscle mass, some AST elevation from muscle turnover is expected, making this clean result even more reassuring.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart disease, muscle damage, strenuous exercise, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2397","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct obstruction, and metabolic stress on the liver. It is often the first liver enzyme to rise when the liver is under strain. At 35, Plamen's GGT is within the laboratory range of 4 to 73 but above the optimal threshold of below 25. This does not indicate liver disease, but it suggests the liver is doing some metabolic work. Possible contributors include the anabolic steroid use, the BMI approaching 30, and general metabolic load.","low_causes":"","high_causes":"Alcohol excess, liver disease, bile duct obstruction, medications, obesity, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4310","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and digestive system. It is used alongside other liver enzymes to help distinguish between liver cell damage and bile duct obstruction. At 67, this is well within the normal and optimal ranges, suggesting healthy liver and bone metabolism.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated bilirubin can indicate liver dysfunction, bile duct obstruction, or excessive red blood cell breakdown. At 11, Plamen's bilirubin is comfortably within range. Despite his elevated red blood cell count and haematocrit, which mean more red cells are being turned over, the liver is clearly handling the bilirubin load without difficulty.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6427","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects the liver's ability to produce proteins and the immune system's production of antibodies. At 78, this is within both the normal and optimal ranges, indicating healthy protein synthesis.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic infection, chronic inflammation, dehydration, blood cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and maintains fluid balance by keeping water within blood vessels. At 44, Plamen's albumin is within the optimal range, confirming healthy liver synthetic function.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6667","units":"g/l","description":"Globulin is a group of proteins that includes antibodies produced by the immune system and transport proteins made by the liver. At 34, this is within range and reflects a normally functioning immune system and liver.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein groups in the blood. A ratio within range suggests a healthy balance between liver synthetic function and immune system activity. At 1.29, calculated from albumin of 44 and globulin of 34, this is within the normal and optimal ranges.","low_causes":"Liver disease, autoimmune conditions, chronic infection","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3655","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, AST, ALT, and platelet count. A score below 1.3 in those under 65, as Plamen's is at 1.06, suggests a low probability of significant liver fibrosis. This is a reassuring finding, particularly for someone using anabolic steroids which can cause liver damage over time.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age above 50, low platelets, elevated AST","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4697","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands. It breaks down starches into sugars. Elevated levels can indicate pancreatic inflammation or obstruction. At 86, Plamen's amylase is comfortably within range, suggesting no pancreatic stress.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6311","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down dietary fats. It is more specific to the pancreas than amylase. At 47, this is within range and confirms healthy pancreatic function.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5019","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL. At 5.2, Plamen's total cholesterol sits marginally above the desirable threshold of 5.18. Total cholesterol alone is a limited marker because it does not distinguish between harmful LDL particles and protective HDL particles. The breakdown of his lipid subtypes, particularly his LDL, ApoB, and HDL, provides a much more informative picture of his cardiovascular risk.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3265","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily influenced by carbohydrate intake, alcohol, and metabolic health. At 1.11, Plamen's triglycerides are within the laboratory range of below 1.7 but above the optimal target of below 1.0. On a low-carb diet, triglycerides are typically very low, so this level is slightly higher than expected. Possible contributors include BMI, sleep restriction, and smoking, all of which can raise triglycerides.","low_causes":"Very low-fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3205","lower_normal":"1.04","upper_normal":"1.56","lower_optimal":"1.4","upper_optimal":"2.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"0.9615","units":"mmol/l","description":"HDL, high-density lipoprotein, is often called protective cholesterol because it carries excess cholesterol away from artery walls back to the liver for disposal. At 1.0, Plamen's HDL is below the low-risk threshold of 1.04 and well below the optimal target of 1.4 for men. Low HDL significantly increases cardiovascular risk because there is less capacity to clear cholesterol from the arteries. Anabolic steroids are well known to suppress HDL, often dramatically. Other contributors include smoking, low physical activity outside of structured exercise, and BMI. Increasing daily movement, particularly aerobic activity and general walking, is one of the most effective ways to raise HDL.","low_causes":"Anabolic steroid use, smoking, sedentary lifestyle, obesity, genetic factors","high_causes":"Regular aerobic exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6240","lower_normal":"0.5","upper_normal":"3.0","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, low-density lipoprotein, carries cholesterol from the liver to cells throughout the body. When LDL is elevated, excess particles can penetrate artery walls, triggering inflammation and the formation of plaques that narrow and harden the arteries, a process called atherosclerosis. At 3.74, Plamen's LDL is well above the 3.0 upper limit and far above the 2.6 optimal ceiling. This level, combined with his elevated ApoB, low HDL, raised Lp(a), hs-CRP of 3.4, and smoking, represents a meaningful cardiovascular risk that warrants active management through diet, lifestyle changes, and potentially medication.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, anabolic steroid use, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3205","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, very low-density lipoprotein, is produced by the liver and carries triglycerides to tissues. It is a precursor to LDL. At 0.5, this is within the normal and optimal ranges, reflecting the relatively controlled triglyceride level.","low_causes":"","high_causes":"High triglycerides, obesity, insulin resistance, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5778","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a simple measure of the balance between atherogenic and protective cholesterol. A ratio below 4.5 is desirable, and below 4.0 is optimal. At 5.2, Plamen's ratio is above the desirable threshold, driven by the combination of elevated total cholesterol and low HDL. This ratio is one of the strongest simple predictors of cardiovascular risk.","low_causes":"","high_causes":"High total cholesterol, low HDL, anabolic steroid use, smoking, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"19.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5313","upper_optimal_position":"1","units":"%","description":"This metric expresses how much of total cholesterol is made up of protective HDL. A proportion above 20% is desirable. At 19.23%, Plamen's HDL proportion is marginally below the threshold, reflecting the same pattern seen in the TC/HDL ratio: too little protective cholesterol relative to total cholesterol.","low_causes":"Low HDL, anabolic steroid use, smoking, sedentary lifestyle, obesity","high_causes":"High HDL, regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.525","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4375","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the atherogenic, or artery-damaging, cholesterol in one number, including LDL, VLDL, and remnant particles. At 4.2, this is above the 4.0 target, consistent with the elevated LDL and ApoB seen elsewhere in the lipid panel.","low_causes":"","high_causes":"Elevated LDL, elevated triglycerides, diet, genetic factors, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on each LDL, VLDL, and Lp(a) particle. Because there is exactly one ApoB molecule per particle, it provides a direct count of the total number of atherogenic particles in the blood, making it a superior predictor of cardiovascular risk compared to LDL cholesterol alone. At 1.08, Plamen's ApoB is above the 0.9 desirable threshold and above the 0.8 optimal target. This confirms that the particle count, not just the cholesterol content, is elevated. Reducing ApoB below 0.9, and ideally below 0.8, should be a primary target.","low_causes":"","high_causes":"Diet high in saturated fat, genetic factors, obesity, hypothyroidism, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"0.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4042","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein component of HDL particles. It reflects the quantity and quality of protective cholesterol. At 0.97, Plamen's ApoA1 is below the desirable threshold of 1.20, consistent with his low HDL and confirming that his protective cholesterol capacity is reduced. Anabolic steroid use is one of the most potent suppressors of ApoA1.","low_causes":"Anabolic steroid use, smoking, sedentary lifestyle, obesity, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.113","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7950","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the best single markers of cardiovascular risk. It compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). A ratio below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. At 1.113, Plamen's ratio is in the higher risk category, reflecting both elevated atherogenic particles and reduced protective capacity. This single number encapsulates the cardiovascular concern in his lipid profile.","low_causes":"","high_causes":"High LDL, low HDL, anabolic steroid use, smoking, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"39.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6122","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that behaves like a particularly sticky form of LDL. It deposits cholesterol in artery walls, promotes blood clotting by interfering with the clot-dissolving system, and drives local inflammation. Lp(a) levels are set by genetics and cannot be changed by diet, exercise, or any currently available medication. At 39.18, Plamen's Lp(a) is above the 32 nmol per litre threshold, placing him in the slightly increased risk category. This result should be recorded permanently in his medical notes because it only ever needs to be tested once. His first-degree relatives, siblings and children, should be offered testing. The clinical importance of this result is that it means his elevated LDL and ApoB are not entirely driven by modifiable factors; there is a fixed genetic component contributing to his atherogenic particle count.","low_causes":"","high_causes":"Genetic factors only","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_chol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried in triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. These remnant particles are atherogenic and contribute to cardiovascular risk independently of LDL. At 0.46, Plamen's remnant cholesterol is within the optimal range of below 0.5, which is one of the few genuinely positive findings in his lipid profile.","low_causes":"","high_causes":"Elevated triglycerides, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3706","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a useful proxy for insulin resistance and small dense LDL particles, which are the most atherogenic form of LDL. A ratio below 0.87 is optimal. At 1.11, Plamen's ratio is within the laboratory range but above optimal, suggesting some degree of metabolic inefficiency and a particle pattern that may include more small dense LDL.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate intake, obesity, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It reflects how well the body is managing blood sugar in the fasting state. At 4.4, Plamen's glucose is within the optimal range of 4.0 to 5.4, indicating excellent blood sugar regulation.","low_causes":"Excessive insulin, prolonged fasting, liver disease","high_causes":"Diabetes, prediabetes, stress, medications, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.425","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar levels over the preceding two to three months. Below 6.0% is normal. At 5.1%, Plamen's HbA1c confirms excellent long-term blood sugar control.","low_causes":"","high_causes":"Diabetes, prediabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (IFCC)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in IFCC units of mmol per mol rather than percentage. Below 42 is normal. At 33, this is well below the normal threshold and within the optimal range of below 36, confirming excellent blood sugar control over the last two to three months.","low_causes":"","high_causes":"Diabetes, prediabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to maintain blood sugar in the fasting state. It is a key marker for assessing insulin resistance. Unfortunately, this result was returned as insufficient sample by the laboratory, meaning there was not enough blood in the sample tube to perform the analysis. This marker should be retested. Without it, HOMA-IR and HOMA-B, the calculated indices of insulin resistance and beta-cell function, cannot be determined.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3394","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","up
