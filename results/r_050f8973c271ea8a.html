26 is within the optimal range, indicating healthy circulating iron levels.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5180","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6167","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. The liver produces more transferrin when iron stores are low (to capture more iron) and less when stores are adequate. Plamen's transferrin at 2.98 is within the optimal range, reflecting adequate iron stores and normal liver synthetic function.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5482","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3854","upper_optimal_position":"0.6094","units":"umol/l","description":"TIBC (total iron binding capacity) measures the blood's total capacity to bind iron with transferrin. It moves inversely with iron stores: high TIBC means the body is trying to absorb more iron (low stores), while low TIBC means stores are adequate. Plamen's TIBC at 67 is within the optimal range, consistent with healthy iron balance.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"34.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4847","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures what percentage of the transferrin protein is currently carrying iron. It reflects the balance between iron supply and demand. Plamen's transferrin saturation at 34.7% is within the optimal band of 25 to 40%, indicating iron is being delivered to tissues efficiently without overload.","low_causes":"Iron deficiency, chronic disease, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4011","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3426","upper_optimal_position":"0.5926","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. Each ferritin molecule can store thousands of iron atoms. It is also an acute phase protein, meaning it rises during inflammation. Plamen's ferritin at 83 is within the optimal male range of 50 to 200, indicating healthy iron stores. Given his elevated hs-CRP of 3.4, ferritin may be slightly inflated by inflammation, meaning true iron stores might be marginally lower, but the overall picture is reassuring.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian/vegan diet","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"28.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, red blood cell production, libido, mood, and energy. Plamen's testosterone at 28.7 sits at the very top of the laboratory range. In isolation, this could appear optimal. However, in the context of exogenous testosterone use, this number must be interpreted alongside LH, FSH, and SHBG. The suppressed gonadotropins (LH and FSH effectively at zero) confirm the testosterone is from an external source, and the body's own production has shut down. The SHBG at 9.2 means a vastly disproportionate amount of this testosterone is free and active, as reflected by the free androgen index of 312.","low_causes":"Aging, obesity, chronic illness, opioids, sleep deprivation, hypogonadism, pituitary disease","high_causes":"Exogenous testosterone, anabolic steroid use, adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"1.006","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5594","lower_normal":"0.2","upper_normal":"0.7","lower_optimal":"0.3","upper_optimal":"0.65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"nmol/l","description":"Free testosterone is the fraction not bound to SHBG or albumin and is the biologically active form that enters cells and exerts effects. Plamen's calculated free testosterone at 1.006 nmol/L is well above the normal male reference range upper limit, driven by the combination of high total testosterone and profoundly suppressed SHBG at 9.2. This supraphysiological level of free testosterone is responsible for the polycythaemia and contributes to the elevated oestradiol through increased aromatisation.","low_causes":"High SHBG, low total testosterone, aging, obesity","high_causes":"Exogenous testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"9.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1937","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3826","upper_optimal_position":"0.6285","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to testosterone and oestradiol, regulating how much of each hormone is free and active. Low SHBG means more free testosterone and more free oestradiol. Plamen's SHBG at 9.2 is profoundly suppressed, well below the lower limit of 17.3. Exogenous androgens are the primary driver, as they directly suppress SHBG production by the liver. Insulin resistance and higher body weight also contribute. The consequence is supraphysiological free androgen levels (FAI 312) despite a total testosterone that appears to be at the top of range. This amplifies both the desired effects (muscle, strength) and the undesirable effects (polycythaemia, oestradiol elevation, cardiovascular risk) of testosterone use.","low_causes":"Exogenous androgens, insulin resistance, obesity, hypothyroidism, nephrotic syndrome","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen therapy, anticonvulsants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"311.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8400","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is calculated as (total testosterone / SHBG) x 100 and provides an estimate of how much testosterone is biologically active. Plamen's FAI at 312 is more than double the upper limit of 150, reflecting the combination of high total testosterone and profoundly low SHBG. This supraphysiological androgen exposure is driving the polycythaemia, contributing to the elevated oestradiol, suppressing HDL, and may be placing strain on the kidneys and liver over time.","low_causes":"Low testosterone, high SHBG, hypogonadism","high_causes":"Exogenous testosterone, anabolic steroid use, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"151","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4450","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, produced mainly through the aromatisation of testosterone in fat tissue. In normal amounts, it supports bone density, brain function, and cardiovascular health. When elevated, it can cause water retention, breast tissue development (gynaecomastia), mood changes, and paradoxically reduced libido. Plamen's oestradiol at 151 is above the male upper limit of 146.1. With supraphysiological free testosterone levels and a BMI of 29.9 providing additional aromatase activity, this elevation is expected. It may well be contributing to his reported low sex drive, as the balance between testosterone and oestradiol matters more than testosterone alone. His prescribing clinician should be made aware.","low_causes":"Low testosterone, low body fat, aromatase inhibitor use","high_causes":"Exogenous testosterone, obesity, liver disease, aromatase excess, medication effects","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0060","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3397","upper_optimal_position":"0.6283","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland to stimulate the testes to produce testosterone. When exogenous testosterone enters the body, the hypothalamus and pituitary detect the high testosterone levels and shut down LH production through negative feedback. Plamen's LH at less than 0.07 is effectively undetectable, confirming complete suppression of the body's own testosterone-producing axis. This means the testes are receiving no signal to produce testosterone or support spermatogenesis. If exogenous testosterone is discontinued without medical support, recovery of the axis can take months to years, and fertility may be significantly impaired.","low_causes":"Exogenous testosterone/anabolic steroids, hypopituitarism, severe illness, opioids","high_causes":"Primary hypogonadism (testicular failure), menopause (in women), PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0192","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5360","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland to drive sperm production (spermatogenesis) in the testes. Like LH, FSH is suppressed by exogenous testosterone through negative feedback. Plamen's FSH at 0.32 is far below the lower limit of 1.4, confirming that sperm production is being severely suppressed. This has implications for fertility: if Plamen wishes to conceive, this would need to be discussed with a specialist, as recovery of spermatogenesis after testosterone cessation is unpredictable.","low_causes":"Exogenous testosterone/anabolic steroids, hypopituitarism, severe illness","high_causes":"Primary hypogonadism, testicular failure, Klinefelter's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"174","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4636","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6591","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for stimulating breast milk production, but in men it plays roles in immune regulation and reproductive function. Elevated prolactin in men can suppress testosterone and cause low libido. Plamen's prolactin at 174 is within the optimal range, ruling out hyperprolactinaemia as a contributor to his low sex drive.","low_causes":"Dopamine agonist medication","high_causes":"Pituitary adenoma, medication effects (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"292","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4369","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5815","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning and declining through the day. It mobilises glucose, suppresses inflammation, and supports the body's stress response. Plamen's cortisol at 292 is within the optimal morning range, indicating the adrenal glands are functioning normally. Given his sleep restriction and high training load, a well-regulated cortisol is a positive finding.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, long-term corticosteroid use","high_causes":"Stress, Cushing's syndrome, corticosteroid medication, depression, alcoholism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4885","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It serves as a precursor for other hormones and plays minor roles in brain function and immune regulation. Plamen's progesterone at 2.28 is within the reference range, which is unremarkable in men.","low_causes":"Adrenal insufficiency, low cholesterol","high_causes":"Congenital adrenal hyperplasia, adrenal tumour, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"3.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3606","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"2.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3454","upper_optimal_position":"0.5726","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is produced by the adrenal glands and serves as a precursor for both testosterone and oestrogen. It naturally declines with age. Plamen's DHEA-S at 3.5 umol/L (approximately 1,290 ug/dL) is within the optimal range for his age, indicating healthy adrenal function.","low_causes":"Aging, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (in women), supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3702","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.4889","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to regulate the thyroid. When the thyroid is underactive, TSH rises to push it harder; when overactive, TSH drops. Plamen's TSH at 1.07 sits within the optimal range of 1.0 to 2.5, indicating the pituitary is happy with the amount of thyroid hormone being produced. This effectively rules out thyroid dysfunction as a contributor to his fatigue and low energy.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, early thyroid failure, iodine deficiency, thyroid inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"15.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3560","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates to tissues where it is converted into the more active T3. Plamen's FT4 at 15.4 is within the optimal range of 14 to 20, confirming the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, pituitary disease, severe illness, medication effects","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolic rate, energy production, and cellular function. It is converted from T4 in the tissues. Plamen's FT3 at 4.8 is within the optimal range of 4.5 to 6.5, confirming the body is converting T4 to T3 effectively. Thyroid function is not contributing to his fatigue.","low_causes":"Hypothyroidism, severe illness, low T4, poor conversion, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies target thyroid peroxidase, an enzyme essential for thyroid hormone production. Positive results suggest autoimmune thyroid disease (Hashimoto's thyroiditis). Plamen's TPO antibodies at less than 6.6 are well below the threshold of 13.8, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1594","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein produced by the thyroid used in hormone synthesis. Elevated levels can indicate autoimmune thyroid disease. Plamen's thyroglobulin antibodies at 1.4 are well below the threshold of 4.4, further confirming no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3700","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin through sunlight exposure and obtained from dietary sources. Plamen's vitamin D at 74 nmol/L is sufficient by laboratory standards (above 50) but sits just below the optimal threshold of 75. At a BMI of 29.9, fat tissue sequesters vitamin D, reducing its bioavailability. Smoking also impairs vitamin D metabolism. A supplementation dose of 3,000 IU daily, taken with a fat-containing meal, would move him into the optimal range.","low_causes":"Limited sun exposure, dark skin, obesity (sequestration in fat), malabsorption, low dietary intake, smoking","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"370","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3740","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6076","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. It is found primarily in animal products. Plamen's B12 at 370 pg/mL is within the laboratory range of 193 to 982 but below the optimal threshold of 500. On a high-protein diet rich in meat, dietary intake should be adequate, but absorption or utilisation may not be optimal. Sublingual methylcobalamin at 1,000 mcg daily is recommended to bring stores into the optimal range, supporting energy, nerve function, and recovery.","low_causes":"Vegetarian/vegan diet, malabsorption, pernicious anaemia, metformin use, gastric surgery, aging","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and neural tube development. It works closely with B12 in methylation pathways. Plamen's folate sample was returned as 'Insufficient' by the laboratory, meaning it could not be analysed. Folate status is therefore unknown and should be repeated on the next blood draw. In the meantime, increasing intake of folate-rich foods (leafy greens, broccoli, asparagus, eggs) is advisable.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, coeliac disease, medication effects (methotrexate)","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1868","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3481","upper_optimal_position":"0.6178","units":"pmol/L","description":"PTH (parathyroid hormone) is produced by four small glands behind the thyroid. It is the master regulator of calcium balance: when blood calcium drops, PTH rises to release calcium from bone, increase calcium absorption from the gut (via vitamin D activation), and reduce calcium loss through the kidneys. Plamen's PTH at 0.7 is below the lower limit of 0.98. In the absence of a calcium result, interpretation is incomplete. Low PTH can be seen with high calcium intake (the parathyroids sense adequate calcium and reduce output), high magnesium (which can suppress PTH release, and his magnesium at 1.09 is at the top of range), or hypoparathyroidism. The lab notes that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection. The GP should check serum calcium and phosphate to complete the picture.","low_causes":"Hypoparathyroidism, high calcium, high magnesium, surgical damage to parathyroids, post-thyroidectomy","high_causes":"Low calcium, vitamin D deficiency, kidney disease, parathyroid adenoma, secondary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4929","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals and oxidative stress. Plamen's TAA at 1.47 is within range, suggesting adequate antioxidant defence. However, given his low uric acid (which normally contributes significantly to antioxidant capacity), his dietary antioxidant intake from food or supplements is likely supporting this level.","low_causes":"Poor diet, oxidative stress, chronic illness, smoking, low uric acid","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"347","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6823","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in skeletal muscle, heart muscle, and brain. It is released into the blood when muscle cells are damaged, making it a marker of muscle breakdown. Plamen's CK at 347 is marginally above the upper limit of 320. In the context of seven training sessions per week, including three resistance sessions, and the enhanced muscle protein turnover from exogenous testosterone, this mild elevation is almost certainly exercise-related and expected. If it were several times above the limit, investigation for rhabdomyolysis or other causes would be warranted, but at this margin it requires no action beyond monitoring.","low_causes":"Sedentary lifestyle, low muscle mass, liver disease","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism, myocarditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"12.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5351","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant immunoglobulin in the blood, providing long-term immunity against bacteria and viruses. It is the antibody class responsible for immune memory. Plamen's IgG at 12.2 is within the reference range, indicating a normally functioning adaptive immune system.","low_causes":"Immune deficiency, medication effects (immunosuppressants), chronic lymphocytic leukaemia","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. It is large and effective at activating the complement system. Plamen's IgM at 0.6 is at the lower end of the reference range but within it. This is not a concern.","low_causes":"Immune deficiency, selective IgM deficiency","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, liver disease, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the primary antibody found in mucosal secretions, including the gut, respiratory tract, and saliva. It provides the first line of immune defence at mucosal surfaces. Plamen's IgA at 3.5 sits at the very top of the reference range. While still within range, a value at the upper boundary may reflect increased mucosal immune activity, potentially related to his digestive symptoms and bloating. It is not clinically actionable on its own but is worth noting if digestive symptoms persist or IgA rises further on retest.","low_causes":"Selective IgA deficiency (most common immune deficiency), medication effects","high_causes":"Chronic mucosal infection, liver disease (especially alcoholic), IgA nephropathy, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"29.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1485","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_norm r prostate cancer, it can be elevated by benign prostatic hyperplasia (BPH), prostatitis, recent ejaculation, and cycling. Plamen's PSA at 1.63 is well within the age-appropriate limit of under 3.5. On exogenous testosterone, which stimulates prostate tissue, a normal PSA is reassuring. Regular PSA monitoring is recommended for any man using exogenous testosterone.","low_causes":"5-alpha reductase inhibitor use (finasteride, dutasteride)","high_causes":"Prostate cancer, BPH, prostatitis, recent ejaculation, urinary retention, cycling","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA measures the unbound fraction of PSA in the blood. It is used alongside total PSA to calculate the free-to-total ratio, which helps distinguish between benign and malignant causes of PSA elevation. A higher free PSA percentage favours benign causes. Plamen's free PSA at 0.3 is within range.","low_causes":"","high_causes":"BPH, prostatitis","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Free/Total Ratio","group":"PROSTATE","result":"0.184","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4842","lower_normal":"0.19","upper_normal":"0.38","lower_optimal":"0.25","upper_optimal":"0.38","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA free-to-total ratio helps interpret PSA results. A ratio above 0.25 (25%) strongly favours benign causes, while a ratio below 0.15 (15%) raises concern for malignancy. Plamen's ratio at 0.184 (18.4%) is marginally below the laboratory threshold of 0.19 but above the concerning threshold of 0.15. At a total PSA of only 1.63, this borderline ratio has essentially no clinical significance. The ratio becomes important when total PSA is elevated (above 4.0 or rising rapidly). No action is needed.","low_causes":"Prostate cancer (lower free fraction), testosterone use","high_causes":"BPH (higher free fraction)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0188","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker primarily associated with pancreatic cancer, though it can also be elevated in bile duct, liver, and bowel cancers, as well as benign conditions like pancreatitis and bile duct obstruction. Plamen's CA 19-9 at 1.39 is very low and well within range, which is reassuring.","low_causes":"","high_causes":"Pancreatic cancer, bile duct obstruction, cholangiocarcinoma, pancreatitis, liver disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"2.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2451","lower_normal":"0","upper_normal":"4.1","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2805","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a protein that can be elevated in bowel, lung, breast, and other cancers, as well as in smokers and people with inflammatory bowel disease. As a smoker, Plamen's reference range extends to 4.1 rather than the non-smoker threshold of 2.3. His CEA at 2.01 is within range even by non-smoker s const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible

function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }

function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';

  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
