ion is not surprising, but it adds to the cardiovascular risk picture described above and reinforces the need for the lifestyle changes discussed later in this report.\n\nMoving to the positives, and there are genuine ones. His thyroid is working well. TSH (thyroid stimulating hormone) is 1.07, comfortably within the optimal range of 1.0 to 2.5, and both free T4 at 15.4 and free T3 at 4.8 are within their optimal bands. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease entirely. His liver is in reasonable shape given the demands being placed on it. ALT at 33 is within the laboratory range of under 56, AST at 37 is within range, and FIB-4 at 1.06 is well below the concern threshold. GGT at 35 is within the male range of under 73 and below the optimal threshold of under 25 would be ideal, but at this level it is not alarming. Amylase and lipase, both markers of pancreatic function, are comfortably within range. His iron studies are in excellent balance. Ferritin at 83 sits within the optimal male range of 50 to 200, transferrin saturation at 34.7% is within the optimal band of 25 to 40%, and serum iron, transferrin, and total iron binding capacity are all mid-range. His blood glucose control is strong. Fasting glucose at 4.4 is within the optimal range below 5.4, and HbA1c at 33 mmol/mol is within the optimal range below 36, indicating excellent average blood sugar over the past three months. The insulin result was returned as insufficient by the laboratory, meaning the sample could not be analysed, so HOMA-IR and HOMA-B cannot be calculated. The C-peptide at 1.18 ug/L (390 pmol/L after conversion) sits just inside the lower end of the reference range, which alongside the excellent glucose and HbA1c suggests the pancreas is not under strain and insulin sensitivity is likely reasonable, consistent with a low-carb dietary pattern. His prostate markers are reassuring. PSA at 1.63 is well within the age-appropriate limit of under 3.5. The free PSA ratio at 0.184 is marginally below the 0.19 threshold that the laboratory flags as normal, but at this margin and with a total PSA this low, the clinical significance is negligible. This is not a finding that requires action. His immune system markers are broadly healthy. Total white cell count, neutrophils, lymphocytes, monocytes, eosinophils, and basophils are all within range. IgG, IgM, and IgE are within their reference ranges. IgA at 3.5 is at the very top of its range of 0.4 to 3.5, which is worth noting but not acting on in isolation. Tissue transglutaminase IgA is negative, effectively ruling out coeliac disease as a contributor to his bloating and digestive symptoms. Rheumatoid factor was returned as insufficient and could not be analysed. ESR (erythrocyte sedimentation rate, another inflammatory marker) at 2 is very low, which is reassuring. His electrolytes are stable, with sodium at 142, chloride at 97, and bicarbonate at 21.8 all within range. Magnesium at 1.09 is at the top of the laboratory range and above the optimal band of 0.85 to 1.05, which is a strong result. Total antioxidant activity at 1.47 is within range. Cortisol at 292 is within the expected morning range. DHEA-S at 3.5 umol/L (1,290 ug/dL equivalent) is within range. Progesterone at 2.28 is within the male reference range. CA 19-9 at 1.39 and CEA at 2.01 are both well within their respective ranges, which is reassuring.\n\nThe kidney markers deserve specific discussion. Creatinine-based eGFR is above 90, which looks fine, but Cystatin C, a more reliable marker of kidney filtration that is not affected by muscle mass, is 1.11 against an upper limit of 1.10, and the Cystatin C-based eGFR is 84. For context, an eGFR between 60 and 89 is classified as mildly reduced kidney function (stage G2). At 51, this is not alarming, but it is not optimal, and it may reflect the combined load of high-protein intake (diet volume 9 out of 10 on a high-protein plan), creatine supplementation or high meat intake, anabolic steroid use, and potentially mild dehydration from low fluid intake. Urea at 9.4, above the upper limit of 8.2, supports the picture of high protein turnover and possibly mild dehydration. Uric acid is 169, below the lower limit of 220, which is unusually low and may reflect the low-carb diet reducing purine metabolism, or possibly a renal handling issue where the kidneys are clearing uric acid very efficiently. On its own this is not a concern, but it is worth the GP noting alongside the Cystatin C finding.\n\nParathyroid hormone (PTH, the hormone that regulates calcium and phosphate balance) is 0.7 pmol/L, below the lower limit of 0.98. In the absence of a calcium result in this report, the clinical significance is harder to interpret. Low PTH can be seen with vitamin D sufficiency (his vitamin D is 74, sufficient but below the optimal threshold of 75), high calcium intake, or magnesium excess suppressing PTH release. His magnesium at 1.09 is at the top of range and above optimal, which could be contributing. This should be mentioned to the GP, who may wish to check serum calcium and phosphate to complete the picture.\n\nVitamin D at 74 nmol/L is sufficient by laboratory standards but sits just below the optimal threshold of 75. Given his BMI of 29.9, where fat tissue sequesters vitamin D, and his smoking, which impairs vitamin D metabolism, a supplementation dose to bring him into the 75 to 120 optimal range is appropriate. Vitamin B12 at 370 pg/mL is within the laboratory range but below the optimal threshold of 500. At this level, stores are adequate but not generous, and given the high training volume and metabolic demand, supplementation would be prudent. Serum folate was returned as insufficient by the laboratory, meaning it could not be analysed, so folate status is unknown and should be retested.\n\nCreatine kinase at 347 is marginally above the upper limit of 320. Given that Plamen trains seven times per week including three resistance sessions, and given that exogenous testosterone increases muscle protein turnover and training intensity, this is almost certainly exercise-related muscle breakdown rather than pathology. If it were ten times the upper limit, investigation would be needed, but at this margin and with this training volume, it is expected and not a concern.\n\nPlamen's MCHC at 344 is one point below the upper limit of 345, and his RDW at 14.8% is within range. Platelets at 310, MPV at 9.5, and reticulocytes at 1.13% are all comfortably within range. The tumour markers CA 19-9 and CEA are both well within their reference ranges.","links":"The most important conversations from this report are with his GP, and there are several. The first is the urine result showing significant growth of Enterococcus faecalis with microscopic haematuria at 40 red blood cells per microlitre. The GP should arrange a repeat mid-stream urine in a boric acid bottle. If haematuria persists on a clean sample, urological referral for imaging of the upper and lower urinary tract is appropriate at 51, regardless of whether infection is confirmed. The sensitivity panel is included in the report for treatment guidance if needed.\n\nThe second GP conversation is the polycythaemia. Haemoglobin 180, haematocrit 0.525, and red blood cell count 6.16 are all above their upper limits and are being driven by exogenous testosterone. The GP should be monitoring haematocrit at least every three to six months for anyone on testosterone replacement or supraphysiological doses. If haematocrit exceeds 0.54, venesection or dose reduction is typically recommended. The combination of elevated haematocrit with smoking is a particularly high-risk pairing for thromboembolic events, and Plamen should be aware of this.\n\nThe third conversation is cardiovascular risk. ApoB at 1.08, LDL at 3.74, HDL at 1.0, ApoB to ApoA1 ratio at 1.11, Lp(a) at 39.18, hs-CRP at 3.4, smoking status, sleep deprivation, and elevated haematocrit collectively represent a significant risk profile. The GP should consider formal cardiovascular risk assessment (QRISK3 or equivalent), discuss statin therapy given the ApoB level, and offer smoking cessation support. Lp(a) should be recorded permanently in his medical notes. First-degree relatives should be offered Lp(a) testing.\n\nThe fourth conversation is the suppressed LH and FSH alongside elevated oestradiol. If Plamen's testosterone use is being managed by a clinic, that clinic should see these results. If it is self-administered, the GP needs to be aware for monitoring purposes. The oestradiol at 151 above the male limit may warrant consideration of an aromatase inhibitor by the prescribing clinician, though this is a clinical decision that requires medical oversight.\n\nFor body composition, Plamen's BMI is 29.9 at 100 kg and 183 cm. His stated goal is fat loss. Using his stats and activity level (seven training sessions per week but very low non-exercise activity at under 2,000 steps), his estimated maintenance is approximately 2,800 to 2,900 calories per day. A deficit of 400 to 500 calories, targeting 2,300 to 2,500 calories daily, would produce steady fat loss of roughly 0.4 to 0.5 kg per week. A reasonable initial target would be 90 to 93 kg, reassessing body composition at that point. His diet is rated 6 out of 10 for quality, so there is room to improve food choices within the low-carb framework. Protein intake should be at least 160 to 180 grams per day (1.6 to 1.8 g/kg) given his resistance training and the elevated protein turnover from testosterone use. The diet volume at 9 out of 10 suggests he is eating a large amount of food, so the focus should be on reducing calorie-dense but nutrient-poor items rather than adding restriction.\n\nFor digestive symptoms, coeliac disease has been ruled out by the negative tissue transglutaminase result. The bloating and discomfort on a low-carb, high-protein diet may relate to high fat intake, inadequate fibre, or altered gut microbiome composition. Increasing non-starchy vegetable intake (broccoli, spinach, courgette, peppers, mushrooms) to at least five portions daily would provide fibre without significant carbohydrate load. A daily serving of fermented food (sauerkraut, kimchi, natural yoghurt, kefir) may support gut microbiome diversity. If symptoms persist, a food diary tracking specific trigger foods for two weeks would help identify patterns before any formal investigation.\n\nFor lipid management specifically, the dietary focus should be on increasing soluble fibre (oats if carb budget allows, or flaxseed, chia seeds, and psyllium husk which are very low carb), consuming oily fish at least three times per week (salmon, mackerel, sardines) for omega-3 and HDL support, reducing saturated fat from red meat and dairy by substituting with olive oil, avocado, and nuts, and adding plant sterols if tolerated. These measures alongside fat loss of 5 to 7 kg could meaningfully reduce ApoB.\n\nFor sleep, fewer than six hours most nights is contributing to elevated hs-CRP, impaired recovery, hormonal dysregulation, and increased appetite. The single most impactful lifestyle change Plamen could make from this report would be extending sleep to seven hours minimum. Practical steps: set a fixed wake time seven days a week, get outside within an hour of waking for natural light exposure, cut caffeine entirely after midday, keep the bedroom cool (16 to 18 degrees), and avoid screens for 30 to 60 minutes before bed. If falling asleep is the problem, magnesium glycinate before bed (which he may already be taking given his magnesium level) and a fixed wind-down routine would help.\n\nFor daily movement, fewer than 2,000 steps despite seven training sessions means Plamen is highly active in structured exercise but very sedentary outside of it. Non-exercise activity thermogenesis (NEAT) contributes significantly to daily calorie expenditure and metabolic health. Targeting 7,000 to 8,000 steps per day through walking, even a 20-minute walk after meals, would support fat loss, insulin sensitivity, and digestion.\n\nSmoking cessation is strongly recommended. Smoking independently raises haematocrit, suppresses HDL, increases hs-CRP, impairs vitamin D metabolism, accelerates arterial damage, and massively increases cardiovascular risk. Combined with the polycythaemia from testosterone use, this is the single highest-risk modifiable factor in the report. The GP can offer nicotine replacement therapy, varenicline, or referral to a smoking cessation service.\n\nRetesting should be arranged in 12 weeks, repeating: full blood count (haematocrit monitoring), lipid profile with ApoB, hs-CRP, oestradiol, LH, FSH, SHBG, liver function, Cystatin C, urea, and a repeat mid-stream urine in a boric acid bottle. Vitamin D and B12 should be rechecked at six months to confirm supplementation is working. Folate and rheumatoid factor should be repeated as they were not analysable on this sample. PTH should be repeated alongside serum calcium.","flags":"URGENT: GP REVIEW RECOMMENDED\n\n1. Urine: Significant growth of Enterococcus faecalis with RBC 40/uL (threshold 25), WBC 10/uL (borderline). Plain bottle received without boric acid. At 51, microscopic haematuria requires investigation regardless of culture. Recommend repeat MSU in boric acid bottle and, if haematuria persists, urological referral for upper and lower tract imaging. Sensitivity: ciprofloxacin, linezolid, teicoplanin, vancomycin, tigecycline all sensitive.\n\n2. Polycythaemia (testosterone-driven): Haemoglobin 180 (limit 170), RBC 6.16 (limit 5.5), haematocrit 0.525 (limit 0.50). Patient reports exogenous testosterone/PED use. Combined with smoking, this significantly elevates thromboembolic risk. Haematocrit monitoring every 3-6 months, venesection if exceeds 0.54.\n\n3. Hormonal suppression from exogenous testosterone: LH <0.07 (range 1.5-9.3), FSH 0.32 (range 1.4-18.1), SHBG 9.2 (range 17.3-65.8), Free Androgen Index 312 (range 30-150), Oestradiol 151 (limit 146.1). Complete gonadotropin suppression confirms exogenous source. Elevated oestradiol from aromatisation. Fertility will be significantly impaired.\n\n4. Cardiovascular risk profile: ApoB 1.08 (target <0.9), LDL 3.74 (target <3.0), HDL 1.0 (desirable >1.04), ApoA1 0.97 (desirable >1.20), ApoB/A1 ratio 1.11 (higher risk >0.9), Lp(a) 39.18 (threshold 32), hs-CRP 3.4, TC/HDL ratio 5.2 (target <4.5), Non-HDL 4.2 (target <4.0). Smoker with sleep deprivation and polycythaemia. Formal cardiovascular risk assessment and consideration of statin therapy recommended. Lp(a) is inherited and should be recorded permanently.\n\n5. Kidney function: Cystatin C 1.11 (limit 1.10), Cystatin C eGFR 84 (mildly reduced, stage G2). Urea 9.4 (limit 8.2). Likely reflects high protein load, exogenous androgens, and possibly mild dehydration. Monitor on retest.\n\n6. PTH 0.7 (range 0.98-4.73). No calcium result available. May reflect suppression from high magnesium (1.09, top of range) or adequate calcium intake. Recommend checking serum calcium and phosphate.\n\n7. Uric acid 169 (range 220-547). Unusually low. Likely dietary or related to renal handling. Not clinically urgent but should be noted alongside kidney markers.\n\n8. PSA free ratio 0.184 (lab threshold 0.19). Total PSA 1.63 is low. At this total PSA level, the marginally below-threshold ratio has no clinical significance. No action needed.\n\n9. Creatine kinase 347 (limit 320). Marginal elevation consistent with high training volume and exogenous testosterone. Not a concern at this level.\n\nINCOMPLETE RESULTS: Insulin returned as insufficient (not analysable), HOMA-IR and HOMA-B cannot be calculated. Serum folate returned as insufficient. Rheumatoid factor returned as insufficient. All three should be repeated.\n\nReassuring negatives: Thyroid function normal with negative antibodies. Liver enzymes within range with FIB-4 1.06. Iron studies well balanced. Glucose and HbA1c optimal. PSA low. CA 19-9 and CEA normal. Coeliac screen negative. ESR 2. Platelets, reticulocytes, white cell differential all normal.","recommendations":"1. See GP urgently to discuss the urine culture and microscopic haematuria. Arrange a repeat mid-stream urine in a boric acid bottle. If haematuria persists, urological referral is warranted.\n\n2. See GP to discuss haematocrit of 0.525 in the context of testosterone use and smoking. Haematocrit monitoring should be established every three to six months.\n\n3. Discuss cardiovascular risk formally with GP, bringing the ApoB, Lp(a), hs-CRP, and lipid results. Consider statin therapy and record Lp(a) permanently.\n\n4. Share oestradiol, LH, FSH, and SHBG results with prescribing clinician or GP for testosterone dose review and possible aromatase inhibitor consideration.\n\n5. Stop smoking. This is the single highest-impact change for cardiovascular risk reduction. Seek GP support for cessation.\n\n6. Extend sleep to a minimum of seven hours per night. Fixed wake time, natural light exposure in the morning, no caffeine after midday, cool bedroom.\n\n7. Increase daily steps to 7,000 to 8,000, prioritising post-meal walks.\n\n8. Target 2,300 to 2,500 calories per day for steady fat loss toward 90 to 93 kg. Maintain protein at 160 to 180 grams per day.\n\n9. Improve diet quality from 6 to 8 out of 10: add five portions of non-starchy vegetables daily, oily fish three times per week, increase soluble fibre through flaxseed, chia seeds, or psyllium husk, reduce saturated fat from red meat and dairy.\n\n10. Add a daily fermented food (sauerkraut, kimchi, kefir, natural yoghurt) for gut health and bloating.\n\n11. Begin vitamin D3 supplementation at 3,000 IU daily with a fat-containing meal, paired with vitamin K2 MK-7 at 100 to 200 mcg.\n\n12. Begin sublingual methylcobalamin B12 at 1,000 mcg daily.\n\n13. Request GP checks serum calcium and phosphate to interpret the low PTH.\n\n14. Retest in 12 weeks: full blood count, lipid profile with ApoB, hs-CRP, oestradiol, LH, FSH, SHBG, liver function, Cystatin C, urea, repeat mid-stream urine. Retest vitamin D and B12 at six months. Repeat folate, rheumatoid factor, and insulin on next draw.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with the largest fat-containing meal of the day. At a BMI of 29.9, fat tissue sequesters vitamin D, so a slightly higher dose than standard is appropriate to move from 74 into the 75 to 120 optimal range. This should always be paired with vitamin K2 to ensure calcium is directed into bone rather than soft tissue.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside the vitamin D3. This is particularly relevant given the low PTH, as calcium metabolism may need support, and K2 ensures any additional calcium is properly utilised.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue for direct absorption. His B12 at 370 is within the laboratory range but below the optimal threshold of 500. On a high-protein diet heavy in meat, dietary B12 intake is likely adequate, but stores are not generous, and sublingual supplementation is a low-risk way to optimise levels.\n\nOmega-3 fish oil (EPA and DHA combined): 2 to 3 grams daily, taken with food. This supports HDL, helps lower triglycerides, provides anti-inflammatory benefit against the hs-CRP of 3.4, and may modestly reduce ApoB. If Plamen increases oily fish to three servings per week as recommended, the supplement dose can be reduced to 1 to 2 grams.\n\nPsyllium husk: 5 to 10 grams daily mixed into water, taken before a meal. This provides soluble fibre that binds bile acids and lowers LDL cholesterol by 5 to 10%, supports digestive regularity, and may help with the bloating if constipation is a contributing factor. It is very low in net carbohydrates and compatible with his low-carb approach.\n\nPlamen's magnesium at 1.09 is at the top of the range and above optimal, so additional magnesium supplementation is not needed at this time. If he is currently taking a magnesium supplement, he could reduce or stop it and recheck on the next blood draw.\n\nDO NOT supplement with iron. His ferritin at 83 and transferrin saturation at 34.7% are within optimal ranges, and the polycythaemia means additional iron would further fuel red blood cell production and worsen the already elevated haemoglobin and haematocrit.\n\nThe most important changes from this report are not supplements. They are stopping smoking, extending sleep to seven or more hours per night, increasing daily steps, and having the GP conversations about haematocrit, cardiovascular risk, the urine findings, and hormone management. No supplement can offset the impact of smoking and sleep deprivation on cardiovascular risk, inflammation, and recovery.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2946","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. It is one of the most sensitive markers of liver cell injury. Plamen's ALT at 33 is within the laboratory range of under 56 but sits above the optimal male threshold of under 30. At this level, it does not indicate significant liver disease, but it is not as clean as it could be. The combination of exogenous testosterone use, high-protein intake, and smoking all place metabolic demand on the liver. Monitoring on retest is sensible.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, hepatitis, medication effects, alcohol excess, intense exercise, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and skeletal muscle. Unlike ALT, which is almost exclusively hepatic, an elevated AST can come from muscle damage as well as liver injury. Plamen's AST at 37 is within the reference range of 13 to 45 and within the optimal range. Given his high training volume and marginally elevated creatine kinase, the AST is likely receiving a small contribution from muscle turnover rather than liver stress.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart disease, intense exercise, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2397","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to bile duct obstruction, alcohol use, and metabolic stress. It is often the first liver enzyme to rise with alcohol consumption or fatty liver. Plamen's GGT at 35 is within the male laboratory range of 4 to 73 but above the optimal threshold of under 25. This may reflect metabolic load from exogenous testosterone use, high protein turnover, or general metabolic demand. It is not alarming but is worth monitoring.","low_causes":"","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, medication effects, metabolic syndrome, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, kidneys, and intestines. Elevated levels can indicate bile duct obstruction or bone disorders. Plamen's ALP at 67 is comfortably mid-range and within the optimal band, indicating no bile duct or bone issues.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, Paget's disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Elevated bilirubin can indicate liver dysfunction, bile duct obstruction, or increased red cell destruction. Plamen's bilirubin at 11 is mid-range and within optimal limits, suggesting the liver is clearing bilirubin efficiently despite the increased red cell turnover from polycythaemia.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4533","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined level of albumin and globulin in the blood. It reflects liver synthetic function, immune activity, and nutritional status. Plamen's total protein at 78 is within both the laboratory and optimal ranges, indicating good protein production and immune function.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, immune disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and reflects liver synthetic capacity and nutritional status. Plamen's albumin at 44 is within the optimal range, indicating the liver is producing protein well.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6296","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins including immunoglobulins (antibodies) and transport proteins. It is calculated by subtracting albumin from total protein. Plamen's globulin at 34 is within the laboratory range but sits above the optimal upper limit of 32, suggesting mildly elevated immune or inflammatory protein activity. This is consistent with the hs-CRP of 3.4 and the overall inflammatory load from smoking and sleep deprivation.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio is calculated by dividing albumin by globulin. It provides insight into the balance between liver synthetic function and immune/inflammatory activity. A low ratio can suggest chronic inflammation or liver disease. Plamen's ratio at 1.29 is within the optimal range, indicating a healthy balance between the two protein fractions.","low_causes":"Liver disease, chronic inflammation, autoimmune disease","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"1.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3655","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. A score below 1.3 (or below 2.0 for those over 65) suggests a low probability of significant fibrosis. Plamen's FIB-4 at 1.06 is reassuringly below the threshold, indicating no evidence of significant liver scarring despite the metabolic demands placed on the liver by exogenous testosterone use, high-protein diet, and smoking.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, older age, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands to break down starches. Elevated amylase may indicate pancreatitis or pancreatic disease. Plamen's amylase at 86 is comfortably within range, indicating no pancreatic stress.","low_causes":"Pancreatic insufficiency, cystic fibrosis","high_causes":"Pancreatitis, pancreatic obstruction, salivary gland inflammation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5745","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is an enzyme produced by the pancreas to digest fats. It is a more specific marker for pancreatic disease than amylase. Plamen's lipase at 47 is within range, confirming no pancreatic inflammation or dysfunction.","low_causes":"Pancreatic insufficiency","high_causes":"Pancreatitis, pancreatic cancer, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5019","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4827","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL fractions. While the total number provides an overview, the breakdown into its components is far more informative. Plamen's total cholesterol at 5.2 is marginally above the desirable threshold of 5.18. The concern lies not in the total but in the distribution: LDL and ApoB are elevated while HDL and ApoA1 are low, creating an unfavourable atherogenic profile.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle, smoking","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3265","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat storage in the body and are carried in the blood by VLDL particles. Elevated triglycerides are associated with insulin resistance, metabolic syndrome, and cardiovascular risk. Plamen's triglycerides at 1.11 are within the laboratory range of under 1.7 but above the optimal threshold of under 1.0. For a low-carb diet, triglycerides are typically expected to be lower, so this level suggests either recent dietary variation, alcohol contribution, or the metabolic effects of exogenous testosterone.","low_causes":"Very low-fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate or sugar intake, alcohol excess, obesity, insulin resistance, metabolic syndrome, medication effects","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3205","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. Elevated VLDL contributes to atherogenic particle burden. Plamen's VLDL at 0.5 is within both the laboratory and optimal ranges, indicating triglyceride transport is well controlled.","low_causes":"","high_causes":"High carbohydrate intake, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"1.04","upper_normal":"2.08","lower_optimal":"1.4","upper_optimal":"2.08","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is often called 'good cholesterol' because it carries cholesterol away from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Low HDL is an independent risk factor for cardiovascular disease. Plamen's HDL at 1.0 falls below the desirable threshold of 1.04. Exogenous testosterone is well known to suppress HDL, and this is compounded by smoking, sleep deprivation, and low non-exercise activity. Increasing aerobic exercise volume, stopping smoking, and improving sleep are the most effective non-pharmacological ways to raise HDL.","low_causes":"Smoking, anabolic steroid use, sedentary lifestyle, obesity, metabolic syndrome, poor diet, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6240","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL (low-density lipoprotein) is the primary carrier of cholesterol into artery walls, where it can oxidise and trigger plaque formation. Plamen's LDL at 3.74 is above the laboratory target of under 3.0 and well above the optimal target of under 2.6. Combined with his elevated ApoB, low HDL, raised Lp(a), elevated hs-CRP, smoking, and polycythaemia, this contributes to a cardiovascular risk profile that warrants active management through lifestyle changes and GP discussion about pharmacological intervention.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, obesity, sedentary lifestyle, smoking, anabolic steroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5778","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio reflects the balance between atherogenic and protective cholesterol. A lower ratio indicates a more favourable profile. Plamen's ratio at 5.2 exceeds the target of under 4.5, driven by the combination of elevated total cholesterol and low HDL. This ratio reinforces the unfavourable lipid distribution seen across the other markers.","low_causes":"","high_causes":"Elevated total cholesterol, low HDL, poor diet, sedentary lifestyle, smoking, anabolic steroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"19.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"20","upper_normal":"40","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This percentage represents how much of the total cholesterol is carried in protective HDL particles. A higher percentage is more favourable. Plamen's HDL makes up only 19.2% of his total cholesterol, below the desirable threshold of 20%, reflecting the suppressed HDL and elevated LDL described above.","low_causes":"Low HDL, elevated total cholesterol, smoking, anabolic steroid use, sedentary lifestyle","high_causes":"Regular exercise, healthy weight, good diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.525","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.425","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all atherogenic cholesterol, including LDL, VLDL, IDL, and Lp(a). Many guidelines consider it a better predictor of cardiovascular risk than LDL alone. Plamen's non-HDL at 4.2 is above the target of under 4.0, reflecting the combined burden of elevated LDL and moderately raised triglyceride-rich lipoproteins.","low_causes":"","high_causes":"Elevated LDL, elevated triglycerides, high saturated fat intake, obesity, genetic factors","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is the protein that sits on the surface of every atherogenic lipoprotein particle, meaning LDL, VLDL, IDL, and Lp(a) each carry exactly one ApoB molecule. Measuring ApoB therefore gives a direct count of the total number of particles capable of entering artery walls and driving plaque formation. Many cardiologists now consider ApoB the single best predictor of cardiovascular risk. Plamen's ApoB at 1.08 is in the borderline high category (1.0 to 1.19) and well above the desirable target of under 0.9 and the optimal target of under 0.8. This is the number to bring to the GP conversation about cardiovascular risk management.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"High saturated fat diet, genetic factors, hypothyroidism, obesity, metabolic syndrome, anabolic steroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"0.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4042","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 (apolipoprotein A1) is the main structural protein of HDL particles. It drives reverse cholesterol transport, the process of removing cholesterol from artery walls. Higher ApoA1 means more functional HDL particles and better cardiovascular protection. Plamen's ApoA1 at 0.97 is below the desirable threshold of 1.20, mirroring his low HDL. Exogenous testosterone, smoking, and low non-exercise activity all suppress ApoA1 production.","low_causes":"Smoking, anabolic steroid use, sedentary lifestyle, obesity, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7929","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered by many researchers to be the single best summary measure of cardiovascular risk from lipoproteins. It captures both the number of atherogenic particles (ApoB) and the capacity for reverse cholesterol transport (ApoA1) in one number. A ratio below 0.7 indicates lower risk, 0.7 to 0.9 average risk, and above 0.9 higher risk. Plamen's ratio at 1.11 places him firmly in the higher-risk category, reflecting the combination of elevated atherogenic particles and reduced protective capacity.","low_causes":"","high_causes":"Elevated ApoB, low ApoA1, high cardiovascular risk profile","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"39.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6122","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lp(a), pronounced 'lipoprotein little a', is a specialised lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It promotes atherosclerosis through three mechanisms: it deposits cholesterol into artery walls like LDL, it encourages blood clot formation, and it drives local inflammation. The critical point about Lp(a) is that its level is almost entirely genetically determined. It does not change with diet, exercise, weight loss, or any currently available medication (though new therapies are in development). Plamen's Lp(a) at 39.18 is above the threshold of 32, placing him in the slightly increased risk category. This result should be recorded as a permanent part of his medical notes because it will not change. His first-degree relatives, parents, siblings, and children, should also be tested. The positive aspect is that at 39 rather than 200 or 400, the contribution from Lp(a) is modest, and the modifiable risk factors (ApoB, HDL, smoking, sleep, hs-CRP) are where the focus should be.","low_causes":"","high_causes":"Genetic inheritance (almost entirely determined by genetics)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2875","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles (the leftover fragments after VLDL delivers its triglyceride load). Elevated remnant cholesterol is an emerging independent cardiovascular risk factor. Plamen's remnant cholesterol at 0.46 is within the optimal range of under 0.5, indicating that triglyceride-rich remnants are not a significant contributor to his cardiovascular risk. The risk is being driven primarily by LDL particle number (ApoB) rather than remnant particles.","low_causes":"","high_causes":"Elevated triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.37","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a simple but powerful surrogate marker for insulin resistance and small, dense LDL particles. A lower ratio indicates better insulin sensitivity and larger, less dangerous LDL particles. Plamen's ratio at 1.11 is within the laboratory range but above the optimal threshold of 0.87, suggesting mild insulin resistance and a tendency toward smaller, denser LDL particles. Weight loss, increased activity, and dietary improvement would help lower this ratio.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate intake, low HDL, elevated triglycerides","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3933","upper_optimal_position":"0.5600","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body is managing blood sugar in the resting state. Plamen's glucose at 4.4 is within the optimal range of 4.0 to 5.4, indicating excellent fasting blood sugar control. This is consistent with his low-carb dietary pattern, which reduces the glucose load the body needs to manage.","low_causes":"Fasting, insulin overdose, excessive exercise, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, insulin resistance, stress, medication effects, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.425","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6067","units":"%","description":"HbA1c measures the percentage of haemoglobin molecules in red blood cells that have glucose attached. Because red blood cells live for approximately three months, HbA1c provides a rolling average of blood sugar control over that period. Plamen's HbA1c at 5.1% is well within the normal range of under 6.0% and consistent with excellent blood sugar management.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, insulin resistance, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the IFCC-standardised measurement of HbA1c expressed in mmol/mol, used alongside the percentage format. Plamen's HbA1c at 33 mmol/mol is well within the optimal threshold of under 36, confirming excellent long-term blood sugar control. A result below 42 is considered normal, 42 to 47 is pre-diabetes, and above 48 indicates diabetes.","low_causes":"Haemolytic anaemia, blood loss, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is releasing to maintain blood sugar. It is a key marker for assessing insulin resistance when combined with glucose in the HOMA-IR calculation. Unfortunately, the laboratory was unable to analyse Plamen's insulin sample, returning it as 'Insufficient.' This means HOMA-IR and HOMA-B cannot be calculated. This marker should be repeated on the next blood draw.","low_causes":"Type 1 diabetes, low carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome, obesity, type 2 diabetes, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3561","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5242","units":"ug/l","description":"C-peptide is released by the pancreas in equal amounts to insulin when it converts proinsulin into active insulin. It provides a reliable measure of how much insulin the pancreas is actually producing, unaffected by external insulin injection. Plamen's C-peptide at 1.18 ug/L (equivalent to approximately 390 pmol/L) sits just inside the lower end of the laboratory range. Given his excellent glucose at 4.4 and HbA1c at 33, this low-normal C-peptide simply reflects that the pancreas is not being asked to work hard, consistent with a low-carb diet that generates minimal insulin demand. This is a reassuring finding rather than a concern.","low_causes":"Low carbohydrate intake, high insulin sensitivity, type 1 diabetes, fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.34","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"hs-CRP (high-sensitivity C-reactive protein) is produced by the liver in response to inflammation anywhere in the body. In cardiovascular medicine, it is used as an independent predictor of heart disease risk. Values below 1.0 are considered low risk, 1.0 to 3.0 moderate risk, and above 3.0 high risk. Plamen's hs-CRP at 3.4 falls in the high cardiovascular risk category. While within the laboratory range of under 5, it is well above the optimal target of under 1.0. Contributors likely include smoking (a potent driver of systemic inflammation), sleep deprivation (fewer than six hours raises inflammatory markers), BMI of 29.9, and the high training volume without adequate recovery. This is a modifiable marker that should improve significantly with smoking cessation, extended sleep, and gradual weight loss.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, smoking, sleep deprivation, metabolic syndrome, autoimmune disease, cardiovascular disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube in one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red cells to clump and fall faster. Plamen's ESR at 2 is very low and well within the optimal range, which is reassuring. The disconnect between a low ESR and a raised hs-CRP may relate to the polycythaemia: a very high red cell count can artificially slow sedimentation, so ESR may be less reliable here while hs-CRP is likely the more accurate reflection of inflammatory status.","low_causes":"Polycythaemia, sickle cell disease, very high white cell count","high_causes":"Infection, inflammation, autoimmune disease, cancer, anaemia, pregnancy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5256","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6180","units":"mmol/l","description":"Sodium is the primary electrolyte regulating fluid balance, blood pressure, and nerve function. Plamen's sodium at 142 is within the optimal range, indicating normal fluid and electrolyte balance.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH, diarrhoea, vomiting","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3487","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6180","units":"mmol/l","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and acid-base status. Plamen's chloride at 97 is within the laboratory range but marginally below the optimal band of 98 to 106. This is of no clinical concern at this margin.","low_causes":"Vomiting, diuretics, metabolic alkalosis, adrenal insufficiency","high_causes":"Dehydration, renal tubular acidosis, excessive saline intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"21.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3697","lower_normal":"20","upper_normal":"31","lower_optimal":"23","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3606","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is the body's primary acid buffer, maintaining blood pH within its narrow range. Plamen's bicarbonate at 21.8 is within the laboratory range but below the optimal band of 23 to 29. A mildly lower bicarbonate can be seen with high-protein diets (which generate more acid from protein metabolism) and with intense exercise. It is not a concern at this level.","low_causes":"Metabolic acidosis, high-protein diet, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Vomiting, metabolic alkalosis, diuretics, COPD","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6609","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6350","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle contraction, nerve function, and protein synthesis. It is essential for sleep quality, recovery from exercise, and cardiovascular health. Plamen's magnesium at 1.09 is within the laboratory range but above the optimal upper limit of 1.05. This suggests he may be supplementing with magnesium or has an unusually rich dietary intake. While not dangerous, the high-normal level may be contributing to the suppressed PTH, as magnesium influences parathyroid hormone release. If he is supplementing, a dose reduction and recheck would be prudent.","low_causes":"Poor dietary intake, alcohol excess, diuretics, diabetes, malabsorption, excessive sweating","high_causes":"Magnesium supplementation, kidney disease, excessive intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"169","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2578","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3027","upper_optimal_position":"0.5533","units":"umol/l","description":"Uric acid is the end product of purine metabolism. Purines come from dietary sources (red meat, organ meats, shellfish) and from the body's own cell turnover. Normally, uric acid is filtered by the kidneys and excreted. Plamen's uric acid at 169 is below the lower limit of 220, which is unusually low. On a high-protein diet rich in meat, one might expect uric acid to be in the middle or upper portion of the range. Low uric acid can be seen with a very low-purine variant of low-carb diet, or may suggest the kidneys are excreting uric acid very efficiently (uricosuric effect). It can also be associated with low antioxidant reserve, as uric acid itself has antioxidant properties. This is not a clinical emergency but is worth noting for the GP alongside the kidney markers.","low_causes":"Low-purine diet, Fanconi syndrome, Wilson's disease, SIADH, uricosuric medications, high renal clearance","high_causes":"Gout, high-purine diet, kidney disease, metabolic syndrome, obesity, dehydration, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"9.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7067","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced in the liver and excreted by the kidneys. It reflects both protein intake and kidney clearance capacity. Plamen's urea at 9.4 is above the upper limit of 8.2. Given his high-protein diet with a volume of 9 out of 10, elevated urea is expected as the body processes and excretes nitrogen from protein. However, when combined with the Cystatin C eGFR of 84, it raises the question of whether the kidneys are handling the protein load comfortably. Adequate hydration, which may be suboptimal given fewer than 2,000 daily steps and possible low fluid intake, and a modest reduction in protein if the next retest shows a similar or worsening pattern, would be reasonable steps.","low_causes":"Low protein diet, liver disease, overhydration, malnutrition","high_causes":"High protein intake, dehydration, kidney disease, gastrointestinal bleeding, catabolic states, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4786","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6026","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism, produced at a fairly constant rate based on muscle mass. It is filtered by the kidneys, so elevated creatinine can indicate reduced kidney function. Plamen's creatinine at 82 is within the optimal range. However, creatinine-based eGFR can overestimate kidney function in people with high muscle mass from training and testosterone use, which is why Cystatin C provides a more reliable picture in Plamen's case.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) calculates how efficiently the kidneys filter waste from the blood. It is derived from creatinine, age, and sex. A result above 90 is considered normal, 60 to 89 mildly reduced, and below 60 indicates chronic kidney disease. Plamen's creatinine-based eGFR is reported as above 90, which appears normal. However, as discussed, creatinine can be affected by high muscle mass and exogenous testosterone use, potentially overestimating true kidney function. The Cystatin C-based eGFR at 84 provides a more accurate picture.","low_causes":"Kidney disease, dehydration, obstruction, medication effects","high_causes":"High cardiac output, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells and filtered freely by the kidneys. Unlike creatinine, its level is not affected by muscle mass, diet, or gender, making it a more reliable marker of kidney function in people who train heavily or have high muscle mass. Plamen's Cystatin C at 1.11 is marginally above the upper limit of 1.10. The Cystatin C-based eGFR of 84 classifies his kidney function as mildly reduced (stage G2, range 60-89). At 51, this may reflect the combined load of high-protein intake, exogenous testosterone, and possible mild dehydration. It should be monitored and discussed with the GP.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The Cystatin C-based eGFR provides a more accurate estimation of kidney filtration rate than creatinine-based eGFR, particularly in individuals with high or low muscle mass. Plamen's Cystatin C eGFR of 84 is within the laboratory range of above 60 but below the optimal threshold of above 90. This places him in the CKD stage G2 category (mildly reduced). At 51, this warrants monitoring rather than alarm, but the combination with elevated urea and the metabolic load from high protein intake and exogenous androgens means the kidneys are working harder than ideal. Adequate hydration is essential.","low_causes":"Kidney disease, dehydration, obstruction, medication effects","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"180","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein within red blood cells. It picks up oxygen in the lungs and delivers it to every tissue in the body. Plamen's haemoglobin at 180 is above the male upper limit of 170. This is being driven by exogenous testosterone, which stimulates erythropoietin production in the kidneys, causing the bone marrow to produce more red blood cells. While a higher haemoglobin means more oxygen-carrying capacity, the downside is thicker, more viscous blood that is harder for the heart to pump and more likely to clot. This finding, combined with the elevated haematocrit and red cell count, constitutes polycythaemia and requires GP monitoring.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Exogenous testosterone/anabolic steroids, dehydration, polycythaemia vera, chronic hypoxia, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"6.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8733","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Plamen's RBC at 6.16 is well above the upper limit of 5.5, consistent with testosterone-driven erythrocytosis. More red cells mean thicker blood and higher clotting risk. This is part of the polycythaemia pattern that requires GP monitoring.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow failure, chronic disease, blood loss","high_causes":"Exogenous testosterone, polycythaemia vera, dehydration, chronic hypoxia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.525","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"l/l","description":"Haematocrit (HCT) measures the proportion of total blood volume occupied by red blood cells. It is the most clinically important number for monitoring polycythaemia risk. Plamen's HCT at 0.525 is above the upper limit of 0.50. Most guidelines recommend intervention (dose reduction of testosterone or therapeutic venesection) if haematocrit exceeds 0.54. At 0.525, Plamen is approaching that threshold. Combined with smoking, which further increases red cell production and blood viscosity, this needs active monitoring. The GP should check haematocrit every three to six months.","low_causes":"Anaemia, blood loss, overhydration, bone marrow failure","high_causes":"Exogenous testosterone, dehydration, polycythaemia vera, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"85.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3519","lower_normal":"83","upper_normal":"101","lower_optimal":"83","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6050","units":"fl","description":"MCV (mean corpuscular volume) measures the average size of red blood cells. Small cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. Plamen's MCV at 85.1 is within the optimal range, indicating red cells are a normal size. The excess red cells being produced are of normal size, confirming the polycythaemia is driven by increased production (from testosterone) rather than a haematological disorder affecting cell size.","low_causes":"Iron deficiency, thalassaemia, chronic disease, lead poisoning","high_causes":"B12 deficiency, folate deficiency, alcohol excess, liver disease, hypothyroidism, myelodysplastic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"29.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"pg","description":"MCH (mean corpuscular haemoglobin) measures the average amount of haemoglobin packed into each red blood cell. Plamen's MCH at 29.2 is within the optimal range, confirming that each red cell carries a healthy amount of haemoglobin. The issue is the total number of cells, not the quality of individual cells.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 deficiency, folate deficiency, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"344","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"MCHC (mean corpuscular haemoglobin concentration) measures the average concentration of haemoglobin within red blood cells. Plamen's MCHC at 344 is one point below the upper limit of 345 and above the optimal upper limit of 340. At this margin, it is of no clinical concern and may reflect minor laboratory variation or the effects of sample temperature and storage, as the lab notes.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6476","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"%","description":"RDW (red cell distribution width) measures the variation in size among red blood cells. A wider distribution suggests a mix of older and newer cells or different-sized populations. Plamen's RDW at 14.8% is within the laboratory range but above the optimal upper limit of 14.0%. Given the active erythrocytosis from testosterone use, the bone marrow is producing new cells at an increased rate, which can introduce slightly more size variation. This is not a concern at this level.","low_causes":"","high_causes":"Iron deficiency, B12/folate deficiency, mixed nutritional deficiency, chronic disease, recent blood loss, haemoglobinopathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"310","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5282","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.6218","units":"x10^9/L","description":"Platelets are cell fragments that initiate blood clotting when a vessel is damaged. Too few platelets can cause bleeding; too many can promote clotting. Plamen's platelets at 310 are within the optimal range, indicating normal clotting cell production. In the context of polycythaemia, it is reassuring that platelet count is not also elevated, as that would compound clotting risk further.","low_causes":"Bone marrow failure, viral infections, autoimmune disorders, medication effects, liver disease","high_causes":"Inflammation, infection, iron deficiency, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6567","units":"fL","description":"MPV (mean platelet volume) measures the average size of platelets. Larger platelets tend to be more reactive and may be associated with increased clotting tendency. Plamen's MPV at 9.5 is within the optimal range, which is reassuring in the context of his polycythaemia.","low_causes":"Bone marrow suppression, cytotoxic therapy, aplastic anaemia","high_causes":"Increased platelet turnover, immune thrombocytopenia, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"7.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5388","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6389","units":"x10^9/L","description":"White blood cells (WBC) are the immune system's primary defence against infection. The total count reflects overall immune system activity. Plamen's WBC at 7.73 is within the optimal range, indicating a normally active immune system.","low_causes":"Viral infections, bone marrow failure, autoimmune disorders, medication effects, nutritional deficiency","high_causes":"Infection, inflammation, stress, smoking, corticosteroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils", _position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest pathogens and dead cells. They also play a role in chronic inflammation and tissue repair. Plamen's monocytes at 0.46 are within the optimal range.","low_causes":"Bone marrow failure, hairy cell leukaemia","high_causes":"Chronic infection, autoimmune disease, inflammatory conditions, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasites and mediating allergic responses. Plamen's eosinophils at 0.19 are within the optimal range, with no evidence of allergic activation or parasitic infection.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infection, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Basophils are the least common white blood cells, involved in allergic and inflammatory responses and releasing histamine. Plamen's basophils at 0.06 are within the optimal range.","low_causes":"Acute allergic reaction
