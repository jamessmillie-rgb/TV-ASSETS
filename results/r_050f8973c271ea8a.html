per_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3455","upper_optimal_position":"0.6061","units":"ug/l","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It provides a reliable measure of how much insulin the body is actually producing, because unlike insulin, it is not extracted by the liver before reaching the bloodstream. At 1.18 ug per litre, equivalent to approximately 390 pmol per litre, Plamen's C-Peptide is within the normal range but at the lower end. On a low-carb diet with excellent blood sugar control, a lower C-Peptide is expected because the pancreas does not need to produce much insulin when carbohydrate intake is low. This is a physiologically appropriate response, not a sign of pancreatic weakness.","low_causes":"Type 1 diabetes, low carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, type 2 diabetes, pancreatic tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.34","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein is a marker of systemic inflammation produced by the liver. It is also an independent predictor of cardiovascular risk. The American Heart Association classifies levels below 1.0 as lower risk, 1.0 to 3.0 as moderate risk, and above 3.0 as higher risk. At 3.4, Plamen's hs-CRP is within the laboratory range of below 5 but above the higher risk threshold. Multiple factors in his profile could be driving this: smoking is a potent driver of systemic inflammation, BMI approaching 30 means more visceral fat producing inflammatory cytokines, sleep deprivation raises inflammatory markers, and anabolic steroid use can contribute. Addressing smoking, sleep, and body fat would be the most effective ways to reduce this marker.","low_causes":"","high_causes":"Smoking, obesity, infection, chronic inflammation, sleep deprivation, cardiovascular disease risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle in a test tube over one hour. It is a non-specific marker of inflammation. A high ESR can indicate infection, autoimmune disease, or chronic inflammation. At 2, Plamen's ESR is very low and well within optimal, which is reassuring and suggests no significant chronic inflammatory or autoimmune process.","low_causes":"","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"INFLAMMATION","result":"2.42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5700","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is calculated by dividing the neutrophil count by the lymphocyte count. It is an emerging marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, with an optimal range of 1 to 2. At 2.42, Plamen's NLR is within the normal range but above optimal, consistent with the mild inflammatory signal seen in his hs-CRP. Smoking is a known driver of a higher NLR.","low_causes":"Viral infection, autoimmune conditions","high_causes":"Bacterial infection, physiological stress, smoking, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Sodium is the primary electrolyte in the blood that maintains fluid balance, blood pressure, and nerve and muscle function. At 142, this is well within both the normal and optimal ranges.","low_causes":"Dehydration, excessive fluid intake, kidney disease, medications","high_causes":"Dehydration, excessive salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance, blood pressure, and acid-base balance. At 97, this is within the normal range and close to the lower end. It is not concerning but is marginally below the optimal band of 98 to 106.","low_causes":"Vomiting, excessive sweating, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"21.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3697","lower_normal":"20","upper_normal":"31","lower_optimal":"23","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3606","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is a buffer that helps maintain the acid-base balance of the blood. At 21.8, this is within the laboratory range but below the optimal band of 23 to 29. A mildly lower bicarbonate can be seen with high-protein diets due to the acid load from protein metabolism, and with intense exercise. This is not a concern but is consistent with his dietary pattern.","low_causes":"Metabolic acidosis, high-protein diet, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5920","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4885","upper_optimal_position":"0.5885","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle contraction, nerve function, energy production, and sleep regulation. At 1.09, Plamen's magnesium is within the laboratory range and sits just above the optimal upper limit of 1.05. This is a strong result. Despite this good serum level, supplemental magnesium glycinate before bed may still benefit sleep quality, as serum magnesium does not always reflect intracellular stores.","low_causes":"Poor dietary intake, alcohol, medications, gastrointestinal losses","high_causes":"Excessive supplementation, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ua","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"169","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2580","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3170","upper_optimal_position":"0.4712","units":"umol/l","description":"Uric acid is a waste product formed when the body breaks down purines, which are found in certain foods and are produced during normal cell turnover. It is filtered by the kidneys and excreted in urine. At 169, Plamen's uric acid is below the lower limit of 220. Low uric acid is uncommon and is usually benign. It can occur with high fluid intake, low purine diets, or occasionally with increased renal clearance or kidney tubular issues. On a high-protein diet that typically includes purine-rich foods like meat and fish, a level this low is slightly unusual and is worth mentioning to the GP in the context of his kidney findings, though it does not indicate a specific disease.","low_causes":"High fluid intake, low purine diet, kidney tubular disorders, liver disease","high_causes":"Gout, kidney disease, high purine diet, alcohol, dehydration, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"9.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7467","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5800","units":"mmol/l","description":"Urea is a waste product of protein metabolism, produced by the liver and excreted by the kidneys. Elevated urea can indicate either high dietary protein intake, dehydration, or reduced kidney clearance. At 9.4, Plamen's urea is above the 8.2 upper limit. Given his high-protein diet with a volume rating of 9 out of 10, the most likely explanation is simply that he is eating a lot of protein, which generates more urea. However, with his Cystatin C eGFR at 84, mildly reduced kidney function may also be contributing to slightly less efficient urea clearance. This combination warrants monitoring and argues against pushing protein intake higher.","low_causes":"Low-protein diet, liver disease, overhydration","high_causes":"High-protein diet, dehydration, reduced kidney function, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4786","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6068","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism that is filtered by the kidneys and excreted in urine. It is used alongside eGFR to assess kidney function. At 82, Plamen's creatinine is well within range. However, creatinine levels are heavily influenced by muscle mass, and in someone using anabolic steroids with increased muscle mass, creatinine can appear normal even when kidney function is mildly reduced. This is why the Cystatin C-based eGFR, which is independent of muscle mass, provides a more reliable assessment in his case.","low_causes":"Low muscle mass, malnutrition","high_causes":"Reduced kidney function, high muscle mass, dehydration, high-protein diet, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate based on creatinine measures how efficiently the kidneys are filtering waste from the blood. Above 90 is considered normal. The lab returned this as above 90, which would normally be reassuring. However, creatinine-based eGFR can overestimate kidney function in people with higher muscle mass, as anabolic steroid use increases. The Cystatin C eGFR of 84 provides a more accurate picture and suggests mildly reduced function.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4667","lower_normal":"90","upper_normal":"180","lower_optimal":"90","upper_optimal":"180","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"","description":"The Cystatin C eGFR uses a different protein, Cystatin C, to estimate kidney filtration. Unlike creatinine, Cystatin C is not affected by muscle mass, making it more reliable in people with unusually high or low muscle mass. At 84, this is below the 90 threshold that defines fully normal kidney function. While an eGFR of 84 is only mildly reduced and may reflect normal age-related decline at 51, in the context of anabolic steroid use, high-protein diet, smoking, and elevated urea, it is a finding that warrants monitoring every three to six months.","low_causes":"Kidney disease, ageing, dehydration, medications, high protein load, smoking","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells in the body at a constant rate. It is freely filtered by the kidneys and is therefore an excellent marker of kidney function, independent of muscle mass, diet, and age. At 1.11, marginally above the 1.1 upper limit, this confirms the mildly reduced kidney filtration suggested by the Cystatin C eGFR of 84. This is not alarming at this level, but it serves as an early signal that the kidneys are working slightly harder than ideal.","low_causes":"","high_causes":"Reduced kidney function, inflammation, thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"180","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to tissues throughout the body. At 180, Plamen's haemoglobin is above the 170 upper limit for men. This is polycythaemia, an excess of red blood cells, and is one of the most well-recognised side effects of exogenous testosterone and anabolic steroid use. Testosterone stimulates erythropoietin production, which drives the bone marrow to produce more red blood cells. While more haemoglobin means more oxygen-carrying capacity, the thicker blood increases the risk of blood clots, stroke, and cardiovascular events.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Anabolic steroid or testosterone use, dehydration, smoking, chronic hypoxia, polycythaemia vera","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"6.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8600","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6133","units":"x10/12/l","description":"The red blood cell count measures the total number of red blood cells in a volume of blood. At 6.16, this is above the 5.5 upper limit, consistent with the polycythaemia seen in the haemoglobin and haematocrit results. This is driven by the same mechanism: exogenous testosterone stimulating red cell production.","low_causes":"Anaemia, blood loss, bone marrow disorders, chronic disease","high_causes":"Anabolic steroid use, dehydration, smoking, chronic hypoxia, polycythaemia vera","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.525","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.525, or 52.5%, Plamen's haematocrit is above the 0.50 upper limit. This is the most clinically important of the three elevated red cell markers because haematocrit above 0.50 is the threshold at which most clinicians managing testosterone replacement therapy would intervene. At this level, the blood is significantly thicker than normal, increasing the risk of thromboembolic events such as deep vein thrombosis, pulmonary embolism, and stroke. Smoking further compounds this risk by promoting clot formation. Therapeutic venesection, the removal of a unit of blood, or a dose reduction of the anabolic agent, should be discussed with his GP or prescribing clinician.","low_causes":"Anaemia, blood loss, overhydration","high_causes":"Anabolic steroid use, dehydration, smoking, chronic hypoxia, polycythaemia vera","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"85.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3519","lower_normal":"83","upper_normal":"101","lower_optimal":"83","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"fl","description":"Mean corpuscular volume measures the average size of red blood cells. At 85.1, this is within normal and optimal ranges, indicating red cells of normal size. This rules out both iron deficiency, which would cause small cells, and B12 or folate deficiency, which would cause large cells.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"29.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin in each red blood cell. At 29.2, this is within both normal and optimal ranges, indicating each red cell carries a healthy amount of haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"344","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6222","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures the average concentration of haemoglobin within each red blood cell. At 344, this is within range but sitting one unit below the upper limit. This is normal.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6143","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"%","description":"Red cell distribution width measures the variation in size of red blood cells. A higher RDW suggests the bone marrow is producing red cells of varying sizes, which can indicate nutritional deficiencies or increased red cell production. At 14.8, Plamen's RDW is within the laboratory range but above the optimal ceiling of 14. This is not uncommon when the bone marrow is being stimulated to produce extra red cells, as is happening here due to exogenous testosterone driving erythropoietin production.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiencies, increased red cell production","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"310","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5051","lower_normal":"150","upper_normal":"410","lower_optimal":"200","upper_optimal":"370","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3846","upper_optimal_position":"0.6154","units":"x10^9/L","description":"Platelets are small cell fragments that play a crucial role in blood clotting. At 310, this is well within range. A normal platelet count alongside elevated haematocrit means the clotting risk from polycythaemia is related to blood viscosity rather than platelet excess.","low_causes":"Viral infection, bone marrow disorders, medications, alcohol","high_causes":"Inflammation, infection, iron deficiency, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6556","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets are typically younger and more metabolically active. At 9.5, this is within normal and optimal ranges.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Increased platelet destruction, bone marrow disorders, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"7.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5388","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. White blood cells are the body's defence system against infection and disease. At 7.73, this is within both normal and optimal ranges, indicating a healthy and active immune system.","low_causes":"Viral infection, bone marrow disorders, medications, autoimmune conditions","high_causes":"Bacterial infection, inflammation, smoking, stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"4.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5313","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and are the first responders to bacterial infection. At 4.97, this is within both normal and optimal ranges, indicating a healthy innate immune response.","low_causes":"Viral infection, medications, bone marrow disorders, low energy availability","high_causes":"Bacterial infection, smoking, inflammation, stress, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including the production of antibodies and the killing of virus-infected cells. At 2.05, this is within both normal and optimal ranges.","low_causes":"Viral infection, stress, medications, autoimmune conditions","high_causes":"Viral infection, chronic inflammation, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4917","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells. They also play a role in chronic inflammation. At 0.46, this is within normal and optimal ranges.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, chronic inflammation, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. At 0.19, this is within both normal and optimal ranges, with no suggestion of allergic or parasitic activity.","low_causes":"Stress, steroid use","high_causes":"Allergies, parasitic infection, asthma, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic and inflammatory responses. At 0.06, this is within range.","low_causes":"Stress, acute allergic reactions","high_causes":"Allergic reactions, chronic inflammation, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells recently released from the bone marrow. The reticulocyte count reflects how actively the bone marrow is producing new red cells. At 1.13%, this is within range. Interestingly, one might expect a higher reticulocyte count given the testosterone-driven stimulus to produce more red cells. A normal reticulocyte count with elevated total red cells suggests the polycythaemia has reached a relatively stable state rather than being in an acute production phase.","low_causes":"Bone marrow suppression, iron deficiency, chronic disease, low energy availability","high_causes":"Blood loss, haemolysis, response to anaemia treatment, erythropoietin stimulus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"69.608","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4601","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells per litre of blood, independent of the total red cell count. At 69.6, this is within both normal and optimal ranges, consistent with the percentage count.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease","high_causes":"Blood loss, haemolysis, erythropoietin stimulus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"34.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4845","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation measures the percentage of transferrin, the iron transport protein, that is loaded with iron. It gives a snapshot of how much iron is currently being transported in the blood. At 34.74%, this sits squarely within the optimal range of 25 to 40%, indicating healthy iron transport.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, liver disease, excessive iron intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5694","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3871","upper_optimal_position":"0.6027","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It can fluctuate significantly throughout the day and after meals. At 26, this is within both normal and optimal ranges, confirming adequate iron availability.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5153","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6433","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream to the bone marrow and other tissues. The liver produces more transferrin when iron stores are low and less when they are adequate. At 2.98, this is within both normal and optimal ranges, confirming healthy iron metabolism.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5502","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3521","upper_optimal_position":"0.6207","units":"umol/l","description":"Total iron binding capacity measures the blood's capacity to bind and transport iron. It reflects the amount of transferrin available to carry iron. At 67, this is within both normal and optimal ranges.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4011","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. It gives the best single indication of total body iron stores. At 83, Plamen's ferritin is within the optimal range of 50 to 200 for men. This is a well-balanced level: high enough to support red blood cell production, energy, and immune function, but not so high as to suggest iron overload.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"28.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, red blood cell production, libido, mood, and energy. At 28.7, Plamen's testosterone sits right at the top of the laboratory range. In combination with completely suppressed LH and FSH, this confirms that the testosterone is exogenous rather than produced naturally by his testes. The body detects the high testosterone level and shuts off its own production signals.","low_causes":"Ageing, obesity, chronic disease, opioids, excessive alcohol","high_causes":"Exogenous testosterone or anabolic steroid use, testicular tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"1.0055","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5028","lower_normal":"0.2","upper_normal":"0.62","lower_optimal":"0.3","upper_optimal":"0.62","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4127","upper_optimal_position":"0.6667","units":"nmol/l","description":"Free testosterone is the unbound, biologically active fraction of testosterone. Most testosterone is bound to SHBG or albumin and is inactive; only the free fraction can enter cells and exert its effects. At 1.01 nmol per litre, Plamen's free testosterone is very high, well above the typical upper range. This is because his SHBG is profoundly suppressed at 9.2, leaving a much larger proportion of his total testosterone unbound and active. While high free testosterone supports muscle building and energy, excessively high levels can drive side effects including acne, hair loss, mood changes, and increased conversion to oestradiol.","low_causes":"Low total testosterone, high SHBG, ageing","high_causes":"Low SHBG, exogenous testosterone, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"9.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1427","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6103","units":"nmol/l","description":"Sex hormone binding globulin is a protein produced by the liver that binds to sex hormones, primarily testosterone and oestradiol, and controls how much is free and biologically active. At 9.2, Plamen's SHBG is profoundly low, well below the 17.3 lower limit. SHBG is suppressed by insulin resistance, obesity, and most significantly by exogenous androgens, which is the primary driver here. Very low SHBG results in an excess of free, active testosterone, which in turn leads to more conversion to oestradiol via aromatase and explains several of the abnormal findings in this report.","low_causes":"Anabolic steroid use, insulin resistance, obesity, hypothyroidism","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"311.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9997","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is calculated by dividing total testosterone by SHBG and multiplying by 100. It provides an estimate of the proportion of testosterone that is free and biologically active. At 312, more than double the upper limit of 150, this reflects the combination of high total testosterone and profoundly suppressed SHBG. This level of androgenic activity drives the polycythaemia, contributes to the suppressed HDL, and increases the conversion of testosterone to oestradiol.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"151","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5168","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4108","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen. In men, it is produced by the conversion of testosterone via an enzyme called aromatase, which is found predominantly in fat tissue. At 151, Plamen's oestradiol is above the male upper limit of 146.1. This is a direct consequence of the high free testosterone availability and the aromatase activity in his adipose tissue at a BMI of 29.9. Elevated oestradiol in men is associated with water retention, breast tissue changes, mood disturbance, and reduced libido, the last of which Plamen specifically reports. Managing oestradiol typically involves either reducing the testosterone dose, reducing body fat to lower aromatase activity, or in some cases, medication to block aromatase.","low_causes":"Low testosterone, low body fat","high_causes":"Exogenous testosterone, obesity, aromatase overactivity, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0060","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3397","upper_optimal_position":"0.6346","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and signals the testes to produce testosterone. At below 0.07, LH is completely suppressed, well below the lower limit of 1.5. This is the expected finding when exogenous testosterone or anabolic steroids are used: the pituitary detects the high testosterone level and stops sending the production signal. With LH this low, the testes are not producing testosterone naturally, and testicular atrophy and reduced fertility are likely consequences.","low_causes":"Exogenous testosterone or anabolic steroid use, pituitary disease","high_causes":"Primary hypogonadism, menopause (in women), PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.32","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0192","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5359","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland and drives sperm production in the testes. At 0.32, FSH is profoundly suppressed, below the lower limit of 1.4. Like LH, this is completely expected with exogenous androgen use. The suppressed FSH means sperm production is likely severely reduced or absent, which has implications for fertility. If Plamen wishes to preserve or restore fertility in the future, this should be discussed with an endocrinologist or fertility specialist.","low_causes":"Exogenous testosterone or anabolic steroid use, pituitary disease","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"174","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4606","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6121","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can cause reduced libido, erectile dysfunction, and breast tissue changes. At 174, Plamen's prolactin is within both normal and optimal ranges, ruling it out as a contributor to his low libido.","low_causes":"","high_causes":"Pituitary tumour, medications, hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4864","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is produced in small amounts by the adrenal glands and testes in men. It plays a role in mood, sleep, and as a precursor to other hormones. At 2.28, this is within the male reference range and is unremarkable.","low_causes":"Adrenal insufficiency","high_causes":"Adrenal disorders, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"292","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4368","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6064","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the early morning and declining through the day. It regulates metabolism, immune function, and the stress response. At 292, Plamen's morning cortisol is within both normal and optimal ranges, suggesting his adrenal function is healthy. Interestingly, given his chronic sleep restriction of fewer than six hours, one might expect cortisol to be higher, as chronic sleep deprivation often elevates cortisol. A normal level here is reassuring but does not mean sleep deprivation is not affecting other systems.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, medications, sleep deprivation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4231","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3608","upper_optimal_position":"0.5695","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It declines naturally with age, roughly 2-3% per year from the mid-twenties. At 3.5 umol per litre, equivalent to approximately 1,290 micrograms per decilitre, Plamen's DHEA-S is within the laboratory range but below the optimal threshold of 4.0 for his age. This is consistent with natural age-related decline at 51 and is not a clinical concern.","low_causes":"Ageing, adrenal insufficiency, chronic disease","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3710","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3439","upper_optimal_position":"0.4611","units":"mIU/l","description":"Thyroid stimulating hormone is produced by the pituitary gland to control the thyroid. When the thyroid underperforms, TSH rises to push it harder; when the thyroid overperforms, TSH falls. At 1.07, Plamen's TSH is within the optimal range of 1.0 to 2.5, indicating the pituitary is satisfied with the thyroid's output and is not having to push.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4494","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. T4 is the storage form of thyroid hormone that gets converted to the more active T3 in peripheral tissues. At 15.4, this is within the optimal range of 14 to 20, confirming healthy thyroid output.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the most active thyroid hormone, responsible for driving metabolism, energy production, and body temperature. Most T3 is produced by conversion of T4 in peripheral tissues. At 4.8, this is within the optimal range of 4.5 to 6.5, confirming that Plamen's body is converting T4 to T3 efficiently.","low_causes":"Hypothyroidism, severe illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies are autoimmune markers that, when elevated, indicate the immune system is attacking the thyroid gland, a condition called Hashimoto's thyroiditis. At below 6.6, well within the reference range of below 13.8, this is negative and rules out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1594","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. At 1.4, within the reference range of below 4.4, this is negative, further confirming no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3700","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.7333","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. At 74 nmol per litre, Plamen's vitamin D is sufficient, sitting above the 50 deficiency threshold, but falls just short of the optimal range of 75 to 120. At a BMI of 29.9, fat tissue sequesters vitamin D, meaning he needs a higher supplementation dose than a lean individual to reach and maintain optimal levels. A dose of 4,000 IU daily of vitamin D3, taken with a fat-containing meal, should bring him into the optimal range within eight to twelve weeks.","low_causes":"Insufficient sun exposure, dark skin, obesity, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"370","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4116","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4559","upper_optimal_position":"0.6159","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 370, Plamen's B12 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. Suboptimal B12 can contribute to fatigue, which he reports, and to neurological symptoms. A daily sublingual methylcobalamin supplement at 1,000 mcg should bring this into the optimal range.","low_causes":"Poor dietary intake (especially plant-based diets), malabsorption, pernicious anaemia, medications","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, cell division, and red blood cell production. It works alongside vitamin B12. This result was returned as insufficient sample, meaning the laboratory did not have enough blood to perform the analysis. Folate should be retested, as folate deficiency can contribute to elevated homocysteine, a cardiovascular risk factor, and to anaemia.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2667","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3721","upper_optimal_position":"0.6187","units":"pmol/L","description":"Parathyroid hormone is produced by the parathyroid glands and regulates calcium and phosphate balance in the body. When calcium levels drop, PTH rises to mobilise calcium from bones, increase calcium absorption from the gut, and reduce calcium loss through the kidneys. At 0.7, Plamen's PTH is below the lower limit of 0.98. Low PTH can result from recent calcium intake before the blood draw, vitamin D-driven calcium absorption suppressing PTH, or, less commonly, hypoparathyroidism. With vitamin D at 74, which is adequate, the PTH suppression may be physiological, but this finding should be noted by the GP and repeated if persistent. The lab also notes that results should be viewed with caution if samples are not centrifuged and separated on the day of collection.","low_causes":"Recent calcium intake, adequate/high vitamin D, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, parathyroid tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4929","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, which are reactive molecules that can damage cells. At 1.47, this is within range, indicating adequate antioxidant capacity.","low_causes":"Poor dietary intake of fruits and vegetables, oxidative stress","high_causes":"High intake of antioxidant-rich foods or supplements","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2329","lower_normal":"0","upper_normal":"3.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"ng/ml","description":"Prostate-specific antigen is a protein produced by the prostate gland. PSA can be elevated in prostate cancer, but also in benign conditions such as benign prostatic hyperplasia, prostatitis, and after vigorous exercise. At 1.63, Plamen's PSA is well within the normal range of below 3.5 and within the optimal range of below 2.5. This is reassuring for prostate health, particularly given his use of exogenous testosterone, which can stimulate prostate tissue.","low_causes":"","high_causes":"Prostate cancer, benign prostatic hyperplasia, prostatitis, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fpsa","name":"Free PSA","group":"PROSTATE","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA is the unbound fraction of total PSA. The ratio of free to total PSA helps distinguish between benign and malignant causes of PSA elevation. At 0.3, this is within range.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prat","name":"PSA Ratio","group":"PROSTATE","result":"0.184","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4842","lower_normal":"0.19","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5370","upper_optimal_position":"1","units":"","description":"The PSA ratio, or free-to-total PSA ratio, helps distinguish between benign and malignant causes of an elevated PSA. A higher ratio, above 0.25 or 25%, is reassuring and suggests benign causes such as enlarged prostate. A lower ratio, below 0.15 or 15%, raises more concern about prostate cancer. At 0.184, or 18.4%, Plamen's ratio is marginally below the 0.19 threshold. However, this ratio is most clinically useful when the total PSA is elevated, which his is not at 1.63. At this low total PSA level, the ratio is less informative and is not a cause for concern. It is worth noting for his records.","low_causes":"Prostate cancer (lower ratio associated with higher risk when PSA is elevated)","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c19","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0188","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker primarily associated with pancreatic cancer, though it can also be elevated in other gastrointestinal cancers and benign conditions such as pancreatitis or bile duct obstruction. At 1.39, this is very low and well within range, providing reassurance.","low_causes":"","high_causes":"Pancreatic cancer, bile duct obstruction, pancreatitis, other gastrointestinal cancers","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"2.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2449","lower_normal":"0","upper_normal":"4.1","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2805","units":"ng/ml","description":"Carcinoembryonic antigen is a tumour marker used primarily to monitor colorectal cancer, though it can be elevated in other cancers and in smokers. The reference range for smokers is 0 to 4.1 and for non-smokers is 0 to 2.3. As Plamen smokes, his CEA of 2.01 is well within the smoker reference range. However, applied against the non-smoker optimal range of below 2.3, it also sits within optimal. Smoking itself elevates CEA, so this level is not concerning.","low_causes":"","high_causes":"Colorectal cancer, other cancers, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"12.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant antibody in the blood and is the primary antibody involved in long-term immunity and immune memory. At 12.2, this is well within range, confirming healthy adaptive immune function.","low_causes":"Immune deficiency, medications","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. It is the largest antibody and is primarily found in the blood. At 0.6, this sits at the lower end of the range but is within normal limits. A lower IgM can be seen in men and tends to decrease with age. It does not indicate immune deficiency at this level.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6505","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the antibody found primarily in mucous membranes, including the gut, respiratory tract, and urinary tract. It is the first line of immune defence at body surfaces. At 3.5, Plamen's IgA sits right at the upper limit of the range. This is borderline but not abnormal. It is also the immunoglobulin used to validate the coeliac disease antibody test, and at this level, the negative tissue transglutaminase result is reliable.","low_causes":"Selective IgA deficiency (most common primary immune deficiency)","high_causes":"Mucosal infection, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"29.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1485","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"IgE is the antibody involved in allergic reactions and defence against parasites. At 29.7, this is well within range and does not suggest significant allergic sensitisation or parasitic infection.","low_causes":"","high_causes":"Allergies, asthma, parasitic infection, atopic dermatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"Insufficient","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"IU/ml","description":"Rheumatoid factor is an autoimmune marker that, when elevated, can indicate rheumatoid arthritis or other autoimmune conditions. This result was returned as insufficient sample and should be retested if clinically indicated.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"3.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2135","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA is the primary screening test for coeliac disease, an autoimmune condition where the immune system reacts to gluten and damages the small intestine lining. At 3.07 CU against a threshold of 7.19, this is clearly negative. Plamen's IgA level of 3.5 is adequate, confirming the test is reliable. Coeliac disease is effectively ruled out as a cause of his bloating and digestive discomfort, provided he has been eating a gluten-containing diet.","low_causes":"","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED T function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
