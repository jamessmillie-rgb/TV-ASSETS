3 to 1.77, which is a favourable finding suggesting good dietary antioxidant intake from his diet quality rated at 8 out of 10. His bacterial count and urine culture results are pending and will be reviewed when available.","links":"The findings in this report centre on a single core issue: insulin resistance driven by excess body weight, which is pulling multiple systems out of their optimal range. The practical steps below are designed to address that root cause, and by doing so, they should improve the lipid profile, liver health, testosterone, energy levels, and the difficulty losing weight that Ross is experiencing.\n\nRoss currently weighs 126 kg at 182 cm. His estimated maintenance calories at his current very low activity level, using a sedentary multiplier of 1.3, sit around 3,250 to 3,400 calories per day. To achieve steady fat loss of 0.5 to 0.75 kg per week, a daily intake of 2,400 to 2,700 calories would be appropriate. This is a moderate deficit that preserves muscle and is sustainable long-term. Given the quality of his diet is already rated 8 out of 10, the primary change is portion control and calorie awareness rather than a dietary overhaul. An initial target weight of 110 to 115 kg would represent a 10 to 13 percent reduction and is the threshold at which liver enzymes, insulin sensitivity, and testosterone typically show meaningful improvement. A longer-term target of 95 to 100 kg would bring his BMI into the 28 to 30 range.\n\nProtein intake should be prioritised at 1.3 to 1.6 g per kilogram of target body weight, which translates to approximately 140 to 175 g of protein per day. High protein intake supports satiety, preserves lean mass during weight loss, and has a higher thermic effect than carbohydrate or fat, meaning the body burns more calories digesting it. Protein should be spread across three to four meals rather than loaded into one.\n\nFor his lipid profile, specific dietary changes will complement the weight loss. Increasing soluble fibre intake to 10 to 15 g per day from sources such as oats, barley, beans, lentils, apples, and psyllium husk can reduce LDL by 5 to 10 percent. Including oily fish such as salmon, mackerel, or sardines two to three times per week provides omega-3 fatty acids that lower triglycerides and support HDL. Reducing saturated fat intake by swapping butter for olive oil, choosing leaner cuts of meat, and limiting cheese and processed meat will help shift the LDL particle count downward. These changes work additively alongside weight loss.\n\nPhysical activity is the single most impactful change Ross can make alongside the calorie adjustment. Beginning with three brisk walks of 20 to 30 minutes per week and building toward 150 minutes of moderate activity weekly would be a realistic starting point. Adding two sessions of resistance training per week, even bodyweight exercises or light weights, would accelerate improvements in insulin sensitivity, support testosterone production, and preserve muscle mass during weight loss. Resistance training directly improves how muscles absorb glucose, reducing the demand on insulin. Increasing daily steps to a target of 7,500 as a first milestone would meaningfully increase total daily energy expenditure.\n\nRoss should discuss the following with his GP: the HOMA-IR of 3.58 confirming significant insulin resistance, the lipid profile with an ApoB of 1.37 and LDL of 5.13 to discuss whether statin therapy is appropriate alongside lifestyle changes, the TSH of 4.92 above range with negative antibodies for a repeat in 8 to 12 weeks, and the ALT of 76 in the context of likely non-alcoholic fatty liver disease. The GP may wish to arrange a liver ultrasound to confirm hepatic steatosis and to consider formal cardiovascular risk scoring given the lipid findings. Ross should also mention the testosterone of 10.6 as context for the fatigue and weight difficulty, as the GP may wish to monitor this as weight changes.\n\nFor sleep and energy, given the fatigue and brain fog Ross reports, ensuring 7 to 8 hours of sleep with a fixed wake time, getting outside within an hour of waking for natural light exposure, cutting caffeine by early afternoon, and keeping the bedroom cool would support both energy levels and insulin sensitivity, as poor sleep independently worsens insulin resistance.\n\nA retest in 16 to 20 weeks would be ideal, focusing on fasting glucose, insulin, HOMA-IR, HbA1c, a full lipid panel including ApoB, ALT, GGT, TSH, FT4, testosterone, and SHBG. This timeframe allows enough time for meaningful lifestyle changes to register in blood markers.","flags":"METABOLIC: HOMA-IR 3.58 (range 0.5 to 1.5, significant insulin resistance threshold 2.9). Fasting insulin 16.11 mIU/L (lab range 2.6 to 24.9, optimal below 8). C-Peptide 665 pmol/L confirming genuine hyperinsulinaemia. Glucose 5.0 and HbA1c 37 are within range, indicating compensated insulin resistance. Pattern is consistent with metabolic syndrome driven by obesity at BMI 38. Recommend lifestyle intervention as first line, with GP review for formal metabolic syndrome assessment.\n\nLIPIDS: Total cholesterol 7.1, LDL 5.13 (limit 3.0), ApoB 1.37 g/L (limit 0.9, classified as high), HDL 1.1 (below desirable 1.55), triglycerides 2.01 (above fasting target 1.7), VLDL 0.91 (above 0.78), non-HDL cholesterol 6.0 (above 4.0), TC/HDL ratio 6.45 (above 4.5), ApoB/A-I ratio 1.15 (above 0.9, higher risk category), ApoA-I 1.19 (marginally below 1.20). Lp(a) below 25, normal, confirming modifiable aetiology. Atherogenic dyslipidaemia pattern consistent with insulin resistance. GP should consider cardiovascular risk scoring and discuss statin therapy alongside lifestyle modification.\n\nLIVER: ALT 76 IU/L (limit 56). AST 39, GGT 28, ALP 54, bilirubin 12, albumin 42, FIB-4 0.84 all within range. Pattern consistent with non-alcoholic fatty liver disease at BMI 38. FIB-4 reassuringly below 1.45 suggesting no significant fibrosis. GP may wish to arrange liver ultrasound.\n\nTHYROID: TSH 4.92 mIU/L (upper limit 4.78). FT4 15.9 (range 11.5 to 22.7, lower half). FT3 5.8 (range 2.6 to 7.1, optimal). TPO antibodies below 6.6, thyroglobulin antibodies 1.8, both negative. Subclinical hypothyroidism, non-autoimmune. May be partly obesity-driven. Recommend repeat TSH in 8 to 12 weeks. Subclinical hypothyroidism may contribute to raised LDL.\n\nELECTROLYTES: Sodium 148 mmol/L (upper limit 146). Mild elevation, most likely dehydration at time of sampling. Kidney function otherwise normal. Would expect normalisation on repeat when well hydrated.\n\nHAEMATOLOGY: RDW 15.4% (upper limit 15.0%). Marginal elevation with otherwise normal FBC and iron studies. Low clinical significance in isolation.\n\nHORMONES: Testosterone 10.6 nmol/L (lab range 8.4 to 28.7, recommended above 12, optimal above 18). Likely suppressed by adiposity and insulin resistance. Free testosterone 0.229, SHBG 28.8 both within range but low. Monitor with weight loss.\n\nIMMUNE: IgM 0.4 g/L (lower limit 0.5). Isolated mild reduction, likely normal variant. No clinical action required unless recurrent infections.\n\nReassuring negatives: Lp(a) normal, excluding inherited lipoprotein risk. PSA 0.24 with free ratio 58.3%, prostate health excellent. Both thyroid antibodies negative, excluding autoimmune thyroid disease. Coeliac screen negative. Kidney function preserved with Cystatin C eGFR 90. FIB-4 0.84 excluding significant liver fibrosis. CRP 1.3 showing modest inflammatory burden despite BMI 38. Iron studies balanced with no overload or deficiency. Glucose and HbA1c compensated despite insulin resistance. Tumour markers normal. Urinalysis clean.","recommendations":"1. Reduce calorie intake to 2,400 to 2,700 calories per day to achieve steady fat loss of 0.5 to 0.75 kg per week, targeting an initial weight of 110 to 115 kg.\n\n2. Consume 140 to 175 g of protein daily, spread across three to four meals, prioritising lean meats, fish, eggs, legumes, and dairy.\n\n3. Begin structured physical activity: three brisk walks of 20 to 30 minutes per week as an immediate starting point, building to 150 minutes of moderate activity weekly. Add two resistance training sessions per week within the first month.\n\n4. Increase daily steps to a target of 7,500 as a first milestone.\n\n5. Increase soluble fibre to 10 to 15 g per day from oats, beans, lentils, apples, and psyllium husk. Include oily fish two to three times per week. Reduce saturated fat by choosing olive oil over butter, leaner meat cuts, and limiting cheese and processed meats.\n\n6. Discuss with GP: HOMA-IR 3.58, ApoB 1.37 and LDL 5.13 for cardiovascular risk scoring and statin consideration, TSH 4.92 for repeat testing in 8 to 12 weeks, ALT 76 for possible liver ultrasound, and testosterone 10.6 for monitoring.\n\n7. Ensure 7 to 8 hours of sleep with a fixed wake time. Get outside within an hour of waking. Cut caffeine by early afternoon. Keep the bedroom cool.\n\n8. Stay well hydrated, aiming for 2.5 to 3 litres of water daily, which will also help clarify whether the sodium of 148 was a hydration artefact.\n\n9. Retest in 16 to 20 weeks: fasting glucose, insulin, HOMA-IR, HbA1c, full lipid panel with ApoB, ALT, GGT, TSH, FT4, testosterone, and SHBG.","supplementation":"Ross's vitamin D at 89 nmol/L is within the optimal band, which at a BMI of 38 is a strong result. To maintain this level through the autumn and winter months when UVB exposure drops, a maintenance dose of 2,000 IU of vitamin D3 (cholecalciferol) daily, taken with a meal that contains fat to aid absorption, would be appropriate. This should be paired with 100 mcg of vitamin K2 in the MK-7 form daily, which directs calcium into bones rather than allowing it to deposit in blood vessels.\n\nHis B12 at 459 pg/ml is within the laboratory range but below the optimal floor of 500. A sublingual methylcobalamin supplement at 1,000 mcg daily would support energy metabolism and cognitive function, both relevant to the fatigue and brain fog Ross reports. Sublingual delivery bypasses the gut and provides more reliable absorption than oral tablets.\n\nOmega-3 fish oil at 2 to 3 g of combined EPA and DHA daily would support his lipid profile by helping lower triglycerides, modestly raising HDL, and providing an anti-inflammatory effect. This complements the dietary recommendation to eat oily fish two to three times per week. A high-quality concentrated fish oil avoids the need to take large numbers of capsules.\n\nHis magnesium at 0.97 is within the optimal band, so supplementation is not essential, but magnesium glycinate at 300 mg before bed may support sleep quality and insulin sensitivity, both of which are relevant to his current picture. This form is well absorbed and less likely to cause digestive discomfort than cheaper magnesium oxide.\n\nRoss does not need iron supplementation. His ferritin at 152 and transferrin saturation at 47% show healthy iron stores, and supplementing iron when stores are adequate can push levels into the harmful range.\n\nThe most important changes from this report are not supplements. They are the calorie reduction, the increase in physical activity, and the specific dietary changes to address insulin resistance and the lipid profile. Supplements support the process but cannot replace those foundational shifts.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose measures the concentration of sugar in the blood after fasting. It is the body's primary fuel source, regulated by insulin. Ross's fasting glucose of 5.0 mmol/L sits within both the laboratory and optimal ranges, which means the blood sugar level itself is well controlled. However, this number must be read alongside his insulin level, because glucose can appear normal while insulin is working overtime to keep it there. In Ross's case, the insulin is doing the heavy lifting to maintain this healthy glucose reading.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress response, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the previous two to three months. Below 6.0% is considered normal, 6.0 to 6.4% indicates pre-diabetes, and above 6.5% indicates diabetes. Ross's result of 5.6% is within the normal range, confirming that his average blood sugar has been well controlled over recent months despite the underlying insulin resistance.","low_causes":"Blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4405","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international unit of mmol/mol rather than percentage. Below 42 is normal, 42 to 47 is pre-diabetes, and above 48 indicates diabetes. Ross's result of 37 mmol/mol is within the normal range but sits just above the optimal ceiling of 36, suggesting average blood sugar is adequate but not in the ideal zone. Given his insulin resistance, this is a marker to watch on retest.","low_causes":"Blood loss, haemolytic anaemia, certain haemoglobin variants","high_causes":"Sustained elevated blood sugar, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"16.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3611","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3253","upper_optimal_position":"0.3973","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas to move glucose from the blood into cells for energy. Fasting insulin reveals how hard the pancreas is working to maintain normal blood sugar. Ross's fasting insulin of 16.11 mIU/L is within the broad laboratory range but double the optimal ceiling of 8. This tells us the pancreas is producing significantly more insulin than it should need to, because the cells have become resistant to its signal. This is the hallmark of insulin resistance and is the key driver behind his HOMA-IR score of 3.58.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, pancreatic insufficiency","high_causes":"Insulin resistance, excess body fat particularly visceral fat, high carbohydrate diet, physical inactivity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"665","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4620","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"800","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4665","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and serves as a reliable measure of actual insulin production, because unlike insulin itself it is not cleared by the liver before reaching the bloodstream. Ross's result converts from 2.01 ug/L to approximately 665 pmol/L, confirming that the elevated fasting insulin is genuine pancreatic overproduction rather than a laboratory artefact. This supports the insulin resistance diagnosis.","low_causes":"Type 1 diabetes, advanced pancreatic failure, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"3.58","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8393","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin to estimate how effectively insulin is working. Below 1.0 is optimal, below 1.5 is normal, above 1.9 indicates early insulin resistance, and above 2.9 indicates significant insulin resistance. Ross's score of 3.58 is well into the significant insulin resistance zone. This is the central finding of the report. His cells are not responding efficiently to insulin, so the pancreas compensates by producing more. This drives fat storage, makes weight loss harder, contributes to fatigue and brain fog, and pushes the lipid profile in an unfavourable direction. The good news is that it is fully reversible with sustained weight loss and increased physical activity.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, regular exercise","high_causes":"Excess body fat particularly visceral fat, physical inactivity, high calorie or high carbohydrate intake, genetic predisposition, poor sleep","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"214.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8289","lower_normal":"80","upper_normal":"200","lower_optimal":"100","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"","description":"HOMA-B estimates pancreatic beta-cell function, essentially how much insulin the pancreas is producing relative to the glucose level. It is calculated as (20 x insulin) / (glucose - 3.5). Ross's score of 214.8 is above the upper limit of 200, confirming that the pancreas is working harder than it should be to maintain blood sugar control. This is consistent with compensatory hyperinsulinaemia, where the body increases insulin output to overcome insulin resistance. The pancreas is coping for now, but sustained overwork increases the long-term risk of beta-cell exhaustion and progression to type 2 diabetes.","low_causes":"Reduced pancreatic function, type 1 diabetes, late-stage type 2 diabetes, low carbohydrate diet","high_causes":"Insulin resistance causing compensatory overproduction, obesity, early metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7857","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found primarily in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream and the level rises. Ross's ALT of 76 IU/L is above the laboratory limit of 56 and well above the optimal ceiling of 30 for a male. In the context of a BMI of 38 with insulin resistance and otherwise normal liver markers, this pattern is strongly suggestive of non-alcoholic fatty liver disease, where fat accumulates within liver cells and causes low-grade inflammation. This is reversible with weight loss.","low_causes":"Very low liver cell turnover, vitamin B6 deficiency","high_causes":"Non-alcoholic fatty liver disease, alcohol-related liver disease, viral hepatitis, medication effects, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5312","units":"IU/L","description":"AST, aspartate aminotransferase, is an enzyme found in liver cells, heart muscle, and skeletal muscle. Unlike ALT, AST is less specific to the liver. Ross's AST of 39 is within the laboratory range of 13 to 45 but above the optimal ceiling of 30. Given the raised ALT, this modest AST elevation is consistent with the fatty liver picture. The fact that ALT is significantly higher than AST is a pattern more typical of fatty liver than alcohol-related liver disease.","low_causes":"Vitamin B6 deficiency, very low muscle mass","high_causes":"Liver disease, muscle damage, heart damage, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2534","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4299","units":"IU/L","description":"GGT, gamma-glutamyl transferase, is a liver enzyme particularly sensitive to alcohol intake, bile duct obstruction, and metabolic strain. Ross's GGT of 28 IU/L is within the laboratory range of 4 to 73 and only marginally above the optimal ceiling of 25 for a male. This is a positive finding because GGT is often the first liver enzyme to rise with alcohol or metabolic strain, and at a BMI of 38 it being this low suggests the liver is under less metabolic pressure than the ALT alone might imply.","low_causes":"Low alcohol intake, efficient liver function","high_causes":"Alcohol use, bile duct disease, fatty liver, certain medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"116","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"ALP, alkaline phosphatase, is an enzyme found in the liver, bones, and bile ducts. It rises in bile duct obstruction, bone disease, and certain liver conditions. Ross's ALP of 54 IU/L is within range and towards the lower end, confirming no bile duct or bone pathology.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"21","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. Elevated bilirubin can indicate liver disease or increased red blood cell breakdown. Ross's bilirubin of 12 is mid-range and completely normal.","low_causes":"No clinical significance","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined levels of albumin and globulin in the blood, reflecting liver synthetic function, nutritional status, and immune activity. Ross's total protein of 72 g/L is within range and well balanced.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, blood cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance. It is a sensitive marker of liver synthetic function and nutritional status. Ross's albumin of 42 g/L is within the optimal range, confirming the liver's synthetic capacity is intact despite the raised ALT.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin encompasses the immune proteins (immunoglobulins) and transport proteins in the blood. It reflects immune system activity and liver function. Ross's globulin of 30 g/L is within the optimal range.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein groups in the blood. It provides a quick check on the balance between liver synthetic function and immune activity. Ross's A/G ratio of 1.4, calculated from albumin 42 divided by globulin 30, is within the optimal range.","low_causes":"Liver disease, overactive immune system, chronic inflammation","high_causes":"Immunodeficiency, genetic variants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2897","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score estimates the degree of liver fibrosis (scarring) using age, ALT, AST, and platelet count. Below 1.3 in someone under 65 suggests no significant fibrosis. Ross's score of 0.84 is reassuringly low, meaning that despite the raised ALT and likely fatty liver, there is no evidence of significant scarring. This is an important finding because it confirms the liver changes are early and reversible.","low_causes":"Healthy liver with no fibrosis","high_causes":"Liver fibrosis or cirrhosis, advanced age, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4621","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands. It breaks down starches. Elevated levels can indicate pancreatitis or pancreatic disease. Ross's amylase of 60 is mid-range, confirming no pancreatic concern.","low_causes":"Chronic pancreatitis with gland destruction, cystic fibrosis","high_causes":"Acute pancreatitis, pancreatic duct obstruction, salivary gland disease, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down fats. It is more specific to the pancreas than amylase. Ross's lipase of 37 is within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatic damage","high_causes":"Acute pancreatitis, pancreatic disease, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6861","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL particles. Desirable levels are below 5.18 mmol/L. Ross's total cholesterol of 7.1 is elevated, driven primarily by his high LDL cholesterol. While total cholesterol is a useful screening number, the breakdown into LDL, HDL, and ApoB provides a much clearer picture of actual cardiovascular risk.","low_causes":"Hyperthyroidism, malnutrition, liver failure, malabsorption","high_causes":"Excess saturated fat intake, insulin resistance, hypothyroidism, familial hypercholesterolaemia, obesity, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5912","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily in VLDL particles. They are strongly influenced by carbohydrate intake, alcohol, and insulin resistance. Fasting levels above 1.7 mmol/L are elevated. Ross's triglycerides at 2.01 are above the fasting target, which is a direct consequence of the insulin resistance. Elevated insulin promotes the liver's production of triglyceride-rich VLDL particles. This also drives HDL down, because in the presence of excess triglycerides, HDL particles exchange their cholesterol for triglycerides and are then cleared more rapidly from the blood.","low_causes":"Very low fat diet, hyperthyroidism, malnutrition","high_causes":"Insulin resistance, excess carbohydrate or alcohol intake, obesity, physical inactivity, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, very low-density lipoprotein, is the particle the liver produces to transport triglycerides to tissues. Elevated VLDL reflects increased triglyceride production, which in Ross's case is driven by insulin resistance. His VLDL of 0.91 is above the limit of 0.78, consistent with the overall pattern.","low_causes":"Low fat or low carbohydrate diet, hyperthyroidism","high_causes":"Insulin resistance, excess calorie intake, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3548","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.55","upper_optimal":"3.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1.0","units":"mmol/L","description":"HDL, high-density lipoprotein, is the protective cholesterol particle that removes excess cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is associated with lower cardiovascular risk. Ross's HDL of 1.1 is below the desirable threshold of 1.55 and only just above the high-risk threshold of 1.04. At a BMI of 38 with no exercise and insulin resistance, HDL is being suppressed by multiple factors. Physical activity is one of the most effective ways to raise HDL, alongside weight loss and improved insulin sensitivity.","low_causes":"Insulin resistance, physical inactivity, obesity, smoking, high carbohydrate diet, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, lean body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8553","lower_normal":"0","upper_normal":"3.0","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL, low-density lipoprotein, is the particle responsible for delivering cholesterol to tissues. When LDL is elevated, excess particles penetrate and deposit cholesterol within artery walls, driving atherosclerosis. Ross's LDL of 5.13 is significantly above the 3.0 upper limit. Combined with a normal Lp(a), this elevation is being driven by modifiable factors: insulin resistance, dietary saturated fat, and potentially the mild thyroid underactivity slowing LDL clearance from the blood.","low_causes":"Hyperthyroidism, malnutrition, very low fat diet, statin use","high_causes":"Excess saturated fat intake, insulin resistance, hypothyroidism, familial hypercholesterolaemia, obesity, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6.45","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio gives a quick summary of the balance between total cholesterol and protective HDL. Below 4.5 is desirable. Ross's ratio of 6.45 reflects both the elevated total cholesterol and the low HDL, producing a combined metric that is above the desirable limit.","low_causes":"High HDL, low total cholesterol, regular exercise, lean body composition","high_causes":"Low HDL, elevated total cholesterol, insulin resistance, obesity, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"15.49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3873","lower_normal":"20","upper_normal":"40","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1.0","units":"%","description":"HDL percentage represents the proportion of total cholesterol carried by protective HDL particles. Above 20% is desirable. Ross's HDL percentage of 15.49% is below target, consistent with the overall lipid pattern of high LDL and low HDL.","low_causes":"Low HDL, elevated LDL, insulin resistance, obesity","high_causes":"High HDL, regular exercise, lean body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol, capturing all the atherogenic cholesterol in LDL, VLDL, and remnant particles. It is a better predictor of cardiovascular risk than LDL alone. Ross's non-HDL of 6.0 is well above the 4.0 target, reflecting the combined burden of LDL and VLDL elevation.","low_causes":"Low LDL, low VLDL, healthy lipid metabolism","high_causes":"Elevated LDL, elevated triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"1.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4958","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1.0","units":"g/L","description":"ApoA-I is the main structural protein of HDL particles and drives the reverse cholesterol transport process that removes cholesterol from arteries. Higher levels are protective. Ross's ApoA-I of 1.19 is marginally below the desirable threshold of 1.20. This reflects the low HDL particle number and is consistent with the overall pattern.","low_causes":"Physical inactivity, insulin resistance, obesity, genetic factors, smoking","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single most important lipid marker in this report. Every atherogenic particle in the blood, whether LDL, VLDL, or remnant, carries exactly one ApoB molecule, so ApoB directly counts the total number of particles that can deposit cholesterol in artery walls. Ross's ApoB of 1.37 g/L is classified as high by the laboratory, well above the 0.9 desirable limit and the 0.8 optimal target. This is the number that most directly reflects cardiovascular risk from his lipid profile, and it is the one to track with lifestyle changes.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"Insulin resistance, high saturated fat intake, obesity, hypothyroidism, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8214","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio is the single best summary metric of lipid-related cardiovascular risk, balancing the number of atherogenic particles (ApoB) against the number of protective particles (ApoA-I). Below 0.7 is lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Ross's ratio of 1.15 is in the higher risk category, driven by both the high ApoB and the marginally low ApoA-I.","low_causes":"High HDL, low LDL, regular exercise, lean body composition","high_causes":"Elevated LDL, low HDL, insulin resistance, obesity, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically inherited lipoprotein that carries cholesterol and independently increases cardiovascular risk through three mechanisms: it deposits cholesterol like LDL, it encourages blood clotting, and it drives inflammation in artery walls. Its level is entirely determined by genetics and cannot be changed by diet, exercise, or standard medications. Ross's Lp(a) is below 25 nmol/L, which is normal and below the 32 nmol/L threshold. This is genuinely useful information because it confirms that his elevated lipid profile is driven entirely by modifiable factors rather than an inherited lipoprotein risk. This result only needs to be measured once and should be recorded permanently in his medical notes.","low_causes":"Genetic, no clinical significance","high_causes":"Entirely genetic, not modifiable by lifestyle or standard medication","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6100","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that serves as a proxy for insulin resistance and small dense LDL particles. Elevated triglycerides divided by low HDL produces a high ratio. Ross's TG/HDL ratio of 1.83, calculated from triglycerides 2.01 divided by HDL 1.1, is above the 1.5 upper limit and well above the 0.87 optimal ceiling. This is consistent with the insulin resistance pattern confirmed by HOMA-IR.","low_causes":"Good insulin sensitivity, regular exercise, low triglycerides, high HDL","high_causes":"Insulin resistance, elevated triglycerides, low HDL, obesity, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5438","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried in triglyceride-rich remnant particles, calculated as total cholesterol minus HDL minus LDL. These remnant particles are increasingly recognised as an independent driver of atherosclerosis. Ross's remnant cholesterol of 0.87, calculated from 7.1 minus 1.1 minus 5.13, is above the 0.8 upper limit and the 0.5 optimal target. This is driven by the elevated triglycerides and VLDL from insulin resistance.","low_causes":"Low triglycerides, good metabolic health","high_causes":"Elevated triglycerides, insulin resistance, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a general marker of inflammation produced by the liver. In the context of cardiovascular risk assessment, levels below 1.0 mg/L indicate lower risk, 1.0 to 3.0 indicates average risk, and above 3.0 indicates higher risk. Ross's hs-CRP of 1.3 is within the laboratory range of below 5 but above the optimal threshold of 1.0. At a BMI of 38, a CRP of only 1.3 is actually lower than might be expected, as excess body fat is metabolically active tissue that produces inflammatory signals. This suggests the inflammatory burden is relatively contained.","low_causes":"Low body fat, regular exercise, anti-inflammatory diet, statin use","high_causes":"Excess body fat, infection, chronic inflammation, autoimmune disease, physical inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. Ross's ESR of 6 is within range and within the optimal band, confirming no significant systemic inflammation. This is consistent with the relatively modest CRP.","low_causes":"Low inflammation, polycythaemia","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"NLR","group":"INFLAMMATION","result":"1.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4477","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is calculated by dividing neutrophils by lymphocytes and serves as a simple marker of the balance between innate and adaptive immune activity. It is increasingly used as a marker of systemic inflammation. Ross's NLR of 1.06, calculated from neutrophils 2.27 divided by lymphocytes 2.14, is within the optimal range, indicating a healthy immune balance.","low_causes":"Strong adaptive immunity, low neutrophils","high_causes":"Acute infection, chronic stress, systemic inflammation, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"148","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7179","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte that maintains fluid balance, blood pressure, and nerve function. It is tightly regulated by the kidneys. Ross's sodium of 148 mmol/L is marginally above the upper limit of 146, most likely reflecting hydration status at the time of the blood draw. If Ross had not drunk much water the evening before or morning of the test, mild dehydration concentrates sodium in the blood. His kidney function is otherwise clean, making a kidney cause very unlikely.","low_causes":"Excessive fluid intake, heart failure, kidney disease, certain medications, adrenal insufficiency","high_causes":"Dehydration, insufficient fluid intake, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. It works in balance with sodium. Ross's potassium of 4.7 mmol/L is within the laboratory range.","low_causes":"Diarrhoea, vomiting, diuretic use, poor dietary intake, excessive sweating","high_causes":"Kidney disease, certain medications (ACE inhibitors, potassium-sparing diuretics), sample haemolysis, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.5641","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base balance. Ross's chloride of 99 mmol/L is within range.","low_causes":"Vomiting, metabolic alkalosis, certain medications","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"29.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6273","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6364","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, maintaining blood pH within a very tight range. Ross's bicarbonate of 29.7 mmol/L is within range.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate) and represents unmeasured anions in the blood. Ross's anion gap calculates to 24.0, which is above the normal range of 8 to 16. However, this calculation is significantly influenced by the mildly elevated sodium of 148 which is likely a hydration artefact. With a sodium of 143, which would be expected when well hydrated, the anion gap would be approximately 19, which is still slightly above range. The most common explanation for a modestly elevated anion gap in the absence of severe illness is dehydration or laboratory variation. His normal bicarbonate and clean kidney function are reassuring. This should normalise on repeat when well hydrated.","low_causes":"Low albumin, laboratory error","high_causes":"Dehydration, lactic acidosis, ketoacidosis, kidney disease, toxic ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6140","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Ross's calcium of 2.56 mmol/L is within range.","low_causes":"Vitamin D deficiency, parathyroid insufficiency, magnesium deficiency, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts for albumin levels because calcium binds to albumin in the blood. When albumin is low, total calcium appears lower than it truly is. Ross's corrected calcium of 2.56 is within range, confirming true calcium status is normal.","low_causes":"Vitamin D deficiency, parathyroid insufficiency, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5862","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function, nerve signalling, and blood sugar regulation. Ross's magnesium of 0.97 mmol/L is within the optimal band of 0.85 to 1.05, which is a positive finding given that insulin resistance can deplete magnesium.","low_causes":"Poor dietary intake, alcohol excess, diabetes, certain medications (proton pump inhibitors, diuretics), malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"414","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5306","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5460","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in certain foods and in the body's own cells. It is cleared by the kidneys. Elevated uric acid is associated with gout and with insulin resistance, because insulin reduces the kidney's ability to excrete uric acid. Ross's uric acid of 414 umol/L is within the laboratory range but above the optimal ceiling of 380 for a male. This is consistent with the insulin resistance pattern. As insulin sensitivity improves with weight loss, uric acid levels typically fall.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"Insulin resistance, obesity, high purine diet (red meat, organ meats, shellfish), kidney disease, dehydration, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product from protein metabolism, produced by the liver and cleared by the kidneys. It provides a measure of both kidney function and protein intake. Ross's urea of 5.7 mmol/L is within range.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4957","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, cleared at a constant rate by the kidneys. It is the standard marker for estimating kidney filtration rate. Ross's creatinine of 84 umol/L is within range. However, in someone with a BMI of 38 and no resistance training, creatinine can underestimate kidney strain because it reflects muscle mass. The Cystatin C result provides a more reliable assessment.","low_causes":"Low muscle mass, very lean body composition","high_causes":"Kidney disease, dehydration, high muscle mass, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION", corticosteroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1.0","units":"ml/min/1.73m2","description":"The Cystatin C-based eGFR uses Cystatin C instead of creatinine to estimate kidney filtration rate. At Ross's BMI of 38 with no resistance training, this is the more trustworthy measure of kidney function. His Cystatin C eGFR of 90 sits right at the threshold of normal and optimal, indicating adequate function.","low_causes":"Kidney disease, dehydration","high_causes":"Very good kidney function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"149","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"130","upper_normal":"170","lower_optimal":"135","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein in red blood cells. It is the primary measure of the blood's ability to transport oxygen to tissues. Ross's haemoglobin of 149 g/L is within the optimal range for a male, confirming good oxygen-carrying capacity.","low_causes":"Iron deficiency, chronic disease, blood loss, B12 or folate deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4567","lower verage size of platelets. Larger platelets are younger and more metabolically active. Ross's MPV of 9.5 fL is within range.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Platelet destruction or consumption, immune thrombocytopenia, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"5.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3900","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. Ross's WBC of 5.07 is within the optimal range, confirming a healthy immune cell population.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, certain medications, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3513","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3633","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell type and form the first line of defence against bacterial infection. Ross's neutrophils at 2.27 are within the laboratory range but below the optimal floor of 2.5. This is a mild finding with no clinical significance at this level.","low_causes":"Viral infections, certain medications, benign ethnic neutropenia, low energy availability","high_
