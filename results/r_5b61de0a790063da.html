rrow suppression, chronic disease","high_causes":"Blood loss, haemolytic anaemia, response to anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"67.693","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4513","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells rather than the percentage. Ross's count of 67.7 is within the optimal range.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease","high_causes":"Blood loss, haemolytic anaemia, response to anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"47.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5914","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5189","units":"%","description":"Transferrin saturation measures the percentage of transferrin, the iron transport protein, that is loaded with iron. It reflects how much of the available iron transport capacity is being used. Ross's transferrin saturation of 47.09% is within the laboratory range of 18 to 55% but above the optimal ceiling of 40%. Combined with a serum iron at the top of range, this warrants monitoring. While still within normal limits, consistently high saturation can indicate the body is handling more iron than ideal.","low_causes":"Iron deficiency, chronic inflammation, infection","high_causes":"Iron overload, haemochromatosis, excessive iron intake, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"31.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6635","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455","upper_optimal_position":"0.6145","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. Ross's serum iron of 31.1 umol/L is at the top of the laboratory range of 11.6 to 31.3 and above the optimal ceiling of 28. This reflects good iron availability and is consistent with the transferrin saturation sitting above optimal. Iron at the top of range is not a concern in isolation but should be monitored.","low_causes":"Iron deficiency, chronic inflammation, blood loss, poor dietary intake","high_causes":"Iron overload, haemochromatosis, liver disease, excessive dietary iron, iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4400","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6000","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. Its level reflects the body's iron demand: the body produces more transferrin when it needs more iron. Ross's transferrin of 2.63 g/L is within the optimal range, confirming healthy iron transport capacity with no indication of deficiency or overload.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4937","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"72","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6085","units":"umol/L","description":"Total iron binding capacity measures the total amount of iron that transferrin can carry, reflecting the iron transport system's capacity. Ross's TIBC of 62 umol/L is within the optimal range.","low_causes":"Iron overload, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"152","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4778","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the main iron storage protein. One ferritin molecule reflects thousands of iron atoms stored in the body's tissues. Ross's ferritin of 152 ng/ml sits comfortably within the optimal band of 50 to 200 for a male, indicating healthy iron reserves that are neither depleted nor excessive.","low_causes":"Iron deficiency, blood loss, poor dietary iron intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"10.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, energy, mood, cognitive function, libido, and fat distribution. Ross's testosterone of 10.6 nmol/L is within the broad laboratory range of 8.4 to 28.7 but below the laboratory's own recommended level of above 12, and well below the optimal floor of 18. At 43 with a BMI of 38, this is likely being suppressed by excess body fat through aromatase activity, which converts testosterone to oestradiol, and by insulin resistance, which independently suppresses testosterone production. This connects directly to his symptoms of fatigue, brain fog, and difficulty losing weight.","low_causes":"Obesity, insulin resistance, ageing, chronic illness, sleep deprivation, opioid use, pituitary disorders","high_causes":"Exogenous testosterone or anabolic steroid use, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.229","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3696","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3922","upper_optimal_position":"0.5304","units":"nmol/L","description":"Free testosterone is the fraction not bound to SHBG or albumin, and therefore available for use by tissues. Only about 2 to 3% of total testosterone circulates freely. Ross's free testosterone of 0.229 nmol/L is within the laboratory range but below the optimal floor of 0.3, reflecting the overall low testosterone picture.","low_causes":"Low total testosterone, high SHBG, obesity, ageing","high_causes":"Exogenous testosterone use, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"28.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4121","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3835","upper_optimal_position":"0.6027","units":"nmol/L","description":"SHBG, sex hormone binding globulin, is a protein that binds testosterone and oestradiol in the blood, controlling how much is freely available. Lower SHBG means more free hormone, higher SHBG means less. Ross's SHBG of 28.8 is within the optimal band but towards the lower end. Insulin resistance typically suppresses SHBG, which is consistent here. Low SHBG does mean a higher proportion of total testosterone is free, but with total testosterone already low at 10.6, the free fraction is still below optimal.","low_causes":"Insulin resistance, obesity, hypothyroidism, anabolic steroid use","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"36.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3790","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"","description":"The free androgen index (FAI) is calculated from total testosterone and SHBG to give a ratio reflecting androgen availability. Ross's FAI of 36.81 is within the laboratory range but below the optimal floor of 40, reflecting the low total testosterone despite relatively low SHBG.","low_causes":"Low testosterone, high SHBG, ageing","high_causes":"High testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2533","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen, produced in men via aromatase conversion of testosterone in fat tissue. In men, it is important for bone health, brain function, and cardiovascular protection, but excess oestradiol can suppress testosterone production and promote fat storage. Ross's oestradiol of 74 pmol/L is within range. The combination of low testosterone with mid-range oestradiol at a BMI of 38 is consistent with increased aromatase activity in adipose tissue, where testosterone is being converted to oestradiol at a higher rate than would occur at a healthier weight.","low_causes":"Very low body fat, aromatase inhibitor use, hypogonadism","high_causes":"Obesity, liver disease, aromatase excess, exogenous oestrogen","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4063","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It serves as a precursor for other hormones and plays a minor role in brain function and mood. Ross's progesterone of 1.45 nmol/L is within the laboratory range.","low_causes":"Adrenal insufficiency, low cholesterol","high_causes":"Adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4277","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3397","upper_optimal_position":"0.5641","units":"mIU/ml","description":"LH, luteinising hormone, is produced by the pituitary gland and signals the testes to produce testosterone. Ross's LH of 3.53 is within the optimal range. The fact that LH is not elevated despite low testosterone may suggest that the pituitary is not fully recognising the need for more testosterone production, which can occur with obesity and insulin resistance.","low_causes":"Pituitary disease, obesity, opioid use, anabolic steroid use","high_causes":"Primary testicular failure, ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"6.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5704","units":"mIU/ml","description":"FSH, follicle stimulating hormone, is produced by the pituitary gland and supports sperm production in men. Ross's FSH of 6.9 is within the optimal range.","low_causes":"Pituitary disease, anabolic steroid use, obesity","high_causes":"Primary testicular failure, ageing, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"266","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5564","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3697","upper_optimal_position":"0.6242","units":"uIU/ml","description":"Prolactin is a pituitary hormone primarily known for stimulating milk production, but in men it plays a role in immune function and testosterone regulation. Elevated prolactin can suppress testosterone. Ross's prolactin of 266 is within the optimal range, ruling out hyperprolactinaemia as a cause of his low testosterone.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, certain medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"7.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4477","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3531","upper_optimal_position":"0.5642","units":"umol/L","description":"DHEA-S, dehydroepiandrosterone sulphate, is the most abundant steroid hormone in the body, produced by the adrenal glands. It serves as a precursor for both testosterone and oestradiol. Ross's DHEA-S of 7.5 umol/L (approximately 2,764 ug/dL) is within the optimal range, indicating healthy adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"474","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3861","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3449","upper_optimal_position":"0.6189","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning. Ross's morning cortisol of 474 nmol/L is within the expected morning range and within the optimal band, indicating normal adrenal function and stress response.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medication, depression, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"4.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6993","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4995","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland to regulate thyroid function. When the thyroid is underperforming, the pituitary produces more TSH to push it harder. Ross's TSH of 4.92 mIU/L is above the laboratory upper limit of 4.78 and well above the optimal ceiling of 2.5. This indicates the pituitary is having to work harder than normal to maintain thyroid hormone output. With both thyroid antibodies negative, autoimmune thyroid disease is unlikely, and this may represent early non-autoimmune subclinical hypothyroidism or a TSH elevation partly driven by obesity itself. A repeat in 8 to 12 weeks will clarify whether this is persistent.","low_causes":"Hyperthyroidism, pituitary disease, excessive thyroid medication, high-dose biotin supplementation","high_causes":"Hypothyroidism, subclinical hypothyroidism, obesity, recovery from illness, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4622","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/L","description":"FT4, free thyroxine, is the main hormone produced by the thyroid gland. It circulates to all tissues and is converted to the active form T3 where needed. Ross's FT4 of 15.9 pmol/L is within the optimal range of 14 to 20, though it sits in the lower half of the range. The fact that TSH is elevated while FT4 remains in range means the pituitary is pushing harder to maintain adequate output, but the thyroid is still responding.","low_causes":"Hypothyroidism, pituitary disease, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5704","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"FT3, free triiodothyronine, is the active thyroid hormone that cells directly use for metabolism, energy production, and temperature regulation. Ross's FT3 of 5.8 pmol/L is within the optimal band of 4.5 to 6.5, which is encouraging. It shows that even though TSH is elevated and FT4 is in the lower half, the body is still converting T4 to T3 effectively. This means the thyroid is under mild strain but cellular thyroid function is currently maintained.","low_causes":"Hypothyroidism, severe illness (sick euthyroid), calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3-predominant thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies target thyroid peroxidase, an enzyme essential for thyroid hormone production. Elevated levels indicate autoimmune thyroid disease (Hashimoto's thyroiditis). Ross's TPO antibodies are below 6.6 U/ml, well under the 13.8 threshold, which is negative. This effectively rules out Hashimoto's thyroiditis as the cause of his raised TSH.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune polyendocrine syndromes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2045","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. Like TPO antibodies, elevated levels indicate autoimmune thyroid disease. Ross's result of 1.8 U/ml is well below the 4.4 threshold, negative, further confirming no autoimmune thyroid component.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3708","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5238","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone essential for calcium absorption, bone health, immune function, and mood regulation. Below 30 nmol/L is deficient, 30 to 50 is insufficient, and above 50 is sufficient. The optimal range is 75 to 120 nmol/L. Ross's vitamin D of 89 nmol/L is within the optimal band, which at a BMI of 38 is a genuinely strong result. Body fat sequesters vitamin D, meaning people carrying excess weight typically have lower levels. Maintaining this level through the autumn and winter months when UVB exposure drops will require supplementation.","low_causes":"Insufficient sunlight exposure, dark skin, obesity (fat sequesters vitamin D), malabsorption, kidney disease","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.93","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4187","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3392","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium levels in the blood by controlling calcium release from bone, calcium absorption in the gut, and calcium retention in the kidneys. Ross's PTH of 1.93 pmol/L is within the optimal range, confirming the calcium-parathyroid axis is functioning correctly. This is consistent with his adequate vitamin D and normal calcium levels.","low_causes":"Autoimmune parathyroid destruction, post-surgical, magnesium deficiency","high_causes":"Vitamin D deficiency, chronic kidney disease, primary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"459","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4506","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4555","upper_optimal_position":"0.5823","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. It is found in animal products. Ross's B12 of 459 pg/ml is within the laboratory range of 193 to 982 but below the optimal floor of 500. B12 below optimal can contribute to fatigue and brain fog, both of which Ross reports. A sublingual methylcobalamin supplement would help bring this into the optimal band.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, malabsorption, metformin use, ageing","high_causes":"B12 supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, vitamin B9, is essential for DNA synthesis, red blood cell production, and methylation, a process critical for detoxification and gene regulation. Ross's folate of 12 ng/ml is within the optimal band, reflecting good dietary intake from his well-rated diet.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, certain medications (methotrexate, phenytoin)","high_causes":"Supplementation, high intake of fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"179","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4988","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Creatine kinase is an enzyme found in muscle tissue. It rises with muscle damage from exercise, injury, or disease. Ross's CK of 179 is within range, indicating no significant muscle damage.","low_causes":"Low muscle mass, very sedentary lifestyle","high_causes":"Recent exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7415","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the combined capacity of all antioxidants in the blood to neutralise free radicals. Ross's TAA of 2.09 mmol/L is above the laboratory range of 1.3 to 1.77. This is a favourable finding, suggesting strong antioxidant capacity likely driven by good dietary quality rated at 8 out of 10. Uric acid, which is slightly above optimal in Ross's case, also contributes to total antioxidant activity. This result above range is not a concern.","low_causes":"Poor dietary antioxidant intake, oxidative stress, chronic disease","high_causes":"Good dietary antioxidant intake, supplementation, elevated uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0480","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"ng/ml","description":"PSA, prostate specific antigen, is a protein produced by the prostate gland. It is used as a screening marker for prostate health. Levels below 2.5 ng/ml are considered normal for men under 50. Ross's PSA of 0.24 is very low, indicating excellent prostate health.","low_causes":"Normal prostate health","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"PSA (Free)","group":"PROSTATE","result":"0.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0778","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"ug/L","description":"Free PSA is the fraction of PSA not bound to proteins. The ratio of free to total PSA helps distinguish between benign and malignant prostate conditions. Ross's free PSA of 0.14 is very low in absolute terms but produces a high ratio of 58.3%, which is reassuring.","low_causes":"Normal low PSA levels","high_causes":"Benign prostatic hyperplasia, prostate inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Ratio","group":"PROSTATE","result":"0.583","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3069","lower_normal":"0.19","upper_normal":"0.95","lower_optimal":"0.25","upper_optimal":"0.95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3412","upper_optimal_position":"0.6667","units":"","description":"The PSA ratio (free PSA divided by total PSA) helps assess prostate cancer risk when PSA is elevated. Above 0.25 (25%) is generally reassuring. Ross's PSA ratio of 0.583 (58.3%) is well above the normal threshold of 0.19 and is reassuring, though with a total PSA this low, the ratio is primarily academic.","low_causes":"Increased risk of prostate cancer if total PSA elevated","high_causes":"Benign prostatic hyperplasia, normal finding with low total PSA","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0257","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/ml","description":"CA 19-9 is a tumour marker associated with pancreatic and gastrointestinal cancers. It is used for screening and monitoring rather than diagnosis. Ross's CA 19-9 of 1.9 U/ml is very low and within range, which is reassuring.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2783","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","uppe function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
