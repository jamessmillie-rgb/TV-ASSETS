ifiable lipid factors is well controlled.","low_causes":"Hyperthyroidism, liver disease, malabsorption, genetic factors","high_causes":"High saturated fat diet, obesity, insulin resistance, hypothyroidism, familial hypercholesterolaemia, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.454","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3243","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is considered one of the best single markers of cardiovascular risk. It balances the number of atherogenic particles (ApoB) against the number of protective particles (ApoA1). A lower ratio indicates a more favourable balance. Alexandro's ratio of 0.454 is well within the lower risk category of below 0.7, confirming a healthy balance between harmful and protective lipoproteins.","low_causes":"High HDL, low LDL, favourable genetics, regular exercise","high_causes":"Elevated LDL, low HDL, obesity, insulin resistance, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"171.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle similar to LDL but with an additional protein called apolipoprotein(a) attached to it. It contributes to cardiovascular risk through three mechanisms: depositing cholesterol in artery walls, promoting blood clot formation, and driving local inflammation. Unlike LDL, Lp(a) levels are almost entirely determined by genetics and do not change meaningfully with diet, exercise, or lifestyle. Alexandro's Lp(a) of 171.94 nmol/L places him in the moderate risk category (90 to 200 nmol/L). This is genuinely important information. It should be recorded permanently in his medical notes, and first-degree relatives should be offered testing. The positive news is that all of his modifiable lipid markers are excellent, which is the best strategy to mitigate the risk from an inherited factor he cannot change.","low_causes":"Genetic factors (favourable)","high_causes":"Entirely genetic and inherited; does not respond to lifestyle modification","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2467","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"","description":"The triglyceride-to-HDL ratio is a calculated marker that serves as a surrogate for insulin resistance and metabolic health. A lower ratio is better. Alexandro's TG/HDL ratio of 0.74 is within the optimal range of below 0.9, confirming excellent metabolic health and low insulin resistance. This is consistent with his HOMA-IR of 0.48.","low_causes":"Excellent insulin sensitivity, regular exercise, healthy diet, low carbohydrate intake","high_causes":"Insulin resistance, metabolic syndrome, high refined carbohydrate diet, excess alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3063","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant lipoproteins, calculated as total cholesterol minus HDL minus LDL. These remnant particles are independently atherogenic, meaning they contribute to plaque formation in arteries beyond what LDL alone does. Alexandro's remnant cholesterol of 0.49 is within the optimal range of below 0.5, indicating minimal contribution from this additional risk pathway.","low_causes":"Low triglycerides, healthy metabolism, good insulin sensitivity","high_causes":"Elevated triglycerides, insulin resistance, obesity, excess carbohydrate or alcohol intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"HS-CRP","group":"INFLAMMATION","result":"2.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP measures low levels of C-reactive protein, a marker of systemic inflammation produced by the liver. In cardiovascular risk assessment, hs-CRP below 1 is low risk, 1 to 3 is moderate risk, and above 3 is higher risk. Alexandro's hs-CRP of 2.2 is within the laboratory range of below 5 but falls in the moderate cardiovascular risk category. At BMI 28.7, some degree of low-grade systemic inflammation is common because adipose tissue produces inflammatory signalling molecules. Losing body fat is the most effective way to reduce hs-CRP, and his excellent HOMA-IR suggests the inflammation is driven by fat mass rather than metabolic dysfunction.","low_causes":"Lean body composition, anti-inflammatory diet, regular exercise, low stress","high_causes":"Excess body fat (particularly visceral), infection, chronic inflammation, autoimmune conditions, smoking, poor diet, poor sleep","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. It is a non-specific marker of inflammation; the faster the cells settle, the more inflammation is likely present. Alexandro's ESR of 1 mm/hour is about as low as this marker gets, indicating no significant systemic inflammatory process.","low_causes":"Normal finding, polycythaemia, sickle cell disease","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5641","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6487","units":"mmol/l","description":"Sodium is the primary electrolyte responsible for maintaining fluid balance, blood pressure, and nerve function. It is tightly regulated by the kidneys. Alexandro's sodium of 143 is within the optimal range, indicating normal hydration and kidney regulation.","low_causes":"Excessive water intake, diuretics, vomiting, diarrhoea, adrenal insufficiency, SIADH","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance, blood pressure, and the acid-base balance of the blood. Alexandro's chloride of 98 is within range, confirming normal electrolyte balance.","low_causes":"Vomiting, diuretics, metabolic alkalosis, excessive sweating","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"22.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4242","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's primary buffer against acid-base changes in the blood. The kidneys regulate bicarbonate levels to maintain blood pH within a very narrow range. Alexandro's bicarbonate of 22.3 is within range, indicating normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, certain medications","high_causes":"Metabolic alkalosis, vomiting, diuretics, chronic respiratory failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5380","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6088","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. The body maintains calcium levels within a very tight range using parathyroid hormone and vitamin D. Alexandro's calcium of 2.43 is within the optimal range, indicating healthy calcium homeostasis.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation, dehydration, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration in the blood, giving a more accurate estimate of the biologically active calcium. Alexandro's corrected calcium of 2.38 is within the optimal range, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6322","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.75","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4713","upper_optimal_position":"0.6322","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle relaxation, energy production, nerve function, and sleep regulation. Serum magnesium represents only about 1% of total body magnesium, so a normal blood level does not necessarily mean tissue stores are adequate. Alexandro's serum magnesium of 1.05 is at the upper end of the optimal range, which is reassuring. However, given his training volume and his reported poor sleep, supplementation with magnesium glycinate before bed is still recommended, as most active individuals benefit from additional magnesium beyond what serum levels reveal.","low_causes":"Excess alcohol, diuretics, poor dietary intake, intense exercise, chronic stress, digestive disorders","high_causes":"Kidney impairment, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"336","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4507","lower_normal":"220","upper_normal":"547","lower_optimal":"250","upper_optimal":"450","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3639","upper_optimal_position":"0.5580","units":"umol/l","description":"Uric acid is produced when the body breaks down purines, substances found in certain foods and in the body's own cells. The kidneys filter and excrete uric acid. Elevated levels can lead to gout and kidney stones and are associated with cardiovascular risk. Alexandro's uric acid of 336 is within the optimal range and poses no concern.","low_causes":"Low purine diet, medications, Fanconi syndrome, Wilson's disease","high_causes":"High purine diet (red meat, organ meats, shellfish), excess alcohol (especially beer), obesity, kidney impairment, metabolic syndrome, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6133","units":"mmol/l","description":"Urea is a waste product produced when the liver breaks down protein. It is filtered and excreted by the kidneys. Urea levels reflect both protein intake and kidney function. Alexandro's urea of 6 is within the optimal range, indicating the kidneys are clearing protein waste efficiently.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney impairment, gastrointestinal bleeding, catabolic states","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"107","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6923","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6410","units":"umol/l","description":"Creatinine is a waste product generated by the normal breakdown of creatine in muscles. It is filtered by the kidneys at a relatively constant rate and is used to estimate kidney filtration capacity. Alexandro's creatinine of 107 is marginally above the laboratory upper limit of 104. In a 96 kg male who does resistance training three times per week, a slightly elevated creatinine is common because larger, more active muscles produce more creatinine. However, taken alongside his Cystatin C result and both eGFR calculations, this warrants monitoring over time rather than immediate concern.","low_causes":"Low muscle mass, muscle wasting conditions, very low protein diet","high_causes":"High muscle mass, intense exercise, creatine supplementation, high protein diet, kidney impairment, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate uses creatinine, age, sex, and ethnicity to estimate how well the kidneys are filtering waste from the blood. A normal eGFR is above 90, while below 60 on two or more occasions may indicate chronic kidney disease. Alexandro's creatinine-based eGFR of 73 is above the 60 threshold but below the optimal 90. As noted, muscle mass and training can inflate creatinine and deflate the eGFR estimate. The Cystatin C-based eGFR provides a second data point and agrees closely at 74, which lends credibility to this being his true filtration rate rather than a muscle-mass artefact. This should be monitored with a repeat in twelve months.","low_causes":"Kidney disease, dehydration, kidney injury, medications affecting kidney function","high_causes":"Normal finding in healthy young adults, pregnancy, high cardiac output states","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5182","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells in the body at a constant rate. Unlike creatinine, it is not affected by muscle mass, diet, or exercise, which makes it a more reliable marker of kidney function in muscular or athletic individuals. Alexandro's Cystatin C of 1.14 is marginally above the upper limit of 1.1. Combined with his creatinine-based eGFR, both measures suggest his kidney filtration rate is in the mid-70s. While this is above the threshold for kidney disease, it is lower than the ideal above 90 for his age. There is no proteinuria, no haematuria attributable to the kidneys, and urea is normal, all of which are reassuring. This should be repeated in twelve months to confirm stability.","low_causes":"Normal finding in those with excellent kidney function","high_causes":"Reduced kidney filtration, thyroid dysfunction, corticosteroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"","description":"The Cystatin C-based eGFR provides an alternative estimate of kidney filtration that is independent of muscle mass. Alexandro's Cystatin C eGFR of 74 agrees closely with his creatinine-based eGFR of 73, which increases confidence that this reflects his true filtration rate. This is above the 60 threshold that would indicate kidney disease but below the 90 that would be expected for a healthy 43-year-old. As all other kidney markers are normal and there is no proteinuria, this is most likely a stable baseline rather than a sign of progressive disease, but monitoring is recommended.","low_causes":"Kidney disease, kidney injury, medications, dehydration","high_causes":"Healthy kidneys, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"128","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3167","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to the rest of the body. Alexandro's haemoglobin of 128 is marginally below the male lower limit of 130. However, this needs to be interpreted alongside his very small red cells (MCV 62.3), low MCH (20.7), and elevated red cell count (6.19). The pattern is one of microcytic anaemia with a compensatory increase in red cell numbers, which is the hallmark of thalassaemia trait. In thalassaemia trait, the body makes enough red cells but each one carries slightly less haemoglobin than usual, resulting in a marginally low haemoglobin despite a high red cell count.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, blood loss, vitamin B12 or folate deficiency, bone marrow disorders","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia (e.g. altitude, lung disease), smoking, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"6.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8960","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10/12/l","description":"The red blood cell count measures the number of red blood cells per litre of blood. Alexandro's RBC of 6.19 is above the upper limit of 5.5. This elevated count is the body's compensatory response to having smaller, less haemoglobin-rich red cells. In thalassaemia trait, the bone marrow produces more red cells to compensate for each cell carrying less haemoglobin than normal. This is a predictable finding in this context rather than an independent abnormality.","low_causes":"Iron deficiency, vitamin B12 or folate deficiency, bone marrow disorders, chronic disease, blood loss","high_causes":"Thalassaemia trait (compensatory), polycythaemia vera, dehydration, chronic hypoxia, smoking, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.386","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3193","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.4","upper_optimal":"0.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"l/l","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Alexandro's haematocrit of 0.386 is marginally below the lower limit of 0.40. Despite having more red cells than normal (RBC 6.19), each cell is much smaller than usual (MCV 62.3), so the total red cell volume is slightly reduced. This is entirely consistent with the microcytic pattern seen across his full blood count and is an expected feature of thalassaemia trait.","low_causes":"Anaemia of any cause, thalassaemia trait (due to small cell size), overhydration, blood loss","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"62.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"fl","description":"MCV, or mean corpuscular volume, measures the average size of each red blood cell in femtolitres. Alexandro's MCV of 62.3 is significantly below the lower limit of 83, indicating microcytosis, meaning his red cells are smaller than normal. This is the most striking abnormality in the full blood count. When iron deficiency has been excluded, as it has here by his entirely normal iron studies, the primary cause of an MCV this low is a haemoglobin variant, most commonly thalassaemia trait. A haemoglobin electrophoresis test through his GP would confirm the diagnosis.","low_causes":"Iron deficiency (excluded here by normal iron studies), thalassaemia trait, chronic disease, sideroblastic anaemia, lead poisoning","high_causes":"Vitamin B12 deficiency, folate deficiency, excessive alcohol, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"20.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH, or mean corpuscular haemoglobin, measures the average amount of haemoglobin carried by each red blood cell. Alexandro's MCH of 20.7 is below the lower limit of 27, meaning each red cell contains less haemoglobin than normal. This is a direct consequence of the smaller cell size seen in his MCV and is consistent with the thalassaemia trait pattern. The smaller cells have less room for haemoglobin, so the MCH drops proportionally.","low_causes":"Iron deficiency (excluded here), thalassaemia trait, chronic disease","high_causes":"Vitamin B12 deficiency, folate deficiency, macrocytosis from any cause","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"331","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC, or mean corpuscular haemoglobin concentration, measures the concentration of haemoglobin within each red cell rather than the total amount per cell. Alexandro's MCHC of 331 is within the normal range. This is an important distinction from his low MCH. While each cell carries less total haemoglobin (low MCH), the concentration of haemoglobin within the smaller cell volume is normal. This is characteristic of thalassaemia trait, where cells are small but not pale in proportion to their size.","low_causes":"Iron deficiency, thalassaemia (in some cases), chronic disease","high_causes":"Hereditary spherocytosis, dehydration artefact, cold agglutinins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"16.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7905","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"RDW, or red cell distribution width, measures the variation in size among red blood cells. A higher RDW means there is more variation, which can indicate a mixed population of cell sizes. Alexandro's RDW of 16.9% is above the upper limit of 15%, indicating that while most of his red cells are very small, there is some variation in their size. This is a common finding in thalassaemia trait and does not indicate a separate pathology.","low_causes":"Uniform cell size, which is the normal state","high_causes":"Iron deficiency, thalassaemia trait, vitamin B12 or folate deficiency, mixed nutritional deficiency, liver disease, recent blood transfusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"262","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4641","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that circulate in the blood and are essential for blood clotting. Alexandro's platelet count of 262 is within the optimal range, indicating normal clotting capacity and no signs of bone marrow underproduction or increased destruction.","low_causes":"Viral infections, medications, liver disease, autoimmune conditions, bone marrow disorders, excessive alcohol","high_causes":"Iron deficiency, inflammation, infection, post-surgery, essential thrombocythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6667","units":"fL","description":"MPV, or mean platelet volume, measures the average size of platelets. Larger platelets tend to be younger and more metabolically active. Alexandro's MPV of 9.7 is with rming adequate innate immune defence.","low_causes":"Viral infections, medications, autoimmune conditions, bone marrow disorders, ethnic neutropenia (benign in people of some ethnic backgrounds), caloric restriction","high_causes":"Bacterial infection, inflammation, stress, corticosteroids, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for the adaptive immune response, including virus recognition, antibody production, and long-term immune memory. Alexandro's lymphocyte count of 2.04 is within the optimal range, indicating a healthy adaptive immune system.","low_causes":"Viral infections (acute phase), HIV, corticosteroids, autoimmune conditions, malnutrition","high_causes":"Viral infections (recovery phase), chronic lymphocytic leukaemia, autoimmune conditions, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"x10^9/L","description":"Monocytes are white blood cells that develop into macrophages in tissues, where they engulf and destroy pathogens and dead cells. They also play a role in tissue repair and immune regulation. Alexandro's monocyte count of 0.35 is within the optimal range.","low_causes":"Bone marrow suppression, certain medications, autoimmune conditions","high_causes":"Chronic inflammation, chronic infection (e.g. tuberculosis), autoimmune conditions, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4722","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the immune response to parasitic infections and allergic reactions. Alexandro's eosinophil count of 0.22 is within the optimal range and does not suggest allergic activation or parasitic infection.","low_causes":"Acute stress, corticosteroid use, acute infection","high_causes":"Allergic conditions (asthma, hay fever, eczema), parasitic infections, drug reactions, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4074","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.06","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5185","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and are involved in allergic and inflammatory responses by releasing histamine and other chemicals. Alexandro's basophil count of 0.03 is within the normal range.","low_causes":"Acute allergic reaction (basophils leave the blood and enter tissues), hyperthyroidism, corticosteroid use","high_causes":"Chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4817","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. Their percentage reflects how actively the bone marrow is producing new red cells. Alexandro's reticulocyte count of 1.39% is within the normal range, indicating the bone marrow is producing red cells at a normal rate. This is an important finding because it confirms there is no active haemolysis (destruction of red blood cells) or acute blood loss that would drive the marrow to produce cells at an accelerated rate.","low_causes":"Iron deficiency, vitamin B12 or folate deficiency, bone marrow suppression, aplastic anaemia, chronic kidney disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia or nutritional deficiency, bone marrow response to treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"86.041","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5535","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of immature red blood cells per litre, independent of the total red cell count. Alexandro's absolute reticulocyte count of 86 is within the normal range, further confirming that his bone marrow's red cell production is appropriate and stable.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic kidney disease, aplastic anaemia","high_causes":"Active blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR (Neutrophil-to-Lymphocyte Ratio)","group":"HEMATOLOGY","result":"1.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3900","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a calculated marker of systemic inflammation and immune balance. It divides the neutrophil count by the lymphocyte count. A ratio between 1 and 3 is considered normal. Alexandro's NLR of 1.14 is within the optimal range, indicating a healthy balance between innate and adaptive immune cells with no systemic inflammatory shift.","low_causes":"Relative lymphocytosis, neutropenia","high_causes":"Acute infection, chronic inflammation, physiological stress, smoking, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"38.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5494","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5586","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. It reflects how much iron is available for transport to tissues. Alexandro's transferrin saturation of 38.31% is within the optimal range of 25% to 45%, confirming healthy iron availability without any suggestion of iron overload or deficiency.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, liver disease, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"25.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5655","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6109","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside transferrin, saturation, and ferritin. Alexandro's serum iron of 25.4 is within the optimal range, indicating healthy circulating iron levels.","low_causes":"Iron deficiency, chronic disease, blood loss, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein responsible for transporting iron through the bloodstream to the bone marrow and other tissues. The liver produces transferrin, and its level reflects both iron status and liver function. Alexandro's transferrin of 2.64 is within the optimal range, confirming the liver is producing this transport protein adequately and iron is being moved efficiently.","low_causes":"Iron overload, chronic inflammation (negative acute phase reactant), liver disease, malnutrition","high_causes":"Iron deficiency (the body produces more transferrin to capture available iron), pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"60.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5052","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3955","upper_optimal_position":"0.5762","units":"umol/l","description":"Total iron binding capacity measures the maximum amount of iron that the blood can carry, reflecting the availability of transferrin binding sites. Alexandro's TIBC of 60.5 is within the optimal range, further confirming balanced iron metabolism.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"212","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5433","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5911","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. Each ferritin molecule can hold thousands of iron atoms and release them when needed. It is the single best marker of total body iron stores. Alexandro's ferritin of 212 is well within the optimal range of 50 to 250 for men, confirming adequate iron stores. Importantly, this normal ferritin level, combined with his normal transferrin, serum iron, and saturation, conclusively rules out iron deficiency as the cause of his small red blood cells and low haemoglobin, pointing instead to an inherited cause such as thalassaemia trait.","low_causes":"Iron deficiency, blood loss, malabsorption, vegetarian or vegan diet, heavy exercise, pregnancy","high_causes":"Iron overload, haemochromatosis, inflammation (ferritin is an acute phase reactant), liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"10.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, red blood cell production, fat distribution, libido, mood, and energy. Alexandro's testosterone of 10.7 nmol/L is within the laboratory range of 8.4 to 28.7 but below the lab's own recommended level of above 12, and well below the optimal range of 18 to 30. At BMI 28.7, excess adipose tissue produces the enzyme aromatase, which converts testosterone to oestradiol. This is the most likely explanation for his below-optimal level. Losing body fat is the single most effective intervention for improving testosterone naturally. Poor sleep, which Alexandro reports, can also suppress testosterone production, as the majority of testosterone is produced during deep sleep.","low_causes":"Obesity and excess body fat, poor sleep, chronic stress, aging, pituitary dysfunction, medications, excessive endurance training, alcohol","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.272","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone that is not bound to proteins in the blood and is therefore available to act on tissues. It is calculated from total testosterone, SHBG, and albumin. Alexandro's calculated free testosterone of 0.272 nmol/L reflects his low-normal total testosterone and low-normal SHBG. While reference ranges for calculated free testosterone vary, this level is consistent with his overall hormonal picture and would be expected to improve with body fat reduction and sleep optimisation.","low_causes":"Low total testosterone, high SHBG, obesity, aging, medications","high_causes":"High total testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"19.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3786","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3835","upper_optimal_position":"0.5783","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds to testosterone and oestradiol, controlling how much of each hormone is available to tissues. Alexandro's SHBG of 19.5 is at the lower end of the laboratory range of 17.3 to 65.8 and below the optimal range. Low SHBG is commonly associated with insulin resistance, excess body fat, and metabolic syndrome, although interestingly, Alexandro's insulin sensitivity is excellent. Low SHBG means a higher proportion of his total testosterone is free and available, which partially compensates for his below-optimal total testosterone.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use, nephrotic syndrome","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen therapy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"54.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4044","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5278","units":"","description":"The free androgen index is calculated as (total testosterone / SHBG) x 100. It provides an estimate of the proportion of testosterone that is biologically active. Alexandro's FAI of 54.87 is within the optimal range because, although his total testosterone is below optimal, his low SHBG means a higher proportion of what he has is available for use. This is a partial compensatory effect.","low_causes":"Low testosterone, high SHBG, aging, obesity","high_causes":"High testosterone, low SHBG, anabolic steroid use, polycystic ovarian syndrome in women","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2363","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3422","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen. In men, it is produced partly by the testes and partly by the conversion of testosterone to oestradiol by the aromatase enzyme, which is concentrated in fat tissue. Alexandro's oestradiol of 69 is within the laboratory range. At BMI 28.7, the aromatase activity in his adipose tissue is likely converting some of his testosterone to oestradiol, which may be contributing to both his below-optimal testosterone and his difficulty losing weight. Reducing body fat would reduce aromatase activity and help shift the balance back towards testosterone.","low_causes":"Very low body fat, aromatase inhibitor medications, hypogonadism","high_causes":"Obesity and excess body fat (aromatase activity), liver disease, medications, testosterone supplementation (paradoxically, via conversion)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4130","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5370","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in testosterone synthesis and has calming effects on the nervous system. Alexandro's progesterone of 1.6 is within the normal male range and is not a concern.","low_causes":"Adrenal insufficiency, stress","high_causes":"Adrenal or testicular tumours, congenital adrenal hyperplasia, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"1.43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3234","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3526","upper_optimal_position":"0.5962","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and signals the testes to produce testosterone. Alexandro's LH of 1.43 is marginally below the lower limit of 1.5. This is a subtle but meaningful finding. LH being at or below the lower limit while testosterone is also below optimal suggests the pituitary gland is not driving testosterone production as hard as it could. This can be influenced by excess body fat, poor sleep, and stress, all of which can suppress the hypothalamic-pituitary-gonadal axis. Losing body fat and improving sleep are the most effective ways to restore this signalling pathway.","low_causes":"Obesity, stress, sleep deprivation, excessive exercise, pituitary disorders, medications, hypothalamic suppression","high_causes":"Primary hypogonadism (testicular failure), aging, anabolic steroid recovery","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3797","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5179","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland and, in men, stimulates the Sertoli cells in the testes to support sperm production. Alexandro's FSH of 3.57 is within the optimal range, indicating normal pituitary-testicular signalling for sperm production.","low_causes":"Pituitary disorders, obesity, medications, anabolic steroid use","high_causes":"Primary testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"187","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4758","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production in women but also present in men where it influences immune function, reproductive health, and the dopamine pathway. Alexandro's prolactin of 187 is within the optimal range. Significantly elevated prolactin can suppress testosterone and libido, but his level is healthy.","low_causes":"Dopamine agonist medications","high_causes":"Stress, medications (particularly antipsychotics and antidepressants), pituitary adenoma, hypothyroidism, chest wall irritation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"524","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5990","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"275","upper_optimal":"555","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4272","upper_optimal_position":"0.6216","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the morning and falling throughout the day. It mobilises energy, regulates immune function, and controls inflammation. Alexandro's morning cortisol of 524 is within the normal morning range of 145 to 619. Although the lab flagged this as abnormal, a morning cortisol of 524 is a normal result. It does sit in the upper portion of the range, which is worth noting in the context of his poor sleep, as disrupted sleep can sustain higher cortisol levels throughout the day, potentially contributing to weight gain and difficulty losing body fat.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary dysfunction, chronic stress leading to adrenal fatigue (controversial)","high_causes":"Acute or chronic stress, poor sleep, Cushing's syndrome, corticosteroid medications, depression, excessive exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1474","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4560","lower_normal":"162.1","upper_normal":"4940.9","lower_optimal":"350","upper_optimal":"3000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3727","upper_optimal_position":"0.5927","units":"ug/dL","description":"DHEA-S (dehydroepiandrosterone sulphate) is the most abundant steroid hormone in the body, produced by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. DHEA-S levels naturally decline with age. Alexandro's DHEA-S of 1,474 ug/dL (converted from 4 umol/L) is within the optimal range for his age, indicating healthy adrenal function.","low_causes":"Aging, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, polycystic ovarian syndrome in women, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"4.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6605","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3773","upper_optimal_position":"0.4599","units":"mIU/l","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland to regulate the thyroid. When the thyroid is underperforming, the pituitary increases TSH to push it harder. Alexandro's TSH of 4.74 is within the laboratory range of 0.55 to 4.78 but sits right at the upper boundary, well above the optimal range of 1.0 to 2.5. This means the pituitary is working relatively hard to maintain thyroid hormone output. His thyroid antibodies are both negative, ruling out autoimmune thyroid disease. A TSH at this level, combined with a free T4 in the lower third of its range, represents a thyroid gland that is managing for now but may be on a trajectory towards subclinical hypothyroidism. This is relevant because underactive thyroid function is associated with fatigue, weight gain, difficulty losing weight, poor sleep, and brain fog, all of which Alexandro reports. Repeat testing in six months is recommended.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction, severe illness","high_causes":"Hypothyroidism (primary), iodine deficiency, thyroid surgery or radiation, medications (lithium, amiodarone), recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4262","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"15","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4364","upper_optimal_position":"0.5833","units":"pmol/l","description":"Free T4, or free thyroxine, is the unbound form of the thyroid hormone T4 that is available to be converted to the active form T3 in tissues. Alexandro's FT4 of 14.6 is within the laboratory range but in the lower third, below the optimal range of 15 to 20. When interpreted alongside his TSH at the upper boundary, this suggests the thyroid gland is producing a relatively modest amount of T4 despite significant pituitary stimulation. The thyroid is managing to maintain adequate output for now, but there is limited reserve.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness, medications","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis (acute phase)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"3.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5556","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the active thyroid hormone that directly drives metabolism, energy production, and heat generation in cells. It is produced partly by the thyroid gland and partly by the conversion of T4 to T3 in peripheral tissues. Alexandro's FT3 of 4.6 is within the optimal range, which is reassuring. It indicates that despite the thyroid being pushed hard (high TSH) to produce a modest amount of T4, the body is converting T4 to T3 efficiently enough to maintain adequate active hormone levels. This is the reason he is not clinically hypothyroid at present.","low_causes":"Hypothyroidism, severe illness (sick euthyroid syndrome), caloric restriction, selenium deficiency, medications","high_causes":"Hyperthyroidism, excessive T3 supplementation, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroid peroxidase antibodies are immune proteins that target an enzyme in the thyroid gland. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Alexandro's TPO antibodies are below 6.6, well within the negative range of below 13.8. This rules out autoimmune thyroid disease as the cause of his borderline-high TSH.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid gland to produce thyroid hormones. Like TPO antibodies, their presence indicates autoimmune thyroid disease. Alexandro's thyroglobulin antibodies are below 1.3, well within the negative range and below the autoimmune cut-off of 4.4. This further confirms that his borderline-high TSH is not driven by an autoimmune process.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is a fat-soluble vitamin that functions as a hormone, playing critical roles in calcium absorption, bone health, immune function, mood regulation, and muscle function. It is primarily produced in the skin through sunlight exposure and is difficult to obtain in sufficient amounts from diet alone. Alexandro's vitamin D of 57 nmol/L is above the sufficiency threshold of 50 but below the optimal range of 75 to 100 associated with the best health outcomes. At BMI 28.7, adipose tissue sequesters vitamin D, reducing its bioavailability, which means he may need a higher supplementation dose than a leaner individual to achieve optimal levels.","low_causes":"Limited sun exposure, high latitude, darker skin, obesity (fat sequesters vitamin D), indoor lifestyle, sunscreen use, malabsorption, aging","high_causes":"Excessive supplementation, granulomatous diseases (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5280","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5867","units":"pmol/L","description":"Parathyroid hormone is produced by four small glands behind the thyroid and is the primary regulator of blood calcium levels. When calcium drops, PTH rises to pull calcium from bones and increase its absorption from the gut. Alexandro's PTH of 3.2 is within the optimal range, and his corrected calcium is also normal, confirming healthy calcium regulation. In the context of a vitamin D of 57, a normal PTH is reassuring because if vitamin D were insufficient enough to impair calcium absorption, PTH would rise to compensate.","low_causes":"Hypoparathyroidism (post-surgical or autoimmune), high calcium, excessive vitamin D, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"379","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4119","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.5867","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is found primarily in animal products. Alexandro's B12 of 379 is within the laboratory range but below the optimal threshold of around 500. At this level, there is no deficiency, but optimising B12 can support energy production, cognitive function, and nervous system health. Sublingual methylcobalamin is the preferred supplementation form as it is well absorbed and bypasses any digestive absorption issues.","low_causes":"Vegetarian or vegan diet, malabsorption (pernicious anaemia, coeliac disease, Crohn's), medications (metformin, proton pump inhibitors), aging, gastric surgery","high_causes":"Supplementation, liver disease, myeloproliferative disorders, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, red blood cell production, and nervous system function. It works in partnership with B12 and is found in leafy green vegetables, legumes, and fortified foods. Alexandro's folate of 8 is within the optimal range, indicating adequate dietary intake and no deficiency.","low_causes":"Poor dietary intake, malabsorption, excessive alcohol, medications (methotrexate, anti-epileptics), pregnancy","high_causes":"Supplementation, excessive dietary intake, vitamin B12 deficiency (folate can accumulate when B12 is deficient because it cannot be properly utilised)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"344","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6905","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found in skeletal muscle, heart muscle, and brain tissue. It is released into the blood when muscle cells are damaged or stressed. In the context of regular resistance training, a mildly elevated CK is a normal physiological response to recent exercise. Alexandro's CK of 344 is marginally above the upper limit of 320. Given that he does resistance training three times per week, this almost certainly reflects recent training-induced muscle stress rather than any pathological process. If the sample was taken within 24 to 48 hours of a training session, this is the expected explanation.","low_causes":"Low muscle mass, sedentary lifestyle, early pregnancy","high_causes":"Recent intense exercise, muscle injury, rhabdomyolysis (rare, with CK typically in the thousands), myocarditis, hypothyroidism, statin medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4702","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3684","upper_optimal_position":"0.5965","units":"g/l","description":"IgG is the most abundant antibody in the blood, providing the majority of long-term immune protection against bacteria and viruses. It represents the memory of the immune system, built from previous infections and vaccinations. Alexandro's IgG of 10.4 is within the optimal range, indicating a healthy and well-functioning immune memory.","low_causes":"Primary immunodeficiency, medications (corticosteroids, immunosuppressants), kidney disease causing protein loss, certain cancers","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3867","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"g/l","description":"IgM is the first antibody produced in response to a new infection. It activates complement, a cascade of immune proteins that help destroy pathogens. Alexandro's IgM of 0.9 is within the optimal range, indicating a normally functioning first-line antibody response.","low_causes":"Primary immunodeficiency, medications, certain cancers","high_causes":"Acute infection, autoimmune disease, liver disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6022","units":"g/l","description":"IgA is the antibody that protects mucosal surfaces, including the gut, respiratory tract, and urogenital tract. It is the body's first line of immune defence at entry points for pathogens. Alexandro's IgA of 1.8 is within the optimal range. Adequate IgA is also important for interpreting the coeliac screening test (tissue transglutaminase IgA), which relies on IgA antibodies; his sufficient IgA level confirms the coeliac test result is reliable.","low_causes":"Selective IgA deficiency (most common primary immunodeficiency, usually benign), medications","high_causes":"Chronic mucosal infection, IgA nephropathy, liver disease, coeliac disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"89.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4480","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"80","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"IU/ml","description":"IgE is the antibody involved in allergic responses and defence against parasites. It triggers the release of histamine and other inflammatory mediators from mast cells. Alexandro's IgE of 89.6 is within the laboratory range of below 100 but above the optimal threshold of 80. This is a minor finding and does not necessarily indicate clinical allergy, but it suggests some degree of allergic sensitisation. If Alexandro experiences seasonal allergies, skin reactions, or food sensitivities, this would be consistent.","low_causes":"Normal finding, immunodeficiency","high_causes":"Allergic conditions (asthma, eczema, hay fever, food allergy), parasitic infections, atopic dermatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","l // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');

dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
