<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Alexandro Mancusi","dob":"24/01/1983","report_date":"2026-08-11","summary":"Alexandro is a 43-year-old male presenting with a BMI of 28.7, following a standard mixed diet rated 6 out of 10 for quality with a volume of 7 out of 10. He trains 6 times per week, split evenly between 3 cardio sessions and 3 resistance sessions, with 7,500 to 10,000 daily steps. He reports no medications, no habitual alcohol or tobacco use, and no known medical conditions. His symptoms include weight gain and difficulty losing weight, low energy and fatigue, and poor sleep or insomnia. His goals are to lose body fat, improve cardiovascular fitness, and improve long-term health and longevity.\n\nThere are two findings in this report that should be discussed with his GP promptly. The first is his full blood count, which shows a pattern strongly suggestive of an underlying haemoglobin variant or thalassaemia trait. His MCV, which measures the average size of each red blood cell, is 62.3 femtolitres, well below the lower limit of 83. His MCH, which measures how much haemoglobin each red cell carries, is 20.7, below the lower limit of 27. His RDW, which measures the variation in red cell size, is 16.9%, above the upper limit of 15%. His haemoglobin itself is 128, just below the male lower limit of 130. Crucially, his red blood cell count is 6.19, above the upper limit of 5.5, and his haematocrit is 0.386, below the lower limit of 0.40. This combination of very small red cells, a high red cell count, low haemoglobin, and a wide variation in cell size is a classic pattern. The body is compensating for small, haemoglobin-poor red cells by producing more of them. His iron studies are entirely normal, with ferritin at 212, transferrin at 2.64, saturation at 38%, and serum iron at 25.4, all comfortably within range. This effectively rules out iron deficiency as the cause of the microcytosis. In a 43-year-old male of European and likely Mediterranean ancestry with normal iron stores and this blood picture, the most probable explanation is beta-thalassaemia trait, a common inherited condition in which one copy of the gene that codes for haemoglobin is altered, resulting in smaller red cells but usually no significant health consequences. This is not a disease. It does not typically cause symptoms and does not need treatment. However, it should be confirmed with a haemoglobin electrophoresis test through his GP, partly because it is useful medical information for Alexandro to have on his permanent record and partly because it is relevant for family planning, as two carriers can have a child with a more significant form of thalassaemia. His reticulocyte count at 1.39% and absolute reticulocytes at 86 are both within range, which confirms the bone marrow is producing red cells at a normal rate and there is no active haemolysis or acute blood loss.\n\nThe second finding for his GP is his Lp(a), or lipoprotein(a), which is 171.94 nmol/L against a desirable level of below 32. Lp(a) is a genetically determined lipoprotein particle that is structurally similar to LDL cholesterol but carries an additional protein called apolipoprotein(a). It contributes to cardiovascular risk through three mechanisms: it deposits cholesterol in artery walls much like LDL, it has a structure that promotes blood clotting, and it drives local inflammation. The level is entirely inherited, it does not change with diet, exercise, or lifestyle, and it remains essentially constant throughout life. At 171.94, Alexandro falls into the moderate risk category. This is genuinely important information because the rest of his lipid profile is excellent. His total cholesterol is 4.4, his LDL is 2.31, his HDL is 1.6 which is well above the desirable threshold of 1.55, his triglycerides are 1.18, his ApoB is 0.69 which is well below the 0.9 target, and his ApoB to ApoA-I ratio is 0.45, comfortably in the lower risk category. His remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, is 0.49, which is within the optimal range. His triglyceride-to-HDL ratio is 0.74, also optimal. By every modifiable lipid measure, his cardiovascular risk profile is very good. The Lp(a) is the one factor he cannot change, and it means his total burden of atherogenic particles is higher than his standard lipid panel suggests. We would recommend he discusses this with his GP so that it is recorded permanently in his medical notes, and he should consider having first-degree relatives, particularly siblings and any children, tested as well. The presence of elevated Lp(a) also means that maintaining his modifiable lipid markers at their current excellent levels becomes even more important, because the inherited risk he cannot change makes it all the more valuable to keep the risks he can change as low as possible.\n\nThe third finding that warrants attention is his pancreatic enzymes. His amylase is 121 against an upper limit of 118, and his lipase is 176 against an upper limit of 60. Amylase and lipase are enzymes produced by the pancreas to digest starches and fats respectively. Lipase is the more specific marker for pancreatic inflammation, and at nearly three times the upper limit it is significantly elevated. In acute pancreatitis, lipase typically rises to five or more times the upper limit, so this level does not suggest an acute episode, but it is well above the expected range and should not be dismissed. In the absence of abdominal pain, nausea, or vomiting, the most common explanations include subclinical pancreatic inflammation, a small pancreatic duct variation, or macrolipasaemia, a benign condition where lipase binds to immunoglobulins and is cleared from the blood more slowly. His alcohol intake is not reported as elevated, which removes one of the more common causes. We would recommend he mentions this to his GP, who may wish to repeat the test in four to six weeks and, if it remains elevated, consider an abdominal ultrasound or further imaging to examine the pancreas.\n\nTurning to what is working well, and there is a great deal to be positive about. His lipid profile, as described above, is genuinely excellent for a 43-year-old man at BMI 28.7. An HDL of 1.6, an ApoB of 0.69, and a triglyceride-to-HDL ratio of 0.74 reflect a metabolically healthy pattern that his training and diet are clearly supporting. His liver is in excellent health. ALT at 25, AST at 34, Gamma GT at 18, bilirubin at 11, albumin at 44, and a FIB-4 score of 1.12 all paint a picture of a liver under no metabolic strain whatsoever. His glucose metabolism is reassuring. Fasting glucose at 5.1 and HbA1c at 35 mmol/mol are both comfortably within the healthy range. His insulin is 2.11, which is below the laboratory lower limit of 2.6, and his C-Peptide is 0.642 micrograms per litre, also below the laboratory range of 1.1 to 4.4. However, his HOMA-IR, which estimates insulin resistance by combining fasting glucose and fasting insulin, is 0.48, below 1.0 and therefore in the insulin-sensitive category. This means his pancreas does not need to produce much insulin to keep his blood sugar perfectly controlled. Low insulin and low C-Peptide alongside normal glucose and normal HbA1c is the hallmark of excellent insulin sensitivity, not pancreatic failure. This is a positive finding. His HOMA-B, which estimates beta-cell function, calculates to 26.4, which is below the standard range, but this must be interpreted in context. The formula uses a denominator of glucose minus 3.5, so at a fasting glucose of 5.1, the denominator is small, and combined with genuinely low insulin output it produces a low number. Given that both his glucose and HbA1c are perfectly normal, this reflects low insulin demand rather than inadequate supply. His kidney function markers are worth discussing in context. His creatinine is 107, marginally above the laboratory upper limit of 104, and his creatinine-based eGFR is 73. His Cystatin C is 1.14, marginally above the upper limit of 1.1, and his Cystatin C-based eGFR is 74. Both eGFR values agree closely, which lends confidence to the estimate. At 43 with a BMI of 28.7 and regular resistance training, some elevation in creatinine is expected because creatinine is produced by muscle metabolism, and a larger, more muscular frame generates more of it. However, both eGFR values sitting in the mid-70s at age 43 are below the level one would ideally see, where above 90 would be expected. There is no protein in his urine and his urea is a normal 6, both of which are reassuring. This does not suggest kidney disease, but it is worth establishing a baseline and repeating in twelve months to ensure stability. His electrolytes are well balanced, with sodium at 143, chloride at 98, bicarbonate at 22.3, and magnesium at 1.05, all within range. His uric acid at 336 is comfortably normal. His calcium at 2.43, corrected calcium at 2.38, and PTH at 3.2 are all healthy, confirming good calcium and parathyroid regulation. His inflammatory markers are broadly reassuring. His ESR is 1, which is about as low as that marker gets. His CRP at 2.2 is within the laboratory range of below 5, though from a cardiovascular risk stratification perspective, a level above 2.0 is considered moderate risk. At BMI 28.7, some low-grade systemic inflammation is expected, and losing body fat would be the most effective way to bring this down. His thyroid panel is functioning but worth monitoring. His TSH is 4.74, within the laboratory range of 0.55 to 4.78 but sitting right at the upper boundary. His free T4 is 14.6, within range but in the lower third, and his free T3 is 4.6, also within range. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease. A TSH at the top of range with a free T4 in the lower third suggests the thyroid is having to be pushed relatively hard to maintain adequate hormone output. This is not hypothyroidism at present, but it is a pattern that can progress, and given his symptoms of fatigue, difficulty losing weight, and poor sleep, all of which are recognised features of suboptimal thyroid function, it would be worth repeating TSH and free T4 in six months to track the trajectory. His immune system is well balanced, with IgG, IgM, IgA, and IgE all within range, rheumatoid factor negative, and coeliac screening negative. His tumour markers are all reassuringly normal. PSA is 0.73 with a free-to-total ratio of 41%, CA 19-9 is 1.95, and CEA is 0.65, all well within their respective limits. His vitamin D at 57 nmol/L is classified as sufficient but is below the optimal level of 75 to 100 that is associated with the best long-term health outcomes. His B12 at 379 is within range but below the optimal threshold of around 500. His folate at 8 is adequate.\n\nHis hormone profile shows a few findings worth noting. His testosterone is 10.7 nmol/L, within the laboratory range of 8.4 to 28.7 but below the lab's own recommended level of above 12 and below the optimal range of 18 to 30. His SHBG, the protein that binds testosterone and makes it unavailable to tissues, is 19.5, at the lower end of its range, which means his free androgen index at 54.87 and calculated free testosterone at 0.272 are reasonable relative to total testosterone. His LH, the pituitary hormone that signals the testes to produce testosterone, is 1.43, marginally below the lower limit of 1.5. Low-normal LH with below-optimal testosterone suggests the pituitary is not driving testosterone production as hard as it could. At BMI 28.7, excess body fat converts testosterone to oestradiol via the aromatase enzyme, and his oestradiol at 69, while within range, is not negligible. Reducing body fat would be the single most effective intervention for improving testosterone. His cortisol at 524 is within the morning reference range of 145 to 619, though the lab has flagged it as abnormal. This is a normal morning cortisol level and is not a concern. His DHEA-S at 4 micromoles per litre, which converts to approximately 1,474 micrograms per decilitre, is within range. His prolactin at 187 and progesterone at 1.6 are both within their respective male ranges.\n\nHis creatine kinase at 344 is marginally above the upper limit of 320. CK is an enzyme released from muscle cells during exercise, and in a man doing resistance training three times per week, a marginally elevated level almost certainly reflects recent training rather than any pathological process. If the sample was taken within 48 hours of a resistance session, this is the expected explanation.\n\nHis urinalysis shows one finding that needs attention. His red blood cells are 30 per microlitre against a threshold of below 25 for significance. This is microscopic haematuria, meaning blood in the urine that is not visible to the naked eye. At 43, the most common causes are vigorous exercise, a minor urinary tract irritation, or sample contamination, particularly as the lab has noted that the sample was received in a plain bottle without boric acid, which can affect results. However, microscopic haematuria should not be assumed to be benign without follow-up. We would recommend he repeats a urine sample, ideally with boric acid preservation, and if the finding persists, his GP may wish to investigate further with a renal and bladder ultrasound. The urine culture showed moderate growth of commensals with no white cells and no nitrites, which is consistent with contamination rather than infection.","links":"Alexandro's results point to several clear areas of action, and the good news is that the most impactful changes are within his control.\n\nThe first priority is the GP conversation. He should bring three findings to his doctor. First, the full blood count pattern of very low MCV at 62.3, high RBC count at 6.19, low MCH at 20.7, and normal iron studies. This pattern is highly suggestive of thalassaemia trait and should be confirmed with a haemoglobin electrophoresis test. This is a simple blood test and is important information for his medical record and for family planning. Second, his Lp(a) at 171.94 nmol/L should be recorded in his permanent medical notes. His GP should be aware that while his modifiable lipid markers are excellent, the inherited Lp(a) elevation means his overall atherogenic burden is higher than the standard lipid panel alone would suggest, and cardiovascular risk management should factor this in. Third, his lipase at 176, nearly three times the upper limit, alongside amylase at 121, should be repeated in four to six weeks. If it remains elevated, further investigation with abdominal imaging would be appropriate. He should also mention the microscopic haematuria of 30 red blood cells per microlitre in his urine and request a repeat sample with boric acid preservation.\n\nFor body composition, Alexandro's primary goal of losing body fat is well supported by his metabolic health. His insulin sensitivity is excellent, his liver is clean, and his lipid profile is strong. At 96 kg and 183 cm with his activity level, his estimated maintenance calories are approximately 2,750 to 2,900 per day. To lose body fat at a sustainable rate of 0.5 to 0.75 kg per week, a calorie target of 2,200 to 2,400 per day would be appropriate. His protein intake should be at least 125 to 155 grams per day, which at 1.3 to 1.6 grams per kilogram supports muscle retention during a calorie deficit and optimises recovery from his six weekly training sessions. Given his diet quality is rated 6 out of 10, there is room to improve food choices without reducing volume dramatically. Increasing lean protein sources, vegetables, and whole grains while reducing processed foods and refined carbohydrates would improve the quality score and support fat loss. Reducing body fat would also be expected to improve his testosterone, as adipose tissue converts testosterone to oestradiol, and losing even 5 to 8 kg of fat could meaningfully shift this balance.\n\nFor cardiovascular fitness, his training structure of three cardio and three resistance sessions is solid. To maximise cardiovascular adaptation, he should ensure at least two of his three cardio sessions include sustained effort in zone 2, which is a conversational pace maintained for 30 to 60 minutes. This builds the aerobic base that underpins both fat oxidation and long-term cardiovascular health. His step count of 7,500 to 10,000 is good, and pushing consistently towards the upper end of that range, or beyond, would add meaningful non-exercise activity thermogenesis to support his fat loss goal.\n\nFor sleep, which he reports as poor, practical steps include fixing a consistent wake time seven days a week, getting outside within the first hour of waking to set the circadian rhythm, cutting caffeine after midday, keeping the bedroom cool at around 18 degrees Celsius, and avoiding screens for at least 30 minutes before bed. Magnesium glycinate taken before bed can support sleep quality and is included in the supplementation section below. His cortisol is within range but at the higher end of the morning window, and chronically disrupted sleep can sustain elevated cortisol, which in turn promotes visceral fat storage and suppresses testosterone. Improving sleep may therefore help with both his weight and his energy.\n\nFor his thyroid, no intervention is needed now, but TSH and free T4 should be repeated in six months. If TSH rises above the upper limit or free T4 drops further, his GP can assess whether treatment is warranted. Given that both antibodies are negative, this is not autoimmune in origin.\n\nFor his vitamin D, increasing from 57 to the optimal range of 75 to 100 nmol/L requires supplementation through the autumn and winter months and would be beneficial year-round at his latitude. Vitamin D supports immune function, bone health, mood, and muscle function.\n\nFor his kidney markers, the creatinine and Cystatin C values should be repeated in twelve months alongside a urine albumin-to-creatinine ratio to establish whether the eGFR in the mid-70s is his stable baseline, which is possible given his muscle mass and training, or whether it is trending. Staying well hydrated, particularly around training, is important. He should aim for at least 2.5 to 3 litres of water per day.\n\nFor his Lp(a), while the level itself cannot be changed, the strategy is to keep every modifiable risk factor as low as possible. His lipid profile is already excellent, but maintaining it requires ongoing attention. Omega-3 fatty acids from oily fish two to three times per week, or from supplementation, support both triglyceride levels and the anti-inflammatory environment that helps counterbalance Lp(a)'s pro-inflammatory effects. Soluble fibre from oats, beans, lentils, and vegetables supports LDL clearance. These dietary patterns also support his fat loss goal, making them doubly valuable.","flags":"GP-URGENT ITEMS:\n\n1. Full blood count: microcytic pattern. MCV 62.3 (range 83-101), MCH 20.7 (range 27-32), RBC 6.19 (range 4.5-5.5), haemoglobin 128 (range 130-170), HCT 0.386 (range 0.40-0.50), RDW 16.9% (range 11.5-15%). Iron studies entirely normal. Pattern is strongly suggestive of thalassaemia trait given Mediterranean ancestry and normal iron stores. Recommend haemoglobin electrophoresis for confirmation.\n\n2. Lp(a): 171.94 nmol/L (desirable below 32). Moderate inherited cardiovascular risk. Genetically fixed, should be recorded permanently. First-degree relative testing recommended. All modifiable lipid markers are within optimal ranges.\n\n3. Lipase: 176 U/L (range 13-60), nearly 3x upper limit. Amylase 121 IU/L (range 30-118), marginally above. No reported abdominal symptoms. Recommend repeat in 4-6 weeks; if persistent, consider abdominal imaging to assess pancreas.\n\n4. Microscopic haematuria: urine RBC 30/uL (significant above 25). No WBCs, no nitrites, no protein. Plain bottle received without boric acid. Recommend repeat with boric acid preservation; if persistent, consider renal and bladder ultrasound.\n\nMONITORING ITEMS:\n\n5. Kidney function: creatinine 107 (range 65-104), Cystatin C 1.14 (range below 1.1), creatinine-based eGFR 73, Cystatin C-based eGFR 74. Both eGFR values agree. Muscle mass and resistance training likely contribute to creatinine elevation. No proteinuria, urea normal at 6. Recommend repeat in 12 months with urine ACR to establish trajectory.\n\n6. Thyroid: TSH 4.74 (range 0.55-4.78), at upper boundary. FT4 14.6 (range 11.5-22.7), lower third. FT3 4.6 (range 2.6-7.1). Both TPO and thyroglobulin antibodies negative. Not hypothyroid at present but warrants repeat in 6 months given symptoms of fatigue, weight difficulty, and poor sleep.\n\n7. Testosterone: 10.7 nmol/L (range 8.4-28.7, recommended above 12). LH 1.43 (range 1.5-9.3), marginally below lower limit. Likely driven by BMI 28.7 and associated aromatase activity. Fat loss expected to improve.\n\n8. CRP: 2.2 mg/L (lab range below 5, but cardiovascular risk stratification considers above 2.0 moderate risk). Likely related to BMI. ESR 1, reassuringly low.\n\n9. Insulin 2.11 mIU/L (range 2.6-24.9) and C-Peptide 0.642 ug/L (range 1.1-4.4), both below range. HOMA-IR 0.48, insulin-sensitive. Glucose 5.1 and HbA1c 35 both normal. Reflects excellent insulin sensitivity, not pancreatic failure.\n\n10. Vitamin D: 57 nmol/L, sufficient but below optimal 75-100. Supplement recommended.\n\n11. CK: 344 U/L (range 40-320). Marginally above. Almost certainly exercise-related given 3x weekly resistance training.\n\nREASSURING NEGATIVES: Liver function entirely normal (ALT 25, GGT 18, FIB-4 1.12). Iron studies normal, ruling out iron deficiency and iron overload. PSA 0.73, CEA 0.65, CA 19-9 1.95, all normal. Thyroid antibodies both negative. Coeliac screen negative. Immunoglobulins balanced. Rheumatoid factor negative. No proteinuria. No glycosuria. No ketonuria. HOMA-IR confirms insulin sensitivity.","recommendations":"1. Book a GP appointment to discuss the full blood count pattern and request a haemoglobin electrophoresis test to confirm or exclude thalassaemia trait.\n\n2. Ask the GP to record the Lp(a) result of 171.94 nmol/L in permanent medical notes and consider testing first-degree relatives.\n\n3. Discuss the elevated lipase of 176 with the GP and arrange a repeat test in 4 to 6 weeks.\n\n4. Repeat a midstream urine sample with boric acid preservation to reassess the microscopic haematuria finding.\n\n5. Target a calorie intake of 2,200 to 2,400 per day with a protein floor of 125 to 155 grams per day to support fat loss while preserving muscle.\n\n6. Aim for a body weight target of 84 to 88 kg over the next 6 to 9 months, representing a loss of approximately 8 to 12 kg of body fat.\n\n7. Improve diet quality from 6 towards 8 out of 10 by increasing lean protein, vegetables, legumes, and whole grains while reducing processed and refined foods.\n\n8. Include oily fish at least twice per week for omega-3 intake and Lp(a) risk mitigation.\n\n9. Ensure at least two of three weekly cardio sessions are sustained zone 2 efforts of 30 to 60 minutes.\n\n10. Push daily step count consistently towards 10,000 or above.\n\n11. Implement a fixed sleep routine: consistent wake time, morning daylight exposure, caffeine cut-off at midday, cool bedroom, screen-free wind-down.\n\n12. Supplement with vitamin D3, magnesium glycinate, and omega-3 as detailed in the supplementation section.\n\n13. Repeat thyroid function (TSH and FT4) in 6 months.\n\n14. Repeat kidney markers (creatinine, Cystatin C, eGFR, and urine ACR) in 12 months.\n\n15. Stay well hydrated with at least 2.5 to 3 litres of water daily, particularly around training sessions.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with a meal containing fat to aid absorption. Alexandro's level is 57 nmol/L, which is sufficient but below the optimal range of 75 to 100 nmol/L associated with the best long-term outcomes for immune function, bone health, mood, and muscle recovery. At BMI 28.7, slightly higher dosing is appropriate as adipose tissue sequesters vitamin D and reduces its bioavailability. This should be taken year-round at UK latitudes.\n\nVitamin K2 (MK-7): 100 micrograms daily, taken alongside the vitamin D3. Vitamin K2 directs calcium into bones and teeth and away from soft tissues and arteries. It should always accompany vitamin D supplementation, particularly given Alexandro's elevated Lp(a) and the importance of maintaining arterial health.\n\nMagnesium glycinate: 400 mg before bed. Magnesium supports over 300 enzymatic reactions in the body including muscle relaxation, nervous system regulation, and sleep quality. The glycinate form is well absorbed and has a calming effect that supports sleep onset. Given Alexandro's reported poor sleep, this is one of the more immediately impactful supplements he can add. His serum magnesium at 1.05 is within range, but serum levels do not reliably reflect intracellular magnesium status, and most active individuals benefit from supplementation.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. While Alexandro's triglycerides and HDL are already excellent, omega-3 fatty acids provide anti-inflammatory benefits that are particularly valuable given his elevated Lp(a). Lp(a) promotes inflammation in the arterial wall, and omega-3s help counterbalance this effect. They also support joint health, which is relevant for his training volume, and may support mood and sleep.\n\nVitamin B12 (sublingual methylcobalamin): 1,000 micrograms daily, dissolved under the tongue. His B12 at 379 pg/mL is within the laboratory range but below the optimal threshold of around 500 associated with the best neurological and energy outcomes. Sublingual methylcobalamin bypasses the digestive system and is the most bioavailable form. This may help with his reported low energy.\n\nThe most important changes from this report are not supplements. They are reducing body fat through a sustained, moderate calorie deficit with adequate protein, improving sleep quality through consistent habits, and having the GP conversation about the blood count pattern, Lp(a), and lipase. These actions will have a far greater impact on Alexandro's energy, body composition, testosterone, and long-term health than any supplement can achieve.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"mmol/l","description":"Blood glucose measures the concentration of sugar in the blood at the time the sample was taken. It is the body's primary fuel source and is tightly regulated by insulin. Alexandro's fasting glucose of 5.1 mmol/L sits comfortably within the healthy range and well within the optimal zone of 4.0 to 5.5. This means his body is maintaining blood sugar control effectively, and combined with his excellent insulin sensitivity shown by his HOMA-IR, this is a very reassuring result.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, excessive exercise without adequate fuelling","high_causes":"Insulin resistance, type 2 diabetes, stress, infection, high carbohydrate meal prior to testing, medications such as corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin molecules in the blood that have been glycated, or coated with glucose, over the preceding two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. Alexandro's HbA1c of 5.3% is well within the normal range of below 6.0% and comfortably below the pre-diabetic threshold. This confirms excellent blood sugar management over the past several months.","low_causes":"Conditions causing rapid red cell turnover such as haemolytic anaemia, significant blood loss, thalassaemia trait (which may shorten red cell lifespan and lower HbA1c independently of glucose control)","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, persistently elevated blood sugar from dietary or metabolic causes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"38","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. Alexandro's result of 35 mmol/mol is well below the pre-diabetic threshold of 42 and confirms healthy long-term blood sugar control. It is worth noting that if thalassaemia trait is confirmed, HbA1c can be slightly underestimated because the altered haemoglobin may have a shorter lifespan, meaning glucose has less time to attach to it. Even accounting for this, the result is reassuringly normal.","low_causes":"Rapid red cell turnover, haemolytic conditions, significant blood loss, haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, chronically elevated blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2387","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4444","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. Alexandro's fasting insulin of 2.11 mIU/L is below the laboratory lower limit of 2.6, but this is not a cause for concern. When fasting glucose and HbA1c are both perfectly normal, a low insulin level means the body needs very little insulin to maintain healthy blood sugar. This reflects excellent insulin sensitivity, which is a positive metabolic finding. The pancreas is simply not being asked to work hard because the tissues respond efficiently to the small amount of insulin it produces.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, lean body composition, prolonged fasting prior to test","high_causes":"Insulin resistance, metabolic syndrome, excess body fat particularly visceral, high refined carbohydrate diet, polycystic ovarian syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"212.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1828","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5155","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is a reliable marker of how much insulin the body is producing because, unlike insulin itself, it is not cleared by the liver. Alexandro's C-Peptide of 212.4 pmol/L (converted from 0.642 ug/L) is below the laboratory range of 364 to 1,456 pmol/L. As with his low insulin, this reflects that his pancreas is producing only modest amounts of insulin because his tissues are responding efficiently. In the context of normal glucose and normal HbA1c, this is a marker of metabolic health rather than pancreatic insufficiency.","low_causes":"Excellent insulin sensitivity, low carbohydrate intake, lean metabolism, type 1 diabetes (in which case glucose would be elevated)","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney impairment reducing clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.48","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.1600","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is a calculated score that estimates how resistant the body's cells are to insulin. It combines fasting glucose and fasting insulin. A score below 1.0 indicates insulin sensitivity, which is the optimal state. Alexandro's HOMA-IR of 0.48 confirms he is highly insulin sensitive. At BMI 28.7, this is a particularly positive finding, as insulin resistance often begins to develop at this BMI range. His body is managing blood sugar efficiently with minimal insulin output.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, regular exercise, favourable genetics","high_causes":"Excess body fat, sedentary lifestyle, high refined carbohydrate diet, chronic stress, poor sleep, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"26.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1100","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, which are responsible for producing insulin. The calculation uses fasting insulin and glucose in the formula (20 x insulin) / (glucose - 3.5). Alexandro's HOMA-B calculates to 26.4, which is below the standard range of 80 to 200. However, this must be interpreted alongside his glucose and HbA1c, both of which are normal. The formula produces a low number when insulin is very low and the glucose denominator (5.1 minus 3.5 = 1.6) is small. This reflects low insulin demand rather than failing beta cells. If the pancreas were genuinely underperforming, blood sugar would be rising, and it is not.","low_causes":"Excellent insulin sensitivity requiring minimal insulin output, low carbohydrate diet, early beta cell decline (only if glucose is also rising)","high_causes":"Insulin resistance requiring high insulin output, early compensatory phase of type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2232","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream and the level rises. Alexandro's ALT of 25 is well within both the laboratory range and the optimal range, indicating his liver cells are healthy and not under any metabolic strain.","low_causes":"Normal finding, vitamin B6 deficiency (rare cause of falsely low ALT)","high_causes":"Fatty liver disease, excessive alcohol, medications, viral hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5156","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6042","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It is less specific to the liver than ALT because muscle damage and exercise can also elevate it. Alexandro's AST of 34 is within range and consistent with his active training schedule. The AST-to-ALT ratio of approximately 1.4 is normal and does not raise any concerns.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver damage, heart muscle damage, skeletal muscle damage from exercise, excessive alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1233","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5113","units":"IU/l","description":"Gamma GT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct obstruction, and metabolic stress on the liver. It is often the first liver enzyme to rise when the liver is under strain. Alexandro's GGT of 18 is excellent, sitting in the lower portion of the range and well within optimal bounds. This is a reassuring marker of liver health.","low_causes":"Normal finding","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and digestive system. It is involved in bile duct function and bone metabolism. Alexandro's ALP of 88 is within range and does not suggest any biliary or bone abnormality.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, malnutrition","high_causes":"Bile duct obstruction, bone disorders, liver disease, vitamin D deficiency, growing bones in younger individuals","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the body breaks down old red blood cells. The liver processes bilirubin and excretes it in bile. Elevated bilirubin can indicate liver dysfunction or accelerated red cell breakdown. Alexandro's bilirubin of 11 is within the healthy range, indicating normal red cell turnover and healthy liver processing.","low_causes":"Normal finding, certain medications","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome (a benign inherited condition)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined levels of albumin and globulin in the blood. It reflects nutritional status, liver synthetic function, and immune system activity. Alexandro's total protein of 75 is within the optimal range, indicating good nutritional intake and healthy liver and immune function.","low_causes":"Malnutrition, liver disease, kidney disease causing protein loss, malabsorption","high_causes":"Chronic inflammation, chronic infection, dehydration, immune system disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood and is produced by the liver. It transports hormones, vitamins, and medications, and maintains the fluid balance between blood vessels and tissues. Alexandro's albumin of 44 is within the optimal range, confirming good liver synthetic function and adequate nutritional status.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/l","description":"Globulin encompasses a group of proteins in the blood that include antibodies (immunoglobulins), transport proteins, and clotting factors. The level reflects immune system activity and liver function. Alexandro's globulin of 31 is within optimal range, consistent with a healthy and balanced immune system.","low_causes":"Immune deficiency, liver disease, kidney disease causing protein loss","high_causes":"Chronic infection, chronic inflammation, autoimmune conditions, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio is calculated by dividing albumin by globulin. It provides a quick assessment of the balance between these two protein groups. A ratio within the healthy range suggests the liver is producing albumin adequately and the immune system is not overactive. Alexandro's A/G ratio of 1.42 is well balanced.","low_causes":"Low albumin from liver disease or malnutrition, elevated globulin from chronic inflammation or infection","high_causes":"Very low globulin from immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3862","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the degree of liver fibrosis, or scarring, using age, platelet count, ALT, and AST. A score below 1.3 in people under 65 suggests a low risk of significant liver fibrosis. Alexandro's FIB-4 of 1.12 is comfortably below this threshold, confirming no evidence of liver scarring.","low_causes":"Young age, healthy liver, high platelet count","high_causes":"Liver fibrosis, age over 65, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"121","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7045","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands. It breaks down starches into simpler sugars. Elevated amylase can indicate pancreatic inflammation, salivary gland issues, or other conditions. Alexandro's amylase of 121 is marginally above the upper limit of 118. In isolation, this small elevation is not alarming, but it is more significant when viewed alongside his lipase result, which is also elevated. The combination warrants follow-up with his GP.","low_causes":"Chronic pancreatitis with pancreatic insufficiency, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney impairment reducing clearance, macroamylasaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"176","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9787","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6120","units":"U/L","description":"Lipase is a digestive enzyme produced almost exclusively by the pancreas. It breaks down dietary fats. Because it is more specific to the pancreas than amylase, elevated lipase is a more reliable indicator of pancreatic issues. Alexandro's lipase of 176 is nearly three times the upper limit of 60. In acute pancreatitis, lipase typically rises to five or more times the upper limit, so this does not suggest an acute episode. However, a persistent elevation at this level can indicate chronic low-grade pancreatic inflammation, a pancreatic duct variation, or macrolipasaemia, a benign condition where lipase binds to immunoglobulins and is cleared slowly. This should be repeated in four to six weeks, and if it remains elevated, his GP may consider abdominal imaging.","low_causes":"Normal finding, chronic pancreatic insufficiency","high_causes":"Pancreatitis (acute or chronic), pancreatic duct obstruction, kidney impairment, macrolipasaemia, bowel obstruction, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4247","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL, LDL, and VLDL fractions. On its own it is a blunt measure, because it does not distinguish between protective HDL and potentially harmful LDL. Alexandro's total cholesterol of 4.4 is below the desirable threshold of 5.18 and is a healthy result, particularly when broken down into its components, which show a strong HDL and a well-controlled LDL.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption, genetic factors","high_causes":"High saturated fat diet, obesity, hypothyroidism, familial hypercholesterolaemia, kidney disease, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3471","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3529","units":"mmol/l","description":"Triglycerides are the most common form of fat in the blood. They are produced from dietary fats and excess carbohydrates and are stored in fat cells as an energy reserve. High triglycerides are strongly associated with insulin resistance, excess refined carbohydrate intake, and cardiovascular risk. Alexandro's triglycerides of 1.18 are within the optimal range, reflecting good dietary quality and healthy insulin sensitivity.","low_causes":"Low fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High carbohydrate or sugar intake, excess alcohol, obesity, insulin resistance, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3462","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, is produced by the liver and carries triglycerides to tissues throughout the body. It is a precursor to LDL cholesterol. Alexandro's VLDL of 0.54 is within the optimal range, consistent with his healthy triglyceride level and good insulin sensitivity.","low_causes":"Low fat diet, malabsorption","high_causes":"Excess carbohydrate or alcohol intake, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.55","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7452","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL, or high-density lipoprotein, is often called 'good cholesterol' because it transports cholesterol away from artery walls and back to the liver for disposal. Higher HDL levels are protective against cardiovascular disease. Alexandro's HDL of 1.6 is above the desirable threshold of 1.55, indicating good reverse cholesterol transport. This is a strong protective factor, especially important given his elevated Lp(a), as it means his body is actively clearing cholesterol from the arteries.","low_causes":"Smoking, obesity, sedentary lifestyle, high refined carbohydrate diet, insulin resistance, certain medications","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, high monounsaturated fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4547","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, or low-density lipoprotein, carries cholesterol from the liver to the tissues and, if present in excess, deposits it in artery walls where it can form plaques. It is considered the primary driver of atherosclerosis. Alexandro's LDL of 2.31 is within both the laboratory and optimal ranges. For a man with elevated Lp(a), maintaining LDL at or below this level is particularly important, as Lp(a) adds to the total atherogenic particle burden.","low_causes":"Hyperthyroidism, liver disease, malabsorption, malnutrition, genetic factors","high_causes":"High saturated fat diet, obesity, hypothyroidism, familial hypercholesterolaemia, sedentary lifestyle, genetic factors","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3056","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk by balancing total cholesterol against the protective HDL fraction. A lower ratio is better. Alexandro's ratio of 2.75 is well within the desirable range of below 4.5 and in the optimal zone, reflecting a healthy balance between total and protective cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, elevated total cholesterol, poor diet, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"36.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6060","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"HDL as a percentage of total cholesterol shows what proportion of the total cholesterol is the protective HDL fraction. A higher percentage is better. Alexandro's HDL percentage of 36.36% is excellent, well above the minimum of 20%, meaning more than a third of his circulating cholesterol is the protective type.","low_causes":"Low HDL, elevated total cholesterol","high_causes":"High HDL from exercise, genetic factors, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions, including LDL, VLDL, and remnant particles, in a single number. Alexandro's non-HDL of 2.8 is well below the target of 4 and within the optimal range, confirming a low atherogenic cholesterol burden from modifiable sources.","low_causes":"Low LDL, low triglycerides, hyperthyroidism","high_causes":"Elevated LDL, elevated triglycerides, obesity, high saturated fat diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6333","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 is the primary protein component of HDL particles. It is directly involved in reverse cholesterol transport, the process by which cholesterol is removed from artery walls and returned to the liver. A higher ApoA1 level is protective. Alexandro's ApoA1 of 1.52 is above the desirable minimum of 1.2 and within the optimal range, supporting his strong HDL-mediated cardiovascular protection.","low_causes":"Smoking, sedentary lifestyle, obesity, insulin resistance, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, the ApoB level gives a direct count of the total number of particles that can deposit cholesterol in artery walls. It is widely considered a better predictor of cardiovascular risk than LDL cholesterol alone. Alexandro's ApoB of 0.69 is well below the desirable target of 0.9, which is excellent. This means the number of atherogenic particles in his blood is low, and his risk from mod
