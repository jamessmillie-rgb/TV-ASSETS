const REPORT_DATA = {"patient_name":"Srinivasapakshirajan Parthasarathy","dob":"15/10/1985","report_date":"2026-10-29","summary":"Customer is a 41-year-old South Asian male presenting with a BMI of 28.5, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food daily; portions are small or he often skips meals (volume 2 out of 10). He trains three times per week (one cardio, two resistance) at moderate intensity with 5,000 to 7,500 daily steps. He sleeps under six hours a night, feels exhausted or is waking in the night, and his energy is low all day. Stress feels hard to manage constantly. He drinks 1 to 4 alcoholic drinks per week and reports overuse of caffeine or energy drinks. He takes atorvastatin 20 mg for high cholesterol, started six to eight months ago. He supplements with creatine, protein powder, vitamin D (recently started 4,000 IU spray), and takes multivitamins, magnesium and B12 intermittently. His family history includes heart attack or stroke before the age of 60. He has not had blood tests before. He reports low energy and fatigue, bloating and digestive discomfort, weight gain and difficulty losing weight, and hair thinning or hair loss. His goals are to improve energy levels, improve digestion and gut health, and lose body fat. He reports body fat at 31.3% with excess android fat around the abdomen, wants to know whether he is lactose, dairy or gluten intolerant, and describes poor energy throughout the day.\n\nThe finding that deserves attention first is his kidney function. Cystatin C, a protein filtered by the kidneys that gives a more reliable estimate of how well they are working than the standard creatinine calculation, is 1.12, above the upper limit of 1.1. The eGFR calculated from cystatin C is 70, and the combined creatinine and cystatin C eGFR is also 70. At 41, kidney filtration should comfortably sit above 90. An eGFR of 70 is not dangerous, but it is lower than expected for his age and it should be discussed with his GP. His creatinine is 123, above the upper reference limit of 104, and while creatinine can be pushed up by creatine supplementation (which he takes) and by muscle mass, the fact that cystatin C, which is not affected by muscle or creatine, is also raised makes it less likely that the creatinine is simply a supplement artefact. His urea at 5.1 is normal, his electrolytes are balanced, and his urine is completely clean with no protein, no blood, no casts and no bacteria. This is reassuring because it means the kidneys are structurally healthy and there is no sign of damage or inflammation. The urea to creatinine ratio at 41.5 is at the floor of its reference range, consistent with the creatinine being relatively high for the urea level. His uric acid at 487 is within the laboratory range but above the optimal ceiling of 380. Uric acid is a waste product of purine metabolism, and at this level, combined with the reduced eGFR, it is worth the GP checking whether it is contributing to any joint symptoms and whether it needs managing. His potassium is 5.7, above the upper limit of 5.3. Potassium at this level can reflect true elevation or can occasionally be transiently elevated, but given the reduced eGFR, it is worth a routine repeat with his GP to confirm it. The GP conversation should cover the cystatin C result, the eGFR of 70, the creatinine, the potassium and the uric acid together as a kidney picture.\n\nThere is a great deal of good news in this report. His lipid profile on atorvastatin is excellent. Total cholesterol is 4.0, LDL cholesterol (the form that deposits in artery walls) is 2.42, ApoB (apolipoprotein B, the most accurate count of the particles that drive plaque formation) is 0.73, comfortably below the 0.9 threshold and below the ideal 0.8 target. His Lp(a), a genetically inherited lipoprotein that adds cardiovascular risk and cannot be changed by diet or medication, is 27.2, below the 32 threshold, which is genuinely useful information given his family history of early heart attack or stroke: it means his inherited risk from this pathway is low and the statin is addressing the modifiable risk effectively. His Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) to show what is truly modifiable, is 2.33. His triglycerides at 1.39 are within the laboratory range, his VLDL at 0.63 is within range, and his non-HDL cholesterol at 3.0 is within range. The atherogenic index of plasma at 0.143 is within range, and his ApoB to ApoA1 ratio at 0.62 is below the 0.7 threshold. His cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 30 out of 100, within the acceptable range of under 40 but above the ideal of under 20, driven primarily by his HDL being low and his hsCRP being above optimal. His PhenoAge, a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 39.9 against a calendar age of 41, meaning his blood markers suggest he is ageing roughly a year younger than his birthday, which is a positive finding. His liver is in good health. ALT at 35 is above the optimal ceiling of 30 but within the reference range, AST at 17 is well within range, GGT (gamma-glutamyl transferase, a liver enzyme sensitive to alcohol, fat and medication) at 41 is within the male range of 4 to 73 but above the optimal ceiling of 25, albumin at 44 is healthy, bilirubin at 18 is within range, and the FIB-4 score (a fibrosis screening index) at 0.45 is well below the 1.45 threshold, meaning there is no sign of liver scarring. The APRI score at 0.162 and NAFLD fibrosis score at minus 3.308 both confirm no evidence of significant liver disease. The De Ritis ratio (AST divided by ALT) at 0.49 is below the lower reference of 0.6, which simply reflects the ALT being relatively higher than the AST; in the context of clean liver markers, this is not a concern. His pancreatic enzymes, amylase at 103 and lipase at 51, are both within range, which is relevant given his bloating symptoms because it confirms the pancreas is producing enzymes normally. His thyroid is working well. TSH (thyroid stimulating hormone, the brain's signal to the thyroid) at 1.85 is within the optimal range of 1.0 to 2.5. Free T3 at 5.2, the active thyroid hormone, is within the optimal band of 4.5 to 6.5. Free T4 at 21.7 is within the laboratory range but sits above the optimal ceiling of 20, which at this margin simply means the thyroid is producing generously; with TSH sitting comfortably in range, this is not a concern. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. The FT3 to FT4 ratio at 0.24 is within the reference range but below the optimal band of 0.27 to 0.40, meaning conversion from T4 to the active T3 is at the lower end; this is not driving symptoms given the T3 itself is in the ideal range, but optimising selenium intake can support conversion. His blood sugar control is reassuring. Fasting glucose at 5.1 is within the optimal range. HbA1c (glycated haemoglobin, a three-month average of blood sugar) at 39 mmol/mol, which is 5.7%, is within the normal range of under 42. Insulin at 6.54 is within the optimal range of 2 to 8, and HOMA-IR (a calculation combining glucose and insulin that estimates insulin resistance) at 1.48 is within the reference range of 0.5 to 1.5. C-peptide at 1.44 is within range. The estimated average glucose at 6.5 is within the reference range, and the TyG index at 8.64 is within range. This is a genuinely positive set of results given his BMI of 28.5, South Asian ethnicity (which carries higher metabolic risk at lower BMIs), daily sugar intake and family history of cardiovascular disease: his pancreas is not being overworked and there is no sign of insulin resistance. His prostate markers are clean. PSA at 0.68 is well below the 2.5 threshold, free PSA ratio at 0.676 is normal, and CEA and CA19-9 tumour markers are both well within range. His cortisol at 336 is within the expected morning range. His hormonal axis is intact: LH at 5.57, FSH at 6.11, prolactin at 86 and DHEA-S at 4.1 umol/L are all within range. His immune system shows healthy immunoglobulin levels with IgG at 13.5, IgM at 0.9 and IgA at 1.2 all within range, and his rheumatoid factor is negative. His coeliac screen, tissue transglutaminase IgA, is negative at 0.326, which rules out coeliac disease as a cause of his bloating while he remains on a gluten-containing diet. His ESR (erythrocyte sedimentation rate, a marker of inflammation) at 4 is low, and his platelet to lymphocyte ratio at 120.7 is within the optimal range. His calcium, corrected calcium, phosphate and parathyroid hormone are all within range, confirming healthy bone metabolism. His creatine kinase at 168 is within range, consistent with his resistance training. His urine is completely clear across all parameters.\n\nTurning to the areas that need attention. His HDL cholesterol (high-density lipoprotein, the particle that carries cholesterol away from artery walls back to the liver) is 1.0, which the laboratory has flagged but which falls just below the desirable threshold of 1.04 and well below the ideal of 1.4 for a male. ApoA1, the protein that builds HDL particles, is 1.17, just below the 1.20 target. Low HDL is the most common lipid finding in South Asian men and is driven by a combination of genetics, central adiposity, low activity volume, and diet quality. His triglycerides at 1.39, while within the laboratory range, are above the optimal ceiling of 1.0 and his triglyceride to HDL ratio at 1.39 is above the optimal of 0.87 and approaching the upper reference of 1.5. He mentions that his triglycerides have historically been off the chart, so the current level represents an improvement, but the combination of low HDL and above-optimal triglycerides is the lipid pattern most strongly associated with central abdominal fat, which aligns exactly with his report of 31.3% body fat with excess android distribution. The statin has done its job on LDL and ApoB; the remaining cardiovascular work is raising HDL and lowering triglycerides further, and those respond to exercise volume, omega-3, reducing sugar and refined carbohydrate, and losing abdominal fat.\n\nHis hs-CRP (high-sensitivity C-reactive protein, a marker of systemic inflammation) is 2.1. While this is within the laboratory range of under 5, optimal is below 1.0, and above 2.0 is associated with higher cardiovascular risk. At BMI 28.5 with central adiposity, daily sugar, low vegetable intake and poor sleep, low-grade inflammation is expected. Reducing this is within his control through the same changes that will address his triglycerides and HDL.\n\nHis testosterone is 11, within the laboratory range of 8.4 to 28.7 but below the recommended level of 12 and below the optimal floor of 18. Free testosterone at 0.241 is within range, and bioavailable testosterone at 5.76 is within range but at the lower end. SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable to tissues) at 27 is within range. At 41 with a BMI of 28.5, poor sleep, high stress, low calorie intake with meal skipping, and central adiposity, below-optimal testosterone is expected because all of those factors suppress it. Testosterone is relevant to his symptoms of fatigue, difficulty losing fat, and hair thinning. His oestradiol at 119 is within range but at the higher end, and the combination of lower testosterone with higher-end oestradiol is consistent with excess adipose tissue, which converts testosterone to oestradiol via an enzyme called aromatase. The most effective way to improve testosterone is to lose abdominal fat, improve sleep, reduce stress, and eat enough protein and calories consistently rather than skipping meals.\n\nHis IgE (immunoglobulin E, the antibody class involved in allergic responses) is 120, above the upper limit of 100. This is a non-specific marker, meaning it tells us his immune system is mounting an allergic-type response to something, but it does not tell us what. In the context of his eosinophils at 0.51, which are also marginally above the upper limit of 0.50, the two together support an allergic or atopic tendency. Eosinophils are white blood cells that increase in allergic conditions, parasitic infections and certain gut conditions. Given his prominent bloating symptoms, it is worth his GP considering whether a food allergy panel, hydrogen breath test for lactose intolerance, or referral for further investigation would be appropriate. The coeliac screen is negative, which rules out coeliac disease, but does not rule out non-coeliac gluten sensitivity or lactose intolerance, neither of which has a reliable blood marker.\n\nHis ferritin (the body's iron store) at 37 is within the laboratory range of 22 to 322 but below the optimal floor of 50. Transferrin saturation at 20.43% is within the laboratory range but below the optimal floor of 25%. Serum iron at 15.7 and transferrin at 3.06 are both within range. This is not iron deficiency, but iron stores are below optimal, and at this level, combined with poor sleep and low energy, topping them up with a gentle iron supplement alongside vitamin C would be reasonable. His vitamin D at 56 is sufficient by the laboratory definition of above 50 but below the optimal range of 75 to 120. Given his South Asian skin (which produces less vitamin D from sunlight), his BMI of 28.5 (adipose tissue sequesters vitamin D), and the fact that he has only recently started supplementing with 4,000 IU, this level will likely improve over the coming months, but he should maintain the 4,000 IU dose through winter and retest in spring. His B12 at 565 is within the optimal range of 500 to 900, and folate at 9 is above the optimal floor of 8, both reassuring given intermittent supplementation. His magnesium at 0.81 is within the laboratory range but below the optimal floor of 0.85, which is relevant to his sleep quality and stress levels because magnesium supports both. His total antioxidant activity at 2.19 is above the upper reference of 1.77, which is a positive finding and likely reflects his supplementation.\n\nHis red blood cell count at 5.94 is above the upper limit of 5.5, and his absolute reticulocyte count (young red blood cells being released from the bone marrow) at 137.8 is above the upper limit of 100. His reticulocyte percentage at 2.32 is within range. The elevated RBC with elevated absolute reticulocytes suggests the bone marrow is actively producing red blood cells at a higher rate. His haemoglobin at 167 is within range but near the upper limit of 170, and his haematocrit at 0.476 is within range. His MCV (mean cell volume, the size of each red blood cell) at 80.2 is below the lower limit of 83, and his MCHC (mean cell haemoglobin concentration) at 351 is above the upper limit of 345. A low MCV with below-optimal iron stores is a pattern that can be seen with early iron-limited production, where the body makes more cells but each one is slightly smaller because iron is not abundant. In South Asian individuals, this pattern also raises the possibility of a thalassaemia trait, a common inherited condition where the body makes slightly smaller red blood cells but compensates by making more of them. The Mentzer index at 13.5 is above 13, which makes thalassaemia trait less likely than iron-limited production, but the combination of low MCV, high RBC count, borderline ferritin and South Asian ethnicity means his GP should consider a haemoglobin electrophoresis to check. This is not urgent and is not a disease; thalassaemia trait is a carrier state that is useful to know about for future family planning and for correctly interpreting iron studies.\n\nHis serum osmolality at 290.2 is within the optimal range, and his corrected anion gap at 17.8 and albumin-corrected anion gap are within range, confirming normal acid-base balance. The systemic immune-inflammation index at 625 is marginally above the upper reference of 600; however, all three of its inputs, platelets, neutrophils and lymphocytes, are individually within their optimal ranges, so this marginal elevation is not clinically meaningful. His normal insulin and glucose confirm adequate pancreatic function.\n\nHis progesterone at 1.39 is within the male reference range and is not a concern. His MCHC at 351, marginally above the upper limit of 345, is a minor finding that at this margin is often a minor laboratory variation rather than a clinical issue.\n\nLooking at his three main concerns together: his bloating has been investigated as far as blood tests can go. Coeliac disease is ruled out, pancreatic enzyme production is normal, liver function is healthy, and there is no inflammatory bowel marker in the standard panel. The raised IgE and eosinophils suggest an allergic tendency that could include food sensitivity, and his GP should consider a hydrogen breath test for lactose intolerance and potentially a trial elimination of dairy. His low energy is multifactorial: under six hours of sleep with exhaustion on waking, constant stress, very low food volume with meal skipping (volume 2 out of 10), daily sugar which will cause energy crashes, overuse of caffeine which disrupts sleep architecture, below-optimal testosterone, below-optimal ferritin, below-optimal vitamin D, and below-optimal magnesium. None of these alone would cause crushing fatigue, but together they create a state where the body has neither the fuel nor the recovery it needs. His difficulty losing weight despite eating little is explained by the same pattern: very low and inconsistent calorie intake signals to the body that food is scarce, which lowers metabolic rate, suppresses testosterone, and promotes fat storage, particularly around the abdomen. The answer is not to eat less; it is to eat more consistently, with higher protein, more vegetables, less sugar, and adequate sleep.","links":"The thread running through this report is a body under chronic stress that is not receiving the building blocks it needs. The combination of under six hours of sleep, constant psychological stress, very low food volume with meal skipping, daily sugar, minimal vegetable intake, and heavy caffeine use creates a metabolic environment that promotes central fat storage, suppresses testosterone, maintains low-grade inflammation, and leaves the immune system slightly dysregulated.\n\nThe lipid picture tells a story of successful medical intervention sitting alongside unresolved lifestyle drivers. Atorvastatin has brought LDL and ApoB to excellent levels, and his Lp(a) being low means the inherited component of his cardiovascular risk is minimal, which is reassuring given his family history of early heart attack or stroke. The remaining lipid risk sits entirely in the low HDL and above-optimal triglycerides, which are the fractions that respond to exercise, diet quality, sugar reduction and fat loss rather than to statins. His cardiovascular risk score of 30 out of 100 reflects this: the statin has done the heavy lifting on particle count, but the metabolic and inflammatory components are holding the score above the ideal of 20.\n\nThe kidney findings are the most important to clarify. His creatinine at 123 could be partly explained by creatine supplementation, which raises creatinine by adding to the pool of creatine that is broken down into creatinine. However, cystatin C at 1.12, which is completely independent of muscle and supplementation, is also above range, and the cystatin C eGFR of 70 confirms that filtration is genuinely reduced. This does not mean kidney disease is present, but it means the GP needs to establish a baseline, check blood pressure if not already monitored, and consider whether the combination of atorvastatin, creatine supplementation, and the raised uric acid at 487 is relevant. The potassium at 5.7, if confirmed on a repeat sample, would also be relevant to the kidney picture. South Asian ethnicity carries a higher baseline risk for kidney disease and for gout, making these findings worth tracking.\n\nThe red blood cell picture ties into the iron status. Ferritin at 37, while technically within range, is below optimal, and transferrin saturation at 20.43% is at the lower end. The bone marrow is compensating by producing more red blood cells (RBC 5.94, reticulocytes 137.8), but each cell is smaller than ideal (MCV 80.2). In a South Asian male, this pattern has two possible explanations: early iron-limited production from low dietary iron intake, or thalassaemia trait, a benign inherited condition. A haemoglobin electrophoresis will distinguish between the two, and the answer changes whether iron supplementation is appropriate long-term.\n\nThe bloating and digestive discomfort cannot be fully answered by blood tests. What has been excluded is important: coeliac disease (tTG negative), pancreatic insufficiency (amylase and lipase normal), liver disease (all markers clean), and inflammatory markers are not significantly raised. The raised IgE and eosinophils point toward an allergic or atopic tendency, and in the context of prominent bloating, the next step is functional testing: a hydrogen breath test for lactose intolerance, and potentially a supervised elimination trial of dairy. Non-coeliac gluten sensitivity has no reliable blood test and can only be assessed by elimination and rechallenge.\n\nThe fatigue is the symptom with the most contributing factors, and importantly, no single dramatic cause. The thyroid is working well, blood sugar control is good, there is no anaemia, B12 and folate are adequate, and cortisol is within the expected range. What the bloods do show is a collection of sub-optimal findings, each of which chips away at energy: below-optimal ferritin, below-optimal vitamin D, below-optimal magnesium, below-optimal testosterone, and raised inflammatory markers. What the bloods cannot measure but the quiz clearly describes is the rest of the picture: chronic sleep deprivation under six hours, constant stress, caffeine overuse disrupting sleep quality, and a diet that is both too small in volume and too high in sugar. Addressing the sleep and the diet will do more for energy than any supplement.","lifestyle":"Eat three meals a day, every day, even when you do not feel hungry. Start with breakfast within an hour of waking, built around protein (eggs, Greek yoghurt, or a shake with your protein powder). Anchor: alarm goes off, breakfast follows. Why: your food volume is 2 out of 10 and your body is in conservation mode, which suppresses testosterone, promotes fat storage around the abdomen, and leaves you exhausted.\nAdd a palm-sized portion of protein to every meal: chicken, fish, eggs, lentils, Greek yoghurt, tofu. Aim for at least 103 to 126 grams of protein per day spread across three meals. Anchor: protein goes on the plate before anything else. Why: protein supports muscle, raises metabolic rate, keeps you full, and your testosterone at 11 needs the building blocks that come from consistent protein intake.\nAdd at least three portions of vegetables or fruit a day, working up to five. One portion with each meal. Start with whatever you will actually eat: spinach in eggs, a banana with breakfast, a side salad with lunch. Anchor: one portion per meal, non-negotiable. Why: you are eating 0 to 1 portions a day, which means almost no fibre reaching your gut, and fibre is the single most important factor for reducing bloating, feeding healthy gut bacteria, and lowering triglycerides.\nReplace daily sugary food and drink with one piece of fruit or a square of dark chocolate. Cut sugary drinks entirely and switch to water, black coffee or herbal tea. Anchor: when you reach for something sweet, the fruit is already there. Why: daily sugar is driving your triglycerides above optimal, feeding the inflammation behind your CRP of 2.1, and causing energy crashes that your caffeine use is masking.\nSet a hard caffeine cut-off at 1pm. No coffee, energy drinks, or caffeinated tea after that time. Anchor: after lunch, switch to water or decaf. Why: caffeine has a half-life of five to six hours, meaning a 3pm coffee is still half-active at 9pm, and you are sleeping under six hours with exhaustion on waking. This is the single easiest change for sleep quality.\nSet a fixed wake time seven days a week and protect at least seven hours in bed. Get outside within 30 minutes of waking for 10 minutes of natural light. Anchor: alarm at the same time every day, shoes on and outside before your phone. Why: your sleep of under six hours with waking in the night is the biggest single driver of your fatigue, your difficulty losing weight, your stress tolerance, and your below-optimal testosterone.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, reduces bloating by stimulating gut motility, and adds to your step count which at 5,000 to 7,500 has room to grow toward 8,000 to 10,000.\nAim for a total daily calorie intake of approximately 1,800 to 2,000 calories to create a moderate deficit from your estimated maintenance of around 2,200 to 2,400 calories (based on BMR of approximately 1,700 calories with a light-to-moderate activity multiplier). A target weight range of 68 to 72 kg would bring your BMI to 24.5 to 26.0 and significantly reduce android fat. Do not drop below 1,800 calories: eating too little is already part of the problem, not the solution.","flags":"Cystatin C 1.12, above the upper limit of 1.1. Cystatin C eGFR 70, combined eGFR 70. Creatinine 123, above the upper limit of 104. At 41, eGFR should be above 90. Creatine supplementation raises creatinine, but cystatin C being independently raised confirms genuinely reduced filtration. GP should establish a baseline, check blood pressure, and consider whether creatine supplementation should be paused. Uric acid at 487 above optimal and potassium at 5.7 above range should be reviewed in the same context.\nPotassium 5.7, above the upper limit of 5.3. Worth a routine repeat with the GP to confirm. If confirmed alongside the reduced eGFR, it may reflect mildly impaired potassium excretion.\nTestosterone 11, below the recommended level of 12 and below the optimal floor of 18. Bioavailable testosterone 5.76 at the lower end of optimal. At 41 with BMI 28.5, poor sleep, constant stress and low food volume, lifestyle factors are the most likely drivers. GP should note the level and retest after lifestyle changes have been implemented for three to six months.\nHDL 1.0, below the desirable threshold of 1.04 and well below the ideal of 1.4 for a male. ApoA1 1.17, below the 1.20 target. Triglycerides 1.39, above the optimal ceiling of 1.0. TG/HDL ratio 1.39, above optimal. This is the residual lipid risk pattern not addressed by atorvastatin, driven by central adiposity, diet quality, sugar intake and low exercise volume.\nhs-CRP 2.1, above the optimal ceiling of 1.0. Associated with increased cardiovascular risk at this level. Driven by central adiposity, daily sugar, low vegetable intake and poor sleep.\nIgE 120, above the upper limit of 100. Eosinophils 0.51, marginally above the upper limit of 0.50. Together these suggest an allergic or atopic tendency. In the context of prominent bloating, the GP should consider a hydrogen breath test for lactose intolerance and potentially a food allergy panel.\nRed blood cell count 5.94, above the upper limit of 5.5. Absolute reticulocytes 137.8, above the upper limit of 100. MCV 80.2, below the lower limit of 83. Ferritin 37, below the optimal floor of 50. Transferrin saturation 20.43%, below the optimal floor of 25%. This pattern in a South Asian male could reflect early iron-limited production or thalassaemia trait. GP should consider haemoglobin electrophoresis.\nVitamin D 56, sufficient but below the optimal range of 75 to 120. South Asian skin and BMI 28.5 both reduce vitamin D status. Currently supplementing 4,000 IU; should maintain this dose through winter.\nMagnesium 0.81, below the optimal floor of 0.85. Relevant to sleep quality and stress.\nReassuring negatives: coeliac screen negative (tTG 0.326), thyroid function optimal with both antibodies negative, blood sugar control and insulin sensitivity excellent (glucose 5.1, HbA1c 39, insulin 6.54, HOMA-IR 1.48), liver health confirmed with FIB-4 0.45 and APRI 0.162, PSA 0.68, tumour markers clean, cortisol within range, immunoglobulins balanced, rheumatoid factor negative, urine fully clear, PhenoAge 39.9 (one year younger than calendar age).","recommendations":"Discuss kidney function with your GP. Bring the cystatin C of 1.12, the combined eGFR of 70, the creatinine of 123, the potassium of 5.7, and the uric acid of 487. Ask for a blood pressure check if not already monitored, and discuss whether pausing creatine supplementation for four to six weeks and retesting creatinine alongside cystatin C would help clarify the picture.\nAsk the GP to repeat potassium to confirm whether the elevation is sustained.\nDiscuss the bloating with your GP. The coeliac screen is negative, but request a hydrogen breath test for lactose intolerance and consider a supervised elimination of dairy for two to three weeks to assess the response. If no improvement, a trial elimination of gluten may be worthwhile, guided by your GP.\nMention the raised IgE of 120 and eosinophils of 0.51 to your GP alongside the bloating investigation. Ask whether a food allergy panel or further allergy testing is appropriate.\nMention testosterone of 11, below the recommended 12 and well below optimal. The GP should note this as a baseline. Retest after three to six months of improved sleep, consistent eating, and fat loss to see whether it responds before considering any intervention.\nAsk the GP whether a haemoglobin electrophoresis is appropriate given the combination of low MCV at 80.2, high RBC count at 5.94, South Asian ethnicity, and borderline iron stores.\nRetest in four to six months. Key markers to repeat: cystatin C, creatinine, eGFR, potassium, uric acid, full lipid panel with ApoB, hs-CRP, testosterone, ferritin, transferrin saturation, vitamin D, and a full blood count. Target calorie intake 1,800 to 2,000 calories per day, protein 103 to 126 grams per day, target weight 68 to 72 kg.","supplementation":"Vitamin D3 (cholecalciferol): maintain 4,000 IU daily, taken with your largest meal that contains fat. Pair with vitamin K2 (MK-7) 100 to 200 mcg daily to direct calcium to bone rather than arteries. Why: your level of 56 is sufficient but below the optimal of 75 to 120, and South Asian skin and a BMI of 28.5 both mean you need a higher dose to reach and hold optimal levels. Retest in spring.\nMagnesium glycinate: 300 to 400 mg taken 30 to 60 minutes before bed. Why: your magnesium is 0.81, below the optimal floor of 0.85, and magnesium glycinate specifically supports sleep quality and stress resilience, both of which are critical issues for you.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 raises HDL (yours is 1.0, below ideal), lowers triglycerides (yours are 1.39, above optimal), and reduces inflammation (your CRP is 2.1, above optimal). This is the supplement most likely to move your cardiovascular risk score from 30 toward the ideal of under 20.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily under the tongue, not swallowed. Why: your B12 at 565 is within the optimal range, but you report taking it intermittently. A consistent daily sublingual dose is more reliable than intermittent tablets and will maintain your level as you increase your overall nutrition.\nIron (ferrous bisglycinate): 25 mg every other day, taken with vitamin C (a glass of orange juice or a 200 mg vitamin C tablet) on an empty stomach, away from your statin. Why: your ferritin at 37 is below the optimal floor of 50 and your transferrin saturation at 20.43% is below the optimal floor of 25%. Gentle iron supplementation will support red blood cell quality and energy. However, if the GP proceeds with a haemoglobin electrophoresis and identifies thalassaemia trait, iron supplementation may need to be reassessed, so mention this to your GP before starting.\nDO NOT take high-dose iron supplements without GP guidance. Your ferritin is low but not critically so, and the possibility of thalassaemia trait means the cause of the low MCV needs to be established first.\nContinue creatine supplementation only if the GP is satisfied with kidney function after review. If the GP asks you to pause it for a retest, comply and retest creatinine and cystatin C after four to six weeks off creatine.\nThe most important changes from this report are not supplements. They are eating three consistent meals a day with protein and vegetables, cutting sugar and caffeine after 1pm, sleeping at least seven hours, and losing abdominal fat through a moderate calorie deficit of 1,800 to 2,000 calories with 103 to 126 grams of protein. These will do more for your testosterone, your triglycerides, your HDL, your CRP, your energy and your bloating than any pill.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 64 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 63.7. Weakest systems: vitamins & nutrients 36%, kidney function 39%, electrolytes & minerals 41%. Biggest drags: Creatinine, Potassium, HDL Cholesterol, hs-CRP.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"39.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4337","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is a biological ageing estimate built from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 39.9 against a calendar age of 41, this means the blood markers suggest biological ageing roughly one year younger than the birthday, a positive finding. The main markers keeping this favourable are healthy albumin, glucose and lymphocyte count. The markers that could improve it further are CRP (currently 2.1, ideally below 1.0) and the white cell count (currently 8.68, ideally below 8.0).","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the risk being built in the arteries, not a ten-year event probability. At 30, this is within the acceptable range of under 40 but above the ideal of under 20. The score is being driven by the low HDL of 1.0, the hs-CRP of 2.1, and the above-optimal triglycerides of 1.39. The statin has controlled the ApoB and LDL components effectively; the remaining work is raising HDL, reducing inflammation and lowering triglycerides through diet, exercise and fat loss.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the amount of sugar in the blood at the time of the test. At 5.1, this is within the optimal fasting range of 4.0 to 5.4, meaning the body is managing blood sugar effectively. This is a positive finding given daily sugar intake and a BMI of 28.5.","low_causes":"Fasting, excessive insulin production, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, high carbohydrate intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c expressed as a percentage. At 5.7%, this falls within the normal range of under 6.0% and sits at the boundary of optimal. The mmol/mol value of 39 is the more precise unit and is well within the normal range of under 42.","low_causes":"","high_causes":"Pre-diabetes, diabetes, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4643","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, giving an average of blood sugar control over the past two to three months. At 39, this is within the normal range of under 42 and above the optimal ceiling of 36 but well below the pre-diabetes threshold of 42. Given daily sugar intake, this is a reassuring result that shows the pancreas is managing blood sugar effectively over time.","low_causes":"","high_causes":"Pre-diabetes, diabetes, high sugar intake, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3922","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas to move glucose from the blood into cells for energy. At 6.54, this is within the optimal range of 2 to 8, meaning the pancreas is not working hard to control blood sugar. This is a genuinely positive result at BMI 28.5 with South Asian ethnicity, which carries higher metabolic risk at lower BMIs than other populations.","low_causes":"Low carbohydrate diet, very low calorie intake, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate or sugar diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"1.44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3677","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.3","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3535","upper_optimal_position":"0.4747","units":"ug/L","description":"C-peptide is released by the pancreas in equal amounts to insulin, and because it is not cleared by the liver in the same way, it gives a more stable picture of how much insulin the pancreas is actually producing. At 1.44, this is within the laboratory range and confirms the pancreas is producing an appropriate amount of insulin for the current glucose level. It sits just above the lower end, consistent with the healthy insulin and glucose readings.","low_causes":"Low carbohydrate intake, low insulin demand, type 1 diabetes","high_causes":"Insulin resistance, high insulin production, pancreatic tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6600","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculation that uses fasting glucose and fasting insulin to estimate how sensitive the body's cells are to insulin. A lower number means better sensitivity. At 1.48, this is within the reference range of 0.5 to 1.5 and below the 1.9 early resistance threshold. At BMI 28.5 with South Asian ethnicity and daily sugar intake, this is a reassuring result showing no insulin resistance. It is above the optimal ceiling of 1.0 but within a healthy range.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, high sugar diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"This is the estimated average glucose over the past two to three months, calculated from HbA1c. At 6.5, it is within the reference range of under 7 and above the optimal ceiling of 6.2, consistent with the HbA1c of 39 being above the optimal but within the normal range. Reducing daily sugar intake will bring this value down.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.64","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4909","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The triglyceride-glucose index combines fasting triglycerides and glucose into a single score that estimates insulin resistance from a different angle to HOMA-IR. At 8.64, this is within the reference range of under 8.8 and above the optimal ceiling of 8.5, driven by the triglycerides being above the optimal level of 1.0. The triglyceride component is the lever to improve this.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"20.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3552","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures what percentage of the iron-carrying protein transferrin is actually loaded with iron. At 20.43%, this is within the laboratory range of 18 to 55% but below the optimal floor of 25%. This tells us that while iron is not critically low, the transport system is running below its ideal capacity, consistent with the below-optimal ferritin of 37.","low_causes":"Iron deficiency, chronic disease, poor dietary iron intake, malabsorption","high_causes":"Iron overload, haemochromatosis, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"15.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4027","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5601","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 15.7, this is within the laboratory range and above the optimal floor of 14, though at the lower end of the ideal band. Serum iron fluctuates during the day and with recent meals, so ferritin and transferrin saturation give a more reliable long-term picture.","low_causes":"Iron deficiency, poor dietary intake, blood loss, malabsorption","high_causes":"Iron overload, haemochromatosis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5356","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the blood to where it is needed. At 3.06, this is within the laboratory range and the optimal band. The body produces more transferrin when iron stores are low, trying to capture more iron from the diet; a healthy transferrin level alongside borderline ferritin suggests the body is managing iron transport adequately.","low_causes":"Iron overload, liver disease, chronic inflammation, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"68.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5857","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity measures the total amount of iron that transferrin could carry if fully loaded. At 68.3, this is within the laboratory range and within the optimal band. A higher TIBC can indicate iron deficiency as the body increases its capacity to capture more iron; this level is healthy.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3500","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein. At 37, this is within the laboratory range of 22 to 322 but below the optimal floor of 50 for a male. Iron stores at this level can contribute to fatigue, reduced exercise tolerance and hair thinning, all of which are symptoms reported. Improving dietary iron intake through red meat, lentils, spinach and dark leafy greens, and considering gentle supplementation with vitamin C to aid absorption, should bring this up.","low_causes":"Poor dietary iron intake, blood loss, malabsorption, intense exercise, vegetarian diet","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3861","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including HDL, LDL and VLDL. At 4.0, this is well below the desirable threshold of 5.18, reflecting the effect of atorvastatin. Total cholesterol is less informative than the breakdown into HDL, LDL and ApoB, which are discussed individually.","low_causes":"Statin medication, malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4088","lower_normal":"0","upper_normal":"1.70","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat stored in the body and transported in the blood. At 1.39, this is within the fasting laboratory range of under 1.70 but above the optimal ceiling of 1.0. Given the history of very high triglycerides, the current level represents an improvement, but it remains a target for further reduction. Triglycerides respond strongly to reducing sugar and refined carbohydrate, increasing omega-3 intake, and losing abdominal fat.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar diet, refined carbohydrate intake, alcohol, obesity, insulin resistance, familial hypertriglyceridaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4808","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL cholesterol is the high-density lipoprotein that carries excess cholesterol away from artery walls back to the liver for disposal. Higher levels are protective. At 1.0, this is below the desirable threshold of 1.04 and well below the ideal of 1.4 for a male. Low HDL is the most common lipid abnormality in South Asian men and is driven by central adiposity, low physical activity, poor diet quality and genetics. Raising HDL requires increasing exercise volume, omega-3 intake, reducing sugar and refined carbohydrate, and losing abdominal fat. Statins do not meaningfully raise HDL.","low_causes":"Sedentary lifestyle, central obesity, smoking, high sugar diet, genetics, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics, high fibre diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.63","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4038","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.60","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) is the particle the liver uses to export triglycerides into the blood. At 0.63, this is within the laboratory range of under 0.78 and above the optimal ceiling of 0.60, consistent with the triglycerides being above optimal. VLDL tracks closely with triglycerides and will come down with the same dietary changes.","low_causes":"","high_causes":"High triglycerides, high sugar diet, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5893","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL cholesterol is the low-density lipoprotein that deposits cholesterol into artery walls. At 2.42, this is well within the laboratory range and within the optimal ceiling of 2.6. This is an excellent result on atorvastatin 20 mg, demonstrating the medication is working effectively.","low_causes":"Statin medication, hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick measure of cardiovascular risk, with lower numbers being better. At 4.0, this is within the laboratory range of under 4.5 but above the optimal ceiling of 3.5, driven by the low HDL rather than by high total cholesterol. Raising HDL will improve this ratio.","low_causes":"","high_causes":"Low HDL, high total cholesterol, central obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is carried by the protective HDL particles. At 25%, this is above the minimum of 20% but below the ideal of 28% or more. It reflects the low absolute HDL of 1.0 and will improve as HDL rises.","low_causes":"Low HDL, central obesity, inactivity","high_causes":"Regular exercise, healthy weight, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-clogging) cholesterol in one number. At 3.0, this is within the laboratory range of under 4 and above the optimal ceiling of 2.6. The result is influenced by both the LDL (well controlled at 2.42) and the VLDL/triglyceride component. Reducing triglycerides further will bring this closer to optimal.","low_causes":"Statin medication, very low fat diet","high_causes":"High LDL, high triglycerides, obesity, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4875","lower_normal":"1.20","upper_normal":"","lower_optimal":"1.40","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles; more ApoA1 means more functional HDL to remove cholesterol from artery walls. At 1.17, this is just below the 1.20 target, consistent with the low HDL of 1.0. ApoA1 responds to the same interventions as HDL: exercise, omega-3, weight loss and reducing sugar.","low_causes":"Low HDL, sedentary lifestyle, obesity, genetics, smoking","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle, making it the most accurate single count of atherogenic particles in the blood. At 0.73, this is below the 0.9 desirable threshold and below the 0.8 optimal ceiling. This is an excellent result on atorvastatin, confirming the statin is effectively reducing the number of particles that drive plaque formation.","low_causes":"Statin medication, hyperthyroidism, malnutrition","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.60","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful particles (ApoB) to the number of protective particles (ApoA1). At 0.62, this is below the 0.7 lower-risk threshold and above the optimal ceiling of 0.60. The ApoB side is well controlled by the statin; the slightly above-optimal ratio is driven by the ApoA1 being just below target at 1.17. Raising HDL and ApoA1 through exercise and diet will improve this.","low_causes":"","high_causes":"High ApoB, low ApoA1, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"27.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4250","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a genetically determined lipoprotein that carries cholesterol and promotes clotting. Unlike LDL, it cannot be meaningfully changed by diet, exercise or statins. At 27.2, this is below the 32 threshold, which is genuinely useful information given the family history of early cardiovascular events: it means the inherited Lp(a) pathway is not adding risk, and the elevated cholesterol that led to the statin was driven entirely by modifiable factors.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable by lifestyle or most medications)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3625","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried by triglyceride-rich remnant particles after triglycerides have been partially removed. It is calculated as total cholesterol minus HDL minus LDL. At 0.58, this is within the reference range of under 0.8 and above the optimal ceiling of 0.5, driven by the above-optimal triglycerides. Reducing triglycerides will bring this into the optimal range.","low_causes":"Low triglycerides","high_causes":"High triglycerides, insulin resistance, central obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4633","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"","description":"The triglyceride to HDL ratio is a strong marker of insulin resistance and cardiovascular risk. At 1.39, this is within the reference range of under 1.5 but well above the optimal ceiling of 0.9, driven by both above-optimal triglycerides and low HDL. This ratio is one of the best single markers of the metabolic pattern associated with central abdominal fat.","low_causes":"High HDL, low triglycerides, insulin sensitivity","high_causes":"Low HDL, high triglycerides, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"2.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3883","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This is LDL cholesterol with the small amount carried by Lp(a) particles stripped out, showing the truly modifiable LDL. At 2.33, it confirms that virtually all of the LDL is the type that responds to statin therapy and lifestyle changes, which is consistent with the low Lp(a) of 27.2.","low_causes":"Statin medication, low Lp(a)","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.143","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6482","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from triglycerides and HDL and reflects the balance between harmful and protective lipids. At 0.143, this is within the reference range of under 0.21 and above the optimal ceiling of 0.11, driven by the above-optimal triglycerides and low HDL. Improving both will bring this into the optimal range.","low_causes":"High HDL, low triglycerides","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3457","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"This ratio compares LDL to HDL cholesterol. At 2.42, it is within the reference range of under 3.5 and within the optimal ceiling of 2.5. The LDL is well controlled by atorvastatin; raising HDL would improve this ratio further.","low_causes":"Low LDL, high HDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"167","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6417","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to all tissues. At 167, this is within the male reference range of 130 to 170 and just above the optimal ceiling of 165. This is not a concern; it is consistent with the slightly elevated red blood cell count and active bone marrow production.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, high altitude, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8133","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.7","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the number of red blood cells per litre of blood. At 5.94, this is above the upper limit of 5.5. The body is producing more red blood cells than typical, and the fact that each cell is slightly smaller than normal (MCV 80.2) suggests either early iron-limited production, where the bone marrow compensates for less iron per cell by making more cells, or thalassaemia trait, which is common in South Asian populations. A haemoglobin electrophoresis with the GP will distinguish between the two.","low_causes":"Anaemia, blood loss, B12 or folate deficiency, chronic disease","high_causes":"Thalassaemia trait, iron deficiency (compensatory), dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.476","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.476, this is within the laboratory range and within the optimal band, meaning the balance between red cells and plasma is healthy despite the elevated RBC count.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"13.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4952","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. At 13.2%, this is within the optimal range of 12 to 14%, meaning the red blood cells are uniform in size. A normal RDW with a low MCV is a pattern more consistent with thalassaemia trait than with iron deficiency, where the RDW is typically raised.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"80.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2815","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"MCV measures the average size of each red blood cell. At 80.2, this is below the lower limit of 83, meaning the red blood cells are smaller than normal (microcytic). In a South Asian male with borderline iron stores and a normal RDW, this pattern could reflect thalassaemia trait, a common benign inherited condition, or early iron-limited production. The GP can clarify with a haemoglobin electrophoresis.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead exposure","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"28.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4133","lower_normal":"27","upper_normal":"32","lower_optimal":"28.5","upper_optimal":"31","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin packed into each red blood cell. At 28.2, this is within the laboratory range of 27 to 32 but at the lower end, just below the optimal floor of 28.5. This is consistent with the smaller cell size (low MCV): each cell carries slightly less haemoglobin because it is slightly smaller.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"351","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the ange_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"2.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6367","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage at 2.32% is within the laboratory range of 0.5 to 2.5%, though at the upper end. This confirms the bone marrow is actively producing red blood cells, consistent with the elevated absolute reticulocyte count.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia, thalassaemia trait","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"137.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9187","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the total number of young red blood cells being released by the bone marrow. At 137.8, this is above the upper limit of 100, meaning the marrow is producing red blood cells at a higher-than-normal rate. Combined with the elevated RBC count and low MCV, this is consistent with either thalassaemia trait (where the body compensates for smaller cells by making more) or iron-limited production (where stores are not quite sufficient to build full-size cells).","low_causes":"Iron deficiency, bone marrow failure, aplastic anaemia","high_causes":"Haemolysis, blood loss, thalassaemia trait, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"8.68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5933","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's front line. At 8.68, this is within the laboratory range and above the optimal ceiling of 8.0. The count is slightly elevated but not outside range, and the differential (the breakdown into different types of white cell) is normal apart from a marginal elevation in eosinophils. The above-optimal total white cell count is consistent with the mild inflammatory markers (CRP 2.1).","low_causes":"Viral infection, bone marrow suppression, autoimmune conditions","high_causes":"Infection, inflammation, stress, smoking, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"5.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5453","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most common white blood cell and the first responders to bacterial infection. At 5.18, this is within the optimal range. A healthy neutrophil count confirms no active bacterial infection or significant bone marrow issue.","low_causes":"Viral infection, medication, autoimmune conditions, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key": ibrium. At 101, this is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, SIADH","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5424","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the main buffer in the blood, preventing it from becoming too acidic or too alkaline. At 26.9, this is within the optimal range, confirming healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, chronic respiratory disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction and nerve signalling. At 2.46, this is within the optimal range, confirming healthy calcium metabolism. The corrected calcium, which adjusts for albumin levels, is 2.41 and also within the optimal range.","low_causes":"Vitamin D deficiency, parathyroid disease, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result"
