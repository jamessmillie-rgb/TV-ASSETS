nesium is involved in over 300 enzyme reactions in the body, including energy production, muscle relaxation, nerve function and sleep regulation. At 0.81, this is within the laboratory range of 0.53 to 1.11 but below the optimal floor of 0.85. Given the poor sleep quality (under six hours with waking in the night), constant stress, and low energy, optimising magnesium through supplementation with magnesium glycinate before bed is recommended.","low_causes":"Poor dietary intake, stress, alcohol, caffeine, intense exercise, medications","high_causes":"Kidney disease, excess supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"487","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6055","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/L","description":"Uric acid is a waste product of purine metabolism. At 487, this is within the laboratory range of 220 to 547 but above the optimal ceiling of 380. Elevated uric acid is associated with gout, kidney stones, and cardiovascular risk. At this level alongside a reduced eGFR of 70, it may reflect reduced renal excretion. Reducing sugar (particularly fructose), red meat, and alcohol will help lower uric acid. Worth discussing with the GP in the context of the kidney findings.","low_causes":"Low purine diet, medication (allopurinol), liver disease","high_causes":"High purine diet, alcohol, fructose, kidney disease, obesity, genetics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"17.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5933","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride and bicarbonate and helps detect metabolic acidosis. At 17.8, this is within the reference range of 10 to 20 and within the optimal range of 10 to 18. Normal acid-base balance is confirmed.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Metabolic acidosis, diabetic ketoacidosis, lactic acidosis, kidney failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts the sodium level for the blood glucose concentration. At 140, this confirms the sodium is truly within the optimal range and is not being diluted by high blood sugar. Reported for context and not applicable at present given normal glucose.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"290.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality estimates the concentration of dissolved particles in the blood, reflecting hydration status. At 290.2, this is within the optimal range of 280 to 292, confirming healthy hydration and electrolyte balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumincorrectedaniongap","name":"Albumin-Corrected Anion Gap","group":"ELECTROLYTES & MINERALS","result":"17.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"The albumin-corrected anion gap adjusts the standard anion gap for the albumin level. At 17.8, this confirms normal acid-base balance. Reported for context.","low_causes":"Low albumin, laboratory error","high_causes":"Dietary acid load, reduced kidney clearance, ketosis, dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product of protein metabolism filtered by the kidneys. At 5.1, this is within the optimal range, suggesting protein intake and kidney processing of waste products are both adequate.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, heart failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"123","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8291","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product of muscle metabolism filtered by the kidneys. At 123, this is above the upper reference limit of 104. Creatinine can be raised by creatine supplementation, which is taken by this customer, because creatine is broken down into creatinine. However, the cystatin C being independently raised at 1.12 confirms that the elevated creatinine is not purely a supplement effect and that kidney filtration is genuinely reduced. The GP should establish a baseline and monitor this.","low_causes":"Low muscle mass, liver disease","high_causes":"Reduced kidney function, creatine supplementation, high muscle mass, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"Estimated glomerular filtration rate from creatinine estimates how well the kidneys filter waste from the blood. At 62, this is just above the lower reference of 60 and well below the optimal of above 90. This value is partly influenced by creatine supplementation. The cystatin C eGFR of 70 and the combined eGFR of 70 provide a more reliable picture and also show reduced filtration.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"Hyperfiltration, pregnancy, high protein diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells that is filtered by the kidneys at a constant rate. Unlike creatinine, it is not affected by muscle mass, creatine supplementation, diet or exercise, making it the most reliable blood marker of kidney filtration. At 1.12, this is above the upper limit of 1.1, confirming that kidney filtration is genuinely reduced and that the elevated creatinine is not purely a supplement artefact. This should be discussed with the GP.","low_causes":"","high_causes":"Reduced kidney function, thyroid disease, corticosteroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"70","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and cystatin C to give the most accurate single estimate of kidney filtration. At 70, this confirms reduced filtration at a level that warrants GP review and baseline establishment. It is not in the danger zone but is lower than expected at 41.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"41.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3417","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"This ratio compares urea to creatinine and helps distinguish between kidney causes of raised creatinine and pre-renal causes (such as dehydration). At 41.5, it sits at the floor of the reference range of 40 to 100, consistent with the creatinine being relatively high for the urea level. In the context of creatine supplementation raising creatinine, this is expected.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6267","units":"g/L","description":"Total protein is the sum of albumin and globulin in the blood, reflecting liver synthetic function and immune activity. At 77, this is within the optimal range.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins and drugs, and maintains fluid balance. At 44, this is within the optimal range, confirming good liver synthetic function and nutritional status.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin is a group of proteins in the blood that includes immunoglobulins (antibodies). At 33, this is within the laboratory range and just above the optimal ceiling of 32. A mildly above-optimal globulin is consistent with the raised IgE driving the total slightly higher.","low_causes":"Immunodeficiency, malnutrition, liver disease","high_causes":"Chronic infection, inflammation, autoimmune conditions, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3881","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the liver's production protein (albumin) to the immune and inflammatory proteins (globulin). At 1.33, this is within the laboratory range and within the optimal band. A healthy ratio confirms the balance between liver function and immune activity is appropriate.","low_causes":"Chronic inflammation, autoimmune conditions, liver disease","high_causes":"Immunodeficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4476","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bone and bile ducts. At 70, this is within the optimal range, confirming healthy liver and bone function.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Liver disease, bile duct obstruction, bone disease, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6042","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 18, this is within the laboratory range of 5 to 21 and just above the optimal ceiling of 17. In the context of all other liver markers being healthy, this is a minor finding. Bilirubin at this level could suggest a mild Gilbert's syndrome trait, a harmless inherited variation seen in 5 to 10% of people, but is not a concern.","low_causes":"","high_causes":"Gilbert's syndrome, haemolysis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3125","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that increases when liver cells are damaged. At 35, this is within the laboratory range of under 56 but above the optimal ceiling of 30 for a male. This is a mild elevation that could be related to the BMI, diet or the statin (atorvastatin can mildly raise liver enzymes in some people). With GGT at 41 and all other liver markers healthy, there is no sign of significant liver disease.","low_causes":"","high_causes":"Fatty liver, obesity, alcohol, statin medication, viral hepatitis, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscle. At 17, this is within the optimal range, confirming healthy liver function from this angle. AST being lower than ALT is normal in the absence of advanced liver disease.","low_causes":"","high_causes":"Liver disease, muscle damage, heart disease, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5121","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4348","units":"IU/L","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme particularly sensitive to alcohol, metabolic strain and bile duct issues. At 41, this is within the male laboratory range of 4 to 73 but above the optimal ceiling of 25. With only 1 to 4 drinks per week, alcohol is unlikely the primary driver. At BMI 28.5 with central adiposity and daily sugar intake, metabolic strain on the liver from visceral fat is the most plausible explanation. Losing abdominal fat and reducing sugar will bring this down.","low_causes":"","high_causes":"Alcohol, fatty liver disease, obesity, medications, bile duct disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1552","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score estimates liver fibrosis (scarring) using age, AST, ALT and platelets. At 0.45, this is well below the 1.45 threshold, meaning there is no evidence of liver scarring. This is reassuring alongside the other liver markers.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age, low ALT, low platelets","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.162","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0540","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"The APRI score (AST to Platelet Ratio Index) is another liver fibrosis screening tool. At 0.162, this is well within the optimal range and confirms no evidence of significant liver fibrosis or cirrhosis.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-3.308","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3827","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD Fibrosis Score estimates the likelihood of liver fibrosis in the context of non-alcoholic fatty liver disease, using age, BMI, platelets, albumin, AST and ALT. At minus 3.308, this is within the optimal range, confirming a very low probability of significant liver fibrosis despite the BMI of 28.5.","low_causes":"","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"0.49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2967","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio divides AST by ALT. At 0.49, this is below the lower reference of 0.6. This simply reflects the ALT at 35 being proportionately higher than the AST at 17. In the context of all liver fibrosis scores being well within range and no sign of advanced liver disease, this ratio being low is not a concern; it is more commonly significant when both enzymes are elevated, which they are not.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6098","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"110","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch. At 103, this is within the optimal range. A normal amylase, combined with a normal lipase, confirms the pancreas is producing enzymes normally, which is relevant given the bloating symptoms: pancreatic enzyme insufficiency is not the cause.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6028","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3475","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a pancreatic enzyme that digests fats. At 51, this is within the optimal range. Together with amylase, this confirms healthy pancreatic function and rules out pancreatitis or pancreatic insufficiency as a cause of the digestive symptoms.","low_causes":"Chronic pancreatic damage, cystic fibrosis","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitd","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"56","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3619","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and energy. At 56, this is above the sufficient threshold of 50 but below the optimal range of 75 to 120. South Asian skin produces less vitamin D from sunlight, and adipose tissue at BMI 28.5 sequesters vitamin D, meaning a higher supplementation dose is needed. The recently started 4,000 IU spray should bring this up over the coming months; maintain this dose through winter and retest in spring to confirm it is reaching the optimal range.","low_causes":"Low sunlight exposure, dark skin, obesity, malabsorption, lack of supplementation","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"565","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. At 565, this is within the optimal range of 500 to 900. The intermittent supplementation appears to be maintaining adequate levels. Switching to a consistent daily sublingual methylcobalamin will help maintain this reliably.","low_causes":"Vegetarian or vegan diet, malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6190","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA repair and red blood cell production. At 9, this is within the optimal range. Given the very low vegetable intake (0 to 1 portions a day), this is likely supported by the multivitamin. Increasing vegetable intake will provide a more reliable natural source of folate.","low_causes":"Poor diet, alcoholism, malabsorption, pregnancy, medications","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.132","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.5573","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate balance. At 2.132, this is within the optimal range. Healthy PTH alongside healthy calcium, corrected calcium, phosphate and vitamin D confirms the calcium regulation system is working well despite the below-optimal vitamin D level.","low_causes":"Excess calcium or vitamin D, hypoparathyroidism","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"2.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9645","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6170","units":"mmol/L","description":"Total antioxidant activity measures the overall antioxidant capacity of the blood. At 2.19, this is above the upper reference of 1.77. An elevated TAA is typically a positive finding, reflecting supplementation (multivitamins and the antioxidants in protein powder and creatine may contribute). This is not a concern.","low_causes":"Oxidative stress, poor diet, chronic disease","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4358","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is released by the pituitary gland in the brain to tell the thyroid how hard to work. At 1.85, this is within the optimal range of 1.0 to 2.5, meaning the brain is happy with the thyroid's output and is not pushing it harder. This rules out thyroid disease as a cause of the fatigue, weight gain or hair thinning.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"21.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6369","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone the thyroid produces. At 21.7, this is within the laboratory range of 11.5 to 22.7 and above the optimal ceiling of 20. This means the thyroid is producing generously. With TSH sitting comfortably within the optimal range, this is not a concern; the thyroid is simply outputting at the upper end of its capacity.","low_causes":"Hypothyroidism, pituitary disease, illness","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy and body temperature. At 5.2, this is within the optimal range of 4.5 to 6.5. A healthy FT3 confirms that the body is converting T4 to the active T3 adequately, and the thyroid is not contributing to the fatigue or difficulty losing weight.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, illness, calorie restriction","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies are produced by the immune system when it attacks the thyroid gland, as seen in Hashimoto's thyroiditis. At less than 6.6, this is well below the threshold of 13.8, meaning there is no autoimmune attack on the thyroid. The thyroid is healthy and not under immune assault.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. At less than 1.3, this is well below the 4.4 threshold, confirming no autoimmune thyroid process. More than 80% of people have undetectable levels, so this is normal.","low_causes":"","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3867","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.24, this is within the reference range of 0.20 to 0.45 and below the optimal floor of 0.27. The ratio is lower because the FT4 at 21.7 is at the upper end of its range while FT3 at 5.2 is mid-optimal. This means conversion is at the lower end of efficiency. Selenium supports the enzyme that converts T4 to T3; a Brazil nut or two per day provides a natural source.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"336","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4674","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. At 336, this is within the optimal morning range of 200 to 500. Given that stress constantly feels hard to manage and the energy pattern is described as low all day, a normal morning cortisol is reassuring: the adrenal glands are functioning and the stress response is not in overdrive. However, cortisol is a snapshot at the time of the blood draw and does not capture the daily rhythm; the combination of low energy all day and exhaustion on waking could suggest a shifted cortisol curve that a single morning reading does not fully capture.","low_causes":"Adrenal insufficiency, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"119","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4073","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"110","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3765","units":"pmol/L","description":"Oestradiol is the main oestrogen in men, produced partly in the testes and partly by conversion of testosterone in fat tissue via an enzyme called aromatase. At 119, this is within the laboratory range of under 146.1 but above the optimal ceiling of 110. At BMI 28.5 with central adiposity, excess fat tissue increases aromatase activity, converting more testosterone to oestradiol. This contributes to the lower testosterone of 11 and can contribute to fatigue and difficulty losing abdominal fat. Losing visceral fat reduces aromatase activity and should improve the testosterone-oestradiol balance.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"Obesity, central adiposity, liver disease, aromatase excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3891","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3456","upper_optimal_position":"0.5686","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. At 1.39, this is within the optimal range. Progesterone has a minor role in male health and this is a normal finding.","low_causes":"Adrenal insufficiency","high_causes":"Adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5073","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6111","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and signals the testes to produce testosterone. At 5.57, this is within the optimal range. A normal LH alongside low testosterone suggests the brain is accepting the current testosterone level rather than pushing the testes harder, which can be seen when the suppression is gradual and driven by lifestyle factors (weight, sleep, stress) rather than testicular failure.","low_causes":"Pituitary disease, anabolic steroid use, obesity","high_causes":"Primary testicular failure, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"6.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4273","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3453","upper_optimal_position":"0.5449","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and supports sperm production. At 6.11, this is within the optimal range, confirming a healthy pituitary-testicular axis.","low_causes":"Pituitary disease, anabolic steroid use","high_causes":"Primary testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3760","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"28.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4910","upper_optimal_position":"0.6667","units":"nmol/L","description":"Testosterone is the primary male hormone, essential for energy, muscle mass, fat distribution, libido, mood and hair health. At 11, this is within the laboratory range of 8.4 to 28.7 but below the recommended level of 12 and well below the optimal floor of 18. At 41 with a BMI of 28.5, under six hours of sleep, constant stress, low calorie intake with meal skipping, and central adiposity, every one of these factors suppresses testosterone. The excess oestradiol at 119, driven by aromatase in adipose tissue, further reduces effective testosterone. Improving sleep, eating consistently with adequate protein, reducing stress, and losing abdominal fat are the most effective ways to raise testosterone before any medical intervention is considered.","low_causes":"Obesity, poor sleep, stress, ageing, pituitary disease, medication, low energy availability","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone","group":"HORMONES","result":"0.241","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3740","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5788","units":"nmol/L","description":"Free testosterone is the unbound fraction of testosterone available to enter cells and exert its effects. At 0.241, this is within the laboratory range of 0.13 to 1.04 but below the optimal floor of 0.3. Low free testosterone is consistent with the low total testosterone of 11 and contributes to the symptoms of fatigue, difficulty losing fat, and hair thinning.","low_causes":"Low total testosterone, high SHBG, obesity, ageing, stress","high_causes":"Testosterone supplementation, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3747","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3384","upper_optimal_position":"0.5404","units":"uIU/ml","description":"Prolactin is a pituitary hormone that in men should be low. At 86, this is within the optimal range. Elevated prolactin can suppress testosterone and cause symptoms such as low libido and fatigue; a normal prolactin is reassuring.","low_causes":"","high_causes":"Pituitary tumour (prolactinoma), medication (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"40.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3632","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a ratio of total testosterone to SHBG that estimates the proportion of testosterone that is biologically active. At 40.74, this is within the laboratory range of 30 to 150 but below the optimal floor of 50, reflecting the low total testosterone of 11 relative to SHBG.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, low SHBG, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"4.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4275","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3.0","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3992","upper_optimal_position":"0.5792","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. At 4.1 umol/L, this is within the laboratory range. DHEA-S naturally declines with age but at 41 this level is at the lower end of optimal, consistent with the pattern of below-optimal testosterone production.","low_causes":"Ageing, adrenal insufficiency, chronic stress, poor nutrition","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3863","upper_optimal_position":"0.5924","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein that binds testosterone, making it unavailable to tissues. At 27, this is within the optimal range of 25 to 55. A low SHBG is often seen with insulin resistance and obesity, but at 27 the level is appropriate and not restricting testosterone excessively. The low free testosterone is driven by the low total testosterone rather than by high SHBG binding.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Ageing, hyperthyroidism, liver disease, oral oestrogen","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"5.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3737","lower_normal":"3.8","upper_normal":"20","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3580","upper_optimal_position":"0.5638","units":"nmol/L","description":"Bioavailable testosterone is the sum of free testosterone and testosterone loosely bound to albumin, representing the total testosterone available to tissues. At 5.76, this is within the reference range and just above the optimal floor of 5. It is at the lower end of optimal, consistent with the low total and free testosterone levels.","low_causes":"Low total testosterone, high SHBG, obesity, po   .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
