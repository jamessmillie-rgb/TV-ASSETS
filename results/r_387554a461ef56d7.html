<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Ricardo Jaime Thompson","dob":"15/09/2008","report_date":"2026-09-26","summary":"Ricardo is an 18-year-old male presenting with a BMI of 22.3, following a standard mixed diet rated 5 out of 10 for quality with a volume of 6 out of 10. He does not currently train, performing zero cardio and zero resistance sessions per week, with 5,000 to 7,500 daily steps. He reports no medications and no specific habits. He reports low energy and fatigue, poor sleep and insomnia, and low mood and anxiety. His goals are to build muscle, improve energy levels, and improve sleep quality.\n\nThe most important finding in this report, and the one Ricardo should raise with his GP before anything else, is a tumour marker called CA 19-9. This is a protein that certain cells in the pancreas, bile ducts and bowel can release into the bloodstream. Ricardo's result is 53.91, above the upper limit of 37. CA 19-9 is not a cancer-specific marker and it can be raised by a number of benign causes including mild inflammation in the pancreas or bile ducts, a recent infection, or even simply having a particular blood group. At 18 years old, the probability of a sinister cause is extremely low. However, any tumour marker above its reference limit needs to be discussed with a GP so that it can be repeated on a fresh sample and, if it remains elevated, investigated with imaging. The rest of Ricardo's pancreatic and liver markers are reassuringly normal: his amylase is 55, his lipase is 39, his bilirubin is 14, his GGT is 17, and his ALT is 10, so there is no sign of active inflammation or obstruction in the pancreas or biliary system right now. That makes a benign explanation the most likely one, but the GP still needs to see the number.\n\nThe second finding worth flagging is his Lipoprotein(a), written Lp(a). This is a genetically inherited lipoprotein particle that sits on top of LDL cholesterol and increases cardiovascular risk by depositing cholesterol into artery walls, promoting blood clotting, and driving local inflammation. Ricardo's Lp(a) is 161.57 nmol/L, well above the ideal threshold of 32. Because Lp(a) is entirely genetic, it does not change with diet, exercise or weight. It stays roughly the same for life, which is why this result should be recorded permanently in his medical notes and why his first-degree relatives, parents and siblings, should also be tested. The genuinely useful news is that knowing this at 18 gives Ricardo decades to manage the modifiable side of his cardiovascular risk, and his modifiable lipids are in good shape. His total cholesterol is 4.1, his LDL is 2.38, his triglycerides are an excellent 0.69, his HDL is 1.4, and his ApoB is 0.89, just inside the desirable threshold of 0.9. His ApoB to ApoA1 ratio is 0.68, inside the lower-risk threshold of 0.7. When the mathematical contribution of Lp(a) is subtracted from his LDL, the corrected LDL falls to 1.86, which is well within the optimal range. That tells us that the cholesterol particles he can actually influence through lifestyle are already at a healthy level. The Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, comes in at 25 out of 100, above the ideal threshold of 20 but within the acceptable threshold of 40. The score is being driven almost entirely by the Lp(a); every other input is in a good place. Ricardo should discuss the Lp(a) result with his GP so that it is on his permanent record, and his GP may wish to consider whether early lipid-lowering strategies are appropriate given the level.\n\nTurning to the positives, and there are many of them. Ricardo's blood sugar control is excellent. His fasting glucose is 4.7, his HbA1c is 35 mmol/mol, and his fasting insulin is 8.04, all within ideal ranges. His C-Peptide is 0.787 ug/L, which converts to approximately 260 pmol/L and is below the laboratory range of 1.1 to 4.4 ug/L. However, in the context of a perfectly normal glucose, a healthy HbA1c, and a low-normal insulin, this simply reflects a pancreas that does not need to work hard because it is not being asked to clear large amounts of sugar. This is not a sign of pancreatic failure; it is a sign of low insulin demand, which at 18 on a moderate diet is entirely expected. His HOMA-IR is 1.68, which the laboratory flags as above the 1.5 upper limit. The clinical thresholds published in the literature place early insulin resistance at 1.9 and significant resistance at 2.9, so at 1.68 Ricardo is well below the point where this would be considered a problem. We would classify his insulin sensitivity as healthy.\n\nHis liver is in excellent health. ALT at 10, AST at 16, GGT at 17, and bilirubin at 14 are all comfortably within range. His FIB-4 score is 0.42, well below the threshold of 1.45, confirming no sign of fibrosis. His APRI score is 0.184, also reassuringly low. His liver is under no metabolic strain at all.\n\nHis kidney function is strong. His creatinine is 68, giving a creatinine-based eGFR above 90, and his Cystatin C is 1.02, giving a Cystatin C-based eGFR of 107. Cystatin C is a more accurate measure of kidney filtration than creatinine because it is not influenced by muscle mass, and an eGFR of 107 at 18 is exactly where it should be. His urea is 3.7, his electrolytes are balanced with sodium at 139, potassium at 5.0, chloride at 99, bicarbonate at 27.1, and his corrected calcium is 2.49 with magnesium at 0.97, both within optimal ranges. His phosphate is 1.6, at the top of range, which is common in adolescents because bone is still actively mineralising at this age. His parathyroid hormone is 1.145 pmol/L, at the lower end of its range, which fits with adequate calcium and phosphate levels.\n\nHis thyroid is working well. TSH is 1.65, within the optimal range of 1.0 to 2.5. Free T4 is 20.2, towards the upper end of the reference range and within the optimal band. His Free T3 is 7.2, marginally above the upper limit of 7.1. Free T3 is the active thyroid hormone, the one that actually drives metabolism in cells, and a result that is 0.1 above the top of a reference range is not clinically significant. At 18, thyroid output tends to sit at the higher end, and the FT3 to FT4 ratio of 0.356 is right in the middle of the optimal band, which means the thyroid is converting T4 to T3 efficiently and proportionately. Both thyroid antibodies are negative, with TPO below 6.6 and thyroglobulin below 1.3, ruling out autoimmune thyroid disease. His thyroid is not the cause of his fatigue.\n\nHis full blood count is healthy across the board. Haemoglobin at 153 is ideal for a young man. Red blood cells, haematocrit, MCV, and platelets are all within range. His white cell count is 5.33 with a normal differential, and his ESR is just 2, confirming no inflammation. His CRP is below 0.5, which is excellent and means there is no systemic inflammation driving any of his symptoms.\n\nHis hormones are in a strong position. Testosterone at 23.5 nmol/L is well within the optimal range of 18 to 30 for a young man. Free testosterone at 0.514 nmol/L is healthy, and his bioavailable testosterone of 11.24 is above the upper reference limit, reflecting the naturally high androgen activity of an 18-year-old. SHBG at 36.1 is balanced, not binding too much testosterone. DHEA-S at 7.3 umol/L, which converts to approximately 2,690 ug/dL, is robust. Cortisol at 192 nmol/L is within the morning reference range. LH and FSH are both normal, confirming the pituitary-gonadal axis is working as it should. Oestradiol at 100 is within range, and prolactin at 275 is within range. His hormonal profile gives him an excellent foundation for the muscle-building goal he has set.\n\nHis immune markers are reassuring. IgG, IgM, IgA and IgE are all within range, rheumatoid factor is negative, and coeliac screening by tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of fatigue or low mood.\n\nHis prostate markers are normal, with PSA at 0.44 and a free PSA ratio of 1.159, both well within range. CEA, another tumour marker, is 0.54, also normal.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 10.9, about 7 years younger than a calendar age of 18. This does not affect the clinical interpretation.\n\nNow to the areas that need attention. Ricardo's iron studies show a pattern worth watching. His transferrin is 2.13, marginally below the lower limit of 2.15. Transferrin is the protein that carries iron around the bloodstream, and when it is low it can mean one of two things: either the body has plenty of iron and has downregulated production of the carrier protein, or there is an inflammatory or nutritional reason. His ferritin is 86, which is healthy and within the optimal range for a young man. His serum iron is 28.1 and his transferrin saturation is 52.53%, which is within the laboratory range of 18 to 55% but above the optimal ceiling of 40%. Put together, this pattern shows iron stores and iron availability are both on the higher side of normal, and the slightly low transferrin makes sense as the body saying it does not need to produce more carrier protein because there is already plenty of iron available. This is not iron overload and does not suggest haemochromatosis at these levels, but it does mean Ricardo should not take iron supplements, and it is worth repeating on his next test to confirm the pattern is stable.\n\nHis vitamin D is 50 nmol/L. The laboratory classes this as sufficient, but the optimal range used in clinical practice is 75 to 120 nmol/L, and at 50 he is below that. Vitamin D is essential for bone health, immune function, mood regulation, and muscle function, all of which connect directly to his goals. At 18 with a BMI of 22.3, a dose of 2,000 to 3,000 IU of vitamin D3 daily taken with a meal containing fat should bring him into the optimal range within two to three months.\n\nHis vitamin B12 is 337 pg/mL. The laboratory range starts at 193, but optimal function, particularly for neurological health, energy production, and mood, requires levels above 500. At 337, Ricardo is in the lower third of the range, and given his symptoms of fatigue, low mood, and poor sleep, bringing B12 into the optimal zone is a worthwhile step. Sublingual methylcobalamin at 1,000 mcg daily is the most effective form.\n\nHis folate at 10 ng/mL is within range and adequate, though not at the top of the range where it would ideally sit alongside optimised B12.\n\nHis uric acid is 187 umol/L, below the lower limit of 220. Uric acid is a waste product from the breakdown of purines, which are found in meat, seafood, and certain vegetables. At mildly low levels this is not a clinical concern and often reflects a diet that is relatively low in purine-rich foods, which at a diet quality of 5 out of 10 with moderate volume is plausible. It can also reflect high antioxidant clearance, and his total antioxidant activity is 1.89, above the upper limit of 1.77, which may be related. Low uric acid only becomes clinically relevant at very low levels, typically below 120, so this is simply a finding to note rather than act on.\n\nHis total antioxidant activity at 1.89 is marginally above the upper limit of 1.77. This marker measures the overall capacity of the blood to neutralise free radicals. A result slightly above range is not a concern and can reflect dietary intake of antioxidant-rich foods or beverages such as tea, coffee, or fruit.\n\nHis MCH at 32.1 is marginally above the upper limit of 32. MCH stands for mean corpuscular haemoglobin, the average amount of haemoglobin packed into each red blood cell. At 0.1 above the limit, this is laboratory variation and is not clinically significant, particularly when MCV and MCHC are both within range.\n\nThe urinalysis is clean. Protein, glucose, ketones, and nitrites are all negative. There are 10 red blood cells per microlitre, which is below the laboratory threshold of 25 for significance. The urine culture result is pending and will be reviewed when available.\n\nNow to Ricardo's symptoms. He reports fatigue, poor sleep, and low mood with anxiety, and his bloods do not reveal a clear medical cause for any of them. That is actually useful information. His thyroid is working well, his iron and haemoglobin are healthy, his B12 is adequate though not optimal, his blood sugar is well controlled, his testosterone is strong, his cortisol is within range, there is no inflammation, and coeliac disease has been excluded. The most likely drivers of his symptoms sit outside what blood can measure. At 18, sleep architecture is still developing, and poor sleep is one of the most common causes of fatigue, low mood, and anxiety in this age group. If Ricardo is going to bed at inconsistent times, using screens late into the evening, or getting fewer than eight hours, those habits alone can explain all three symptoms. His cortisol at 192 is at the lower end of the morning range, which may suggest his cortisol rhythm is not peaking strongly in the morning, and this would fit with difficulty waking and low morning energy. A fixed wake time, exposure to natural light within the first hour of waking, and a caffeine cut-off by early afternoon are the most evidence-based interventions for resetting the cortisol rhythm and improving sleep quality. His step count of 5,000 to 7,500 with zero structured exercise also means he is not getting the mood-regulating and sleep-promoting effects of physical activity, and starting resistance training, which aligns with his muscle-building goal, would directly address mood, energy, and sleep through its effects on endorphins, growth hormone, and circadian rhythm regulation. His B12 at 337, while not critically low, is below the level associated with optimal neurological and mood function, and optimising it may provide a modest improvement in energy and mood.","links":"The thread that ties Ricardo's results together is reassuringly simple: this is an 18-year-old with excellent metabolic health, strong hormones, a clean liver, good kidneys, and no inflammation, whose symptoms are almost certainly driven by lifestyle factors rather than by anything in his blood.\n\nThe one finding that stands apart from that story is the CA 19-9 at 53.91. This does not connect to his fatigue, sleep, or mood, and it does not connect to any other marker in the panel. His pancreatic enzymes, liver function, bilirubin, and inflammatory markers are all normal, which makes an inflammatory or obstructive cause unlikely. The most probable explanation at 18 is a benign elevation, possibly related to blood group, a transient viral exposure, or simply biological variation, but it requires a GP review and a repeat to confirm.\n\nThe Lp(a) at 161.57 is the other standalone finding. It is genetic, fixed, and unconnected to his diet, weight, or training. What makes it clinically important is that it adds to the lifetime burden of arterial cholesterol exposure, and discovering it at 18 is a genuine advantage because every other modifiable lipid marker is already in a good position. The corrected LDL of 1.86, the triglycerides of 0.69, and the HDL of 1.4 all confirm that the risk Ricardo can control is already well managed. The Cardiovascular Risk Score of 25 is driven almost entirely by the Lp(a), and if that marker were at zero the score would be comfortably within the ideal range.\n\nThe iron picture, transferrin marginally below range at 2.13 with a saturation of 52.53% and a ferritin of 86, forms a coherent pattern of adequate to generous iron stores in a young man who does not train. There is no sign of overload, but there is no need for supplementation either, and the transferrin is only 0.02 below the limit, which is within measurement variability.\n\nThe suboptimal vitamin D and B12 are the two nutritional findings that could, modestly, contribute to his fatigue and mood symptoms. Neither is deficient, but neither is optimal, and both are easy to correct. Beyond those, the explanation for his symptoms points squarely at sleep hygiene, physical inactivity, and possibly stress, none of which blood can measure but all of which his quiz answers make plausible.\n\nThe remaining out-of-range markers, MCH at 32.1, Free T3 at 7.2, total antioxidant activity at 1.89, HOMA-IR at 1.68, and C-Peptide below range, are either marginal laboratory variation or physiologically expected findings in a lean, young, insulin-sensitive male. None of them requires action.","lifestyle":"Start resistance training two to three times per week, using a beginner programme with compound lifts like squats, deadlifts, bench press and rows. Anchor: pick three fixed days and treat them like appointments. Why: resistance training is the most effective way to build muscle at 18 with a testosterone of 23.5, and it directly improves sleep quality, mood, and energy through endorphin release and circadian rhythm regulation.\nAdd a palm-sized portion of protein to every meal, aiming for at least 20 to 25 grams per sitting. Eggs, chicken, Greek yoghurt, tinned fish, beans, or mince. Anchor: protein goes on the plate first, before anything else. Why: at 60 kg with a muscle-building goal, Ricardo needs 96 to 120 grams of protein per day and is unlikely to be hitting that on a standard mixed diet rated 5 out of 10.\nSet a fixed wake time seven days a week, within 30 minutes of the same time, and get outside into natural light within the first hour of waking. Anchor: alarm goes off, shoes on, step outside for ten minutes. Why: this resets the cortisol rhythm, which at a morning cortisol of 192 may not be peaking as strongly as it should, and is the single most effective intervention for poor sleep and morning fatigue.\nStop all screens one hour before bed, and keep the bedroom cool and dark. Anchor: set a phone alarm for the cut-off time. Why: blue light suppresses melatonin production, which directly worsens the poor sleep and insomnia Ricardo reports.\nCut caffeine by 1pm at the latest. If energy dips in the afternoon, replace it with a 10-minute walk or cold water on the face. Why: caffeine has a half-life of five to six hours, so a coffee at 3pm is still half-active at 9pm and will fragment sleep architecture.\nAim for 8,000 to 10,000 steps daily, adding a 15-minute walk after lunch or dinner. Anchor: meal finished, shoes on, walk. Why: post-meal walking improves glucose clearance, supports digestion, and increases total daily energy expenditure, which will support both muscle gain and energy levels.\nEat at least two to three portions of vegetables or fruit every day, adding one portion at a time to meals he already eats. Anchor: add a handful of spinach, peppers, or berries to whatever is already on the plate. Why: increasing micronutrient and fibre intake will support the vitamin D and B12 optimisation and improve overall diet quality from its current 5 out of 10.\nCalorie target: approximately 2,200 to 2,400 kcal per day to support lean muscle gain at 60 kg with a sedentary-to-lightly-active lifestyle transitioning into training. Protein target: 96 to 120 grams per day, based on 1.6 to 2.0 g per kg of bodyweight for someone beginning a resistance training programme.","flags":"CA 19-9 is 53.91 U/mL, above the upper limit of 37. This is a tumour marker associated with pancreatic, biliary and bowel pathology, but is frequently elevated by benign causes including blood group antigens, mild ductal inflammation, or transient infection. All pancreatic and hepatobiliary markers are normal. At 18, sinister pathology is extremely unlikely, but this requires a GP review and a repeat on a fresh sample.\nLipoprotein(a) is 161.57 nmol/L, well above the 32 nmol/L threshold, placing Ricardo in the moderate-risk category (90 to 200). Lp(a) is entirely genetically determined and does not change with lifestyle. This should be recorded permanently in his medical notes and first-degree relatives should be tested. All modifiable lipid markers are within desirable ranges.\nC-Peptide is 0.787 ug/L (approximately 260 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. In the context of normal glucose (4.7), normal HbA1c (35), and low-normal insulin (8.04), this reflects low insulin demand rather than pancreatic insufficiency. No action required.\nHOMA-IR is 1.68, above the laboratory upper limit of 1.5 but below the clinical threshold for early insulin resistance (1.9). In a lean 18-year-old with normal glucose and HbA1c, this is not clinically significant.\nTransferrin is 2.13 g/L, marginally below the lower limit of 2.15, with transferrin saturation at 52.53% (above the optimal ceiling of 40% but within the laboratory range of 18 to 55%). Ferritin is 86. This pattern reflects adequate to generous iron stores; iron supplementation should be avoided. Repeat on next panel to confirm stability.\nFree T3 is 7.2 pmol/L, 0.1 above the upper limit of 7.1, with a normal FT3:FT4 ratio of 0.356 and negative thyroid antibodies. This is physiological variation in a young man and not clinically significant.\nUric acid is 187 umol/L, below the lower limit of 220. Mildly low uric acid in the absence of symptoms or renal wasting is not clinically significant and likely reflects dietary purine intake.\nVitamin D is 50 nmol/L, sufficient by NHS criteria but below the optimal range of 75 to 120. Supplementation recommended.\nVitamin B12 is 337 pg/mL, within the laboratory range but below the optimal threshold of 500. Supplementation recommended for energy and mood support.\nMCH is 32.1 pg, 0.1 above the upper limit of 32. Not clinically significant given normal MCV and MCHC.\nTotal Antioxidant Activity is 1.89 mmol/L, marginally above the upper limit of 1.77. Not clinically significant.\nCardiovascular Risk Score is 25 out of 100, above the ideal threshold of 20 but within the acceptable threshold of 40, driven primarily by Lp(a).\nReassuring negatives: thyroid function normal with negative antibodies, liver enzymes and fibrosis scores all normal, kidney function excellent (Cystatin C eGFR 107), full blood count healthy with no anaemia, CRP below 0.5 with ESR of 2, testosterone optimal at 23.5, coeliac screen negative, immunoglobulins normal, PSA normal, CEA normal, cortisol within range, urinalysis clean.\nNot returned by the laboratory: urine culture and sensitivities (pending).","recommendations":"Discuss the CA 19-9 result of 53.91 (above 37) with your GP. A repeat on a fresh fasting sample in six to eight weeks is the appropriate first step. If it remains elevated, the GP may arrange an abdominal ultrasound.\nAsk the GP to record the Lp(a) result of 161.57 nmol/L permanently in your medical notes. This is an inherited marker that does not change with lifestyle and places you in the moderate cardiovascular risk category. Your parents and siblings should also be tested. Discuss whether any early preventive strategy is appropriate.\nStart vitamin D3 supplementation at 2,000 to 3,000 IU daily with a fat-containing meal to bring your level from 50 into the optimal range of 75 to 120 nmol/L. Always take vitamin K2 (MK-7, 100 mcg) alongside vitamin D.\nStart sublingual methylcobalamin (vitamin B12) at 1,000 mcg daily to bring your B12 from 337 into the optimal range above 500 pg/mL.\nBegin a structured resistance training programme two to three times per week with a progressive beginner template. At 60 kg with a testosterone of 23.5 and a goal to build muscle, this is the single most effective change in the report.\nAim for 2,200 to 2,400 kcal per day with 96 to 120 grams of protein daily (1.6 to 2.0 g/kg) to support muscle gain. Retest in four to six months with a repeat of CA 19-9, vitamin D, B12, iron studies, and a full lipid panel including Lp(a) to confirm baseline.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 to 3,000 IU daily, taken with a meal containing fat. Why: your vitamin D is 50, below the optimal range of 75 to 120 nmol/L. Vitamin D supports bone health, immune function, mood, and muscle recovery.\nVitamin K2 (MK-7): 100 mcg daily, taken with your vitamin D. Why: K2 directs calcium into bone and out of arteries, and should always accompany vitamin D supplementation.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 is 337, below the optimal threshold of 500 for neurological function, energy production, and mood. Sublingual methylcobalamin bypasses the gut and is the most effective form.\nMagnesium (glycinate): 200 to 300 mg before bed. Why: your magnesium at 0.97 is within optimal range, but magnesium glycinate at bedtime supports sleep quality, which is one of your primary goals, and supports muscle recovery as you begin training.\nOmega-3 (fish oil): 1 to 2 grams of combined EPA and DHA daily with food. Why: your Lp(a) is genetically elevated at 161.57 and cannot be changed, but omega-3 supports cardiovascular health through anti-inflammatory and anti-thrombotic pathways, and supports mood and brain function.\nDO NOT take iron supplements. Your ferritin is 86 and your transferrin saturation is 52.53%; adding iron when stores are already generous can push saturation into the overload range.\nThe most important changes from this report are not supplements. They are starting resistance training, fixing sleep hygiene with a consistent wake time and screen cut-off, and eating enough protein to support muscle growth.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 73.6; held to 59 by a system rated \"See your GP\". Weakest systems: tumor markers 38%, lipids & cardiovascular 43%, thyroid 71%. Biggest drags: Lipoprotein(a), Free T3, C-Peptide, Vitamin D 25(OH).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"10.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2370","lower_normal":"","upper_normal":"23","lower_optimal":"","upper_optimal":"18","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3913","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3125","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no
