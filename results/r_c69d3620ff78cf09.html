<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

very low and reflects good insulin sensitivity. Her TG to HDL ratio, a useful proxy for metabolic health, is 0.26, which is outstanding. Her Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk and cannot be changed by diet or exercise, is below 25, which is normal and genuinely useful information because it means her entire lipid profile is driven by modifiable factors. Her Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c and scored from 0 to 100, is 0, which is as good as it gets. Her blood sugar regulation is excellent. Fasting glucose is 4.6 against an optimal ceiling of 5.4, HbA1c is 34, well below the optimal ceiling of 36, and fasting insulin is 6.19, sitting comfortably in the optimal band of 2 to 8. Her HOMA-IR, which measures how hard the pancreas has to work to control blood sugar and is calculated from glucose and insulin together, is 1.27, within the ideal range. Her C-Peptide, which confirms how much insulin the pancreas is actually producing, is 1.17 micrograms per litre, equivalent to 387 picomoles per litre, which is within range. Her inflammation markers are clean. High-sensitivity CRP, the most reliable marker of systemic inflammation, is below 0.5, and her ESR, the erythrocyte sedimentation rate, is 11, within range. Her kidney function is healthy, with a cystatin C-based eGFR of 94, which is within the optimal range of above 90. Her liver is in good health overall. AST is 26, bilirubin is 8, alkaline phosphatase is 46, and her FIB-4 score, which screens for liver scarring, is 0.65, well within the safe range. Her amylase and lipase, which reflect pancreatic health, are both well within range. Her immune system is balanced, with all immunoglobulin classes, IgG, IgM, IgA and IgE, sitting within their respective ranges. Rheumatoid factor is 5, well below the 14 threshold, which is reassuring given her joint complaints. Her coeliac screen, tissue transglutaminase IgA, is negative. Her calcium is 2.41, corrected calcium 2.39, phosphate 1.0 and parathyroid hormone 1.87, all within healthy ranges. Her magnesium is 0.91, within the optimal band of 0.85 to 1.05, which is relevant because magnesium deficiency is a common contributor to muscle cramps. Her creatine kinase is 59, well within range, confirming there is no excessive muscle damage from her training. Her cortisol is 377, within the morning reference range. Her tumour markers, CA125, CA15-3, CA19-9 and CEA, are all well within their respective limits. Her total antioxidant activity is 1.56, within range. Her urinalysis shows no protein, no glucose, no ketones, no nitrites, no casts and no significant white cells. Urine RBCs are 10, which is below the significance threshold of 25, and in a 37-year-old menstruating woman is most likely explained by menstrual contamination. Bacterial culture and sensitivities are pending.\n\nTurning to the findings that need attention, Eleni's ferritin is 38. The laboratory range for women is 10 to 291, so this is technically within range, but the optimal level for a woman of her age and activity level is 40 to 150. At 38, she is just below that optimal floor, and given her history of previously documented low ferritin requiring supplementation, her symptoms of fatigue, poor recovery and muscle cramps, and the fact that she had no follow-up after her previous course of supplements, this is almost certainly contributing to how she feels. Ferritin is the body's iron storage protein, and at this level the stores are thin enough that the bone marrow may not be getting the iron supply it needs to produce red blood cells at full capacity. This is supported by her absolute reticulocyte count, which measures the number of brand new red blood cells the bone marrow is releasing into the bloodstream. Hers is 47, just below the lower limit of 50, suggesting the bone marrow is producing slightly fewer new cells than expected. Her transferrin, the transport protein that carries iron around the blood, is 2.35, just below the lower limit of 2.5. In iron deficiency, transferrin usually rises as the body tries to scavenge more iron, so a low transferrin alongside borderline ferritin is slightly unusual. However, transferrin can be suppressed by inflammation or by subclinical thyroid dysfunction, and given her Hashimoto's antibody pattern, this is the most likely explanation. Her transferrin saturation is 23%, which is within the laboratory range of 18 to 55 but below the optimal floor of 25%, meaning the iron transport system is not fully loaded. The combination of borderline-low ferritin, low transferrin, below-optimal saturation and a slightly suppressed reticulocyte count paints a picture of iron stores that are just about managing but not thriving, and this is very likely contributing to her fatigue and poor recovery.\n\nHer folate is 14, which is within the laboratory range of 3 to 17 and above the optimal floor of 8, so unlike her previous episode of low folate, this is currently healthy. Her vitamin B12 is 367. The laboratory range is 193 to 982, but the optimal range is 500 to 900, placing her well below the optimal floor. At this level, B12 is adequate to prevent deficiency symptoms but not high enough to support optimal nerve function, energy metabolism and mood regulation. Given her symptoms of low mood, anxiety, fatigue and the neurological component of her tendon and recovery issues, improving B12 would be worthwhile.\n\nHer vitamin D is 52, which is just above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. Vitamin D plays a critical role in immune regulation, bone health, muscle function and mood. In the context of Hashimoto's thyroiditis, adequate vitamin D is particularly important because vitamin D modulates the immune system and low levels are associated with more aggressive autoimmune activity. At 52, supplementation is needed to bring her into the optimal range.\n\nHer ALT is 33. The laboratory range is below 56, but the optimal level for women is below 25. GGT is 35 against a female optimal of below 25 and a female upper limit of 38. Both are within the laboratory range but above optimal, and together they suggest the liver is under a small amount of metabolic strain. At her BMI of 22.3, this is not weight-driven. The most likely explanations are the autoimmune inflammatory burden from Hashimoto's, or dietary factors. Her NAFLD fibrosis score is minus 3.59, which rules out any liver scarring, and her APRI score is 0.25, also reassuring. This is not a concern that needs GP input, but it is worth monitoring.\n\nHer hormonal picture is consistent with a midcycle or periovulatory sample. Her oestradiol is 1324, which sits right at the top of the midcycle reference range of 234 to 1309, and her LH is 40.6, which falls within the midcycle surge range of 8.7 to 76.3. Her FSH is 15.71, within the midcycle range. Her progesterone is 4.38, within the follicular range of 0 to 4.45, which is expected if the sample was taken just before or during ovulation, before the corpus luteum has formed and begun producing progesterone. This hormonal pattern is entirely consistent with normal ovulatory cycling. Her testosterone is 1.1, within the female range of 0.5 to 2.6 and within the optimal band. Her free testosterone is 0.012, which the laboratory has flagged as above range against their reference of 0.01 to 0.25, but this appears to be a rounding artefact at the very bottom of the range and is not clinically meaningful. Her SHBG is 70.9, within range. Her DHEA-S is 4.9 micromoles per litre, equivalent to approximately 1,806 micrograms per decilitre, within range. Her prolactin is 403, within the non-pregnant range of 59 to 619.\n\nHer PhenoAge was not computed for this report as certain inputs were not available from the laboratory.\n\nHer MCH, mean corpuscular haemoglobin, which measures the average amount of haemoglobin in each red blood cell, is 33.3 against an upper limit of 32. Her MCHC, mean corpuscular haemoglobin concentration, is 346 against an upper limit of 345. Both are marginally above range. Her MCV, the average red blood cell size, is 96.3, within range but in the upper half. This pattern of slightly large, slightly haemoglobin-rich red cells can be seen with borderline B12 status, which fits with her B12 of 367 sitting below the optimal range. It is not a concern at these margins, but it is another reason to improve her B12 level.\n\nHer urea is 2.7, below the lower limit of 3.2. Urea is a waste product of protein metabolism, and a low level most commonly reflects low protein intake. Given that her diet volume is rated 5 out of 10 and she is on a standard mixed diet, she may simply not be eating enough protein to support her training, recovery and tendon health. This is an important finding in the context of her chronic tendon injuries and poor recovery, because tendons are built from collagen, and collagen synthesis depends on adequate protein intake alongside vitamin C. Her urea to creatinine ratio is 41.5, sitting right at the lower boundary of the reference range of 40 to 100 and below the optimal floor of 45, which reinforces the picture of protein intake being on the low side.","links":"The thread running through this report connects three findings: Hashimoto's thyroiditis confirmed by strongly positive TPO and thyroglobulin antibodies, borderline iron stores with a ferritin just below optimal, and suboptimal vitamin D and B12. Together, these create an environment where energy production, tissue repair and immune regulation are all operating below their potential, and this maps directly onto Eleni's symptoms of fatigue, poor exercise recovery, chronic tendon pain and low mood.\n\nThe Hashimoto's is the longest-standing finding and the one that needs formal medical oversight. Although her thyroid hormones remain within range, the combination of rising TSH, lower-half T4 and a decade of antibody positivity means the gland is likely being slowly damaged. Subclinical hypothyroidism, even before it shows up as an out-of-range TSH, can impair collagen turnover, slow tendon healing, reduce energy and contribute to mood disturbance, all of which she reports.\n\nThe iron, B12 and vitamin D findings are all correctable with targeted supplementation and dietary adjustment. Improving these will support red blood cell production, nerve and tendon health, immune modulation and mood. The low urea and diet volume of 5 out of 10 suggest she is not eating enough overall, and specifically not enough protein, to support the tissue repair her tendons need. This is the most actionable finding in the report and the one most likely to make a noticeable difference to how she feels within weeks.\n\nWhat was reassuringly excluded: rheumatoid factor is negative, ruling out rheumatoid arthritis as a driver of her joint symptoms. Coeliac disease is negative. All tumour markers are clear. Kidney function is healthy. Cardiovascular risk is as low as it can be. The liver shows no scarring despite mildly above-optimal enzymes.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon, or leftover chicken. Anchor: before anything else goes on the plate. Why: your urea of 2.7, below the lower limit of 3.2, tells us you are not eating enough protein to support tendon repair, recovery and collagen synthesis. Your target is at least 82 to 100 grams of protein per day.\nIncrease your overall food volume. Your diet quality is good at 7 out of 10, but your volume at 5 out of 10 means you are likely under-eating for someone who trains and walks regularly. Aim for around 1,800 to 2,000 calories per day to support recovery and maintain your weight. Anchor: plan three full meals rather than grazing, and do not skip meals on busy days.\nAdd foods rich in iron and vitamin C together at one meal per day. Red meat twice a week, lentils, chickpeas or dark leafy greens at other meals, with a squeeze of lemon, tomatoes or peppers alongside. Anchor: dinner is the easiest meal to build this into. Why: your ferritin of 38 is just below the optimal floor of 40 and your iron stores need rebuilding from food as well as supplements.\nInclude oily fish twice per week: salmon, mackerel, sardines or trout. Why: omega-3 fatty acids reduce the inflammatory burden on tendons and joints, support mood, and complement the anti-inflammatory effect of improving your vitamin D.\nAdd one dedicated 20-minute walk after your largest meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: post-meal walking improves insulin sensitivity, supports mood and adds low-impact movement that will not aggravate your tendons. This will bring your daily steps consistently above 10,000.\nAdd 5 to 10 grams of collagen peptides or gelatin with vitamin C 30 to 60 minutes before your bouldering or physio sessions. Why: research shows this protocol increases collagen synthesis in tendons and ligaments, which is directly relevant to your chronic tendon injuries and poor recovery.\nFix your wake time to the same time every day, weekdays and weekends, and get outside within 30 minutes of waking. Why: morning light regulates cortisol rhythm and serotonin production, both of which influence mood, anxiety and recovery. Your cortisol of 377 is healthy, but anchoring it to a consistent rhythm will support the low mood and anxiety you report.\nSet a caffeine cut-off at 1pm. Why: caffeine has a half-life of five to six hours and can impair sleep quality even when you fall asleep easily. Better sleep directly improves tendon recovery, mood and immune regulation, which matters more than usual with active Hashimoto's antibodies.","flags":"Thyroid peroxidase antibodies 269.5 (limit below 13.8) and thyroglobulin antibodies 37.7 (limit below 4.4). Both strongly positive, consistent with Hashimoto's thyroiditis. TSH 2.35 within range but in upper half of optimal, FT4 15.3 in lower half of range. Thyroid hormones currently adequate but the antibody burden and family history warrant annual monitoring and GP discussion about a management plan.\nFerritin 38 (optimal 40 to 150 for women), transferrin 2.35 (below lower limit of 2.5), transferrin saturation 23% (below optimal floor of 25%), absolute reticulocytes 47 (below lower limit of 50). Iron stores are borderline low with early signs of restricted red cell production. Previous documented low ferritin requiring supplementation. Iron replacement indicated.\nVitamin B12 367 (optimal 500 to 900). Below optimal with MCH 33.3 above the upper limit of 32 and MCHC 346 marginally above the upper limit of 345, suggesting early macrocytic tendency consistent with suboptimal B12.\nVitamin D 52 (optimal 75 to 120). Insufficient for optimal immune modulation, particularly relevant with active Hashimoto's antibodies.\nUrea 2.7 (below lower limit of 3.2). Most likely reflects insufficient dietary protein intake. Urea to creatinine ratio 41.5, at the lower boundary of range.\nALT 33 (female optimal below 25) and GGT 35 (female optimal below 25). Both within laboratory range but above optimal. No fibrosis: FIB-4 0.65, APRI 0.25, NAFLD fibrosis score minus 3.59. Monitor on retest.\nSystemic Immune-Inflammation Index 631 (upper limit 600, optimal ceiling 450). Marginally above the reference range, most likely driven by the autoimmune thyroid activity rather than infection or acute illness, given clean CRP and ESR.\nFree testosterone 0.012 (lab range 0.01 to 0.25). Flagged by laboratory as above range but this is a rounding artefact at the bottom of the scale and is not clinically meaningful.\nOestradiol 1324, LH 40.6, FSH 15.71, progesterone 4.38. Hormonal pattern consistent with midcycle or periovulatory timing. Not a concern.\nReassuring negatives: rheumatoid factor negative, coeliac screen negative, all tumour markers clear, CRP below 0.5, ESR 11, kidney function healthy with eGFR 94, Lp(a) below 25, cardiovascular risk score 0 out of 100, immunoglobulins balanced, IgE normal, creatine kinase normal, calcium and magnesium within optimal range, cortisol within morning range, pancreatic enzymes normal.\nNot returned by the laboratory: bacterial count and urine culture and sensitivities are pending.","recommendations":"Discuss thyroid management with your GP. Bring these numbers: TPO antibodies 269.5 (limit 13.8), thyroglobulin antibodies 37.7 (limit 4.4), TSH 2.35, FT4 15.3, FT3 4.9. Request annual monitoring of TSH, FT4 and FT3 given the confirmed autoimmune antibody pattern, family history of Hashimoto's, and symptoms of fatigue, poor recovery and low mood. Ask at what TSH threshold your GP would consider starting levothyroxine.\nDiscuss iron replacement with your GP. Bring these numbers: ferritin 38 (optimal above 40), transferrin 2.35 (below range), saturation 23%, reticulocytes 47 (below range). You have a documented history of low ferritin. Given the borderline stores and symptoms of fatigue, cramps and poor recovery, a course of iron supplementation is appropriate. Ask about checking for underlying causes of poor iron absorption if stores do not improve after three months of supplementation.\nRequest a vitamin D level recheck in three months after supplementation has begun, aiming for a level above 75. Mention the Hashimoto's antibodies, as your GP may wish to aim for above 100 given the autoimmune context.\nIf cramps, tendon pain or recovery do not improve after three months of correcting iron, B12 and vitamin D, discuss referral for a connective tissue assessment given your history of overuse injuries, poor tendon recovery and joint hypermobility-type symptoms.\nAim for 1,800 to 2,000 calories per day with a protein target of 82 to 100 grams per day, based on your weight of 63 kilograms at 1.3 to 1.6 grams per kilogram for your activity level. Retest in four to six months, repeating TSH, FT4, FT3, ferritin, transferrin, transferrin saturation, full blood count, vitamin D, B12, ALT and GGT to track progress.","supplementation":"Vitamin D3 (cholecalciferol), 3,000 IU daily, taken with your largest meal that contains fat. Why: your level is 52 and needs to reach 75 to 120 for optimal immune regulation, which is particularly important with active Hashimoto's antibodies. Take consistently for at least three months before retesting.\nVitamin K2 (MK-7), 100 micrograms daily, taken at the same time as your vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones and teeth rather than soft tissues and arteries.\nIron as ferrous bisglycinate, 25 milligrams every other day, taken with a source of vitamin C such as orange juice or a kiwi fruit, away from tea, coffee and dairy. Why: your ferritin of 38 is below the optimal floor of 40, your transferrin is below range at 2.35, and your reticulocyte count is marginally low. Every-other-day dosing is better absorbed than daily for this level of deficiency. Take for three months and retest ferritin before continuing.\nVitamin B12 as sublingual methylcobalamin, 1,000 micrograms daily, dissolved under the tongue. Why: your B12 of 367 is below the optimal floor of 500, and your MCH of 33.3 above range suggests early red cell enlargement consistent with suboptimal B12. Sublingual delivery bypasses absorption issues in the gut.\nMagnesium glycinate, 300 milligrams in the evening before bed. Why: your magnesium is 0.91, which is within range, but glycinate form specifically supports muscle relaxation, may help with your calf and foot cramps, and improves sleep quality. It also supports the conversion of vitamin D to its active form.\nCollagen peptides or gelatin, 5 to 10 grams with 50 milligrams of vitamin C, taken 30 to 60 minutes before bouldering or physio sessions. Why: this protocol has been shown to increase collagen synthesis in tendons and ligaments, directly relevant to your chronic tendon injuries.\nOmega-3 fish oil providing 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 reduces inflammatory signalling in tendons and joints, supports mood regulation, and may help modulate the autoimmune activity behind your Hashimoto's.\nThe most important changes from this report are not supplements. They are eating enough food, eating enough protein, getting annual thyroid monitoring from your GP, and maintaining consistent daily movement and sleep habits.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 69 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 91.8; capped below 70 while a system is rated \"See your GP\"; final 69.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3310","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4405","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index scored from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built, not the ten-year probability of an event. A score of 20 or below is ideal, 40 or below is acceptable, and above 40 is flagged. Eleni's score of 0 reflects her outstanding lipid profile across every input: low ApoB, low LDL, high HDL, very low triglycerides, normal Lp(a), minimal CRP and excellent HbA1c. This is as good as this score gets.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose (Fasting)","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5333","upper_optimal_position":"0.7093","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar without food. Eleni's level of 4.6 is within the optimal range of 4.0 to 5.4, indicating excellent glucose regulation. This, alongside her healthy HbA1c and insulin, confirms her blood sugar metabolism is working very well.","low_causes":"Fasting, excess insulin, intense exercise, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, high carbohydrate intake, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c expressed as a percentage is the older way of reporting this marker. Eleni's 5.3% is well within the normal threshold of below 6.0% and confirms excellent blood sugar management over the past two to three months. The mmol/mol value below is used for clinical decisions.","low_causes":"","high_causes":"Sustained high blood sugar, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning it has had sugar molecules attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Eleni's level of 34 is well below the optimal ceiling of 36 and the normal threshold of 42, confirming that her blood sugar has been consistently well controlled. This is an excellent result.","low_causes":"","high_causes":"Sustained high blood sugar, pre-diabetes, diabetes, reduced red cell lifespan","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3959","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5754","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing to keep blood sugar in check. Insulin is the hormone that unlocks cells to allow glucose in. A low fasting insulin, as seen here, means the body's cells are responding well to insulin and the pancreas does not need to produce much to maintain normal blood sugar. Eleni's level of 6.19 is within the optimal range of 2 to 8, confirming excellent insulin sensitivity.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, obesity, PCOS, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"387","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"364","upper_normal":"1456","lower_optimal":"500","upper_optimal":"1200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4578","upper_optimal_position":"0.6111","units":"pmol/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, so it provides a direct measure of how much insulin the pancreas is producing. Unlike insulin itself, C-Peptide is not cleared by the liver, making it a more reliable indicator. Eleni's level of 387 pmol/L (converted from 1.17 ug/L) is within the laboratory range but just below the nt with her B12 of 367 sitting below the optimal floor. This is not a clinical concern at this level but adds weight to the recommendation to supplement B12.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, hypothyroidism, alcohol, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Corpuscular Haemoglobin Concentration","group":"HEMATOLOGY","result":"346","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the concentration of haemoglobin within each red blood cell. It reflects how densely packed the haemoglobin is. Eleni's MCHC of 346 is marginally above the upper limit of 345, which at this margin is most likely laboratory variation or a very slight effect of sample temperature and storage, as noted by the laboratory. It does not indicate a clinical problem.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"256","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4718","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"370","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6179","units":"x10^9/L","description":"Platelets are small cell fragments that form clots to stop bleeding. They are produced in the bone marrow and circulate for about ten days. Eleni's platelet count of 256 is within the optimal range, confirming healthy platelet production and no e Ratio","group":"INFLAMMATION","result":"195.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6342","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio divides the platelet count by the lymphocyte count. Like the NLR, it provides a window into systemic inflammation and immune balance. Eleni's ratio of 195.4 is within the laboratory range of 60 to 210 but above the optimal ceiling of 160. Again, this is driven by the lymphocyte count of 1.31 sitting below optimal rather than by an elevated platelet count. Platelets at 256 are healthy.","low_causes":"Thrombocytopenia, lymphocytosis","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"631","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6873","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index, or SII, is calculated by multiplying neutrophils by platelets and dividing by lymphocytes. It provides a composite picture of the immune and inflammatory state. Eleni's SII of 631 is marginally above the upper limit of 600. This is being driven primarily by her lymphocytes sitting at 1.31, below the optimal floor, which inflates the ratio. With a CRP below 0.5 and an ESR of 11, there is no active systemic inflammation, and this finding is most likely a reflection of the low-grade immune remodelling associated with her Hashimoto's antibodies rather than a separate inflammatory process.","low_causes":"Lymphocytosis, thrombocytopenia, neutropenia","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"23.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3801","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5162","units":"%","description":"Transferrin saturation measures what percentage of the body's iron transport protein, transferrin, is loaded with iron. It reflects how much iron is available for delivery to tissues. Eleni's saturation of 23.21% is within the laboratory range of 18 to 55 but below the optimal floor of 25%. This means the iron transport system is not fully loaded, which is consistent with her borderline ferritin of 38 and low transferrin of 2.35. It confirms that while she is not iron deficient by strict laboratory criteria, her iron supply system is running lean.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"13.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3886","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4123","upper_optimal_position":"0.5825","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and with meals, so it is less reliable than ferritin as a measure of overall stores. Eleni's level of 13.7 is within the laboratory range but just below the optimal floor of 14, consistent with the broader picture of borderline iron status.","low_causes":"Iron deficiency, chronic disease, heavy menstrual loss, poor dietary intake","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2051","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"g/L","description":"Transferrin is the protein that carries iron around the blood, delivering it to cells that need it. In iron deficiency, transferrin usually rises as the body tries to capture more iron. In inflammation or autoimmune conditions, transferrin can be suppressed because it acts as a negative acute phase protein, meaning the body makes less of it during immune activation. Eleni's transferrin of 2.35 is just below the lower limit of 2.5. Given her excellent CRP and only mildly elevated ESR, the most likely explanation is the chronic low-grade immune activation from her Hashimoto's antibodies subtly suppressing transferrin production. This is not a concern in itself but does mean her iron transport capacity is slightly reduced, which compounds the effect of her borderline ferritin.","low_causes":"Chronic inflammation, autoimmune conditions, liver disease, malnutrition, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"57.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4700","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3749","upper_optimal_position":"0.6143","units":"umol/L","description":"TIBC, or total iron binding capacity, measures the maximum amount of iron that transferrin can carry. It reflects the blood's total capacity to transport iron. Eleni's TIBC of 57.1 is within the optimal range, which is somewhat reassuring despite the transferrin itself being marginally low.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3665","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4368","upper_optimal_position":"0.5179","units":"ng/ml","description":"Ferritin is the body's main iron storage protein. Each molecule of ferritin can hold thousands of iron atoms, releasing them as needed for red blood cell production, energy metabolism and immune function. Eleni's ferritin of 38 is within the laboratory range of 10 to 291 but just below the optimal floor of 40 for a woman of her age and activity level. Given her documented history of low ferritin requiring supplementation over a year ago, and her symptoms of fatigue, poor exercise recovery and muscle cramps, this confirms that her iron stores have drifted back down after stopping the supplements without GP follow-up. This is the most actionable nutritional finding in her report.","low_causes":"Low dietary iron intake, heavy menstrual loss, malabsorption, endurance exercise, vegetarian or vegan diet","high_causes":"Haemochromatosis, inflammation, infection, liver disease, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/L","description":"Sodium is the major mineral in the fluid outside cells. It regulates fluid balance, blood pressure and nerve function. Eleni's sodium of 141 is within the optimal range.","low_causes":"Excess water intake, diuretics, heart failure, liver disease, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5926","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is the major mineral inside cells, essential for nerve conduction, muscle contraction and heart rhythm. Eleni's potassium of 4.9 is within the laboratory range of 3.5 to 5.3 but above the optimal ceiling of 4.8. The laboratory notes that potassium can be slightly elevated if the sample is delayed or has been on cells, which is a common sample-related effect. At this margin and with normal kidney function, this is not a concern.","low_causes":"Diuretics, vomiting, diarrhoea, excess sweating, low dietary intake","high_causes":"Sample delay, kidney disease, ACE inhibitors, excess supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chlo ni's phosphate of 1.0 is within the optimal range.","low_causes":"Vitamin D deficiency, hyperparathyroidism, refeeding syndrome, alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle contraction, nerve function, energy production and bone formation. It is particularly important for muscle relaxation, and deficiency is a common contributor to cramps. Eleni's magnesium of 0.91 is within the optimal range of 0.85 to 1.05. However, blood magnesium only reflects about 1% of total body stores, so it is possible to have adequate blood levels while tissue stores are depleted. Given her calf and foot cramps, supplementation with magnesium glycinate is still worthwhile.","low_causes":"Poor dietary intake, excess alcohol, diuretics, chronic diarrhoea, diabetes","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uricacid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"213","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3679","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in many foods and in the body's own cells. The kidneys clear it from the blood. At moderate levels it acts as an antioxidant, but at high levels it can crystallise in joints causing gout and can contribute to kidney stones and cardiovascular risk. Eleni's uric acid of 213 is within the laboratory range and within the optimal band for a woman of 160 to 320.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High purine diet, kidney disease, excess alcohol, obesity, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"12.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3600","lower_normal":"10","upper_normal":"20","lower_optimal":"10","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"mmol/L","description":"The anion gap is calculated from sodium, potassium, chloride and bicarbonate and reflects the balance of unmeasured charged particles in the blood. It is used to help identify the cause of metabolic acidosis. Eleni's anion gap of 12.7 is within the optimal range, confirming normal acid-base chemistry.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Diabetic ketoacidosis, lactic acidosis, toxin ingestion, kidney failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-Corrected Sodium is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"289.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5717","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Calculated Serum Osmolality is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumincorrectedaniongap","name":"Albumin-Corrected Anion Gap","group":"ELECTROLYTES & MINERALS","result":"12.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"The albumin-corrected anion gap adjusts the standard anion gap for variations in albumin, since albumin is a major unmeasured anion. This provides a more accurate assessment when albumin is not at the standard level of 40 g/L. Eleni's albumin is 43, close to the assumed standard, so her corrected value of 12.7 is essentially the same as her uncorrected anion gap. This is reported for context and is not applicable as a separate concern at present.","low_causes":"Low albumin, laboratory error","high_causes":"Dietary acid load, reduced kidney clearance, ketosis, dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"2.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2300","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product created when the liver breaks down protein. The kidneys then filter it out of the blood and excrete it in urine. A low urea level most commonly indicates that not enough protein is being eaten, because less protein breakdown means less urea production. Eleni's urea of 2.7 is below the lower limit of 3.2. Her kidney function is excellent, with an eGFR of 94, so the kidneys are not the issue. This finding most likely reflects insufficient dietary protein intake, which is consistent with her diet volume rating of 5 out of 10. In the context of chronic tendon injuries and poor recovery, inadequate protein intake is particularly relevant because tendons and ligaments depend on a steady supply of amino acids from dietary protein to repair and remodel.","low_causes":"Low protein intake, liver disease, overhydration, malnutrition","high_causes":"High protein intake, dehydration, kidney disease, gastrointestinal bleeding, catabolic states","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4634","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6098","units":"umol/L","description":"Creatinine is a waste product from normal muscle metabolism, filtered out by the kidneys. It reflects both muscle mass and kidney function. Eleni's creatinine of 65 is within the optimal range for a woman of her build.","low_causes":"Low muscle mass, liver disease, vegetarian diet","high_causes":"Kidney disease, dehydration, high meat intake, intense exercise, high muscle mass","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5000","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR, or estimated glomerular filtration rate, calculates how much blood the kidneys are filtering per minute using the creatinine level, age and sex. A value above 90 is considered optimal. The lab reported Eleni's creatinine-based eGFR as greater than 90, confirming healthy kidney filtration. The cystatin C-based eGFR (below) provides a complementary measurement.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, medications","high_causes":"High cardiac output, early diabetes, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.99","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.45","units":"mg/L","description":"Cystatin C is a protein produced at a constant rate by all nucleated cells. Unlike creatinine, its blood level is not affected by muscle mass, diet or sex, making it a more accurate marker of kidney function. Eleni's cystatin C of 0.97 is within the optimal range, confirming that her kidneys are filtering well.","low_causes":"","high_causes":"Reduced kidney function, thyroid disease, inflammation, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcystatinc","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5222","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5000","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C rather than creatinine. Because cystatin C is not influenced by muscle mass, it gives a more accurate picture of kidney function, particularly in people with very low or very high muscle mass. Eleni's cystatin C eGFR of 94 confirms healthy kidney filtration and is consistent with her creatinine-based eGFR.","low_causes":"Chronic kidney disease, acute kidney injury","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C to estimate kidney filtration rate, and is considered the most accurate of the three eGFR calculations. Eleni's combined eGFR of 94 is within the optimal range of above 90, confirming that her kidneys are functioning well.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"41.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3417","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between different causes of abnormal urea or creatinine. Eleni's ratio of 41.5 sits right at the lower boundary of the reference range of 40 to 100 and below the optimal floor of 45. This is driven by her low urea of 2.7, which reflects low protein intake, rather than by any kidney problem. Her creatinine and eGFR are both healthy.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6187","units":"g/L","description":"Total protein measures the combined level of albumin and globulins in the blood. Albumin is produced by the liver and maintains fluid balance, while globulins include immune proteins and transport molecules. Eleni's total protein of 76 is within the optimal range, confirming adequate liver synthetic function and protein status.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, autoimmune conditions, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and drugs through the bloodstream and maintains the pressure that keeps fluid inside blood vessels. It is also a marker of nutritional status and liver health. Eleni's albumin of 43 is within the optimal range.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin is the umbrella term for all blood proteins other than albumin. It includes immunoglobulins, transport proteins and clotting factors. Eleni's globulin of 33 is within the laboratory range but above the optimal ceiling of 32. A slightly elevated globulin can reflect increased immune protein production, which is consistent with her active autoimmune thyroid antibodies. Her individual immunoglobulin levels are all within range, so this is not a concern.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, autoimmune conditions, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0. tion":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Elevated bilirubin can indicate liver disease or excessive red cell breakdown, while very high levels cause jaundice. Eleni's bilirubin of 8 is within the optimal range.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2946","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that leaks into the blood when liver cells are damaged or inflamed. It is the most specific marker of liver cell injury. Eleni's ALT of 33 is within the laboratory range of below 56, but above the female optimal threshold of below 25. This mild elevation is not a concern for liver disease, as all fibrosis and scarring markers are well within range, but it does suggest the liver is under a small amount of metabolic or inflammatory strain. The most likely contributor is the chronic low-grade immune activity from her Hashimoto's antibodies.","low_causes":"","high_causes":"Liver disease, medications, alcohol, obesity, strenuous exercise, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2035","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5208","unit
