h_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"0.79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3967","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio divides AST by ALT. When ALT is higher than AST (ratio below 1), it typically indicates mild liver cell inflammation, as seen in fatty liver. When AST exceeds ALT (ratio above 2), it can indicate more advanced liver disease or alcohol-related damage. Eleni's ratio of 0.79 is within the laboratory range but just below the optimal floor of 0.8. This is driven by her ALT of 33 being slightly higher than her AST of 26. The pattern is consistent with mild hepatocyte stress rather than any significant liver condition.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4242","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands. It breaks down starch into sugars. Elevated levels can indicate pancreatic inflammation. Eleni's amylase of 54 is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4468","lower_normal":"13","upper_normal":"60","lower_optimal":"20","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3819","upper_optimal_position":"0.6241","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down fats. It is more specific to the pancreas than amylase. Eleni's lipase of 38 is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4055","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the combined amount of all cholesterol types in the blood, including LDL, HDL and VLDL. On its own it is a limited measure because it does not distinguish between protective HDL and harmful LDL. Eleni's total cholesterol of 4.2 is within the desirable range of below 5.18 and well within the optimal ceiling of 5.0.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet, hypothyroidism, familial hypercholesterolaemia, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.55","within_normal" "upper_normal_position":"1","lower_optimal_position":"0.5000","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is often called the 'good' cholesterol because it removes cholesterol from artery walls and carries it back to the liver for disposal. Higher levels are protective against cardiovascular disease. Eleni's HDL of 2.1 is excellent, well above the optimal threshold of 1.6 for women. This is one of the strongest markers in her report.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, poor diet","high_causes":"Regular exercise, genetic factors, moderate alcohol intake, high-fat diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3050","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5733","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol into artery walls where it can build up as plaque. It is the primary driver of atherosclerosis. Eleni's LDL of 1.83 is well within the optimal target of below 2.6. Combined with her excellent HDL and low triglycerides, this gives her an outstanding lipid profile.","low_causes":"Hyperthyroidism, malnutrition, liver disease, statin therapy","high_causes":"High saturated fat diet, hypothyroidism, familial hypercholesterolaemia, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2222","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL to give a simple measure of cardiovascular risk. A lower number is better. Eleni's ratio of 2.0 is excellent, well within the optimal target of below 3.5.","low_causes":"","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6250","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5000","upper_optimal_position":"1","units":"%","description":"This shows what percentage of total cholesterol is made up of protective HDL. A higher percentage is better, with above 20% being the minimum and above 30% being desirable. Eleni's HDL makes up 50% of her total cholesterol, which is an outstanding result reflecting the dominance of protective cholesterol in her profile.","low_causes":"Low HDL, obesity, insulin resistance, sedentary lifestyle","high_causes":"High HDL, exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially harmful cholesterol types, including LDL, VLDL and remnant particles, in one number. Eleni's non-HDL of 2.1 is within the optimal target of below 3.4, confirming low atherogenic cholesterol.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, hypothyroidism, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6786","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5000","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It reflects the number and function of HDL particles and is a direct measure of the reverse cholesterol transport system. Eleni's ApoA1 of 1.9 is well above the desirable threshold of 1.4, consistent with her excellent HDL level.","low_causes":"Genetic factors, smoking, sedentary lifestyle, obesity, metabolic syndrome","high_causes":"Regular exercise, genetic factors, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2889","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein found on each LDL, VLDL and Lp(a) particle. Because there is exactly one ApoB molecule per particle, measuring ApoB tells you the total number of atherogenic particles in the blood, which is a better predictor of cardiovascular risk than LDL cholesterol alone. Eleni's ApoB of 0.52 is well within the optimal target of below 0.8, confirming a low number of harmful particles. This is an excellent result.","low_causes":"Hyperthyroidism, malnutrition, liver disease, statin therapy","high_causes":"High saturated fat diet, familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2250","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful cholesterol particles to the number of protective ones. It is one of the best single summary measures of cardiovascular lipid risk. A ratio below 0.6 is lower risk, and Eleni's ratio of 0.27 is outstanding, well within the optimal range. This means her protective particles vastly outnumber the harmful ones.","low_causes":"","high_causes":"High ApoB, low ApoA1, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). High levels independently increase cardiovascular risk through three mechanisms: depositing cholesterol in artery walls, promoting blood clot formation, and driving inflammation. Because Lp(a) is almost entirely determined by genetics, its level cannot be changed by diet, exercise or most medications. Eleni's Lp(a) is below 25, which is normal and below the 32 threshold. This is genuinely useful information because it means her entire lipid profile is driven by modifiable lifestyle factors rather than inherited risk. It only needs to be tested once in a lifetime.","low_causes":"","high_causes":"Genetic inheritance (not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0867","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful proxy for insulin resistance and metabolic health. A ratio below 0.87 is considered optimal. Eleni's ratio of 0.26 is outstanding and reflects her excellent insulin sensitivity and metabolic health.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1688","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich lipoproteins, mainly VLDL and intermediate-density lipoproteins. It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent cardiovascular risk factor. Eleni's remnant cholesterol of 0.27 is within the optimal range of below 0.5, confirming low levels of these atherogenic remnant particles.","low_causes":"","high_causes":"High triglycerides, insulin resistance, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"1.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2917","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol contribution of Lp(a) particles from the total LDL, showing how much of the LDL is truly modifiable by diet and lifestyle. Eleni's corrected LDL of 1.75 is within the optimal range of below 2, confirming that virtually all of her already low LDL is within her control.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.582","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4485","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from the logarithm of the triglyceride to HDL ratio. It reflects the balance between atherogenic and protective lipoproteins and predicts the size of LDL particles. A value below 0.11 is optimal and indicates predominantly large, buoyant LDL particles which are less likely to penetrate artery walls. Eleni's index of minus 0.582 is well within the optimal range.","low_causes":"","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"0.87","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1243","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The LDL to HDL ratio divides harmful LDL by protective HDL. A lower number is better, with below 2.5 considered optimal. Eleni's ratio of 0.87 is excellent, reflecting her high HDL and low LDL.","low_causes":"","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2167","lower_normal":"0","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.3125","upper_optimal_position":"0.5","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone produced in the skin in response to sunlight and obtained from a small number of foods. It is essential for calcium absorption, bone health, immune regulation, muscle function and mood. Eleni's level of 52 is just above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. Vitamin D is particularly important in the context of Hashimoto's thyroiditis, because it plays a key role in modulating the immune system. Low vitamin D levels are associated with more active autoimmune disease. Supplementation to bring her level above 75 is recommended.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption, northern latitude, winter","high_causes":"Excess supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.866","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4296","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3724","upper_optimal_position":"0.5400","units":"pmol/L","description":"Parathyroid hormone, or PTH, is produced by the four parathyroid glands in the neck. It regulates calcium levels in the blood by controlling calcium release from bones, calcium absorption from the gut (via vitamin D activation), and calcium retention by the kidneys. Eleni's PTH of 1.87 is within the optimal range. Importantly, despite her vitamin D being below optimal at 52, her PTH has not risen to compensate, which means her calcium regulation is still functioning well. However, as vitamin D falls further, PTH would be expected to rise, so maintaining adequate vitamin D protects this balance.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency, post-thyroidectomy","high_causes":"Vitamin D deficiency, kidney disease, parathyroid adenoma, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"367","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4054","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5558","upper_optimal_position":"0.6454","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell maturation, DNA synthesis and mood regulation. It is found in animal products including meat, fish, eggs and dairy. Eleni's B12 of 367 is within the laboratory range of 193 to 982 but below the optimal floor of 500. At this level, B12 is adequate to prevent overt deficiency but not high enough to support optimal function. Her MCH of 33.3, marginally above range, suggests the early effect of suboptimal B12 on red cell maturation. Given her symptoms of low mood, fatigue and neurological involvement in her tendon issues, improving B12 to the optimal range is recommended. Sublingual methylcobalamin is the preferred form because it bypasses the gut and delivers the active form of the vitamin directly.","low_causes":"Low dietary intake, vegetarian or vegan diet, pernicious anaemia, malabsorption, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, cell division and red blood cell production. It works closely with B12 in these processes. Eleni's folate of 14 is within the optimal range of above 8. This is a genuine improvement from her previous documented low folate, and confirms that her diet is providing adequate folate. No supplementation is needed for folate at present.","low_causes":"Poor dietary intake, alcohol, pregnancy, malabsorption, certain medications","high_causes":"Supplementation, excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5178","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3809","upper_optimal_position":"0.6190","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which are unstable molecules that damage cells and drive ageing and disease. It reflects dietary antioxidant intake from fruits, vegetables, tea, coffee and other sources. Eleni's TAA of 1.56 is within the optimal range, suggesting good dietary antioxidant intake consistent with her diet quality rating of 7 out of 10.","low_causes":"Poor dietary antioxidant intake, chronic illness, oxidative stress","high_causes":"High fruit and vegetable intake, antioxidant supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4460","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4808","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland in the brain. It is the signal that tells the thyroid gland to produce more thyroid hormones. When the thyroid is underperforming, TSH rises as the brain pushes harder. When the thyroid is overactive, TSH falls. Eleni's TSH of 2.35 is within the laboratory range and within the optimal band of 1.0 to 2.5, but it is approaching the upper end of the optimal window. In the context of her strongly positive thyroid antibodies and family history of Hashimoto's, a TSH at 2.35 is worth monitoring annually. If it continues to rise above 2.5, and particularly above 4.0, it would indicate the thyroid is beginning to fail and treatment may be needed.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease, early pregnancy","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3624","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3560","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4, or free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. 'Free' means it is not bound to proteins and is available for use. Eleni's FT4 of 15.3 is within the optimal range of 14 to 20, though it sits in the lower portion. In the context of Hashimoto's, a T4 in the lower half of range alongside a TSH approaching the upper end of optimal suggests the thyroid is working harder to maintain output. This is not yet a problem but is the pattern to watch on future tests.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, pituitary disease, severe illness","high_causes":"Hyperthyroidism, Graves' disease, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4852","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the most active thyroid hormone. It is produced mainly by the conversion of T4 in tissues including the liver, kidneys and muscles. T3 drives metabolic rate, energy production, body temperature and brain function. Eleni's FT3 of 4.9 is within the optimal range of 4.5 to 6.5, which is reassuring. It confirms that despite the autoimmune attack on her thyroid, the gland is still producing enough T4, and the body is converting it adequately into the active T3 that cells need.","low_causes":"Hypothyroidism, severe illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, Graves' disease, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"269.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9999","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3261","units":"U/ml","description":"Thyroid peroxidase antibodies, or TPO antibodies, are produced by the immune system and target an enzyme called thyroid peroxidase, which is essential for thyroid hormone production. Their presence indicates the immune system is attacking the thyroid gland. Eleni's TPO antibodies are 269.5, nearly twenty times the upper limit of 13.8. This is a strongly positive result consistent with Hashimoto's thyroiditis, an autoimmune condition where the immune system gradually destroys thyroid tissue. Her family history of Hashimoto's and her previous detection of antibodies a decade ago confirm this is a long-standing autoimmune process. While her thyroid hormones remain within range for now, annual monitoring is essential because the antibody burden predicts eventual thyroid failure in a significant proportion of people.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"37.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9999","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1477","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. Like TPO antibodies, their presence indicates an autoimmune attack on the thyroid. More than 80% of the population have undetectable levels. Eleni's thyroglobulin antibodies are 37.7, more than eight times the upper limit of 4.4. The presence of both TPO and thyroglobulin antibodies together strongly supports the pattern of Hashimoto's thyroiditis. This dual positivity, combined with her family history, means the diagnosis is as clear as blood tests can make it.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage hormone T4 into the active hormone T3. A healthy ratio indicates good peripheral conversion. Eleni's ratio of 0.32 is within the optimal range of 0.27 to 0.40, confirming that her tissues are converting T4 to T3 adequately despite the autoimmune thyroid activity.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"377","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4098","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5818","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning to help with waking and energy, and falling through the day. It regulates blood sugar, immune function, inflammation and the stress response. Eleni's morning cortisol of 377 is within the optimal range, confirming healthy adrenal function and an appropriate morning cortisol peak.","low_causes":"Adrenal insufficiency, chronic stress leading to adrenal fatigue, pituitary disease","high_causes":"Acute stress, Cushing's syndrome, steroid medication, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"1324","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"234.5","upper_normal":"1309.1","lower_optimal":"234.5","upper_optimal":"1309.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen in premenopausal women. Its level fluctuates dramatically through the menstrual cycle, peaking just before ovulation during the midcycle surge. Eleni's oestradiol of 1324 is at the top of the midcycle reference range of 234.5 to 1309.1, consistent with her sample being taken around the time of ovulation. This, combined with her elevated LH, confirms a midcycle surge pattern. This is a normal finding for a woman with regular ovulatory cycles.","low_causes":"Menopause, perimenopause, hypothalamic amenorrhoea, PCOS, low body fat","high_causes":"Midcycle surge, pregnancy, oestrogen-producing tumours, obesity, HRT","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"4.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone is produced mainly by the corpus luteum after ovulation and is essential for preparing the uterine lining for pregnancy and maintaining early pregnancy. In the follicular phase, before ovulation, progesterone is low. Eleni's progesterone of 4.38 falls within the follicular phase reference range of 0 to 4.45. Given her oestradiol and LH pattern suggesting a midcycle sample, this low progesterone is entirely expected because ovulation has either just occurred or is about to occur, and the corpus luteum has not yet begun producing progesterone. To confirm adequate progesterone production, a blood test taken seven days after ovulation (day 21 of a 28-day cycle) would be needed.","low_causes":"Anovulation, luteal phase defect, PCOS, perimenopause","high_causes":"Pregnancy, ovulation, luteal phase, adrenal overproduction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"40.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"8.7","upper_normal":"76.3","lower_optimal":"8.7","upper_optimal":"76.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"Luteinising hormone, or LH, is produced by the pituitary gland. In women, its primary role is to trigger ovulation. A dramatic surge in LH, often rising to several times its baseline level, occurs approximately 24 to 36 hours before the egg is released. Eleni's LH of 40.6 falls within the midcycle surge range of 8.7 to 76.3, consistent with the sample being taken around the time of ovulation. This is a normal finding.","low_causes":"Pituitary disease, hypothalamic amenorrhoea, excess exercise, low body weight","high_causes":"Midcycle surge, menopause, PCOS, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"15.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"3.4","upper_normal":"33.4","lower_optimal":"3.4","upper_optimal":"33.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"mIU/ml","description":"Follicle stimulating hormone, or FSH, is produced by the pituitary gland and stimulates the growth and maturation of ovarian follicles. It works alongside LH to regulate the menstrual cycle. Eleni's FSH of 15.71 falls within the midcycle reference range of 3.4 to 33.4, consistent with the overall midcycle timing of this sample. An FSH of 15.71 at age 37 is within normal limits. FSH below 25 in the follicular phase would be needed to assess ovarian reserve, and this sample was not taken in the follicular phase.","low_causes":"Pituitary disease, hypothalamic amenorrhoea, PCOS, pregnancy","high_causes":"Menopause, perimenopause, premature ovarian failure, midcycle surge","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.7","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5476","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands. Although present at much lower levels than in men, it plays important roles in energy, mood, libido, bone density and muscle maintenance. Eleni's testosterone of 1.1 is within the optimal range of 0.7 to 2.0 for women.","low_causes":"Ageing, adrenal insufficiency, oral contraceptives, pituitary disease","high_causes":"PCOS, adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.012","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3361","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.01","upper_optimal":"0.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to proteins like SHBG or albumin. Only free testosterone can enter cells and exert its effects. Eleni's free testosterone of 0.012 is within the laboratory range and within the optimal band. The laboratory flagged this as above range, but this appears to be a rounding artefact at the very bottom of a wide range and is not clinically meaningful. Her free testosterone is at the low end, which is consistent with her SHBG of 70.9 binding a higher proportion of her total testosterone.","low_causes":"High SHBG, ageing, oral contraceptives, hypothyroidism","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3917","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"","description":"The free androgen index, or FAI, is calculated from testosterone and SHBG. It provides an estimate of the biologically active testosterone. In women, a high FAI can indicate androgen excess, as seen in PCOS. Eleni's FAI of 1.55 is within the optimal range, confirming normal androgen activity.","low_causes":"High SHBG, low testosterone, oral contraceptives","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1806","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4804","lower_normal":"95.8","upper_normal":"4053.5","lower_optimal":"500","upper_optimal":"3000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3676","upper_optimal_position":"0.5659","units":"ug/dL","description":"DHEA-S, or dehydroepiandrosterone sulphate, is the most abundant steroid hormone in the body. It is produced by the adrenal glands and serves as a precursor to both testosterone and oestrogen. DHEA-S declines with age, and levels reflect adrenal function and biological ageing. Eleni's DHEA-S, converted from 4.9 umol/L, is approximately 1,806 ug/dL, which is within the optimal range. This confirms healthy adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumours, PCOS, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"403","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5196","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3560","upper_optimal_position":"0.6226","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. Its primary role is to stimulate breast milk production after childbirth, but it also plays roles in immune regulation and reproductive function. Outside of pregnancy and breastfeeding, very high levels can suppress ovulation and indicate a pituitary issue. Eleni's prolactin of 403 is within the non-pregnant reference range of 59 to 619 and within the optimal band.","low_causes":"Dopamine agonist medications, pituitary damage","high_causes":"Pregnancy, breastfeeding, pituitary tumour, hypothyroidism, medications, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"70.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4544","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3694","upper_optimal_position":"0.6135","units":"nmol/L","description":"SHBG, or sex hormone binding globulin, is a protein produced by the liver that binds to sex hormones, particularly testosterone and oestradiol, making them inactive. Only the hormones not bound to SHBG are 'free' and available to act on tissues. Eleni's SHBG of 70.9 is within the optimal range. A higher SHBG means more testosterone is bound and less is free, which explains why her free testosterone is at the lower end despite a healthy total testosterone.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism, excess androgens","high_causes":"Liver disease, hyperthyroidism, oral contraceptives, ageing, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creat function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
      if (lo == null && hi == null) return;
      n++; if (dist(b, useBase ? pv : cv) === 0) ok++;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 116); svg += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by the share of its markers in the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
