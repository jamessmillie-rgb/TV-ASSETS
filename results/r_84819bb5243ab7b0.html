333333333","upper_optimal_position":"0.4810","units":"IU/l","description":"ALP (alkaline phosphatase) is an enzyme found in the liver, bones, and bile ducts. It plays a role in bone mineralisation and can rise with liver or bone conditions. At 58, Eszter's ALP is within the normal range. Given her history of major fractures and ongoing bone healing, a normal ALP is reassuring and suggests bone turnover is not excessively elevated.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone disorders, liver disease, bile duct obstruction, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Elevated levels can indicate liver dysfunction or increased red cell breakdown. At 12, Eszter's bilirubin is well within the normal and optimal ranges, confirming the liver is processing and clearing bilirubin efficiently.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting liver function and immune health. At 69, Eszter's total protein is within the optimal range, confirming adequate protein production by the liver and normal immune protein levels.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications through the bloodstream and helps maintain fluid balance. At 43, Eszter's albumin is within the optimal range, confirming strong liver synthetic function.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/l","description":"Globulin is a group of proteins in the blood that includes antibodies (immunoglobulins) and transport proteins. It reflects immune function and inflammatory status. At 26, Eszter's globulin is within the optimal range, indicating balanced immune protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4643","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"","description":"The albumin to globulin ratio compares the two main protein groups in the blood. It helps assess liver function and immune status. At 1.65, Eszter's ratio is within the optimal range, reflecting a healthy balance between liver-produced albumin and immune-related globulins.","low_causes":"Liver disease, autoimmune conditions, kidney disease","high_causes":"Immunodeficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3690","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that uses age, ALT, AST, and platelet count to estimate the likelihood of liver fibrosis (scarring). At 1.07, Eszter's score is well below the threshold of 1.3 for her age group, indicating no suggestion of liver fibrosis. This confirms her liver is structurally healthy.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"116","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5568","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that helps break down starches. Elevated levels can indicate pancreatic inflammation. At 116, Eszter's amylase is within the normal range but near the upper boundary of 118. This is not a concern in isolation, particularly with her lipase (the more specific pancreatic enzyme) also within range at 51. Natural variation can place amylase at the higher end without any pancreatic issue.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5567","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is the most specific blood marker for pancreatic health. At 51, Eszter's lipase is within range, confirming her pancreas is functioning normally.","low_causes":"","high_causes":"Pancreatitis, pancreatic disease, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5890","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures all the cholesterol carried in the blood, including LDL, HDL, and VLDL. While not the most precise measure of cardiovascular risk on its own, a total cholesterol of 6.1 is above the desirable threshold of 5.18, reflecting the elevated LDL discussed elsewhere in this report. The total is partly offset by excellent HDL at 1.8.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, low physical activity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7460","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol is the form that deposits cholesterol into artery walls, driving the formation of plaques over time. It is the primary target for cardiovascular risk reduction. At 3.73, Eszter's LDL is above the upper limit of 3.0 and above the optimal target of below 2.6. This is the most important lipid marker to address through dietary changes. At 36, there is excellent opportunity to bring this down through increased soluble fibre, oily fish, and reduced saturated fat intake.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, low physical activity, low caloric intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"1.04","upper_normal":"1.55","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is the protective form that removes cholesterol from artery walls and carries it back to the liver for disposal. Higher levels are better. At 1.8, Eszter's HDL is excellent, well above both the desirable threshold of 1.55 and the optimal female target of 1.6. This is a genuine cardiovascular strength and partially offsets the elevated LDL.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, metabolic syndrome","high_causes":"Regular exercise, genetics, moderate alcohol consumption","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily influenced by recent food intake, carbohydrate consumption, and alcohol. Fasting levels below 1.7 are considered normal. At 1.41, Eszter's triglycerides are within the normal fasting range but above the optimal target of below 1.0. This is a minor finding and may be influenced by her carbohydrate to fat ratio in the diet.","low_causes":"Very low fat diet, hyperthyroidism, malnutrition","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. It is a precursor to LDL. At 0.64, Eszter's VLDL is within the normal range, indicating normal triglyceride transport.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity, excess carbohydrate intake","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3767","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk by comparing total cholesterol to the protective HDL fraction. A ratio below 4.5 is desirable. At 3.39, Eszter's ratio is within the optimal range, reflecting the strong protective effect of her high HDL.","low_causes":"","high_causes":"High LDL, low HDL, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3689","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"This shows what percentage of total cholesterol is made up of protective HDL. A higher percentage means a greater proportion of cholesterol is the helpful kind. At 29.51%, Eszter's HDL makes up a healthy proportion of her total cholesterol, which is a positive sign.","low_causes":"Low HDL, sedentary lifestyle, obesity","high_causes":"Regular exercise, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol, capturing all the potentially harmful cholesterol fractions (LDL, VLDL, and remnants) in one number. At 4.3, Eszter's non-HDL is above the target of below 4.0. This aligns with the elevated LDL and ApoB findings and reinforces the value of the dietary changes recommended.","low_causes":"","high_causes":"Elevated LDL, high triglycerides, diet, genetics, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3982","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA-I (apolipoprotein A-I) is the main protein on HDL particles and is essential for their protective function of removing cholesterol from artery walls. Higher levels are better. At 1.56, Eszter's ApoA-I is above the desirable threshold of 1.4 and within the optimal range above 1.5, reflecting her strong HDL function.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetics","high_causes":"Regular exercise, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB (apolipoprotein B) is a protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this is considered the single most accurate measure of how many cholesterol-carrying particles are circulating and available to enter artery walls. At 1.28, classified as high by the laboratory, Eszter's ApoB is significantly above the desirable target of below 0.9 and the optimal target of below 0.8. This is the most important lipid finding in this report and the primary target for dietary intervention.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Genetics, diet high in saturated fat, low physical activity, hypothyroidism, low caloric intake","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.821","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6842","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA-I ratio compares the number of atherogenic (artery-damaging) particles to protective particles. It is considered one of the best single predictors of cardiovascular risk. The female target is below 0.6, with above 0.8 classified as higher risk. At 0.821, Eszter's ratio is above the higher risk threshold, driven by her elevated ApoB rather than low ApoA-I (which is healthy at 1.56). Reducing ApoB through dietary changes would bring this ratio down.","low_causes":"","high_causes":"Elevated ApoB, low ApoA-I, poor diet, sedentary lifestyle, genetics","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Lp(a) is a genetically determined lipoprotein particle that acts like a particularly sticky form of LDL. It is entirely inherited and cannot be changed by diet, exercise, or most medications. It only needs to be measured once in a lifetime because the level is fixed from birth. This result is still pending and will be reported when available. Once known, it will provide important context for Eszter's elevated LDL and ApoB: if Lp(a) is normal, it confirms the lipid findings are driven entirely by modifiable factors. If Lp(a) is elevated, it means part of the cardiovascular risk is genetic, making it even more important to optimise the factors that can be changed.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"","one_sided":"","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2600","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin sensitivity and cardiovascular risk. A low ratio suggests the body is handling fats efficiently. At 0.78, Eszter's ratio is within the optimal range of below 0.87, confirming good metabolic fat handling despite the elevated LDL.","low_causes":"","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich particles (VLDL and IDL) after subtracting HDL and LDL from total cholesterol. It is an emerging cardiovascular risk marker. At 0.57, Eszter's remnant cholesterol is within the normal range of below 0.8 but slightly above the optimal target of below 0.5.","low_causes":"","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the sugar level in the blood after an overnight fast. It reflects how well the body regulates blood sugar. At 4.8, Eszter's glucose is within the optimal range of 4.0 to 5.4, indicating healthy blood sugar regulation.","low_causes":"Excess insulin, fasting, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, insulin resistance, stress, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar control over the past two to three months. At 5.4%, Eszter's result is within the normal range of below 6.0% and within the optimal range, confirming consistently healthy blood sugar levels over recent months.","low_causes":"Anaemia, blood loss, blood disorders","high_causes":"Diabetes, pre-diabetes, high sugar diet, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the IFCC unit of mmol/mol. At 35, Eszter's result is within the normal range of below 42 and within the optimal range of below 36, confirming excellent long-term blood sugar control.","low_causes":"Anaemia, blood loss, blood disorders","high_causes":"Diabetes, pre-diabetes, high sugar diet, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3489","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3153","upper_optimal_position":"0.4100","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to maintain blood sugar. Lower levels (within range) indicate the body needs very little insulin to keep glucose controlled, which is a sign of good insulin sensitivity. At 6.08, Eszter's insulin is within both the normal and optimal ranges, reflecting healthy insulin sensitivity.","low_causes":"Type 1 diabetes, low-carbohydrate diet, very lean body composition","high_causes":"Insulin resistance, pre-diabetes, obesity, high carbohydrate diet, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.689","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1567","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5455","units":"ug/l","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is used to assess how much insulin the body is producing, independent of injected insulin. At 0.689 (approximately 228 pmol/L), Eszter's C-Peptide is below the laboratory lower limit of 1.1. However, with her glucose at 4.8, HbA1c at 35, insulin at 6.08, and HOMA-IR at 1.3, blood sugar control is clearly working well. The low C-Peptide most likely reflects genuinely low insulin demand in a lean, low-calorie individual rather than pancreatic insufficiency. The laboratory also notes that C-Peptide can degrade in samples not separated within four hours.","low_causes":"Low insulin demand, lean body composition, low-carbohydrate diet, sample degradation","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and insulin to estimate how resistant the body's cells are to insulin's effects. A score below 1.0 indicates excellent insulin sensitivity, below 1.5 is normal, above 1.9 suggests early resistance, and above 2.9 indicates significant resistance. At 1.3, Eszter's score confirms she is insulin sensitive with no sign of insulin resistance.","low_causes":"","high_causes":"Obesity, sedentary lifestyle, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"93.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3842","lower_normal":"80","upper_normal":"200","lower_optimal":"100","upper_optimal":"180","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the insulin-producing beta cells in the pancreas are working. It is calculated from fasting insulin and glucose. At 93.5, Eszter's beta-cell function is within the normal range of 80 to 200, indicating her pancreas is producing insulin appropriately for her metabolic needs.","low_causes":"Low caloric intake, low-carbohydrate diet, pancreatic exhaustion, type 1 diabetes","high_causes":"Insulin resistance (compensatory overproduction), early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"hs-CRP (high-sensitivity C-reactive protein) is a marker of systemic inflammation produced by the liver. It is used to assess both general inflammation and cardiovascular risk. Levels below 1.0 are considered optimal, 1.0 to 3.0 average, and above 3.0 elevated. At 1.1, Eszter's CRP is within the laboratory range but slightly above the optimal threshold of 1.0. Given her chronic pain, post-traumatic osteoarthritis, and possible urinary tract infection, a mildly elevated inflammatory marker is not unexpected.","low_causes":"","high_causes":"Infection, chronic inflammation, autoimmune conditions, obesity, cardiovascular disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates increased levels of inflammatory proteins in the blood. At 20, Eszter's ESR is above the upper limit of 12 for her age. This is a non-specific marker, meaning it indicates inflammation is present somewhere in the body but does not pinpoint the source. In Eszter's case, her chronic pain, post-traumatic osteoarthritis, and possible urinary tract infection provide plausible explanations. This should be monitored on retest.","low_causes":"","high_causes":"Infection, chronic inflammation, autoimmune conditions, anaemia, pregnancy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/l","description":"Sodium is an essential electrolyte that regulates fluid balance, nerve function, and muscle contractions. At 141, Eszter's sodium is within the optimal range, indicating well-balanced fluid and electrolyte regulation.","low_causes":"Overhydration, diuretics, adrenal insufficiency, vomiting, diarrhoea","high_causes":"Dehydration, excessive salt intake, kidney disease, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6049","units":"mmol/l","description":"Potassium is an essential electrolyte critical for heart rhythm, muscle function, and nerve signalling. At 4.0, Eszter's potassium is within the optimal range, indicating healthy electrolyte balance.","low_causes":"Diuretics, vomiting, diarrhoea, poor dietary intake","high_causes":"Kidney disease, medications (ACE inhibitors, potassium-sparing diuretics), sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3538","upper_optimal_position":"0.6103","units":"mmol/l","description":"Chloride works with sodium and bicarbonate to maintain fluid balance and acid-base balance in the body. At 98, Eszter's chloride is within the optimal range.","low_causes":"Metabolic alkalosis, vomiting, overhydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"19.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3121","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3636","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is a buffer that helps maintain the acid-base balance of the blood. At 19.4, Eszter's bicarbonate is marginally below the lower limit of 20. This is a very small deviation and in isolation is rarely clinically significant. It could reflect mild variation or slight metabolic compensation. Her anion gap is normal, which is reassuring.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, heavy exercise","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"27.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8700","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is a calculated value that helps assess acid-base balance by comparing the major positively charged electrolytes (sodium and potassium) with the major negatively charged ones (chloride and bicarbonate). At 27.6, Eszter's anion gap is above the standard range of 8 to 16. However, the anion gap is influenced by albumin levels and the specific laboratory methodology. Given that all her individual electrolytes are close to normal and her clinical picture does not suggest a metabolic acidosis, this elevation is likely an artefact of the low bicarbonate and should be interpreted with caution. It may be worth rechecking on a fresh sample if clinically indicated.","low_causes":"Laboratory error, low albumin, bromide or lithium exposure","high_causes":"Metabolic acidosis (lactic acidosis, diabetic ketoacidosis, toxins), kidney disease, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5497","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction, and blood clotting. The body tightly regulates blood calcium levels. At 2.45, Eszter's calcium is within the optimal range, confirming healthy calcium regulation. This is particularly reassuring given her history of major fractures.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malnutrition, kidney disease","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement for albumin levels, giving a more accurate picture of true calcium status. At 2.43, Eszter's corrected calcium is within the optimal range, confirming healthy calcium balance independent of protein levels.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malnutrition","high_causes":"Hyperparathyroidism, cancer, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4885","upper_optimal_position":"0.6264","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions, including energy production, muscle relaxation, nerve function, and sleep regulation. At 0.96, Eszter's magnesium is within the optimal range of 0.85 to 1.05. This is a positive finding, particularly given the role of magnesium in muscle function and nervous system health, both of which are relevant to her symptoms.","low_causes":"Poor dietary intake, alcohol, diuretics, chronic diarrhoea, stress","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"198","within_normal":"TRUE","within_optimal":"FALSE","result_positio _position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5886","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism, filtered out by the kidneys. At 66, Eszter's creatinine is within the optimal range, confirming healthy kidney function. Given her limited physical activity and lower muscle mass, creatinine is expected to be on the lower side, which it is.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high protein diet, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR (estimated glomerular filtration rate) estimates how efficiently the kidneys are filtering blood. A result above 90 is considered normal. Eszter's eGFR is reported as above 90, confirming healthy kidney filtration. The lab reports this as >90, and the Cystatin C eGFR of 95 provides a more precise confirmation.","low_causes":"Kidney disease, dehydration, ageing, medications","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4364","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a small protein produced by all cells in the body at a constant rate, filte in_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5712","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5832","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning cortisol should be at its highest as it helps wake the body and mobilise energy. The morning reference range is 145.4 to 619.4. At 550, Eszter's cortisol is within the normal morning range but at the higher end, above the optimal upper limit of 500. Given her chronic pain, limited mobility, and the physiological and psychological impact of her injuries, a cortisol at the higher end of the morning range is an understandable physiological response to ongoing stress. It is not pathological.","low_causes":"Adrenal insufficiency, pituitary disorders, chronic fatigue","high_causes":"Chronic stress, pain, Cushing's syndrome, medications (prednisolone)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0406","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"400","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3954","upper_optimal_position":"0.6512","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen in premenopausal women, essential for reproductive health, bone density, cardiovascular protection, mood, and skin health. In a 36-year-old, oestradiol should cycle between phases, with the follicular phase range being 71.6 to 529.2. Eszter's oestradiol has come back below 43, which is below even the follicular phase floor. Combined with low LH, low-normal FSH, and very high SHBG, this pattern could suggest hypothalamic suppression of the reproductive axis, potentially driven by low body weight, chronic pain, or low caloric intake. This should be discussed with her GP.","low_causes":"Low body weight, excessive exercise, hypothalamic suppression, menopause, pituitary disorders","high_causes":"Ovarian stimulation, HRT, pregnancy, PCOS, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3476","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone that rises significantly after ovulation in the luteal phase. During the follicular phase, levels are expected to be low (0 to 4.45). At 0.85, Eszter's progesterone is consistent with the follicular phase of her cycle. This result should be interpreted alongside her other reproductive hormones.","low_causes":"Anovulation, luteal phase defect, menopause, hypothalamic suppression","high_causes":"Ovulation, pregnancy, luteal phase, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3680","upper_optimal_position":"0.5886","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and triggers ovulation in women. During the follicular phase, the expected range is 1.9 to 12.5. At 2.35, Eszter's LH is within the follicular range but sitting at the low end. Combined with low oestradiol and elevated SHBG, a low-normal LH could reflect reduced hypothalamic drive to the reproductive system.","low_causes":"Hypothalamic suppression, low body weight, stress, pituitary disorders","high_causes":"Menopause, PCOS, ovulation, pituitary disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3796","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"4","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3984","upper_optimal_position":"0.5714","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and stimulates the ovaries to develop follicles. During the follicular phase, the expected range is 2.5 to 10.2. At 3.17, Eszter's FSH is within the follicular range but at the lower end. In the context of low oestradiol, we would normally expect the pituitary to increase FSH output to try to stimulate the ovaries. The fact that FSH remains low-normal alongside low oestradiol is consistent with central (hypothalamic) suppression rather than ovarian failure.","low_causes":"Hypothalamic suppression, low body weight, stress, pituitary disorders","high_causes":"Menopause, premature ovarian insufficiency, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women plays important roles in energy, mood, motivation, libido, muscle maintenance, and bone density. At 0.5, sitting right at the floor of the female range (0.5 to 2.6), Eszter's total testosterone is already low before accounting for the very high SHBG that binds most of it. This means virtually no testosterone is biologically available, which could be contributing to her fatigue and low mood.","low_causes":"Low body weight, hypothalamic suppression, adrenal insufficiency, ageing, stress","high_causes":"PCOS, adrenal disorders, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.0025","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0833","lower_normal":"0.005","upper_normal":"0.03","lower_optimal":"0.007","upper_optimal":"0.025","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3413","upper_optimal_position":"0.6333","units":"nmol/l","description":"Free testosterone is the fraction not bound to proteins like SHBG or albumin, and it is the biologically active form that tissues can use. At 0.0025, Eszter's free testosterone is very low, well below even the lower limit of 0.005. This is a direct consequence of her very high SHBG (174.2) binding virtually all of her already-low total testosterone (0.5). This near-absence of bioavailable testosterone is clinically significant and should be discussed with her GP.","low_causes":"High SHBG, low total testosterone, low body weight, hypothalamic suppression","high_causes":"PCOS, low SHBG, androgen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2633","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"0.8","upper_optimal":"5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is calculated from total testosterone and SHBG and provides a practical estimate of androgen availability. A low FAI means that even though testosterone is present, most of it is bound and unavailable. At 0.29, below the lower limit of 0.5, Eszter's FAI confirms that her androgen availability is significantly reduced. This is being driven primarily by the very high SHBG at 174.2.","low_causes":"High SHBG, low testosterone, low body weight, hypothalamic suppression, oestrogen excess","high_causes":"PCOS, low SHBG, androgen-producing tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"174.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7485","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4365","upper_optimal_position":"0.6131","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to sex hormones, particularly testosterone and oestradiol, and transports them through the blood. When SHBG is high, it holds onto hormones tightly, leaving less available for the body to use. At 174.2, significantly above the upper limit of 146, Eszter's SHBG is elevated. Common causes of high SHBG include low body weight (BMI 18.4 here), low caloric intake, hyperthyroidism (excluded by her normal thyroid results), and liver disease (excluded by her pristine liver markers). The most likely driver in Eszter's case is her low body weight and very low caloric intake. The elevated SHBG is the primary reason her free testosterone and FAI are so low.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS, anabolic steroids","high_causes":"Low body weight, low caloric intake, hyperthyroidism, liver disease, oestrogen, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"1.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3787","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3850","upper_optimal_position":"0.5630","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. It is the most abundant steroid hormone in the body. At 1.7 umol/L (approximately 627 ug/dL), Eszter's DHEA-S is within the normal range but below the optimal range. Given her low testosterone and low oestradiol, a below-optimal DHEA-S suggests the adrenal contribution to sex hormone production may also be reduced, which is consistent with the overall pattern of hormonal suppression.","low_causes":"Adrenal insufficiency, ageing, chronic stress, low body weight","high_causes":"PCOS, adrenal tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"432","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5545","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3578","upper_optimal_position":"0.5952","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production but also involved in immune function and reproductive regulation. At 432, Eszter's prolactin is within the normal non-pregnant range of 59 to 619 but above the optimal upper limit. Mildly elevated prolactin can be influenced by stress, sleep, and the timing of the blood draw. It is not a concern at this level.","low_causes":"Pituitary disorders","high_causes":"Stress, medications, pituitary tumour, hypothyroidism, pregnancy, breastfeeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4265","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3686","upper_optimal_position":"0.4874","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how much hormone to make. A high TSH means the pituitary is pushing the thyroid harder because output is low, while a low TSH means the thyroid is producing too much and the pituitary is backing off. At 1.9, Eszter's TSH is right in the optimal zone of 1.0 to 2.5, confirming that the pituitary is happy with thyroid output.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disorders","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"17.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues. At 17.2, within the optimal range of 14 to 20, Eszter's thyroid is producing a healthy amount of thyroxine.","low_causes":"Hypothyroidism, pituitary disorders, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4704","upper_optimal_position":"0.6148","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism in every cell. At 4.7, within the optimal range of 4.5 to 6.5, Eszter's body is converting T4 to T3 adequately and her cells are receiving the thyroid stimulation they need.","low_causes":"Hypothyroidism, chronic illness, caloric restriction, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"TPO Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies (thyroid peroxidase antibodies) are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence is the hallmark of Hashimoto's thyroiditis, the most common cause of underactive thyroid. At below 6.6, well within the normal range, Eszter's result is negative for thyroid autoimmunity. This is reassuring and rules out an autoimmune cause for any thyroid-related symptoms.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulin_ab","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, elevated levels suggest autoimmune thyroid disease. At below 1.3, Eszter's result is well below the threshold of 4.4, confirming no thyroid autoimmunity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2583","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. The body produces it primarily from sunlight exposure, with smaller amounts from diet. At 62, Eszter's vitamin D is sufficient (above 50) but below the optimal range of 75 to 120. Given her very limited mobility and likely low sun exposure, supplementation is the most reliable route to reach optimal levels. This is particularly important in her case given her history of major fractures and the central role of vitamin D in bone healing and density.","low_causes":"Low sun exposure, limited mobility, dark skin, obesity, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"292","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4559","upper_optimal_position":"0.6228","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. It is found in animal products and is absorbed through the gut. At 292, Eszter's B12 is within the laboratory range of 193 to 982 but below the optimal level of 500. Given her fatigue symptoms and her nerve injury, optimising B12 could support both energy levels and nerve health. Sublingual methylcobalamin is recommended as it bypasses the gut for more reliable absorption.","low_causes":"Vegan/vegetarian diet, malabsorption, pernicious anaemia, medications","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and nervous system function. It is found abundantly in leafy greens, legumes, and fortified foods. At 10, Eszter's folate is within the optimal range, above the optimal floor of 8. This is a positive reflection of her Mediterranean diet quality.","low_causes":"Poor dietary intake, malabsorption, alcohol, pregnancy, medications","high_causes":"Supplementation, high vegetable intake, B12 deficiency (masked)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1667","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3784","upper_optimal_position":"0.5608","units":"pmol/L","description":"PTH (parathyroid hormone) is the body's primary regulator of calcium levels. When calcium drops, the parathyroid glands release PTH to tell the bones to release calcium and the kidneys to retain it. At 0.5, below the lower limit of 0.98, Eszter's PTH is suppressed. However, her corrected calcium is 2.43, comfortably within the normal range. When calcium is adequate, the parathyroid glands naturally reduce PTH output. The low PTH with normal calcium could simply reflect that the calcium-sensing system is satisfied. However, given her history of major fractures and the importance of bone metabolism for her, this should be mentioned to her GP for monitoring. Optimising vitamin D from 62 to the 75 to 120 range may also influence PTH dynamics.","low_causes":"Normal calcium levels (feedback suppression), hypoparathyroidism, excess calcium or vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"135","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5381","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"170","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4190","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscles, including the heart. It is released into the blood when muscle tissue is damaged or stressed. At 135, within the optimal range for women (25 to 200), Eszter's CK indicates no significant muscle damage or breakdown.","low_causes":"Very low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, heart attack, medications (statins)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3819","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3546","upper_optimal_position":"0.6194","units":"mmol/l","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals and oxidative stress. At 1.37, within the normal range but slightly below the optimal range of 1.4 to 1.7, Eszter's antioxidant capacity could benefit from increased intake of colourful fruits and vegetables, which are rich in antioxidant compounds.","low_causes":"Poor diet, chronic disease, oxidative stress, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"7.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3825","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant immunoglobulin in the blood, providing long-term immunity against infections the body has previously encountered. At 7.9, within the normal range, Eszter's IgG confirms a functioning adaptive immune system.","low_causes":"Immune deficiency, medications, protein loss","high_causes":"Chronic infection, autoimmune conditions, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody the immune system produces in response to a new infection. It provides early defence before IgG takes over. At 1.6, within the normal range, Eszter's IgM indicates normal early immune response capability.","low_causes":"Immune deficiency, Waldenstrom's macroglobulinemia (low)","high_causes":"Acute infection, autoimmune conditions, Waldenstrom's macroglobulinemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the main antibody found in mucous membranes (gut, airways, urinary tract), providing the first line of immune defence at body surfaces. At 1.8, within the normal range, Eszter's IgA confirms healthy mucosal immunity. IgA adequacy also validates the coeliac screen, as IgA-deficient individuals can give false negative tTG results.","low_causes":"Selective IgA deficiency, immune deficiency","high_causes":"Chronic infection, liver disease, autoimmune conditions, coeliac disease","p function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;

  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
