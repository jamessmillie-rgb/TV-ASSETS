<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Eszter Kinal","dob":"03/02/1990","report_date":"2026-08-21","summary":"Eszter is a 36-year-old female presenting with a BMI of 18.4, following a Mediterranean diet rated 7 out of 10 for quality with a volume of just 3 out of 10. She does not currently train and takes fewer than 2,000 steps per day. She reports no medications. She reports low energy and fatigue, low mood and anxiety, and joint pain and stiffness. Her goals are to reduce stress and anxiety, improve long-term health and longevity, and improve mood. Eszter has provided important additional context: in 2023 she sustained severe polytraumatic injuries in a major accident, including complex spinal and pelvic fractures, significant nerve injury, internal bleeding with severe blood loss, and was diagnosed anaemic following the trauma. She has undergone multiple major operations and further surgeries since, involving additional blood loss. She has a paralysed foot that significantly limits her mobility, and she lives with chronic pain, post-traumatic osteoarthritis, and persistent neuropathic and allodynia-type pain. More recently she has been experiencing increasing tiredness, extreme fatigue, dizziness, heart palpitations, racing heart, and chest pain. This is her first comprehensive blood panel.\n\nThe most striking finding in this report, and the one that should be discussed with her GP promptly, is the combination of a very high Sex Hormone Binding Globulin (SHBG) at 174.2, well above the upper limit of 146, alongside a testosterone sitting right at the floor of the female range at 0.5 and a Free Androgen Index (FAI) of just 0.29, which is below the lower limit of 0.5. SHBG is a protein made by the liver that binds to sex hormones, particularly testosterone, and carries them through the blood. When SHBG is very high, it binds so much testosterone that very little remains free and available for the body to use. The calculated free testosterone of 0.0025 nmol/L confirms this: virtually no testosterone is biologically active. In women, free testosterone plays a genuine role in energy, mood, motivation, libido, muscle maintenance, and bone density. At a BMI of 18.4 with very limited physical activity and chronic pain, the near-absence of free testosterone could be contributing meaningfully to the fatigue, low mood, and difficulty maintaining muscle mass that Eszter describes. The cause of the elevated SHBG needs investigation. Common drivers include low body weight and low caloric intake (both present here), thyroid status (hers is normal), and oestrogen levels. Her oestradiol came back below 43, which is below the expected follicular phase floor of 71.6, and combined with progesterone of 0.85 and LH of 2.35, this pattern could reflect suppression of the reproductive axis from chronic physiological stress, pain, low energy availability, or low body weight. This is sometimes called functional hypothalamic amenorrhoea, a pattern where the brain reduces reproductive hormone output because it perceives the body is under too much strain to support a cycle normally. It would be worth discussing with her GP whether her periods have become irregular or absent, and whether referral to endocrinology would be appropriate to investigate the elevated SHBG and suppressed sex hormones together.\n\nThe other finding that warrants a GP conversation is the urine result. The white blood cell count in the urine is 170 per microlitre, well above the threshold of 10 that the laboratory considers significant. This level of urinary white cells, called pyuria, strongly suggests inflammation or infection in the urinary tract. The nitrites came back negative, but not all urinary tract infections produce nitrites, particularly those caused by organisms other than E. coli. The bacterial count and urine culture results are still to follow, and these will clarify whether an organism is growing and which antibiotic, if any, would be appropriate. Given her symptoms of fatigue and her history of major pelvic surgery, this is worth flagging to her GP now rather than waiting, particularly if she has any urinary symptoms such as frequency, urgency, or discomfort.\n\nHer ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and acts as a general marker of inflammation, is 20, above the upper limit of 12 for her age. Her hs-CRP, a more specific inflammation marker, is 1.1. While CRP below 5 is within the laboratory range, the optimal level is below 1.0, and at 1.1 it sits just above that threshold. Given her history of major trauma, ongoing chronic pain, post-traumatic osteoarthritis, and the possibility of a urinary tract infection, a mildly elevated inflammatory picture is not unexpected. However, if the urinary infection is confirmed and treated and the ESR remains elevated on a future retest, her GP may wish to investigate further given her complex surgical history.\n\nHer C-Peptide has come back at 0.689 micrograms per litre, which converts to approximately 228 pmol/L, below the laboratory lower limit of 1.1 micrograms per litre (approximately 364 pmol/L). C-Peptide is a molecule released by the pancreas in equal amounts to insulin, and it is used to gauge how much insulin the body is producing. However, her fasting glucose is 4.8, her HbA1c is 35 mmol/mol (both within the optimal range), her fasting insulin is 6.08, and her HOMA-IR (a measure of insulin resistance calculated from glucose and insulin) is 1.3. This means her blood sugar control is working well. The low C-Peptide here most likely reflects genuinely low insulin demand rather than pancreatic failure. At her low body weight and with very low physical activity, her muscles and organs simply do not require much insulin to keep blood sugar in check. The lab also notes that C-Peptide can degrade in samples not separated quickly. This is not a concern at present, but it is worth noting for future reference.\n\nHer parathyroid hormone (PTH) is 0.5 pmol/L, below the lower limit of 0.98. PTH is produced by the parathyroid glands and is the body's main regulator of calcium and bone metabolism. The reassuring finding is that her corrected calcium is 2.43, sitting comfortably within the normal range of 2.2 to 2.6. When calcium is adequate, the parathyroid glands naturally reduce PTH output, so a low PTH with normal calcium can simply mean the parathyroid glands are not being called upon. Her vitamin D at 62 is sufficient but below optimal (75 to 120), and improving this may influence PTH dynamics over time. Given her history of major fractures and bone healing, calcium and bone metabolism are particularly important for her, and it would be worth mentioning the low PTH to her GP so it can be monitored.\n\nTurning to the positives, and there are genuinely many. Her kidney function is excellent. Cystatin C, a more reliable marker of kidney filtration than creatinine alone, is 0.96 with a calculated eGFR of 95, and her creatinine-based eGFR is above 90. At 36, this is exactly where it should be. Her liver is in outstanding health. ALT at 15 and GGT at 11 are both well within optimal ranges, her FIB-4 score of 1.07 shows no suggestion of fibrosis, and her albumin at 43 confirms the liver is producing protein normally. Her amylase at 116 and lipase at 51 are both within range, meaning her pancreas is functioning well. Her thyroid is working beautifully. TSH at 1.9 sits right in the optimal zone of 1.0 to 2.5, free T4 at 17.2 is within the optimal band of 14 to 20, and free T3 at 4.7 is within the optimal range of 4.5 to 6.5. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. This is particularly reassuring given her fatigue symptoms, because it means the thyroid is not contributing to her tiredness. Her blood sugar regulation is a genuine strength. Fasting glucose of 4.8, HbA1c of 35, insulin of 6.08, and HOMA-IR of 1.3 together paint a picture of excellent insulin sensitivity with no suggestion of pre-diabetes. Her full blood count is largely reassuring. Haemoglobin at 149 is at the top of the female range, which is excellent given her history of severe blood loss and previous anaemia, and confirms she has rebuilt her red cell mass. Her platelet count, white cell count, and differential are all within range. Her magnesium at 0.96 sits within the optimal band of 0.85 to 1.05, which is important for nerve function, muscle relaxation, and sleep. Her calcium is well controlled. Her immunoglobulins IgG, IgM, and IgA are all within range, suggesting her immune system is functioning normally. Rheumatoid factor is negative, which is reassuring in the context of her joint symptoms as it makes rheumatoid arthritis unlikely as a driver, and her coeliac screen is negative. Her tumour markers CA-125, CA 15-3, CA 19-9, and CEA are all within their reference ranges. Her creatine kinase at 135 is within range, and her total antioxidant activity at 1.37 is within range.\n\nHer lipid profile is the area that would benefit from attention. Her total cholesterol is 6.1, above the desirable threshold of 5.18. Her LDL cholesterol (the form that deposits cholesterol into artery walls) is 3.73, above the upper limit of 3.0. Her ApoB (apolipoprotein B, a protein that sits on every LDL particle and is considered the most accurate single measure of atherogenic risk) is 1.28, which the laboratory classifies as high, above the desirable threshold of 0.9. Her ApoB to ApoA-I ratio is 0.821, which the laboratory places in the higher risk category above 0.8. The female threshold for concern is 0.6, and at 0.821 this is meaningfully above it. Her non-HDL cholesterol is 4.3, above the 4.0 threshold. On the positive side, her HDL cholesterol at 1.8 is excellent, well above the desirable threshold of 1.55, and her ApoA-I at 1.56 is healthy. Her triglycerides at 1.41 are within the fasting range but above the optimal level of 1.0, and her VLDL at 0.64 is within range. Her Lp(a), which is an inherited marker that cannot be changed by diet or exercise and provides permanent information about cardiovascular risk, is still to follow and will be reported when available. The lipid picture here is one where the protective side (HDL, ApoA-I) is strong, but the atherogenic side (LDL, ApoB) is elevated enough to warrant action. At 36, addressing this through diet and lifestyle changes now can make a meaningful difference over the decades ahead. Her very low caloric intake (volume rated 3 out of 10) and very low body weight may paradoxically be contributing, as the liver can upregulate cholesterol production when energy intake is very low. Increasing her food volume, emphasising soluble fibre (oats, beans, lentils, psyllium husk), increasing oily fish to two to three portions per week, and reducing saturated fat from dairy and red meat would be the first steps.\n\nHer vitamin D at 62 is sufficient by laboratory standards but below the optimal range of 75 to 120. Given her very limited mobility and likely low sun exposure, supplementation would help bring this into the optimal zone. This is particularly important for her, given her fracture history and the role vitamin D plays in bone healing and maintenance. Her B12 at 292 is within the laboratory range but below the optimal level of 500. At this level, stores are adequate but not robust, and given her fatigue symptoms, bringing B12 into the optimal range could support energy levels. Her folate at 10 is within range and above the optimal floor of 8.\n\nHer cortisol at 550 is flagged as abnormal by the laboratory, but the morning reference range is 145.4 to 619.4, and at 550 her result falls within this range. A morning cortisol of 550 is at the higher end but not outside normal limits. Given her chronic pain, limited mobility, and the psychological burden of her injuries, a cortisol at the higher end of the morning range is physiologically understandable.\n\nHer absolute reticulocyte count is 31, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A low count suggests the bone marrow is producing red cells at a relatively slow rate. However, her haemoglobin is 149 and her red cell count is 4.71, both healthy. When haemoglobin is adequate, the kidneys reduce production of erythropoietin (the hormone that stimulates red cell production), so the bone marrow naturally slows down. This is likely a normal feedback response rather than a problem. Her low caloric intake could also be a subtle contributor, as the bone marrow needs adequate energy and nutrients to produce cells at full capacity.\n\nHer bicarbonate at 19.4 is marginally below the lower limit of 20. This is a very small deviation and in isolation is rarely significant. It could reflect mild metabolic compensation, her low body weight, or simply natural variation. Her MCHC at 346 is marginally above the upper limit of 345, which at this margin is laboratory variation rather than a clinical finding. Her transferrin at 2.53 sits right at the lower boundary of 2.5 to 3.8. Given her ferritin of 66 (within the optimal range of 40 to 150 for women), her serum iron of 29 (near the top of range), and her transferrin saturation of 45.6% (within range and above optimal floor of 25%), her iron status is actually very healthy and represents a remarkable recovery from post-traumatic anaemia.","links":"The most important conversation to have with Eszter's GP centres on the hormonal findings. Her SHBG is significantly elevated at 174.2, her free androgen index is below range at 0.29, and her oestradiol is below the expected follicular phase floor. Together with her very low body weight (BMI 18.4) and extremely low caloric intake (volume 3 out of 10), this pattern could suggest functional hypothalamic suppression, where the body reduces reproductive hormone output because it does not have enough energy to support full hormonal cycling. The GP should be made aware of these numbers and asked whether referral to endocrinology is appropriate. Eszter should bring the specific values: SHBG 174.2 (range 27.8 to 146), FAI 0.29 (range 0.5 to 6.5), oestradiol below 43 (follicular range 71.6 to 529.2), LH 2.35, FSH 3.17, and free testosterone 0.0025. The GP may wish to assess menstrual regularity and consider a DEXA scan given her fracture history combined with low oestrogen and low body weight, as this combination is a recognised risk factor for reduced bone density.\n\nThe urine white blood cell count of 170 should also be discussed with her GP. The bacterial culture and sensitivities are still to follow and will determine whether antibiotic treatment is needed. If Eszter has any urinary symptoms such as frequency, urgency, burning, or lower abdominal discomfort, she should mention these to her GP promptly rather than waiting for the culture result.\n\nThe lipid findings are not urgent but are important for long-term health. The key numbers for the GP are ApoB 1.28 (target below 0.9), LDL 3.73 (target below 3.0), and ApoB/A-I ratio 0.821 (target below 0.6 for women). The Lp(a) result is still pending and will provide crucial context: if it is elevated, it means part of the cardiovascular risk is inherited and unchangeable, and the modifiable factors (LDL, ApoB) become even more important to address aggressively. If Lp(a) is normal, it confirms the lipid picture is entirely driven by modifiable factors, which is encouraging.\n\nNutrition is the single most impactful change Eszter can make. At 55 kg, 173 cm, and a sedentary activity level due to her mobility limitations, her estimated maintenance calorie requirement is approximately 1,600 to 1,700 calories per day. With a diet volume of 3 out of 10, she is very likely eating significantly below this. Undereating at her level does not just cause fatigue directly through insufficient fuel. It suppresses sex hormones, can elevate SHBG, slows bone marrow output (which may explain the low reticulocytes), and can paradoxically raise LDL cholesterol as the liver increases endogenous cholesterol production. Her target should be 1,600 to 1,800 calories per day, with a protein intake of at least 72 to 88 grams per day (1.3 to 1.6 grams per kilogram). Protein is especially important for her given her surgical history, ongoing tissue repair, and the need to maintain what muscle mass she can despite limited mobility. Good protein sources within her Mediterranean framework include fish, chicken, eggs, Greek yoghurt, lentils, chickpeas, and beans. To address her lipid findings specifically, she should aim for two to three portions of oily fish per week (salmon, mackerel, sardines), include a daily source of soluble fibre (a bowl of oats with breakfast, a portion of beans or lentils with lunch or dinner, or a teaspoon of psyllium husk in water), and moderate her saturated fat intake from butter, cheese, and red meat. These dietary changes can meaningfully reduce LDL and ApoB over three to six months.\n\nGiven her chronic pain and very limited mobility, physical activity recommendations need to be realistic and adapted. If she is able to do any form of seated or upper-body resistance exercise, even light resistance bands or bodyweight movements from a chair, this would help maintain muscle mass and bone density and could modestly improve her lipid profile. If she has access to a physiotherapist, discussing a safe exercise programme within her physical limitations would be valuable. Any increase in daily movement, even if modest, will help. If swimming or pool-based exercise is accessible, the buoyancy removes load from the spine and pelvis while allowing movement.\n\nFor stress, mood, and anxiety, her cortisol is at the higher end of the morning range, which is understandable given chronic pain and the psychological impact of her injuries. Practical approaches that may help include a fixed sleep and wake schedule (the same wake time every day, including weekends), getting outside or near a window within an hour of waking to anchor the circadian rhythm, a caffeine cut-off by early afternoon, and keeping the bedroom cool and dark. Magnesium glycinate before bed may also support sleep quality and has a mild calming effect. If she is not already receiving psychological support for the impact of her injuries, this is worth discussing with her GP, as chronic pain and limited mobility have well-established links to low mood and anxiety.\n\nA retest in four to six months would be appropriate, focusing on: a full lipid panel including ApoB and Lp(a) (if the current Lp(a) is still pending at that point), SHBG, testosterone, FAI, oestradiol, LH, FSH, vitamin D, B12, ESR, CRP, and a repeat urine dipstick and culture to confirm resolution of the urinary findings.","flags":"1. SHBG 174.2 nmol/L (range 27.8 to 146), FAI 0.29 (range 0.5 to 6.5), free testosterone 0.0025 nmol/L, testosterone 0.5 nmol/L (lower limit 0.5), oestradiol below 43 pmol/L (follicular range 71.6 to 529.2). Markedly elevated SHBG with consequent near-absence of bioavailable testosterone. Low oestradiol with low-normal gonadotrophins (LH 2.35, FSH 3.17) suggests possible hypothalamic suppression. BMI 18.4 with very low caloric intake. Consider endocrinology referral, assessment of menstrual regularity, and DEXA scan given fracture history combined with low oestrogen and low body weight.\n\n2. Urine WBC 170/uL (significant above 10). Nitrites negative. Bacterial count and culture to follow. High pyuria suggesting urinary tract inflammation or infection. Correlate with symptoms and treat based on culture result when available. Pelvic surgical history is relevant context.\n\n3. ApoB 1.28 g/L (desirable below 0.9), LDL 3.73 mmol/L (range 0.5 to 3.0), non-HDL cholesterol 4.3 mmol/L (target below 4.0), ApoB/A-I ratio 0.821 (female target below 0.6), total cholesterol 6.1 mmol/L (desirable below 5.18). Elevated atherogenic lipid markers. HDL 1.8 and ApoA-I 1.56 are protective. Lp(a) to follow. Consider dietary intervention as first line; reassess in four to six months.\n\n4. ESR 20 mm/hr (upper limit 12). Mildly elevated. Context of chronic pain, post-traumatic osteoarthritis, and possible UTI. hs-CRP 1.1 is mildly above optimal (below 1.0). Monitor on retest after UTI resolution.\n\n5. PTH 0.5 pmol/L (range 0.98 to 4.73). Low in the context of normal corrected calcium (2.43) and sufficient but suboptimal vitamin D (62). May normalise with vitamin D optimisation. Worth monitoring given fracture history and bone metabolism relevance.\n\n6. C-Peptide 0.689 ug/L (range 1.1 to 4.4), equivalent to approximately 228 pmol/L. Likely reflects low insulin demand given normal glucose (4.8), HbA1c (35), insulin (6.08), and HOMA-IR (1.3). Lab notes sample handling may affect results. Not clinically concerning in this context.\n\n7. Cortisol 550 nmol/L. Flagged by lab but falls within the morning reference range of 145.4 to 619.4. Higher end, consistent with chronic pain and physiological stress. Not pathological.\n\n8. Reticulocytes absolute 31 x10^9/L (range 50 to 100). Low production rate but haemoglobin 149 and red cell indices normal. Likely appropriate feedback suppression. Low caloric intake may be a contributing factor.\n\n9. Bicarbonate 19.4 mmol/L (range 20 to 31). Marginally below range. Isolated finding, unlikely significant. MCHC 346 g/L (range 315 to 345). Marginally above range, laboratory variation.\n\nPending results: Lp(a), urine bacterial count, urine culture and sensitivities.\n\nReassuring negatives: Haemoglobin fully recovered at 149 despite history of severe blood loss. Kidney function excellent (Cystatin C 0.96, eGFR 95). Liver function pristine (ALT 15, GGT 11, FIB-4 1.07). Thyroid normal with negative antibodies. Blood sugar control optimal (HbA1c 35, HOMA-IR 1.3). Rheumatoid factor negative. Coeliac screen negative. All tumour markers within range. Iron stores healthy (ferritin 66, transferrin saturation 45.6%). Immunoglobulins normal.","recommendations":"1. Discuss the hormonal findings with your GP as a priority. Bring the specific numbers: SHBG 174.2 (range up to 146), FAI 0.29 (range 0.5 to 6.5), oestradiol below 43, and free testosterone 0.0025. Ask whether referral to endocrinology and a DEXA bone density scan are appropriate given your fracture history and low oestrogen.\n\n2. Discuss the urine white blood cell finding (170/uL) with your GP. The culture result is pending and will guide whether treatment is needed. Mention any urinary symptoms.\n\n3. Increase your caloric intake to 1,600 to 1,800 calories per day. Your current diet volume of 3 out of 10 suggests significant undereating, which is likely contributing to hormonal suppression, low reticulocyte production, and potentially elevated cholesterol.\n\n4. Aim for 72 to 88 grams of protein per day to support tissue repair, muscle maintenance, and bone health.\n\n5. To address your lipid findings, include a daily source of soluble fibre (oats, beans, lentils, or psyllium husk), eat oily fish two to three times per week, and reduce saturated fat from butter, cheese, and red meat.\n\n6. Begin vitamin D3 supplementation at 3,000 IU daily with a fat-containing meal, paired with vitamin K2 (MK-7) at 100 to 200 mcg daily, to bring your level from 62 into the optimal range of 75 to 120. This is particularly important for bone health given your fracture history.\n\n7. Begin sublingual methylcobalamin (vitamin B12) at 1,000 mcg daily to bring B12 from 292 into the optimal range above 500.\n\n8. If any form of adapted physical activity is accessible to you, whether seated resistance exercises, upper-body resistance bands, or pool-based exercise, even modest amounts would benefit muscle mass, bone density, mood, and lipid levels.\n\n9. Prioritise sleep quality with a fixed wake time, daylight exposure within an hour of waking, a caffeine cut-off by early afternoon, and a cool, dark bedroom.\n\n10. Retest in four to six months: full lipid panel with ApoB and Lp(a), SHBG, testosterone, FAI, oestradiol, LH, FSH, vitamin D, B12, ESR, CRP, PTH, reticulocytes, and urine dipstick.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with a meal that contains fat to aid absorption. Eszter's vitamin D is 62, sufficient but below the optimal range of 75 to 120. Given her very limited mobility and likely low sun exposure, supplementation is the most reliable way to bring this into the optimal zone. This is especially important for her given her history of major fractures and the role vitamin D plays in calcium absorption and bone remodelling. A slightly higher dose of 3,000 IU rather than the standard 2,000 IU is appropriate given her starting level and the importance of bone health in her case.\n\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D3. Vitamin K2 directs calcium into bones and teeth rather than allowing it to deposit in arteries. It should always accompany vitamin D supplementation, and is especially relevant here given the need to support bone density.\n\nMagnesium glycinate: 300 to 400 mg before bed. Her magnesium at 0.96 is within the optimal range, but magnesium glycinate is specifically chosen for its calming properties and its ability to support sleep quality. Given her chronic pain, anxiety, and the importance of restorative sleep for recovery and mood, this is a worthwhile addition. The glycinate form is gentle on the stomach and well absorbed.\n\nSublingual methylcobalamin (vitamin B12): 1,000 mcg daily, dissolved under the tongue. Her B12 at 292 is within the laboratory range but below the optimal level of 500. The sublingual route bypasses the gut and delivers B12 directly into the bloodstream, which is more reliable than oral tablets. Bringing B12 into the optimal range may support energy levels and nerve function, the latter being particularly relevant given her nerve injury.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This serves multiple purposes for Eszter. It can help reduce LDL and ApoB (her most notable lipid findings), has anti-inflammatory properties that may benefit her chronic pain and elevated ESR, and supports mood and cognitive function. She should look for a product that lists the EPA and DHA content separately on the label and aim for at least 1,000 mg EPA and 500 mg DHA per day.\n\nThe most important changes from this report are not supplements. They are increasing her caloric intake to 1,600 to 1,800 calories per day with at least 72 to 88 grams of protein, discussing the hormonal findings with her GP, and following up on the urine results. No supplement can replace adequate nutrition, and eating enough is the single most impactful change she can make for her hormones, her energy, her bone health, and her recovery.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1339","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found primarily in liver cells. When the liver is under strain or damaged, ALT leaks into the bloodstream, so rising levels act as an early warning of liver stress. At 15, Eszter's ALT is well within the optimal range of below 25 for women, indicating her liver cells are healthy and not under any metabolic strain. This is a genuinely reassuring finding.","low_causes":"","high_causes":"Liver disease, hepatitis, fatty liver, alcohol excess, medications, strenuous exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3125","lower_normal":"13","upper_normal":
