":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. His result of 4.7 is within the desirable range of below 5.18, which is a positive starting point. However, total cholesterol alone does not tell the full story; the breakdown into LDL, HDL and the particle count (ApoB) is more informative.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic infection","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3235","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat circulating in the blood, derived from dietary fat and excess carbohydrates converted by the liver. His result of 1.1 is within the laboratory range of below 1.7, though above the optimal target of below 1.0. This is a modest elevation and is consistent with dietary sugary foods (reported as some days). Reducing sugary foods and refined carbohydrates is the most effective way to lower triglycerides.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate or sugar intake, alcohol, obesity, insulin resistance, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3205","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. It is a precursor to LDL. His result of 0.5 is within the ideal range, confirming that the liver is not overproducing triglyceride-rich particles.","low_causes":"Low-fat diet, malnutrition","high_causes":"High carbohydrate intake, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5288","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6731","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from the arteries and returns it to the liver for disposal. His result of 1.1 is above the risk threshold of 1.04 but below the ideal level for a male of 1.4. A lower HDL increases cardiovascular risk because less cholesterol is being actively cleared from the arteries. HDL responds well to regular aerobic exercise, reducing refined carbohydrates and sugar, losing excess body fat, and moderate alcohol intake. His CRP at 8.5 may also be suppressing HDL, so if the inflammation resolves, HDL may rise naturally.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.14","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6853","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits cholesterol into artery walls, driving atherosclerosis over time. His result of 3.14 is above the upper limit of 3.0 and above the optimal target of below 2.6. With his Lp(a) below 25 confirming no inherited component, this LDL level is entirely driven by modifiable factors: diet (particularly saturated fat and sugar), body composition, exercise and inflammation. Increasing soluble fibre (oats, beans, lentils), eating oily fish two to three times per week, and reducing saturated fat and sugar should bring this down over three to six months.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition, malabsorption, statins","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, kidney disease, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4744","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol and summarises cardiovascular risk in a single number. Lower is better. His result of 4.27 is within the laboratory range but above the optimal target of below 3.5, driven by the combination of his HDL at 1.1 being below ideal and total cholesterol at 4.7. Raising HDL through exercise and dietary changes would improve this ratio.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"23.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5850","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"This expresses HDL as a percentage of total cholesterol. Higher is better. His result of 23.4% is above the minimum of 20% but below the ideal of 28% or more. This mirrors the HDL finding and will improve as HDL rises with exercise and dietary changes.","low_causes":"Low HDL, high total cholesterol, metabolic syndrome","high_causes":"High HDL, regular exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the potentially harmful cholesterol particles (LDL + VLDL + remnants). It is considered a better predictor of cardiovascular risk than LDL alone. His result of 3.6 is within the laboratory range but above the optimal target of below 3.0, consistent with his LDL and ApoB findings.","low_causes":"Low LDL, low triglycerides, statins","high_causes":"High LDL, high triglycerides, diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4958","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and is a direct measure of the number of protective cholesterol particles in the blood. Higher is better. His result of 1.19 is just below the desirable level of 1.20, mirroring his HDL finding. ApoA1 responds to the same lifestyle factors as HDL: regular aerobic exercise, reducing refined carbohydrates and maintaining a healthy body composition.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL and Lp(a) particle. Each atherogenic (artery-damaging) particle carries exactly one ApoB molecule, making it the best single measure of the number of harmful cholesterol particles in the blood. His result of 0.85 is below the desirable threshold of 0.9 but above the optimal target of below 0.8. This is a result that diet and exercise can improve. With Lp(a) below 25, all of his ApoB particles are modifiable LDL and VLDL particles.","low_causes":"Statins, very low-fat diet, malnutrition, hyperthyroidism","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.714286","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5102","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio is considered the best single summary of the balance between harmful and protective cholesterol particles. Lower is better. His result of 0.71 is marginally above the lower-risk threshold of 0.7, placing him in the average risk category. This is driven by ApoB being slightly above ideal (0.85) and ApoA1 being slightly below ideal (1.19). Improving both through diet and exercise would bring this ratio below 0.7.","low_causes":"High HDL relative to LDL, active lifestyle, statins","high_causes":"High LDL, low HDL, sedentary lifestyle, poor diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a) is an inherited cholesterol particle that behaves like LDL but cannot be changed by diet, exercise or standard medications. It is genetically determined and remains stable throughout life, so it only needs to be measured once. His result of below 25 is well within the ideal range of below 32 nmol/L. This is genuinely useful information because it confirms that his LDL and ApoB levels are driven entirely by modifiable factors, not by an inherited component that would be harder to address.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), kidney disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4024","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme released from muscle cells when they are damaged or stressed, including from exercise. His result of 98 is within the ideal range, suggesting he was not in a period of acute muscle recovery at the time of the draw. This is reassuring for someone training four times per week at hard intensity.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myositis, hypothyroidism, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"22.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6488","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted to the active form, T3, in tissues. His result of 22.1 is within the laboratory range but at the upper end, above the optimal ceiling of 20. With a TSH of 1.11 (ideal), this is not suggestive of thyroid disease. Some individuals run at the upper end of T4 naturally, and his FT3 of 5.2 confirms the thyroid is converting T4 to the active form appropriately. No action is needed.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, medications","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication, high TBG (oestrogen, pregnancy)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3775","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. When the thyroid is underactive, TSH rises to try to push it harder; when it is overactive, TSH drops. His TSH of 1.11 is within the ideal range of 1.0 to 2.5, indicating that the pituitary is happy with the amount of thyroid hormone being produced. This rules out both underactive and overactive thyroid as causes of his fatigue.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, recovery from illness, medications (lithium, amiodarone)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use. It is converted from T4 in the liver, kidneys and other tissues. His result of 5.2 is within the ideal range, confirming that his body is converting T4 to T3 efficiently and his cells are receiving adequate thyroid hormone.","low_causes":"Hypothyroidism, non-thyroidal illness (sick euthyroid), calorie restriction, chronic disease","high_causes":"Hyperthyroidism, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a condition called Hashimoto's thyroiditis. His result of below 6.6 is well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target the thyroglobulin protein produced by the thyroid. Like TPO antibodies, they are a marker of autoimmune thyroid disease. His result of below 1.3 is well within the normal range, and with both antibodies negative, autoimmune thyroid disease is confidently excluded.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.235","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3-to-FT4 ratio indicates how efficiently the body converts the inactive thyroid hormone (T4) to the active form (T3). His ratio of 0.235 is within the reference range but below the optimal floor of 0.27. This is driven by his FT4 sitting at the upper end of its range (22.1) while FT3 is mid-range (5.2). In practical terms, his thyroid is producing plenty of T4 and converting enough of it to T3, so this ratio does not indicate a clinical problem. It is a mathematical reflection of his naturally high T4 rather than a conversion issue.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"Prostate Specific Antigen (PSA)","group":"PROSTATE","result":"0.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0460","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"ng/mL","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. It is used as a screening marker for prostate health. His result of 0.23 is very low and well within cer, smoking, inflammation, liver disease, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"11.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5053","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides the main defence against bacterial and viral infections. It represents the body's long-term immune memory. His result of 11.4 is within the laboratory range and indicates a healthy adaptive immune system with adequate antibody reserves.","low_causes":"Immunodeficiency, certain medications, kidney disease (protein loss)","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. Elevated IgM can suggest a recent or current infection, while low IgM can indicate immunodeficiency. His result of 2.7 is within the laboratory range, in the upper portion. In the context of his raised CRP and report of frequent illness, a mildly elevated IgM within range is consistent with the immune system responding to recent challenges.","low_causes":"Immunodeficiency, certain medications","high_causes":"Acute infection, liver disease, autoimmune disease, Waldenstrom's macrogl ss, steroid use, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol (E2)","group":"HORMONES","result":"128","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4381","lower_normal":"0","upper_normal":"146.1","lower_optimal":"","upper_optimal":"130","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the main oestrogen in men, produced in small amounts by the testes and by conversion from testosterone in fat tissue. In men, it plays a role in bone health, libido and cardiovascular protection. His result of 128 is within range and within the optimal band. At a BMI of 26.8, some oestradiol conversion from testosterone is expected and is not excessive.","low_causes":"Low testosterone, low body fat, aromatase inhibitors","high_causes":"Obesity, liver disease, excessive testosterone supplementation, aromatase excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3322","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5686","units":"nmol/L","description":"Progesterone is present in small amounts in men, produced by the adrenal glands and testes. It plays a minor role in mood, sleep and as a precursor to other hormones. His result of 0.88 is fractionally below the lower limit of 0.89. In men, this is of no clinical significance and does not require any action. Progesterone levels in men are naturally very low and this margin is within normal variation.","low_causes":"Normal variation in men, adrenal insufficiency","high_causes":"Congenital adrenal hyperplasi // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
