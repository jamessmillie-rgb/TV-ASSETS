<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Chris Georgiades","dob":"03/08/1992","report_date":"2026-10-28","summary":"Customer is a 34-year-old male presenting with a BMI of 26.8, following a Mediterranean diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are larger than average (volume 7 out of 10). He trains four times per week (two cardio, two resistance, hard intensity) with 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but wakes tired most mornings, with an afternoon energy crash; stress feels hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week, takes a multivitamin and creatine, and has a family history of type 2 diabetes. He has had no previous blood test. He reports low energy and fatigue, low mood and anxiety, and frequent illness, all lasting over a year. His goals are to improve energy levels, boost his immune system, and reduce stress and anxiety.\n\nThe finding in this report that needs a conversation with his GP is the raised hsCRP, a marker of systemic inflammation, which sits at 8.5 against an upper limit of 5.0. hs-CRP (high-sensitivity C-reactive protein) measures low-grade inflammation circulating in the blood. At 8.5 it is meaningfully elevated, and while a single reading can be pushed up by a recent infection, intense exercise in the 48 hours before the draw, or even a minor soft-tissue injury, a level this high is worth investigating. It may also be contributing to the fatigue and low mood he has been experiencing for over a year, because chronic low-grade inflammation is strongly associated with both. Given his family history of type 2 diabetes and the insulin findings discussed below, the CRP takes on additional significance because inflammation and insulin resistance tend to reinforce each other in a cycle. His GP should repeat the hs-CRP in four to six weeks, ideally on a day without preceding heavy exercise, to see whether it settles or persists.\n\nAlongside the CRP, the insulin and C-peptide results need careful interpretation. His insulin is 51 mIU/L, more than double the upper limit of 24.9, and his C-peptide (a molecule released in equal amounts to insulin by the pancreas, used to measure how much insulin the body is actually producing) is 5.52 ug/L against an upper limit of 4.4. His glucose, however, is 3.6, right at the bottom of the reference range, and his HbA1c (a measure of average blood sugar over the previous two to three months) is 35 mmol/mol, which is well within the healthy range. His triglycerides are 1.1, also healthy. This pattern has more than one possible explanation, and which one applies depends on whether he was fully fasted (8 to 12 hours, water only) before the blood draw. If he was genuinely fasted, the raised insulin and C-peptide alongside a low-normal glucose suggest his pancreas is working harder than expected to keep blood sugar down. That pattern, where glucose looks fine on the surface but only because insulin is being overproduced to hold it there, can be an early sign of insulin resistance, and it matters more given his family history of type 2 diabetes. The HOMA-IR (a ratio of insulin to glucose that estimates insulin resistance) comes out at 8.16 against an upper limit of 1.5, which would place him well into significant insulin resistance territory. However, HOMA-IR is only valid on a truly fasted sample. If he had eaten or drunk anything other than water in the hours before the draw, insulin and C-peptide rise sharply after food and can remain elevated for several hours while glucose has already fallen back to baseline, which would make these numbers simply a reflection of a recent meal rather than a metabolic problem. Either way, the next step is clear: a fasted repeat of glucose, insulin and C-peptide with his GP, done first thing in the morning after an overnight fast of at least eight hours with water only. If the pattern repeats on a confirmed fasting sample, the GP can investigate further and talk about early intervention, which at 34 with a family history is genuinely valuable because insulin resistance caught at this stage is highly reversible with dietary and exercise changes.\n\nThere is a lot of good news in this report. His liver is in excellent health. ALT at 28 and AST at 23 are both well within range, Gamma GT (a liver enzyme particularly sensitive to metabolic strain, alcohol and fatty change) is just 12, which is about as clean as that marker gets, and the FIB-4 score (a composite that screens for liver scarring) is 0.55, well below the 1.45 threshold. The APRI and NAFLD Fibrosis scores confirm the same picture: no sign of fatty liver disease or fibrosis. At a BMI of 26.8 with a family history of type 2 diabetes, a liver this clean is a genuine positive. His kidneys are working well, with a Cystatin C (a protein filtered by the kidneys that gives a more accurate picture of kidney function than creatinine alone, especially in active people) of 0.98 and a combined eGFR of 96, exactly where it should be at 34. Uric acid at 358 is comfortably within the ideal range. His thyroid is functioning well: TSH (the pituitary hormone that drives the thyroid) at 1.11 is in the ideal range, free T4 (the main thyroid hormone) at 22.1 is at the upper end of the reference range but within it, and free T3 (the active form the body uses) at 5.2 sits in a healthy range. Both thyroid antibodies are negative, which rules out autoimmune thyroid disease and is reassuring given his family history of type 2 diabetes. His haematology panel is healthy: haemoglobin at 157, red cells at 5.21, white cells at 5.6, platelets at 269 and reticulocytes at 61.5 are all within their respective ranges. Iron studies show a balanced picture with ferritin at 69, transferrin saturation at 26.5% and serum iron at 16.7, all within their ideal ranges. His immunoglobulins (IgG, IgM, IgA and IgE) are all within range, rheumatoid factor is negative, and the coeliac screen (tissue transglutaminase IgA, which detects the antibody associated with coeliac disease) is negative. PSA (prostate-specific antigen, a screening marker for prostate health) is very low at 0.23 with a healthy free PSA ratio of 47.8%, and CA19-9 (a tumour marker associated with pancreatic and gastrointestinal cancers) is 3.01, well within range. His urinalysis is completely clean: no protein, no glucose, no blood, no white cells, no nitrites, no bacterial growth, and urine culture shows no growth.\n\nHis PhenoAge, a composite biological age score built from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes in at 32.1 against his calendar age of 34, meaning his biological age is roughly two years younger than his chronological age. This is a positive finding, though the CRP at 8.5 is the main marker pulling PhenoAge upward; if the CRP settles on repeat, his biological age would likely drop further. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that measures the risk being built from lipid, inflammatory and metabolic markers, sits at 40, which is on the boundary of acceptable and flagged. The main drivers are the hsCRP at 8.5 and the LDL and ApoB sitting above their optimal targets.\n\nTurning to his lipid profile, the overall picture is mixed. Total cholesterol at 4.7 is within the desirable range, triglycerides at 1.1 are healthy, and VLDL at 0.5 is clean. However, his LDL cholesterol (the main carrier of cholesterol into artery walls) is 3.14 against an optimal target below 2.6, and his ApoB (apolipoprotein B, a direct count of the number of potentially harmful cholesterol particles in the blood, and the best single measure of cardiovascular risk from lipids) is 0.85, which is below the 0.9 desirable threshold but above the ideal target of below 0.8. His HDL (the protective cholesterol that removes excess from the arteries) is 1.1, which is above the risk threshold of 1.04 but below the ideal level for a male of 1.4. Apolipoprotein A1 (the protein on HDL particles) is 1.19, just under the 1.20 desirable level, and the ApoB to A1 ratio is 0.71, marginally above the 0.7 lower-risk threshold. His Lp(a) (lipoprotein a, an inherited cholesterol particle that cannot be changed with diet or exercise) is below 25, which is ideal and genuinely useful information because it means any elevation in his LDL and ApoB is driven entirely by modifiable factors: diet, weight, exercise and inflammation. The Lp(a)-corrected LDL, which strips out the inherited component, is 3.06, confirming the LDL is lifestyle-driven. The good news is that every lever available to bring these numbers down is within his control. Bringing the sugary foods from some days down to rarely, increasing oily fish to two to three times per week, adding soluble fibre (oats, beans, lentils) daily, and raising HDL through more consistent cardio and resistance training will shift this profile meaningfully over three to six months.\n\nHis testosterone at 17.9 is within the laboratory range of 8.4 to 28.7 but sits below the optimal band of 18 to 28.7. At 34, this is not a concern on its own, but it is worth noting as a baseline and is the kind of marker that responds well to better sleep quality, stress management and maintaining a healthy body composition. Free testosterone (the unbound, active form) at 0.392 is within range, and SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable) at 31 is healthy. DHEA-S (dehydroepiandrosterone sulphate, an adrenal hormone that serves as a precursor to testosterone) at 3.0 umol/L is within range. Cortisol at 378 is within the expected morning range. LH and FSH, the pituitary hormones that drive testosterone production, are both within range, indicating the signalling pathway is intact. Oestradiol at 128 is within range. His progesterone at 0.88 is fractionally below the lower limit of 0.89, which in men is of no clinical significance and does not require any action.\n\nHis PTH (parathyroid hormone, which regulates calcium and phosphate balance) is 0.774 against a lower limit of 0.98. However, his corrected calcium is 2.5, which is healthy and mid-range, and his phosphate at 1.0 and magnesium at 0.89 are both within range. When calcium is comfortably normal, a slightly low PTH simply means the parathyroid glands have dialled down because they do not need to work hard to maintain calcium levels. His vitamin D at 121 is above the sufficient threshold and reflects his supplementation through the multivitamin, though it sits just above the upper end of the optimal band of 75 to 120, which is not a concern. With calcium, phosphate and magnesium all healthy, the low PTH is a physiological response rather than a problem.\n\nHis vitamin B12 at 547 is within range and above the optimal floor of 500. Folate at 14 is healthy. Vitamin D at 121 is sufficient and reflects his supplementation.\n\nHis CEA (carcinoembryonic antigen, a tumour marker used in screening) is 2.44 against an upper limit of 2.3. This is a marginal elevation of 0.14 above the threshold, and CEA at this level is not clinically significant. Mild elevations can occur with inflammation (his CRP is raised), minor gastrointestinal irritation, or normal variation. It does not suggest malignancy at this margin, but it is worth noting for his GP to have on file and can be rechecked when the CRP is repeated.\n\nHis total antioxidant activity (TAA) at 1.88 is marginally above the upper limit of 1.77. This is likely driven by his multivitamin and creatine supplementation and is not a concern. His ESR (erythrocyte sedimentation rate, another marker of inflammation) is 12, right at the upper limit of its range, which adds a small piece of supporting evidence to the raised CRP picture.\n\nHis MCHC at 344 is one point below the upper limit of 345, and his RDW at 14.6 is within range. His bicarbonate at 30.9 is at the top of its range but within it. None of these are concerns.\n\nConnecting this report to his symptoms: the fatigue, afternoon crash, low mood and frequent illness he has been experiencing for over a year could have several explanations. If the insulin resistance pattern is confirmed on a fasted repeat, that alone can drive afternoon energy crashes because blood sugar regulation becomes less efficient, with sharper peaks and deeper troughs after meals. The raised CRP, if it represents chronic low-grade inflammation, is strongly associated with fatigue, low mood and impaired immune function, and could be contributing to his susceptibility to illness. His sleep, while adequate in duration at 7 to 8 hours, is clearly not restorative given that he wakes tired most mornings, and poor sleep quality is one of the most common drivers of daytime fatigue, afternoon crashes and lowered immunity. The combination of stress that is hard to manage some weeks, an afternoon crash energy pattern and waking tired most mornings raises the possibility of a shifted cortisol rhythm, where the morning cortisol peak that should drive alertness on waking is blunted. His HDL below the ideal level may also reflect the sleep and stress picture, as both poor sleep and chronic stress are associated with lower HDL. The most productive path forward is to confirm or exclude the insulin resistance with a fasted repeat, investigate the CRP source, and address the sleep quality and stress, which are the two areas where he has the most room for improvement and which would be expected to improve energy, mood and immune resilience simultaneously.","links":"The central thread in this report is the relationship between the raised hsCRP at 8.5 and the insulin and C-peptide results. Inflammation and insulin resistance are closely linked: excess insulin promotes inflammatory signalling, and inflammatory molecules in turn make cells less responsive to insulin, creating a self-reinforcing cycle. Whether the insulin results reflect true fasting insulin resistance or a non-fasted sample, the CRP at 8.5 stands on its own as a finding that needs investigation and resolution. If the insulin resistance is confirmed on a fasted repeat, these two findings become one story rather than two, and addressing the insulin resistance through dietary changes and increased activity would be expected to bring the CRP down as well, and vice versa.\n\nThe lipid profile fits into this picture. His HDL at 1.1 is below the ideal of 1.4, and his LDL at 3.14 and ApoB at 0.85 are above their optimal targets. Chronic inflammation can suppress HDL and modestly raise LDL. If the CRP settles, the lipid profile may improve without any other change. At the same time, his Lp(a) below 25 confirms that the entire lipid picture is modifiable: there is no inherited component inflating his LDL, so diet, exercise, inflammation control and body composition are the levers.\n\nThe symptom picture of fatigue, afternoon crashes, low mood, frequent illness and waking unrefreshed ties into both the metabolic and the inflammatory findings. Insulin resistance, if present, causes erratic blood sugar handling after meals, producing the classic afternoon crash as glucose overshoots and then dips. Chronic inflammation is independently associated with fatigue, low mood and impaired immune surveillance, which may explain the frequent illness. Poor sleep quality, where he is getting enough hours but not enough deep, restorative sleep, compounds both: it raises inflammation, worsens insulin sensitivity, suppresses immune function and lowers mood. Stress that is hard to manage some weeks adds another layer, as chronic stress raises cortisol in the evening (contributing to the wired-then-tired pattern) while blunting the morning cortisol rise that should drive alertness on waking.\n\nWhat has been excluded is important. His thyroid is working well with negative antibodies, ruling out autoimmune thyroid disease as a cause of fatigue and mood changes. His iron stores, B12 and folate are all healthy, ruling out anaemia and the common nutritional causes of fatigue. His liver and kidneys are in excellent health. His coeliac screen is negative. His immunoglobulins are normal, meaning his immune system has the raw materials it needs despite the frequent illness. His testosterone, while below the optimal band, is not low enough to explain his symptoms.\n\nThe loose end is the CRP source. At 8.5, it is higher than what body composition alone would explain at a BMI of 26.8. Possibilities include a recent infection or illness (even a mild cold in the week before), a musculoskeletal issue or injury, a dental issue, or an underlying inflammatory process. The fasted repeat should include CRP alongside insulin, glucose and C-peptide, and if the CRP persists above 5 the GP may wish to investigate further with additional inflammatory markers or clinical assessment.","lifestyle":"Cut sugary foods from some days to rarely, starting this week. Swap chocolate, biscuits or sugary drinks for fruit, dark chocolate (85%+) or nuts. Anchor: when the craving hits, the swap is already decided. Why: sugar drives insulin production, and if the raised insulin at 51 is confirmed, reducing sugar is the single most impactful dietary change.\nAdd a source of soluble fibre to one meal a day: porridge oats at breakfast, a portion of beans or lentils at lunch or dinner, or a handful of nuts as a snack. Anchor: attach it to whichever meal is easiest. Why: soluble fibre slows glucose absorption (reducing the insulin spike), lowers LDL cholesterol, and feeds gut bacteria that reduce inflammation, addressing three findings in one habit.\nEat oily fish (salmon, mackerel, sardines) two to three times per week, replacing one red meat or processed meat meal each time. Why: omega-3 from oily fish raises HDL (currently 1.1, ideally above 1.4), lowers triglycerides and reduces inflammation (CRP 8.5).\nFix your wake time to the same time every day, including weekends, within a 30-minute window. Get outside within the first hour of waking for at least 10 minutes of natural light. Anchor: alarm goes off, feet hit the floor, shoes on, step outside. Why: a fixed wake time and morning light reset the cortisol rhythm, which should peak in the morning to drive alertness. This directly targets the tired-most-mornings and afternoon-crash pattern.\nSet a caffeine cut-off at 1pm. No coffee, tea or energy drinks after that time. Why: caffeine has a half-life of five to six hours, meaning a 3pm coffee is still half-active at 9pm. Even if you fall asleep, it reduces deep sleep, which is the restorative phase your body needs, and may explain why 7 to 8 hours still leaves you tired.\nAim for 8,000 to 10,000 steps a day, up from the current 5,000 to 7,500. Anchor: a 15-minute walk after your largest meal, plus taking calls on foot where possible. Why: post-meal walking lowers the glucose and insulin response to that meal, and consistent daily movement raises HDL and lowers CRP over time.\nAim for a calorie intake of approximately 2,600 to 2,800 kcal per day (maintenance for your weight, height and activity level is around 2,900 to 3,000, so a modest deficit of 200 to 400 kcal supports gradual fat loss without affecting training). Protein target: 120 to 145g per day (1.3 to 1.6g per kg of body weight for your training load). Anchor: build each meal around a palm-sized protein source first, then add vegetables and whole grains. Why: adequate protein preserves muscle mass during any fat loss, supports recovery from training, and helps with satiety, reducing the likelihood of reaching for sugary foods.","flags":"hs-CRP 8.5 mg/L, above the upper limit of 5.0 and well above the optimal of below 1.0. This is a meaningful elevation in systemic inflammation. It may reflect a recent infection, injury or exercise, but if it persists on repeat it warrants investigation for an underlying inflammatory driver. The raised CRP is also contributing to his Cardiovascular Risk Score of 40.\nInsulin 51 mIU/L (upper limit 24.9) and C-peptide 5.52 ug/L (upper limit 4.4) are both raised alongside a glucose of 3.6 and HbA1c of 35. If these are truly fasted results, this pattern suggests early insulin resistance with compensatory hyperinsulinaemia and is significant given his family history of type 2 diabetes. If not fully fasted, the results may reflect postprandial insulin secretion. HOMA-IR of 8.16 is only interpretable on a fasted sample. A confirmed fasting repeat of glucose, insulin and C-peptide is needed.\nLDL 3.14 mmol/L (optimal below 2.6), ApoB 0.85 g/L (optimal below 0.8), HDL 1.1 mmol/L (optimal above 1.4 for males), ApoA1 1.19 g/L (desirable above 1.20), ApoB/A1 ratio 0.71 (lower risk below 0.7). Lp(a) below 25 confirms the entire lipid picture is modifiable. The CRP may be contributing to the suppressed HDL and mildly elevated LDL. Diet and exercise changes, plus resolution of the inflammation, should improve this profile.\nCEA 2.44 ng/mL, marginally above the upper limit of 2.3. At this margin, this is not clinically significant and may reflect the raised inflammatory state. Worth rechecking when the CRP is repeated.\nPTH 0.774 pmol/L, below the lower limit of 0.98. With corrected calcium at 2.5 (mid-range) and vitamin D at 121 (sufficient), this is a physiological suppression of parathyroid output rather than a pathological finding.\nProgesterone 0.88 nmol/L, fractionally below the lower limit of 0.89. In men this is of no clinical significance.\nESR 12, at the upper limit of the reference range, providing mild supporting evidence for the raised CRP inflammatory picture.\nTAA 1.88 mmol/L, marginally above the upper limit of 1.77, likely driven by multivitamin and creatine supplementation.\nReassuring negatives: thyroid function normal with negative antibodies, liver enzymes and fibrosis scores all clean, kidney function excellent (eGFR 96), iron studies balanced (ferritin 69, saturation 26.5%), B12 547 and folate 14 both healthy, coeliac screen negative, immunoglobulins all within range, PSA 0.23 with healthy free ratio, CA19-9 within range, haematology panel normal, urinalysis completely clear.","recommendations":"Discuss the raised hs-CRP of 8.5 with your GP. Ask for a repeat hs-CRP in four to six weeks, ideally on a day without heavy exercise in the preceding 48 hours, to determine whether this is a transient or persistent elevation. If it persists above 5, further investigation into the source of inflammation is warranted.\nAsk your GP for a confirmed fasting repeat of glucose, insulin and C-peptide, done first thing in the morning after an overnight fast of at least 8 hours (water only). Mention your family history of type 2 diabetes. If insulin resistance is confirmed, early intervention at 34 is highly effective and the condition is reversible at this stage with dietary and exercise changes.\nBring the lipid results to your GP: LDL 3.14 (optimal below 2.6), ApoB 0.85 (optimal below 0.8), HDL 1.1 (ideal above 1.4). The Lp(a) below 25 confirms these are modifiable. Dietary changes (increased soluble fibre, oily fish two to three times per week, reduced sugar and saturated fat) and increased exercise should be trialled for three to six months before reassessing.\nMention the CEA of 2.44 (upper limit 2.3) for your GP's records. This is a marginal elevation likely related to the inflammation and is not concerning at this level, but it should be rechecked alongside the CRP repeat.\nCalorie target: 2,600 to 2,800 kcal per day for gradual body composition improvement. Protein target: 120 to 145g per day (1.3 to 1.6g per kg). Retest in four to six months, repeating at minimum: hs-CRP, fasting glucose, fasting insulin, C-peptide, HbA1c, full lipid panel with ApoB, and a full blood count. These markers will show whether the dietary and exercise changes are working.","supplementation":"Omega-3 fish oil: 2 to 3g of combined EPA and DHA daily, taken with a meal containing fat. Why: omega-3 at this dose lowers inflammation (CRP 8.5), raises HDL (currently 1.1), and lowers triglycerides. This is the most evidence-based supplement for his profile.\nVitamin D3 (cholecalciferol): continue current intake through the multivitamin. His level at 121 nmol/L is sufficient and just above the optimal ceiling of 120, so no additional supplementation is needed. If his multivitamin provides less than 2,000 IU, maintain that dose through winter to prevent the seasonal drop.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones and teeth rather than soft tissues, and is a sensible companion to vitamin D supplementation.\nMagnesium glycinate: 300 to 400mg before bed. Why: magnesium at 0.89 is within range but in the lower half of the optimal band, and glycinate specifically supports sleep quality, which is his weakest lifestyle area. Better sleep quality will help with the morning tiredness, afternoon crash, mood and immune resilience.\nDo not take iron supplements. His ferritin at 69, transferrin saturation at 26.5% and serum iron at 16.7 are all healthy, and additional iron is unnecessary and could be harmful.\nThe most important changes from this report are not supplements. They are reducing sugary foods, adding soluble fibre and oily fish to the diet, fixing the wake time and morning light exposure to improve sleep quality, and getting the fasted insulin and CRP repeat with his GP to confirm or exclude insulin resistance and identify the source of inflammation.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"54","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4909","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 54 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 54. Weakest systems: specialized tests 8%, inflammation 11%, glucose & insulin 18%. Biggest drags: Insulin, HOMA-IR, hs-CRP (High-Sensitivity C-Reactive Protein), C-Peptide.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"32.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4115","lower_normal":"","upper_normal":"39","lower_optimal":"","upper_optimal":"34","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4359","units":"years","description":"PhenoAge is a composite biological age score developed from large population studies. It uses albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count to estimate how old the body appears at a cellular level. His PhenoAge of 32.1 against a calendar age of 34 means his biological age is approximately two years younger than his chronological age. This is a positive finding. The CRP at 8.5 is the main marker pulling PhenoAge upward; if it settles on repeat, his biological age would likely drop further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, not the ten-year chance of an event. His score of 40 is on the boundary of acceptable (below 40) and flagged (above 40). The main drivers are his hsCRP at 8.5 and his LDL and ApoB sitting above their optimal targets, with HDL below ideal also contributing. At 34, his ten-year event risk is low, but the score reflects the risk trajectory being built now. The gap between a low ten-year risk and a score of 40 is the window for acting. Resolving the CRP, improving the lipid profile and raising HDL would bring this score down significantly.","low_causes":"Optimal lipids, low inflammation, healthy blood sugar","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the concentration of sugar in the bloodstream at the time the sample was taken. His result of 3.6 is within the laboratory range but sits right at the lower end, just above the lower limit of 3.5 and below the optimal floor of 4.0. In isolation, a glucose this low can mean the sample was taken a long time after eating, or it can reflect the body being very efficient at clearing glucose from the blood. In the context of the raised insulin and C-peptide in this report, the low glucose may represent insulin working hard to push sugar out of the bloodstream, which is why these three markers need to be repeated together on a confirmed fasting sample.","low_causes":"Prolonged fasting, excessive insulin production, reactive hypoglycaemia, medications, alcohol, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, insulin resistance, stress, infection, medications (steroids), Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin (the oxygen-carrying protein in red blood cells) that has glucose attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. His result of 5.4% is within the normal range (below 6.0%) and below the pre-diabetes threshold of 6.0 to 6.4%. This is reassuring and confirms that whatever is happening with his insulin and glucose in the short term, his average blood sugar over the past three months has been well controlled.","low_causes":"Low average blood sugar, anaemia, blood loss, haemolysis","high_causes":"Pre-diabetes, diabetes, high average blood sugar, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, which is the standard unit used in UK laboratories. His result of 35 is well within the normal range (below 42) and below the pre-diabetes threshold of 42 to 47. Combined with the percentage reading of 5.4%, this confirms excellent average blood sugar control over the past three months.","low_causes":"Low average blood sugar, anaemia, blood loss","high_causes":"Pre-diabetes, diabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"51.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that moves glucose from the blood into cells for energy or storage. His result of 51.01 is more than double the upper limit of 24.9 and well above the optimal range of 2 to 8. This result needs to be interpreted in the context of whether the sample was taken fully fasted. If it was a fasting sample, this level of insulin alongside a glucose of 3.6 suggests the pancreas is overproducing insulin to maintain normal blood sugar, a pattern consistent with early insulin resistance. If he had eaten in the hours before the draw, insulin rises sharply after food and this level could simply reflect a postprandial response. A confirmed fasting repeat with his GP is the essential next step.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, pancreatic disease, low-carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, pre-diabetes, obesity, polycystic ovary syndrome, insulinoma, non-fasting sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"5.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7798","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/L","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin. It is a more stable measure of true insulin production because, unlike insulin itself, it is not cleared by the liver on first pass. His result of 5.52 ug/L is above the upper limit of 4.4, confirming that the pancreas is producing more insulin than expected. This mirrors the raised insulin finding and carries the same interpretation: if from a fasting sample, it suggests insulin resistance; if from a non-fasting sample, it may reflect a normal postprandial response. The repeat should include C-peptide alongside glucose and insulin.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes, exogenous insulin use, pancreatic disease","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, non-fasting sample, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"8.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculated ratio of fasting insulin and fasting glucose that estimates how resistant the body's cells are to insulin. His result of 8.16 is well above the upper limit of 1.5 and far above the optimal ceiling of 1.0. However, HOMA-IR is only valid when calculated from a truly fasting sample (8 to 12 hours, water only). If the sample was not fully fasted, this number is not interpretable as it may simply reflect a postprandial insulin rise. This is why the fasting repeat with his GP is essential before drawing any conclusions about insulin resistance.","low_causes":"High insulin sensitivity, low-carbohydrate diet, very lean body composition","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, metabolic syndrome, non-fasting sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4214","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate daily average blood sugar. His result of 5.9 mmol/L is within the ideal range, confirming that despite the raised single-point insulin, his average blood sugar over the past three months has been healthy.","low_causes":"Excellent blood sugar control, low carbohydrate intake","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4580","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG Index (triglyceride-glucose index) is a surrogate marker of insulin resistance calculated from fasting triglycerides and fasting glucose. His result of 8.06 is within the ideal range of below 8.5. This is an interesting finding alongside the raised insulin, because TyG uses glucose and triglycerides rather than insulin directly, and both of those are healthy. It adds weight to the possibility that the raised insulin may not reflect true fasting insulin resistance.","low_causes":"High insulin sensitivity, low triglycerides, low glucose","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"26.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4098","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-transport protein transferrin that is currently loaded with iron. It gives a picture of how much iron is actively being moved around the body. His result of 26.49% is within both the laboratory and optimal ranges, indicating a healthy balance of iron supply and demand.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss","high_causes":"Haemochromatosis, iron overload, liver disease, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"16.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4196","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5601","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the draw. It fluctuates throughout the day and with meals, making it less reliable on its own than ferritin or transferrin saturation. His result of 16.7 is within the laboratory range and indicates adequate circulating iron levels.","low_causes":"Iron deficiency, chronic disease, blood loss, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to where it is needed. Its level reflects both iron demand and the liver's synthetic function. His result of 2.51 is within the ideal range, indicating normal iron transport capacity and healthy liver protein production.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"58.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4870","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity measures how much iron the blood could carry if every transferrin molecule were fully loaded. It is an indirect SE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. His result of 121 nmol/L is above the sufficient threshold of 50 and reflects his multivitamin supplementation. It sits just above the upper end of the optimal band (75 to 120), which is not a concern, as levels up to 150 are considered safe. He should continue his current supplementation through the winter months to maintain this level, as vitamin D drops significantly in the UK between October and March.","low_causes":"Insufficient sun exposure, dark skin, obesity, malabsorption, liver or kidney disease","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"ELECTROLYTES & MINERALS","result":"0.774","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3150","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3351","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid hormone) is produced by the parathyroid glands in the neck and regulates calcium and phosphate levels in the blood. When calcium is low, PTH rises to release calcium from bone and increase absorption from the gut. His PTH at 0.774 is below the lower limit of 0.98, but his corrected calcium is 2.5 (healthy and mid-range), his phosphate is 1.0 (normal) and his vitamin D is 121 (sufficient). When calcium and vitamin D are both healthy, the parathyroid glands appropriately reduce PTH output because they do not need to work to maintain calcium levels. This is a physiological suppression rather than a sign of parathyroid disease, and no action is needed.","low_causes":"Adequate calcium and vitamin D (physiological suppression), hypoparathyroidism (rare), magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"547","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4829","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for red blood cell production, nerve function and DNA synthesis. It can only be obtained from animal foods or supplements. His result of 547 is within the optimal range of 500 to 900, indicating healthy B12 status. His multivitamin likely contributes to this healthy level.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for cell division, red blood cell formation and DNA synthesis. It works alongside B12. His result of 14 is within the ideal range and reflects a diet rich in vegetables and fruit (4 to 5 portions
