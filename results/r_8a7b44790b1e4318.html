<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kerrianne Burns","dob":"16/03/1977","report_date":"2026-11-02","summary":"This is Kerrianne's second TrueVitals report, taken approximately five months after her baseline test in June 2026. Her quiz answers are unchanged from the first test: she is a 49-year-old female with a BMI of 25.4, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. She trains three times per week (two cardio, one resistance) with 2,000 to 5,000 daily steps. She has diagnosed hypertension managed with amlodipine, takes an SSRI, and is on hormone replacement therapy consisting of one pump of oestrogen daily, progesterone for two weeks each cycle, and two pumps of testosterone twice weekly. She supplements with vitamin D and omega-3, and uses painkillers (ibuprofen and paracetamol) frequently. She reports low energy, brain fog, joint pain and stiffness in her hips and back, no libido, exhaustion, decreased ability to handle stress at work as a teacher, sore bones, and dry eyes. She has had no periods for six months. Her goals are to improve energy levels, balance hormones, and reduce stress and anxiety.\n\nThe most important new finding in this report is in the urinalysis. Her urine white blood cells are 50 per microlitre (significant is above 10), her red blood cells are above 500 per microlitre (significant is above 25), and there is a moderate growth of Group B Streptococcus. Urine protein is also positive. Taken together, this pattern points to a urinary tract infection and she should see her GP promptly. She may not have classic symptoms of burning or frequency, but the combination of significant white cells, heavy red cells and a named organism with sensitivity results means it needs treating. The organism is sensitive to erythromycin, linezolid, daptomycin, teicoplanin, vancomycin, tigecycline and rifampicin, and resistant to tetracycline. Her GP will choose the appropriate antibiotic based on these sensitivities. Because the red blood cell count is very high, a repeat urinalysis should be performed after the infection has been treated to confirm the haematuria resolves, as persistent blood in the urine at 49 would need further investigation.\n\nThe second finding that needs attention is the ESR. Her erythrocyte sedimentation rate, a measure of how quickly red blood cells settle in a tube and a broad marker of inflammation, has risen from 2 in June to 46 now. That is a very large change. The most likely explanation is the urinary tract infection identified above, because active infection is one of the most common causes of a raised ESR. However, an ESR of 46 can also reflect other inflammatory processes, autoimmune activity, or hormonal changes associated with the menopause. Her high-sensitivity CRP (another inflammation marker that responds more quickly to acute inflammation) is 1.4, up from 0.8 but still well within range, which slightly favours a lower-grade or more chronic process rather than a severe acute infection. Once the UTI has been treated, her GP should repeat the ESR to confirm it falls back towards normal. If it remains elevated after treatment, further investigation would be warranted.\n\nThere is a good deal of positive news in this report, and some genuine improvements since June. Her PhenoAge, a biological ageing score built from blood markers, is 37.4 against a calendar age of 49, meaning her blood is ageing nearly twelve years younger than her birthday suggests. That is an excellent result. Her thyroid continues to work well, with TSH at 1.69 (up slightly from 1.11 but still within the optimal range), free T4 at 15.8, and free T3 at 4.6, and both sets of thyroid antibodies remain negative, ruling out autoimmune thyroid disease as a contributor to her fatigue. Her liver is in good health despite the multiple medications she takes: GGT has improved from 24 to 16, which is genuinely clean, and her FIB-4 score has come down from 1.52 (which was flagged last time) to 1.4, now within range. Her blood sugar control remains healthy with a glucose of 5.1, HbA1c of 35 (improved from 37), and an insulin of 4.94, giving a HOMA-IR of 1.12, all of which confirm good insulin sensitivity. Her calcium and corrected calcium are within range, and her magnesium at 0.94 is within the optimal band. Her kidney function markers (creatinine 70, urea 5.9, cystatin C 1.09) are stable, though the cystatin C-based eGFR at 79 is worth noting and is discussed below. Her vitamin D has improved from 87 to 91, now sitting within the optimal range of 75 to 120, reflecting the benefit of her ongoing supplementation. Her B12 has improved significantly from 225 to 380, moving into the adequate range, likely reflecting supplementation or dietary change since the last test. Her folate at 14 is healthy. Her ferritin has risen from 35 to 51, which is an improvement and now sits within the optimal range for a post-menopausal woman. Her rheumatoid factor remains low at 4, her coeliac screen is negative, and her immunoglobulins are all within range. All tumour markers (CA-125 at 9.2, CA 15-3 at 14, CA 19-9 at 1.46, CEA below 0.5) are clean.\n\nTurning to the lipid picture, which was flagged at her first test. Her total cholesterol has risen from 6.3 to 7.3, LDL from 4.17 to 5.02, ApoB (a count of the harmful cholesterol-carrying particles in the blood) from 1.35 to 1.47, and non-HDL cholesterol from 4.5 to 5.5. These have all moved in the wrong direction. Her ApoB/A-I ratio, the single best summary of cardiovascular balance, has risen from 0.68 to 0.86, crossing from average risk into the higher-risk band. Her Cardiovascular Risk Score, a TrueVitals composite built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 55 out of 100, which is above the 40 threshold and driven primarily by the ApoB and LDL. Her Lp(a), which is genetically determined and cannot be changed through lifestyle, is below 25, which is ideal and means that the entire lipid problem is modifiable through diet, exercise and, if needed, medication. On the protective side, her HDL remains excellent at 1.8, her triglycerides at 1.21 are still healthy (though up from 0.86), her triglyceride-to-HDL ratio is good, and her atherogenic index of plasma is favourable at minus 0.17. The worsening of the LDL and ApoB in a five-month window, with no obvious dietary deterioration, is most likely driven by the menopause itself: oestrogen helps the liver clear LDL particles from the blood, and as oestrogen levels fluctuate and decline through the perimenopause and menopause, LDL rises. Her oestradiol at 425 is above the post-menopausal range, reflecting her HRT, but one pump daily may not be fully replicating the LDL-clearing effect of pre-menopausal oestrogen levels. This is a conversation for both her GP and her HRT prescriber. Given her existing hypertension, the combination of high blood pressure and an ApoB of 1.47 means her overall cardiovascular risk profile deserves a formal review.\n\nHer hormonal picture has shifted since June. Her FSH has fallen from 73.6 to 46.1 and her LH from 49.2 to 25.8. Both remain in the post-menopausal range (FSH above 23 confirms menopause), but the drop, combined with an oestradiol of 425 (well above the post-menopausal ceiling of 118) and a progesterone of 11.09 (above the post-menopausal ceiling of 2.32), confirms that her HRT is having a measurable hormonal effect. Her total testosterone at 1.8 is within the female reference range of 0.5 to 2.6, and her free testosterone at 0.017 and free androgen index at 2.14 are also within range. However, the previous report identified that her SHBG at 97.6 was binding too much of the supplemented testosterone, leaving very little free for the body to use. Her SHBG has now fallen from 97.6 to 84.1, which is a move in the right direction, and her free androgen index has improved from 1.43 to 2.14 as a result. Despite this improvement, she still reports no libido, which suggests the free testosterone may still not be adequate for her individual threshold, or that the libido issue has other contributors including fatigue, the SSRI (which is a well-recognised cause of reduced libido), stress, and mood. This is worth discussing with her HRT prescriber to consider whether the testosterone dose could be adjusted further, and with her GP to consider whether the SSRI may be playing a role.\n\nHer DHEA-S at 2.1 micromol per litre has risen from June. DHEA-S is an adrenal hormone that serves as a precursor for both testosterone and oestrogen, and the rise may reflect the testosterone supplementation or natural fluctuation. Her cortisol at 408 is within the morning reference range, unchanged in character from 381 in June, and does not suggest adrenal dysfunction, though it does not capture the cortisol rhythm across the day, which is where stress-related dysregulation usually shows.\n\nHer kidney function needs a brief note. Her creatinine-based eGFR is 88 (unchanged from June), and her cystatin C-based eGFR is 79, giving a combined eGFR of 79. Cystatin C is a more accurate measure of kidney filtration because it is not affected by muscle mass or diet. An eGFR of 79 is mildly reduced (optimal is above 90) and sits in the same area as June (cystatin C was 0.93 then, now 1.09, and 1.1 is the upper limit). This is not an urgent concern, but it is worth monitoring. Her frequent use of ibuprofen is relevant here: non-steroidal anti-inflammatory drugs can reduce kidney blood flow over time, and with an eGFR already below 90, reducing or stopping regular ibuprofen use would be prudent. Her amlodipine (a calcium channel blocker for blood pressure) is kidney-neutral, which is reassuring.\n\nHer parathyroid hormone (PTH) remains below range at 0.456 (range 0.98 to 4.73), down from 0.8 in June. PTH regulates calcium by telling the bones to release it and the kidneys to retain it. When calcium is adequate (hers is, at 2.38 corrected), PTH is appropriately suppressed, so a low PTH with normal calcium is not dangerous. However, it was also low last time, and the vitamin D supplementation she takes can itself suppress PTH by improving calcium absorption from the gut. This is the most likely explanation. It does not need urgent action, but her GP should be aware of the pattern, and if vitamin D levels rise much further (she is at 91, well within range), the PTH suppression could become more pronounced.\n\nHer C-Peptide at 0.805 micrograms per litre is below the laboratory range of 1.1 to 4.4. C-Peptide is released by the pancreas alongside insulin and measures how much insulin the pancreas is producing. Her insulin at 4.94 is within range and her blood sugar control is excellent, so the low C-Peptide reflects a pancreas that does not need to work hard rather than one that is failing. This was a similar finding in June, when C-Peptide was also below range, with insulin at 2.51 also below range. Her HOMA-IR at 1.12 confirms healthy insulin sensitivity. This is not a concern, but it is worth continuing to monitor.\n\nHer neutrophil count has fallen from 2.46 to 1.98, now marginally below the lower limit of 2.0. Neutrophils are the white blood cells that fight bacterial infections, and at 1.98 she is just 0.02 below the lower limit. This can be a normal variant in some individuals (benign ethnic neutropenia is common in certain populations, though less so in people of European ancestry), and the SSRI she takes can occasionally contribute to mild neutropenia. Given that she has an active urinary tract infection, the mildly low neutrophil count is worth mentioning to her GP, though it may simply reflect redistribution of neutrophils to the site of infection.\n\nHer total antioxidant activity at 1.95 is above the reference range of 1.3 to 1.77, up from 1.52 in June. This is likely driven by her omega-3 and vitamin D supplementation and is not a concern; it reflects higher circulating antioxidant capacity.\n\nA few minor findings to note. Her MCH at 33.3 and MCHC at 349 are marginally above range, identical to or very close to June (MCH was 33.3, MCHC was 345). At this margin, these are a stable constitutional feature rather than a progressive problem, and her B12 improvement from 225 to 380 has not changed them, which suggests they are simply how her red cells are built. Her MPV at 11.1 is above the reference range of 7.1 to 10.1, up from 9.9 in June. MPV measures the average size of platelets; larger platelets are younger and more active, and a mildly raised MPV can be seen with inflammation or increased platelet turnover. Given the raised ESR and the UTI, this may be a transient finding. Her basophils at 0.01 are marginally below the lower limit of 0.02, which was also the case in June and is of no clinical significance. Her transferrin at 2.4 is marginally below the range of 2.5 to 3.8, very similar to June (2.48), but her ferritin has improved and her iron and saturation are healthy, so this is not pointing to iron deficiency.","links":"The dominant new finding in this report is the urinary tract infection, and it likely explains several of the changes seen since June. The ESR has risen from 2 to 46, and the most plausible single explanation is the UTI, because active infection is one of the strongest drivers of ESR elevation. The mildly raised CRP (from 0.8 to 1.4) fits the same picture, as does the rise in MPV (from 9.9 to 11.1), which can reflect increased platelet turnover during an inflammatory or infectious process. The borderline neutropenia at 1.98 may also be related, with neutrophils being consumed at the site of the infection. Once the UTI is treated, a repeat blood test in six to eight weeks should show whether all of these markers normalise.\n\nThe lipid deterioration stands apart from the infection and tells a different story. Between June and November, LDL has risen by 0.85 points, ApoB by 0.12, and total cholesterol by a full point. Triglycerides have risen modestly from 0.86 to 1.21. This trajectory is consistent with the hormonal transition of menopause: declining endogenous oestrogen reduces the number of LDL receptors on the liver, slowing the clearance of ApoB-containing particles from the blood. Her HRT provides exogenous oestrogen, but the dose may not be sufficient to fully offset this effect. What makes this clinically important is the context: she already has hypertension, and the combination of elevated ApoB, elevated blood pressure, and now an ApoB/A-I ratio in the higher-risk band means her overall cardiovascular risk profile has shifted and deserves a formal GP review.\n\nThe hormonal picture is mixed. The good news is that SHBG has fallen, free testosterone has risen, and the FAI has improved, all of which suggest the testosterone supplementation is having more effect than it was in June. The persistent lack of libido despite these improvements raises the possibility that the SSRI is a significant contributor, since reduced libido is one of the most common side effects of that class of medication. The interplay between the SSRI, the testosterone dose, and the ongoing fatigue and stress is worth a conversation with both the HRT prescriber and the GP.\n\nThe kidney function picture is a thread that connects the frequent painkiller use to a mildly reduced eGFR. The cystatin C-based eGFR of 79, combined eGFR of 79, and a cystatin C at the very top of its range at 1.09 (limit 1.1) are not alarming, but they are a step below optimal for 49. Regular ibuprofen reduces blood flow to the kidneys and, over years, can contribute to a gradual decline in filtration. The blood pressure medication she takes (amlodipine) does not harm the kidneys, but the combination of hypertension and regular NSAID use is one that GPs keep a close eye on. Reducing the ibuprofen, and exploring alternatives for her joint and bone pain, would protect kidney function going forward.\n\nTwo things that were excluded are worth highlighting. Her thyroid remains completely healthy, which is important because hypothyroidism is a common cause of fatigue, brain fog, weight gain, and even rising cholesterol in women at this age, and these results make it very unlikely. Her blood sugar control is excellent, with an HbA1c of 35 and healthy insulin sensitivity, which means metabolic syndrome is not contributing to the lipid rise or the fatigue.","lifestyle":"Add two portions of vegetables or salad to your largest meal each day, building towards five portions across the day. Anchor: when you plate up dinner, vegetables go on first before anything else. Why: at a diet quality of 5 out of 10, increasing plant intake is the single easiest lever for lowering LDL and providing the fibre, potassium and antioxidants your cardiovascular system needs with an ApoB of 1.47.\nSwap one portion of saturated fat per day for unsaturated fat: butter for olive oil, cheese for avocado, or a biscuit for a handful of nuts. Anchor: pick whichever meal is easiest, and make the swap automatic. Why: saturated fat drives LDL particle production, and your LDL has risen from 4.17 to 5.02 in five months.\nEat oily fish (salmon, mackerel, sardines) twice a week, on top of your omega-3 supplement. Anchor: pick two fixed days and plan them in advance. Why: EPA and DHA from whole fish lower triglycerides (yours have risen from 0.86 to 1.21) and support cardiovascular health alongside your supplement.\nAdd a 15-minute walk after your evening meal, every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers glucose and insulin responses, supports the healthy HOMA-IR you already have, and adds to your step count (currently 2,000 to 5,000) without needing extra motivation.\nAim to increase your daily steps towards 7,000 to 8,000 over the next eight weeks. Anchor: use a phone or watch to track, and add steps wherever they fit (parking further away, walking part of your commute, a lunchtime loop at school). Why: regular low-intensity movement supports cardiovascular health, joint mobility, energy, and mood, all of which are among your goals.\nReplace ibuprofen with paracetamol where possible, and discuss long-term pain management alternatives with your GP. Anchor: next time you reach for ibuprofen, pause and consider whether paracetamol would do the job. Why: your cystatin C-based eGFR is 79 (optimal is above 90), and regular ibuprofen reduces kidney blood flow over time.\nPrioritise a consistent bedtime and wake time seven days a week, even on weekends. Anchor: set a phone alarm 30 minutes before your target bedtime as a wind-down cue. Why: sleep quality directly affects cortisol rhythm, stress tolerance, energy, and brain fog, all of which are among your chief complaints.\nAim for 90 to 110 grams of protein per day, spread across three meals (a palm-sized portion at each). Your estimated maintenance calories are approximately 1,900 to 2,000 per day (BMR around 1,430, multiplied by a light-to-moderate activity factor of 1.45). Why: adequate protein supports muscle, bone density, and satiety, and at 75 kg with three training sessions a week, 1.3 grams per kilogram is the minimum target.","flags":"Urinary tract infection: urine WBC 50 (significant above 10), RBC above 500 (significant above 25), urine protein positive, moderate growth of Group B Streptococcus with sensitivities returned. Needs GP review and treatment. Repeat urinalysis after treatment to confirm haematuria resolves.\nESR 46 (range below 12), up from 2 in June. Most likely driven by the UTI but a large rise. Repeat after UTI treatment to confirm normalisation; if it remains elevated, further investigation is warranted.\nApoB 1.47 (threshold below 0.9), up from 1.35, with LDL 5.02 (range below 3, up from 4.17), total cholesterol 7.3 (up from 6.3), non-HDL 5.5 (up from 4.5), and ApoB/A-I ratio 0.86 (up from 0.68, now in the higher-risk band). Cardiovascular Risk Score 55 out of 100. Protective markers remain good (HDL 1.8, triglycerides 1.21, Lp(a) below 25). Worsening likely menopausal. In the context of existing hypertension, formal cardiovascular risk review with GP recommended.\nCystatin C 1.09 (limit 1.1), cystatin C-based eGFR 79, combined eGFR 79 (optimal above 90). Mildly reduced kidney filtration. Regular ibuprofen use is a risk factor for further decline. GP should be aware.\nNeutrophils 1.98 (range 2.0 to 7.0), marginally below range, down from 2.46. May reflect redistribution during UTI or SSRI effect. Worth noting to GP given the active infection.\nPTH 0.456 pmol/L (range 0.98 to 4.73), below range, down from 0.8. Corrected calcium 2.38 is normal. Most likely suppressed by vitamin D supplementation (vitamin D 91). Not dangerous, but GP should be aware of the ongoing pattern.\nC-Peptide 0.805 ug/L (range 1.1 to 4.4), below range, with insulin 4.94 (in range) and excellent blood sugar control. Reflects low insulin demand, not pancreatic failure. Similar to June. Monitor at next test.\nTransferrin 2.4 (range 2.5 to 3.8), marginally below range, stable from 2.48. Iron, ferritin, and saturation are all healthy, so this is not indicating iron deficiency.\nMCH 33.3 (range 27 to 32), MCHC 349 (range 315 to 345), MPV 11.1 (range 7.1 to 10.1), basophils 0.01 (range 0.02 to 0.1). All marginal and stable from June (MCH 33.3, MCHC 345, MPV 9.9, basophils 0.01). MCH and MCHC appear constitutional. MPV rise may be transient and infection-related.\nTotal antioxidant activity 1.95 (range 1.3 to 1.77), above the reference range, most likely driven by omega-3 and vitamin D supplementation. Not a clinical concern.\nReassuring negatives: thyroid function and antibodies normal, rheumatoid factor 4, coeliac screen negative, HbA1c 35, HOMA-IR 1.12, liver enzymes healthy (GGT 16, ALT 36, FIB-4 1.4 now within range), immunoglobulins normal, all tumour markers clean, calcium and magnesium normal, vitamin D 91 (optimal), B12 improved to 380, ferritin improved to 51, Lp(a) below 25.\nNot reported on this occasion: potassium, phosphate.","recommendations":"See your GP about the urinary findings: urine WBC 50, RBC above 500, and a moderate growth of Group B Streptococcus. Sensitivity results are available for antibiotic selection. A repeat urinalysis after treatment should confirm the haematuria resolves.\nRequest a repeat ESR after the UTI has been treated (six to eight weeks). If the ESR remains elevated above 12, further investigation would be appropriate.\nDiscuss cardiovascular risk formally with your GP. ApoB has risen from 1.35 to 1.47, LDL from 4.17 to 5.02, and the ApoB/A-I ratio is now 0.86, in the higher-risk band. Combined with existing hypertension, a review of whether dietary changes alone are sufficient or whether lipid-lowering medication should be considered is appropriate. Bring these numbers to the appointment.\nDiscuss reducing or stopping regular ibuprofen with your GP, given the cystatin C-based eGFR of 79. Explore alternative pain management strategies for the hip, back, and joint pain, such as paracetamol, topical anti-inflammatories, physiotherapy, or a pain management review.\nDiscuss the persistent lack of libido with both your HRT prescriber and your GP. The testosterone dose has improved free testosterone (FAI up from 1.43 to 2.14), but the SSRI is a recognised cause of reduced libido and may be the limiting factor. Options to explore with your GP and HRT prescriber include adjusting the testosterone dose and reviewing whether the SSRI may be contributing.\nMention the ongoing low PTH (0.456, down from 0.8) to your GP. It is likely suppressed by vitamin D supplementation and not dangerous with normal calcium, but worth recording in the notes.\nRetest in 12 weeks with a focused panel: full lipid profile with ApoB, ESR, CRP, cystatin C, full blood count, urinalysis, and a fasting glucose and insulin. This will show whether the dietary changes are reducing the LDL and ApoB, whether the ESR has normalised after UTI treatment, and whether the kidney function is stable. Target protein intake 90 to 110 grams per day; maintenance calories approximately 1,900 to 2,000 per day.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily, taken with your largest meal (which contains fat for absorption). Continue your current supplementation. Why: your vitamin D has improved from 87 to 91 and is now within the optimal range of 75 to 120; 2,000 IU daily will maintain it there.\nVitamin K2 (MK-7), 100 micrograms daily, taken alongside your vitamin D. Why: K2 directs calcium into bones and teeth rather than arteries, which is particularly relevant with ongoing vitamin D supplementation and a suppressed PTH.\nOmega-3 fish oil, 2 to 3 grams of combined EPA and DHA daily, taken with food. Continue your current supplementation. Why: omega-3 supports cardiovascular health, and with your ApoB at 1.47 and triglycerides rising from 0.86 to 1.21, maintaining a therapeutic dose is important.\nMagnesium glycinate, 300 mg before bed. Why: your magnesium at 0.94 is within the optimal range, but glycinate specifically supports sleep quality, muscle relaxation, and stress tolerance, all of which align with your goals of improving energy and reducing stress.\nVitamin B12 (sublingual methylcobalamin), 1,000 micrograms daily, dissolved under the tongue. Why: your B12 has improved from 225 to 380, which is encouraging, but remains below the optimal threshold of 500. Sublingual methylcobalamin bypasses gut absorption and is the most effective form. Continue until above 500 and then maintain with 500 micrograms daily.\nDo not take iron supplements. Your ferritin has improved from 35 to 51 (now within the optimal range for a post-menopausal woman), your iron is 16, and your transferrin saturation is 26.5 percent. There is no iron deficiency.\nThe most important changes from this report are not supplements. They are treating the urinary tract infection, reducing ibuprofen use to protect the kidneys, making the dietary changes that will bring the ApoB and LDL down, and having the cardiovascular risk conversation with the GP.","is_retest":true,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 55 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 55.1. Weakest systems: urinalysis 0%, lipids & cardiovascular 15%, inflammation 39%. Biggest drags: LDL Cholesterol, Apolipoprotein B, C-Peptide, Total Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"37.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3463","lower_normal":"","upper_normal":"54","lower_optimal":"","upper_optimal":"49","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4537","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count). Kerrianne's PhenoAge is 37.4 against a calendar age of 49, meaning her blood is ageing nearly 12 years younger than her birthday suggests. This is an excellent result, driven by her healthy glucose, low CRP, good albumin, and favourable blood cell markers. Despite her symptoms of fatigue and brain fog, her underlying biology is ageing well.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It measures the cardiovascular risk being built in the blood, not the ten-year event probability. Kerrianne's score is 55, above the 40 threshold, driven primarily by the ApoB of 1.47 and LDL of 5.02. Her protective factors (HDL 1.8, Lp(a) below 25, HbA1c 35) are strong, but the ApoB and LDL are high enough to push the score into the flagged range. This score should improve with dietary changes and, if needed, medication.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3214","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found mainly inside liver cells. When liver cells are stressed or damaged, ALT leaks into the bloodstream, so a higher level suggests more liver strain. Kerrianne's ALT is 36, within the laboratory range of up to 56 but above the optimal threshold of 25 for women. It has risen from 27 in June. At this level, there is no evidence of liver damage, but the rise is worth watching. Her other liver markers remain healthy (GGT 16, bilirubin 6, albumin 44), so the liver is not under significant strain. The ALT rise could reflect her multiple medications, the frequent painkiller use, or normal variation.","low_causes":"","high_causes":"Liver inflammation, medications, fatty liver, obesity, alcohol, viral hepatitis","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"27","baseline_date":"2026-06-23"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6042","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in liver, heart, and muscle cells. Like ALT, it rises when those cells are damaged. Kerrianne's AST is 39, within the laboratory range of 13 to 45 but above the optimal ceiling of 35. It has risen from 32 in June. The AST-to-ALT ratio (De Ritis ratio) is 1.08, which is within the optimal range and does not suggest chronic liver disease. The rise in both ALT and AST together, in the context of clean GGT and bilirubin, is more likely related to muscle turnover from her training or medication effects than to liver pathology.","low_causes":"","high_causes":"Liver inflammation, muscle damage, cardiac injury, medications, strenuous exercise","padding":"1","one_sided":"","range_type":"normal","baseline_result":"32","baseline_date":"2026-06-23"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":" rmal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the main protein made by the liver. It carries hormones, vitamins, and medications through the blood and maintains fluid balance. Low albumin can indicate liver disease, kidney loss, or poor nutrition. Kerrianne's albumin is 44, within the optimal range and very close to 45 in June. A stable, healthy result that confirms good liver synthetic function.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"","range_type":"normal","baseline_result":"45","baseline_date":"2026-06-23"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) and transport proteins. It is calculated by subtracting albumin from total protein. Kerrianne's globulin is 30, within the optimal range and up from 27 in June. The rise is not concerning and is consistent with an active immune response, which fits with the urinary tract infection identified in this report.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, myeloma","padding":"1","one_sided":"","range_type":"normal","baseline_result":"27","baseline_date":"2026-06-23"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4214","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_  CARDIOVASCULAR","result":"5.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9360","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL cholesterol is the primary carrier of cholesterol into artery walls, where it can build up as plaque over time. It is the main driver of atherosclerosis (hardening of the arteries). Kerrianne's LDL is 5.02, well above the upper limit of 3 and up from 4.17 in June. This is the most significant lipid change in this report. The rise is most likely driven by the menopause: as endogenous oestrogen declines, the liver produces fewer LDL receptors, so fewer LDL particles are cleared from the blood. Her Lp(a)-corrected LDL is 4.94, confirming that virtually all of this LDL is modifiable through diet and, if needed, medication.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, menopause, obesity, kidney disease","padding":"1","one_sided":"","range_type":"normal","baseline_result":"4.17","baseline_date":"2026-06-23"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8654","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/l","description":"HDL cholesterol is the protective cholesterol. It carries cholesterol away from artery walls and back to the liver for disposal. Higher levels are better. Kerrianne's HDL is 1.8, well above the desirable threshold of 1.55 and within the optimal range for women (above 1.6). This is unchanged from June and is an excellent result that provides meaningful protection against the elevated LDL.","low_causes":"Sedentary lifestyle, obesity, smoking, high-carb diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"","range_type":"no upper","baseline_result":"1.8","baseline_date":"2026-06-23"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3559","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, mainly reflecting recent dietary carbohydrate and fat intake. Elevated levels increase cardiovascular risk and are associated with insulin resistance. Kerrianne's triglycerides are 1.21, within the laboratory range of below 1.7 but above the optimal ceiling of 1.0, and up from 0.86 in June. The rise is modest and the level is not concerning, but it has moved her triglyceride-to-HDL ratio from an ideal 0.48 to 0.67, which remains healthy.","low_causes":"Low-carb diet, hyperthyroidism, malnutrition","high_causes":"High-carb or high-sugar diet, obesity, insulin resistance, alcohol, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.86","baseline_date":"2026-06-23"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3526","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver into the bloodstream. Elevated VLDL is associated with insulin resistance and metabolic syndrome. Kerrianne's VLDL is 0.55, within the optimal range and up slightly from 0.39 in June. This mirrors the modest triglyceride rise but remains a healthy result.","low_causes":"Low-carb diet, fasting","high_causes":"High-carb diet, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.39","baseline_date":"2026-06-23"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4511","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"ratio","description":"The total cholesterol to HDL ratio is a simple way of expressing cardiovascular risk by dividing total cholesterol by HDL. A lower ratio is better. Kerrianne's ratio is 4.06, within the laboratory range of below 4.5 but above the optimal ceiling of 3.5, and up from 3.5 in June. The rise is driven by the increase in total cholesterol (and specifically LDL) while HDL has stayed the same.","low_causes":"","high_causes":"Elevated LDL, low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"3.5","baseline_date":"2026-06-23"},{"key":"hdlpercent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"24.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6165","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"HDL as a percentage of total cholesterol shows what proportion of the cholesterol in the blood is protective. Higher is better. Kerrianne's HDL percentage is 24.66%, above the 20% threshold, though down from 28.57% in June because total cholesterol has risen while HDL has stayed the same. This remains a healthy proportion.","low_causes":"Low HDL, very high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"","range_type":"no upper","baseline_result":"28.57","baseline_date":"2026-06-23"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol fractions in a single number. Many clinicians consider it a better risk predictor than LDL alone. Kerrianne's non-HDL is 5.5, well above the threshold of 4 and up from 4.5 in June. This confirms the overall lipid picture is worsening and reinforces the need for dietary intervention and GP review.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet, genetics, menopause, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"4.5","baseline_date":"2026-06-23"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6071","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"Apolipoprotein A1 is the main structural protein on HDL (protective) cholesterol particles. Higher levels indicate more HDL particles working to remove cholesterol from artery walls. Kerrianne's ApoA1 is 1.7, above the normal threshold of 1.4 and within the optimal range. It has come down from 1.98 in June but remains healthy. The slight drop contributes to the worsening ApoB/A-I ratio.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetics","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"","range_type":"no upper","baseline_result":"1.98","baseline_date":"2026-06-23"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the main structural protein on LDL and VLDL particles. Each harmful cholesterol particle carries exactly one ApoB molecule, so the ApoB level is effectively a count of how many harmful particles are circulating. It is considered the single best measure of cardiovascular risk from cholesterol. Kerrianne's ApoB is 1.47, well above the desirable threshold of 0.9 and classified as 'very high' by the laboratory. It has risen from 1.35 in June. This is the most important lipid finding in the report and should be discussed with her GP, particularly in the context of her existing hypertension.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet (saturated fat), genetics, menopause, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"1.35","baseline_date":"2026-06-23"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7167","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"ratio","description":"The ApoB-to-ApoA-I ratio is considered the single best summary of the balance between harmful and protective cholesterol particles. A ratio below 0.6 is lower risk, 0.6 to 0.8 is average, and above 0.8 is higher risk. Kerrianne's ratio is 0.86, in the higher-risk band, up from 0.68 (average risk) in June. The worsening is driven by the rise in ApoB (more harmful particles) and the fall in ApoA1 (fewer protective particles). This ratio captures the lipid story more accurately than total cholesterol and is the number to watch at her next test.","low_causes":"High HDL, low LDL","high_causes":"High LDL, low HDL, metabolic syndrome, menopause","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.68","baseline_date":"2026-06-23"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/l","description":"Lipoprotein(a) is a genetically determined cholesterol particle that deposits cholesterol in artery walls, encourages blood clotting, and promotes inflammation. Unlike other cholesterol markers, it cannot be changed through diet or lifestyle. Kerrianne's Lp(a) is below 25, within the ideal range of below 32 and consistent with her June result of 25. This is genuinely useful information because it means that the entire elevation in her LDL and ApoB is driven by modifiable factors (diet, menopause, lifestyle) rather than a genetic particle she cannot change.","low_causes":"","high_causes":"Genetics (inherited, cannot be changed by lifestyle)","paddi , high triglycerides, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.33","baseline_date":"2026-06-23"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"4.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8233","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol carried by Lp(a) particles from the total LDL, showing how much LDL is modifiable through diet and medication. Kerrianne's Lp(a)-corrected LDL is 4.94, confirming that virtually all of her LDL elevation (5.02 total) is modifiable. Her Lp(a) is below 25 and contributes almost nothing to the LDL total. This means dietary changes and, if necessary, medication can address the entire problem.","low_causes":"","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.172","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5614","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The atherogenic index of plasma is calculated from the logarithm of the triglyceride-to-HDL ratio and reflects the balance between harmful and protective lipids. A negative value indicates a favourable profile. Kerrianne's value is minus 0.172, within the reference range and reflecting her strong HDL and reasonable triglycerides. It sits below the optimal ceiling of 0.11, reflecting her strong HDL and the modest rise in triglycerides.","low_causes":"High HDL, low triglycerides","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3986","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II ratio (LDL divided by HDL) is another way of expressing the balance between harmful and protective cholesterol. A lower ratio is better. Kerrianne's ratio is 2.79, within the reference range of below 3.5 but above the optimal ceiling of 2.5. Her excellent HDL (1.8) provides meaningful protection, but the elevated LDL (5.02) pushes the ratio above optimal.","low_causes":"High HDL, low LDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Blood glucose measures the amount of sugar in the blood at the time of the test. Fasting glucose above 6 suggests impaired fasting glucose, and above 7 suggests diabetes. Kerrianne's glucose is 5.1, within the optimal range and very similar to 5.2 in June. A healthy, stable result confirming good blood sugar control.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, medications (steroids)","padding":"1","one_sided":"","range_type":"normal","baseline_result":"5.2","baseline_date":"2026-06-23"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin with sugar attached, giving a picture of average blood sugar control over the past two to three months. Below 6% is normal. Kerrianne's HbA1c is 5.3%, well within the normal range. A healthy result.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, high-sugar diet, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the international standard unit for the same test described above. Kerrianne's HbA1c is 35, within the optimal range (below 36) and improved from 37 in June. This confirms good blood sugar control with a slight improvement over five months.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, high-sugar diet, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"37","baseline_date":"2026-06-23"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3683","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. Fasting insulin shows how hard the pancreas is working to keep blood sugar normal. Lower is generally better (indicating insulin sensitivity). Kerrianne's insulin is 4.94, within the optimal range and up from 2.51 in June (which was below the laboratory range). The increase brings insulin into a more conventional healthy range and, combined with her healthy glucose, gives a HOMA-IR of 1.12, confirming good insulin sensitivity.","low_causes":"Excellent insulin sensitivity, low-carb diet, type 1 diabetes (rare)","high_causes":"Insulin resistance, pre-diabetes, obesity, high-carb diet, PCOS","padding":"1","one_sided":"","range_type":"normal","baseline_result":"2.51","baseline_date":"2026-06-23"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.805","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3035","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It confirms how much insulin the pancreas is producing endogenously. Kerrianne's C-Peptide is 0.805 micrograms per litre, below the laboratory range of 1.1 to 4.4. This was also below range in June. Her blood sugar and HbA1c are both healthy, and her insulin is now within range, so the low C-Peptide reflects a pancreas that does not need to work hard to maintain normal blood sugar. It is not a sign of pancreatic failure. Worth continuing to monitor.","low_causes":"Low insulin demand, excellent insulin sensitivity, low-carb diet, type 1 diabetes (rare)","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5400","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"ratio","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using fasting glucose and insulin to estimate how resistant the body's cells are to insulin. A lower score means better insulin sensitivity. Below 1.0 is optimal, above 1.9 indicates early insulin resistance, and above 2.9 indicates significant insulin resistance. Kerrianne's HOMA-IR is 1.12, within the reference range and up from 0.58 in June. The rise reflects the higher insulin level (4.94 vs 2.51), but 1.12 still confirms healthy insulin sensitivity. No concern.","low_causes":"Excellent insulin sensitivity, low-carb diet","high_causes":"Insulin resistance, obesity, high-carb diet, metabolic syndrome","padding":"1","one_sided":"","range_type":"normal","baseline_result":"0.58","baseline_date":"2026-06-23"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4214","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and gives an approximation of the average blood sugar ract infection. Once the UTI is treated, this should fall back towards the 0.8 seen at baseline.","low_causes":"","high_causes":"Infection, chronic inflammation, obesity, cardiovascular disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"0.8","baseline_date":"2026-06-23"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over one hour. A faster rate indicates more inflammation. It is a non-specific marker, meaning it rises with infection, autoimmune disease, anaemia, and many other conditions. Kerrianne's ESR is 46, well above the limit of 12 and dramatically up from 2 in June. This is the single largest change in the report. The most likely explanation is the urinary tract infection identified in the urinalysis. ESR responds more slowly than CRP to acute events and also responds to chronic processes, so it should be repeated after the UTI is treated to confirm it returns to normal.","low_causes":"Polycythaemia, sickle cell disease, very high white cell count","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, malignancy, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower","baseline_result":"2","baseline_date":"2026-06-23"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"INFLAMMATION","result":"0.83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3394","lower_normal":"0.78","upper_normal":"3.53","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_
