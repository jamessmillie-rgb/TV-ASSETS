ron supplementation, liver disease, haemolysis","padding":"1","one_sided":"","range_type":"normal","baseline_result":"15.4","baseline_date":"2026-06-23"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3820","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3689","upper_optimal_position":"0.4994","units":"ng/ml","description":"Ferritin is the body's iron storage protein. It reflects how much iron is held in reserve. Kerrianne's ferritin is 51, within the optimal range for a post-menopausal woman (40 to 150) and up from 35 in June. This is a meaningful improvement. Since she has had no periods for six months, she is no longer losing iron through menstruation, which has allowed her stores to build. A good result.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"","range_type":"normal","baseline_result":"35","baseline_date":"2026-06-23"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"57.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"44","upper_normal":"76.1","lower_optimal":"47","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3645","upper_optimal_position":"0.6033","units":"umol/l","description":"TIBC (total iron binding capacity) measures how much iron the blood could carry if all the transferrin were fully loaded. It is an indirect measure of transferrin and iron status. Kerrianne's TIBC is 57.3, within the optimal range and very close to 56.8 in June. A stable, healthy result.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"","range_type":"normal","baseline_result":"56.8","baseline_date":"2026-06-23"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"26.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4104","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying protein transferrin is loaded with iron. It combines serum iron with TIBC to give a useful picture of iron availability. Kerrianne's transferrin saturation is 26.55%, within the optimal range of 25 to 40% and up from 24.73% in June (which was just below optimal). An improvement that confirms adequate iron availability.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis","padding":"1","one_sided":"","range_type":"normal","baseline_result":"24.73","baseline_date":"2026-06-23"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3077","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that carries iron in the blood from storage sites to where it is needed (mainly the bone marrow for making red blood cells). Kerrianne's transferrin is 2.4, marginally below the lower limit of 2.5 and very similar to 2.48 in June. Transferrin is a negative acute-phase reactant, meaning it falls during infection and inflammation. The active UTI and the raised ESR may be contributing to this marginally low result. Her iron, ferritin, and saturation are all healthy, so this is not indicating iron deficiency.","low_causes":"Inflammation, infection, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"","range_type":"normal","baseline_result":"2.48","baseline_date":"2026-06-23"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5397","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6349","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays a role in libido, energy, mood, muscle mass, and bone density. Kerrianne's total testosterone is 1.8, within the optimal range for women and up from 1.4 in June. This reflects the benefit of her twice-weekly testosterone supplementation. Despite this improvement, her ongoing lack of libido suggests that either the free testosterone (the unbound, active portion) is still not reaching her individual threshold, or other factors such as the SSRI are contributing.","low_causes":"Menopause, adrenal insufficiency, pituitary disorders, medications","high_causes":"PCOS, adrenal tumours, supplementation, congenital adrenal hyperplasia","padding":"1","one_sided":"","range_type":"normal","baseline_result":"1.4","baseline_date":"2026-06-23"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.017","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3431","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.015","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3403","upper_optimal_position":"0.5278","units":"nmol/l","description":"Free testosterone is the portion of testosterone not bound to SHBG or albumin, and it is the biologically active fraction that tissues can use. Kerrianne's free testosterone is 0.017, within the optimal range and up from 0.012 in June. The improvement reflects the fall in SHBG from 97.6 to 84.1, which means less testosterone is being bound up. Despite being technically within range, the very low absolute value may not be sufficient for her individual needs, particularly for libido.","low_causes":"High SHBG, low total testosterone, menopause, medications","high_causes":"PCOS, supplementation, low SHBG","padding":"1","one_sided":"","range_type":"normal","baseline_result":"0.012","baseline_date":"2026-06-23"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"2.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4244","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index (FAI) is calculated from total testosterone and SHBG, and it estimates the proportion of testosterone that is biologically active. Kerrianne's FAI is 2.14, within the optimal range and improved from 1.43 in June. This is a positive change, reflecting the fall in SHBG and the rise in total testosterone. The improvement in FAI from 1.43 to 2.14 confirms that her testosterone supplementation is having more biological effect than it was five months ago.","low_causes":"High SHBG, low testosterone, menopause","high_causes":"PCOS, supplementation, low SHBG","padding":"1","one_sided":"","range_type":"normal","baseline_result":"1.43","baseline_date":"2026-06-23"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"84.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4921","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.5933","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds sex hormones (testosterone, oestrogen) and controls how much of each is available for the body to use. Higher SHBG means less free hormone. Kerrianne's SHBG is 84.1, within the optimal range and down from 97.6 in June. This is a positive change. The fall in SHBG has freed up more testosterone, as reflected in the improved FAI from 1.43 to 2.14. SHBG can be elevated by oestrogen therapy, SSRIs, and the menopause itself.","low_causes":"Obesity, insulin resistance, hypothyroidism, androgens","high_causes":"Oestrogen therapy, SSRIs, menopause, hyperthyroidism, liver disease, ageing","padding":"1","one_sided":"","range_type":"normal","baseline_result":"97.6","baseline_date":"2026-06-23"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"425","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, produced mainly by the ovaries. In post-menopausal women, levels typically fall below 118 pmol/L. Kerrianne's oestradiol is 425, well above the post-menopausal range, which confirms that her daily oestrogen HRT is being absorbed and is producing a measurable hormonal effect. The level was 309 in June and has risen, likely reflecting consistent use of the HRT. Her FSH has fallen from 73.6 to 46.1, which is the expected response when exogenous oestrogen partly suppresses the brain's signal for the ovaries to produce more. Despite the elevated oestradiol, she still reports exhaustion and no libido, which suggests oestrogen alone is not the answer for those symptoms.","low_causes":"Menopause, ovarian failure, low body fat, excessive exercise, pituitary disorders","high_causes":"HRT, pregnancy, PCOS, ovarian tumours, obesity","padding":"1","one_sided":"","range_type":"normal","baseline_result":"309","baseline_date":"2026-06-23"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"11.09","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone produced mainly after ovulation and during pregnancy. In post-menopausal women, levels are typically below 2.32 nmol/L. Kerrianne's progesterone is 11.09, well above the post-menopausal range, which confirms that her cyclical progesterone supplementation (taken for two weeks each cycle) is producing a measurable hormonal effect. The blood was likely taken during a progesterone-supplementation phase, placing it within the luteal reference range (10.62 to 81.28). This was 1.29 in June, which was likely taken during a non-supplementation phase. The result confirms the progesterone is being absorbed.","low_causes":"Anovulation, menopause, luteal phase deficiency","high_causes":"HRT, pregnancy, ovarian cysts, congenital adrenal hyperplasia","padding":"1","one_sided":"","range_type":"normal","baseline_result":"1.29","baseline_date":"2026-06-23"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"25.78","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH (luteinising hormone) is produced ormal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production. In non-pregnant, non-lactating women, normal levels are 59 to 619. Kerrianne's prolactin is 358, within the non-pregnant reference range and up from 198 in June. SSRIs can raise prolactin, and the increase may partly reflect this medication. The level is not concerning, but significantly elevated prolactin can contribute to low libido, so it is worth monitoring.","low_causes":"Dopamine agonist medications","high_causes":"SSRIs, pituitary adenoma, hypothyroidism, pregnancy, stress","padding":"1","one_sided":"","range_type":"normal","baseline_result":"198","baseline_date":"2026-06-23"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"408","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. Morning levels between 145.4 and 619.4 are normal. Kerrianne's cortisol is 408, within the morning reference range and very similar to 381 in June. A single morning cortisol cannot capture the full cortisol rhythm across the day, which is where stress-related dysregulation (such as high evening cortisol or a flattened diurnal curve) typically shows. Her report of exhaustion, decreased stress tolerance, and feeling overwhelmed at work are consistent with cortisol rhythm disruption, but a single blood test cannot confirm or exclude it.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disorders, chronic stress (late stage)","high_causes":"Acute stress, Cushing's syndrome, medications (steroids), chronic sleep deprivation","padding":"1","one_sided":"","range_type":"normal","baseline_result":"381","baseline_date":"2026-06-23"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3904","lower_normal":"0.26","upper_normal":"11","lower_optimal":"1.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3563","upper_optimal_position":"0.5425","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is an adrenal hormone that serves as a precursor for both testosterone and oestrogen. It declines naturally with age. Kerrianne's DHEA-S is 2.1 micromol per litre, within the optimal range and up from June. The rise may reflect the testosterone supplementation or natural variation. A healthy result.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumours, PCOS, congenital adrenal hyperplasia, supplementation","padding":"1","one_sided":"","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5455","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both the free testosterone and the portion loosely bound to albumin (which can be easily released for use). Kerrianne's bioavailable testosterone is 0.4, within the optimal range and a healthy level that confirms adequate testosterone is reaching her tissues. Despite this, her ongoing lack of libido suggests that either her individual threshold is higher, or other factors (SSRI, fatigue, stress) are more significant contributors.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"5.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is unbound and biologically active. Kerrianne's index is 5.05, reflecting her oestradiol of 425 and SHBG of 84.1. Reported for context alongside the hormonal picture.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4232","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how much hormone to make. High TSH means the thyroid is underactive (the brain is asking for more); low TSH means it is overactive. Kerrianne's TSH is 1.69, within the optimal range of 1.0 to 2.5 and up from 1.11 in June. Both values are healthy. The thyroid is working well.","low_causes":"Hyperthyroidism, pituitary disorders, thyroid medication (excess)","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"","range_type":"normal","baseline_result":"1.11","baseline_date":"2026-06-23"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4613","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/l","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form, T3, in the tissues. Kerrianne's FT4 is 15.8, within the optimal range of 14 to 20 and virtually identical to 15.9 in June. A stable, healthy result.","low_causes":"Hypothyroidism, pituitary disorders, non-thyroidal illness","high_causes":"Hyperthyroidism, thyroid medication (excess), thyroiditis","padding":"1","one_sided":"","range_type":"normal","baseline_result":"15.9","baseline_date":"2026-06-23"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy production, and body temperature. It is converted from T4 in the tissues. Kerrianne's FT3 is 4.6, within the optimal range and identical to June. This confirms adequate conversion of T4 to T3 and makes poor conversion unlikely as a contributor to her fatigue.","low_causes":"Hypothyroidism, non-thyroidal illness (sick euthyroid), poor T4-to-T3 conversion","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"","range_type":"normal","baseline_result":"4.6","baseline_date":"2026-06-23"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal" tio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the inactive thyroid hormone (T4) into the active form (T3). A ratio within the optimal range of 0.27 to 0.4 confirms good conversion. Kerrianne's ratio is 0.291, within the optimal range and confirming that her thyroid is converting T4 to T3 adequately. This makes poor conversion unlikely as a contributor to her fatigue.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9100","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. Levels below 50 are insufficient and below 30 are deficient. Kerrianne's vitamin D is 91, within the optimal range of 75 to 120 and improved from 87 in June. This reflects the benefit of her ongoing vitamin D supplementation. A good result that supports her bone health goals given the hip and back pain.","low_causes":"Insufficient sun exposure, dark skin, obesity, malabsorption, age","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"","range_type":"no upper","baseline_result":"87","baseline_date":"2026-06-23"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"380","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4123","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. Low levels can cause fatigue, brain fog, poor concentration, and neurological symptoms. Kerrianne's B12 is 380, within the laboratory range of 193 to 982 but below the optimal threshold of 500. It has improved significantly from 225 in June, which is encouraging. However, at 380 it is still below optimal, and B12 insufficiency remains a plausible contributor to her fatigue and brain fog. Continued sublingual methylcobalamin supplementation is recommended until levels are above 500.","low_causes":"Poor dietary intake, malabsorption, pernicious anaemia, medications (metformin, PPIs), vegan diet","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"","range_type":"normal","baseline_result":"225","baseline_date":"2026-06-23"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA synthesis, and red blood cell production. It works alongside B12. Kerrianne's folate is 14, within the optimal range and up from 11 in June. A healthy, improved result.","low_causes":"Poor dietary intake, malabsorption, alcohol, medications (methotrexate), pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"","range_type":"normal","baseline_result":"11","baseline_date":"2026-06-23"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0. sition":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first immunoglobulin produced in response to a new infection. Elevated IgM can indicate an acute infection. Kerrianne's IgM is 2.2, within the laboratory range and up from 1.8 in June. The increase may reflect the immune response to the urinary tract infection. Not a concern.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"","range_type":"normal","baseline_result":"1.8","baseline_date":"2026-06-23"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4301","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA is the immunoglobulin that protects mucosal surfaces including the gut, respiratory tract, and urinary tract. Kerrianne's IgA is 1.3, within the laboratory range and up from 1.2 in June. An adequate level. IgA is important for the coeliac screen (the tTG test uses IgA), and her level is sufficient for the test to be valid.","low_causes":"Selective IgA deficiency (common, usually harmless), medications","high_causes":"Chronic infection, liver disease, coeliac disease, IgA nephropathy","padding":"1","one_sided":"","range_type":"normal","baseline_result":"1.2","baseline_date":"2026-06-23"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1550","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/ml","description":"IgE is the immunogl LSE","within_optimal":"FALSE","result_position":"0.7943","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the overall antioxidant capacity of the blood, reflecting the body's ability to neutralise free radicals. Kerrianne's TAA is 1.95, above the reference range of 1.3 to 1.77 and up from 1.52 in June. The elevation is most likely driven by her omega-3 and vitamin D supplementation, which increase circulating antioxidant capacity. An above-range TAA from supplementation is not a concern and is, if anything, a positive finding.","low_causes":"Oxidative stress, poor diet, chronic disease, smoking","high_causes":"Antioxidant supplementation (vitamin C, E, omega-3), high fruit and vegetable intake","padding":"1","one_sided":"","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.456","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2868","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3529","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels by telling the bones to release calcium, the kidneys to retain it, and the gut to absorb it. When calcium is adequate and vitamin D is sufficient, PTH is appropriately suppressed. Kerrianne's PTH is 0.456, below the laboratory range of 0.98 to 4.73 and down from 0.8 in June (which was also below range). Her corrected calcium is normal at 2.38, and her vitamin D is optimal at 91. The most likely explanation is that adequate vitamin D and calcium are suppressing PTH appropriately, and the laboratory range simply starts higher than where her body naturally sits. However, the ongoing below-range pattern should be noted by her GP, particularly as vitamin D levels rise with supplementation, to ensure PTH does not become further suppressed.","low_causes":"Adequate vitamin D and calcium (appropriate suppression), hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, calcium deficiency, chronic kidney disease, hyperparathyroidism","padding":"1","one_sided":"","range_type":"normal","baseline_result":"0.8","baseline_date":"2026-06-23"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"6","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH reflects the acidity or alkalinity of the urine. A pH of 6 is mildly acidic and within the normal physiological range of 4.5 to 8. Down from 7 in June, which is normal variation.","low_causes":"","high_causes":"","padding":"1","one_sided":"","range_type":"normal","baseline_result":"7","baseline_date":"2026-06-23"},{"key":"urineprotein","name":"Urine Protein","group":"URINALYSIS","result":"+","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/l","description":"Urine protein is normally absent or present in only trace amounts. A positive result (+) indicates protein is leaking into the urine, which can occur with urinary tract infections, kidney inflammation, or kidney disease. Kerrianne's urine protein is positive, changed from negative in June. In the context of the UTI identified in this sample (elevated WBC, RBC, and Group B Streptococcus growth), the proteinuria is most likely driven by the infection. A repeat urinalysis after treatment should confirm it resolves.","low_causes":"","high_causes":"UTI, kidney disease, strenuous exercise, dehydration, fever","padding":"1","one_sided":"","range_type":"normal"},{"key":"urineketones","name":"Urine Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine ketones are produced when the body burns fat for fuel instead of glucose, as in fasting, low-carb diets, or uncontrolled diabetes. Negative is the expected result on a standard diet with normal blood sugar control.","low_causes":"","high_causes":"","padding":"1","one_sided":"","range_type":"normal"},{"key":"urineglucose","name":"Urine Glucose","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Glucose should not normally be present in urine. Its presence would suggest blood sugar levels high enough to overwhelm the kidneys' reabsorption capacity. Negative is the expected result and is consistent with Kerrianne's healthy HbA1c of 35 and glucose of 5.1.","low_causes":"","high_causes":"","padding":"1","one_sided":"","range_type":"normal"},{"key":"specificgravity","name":"Specific Gravity","group":"URINALYSIS","result":"1.03","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Specific gravity measures the ,"lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"wbc/ul","description":"White blood cells in the urine (pyuria) indicate the immune system is fighting an infection in the urinary tract. Above 10 per microlitre is considered significant. Kerrianne's urine WBC is 50, five times the significant threshold, confirming an active urinary tract infection. This is a new finding, not seen in June.","low_causes":"","high_causes":"Urinary tract infection, kidney infection, interstitial cystitis, kidney stones","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urinerbc","name":"Urine RBC","group":"URINALYSIS","result":">500","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"25","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"rbc/ul","description":"Red blood cells in the urine (haematuria) can indicate infection, kidney stones, or, less commonly, bladder or kidney cancer. Above 25 per microlitre is considered significant. Kerrianne's urine RBC is above 500, which is very high. In the context of the confirmed UTI (elevated WBC and Group B Streptococcus growth), this is most likely caused by the infection. However, because the count is so high, a repeat urinalysis after treatment is important to confirm the haematuria resolves. Persistent haematuria after infection clearance would need further investigation.","low_causes":"","high_causes":"Urinary tract infection, kidney stones, bladder cancer, kidney disease, menstruation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"urinenitrites","name":"Urine Nitrites","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_positio function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;

  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
