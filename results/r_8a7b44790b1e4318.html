<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kerrianne Burns","dob":"16/03/1977","report_date":"2026-11-02","summary":"This is Kerrianne's second TrueVitals report, taken approximately five months after her baseline test in June 2026. Her quiz answers are unchanged from that first test: she is a 49-year-old female with a BMI of 25.4, following a standard mixed diet rated 5 out of 10 for quality with a volume of 5 out of 10. She trains three times per week (two cardio, one resistance) with 2,000 to 5,000 daily steps. She has diagnosed hypertension managed with amlodipine, takes an SSRI, and is on hormone replacement therapy consisting of one pump of oestrogen daily, progesterone for two weeks each cycle, and two pumps of testosterone twice weekly. She supplements with vitamin D and omega-3 and reports frequent painkiller use (ibuprofen and paracetamol). She reports low energy, brain fog, joint pain and stiffness, exhaustion most of the time, no libido, decreased ability to handle stress at work as a teacher, sore bones in hips and back, and dry eyes. She has had no periods for six months. Her goals are to improve energy levels, balance hormones, and reduce stress and anxiety.\n\nHer PhenoAge, a composite biological age score built from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 37.4 years against a calendar age of 49, which places her biological ageing nearly twelve years younger than her chronological age. That is a genuinely excellent result and reflects solid underlying metabolic and immune health.\n\nBefore discussing what needs attention, there is a good deal of reassurance in this panel and several improvements from June. Her blood sugar control remains excellent. Fasting glucose is 5.1, HbA1c is 35, and fasting insulin is 4.94, all within the ideal range. Her HOMA-IR, a calculated index of insulin resistance, is 1.12, up slightly from 0.58 in June but still well within the healthy band and confirming that her body handles glucose efficiently. Her thyroid continues to work well, with TSH at 1.69, free T4 at 15.8 and free T3 at 4.6, all within the healthy range, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease as a cause of her fatigue. Her liver is in good shape. ALT is 36 and GGT is 16, both within range, with the AST:ALT ratio (the De Ritis ratio, which can signal liver strain when inverted) sitting at a healthy 1.08. The FIB-4 score, a fibrosis screening index that was marginally above threshold in June at 1.52, has come down to 1.40, now within range, and with clean enzymes and a normal APRI of 0.43 and NAFLD fibrosis score of minus 2.26, there is no sign of liver scarring. Her kidney markers are stable, with creatinine unchanged at 70 and Cystatin C at 1.09 giving a combined eGFR of 79, which is adequate at 49 though sitting just below the optimal threshold of 90 and worth keeping an eye on over time. Her calcium is within the ideal range at 2.38 corrected. Her magnesium is 0.94, comfortably within the optimal band. Her vitamin D has improved from 87 to 91 on supplementation, now within the optimal range. Her rheumatoid factor is 4, well within range, which continues to make rheumatoid arthritis unlikely as the cause of her joint symptoms. Her coeliac screen is negative. All four tumour markers, CA-125 at 9.2, CA 15-3 at 14, CA 19-9 at 1.46 and CEA below 0.5, are clean. Her immunoglobulins are all within range. IgE at 31 is well within range, and there is no allergic signal. Her creatine kinase at 90 is healthy, confirming no significant muscle damage from training or medication.\n\nThe most significant new finding in this report is the urinalysis. The urine shows white blood cells at 50, which is well above the threshold of 10, and red blood cells above 500, which is substantially elevated above the threshold of 25. Nitrites are negative and there is a trace of protein. This combination of heavily elevated red and white cells in the urine needs investigation. The most common explanation in a 49-year-old woman is a urinary tract infection, even without nitrites, but haematuria at this level, particularly the red cell count being above 500, should be evaluated by her GP. At a minimum she should have a repeat midstream urine sample sent for microscopy and culture, and if the haematuria persists on a clean repeat, her GP should consider referral for further urological assessment. This was not present in June, when the urine was clean apart from a mixed growth the lab called contamination, so it is a new finding.\n\nThe cholesterol picture has moved in the wrong direction since June and remains the main modifiable cardiovascular risk factor in this report. Her total cholesterol has risen from 6.3 to 7.3, LDL from 4.17 to 5.02, ApoB from 1.35 to 1.47, and non-HDL cholesterol from 4.5 to 5.5. ApoB is a direct count of the number of atherogenic (artery-damaging) lipoprotein particles in the blood, and at 1.47 it is now well above the 0.9 threshold and classified as very high by the laboratory. The ApoB to ApoA-I ratio, which summarises the balance between harmful and protective particles, has risen from 0.68 to 0.86, now above the higher risk threshold of 0.8. Her Cardiovascular Risk Score, a TrueVitals composite index scored from 0 to 100 and built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c, is 55 out of 100, above the 40 threshold and driven primarily by the ApoB and LDL. On the protective side, her HDL remains excellent at 1.8, her Lp(a) is below 25, which is ideal and means the elevated LDL is entirely driven by modifiable factors rather than genetics, and her triglycerides at 1.21 remain healthy, though they have risen from the ideal 0.86 in June. The Lp(a)-corrected LDL is 4.94, confirming that almost all of the LDL is modifiable. The context here matters: menopause is a known driver of rising LDL because oestrogen helps clear LDL particles from the blood, and as endogenous oestrogen falls, LDL climbs. Her oestrogen replacement may be partially offsetting this, but clearly not enough to prevent the rise. In the setting of diagnosed hypertension and now a worsening lipid profile, this warrants a direct conversation with her GP about cardiovascular risk management. The protective factors (excellent HDL, ideal Lp(a), healthy triglycerides, low hs-CRP, excellent insulin sensitivity) are working in her favour, but the particle count is high enough that lifestyle intervention alone may not be sufficient, and her GP should assess whether statin therapy is appropriate.\n\nHer ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle and is a broad marker of inflammation in the body, has jumped from 2 in June to 46, which is substantially above the upper limit of 12. This is a striking change. Her hs-CRP, another inflammation marker, has risen from 0.8 to 1.4, which is above the optimal threshold of 1.0 but still below the laboratory limit of 5. The discrepancy between a modestly raised CRP and a markedly elevated ESR can occur for several reasons. ESR rises with age, with elevated immunoglobulins, and with anaemia, but Kerrianne is not anaemic and her immunoglobulins are within range. It is also raised by infection, and the urinary findings, with high white and red cells, could be driving this. It can also be elevated in the setting of menopause and hormonal changes. The most likely explanation is that the urinary tract finding is generating an inflammatory signal, but because this is such a large jump from baseline, her GP should be aware and should repeat the ESR once the urinary issue has been investigated and treated. If it remains elevated on repeat, further investigation may be warranted.\n\nHer neutrophil count has dropped from 2.46 to 1.98, just below the lower limit of 2.0. Neutrophils are the white blood cells that fight bacterial infections. Mild neutropenia like this can be caused by SSRI medication, which is a recognised side effect, and can also reflect benign ethnic neutropenia, though Kerrianne's ethnicity is White European where this is less common. It can also occur when the immune system is occupied with an active infection, which the urinary findings suggest may be the case. Her total white cell count is 4.71, just within range. This is not dangerous at this level but should be flagged to her GP alongside the urinary findings.\n\nHer B12 has improved substantially from 225 to 380, which is a meaningful shift in the right direction, though it remains below the optimal threshold of 500. The MCH at 33.3 is still above the upper limit of 32, unchanged from June, meaning each red blood cell still carries slightly more haemoglobin than expected, which can be a subtle marker of B12 or folate insufficiency. Her folate at 14 is healthy. Continuing sublingual B12 supplementation and aiming for a level above 500 on the next test would be ideal, and there is good reason to think the improvement from 225 to 380 will continue.\n\nHer ferritin has improved from 35 to 51, which is encouraging and now sits within the optimal range for a post-menopausal woman. Iron at 16 and transferrin saturation at 26.6% are both healthy. Transferrin at 2.4 is marginally below the lower limit of 2.5, as it was in June at 2.48, which can be a normal variant or can be suppressed by inflammation, and with the ESR elevated, an inflammatory effect is plausible. This is not a concern on its own.\n\nHer hormonal picture reflects her HRT regimen and her menopausal status. FSH at 46.1 confirms she is in the menopausal transition; it was 73.6 in June and has fallen, which may reflect some effect from her HRT. LH has similarly fallen from 49.2 to 25.8. Her oestradiol at 425 is above the post-menopausal range of 0 to 118 as expected on oestrogen replacement, and at a level that suggests the replacement is achieving a reasonable circulating oestrogen level. Her progesterone at 11.09 is within the luteal range, consistent with her cyclical progesterone supplementation if the blood was drawn during a progesterone phase. Her total testosterone at 1.8, up from 1.4 in June, remains within the female range on her testosterone supplementation. The free androgen index at 2.14 is up from 1.43, and her SHBG has fallen from 97.6 to 84.1. This is a move in the right direction: SHBG is the protein that binds testosterone and controls how much is available for the body to use, and a lower SHBG means more of her supplemented testosterone is free and active. The calculated free testosterone at 0.017, while still low, is up from 0.012 and bioavailable testosterone at 0.4 is within the optimal band. Despite these improvements on paper, she still reports no libido, which means either the free testosterone is still not high enough for her symptom threshold, or the fatigue, stress and mood are overriding whatever hormonal improvement has occurred. Her HRT prescriber should be made aware that the direction of travel is positive but the clinical effect is not yet felt.\n\nHer PTH (parathyroid hormone, which regulates calcium levels) is 0.456, below the lower limit of 0.98. It was also below range in June at 0.8. With corrected calcium at 2.38, sitting comfortably within the ideal range, this most likely reflects the PTH appropriately suppressing because calcium is adequate and vitamin D at 91 is healthy. PTH falls when calcium and vitamin D are sufficient because the body does not need to mobilise calcium from bone. This is not a concern in this context but her GP should note the persistent pattern.\n\nHer C-Peptide at 0.805 ug/L, is below the laboratory range of 1.1 to 4.4 ug/L. C-Peptide is released alongside insulin from the pancreas and is a marker of insulin production. It was also below range in June. With glucose at 5.1, HbA1c at 35, insulin at 4.94 and HOMA-IR at 1.12, her blood sugar control is excellent, and the low C-Peptide reflects efficient insulin production rather than pancreatic insufficiency. Her pancreas is producing exactly what it needs and no more. In the presence of perfect glucose control this is not a concern.\n\nHer total antioxidant activity at 1.95 is above the upper limit of 1.77. It was 1.52 in June and has risen, almost certainly driven by her vitamin D and omega-3 supplementation. This is not a negative finding.\n\nHer MCHC at 349 is marginally above the upper limit of 345, and her MPV at 11.1 is above the upper limit of 10.1. Neither has changed significantly from June (345 and 9.9 respectively). At these margins, both are most likely laboratory variation and carry no clinical significance. Her basophils at 0.01 are fractionally below the lower limit of 0.02, unchanged from June. This is a common finding on routine blood counts and has no clinical meaning at this level.","links":"The story of this report is told in three threads, and understanding how they connect is as important as the individual numbers.\n\nThe first thread is cardiovascular. Kerrianne's lipid profile has worsened over five months, with ApoB rising from 1.35 to 1.47, LDL from 4.17 to 5.02, and total cholesterol from 6.3 to 7.3. The most likely driver is menopause: oestrogen helps the liver clear LDL particles, and as endogenous production falls, LDL accumulates even when replacement oestrogen is given. Her protective markers remain strong, with HDL holding at 1.8, Lp(a) ideal below 25, and triglycerides healthy, meaning the risk is modifiable. But with diagnosed hypertension already in the picture, the combination of rising particle count and high blood pressure increases the importance of acting now. The Cardiovascular Risk Score of 55 reflects this tension between excellent protective factors and a high atherogenic particle count.\n\nThe second thread is the new urinary finding. White cells at 50 and red cells above 500, with negative nitrites, have appeared since June when the urine was essentially clean. This is driving, or at least contributing to, the sharply elevated ESR of 46, up from 2. The hs-CRP has risen only modestly, from 0.8 to 1.4, which suggests the inflammatory signal is localised rather than systemic. The urinary finding needs investigating on its own terms, but it also explains the ESR and means the ESR should be repeated once the urinary issue is resolved.\n\nThe third thread is the fatigue, brain fog and libido picture, which is where several findings intersect. Her HRT is producing measurable improvements: testosterone is up from 1.4 to 1.8, SHBG has fallen from 97.6 to 84.1, and the free androgen index has risen from 1.43 to 2.14. But the clinical symptoms have not shifted. Her B12 has improved from 225 to 380 but remains below optimal at 500, and the persistent MCH elevation at 33.3 suggests B12 has not yet fully normalised at the cellular level. The ESR at 46 and the possible urinary infection could easily compound fatigue. The frequent painkiller use (ibuprofen and paracetamol) is a background factor: ibuprofen can contribute to GI irritation and subtle blood loss, and is worth discussing with her GP given the urinary findings. The dry eyes, joint stiffness and sore bones she describes are common menopausal symptoms and are not explained by any inflammatory or autoimmune marker in this panel, with rheumatoid factor at 4, CRP only mildly raised, and coeliac negative.\n\nWhat has been excluded is valuable: autoimmune thyroid disease, coeliac disease, rheumatoid arthritis, diabetes, significant liver disease, iron deficiency anaemia, and genetic cardiovascular risk via Lp(a). The PhenoAge of 37.4 confirms that the underlying biology is ageing well despite the symptom burden, which points to the symptoms being driven by correctable factors: the urinary issue, the lipid profile, the B12 that is improving but not yet optimal, and the hormonal balance that is moving in the right direction but has not yet crossed the threshold for symptom relief.","lifestyle":"Add two to three portions of oily fish per week (salmon, mackerel, sardines), aiming for at least two servings. Anchor: plan two fish-based dinners on the same days each week. Why: omega-3 from whole fish lowers triglycerides and ApoB more effectively than supplementation alone, and your ApoB has risen from 1.35 to 1.47.\nSwap one daily portion of saturated fat (butter, cheese, processed meat) for unsaturated alternatives (olive oil, avocado, nuts). Anchor: the first cooking decision of each meal. Why: reducing saturated fat intake is the single most effective dietary lever for lowering LDL, which has risen from 4.17 to 5.02.\nAdd a daily portion of soluble fibre: porridge oats, beans, lentils, or a tablespoon of ground flaxseed stirred into yoghurt. Anchor: breakfast or as a side at dinner. Why: soluble fibre binds cholesterol in the gut and can reduce LDL by 5 to 10%, which at your current level is meaningful.\nIncrease daily steps to 5,000 to 7,000 by adding a 15-minute walk after the largest meal of the day. Anchor: plate in the sink, shoes on. Why: post-meal walking lowers glucose and insulin responses, supports cardiovascular health, and the step increase from the current 2,000 to 5,000 range would improve both energy and lipid clearance.\nAdd one more resistance session per week, moving from one to two. Anchor: a fixed day, the same time each week. Why: resistance training raises HDL, improves insulin sensitivity, supports bone density (relevant to your hip and back pain), and helps maintain muscle mass through menopause.\nReview painkiller use with your GP and explore alternatives for joint and bone pain. Anchor: the GP appointment prompted by the urinary findings. Why: frequent ibuprofen use can irritate the gut lining, may contribute to microscopic bleeding, and could be a factor in the urinary findings. Paracetamol in regular high doses also warrants liver monitoring.\nMaintain a fixed wake time seven days a week and get outside within the first hour of waking for at least ten minutes. Anchor: alarm at the same time every day, including weekends. Why: a consistent circadian rhythm supports cortisol regulation, which may help with her reported difficulty managing stress and the exhaustion she describes.\nCalorie target: approximately 1,800 to 2,000 kcal per day based on your BMI of 25.4, moderate activity level (multiplier 1.6 on a BMR of approximately 1,430 kcal), with the lower end if weight loss is a goal. Protein target: 98 to 120 grams per day (1.3 to 1.6 g per kg of bodyweight), spread across three meals. Protein supports muscle preservation through menopause and satiety.","flags":"Urinalysis: white blood cells at 50 (threshold below 10) and red blood cells above 500 (threshold below 25) with negative nitrites and a trace of protein. This is a new finding not present in June. Requires a repeat midstream urine for microscopy and culture. If haematuria persists on a clean repeat, urological referral should be considered.\nESR at 46 (upper limit 12), up from 2 in June. Most likely driven by the urinary tract finding but this is a large jump and should be repeated once the urinary issue is resolved. hs-CRP only mildly raised at 1.4 (optimal below 1.0), suggesting localised rather than systemic inflammation.\nApoB at 1.47 (threshold below 0.9), up from 1.35, with LDL at 5.02 (range up to 3.0), up from 4.17, total cholesterol 7.3 (up from 6.3), non-HDL cholesterol 5.5 (up from 4.5), and ApoB:ApoA-I ratio at 0.86 (higher risk threshold 0.8), up from 0.68. Cardiovascular Risk Score 55 out of 100. Protective markers remain strong: HDL 1.8, Lp(a) below 25, triglycerides 1.21. In the context of diagnosed hypertension and menopause, GP should assess overall cardiovascular risk and consider whether statin therapy is appropriate.\nNeutrophils at 1.98 (lower limit 2.0), down from 2.46 in June. Mild neutropenia, possibly SSRI-related or related to the active urinary finding. Total WBC 4.71 (within range). GP should be aware.\nC-Peptide at 0.805 ug/L (range 1.1 to 4.4 ug/L), below range. Insulin at 4.94 and glucose at 5.1 are healthy. Reflects efficient insulin production rather than pancreatic insufficiency, but warrants ongoing monitoring.\nPTH at 0.456 (range 0.98 to 4.73), below range for the second consecutive test (0.8 in June). Corrected calcium 2.38 and vitamin D 91 are both healthy. Most likely appropriate suppression in the setting of adequate calcium and vitamin D. GP should note the persistent pattern.\nB12 at 380 (up from 225), improved but still below optimal 500. MCH at 33.3 (above upper limit 32), unchanged. Continued sublingual B12 supplementation recommended.\nTransferrin at 2.4 (lower limit 2.5), marginally below range as in June (2.48). May reflect mild inflammatory suppression given the elevated ESR.\nReassuring negatives: thyroid function optimal with negative antibodies, HbA1c 35, HOMA-IR 1.12, rheumatoid factor 4, coeliac screen negative, all four tumour markers clean, liver enzymes within range with FIB-4 improved to 1.40, ferritin improved to 51 (optimal), vitamin D 91 (optimal), Lp(a) below 25 (ideal), immunoglobulins all normal, creatine kinase 90, PhenoAge 37.4 (11.6 years younger than calendar age).","recommendations":"Discuss the urinary findings with her GP as a priority: white blood cells at 50 and red blood cells above 500 in the urine. A repeat midstream urine sample should be sent for microscopy and culture, and if haematuria persists, referral for further assessment.\nAsk the GP to repeat the ESR once the urinary issue has been investigated and treated. If it remains elevated above 12 on repeat, further investigation is warranted.\nDiscuss cardiovascular risk with the GP, bringing the ApoB of 1.47 (up from 1.35), LDL of 5.02 (up from 4.17), and the context of diagnosed hypertension and menopause. The GP should assess whether statin therapy is appropriate alongside the dietary changes in this report.\nMention the neutrophil count of 1.98, just below the lower limit of 2.0, to the GP. This may be SSRI-related but should be noted and monitored.\nDiscuss the ongoing lack of libido and fatigue with her HRT prescriber, noting that testosterone has risen from 1.4 to 1.8, SHBG has fallen from 97.6 to 84.1, and the free androgen index has improved from 1.43 to 2.14, but symptoms have not improved. The prescriber may consider adjusting the testosterone dose or addressing the SHBG level.\nReview frequent painkiller use (ibuprofen and paracetamol) with the GP, particularly in light of the urinary findings. Alternatives for joint and bone pain should be explored.\nContinue sublingual methylcobalamin B12 supplementation and aim for a level above 500 on the next test.\nRetest in four to six months, repeating the full panel with particular attention to the lipid profile (ApoB, LDL, triglycerides), ESR, urinalysis, B12, neutrophils, C-Peptide, and PTH. Calorie target 1,800 to 2,000 kcal per day, protein target 98 to 120 grams per day.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. B12 has improved from 225 to 380 but remains below the optimal threshold of 500, and the persistent MCH elevation at 33.3 suggests cellular B12 has not yet fully normalised. Continue until the next test confirms a level above 500.\nVitamin D3: cholecalciferol, 2,000 IU daily with the largest meal (contains fat for absorption). Vitamin D is 91, within the optimal range, and this dose maintains the current level through the winter months. Continue current supplementation.\nVitamin K2: MK-7, 100 mcg daily, taken with the vitamin D. K2 directs calcium into bone rather than arteries, supporting bone density (relevant to her hip and back pain) and complementing the vitamin D.\nOmega-3: continue current supplementation at 2 to 3 grams of combined EPA and DHA daily, taken with food. Omega-3 supports triglyceride control and has modest anti-inflammatory effects. Whole oily fish two to three times per week should be added alongside the supplement.\nMagnesium glycinate: 300 mg before bed. Magnesium supports sleep quality, muscle relaxation, and stress resilience, all of which are relevant to your reported symptoms. Your serum magnesium at 0.94 is within the optimal range, but serum levels do not always reflect tissue stores, and supplementation at this dose is safe and may help with the joint stiffness and sleep.\nDo not take iron supplements. Ferritin at 51 is within the optimal range and iron stores are adequate. Unnecessary iron supplementation could push stores too high.\nThe most important changes from this report are not supplements. They are the GP conversation about the urinary findings and cardiovascular risk, the dietary changes to lower ApoB, and the ongoing dialogue with your HRT prescriber about optimising the hormonal balance for symptom relief.","is_retest":true,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 54.3; held to 49 by two or more systems rated \"See your GP\". Weakest systems: urinalysis 0%, lipids & cardiovascular 15%, inflammation 39%. Biggest drags: LDL Cholesterol, Apolipoprotein B, C-Peptide, Total Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"37.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3463","lower_normal":"","upper_normal":"54","lower_optimal":"","upper_optimal":"49","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4537","units":"years","description":"PhenoAge is a biological age estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Kerrianne's PhenoAge is 37.4 against a calendar age of 49, placing her biological ageing 11.6 years younger than her chronological age. This is an excellent result, driven by healthy glucose, good albumin, low alkaline phosphatase and a healthy lymphocyte count. It reflects solid underlying metabolic and immune health despite the symptom burden she is experiencing.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It measures the cardiovascular risk being built rather than a ten-year event probability. Kerrianne's score is 55, above the 40 threshold, driven primarily by the elevated ApoB at 1.47 and LDL at 5.02. The protective factors (HDL 1.8, Lp(a) below 25, triglycerides 1.21, HbA1c 35) are strong, but the atherogenic particle count is high enough to push the overall score into the flagged range. In the context of diagnosed hypertension, this warrants a GP conversation about cardiovascular risk management.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3214","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found mainly in liver cells that leaks into the blood when the liver is under strain. Kerrianne's ALT is 36, within the laboratory range of up to 56 but above the optimal threshold of 25 for women. It has risen from 27 in June. This is a modest increase and not alarming, but it means the liver is working slightly harder than ideal. The most common drivers are medication load, alcohol, or dietary factors. With multiple medications on board (amlodipine, an SSRI, HRT, and frequent painkillers), a mild rise in ALT is not unexpected. Worth monitoring on the next test.","low_causes":"","high_causes":"Medication, alcohol, fatty liver, obesity, hepatitis, vigorous exercise","padding":"1","one_sided":"0","range_type":"no lower","baseline_result":"27","baseline_date":"2026-06-23"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"ALP (alkaline phosphatase) is an normal","baseline_result":"309","baseline_date":"2026-06-23"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"11.09","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is a hormone involved in the menstrual cycle and pregnancy, and in HRT it protects the uterine lining when oestrogen is given. Kerrianne's progesterone is 11.09, within the luteal-phase range of 10.62 to 81.28, which suggests the blood was drawn during a phase when she was taking her cyclical progesterone. In a post-menopausal woman not on HRT, progesterone would be expected below 2.32. The presence of progesterone confirms her supplementation is being absorbed. It was 1.29 in June, which was consistent with a sample taken during a non-progesterone phase of her cycle.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"HRT, pregnancy, ovarian cysts, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.29","baseline_date":"2026-06-23"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"25.78","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and drives ovulation and hormone production in the ovaries. In post-menopausal women, LH rises as the ovaries stop responding. Kerrianne's LH is 25.78, which sits between the upper end of the reproductive range and the post-menopausal range (15.9 to 54.0). It was 49.2 in June and has fallen substantially, most likely reflecting the effect of her HRT (oestrogen replacement suppresses LH feedback). This is an expected finding on HRT.","low_causes":"Pituitary disease, HRT, oral contraceptives, severe stress","high_causes":"Menopause, premature ovarian failure, PCOS","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"49.2","baseline_date":"2026-06-23"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"46.11","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and drives egg development in the ovaries. In menopause, FSH rises significantly as the pituitary tries to stimulate ovaries that are no longer responding. Kerrianne's FSH is 46.11, within the post-menopausal range (23 to 116.3), confirming menopausal status. It has fallen from 73.62 in June, which may reflect partial suppression from her oestrogen replacement. FSH above 40 is consistent with established menopause.","low_causes":"Pituitary disease, HRT, oral contraceptives, pregnancy","high_causes":"Menopause, premature ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"73.62","baseline_date":"2026-06-23"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5397","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4127","upper_optimal_position":"0.6349","units":"nmol/L","description":"Testosterone in women plays a role in libido, energy, muscle maintenance and mood. Kerrianne's total testosterone is 1.8, within the optimal range and up from 1.4 in June, reflecting her twice-weekly testosterone supplementation. The improvement is encouraging, though her persistent lack of libido suggests the free testosterone (the unbound, active portion) may still not be at her symptom threshold.","low_causes":"Menopause, adrenal insufficiency, pituitary disease, oophorectomy","high_causes":"PCOS, testosterone supplementation, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.4","baseline_date":"2026-06-23"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.017","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3431","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"nmol/l","description":"Free testosterone is the fraction of testosterone not bound to proteins, making it available for the body to use. Kerrianne's calculated free testosterone is 0.017, within the laboratory range but below the optimal threshold of 0.02 and up from 0.012 in June. Although SHBG has fallen from 97.6 to 84.1 (freeing more testosterone), the free level remains low. This is likely contributing to her ongoing lack of libido and may warrant a discussion with her HRT prescriber about dose adjustment.","low_causes":"High SHBG, menopause, low total testosterone, medication","high_causes":"PCOS, testosterone supplementation, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"0.012","baseline_date":"2026-06-23"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"2.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4244","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index (FAI) is a ratio of total testosterone to SHBG that estimates how much testosterone is available for the body to use. Kerrianne's FAI is 2.14, within the optimal range and up from 1.43 in June. The improvement is driven by both the rise in testosterone (1.4 to 1.8) and the fall in SHBG (97.6 to 84.1). While the FAI suggests improved androgen availability, the persistent symptoms indicate that the improvement has not yet reached a clinically meaningful threshold for her.","low_causes":"High SHBG, low testosterone, menopause","high_causes":"PCOS, testosterone supplementation, low SHBG, obesity","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"1.43","baseline_date":"2026-06-23"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"84.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4921","lower_normal":"27.8","upper_normal":"146","lower_optimal":"30","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3395","upper_optimal_position":"0.4523","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds sex hormones, particularly testosterone and oestradiol, and controls how much is freely available. Kerrianne's SHBG is 84.1, within the laboratory range but above the optimal threshold of 70, down from 97.6 in June. The fall is a positive development, as lower SHBG means more of her supplemented testosterone is free and active. SHBG can be elevated by oestrogen therapy and SSRI medication, both of which she takes. The direction of travel is encouraging.","low_causes":"Obesity, insulin resistance, hypothyroidism, PCOS, androgen excess","high_causes":"Oestrogen therapy, SSRIs, hyperthyroidism, liver disease, low BMI, ageing","padding":"1","one_sided":"0.5","range_type":"normal","baseline_result":"97.6","baseli function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
