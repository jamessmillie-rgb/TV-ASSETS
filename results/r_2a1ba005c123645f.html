<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

tassium to push the result far above the true level. A genuine potassium of 8.8 would cause severe cardiac symptoms, and Matt reports none, so this result almost certainly reflects sample artefact rather than a true clinical reading. His GP should be aware of it and should arrange a repeat on a fresh, promptly processed sample to confirm a normal level.\n\nThe second finding requiring GP input is his iron studies. His serum iron is 34.1, above the upper limit of 31.3, his transferrin saturation is 67.2%, well above the upper limit of 55%, and his transferrin, the protein that carries iron around the body, is 2.02, just below the lower limit of 2.15. His ferritin, the storage form of iron, sits at 158, which is within range but towards the upper half. When iron saturation is this high with a low transferrin, the combination raises the possibility of hereditary haemochromatosis, a genetic condition affecting roughly one in two hundred people of European descent where the body absorbs too much iron from food. The other explanation would be an acute phase inflammatory response driving transferrin down, but his CRP is 0.2, which is exceptionally low, making inflammation a very unlikely cause. We would recommend discussing this with his GP and requesting an HFE gene test to screen for the C282Y and H63D mutations associated with haemochromatosis. If confirmed, the management is straightforward and effective.\n\nThe third area that deserves attention is his kidney function. His creatinine is 116, above the upper limit of 104, and his creatinine-based eGFR is 68, which is below 90 and technically in the range described as mildly reduced kidney function. His Cystatin C, which is an alternative and often more reliable marker of kidney filtration because it is not influenced by muscle mass, is 1.12, just above the upper limit of 1.1, giving a Cystatin C-based eGFR of 73. Creatinine can be elevated by muscle mass and by meat consumption in the days before the blood draw, and at egrade if not separated within four hours, so the true level may be somewhat higher. His HOMA-IR, which estimates insulin resistance, is 0.47, below the lower limit of 0.5 but in the favourable direction, meaning he is highly insulin-sensitive. His HOMA-B, which estimates how hard the pancreas is working, calculates to approximately 37.5, well below the lower limit of 80. What this pattern suggests is that his pancreas is producing the minimum amount of insulin it can because his tissues are so responsive to insulin that very little is needed. This is typically a benign and even favourable pattern in lean, active individuals. However, with HbA1c sitting at 40, right at the upper border of optimal, it is worth keeping an eye on. If on repeat testing HbA1c drifts above 42 while insulin remains low, it could suggest the pancreas is not quite keeping up with demand. For now, this is reassuring but warrants monitoring.\n\nHis vitamin D at 96 is within the optimal range of 75 to 120, which is a strong result. His B12 at 470 is within range but below the optimal threshold of 500, and given his symptoms of brain fog and fatigue, optimising B12 could make a noticeable difference. His folate at 19 is above the upper limit of 17, which is not a clinical concern and simply reflects good dietary intake or supplementation. Calcium at 2.55 and corrected calcium at 2.4 are both healthy. His magnesium at 1.11 sits right at the upper limit of range, which is a positive finding.\n\nHis IgG at 17.76 is above the upper limit of 16. IgG is the most abundant immunoglobulin and the backbone of long-term immune memory. A mild elevation can reflect recent or chronic immune stimulation, previous vaccinations, or chronic low-grade infection. In isolation, without symptoms pointing to a specific cause, it is not immediately concerning, but it should be noted and can be repeated on the next panel to see if it trends down. His IgE at 224 is above the upper limit of 100. IgE is the antibody class associated with allergic responses and parasitic infections. An elevation of this degree most commonly reflects atopic tendency, meaning a predisposition to allergies such as hay fever, eczema, or food sensitivities. If Matt experiences any seasonal symptoms, skin irritation, or suspected food reactions, this would support further allergy investigation. His IgM at 0.9 and IgA at 2.5 are both normal. Rheumatoid factor at 5 is normal, and tissue transglutaminase IgA is negative, effectively ruling out coeliac disease.\n\nHis total antioxidant activity at 1.81 is marginally above the upper limit of 1.77. This is a favourable finding and likely reflects good dietary antioxidant intake from fruits, vegetables, or supplementation. His creatine kinase at 221 is within range and consistent with regular training without excessive muscle damage. His prostate markers are reassuring, with PSA at 0.46 and a free PSA ratio of 45.7%, both of which are excellent. CEA at 0.84 and CA 19-9 below 1.2 are both normal tumour markers. His total protein at 84 is marginally above the upper limit of 82, with albumin at 48 and globulin at 36, both within range. The marginally elevated total protein is driven by the mildly raised IgG and is not a separate concern. His bicarbonate at 20.1 sits right at the lower border of the range of 20 to 31, which in conjunction with the elevated sodium and chloride may reflect mild dehydration affecting acid-base balance.\n\nConnecting these findings to his symptoms, the brain fog, low energy, and low mood he reports are unlikely to have a single explanation, but several findings may be contributing. His B12 is below optimal and B12 is directly involved in nerve function and neurotransmitter production. His neutrophils and reticulocytes suggest the bone marrow may be mildly under-fuelled, which can subtly reduce oxygen delivery and energy production. His LDL and ApoB elevation, while not causing symptoms directly, reflect a metabolic pattern that dietary optimisation would address. Ensuring adequate hydration, given the elevated sodium, may also improve cognitive clarity and energy. These are all modifiable, and addressing them systematically gives him an excellent chance of seeing meaningful improvement in how he feels day to day.","links":"Matt's results highlight several areas where specific action can make a meaningful difference to how he feels now and his long-term health trajectory.\n\nThe most important immediate step is hydration. His sodium at 151 suggests he was under-hydrated at the time of the blood draw, and chronic mild dehydration is one of the most underestimated contributors to brain fog and fatigue. He should aim for a minimum of 2.5 to 3 litres of water per day, increasing to 3.5 litres on training days. Adding a pinch of sea salt or an electrolyte tablet to water first thing in the morning can support absorption. He should have a glass of water before every meal and carry a bottle throughout the day.\n\nHis GP should be made aware of the following findings. First, the sodium of 151 and chloride of 110 should be repeated on a fasting morning sample taken when well-hydrated over the preceding 48 hours. Second, the potassium of 8.8 should be repeated on a fresh, promptly processed sample to confirm it is artefactual. Third, the iron studies showing a transferrin saturation of 67.2% with serum iron of 34.1 and low transferrin of 2.02 warrant an HFE gene test to screen for hereditary haemochromatosis. He should bring these specific numbers to the appointment. Fourth, the creatinine of 116 and Cystatin C-based eGFR of 73 should be repeated in three months, ideally after correcting hydration, to establish whether this is a stable baseline. The phosphate of 2.4 should also be repeated on the fresh sample.\n\nFor his lipid profile, dietary changes are the first-line approach given his Lp(a) is normal and all risk is modifiable. He should increase soluble fibre intake to around 10 to 15 grams per day from sources such as oats or porridge at breakfast, beans or lentils with lunch or dinner, and a tablespoon of psyllium husk in water daily. He should aim for oily fish such as salmon, mackerel, sardines, or anchovies two to three times per week. He should reduce saturated fat by swapping butter for olive oil, choosing leaner cuts of meat, and limiting cheese and processed meats. These changes can reduce ApoB by 10 to 20% over three to six months. A retest of the lipid panel including ApoB in four to six months will show whether dietary changes alone are sufficient.\n\nFor his energy and body composition goals, his estimated basal metabolic rate at 85 kilograms and 186 centimetres is approximately 1,870 calories. With five training sessions and 5,000 to 7,500 steps, his activity multiplier sits around 1.6, giving a maintenance estimate of approximately 2,990 calories per day. Given his BMI of 24.6 is already healthy, he does not need to be in a deficit. If anything, his low neutrophils and reticulocytes suggest he may benefit from being closer to maintenance or slightly above on training days. He should aim for 2,800 to 3,100 calories per day, with training days at the upper end. His protein target should be 1.6 to 2.0 grams per kilogram, which translates to 136 to 170 grams per day, spread across four meals.\n\nFor his B12, a sublingual methylcobalamin supplement at 1,000 micrograms daily will help bring his level above the optimal threshold of 500 and may improve his brain fog and energy.\n\nFor sleep and mood, he should aim for a fixed wake time seven days a week, get outside within an hour of waking for natural light exposure, cut caffeine by 1pm, keep the bedroom cool at around 18 degrees, and consider a magnesium glycinate supplement before bed, which may support both sleep quality and mood.\n\nHis step count of 5,000 to 7,500 is reasonable but could be higher. Increasing to 8,000 to 10,000 steps daily would improve cardiovascular health, support LDL reduction, and contribute to energy levels through better circulation and mitochondrial function. A daily walk after his largest meal would also support post-meal glucose clearance.\n\nA retest of the following markers is recommended in three to four months: sodium, potassium, chloride, phosphate, creatinine, Cystatin C, eGFR, full iron panel, full blood count with reticulocytes, ApoB, LDL, HbA1c, fasting insulin, C-Peptide, IgG, and IgE.","flags":"REQUIRES GP DISCUSSION:\n\n1. Sodium 151 mmol/L (range 133 to 146) with chloride 110 mmol/L (range 95 to 108). Mild hypernatraemia most likely reflecting dehydration at time of draw. Recommend repeat fasting sample after 48 hours of adequate hydration to exclude persistent elevation or hormonal cause.\n\n2. Potassium 8.8 mmol/L (range 3.5 to 5.3). Almost certainly artefactual due to sample haemolysis or delayed processing. No symptoms of hyperkalaemia reported. Requires urgent repeat on fresh, promptly processed sample for confirmation.\n\n3. Transferrin saturation 67.2% (range 18 to 55), serum iron 34.1 umol/L (range 11.6 to 31.3), transferrin 2.02 g/L (range 2.15 to 3.65). Pattern raises the possibility of hereditary haemochromatosis. CRP 0.2 makes inflammatory cause unlikely. Recommend HFE gene test for C282Y and H63D mutations.\n\n4. Creatinine 116 umol/L (range 65 to 104), creatinine-based eGFR 68, Cystatin C 1.12 mg/L (range below 1.1), Cystatin C-based eGFR 73. Creatinine elevation may partly reflect muscle mass and hydration status, but Cystatin C confirmation of sub-90 eGFR warrants monitoring. Recommend repeat in three months after hydration correction.\n\n5. Phosphate 2.4 mmol/L (range 0.78 to 1.65). Significantly elevated. May reflect sample handling artefact given the likely haemolysis affecting potassium, or could relate to mildly reduced renal clearance. Recommend repeat on fresh sample.\n\nFOR MONITORING:\n\n6. Neutrophils 1.52 x10^9/L (range 2.0 to 7.0). Mild neutropenia. In an asymptomatic 38-year-old, most likely benign ethnic neutropenia or mild energy deficit from training load. No infections reported.\n\n7. Reticulocytes absolute 38.2 x10^9/L (range 50 to 100). Mildly reduced red cell production. May relate to mild energy deficit. Monitor on retest.\n\n8. LDL 3.8 mmol/L (target below 3.0, optimal below 2.6), ApoB 1.2 g/L (target below 0.9), ApoB/A1 ratio 0.78 (target below 0.7), non-HDL 4.2 (target below 4.0), total cholesterol 6.0. Elevated atherogenic lipids. Lp(a) normal, so entirely modifiable. HDL 1.8 is protective. Dietary intervention recommended with retest in four to six months.\n\n9. Insulin 2.25 mIU/L (range 2.6 to 24.9), C-Peptide 0.695 ug/L (range 1.1 to 4.4), HOMA-IR 0.47. Pattern consistent with high insulin sensitivity and low insulin demand. Glucose 4.7 and HbA1c 40 are normal. Monitor HbA1c trend.\n\n10. IgG 17.76 g/L (range 6.5 to 16). Mildly elevated. May reflect chronic immune stimulation. Repeat on next panel.\n\n11. IgE 224 IU/mL (range below 100). Elevated, suggesting atopic tendency or allergic sensitisation. Consider allergy investigation if symptomatic.\n\n12. Uric acid 450 umol/L (range 220 to 547, optimal below 380). Within lab range but above optimal. Dietary modification and hydration recommended.\n\n13. Urine culture: significant growth of E. coli and Enterococcus faecalis. Plain bottle received without boric acid. WBCs below 1, nitrites negative, no urinary symptoms. Most consistent with sample contamination. Repeat in boric acid container only if symptoms develop.\n\nReassuring negatives: CRP 0.2 rules out systemic inflammation. ESR 4 confirms. Thyroid function excellent with negative antibodies. PSA 0.46 with free ratio 45.7% is reassuring for prostate health. CEA and CA 19-9 normal. Tissue transglutaminase negative excludes coeliac disease. Rheumatoid factor normal. Liver function excellent across all markers. Testosterone 28.3 is at the top of range. Vitamin D 96 is optimal. Lp(a) below 25 is normal and permanently recorded. Calcium and corrected calcium are normal. PTH is normal.","recommendations":"1. See GP with this report to arrange: repeat sodium, potassium, chloride, and phosphate on a fresh, promptly processed fasting sample after 48 hours of deliberate hydration; HFE gene test for haemochromatosis screening; repeat creatinine, Cystatin C, and eGFR in three months.\n\n2. Increase daily water intake to 2.5 to 3 litres, rising to 3.5 litres on training days. Add electrolytes or a pinch of sea salt to morning water.\n\n3. Do not take any iron-containing supplements. His iron stores and saturation are already elevated and additional iron could cause harm.\n\n4. Begin a sublingual methylcobalamin B12 supplement at 1,000 micrograms daily to optimise B12 above 500.\n\n5. Increase soluble fibre to 10 to 15 grams daily from oats, beans, lentils, and psyllium husk. Eat oily fish two to three times per week. Reduce saturated fat from butter, cheese, red meat, and processed meats. Retest ApoB and LDL in four to six months.\n\n6. Ensure caloric intake reaches 2,800 to 3,100 calories daily with 136 to 170 grams of protein to support bone marrow production and training recovery.\n\n7. Increase daily step count to 8,000 to 10,000. Add a 15 to 20 minute walk after the largest meal of the day.\n\n8. Consider allergy investigation if experiencing seasonal symptoms, skin irritation, or food sensitivities, given elevated IgE.\n\n9. Reduce purine-rich foods and maintain good hydration to bring uric acid below 380.\n\n10. Maintain current vitamin D intake as levels are optimal. Continue pairing with vitamin K2.\n\n11. Fix wake time, get outside within an hour of waking, cut caffeine by 1pm, and keep the bedroom cool to support sleep quality, mood, and energy.\n\n12. Retest in three to four months: sodium, potassium, chloride, phosphate, creatinine, Cystatin C, eGFR, full iron panel, full blood count with reticulocytes, ApoB, LDL, HbA1c, fasting insulin, C-Peptide, IgG, IgE.","supplementation":"DO NOT take iron supplements. Matt's transferrin saturation is 67.2% and his serum iron is above range. Additional iron could worsen a potential overload situation and must be avoided until haemochromatosis has been excluded by HFE gene testing.\n\nVitamin B12: sublingual methylcobalamin, 1,000 micrograms daily, taken in the morning. His B12 at 470 is below the optimal threshold of 500, and B12 is directly involved in nerve conduction, red blood cell formation, and neurotransmitter synthesis. Given his symptoms of brain fog and fatigue, optimising this level may produce a noticeable improvement. Sublingual methylcobalamin bypasses any absorption issues in the gut and delivers the active form directly.\n\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with his largest meal. His ApoB at 1.2 and LDL at 3.8 are both elevated, and omega-3 fatty acids help reduce triglyceride production, improve endothelial function, and may modestly reduce ApoB particle number. A high-quality triglyceride-form fish oil is preferable to ethyl ester forms for absorption.\n\nVitamin D3: continue current intake as his level of 96 is within the optimal range of 75 to 120. A maintenance dose of 2,000 IU daily with a fat-containing meal through autumn and winter will sustain this level. Always pair with vitamin K2 MK-7 at 100 to 200 micrograms daily. Vitamin K2 directs calcium into bone rather than into artery walls, and given his corrected calcium is healthy at 2.4, this combination supports bone density without cardiovascular risk.\n\nMagnesium glycinate: 300 to 400 milligrams taken before bed. His serum magnesium at 1.11 sits right at the top of the lab range, which is good, but serum magnesium reflects only about 1% of total body stores. Magnesium glycinate is the best-tolerated form for evening use, supports sleep quality, muscle recovery, and mood regulation, all of which align with his goals.\n\nPsyllium husk fibre: one tablespoon (approximately 5 grams) stirred into water once daily, taken before or with a meal. This is a practical way to reach the 10 to 15 gram soluble fibre target that can reduce LDL and ApoB by binding bile acids in the gut and forcing the liver to pull cholesterol from the blood to make more.\n\nThe most important changes from this report are not supplements. They are correcting his hydration to bring sodium back into range, increasing his caloric intake on training days to support bone marrow function and recovery, making the dietary shifts in soluble fibre, oily fish, and saturated fat reduction to bring his ApoB down, and getting the HFE gene test through his GP to clarify the iron picture.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1518","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When the liver is under strain, whether from metabolic stress, alcohol, medication, or fat accumulation, ALT leaks into the bloodstream. Matt's ALT at 17 is well within both the laboratory range and the tighter optimal threshold of below 30 for men, indicating that his liver cells are healthy and under no significant stress. This is a reassuring finding, particularly in the context of assessing long-term metabolic health.","low_causes":"","high_causes":"Liver disease, fatty liver, alcohol use, medications, viral hepatitis, muscle damage","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Unlike ALT, which is fairly liver-specific, AST can rise after exercise or muscle injury as well as liver damage. Matt's AST at 29 is comfortably within range. Given his regular resistance training, a modest AST is expected and this level is entirely healthy.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart disease, muscle damage, strenuous exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1438","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"Gamma GT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol use, bile duct issues, and metabolic stress. It is one of the earliest markers to rise when the liver is under strain. Matt's GGT at 21 is well within the optimal range of below 25 for men, confirming that his liver is handling its metabolic workload comfortably with no sign of biliary or alcohol-related strain.","low_causes":"","high_causes":"Alcohol use, bile duct obstruction, liver disease, metabolic syndrome, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and intestines. It is useful for detecting bile duct obstruction and bone disorders. Matt's ALP at 53 is within the lower part of the reference range, which is normal and unremarkable for a 38-year-old male.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, Paget's disease, liver disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"12.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4941","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated bilirubin can indicate liver dysfunction, bile duct obstruction, or excessive red cell breakdown. Matt's bilirubin at 12.7 is mid-range and entirely healthy.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"84","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6933","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6427","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. Albumin is produced by the liver and maintains blood volume, while globulins include immune proteins such as immunoglobulins. Matt's total protein at 84 is marginally above the upper limit of 82, driven by his mildly elevated IgG. This is not a separate clinical concern but rather a reflection of his immunoglobulin levels.","low_causes":"Liver disease, malnutrition, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, elevated immunoglobulins, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6250","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and is an indicator of both liver synthetic function and nutritional status. Matt's albumin at 48 is in the upper part of the range and within optimal, reflecting excellent liver function and good nutritional status.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, malabsorption","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin encompasses a group of proteins including immunoglobulins, which are antibodies produced by the immune system, and transport proteins. Matt's globulin at 36 sits right at the upper limit of the laboratory range. This is driven by his mildly elevated IgG and is consistent with an active immune system rather than a disease process.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, elevated immunoglobulins, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein groups in the blood. A healthy ratio indicates balanced liver function and immune activity. Matt's A/G ratio of 1.33 is within both the laboratory and optimal ranges, confirming a healthy balance between liver-produced albumin and immune-related globulins.","low_causes":"Elevated globulins, liver disease, immune disorders","high_causes":"Immune deficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4726","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the likelihood of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. Matt's FIB-4 at 1.37 is within the normal range of below 1.45 for his age group, though slightly above the more conservative 1.3 threshold. His individual liver markers are all excellent, with ALT at 17, GGT at 21, and normal bilirubin and albumin, so the FIB-4 is being nudged upward by his platelet count sitting in the lower-normal range rather than by any sign of liver disease. No further action is needed.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, advanced liver disease, age, low platelets, elevated AST","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatic inflammation. Matt's amylase at 82 is comfortably within range, confirming normal pancreatic function.","low_causes":"Chronic pancreatitis, pancreatic insufficiency","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is an enzyme produced almost exclusively by the pancreas that breaks down fats. It is more specific to pancreatic function than amylase. Matt's lipase at 45 is within range, providing further confirmation that the pancreas is functioning normally.","low_causes":"Pancreatic insufficiency","high_causes":"Acute pancreatitis, chronic pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5795","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures the combined amount of all cholesterol carried in the blood, including LDL, HDL, and VLDL particles. While it provides a useful overview, the breakdown into individual fractions is more clinically meaningful. Matt's total cholesterol at 6.0 is above the desirable level of 5.18, driven primarily by his elevated LDL. His excellent HDL of 1.8 means the total number is somewhat misleading in isolation, as a significant portion of his total cholesterol is the protective kind.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5806","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein, is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. Higher HDL is better. Matt's HDL at 1.8 is excellent, well above the optimal threshold of 1.4 for men, and represents one of the strongest findings in his lipid panel. This level offers meaningful cardiovascular protection.","low_causes":"Sedentary lifestyle, smoking, obesity, poor diet, metabolic syndrome","high_causes":"Regular exercise, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7600","lower_normal":"0","upper_normal":"3","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL, or low-density lipoprotein, is the cholesterol fraction most associated with atherosclerosis, the build-up of plaques inside artery walls. LDL particles can penetrate the artery lining and trigger an inflammatory cascade that narrows blood vessels over time. Matt's LDL at 3.8 is above the upper limit of 3.0 and well above the optimal target of 2.6. Combined with his elevated ApoB, this indicates a higher-than-ideal number of atherogenic particles. The reassuring finding is that his Lp(a) is normal, meaning this elevation is entirely driven by modifiable lifestyle factors and is responsive to dietary changes.","low_causes":"Hyperthyroidism, liver disease, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, sedentary lifestyle, familial hypercholesterolaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2971","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the most common form of fat in the blood, produced from dietary sugars and fats and stored in fat cells for energy. Elevated triglycerides are associated with cardiovascular risk and metabolic syndrome. Matt's triglycerides at 1.01 are within the laboratory range and very close to the optimal threshold of 1.0, reflecting good metabolic handling of dietary fats and sugars.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar or refined carbohydrate diet, obesity, alcohol use, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2949","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, is produced by the liver to transport triglycerides to tissues. It is a precursor to LDL particles. Matt's VLDL at 0.46 is within optimal, consistent with his healthy triglyceride level.","low_causes":"Malnutrition, hyperthyroidism","high_causes":"High triglycerides, obesity, metabolic syndrome, alcohol use, high sugar diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol and represents the total amount of potentially harmful cholesterol in the blood, including LDL, VLDL, and remnant particles. It provides a broader measure of atherogenic risk than LDL alone. Matt's non-HDL at 4.2 is above the target of 4.0, consistent with his elevated LDL and ApoB.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, genetics, obesity, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3700","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of the balance between harmful and protective cholesterol. A lower ratio is better. Matt's ratio of 3.33 is within the optimal range, reflecting the protective effect of his excellent HDL. Even with elevated total cholesterol, his high HDL brings this ratio into a favourable zone.","low_causes":"","high_causes":"Low HDL, high total cholesterol, poor diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This measures what percentage of total cholesterol is made up of protective HDL. Higher is better. Matt's 30% is a strong result, meaning nearly a third of his circulating cholesterol is the beneficial HDL type.","low_causes":"Low HDL, metabolic syndrome, obesity, sedentary lifestyle","high_causes":"Regular exercise, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein that sits on the surface of every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, measuring ApoB effectively counts the total number of particles capable of entering an artery wall and contributing to plaque formation. It is considered the single most accurate blood marker of cardiovascular risk. Matt's ApoB at 1.2 is above the desirable level of 0.9 and the optimal target of 0.8, classified by the lab as 'high'. This is the lipid marker that matters most for his long-term cardiovascular health goals and should be the primary target for dietary intervention.","low_causes":"Hyperthyroidism, liver disease, malnutrition","high_causes":"Diet high in saturated fat, genetics, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6417","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein component of HDL particles. It drives reverse cholesterol transport, the process that removes cholesterol from artery walls and returns it to the liver. Higher levels are protective. Matt's ApoA1 at 1.54 is a healthy result, consistent with his excellent HDL level.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol intake, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5571","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is one of the most powerful predictors of cardiovascular risk because it captures the balance between atherogenic particles (ApoB) and protective particles (ApoA1) in a single number. Matt's ratio of 0.78 is above the lower-risk threshold of 0.7, placing him in the 'average risk' category. Reducing his ApoB through dietary changes while maintaining his strong ApoA1 would bring this ratio into the protective zone.","low_causes":"","high_causes":"Elevated ApoB, low ApoA1, high saturated fat diet, sedentary lifestyle","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle similar to LDL but with an additional protein called apolipoprotein(a) attached. Its level is almost entirely determined by genetics and does not change with diet, exercise, or most medications. Elevated Lp(a) independently increases cardiovascular and stroke risk. Matt's Lp(a) is below 25, which is within the normal range of below 32. This is genuinely useful, permanently recorded information. Because his Lp(a) is normal, the elevated LDL and ApoB in his profile are driven entirely by modifiable factors such as diet and lifestyle, which means they are fully responsive to intervention. This result only needs to be measured once in a lifetime.","low_causes":"","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_chol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich lipoprotein remnants, calculated as total cholesterol minus HDL minus LDL. These remnant particles are now recognised as independently atherogenic. Matt's remnant cholesterol at 0.40 is within the optimal range of below 0.5, reflecting his healthy triglyceride metabolism.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome, obesity, insulin resistance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1867","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful surrogate marker of insulin resistance and metabolic health. A lower ratio indicates better metabolic function. Matt's ratio of 0.56 is well within the optimal range, reflecting excellent metabolic handling and insulin sensitivity. This is consistent with his low HOMA-IR.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, high sugar diet, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/l","description":"Fasting blood glucose measures the level of sugar in the blood after a period of not eating, typically overnight. It reflects the body's ability to regulate blood sugar at rest. Matt's glucose at 4.7 is within the optimal range of 4.0 to 5.4, confirming healthy fasting glucose control.","low_causes":"Excessive fasting, insulin overdose, adrenal insufficiency, liver disease","high_causes":"Diabetes, pre-diabetes, stress, infection, medications, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c, or glycated haemoglobin, measures the average blood sugar level over the preceding two to three months by looking at the percentage of haemoglobin molecules that have sugar attached to them. Matt's HbA1c at 40 mmol/mol is within the normal range of below 42 but above the optimal threshold of 36. In percentage terms, this equates to 5.8%, just below the 6.0% pre-diabetes boundary. While this is not currently concerning, it sits in the upper part of the normal range and warrants monitoring on future tests. Combined with his low insulin output, it is worth ensuring his carbohydrate handling remains stable.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease, pregnancy","high_causes":"Pre-diabetes, diabetes, high sugar diet, reduced physical activity, stress","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2979","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5483","units":"mIU/L","description":"Fasting insulin measures the level of insulin, the hormone produced by the pancreas that allows cells to absorb glucose from the blood. Matt's fasting insulin at 2.25 is below the laboratory reference range of 2.6 to 24.9. However, it falls within the optimal range of 2 to 8 for a lean, active individual. Low fasting insulin in the context of normal glucose indicates high insulin sensitivity, meaning the body needs very little insulin to keep blood sugar controlled. This is a metabolically favourable finding, though it should be monitored alongside HbA1c to ensure the pancreas continues to meet demand as he ages.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, pancreatic insufficiency","high_causes":"Insulin resistance, metabolic syndrome, obesity, PCOS, type 2 diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"230","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2632","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5699","units":"pmol/L","description":"C-Peptide is a byproduct released in equal amounts to insulin when the pancreas produces insulin. It is useful because it reflects true pancreatic insulin output without being affected by external insulin administration. Matt's C-Peptide converts to approximately 230 pmol/L, below the lower limit of 364. The lab notes that samples not separated within four hours can see C-Peptide decrease to 44% of baseline, so the true level may be somewhat higher. Interpreted alongside his normal glucose and low HOMA-IR, this most likely reflects genuinely low insulin demand rather than pancreatic failure.","low_causes":"High insulin sensitivity, low carbohydrate diet, type 1 diabetes, sample degradation","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.47","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.3133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is a calculated index that estimates how resistant the body's cells are to insulin. A lower HOMA-IR is better, indicating that cells respond readily to insulin. Matt's HOMA-IR at 0.47 is below the laboratory lower limit of 0.5 but in the favourable direction. According to the lab note, below 1.0 indicates insulin sensitivity, which is optimal. His result confirms he is highly insulin-sensitive, meaning his body manages blood sugar very efficiently with minimal insulin output.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, fasting","high_causes":"Insulin resistance, obesity, metabolic syndrome, PCOS, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"37.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2604","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B, or HOMA Beta-cell function, estimates the functional capacity of the beta cells in the pancreas that produce insulin. Matt's HOMA-B calculates to approximately 37.5, below the lower limit of 80. This reflects that his pancreas is producing the minimum insulin needed because his tissues are so insulin-sensitive. In the context of normal glucose and HbA1c within range, this is a pattern of efficiency rather than failure. However, with HbA1c at 40, monitoring this relationship over time is sensible.","low_causes":"High insulin sensitivity with low demand, low carbohydrate diet, pancreatic beta cell decline, type 1 diabetes","high_causes":"Insulin resistance, compensatory insulin overproduction, early type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein is an inflammatory marker produced by the liver in response to systemic inflammation anywhere in the body. It is one of the most important markers for assessing cardiovascular risk and general inflammatory burden. Matt's hs-CRP at 0.2 is exceptionally low, well within the optimal range of below 1.0, and confirms that there is no significant inflammatory process active in his body. This is an excellent finding for long-term health.","low_causes":"","high_causes":"Infection, chronic inflammation, autoimmune disease, cardiovascular risk, obesity, smoking","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. Matt's ESR at 4 is low and within optimal range, reinforcing the picture of minimal systemic inflammation seen with his CRP.","low_causes":"","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, cancer, pregnancy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"151","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7179","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the most abundant electrolyte in the blood and plays a critical role in maintaining fluid balance, nerve transmission, and muscle function. It is tightly regulated by the kidneys and hormones including antidiuretic hormone and aldosterone. Matt's sodium at 151 is above the upper limit of 146, representing mild hypernatraemia. The most common cause is inadequate fluid intake relative to losses, particularly with exercise. This finding should be discussed with his GP and repeated on a fresh sample after deliberate hydration.","low_causes":"Excessive water intake, diuretics, heart failure, kidney disease, SIADH, adrenal insufficiency","high_causes":"Dehydration, inadequate water intake, diabetes insipidus, excessive salt intake, diarrhoea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pot","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"8.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9630","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is an essential electrolyte that controls nerve signals, muscle contractions, and heart rhythm. Even small changes in blood potassium can significantly affect heart function. Matt's potassium is returned at 8.8, far above the upper limit of 5.3. However, the lab notes that potassium results should be viewed with caution if the sample was delayed or remained on cells. Red blood cells contain approximately thirty times the concentration of potassium found in serum, so even mild haemolysis during sample collection or transport can dramatically elevate the measured result. A true potassium of 8.8 would cause severe cardiac symptoms that Matt is not experiencing, so this result almost certainly reflects sample artefact. It must be repeated on a fresh, promptly processed sample to confirm a normal level.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low magnesium, renal tubular acidosis","high_causes":"Sample haemolysis, kidney disease, ACE inhibitors, potassium-sparing diuretics, Addison's disease, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"110","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7179","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works closely with sodium to maintain fluid balance and acid-base equilibrium in the body. It typically moves in the same direction as sodium. Matt's chloride at 110 is above the upper limit of 108 and is consistent with the elevated sodium, both most likely reflecting dehydration at the time of the blood draw. It does not represent a separate clinical concern.","low_causes":"Vomiting, diuretics, heart failure, SIADH, Addison's disease","high_causes":"Dehydration, kidney disease, hyperventilation, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"20.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3424","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a key buffer in the blood that helps maintain the acid-base balance, or pH. It is produced by the kidneys and consumed when the body neutralises acids. Matt's bicarbonate at 20.1 sits right at the lower boundary of the reference range and below optimal. This may relate to the mild dehydration and elevated sodium and chloride seen elsewhere in his results, which can shift acid-base balance. If hydration is corrected, bicarbonate would be expected to normalise.","low_causes":"Metabolic acidosis, dehydration, kidney disease, diarrhoea, strenuous exercise","high_causes":"Metabolic alkalosis, vomiting, diuretic use, COPD","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"29.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9063","lower_normal":"8","upper_normal":"16","lower_optimal":"1
