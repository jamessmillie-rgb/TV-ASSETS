0","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is a calculated value derived from sodium, potassium, chloride, and bicarbonate. It estimates the concentration of unmeasured anions in the blood and is used to assess acid-base disorders. Matt's anion gap calculates to 29.7, well above the upper limit of 16. However, this calculation is dominated by his markedly elevated potassium of 8.8, which is almost certainly artefactual from sample haemolysis. If potassium were at a normal level of 4.5, the anion gap would calculate to approximately 25.4, and even this would be elevated partly due to the elevated sodium from dehydration. This result should not be interpreted in isolation and should be repeated on a fresh sample alongside sodium, potassium, and chloride.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Lactic acidosis, ketoacidosis, renal failure, toxin ingestion, sample artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5877","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6228","units":"mmol/l","description":"Calcium is essential for bone structure, muscle contraction, nerve signalling, and blood clotting. Most calcium is stored in bone, with less than 1% circulating in the blood. Matt's calcium at 2.55 is within both the laboratory and optimal ranges, indicating healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, dehydration, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement for the albumin level, giving a more accurate reflection of biologically active calcium. Matt's corrected calcium at 2.4 is within optimal range, confirming genuinely healthy calcium homeostasis.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"2.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9310","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/l","description":"Phosphate is a mineral essential for bone health, energy production, and DNA synthesis. It is regulated by the kidneys, parathyroid hormone, and vitamin D. Matt's phosphate at 2.4 is significantly above the upper limit of 1.65. Elevated phosphate can reflect reduced kidney clearance, and his mildly reduced eGFR may be contributing. However, phosphate is also released from red blood cells during haemolysis, and given that his potassium result strongly suggests sample haemolysis, the phosphate elevation may be partly or wholly artefactual. This should be repeated on a fresh, promptly processed sample.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, alcoholism, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, sample haemolysis, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6348","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, blood sugar control, and sleep regulation. Serum magnesium reflects only about 1% of total body stores, so a normal blood level does not always guarantee adequate tissue stores. Matt's magnesium at 1.11 sits right at the upper limit of the laboratory range, which is a good result. Supplementation with magnesium glycinate before bed can still be beneficial for sleep quality and recovery regardless of the serum level.","low_causes":"Poor dietary intake, alcohol use, diuretics, diarrhoea, diabetes, medications","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ua","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"450","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5703","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5223","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced naturally by the body. Excess uric acid can crystallise in joints causing gout, and elevated levels are associated with cardiovascular risk and kidney disease. Matt's uric acid at 450 is within the laboratory range but above the optimal threshold of 380 for men. Maintaining good hydration and moderating intake of purine-rich foods such as red meat, organ meats, shellfish, and beer will help keep this in check.","low_causes":"Low purine diet, liver disease, Fanconi syndrome, medications","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product of protein metabolism produced by the liver and excreted by the kidneys. It provides an indirect measure of kidney function and protein intake. Matt's urea at 5.5 is within both the laboratory and optimal ranges, confirming adequate kidney excretory function for this marker.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, heart failure, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"116","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7521","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3561","upper_optimal_position":"0.6325","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism, filtered by the kidneys and excreted in urine. It is the most commonly used marker for estimating kidney filtration rate. Matt's creatinine at 116 is above the upper limit of 104. In a 38-year-old male who resistance trains regularly, some elevation is expected from higher muscle mass and can also be temporarily influenced by meat intake and hydration status. However, combined with his Cystatin C result, this warrants a repeat to confirm.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high protein diet, muscle mass, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate calculated from creatinine estimates how much blood the kidneys filter per minute. An eGFR above 90 is considered normal, 60 to 89 is mildly reduced, and below 60 requires investigation. Matt's creatinine-based eGFR at 68 is above 60 but below the optimal threshold of 90. However, creatinine-based eGFR can underestimate true kidney function in muscular individuals. The Cystatin C-based eGFR of 73 provides a complementary estimate. Both being below 90 warrants a repeat after correcting hydration.","low_causes":"Kidney disease, dehydration, urinary obstruction, medications, aging","high_causes":"Hyperfiltration in early diabetes, pregnancy, high cardiac output states","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5091","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a protein produced at a constant rate by all nucleated cells in the body. Unlike creatinine, its blood level is not significantly affected by muscle mass, diet, or sex, making it a more reliable marker of kidney filtration, particularly in people who are muscular or very lean. Matt's Cystatin C at 1.12 is just above the upper limit of 1.1, giving a Cystatin C-based eGFR of 73. This confirms that the reduced eGFR seen with creatinine is not simply a muscle mass artefact. However, dehydration can also temporarily elevate Cystatin C by concentrating the blood, and his elevated sodium supports dehydration as a contributing factor. A repeat after hydration correction will clarify.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Kidney disease, dehydration, hypothyroidism, inflammation, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The eGFR calculated from Cystatin C provides a muscle-mass-independent estimate of kidney filtration. Matt's Cystatin C-based eGFR of 73 is above 60 and within the laboratory reference range, but below the optimal threshold of 90. Combined with the creatinine-based eGFR of 68, this suggests kidney filtration may be mildly below optimal, though dehydration at the time of sampling is a likely contributor. A repeat in three months after hydration correction is recommended.","low_causes":"Kidney disease, dehydration, urinary obstruction","high_causes":"Hyperfiltration, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"151","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the iron-containing protein in red blood cells that carries oxygen from the lungs to tissues and returns carbon dioxide for exhalation. It is the most fundamental measure of the blood's oxygen-carrying capacity. Matt's haemoglobin at 151 is within both the laboratory and optimal ranges for men, confirming adequate oxygen transport.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, smoking, high altitude, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"5.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5100","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10/12/l","description":"The red blood cell count measures the total number of red cells per litre of blood. Red cells are produced in the bone marrow and carry haemoglobin to transport oxygen. Matt's red cell count at 5.03 is mid-range and within optimal.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Dehydration, polycythaemia, smoking, chronic lung disease, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.49","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"l/l","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Matt's haematocrit at 0.45 is right in the middle of the range, indicating a healthy balance between red cells and plasma volume.","low_causes":"Anaemia, overhydration, blood loss, chronic disease","high_causes":"Dehydration, polycythaemia, smoking, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"89.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4944","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"Mean corpuscular volume measures the average size of red blood cells. Small cells can indicate iron deficiency, while large cells can suggest B12 or folate deficiency. Matt's MCV at 89.3 is within optimal, indicating red cells of normal size.","low_causes":"Iron deficiency, thalassaemia, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol use, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3867","upper_optimal_position":"0.6333","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin per red blood cell. Matt's MCH at 30.1 is within optimal, meaning each red cell is carrying an appropriate amount of haemoglobin for efficient oxygen transport.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"336","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures the average concentration of haemoglobin within each red blood cell. Matt's MCHC at 336 is mid-range and healthy.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6095","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"Red cell distribution width measures the variation in size among red blood cells. A higher RDW means more variation, which can indicate mixed nutritional deficiencies or early changes in red cell production. Matt's RDW at 14.3 is within the laboratory range but above the optimal threshold of 13.5. This may relate to the slightly reduced reticulocyte output, with a mixed population of older and newer cells.","low_causes":"","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiencies, liver disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"195","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3910","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4295","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments produced by the bone marrow that are essential for blood clotting. Matt's platelet count at 195 is within both the laboratory and optimal ranges.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications, liver disease, alcohol","high_causes":"Iron deficiency, infection, inflammation, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6667","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets are generally younger and more active. Matt's MPV at 9.6 is within range and unremarkable.","low_causes":"Bone marrow suppression, inflammatory conditions, aplastic anaemia","high_causes":"Immune thrombocytopenia, myeloproliferative disorders, platelet destruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The total white blood cell count measures the overall number of immune cells circulating in the blood. Matt's WBC at 4.25 is within the laboratory range but at the lower end and below the optimal threshold. This is driven by his low neutrophil count and may reflect benign ethnic neutropenia or mild under-fuelling from training relative to caloric intake.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications, nutritional deficiency, benign ethnic neutropenia","high_causes":"Bacterial infection, inflammation, stress, smoking, leukaemia, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"1.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2360","lower_normal":"2","upper_normal":"7","lower_optimal":"2","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and serve as the body's first line of defence against bacterial infections. They are produced in the bone marrow and released into the blood to patrol for pathogens. Matt's neutrophils at 1.52 are below the lower limit of 2.0, representing mild neutropenia. In a well 38-year-old with no infections and no medications, this is most commonly a benign finding. Benign ethnic neutropenia is very common in people of European descent and does not increase infection risk. Alternatively, a mild energy gap from training five times per week can cause the body to economise on immune cell production. His lymphocyte count at 2.16 is healthy, and his CRP and ESR are both very low, confirming no active infection or inflammatory process.","low_causes":"Benign ethnic neutropenia, viral infections, medications, bone marrow disorders, nutritional deficiency, autoimmune conditions","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including the production of antibodies (B lymphocytes) and the direct killing of infected cells (T lymphocytes). Matt's lymphocyte count at 2.16 is within optimal range, indicating a healthy adaptive immune system.","low_causes":"HIV, immunosuppressive medications, corticosteroids, autoimmune disease, stress","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest pathogens and dead cells. They also play a role in presenting antigens to the adaptive immune system. Matt's monocyte count at 0.48 is within optimal range.","low_causes":"Bone marrow disorders, aplastic anaemia","high_causes":"Chronic infections, autoimmune disease, inflammatory conditions, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3681","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5528","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Despite Matt's elevated IgE suggesting allergic tendency, his eosinophil count at 0.07 is low-normal, suggesting there is no active allergic response occurring at the time of the blood draw.","low_causes":"Cushing's syndrome, corticosteroid use, stress","high_causes":"Allergies, parasitic infections, asthma, eczema, autoimmune disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic responses and inflammatory reactions. Matt's basophil count at 0.02 is normal.","low_causes":"Hyperthyroidism, acute allergic reactions, corticosteroid use","high_causes":"Allergies, myeloproliferative disorders, hypothyroidism, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR","group":"HEMATOLOGY","result":"0.70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1833","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a calculated marker of systemic inflammation and immune balance. A very low NLR, as seen here at 0.70, is driven by Matt's low neutrophil count rather than by elevated lymphocytes. In the context of excellent CRP and ESR, this does not indicate active inflammation but rather reflects his benign neutropenia.","low_causes":"Benign ethnic neutropenia, low neutrophil count from any cause","high_causes":"Bacterial infection, systemic inflammation, stress, cardiovascular risk, cancer","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte %","group":"HEMATOLOGY","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocyte percentage measures the proportion of young, newly released red blood cells in the circulation. It indicates how actively the bone marrow is producing red cells. Matt's reticulocyte percentage at 0.76% is within the laboratory range.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease, aplastic anaemia","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"38.228","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2122","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count provides a more accurate picture of bone marrow red cell production than the percentage alone because it accounts for the total red cell count. Matt's absolute reticulocyte count at 38.2 is below the lower limit of 50, suggesting the bone marrow is producing red cells at a mildly reduced rate. In the context of adequate haemoglobin, this is not causing anaemia but suggests the marrow is operating at a lower level of activity than ideal. Combined with his mildly low neutrophils, this may point to a mild energy deficit relative to his training load.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease, inadequate caloric intake","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"34.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7139","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3906","upper_optimal_position":"0.6102","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood bound to transferrin. It fluctuates throughout the day and with recent meals but, when elevated alongside high saturation and low transferrin, forms a pattern that warrants investigation. Matt's serum iron at 34.1 is above the upper limit of 31.3.","low_causes":"Iron deficiency, chronic disease, blood loss, vegetarian diet, malabsorption","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease, repeated transfusions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"158","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the storage form of iron. It reflects the body's iron reserves and is the most useful single marker for assessing iron status. Matt's ferritin at 158 is within both the laboratory and optimal ranges for men. While reassuring on its own, it must be interpreted alongside his elevated saturation and low transferrin, which together paint a more concerning picture of how iron is being handled.","low_causes":"Iron deficiency, blood loss, vegetarian diet, heavy exercise, malabsorption","high_causes":"Haemochromatosis, inflammation, liver disease, infection, iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2870","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6000","units":"g/L","description":"Transferrin is the main protein that transports iron through the blood. The liver produces transferrin, and its levels typically rise when iron stores are low and fall when iron stores are high, as the body downregulates production when it senses adequate iron. Matt's transferrin at 2.02 is just below the lower limit of 2.15. In combination with his elevated iron and high saturation, this pattern is consistent with the body suppressing transferrin production because it has more iron than it needs, which raises the possibility of hereditary haemochromatosis.","low_causes":"Haemochromatosis, chronic inflammation, liver disease, protein malnutrition, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"67.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8012","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4225","upper_optimal_position":"0.5135","units":"%","description":"Transferrin saturation measures the percentage of transferrin molecules that are carrying iron. It is one of the most important screening markers for iron overload conditions. Matt's transferrin saturation at 67.2% is well above the upper limit of 55% and above the optimal range of 25 to 40%. A saturation consistently above 45% in men is the primary biochemical trigger for investigating haemochromatosis. At 67.2%, this is a finding that should be discussed with his GP, who should arrange an HFE gene test.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease, sample timing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"48.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3812","lower_normal":"44","upper_normal":"76.1","lower_optimal":"44","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6037","units":"umol/l","description":"Total iron binding capacity measures the total amount of iron the blood could carry if all transferrin were fully saturated. A low TIBC often accompanies iron overload, while a high TIBC suggests iron deficiency. Matt's TIBC at 48.6 is at the lower end of the range, consistent with the pattern of iron sufficiency or excess seen in his other iron markers.","low_causes":"Haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"28.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6609","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, mood, energy, cognitive function, and sexual health. Matt's testosterone at 28.3 is near the top of the reference range and firmly within the optimal band of 18 to 30. This is an excellent result for 38 and indicates strong testicular function.","low_causes":"Aging, obesity, chronic illness, sleep deprivation, excessive endurance training, medications, pituitary disorders","high_causes":"Exogenous testosterone, anabolic steroid use, adrenal tumours, PCOS in females","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"52.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5765","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3835","upper_optimal_position":"0.5789","units":"nmol/l","description":"Sex hormone binding globulin is a protein produced by the liver that binds to testosterone, oestradiol, and other sex hormones, controlling how much is 'free' and biologically active. Matt's SHBG at 52.6 is within both the laboratory and optimal ranges. Given his high total testosterone, his free testosterone remains healthy despite the SHBG being in the upper half of range.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Aging, hyperthyroidism, liver disease, low BMI, oestrogen use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"53.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5317","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5278","units":"","description":"The free androgen index is calculated from total testosterone and SHBG and provides an estimate of the biologically active testosterone available to tissues. Matt's FAI at 53.8 is within optimal range, confirming adequate androgenic activity.","low_causes":"Low testosterone, high SHBG, aging, liver disease","high_causes":"Low SHBG, insulin resistance, obesity, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ftec","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.455","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0.2","upper_normal":"0.7","lower_optimal":"0.3","upper_optimal":"0.65","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6333","units":"nmol/l","description":"Free testosterone is the portion of total testosterone not bound to SHBG or albumin, and therefore immediately available to act on target tissues such as muscle, bone, and brain. Matt's calculated free testosterone at 0.455 is within optimal range, confirming that sufficient testosterone is reaching tissues to support muscle growth, energy, and cognitive function.","low_causes":"Low total testosterone, high SHBG, aging, obesity","high_causes":"Low SHBG, anabolic steroid use, adrenal disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"137","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4691","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4450","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen and plays important roles in bone health, cardiovascular protection, brain function, and joint health in men as well as women. Men produce oestradiol primarily through the conversion of testosterone by an enzyme called aromatase. Matt's oestradiol at 137 is within the laboratory range and within the upper part of the optimal band, consistent with his high testosterone level providing ample substrate for conversion.","low_causes":"Low testosterone, low body fat, aromatase inhibitors","high_causes":"High body fat, high testosterone, liver disease, medications","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4491","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced by the adrenal glands and testes in small amounts. It plays a role in regulating other hormones and supporting brain function. Matt's progesterone at 1.41 is within the male reference range.","low_causes":"Adrenal insufficiency, low cholesterol","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, testicular tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"5.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5033","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland in the brain and stimulates the testes to produce testosterone. It works in a feedback loop with testosterone. Matt's LH at 5.48 is mid-range and within optimal, confirming normal pituitary signalling.","low_causes":"Pituitary disease, anabolic steroid use, severe illness, obesity","high_causes":"Primary hypogonadism, testicular failure, Klinefelter syndrome, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"FSH","group":"HORMONES","result":"8.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5256","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.4693","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland and in men stimulates sperm production in the testes. Matt's FSH at 8.05 is within the laboratory range but above the optimal threshold of 7. This is a minor finding and does not indicate any specific pathology at this level.","low_causes":"Pituitary disease, anabolic steroid use, severe illness","high_causes":"Primary hypogonadism, testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3586","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5909","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, primarily involved in milk production in women but also playing roles in immune function and reproductive health in men. Elevated prolactin in men can suppress testosterone and cause symptoms. Matt's prolactin at 80 is within range and unremarkable.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma, medications, stress, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"440","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5288","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4486","upper_optimal_position":"0.6186","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a diurnal pattern, being highest in the morning and declining throughout the day. It regulates energy, immune function, blood sugar, and the stress response. Matt's cortisol at 440 is mid-range for a morning sample, which is healthy and suggests normal adrenal function and an appropriate stress response.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, sleep deprivation, overtraining","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4513","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4313","upper_optimal_position":"0.5697","units":"umol/L","description":"DHEA sulphate is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is a marker of adrenal function and tends to decline with age. Matt's DHEA-S at 4.6 umol/L, which converts to approximately 1,695 micrograms per decilitre, is healthy for his age and consistent with good adrenal function.","low_causes":"Aging, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"Adrenal tumours, PCOS, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3835","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5947","units":"mIU/l","description":"Thyroid stimulating hormone is released by the pituitary gland to instruct the thyroid to produce thyroid hormones. It works in an inverse relationship: when thyroid hormones are low, TSH rises to push production, and when thyroid hormones are adequate, TSH drops. Matt's TSH at 1.26 sits within the optimal range of 1.0 to 2.5, indicating that the pituitary is satisfied with thyroid hormone output and the thyroid is functioning efficiently.","low_causes":"Hyperthyroidism, Graves' disease, pituitary disease, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5750","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4, or free thyroxine, is the unbound form of the main hormone toimmune thyroid activity. Matt's TPO antibodies are below 6.6, which is within the normal range, confirming no autoimmune attack on the thyroid.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein produced by the thyroid that is a precursor to thyroid hormones. Elevated levels suggest autoimmune thyroid disease. Matt's thyroglobulin antibodies are below 1.3, which is undetectable and normal, further confirming no autoimmune thyroid activity.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone precursor that is essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin in response to sunlight and obtained from dietary sources and supplements. Matt's vitamin D at 96 is within the optimal range of 75 to 120 nmol/L. This is a strong result and reflects either good sun exposure, supplementation, or both. Maintaining this level through the winter months with a maintenance dose of vitamin D3 is important.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, kidney disease, aging","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"470","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4478","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5223","upper_optimal_position":"0.5886","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and neurotransmitter production. It is obtained from animal products and requires intrinsic factor for absorption in the gut. Matt's B12 at 470 is within the laboratory range but below the optimal threshold of 500. Given his symptoms of brain fog, fatigue, and low mood, all of which have neurological components that B12 supports, optimising this level with sublingual methylcobalamin supplementation could meaningfully improve how he feels.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, atrophic gastritis, metformin use, malabsorption, Crohn's disease","high_causes":"Supplementation, liver disease, myeloproliferative disorders, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"19","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.7647","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5714","upper_optimal_position":"0.7857","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, red blood cell production, and nervous syst function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;

const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }

function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;

}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
