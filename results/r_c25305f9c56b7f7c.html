<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Dr Simone Clarke","dob":"03/08/1972","report_date":"2026-09-14","summary":"Dr Clarke is a 54-year-old female presenting with a BMI of 24.4, following a pescatarian diet rated 7 out of 10 for quality with a volume of 6 out of 10. She trains three times per week, comprising two cardio sessions and one resistance session, with fewer than 2,000 daily steps. She takes HRT and Amitriptyline (10 to 40mg for the past four years). She reports poor sleep and insomnia, low energy and fatigue, bloating and digestive discomfort, daily headaches, symptoms of POTS (postural orthostatic tachycardia syndrome), burning muscle pains, and unrefreshing sleep. She carries a diagnosis of ME/CFS (myalgic encephalomyelitis/chronic fatigue syndrome) and reports over a year of long COVID symptoms. Her goals are to improve energy levels, improve sleep quality, and improve long-term health and longevity.\n\nThe finding that should be discussed with her GP most promptly is the combination of very strongly positive thyroid peroxidase antibodies (TPO greater than 400 U/ml against a limit of 13.8) alongside a TSH of 1.97, which is currently within range. TPO antibodies are proteins the immune system produces against the thyroid gland itself, and levels this high are strongly associated with a condition called Hashimoto's thyroiditis, the most common cause of autoimmune thyroid disease. At present, her thyroid is still maintaining output: her free T4 at 16.4 is within the ideal range, and her free T3 (the active thyroid hormone, the form cells actually use for energy) at 4.6 is adequate. However, antibody levels of this magnitude mean the immune system is actively targeting thyroid tissue, and in the majority of cases thyroid function will decline over time if it has not already begun to do so. This is particularly important because many of Dr Clarke's daily symptoms, including the fatigue, the unrefreshing sleep, the brain fog, the headaches, the muscle pains, and even some features of POTS, overlap significantly with the symptoms of evolving thyroid autoimmunity. It is entirely possible that what has been attributed to ME/CFS and long COVID is being compounded, or in part driven, by this autoimmune process. Her GP should be made aware of this result so that thyroid function can be monitored regularly, typically every six to twelve months, and treatment with levothyroxine considered if and when TSH begins to rise or symptoms are felt to be thyroid-related. The thyroglobulin antibody is negative, which means only one of the two thyroid antibody types is elevated, but TPO alone at this level is sufficient to establish the autoimmune pattern.\n\nTurning to the positives, and there are a good number of them. Her full blood count is broadly healthy. Haemoglobin at 142 is excellent for a woman and sits in the upper half of the range, meaning oxygen-carrying capacity is strong. Her red cell indices, the measures of red blood cell size and content, are all within the ideal range, with an MCV of 87.8 and MCH of 30.9 showing well-formed, well-filled red cells. Her white cell count at 6.12 is healthy, and her neutrophils and lymphocytes are both well-placed within their ranges. Platelets at 256 are comfortably within range. Her ESR (erythrocyte sedimentation rate, a broad measure of inflammation) is less than 2, which is essentially as low as it can be, and this is genuinely reassuring in the context of an autoimmune process and long COVID, because it suggests there is no widespread systemic inflammation at present. Her iron studies paint a very healthy picture. Ferritin at 120 is in the ideal range for a woman, transferrin saturation at 29.7% sits within the optimal band of 25 to 40%, and serum iron, transferrin, and total iron binding capacity are all well-placed. This means iron stores are neither depleted nor excessive, which is important because iron deficiency is one of the most common and correctable causes of fatigue and is n rectly interpretable without knowing the exact time of blood draw, does not suggest adrenal excess.\n\nHer lipid profile requires attention and should be discussed with her GP, but it needs to be understood in the context of her very significantly elevated Lp(a). Lp(a), or lipoprotein(a), is a genetically inherited form of LDL cholesterol particle that the body produces in a quantity set by DNA, not by diet, exercise, or lifestyle. Her level is 154 nmol/L, which places her in the moderately increased risk category (the normal threshold is below 32). This is a permanent finding: it will not change with any intervention, and it should be recorded in her medical notes for life. What Lp(a) does is deposit cholesterol into artery walls, promote blood clotting, and drive localised inflammation, all of which increase cardiovascular risk independently of standard cholesterol numbers. Her total cholesterol is 6.9, her LDL (the cholesterol particles that carry fat into artery walls) is 4.46 against a target below 3.0, her ApoB (apolipoprotein B, which counts the actual number of cholesterol particles capable of entering artery walls, and is considered the single best measure of cardiovascular lipid risk) is 1.17 against a target below 0.9, and her non-HDL cholesterol is 4.8 against a target below 4.0. These are all elevated. However, a meaningful portion of this is being driven by the Lp(a), which inflates LDL and ApoB measurements because Lp(a) particles each carry one ApoB molecule. On the positive side, her HDL (the protective cholesterol that removes fat from artery walls) is 2.1, which is excellent, her triglycerides at 0.9 are within the optimal range below 1.0, her VLDL is low, and her ApoA1 (the protein on HDL particles) at 1.79 is strong. Her TC/HDL ratio at 3.29 is within the desirable range. The combination of high Lp(a), elevated LDL and ApoB, but excellent HDL and triglycerides means that her GP should focus on the ApoB and the Lp(a) when considering cardiovascul re white blood cells that play a role in fighting infection and clearing damaged tissue. At this margin, this is unlikely to be clinically significant and may simply reflect normal variation. Her reticulocyte absolute count at 31.28 is below the range of 50 to 100. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count suggests the bone marrow is producing red cells at a somewhat reduced rate. Given that her haemoglobin is a strong 142, this is not causing anaemia, but it may reflect the general pattern of the body conserving energy and downregulating processes that are not immediately critical, which is consistent with the fatigue and low energy state she describes. Her MCHC at 352 is marginally above the upper limit of 345. The lab has noted that MCHC can be affected by temperature and storage, and at this margin, laboratory variation is the most likely explanation. Her MPV at 10.0 is at the top of the range but within it.\n\nThe urinalysis results were all returned as 'incorrect sample type received,' meaning the urine sample provided was not in the correct container for analysis. This means no urine results are available from this panel. If Dr Clarke would like urinalysis included, this would need to be repeated with the correct sample type. Her CA 15-3 (a breast cancer marker) is noted as 'to follow' and will be reported when the result becomes available.\n\nPutting the whole picture together, Dr Clarke's blood results reveal two important findings that may be contributing significantly to her daily symptom burden: strongly positive thyroid autoimmunity that could be silently undermining thyroid function even though her TSH and thyroid hormones are still within range, and very low free testosterone that is leaving her with almost no available androgen for energy, muscle recovery, and resilience. Layered on top of these is a significantly elevated Lp(a) that changes her cardiovascular risk calculation and makes the elevated LDL and ApoB more important to address. The encouraging news is that her liver, iron stores, blood sugar control, inflammatory markers, kidney function, and immune markers are all in good shape, and the conditions identified are all either treatable or manageable.\n\nLate-arriving results: The additional markers are consistent with and reinforce the original report. The haematocrit at 0.403, RDW at 12.9, MCV at 87.8, and MCH at 30.9 all confirm a well-nourished, well-formed red cell population, and together with the haemoglobin of 142 they make a strong and coherent picture of healthy red cell production. The MCHC at 352 remains marginally above the upper laboratory limit of 345, but with all other red cell indices entirely normal, laboratory variation is the most likely explanation and this remains a minor and non-actionable finding. The absolute reticulocyte count of 31.28, below the lower limit of 50, continues to support the interpretation offered in the main report: the bone marrow is producing red cells at a reduced rate, not sufficient to cause anaemia but consistent with the physiological conservation pattern associated with chronic illness and ME/CFS. The FT4 at 16.4 confirms that thyroid hormone output is being maintained within the ideal range despite the strongly positive TPO antibodies, reinforcing the importance of monitoring rather than immediate intervention. The thyroglobulin antibody below 1.3 confirms that autoimmune activity is TPO-driven only, as already described. The CA 15-3 result, previously noted as pending, has now returned at 18, which is comfortably within the normal range of below 30, and this is a reassuring finding. Liver markers, lipid fractions, VLDL, TIBC, and the FIB-4 score all remain as previously interpreted. The five urinalysis parameters were all returned as incorrect sample type received, confirming that no urine data are available from this panel; if Dr Clarke wishes to include urinalysis in future, this would need to be repeated with the correct sample container.","links":"Dr Clarke's results point to several specific actions, and the most impactful will involve conversations with her GP and her HRT prescriber.\n\nThe thyroid peroxidase antibodies at greater than 400 should be recorded in her medical notes and discussed with her GP. The key points to bring to that conversation are: TPO antibodies are strongly positive, TSH is currently 1.97 (within range), FT4 is 16.4, FT3 is 4.6, and thyroglobulin antibodies are negative. The request should be for regular thyroid monitoring every six to twelve months, and a discussion about whether a trial of low-dose levothyroxine might be appropriate given the severity of her fatigue symptoms, even with TSH still in range. Some clinicians will treat symptomatic patients with positive antibodies at a TSH above 2.0, particularly when the symptom burden is significant.\n\nThe Lp(a) result of 154 nmol/L should also be recorded permanently in her medical records. This is inherited, cannot be changed by diet or exercise, and independently increases cardiovascular risk. The GP should consider this alongside her elevated ApoB of 1.17 and LDL of 4.46 when calculating her overall cardiovascular risk. The question for the GP is whether statin therapy is appropriate given the combination of elevated modifiable lipids and an inherited Lp(a) risk that cannot be addressed any other way. First-degree relatives, including any children and siblings, should be offered Lp(a) testing.\n\nDr Clarke should discuss her free testosterone of 0.004 (below the range of 0.01 to 0.25) and her total testosterone of 0.5 (at the very floor of the range) with her HRT prescriber. Testosterone replacement for post-menopausal women, typically as a cream or gel applied daily, is recommended by the British Menopause Society for women with low testosterone and symptoms of low energy, reduced libido, and difficulty with muscle recovery. Her oestradiol at 88 pmol/L may also be worth reviewing: depending on the route and dose of her current HRT, the prescriber may consider whether a higher oestradiol level might better control her symptoms, particularly the headaches and unrefreshing sleep.\n\nFrom a dietary perspective, Dr Clarke's pescatarian diet rated 7 out of 10 for quality is a good foundation, but there are specific adjustments that could help her lipid profile and her energy. Increasing oily fish to three to four portions per week (salmon, mackerel, sardines, anchovies) would provide omega-3 fatty acids that help to reduce ApoB and triglycerides and support brain and cardiovascular health. Adding daily soluble fibre from oats (a bowl of porridge provides approximately 3g of beta-glucan), beans, lentils, and ground flaxseed would help to reduce LDL cholesterol by binding bile acids in the gut. Plant sterols from fortified foods or a daily supplement of 2g could add a further 7 to 10% LDL reduction. Given her weight of 61kg and height of 158cm, her estimated maintenance calories at her current activity level (light, given the low step count and three training sessions per week) would be approximately 1,650 to 1,750 calories per day. With a diet volume of 6 out of 10, she may be slightly under-eating, and given her fatigue and the low reticulocyte count suggesting the body may be conserving energy, she should aim for at least 1,600 calories consistently. Her protein target should be 80 to 100g per day (1.3 to 1.6g per kg of body weight), spread across three to four meals, to support muscle maintenance and recovery given her resistance training and her symptoms of muscle pain and fatigue. Good pescatarian protein sources include eggs, Greek yoghurt, cottage cheese, tofu, tempeh, lentils, chickpeas, and fish.\n\nHer step count of fewer than 2,000 per day is very low. While ME/CFS requires careful pacing and she should not push into post-exertional malaise, a gradual increase toward 4,000 to 5,000 daily steps, if tolerated, would support cardiovascular health, insulin sensitivity, vitamin D synthesis (if outdoors), and mood. The key is consistency rather than intensity: short, gentle walks spread throughout the day rather than one longer effort.\n\nFor sleep, given that Amitriptyline at the higher dose has not helped her headaches and she reports unrefreshing sleep, the conversation with her GP about thyroid function and testosterone may reveal treatable contributors to the sleep issue. Practical sleep measures that may help include maintaining a fixed wake time seven days a week, getting outside within an hour of waking for natural light exposure (which helps to anchor the circadian rhythm), keeping the bedroom cool (around 16 to 18 degrees), and setting a caffeine cut-off of no later than 1pm.\n\nFor her digestive symptoms, given that coeliac disease has been ruled out, she may benefit from a structured elimination approach to identify food triggers, or a trial of a low-FODMAP diet under dietitian guidance. Bloating in the context of ME/CFS and long COVID is common and may relate to autonomic dysfunction affecting gut motility.","flags":"GP-URGENT: Thyroid peroxidase antibodies greater than 400 U/ml (limit less than 13.8). Strongly positive, consistent with autoimmune thyroiditis (Hashimoto's pattern). TSH currently 1.97, FT4 16.4, FT3 4.6, thyroglobulin antibodies negative. Recommend regular thyroid monitoring and clinical discussion regarding symptomatic treatment given significant fatigue burden. Many of her ME/CFS and long COVID symptoms overlap with evolving thyroid autoimmunity.\n\nLp(a) 154.41 nmol/L (limit less than 32). Moderately elevated inherited cardiovascular risk factor. Permanent finding, should be recorded in medical notes for life. Cannot be modified by lifestyle. First-degree relatives should be offered testing. Relevant to her elevated LDL and ApoB, as Lp(a) particles inflate both measurements.\n\nApoB 1.17 g/L (target less than 0.9). Borderline high particle count. ApoB/A1 ratio 0.653 (target less than 0.6, average risk band). LDL 4.46 mmol/L (target less than 3.0). Non-HDL cholesterol 4.8 (target less than 4.0). Total cholesterol 6.9. Consider cardiovascular risk assessment incorporating Lp(a). Discuss whether statin therapy is appropriate. Positive factors: HDL 2.1, triglycerides 0.9, ApoA1 1.79.\n\nFree testosterone (calculated) 0.004 nmol/L (range 0.01 to 0.25). Total testosterone 0.5 nmol/L (at lower limit of 0.5 to 2.6). SHBG 93.2 nmol/L. Functionally negligible free testosterone. Recommend discussion with HRT prescriber regarding testosterone supplementation.\n\nInsulin 1.93 mIU/L (range 2.6 to 24.9). C-Peptide 0.256 ug/L (range 1.1 to 4.4), equivalent to approximately 85 pmol/L. Both below range. HbA1c 40 mmol/mol (normal). Most likely reflects low insulin demand in a lean individual, but given positive thyroid autoimmunity, consider checking GAD and IA-2 antibodies to exclude early pancreatic autoimmunity if clinically indicated.\n\nPTH less than 0.424 pmol/L (range 0.98 to 4.73). Suppressed, likely physiological given corrected calcium 2.45 (upper half of range) and magnesium 1.1 (top of range). Monitor if calcium rises above range or relevant symptoms develop.\n\nReticulocyte absolute count 31.28 x10^9/L (range 50 to 100). Low bone marrow red cell output despite normal haemoglobin of 142. May reflect energy conservation in the context of chronic fatigue state.\n\nMonocytes 0.16 x10^9/L (range 0.2 to 1.0). Marginally below range. Unlikely to be clinically significant at this margin.\n\nMCHC 352 g/L (range 315 to 345). Marginally above range. Lab notes MCHC can be affected by temperature and storage. Likely artefactual.\n\nALP 34 IU/L (range 46 to 116). Below range. Can be associated with low zinc, hypothyroidism, or normal variant. Note in context of positive thyroid antibodies.\n\nUric acid 166 umol/L (range 184 to 464). Below range. Likely dietary (low purine intake on pescatarian diet). Not a concern.\n\nVitamin D 66 nmol/L. Sufficient but below optimal range of 75 to 120. Supplementation recommended.\n\nCA 15-3: result pending ('to follow').\n\nUrinalysis: all results returned as 'incorrect sample type received.' No urine data available. Repeat with correct sample type if required.\n\nReassuring negatives: ESR less than 2 (no systemic inflammation). CRP 1.5 (low-grade only). Ferritin 120 (iron stores healthy). HbA1c 40 (no pre-diabetes). Liver enzymes all within range. FIB-4 1.21 (no fibrosis risk). CK 110 (no active muscle damage despite muscle pain symptoms). Coeliac screen negative. Rheumatoid factor negative. CA-125, CA 19-9, CEA all normal. Immunoglobulins normal. Thyroglobulin antibodies negative.","recommendations":"1. Arrange a GP appointment to discuss the strongly positive TPO antibodies (greater than 400) and request regular thyroid monitoring every six to twelve months. Bring the specific numbers: TPO greater than 400, TSH 1.97, FT4 16.4, FT3 4.6. Discuss whether a trial of levothyroxine is appropriate given the symptom burden.\n\n2. Request that Lp(a) at 154 nmol/L is permanently recorded in her medical notes. Discuss cardiovascular risk with the GP incorporating the Lp(a), ApoB of 1.17, and LDL of 4.46 alongside the protective HDL of 2.1. Consider whether statin therapy is appropriate.\n\n3. Offer Lp(a) testing to first-degree relatives (children, siblings, parents).\n\n4. Discuss free testosterone of 0.004 and total testosterone of 0.5 with HRT prescriber. Request consideration of testosterone replacement (typically transdermal cream or gel). Also review whether current oestradiol level of 88 is adequate for symptom control.\n\n5. Increase vitamin D supplementation to 3,000 to 4,000 IU daily to bring levels from 66 into the 75 to 120 optimal range. Always take with a fat-containing meal and combine with vitamin K2.\n\n6. Begin sublingual methylcobalamin B12 at 1,000mcg daily to bring B12 from 474 above the optimal threshold of 500.\n\n7. Increase oily fish to three to four portions per week. Add daily soluble fibre from oats, beans, lentils, and ground flaxseed. Consider 2g plant sterols daily to support LDL reduction.\n\n8. Ensure daily protein intake reaches 80 to 100g spread across three to four meals.\n\n9. Aim for a minimum of 1,600 calories daily to avoid under-fuelling.\n\n10. Gradually increase daily steps toward 4,000 to 5,000 if tolerated, using short gentle walks with careful pacing to avoid post-exertional malaise.\n\n11. Consider a low-FODMAP trial or dietitian referral for the bloating and digestive discomfort, given the negative coeliac screen.\n\n12. Retest in six months with focus on: thyroid function (TSH, FT4, FT3), lipid panel (ApoB, LDL, HDL), vitamin D, B12, full blood count (reticulocytes), insulin and C-Peptide, and free testosterone.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 to 4,000 IU daily, taken with a fat-containing meal such as breakfast or dinner. Her current level of 66 nmol/L is sufficient but below the optimal range of 75 to 120. Optimising vitamin D is particularly important given her autoimmune thyroid process, as vitamin D plays a role in immune regulation, and in the context of ME/CFS and long COVID where immune function is already under strain. At her current level, 3,000 IU should be sufficient, rising to 4,000 IU through the winter months when sun exposure is minimal.\n\nVitamin K2 (MK-7): 100 to 200mcg daily, taken alongside the vitamin D. Vitamin K2 ensures that the calcium mobilised by vitamin D is directed into bones and teeth rather than depositing in blood vessels. Given her elevated cardiovascular risk from the Lp(a) finding, this is a sensible protective measure.\n\nOmega-3 fish oil: 2 to 3g of combined EPA and DHA daily, ideally from a high-quality liquid or softgel form. Her pescatarian diet already includes fish, but a concentrated supplement providing at least 1,000mg EPA and 500mg DHA would support the reduction of ApoB particles, provide anti-inflammatory benefits relevant to her muscle pains and autoimmune process, and support cardiovascular health in the context of elevated Lp(a).\n\nVitamin B12 (sublingual methylcobalamin): 1,000mcg daily, dissolved under the tongue. Her B12 at 474 is within the laboratory range but below the optimal threshold of 500. Sublingual delivery bypasses the gut and provides more reliable absorption than oral tablets, which is important given her digestive symptoms. Adequate B12 supports energy production, nerve function, and red blood cell formation.\n\nMagnesium (glycinate): 300mg before bed. Her serum magnesium at 1.1 is at the top of the range, which is reassuring, but serum magnesium reflects only 1% of total body magnesium and can be normal even when tissue stores are low. Magnesium glycinate before bed supports sleep quality (relevant to her insomnia and unrefreshing sleep), muscle relaxation (relevant to her burning muscle pains), and may help with the headaches she experiences daily. The glycinate form is the best tolerated and least likely to cause digestive upset.\n\nThe most important actions from this report are not supplements. They are the GP conversation about the thyroid antibodies and cardiovascular risk, the HRT review to address the very low free testosterone and oestradiol level, and the dietary adjustments to support her lipid profile and ensure she is eating enough to fuel her body's needs.","biomarkers":[{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5778","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. Dr Clarke's level of 142 is excellent, sitting in the upper half of the female range. This means her blood has strong oxygen-carrying capacity, which is a genuine positive in the context of her fatigue symptoms, as it confirms anaemia is not contributing to her low energy.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, heavy menstrual loss, kidney disease","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"red_blood_count","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6667","units":"x10^12/L","description":"Red blood cells are the cells responsible for carrying oxygen throughout the body. Dr Clarke's count of 4.6 is comfortably within the ideal range, confirming healthy red cell production.","low_causes":"Anaemia, bone marrow suppression, nutritional deficiencies, chronic disease","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.403","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4767","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.38","upper_optimal":"0.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Dr Clarke's result of 0.403 is within the normal range, indicating a healthy balance between red cells and plasma volume.","low_causes":"Anaemia, overhydration, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chro
