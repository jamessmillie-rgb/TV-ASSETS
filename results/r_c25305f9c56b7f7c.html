iption":"Corrected calcium adjusts the total calcium level for albumin concentration, giving a more accurate picture of the calcium that is physiologically active. Dr Clarke's corrected calcium of 2.45 is within the ideal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, vitamin D excess, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6609","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5188","upper_optimal_position":"0.6341","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, and sleep regulation. Dr Clarke's serum magnesium of 1.1 is at the very top of the laboratory range, which is reassuring. However, serum magnesium reflects only about 1% of the body's total magnesium stores and can appear normal even when tissue levels are depleted. Given her sleep difficulties, muscle pains, and fatigue, supplementation with magnesium glycinate before bed may still be beneficial.","low_causes":"Poor dietary intake, alcohol excess, diuretics, GI losses, diabetes, proton pump inhibitors","high_causes":"Kidney disease, excessive supplementation, hypothyroidism, Addison's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"0.8500","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood, and muscle strength. Dr Clarke's level of 66 nmol/L is classified as sufficient by NHS standards (above 50) but sits below the optimal range of 75 to 120 nmol/L that is associated with the best outcomes for immune regulation, energy, and musculoskeletal health. Given her autoimmune thyroid antibodies, her ME/CFS, and her daily fatigue and muscle pains, bringing vitamin D into the optimal range is particularly worthwhile. Vitamin D plays a regulatory role in the immune system, and emerging evidence suggests it may help modulate autoimmune activity.","low_causes":"Insufficient sun exposure, dark skin, obesity, malabsorption, northern latitude, ageing","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"0.424","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0297","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3822","upper_optimal_position":"0.5960","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by the four small parathyroid glands behind the thyroid and is the primary regulator of calcium and phosphate balance. When calcium drops, PTH rises to release calcium from bones and reduce calcium loss through the kidneys. Dr Clarke's PTH is suppressed at less than 0.424, below the lower limit of 0.98. However, her corrected calcium is 2.45, which is in the upper half of the normal range, and her magnesium is 1.1, which is at the top of its range. The most likely explanation is physiological suppression: the parathyroid glands are detecting adequate calcium and magnesium and have dialled down PTH production accordingly. This is not an urgent finding, but it should be noted by the GP, and if calcium rises above range at any point, PTH and calcium should be rechecked together.","low_causes":"High calcium (suppressive feedback), magnesium excess, post-thyroid surgery, autoimmune hypoparathyroidism","high_causes":"Low calcium, vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"474","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4507","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6157","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, and DNA synthesis. Dr Clarke's B12 at 474 is within the laboratory range but below the optimal threshold of 500. On a pescatarian diet, B12 intake can be lower than on a diet containing red meat, as the richest sources are animal products. Given her fatigue, nerve-related symptoms (burning muscle pains), and cognitive complaints, bringing B12 into the optimal range above 500 is advisable. Sublingual methylcobalamin is the recommended form as it bypasses the gut for direct absorption.","low_causes":"Vegetarian/vegan diet, pernicious anaemia, malabsorption, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6190","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5714","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA synthesis, and red blood cell formation. Dr Clarke's folate at 16 is in the ideal range, reflecting good dietary intake from her pescatarian diet which would typically be rich in leafy greens, legumes, and vegetables.","low_causes":"Poor diet, malabsorption, coeliac disease, alcohol excess, pregnancy, certain medications","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of low-grade systemic inflammation produced by the liver. Values below 1.0 are considered optimal for cardiovascular risk. Dr Clarke's hs-CRP of 1.5 is within the laboratory range but above the optimal threshold. In the context of her autoimmune thyroid antibodies and long COVID symptoms, mild low-grade inflammation is not unexpected. Improving vitamin D, increasing omega-3 intake, and optimising sleep may all help to reduce this over time.","low_causes":"Good health, low inflammation","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular risk, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"8.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1355","lower_normal":"0","upper_normal":"31","lower_optimal":"0","upper_optimal":"31","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer but also in many benign conditions including endometriosis, fibroids, and pelvic inflammation. Dr Clarke's level of 8.4 is well within the normal range, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, pelvic inflammatory disease, liver disease, pregnancy, menstruation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15_3","name":"CA 15-3","group":"TUMOR MARKERS","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"30","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"U/ml","description":"CA 15-3 is a protein sometimes used as a marker in breast cancer monitoring. Dr Clarke's result is pending and will be reported when available from the laboratory.","low_causes":"","high_causes":"Breast cancer, liver disease, ovarian cancer, lung cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6660","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including both protective HDL and harmful LDL fractions. Dr Clarke's total cholesterol of 6.9 is above the desirable threshold of 5.18. However, a significant portion of this is her excellent HDL of 2.1, which is protective. The more informative markers are her LDL, ApoB, and Lp(a), which are discussed separately.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet, genetics, hypothyroidism, diabetes, obesity, kidney disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2647","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood that the body uses for energy. Elevated triglycerides are associated with increased cardiovascular risk and metabolic dysfunction. Dr Clarke's triglycerides at 0.9 are within the optimal range (below 1.0), which is an excellent finding and reflects good metabolic health and insulin sensitivity.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar/refined carbohydrate diet, alcohol excess, obesity, diabetes, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2628","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. Dr Clarke's VLDL at 0.41 is well within range, consistent with her excellent triglycerides.","low_causes":"Not clinically significant","high_causes":"High triglycerides, metabolic syndrome, diabetes, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6563","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is often called 'good cholesterol' because it removes excess cholesterol from artery walls and transports it back to the liver for disposal. Dr Clarke's HDL of 2.1 is excellent, well above both the desirable threshold of 1.55 and the optimal threshold for women of 1.6. This high HDL is a significant protective factor against cardiovascular disease.","low_causes":"Smoking, obesity, sedentary lifestyle, metabolic syndrome, poor diet, genetics","high_causes":"Regular exercise, genetics, moderate alcohol consumption, oestrogen (including HRT)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7440","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is often called 'bad cholesterol' because these particles can penetrate and deposit cholesterol within artery walls, contributing to atherosclerosis. Dr Clarke's LDL at 4.46 is above the upper limit of 3.0. However, a portion of her elevated LDL is attributable to her very high Lp(a), which is counted within the LDL measurement. Even accounting for this, her LDL remains elevated and should be addressed through a combination of dietary measures and, if her GP considers it appropriate given the Lp(a), pharmacological options.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, statins","high_causes":"Diet (saturated fat), genetics, hypothyroidism, diabetes, obesity, kidney disease, Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3656","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. A lower ratio indicates better cardiovascular risk. Dr Clarke's ratio of 3.29 is within the desirable range (below 4.5) and within the optimal range, largely because her HDL is so high. This is one of several metrics that shows her lipid profile has significant protective elements alongside the elevated LDL.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor diet, obesity, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"30.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7608","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This shows what percentage of total cholesterol is made up of protective HDL. Dr Clarke's 30.4% is well above the minimum threshold of 20%, confirming that a substantial proportion of her total cholesterol is the protective type.","low_causes":"Metabolic syndrome, obesity, smoking, sedentary lifestyle","high_causes":"Regular exercise, genetics, HRT, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl_cholesterol","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic (artery-damaging) cholesterol fractions, including LDL, VLDL, and Lp(a). Dr Clarke's non-HDL of 4.8 is above the target of less than 4.0. This is consistent with her elevated LDL and Lp(a).","low_causes":"Statins, healthy lifestyle, hyperthyroidism","high_causes":"Diet, genetics, hypothyroidism, diabetes, Lp(a), obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6393","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. A higher level indicates more functional HDL particles available to remove cholesterol from artery walls. Dr Clarke's ApoA1 at 1.79 is excellent and above the optimal threshold, consistent with her high HDL.","low_causes":"Smoking, obesity, sedentary lifestyle, genetic variants","high_causes":"Exercise, genetics, moderate alcohol, oestrogen/HRT","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6500","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, measuring ApoB effectively counts the total number of cholesterol particles capable of entering artery walls. Many experts consider ApoB the single best measure of cardiovascular lipid risk, superior to LDL alone. Dr Clarke's ApoB at 1.17 is above the desirable threshold of 0.9 and falls in the borderline high category (1.0 to 1.19). A portion of this is attributable to her elevated Lp(a) particles, each of which carries one ApoB molecule. The modifiable portion of ApoB, through diet and potentially medication, is the primary target for reducing her cardiovascular risk.","low_causes":"Statins, healthy lifestyle, hyperthyroidism, malnutrition","high_causes":"Diet (saturated fat), genetics, Lp(a), hypothyroidism, diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio is considered one of the best single summary measures of cardiovascular lipid risk. It balances the number of atherogenic particles (ApoB) against the number of protective particles (ApoA1). Dr Clarke's ratio of 0.65 falls in the average risk category (0.6 to 0.8 for women). While not in the lower risk category, this is partly because her Lp(a) inflates the ApoB side of the equation. The strong ApoA1 of 1.79 is providing meaningful protection.","low_causes":"High HDL/ApoA1, low LDL/ApoB, statins, healthy lifestyle","high_causes":"High LDL, Lp(a), low HDL, metabolic syndrome, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"154.41","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically inherited variant of LDL cholesterol. The amount produced is determined entirely by DNA, not by diet, exercise, or any other lifestyle factor. Dr Clarke's Lp(a) at 154 nmol/L is significantly above the normal threshold of 32, placing her in the moderately increased risk category. Lp(a) increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clot formation, and it drives localised inflammation within arteries. This is a permanent finding that will not change over her lifetime and should be recorded in her permanent medical records. There are currently no approved medications that specifically lower Lp(a), though trials are underway. The practical implication is that the modifiable portion of her cardiovascular risk (the standard LDL and ApoB that can be reduced through diet and medication) becomes more important to address. First-degree relatives should be offered Lp(a) testing, as each has a significant chance of carrying the same genetic variant.","low_causes":"Genetic determination (low producers)","high_causes":"Genetic determination (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"110","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from muscle cells when they are damaged. Dr Clarke's CK at 110 is within the ideal range for a woman. Despite her burning muscle pains, CK is not elevated, which is reassuring because it indicates there is no significant active muscle damage occurring. The muscle pain she experiences is more likely related to nerve sensitisation, energy metabolism issues, or the effects of low free testosterone on muscle recovery rather than structural muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin that has glucose attached to it, reflecting average blood sugar levels over the preceding two to three months. Dr Clarke's HbA1c of 5.8% is within the normal range (below 6.0%) and corresponds to 40 mmol/mol.","low_causes":"Hypoglycaemia, anaemia (shortened red cell lifespan), blood loss","high_causes":"Diabetes, pre-diabetes, insulin resistance, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, which is the standard unit used in UK clinical practice. Dr Clarke's level of 40 is below the pre-diabetes threshold of 42 but above the optimal threshold of 36. This is worth monitoring, particularly in the context of her low insulin and C-Peptide results, though at 40 there is no immediate concern.","low_causes":"Hypoglycaemia, haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Fasting Insulin","group":"GLUCOSE & INSULIN","result":"1.93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2573","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.4464","units":"mIU/L","description":"Fasting insulin measures the amount of insulin the pancreas is producing in the fasting state. Insulin is the hormone that moves glucose from the blood into cells. Dr Clarke's insulin at 1.93 is marginally below the laboratory range of 2.6 to 24.9. In a lean, metabolically healthy individual, low fasting insulin typically reflects excellent insulin sensitivity: the body simply does not need to produce much insulin to maintain normal blood sugar. However, when paired with her low C-Peptide, it does indicate genuinely low insulin production from the pancreas, which should be monitored over time, particularly given her existing autoimmune thyroid disease.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, type 1 diabetes (early), pancreatic insufficiency","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, obesity, PCOS, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.256","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1082","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5394","units":"ug/L","description":"C-Peptide is a molecule released by the pancreas in exactly equal amounts to insulin, making it a reliable measure of how much insulin the pancreas is actually producing (unlike insulin itself, which can be affected by liver metabolism). Dr Clarke's C-Peptide at 0.256 ug/L (equivalent to approximately 85 pmol/L) is significantly below the range of 1.1 to 4.4. The lab has noted that samples not separated within four hours can show reduced C-Peptide levels. However, her insulin is also below range, which provides a concordant picture. In a lean woman with an HbA1c of 40, this most likely reflects low insulin demand rather than pancreatic failure. Nevertheless, given that she already has one autoimmune process (thyroid), her GP could consider checking GAD antibodies and IA-2 antibodies to rule out early autoimmune activity against the insulin-producing beta cells, particularly if HbA1c trends upward on future testing.","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting state, type 1 diabetes (early), sample handling","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 form by tissues throughout the body. Dr Clarke's FT4 at 16.4 is within the ideal range, indicating that despite the very high thyroid antibody levels, her thyroid is currently maintaining adequate hormone output.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, pituitary disease, iodine deficiency, medications","high_causes":"Hyperthyroidism (Graves' disease, toxic nodule), excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4453","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5119","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. When thyroid function drops, TSH rises to push the thyroid harder. Dr Clarke's TSH at 1.97 is within the ideal range, which might seem reassuring in isolation. However, the presence of very strongly positive TPO antibodies (greater than 400) means the thyroid is under autoimmune attack even though TSH has not yet risen above range. TSH can remain normal for years while the autoimmune process gradually damages thyroid tissue, and it is important to monitor this regularly.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease, early pregnancy","high_causes":"Hypothyroidism (primary), Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use for energy metabolism, heat production, and countless other functions. It is produced by converting T4 in tissues throughout the body. Dr Clarke's FT3 at 4.6 is just within the optimal range (4.5 to 6.5), sitting at the lower end. This means she has enough active thyroid hormone for now, but if the autoimmune process progresses, T3 may be one of the first values to show a meaningful decline.","low_causes":"Hypothyroidism, chronic illness (sick euthyroid syndrome), low calorie intake, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"400","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9500","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. TPO is an enzyme the thyroid needs to produce hormones, and antibodies against it interfere with this process. Dr Clarke's TPO antibodies are greater than 400 U/ml against a threshold of 13.8, which is very strongly positive and is associated with a condition called Hashimoto's thyroiditis, the most common form of autoimmune thyroid disease. This is a significant finding because it means the immune system is actively targeting thyroid tissue. While her thyroid function is currently maintained (TSH 1.97, FT4 16.4, FT3 4.6), the majority of people with antibodies at this level will develop clinical hypothyroidism over time if they have not already. Many of Dr Clarke's symptoms, including fatigue, unrefreshing sleep, headaches, brain fog, muscle pains, and even some features of POTS, are recognised features of autoimmune thyroid disease. This should be discussed with her GP as a priority.","low_causes":"Normal immune function","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease, occasionally other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce hormones. Dr Clarke's level of less than 1.3 is well within the normal range and below the autoimmune threshold of 4.4. This means only one of the two thyroid antibody types (TPO) is positive, but TPO antibodies alone at her level are sufficient to establish the autoimmune pattern.","low_causes":"Normal immune function","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"7.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1024","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a protein that can be elevated in pancreatic, biliary, and gastrointestinal cancers, though it can also rise with benign conditions such as gallstones and pancreatitis. Dr Clarke's level of 7.57 is well within the normal range.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, gallstones, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3609","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a protein that can be elevated in colorectal, lung, breast, and other cancers, though smoking and some benign conditions can also raise it. Dr Clarke's level of 1.66 is within the normal range for a non-smoker (below 2.3).","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"9.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4509","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against previously encountered infections. Dr Clarke's IgG at 9.2 is within the laboratory range, confirming healthy adaptive immune function.","low_causes":"Immune deficiency, medications (immunosuppressants), chronic kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4200","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM is the first antibody the body produces in response to a new infection. Dr Clarke's IgM at 1.1 is within the laboratory range.","low_causes":"Immune deficiency, certain medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5108","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, lungs, and urinary tract. Dr Clarke's IgA at 2.1 is within the laboratory range. Adequate IgA is also important for the validity of the coeliac screen, as the test relies on IgA antibodies.","low_causes":"Selective IgA deficiency (common), immune deficiency","high_causes":"Liver disease, coeliac disease, chronic infection, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"2.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0112","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"IgE is the antibody involved in allergic responses and parasitic infections. Dr Clarke's IgE at 2.23 is very low, indicating no significant allergic or parasitic activity. This is consistent with her low eosinophil count.","low_causes":"Normal variant, immune deficiency","high_causes":"Allergies, atopic conditions (eczema, asthma, hay fever), parasitic infections","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor (RF) is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Dr Clarke's RF at 5 is well within the normal range (below 14), which is reassuring given her joint stiffness and muscle pain symptoms, as it makes rheumatoid arthritis less likely.","low_causes":"Normal health","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, lupus, chronic infections, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"Negative","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0","upper_normal":"7.19","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune condition in which gluten damages the lining of the small intestine. Dr Clarke's result is negative at 0.514, well below the threshold of 7.19. This effectively rules out coeliac disease as a cause of her bloating and digestive discomfort, provided she has been eating a gluten-containing diet (the test is only valid if gluten is being consumed regularly).","low_causes":"Normal (no coeliac disease)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"total_antioxidant_activity","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6452","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4762","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, the damaging molecules produced by metabolism, inflammation, and environmental exposures. Dr Clarke's level of 1.74 is within the ideal range, suggesting her diet (rated 7 out of 10 for quality) is providing good antioxidant support from fruits, vegetables, and fish.","low_causes":"Poor diet, oxidative stress, chronic illness, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"172","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3631","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4040","upper_optimal_position":"0.5714","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and falling throughout the day. Dr Clarke's cortisol at 172 is within the morning reference range but at the lower end. Interpretation depends on the time of day the blood was drawn. If drawn in the early morning, a lower cortisol could be relevant to her fatigue pattern, but without knowing the exact time of collection, this result should be interpreted with caution. It does not suggest adrenal excess.","low_causes":"Adrenal insufficiency, pituitary disease, late-day sampling, chronic fatigue states","high_causes":"Stress, Cushing's syndrome, corticosteroid medication, acute illness, early morning sampling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"88","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3728","lower_normal":"0","upper_normal":"118.2","lower_optimal":"80","upper_optimal":"118.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.3383","upper_optimal_position":"0.5","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen and is crucial for bone health, cardiovascular protection, brain function, mood, skin health, and sleep quality. In post-menopausal women on HRT, oestradiol levels reflect whether the replacement dose is adequate. Dr Clarke's oestradiol at 88 is within the post-menopausal reference range and above the minimum, but sits at the lower end of what many HRT prescribers would consider a therapeutic target. Given her ongoing symptoms of unrefreshing sleep, daily headaches, fatigue, and cognitive difficulties, it may be worth discussing with her HRT prescriber whether a higher oestradiol level might better control her symptoms.","low_causes":"Menopause, insufficient HRT dose, low body fat, hypothalamic amenorrhoea","high_causes":"HRT, ovarian function (pre-menopausal), PCOS, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"16.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4528","lower_normal":"0","upper_normal":"81.28","lower_optimal":"10.62","upper_optimal":"81.28","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0653","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is a hormone involved in the menstrual cycle, pregnancy, and mood regulation. Dr Clarke's progesterone at 16.45 is above the post-menopausal range of 0 to 2.32, which most likely reflects the progesterone component of her HRT regimen. This is an expected finding if she is using combined HRT or body-identical progesterone.","low_causes":"Menopause, anovulation, luteal phase defect","high_causes":"HRT (progesterone component), pregnancy, ovulation (luteal phase), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"39.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4657","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"LH (luteinising hormone) is produced by the pituitary gland and helps regulate the reproductive system. In post-menopausal women, LH rises because the ovaries are no longer producing significant oestrogen to provide feedback. Dr Clarke's LH at 39.64 is within the post-menopausal range, confirming her menopausal status.","low_causes":"Pituitary disease, HRT (may partially suppress), pregnancy","high_causes":"Menopause, primary ovarian insufficiency, PCOS (relative to FSH)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"94.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5871","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and stimulates the ovaries to produce eggs and oestrogen. In menopause, FSH rises significantly because the ovaries are no longer responding. Dr Clarke's FSH at 94.15 is clearly in the post-menopausal range. The fact that FSH remains this elevated despite HRT suggests her current HRT dose is not fully suppressing the pituitary's drive, which is consistent with her oestradiol sitting at the lower end of the therapeutic range.","low_causes":"Pituitary disease, pregnancy, HRT (may suppress), anorexia","high_causes":"Menopause, primary ovarian insufficiency, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4127","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands, and plays an important role in energy, libido, muscle maintenance, bone health, and cognitive function. Dr Clarke's total testosterone at 0.5 is at the very bottom of the female range. Combined with her very low free testosterone (see below), this means she has almost no available testosterone for tissue use, which is likely contributing to her fatigue, difficulty with exercise recovery, and muscle pains.","low_causes":"Menopause, ovarian insufficiency, adrenal insufficiency, oral HRT/contraceptives (increase SHBG), ageing","high_causes":"PCOS, congenital adrenal hyperplasia, testosterone supplementation, ovarian or adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_androgen_index","name":"Free Androgen Index","group":"HORMONES","result":"0.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"4.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"","description":"The free androgen index (FAI) is calculated from testosterone and SHBG to estimate the amount of biologically active testosterone. Dr Clarke's FAI at 0.54 is at the very bottom of the range, confirming that almost all of her already low testosterone is being bound up by SHBG and made unavailable to tissues.","low_causes":"Menopause, high SHBG, oral oestrogen use, low testosterone production","high_causes":"PCOS, low SHBG, insulin resistance, androgen excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea_s","name":"DHEA Sulphate","group":"HORMONES","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3942","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4026","upper_optimal_position":"0.5420","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is produced by the adrenal glands and serves as a precursor to both testosterone and oestrogen. It declines naturally with age. Dr Clarke's DHEA-S at 2.1 umol/L (equivalent to approximately 774 ug/dL) is within the laboratory range but in the lower portion, consistent with her age and her low testosterone levels. The adrenal glands are producing less of the raw material needed to make testosterone.","low_causes":"Ageing, adrenal insufficiency, chronic illness, corticosteroid use","high_causes":"PCOS, congenital adrenal hyperplasia, adrenal tumours, supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"128","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5560","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, primarily known for its role in breast milk production, but it also influences mood, immune function, and reproductive health. Dr Clarke's prolactin at 128 is within the normal range for a non-pregnant woman.","low_causes":"Dopamine agonist medications, pituitary damage","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, antidepressants including amitriptyline), stress, hypothyroidism, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"93.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5527","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3669","upper_optimal_position":"0.5712","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds to sex hormones, particularly testosterone, and makes them unavailable for tissue use. Dr Clarke's SHBG at 93.2 is in the upper half of the range. A higher SHBG means more testosterone is being bound and inactivated, which is a key reason her free testosterone is so low despite total testosterone being at the lower limit. SHBG can be elevated by oestrogen (including HRT), thyroid dysfunction, and low calorie intake.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism, anabolic steroids","high_causes":"Oestrogen/HRT, hyperthyroidism, liver disease, ageing, low calorie intake, anticonvulsants","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.004","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1667","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to proteins in the blood and therefore available for tissues to use. It is the best measure of testosterone's actual biological effect. Dr Clarke's free testosterone at 0.004 is significantly below the lower limit of 0.01, meaning she has functionally negligible free testosterone. This is driven by the combination of very low total testosterone (0.5, at the floor of the range) and relatively high SHBG (93.2), which binds and inactivates what little testosterone is present. Low free testosterone in post-menopausal women is associated with reduced energy, low libido, difficulty building and maintaining muscle, poor exercise recovery, cognitive difficulties, and low mood. This is a finding that should be discussed with her HRT prescriber, as testosterone replacement for post-menopausal women (typically a small dose of testosterone cream or gel) is increasingly recognised as beneficial.","low_causes":"Menopause, high SHBG, oral oestrogen (increases SHBG), adrenal insufficiency, low testosterone production","high_causes":"PCOS, low SHBG, testosterone supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"INFLAMMATION","result":"1.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4433","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is a calculated marker that reflects the balance between the innate immune response (neutrophils) and the adaptive immune response (lymphocytes). A ratio within 1 to 2 is optimal and suggests no significant inflammatory or immune stress. Dr Clarke's NLR of 1.53 is within the optimal range.","low_causes":"Not clinically significant at this level","high_causes":"Infection, inflammation, physiological stress, chronic disease, some cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1433","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a useful proxy for insulin resistance and metabolic health. A lower ratio indicates better insulin sensitivity and less atherogenic lipid particles. Dr Clarke's ratio of 0.43 is well within the optimal range (below 0.87), confirming excellent metabolic health and insulin sensitivity from a lipid perspective.","low_causes":"Excellent metabolic health, high HDL, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome, high sugar diet, obesity, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_posit riation in size among red blood cells. A low RDW means red cells are uniform in size, which is a sign that iron, B12, and folate are all being delivered consistently enough to produce regular, well-formed cells. At 12.9, Dr Clarke's RDW is within the ideal range and complements her healthy MCV and MCH, together confirming a well-nourished red cell population. This is a quiet but meaningful positive given her pescatarian diet.","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, haemolytic anaemia","low_causes":"Not clinically significant when low; normal red cell size uniformity","result_position":"54","lower_normal_position":"0","upper_normal_position":"100","lower_optimal_position":"0","upper_optimal_position":"58"},{"name":"Mean Corpuscular Volume (MCV)","group":"HEMATOLOGY","result":"87.8","units":"fl","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","within_normal":"TRUE","within_optimal":"TRUE","description":"MCV measures the average size of a red blood cell. The ideal size indicates that red cells are neither too small (as happens with iron deficiency) nor too large (as happens with B12 or folate deficiency). At 87.8, Dr Clarke's red cells are exactly the right size, which is reassuring given her pescatarian diet and the marginal B12 level noted elsewhere in this report.","high_causes":"B12 or folate deficiency, alcohol excess, hypothyroidism, liver disease","low_causes":"Iron deficiency anaemia, thalassaemia, chronic disease","result_position":"27","lower_normal_position":"0","upper_normal_position":"100","lower_optimal_position":"11","upper_optimal_position":"67"},{"name":"Mean Corpuscular Haemoglobin (MCH)","group":"HEMATOLOGY","result":"30.9","units":"pg","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","within_normal":"TRUE","within_optimal":"TRUE","description":"MCH measures the average amount of haemoglobin packed into each red blood cell. At 30.9, it is in the ideal range, meaning each red cell is well-filled with the protein that carries oxygen. Together with a healthy MCV and strong haemoglobin, this confirms that red cell quality is not a limiting factor in Dr Clarke's fatigue.","high_causes":"B12 or folate deficiency, liver disease, hypothyroidism","low_causes":"Iron deficiency, thalassaemia","result_position":"78","lower_normal_position":"0","upper_normal_position":"100","lower_optimal_position":"20","upper_optimal_position":"100"},{"name":"Mean Corpuscular Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"352","units":"g/L","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","within_normal":"FALSE","within_optimal":"FALSE","description":"MCHC measures the concentration of haemoglobin within the red cell fluid, expressed as grams per litre of red cells. At 352, Dr Clarke's result is marginally above the upper laboratory limit of 345. The laboratory notes that MCHC can be affected by sample temperature and storage conditions, and at this small a margin above range, laboratory variation is the most likely explanation. Her other red cell indices, including MCV, MCH, haemoglobin, and haematocrit, are all entirely normal, which would not be the case in a genuine MCHC abnormality such as hereditary spherocytosis. This result is not a concern in isolation but is worth noting.","high_causes":"Hereditary spherocytosis, cold agglutinins, laboratory sample handling variation","low_causes":"Iron deficiency, thalassaemia, overhydration","result_position":"100","lower_normal_position":"0","upper_normal_position":"81","lower_optimal_position":"14","upper_optimal_position":"81"},{"name":"Mean Platelet Volume (MPV)","group":"HEMATOLOGY","result":"10","units":"fL","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","within_normal":"TRUE","within_optimal":"FALSE","description":"MPV measures the average size of platelets, the small cell fragments involved in blood clotting. Larger platelets tend to be younger and more metabolically active. At 10.0, Dr Clarke's MPV is within the laboratory range but at the very top of it, and just above the optimal ceiling of 9.5. This is not a finding that requires action but is noted for completeness. It is consistent with normal platelet turnover and does not suggest any platelet disorder.","high_causes":"Increased platelet turnover, inflammatory states, thyroid disease, essential thrombocythaemia","low_causes":"Bone marrow suppression, aplastic anaemia, chemotherapy","result_position":"97","lower_normal_position":"0","upper_normal_position":"100","lower_optimal_position":"13","upper_optimal_position":"80"},{"name":"White Cell Count","group":"HEMATOLOGY","result":"6.12","units":"x10^9/L","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","within_normal":"TRUE","within_optimal":"TRUE","description":"The white cell count is the total number of white blood cells circulating in the blood, representing the front line of the immune system. At 6.12, Dr Clarke's count sits comfortably in the middle of the healthy range. Given her ME/CFS diagnosis, long COVID history, and active thyroid autoimmunity, a healthy total white cell count is genuinely reassuring and suggests the immune system is not in a state of suppression or exhaustion at the overall level.","high_causes":"Infection, inflammation, steroid use, leukaemia, physiological stress","low_causes":"Viral illness, autoimmune conditions, bone marrow suppression, certain medications","result_position":"35","lower_normal_position":"0","upper_normal_position":"100","lower_optimal_position":"17","upper_optimal_position":"67"},{"name":"Cystatin C eGFR (Calculated)","group":"KIDNEY FUNCTION","result":"84","units":"ml/min/1.73m²","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","within_normal":"TRUE","within_optimal":"FALSE","description":"eGFR, or estimated glomerular filtration rate, measures how efficiently the kidneys are filtering waste from the blood, expressed as the volume filtered per minute per standard body surface area. A value above 90 is considered optimal; between 60 and 90 falls within the accepted laboratory range but below the ideal threshold. Dr Clarke's Cystatin C-based eGFR of 84 uses Cystatin C, a protein produced at a steady rate by all cells and filtered exclusively by the kidneys, making it a more reliable kidney marker than creatinine alone, particularly in individuals who do not do heavy resistance training. At 54, a result of 84 is within the expected range for age and is not a cause for alarm, but it is worth monitoring over time, particularly given her autoimmune background.","high_causes":"Not applicable for eGFR (higher is better)","low_causes":"Chronic kidney disease, diabetes, hypertension, autoimmune renal involvement, age-related decline, dehydration"},{"name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"19","units":"IU/l","lower_normal":"","upper_normal":"56","lower_optimal":"","upper_optimal":"25","within_normal":"TRUE","within_optimal":"TRUE","description":"ALT is an enzyme produced by liver cells that leaks into the bloodstream when those cells are damaged or under strain. It is the most sensitive routine marker of liver health. At 19, Dr Clarke's ALT is well within both the laboratory range and the tighter optimal threshold of below 25 for women, meaning the liver is handling its workload without any visible strain. This is reassuring given her HRT use and Amitriptyline, both of which are processed by the liver.","high_causes":"Fatty liver disease, alcohol excess, viral hepatitis, medication effect, muscle damage","low_causes":"Not clinically significant when low"},{"name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"25","units":"IU/l","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","within_normal":"TRUE","within_optimal":"TRUE","description":"AST is another liver enzyme that also appears in muscle, heart, and kidney cells. Together with ALT, it gives a fuller picture of both liver and muscle health. At 25, Dr Clarke's AST is mid-range and within the ideal band. Given her burning muscle pains, it is also relevant that a markedly elevated AST would point toward active muscle damage, and this result does not suggest that.","high_causes":"Liver disease, heart attack, muscle damage, alcohol excess, strenuous exercise","low_causes":"Not clinically significant when low; can occasionally reflect B6 deficiency","result_position":"38","lower_normal_position":"0","upper_normal_position":"100","lower_optimal_position":"6","upper_optimal_position":"69"},{"name":"VLDL (Calculated)","group":"LIPIDS & CARDIOVASCULAR","result":"0.41","units":"mmol/l","lower_normal":"","upper_normal":"0.78","lower_optimal":"","upper_optimal":"0.5","within_normal":"TRUE","within_optimal":"TRUE","description":"VLDL, or very low-density lipoprotein, is a particle produced by the liver that carries triglycerides into the bloodstream. It is closely related to triglyceride levels and is a contributor to arterial plaque when elevated. At 0.41, Dr Clarke's VLDL is within both the laboratory range and the tighter optimal ceiling of 0.5, consistent with her excellent triglyceride result. This confirms the liver is not overproducing fat-carrying particles, which is the component of the lipid profile most responsive to diet and lifestyle.","high_causes":"Hypertriglyceridaemia, insulin resistance, metabolic syndrome, alcohol excess, fatty liver","low_causes":"Low fat intake, malnutrition; low levels are generally favourable"},{"name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"65.3","units":"umol/l","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","within_normal":"TRUE","within_optimal":"TRUE","description":"TIBC measures the blood's total capacity to bind   let markers = [];

  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){

  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

function tip(e,sysId){

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
