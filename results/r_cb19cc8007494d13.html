<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Paul Greig","dob":"02/04/1974","report_date":"2026-09-22","summary":"Paul is a 52-year-old male presenting with a BMI of 48.5, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He trains twice per week with cardio only and no resistance training, averaging 5,000 to 7,500 daily steps. He takes an ARB (losartan) for hypertension. He smokes tobacco and uses cannabis. He reports low energy and fatigue, brain fog, and poor exercise recovery. His goals are to improve long-term health and longevity, boost his immune system, and improve cardiovascular fitness.\n\nBefore covering the positives, and there are several, there are two findings that need to go to Paul's GP promptly. The first is his kidney function. Cystatin C is a protein filtered by the kidneys that gives a more accurate picture of kidney health than creatinine, particularly in someone carrying significant extra weight, because creatinine is influenced by muscle mass while cystatin C is not. Paul's cystatin C is 1.33, above the upper limit of 1.1, and the estimated glomerular filtration rate (eGFR) calculated from it is 66, which falls into the category called Stage 2 chronic kidney disease. The creatinine-based eGFR of 74 tells a similar story. At 52, eGFR should comfortably sit above 90. A single reading does not confirm chronic kidney disease because kidney function can dip temporarily with dehydration, certain medications, illness, or even intense exercise, but it does need to be repeated in three months so the GP can establish whether this is a stable baseline or a declining trend. Losartan itself is actually protective of the kidneys and is often used specifically for that purpose, so the medication is not the cause. Hypertension, however, is one of the two leading causes of gradual kidney decline, and at a BMI of 48.5 the kidneys are also working under a significantly higher metabolic load. His potassium is 3.4, marginally below the lower limit of 3.5. This may be a sample artefact from delayed processing, but it is worth noting alongside the kidney findings and the ARB use because potassium balance is managed by the kidneys. The GP should check this on a fresh sample.\n\nThe second finding for the GP is the inflammation marker. High-sensitivity C-reactive protein, or hs-CRP, measures low-grade systemic inflammation. The ideal level is below 1.0 and the laboratory upper limit is 5.0. Paul's is 8.9. At this level, it is unlikely to reflect a single acute infection (though that cannot be ruled out) and more likely reflects chronic, low-grade inflammation. At a BMI of 48.5, visceral fat is the most probable driver. Fat tissue, particularly around the organs, is metabolically active and continuously releases inflammatory signalling molecules called cytokines. Smoking adds a second persistent inflammatory stimulus. Together, these two factors are the most plausible explanation for a CRP nearly nine times the ideal threshold. This matters because sustained inflammation at this level accelerates arterial damage, insulin resistance, and kidney decline, connecting directly to the kidney findings above and the metabolic findings below. The GP should repeat this alongside the kidney retest to confirm it is not a transient spike from illness.\n\nNow the positives, and there are genuinely encouraging findings here. Paul's thyroid is working well. Thyroid stimulating hormone (TSH), the signal the brain sends to the thyroid gland, sits at 1.8, right in the optimal zone between 1.0 and 2.5. Free T4, the main circulating thyroid hormone, is 19.8, near the top of the ideal band, and free T3, the active form that cells actually use, is 5.0, comfortably within range. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. This is relevant because an underactive thyroid is a common and treatable cause of fatigue and brain fog, and in Paul's case it has been clearly excluded. His liver is in good health despite the metabolic load it is under. ALT, the enzyme most specific to liver cell damage, is 29, within the optimal range for a male. GGT, which rises with alcohol use, medication strain, or fatty infiltration, is 26, only marginally above the tighter optimal threshold of 25 and well within the laboratory range. AST is 31, healthy. The APRI score, which estimates liver scarring, is 0.389, well within the ideal zone. The De Ritis ratio at 1.07 is optimal. The NAFLD Fibrosis Score at 0.311 sits within the laboratory range though above the tighter optimal threshold, but at 52 with a BMI of 48.5, this score is being nudged upward by the age and BMI terms in the calculation rather than by any sign of actual scarring, since every direct liver marker is clean. The FIB-4 score at 1.5 is marginally above the 1.45 threshold, but again this is driven by the arithmetic: his ALT is relatively low (which paradoxically inflates the score by shrinking the denominator) and at 52 the age term adds weight. With every liver enzyme clean, this does not indicate fibrosis.\n\nPaul's prostate health is excellent. PSA at 0.64 is very low for his age, and the free PSA ratio at 0.547 is strongly reassuring. Both tumour markers, CA19-9 at 5.31 and CEA at 1.82, are well within their respective limits. His immune system architecture is sound: IgG, IgM, and IgA are all within range, meaning the three arms of antibody-mediated immunity are intact. His blood sugar control, while not perfect and discussed below, has a genuine positive in it: fasting glucose at 5.0 is within the ideal range, and HbA1c at 38 mmol/mol, which reflects average blood sugar over the preceding two to three months, is comfortably below the pre-diabetes threshold of 42. His iron studies are balanced, with ferritin at 139, transferrin saturation at 33.4%, and serum iron at 20.3, all sitting within both laboratory and optimal ranges. His full blood count is largely healthy: white cell count, platelets, reticulocytes, and the differential white cell subtypes are all within range. His calcium, corrected calcium, magnesium, and phosphate are all within range. Vitamin D at 95 is in the optimal zone between 75 and 120, which at a BMI of 48.5 is genuinely impressive because fat tissue sequesters vitamin D, making it much harder to maintain adequate levels. Paul is clearly either supplementing or getting meaningful sun exposure.\n\nTurning to the metabolic picture, Paul's insulin and blood sugar markers tell a story that is developing but has not yet crossed into disease. His fasting insulin is 8.24, within the laboratory range of 2.6 to 24.9 but above the tighter optimal ceiling of 8. HOMA-IR, which combines fasting insulin and glucose to estimate how resistant the body's cells are to insulin's signal, is 1.83, above the ideal threshold of 1.5 and approaching the 1.9 level where early insulin resistance is formally recognised. C-peptide, a molecule released in equal amounts to insulin and therefore a reliable measure of how hard the pancreas is working, is 2.53 (838 pmol/L), within range but sitting in the upper half. What this pattern says is that the pancreas is producing more insulin than it ideally should to keep blood sugar at 5.0, and the cells are beginning to resist that signal. At a BMI of 48.5, the mechanism is clear: excess visceral fat impairs insulin signalling, forcing the pancreas to compensate by producing more. The good news is that glucose and HbA1c are still well controlled, meaning the compensation is working. The intervention window is now, before that compensation fails and blood sugar begins to rise.\n\nPaul's lipid profile shows a pattern driven predominantly by triglycerides. Triglycerides are the fats circulating in the blood after meals, and his level of 2.78 is well above the desirable fasting threshold of 1.70. This is the central finding in the lipid panel because elevated triglycerides drive most of the other abnormalities here. VLDL, the lipoprotein particle that carries triglycerides, is 1.26 against an upper limit of 0.78, directly reflecting the triglyceride excess. HDL cholesterol, which removes cholesterol from artery walls and is protective, is 1.1. While this sits above the high-risk threshold of 1.04, it is below the desirable level of 1.55 and well below the optimal target of 1.4 for a male. High triglycerides actively suppress HDL production, so these two findings are two sides of the same coin. The Atherogenic Index of Plasma, which combines triglycerides and HDL into a single measure of the type of LDL particles circulating, is 0.403, above the upper limit of 0.21, indicating a predominance of small, dense LDL particles that penetrate artery walls more easily. Paul's total cholesterol at 4.6 and LDL at 2.43 are both within range, and his ApoB, which counts the number of atherogenic particles in the blood and is the single best predictor of cardiovascular risk, is 0.85, within the desirable threshold of 0.9 but above the tighter optimal target of 0.8. The ApoB to ApoA1 ratio at 0.60 is below the lower risk threshold of 0.7, which is reassuring. Lipoprotein(a), or Lp(a), is below 25, which is genuinely useful information. Lp(a) is entirely inherited, cannot be changed by diet or exercise, and when elevated it independently drives cardiovascular risk. Paul's low result means that his lipid picture is entirely modifiable through lifestyle. The Lp(a)-corrected LDL of 2.35 confirms that effectively all of his LDL is the conventional, lifestyle-driven type. The Cardiovascular Risk Score, a TrueVitals composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c, is 75 out of 100, where below 20 is ideal and below 40 is acceptable. The dominant drivers are the hs-CRP at 8.9 and the triglycerides at 2.78 with suppressed HDL. This score does not predict a ten-year event probability, but it quantifies the risk being accumulated, and at 52 it warrants action.\n\nPaul's testosterone is 14.4, within the laboratory range of 8.4 to 28.7 but below the optimal threshold of 18 for a male. Free testosterone, the fraction not bound to proteins and therefore available for the body to use, is 0.271, within range. Bioavailable testosterone at 6.64 is also within range. SHBG at 36.4 is healthy. The testosterone level is relevant to Paul's symptoms because testosterone influences energy, cognitive sharpness, recovery from exercise, and motivation. At a BMI of 48.5, the aromatase enzyme in fat tissue converts a proportion of testosterone to oestradiol, which is one reason oestradiol sits at 105, within range but in the upper half. This conversion effectively lowers circulating testosterone. Weight loss is the most powerful intervention for raising testosterone naturally in this context.\n\nPaul's IgE is 368 against an upper limit of 100, more than three and a half times the threshold. IgE is the antibody class associated with allergic responses, and this degree of elevation suggests an active allergic sensitisation. Common causes include environmental allergens such as house dust mite, animal dander, pollen, or mould, as well as certain food sensitivities. Smoking itself can also elevate IgE. This does not necessarily mean Paul has symptomatic allergies, but the level is high enough to warrant a conversation with the GP about whether specific allergy testing (a RAST panel or skin prick testing) would be useful, particularly if he experiences any nasal congestion, skin irritation, or respiratory symptoms that might also be contributing to his fatigue.\n\nPaul's haemoglobin is 172, marginally above the upper limit of 170 for a male. His haematocrit (the proportion of blood that is red cells) is 0.492, just within the upper limit of 0.50. MCH at 33.6 and MCHC at 350 are both marginally above their respective upper limits. These red cell indices describe the average size and haemoglobin concentration of each red cell. Marginal elevations are common with smoking because carbon monoxide from cigarettes binds haemoglobin and reduces oxygen delivery, prompting the bone marrow to compensate by packing more haemoglobin into each cell and producing slightly more red cells overall. This is the most likely explanation. It is not dangerous at these margins, but it adds another reason to discuss smoking cessation.\n\nPaul's bicarbonate is 33.6, above the upper limit of 31. Bicarbonate is the main buffer the body uses to maintain blood pH. Mild elevation can be caused by several factors, including compensatory metabolic alkalosis from the ARB medication, chronic respiratory acidosis from smoking (the body retains bicarbonate to offset the carbon dioxide retained by impaired lungs), or simply delayed sample processing. The most clinically plausible explanation here is a combination of the losartan and the smoking. The GP should note it alongside the kidney and potassium findings.\n\nPaul's B12 at 325 is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, energy metabolism, and red blood cell production, and suboptimal levels can contribute to fatigue and brain fog, both of which Paul reports. Folate at 11 is in good shape. His total antioxidant activity (TAA) at 2.23 is above the laboratory range of 1.3 to 1.77, which is not a concern and may reflect dietary antioxidant intake or supplementation.\n\nHis FT3 to FT4 ratio at 0.253 is marginally below the optimal band of 0.27 to 0.40 but within the laboratory range. This suggests conversion from T4 to the active T3 form could be slightly more efficient, though the absolute T3 level of 5.0 is healthy so this is a minor observation.\n\nPaul's PhenoAge, a composite biological ageing marker estimated from his blood results, will be computed by the pipeline and included separately. Given the CRP of 8.9 and the metabolic findings, it is likely to read older than his chronological age of 52, which reinforces the importance of the lifestyle changes outlined below.\n\nThe uric acid at 394 is within the laboratory range but above the optimal ceiling of 380 for a male. Uric acid is produced from purine metabolism and cleared by the kidneys. At this level, it is mildly elevated and connects to the metabolic picture: insulin resistance impairs uric acid excretion, and elevated triglycerides are associated with higher uric acid. Weight loss and reduced fructose and alcohol intake lower it. The creatine kinase (CK) at 124 is healthy, confirming no significant muscle damage. His cortisol at 302 is within the expected morning range, and his reproductive hormones (LH, FSH, prolactin, progesterone, DHEA-S) are all within normal limits. Rheumatoid factor, bacterial count, and urine culture are pending and will be reviewed when available. The coeliac screen (tissue transglutaminase IgA) is negative, ruling out coeliac disease as a cause of his symptoms. The urinalysis is clean, with no protein, glucose, blood, white cells, or nitrites detected.\n\nReturning to Paul's symptoms of fatigue, brain fog, and poor exercise recovery: the bloods offer several plausible contributors. The developing insulin resistance means energy delivery to cells is becoming less efficient. The CRP of 8.9 reflects a level of systemic inflammation that is itself associated with fatigue and cognitive dulling. The suboptimal B12 may be contributing. Testosterone below optimal reduces energy and recovery capacity. Smoking impairs oxygen delivery and cardiovascular efficiency, directly hampering exercise recovery. However, at a BMI of 48.5 with only two cardio sessions per week and no resistance training, the single largest contributor to all three symptoms is likely the metabolic burden of excess weight combined with deconditioning. The body is working significantly harder at rest and during activity than it would at a healthy weight, and without resistance training to maintain muscle mass and insulin sensitivity, recovery from even moderate exertion will be prolonged. Sleep quality is also worth investigating: at this BMI, obstructive sleep apnoea is common and is a potent cause of fatigue, brain fog, and poor recovery that blood tests cannot detect. If Paul snores, wakes unrefreshed, or has been told he stops breathing during sleep, a sleep study would be the single most valuable next investigation.","links":"The threads running through Paul's results converge on three interconnected systems: metabolic load, inflammation, and kidney function, with smoking adding a fourth layer that touches all of them.\n\nThe metabolic thread is the most important. At a BMI of 48.5, visceral fat is driving insulin resistance (HOMA-IR 1.83, approaching the 1.9 threshold for formal early resistance), suppressing HDL (1.1), elevating triglycerides (2.78), inflating VLDL (1.26), and lowering testosterone through aromatase-mediated conversion to oestradiol. These are not five separate problems; they are five expressions of one underlying state. The insulin resistance impairs uric acid clearance (394, above optimal), and the triglyceride excess produces a predominance of small dense LDL particles reflected in the Atherogenic Index of 0.403. The Cardiovascular Risk Score of 75 is being driven almost entirely by the CRP and the triglyceride-HDL axis rather than by LDL or ApoB, which are both within or near their targets.\n\nThe inflammation thread is tightly linked to the metabolic one. CRP at 8.9 is the highest single abnormality in the report by proportion above its ideal target. Visceral fat and smoking are the two most likely sustained sources. This level of inflammation accelerates every other process: it worsens insulin resistance, promotes arterial plaque instability, impairs kidney function over time, and directly contributes to fatigue and brain fog. Reducing CRP is not a separate goal from losing weight and stopping smoking; it is the same goal measured differently.\n\nThe kidney thread is the finding that gives the metabolic and inflammatory pictures clinical urgency. A cystatin C-derived eGFR of 66 at 52 means the kidneys are filtering at roughly two-thirds of their expected capacity. Hypertension is the most established driver of gradual kidney decline, and the losartan is already addressing that. But the sustained inflammatory state (CRP 8.9) and the metabolic burden add ongoing stress to the kidneys. The marginally low potassium may be connected to the ARB or to the elevated bicarbonate. This cluster needs a fresh renal panel in three months to determine whether it is stable.\n\nThe smoking thread explains the red cell findings (haemoglobin 172, MCH 33.6, MCHC 350) through chronic carbon monoxide exposure, contributes to the CRP, accelerates kidney decline independently of blood pressure, and is the single modifiable factor with the largest impact on long-term cardiovascular and cancer risk. Cannabis use adds further respiratory burden. IgE at 368 may also be partly smoking-related, though genuine allergic sensitisation is the more common explanation at this level.\n\nWhat has been positively excluded is also valuable: thyroid disease, liver damage, coeliac disease, prostate pathology, iron deficiency or overload, autoimmune thyroid disease, and diabetes. The pancreas is compensating effectively for now, the liver is handling the metabolic load without visible strain, and the tumour markers are clean.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon, or leftover chicken. Anchor: protein goes on the plate first, before anything else. Why: protein blunts the insulin response behind your HOMA-IR of 1.83, protects muscle mass during weight loss, and supports testosterone production.\nSwap sugary drinks, fruit juice, and refined carbohydrates (white bread, pastry, cereal) for whole grains, oats, or rye, one meal at a time this week. Why: refined carbohydrates and fructose drive triglycerides (yours are 2.78, well above the 1.70 target) and worsen insulin resistance.\nWalk for fifteen to twenty minutes immediately after your largest meal of the day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin spike from that meal, which is the mechanism behind your developing insulin resistance.\nAdd one resistance training session per week, even bodyweight only: squats, press-ups, rows using a band or door frame. Anchor: attach it to one of your existing cardio days so it becomes a habit. Why: resistance training is the most powerful tool for improving insulin sensitivity, protecting kidney function, maintaining muscle mass, and raising testosterone (yours is 14.4, below the optimal 18).\nSet a fixed wake time seven days a week and get outside within thirty minutes of waking, even on overcast days. Why: morning light resets the circadian clock, improves sleep quality, and directly influences cortisol rhythm, energy, and brain fog. If you snore or wake unrefreshed, ask your GP about a sleep study for obstructive sleep apnoea, which is common at your BMI and is a major cause of all three of your symptoms.\nCut caffeine after 1pm. Anchor: set a phone alarm at 1pm labelled 'last coffee'. Why: caffeine after early afternoon disrupts deep sleep even when you feel you sleep through, and poor deep sleep worsens insulin resistance, inflammation, and next-day fatigue.\nAim for 7,500 to 10,000 steps per day, building gradually from your current 5,000 to 7,500 range. Anchor: add a ten-minute walk at lunchtime and one after dinner. Why: non-exercise movement is the largest contributor to daily calorie expenditure outside your resting metabolic rate, and it lowers CRP over time.\nCalorie target: 2,100 to 2,300 kcal per day for steady, sustainable fat loss at your current weight. Protein target: 130 to 145 grams per day (approximately 1.6 to 1.8 g per kg of estimated lean mass). These targets support fat loss while preserving muscle and will improve insulin sensitivity, triglycerides, CRP, and kidney workload simultaneously.","flags":"Cystatin C 1.33 (limit <1.1) with cystatin C-derived eGFR 66 and creatinine-based eGFR 74. At 52 both eGFR values fall below the expected threshold of 90 and into CKD Stage 2. Repeat renal panel including cystatin C in three months to establish trend. Hypertension and sustained inflammation (CRP 8.9) are the most likely contributors.\nhs-CRP 8.9 (ideal <1.0, limit <5.0). This level indicates significant chronic systemic inflammation. The most probable drivers are visceral adiposity at BMI 48.5 and active tobacco smoking. An acute illness at the time of sampling cannot be excluded; repeat in three months.\nTriglycerides 2.78 (desirable <1.70 fasting), HDL 1.1 (desirable >1.55), VLDL 1.26 (limit <0.78), Atherogenic Index of Plasma 0.403 (limit <0.21). This cluster reflects triglyceride-driven dyslipidaemia with suppressed HDL and a predominance of small dense LDL particles. ApoB at 0.85 is within the desirable threshold but above optimal. Cardiovascular Risk Score 75/100, driven predominantly by CRP and the triglyceride-HDL axis.\nHOMA-IR 1.83 (ideal <1.0, early resistance >1.9). Approaching the threshold for formal insulin resistance. Fasting glucose 5.0 and HbA1c 38 remain well controlled, indicating effective pancreatic compensation at present.\nIgE 368 (limit <100). More than three-and-a-half times the upper limit, suggesting active allergic sensitisation. Consider specific allergen testing (RAST panel or skin prick) to identify the trigger.\nPotassium 3.4 (lower limit 3.5). Marginally below range. May reflect sample delay or ARB effect. Repeat on a fresh sample alongside the renal panel.\nBicarbonate 33.6 (upper limit 31). Mildly elevated, most likely reflecting compensatory metabolic alkalosis related to losartan and/or chronic respiratory compensation from smoking. Review alongside kidney findings.\nHaemoglobin 172 (upper limit 170), MCH 33.6 (upper limit 32), MCHC 350 (upper limit 345). Marginal elevations consistent with chronic carbon monoxide exposure from smoking, prompting compensatory erythropoiesis. Not dangerous at these margins.\nTestosterone 14.4 (laboratory range 8.4 to 28.7, optimal >18). Below optimal but within laboratory range. Likely suppressed by aromatase activity in visceral fat at BMI 48.5. Weight loss is the primary intervention.\nB12 325 (laboratory range 193 to 982, optimal >500). Within laboratory range but below optimal. May be contributing to fatigue and brain fog. Sublingual methylcobalamin supplementation recommended.\nFIB-4 1.5 (threshold 1.45). Marginally above threshold but all direct liver markers (ALT 29, GGT 26, AST 31, bilirubin 18, albumin 45) are healthy. Score inflated by age and relatively low ALT. No clinical concern for fibrosis.\nReassuring negatives: thyroid function optimal with negative antibodies, liver enzymes all within range with APRI 0.389 and De Ritis 1.07, fasting glucose 5.0 and HbA1c 38 excluding diabetes, ferritin 139 and transferrin saturation 33.4% excluding iron overload or deficiency, PSA 0.64 with free ratio 0.547 excluding prostate pathology, CA19-9 and CEA within limits, coeliac screen negative, IgG/IgM/IgA within range, urinalysis clean, vitamin D 95 optimal.\nNot returned by the laboratory: rheumatoid factor, bacterial count, urine culture and sensitivities (all pending).","recommendations":"Discuss the kidney findings with your GP. Cystatin C is 1.33 with eGFR 66 at age 52. Request a repeat renal panel including cystatin C, potassium, and bicarbonate in three months to establish whether this is stable or declining. Bring these numbers to the appointment.\nDiscuss the hs-CRP of 8.9. The GP should confirm this is not driven by an acute illness and, if confirmed on repeat, consider it alongside the blood pressure management plan. Weight loss and smoking cessation are the primary interventions.\nDiscuss the triglycerides of 2.78 and HDL of 1.1 with the GP. If lifestyle changes over three to six months do not bring triglycerides below 1.70, fibrate or high-dose omega-3 therapy may be considered.\nDiscuss the IgE of 368. If Paul has any respiratory, nasal, or skin symptoms, specific allergen testing (RAST or skin prick) is warranted.\nAsk the GP about a sleep study for obstructive sleep apnoea. At BMI 48.5 with fatigue, brain fog, and poor recovery, sleep apnoea is a common and treatable cause that blood tests cannot detect.\nDiscuss smoking cessation support. Smoking is contributing to the CRP, the haemoglobin and red cell findings, accelerating kidney decline, and is the single largest modifiable risk factor for cardiovascular disease and cancer.\nRetest in four to six months with: cystatin C, eGFR, potassium, bicarbonate, hs-CRP, fasting lipid panel including triglycerides and HDL, fasting insulin, HbA1c, HOMA-IR, testosterone, and B12. These markers will show whether the lifestyle changes and any GP interventions are working. Calorie target 2,100 to 2,300 kcal per day, protein target 130 to 145 grams per day.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Your B12 is 325, within the laboratory range but below the optimal threshold of 500. B12 supports nerve function, energy metabolism, and red blood cell production, and suboptimal levels may be contributing to your fatigue and brain fog. Sublingual absorption bypasses the gut for more reliable uptake.\nOmega-3 fish oil: 3g combined EPA and DHA daily, taken with your largest meal. Your triglycerides are 2.78, well above the target of 1.70, and your HDL is 1.1, below optimal. High-dose omega-3 is one of the most effective supplements for lowering triglycerides and has anti-inflammatory effects that may help your CRP of 8.9.\nMagnesium glycinate: 400mg before bed. Your magnesium is 0.90, within range but in the lower half of the optimal band. Magnesium glycinate supports sleep quality, insulin sensitivity, blood pressure regulation, and muscle recovery, all of which are relevant to your goals and symptoms.\nVitamin D3: continue whatever you are currently doing to maintain your level of 95, which is in the optimal zone. If you are not supplementing and this level is from sun exposure alone, consider 2,000 IU cholecalciferol daily through the winter months with a fat-containing meal to maintain it.\nVitamin K2 (MK-7): 200 mcg daily, taken with your vitamin D. K2 directs calcium into bones and away from arteries, complementing vitamin D and relevant to cardiovascular health.\nDo not take iron supplements. Your ferritin is 139 and transferrin saturation is 33.4%, both well within range. Additional iron at these levels risks accumulation.\nThe most important changes from this report are not supplements. They are reducing calorie intake to 2,100 to 2,300 kcal per day, reaching 130 to 145 grams of protein daily, adding resistance training, increasing daily movement to 7,500 to 10,000 steps, and discussing smoking cessation with your GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 69 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 84.9; capped below 70 while a system is rated \"See your GP\"; final 69.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"50.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4439","lower_normal":"","upper_normal":"57","lower_optimal":"","upper_optimal":"52","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4561","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP, and HbA1c. It has no age term and measures the risk being accumulated rather than predicting a ten-year event probability. Paul's score of 75 is well above the acceptable threshold of 40 and more than three times the ideal ceiling of 20. The dominant drivers are the hs-CRP at 8.9 and the triglyceride-HDL axis (triglycerides 2.78, HDL 1.1). Because Lp(a) is low, this entire score is modifiable through lifestyle change. At 52, the ten-year absolute risk remains relatively low, but the gap between the high score and the low ten-year risk is the window for acting, and it narrows with every passing year of inaction.","low_causes":"Healthy lipids, low inflammation, optimal blood sugar control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6667","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. Paul's level of 5.0 sits within the ideal range of 4.0 to 5.4, indicating that the body is controlling blood sugar effectively at the moment. This is a genuine positive at a BMI of 48.5 and reflects the fact that the pancreas is compensating well for the developing insulin resistance seen in the HOMA-IR.","low_causes":"Fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, insulin resistance, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1cpercent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c expressed as a percentage is the international format for this marker. Paul's 5.6% is within the normal range (below 6.0%) and well below the pre-diabetes threshold of 6.0 to 6.4%. This confirms good average blood sugar control over the past two to three months.","low_causes":"Low blood sugar, haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated (coated with sugar) over the preceding two to three months. It provides a longer-term picture of blood sugar control than a single fasting glucose reading. Paul's result of 38 is comfortably below the pre-diabetes threshold of 42 and within the optimal range of below 36 when rounded, though at 38 it sits marginally above the tightest optimal ceiling. At a BMI of 48.5 with developing insulin resistance, this level of control is reassuring and confirms the pancreas is compensating effectively.","low_causes":"Haemolytic anaemia, blood loss, chronic low blood sugar","high_causes":"Pre-diabetes, diabetes, chronic hyperglycaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"8.24","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3586","lower_normal":"2.6","upper_normal":"24.9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3108","upper_optimal_position":"0.4145","lower_optimal":"2","upper_optimal":"8","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar under control. Paul's result of 8.24 is within the laboratory range of 2.6 to 24.9 but sits marginally above the tighter optimal ceiling of 8.0. In an insulin-sensitive person, very little insulin is needed to manage blood sugar. When cells begin to resist insulin's signal, the pancreas compensates by releasing more. At Paul's BMI, the slightly elevated insul
