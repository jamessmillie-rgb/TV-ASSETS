ding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR is a non-specific marker of inflammation that measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation. Paul's ESR of 8 is within the optimal range. Interestingly, this is much less alarming than the CRP of 8.9, which suggests the CRP elevation may be relatively recent rather than long-standing, since ESR tends to rise and fall more slowly than CRP.","low_causes":"Polycythaemia, sickle cell disease","high_causes":"Infection, inflammation, autoimmune disease, cancer, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the primary electrolyte controlling fluid balance and blood pressure. Paul's 141 is within the optimal range, indicating well-regulated fluid and electrolyte balance.","low_causes":"Diuretics, excessive water intake, SIADH, adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"3.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2778","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"mmol/L","description":"Potassium is an electrolyte essential for nerve signalling, muscle contraction, and heart rhythm. Paul's level of 3.4 is marginally below the lower limit of 3.5. This may reflect sample processing delay (potassium leaks out of cells over time if the sample sits too long) or could be a genuine finding related to his ARB medication or kidney function. Given the kidney findings in this report, the GP should repeat this on a fresh sample.","low_causes":"Diuretics, vomiting, diarrhoea, ARBs (rarely), renal tubular acidosis","high_causes":"Kidney disease, ACE inhibitors, ARBs, haemolysis, acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Paul's 96 is within the laboratory range but marginally below the tighter optimal band of 98 to 106. The low chloride is consistent with the elevated bicarbonate, as these two electrolytes tend to move in opposite directions. This pattern is characteristic of metabolic alkalosis.","low_causes":"Vomiting, metabolic alkalosis, diuretics, SIADH","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"33.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7879","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is the main buffer in the blood that maintains pH within a very narrow range. Paul's level of 33.6 is above the upper limit of 31. The most likely explanations are compensatory retention of bicarbonate by the kidneys in response to chronic respiratory acidosis from smoking (where the lungs retain carbon dioxide, and the kidneys compensate by holding onto bicarbonate to balance the pH), and/or a mild effect from the losartan. The GP should review this alongside the kidney and electrolyte findings.","low_causes":"Metabolic acidosis, diabetic ketoacidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics, compensated respiratory acidosis, ARBs","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4933","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. Paul's 5.6 is within the optimal range, suggesting adequate protein metabolism and renal clearance of this particular waste product.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, kidney disease, high protein diet, GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"100","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6325","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.5897","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a fairly constant rate. It is the traditional marker for estimating kidney function. Paul's creatinine of 100 is within the laboratory range but above the tighter optimal ceiling of 95 and approaching the upper limit. In a man with no resistance training, this level combined with the elevated cystatin C strengthens the case for genuine reduced kidney filtration rather than a muscle mass artefact.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6167","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"The estimated glomerular filtration rate (eGFR) from creatinine estimates how much blood the kidneys filter per minute. Above 90 is considered fully healthy, 60 to 89 is mildly reduced (Stage 2 CKD), and below 60 is moderately reduced (Stage 3). Paul's creatinine-based eGFR is 74, which sits in the mildly reduced range. This alone warrants monitoring, and the cystatin C-based eGFR of 66 gives further weight to this finding.","low_causes":"Kidney disease, dehydration, hypertension, diabetes, medications","high_causes":"Low muscle mass (can falsely elevate creatinine-based eGFR)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.33","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells, freely filtered by the kidneys, and not influenced by muscle mass, diet, or sex. This makes it a more reliable marker of kidney function than creatinine, particularly in someone carrying significant extra weight with no resistance training. Paul's cystatin C of 1.33 is above the upper limit of 1.1, indicating reduced kidney filtration. The cystatin C-derived eGFR of 66 falls into Stage 2 chronic kidney disease. This is the finding that should be discussed with the GP most promptly.","low_causes":"Generally not clinically significant when low","high_causes":"Reduced kidney function, inflammation, thyroid disease, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcystatinc","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.55","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C rather than creatinine, making it more accurate in people with very high or very low muscle mass. Paul's cystatin C-based eGFR of 66 confirms that kidney filtration is mildly reduced, consistent with the creatinine-based eGFR of 74. The lower cystatin C value likely gives the truer picture given Paul's BMI and absence of resistance training.","low_causes":"Kidney disease, hypertension, diabetes, inflammation","high_causes":"Hyperthyroidism (can falsely lower cystatin C)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"394","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5108","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5223","units":"umol/L","description":"Uric acid is the end product of purine metabolism, cleared by the kidneys. Elevated levels are associated with gout, kidney stones, and cardiovascular risk. Paul's 394 is within the laboratory range but above the tighter optimal ceiling of 380 for a male. The mild elevation connects to the developing insulin resistance (insulin impairs uric acid excretion) and the elevated triglycerides. Weight loss and reduced fructose intake are the most effective interventions.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"High purine diet, alcohol, obesity, insulin resistance, kidney impairment, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This is the combined eGFR calculated from both creatinine and cystatin C, which is considered the most accurate single estimate of kidney function. Paul's combined eGFR of 66 confirms mildly reduced kidney filtration, consistent with Stage 2 CKD. At 52 without diabetes, the most likely drivers are longstanding hypertension and the sustained inflammatory load reflected by the CRP of 8.9. A repeat in three months is essential to determine whether this is stable.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between different causes of abnormal kidney function. A normal ratio in the context of reduced eGFR suggests intrinsic kidney disease rather than pre-renal causes like dehydration. Paul's ratio of 56 is within the optimal range.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"8.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) measures low-grade systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. Levels below 1.0 are considered ideal for cardiovascular risk, 1.0 to 3.0 represents moderate risk, and above 3.0 represents higher risk. Paul's level of 8.9 is nearly nine times the ideal threshold and well above the laboratory upper limit of 5.0. The most probable sustained sources are visceral fat (which releases inflammatory cytokines continuously) and tobacco smoking. An acute illness at the time of sampling cannot be excluded, so a repeat in three months is important to confirm. This level of chronic inflammation accelerates insulin resistance, arterial damage, and kidney decline.","low_causes":"Low inflammation, statin use, weight loss, anti-inflammatory diet","high_causes":"Obesity, smoking, infection, chronic inflammation, autoimmune disease, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6267","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. Paul's 77 is within the optimal range, reflecting healthy liver synthetic function and adequate nutritional status.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Dehydration, chronic infection, inflammation, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance by keeping water inside blood vessels. Paul's albumin of 45 is within the optimal range, confirming strong liver synthetic function.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5926","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulins are a group of proteins including immunoglobulins (antibodies) and transport proteins. Paul's 32 is within the optimal range, consistent with his healthy individual immunoglobulin levels.","low_causes":"Immunodeficiency, liver disease, nephrotic syndrome","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5095","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3905","upper_optimal_position":"0.6095","units":"IU/L","description":"ALP is an enzyme found in the liver, bones, and bile ducts. Elevated levels can indicate bile duct obstruction, bone disease, or liver damage. Paul's 83 is within the optimal range, confirming no sign of bile duct or bone pathology.","low_causes":"Malnutrition, hypothyroidism, zinc deficiency","high_causes":"Bile duct obstruction, bone disease, liver disease, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5417","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5417","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down, processed by the liver, and excreted in bile. Paul's 18 is within the laboratory range but above the tighter optimal ceiling of 15. With all liver enzymes clean, this likely reflects either normal individual variation or a mild degree of Gilbert's syndrome, a common, harmless inherited trait affecting bilirubin processing that is present in around 5 to 10% of the population. It is not a concern.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2589","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is the liver enzyme most specific to liver cell damage. It is the single best screening marker for liver inflammation. Paul's ALT of 29 is within the tighter optimal threshold of below 30 for a male. At a BMI of 48.5, a clean ALT is a genuinely reassuring finding because the liver is under significant metabolic load from excess weight, yet it shows no sign of damage.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver disease, hepatitis, medications, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"IU/L","description":"AST (aspartate aminotransferase) is found in the liver, heart, and muscle. Unlike ALT, it is not specific to the liver. Paul's AST of 31 is within the optimal range, consistent with the clean ALT and GGT.","low_causes":"B6 deficiency, uraemia","high_causes":"Liver disease, muscle damage, heart disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1781","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"Gamma GT (GGT) is a liver enzyme that rises with alcohol use, bile duct problems, metabolic stress, and certain medications. It is the most sensitive liver enzyme for detecting alcohol-related strain. Paul's GGT of 26 is within the laboratory range of 4 to 73 for a male but marginally above the tighter optimal ceiling of 25. This is a very minor finding and at BMI 48.5, the fact that GGT is barely above the strictest optimal limit is a genuine positive, indicating the liver is handling the metabolic load well.","low_causes":"Generally not clinically significant","high_causes":"Alcohol, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4886","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5871","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Paul's 58 is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4574","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6262","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase. Paul's 48 is within the optimal range, ruling out pancreatic inflammation.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6228","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Paul's total calcium of 2.44 is within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate picture of the physiologically active calcium. Paul's corrected calcium of 2.37 is within the optimal range, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5747","units":"mmol/L","description":"Phosphate works with calcium for bone health and is involved in energy production (as part of ATP). Paul's 0.8 is within the laboratory range but marginally below the tighter optimal band of 0.9 to 1.4. At this level, with calcium and PTH both within range, this is a very minor finding and may reflect dietary intake or timing of the sample.","low_causes":"Poor dietary intake, vitamin D deficiency, hyperparathyroidism, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5345","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle and nerve function, blood sugar control, and blood pressure regulation. Paul's 0.90 is within the optimal range of 0.85 to 1.05. This is reassuring given the hypertension and developing insulin resistance, as magnesium deficiency worsens both.","low_causes":"Poor dietary intake, alcohol, diuretics, diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.475","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. Paul's level of 95 sits within the optimal range of 75 to 120. At a BMI of 48.5, this is a genuinely impressive result because fat tissue sequesters vitamin D, making it significantly harder to maintain adequate levels. Paul is clearly either supplementing effectively or getting regular sun exposure.","low_causes":"Low sunlight exposure, dark skin, obesity, malabsorption, ageing","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"2.683","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4828","lower_normal":"0.98","upper_ tion":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the fats circulating in the blood, primarily derived from dietary carbohydrates and fats. Paul's 2.78 is well above the desirable fasting threshold of 1.70 and nearly three times the optimal target of below 1.0. Elevated triglycerides are one of the hallmarks of metabolic syndrome and are driven by excess carbohydrate intake, insulin resistance, obesity, and physical inactivity. They are the central finding in Paul's lipid profile because they suppress HDL production, increase VLDL, promote the formation of small dense LDL particles, and independently increase cardiovascular risk. Reducing refined carbohydrates, losing weight, and increasing aerobic exercise are the most effective interventions.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8077","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"Very low-density lipoprotein (VLDL) is the particle that carries triglycerides from the liver to the tissues. Paul's 1.26 is above the upper limit of 0.78, directly reflecting the elevated triglycerides. As triglycerides come down through dietary changes and weight loss, VLDL will fall with them.","low_causes":"Low-fat diet, familial hypobetalipoproteinaemia","high_causes":"Obesity, insulin resistance, high carbohydrate diet, alcohol, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3548","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and transports it back to the liver for processing. Higher is better. Paul's HDL of 1.1 sits above the high-risk threshold of 1.04 but below the desirable level of 1.55 and well below the optimal target of 1.4 for a male. Low HDL is one of the defining features of metabolic syndrome and is directly suppressed by high triglycerides. The most effective ways to raise HDL are regular aerobic exercise, weight loss, and reducing refined carbohydrate intake. Adding resistance training also helps.","low_causes":"Obesity, physical inactivity, smoking, high-carbohydrate diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol consumption, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.43","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4050","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5600","units":"mmol/L","description":"LDL (low-density lipoprotein) is the cholesterol particle most associated with arterial plaque formation. Paul's LDL of 2.43 is within the laboratory range of 0.5 to 3.0 and below the tighter optimal ceiling of 2.6. While the absolute LDL number looks reasonable, the Atherogenic Index of Plasma suggests that a higher proportion of these particles are the small, dense type that penetrates artery walls more easily. This is driven by the elevated triglycerides rather than by LDL concentration itself.","low_causes":"Statins, low-fat diet, hyperthyroidism, malnutrition","high_causes":"High saturated fat diet, obesity, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.18","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4644","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick measure of cardiovascular risk. Paul's ratio of 4.18 is within the laboratory limit of below 4.5 but above the tighter optimal ceiling of 3.5. The ratio is elevated because HDL is low (1.1) rather than because total cholesterol is high (4.6). Improving HDL through exercise and weight loss will bring this ratio into the optimal zone.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all atherogenic (artery-damaging) particles: LDL, VLDL, and remnant cholesterol. Paul's 3.5 is within the laboratory limit of below 4.0 but above the tighter optimal ceiling of 3.0. The excess is driven primarily by the elevated VLDL from high triglycerides.","low_causes":"Statins, low-fat diet, hyperthyroidism","high_causes":"Elevated LDL, elevated VLDL/triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4917","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles and a measure of the functional capacity of the protective cholesterol system. Paul's 1.42 is above both the minimum threshold of 1.20 and the optimal target of 1.40, which is a positive finding and suggests that the HDL particles present, while fewer than ideal, are functioning well.","low_causes":"Metabolic syndrome, smoking, physical inactivity, genetic factors","high_causes":"Regular exercise, moderate alcohol consumption, oestrogen, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single best predictor of cardiovascular risk because it counts the total number of atherogenic (artery-damaging) lipoprotein particles in the blood. Each LDL, VLDL, and remnant particle carries exactly one ApoB molecule. Paul's ApoB of 0.85 is within the desirable threshold of below 0.9 but above the tighter optimal target of 0.8. At this level, the particle count is only marginally elevated and is being driven primarily by the high VLDL from elevated triglycerides rather than by LDL concentration. Reducing triglycerides through dietary change and weight loss should bring ApoB below 0.8.","low_causes":"Statins, low-fat diet, hyperthyroidism, malnutrition","high_causes":"Metabolic syndrome, high saturated fat diet, familial hypercholesterolaemia, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.60","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is the single best summary metric for the balance between harmful and protective lipoproteins. Below 0.7 is lower risk, and Paul's 0.60 falls within the optimal zone. This is a genuine positive and reflects the fact that while triglycerides are elevated and HDL is low, the absolute particle counts are not yet dramatically imbalanced. Maintaining and improving this ratio through lifestyle change is the goal.","low_causes":"High HDL, low LDL, exercise, healthy diet","high_causes":"Metabolic syndrome, high LDL, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It deposits cholesterol in artery walls, promotes clot formation, and drives local inflammation. Unlike LDL, Lp(a) is entirely inherited and cannot be changed by diet, exercise, or most medications. Paul's Lp(a) is below 25, within the normal range of below 32. This is genuinely useful information because it means that all of the cardiovascular risk in his lipid profile is driven by modifiable lifestyle factors rather than by an inherited, fixed particle. It also means that dietary changes, weight loss, and exercise have the full potential to normalise his lipid picture.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (unfavourable, inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"124","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from damaged muscle cells. Elevated levels indicate muscle injury from intense exercise, trauma, or in rare cases, a muscle-wasting condition. Paul's CK of 124 is within the optimal range, confirming no significant muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"19.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5804","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the main circulating thyroid hormone, produced by the thyroid gland in response to TSH. Paul's FT4 of 19.8 sits near the top of the optimal range of 14 to 20, indicating excellent thyroid hormone output.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4314","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4392","upper_optimal_position":"0.5490","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to regulate thyroid function. When thyroid hormones are low, TSH rises to stimulate more production; when they are adequate, TSH stays low. Paul's TSH of 1.8 sits in the optimal zone of 1.0 to 2.5, confirming that the thyroid is producing exactly the right amount of hormone without being pushed.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use. Most T3 is converted from T4 in the liver, kidneys, and tissues. Paul's FT3 of 5.0 is within the optimal range of 4.5 to 6.5, confirming adequate conversion and active thyroid hormone availability.","low_causes":"Hypothyroidism, low T4, poor conversion, illness, calorie restriction","high_causes":"Hyperthyroidism, T3 thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies target an enzyme in the thyroid gland and, when elevated, indicate autoimmune thyroid disease (Hashimoto's thyroiditis). Paul's level is below 6.6 (reported as less than 6.6), well within the normal range of below 13.8, ruling out autoimmune thyroid attack.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target the protein from which thyroid hormones are made. When elevated above 4.4, they suggest autoimmune thyroid disease. Paul's level is below 1.3 (reported as less than 1.3), consistent with more than 80% of the population who have undetectable levels. This confirms no autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.253","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio estimates how efficiently the body converts the storage form of thyroid hormone (T4) into the active form (T3). Paul's ratio of 0.253 is within the laboratory range but marginally below the optimal band of 0.27 to 0.40. This suggests that conversion could be slightly more efficient, though the absolute FT3 level of 5.0 is comfortably within the optimal range, so the clinical significance is minimal. Selenium, zinc, and adequate calorie intake support optimal conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0914","lower_normal":"0","upper_normal":"3.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"ng/ml","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. It is used as a screening marker for prostate health, with elevated levels potentially indicating benign enlargement, infection, or in some cases, prostate cancer. Paul's PSA of 0.64 is very low and well within the ideal range at 52, indicating excellent prostate health.","low_causes":"Healthy prostate, 5-alpha reductase inhibitors (finasteride)","high_causes":"Benign prostatic hy   if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
      if (lo == null && hi == null) return;
      n++; if (dist(b, useBase ? pv : cv) === 0) ok++;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="0 0 500 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 116); svg += `<text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by the share of its markers in the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
