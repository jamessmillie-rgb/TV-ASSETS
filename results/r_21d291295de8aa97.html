<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

reticulocyte percentage at 0.57 is just inside the lower end of its range, and his haemoglobin at 146 is healthy, so he is not anaemic. When the body has enough red cells and is not losing blood, the marrow can throttle back production, but at 27.1 the count is genuinely low rather than simply at the relaxed end. Combined with the very high ESR, one explanation is that chronic inflammation is quietly suppressing erythropoiesis, the process by which the bone marrow makes red cells. This is another reason the ESR warrants follow-up.\n\nHis LH is 1.42, just below the lower limit of 1.5. LH, or luteinising hormone, is the signal sent from the pituitary gland in the brain to the testes telling them to produce testosterone. His testosterone at 15 is within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30, sitting at roughly the lower third of the reference range for a 32-year-old man. His free testosterone, the portion not bound to proteins and therefore available for use, is 0.261, within range but also at the lower end. His SHBG at 43.5 is healthy and not excessively binding testosterone. His prolactin at 194 is within the normal range of 45 to 375 and does not appear to be the driver here. He mentions a history of elevated prolactin, and it is reassuring that on this sample it is within range. The pattern of low-normal LH with below-optimal testosterone at 32, in a lean, heavily training man eating well, raises two possibilities. First, the very high training volume and intensity may be suppressing the hypothalamic-pituitary-gonadal axis, a recognised response to chronic high-intensity exercise where the body downregulates reproductive hormones to redirect energy. Second, the chronic pain and elevated inflammation could themselves be contributing, as inflammatory cytokines can suppress LH pulsatility. Either way, testosterone below 18 at 32 with symptoms of low libido and poor recovery is worth addressing. The first step is optimising recovery: a genuine rest day, sleep quality, and calorie sufficiency. If symptoms persist, a repeat fasting morning testosterone with LH and FSH at 8 to 9 am would clarify whether this is a consistent pattern, and his GP could consider further pituitary investigation if it is.\n\nHis FT3 at 3.4 is within the laboratory range of 2.6 to 7.1 but below the optimal band of 4.5 to 6.5. FT3, or free triiodothyronine, is the active thyroid hormone that actually drives metabolism, energy and recovery in the tissues. His FT4 at 14.6 is within range but at the lower end of the optimal band of 14 to 20, and his TSH at 2.65 is within range but above the optimal ceiling of 2.5. The FT3 to FT4 ratio is 0.233, just inside the lower limit of the range but below the optimal band of 0.27 to 0.4, which suggests the conversion of the storage hormone T4 into the active hormone T3 is running at the lower end of efficiency. Both thyroid antibodies are firmly negative, ruling out autoimmune thyroid disease. This pattern of low-normal FT3 with mildly above-optimal TSH in a heavily training, lean individual can reflect the body's response to high energy expenditure and chronic physical stress. The thyroid quietly dials down conversion to T3 as a protective mechanism. It is not hypothyroidism, but it is suboptimal, and it may be contributing to his poor recovery and low energy around training. Improving recovery, sleep and calorie sufficiency should help this ratio improve, and it is worth repeating at his next test.\n\nHis C-peptide is 0.384 micrograms per litre, which converts to approximately 127 picomoles per litre, below the lower limit of the laboratory range. C-peptide is released by the pancreas in equal amounts to insulin and is a measure of how much insulin the pancreas is producing. His fasting insulin at 2.92 is at the very bottom of its range, and his HOMA-IR at 0.55 is at the floor of the range, meaning he is exceptionally insulin-sensitive. His fasting glucose at 4.2 and HbA1c at 34 are both well within optimal. In this context, the low C-peptide is not a sign of pancreatic failure. It reflects a pancreas that simply does not need to produce much insulin because the body is so efficient at using it. At a BMI of 22.8, training seven days a week with a clean diet, this is the expected metabolic profile, and it is an excellent one.\n\nHis uric acid at 158 is below the lower limit of 220. Uric acid is a waste product from the breakdown of purines, found in certain foods and produced during normal cell turnover. Low uric acid is common in lean, highly active individuals with clean diets and is not a clinical concern. It does mean he has essentially no risk of gout, and uric acid at this level has no negative health implications.\n\nHis bicarbonate at 31.6 is marginally above the upper limit of 31. Bicarbonate is part of the body's acid-base buffering system, and a very slight elevation can reflect mild metabolic alkalosis, sometimes seen after vigorous exercise when lactic acid has been cleared and the kidneys compensate, or simply laboratory variation at this margin. It is not clinically significant.\n\nHis De Ritis ratio, AST divided by ALT, is 1.91, above the upper normal limit of 1.6. This ratio is used as a liver-health marker, but in his case both AST at 42 and ALT at 22 are within their respective ranges, and the reason the ratio is elevated is that AST is disproportionately higher than ALT. AST is found not only in the liver but also in skeletal muscle, and with a creatine kinase of 202, confirming significant muscle breakdown from his training, the raised AST is almost certainly coming from muscle rather than liver. His GGT at 12 is pristine, his bilirubin at 13 is mid-range, his albumin at 42 is healthy, and his FIB-4 at 1.36 is within range. There is no sign of liver disease.\n\nNow to the considerable amount that is working well. His cardiovascular profile is exceptional. Total cholesterol at 3.6, LDL at 1.86, ApoB at 0.73, all comfortably within optimal ranges. ApoB, or apolipoprotein B, is arguably the best single measure of cardiovascular risk because it counts the number of potentially harmful cholesterol-carrying particles in the blood, and at 0.73 he is well below the 0.8 optimal threshold. His HDL at 1.4 is at the boundary of optimal, his triglycerides at 0.71 are excellent, his Lp(a), a genetically inherited lipoprotein that independently drives cardiovascular risk and cannot be changed by diet or exercise, is below 25, which is genuinely useful information because it means his entire lipid profile is driven by modifiable factors. His cardiovascular risk score is 0 out of 100, which is as clean as this metric gets. His kidney function is excellent, with a cystatin C of 0.74 giving a combined eGFR of 116, exactly where it should be at 32. His liver, as discussed, is in excellent health with GGT at 12, ALT at 22 and no sign of fibrosis or metabolic strain. His pancreatic enzymes, amylase at 84 and lipase at 44, are both mid-range and healthy. His iron studies are well balanced, with ferritin at 126, transferrin saturation at 33 percent and serum iron at 21.1, all comfortably within optimal bands. His vitamin B12 at 856 is excellent, sitting within the optimal range of 500 to 900. His folate at 14 is healthy. His vitamin D at 82 is within the sufficient range and inside the optimal band of 75 to 120, though there is room to push it higher toward 100 with supplementation, which would support recovery and immune function. His corrected calcium at 2.38, phosphate at 1.2 and magnesium at 0.98 are all within optimal ranges, and his parathyroid hormone at 1.6 is healthy, confirming good bone mineral regulation. His full blood count is largely healthy, with haemoglobin at 146, white cells at 5.49, platelets at 210 and a normal differential apart from the reticulocyte finding discussed above. His prostate markers are clean, with PSA at 0.49 and a free PSA ratio of 38.8 percent. His tumour markers CA19-9 and CEA are both well within range. His coeliac screen is negative and his IgA at 2.6 is sufficient to make that screen reliable. His IgE at 26.5 is low, suggesting no significant allergic burden. His cortisol at 410 is within the normal morning range and is not suppressed, which is reassuring given his training load. His oestradiol at 105 and progesterone at 0.91 are within range for a male. His DHEA-S at 3.9 micromoles per litre, equivalent to approximately 1,438 micrograms per decilitre, is healthy. His antioxidant status at 1.51 is mid-range and healthy. His urinalysis is completely clean with no protein, glucose, blood, white cells, nitrites or bacterial growth.\n\nHis PhenoAge is 30.4 against a calendar age of 32, meaning his biological age as estimated from his blood markers is approximately one and a half years younger than his actual age. This is a positive finding, driven by good glucose control, low inflammation markers at the CRP level, healthy albumin and strong kidney function. The elevated ESR is not an input to PhenoAge, so it does not affect this score, but addressing the inflammatory picture could push his biological age even lower.\n\nReturning to his symptoms. His low libido has a plausible explanation in the below-optimal testosterone and low-normal LH. His poor exercise recovery may be multifactorial: the below-optimal FT3 reducing metabolic efficiency, the below-optimal testosterone impairing muscle protein synthesis, the chronic inflammatory burden suggested by the ESR drawing resources away from repair, and the sheer volume of training at seven sessions per week with very high intensity leaving insufficient recovery time. His joint pain and stiffness are the findings that most need investigation, because the blood results raise the possibility of an inflammatory component that goes beyond the structural impingement diagnosis.","links":"The thread running through this report connects four findings that may share a common root. The ESR at 44, the raised IgM at 4.46, the low reticulocyte absolute count at 27.1, and the chronic multi-site pain around the left hip all point toward a chronic inflammatory or immune-mediated process. The ESR is the anchor: at nearly four times the upper limit in a lean, healthy 32-year-old with no infection, it demands explanation. Raised IgM in the same sample suggests the immune system is actively producing first-line antibodies against something it perceives as a threat, which in the absence of acute infection raises the possibility of an autoimmune or chronic inflammatory condition. The suppressed reticulocyte production fits because chronic inflammation can inhibit erythropoiesis even when haemoglobin is maintained, and it is consistent with the anaemia of chronic disease pathway operating at a subclinical level. The rheumatoid factor is negative, which makes classical rheumatoid arthritis less likely, but seronegative spondyloarthropathies, including ankylosing spondylitis and its related conditions, characteristically present with sacroiliac and hip pain, are more common in young men, and are associated with raised inflammatory markers and negative rheumatoid factor.\n\nThe second thread is the hormonal and thyroid picture, which may partly be driven by the same inflammation and partly by the training load. Below-optimal testosterone at 15 with LH just below range at 1.42 suggests the pituitary is not driving the testes hard enough, a pattern seen both in chronic overtraining and in chronic inflammation where cytokines suppress hypothalamic GnRH pulsatility. The low-normal FT3 at 3.4 with the conversion ratio below optimal adds another layer: the body appears to be conserving energy by reducing the conversion of T4 to the active T3. This is not thyroid disease, as the antibodies confirm, but it is functional underconversion that could be contributing to fatigue, poor recovery and difficulty building muscle despite a strong training programme and excellent diet.\n\nWhat has been excluded is important. His lipid profile, glucose metabolism, liver function, kidney function, iron stores, B12, folate, calcium homeostasis, coeliac disease, prostate health, tumour markers and urinalysis are all clean. His prolactin, historically a concern, is within range on this sample. These negatives narrow the field considerably and direct the investigation toward the inflammatory and immune findings.\n\nThe loose end is the C-peptide, which is below the laboratory range. In isolation this could suggest reduced pancreatic beta-cell output, but his glucose, HbA1c and insulin are all excellent, and his HOMA-IR at 0.55 confirms exceptional insulin sensitivity. The low C-peptide is a consequence of very low insulin demand rather than a failing pancreas, and the laboratory note about sample degradation within four hours of collection may also have contributed. It does not require action but should be noted if future tests return a similar pattern alongside rising glucose.","lifestyle":"Take one full rest day per week with no structured training, not even light cardio. Anchor: pick a fixed day and protect it. Why: seven high-intensity sessions per week with symptoms of poor recovery, below-optimal testosterone at 15 and low-normal FT3 at 3.4 suggest the body is not getting enough time to repair, and a rest day is the single biggest lever for recovery in this report.\nAim for at least 2,300 to 2,500 calories per day to ensure you are not in an energy deficit given your training volume and lean frame. At 69 kg, 174 cm and seven sessions per week, your estimated total daily energy expenditure is around 2,700 calories; eating below 2,300 risks the hormonal suppression pattern your bloods are showing. Track for a week to calibrate.\nHit 110 to 130 grams of protein per day, spread across at least three meals. At 69 kg training at high intensity, 1.6 to 1.9 grams per kilogram supports muscle protein synthesis and recovery. Anchor: a palm-sized portion of protein at every meal before anything else on the plate. Why: testosterone at 15 and poor recovery mean protein timing and sufficiency matter more than usual.\nPrioritise sleep quantity and quality: aim for eight hours in bed with a fixed wake time, and cut caffeine by 1 pm. Anchor: set an alarm for bedtime, not just for waking. Why: testosterone is predominantly produced during deep sleep, and FT3 conversion improves with adequate rest; both are below optimal.\nGet outside within 30 minutes of waking for at least 10 minutes of natural light. Why: morning light sets the cortisol awakening response and helps anchor circadian rhythm, which supports the testosterone and thyroid recovery your bloods need.\nContinue the high-quality diet. At 9 out of 10 with a volume of 8 out of 10, the food itself is not the problem, but consider adding oily fish twice a week if not already eating it, for omega-3 support for the inflammatory picture your ESR suggests.\nConsider incorporating a 10-minute post-training cooldown walk and dedicated mobility work for the hip complex, focusing on adductor, piriformis and glute medius activation rather than passive stretching. Why: the inflammatory markers mean the tissues may respond better to controlled movement than to aggressive stretching or foam rolling.","flags":"ESR 44, nearly four times the upper limit of 12, with no acute infection. In a lean 32-year-old with chronic multi-site hip and pelvic pain, a negative rheumatoid factor, and raised IgM, this pattern warrants further investigation for inflammatory or autoimmune arthropathy. Recommend HLA-B27, ANA, anti-CCP, and repeat ESR and CRP, with rheumatology referral if confirmed.\nIgM 4.46, above the upper limit of 3.0, alongside IgG at 15.6 near the top of its range. Persistent IgM elevation in the absence of acute infection raises the possibility of chronic immune activation or, less commonly, a lymphoproliferative process. Recommend repeat to confirm, and if persistent, consider serum protein electrophoresis.\nReticulocyte absolute count 27.1, below the lower limit of 50, with haemoglobin maintained at 146. In the context of an ESR of 44, this may represent early inflammatory suppression of erythropoiesis. Monitor alongside the inflammatory workup.\nLH 1.42, just below the lower limit of 1.5, with testosterone at 15, below the optimal band of 18 to 30. At 32 with symptoms of low libido and poor recovery, this warrants a repeat fasting morning sample at 8 to 9 am for testosterone, LH, FSH and prolactin to confirm the pattern.\nFT3 3.4, within laboratory range but below the optimal band of 4.5 to 6.5, with FT3:FT4 ratio at 0.233, below optimal. Antibodies negative. Likely functional underconversion related to training load and possible inflammatory burden rather than thyroid disease. Monitor on retest.\nC-peptide 0.384 micrograms per litre, below the laboratory range of 1.1 to 4.4. In the context of normal glucose at 4.2, HbA1c at 34 and excellent insulin sensitivity with HOMA-IR 0.55, this reflects very low insulin demand rather than pancreatic pathology. Sample handling may also have contributed. No action required but note for future comparison.\nUric acid 158, below the lower limit of 220. Common in lean, active individuals with clean diets. Not clinically significant.\nBicarbonate 31.6, marginally above the upper limit of 31. Likely post-exercise alkalosis or laboratory variation. Not clinically significant.\nDe Ritis ratio 1.91, above the upper limit of 1.6. Driven by AST at 42 relative to ALT at 22, with AST likely originating from skeletal muscle given CK at 202. No liver concern with GGT at 12 and all other liver markers clean.\nReassuring negatives: lipid profile excellent with ApoB 0.73 and Lp(a) below 25; glucose metabolism optimal with HbA1c 34 and HOMA-IR 0.55; liver function clean with GGT 12 and ALT 22; kidney function excellent with cystatin C eGFR 116; iron stores balanced with ferritin 126 and saturation 33%; B12 856, folate 14, vitamin D 82 all healthy; thyroid antibodies negative; coeliac screen negative; rheumatoid factor negative; PSA 0.49; tumour markers clean; urinalysis clear; prolactin 194 within range.","recommendations":"Discuss the ESR of 44 with your GP as the priority from this report. Request HLA-B27, ANA, anti-CCP antibody and a repeat ESR and CRP. If the ESR is confirmed elevated, ask for a referral to rheumatology for investigation of inflammatory arthropathy given the chronic hip and pelvic pain pattern, especially as the corticosteroid injection into the hip joint did not help.\nAsk the GP to check the IgM elevation at 4.46. A repeat to confirm it is persistent, and if so, serum protein electrophoresis to exclude a monoclonal process.\nRequest a repeat fasting morning blood draw at 8 to 9 am for testosterone, LH, FSH and prolactin to confirm the below-optimal testosterone of 15 and low LH of 1.42, as these hormones have a strong diurnal rhythm and a morning sample gives the most reliable result.\nMention the reticulocyte absolute count of 27.1 and its possible link to the inflammatory findings. If the ESR resolves with treatment or diagnosis, the reticulocyte count may normalise. If it does not, a reticulocyte panel and haematology input may be warranted.\nRetest in four to six months with a focus on ESR, CRP, IgM, testosterone, LH, FT3 and reticulocyte count to assess the response to any lifestyle adjustments and to track the inflammatory picture. Target calorie intake of 2,300 to 2,500 per day with at least 110 to 130 grams of protein, and at least one full rest day per week.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily taken with a meal containing fat, alongside vitamin K2 (MK-7) 100 micrograms. Why: his vitamin D at 82 is sufficient but there is room to push toward 100 to support immune regulation and recovery, especially given the inflammatory findings.\nMagnesium glycinate, 300 to 400 mg taken before bed. Why: his serum magnesium at 0.98 is within optimal range, but magnesium glycinate supports sleep quality, muscle relaxation and recovery, all of which are relevant given his training load, below-optimal testosterone and symptoms of poor recovery.\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 fatty acids have a modest anti-inflammatory effect and may help with the inflammatory burden suggested by the ESR of 44, as well as supporting cardiovascular health and joint comfort.\nDo not take iron supplements. His ferritin at 126 and transferrin saturation at 33% are well balanced, and additional iron would risk pushing stores into excess.\nThe most important changes from this report are not supplements. They are taking a full rest day each week, ensuring calorie and protein sufficiency to support seven training sessions and 10,000 to 15,000 daily steps, prioritising eight hours of sleep, and getting the inflammatory findings investigated by his GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 60 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 60.2. Weakest systems: glucose & insulin 24%, immunology 27%, inflammation 31%. Biggest drags: C-Peptide, Bicarbonate, Reticulocyte Absolute Count, Erythrocyte Sedimentation Rate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padd TRUE","within_optimal":"FALSE","result_position":"0.3450","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage shows how much of the red cell population is newly produced. At 0.57%, this is just inside the lower end of the laboratory range. When read alongside the low absolute reticulocyte count of 27.1, it confirms the bone marrow is producing red cells at a reduced rate. Since haemoglobin is healthy at 146, the body is maintaining its red cell mass, but the production rate is worth monitoring in the context of his elevated ESR.","low_causes":"Adequate red cell mass reducing demand, chronic inflammation, bone marrow suppression, iron or B12 deficiency","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"27.132","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1808","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells being released by the bone marrow per litre of blood, giving a more reliable picture than the percentage alone. At 27.1, this is significantly below the lower limit of 50. In the context of a normal haemoglobin and healthy iron stores, this is unlikely to be nutritional. The most probable explanation in this report is that the chronic inflammatory burden, evidenced by the ESR of 44, is quietly suppressing the bone marrow's red cell production. This is a recognised mechanism in chronic inflammation where inflammatory cytokines reduce erythropoietin responsiveness. It is not causing anaemia currently but should be monitored alongside the inflammatory workup.","low_causes":"Chronic inflammation suppressing erythropoiesis, adequate haemoglobin reducing demand, bone marrow suppression, iron or B12 deficiency","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"18.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by the red blood cell count and is used to differentiate iron-deficiency anaemia from thalassaemia trait when MCV is low. At 18.8, a value above 13 favours iron deficiency over thalassaemia, but since his MCV is normal and he is not anaemic, this index is reported for context and has no clinical significance here.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.25","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. A faster rate indicates the presence of inflammatory proteins in the blood, particularly fibrinogen and immunoglobulins, which cause red cells to clump and fall more quickly. At 44, this is nearly four times the upper limit of 12 for a man of his age and is the most significant abnormal finding in this report. In a lean, healthy 32-year-old with no acute infection, clean urine and no obvious source, an ESR this high warrants investigation. Combined with the raised IgM, the chronic multi-site pain around his hip and pelvis, and the suppressed reticulocyte count, this pattern raises the possibility of a chronic inflammatory or autoimmune process and should be discussed with his GP.","low_causes":"Generally not clinically significant; very low body fat, polycythaemia","high_causes":"Infection, autoimmune disease, inflammatory arthritis, malignancy, chronic inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5897","units":"mmol/L","description":"Sodium is the main electrolyte controlling fluid balance and blood pressure. At 142, this is within the optimal range and confirms healthy hydration and kidney regulation.","low_causes":"Overhydration, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is an electrolyte essential for nerve signalling, muscle contraction and heart rhythm. At 5.0, this is within the laboratory range but above the optimal ceiling of 4.8. The laboratory notes that potassium can be falsely elevated in samples that are delayed or have been sitting on cells, so this may partly be a sample-handling effect. His kidney function is excellent, making a true elevation unlikely. No action is needed, but worth noting for comparison on his next test.","low_causes":"Diarrhoea, vomiting, diuretics, excessive sweating","high_causes":"Sample haemolysis or delay, kidney disease, ACE inhibitors, excess supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4744","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5897","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance, blood pressure and acid-base equilibrium. At 100, this is within the optimal range and healthy.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, renal tubular acidosis, excess saline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"31.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7212","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3848","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is part of the body's acid-base buffering system, helping to maintain blood pH within a tight range. At 31.6, this is marginally above the upper limit of 31, representing a very mild metabolic alkalosis. This can be seen after vigorous exercise when lactic acid has been cleared and the kidneys compensate by retaining bicarbonate, or from mild volume contraction. At this margin, it is unlikely to be clinically significant and does not require action.","low_causes":"Metabolic acidosis, diabetic ketoacidosis, renal tubular acidosis, diarrhoea","high_causes":"Vomiting, diuretic use, post-exercise compensation, chronic respiratory acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6133","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product produced by the liver from protein metabolism and filtered out by the kidneys. At 7.6, this is within the laboratory range but slightly above the optimal ceiling of 7.0. In a man training heavily with a high protein intake, a mildly elevated urea is expected and reflects protein turnover rather than kidney impairment. His cystatin C eGFR of 116 confirms excellent kidney function.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney impairment, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5299","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism filtered by the kidneys. At 88, this is within the optimal range and consistent with healthy kidney function in a man with an active training programme.","low_causes":"Low muscle mass, liver disease, very low protein diet","high_causes":"Kidney impairment, high muscle mass, dehydration, high meat intake, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how efficiently the kidneys filter waste from the blood, calculated from creatinine. At above 90, this confirms healthy kidney function. His cystatin C-based eGFR of 116 provides a more precise figure and confirms excellent renal health.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration","high_causes":"Not clinically significant in isolation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3364","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a protein produced at a constant rate by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more accurate measure of kidney function in athletic or very lean individuals. At 0.74, this is excellent and gives a derived eGFR of 116, confirming his kidneys are functioning very well.","low_causes":"Generally not clinically significant","high_causes":"Kidney impairment, thyroid dysfunction, inflammation, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"158","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1519","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2724","upper_optimal_position":"0.5224","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, substances found in certain foods and produced during normal cell turnover. At 158, this is below the lower laboratory limit of 220. Low uric acid is common in lean, highly active individuals with clean diets and is not a clinical concern. It effectively eliminates gout risk and has no negative health implications at this level.","low_causes":"High activity level, lean body composition, low-purine diet, renal hypouricaemia","high_causes":"Gout, high-purine diet, kidney impairment, metabolic syndrome, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcystatin","name":"eGFR (Cystatin C)","group":"KIDNEY FUNCTION","result":"122","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR (Cystatin C) is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"116","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9667","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C to estimate kidney filtration rate, providing a more accurate result than either marker alone. At 116, this confirms excellent kidney function, exactly where it should be at 32.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"86.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5911","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps differentiate pre-renal causes of elevated urea, such as dehydration, from kidney disease. At 86.4, this is within the optimal range and consistent with healthy kidney function with mild protein turnover from exercise.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP measures C-reactive protein, an acute-phase protein produced by the liver in response to inflammation. Below 1.0 is considered optimal for cardiovascular risk. At exactly 1.0, this sits right at the optimal boundary. In the context of an ESR of 44, the relatively modest CRP is notable because CRP tends to respond more to acute bacterial infection and tissue injury, while ESR can remain elevated in chronic, low-grade inflammatory or autoimmune conditions. The combination of very high ESR with borderline CRP is itself informative and may help the GP narrow the differential.","low_causes":"Good health, anti-inflammatory diet, exercise","high_causes":"Infection, chronic inflammation, cardiovascular risk, autoimmune disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined albumin and globulin in the blood. At 78, this is within the optimal range and reflects healthy liver synthetic function and adequate protein intake.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, drugs and nutrients, and maintains fluid balance. At 42, this is within the optimal range and confirms healthy liver function and adequate nutrition.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin is the collective term for immune proteins, including antibodies, in the blood. At 36, this sits right at the upper limit of the laboratory range and above the optimal ceiling of 32. This is consistent with the elevated IgM and near-top IgG seen elsewhere in the report, reflecting an immune system that is actively producing antibodies. In the context of the raised ESR and chronic inflammatory symptoms, this adds to the picture of immune activation.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.17","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3738","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"ratio","description":"The albumin to globulin ratio compares the two main protein groups in the blood. At 1.17, this is within the laboratory range but below the optimal band of 1.3 to 2.2, driven by the globulin sitting at the top of its range. This is consistent with the elevated immunoglobulin levels and the broader inflammatory picture. It does not indicate liver disease.","low_causes":"Elevated globulin from chronic inflammation, autoimmune disease, liver disease","high_causes":"Generally not clinically significant","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3905","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"IU/L","description":"ALP is an enzyme found in the liver, bones and bile ducts. At 58, this is within the optimal range and consistent with healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is the yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. At 13, this is mid-range and healthy, indicating normal red cell turnover and liver processing.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1964","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in liver cells. When the liver is damaged or inflamed, ALT leaks into the blood. At 22, this is well within the optimal ceiling of 30 for a male, confirming the liver is healthy and under no metabolic strain.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver, alcohol excess, hepatitis, medication, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6354","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/L","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart and skeletal muscle. At 42, this is within the laboratory range but above the optimal ceiling of 35. Unlike ALT, which is liver-specific, AST is also released during muscle breakdown. With a creatine kinase of 202, confirming significant muscle turnover from his training, the elevated AST is almost certainly skeletal-muscle in origin rather than liver. His ALT at 22 and GGT at 12 being clean supports this interpretation.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, muscle damage, intense exercise, heart disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0822","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol use, bile duct issues and metabolic strain. At 12, this is excellent and well within the optimal range. A low GGT confirms the liver is under no metabolic, toxic or alcohol-related stress.","low_causes":"Generally not clinically significant","high_causes":"Alcohol excess, fatty liver, bile duct obstruction, medication, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"1.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2547","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 is a calculated score that estimates the risk of liver fibrosis, or scarring, using age, AST, ALT and platelet count. At 1.36, this is within the laboratory range but just above the optimal ceiling of 1.3. The score is mildly elevated because the AST at 42 is disproportionately higher than the ALT at 22, pulling the ratio up. Since the elevated AST is likely from skeletal muscle rather than liver, and every direct liver marker is clean, this score does not indicate liver fibrosis. No action is needed.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"APRI, the AST to platelet ratio index, is used to estimate the degree of liver fibrosis. At 0.5, this sits at the optimal ceiling, driven by the AST at 42 which, as discussed, is likely muscular in origin. With all direct liver markers clean, this score does not indicate liver fibrosis.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-1.961","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD fibrosis score estimates the likelihood of significant liver fibrosis in people with or at risk of non-alcoholic fatty liver disease. At -1.961, this is within the laboratory range but above the optimal ceiling of -1.455. The score is influenced by the AST, and since his elevated AST is likely from muscle, the score is being artefactually pushed up. With a BMI of 22.8, clean liver enzymes and no metabolic risk factors, NAFLD and significant liver fibrosis can be confidently excluded.","low_causes":"Healthy liver, young age, lean body composition","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7700","lower_normal":"0.6","upper_normal":"1.6","lower_optimal":"0.8","upper_optimal":"1.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5667","units":"ratio","description":"The De Ritis ratio divides AST by ALT. In liver disease, a ratio above 1.6 can suggest advanced fibrosis or cirrhosis. However, because AST is also abundant in skeletal muscle, an elevated ratio in an actively training person with clean liver markers is almost always driven by muscle-derived AST. His CK at 202, GGT at 12 and ALT at 22 all confirm this is a muscle-driven finding, not a liver concern.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4432","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amy :"Elevated LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lp(a) is a genetically determined lipoprotein that independently drives cardiovascular risk by depositing cholesterol in artery walls, promoting blood clotting and driving inflammation. Unlike LDL and ApoB, Lp(a) cannot be changed by diet or exercise; it is inherited and fixed for life. At below 25, this is within the normal range of below 32, which is genuinely useful information. It means his entire lipid profile is driven by modifiable factors, and it is worth recording permanently in his medical record.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited), hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"202","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5262","lower_normal":"40","upper_normal":"320","lower_optimal":"60","upper_optimal":"280","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found mainly in skeletal muscle, the heart and the brain. It rises when muscle fibres are damaged, typically after intense exercise. At 202, this is within the optimal range for an actively training individual, confirming that while muscle breakdown is occurring from his training, it is within the expected range and not excessive.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, rhabdomyolysis, muscle injury, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3595","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5600","units":"pmol/L","description":"FT4, or free thyroxine, is the storage form of thyroid hormone circulating unbound in the blood. The thyroid produces mainly T4, which the body then converts into the active form T3. At 14.6, this is within the laboratory range and just inside the lower end of the optimal band of 14 to 20. Combined with the low FT3 and mildly above-optimal TSH, this suggests the thyroid is producing adequate T4 but the conversion to active T3 is running at the lower end of efficiency.","low_causes":"Hypothyroidism, pituitary disease, severe illness, iodine deficiency","high_causes":"Hyperthyroidism, Graves' disease, early thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4983","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4812","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is the signal sent from the pituitary gland to the thyroid telling it how much hormone to produce. A rising TSH suggests the pituitary is working harder to maintain adequate thyroid output. At 2.65, this is within the laboratory range but above the optimal ceiling of 2.5. In isolation this would not be a concern, but in the context of a low FT3 at 3.4 and a low FT3:FT4 ratio, it supports the picture of the thyroid system operating at the lower end of efficiency, most likely as a functional adaptation to high physical demand rather than thyroid disease.","low_causes":"Hyperthyroidism, pituitary insufficiency, excessive thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3852","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3, or free triiodothyronine, is the active thyroid hormone that drives metabolism, energy production, fat burning and muscle recovery at the tissue level. At 3.4, this is within the laboratory range of 2.6 to 7.1 but significantly below the optimal band of 4.5 to 6.5. T3 is produced by converting the storage hormone T4, and his ratio of T3 to T4 at 0.233 is below optimal, suggesting this conversion is running slowly. In heavily training individuals, the body can downregulate T4-to-T3 conversion as a protective mechanism to conserve energy. This may be contributing to his poor recovery and difficulty building muscle despite a strong training programme. Thyroid antibodies are negative, ruling out autoimmune thyroid disease.","low_causes":"Non-thyroidal illness, calorie restriction, chronic stress, high training load, selenium or zinc deficiency","high_causes":"Hyperthyroidism, Graves' disease, early thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","with
