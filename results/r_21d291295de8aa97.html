<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Liam Turner","dob":"01/02/1994","report_date":"2026-10-02","is_retest":false,"summary":"Liam is a 32-year-old male presenting with a BMI of 22.8, following a standard mixed diet rated 9 out of 10 for quality with a volume of 8 out of 10. He trains seven times per week, four cardio and three resistance sessions, and describes his training as very high intensity. He takes between 10,000 and 15,000 steps per day. He reports no medications, no alcohol, and no smoking. His symptoms are low sex drive, poor exercise recovery, and joint pain and stiffness, specifically a chronic left hip pain involving the SI joint, groin, adductor, piriformis, glute med and IT band, with a diagnosis of femoroacetabular impingement and a recent corticosteroid injection that did not help. He notes a history of elevated prolactin levels, previously investigated and deemed not concerning. His goals are to improve long-term health and longevity, build muscle, and improve cardiovascular fitness.\n\nThe finding that stands out most in this report is a markedly elevated ESR at 44, well above the upper limit of 12, and this needs to be discussed with his GP promptly. ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour and rises whenever there is inflammation anywhere in the body. At 44, this is not a marginal result; it is nearly four times the upper limit. In a lean, healthy 32-year-old, the most likely explanation is the chronic inflammatory process in his left hip. Femoroacetabular impingement with ongoing soft tissue involvement across the SI joint, groin, adductor, piriformis and IT band represents a substantial area of active inflammation, and the recent corticosteroid injection itself can transiently raise the ESR. However, the ESR this high also needs other causes excluded. His CRP at 1 is not raised, which is important because CRP responds faster than ESR and tends to track acute bacterial infection and systemic inflammation more tightly, while ESR can rise with chronic inflammation, autoimmune conditions and certain blood abnormalities. His IgM, one of the five classes of antibody produced by the immune system, is elevated at 4.46 against an upper limit of 3.0, and IgM can rise with chronic infections, autoimmune conditions, or occasionally a benign condition called monoclonal gammopathy. The combination of a very high ESR and a raised IgM, even with a normal CRP, is a pattern the GP should investigate. At minimum, the GP should repeat the ESR on a fresh sample, check a serum protein electrophoresis to rule out any monoclonal band, and consider whether the hip pathology alone explains the degree of ESR elevation.\n\nThere is a great deal of good news in this report. Liam's cardiovascular profile is genuinely excellent, the kind of result that reflects both genetics and the quality of his diet and training. His total cholesterol is 3.6, his LDL is 1.86, and his ApoB, apolipoprotein B, which counts the number of cholesterol-carrying particles that can enter the artery wall and is the single best predictor of cardiovascular risk, is 0.73, comfortably below the 0.9 desirable threshold and below the 0.8 optimal target. His HDL, the protective cholesterol that carries lipid away from arteries, is 1.4, and his triglycerides are 0.71, which is excellent. His Lp(a), lipoprotein little-a, a genetically inherited particle that deposits cholesterol, promotes clotting and drives arterial inflammation, is below 25, meaning below the 32 risk threshold. This is genuinely useful information because it is fixed for life and means his already excellent lipid profile is not being offset by an inherited particle he cannot control. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 0 out of 100, which is as clean as it gets. His PhenoAge, a biological ageing index built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 28.1 against his calendar age of 32, putting him nearly four years younger biologically. The main marker pulling that number down in his favour is his excellent glucose, low CRP and healthy albumin.\n\nHis blood sugar regulation is excellent. Fasting glucose at 4.2 and HbA1c at 34 mmol/mol, which reflects average blood sugar over the preceding three months, are both within the optimal range. His fasting insulin is 2.92, which is low and reflects high insulin sensitivity, meaning his pancreas needs very little insulin to keep blood sugar controlled. His HOMA-IR, a calculation that estimates insulin resistance using fasting glucose and insulin, is 0.55, which is ideal. His C-Peptide, a molecule released in equal amounts to insulin and used to measure how much insulin the pancreas is actually producing, is reported at 0.384 micrograms per litre, which converts to approximately 127 picomoles per litre, below the laboratory range of 1.1 to 4.4 micrograms per litre. In the context of a perfectly normal glucose and HbA1c with excellent insulin sensitivity, this low C-Peptide simply reflects low insulin demand rather than pancreatic failure. His pancreas is producing exactly as much insulin as his body needs, which is very little because his tissues are so responsive to it.\n\nHis kidney function is excellent. Cystatin C, a small protein filtered by the kidneys that gives a more accurate picture of kidney function than creatinine alone, is 0.74, giving a Cystatin C eGFR of 116 and a combined eGFR of 116, exactly where it should be at 32. His liver is healthy. ALT at 22 and GGT at 12 are both well within the optimal range, and his FIB-4, a fibrosis score that estimates liver scarring, is 1.36, which is within range and driven by the calculation rather than by any sign of liver disease. His pancreatic enzymes, amylase and lipase, which are released by the pancreas to digest food and rise when the pancreas is inflamed, are both mid-range and healthy. His prostate screen is clear, with a PSA of 0.49 and a free PSA ratio of 38.8%, both reassuring. His tumour markers CA19-9 and CEA are well within range. His coeliac screen is negative. His IgE, which rises with allergic conditions, is normal at 26.5. His rheumatoid factor is negative at 6, which is important context given his joint symptoms.\n\nHis thyroid function needs attention. TSH, thyroid stimulating hormone, the signal sent from the pituitary gland to tell the thyroid how hard to work, is 2.65, which is within the laboratory range of 0.55 to 4.78 but above the optimal band of 1.0 to 2.5. His FT4, the main hormone the thyroid produces, is 14.6, which is within range but sitting in the lower quarter. His FT3, the active form of thyroid hormone that cells actually use, is 3.4, which is within the laboratory range of 2.6 to 7.1 but below the optimal range of 4.5 to 6.5. The FT3 to FT4 ratio, which measures how efficiently the body converts storage hormone to active hormone, is 0.233, below the optimal band of 0.27 to 0.4. Taken together, this pattern suggests the thyroid is working but its output, particularly the active hormone FT3, is at the lower end of where it should be in a 32-year-old man. Both thyroid antibody tests, TPO and thyroglobulin, are clearly negative, which rules out autoimmune thyroid disease such as Hashimoto's. A low FT3 with a borderline TSH in a lean, heavily training individual may reflect the body downregulating thyroid output under the stress of very high training volume, a recognised physiological adaptation sometimes called low T3 syndrome or euthyroid sick syndrome. This is relevant to his symptoms because FT3 is the hormone that drives cellular energy, recovery, mood and libido, and a low FT3 could contribute to poor exercise recovery, low energy and reduced sex drive.\n\nHis testosterone at 15 is within the laboratory range of 8.4 to 28.7 but below the optimal range of 18 to 30. His free testosterone, the fraction not bound to proteins and therefore available to tissues, is 0.261, within range, and his bioavailable testosterone is 5.99, also within range. His SHBG, sex hormone binding globulin, which binds testosterone and reduces its availability, is 43.5, mid-range and healthy. His LH, luteinising hormone, the pituitary signal that tells the testes to produce testosterone, is 1.42, marginally below the lower limit of 1.5. A low-normal testosterone alongside a low LH suggests the pituitary is not driving testosterone production as hard as it could be. This is not the pattern seen with testicular failure, where LH would be high because the pituitary is shouting at testes that cannot respond. Instead, it suggests central suppression, meaning the signal from the brain is turned down. The most common causes in a lean, intensely training 32-year-old are high training volume relative to recovery, caloric underfunding despite good food quality, elevated cortisol from chronic physical stress, or the suppressive effect of chronic pain. His cortisol at 410 is within the morning reference range but sits in the upper half, which is consistent with the physiological stress of intense training and chronic pain. His prolactin at 194 is within the normal range of 45 to 375, so while Liam notes a history of high prolactin, it is not elevated on this sample and is not suppressing his LH at present. His oestradiol at 105 is within range, and his progesterone at 0.91 is just inside the lower limit of 0.89 to 3.88. His DHEA-S, a precursor hormone produced by the adrenal glands, is 3.9 micromoles per litre, which converts to approximately 1,437 micrograms per decilitre, within range and healthy for his age.\n\nHis absolute reticulocyte count is 27, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low count means the marrow is producing red cells at a slower rate than expected. His haemoglobin at 146 is healthy, and his red cell count, MCV, MCH and MCHC are all within range, so he is not anaemic. His iron stores are adequate with a ferritin of 126 and a transferrin saturation of 33%, both within optimal ranges. In the absence of anaemia or iron deficiency, a low reticulocyte count in a heavily training young man most likely reflects the same pattern of the body quietly economising under high physical stress. When training volume is very high and recovery is limited, the bone marrow can slow production of cells the body does not urgently need. This is worth monitoring on retest but is not a clinical concern in isolation when haemoglobin is normal.\n\nHis uric acid at 158 is below the lower limit of 220. Uric acid is a waste product of purine metabolism and also acts as an antioxidant in the blood. Low uric acid is not typically a clinical concern and is seen in people with lean body composition, high antioxidant intake, good kidney function and high hydration. At a BMI of 22.8 with an eGFR of 116 and a diet rated 9 out of 10 for quality, this is the expected finding.\n\nHis bicarbonate at 31.6 is marginally above the upper limit of 31. This is a trivial margin that could reflect a mild metabolic alkalosis from high training load, dietary alkalinity, or simply the tail end of the reference range. It is not clinically significant.\n\nHis IgG at 15.6 is at the top of the range of 6.5 to 16 and within limits. His globulin at 36 sits at the upper boundary of its range of 18 to 36. These are consistent with an active immune system and may relate to whatever is driving the elevated ESR and IgM. The GP investigation recommended above will cover this.\n\nHis vitamin D at 82 is within the sufficient range and within the optimal band of 75 to 120, which is good. His B12 at 856 is excellent. His folate at 14 is healthy. His magnesium at 0.98 is within the optimal range. His calcium, phosphate and parathyroid hormone are all within range and balanced.\n\nHis total antioxidant activity at 1.51 is within range and reflects a diet genuinely rich in antioxidant foods. His creatine kinase at 202 is within the range of 40 to 320 for a man and consistent with his high training volume without suggesting muscle damage.\n\nHis urinalysis is entirely clean with no protein, no blood, no white cells, no nitrites, no bacterial growth and no casts.\n\nPutting this together, Liam is a lean, fit, well-nourished 32-year-old with an outstanding cardiovascular profile, excellent blood sugar regulation, healthy kidneys and liver, and good vitamin and mineral status. The two findings that need action are the markedly elevated ESR with raised IgM, which the GP should investigate, and the below-optimal thyroid and testosterone axis, which is most likely driven by the combination of very high training intensity, chronic hip pain and the physiological stress those place on his body. Addressing the hip pain, ensuring adequate caloric intake for his training load despite eating well, and optimising recovery could be the lever that lifts his FT3, his testosterone and his exercise recovery.","links":"The thread running through the most important findings in this report is the relationship between chronic physical stress and the hormonal and haematological signals the body sends when it is under sustained pressure. Liam trains seven days a week at very high intensity while managing chronic hip pain across the SI joint, groin, adductor, piriformis and IT band. That is a significant allostatic load, the total burden of physical stress the body is managing, and several of his results reflect the body's response to it.\n\nThe below-optimal FT3 at 3.4, the below-optimal testosterone at 15 with a low LH of 1.42, and the low absolute reticulocyte count at 27 all fit the same pattern. When the body perceives sustained physical stress, whether from training, pain, under-recovery or a combination, it downregulates functions that are important for long-term health but not essential for short-term survival. Thyroid conversion to active FT3 slows, pituitary drive to testosterone production decreases, and bone marrow output of new red cells is dialled back. None of these has crossed into a pathological range, and his haemoglobin, red cell indices and free testosterone are all still within limits, but the direction of travel is clear: the body is conserving energy. This is relevant to every symptom he reports. Low FT3 contributes to fatigue, slow recovery and reduced drive. Below-optimal testosterone contributes to low libido, difficulty building muscle despite excellent training, and slower tissue repair. The low reticulocyte count reflects the same economising signal.\n\nThe markedly elevated ESR at 44 sits somewhat apart from this pattern because ESR does not typically rise with overtraining alone. The most plausible explanation is his hip pathology: a large area of chronic musculoskeletal inflammation involving bone, cartilage, tendon and muscle will raise the ESR, and the recent corticosteroid injection can itself cause a transient spike. However, the raised IgM at 4.46 adds a second thread. IgM is the first antibody the body produces in response to a new infection or immune challenge, and a persistently raised IgM can indicate chronic low-grade infection, an autoimmune process, or, rarely, a lymphoproliferative condition. His CRP is not raised, his rheumatoid factor is negative, and his coeliac screen is negative, which argues against active systemic autoimmune disease. The most likely explanation is that the hip inflammation is driving the ESR and that the IgM elevation is either related to the same inflammatory process or is a separate incidental finding, but the GP needs to investigate this combination to be certain.\n\nWhat has been positively excluded is important. His cardiovascular risk is negligible by every metric. His blood sugar regulation is excellent. His liver and kidneys are healthy. His thyroid antibodies are negative, ruling out autoimmune thyroid disease. His prolactin, which he has historically been concerned about, is normal on this sample. His iron stores are adequate. His prostate screen is clear. His urinalysis is clean. The bloods paint a picture of a fundamentally healthy young man whose body is telling him, through subtle hormonal and haematological signals, that the balance between training stress, chronic pain and recovery needs adjusting.\n\nThe hip pain itself deserves a note. The fact that the corticosteroid injection did little to help is clinically informative. If the pain were primarily from joint capsule inflammation, the injection would typically provide at least temporary relief. Its failure raises the possibility that the pain is driven more by the surrounding soft tissue, the adductor, piriformis, glute med and IT band complex, than by the joint itself, or that there is an element of central sensitisation, where the nervous system amplifies pain signals from a chronically irritated area. This does not change the blood results, but it does suggest that the approach to the hip should involve a detailed biomechanical and neuromuscular assessment rather than further injections.","lifestyle":"Ensure your total calorie intake matches your training output. At 69 kg, 174 cm, training seven days a week at very high intensity with over 10,000 steps, your estimated maintenance is around 2,700 to 2,900 calories per day. Your diet quality is excellent, but if total intake falls below maintenance consistently, the body will downregulate thyroid output and testosterone production, which is exactly the pattern your bloods show. Track intake for one week to confirm you are meeting this target. Protein target: 110 to 130 grams per day, spread across meals, to support muscle protein synthesis and tissue repair around your hip.\nAdd one full rest day per week with no structured training. Anchor: pick the same day each week and protect it. Why: your low FT3 of 3.4, below-optimal testosterone at 15, and low reticulocyte count of 27 all suggest the body is not recovering from the volume it is being asked to handle. Recovery is where adaptation happens, and without it, training drives the hormones further down.\nPrioritise sleep quantity and consistency: aim for at least eight hours in bed with a fixed wake time seven days a week. If you are not already doing so, stop caffeine after midday and keep the bedroom cool and dark. Why: sleep is when testosterone peaks and when the thyroid conversion to FT3 is most active. Maximising sleep quality is the cheapest way to lift both.\nInclude two to three portions of oily fish per week, such as salmon, mackerel or sardines. Anchor: replace one or two existing protein sources at dinner. Why: omega-3 fatty acids reduce the chronic inflammation driving your ESR and support joint and tendon health around the hip.\nAdd a ten-minute daily mobility routine targeting the hip complex: piriformis stretch, hip flexor stretch, adductor stretch, glute med activation with a band. Anchor: immediately before your training session as a non-negotiable warm-up. Why: improving load distribution around the hip may reduce the inflammatory signal and the pain that is contributing to your stress burden.\nConsider working with a sports physiotherapist who specialises in hip biomechanics to reassess the impingement diagnosis and soft tissue drivers of the pain. The failure of the corticosteroid injection suggests the pain generator may not be the joint capsule alone.","flags":"ESR 44, nearly four times the upper limit of 12. In a lean, healthy 32-year-old this is significantly elevated. The most likely explanation is the chronic hip inflammation from femoroacetabular impingement and surrounding soft tissue involvement, and the recent corticosteroid injection may have contributed transiently. However, combined with the raised IgM, other causes should be excluded. Recommend repeat ESR on a fresh sample, serum protein electrophoresis, and GP review.\nIgM 4.46, above the upper limit of 3.0, with IgG at 15.6 near the top of range and globulin at 36 at the upper boundary. In isolation a raised IgM may reflect chronic infection, autoimmune activity or benign monoclonal gammopathy. The serum protein electrophoresis recommended above will clarify.\nFT3 3.4, within the laboratory range of 2.6 to 7.1 but below the optimal range of 4.5 to 6.5. FT4 14.6, in the lower quarter of the range. FT3:FT4 ratio 0.233, below the optimal band of 0.27 to 0.4. TSH 2.65, above the optimal ceiling of 2.5. Both thyroid antibodies negative. This pattern suggests reduced thyroid conversion under physiological stress from high training volume and chronic pain. Relevant to his fatigue and recovery symptoms.\nTestosterone 15, within range but below the optimal band of 18 to 30. LH 1.42, marginally below the lower limit of 1.5. This combination suggests central suppression of testosterone drive rather than testicular failure, consistent with high training stress, chronic pain and possible caloric underfunding relative to output. Relevant to his low libido and difficulty building muscle.\nAbsolute reticulocyte count 27, below the lower limit of 50. Haemoglobin normal at 146, iron stores adequate. Low reticulocyte production likely reflects the same stress-related economising pattern seen in the thyroid and testosterone axes.\nC-Peptide 0.384 ug/L (approximately 127 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. In the context of normal glucose, normal HbA1c and excellent insulin sensitivity (HOMA-IR 0.55), this reflects low insulin demand rather than pancreatic insufficiency. Not a clinical concern.\nUric acid 158, below the lower limit of 220. Consistent with lean body composition, good hydration and excellent kidney function. Not a clinical concern.\nBicarbonate 31.6, marginally above the upper limit of 31. Trivial margin, likely training-related or dietary. Not clinically significant.\nReassuring negatives: cardiovascular profile excellent across all metrics (ApoB 0.73, LDL 1.86, HDL 1.4, triglycerides 0.71, Lp(a) below 25, Cardiovascular Risk Score 0/100), blood sugar regulation optimal (glucose 4.2, HbA1c 34, HOMA-IR 0.55), liver healthy (ALT 22, GGT 12, FIB-4 1.36), kidney function excellent (Cystatin C eGFR 116), thyroid antibodies negative, prolactin normal at 194, rheumatoid factor negative, coeliac screen negative, PSA 0.49, tumour markers clear, urinalysis clean, vitamin D 82, B12 856, folate 14, ferritin 126, magnesium 0.98.","recommendations":"Discuss the ESR of 44 with your GP. Bring this report and ask for a repeat ESR on a fresh sample plus a serum protein electrophoresis to investigate the combination of elevated ESR and raised IgM of 4.46. The CRP being normal and rheumatoid factor being negative are useful context for the GP.\nDiscuss the below-optimal thyroid output with your GP, specifically the FT3 of 3.4 and FT3:FT4 ratio of 0.233. If symptoms of fatigue, poor recovery and low libido persist after addressing training load and recovery, a repeat thyroid panel in three months will show whether FT3 has improved. If it has not, further investigation may be warranted.\nDiscuss the testosterone of 15 and LH of 1.42 with your GP. In a 32-year-old, a below-optimal testosterone with a low LH warrants monitoring. If lifestyle changes, specifically adequate caloric intake, a rest day and improved recovery, do not lift the testosterone on retest in three to four months, the GP may wish to investigate further with a morning testosterone, LH, FSH and prolactin repeat.\nSeek a specialist hip assessment. The failure of the corticosteroid injection and the breadth of soft tissue involvement suggest the pain may not be primarily articular. A sports physiotherapist or musculoskeletal specialist with hip expertise can assess whether the impingement is the pain generator or whether the surrounding musculature and biomechanics are the primary drivers.\nRetest in three to four months with: ESR, IgM, serum protein electrophoresis if not already done, FT3, FT4, TSH, testosterone, LH, reticulocyte count. Calorie target: 2,700 to 2,900 calories per day to match training output. Protein target: 110 to 130 grams per day (1.6 to 1.9 g per kg). Weight maintenance at 69 kg is appropriate; the goal is to ensure adequate fuelling, not weight loss.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 IU daily, taken with a fat-containing meal. His level of 82 is within the optimal band of 75 to 120; this dose maintains it through winter. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 micrograms daily, taken with the vitamin D. Directs calcium into bone rather than arteries and supports joint and bone health around the hip.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: his ESR of 44 reflects significant chronic inflammation, and omega-3 has a well-evidenced anti-inflammatory effect on joints and soft tissue. This also supports cardiovascular maintenance.\nMagnesium glycinate: 300 to 400 mg before bed. His serum magnesium at 0.98 is within the optimal range, but magnesium supports sleep quality, muscle recovery and the conversion of T4 to T3, all of which are relevant to his current picture.\nZinc (zinc bisglycinate): 15 to 25 mg daily, taken with food. Zinc supports testosterone production and immune function. Do not take at the same time as magnesium.\nThe most important changes from this report are not supplements. They are ensuring calorie intake matches training output at 2,700 to 2,900 calories per day, adding a full rest day each week, and investigating the hip pain with a specialist who can identify the true pain generator.","system_ratings":{"thyroid":{"level":"amber","label":"Room to improve","note":"FT3 3.4 below optimal, FT3:FT4 ratio 0.233 below optimal, TSH 2.65 above optimal, antibodies negative"},"cardio":{"level":"green","label":"Optimal","note":"ApoB 0.73, LDL 1.86, HDL 1.4, triglycerides 0.71, Lp(a) below 25, Cardiovascular Risk Score 0"},"liver":{"level":"green","label":"Optimal","note":"ALT 22, GGT 12, FIB-4 1.36, amylase and lipase mid-range"},"gut":{"level":"green","label":"Optimal","note":"Glucose 4.2, HbA1c 34, HOMA-IR 0.55, coeliac screen negative"},"kidney":{"level":"green","label":"Optimal","note":"Cystatin C eGFR 116, creatinine 88, electrolytes balanced"},"hormones":{"level":"amber","label":"Room to improve","note":"Testosterone 15 below optimal, LH 1.42 below range, likely training and pain driven"},"blood":{"level":"orange","label":"Needs attention","note":"ESR 44 nearly 4x upper limit, absolute reticulocytes 27 below range, needs GP investigation"},"immune":{"level":"orange","label":"Needs attention","note":"IgM 4.46 above range at 3.0, IgG 15.6 near top, needs investigation alongside ESR"},"vitamins":{"level":"green","label":"Optimal","note":"Vitamin D 82, B12 856, folate 14, magnesium 0.98"},"minerals":{"level":"lime","label":"Mostly good","note":"Uric acid 158 below range but consistent with lean composition, all other minerals optimal"},"prostate":{"level":"green","label":"Optimal","note":"PSA 0.49, free PSA ratio 38.8%"},"screening":{"level":"green","label":"Optimal","note":"CA19-9 below 1.2, CEA 1.76, all within range"},"urinary":{"level":"green","label":"Optimal","note":"Clean urinalysis, no protein, blood, WBCs, nitrites or growth"}},"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"62","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 62 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 61.9. Weakest systems: inflammation 25%, immunology 27%, glucose & insulin 34%. Biggest drags: C-Peptide, Reticulocytes (Absolute), ESR, Free T3.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"28.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3797","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4324","units":"years","description":"PhenoAge is a biological ageing index derived from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Liam's PhenoAge of 28.1 against a calendar age of 32 means he is biologically ageing nearly four years younger than his chronological age. The markers pulling this number in his favour are his excellent glucose, low CRP, healthy albumin and good kidney function. This is an excellent result and reflects his high-quality diet and active lifestyle.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the cardiovascular risk being accumulated, not the ten-year probability of an event. Liam's score of 0 is the lowest possible, reflecting an exemplary cardiovascular profile across every input. Every contributing marker is within or better than its optimal range.","low_causes":"Excellent lipid profile, low inflammation, good blood sugar regulation","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. Liam's level of 4.2 is within the optimal range of 4.0 to 5.4, reflecting excellent blood sugar control. This is the level expected in a lean, insulin-sensitive individual eating a high-quality diet.","low_causes":"Extended fasting, very low carbohydrate intake, excessive insulin production","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"4","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6183","units":"%","description":"HbA1c reflects average blood sugar levels over the preceding two to three months by measuring the percentage of haemoglobin that has glucose attached to it. Liam's result of 5.3% is well within the normal range and below the 6.0% pre-diabetes threshold. This confirms that his blood sugar regulation has been excellent over the past few months, not just on the day of the test.","low_causes":"Low carbohydrate intake, very high red blood cell turnover","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Liam's value of 34 mmol/mol is within the optimal range of 20 to 36, confirming excellent long-term blood sugar control. The normal threshold is below 42, and the pre-diabetes range begins at 42 to 47.","low_causes":"Low carbohydrate intake, high red cell turnover","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2524","upper_optimal_position":"0.4810","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. A low value, like s":"x10^9/L","description":"Basophils are the rarest type of white blood cell and play a role in allergic reactions and inflammation. Liam's basophil count of 0.07 is within range.","low_causes":"Acute allergic reaction, hyperthyroidism, corticosteroid use","high_causes":"Allergic conditions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3450","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage tells us what proportion of red cells are newly minted. Liam's reticulocyte percentage of 0.57% is just inside the lower limit of the normal range. While technically within range, the corresponding absolute count is low, suggesting the bone marrow is producing red cells at a slower rate than expected.","low_causes":"Bone marrow suppression, iron or B12 deficiency, chronic disease, low energy availability","high_causes":"Haemolysis, blood loss, recovery from anaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"27.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1807","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells released into circulation per litre of blood, ription":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"44","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR, erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. It rises whenever there is inflammation, infection or tissue damage anywhere in the body. Liam's ESR of 44 is nearly four times the upper limit of 12, which is a significant finding in a 32-year-old. The most plausible explanation is the chronic musculoskeletal inflammation from his femoroacetabular impingement and surrounding soft tissue involvement in the SI joint, groin, adductor, piriformis, glute med and IT band. The recent corticosteroid injection may have transiently contributed. However, his CRP is not correspondingly elevated, which is unusual and means the ESR may be reflecting a chronic rather than acute process, or a process that ESR captures better than CRP, such as elevated immunoglobulins. This should be investigated by the GP alongside the raised IgM.","low_causes":"Normal health, polycythaemia","high_causes":"Infection, chronic inflammation, autoimmune disease, malignancy, tissue injury, elevated immunoglobulins","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is a marker of acute systemic inflammation produced by the liver. Unlike ESR, which rises slowly and stays elevated with chronic processes, CRP spikes rapidly with acute inflammation and falls within days. Liam's CRP of 1 is within the laboratory range of below 5 but sits at the boundary of the optimal threshold of below 1.0. In the context of an ESR of 44, this dissociation is informative: it suggests the ESR is being driven by a chronic process or by elevated immunoglobulins rather than by an acute inflammatory event.","low_causes":"Normal health, low inflammation","high_causes":"Acute infection, chronic inflammation, obesity, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"142","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Sodium is the main electrolyte controlling fluid balance, nerve signalling and blood pressure. Liam's sodium of 142 is within the optimal range, indicating healthy hydration and kidney regulation.","low_causes":"Overhydration, diuretic use, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pot","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_ 39","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, regulated by the kidneys and lungs to keep blood pH in a very narrow range. Liam's bicarbonate of 31.6 is marginally above the upper limit of 31. This trivial elevation may reflect a mild metabolic alkalosis, potentially from high training volume (heavy exercise can shift acid-base balance) or dietary alkalinity. It is not clinically significant at this margin and does not require action.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretic use, high training volume","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5088","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/L","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction and heart rhythm. Liam's calcium of 2.38 is within the optimal range, and his corrected calcium matches at 2.38, indicating healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","descrip y the kidneys that is not affected by muscle mass, making it more accurate than creatinine-based eGFR in athletic individuals. Liam's Cystatin C eGFR of 116 confirms excellent kidney function, exactly as expected at 32.","low_causes":"Kidney disease, medications, aging","high_causes":"Normal finding in young adults","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3364","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells at a constant rate and filtered by the kidneys. Unlike creatinine, its level is not influenced by muscle mass, age or diet, making it the most accurate single marker of kidney function. Liam's Cystatin C of 0.74 is excellent.","low_causes":"Normal finding","high_causes":"Kidney impairment, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"116","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9667","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and Cystatin C for the most accurate estimate of kidney function. Liam's combined eGFR of 116 is excellent, confirming that his kidneys are filtering at full capacity.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Normal finding in young adults","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key position":"0.5714","units":"ratio","description":"The albumin to globulin ratio reflects the balance between liver-produced albumin and immune-produced globulin. Liam's ratio of 1.17 is within the normal range but below the optimal band of 1.3 to 2.0, driven by the globulin sitting at the upper boundary. This is consistent with the raised immunoglobulins and is not independently concerning.","low_causes":"Elevated globulins from infection, inflammation, autoimmune disease, liver disease","high_causes":"Immune deficiency, malnutrition","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3905","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones and bile ducts. It rises with bile duct obstruction, bone turnover or liver disease. Liam's ALP of 58 is within the optimal range, confirming no bile duct or bone pathology.","low_causes":"Zinc deficiency, hypothyroidism, malnutrition","high_causes":"Bile duct obstruction, bone disease, liver disease, Paget's disease, growth","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes it for excretion. Liam's bilirub s a more favourable balance. Liam's ratio of 0.57 is within the optimal range and below the 0.7 low-risk threshold for a male, confirming an excellent balance between harmful and protective lipid particles.","low_causes":"High HDL, low LDL, excellent metabolic health","high_causes":"High LDL, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined cholesterol particle that is a potent independent risk factor for cardiovascular disease. Unlike LDL, it cannot be meaningfully changed by diet or exercise; its level is set by genetics and stays roughly the same throughout life. Liam's Lp(a) is below 25, well within the normal threshold of 32. This is genuinely useful information because it means his excellent LDL and ApoB levels are not being offset by an inherited particle he cannot control. This result is worth recording as a permanent part of his medical record, as it only needs to be measured once.","low_causes":"Genetic variation (favourable)","high_causes":"Genetic variation (inherited, unchangeable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdlratio","name":"Triglyceride:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1700","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"","description":"The triglyceride to HDL ratio is a proxy for insulin resistance and small dense LDL particles. A low ratio indicates excellent insulin sensitivity and large, buoyant LDL particles, which are less harmful. Liam's ratio of 0.51 is within the optimal range of below 0.9, confirming excellent metabolic health.","low_causes":"High insulin sensitivity, lean body composition, excellent diet","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is the cholesterol carried in triglyceride-rich lipoproteins after they have delivered their triglyceride cargo. It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is an independent risk factor for cardiovascular disease. Liam's remnant cholesterol of 0.34 is within the optimal range of below 0.5, consistent with his excellent triglycerides and insulin sensitivity.","low_causes":"Low triglycerides, excellent metabolic health","high_causes":"Insulin resistance, high triglycerides, obesity, post-meal elevation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"1.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2967","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This adjusts the LDL cholesterol by
