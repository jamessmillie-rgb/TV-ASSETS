nt metabolic health","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"3.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7050","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a simple measure of the balance between the innate immune response (neutrophils) and the adaptive immune response (lymphocytes). Liam's NLR of 3.23 is above the upper limit of 3, driven by his lymphocyte count of 1.13 sitting at the lower end of its range while his neutrophils are mid-range at 3.65. In context, this is consistent with the transient lymphocyte suppression seen with high training volume and chronic physical stress, and it is worth monitoring on retest rather than acting on in isolation.","low_causes":"Elevated lymphocytes, autoimmune conditions","high_causes":"Chronic stress, infection, inflammation, low lymphocytes from training","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"185.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6129","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet to lymphocyte ratio is an inflammatory index. Liam's PLR of 185.8 is within the normal range but above the optimal band of 80 to 160. This is driven by his lymphocyte count of 1.13, which sits at the lower end of its range, rather than by elevated platelets. It is consistent with the training-related lymphocyte suppression discussed elsewhere.","low_causes":"Elevated lymphocytes, low platelets","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"678","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7187","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index is calculated from neutrophils, platelets and lymphocytes and is used as a composite measure of the balance between inflammation and immune function. Liam's SII of 678 is above the normal range of 100 to 600. This is driven primarily by his lymphocyte count of 1.13 sitting at the lower end of its range, which inflates the ratio. In the context of his chronic hip inflammation and high training volume, this is consistent with the broader inflammatory and immune pattern seen in his ESR and IgM. It is not an independent finding but reinforces the need for the GP investigation recommended.","low_causes":"Strong immune function, low inflammation","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4100","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and muscle recovery. It is produced in the skin from sunlight and supplemented during autumn and winter in the UK. Liam's vitamin D of 82 is within the optimal range of 75 to 120, indicating adequate stores. Maintaining supplementation through winter will keep this in the optimal zone.","low_causes":"Insufficient sunlight, lack of supplementation, dark skin, obesity, malabsorption","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"856","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6135","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5557","upper_optimal_position":"0.6238","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. Liam's B12 of 856 is well within the optimal range of 500 to 900, indicating excellent intake and absorption.","low_causes":"Vegetarian or vegan diet, malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5952","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, vitamin B9, works alongside B12 for red blood cell production, DNA synthesis and homocysteine metabolism. Liam's folate of 14 is within the optimal range, indicating excellent dietary intake from green vegetables, legumes and whole grains.","low_causes":"Poor dietary intake, malabsorption, alcohol, pregnancy, medications","high_causes":"Supplementation, fortified foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4986","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3819","upper_optimal_position":"0.5803","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate balance by controlling calcium release from bones, absorption in the gut and retention by the kidneys. Liam's PTH of 1.6 is within the optimal range, indicating healthy calcium regulation and consistent with his normal calcium, phosphate and vitamin D levels.","low_causes":"High calcium, magnesium deficiency, post-thyroid surgery","high_causes":"Low calcium, vitamin D deficiency, kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"14.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3595","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3905","upper_optimal_position":"0.5714","units":"pmol/L","description":"FT4 is the free, unbound form of the main thyroid hormone thyroxine. It is produced by the thyroid gland and serves as the reservoir that the body converts into the active form, FT3. Liam's FT4 of 14.6 is within the laboratory range and just inside the lower end of the optimal band of 14 to 20. It is not low, but sitting in the lower quarter of the range in a 32-year-old suggests the thyroid output is not running at full capacity.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive levothyroxine","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4964","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3692","upper_optimal_position":"0.5160","units":"mIU/L","description":"TSH is the hormone sent from the pituitary gland to tell the thyroid how hard to work. When the thyroid is underperforming, the pituitary raises TSH to push it harder. Liam's TSH of 2.65 is within the laboratory range of 0.55 to 4.78 but above the optimal ceiling of 2.5. This is not significantly elevated, but in context with a lower-end FT4 and a below-optimal FT3, it suggests the pituitary is having to push slightly harder to maintain thyroid output. Both antibody tests are negative, so this is not autoimmune.","low_causes":"Hyperthyroidism, pituitary dysfunction, excessive thyroid medication","high_causes":"Hypothyroidism, early thyroid failure, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3519","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3 is the active form of thyroid hormone, the one that cells actually use to regulate metabolism, energy production, body temperature, heart rate and recovery. Most FT3 is produced by converting FT4 in the liver, kidneys and muscles. Liam's FT3 of 3.4 is within the broad laboratory range of 2.6 to 7.1 but well below the optimal range of 4.5 to 6.5. This is the most significant thyroid finding in this report. A low FT3 in a lean, young man with adequate iodine and no thyroid antibodies most commonly reflects a downregulation of the conversion process under physiological stress, whether from high training volume, chronic pain, inadequate caloric intake or a combination. FT3 directly affects energy levels, exercise recovery, libido and mood, making it highly relevant to his symptoms.","low_causes":"High training volume, chronic illness, caloric restriction, low T3 syndrome, selenium or zinc deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced when the immune system mistakenly attacks the thyroid gland, as seen in Hashimoto's thyroiditis. Liam's TPO antibodies are below 6.6, well within the normal range of below 13.8, confirming no autoimmune thyroid disease. This is important context for his below-optimal FT3, as it confirms the reduced thyroid conversion is functional rather than autoimmune.","low_causes":"Normal finding, no autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies, like TPO antibodies, indicate autoimmune attack on the thyroid. More than 80% of the population have undetectable levels. Liam's result of below 1.3 is clearly negative, further confirming no autoimmune thyroid disease.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.233","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3773","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the storage hormone FT4 into the active hormone FT3. Liam's ratio of 0.233 is within the laboratory range but below the optimal band of 0.27 to 0.4, confirming that the conversion process is running below its potential. This is driven by the low FT3 of 3.4 and is the key thyroid finding to monitor. Selenium and zinc support this conversion, and reducing the total stress burden on the body, whether from training, pain or caloric underfunding, should improve it.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"410","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4701","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4486","upper_optimal_position":"0.5817","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and falling through the day. Liam's cortisol of 410 is within the optimal morning range, sitting in the upper half. In the context of very high training intensity and chronic hip pain, a cortisol in the upper half of normal is not surprising and reflects the body's response to sustained physical stress.","low_causes":"Adrenal insufficiency, pituitary dysfunction, overtraining burnout","high_causes":"Chronic stress, high training volume, Cushing's syndrome, pain, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3593","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the most potent oestrogen, important in men for bone health, brain function and cardiovascular protection. In males, it is produced by the aromatase enzyme converting testosterone to oestradiol. Liam's oestradiol of 105 is within the optimal range for a male, indicating a healthy testosterone-to-oestradiol balance.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"Obesity, high body fat, liver disease, aromatase excess, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.91","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3700","upper_optimal_position":"0.5700","units":"nmol/L","description":"Progesterone in men is a precursor hormone used to produce cortisol and testosterone. Liam's progesterone of 0.91 is just inside the lower limit of 0.89 and below the optimal range. In men, a low progesterone is not clinically significant on its own but adds to the picture of the hormonal axis running at a lower output. It does not require specific action.","low_causes":"Low precursor production, adrenal stress","high_causes":"Adrenal hyperplasia, exogenous progesterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"1.42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2946","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4615","upper_optimal_position":"0.5385","units":"mIU/ml","description":"LH is a pituitary hormone that signals the testes to produce testosterone. Liam's LH of 1.42 is marginally below the lower limit of 1.5. A low LH alongside a below-optimal testosterone indicates that the pituitary gland is not driving testosterone production as hard as expected. This is not the pattern of testicular failure, where LH would be high; it is central suppression, meaning the brain is reducing the signal. Common causes in a young, lean, heavily training man include high training stress, chronic pain, cortisol-mediated suppression, and caloric intake that is not fully matching training output.","low_causes":"High training stress, chronic pain, caloric restriction, pituitary dysfunction, high prolactin, anabolic steroid use","high_causes":"Testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5179","units":"mIU/ml","description":"FSH is the pituitary hormone that stimulates sperm production in the testes. Liam's FSH of 3.8 is within the optimal range, indicating normal sperm production signalling and no testicular concern.","low_causes":"Pituitary dysfunction, anabolic steroid use, high prolactin","high_causes":"Testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4091","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, driving muscle mass, bone density, libido, mood, energy and red blood cell production. Liam's testosterone of 15 is within the laboratory range of 8.4 to 28.7 and above the recommended minimum of 12, but it is below the optimal range of 18 to 30. In a 32-year-old training seven days a week with a high-quality diet, a testosterone of 15 is lower than expected. Combined with the low LH of 1.42, this suggests central suppression from the combined burden of high training volume, chronic hip pain and the resulting physiological stress. This is directly relevant to his low libido, poor recovery and difficulty building muscle.","low_causes":"Overtraining, chronic pain, stress, caloric restriction, poor sleep, obesity, pituitary dysfunction","high_causes":"Exogenous testosterone, anabolic steroid use, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"194","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3409","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4394","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a pituitary hormone that, in men, is primarily relevant because elevated levels can suppress LH and testosterone production. Liam notes a history of elevated prolactin. On this sample, his prolactin of 194 is well within the normal range of 45 to 375 and within the optimal band, so it is not currently suppressing his testosterone. This is reassuring, though worth rechecking if LH remains low on retest.","low_causes":"Dopamine agonist medication","high_causes":"Pituitary adenoma, stress, medications (antipsychotics, antidepressants), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"34.48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3706","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is not bound to SHBG and is therefore biologically available. Liam's FAI of 34.48 is within the laboratory range but below the optimal band of 50 to 120, consistent with his below-optimal total testosterone. The SHBG of 43.5 is mid-range and not excessively binding testosterone; the issue is the total testosterone being lower than expected.","low_causes":"Low testosterone, high SHBG, overtraining, caloric restriction","high_causes":"High testosterone, low SHBG, obesity, insulin resistance, PCOS (female)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA Sulphate","group":"HORMONES","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3602","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4.0","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6087","upper_optimal_position":"0.5069","units":"umol/L","description":"DHEA-S is a precursor hormone produced by the adrenal glands that the body converts into testosterone and oestrogen. Liam's DHEA-S of 3.9 umol/L (approximately 1,437 ug/dL) is within the laboratory range but just below the optimal floor of 4.0 umol/L. In context, this is consistent with the overall pattern of the hormonal axis running at a slightly lower output. DHEA-S declines with age from the mid-twenties, but at 32 with high training intensity, this value is slightly lower than ideal and adds to the picture of adrenal and hormonal conservation.","low_causes":"Chronic stress, adrenal insufficiency, high training volume, aging","high_causes":"Adrenal hyperplasia, adrenal tumour, PCOS (female)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"43.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5138","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3838","upper_optimal_position":"0.5778","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, reducing their biological availability. A very high SHBG can leave too little free testosterone for the body to use. Liam's SHBG of 43.5 is within the optimal range of 25 to 55, indicating that SHBG is not excessively bind // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
