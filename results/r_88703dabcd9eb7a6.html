idney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"61","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2991","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product of muscle metabolism filtered by the kidneys. At 61, this is marginally below the 65 lower limit. In a 30-year-old man with no resistance training, this reflects low muscle mass rather than kidney pathology. The Cystatin C eGFR of 101 confirms that kidney filtration is completely normal. Creatinine will rise naturally as muscle mass increases with resistance training.","low_causes":"Low muscle mass, low protein diet, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys are filtering waste from the blood, calculated from creatinine, age, sex and ethnicity. At above 90, this is within the optimal range and indicates healthy kidney function. The Cystatin C-based eGFR at 101 provides a more precise confirmation.","low_causes":"Kidney disease, dehydration, medications, diabetes, hypertension","high_causes":"Low muscle mass, pregnancy, early diabetic nephropathy (hyperfiltration)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from Cystatin C rather than creatinine, making it more accurate in people with low or high muscle mass. At 101, this confirms excellent kidney function and resolves the marginally low creatinine by showing the kidneys are filtering precisely as expected for a 30-year-old.","low_causes":"Kidney disease, dehydration, diabetes, hypertension","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"338","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4288","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4885","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. At 338, this is within both the laboratory and optimal ranges. Elevated uric acid can cause gout and is associated with cardiovascular risk and insulin resistance, so this being well-controlled is a positive.","low_causes":"Low purine diet, medications, Wilson's disease","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.05","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4773","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function in people with low or high muscle mass. At 1.05, this is within the laboratory range of under 1.1 but above the 0.95 optimal threshold. The eGFR derived from it is 101, which is well within the normal and optimal range, confirming that kidney function is healthy. The slightly elevated Cystatin C value in isolation does not change the clinical picture.","low_causes":"Not typically clinically significant","high_causes":"Kidney disease, inflammation, thyroid disease, steroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and Cystatin C to give the most accurate estimate of kidney filtration. At 101, this is well above both the 60 normal threshold and the 90 optimal threshold, confirming excellent kidney function at 30 years of age. This is the most reliable kidney marker in this report because it corrects for the effect of low muscle mass on creatinine-based estimates.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"95.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6394","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps differentiate between causes of kidney impairment. At 95.1, this is within the laboratory range but above the 90 optimal ceiling. The slightly elevated ratio is explained by the low creatinine (from low muscle mass), which pushes the ratio up. With a normal urea and excellent eGFR, this is a mathematical effect rather than a clinical concern.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures low-grade systemic inflammation in the body. Unlike standard CRP which detects infection, hsCRP picks up the subtle background inflammation that drives cardiovascular disease, insulin resistance and metabolic dysfunction. At 1.3, this is within the laboratory range but above the 1.0 optimal threshold. Smoking is a well-established driver of hsCRP, and the combination of smoking, a BMI of 29.4 and insulin resistance likely accounts for this elevation. A level below 1.0 is the target.","low_causes":"Generally favourable; statins, weight loss, exercise","high_causes":"Smoking, obesity, insulin resistance, infection, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting liver synthetic function, immune function and nutritional status. At 72, this is within both the laboratory and optimal ranges.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome), malabsorption","high_causes":"Dehydration, chronic infection, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and drugs, and is a sensitive marker of liver health and nutritional status. At 44, this is within both the laboratory and optimal ranges, confirming healthy liver protein production.","low_causes":"Liver disease, malnutrition, kidney disease, inflammation, chronic illness","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin includes immunoglobulins (antibodies) and other proteins involved in immune function and transport. At 28, this is within both the laboratory and optimal ranges, reflecting a healthy immune protein balance.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5238","units":"IU/L","description":"ALP is an enzyme found in the liver, bones and bile ducts. At 49, this is near the lower end of the range, which is healthy and expected in a 30-year-old man whose bones have finished growing. No bile duct obstruction or bone disorder is suggested.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, liver disease, bone disorders, Paget's disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down and processed by the liver. At 14, this is within both the laboratory and optimal ranges, confirming healthy red cell turnover and liver processing.","low_causes":"Not typically clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1964","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT is a liver enzyme that leaks into the blood when liver cells are damaged or inflamed. At 22, this is well within both the laboratory range and the optimal ceiling of 30 for a man. This is a clean result, showing no liver cell damage from fat, alcohol, medication or viral causes.","low_causes":"Not typically clinically significant","high_causes":"Fatty liver disease, alcohol, viral hepatitis, medications, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3438","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4792","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. At 16, this is within both ranges and near the lower end, confirming no liver or muscle damage. The low AST is consistent with his low creatinine and low muscle mass from no resistance training.","low_causes":"Not typically clinically significant; vitamin B6 deficiency","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT (GGT)","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1644","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT is a liver enzyme particularly sensitive to alcohol use, bile duct issues and metabolic stress. At 24, this is within both the laboratory range and the optimal ceiling of 25, meaning the liver is handling its workload cleanly. At a BMI of 29.4 with a poor diet, a clean GGT is a positive finding worth acknowledging.","low_causes":"Not typically clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4962","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands to break down starch. At 59, this is within both ranges, ruling out pancreatic inflammation or damage.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4717","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. At 32, this is within both the laboratory and optimal ranges, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease, gallstones","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4678","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6088","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling and blood clotting. At 2.31, this is within both the laboratory and optimal ranges, confirming the body is maintaining calcium levels adequately despite the very low vitamin D.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, sarcoidosis, immobility","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration, giving a more accurate picture of true calcium availability. At 2.26, this is within the laboratory range but just below the 2.25 optimal threshold. The body is maintaining calcium within range, but the vitamin D deficiency at 29 and the PTH at the top of its range suggest the system is working hard to do so.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4178","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3581","upper_optimal_position":"0.5716","units":"mmol/L","description":"Phosphate works alongside calcium for bone health and is critical for energy production (ATP). At 1.0, this is within both ranges, reflecting healthy phosphate balance.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, antacid use","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5460","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic processes including energy production, muscle function, sleep regulation and insulin signalling. At 0.9, this is within both the laboratory and optimal ranges. Supplementing with magnesium glycinate before bed is still recommended for its sleep and insulin-sensitising benefits.","low_causes":"Poor dietary intake, alcohol, diuretics, diabetes, gastrointestinal losses","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2417","lower_normal":"50","upper_normal":"175","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, muscle strength and insulin sensitivity. At 29, this is deficient, sitting below the 30 nmol/L deficiency threshold. At a BMI of 29.4, fat tissue absorbs and holds vitamin D, reducing blood levels and meaning a higher supplementation dose is needed. This deficiency is very likely contributing to his fatigue, and the PTH at 4.0 near the top of its range is the body's compensatory response. Supplementation at 4,000 IU daily with a recheck in three months is recommended.","low_causes":"Insufficient sunlight, dark skin, obesity (fat sequesters vitamin D), poor dietary intake, malabsorption, kidney or liver disease","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5599","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5590","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate levels in the blood. When vitamin D or calcium is low, PTH rises to pull calcium from bones and increase its absorption. At 4.0, this is within the laboratory range but above the 3.5 optimal ceiling, sitting near the top of the reference range. This is the expected compensatory response to vitamin D deficiency at 29 nmol/L. The parathyroid is working harder than it should need to in order to maintain calcium levels. Correcting the vitamin D deficiency with supplementation will bring PTH back toward the ideal range.","low_causes":"Excess calcium, excess vitamin D, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, calcium deficiency, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"282","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3709","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4623","upper_optimal_position":"0.5859","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. At 282, this is within the laboratory range but well below the 500 optimal threshold. Suboptimal B12 can contribute to fatigue, brain fog and poor concentration, and may be contributing to his reported low energy. A diet rated 3 out of 10 with very low volume is the likely cause. Sublingual methylcobalamin supplementation is recommended.","low_causes":"Poor dietary intake (especially vegan/vegetarian), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) works alongside B12 for DNA synthesis, red blood cell production and nervous system function. At 9, this is above the 8 optimal floor, meaning folate levels are adequate. This is reassuring given the poor diet quality.","low_causes":"Poor dietary intake, alcohol, coeliac disease, medications (methotrexate), pregnancy","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of HDL, LDL, VLDL and other lipoproteins. At 4.8, this is below the 5.18 desirable limit and within the optimal range. However, total cholesterol alone is a blunt instrument. The more telling markers, ApoB and the individual fractions, are where the story lies in this report.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5206","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood used for energy storage. They rise after meals, particularly those high in refined carbohydrates, sugar and alcohol. At 1.77, this is above the 1.7 fasting limit, indicating the liver is exporting more fat into the bloodstream than ideal. Elevated triglycerides are closely linked to insulin resistance, and in this report the HOMA-IR of 1.82 confirms that connection. Reducing refined carbohydrates, increasing activity and losing body fat will bring triglycerides down.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, obesity, insulin resistance, alcohol, diabetes, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5128","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL is a lipoprotein produced by the liver that carries triglycerides to tissues for energy or storage. At 0.8, this is marginally above the 0.78 upper limit and reflects the elevated triglycerides. VLDL particles are converted to LDL particles in the bloodstream, so elevated VLDL contributes to the raised ApoB. This will improve as triglycerides come down through dietary change and exercise.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, insulin resistance, obesity, alcohol, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal. At 1.2, this is above the 1.04 low-risk threshold but below the 1.4 optimal for a man. HDL rises with regular exercise, moderate alcohol intake and weight loss, and falls with smoking, inactivity, insulin resistance and obesity, all of which are present. Resistance training and increased daily steps are the most effective ways to raise HDL.","low_causes":"Smoking, obesity, sedentary lifestyle, insulin resistance, high carbohydrate diet, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, medications (statins, niacin)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5258","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5400","units":"mmol/L","description":"LDL is the cholesterol carrier most strongly associated with atherosclerosis, the buildup of plaque in artery walls. At 2.89, this is within the laboratory range but above the 2.6 optimal target. In combination with the elevated ApoB, this tells us there are more atherogenic particles in the bloodstream than ideal. With Lp(a) below 25, the modifiable portion of LDL (Lp(a)-corrected LDL of 2.81) confirms this is almost entirely diet and lifestyle driven.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Diet high in saturated fat, obesity, familial hypercholesterolaemia, hypothyroidism, diabetes, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio summarises the balance between total and protective cholesterol. At 4.0, this is within the laboratory range of under 4.5 but above the 3.5 optimal target. The ratio is being driven by the below-optimal HDL of 1.2 rather than by an excessively high total cholesterol. Raising HDL through exercise will improve this ratio.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, obesity, smoking, inactivity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.625","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol indicates what proportion of your cholesterol is the protective type. At 25%, this is above the 20% minimum but below the 28% optimal threshold. As HDL rises with exercise and the modifiable lipid markers improve with diet, this percentage will increase.","low_causes":"Low HDL, smoking, obesity, inactivity, insulin resistance","high_causes":"High HDL, exercise, healthy weight, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.45","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic cholesterol fractions (LDL, VLDL and remnant). At 3.6, this is within the laboratory range of under 4 but above the 3.2 optimal target. It closely mirrors the ApoB finding and confirms there are more atherogenic particles than ideal.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, obesity, insulin resistance, diabetes, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles and reflects the body's production of protective lipoproteins. At 1.44, this is above both the 1.2 minimum and the 1.4 optimal threshold, meaning the body is producing HDL particles adequately. The issue is not insufficient protective particles but too many harmful ones (ApoB).","low_causes":"Smoking, obesity, sedentary lifestyle, genetic variants, liver disease","high_causes":"Exercise, moderate alcohol intake, genetics, medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single best blood marker for cardiovascular risk. Each atherogenic lipoprotein particle (LDL, VLDL, IDL, Lp(a)) carries exactly one ApoB molecule, so this number directly counts the particles that can enter artery walls and build plaque. At 1.02, this is above the 0.9 desirable threshold and classified as borderline high. With Lp(a) below 25, the vast majority of these particles are LDL driven by diet and lifestyle, not genetics. Reducing saturated fat, increasing soluble fibre, losing body fat and adding omega-3 fish oil are the most effective ways to lower ApoB.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet high in saturated fat, obesity, insulin resistance, familial hypercholesterolaemia, hypothyroidism, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5071","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is the single best summary of the balance between atherogenic (artery-damaging) and protective lipoproteins. At 0.71, this is marginally above the 0.7 lower-risk threshold, placing it in the average-risk category. It is being driven by the elevated ApoB rather than a low ApoA1. Bringing ApoB below 0.9 through the dietary and lifestyle changes described will pull this ratio into the low-risk zone.","low_causes":"Low ApoB, high ApoA1, exercise, healthy weight","high_causes":"High ApoB, low ApoA1, obesity, smoking, inactivity, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically inherited lipoprotein that adds to cardiovascular risk independently of LDL. Unlike LDL, it cannot be changed by diet, exercise or most medications. At below 25, this is comfortably under the 32 nmol/L threshold. This is genuinely useful information because it confirms that his entire elevated lipid picture, the ApoB, the LDL, the triglycerides, is driven by modifiable factors rather than genetics. His Lp(a) does not need to be tested again; it remains stable throughout life.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"188","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5095","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme released when muscle cells are damaged or stressed, whether from exercise, injury or disease. At 188, this is within both ranges, reflecting normal muscle turnover without excessive damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5060","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound form of thyroxine, the main hormone produced by the thyroid gland. At 17.3, this sits in the middle of the optimal range of 14 to 20, confirming the thyroid is producing adequate hormone output.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"0.95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3650","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4613","units":"mIU/L","description":"TSH is produced by the pituitary gland and acts as the thermostat for the thyroid. When thyroid hormone is low, TSH rises to stimulate more production; when it is high, TSH falls. At 0.95, this is within the laboratory range but just below the 1.0 optimal floor. With FT4 and FT3 both sitting in the optimal range and negative antibodies, this marginally low TSH is not a concern. The thyroid is simply operating efficiently, requiring minimal stimulation to produce adequate hormone.","low_causes":"Hyperthyroidism, pituitary disease, excessive thyroid medication, subclinical hyperthyroidism","high_causes":"Hypothyroidism, iodine deficiency, thyroiditis, pituitary tumour (rare)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5852","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active form of thyroid hormone that drives metabolism in cells. At 6.0, this sits comfortably within the 4.5 to 6.5 optimal range, meaning the body is converting T4 to T3 efficiently and cells are receiving adequate metabolic drive from the thyroid.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies target the thyroid peroxidase enzyme involved in thyroid hormone production. Elevated levels suggest the immune system is attacking the thyroid, which is the hallmark of autoimmune thyroid disease (Hashimoto's thyroiditis). At below 6.6, well under the 13.8 threshold, this rules out autoimmune thyroid disease.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target the protein used to produce thyroid hormones. At below 1.3, this is well under the 4.4 threshold and is undetectable in more than 80% of the population. Combined with negative TPO antibodies, autoimmune thyroid disease is ruled out.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.347","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5293","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio indicates how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.347, this is within both the laboratory and optimal ranges, confirming excellent thyroid hormone conversion. The thyroid is producing T4 and the body is activating it into T3 efficiently.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA (Total)","group":"PROSTATE","result":"0.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0300","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"ng/mL","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. It is used as a screening marker for prostate health, including benign enlargement and prostate cancer. At 0.15, this is extremely low and entirely reassuring at age 30.","low_causes":"Normal finding in younger men","high_causes":"Benign prostate enlargement (BPH), prostate cancer, prostatitis, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the unbound fraction of PSA. The ratio of free to total PSA helps distinguish between benign and malignant prostate conditions when total PSA is elevated. At 0.18 with a total PSA of 0.15, both are very low and entirely reassuring.","low_causes":"Normal finding","high_causes":"Benign prostate enlargement","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"PSA Ratio (Free:Total)","group":"PROSTATE","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The free to total PSA ratio helps interpret PSA results when they are elevated. A ratio above 0.19 (19%) is normal. At 1.2 (120%), this is high because both free and total PSA are so low. It is entirely reassuring and indicates no prostate concern.","low_causes":"May suggest prostate malignancy when PSA is elevated","high_causes":"Benign prostate health, very low total PSA","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"<1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic and gastrointestinal cancers. At below 1.2, this is extremely low and entirely reassuring.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, bile duct cancer, gastrointestinal cancers, pancreatitis, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA (Carcinoembryonic Antigen)","group":"TUMOR MARKERS","result":"<0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1087","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/mL","description":"CEA is a tumour marker used to monitor colorectal and other cancers. As a smoker, the reference range is wider (up to 4.1), but at below 0.5 this is extremely low regardless of smoking status and is entirely reassuring.","low_causes":"Normal finding","high_causes":"Colorectal cancer, lung cancer, breast cancer, pancreatic cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"9.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4684","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and provides the majority of antibody-based immunity against infections. At 9.8, this is within the laboratory range, reflecting a healthy adaptive immune system with adequate long-term antibody protection.","low_causes":"Immune deficiency, medications (immunosuppressants), protein loss","high_causes":"Chronic infections, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6133","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgM is the first antibody the immune system produces in response to a new infection. At 2.6, this is within the laboratory range, indicating no current acute infection and a healthy primary immune response.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5484","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/L","description":"IgA is the immunoglobulin that protects mucosal surfaces including the gut, lungs and urinary tract. At 2.4, this is within the laboratory range, confirming healthy mucosal immunity. Adequate IgA also validates the coeliac screening result (TTG-IgA), as IgA deficiency can cause false-negative coeliac tests.","low_causes":"Selective IgA deficiency, medications","high_causes":"Liver disease, autoimmune disease, chronic infections, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE (Total)","group":"IMMUNOLOGY","result":"103","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5150","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"75","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"IU/mL","description":"IgE is the immunoglobulin involved in allergic responses and parasite defence. At 103, this is marginally above the 100 upper limit, suggesting low-grade allergic sensitisation. This could be environmental (dust mites, pollen, pet dander, mould) or dietary. Smoking can increase IgE production by damaging the respiratory mucosa and increasing allergen exposure. If nasal congestion, skin irritation, eczema or breathing difficulties are present, allergy testing would be worthwhile.","low_causes":"Not typically clinically significant; immune deficiency (rare)","high_causes":"Allergies (environmental or food), asthma, eczema, parasitic infections, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"<4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody that can target the body's own tissues, and is associated with rheumatoid arthritis and other autoimmune conditions. At below 4, this is well within range and rules out rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"Normal finding","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infections, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA (Coeliac Screen)","group":"AUTOIMMUNE & CELIAC","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0243","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA (tTG-IgA) is the primary screening test for coeliac disease, an autoimmune condition where gluten triggers the immune system to damage the small intestine. At 0.35, this is negative and well below the 7.19 threshold, ruling out coeliac disease as a cause of fatigue or any digestive symptoms, provided the diet includes gluten.","low_causes":"Normal finding (negative for coeliac disease)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7652","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4722","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals and oxidative stress. At 1.91, this is above the 1.77 upper limit of the reference range. An elevated TAA is generally a positive finding, indicating robust antioxidant defences. It can be driven by dietary antioxidants, supplementation, or certain metabolites including uric acid and bilirubin. No action is needed.","low_causes":"Oxidative stress, poor dietary antioxidant intake, chronic disease, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, elevated uric acid or bilirubin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"423","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4784","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4036","upper_optimal_position":"0.6036","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. At 423, this is within both the laboratory and optimal ranges for a morning sample, indicating normal adrenal function and an appropriate stress response. There is no sign of adrenal fatigue or excess cortisol production.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic stress (late stage)","high_causes":"Acute stress, Cushing's syndrome, medications (prednisolone), chronic illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"101","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3456","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the primary oestrogen in men, produced by the aromatase conversion of testosterone in fat tissue, the adrenal glands and the testes. At 101, this is within both the laboratory and optimal ranges but sits toward the higher end. In a man with a BMI of 29.4, excess fat tissue drives aromatase activity, converting testosterone to oestradiol. This contributes to the low total testosterone of 12.2. As body fat decreases, oestradiol will fall and testosterone will rise.","low_causes":"Low body fat, low testosterone, aromatase inhibitor use","high_causes":"Obesity (excess aromatase activity), liver disease, medications, testicular tumours (rare)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"2.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a minor role in balancing other hormones. At 2.63, this is within the laboratory range and is a normal finding in men.","low_causes":"Not typically clinically significant in men","high_causes":"Adrenal hyperplasia, testicular tumours (rare), medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"5.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5115","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mIU/mL","description":"LH is produced by the pituitary gland and signals the testes to produce testosterone. At 5.68, this is within both ranges, meaning the brain is sending a normal signal to the testes. The fact that LH is normal while testosterone is at the floor suggests the problem is not a pituitary failure but a testicular environment that is suppressing output, driven by metabolic factors (obesity, insulin resistance, smoking).","low_causes":"Pituitary disease, steroid use, opioids, severe illness","high_causes":"Primary testicular failure, Klinefelter syndrome, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"6.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4575","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3692","upper_optimal_position":"0.5671","units":"mIU/mL","description":"FSH is produced by the pituitary gland and in men stimulates sperm production in the testes. At 6.06, this is within both ranges, confirming normal pituitary signalling and ruling out primary testicular failure.","low_causes":"Steroid use, pituitary disease, opioids","high_causes":"Primary testicular failure, Klinefelter syndrome, aging","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"12.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3517","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, fat distribution, libido, mood, energy and cardiovascular health. At 12.2, this is within the laboratory range but right at the floor of the recommended level of 12, and well below the 18 optimal threshold for a 30-year-old man. This means his testes are producing roughly two-thirds of what his age predicts. The normal LH and FSH rule out a pituitary or primary testicular cause. The explanation is metabolic: excess body fat (aromatase conversion), insulin resistance (SHBG suppression), smoking (direct Leydig cell toxicity) and minimal exercise. This is expected to improve significantly with fat loss, resistance training, dietary improvement and smoking cessation. If it does not improve after three to six months of sustained lifestyle change, further investigation would be appropriate.","low_causes":"Obesity, insulin resistance, smoking, opioids, stress, ageing, pituitary disease, Klinefelter syndrome","high_causes":"Steroid use, testosterone therapy, testicular tumour (rare), adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"240","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5303","lower_normal":"45","upper_normal":"375","lower_optimal":"80","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6515","units":"uIU/mL","description":"Prolactin is a pituitary hormone primarily involved in lactation in women, but in men elevated levels can suppress testosterone and cause sexual dysfunction. At 240, this is within both the laboratory and optimal ranges, ruling out prolactinoma (a pituitary tumour) as a cause of the low testosterone.","low_causes":"Not typically clinically significant; dopamine agonist medications","high_causes":"Prolactinoma, medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index (FAI)","group":"HORMONES","result":"103.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5380","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"140","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6389","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically active by dividing total testosterone by SHBG. At 103.4, this is within range, but the number is inflated by the very low SHBG of 11.8 rather than by high testosterone production. It means more testosterone is unbound and available to tissues, which partially compensates for the low total production, but does not mean testosterone production is healthy.","low_causes":"High SHBG, low testosterone, hypogonadism","high_causes":"Low SHBG, insulin resistance, obesity, PCOS (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2248.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4882","lower_normal":"162.1","upper_normal":"4939.9","lower_optimal":"500","upper_optimal":"4000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4040","upper_optimal_position":"0.6135","units":"ug/dL","description":"DHEA-S is an adrenal hormone that serves as a precursor to both testosterone and oestrogen. The lab reported 6.1 umol/L, which converts to approximately 2,249 ug/dL. At this level, DHEA-S is within both the laboratory and optimal ranges, confirming healthy adrenal function and adequate precursor hormone supply.","low_causes":"Adrenal insufficiency, ageing, chronic illness, steroid use","high_causes":"Adrenal hyperplasia, adrenal tumour, PCOS (in women), stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"11.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2473","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3860","upper_optimal_position":"0.5921","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, regulating how much of each is free and available to tissues. At 11.8, this is well below the 17.3 lower limit. Low SHBG is strongly associated with insulin resistance, hyperinsulinaemia, visceral fat and metabolic syndrome, and is considered an independent risk factor for type 2 diabetes. When SHBG is this low, more testosterone circulates freely (explaining the normal free testosterone and elevated FAI despite low total testosterone), but the root cause, insulin resistance and excess body fat, needs addressing. SHBG will rise naturally as insulin resistance improves with diet, exercise and fat loss.","low_causes":"Insulin resistance, obesity, type 2 diabetes, hypothyroidism, medications (androgens, insulin)","high_causes":"Ageing, liver disease, hyperthyroidism, eating disorders, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.3749","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5296","lower_normal":"0.138","upper_normal":"1.04","lower_optimal":"0.2","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4049","upper_optimal_position":"0.5569","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to SHBG or albumin, and is the portion directly available to cells. At 0.375, this is within both the laboratory and optimal ranges. However, this normal reading is driven by the very low SHBG of 11.8 leaving more testosterone unbound, rather than by healthy total production. It means tissues are receiving adequate testosterone for now, but the underlying production issue (total testosterone at 12.2) should still be addressed.","low_causes":"Low total testosterone, high SHBG, ageing","high_causes":"Low SHBG, high total testosterone, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"8.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6657","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone measures the testosterone available to tissues, including both the free fraction and the loosely albumin-bound fraction. At 8.98, this sits at the very top of its range, but this is inflated by the critically low SHBG of 11.8 rather than by genuinely high testosterone production. It means tissues are seeing adequate testosterone for now, but this is a compensatory state driven by low SHBG, and as SHBG normalises with metabolic improvements, bioavailable testosterone may initially appear to drop before stabilising at a healthier equilibrium.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"8.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is unbound and biologically active, calculated from oestradiol and SHBG. At 8.56, this is reported for context and is not applicable as a standalone diagnostic marker at present. The elevated value reflects the very low SHBG leaving more oestradiol unbound, consistent with the metabolic pattern described throughout this report.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio (NLR)","group":"INFLAMMATION","result":"1.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a simple marker of systemic inflammation and immune balance. It is calculated by dividing neutrophils by lymphocytes. At 1.16, this is within both the laboratory and optimal ranges, reflecting low systemic stress and a balanced immune response.","low_causes":"Not typically clinically significant","high_causes":"Bacterial infection, chronic inflammation, physiological stress, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"95.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4127","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio is another marker of systemic inflammation. At 95.7, this is within both the laboratory and optimal ranges, confirming low systemic inflammatory activity from a cellular immune perspective.","low_causes":"Not typically clinically significant","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"261","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4407","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets and lymphocytes into a single index of systemic inflammation and immune activation. At 261, this is within both the laboratory and optimal ranges, indicating a well-balanced immune and inflammatory status.","low_causes":"Immune suppression, bone marrow dysfunction","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tghdlratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4933","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a strong surrogate marker for insulin resistance and atherogenic small-dense LDL particles. It is calculated by dividing triglycerides by HDL. At 1.48, this is within the laboratory range of under 1.5 but well above the 0.87 optimal threshold. This ratio is being driven by both the elevated triglycerides of 1.77 and the below-optimal HDL of 1.2, and correlates closely with the HOMA-IR of 1.82 and insulin resistance pattern. Both exercise and dietary changes will improve this ratio.","low_causes":"Low triglycerides, high HDL, good insulin sensitivity","high_causes":"High triglycerides, low HDL, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4438","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, and represents the cholesterol carried by triglyceride-rich remnant particles (VLDL and IDL). At 0.71, this is within the laboratory range of under 0.8 but above the 0.5 optimal target. Elevated remnant cholesterol is independently atherogenic and is driven by the same insulin resistance and triglyceride excess seen elsewhere in this report. It will improve as triglycerides come down.","low_causes":"Low triglycerides, good metabolic health","high_causes":"High triglycerides, insulin resistance, type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"2.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4683","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL subtracts the cholesterol contributed by Lp(a) particles from the total LDL, showing the modifiable portion of LDL driven by diet and lifestyle. At 2.81, this is within the laboratory range but above the 2.0 optimal target. With Lp(a) below 25, almost all of the LDL is modifiable, confirming that dietary change and fat loss are the levers to pull.","low_causes":"Healthy diet, exercise, medications (statins)","high_causes":"Diet high in saturated fat, familial hyperch   if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}
