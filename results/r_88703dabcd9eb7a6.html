<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Ezzadeen Kalede Ahmad Nassr","dob":"30/05/1996","report_date":"2026-09-30","summary":"Ezzadeen is a 30-year-old male presenting with a BMI of 29.4, following a standard mixed diet rated 3 out of 10 for quality with a volume of 1 out of 10. He trains once per week with one cardio session and no resistance training, averaging 2,000 to 5,000 daily steps. He smokes tobacco. He reports low energy and fatigue. His goal is to lose body fat.\n\nThe finding that needs attention first is his Cardiovascular Risk Score, which sits at 80 out of 100. This is a composite index built from his lipid markers, inflammatory marker and blood sugar control, and at 80 it places him well above the threshold of 40 where intervention is recommended. At 30, his ten-year risk of a cardiovascular event remains statistically low, but the score tells us that the biological machinery behind cardiovascular disease, the process of cholesterol being deposited into artery walls, is already active and building. The gap between a low ten-year risk and a high biological risk score is the window he has to act, and it is a wide window at his age. The markers driving this score are his ApoB at 1.02 g/L, which is above the 0.9 threshold, his triglycerides at 1.77 mmol/L, which are above the 1.7 fasting limit, his HDL at 1.2 mmol/L, which is below the 1.4 ideal for a man, and his hsCRP at 1.3 mg/L, which sits above the 1.0 optimal ceiling for background inflammation. His ApoB is a measure of the number of cholesterol-carrying particles in the bloodstream, and it is the single best predictor of whether cholesterol is being pushed into artery walls. At 1.02, he has more particles circulating than his arteries need to deal with. His LDL cholesterol at 2.89 is within the laboratory range but above the 2.6 optimal target, and when corrected for his Lp(a) contribution, the modifiable portion sits at 2.81, meaning almost all of his LDL is driven by diet and lifestyle rather than genetics. His Lp(a), a genetically inherited lipoprotein that adds to cardiovascular risk and cannot be changed by diet or exercise, is below 25 nmol/L, comfortably under the 32 threshold. This is genuinely useful information because it confirms that his entire lipid picture is modifiable. His VLDL at 0.8 is marginally above the 0.78 limit, reflecting the triglyceride excess. His ApoB to ApoA1 ratio, which summarises the balance between harmful and protective lipoproteins, is 0.71, just above the 0.7 lower-risk threshold. His ApoA1 itself at 1.44 is healthy, meaning his body is producing protective particles adequately, but his HDL is not high enough to clear the excess LDL particles. Taken together, this is a lipid profile that is not dangerous today but is heading in the wrong direction, and at 30 with a diet rated 3 out of 10, smoking, minimal exercise and a BMI approaching 30, every one of these numbers is within his control.\n\nHis SHBG is 11.8 nmol/L, well below the lower limit of 17.3. SHBG is sex hormone binding globulin, the protein that carries testosterone in the blood and regulates how much is available to tissues. When SHBG is this low, more testosterone circulates freely, which sounds beneficial but is actually a metabolic warning signal. Low SHBG at this level is strongly associated with insulin resistance, visceral fat accumulation and future risk of type 2 diabetes. His HOMA-IR, which is a calculation combining fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin, is 1.82, above the 1.5 upper limit and approaching the 1.9 threshold where early insulin resistance is formally recognised. His fasting insulin at 8.38 is within the laboratory range but above the 8.0 optimal ceiling, and his fasting glucose at 4.9 is healthy. What this pattern tells us is that his pancreas is having to produce slightly more insulin than it should need to keep his glucose in check. The cells are beginning to resist the signal, and the low SHBG is the liver's response to the rising insulin, because insulin suppresses SHBG production. His HbA1c at 40 mmol/mol, which reflects average blood sugar over the preceding three months, is within the normal range but above the 36 optimal threshold, consistent with glucose spending more time elevated after meals than it should. His C-Peptide at 1.28 ug/L, which converts to 423 pmol/L, is within range and confirms the pancreas is producing insulin normally. This is not diabetes and it is not pre-diabetes, but it is the metabolic drift that precedes both, and at 30 it is entirely reversible with the changes outlined below.\n\nHis testosterone at 12.2 nmol/L is technically within the laboratory range of 8.4 to 28.7 but sits right at the floor of the recommended level of 12. For a 30-year-old man, this is below where it should be. The optimal range begins at 18, and at 12.2 he is producing roughly two-thirds of the testosterone his age would predict. His free testosterone at 0.375 nmol/L is within range, and his bioavailable testosterone at 8.98 is at the very top of its range, both inflated by the very low SHBG leaving more testosterone unbound. The free androgen index at 103.4 is similarly elevated because SHBG is the denominator. So while his tissues are seeing enough free testosterone for now, total production is low, and the reason is almost certainly the combination of excess body fat (which converts testosterone to oestradiol via an enzyme called aromatase), poor diet, smoking, low physical activity and the insulin resistance described above. His oestradiol at 101 pmol/L is within range but at the higher end, consistent with that aromatase activity. His cortisol at 423 nmol/L is within the morning reference range and does not suggest adrenal stress. LH at 5.68 and FSH at 6.06 are both within range, meaning the brain is signalling the testes normally, which points to the testes receiving the message but operating in a metabolic environment that suppresses their output. Prolactin at 240 is within range and DHEA-S at 6.1 umol/L is healthy. The testosterone picture is not one that requires medication at this stage. It is one that will improve significantly with fat loss, resistance training, better nutrition and stopping smoking.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 24.6, about 5 years younger than a calendar age of 30. This means we cannot give him a biological age comparison on this test.\n\nHis vitamin D at 29 nmol/L is deficient, sitting just below the 30 nmol/L deficiency threshold. Vitamin D is essential for bone health, immune function, mood regulation and muscle recovery, and at 29 he is running on empty. At a BMI of 29.4, fat tissue sequesters vitamin D, meaning he needs a higher supplementation dose than a lean individual to bring his levels up. This is very likely contributing to his fatigue. His PTH (parathyroid hormone, which rises when calcium or vitamin D are low to maintain calcium levels) is 4.0 pmol/L, sitting near the top of its 0.98 to 4.73 range, which is the expected compensatory response to vitamin D deficiency. His corrected calcium at 2.26 is within range, confirming the PTH is doing its job, but the system is under strain. His B12 at 282 pg/mL is within the laboratory range but below the 500 optimal threshold. B12 is critical for nerve function, red blood cell production and energy metabolism, and at 282 it may be contributing to his fatigue. His folate at 9 ng/mL is above the 8 optimal floor, which is adequate.\n\nHis IgE at 103 IU/mL is marginally above the 100 upper limit. IgE is the immunoglobulin the body produces in response to allergens, and a mildly elevated level like this suggests low-grade allergic sensitisation. This could be environmental (dust mites, pollen, pet dander) or dietary. It is not a dangerous finding at this margin, but if he experiences any nasal congestion, skin irritation, or respiratory symptoms, particularly given that he smokes, it would be worth discussing allergy testing with his GP.\n\nHis hsCRP at 1.3 mg/L is within the laboratory range of under 5 but above the 1.0 optimal ceiling. hsCRP measures background systemic inflammation, and at 1.3 this is a low-grade signal. Smoking alone can account for this, as tobacco drives a chronic inflammatory response throughout the vascular system. It is not alarming, but it is another marker that will improve when he stops smoking and improves his diet.\n\nTurning to the positives, and there are several important ones. His liver is in excellent health. ALT at 22 and GGT at 24 are both within the optimal range, AST at 16 is clean, bilirubin at 14 is healthy, and his FIB-4 score at 0.45, which screens for liver scarring, shows no sign of fibrosis whatsoever. The APRI at 0.178 and NAFLD Fibrosis Score at minus 2.91 both confirm a completely healthy liver. At a BMI approaching 30 with a poor diet, this is worth acknowledging because fatty liver disease is common at this weight and his liver shows no sign of it. His kidney function is strong. His Cystatin C at 1.05, which is a more accurate measure of kidney filtration than creatinine alone, gives a combined eGFR of 101, exactly where it should be at 30. His creatinine at 61 is marginally below the laboratory's lower limit of 65, but this reflects his low muscle mass from having no resistance training rather than any kidney problem, and the Cystatin C result confirms this. His uric acid at 338 is well within range. His thyroid is working well. TSH at 0.95 sits in the optimal zone of 1.0 to 2.5, just a fraction below it, with free T4 at 17.3 and free T3 at 6.0 both in the optimal range, and the FT3 to FT4 ratio at 0.35 confirming excellent conversion. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His iron studies are balanced, with ferritin at 101, transferrin saturation at 35.7%, serum iron at 21.6 and transferrin at 2.41, all sitting comfortably within both laboratory and optimal ranges. His full blood count is largely healthy. Haemoglobin at 159, red cell count at 5.49, haematocrit at 0.456 and platelets at 225 are all within range. His white cell count at 5.97 with a balanced differential, neutrophils at 2.73, lymphocytes at 2.35, monocytes at 0.52, eosinophils at 0.33 and basophils at 0.04, shows a healthy immune system. His neutrophil to lymphocyte ratio at 1.16 is in the optimal range, reflecting low systemic stress. Reticulocytes at 1.54% and 84.5 absolute show normal red cell production. ESR at 2 is as low as it gets, confirming the absence of significant inflammation. His immunoglobulins IgG, IgM and IgA are all within range, and coeliac screening is negative. His tumour markers are all reassuringly low, with PSA at 0.15, free PSA at 0.18, CA19-9 below 1.2 and CEA below 0.5. Creatine kinase at 188 is within range. His pancreatic enzymes, amylase at 59 and lipase at 32, are both healthy.\n\nRegarding his fatigue, the bloods offer two clear contributors: vitamin D deficiency at 29 and suboptimal B12 at 282. Beyond these, his insulin resistance pattern and low testosterone will both sap energy. However, the biggest drivers of his fatigue are likely the factors blood cannot measure: a diet rated 3 out of 10 with a volume of only 1 out of 10 means he is eating poorly and very little of it. Undereating at this level starves the body of the raw materials for energy production. Smoking impairs oxygen delivery to every cell. One cardio session a week with no resistance training and under 5,000 steps means his body has very little stimulus to produce energy efficiently. The prescription here is not a supplement but a fundamental change in how he eats, moves and treats his lungs.\n\nHis MCV at 82.9 is marginally below the 83 lower limit, and his MCHC at 348 is marginally above the 345 upper limit. Both are within the range where laboratory temperature and sample storage can cause minor shifts, as the lab itself notes. At this margin, with haemoglobin, MCH, iron studies and reticulocytes all normal, neither finding is clinically significant. His total antioxidant activity at 1.91 is above the 1.77 upper limit, which is a favourable finding reflecting adequate antioxidant capacity. His urinalysis shows a trace of protein, which at this level in a young man is most commonly a benign finding related to exercise or dehydration and does not require action unless it persists. All other urinary markers are clear.","links":"The thread running through this report is a metabolic pattern driven by lifestyle. Ezzadeen is 30 with a BMI of 29.4, eating a diet he rates 3 out of 10 for quality at a volume of 1 out of 10, smoking, doing almost no physical activity, and reporting fatigue as his primary symptom. The blood results confirm that his body is responding to these inputs in exactly the way physiology predicts.\n\nThe central finding is early insulin resistance. His HOMA-IR at 1.82, fasting insulin at 8.38 and HbA1c at 40 form a consistent picture of cells that are beginning to resist insulin's signal, forcing the pancreas to work harder to maintain a normal glucose of 4.9. The low SHBG at 11.8 is not an independent finding; it is a downstream consequence of the rising insulin, because insulin directly suppresses the liver's production of SHBG. And the low SHBG in turn explains why his total testosterone at 12.2 looks worse than his free testosterone at 0.375: there is less binding protein, so a larger fraction circulates freely, masking the fact that total production is genuinely low for his age. The low testosterone itself is driven by excess body fat converting testosterone to oestradiol via aromatase, by smoking which directly damages Leydig cell function, and by the insulin-resistant metabolic environment which suppresses testicular output even when LH signalling from the brain is normal, which it is.\n\nThe lipid picture connects to the same root. Triglycerides at 1.77 are elevated because the liver is exporting more VLDL particles when insulin is high and the diet contains excess refined carbohydrate. The elevated VLDL at 0.8 and the raised ApoB at 1.02 are both consequences of this overproduction. HDL at 1.2 is below ideal because HDL rises with exercise and falls with smoking, insulin resistance and inactivity, all of which are present. The Cardiovascular Risk Score of 80 is not being driven by genetics. His Lp(a) is below 25, meaning every particle of risk in his lipid panel is modifiable.\n\nThe vitamin D deficiency at 29 and the suboptimal B12 at 282 are partly dietary, reflecting a diet that is both poor in quality and extremely low in volume. The vitamin D deficiency is worsened by his body composition, as fat tissue absorbs and holds vitamin D, reducing the amount available in the bloodstream. The elevated PTH at 4.0 is the body's compensation for the low vitamin D, not a separate problem.\n\nWhat was excluded matters. His liver is completely clean despite a BMI approaching 30 and a poor diet, meaning fatty liver has not yet developed. His thyroid is optimal, ruling out hypothyroidism as a cause of his fatigue or weight. His iron stores are healthy, ruling out anaemia. His kidney function is strong. His coeliac screen is negative. His tumour markers and prostate are clear. His immune system is balanced aside from a mildly elevated IgE suggesting some allergic sensitisation. There is no systemic inflammatory disease, no autoimmune process and no hormonal condition that explains his symptoms independently of his lifestyle.\n\nThe one loose end is the mildly elevated IgE at 103. This could reflect environmental allergen exposure, which smoking can potentiate by damaging the respiratory mucosa and increasing sensitisation. It is worth investigating with allergy testing if he has respiratory or skin symptoms, but it does not connect to the metabolic pattern above.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, chicken or beans. Anchor: before anything else goes on the plate. Why: protein blunts the insulin spike behind your HOMA-IR of 1.82, supports testosterone production, and will help preserve muscle while you lose fat. Aim for at least 104 to 128 grams of protein a day.\nEat three proper meals a day rather than skipping or grazing. Your diet volume is 1 out of 10, which means your body is chronically underfuelled despite carrying excess fat. Undereating slows your metabolism, drops testosterone and worsens fatigue. Aim for 1,800 to 2,000 calories a day to lose fat steadily at your weight without starving your hormones.\nSwap sugary drinks, white bread, pastries and fried food for oats, wholegrain bread, rice with vegetables and fruit. Anchor: one swap per week, starting with whatever you eat most often. Why: your triglycerides at 1.77 and VLDL at 0.8 are being driven by refined carbohydrate and poor fat quality, and your ApoB of 1.02 will respond to this change.\nWalk for 20 minutes after your largest meal every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk directly lowers the glucose and insulin response to that meal, which is the mechanism behind your HOMA-IR of 1.82, and will add 2,000 to 3,000 steps to your daily count.\nBegin two resistance training sessions per week, even bodyweight exercises at home: press-ups, squats, lunges, rows with a bag. Anchor: fixed days, same time. Why: resistance training is the single most powerful stimulus for improving insulin sensitivity, raising testosterone, building the muscle your low creatinine of 61 reflects you are lacking, and raising HDL.\nStop smoking. This is the hardest change in the report and the most consequential. Smoking is driving your hsCRP of 1.3 upward, suppressing your HDL, damaging your testosterone production, impairing your oxygen delivery and worsening your cardiovascular risk score of 80. Speak to your GP about nicotine replacement or cessation support.\nGet outside within an hour of waking for ten minutes of daylight. Anchor: part of your walk or commute. Why: morning light sets your circadian rhythm, improves sleep quality and energy, and your vitamin D of 29 means you need every minute of sun exposure you can get alongside supplementation.\nSet a caffeine cut-off at 1pm if you drink coffee or energy drinks. Why: caffeine after early afternoon delays sleep onset by up to 40 minutes, and poor sleep worsens insulin resistance, lowers testosterone and deepens the fatigue you are reporting.","flags":"SHBG 11.8 nmol/L, below the lower limit of 17.3. Strongly associated with insulin resistance and visceral fat accumulation. At 30, this is a metabolic warning sign rather than a hormonal one. Connects to the HOMA-IR and testosterone findings. Recommend discussing with GP.\nTestosterone 12.2 nmol/L, at the floor of the recommended level of 12 and well below the 18 optimal threshold for a 30-year-old. LH and FSH are normal, pointing to a metabolic cause (BMI, smoking, insulin resistance) rather than a primary testicular or pituitary problem. Retest after 3 to 6 months of lifestyle change before considering further investigation.\nHOMA-IR 1.82, above the 1.5 upper optimal limit, approaching the 1.9 early insulin resistance threshold. Fasting insulin 8.38 mIU/L (above 8.0 optimal), fasting glucose 4.9 (healthy), HbA1c 40 mmol/mol (within range but above 36 optimal), C-Peptide 423 pmol/L (within range). Early insulin resistance pattern driven by BMI, diet and inactivity. Reversible with lifestyle change.\nApoB 1.02 g/L, above the 0.9 desirable threshold. ApoB:ApoA1 ratio 0.71, marginally above the 0.7 lower-risk cut-off. Triglycerides 1.77 mmol/L, above the 1.7 fasting limit. VLDL 0.8, marginally above 0.78. HDL 1.2, below the 1.4 male optimal. LDL 2.89, within range but above 2.6 optimal. Lp(a) below 25 (normal), confirming the entire lipid pattern is modifiable. Cardiovascular Risk Score 80/100, driven by ApoB, triglycerides, HDL and hsCRP.\nVitamin D 29 nmol/L, deficient (below 30). PTH 4.0 pmol/L, near the top of range (0.98 to 4.73), reflecting compensatory response to vitamin D deficiency. Requires supplementation at a higher dose due to BMI.\nVitamin B12 282 pg/mL, within laboratory range (193 to 982) but below the 500 optimal threshold. May be contributing to fatigue. Recommend sublingual methylcobalamin supplementation.\nhsCRP 1.3 mg/L, within laboratory range but above the 1.0 optimal threshold. Low-grade systemic inflammation, likely driven by smoking and metabolic stress.\nIgE 103 IU/mL, marginally above the 100 upper limit. Suggests low-grade allergic sensitisation. Consider allergy testing if respiratory or skin symptoms are present.\nMCV 82.9 fL, marginally below the 83 lower limit. MCHC 348 g/L, marginally above the 345 upper limit. Both within the range where sample temperature and storage can affect results. With normal haemoglobin, MCH, iron studies and reticulocytes, neither is clinically significant.\nCreatinine 61 umol/L, marginally below the 65 lower limit. Reflects low muscle mass from no resistance training rather than kidney pathology. Cystatin C eGFR of 101 confirms normal kidney function.\nReassuring negatives: liver completely clear (ALT 22, GGT 24, FIB-4 0.45, APRI 0.18, NAFLD score minus 2.91), thyroid optimal with negative antibodies, iron studies balanced, kidney function strong (combined eGFR 101), coeliac negative, PSA 0.15, tumour markers clear, ESR 2, no autoimmune markers, urine culture no growth.","recommendations":"Discuss the early insulin resistance pattern with your GP: HOMA-IR 1.82, fasting insulin 8.38, HbA1c 40, SHBG 11.8. Ask whether a repeat fasting glucose and insulin in six months is appropriate to track your response to lifestyle changes, and whether metformin should be considered if the pattern does not improve.\nDiscuss your lipid profile: ApoB 1.02, triglycerides 1.77, HDL 1.2, Cardiovascular Risk Score 80/100. With Lp(a) below 25, the entire pattern is modifiable through diet, exercise and smoking cessation. Ask your GP whether a repeat lipid panel in six months is sufficient or whether earlier intervention is warranted given the score.\nDiscuss your testosterone of 12.2 at age 30 with your GP. Given that LH and FSH are normal and the metabolic picture (insulin resistance, BMI 29.4, smoking) provides a clear explanation, the first step is lifestyle change with a retest in three to six months. If testosterone does not improve, further investigation including a morning repeat and possible endocrinology referral would be appropriate.\nAsk your GP about smoking cessation support: nicotine replacement therapy, varenicline or a referral to a stop-smoking service. Smoking is contributing to your hsCRP of 1.3, suppressed HDL of 1.2, low testosterone and elevated cardiovascular risk.\nMention the IgE of 103 if you have any nasal congestion, skin irritation, wheezing or respiratory symptoms. Your GP can arrange specific allergen testing (skin prick test or specific IgE panel) if indicated.\nStart vitamin D supplementation immediately at 4,000 IU daily (details in the supplementation section) and ask your GP to recheck vitamin D in three months to confirm levels are rising toward the 75 to 120 optimal range.\nCalorie target: 1,800 to 2,000 kcal per day for steady fat loss (maintenance estimated at approximately 2,300 kcal based on your weight, height and activity level, with a 300 to 500 kcal deficit). Protein target: 104 to 128 grams per day (1.3 to 1.6 g/kg). Retest in six months with a focus on HOMA-IR, HbA1c, fasting insulin, lipid panel with ApoB, testosterone, SHBG, vitamin D and B12.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. Why: your vitamin D is 29 nmol/L, which is deficient, and at a BMI of 29.4 you need a higher dose because fat tissue absorbs and holds vitamin D. Target: 75 to 120 nmol/L. Recheck in three months.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than arteries. Always pair with vitamin D supplementation.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 282 is below the 500 optimal threshold, and sublingual methylcobalamin bypasses any absorption issues in the gut. This may help with your fatigue.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (yours are 1.77, above the 1.7 limit), reduces the hsCRP inflammation signal (yours is 1.3) and supports HDL function. Choose a product that lists EPA and DHA separately on the label.\nMagnesium (glycinate): 300 mg before bed. Why: your magnesium at 0.9 is within range but magnesium glycinate supports sleep quality, insulin sensitivity and muscle recovery, all of which are relevant to your picture. The glycinate form is the least likely to cause digestive upset.\nThe most important changes from this report are not supplements. They are eating enough food of decent quality, beginning resistance training, stopping smoking and walking after meals. No supplement will fix a diet rated 3 out of 10 at a volume of 1 out of 10, and no supplement will reverse insulin resistance as effectively as movement and better nutrition.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 73.2; held to 59 by a system rated \"See your GP\". Weakest systems: vitamins & nutrients 48%, kidney function 57%, lipids & cardiovascular 57%. Biggest drags: Apolipoprotein B, Vitamin D 25(OH), Creatinine, Sex Hormone Binding Globulin (SHBG).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"24.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3514","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"80","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the biological risk being built, not the ten-year chance of an event. At 80, this is well above the 40 threshold and the 20 ideal ceiling, placing it in the high-risk category for ongoing arterial damage. At 30, his ten-year event risk remains statistically low, but the gap between that low event risk and this high biological score is the window for acting. The markers driving the score are ApoB at 1.02, triglycerides at 1.77, HDL at 1.2 and hsCRP at 1.3. With Lp(a) below 25, every driver is modifiable through diet, exercise, fat loss and smoking cessation.","low_causes":"Low ApoB, high HDL, low triglycerides, low hsCRP, low HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. At 4.9, this sits comfortably within both the laboratory and optimal ranges, meaning the body is maintaining healthy blood sugar control at the moment the sample was taken. This is a reassuring anchor point, though the insulin required to achieve it (see HOMA-IR) is the more telling part of the picture.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress response, medications (steroids), pancreatic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4462","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.45","units":"%","description":"HbA1c (percentage format) measures the proportion of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it, over the preceding two to three months. At 5.8%, this is below the 6.0% pre-diabetes threshold but above the optimal ceiling, indicating that blood sugar is spending more time elevated after meals than ideal. This aligns with the early insulin resistance pattern seen in the HOMA-IR result.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4762","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised measure of average blood sugar over the preceding two to three months. At 40, this is within the normal range of under 42 but above the 36 optimal threshold. It confirms that glucose is being managed but not ideally, consistent with the insulin resistance pattern. The target is to bring this below 36 through dietary change and increased activity.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate diet, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"8.38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4197","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3153","upper_optimal_position":"0.4751","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. At 8.38, this is within the laboratory range but just above the 8.0 optimal ceiling. The body is having to produce slightly more insulin than ideal to maintain a healthy glucose of 4.9, which is the hallmark of early insulin resistance. The pancreas is working harder than it should need to, and reducing that workload through diet and exercise is the priority.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, obesity, high carbohydrate diet, sedentary lifestyle, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"423.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4183","lower_normal":"364.1","upper_normal":"1456.4","lower_optimal":"364.1","upper_optimal":"1000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5249","units":"pmol/L","description":"C-Peptide is released in equal amounts to insulin when the pancreas produces it, making it a reliable measure of true insulin production unaffected by external insulin. The lab reported 1.28 ug/L, which converts to approximately 424 pmol/L. This is within range and confirms the pancreas is producing insulin normally. The issue is not production; it is the resistance of the cells to that insulin's signal.","low_causes":"Type 1 diabetes, low carbohydrate intake, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type
