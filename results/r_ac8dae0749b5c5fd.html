0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Higher levels are associated with better cardiovascular protection. Sam's result of 1.52 is above the desirable threshold of 1.20 and above the optimal level of 1.4, consistent with his excellent HDL level.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, genetic factors","high_causes":"Regular exercise, healthy diet, genetic factors, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2667","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this is the most accurate single measure of how many artery-damaging particles are circulating. Many cardiologists consider it a better predictor of cardiovascular risk than LDL cholesterol. Sam's result of 0.48 is well below the optimal threshold of 0.8 and the desirable limit of 0.9. This is an excellent result confirming very low atherogenic particle number.","low_causes":"Malnutrition, hyperthyroidism, liver disease, genetic factors","high_causes":"High saturated fat diet, genetic factors, insulin resistance, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.316","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2257","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic (artery-damaging) particles to protective particles. It is arguably the single best summary metric for cardiovascular risk from lipids. Sam's ratio of 0.316 is well within the low-risk bracket of below 0.7 and within the optimal range. This is an outstanding result.","low_causes":"High HDL, low LDL, excellent metabolic health","high_causes":"High LDL, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written as Lp(a), is a genetically inherited lipoprotein particle similar to LDL but with an additional protein attached. It independently increases cardiovascular risk through three mechanisms: depositing cholesterol in arterial walls, promoting blood clot formation, and driving arterial inflammation. Unlike LDL, Lp(a) levels are almost entirely determined by genetics and cannot be significantly changed through diet or lifestyle. Sam's result of below 25 is within the normal range of below 32. This is a genuinely reassuring finding and should be recorded permanently in his medical notes, as it only needs to be tested once in a lifetime. It confirms that his already excellent lipid profile is not being undermined by an inherited risk factor.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (unfavourable); not modifiable by diet or exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0667","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a calculated marker that reflects insulin sensitivity and metabolic health. A lower ratio is associated with larger, less dangerous LDL particles and better insulin sensitivity. Sam's ratio of 0.2 is exceptional, confirming outstanding metabolic health.","low_causes":"Excellent metabolic health, high insulin sensitivity, healthy diet","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1375","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Sam's calculated remnant cholesterol of 0.22 is well within the optimal range of below 0.5.","low_causes":"Excellent metabolic health, low triglycerides","high_causes":"Insulin resistance, high triglycerides, metabolic syndrome, obesity, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio (NLR)","group":"INFLAMMATION","result":"1.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4700","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5","units":"","description":"The neutrophil-to-lymphocyte ratio is calculated by dividing neutrophils by lymphocytes. It is a marker of the balance between innate immunity (neutrophils) and adaptive immunity (lymphocytes) and reflects systemic inflammation. Sam's ratio of 1.82 is within the optimal range of 1.0 to 2.0, indicating a healthy balance between these two arms of the immune system despite both being on the lower side individually.","low_causes":"Not clinically significant","high_causes":"Acute infection, chronic inflammation, physiological stress, cardiovascular disease risk","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"147","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4464","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found primarily in skeletal muscle, heart muscle, and brain. It leaks into the blood when muscle tissue is damaged, making it a marker of muscle damage or strain. Sam's result of 147 is well within the reference range, suggesting that at the time of sampling, his muscles were not under excessive damage. This is useful context given his bodybuilding-style training.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, heart attack, hypothyroidism, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5817","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5565","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4, free thyroxine, is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues throughout the body. Sam's result of 19.9 is in the upper portion of the optimal range of 14 to 20, indicating strong thyroid hormone output.","low_causes":"Hypothyroidism, iodine deficiency, autoimmune thyroid disease (Hashimoto's), pituitary disease","high_causes":"Hyperthyroidism (Graves' disease, thyroid nodules), excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3869","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5399","units":"mIU/l","description":"TSH is produced by the pituitary gland in the brain and tells the thyroid how much hormone to produce. When the thyroid is underactive, TSH rises as the pituitary tries to stimulate more output. When the thyroid is overactive, TSH falls. Sam's result of 1.41 is within the optimal range of 1.0 to 2.5, indicating that the pituitary is satisfied with the thyroid's output and the thyroid axis is functioning well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease, severe illness","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4593","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active form of thyroid hormone that directly drives metabolic rate at the cellular level. It is produced primarily by converting T4 into T3 in tissues throughout the body. Sam's result of 4.3 is within the laboratory range of 2.6 to 7.1 but sits just below the optimal threshold of 4.5. In the context of a normal TSH and strong T4, this suggests the body may be slightly downregulating the conversion of T4 to T3, which is a recognised physiological response to low energy availability. The body does this to conserve energy by slowing metabolic rate. This is consistent with the broader pattern seen in Sam's results.","low_causes":"Low energy availability, low carbohydrate intake, illness (sick euthyroid syndrome), stress, selenium deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, T3-dominant thyroid conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are autoantibodies that attack thyroid peroxidase, an enzyme essential for thyroid hormone production. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. Sam's result of less than 6.6 is well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"Not applicable; absence is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, the protein from which the thyroid gland makes thyroid hormones. Like TPO antibodies, their presence can indicate autoimmune thyroid disease. Sam's result of less than 1.3 is well below the threshold of 4.4, further confirming no autoimmune thyroid process.","low_causes":"Not applicable; absence is normal","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa","name":"Prostate Specific Antigen (PSA)","group":"PROSTATE","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0700","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"PSA is a protein produced by the prostate gland. It is used as a screening marker for prostate conditions. Sam's result of 0.35 is negligible and completely normal for a 25-year-old male. It serves as a useful baseline should PSA monitoring ever be needed in later life.","low_causes":"Not applicable","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, vigorous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"free_psa","name":"Free PSA","group":"PROSTATE","result":"0.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1222","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA measures the portion of PSA that circulates unbound in the blood. When total PSA is elevated, the ratio of free to total PSA helps distinguish between benign and malignant prostate conditions. Sam's free PSA of 0.22 is normal, and with a total PSA of only 0.35, this distinction is not clinically relevant at this time.","low_causes":"Not applicable at normal PSA levels","high_causes":"Benign prostatic hyperplasia (tends to produce more free PSA)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Ratio (Free/Total)","group":"PROSTATE","result":"0.629","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio compares free PSA to total PSA. A higher ratio is generally more reassuring. Sam's ratio of 0.629, or 62.9%, is well above the normal threshold of 0.19, which is completely expected at his age with a very low total PSA.","low_causes":"Prostate cancer tends to produce more bound PSA, lowering the ratio","high_causes":"Benign prostate conditions, normal prostate function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"34.73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4694","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic and biliary tract cancers, though it can be mildly elevated in various benign conditions. Sam's result of 34.73 is within the normal range of below 37. While it sits in the upper portion of the range, it is within normal limits, and with all liver and pancreatic markers being healthy, this is not a concern. It provides a useful baseline.","low_causes":"Not applicable; lower is reassuring","high_causes":"Pancreatic cancer, biliary obstruction, cholangitis, pancreatitis, liver disease, ovarian conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA (Carcinoembryonic Antigen)","group":"TUMOR MARKERS","result":"1.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2761","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"CEA is a protein that can be elevated in certain cancers, particularly colorectal cancer, as well as in smokers and some benign conditions. Sam's result of 1.27 is well within the normal range for a non-smoker of below 2.3. This provides a useful baseline.","low_causes":"Not applicable; lower is reassuring","high_causes":"Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"Immunoglobulin G (IgG)","group":"IMMUNOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4526","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"IgG is the most abundant antibody in the blood, providing long-term immunity against infections the body has previously encountered or been vaccinated against. Sam's result of 9.9 is within the healthy range, confirming adequate antibody-mediated immunity. This is reassuring given his reports of frequent illness, as it means the B cells that produce antibodies are functioning normally.","low_causes":"Primary immunodeficiency, medications (immunosuppressants), protein-losing conditions","high_causes":"Chronic infection, autoimmune disease, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"Immunoglobulin M (IgM)","group":"IMMUNOLOGY","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"IgM is the first antibody produced by the immune system in response to a new infection. It is larger than IgG and serves as an early warning system. Sam's result of 0.9 is within the healthy range.","low_causes":"Primary immunodeficiency, medications, chronic lymphocytic leukaemia","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"Immunoglobulin A (IgA)","group":"IMMUNOLOGY","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3935","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"g/l","description":"IgA is the antibody that protects mucosal surfaces, including the gut lining, respiratory tract, and urinary tract. It is the body's first line of immune defence at surfaces exposed to the outside world. Sam's result of 1.1 is within the healthy range. Adequate IgA is important for his coeliac screen to be reliable, and his negative TTG result can be trusted.","low_causes":"Selective IgA deficiency (most common primary immunodeficiency), medications","high_causes":"Chronic infection, IgA nephropathy, liver disease, coeliac disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"Immunoglobulin E (IgE)","group":"IMMUNOLOGY","result":"13.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0675","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"IgE is the antibody involved in allergic reactions and defence against parasitic infections. Sam's result of 13.5 is low and well within the normal range, suggesting no significant allergic sensitisation or parasitic exposure.","low_causes":"Not clinically significant when low","high_causes":"Allergic conditions (asthma, hay fever, eczema), parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoid_factor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"IU/ml","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. Sam's result is pending and will be reported when available.","low_causes":"Not applicable; absence is normal","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg_iga","name":"Tissue Transglutaminase IgA (Coeliac Screen)","group":"AUTOIMMUNE & CELIAC","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CU","description":"The tissue transglutaminase IgA test screens for coeliac disease, an autoimmune condition triggered by gluten where the immune system attacks the lining of the small intestine. Sam's result is negative at 0.313 CU, well below the positive threshold of 8.8. This reliably excludes coeliac disease, provided he was eating a gluten-containing diet at the time of testing, which his Mediterranean diet would include. His IgA level is normal, confirming the test is reliable.","low_causes":"Not applicable","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5106","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5461","upper_optimal_position":"0.5674","units":"mmol/l","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, the unstable molecules produced during normal metabolism and exercise that can damage cells. Sam's result of 1.55 is within the optimal range, reflecting good antioxidant defences likely supported by his Mediterranean diet rich in fruits, vegetables, and polyphenols.","low_causes":"Poor dietary antioxidant intake, chronic illness, oxidative stress, smoking","high_causes":"Antioxidant supplementation, diet rich in fruits and vegetables, uric acid elevation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"448","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4584","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4486","upper_optimal_position":"0.5853","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural daily rhythm, peaking in the morning to help with waking and declining through the day. It also plays key roles in blood sugar regulation, immune function, and metabolism. Sam's morning cortisol of 448 is within the optimal range, confirming healthy adrenal function. This is reassuring because low cortisol could compound the fatigue and recovery issues he reports.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic fatigue","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2772","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"146.1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen, present in small amounts in males where it plays roles in bone health, brain function, and lipid metabolism. Sam's result of 81 is within the normal range for a male of below 146.1.","low_causes":"Low body fat, low testosterone (oestradiol is produced from testosterone), medications (aromatase inhibitors)","high_causes":"Obesity (more conversion from testosterone), liver disease, medications, testicular tumours","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4327","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Progesterone is present in small amounts in males, where it plays a role as a precursor to other hormones and has some effects on the nervous system. Sam's result of 1.78 is within the normal range.","low_causes":"Not clinically significant in males when mildly low","high_causes":"Adrenal or testicular tumours, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"3.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4038","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mIU/ml","description":"LH is produced by the pituitary gland and stimulates the testes to produce testosterone. Sam's result of 3.21 is within the healthy range, confirming normal pituitary signalling to the testes.","low_causes":"Pituitary disease, anabolic steroid use, severe stress, low energy availability","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_typ function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;

  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });

}
