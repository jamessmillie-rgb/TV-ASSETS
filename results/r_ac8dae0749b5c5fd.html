<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Sam Ross","dob":"26/06/2001","report_date":"2026-09-04","summary":"Sam is a 25-year-old male presenting with a BMI of 22.5, following a Mediterranean diet rated 8 out of 10 for quality with a volume of 7 out of 10. He trains four times per week in resistance and bodybuilding-style sessions with no dedicated cardio, logging 10,000 to 15,000 daily steps. He reports no medications. His habits include very high-intensity exercise and bodybuilding. He reports frequent illness, poor exercise recovery, and low energy and fatigue. His goals are to improve long-term health and longevity, prevent disease, and improve energy levels. He adds important context: his GP has told him his bloods are normal, but his body overtrains very easily. If he does overtrain, he develops fevers and elevated temperature lasting two to four days. He can currently manage three bodybuilding-style sessions per week without overtraining.\n\nSam's results tell a clear and coherent story, and when the findings are read together rather than in isolation, they point strongly toward a single underlying pattern. Before getting to that, there is a great deal of genuinely excellent news in this blood work.\n\nSam's cardiovascular and metabolic risk profile is outstanding. His total cholesterol is 4.4, his LDL is 1.98, well inside the optimal threshold of 2.6, and his ApoB, the protein that carries atherogenic cholesterol particles into the arterial wall, is just 0.48, comfortably below the 0.8 optimal target. His HDL, the protective lipoprotein that transports cholesterol back to the liver for disposal, is 2.2, which is exceptionally high for a male and well above the 1.4 optimal threshold. His triglycerides are 0.44, remarkably low, and his ApoB to ApoA-I ratio, arguably the single best summary metric for cardiovascular risk, is 0.316, well within the low-risk bracket. His Lp(a), lipoprotein(a), which is a genetically inherited and unchangeable particle that independently drives cardiovascular risk by depositing cholesterol, promoting clotting, and encouraging arterial inflammation, is below 25. This is genuinely useful information because it means his already excellent lipid profile is not being undermined by an inherited risk factor. This Lp(a) result should be recorded permanently in his medical notes. His remnant cholesterol, a calculated marker reflecting atherogenic triglyceride-rich particles, comes to 0.22, well inside the optimal range. His TG to HDL ratio is 0.2, which is about as good as that marker gets. His hs-CRP, the high-sensitivity measure of systemic inflammation, is below 0.2, the lowest the assay can read. His ESR, another inflammatory marker measuring how quickly red cells settle, is 2. Between them, these two markers confirm there is essentially no detectable systemic inflammation in Sam's body right now.\n\nHis liver is in excellent health. ALT at 20 and GGT at 24 are both comfortably within optimal ranges. His AST at 31 is healthy. His FIB-4 score, a composite calculation estimating liver fibrosis risk, is 0.96, well within the safe range. His bilirubin at 15 is normal. Amylase and lipase, the two pancreatic enzymes, are both mid-range, confirming healthy pancreatic function. His kidney function is strong, with a Cystatin C-derived eGFR of 126 and a creatinine-based eGFR above 90, both exactly where they should be at 25. His electrolytes, sodium, chloride, bicarbonate, and potassium, are all within range. His magnesium at 0.97 sits within the optimal band of 0.85 to 1.05, which is reassuring given his training load because magnesium is heavily used during muscle contraction and recovery. His calcium and corrected calcium are both healthy. His thyroid is working well, with a TSH of 1.41 sitting in the optimal zone between 1.0 and 2.5, a free T4 of 19.9 in the upper portion of the optimal band, and both thyroid antibodies negative, ruling out any autoimmune thyroid process. His free T3 at 4.3 is within the laboratory range but sits just below the optimal threshold of 4.5, a finding worth noting in the context of his other results. His testosterone at 20.4 is within the optimal range for a male, his SHBG at 41.2 is healthy, and his free androgen index at 49.5 is strong. His vitamin D at 172 is excellent, well inside the optimal window of 75 to 120 and beyond, reflecting good supplementation or sun exposure. His B12 at 792 is in the optimal band of 500 to 900. His folate at 19 is above the upper lab reference of 17, which is virtually always dietary or supplemental and is not a concern. Folate is water-soluble and any excess is excreted. His total antioxidant activity at 1.55 is healthy. His immunoglobulins IgG, IgM, IgA, and IgE are all within range, which is reassuring given his reports of frequent illness because it confirms his immune system's antibody-producing capacity is intact. His coeliac screen is negative. His PSA at 0.35 is negligible, and his tumour markers CEA and CA 19-9 are both within normal limits. His creatine kinase at 147 is mid-range, suggesting his muscles are not under excessive damage at the time of sampling. His urine is completely clean with no protein, no glucose, no blood, no white cells, no nitrites, no bacteria, and no growth on culture.\n\nNow to the findings that matter, and to the story they tell when read together. Sam has a white cell count of 3.51, below the lower limit of 4.0. His neutrophils, the white cells that form the first line of defence against bacterial infection, are at 2.02, sitting right on the lower boundary. His lymphocytes at 1.11 are in the lower quarter of their range. His red blood cell count is 4.2, below the lower limit of 4.5. His haematocrit, the proportion of blood volume occupied by red cells, is 0.389, below the lower limit of 0.40. His absolute reticulocyte count, which measures how many brand-new red blood cells the bone marrow is releasing, is 25.62, significantly below the lower limit of 50. His haemoglobin at 135 is just inside the male reference range of 130 to 170 but sits in the bottom quarter. His insulin is 2.3, just below the lower reference of 2.6, and his C-peptide, the molecule released in equal amounts to insulin and a reliable marker of pancreatic insulin output, is 0.384 micrograms per litre, which converts to approximately 127 picomoles per litre, well below the lower reference of 364 pmol/L. His HOMA-IR, a calculation estimating insulin resistance using fasting glucose and insulin, is 0.44, below the lower reference of 0.5 but in the favourable direction, meaning he is highly insulin-sensitive. His HOMA-B, which estimates how hard the pancreas is working to produce insulin, calculates to approximately 57.5, below the reference floor of 80. His FSH, follicle-stimulating hormone, is 1.34, marginally below the lower limit of 1.4. His PTH, parathyroid hormone, is 0.7, below the lower limit of 0.98, in the context of a normal corrected calcium of 2.34 and an excellent vitamin D of 172.\n\nTaken individually, several of these findings might be dismissed as borderline or insignificant. Read together, they form a pattern that is entirely consistent with Sam's symptoms and his own description of how his body behaves. His bone marrow is producing fewer red cells and fewer white cells than expected. His pancreas is producing very little insulin because his body needs very little, but the degree of suppression, particularly the C-peptide, goes beyond simple insulin sensitivity. His pituitary output of FSH is fractionally suppressed. His free T3, the active thyroid hormone that drives metabolic rate at the cellular level, is below optimal. His PTH is suppressed, though this is likely explained by his high vitamin D level, since vitamin D directly suppresses PTH secretion and at 172 this response is physiologically expected.\n\nThis pattern is consistent with what sports medicine literature describes as relative energy deficiency in sport, or RED-S. When the body receives less energy than it expends over a sustained period, it responds by quietly downregulating the systems it can survive without in the short term. Bone marrow output slows. Immune surveillance is reduced, meaning infections arrive more easily and take longer to clear. Hormonal axes are gently suppressed. The body becomes exquisitely efficient but also more fragile, and when it is pushed past its reduced threshold, the immune system mounts an exaggerated inflammatory response, which could explain the fevers and temperature spikes Sam describes after overtraining. The fact that Sam rates his diet quality as 8 out of 10 and follows a Mediterranean pattern is important. This is not a case of poor nutrition. It is a case where the quality is excellent but the total volume of food may not be matching the energy demands of high-intensity resistance training four days per week plus 10,000 to 15,000 daily steps. At 69 kilograms and 175 centimetres with a BMI of 22.5, there is very little stored energy to draw on when intake falls short of expenditure.\n\nSam's uric acid at 214 is marginally below the lower reference of 220. Uric acid is produced from the breakdown of purines, which come from dietary protein and cellular turnover. A low level in the context of what appears to be low energy availability is consistent with the overall picture, though at this margin it is not clinically significant on its own.\n\nHis ALP, alkaline phosphatase, is 120, marginally above the upper limit of 116. At 25, this is almost certainly bone-derived ALP rather than liver-derived, because GGT is clean and all other liver markers are normal. ALP from bone is expected to still be mildly elevated in males up to approximately age 25 as the final stages of skeletal maturation complete. This does not require investigation unless it rises further on retesting.\n\nHis MCH at 32.3 is marginally above the upper limit of 32, and his MCHC at 348 is marginally above the upper limit of 345. These are measures of how much haemoglobin is packed into each red cell. At these margins, this is laboratory variation rather than pathology, and the lab itself notes that MCHC can be affected by temperature and storage. Neither finding is a concern.\n\nSam's cortisol at 448 is within the normal morning reference range and does not suggest adrenal dysfunction. His oestradiol, progesterone, LH, DHEA-S, and prolactin are all within expected ranges for a healthy 25-year-old male.","links":"The central theme of Sam's results is that his body appears to be running on a slightly insufficient energy supply for the demands being placed on it. The good news is that this is entirely modifiable, and his underlying health is exceptional.\n\nStarting with nutrition, Sam's estimated maintenance calories based on his weight of 69 kilograms, height of 175 centimetres, four resistance sessions per week, and 10,000 to 15,000 daily steps would be approximately 2,600 to 2,800 calories per day. Given the pattern in his blood work suggesting low energy availability, we would recommend tracking intake carefully for two weeks to establish whether he is genuinely reaching this range. If his current intake is below 2,400, a gradual increase to 2,600 to 2,800 would be appropriate. If he is already eating in this range but still showing these markers, a trial of 2,800 to 3,000 may be warranted, particularly on training days. His protein target should be 110 to 138 grams per day, based on 1.6 to 2.0 grams per kilogram of bodyweight for his training intensity. His Mediterranean diet is excellent for this because it naturally provides a good balance of complex carbohydrates for glycogen replenishment, healthy fats for hormonal support, and protein from fish, legumes, and lean meats. The key is simply getting enough of it.\n\nCarbohydrate intake around training sessions deserves attention. Glycogen depletion during high-intensity resistance work is significant, and inadequate carbohydrate replenishment contributes to the suppressed immune function and poor recovery Sam describes. A target of 4 to 6 grams of carbohydrate per kilogram per day, roughly 275 to 415 grams, spread across the day with emphasis around training, would support glycogen stores and reduce the immune suppression that follows intense sessions.\n\nRegarding training structure, Sam already recognises that his body overtrains easily. The blood work confirms this is not perception but physiology. His bone marrow and immune system are genuinely operating at reduced capacity. We would recommend maintaining the three-session limit he has identified as tolerable rather than pushing to four, at least until a retest shows improvement in his white cell count, reticulocyte count, and haemoglobin. On rest days, his 10,000 to 15,000 steps are beneficial for cardiovascular health and insulin sensitivity, but if he is consistently at the higher end of that range on training days as well, the total energy expenditure may be significant. Recovery days should genuinely be recovery days.\n\nSleep and recovery are critical for Sam. Growth hormone, testosterone, and immune cell production all peak during deep sleep. A fixed wake time, exposure to natural light within an hour of waking, a caffeine cut-off by early afternoon, and a cool bedroom would support the recovery his body clearly needs.\n\nSam should discuss the following findings with his GP. The low white cell count of 3.51, low absolute reticulocytes of 25.62, low red blood cell count of 4.2, and low haematocrit of 0.389 should be reviewed. While these are consistent with low energy availability in a young, lean, heavily training male, benign ethnic neutropenia should be considered given his white European ancestry, and a repeat full blood count in 8 to 12 weeks after implementing dietary changes would be valuable. The low C-peptide of 0.384 micrograms per litre, which converts to approximately 127 picomoles per litre, is worth discussing. While his blood glucose of 4.3 and HbA1c of 34 are both excellent and confirm he is not diabetic, the degree of C-peptide suppression is notable. In the context of perfect glucose control and clear insulin sensitivity, this most likely reflects very low insulin demand rather than early pancreatic insufficiency, but a repeat after increasing caloric intake would provide reassurance. If there is any family history of type 1 diabetes, GAD antibodies and IA-2 antibodies could be considered to fully exclude an early autoimmune process.\n\nA retest is recommended in 10 to 12 weeks, focusing on full blood count with reticulocytes, fasting insulin and C-peptide, fasting glucose, and free T3. These markers will show whether increased energy intake has allowed the bone marrow and metabolic systems to recover.","flags":"LOW WHITE CELL COUNT: WBC 3.51 (range 4.0 to 10.0). Neutrophils 2.02 (lower boundary). Lymphocytes 1.11 (lower quarter of range). In a 25-year-old male with high-intensity training, frequent illness, and symptoms of overtraining with fevers, this pattern is consistent with immune suppression secondary to low energy availability or relative energy deficiency in sport. Benign ethnic neutropenia is a differential. Recommend repeat FBC in 8 to 12 weeks after dietary optimisation.\n\nLOW RED CELL PRODUCTION: RBC 4.2 (range 4.5 to 5.5), HCT 0.389 (range 0.40 to 0.50), absolute reticulocytes 25.62 (range 50 to 100), haemoglobin 135 (range 130 to 170, lower quarter). Reticulocyte suppression is significant and suggests reduced bone marrow erythropoietic activity. Iron studies are normal with ferritin 179 and transferrin saturation 29.94%, so iron deficiency is excluded. Pattern is consistent with low energy availability suppressing marrow output. Recommend repeat FBC with reticulocytes after dietary intervention.\n\nLOW INSULIN AND C-PEPTIDE: Insulin 2.3 mIU/L (range 2.6 to 24.9), C-peptide 0.384 ug/L (approximately 127 pmol/L, range 364 to 1456 pmol/L). Fasting glucose 4.3, HbA1c 34 mmol/mol. HOMA-IR 0.44 (insulin-sensitive). HOMA-B approximately 57.5 (below 80). Glucose control is excellent, confirming this is not diabetes. The C-peptide is notably low and while this is most likely very low insulin demand in a lean, insulin-sensitive, active male, the degree of suppression warrants a repeat after increasing caloric intake. If family history of type 1 diabetes, consider GAD and IA-2 antibody testing.\n\nLOW FSH: 1.34 mIU/ml (range 1.4 to 18.1). Marginally below range. Testosterone, LH, and other reproductive hormones are normal. Isolated marginal FSH suppression in context of broader low energy availability pattern. Not clinically significant in isolation but contributes to the overall picture. No action required beyond addressing energy intake.\n\nLOW PTH: 0.7 pmol/L (range 0.98 to 4.73). Corrected calcium 2.34 (normal). Vitamin D 172 nmol/L (high-normal). PTH suppression is physiologically expected at this vitamin D level, as vitamin D directly suppresses parathyroid hormone secretion. No concern.\n\nMARGINALLY ELEVATED ALP: 120 IU/L (range 46 to 116). GGT 24, ALT 20, AST 31 all normal. At age 25, this is almost certainly bone-derived ALP from residual skeletal maturation. Not concerning. Would expect normalisation on retest.\n\nLOW URIC ACID: 214 umol/L (range 220 to 547). Marginal, consistent with low energy availability pattern. Not clinically significant.\n\nELEVATED FOLATE: 19 ng/ml (range 3 to 17). Dietary or supplemental. Water-soluble, excess excreted. No concern.\n\nMCH 32.3 (range 27 to 32), MCHC 348 (range 315 to 345). Both marginally above range. Laboratory variation, not pathological.\n\nRheumatoid Factor: result to follow.\n\nReassuring negatives: Lipid profile is exceptional across all metrics. Inflammatory markers undetectable. Liver function excellent. Kidney function excellent. Thyroid function normal with negative antibodies. Testosterone optimal. Immunoglobulins normal. Coeliac screen negative. PSA negligible. Tumour markers normal. Iron studies normal. Urinalysis completely clean.","recommendations":"Increase total daily caloric intake to 2,600 to 2,800 calories per day, potentially 2,800 to 3,000 on training days. Track intake for two weeks to establish current baseline and identify any shortfall.\n\nEnsure protein intake reaches 110 to 138 grams per day, spread across at least three meals, with emphasis on a post-training meal containing 30 to 40 grams of protein.\n\nTarget 275 to 415 grams of carbohydrate per day with particular emphasis on carbohydrate around training sessions to support glycogen replenishment and reduce post-exercise immune suppression.\n\nMaintain three resistance sessions per week as the current tolerable maximum. Do not increase to four until retest confirms improvement in white cell count, reticulocytes, and haemoglobin.\n\nPrioritise genuine recovery on rest days. Continue walking for daily steps but avoid additional high-intensity work.\n\nOptimise sleep: fixed wake time, natural light within one hour of waking, caffeine cut-off by 1pm, cool bedroom around 18 degrees Celsius, consistent 7 to 9 hours.\n\nDiscuss the low white cell count, low reticulocyte count, low red cell count, low haematocrit, and low C-peptide with GP. Bring a copy of this report.\n\nRetest in 10 to 12 weeks: full blood count with reticulocytes, fasting insulin, fasting C-peptide, fasting glucose, and free T3.","supplementation":"Sam's blood work shows very few nutritional deficiencies, which reflects the quality of his Mediterranean diet. His vitamin D is excellent at 172, his B12 is optimal at 792, his folate is above range, his magnesium is optimal, and his iron stores are healthy. This limits the supplementation that would make a meaningful difference.\n\nVitamin D3 as cholecalciferol: Sam's current level of 172 suggests he is already supplementing or getting significant sun exposure. If he is supplementing, a maintenance dose of 2,000 IU daily taken with a fat-containing meal would maintain this level through the autumn and winter months. Vitamin K2 as MK-7 at 100 micrograms daily should be taken alongside vitamin D to ensure calcium is directed into bone rather than soft tissue.\n\nMagnesium glycinate at 300 to 400 milligrams taken before bed would support sleep quality, muscle recovery, and the hundreds of enzymatic reactions magnesium participates in. While his serum magnesium is optimal at 0.97, serum levels reflect only 1% of total body magnesium, and given his training intensity and recovery difficulties, supplementation is a reasonable addition.\n\nOmega-3 fish oil providing 2 grams of combined EPA and DHA daily, taken with food, would support the anti-inflammatory environment his body already demonstrates and provide additional support for immune function and recovery.\n\nA broad-spectrum multivitamin is not necessary given the quality of his diet and the strength of his vitamin and mineral results.\n\nSam should not take iron supplements. His ferritin at 179 and transferrin saturation at 29.94% confirm healthy iron stores, and additional iron would be unnecessary and potentially harmful.\n\nThe most important changes from this report are not supplements. They are eating more food, particularly more carbohydrate around training, respecting his three-session training limit, and prioritising sleep and recovery. These changes are what will allow his bone marrow, immune system, and metabolic markers to recover.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5333","upper_optimal_position":"0.7093","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar circulating in Sam's blood after an overnight fast. It reflects how well the body is managing blood sugar levels in the absence of recent food intake. Sam's result of 4.3 mmol/l is within the optimal range of 4.0 to 5.4, indicating excellent blood sugar control. This is a foundational marker for metabolic health and, combined with his HbA1c, confirms that his glucose regulation is working very well.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, malnutrition","high_causes":"Insulin resistance, type 2 diabetes, stress response, medications such as corticosteroids, excess carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c percentage is another way of expressing the same glycated haemoglobin measurement, using the older percentage scale. Sam's result of 5.3% is well within the normal range of below 6.0%, confirming healthy blood sugar control over the preceding two to three months.","low_causes":"Low red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Sustained elevated blood sugar, insulin resistance, prediabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol measures the percentage of haemoglobin in red blood cells that has become glycated, meaning sugar has attached to it. Because red blood cells live for about 120 days, this provides an average picture of blood sugar control over the preceding two to three months, rather than a snapshot of one moment. Sam's result of 34 is well below the 42 threshold for prediabetes and below the optimal ceiling of 36, confirming excellent long-term glucose management.","low_causes":"Low red cell lifespan, blood loss, haemolytic anaemia","high_causes":"Sustained elevated blood sugar, insulin resistance, prediabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2967","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5757","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing in the fasting state. Insulin is the hormone that allows cells to take up glucose from the blood for energy. Sam's result of 2.3 is just below the laboratory reference of 2.6 to 24.9. However, context is critical here. Lower insulin in a fasting state, when glucose is well controlled at 4.3 and HbA1c is 34, reflects high insulin sensitivity rather than pancreatic failure. Sam's body simply does not need much insulin to keep glucose in check. This becomes more relevant when viewed alongside his C-peptide result, which is discussed separately.","low_causes":"High insulin sensitivity, very low carbohydrate intake, low caloric intake, lean body composition, early type 1 diabetes (rare)","high_causes":"Insulin resistance, excess body fat, high carbohydrate diet, polycystic ovarian syndrome, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"127","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1512","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1456","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"pmol/L","description":"C-peptide is a molecule released by the pancreas in equal amounts to insulin. It is a more reliable marker of true pancreatic insulin production than insulin itself because it is not cleared by the liver on first pass. Sam's lab result was 0.384 ug/L, which converts to approximately 127 pmol/L, well below the reference range of 364 to 1456 pmol/L. In the context of a fasting glucose of 4.3 and an HbA1c of 34, this confirms that Sam's pancreas is producing very little insulin because his body demands very little. However, the degree of suppression is notable and should be repeated after increasing caloric intake to confirm it normalises. If there is a family history of type 1 diabetes, this could also warrant GAD antibody testing to fully exclude an early autoimmune process.","low_causes":"High insulin sensitivity with low demand, low caloric intake, early type 1 diabetes, exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease reducing clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.44","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.2933","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.0","upper_optimal_position":"0.5","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin. It estimates how resistant the body's cells are to insulin's effects. Sam's result of 0.44 is below the laboratory range of 0.5 to 1.5, but this is in the favourable direction. A value below 1.0 confirms excellent insulin sensitivity, meaning Sam's cells respond very efficiently to even small amounts of insulin. This is a genuinely positive finding.","low_causes":"High insulin sensitivity, lean body composition, regular exercise, low caloric intake","high_causes":"Insulin resistance, excess body fat, sedentary lifestyle, high sugar diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"57.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2292","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B, the Homeostatic Model Assessment of Beta-cell function, estimates how actively the pancreatic beta cells are producing insulin. It is calculated as (20 multiplied by fasting insulin) divided by (fasting glucose minus 3.5). Sam's result of approximately 57.5 is below the reference of 80 to 200, indicating that his pancreas is producing relatively little insulin. In the context of perfect glucose control, this reflects low insulin demand rather than beta-cell failure. However, combined with the low C-peptide, this finding supports the recommendation to retest after increasing caloric intake.","low_causes":"Low insulin demand due to high sensitivity, low caloric intake, early beta-cell decline, lean body composition","high_causes":"Insulin resistance causing compensatory overproduction, obesity, prediabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"29.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4321","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5171","units":"%","description":"Transferrin saturation measures the percentage of transferrin, the body's iron transport protein, that is currently loaded with iron. It reflects how much of the body's iron-carrying capacity is being used. Sam's result of 29.94% is within the optimal range of 25 to 40%, indicating healthy iron availability for red blood cell production and other metabolic needs.","low_causes":"Iron deficiency, chronic inflammation, chronic disease","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4892","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4552","upper_optimal_position":"0.6115","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals, so it is best interpreted alongside transferrin, ferritin, and saturation. Sam's result of 20.6 is well within the reference range and the optimal band, confirming adequate circulating iron.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, malabsorption, chronic inflammation","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4627","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6167","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. The body adjusts transferrin production based on iron status: it rises when iron stores are low and falls when they are high. Sam's result of 2.74 is comfortably within the healthy range, consistent with adequate iron stores.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"63.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5313","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"72","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4580","upper_optimal_position":"0.6204","units":"umol/l","description":"Total iron binding capacity measures how much iron the blood could carry if all transferrin molecules were fully loaded. It reflects the body's capacity to transport iron. Sam's result of 63.1 is within the healthy range, consistent with normal iron metabolism.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"179","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5087","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4264","upper_optimal_position":"0.5926","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. Each molecule can hold thousands of iron atoms and release them when needed for red blood cell production, energy metabolism, and immune function. Sam's result of 179 is well within the optimal range of 50 to 200 for a male, confirming healthy iron reserves. This is an important finding because it rules out iron deficiency as a cause of his lower red cell count and reticulocyte suppression.","low_causes":"Iron deficiency, chronic blood loss, vegetarian or vegan diet, malabsorption, heavy training","high_causes":"Iron overload, haemochromatosis, inflammation, infection, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"135","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3750","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5833","upper_optimal_position":"0.6458","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Sam's result of 135 is within the male reference range of 130 to 170 but sits in the lower quarter, below the optimal threshold of 140. This is consistent with his lower red cell count and suppressed reticulocyte production, and may contribute to his reported fatigue and poor exercise recovery.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow suppression, blood loss, low energy availability","high_causes":"Dehydration, polycythaemia, living at altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3000","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^12/L","description":"The red blood cell count measures how many red cells are circulating per litre of blood. Sam's result of 4.2 is below the lower limit of 4.5 for a male. Red blood cells are produced by the bone marrow, and their production rate is reflected by the reticulocyte count. Both being low together suggests the bone marrow is producing fewer red cells than expected, which in Sam's case is most likely related to overall energy availability rather than a primary bone marrow problem.","low_causes":"Low energy availability, nutritional deficiency (iron, B12, folate), bone marrow suppression, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit (HCT)","group":"HEMATOLOGY","result":"0.389","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3223","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.4","upper_optimal":"0.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"l/l","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. Sam's result of 0.389 is just below the lower limit of 0.40. This is consistent with his low red cell count and reflects the same underlying pattern of reduced red cell production by the bone marrow.","low_causes":"Anaemia, blood loss, overhydration, low energy availability, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"HEMATOLOGY","result":"12.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"%","description":"RDW measures the variation in size of red blood cells. A normal RDW means the red cells are uniform in size, which is reassuring. Sam's result of 12.2% is healthy, confirming that while his red cell count is low, the cells being produced are of normal and consistent size.","low_causes":"Not clinically significant when low","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency anaemia, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume (MCV)","group":"HEMATOLOGY","result":"92.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fl","description":"MCV measures the average size of each red blood cell. It helps distinguish between different types of anaemia. Small cells suggest iron deficiency, large cells suggest B12 or folate deficiency. Sam's result of 92.6 is in the middle of the healthy range, confirming his red cells are normal in size.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"32.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6733","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin packed into each individual red blood cell. Sam's result of 32.3 is marginally above the upper limit of 32. At this margin, this is not clinically significant and likely represents normal laboratory variation. It simply means each red cell carries a fractionally higher-than-average amount of haemoglobin.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, laboratory variation, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"348","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6778","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the concentration of haemoglobin within red blood cells. Sam's result of 348 is marginally above the upper limit of 345. As the lab notes, this marker can be affected by temperature and storage conditions during transit. At this margin, this is laboratory variation rather than a clinical finding.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory variation, sample handling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"181","within_normal":"TRUE","within_optimal":"FALSE","result_position ow_causes":"Liver disease, chronic inflammation, autoimmune conditions, nephrotic syndrome","high_causes":"Immunodeficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"120","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7238","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and intestines. It is involved in bone mineralisation and various metabolic processes. Sam's result of 120 is marginally above the upper limit of 116. At age 25, ALP is commonly still mildly elevated due to the final stages of bone growth and skeletal maturation, and this is the most likely explanation. His GGT at 24, ALT at 20, and all other liver markers being normal confirm this is bone-derived rather than liver-derived ALP. This is not a concern.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism, pernicious anaemia","high_causes":"Bone growth in young adults, bone disease (Paget's), liver disease, bile duct obstruction, vitamin D deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. It is processed by the liver and excreted in bile. Sam's result of 15 is within the healthy range, confirming normal red cell turnover and liver processing.","low_causes":"Not clinically significant when low","high_causes":"Gilbert syndrome, liver disease, bile duct obstruction, haemolytic anaemia, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is a liver enzyme that leaks into the blood when liver cells are damaged. It is one of the most specific markers of liver health. Sam's result of 20 is well within the optimal range for a male of below 30, confirming healthy liver cells with no evidence of damage or inflammation.","low_causes":"Not clinically significant when low","high_causes":"Fatty liver disease, alcohol-related liver damage, viral hepatitis, medications, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5729","units":"IU/l","description":"AST is an enzyme found in the liver, heart, and muscles. It leaks into the blood when these tissues are damaged. Unlike ALT, AST is not liver-specific, so it is interpreted alongside ALT and CK. Sam's result of 31 is within the optimal range, and with ALT also normal, this confirms healthy liver tissue.","low_causes":"Not clinically significant when low","high_causes":"Liver damage, heart attack, muscle injury, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"0.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3310","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated estimate of liver fibrosis risk, using age, ALT, AST, and platelet count. Sam's result of 0.96 is well within the safe threshold of 1.45, indicating no evidence of liver fibrosis. This is a reassuring finding.","low_causes":"Not applicable; lower is better","high_causes":"Liver fibrosis, cirrhosis, advanced liver disease, low platelets, older age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT (GGT)","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1644","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"GGT is a liver and bile duct enzyme that is particularly sensitive to alcohol, medications, and metabolic stress on the liver. It is often the first liver enzyme to rise when the liver is under strain. Sam's result of 24 is within the optimal range for a male of below 25, confirming the liver is under no metabolic strain.","low_causes":"Not clinically significant when low","high_causes":"Alcohol consumption, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"82","within_normal":"TRUE","with iption":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. The body tightly regulates blood calcium levels. Sam's result of 2.39 is within the optimal range, confirming healthy calcium metabolism.","low_causes":"Vitamin D deficiency, parathyroid disorders, kidney disease, malabsorption, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis, prolonged immobilisation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result for the patient's albumin level, giving a more accurate picture of true calcium status. Sam's corrected calcium of 2.34 is within the optimal range, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6092","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4713","upper_optimal_position":"0.6092","units":"mmol/l","description":"Phosphate works with calcium to build bones and teeth, and is essential for energy production (as part of ATP) and cell membrane structure. Sam's egulation. It is produced in the skin through sunlight exposure and obtained from diet and supplements. Sam's result of 172 is well above the sufficiency threshold of 50 and above the optimal range of 75 to 120. This is an excellent level that indicates effective supplementation or good sun exposure. At this level, a maintenance dose of vitamin D would be appropriate through autumn and winter.","low_causes":"Insufficient sunlight, poor dietary intake, malabsorption, obesity, darker skin pigmentation, kidney or liver disease","high_causes":"Excessive supplementation (toxicity usually requires levels above 375)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"ELECTROLYTES & MINERALS","result":"0.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2427","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5060","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate levels in the blood. When calcium drops, PTH rises to release calcium from bone and increase absorption from the gut. Sam's result of 0.7 is below the lower reference of 0.98. However, PTH is directly suppressed by vitamin D, and Sam's vitamin D level of 172 is high. At this vitamin D level, PTH suppression is a normal and expected physiological response. His corrected calcium of 2.34 is healthy, confirming that calcium balance is well maintained despite the low PTH. The lab also notes that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of collection.","low_causes":"High vitamin D levels (physiological suppression), hypoparathyroidism, magnesium deficiency, sample handling","high_causes":"Vitamin D deficiency, chronic kidney disease, calcium deficiency, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"792","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5390","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.7222","upper_optimal_position":"0.5614","units":"pg/ml","description":"Vitamin B12 is essential for red blood cell production, nerve function, and DNA synthesis. Deficiency causes a type of anaemia where red blood cells become enlarged and can cause nerve damage. Sam's result of 792 is well within the optimal range of 500 to 900, ruling out B12 deficiency as a cause of his lower red cell counts.","low_causes":"Vegan or vegetarian diet, malabsorption, pernicious anaemia, Crohn's disease, coeliac disease, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7024","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.6905","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, also known as vitamin B9, is essential for DNA synthesis, red blood cell production, and cell division. Sam's result of 19 is above the upper laboratory reference of 17. This is virtually always the result of dietary intake from folate-rich foods such as leafy greens, legumes, and fortified grains, or supplementation. Folate is water-soluble and the body excretes any excess, so an above-range level is not harmful. This is a positive finding and rules out folate deficiency as 0, reflecting excellent dietary quality and insulin sensitivity.","low_causes":"Low fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"Excess calories, high sugar or refined carbohydrate intake, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1282","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, very low-density lipoprotein, carries triglycerides from the liver to tissues throughout the body. It is a precursor to LDL. Sam's result of 0.2 is very low, consistent with his excellent triglyceride level.","low_causes":"Low fat diet, genetic factors","high_causes":"Excess calories, obesity, insulin resistance, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7097","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, high-density lipoprotein, is known as the protective cholesterol because it transports cholesterol away from the arteries back to the liver for disposal. Higher levels are strongly associated with lower cardiovascular risk. Sam's result of 2.2 is exceptionally high for a male, well above the optimal threshold of 1.4. This is a genuinely excellent finding.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, metabolic syndrome, medications","high_causes":"Regular exercise, genetic factors, moderate alcohol intake, healthy diet, lean body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4320","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5733","units":"mmol/l","description":"LDL, low-density lipoprotein, carries cholesterol into the arterial walls where it can accumulate and form plaques. It is the primary driver of atherosclerosis. Sam's result of 1.98 is well within the optimal range of below 2.6 and comfortably within the laboratory range, reflecting low cardiovascular risk.","low_causes":"Hyperthyroidism, malnutrition, liver disease, genetic factors","high_causes":"Diet high in saturated fat, genetic factors (familial hypercholesterolaemia), hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2222","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL cholesterol. A lower ratio indicates a more favourable balance between harmful and protective cholesterol. Sam's ratio of 2.0 is excellent, reflecting his high HDL and low total cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, poor metabolic health","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl
