<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

s do not cause unnecessary alarm.\n\nHis thyroid is working well. TSH is 0.81, within the optimal range of 1.0 to 2.5 but only just below it, and free T4 is 20.9, at the upper end of the reference range and above the optimal band of 14 to 20. Free T3, which is the active thyroid hormone that cells actually use, is 5.6, within the optimal range of 4.5 to 6.5. The FT3 to FT4 ratio is 0.268, just below the optimal band of 0.27 to 0.4, suggesting the thyroid is producing plenty of T4 but conversion to the active T3 is at the lower boundary of ideal. His thyroglobulin antibodies are undetectable at below 1.3. However, his thyroid peroxidase antibodies, known as TPO antibodies, are 17.2 against a laboratory upper limit of 13.8. TPO antibodies are produced by the immune system when it targets the thyroid gland, and their presence is associated with a condition called Hashimoto's thyroiditis, the most common cause of underactive thyroid. At 17.2, this is a mild elevation, and his thyroid function is currently excellent, so this does not mean he has thyroid disease now. What it does mean is that his immune system is showing a low-level interest in the thyroid, and this is worth monitoring. We would recommend mentioning this to his GP and repeating thyroid antibodies and function in twelve months to check the trend. In roughly 2 to 4 percent of people with mildly positive TPO antibodies, the thyroid drifts towards underactivity over the following years, and catching that early makes management straightforward.\n\nHis kidney function is good. Creatinine-based eGFR is above 90, and his cystatin C-based eGFR, which is a more accurate measure because it is not influenced by muscle mass, is 88, just below the optimal threshold of 90. The combined eGFR is 88. At 51 with a lean frame, this is a reasonable result, though it is worth noting that the optimal threshold is 90 and this sits just beneath it. His urea-to-creatinine ratio is 101.4, marginally above the upper reference limit of 100, which can reflect mild dehydration or a higher protein intake relative to kidney filtration. Neither of these kidney findings is a concern on its own, but together they suggest keeping well hydrated and repeating cystatin C at his next test to confirm the trajectory.\n\nHis hormones are in good shape. Testosterone is 21.8, within the optimal range of 18 to 30 for a man. Free testosterone, the fraction not bound to proteins and available for cells to use, is 0.3396, within range. SHBG, the protein that binds testosterone and reduces its availability, is 53.9, within range but towards the upper end, which is expected on a higher-carbohydrate, lower-fat diet. His bioavailable testosterone is 8.14, within the optimal range of 5 to 15. DHEA-S, a precursor hormone produced by the adrenal glands that declines with age, is 4.9, a healthy level for 51. LH and FSH, the pituitary hormones that drive testosterone production, are both within range, confirming the system is well regulated. Oestradiol at 104 is within range, and progesterone at 1.56 is within the male reference range. Prolactin at 65 is at the lower end of its range but within it. Cortisol at 312 is within the morning reference range.\n\nHis prostate markers are excellent. PSA is 0.49 against a limit of 3.5, and the free PSA ratio is 0.367, well above the reassuring threshold of 0.19. These are textbook results for a 51-year-old man.\n\nHis immune markers are all within range. IgG, IgM and IgA are healthy, IgE is very low at 3.3, suggesting no allergic activation, and rheumatoid factor is below 4, ruling out rheumatoid inflammation. Tissue transglutaminase IgA is negative, which effectively rules out coeliac disease while on a gluten-containing diet. CA 19-9 is below 1.2, well within range.\n\nHis vitamin D is 110, sitting within the optimal range of 75 to 120, which reflects his supplementation working well. Magnesium is 1.03, within the optimal range of 0.85 to 1.05. Calcium and corrected calcium are both within range. Phosphate is within range. PTH is 3.09, within range, confirming healthy calcium regulation. His total antioxidant activity is 2.09 against an upper limit of 1.77. This is a common finding in people supplementing with vitamin D, omega-3, a multivitamin and other antioxidants, and reflects the supplementation rather than any disease process.\n\nThere are a few findings that need attention. His white blood cell count is 3.79, below the lower limit of 4.0. His neutrophils at 2.13 are just within range at the lower boundary of 2.0, and his lymphocytes at 1.23 are within range but towards the lower end. A white cell count just below 4.0 in a lean, healthy 51-year-old man with no symptoms and no infections is most commonly a normal variant called benign ethnic neutropenia, seen in people of certain ancestries, or simply reflects a naturally lean immune set point. His ESR is 4 and his CRP is 0.2, both excellent, confirming there is no infection or inflammation driving the count down. His immunoglobulins are all healthy, so immune function is intact. This is worth mentioning to his GP for documentation, but in the absence of recurrent infections or symptoms, it does not require investigation on its own. It should be noted at future blood tests so that the trend can be tracked.\n\nHis reticulocyte absolute count is 44.2, just below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a count just below range, alongside a haemoglobin of 168 that is at the top of the reference range, suggests the bone marrow is simply throttling back production because there are already plenty of red cells in circulation. This is a normal feedback mechanism rather than a sign of marrow suppression.\n\nHis C-peptide is 0.994 against a lower limit of 1.1. C-peptide is a molecule released by the pancreas in equal amounts to insulin, and it is used as a measure of how much insulin the pancreas is producing. At 0.994, it is marginally below the laboratory range, but this needs to be read alongside his fasting insulin of 4.35, his fasting glucose of 4.1 and his HbA1c of 31. All three confirm excellent blood sugar control and strong insulin sensitivity. A low C-peptide in this context simply means the pancreas does not need to produce much insulin because the body is responding to it efficiently. This is a positive finding dressed in a below-range flag.\n\nHis ferritin is 48, within the laboratory range of 22 to 322 but just below the optimal threshold of 50 for men. Given that he is supplementing with iron, it would be worth checking that the dose is adequate. His transferrin is 3.66, marginally above the upper limit of 3.65, and his total iron binding capacity is 80.6, above the upper limit of 76.1. Transferrin and TIBC rise together when the body is asking for more iron, and combined with a ferritin that is below optimal, this pattern suggests his iron stores could be a little higher. His serum iron at 24.5 and transferrin saturation at 26.66 percent are both within range, so there is no deficiency, but there is room to build the stores up towards 80 to 100. His current iron supplement should be taken with a source of vitamin C and away from his calcium-rich foods and tea or coffee, which block absorption.\n\nHis folate is 24, above the laboratory upper limit of 17. This is almost certainly driven by his multivitamin supplementation and an excellent diet rich in vegetables and fruit. Folate at this level is not harmful and does not need action, though if he is also supplementing folic acid separately within the multivitamin, it is worth checking the dose.\n\nHis B12 is 336, within the laboratory range of 193 to 982 but below the optimal threshold of 500. On a high-carb, low-fat diet, B12 intake can be lower if red meat and animal products are not prominent. Given his supplementation already includes a multivitamin, it would be worth checking whether it contains B12 in a methylcobalamin form and at a sufficient dose, or adding a standalone sublingual methylcobalamin.\n\nHis CEA marker is 2.6. The upper reference limit is 2.3, placing this marginally above range. CEA, or carcinoembryonic antigen, is a protein that can be raised in certain cancers but is also raised by benign conditions including mild inflammation, liver changes, and even by normal variation. At 2.6, this is a very marginal elevation and not at a level that suggests pathology. It should be noted and repeated at his next blood test. If it rises on repeat, the GP should investigate further. If it stays stable or falls, it can be attributed to normal variation.\n\nHis lipase is 75, above the laboratory upper limit of 60. Lipase is an enzyme produced by the pancreas to digest fats, and when it rises, it can indicate pancreatic inflammation. However, his amylase, the other pancreatic enzyme, is 80, well within range, and he reports no abdominal pain, nausea or digestive symptoms. A mildly raised lipase with a normal amylase and no symptoms is usually a normal variant and not a sign of pancreatitis. Some people, particularly those on higher-carbohydrate diets, run a naturally higher lipase. This should be mentioned to his GP and repeated at his next test.\n\nHis MCHC at 347 is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation and is not clinically significant.\n\nHis urine shows 50 red blood cells per microlitre against a significance threshold of 25. His WBCs are below 1, nitrites are negative, and the culture showed mixed growth reported as probable contamination. The absence of white cells, nitrites and symptoms makes a urinary tract infection very unlikely, and the mixed growth supports sample contamination rather than infection. However, red blood cells at 50 at the age of 51 is a finding that warrants a repeat urinalysis. If red blood cells remain elevated on a clean-catch repeat sample, the GP should consider referral for urological investigation to rule out causes of microscopic haematuria. It should not be dismissed without confirmation.\n\nHis serum folate at 24 is above range, his total antioxidant activity at 2.09 is above range, and both are supplement-driven. His remaining urinalysis markers, including protein, glucose, ketones, urobilinogen and casts, are all negative, which is the expected healthy pattern.","links":"The dominant story in this report is one of exceptional metabolic and cardiovascular health. The combination of a very low ApoB, high HDL, low triglycerides, low fasting insulin, low glucose, low HbA1c and a HOMA-IR of 0.79 forms a single coherent picture: this is a man whose diet, body composition and metabolism are working together efficiently. His Cardiovascular Risk Score of 0 out of 100 and PhenoAge of 33.9 against a calendar age of 51 are the numerical summaries of that story. The Lp(a) below 25 closes the last door on hidden inherited cardiovascular risk.\n\nThe mildly positive TPO antibodies at 17.2 are the one thread that does not fit the otherwise clean picture. His thyroid function is currently excellent, with a free T3 of 5.6, a free T4 of 20.9 and a TSH of 0.81, so the antibodies are not causing functional impairment. Thyroglobulin antibodies are undetectable, which is reassuring. The clinical significance here is not what is happening now but what might happen over the next five to ten years: in a small percentage of people with positive TPO antibodies, the thyroid gradually loses function. Monitoring is the right response.\n\nThe low white cell count at 3.79, the marginally low reticulocyte absolute count at 44.2 and the borderline-low ferritin at 48 form a second thread. In a lean man with an excellent diet, these could all reflect a mild degree of under-fuelling relative to metabolic demand, though his diet volume is rated 7 out of 10 and his calorie needs at a BMI of 22.1 are modest. The more likely explanation for the white cell count is a constitutional variant, particularly given that all inflammatory and immune markers are pristine. The low reticulocytes are explained by his haemoglobin already sitting at 168, near the top of range, which feeds back to the bone marrow to slow production. The ferritin, however, is below optimal despite iron supplementation, and the raised transferrin and TIBC confirm the body is asking for more. Optimising iron absorption is the practical action here.\n\nThe C-peptide at 0.994 deserves its own brief paragraph because the below-range flag can look alarming. In this context, it is a mathematical consequence of excellent insulin sensitivity: the pancreas is producing very little insulin because very little is needed. The glucose, HbA1c, HOMA-IR and HOMA-B all confirm this. There is no suggestion of pancreatic insufficiency.\n\nThe loose ends are the urine red blood cells at 50, the marginally raised CEA at 2.6 and the raised lipase at 75. None of these is connected to the metabolic or immune threads. Each needs a routine repeat. The urine RBCs in particular should be confirmed on a fresh, clean-catch sample; the mixed growth culture result makes contamination the most likely explanation, but microscopic haematuria at 51 should not be assumed to be artefact without a confirmatory test.\n\nThe bilirubin at 24 with entirely clean liver enzymes is best explained by Gilbert's syndrome, an inherited variant that is harmless and stable. It connects to nothing else in the report.","lifestyle":"Check the form and dose of B12 in your current multivitamin. If it does not contain at least 1,000 mcg of methylcobalamin, add a standalone sublingual methylcobalamin tablet. Anchor: with your morning supplements. Why: your B12 at 336 is within range but below the optimal threshold of 500, and methylcobalamin is the most absorbable form.\nTake your iron supplement with a glass of orange juice or another source of vitamin C, and separate it from tea, coffee, dairy and your calcium-containing meals by at least two hours. Anchor: mid-morning or mid-afternoon, between meals. Why: your ferritin at 48 is below the optimal 50 despite supplementation, and your raised transferrin and TIBC show the body is asking for more iron. Vitamin C doubles absorption; tannins and calcium block it.\nMaintain your current vitamin D dose. Your level at 110 is in the sweet spot of the optimal range. If your supplement is above 2,000 IU daily, you could reduce to 2,000 IU through summer and return to the higher dose in autumn.\nAim for at least 2 litres of water across the day, more on active days. Anchor: a glass with each meal and a bottle carried through the morning. Why: your urea-to-creatinine ratio at 101 is just above range, which can reflect mild underhydration, and your cystatin C eGFR at 88 will benefit from consistent fluid intake.\nIf you are not currently doing resistance training, adding two sessions per week would be the single highest-value addition to your routine at 51. Even bodyweight exercises or a simple dumbbell programme protects bone density, maintains muscle mass as testosterone naturally declines with age, and supports the immune system. Anchor: fixed days, ideally before your largest meal.\nAim for 8,000 to 10,000 steps a day as a baseline. Walking is the most underrated longevity intervention and supports the cardiovascular health your blood markers already reflect.\nKeep your current diet. Eating 6+ portions of vegetables and fruit a day with rare processed food and rare sugar is the single biggest reason this report looks so strong. Your calorie target to maintain your current weight is approximately 2,200 to 2,400 kcal per day, depending on activity. Your protein target should be at least 93 to 114 g per day (1.3 to 1.6 g per kg at 71.5 kg), which matters increasingly at 51 for preserving lean mass.","flags":"White blood cell count 3.79, below the lower limit of 4.0, with neutrophils at 2.13 (lower boundary of range) and lymphocytes at 1.23 (lower end of range). CRP 0.2 and ESR 4 rule out infection or inflammation. Most likely a constitutional variant in a lean, healthy man. Worth documenting with the GP for baseline tracking.\nTPO antibodies 17.2, above the upper limit of 13.8, with thyroglobulin antibodies undetectable. Thyroid function currently excellent (TSH 0.81, FT4 20.9, FT3 5.6). Mildly positive TPO antibodies are associated with future autoimmune thyroid disease in a small percentage of cases. Recommend annual thyroid monitoring.\nUrine red blood cells 50 per microlitre, above the significance threshold of 25. WBCs below 1, nitrites negative, culture showed mixed growth (probable contamination). Most likely sample contamination, but microscopic haematuria at 51 should be confirmed with a repeat clean-catch urinalysis. If persistent, urological referral is appropriate.\nCEA 2.6, marginally above the upper reference of 2.3. At this margin, normal variation is the most likely explanation. Should be repeated at the next blood test; if rising, further investigation warranted.\nLipase 75, above the upper limit of 60, with amylase 80, well within range, and no abdominal symptoms. Isolated mild lipase elevation with normal amylase is usually a normal variant. Repeat at next test.\nC-peptide 0.994, marginally below the lower limit of 1.1. In the context of glucose 4.1, HbA1c 31, insulin 4.35 and HOMA-IR 0.79, this reflects low insulin demand from excellent insulin sensitivity, not pancreatic insufficiency.\nFerritin 48, within range but below the optimal threshold of 50 for men. Transferrin 3.66 (marginally above range) and TIBC 80.6 (above range) confirm the body is requesting more iron. Iron stores should be built towards 80 to 100.\nBilirubin 24, above the upper limit of 21, with all liver enzymes clean. Pattern consistent with Gilbert's syndrome, a benign inherited trait.\nReticulocyte absolute count 44.2, below the lower limit of 50. With haemoglobin at 168 (upper end of range), the marrow is appropriately throttling production. Not pathological.\nMCHC 347, marginally above the upper limit of 345. Laboratory variation, not clinically significant.\nFolate 24, above the upper limit of 17. Supplement and diet-driven, not harmful.\nTotal antioxidant activity 2.09, above the upper limit of 1.77. Driven by supplementation with vitamin D, omega-3 and a multivitamin.\nB12 336, within range but below the optimal threshold of 500. Supplementation adjustment recommended.\nCystatin C eGFR 88, below the optimal threshold of 90 but within the normal range. Worth repeating at next test to confirm trajectory.\nReassuring negatives: cardiovascular risk score 0 out of 100, PhenoAge 33.9 (17 years younger than calendar age), PSA 0.49 with free ratio 0.367, coeliac screen negative, rheumatoid factor negative, all immunoglobulins within range, IgE 3.3 (no allergic activation), CA 19-9 below 1.2, CRP 0.2, ESR 4, HOMA-IR 0.79, HbA1c 31, all liver enzymes clean, FIB-4 and APRI within range, lipid profile optimal across all markers.\n","recommendations":"Mention the TPO antibody result of 17.2 (above 13.8) to your GP and request annual thyroid function and antibody monitoring. Current thyroid function is excellent, but tracking the trend is important.\nRepeat a clean-catch urinalysis to confirm or clear the urine red blood cell finding of 50. If red blood cells remain elevated on a fresh sample, ask the GP about urological referral to investigate microscopic haematuria.\nAsk the GP to note the white cell count of 3.79 as a baseline. No investigation needed unless recurrent infections develop, but it should be documented so that future tests can be compared.\nMention the CEA of 2.6 (marginally above the upper reference of 2.3) and the lipase of 75 (above 60 with normal amylase). Both should be repeated at the next blood test. Neither requires immediate investigation.\nNote the bilirubin of 24 with clean liver enzymes as likely Gilbert's syndrome for future reference.\nOptimise iron absorption as described in the lifestyle section to build ferritin from 48 towards 80 to 100. Add sublingual methylcobalamin 1,000 mcg daily if not already in the multivitamin to move B12 from 336 towards the optimal range of 500 to 900.\nRetest in twelve months. Key markers to repeat: thyroid function with TPO antibodies, ferritin and iron studies, B12, cystatin C eGFR, urinalysis, CEA, lipase, and a full blood count to track the white cell count. Calorie target: approximately 2,200 to 2,400 kcal per day for weight maintenance. Protein target: 93 to 114 g per day.","supplementation":"Sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue in the morning. Why: B12 at 336 is below the optimal threshold of 500 and sublingual methylcobalamin bypasses gut absorption for better uptake.\nVitamin D3 (cholecalciferol), continue current dose at approximately 2,000 IU daily with a meal containing fat. Add vitamin K2 (MK-7) at 100 mcg daily if not already in the multivitamin, as K2 directs the calcium that vitamin D helps absorb into bones rather than arteries. Why: vitamin D at 110 is optimal and should be maintained.\nIron (ferrous bisglycinate), 25 mg every other day, taken with vitamin C and away from tea, coffee, dairy and calcium by at least two hours. Why: ferritin at 48 is below the optimal 50 and the raised transferrin and TIBC confirm the body is requesting more. Bisglycinate is the gentlest form on the gut.\nMagnesium glycinate, continue current supplementation at 300 to 400 mg daily, ideally before bed. Why: magnesium at 1.03 is within the optimal range and should be maintained, and glycinate supports sleep quality.\nOmega-3 fish oil, continue current supplementation at 2 to 3 g combined EPA and DHA daily with food. Why: his lipid profile is already excellent, and omega-3 supports the anti-inflammatory state reflected in his CRP of 0.2.\nReview the multivitamin to check it does not contain additional iron (since a standalone iron supplement is now recommended with specific timing) and that it contains methylcobalamin rather than cyanocobalamin. If the multivitamin already contains 1,000 mcg methylcobalamin, the standalone B12 is not needed.\nThe most important actions from this report are not supplements. They are maintaining the excellent diet, adding resistance training, optimising iron absorption timing, and monitoring the TPO antibody trend with the GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 70 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 70.4. Weakest systems: urinalysis 0%, digestive 8%, tumor markers 22%. Biggest drags: Total Bilirubin, White Blood Cell Count, Lipase, Urine RBCs.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"33.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3027","lower_normal":"","upper_normal":"56","lower_optimal":"","upper_optimal":"51","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4554","units":"years","description":"PhenoAge is a biological age estimate derived from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and whi s":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised version of the same measurement. At 31, this is well below the optimal threshold of 36 and far below the pre-diabetes threshold of 42. This confirms excellent long-term blood sugar control.","low_causes":"Low carbohydrate intake, high activity levels","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3595","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. At 4.35, this is within the optimal range of 2 to 8, meaning the pancreas is doing very little work because the body responds to insulin efficiently. This is one of the most important markers of metabolic health.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, lean body composition","high_causes":"Insulin resistance, high carbohydrate diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.994","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3226","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts to insulin, making it a reliable measure of how much insulin the body is producing. At 0.994, this is marginally below the lower limit of 1.1. However, in the context of a fasting glucose of 4.1, an HbA1c of 31 and an insulin of 4.35, this simply reflects low insulin demand rather than pancreatic insufficiency. The pancreas is producing less insulin because the body needs less, which is a sign of excellent insulin sensitivity.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, lean body composition, type 1 diabetes (if glucose also elevated)","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4300","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculation derived from fasting glucose and insulin that estimates how resistant the body's cells are to insulin. Below 1.0 indicates optimal insulin sensitivity, and at 0.79, this is excellent. It confirms the pancreas is not being overworked and the cells are responding to insulin efficiently.","low_causes":"Excellent insulin sensitivity, lean body composition, low carbohydrate diet","high_causes":"Insulin resistance, obesity, metabolic syndrome, high sugar diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3786","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood glucose level over the past two to three months. At 5.3, this is within the optimal range of below 6.2, confirming consistently healthy blood sugar management.","low_causes":"Low carbohydrate diet, high activity levels","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4278","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The triglyceride-glucose index is a surrogate marker for insulin resistance calculated from fasting triglycerides and glucose. At 7.53, this is within the optimal range of below 8.5, consistent with the excellent insulin sensitivity demonstrated by the HOMA-IR and fasting insulin results.","low_causes":"Excellent insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"26.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4114","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3964","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. At 26.66%, this is within the optimal range of 25 to 40%, indicating the iron transport system is functioning normally and iron is being delivered to cells adequately.","low_causes":"Iron deficiency, chronic disease, poor dietary iron","high_causes":"Iron overload, haemochromatosis, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"24.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5516","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.5601","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. At 24.5, this is within the reference range and near the top of the optimal band. Serum iron fluctuates throughout the day and with meals, so it is best read alongside ferritin and transferrin saturation for the full picture.","low_causes":"Iron deficiency, chronic disease, poor absorption","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"3.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6689","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.5","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4111","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. At 3.66, this is marginally above the upper limit of 3.65. The body produces more transferrin when it senses that iron stores are lower than it would like, effectively building more delivery trucks to collect iron. Combined with the ferritin of 48, this confirms iron stores are adequate but below optimal, and the body is responding by upregulating its transport capacity.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"80.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7134","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6033","units":"umol/L","description":"Total iron binding capacity measures the maximum amount of iron that transferrin in the blood can carry. At 80.6, this is above the upper limit of 76.1, which mirrors the raised transferrin result. TIBC rises when iron stores are on the lower side and the body wants to absorb and transport more iron. This is a physiological signal that iron stores, while adequate, could be higher.","low_causes":"Iron overload, chronic disease, liver disease","high_causes":"Iron deficiency, pregnancy, increased iron demand","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"48","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3622","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/mL","description":"Ferritin is the body's iron storage protein and is the most reliable single marker of iron reserves. At 48, this is within the laboratory range of 22 to 322 but below the optimal threshold of 50 for men. Despite iron supplementation, stores have not reached the ideal range of 50 to 200. Optimising absorption by taking iron with vitamin C and away from absorption blockers should help build stores towards the target of 80 to 100.","low_causes":"Iron deficiency, poor dietary intake, poor absorption, chronic blood loss, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"168","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 168, this is at the upper end of the reference range of 130 to 170, indicating excellent oxygen-carrying capacity. The strong haemoglobin level also explains the slightly low reticulocyte count: the body does not need to make new red blood cells quickly when it already has plenty.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, smoking, living at altitude, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.46","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6533","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red blood cells in circulation. At 5.46, this is within the reference range and towards the upper end, consistent with his strong haemoglobin. A healthy count confirms adequate red cell production by the bone marrow.","low_causes":"Anaemia, blood loss, bone marrow suppression, nutritional deficiency","high_causes":"Dehydration, smoking, polycythaemia, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.483","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6100","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.42","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.483, this is within range and consistent with the strong haemoglobin and red cell count. It indicates good hydration and adequate red cell mass.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"12.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"Red cell distribution width measures the variation in size of red blood cells. A low, tight RDW like 12.3 means the red cells are uniform in size, which is a sign of healthy, consistent production from the bone marrow. Elevated RDW is associated with iron or B12 deficiency and with poorer health outcomes in general, so this is a positive finding.","low_causes":"Normal variation","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"88.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4352","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fL","description":"Mean corpuscular volume measures the average size of red blood cells. At 88.5, this is within the optimal range, indicating the red cells are a healthy, normal size. MCV is used alongside MCH and MCHC to classify anaemia types, and this normal value rules out both iron deficiency (which would shrink cells) and B12/folate deficiency (which would enlarge them).","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"30.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5800","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin packed into each red blood cell. At 30.7, this is within the optimal range, confirming each red cell is carrying a healthy amount of oxygen-transporting protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"347","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6889","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures the average concentration of haemoglobin within red blood cells. At 347, this is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation rather than a true abnormality. It has no clinical significance and does not require action.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"207","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4064","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are the small cell fragments responsible for blood clotting. At 207, this is within the optimal range, indicating the bone marrow is producing a healthy number of platelets and there is no sign of clotting or bleeding risk.","low_causes":"Bone marrow suppression, viral infection, autoimmune conditions, alcohol","high_causes":"Inflammation, infection, iron deficiency, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5778","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"Mean platelet volume measures the average size of platelets. At 9.3, this is within the optimal range. Larger platelets can indicate the bone marrow is producing them faster than normal in response to increased demand, but this value is entirely healthy.","low_causes":"Bone marrow suppression, aplastic anaemia","high_causes":"Increased platelet turnover, inflammation, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.79","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3217","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's defence force, responsible for fighting infections and foreign invaders. At 3.79, this is below the lower limit of 4.0. However, the differential shows neutrophils at the lower boundary of their range and lymphocytes within range, with all inflammatory markers (CRP 0.2, ESR 4) being excellent and all immunoglobulins healthy. In a lean, healthy man with no symptoms or recurrent infections, a white cell count just below 4.0 is most commonly a constitutional variant, meaning the body naturally runs a lower white cell count. This should be documented with the GP as a baseline.","low_causes":"Constitutional variant, viral infection, autoimmune conditions, medications, bone marrow disorders","high_causes":"Infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.13","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3420","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infections. At 2.13, this is within range but at the lower boundary of 2.0. This is consistent with the slightly low total white cell count and is most likely part of the same constitutional variant. Neutrophils at this level are still functional for fighting infection.","low_causes":"Constitutional variant, viral infection, medications, autoimmune neutropenia","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.23","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3717","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for long-term immune memory, producing antibodies and fighting viruses. At 1.23, this is within the reference range but towards the lower end. Given the healthy immunoglobulins and absence of symptoms, this is part of the overall pattern of a naturally lower white cell count rather than a sign of immune compromise.","low_causes":"Viral infection, stress, corticosteroid use, autoimmune conditions","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3708","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells, and play a role in tissue repair. At 0.29, this is within the optimal range.","low_causes":"Bone marrow suppression, certain infections","high_causes":"Chronic infection, inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key" e most accurate estimate of kidney filtration. At 88, this is within the normal range of above 60 but just below the optimal threshold of 90. The creatinine-based eGFR alone is above 90, and the combined figure sits at 88 because the cystatin C is at the top of its range. At 51, this is a reasonable result. Staying well hydrated and repeating this at the next test will help confirm the trajectory.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration (early diabetes, high protein diet)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"101.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6744","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio compares two kidney waste products and can help identify whether urea is elevated due to dehydration, high protein intake or a pre-renal cause. At 101.4, this is marginally above the upper limit of 100. The most common explanation at this margin is mild dehydration or a higher protein meal before fasting. Ensuring adequate daily fluid intake (2 litres or more) should bring this comfortably within range.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0200","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000"
