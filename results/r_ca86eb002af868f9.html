<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Pamela Maisey","dob":"14/01/1961","report_date":"2026-11-03","summary":"Patient is a 65-year-old female presenting with a BMI of 21.2, following a carnivore diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She trains four times per week (two cardio, two resistance) at moderate intensity with 10,000 to 15,000 daily steps. She sleeps 6 to 7 hours a night and wakes feeling refreshed, though her energy pattern features an afternoon crash. Stress feels hard to manage rarely. She does not drink alcohol. She takes vitamin D, magnesium and omega-3 supplements. She has a diagnosis of hypertension and has been on blood pressure medication for over ten years. She has a family history of heart attack or stroke before 60. She reports low energy and fatigue, palpitations or dizziness, and bloating or digestive discomfort, all of which she describes as having been present always. She notes that her lack of energy has been chronic for years, she has on and off stomach pain, has been light-headed and dizzy for years, and has recently started urinating more frequently at night, two and occasionally three times. Her goals are to improve energy levels, improve long-term health and longevity, and improve cardiovascular fitness. This is her first blood test with TrueVitals.\n\nThe finding that should be discussed with her GP first is the CEA, or carcinoembryonic antigen. CEA is a protein that can be released by certain tissues, particularly in the bowel, and is used as a screening marker. Her result is 4.08 ng/ml. The laboratory gives a non-smoker upper limit of 2.3. She does not smoke, so this is a genuinely elevated result, sitting nearly twice the threshold. CEA can be raised by a number of benign causes, including inflammation in the gut, diverticular disease, liver conditions, and even benign polyps, so an elevated CEA on its own does not mean cancer. However, given that she also reports longstanding digestive discomfort and on and off stomach pain, and that she has a family history of heart attack or stroke before 60 (which, while cardiovascular rather than bowel-related, speaks to a family that benefits from proactive screening), this result should not be left uninvestigated. Her GP should arrange a repeat CEA alongside further investigation, and in a 65-year-old with bowel symptoms this would typically mean a referral for colonoscopy or at the very least a FIT test. CA19-9, which is another tumour marker covering the pancreas and biliary system, is completely clear at 1.23, and CA125, which screens the ovaries, is also clear at 10.7. These are reassuring. It is the CEA and the digestive symptoms together that need the GP conversation.\n\nThere is a great deal of good news in this report, and it starts with her metabolic health, which is exceptional. Her fasting glucose is 4.1, right in the middle of the ideal range. Her HbA1c, which is the three-month average of blood sugar, is 33 mmol/mol, well within the optimal zone. Her insulin is 2.86, sitting just inside the lower end of the laboratory range, and her HOMA-IR, which is a calculation that measures how effectively the body uses insulin, is 0.52, meaning she is highly insulin-sensitive. For a 65-year-old, this metabolic picture is outstanding and reflects a diet that keeps blood sugar extremely stable. Her kidney function is excellent. Cystatin C, which is a more reliable measure of kidney filtration than creatinine alone, is 0.65, giving a combined eGFR of 116, which is the filtration rate of someone decades younger. Her creatinine at 45 is below the laboratory range, but in a lean woman with a BMI of 21.2 this is almost certainly due to low muscle mass rather than kidney disease, and the cystatin C confirms the kidneys are working beautifully. Her liver is in excellent health. ALT at 23, AST at 26, and GGT at 15 are all comfortably within range, and the APRI score of 0.327 and NAFLD fibrosis score of -1.383 both rule out any suggestion of liver scarring or fatty liver disease. The FIB-4 score at 1.77 is technically above the standard threshold of 1.45, but the laboratory itself notes that for patients over 65 the threshold rises to 2.0, and with every individual liver marker clean, this score is being driven entirely by her age and her low platelet count (which at 199 is well within range but towards the lower end). There is no liver disease here. Her lipase and amylase, which measure pancreatic function, are both squarely mid-range, which is reassuring given her abdominal symptoms. Her uric acid at 384 is within range. Her calcium at 2.47, corrected calcium at 2.52, and phosphate at 0.8 are all within range. Her PTH, or parathyroid hormone, which regulates calcium, is 0.986, sitting right at the bottom of its range, which in the context of a normal calcium is consistent with the calcium being adequate and the parathyroid gland not needing to work hard. Her vitamin D is 165, which is excellent and reflects her supplementation. Her rheumatoid factor is negative at 7, her coeliac screen is negative, and her IgG, IgM, IgA and IgE immunoglobulins are all within range, ruling out coeliac disease, rheumatoid arthritis, and any obvious immune dysregulation. Her urine is completely clean with no protein, no glucose, no blood, no white cells, no bacteria, and no growth on culture. Her cortisol at 396 is mid-range for a morning sample. Her prolactin at 112 is within the postmenopausal range. Her total antioxidant activity at 1.89 is above the upper limit of 1.77, which is a favourable finding and likely reflects her omega-3 supplementation. Her PhenoAge is 52.4 against a calendar age of 65, meaning her biological age by this measure is nearly thirteen years younger than her actual age, which is an exceptional result and reflects how well her metabolic health, kidney function and inflammation markers are performing.\n\nHer cardiovascular picture is the area that needs the most attention after the CEA, and it is important because of both her blood pressure history and her family history of heart attack or stroke before 60. Her total cholesterol is 7.5, her LDL is 5.05 against an upper limit of 3.0, and her ApoB, which is a direct count of the cholesterol-carrying particles that enter artery walls, is 1.16 against a target of below 0.9. These are meaningfully elevated. However, the picture is more nuanced than the headline numbers suggest. Her HDL, which is the protective cholesterol that removes LDL from artery walls, is 2.2, which is outstanding. Her triglycerides are 0.74, which is excellent. Her triglyceride-to-HDL ratio is 0.34, well within the optimal zone, and her atherogenic index of plasma is -0.473, which is strongly protective. Her ApoB-to-ApoA1 ratio is 0.545, which sits below the 0.6 lower-risk threshold. Her Lp(a), which is an inherited lipoprotein that adds cardiovascular risk and cannot be changed by diet or lifestyle, is below 25, which is ideal and means that all of the elevated LDL is driven by modifiable factors rather than genetics. Her Lp(a)-corrected LDL is 4.97, confirming this. Her Cardiovascular Risk Score is 35 out of 100, which is acceptable (below the 40 threshold) but not ideal (below 20), and is being driven almost entirely by the ApoB and LDL. This is a pattern commonly seen on a carnivore or very low carbohydrate diet: the absence of carbohydrate produces excellent triglycerides, excellent HDL, and excellent insulin sensitivity, but the high intake of saturated animal fat raises LDL particle count. Given her hypertension and family history, the ApoB at 1.16 is worth addressing. The ratio metrics are reassuring and suggest that the quality of her lipid profile is better than the raw LDL number implies, but an ApoB above 0.9 in someone with existing cardiovascular risk factors deserves a conversation with her GP about whether dietary modification alone is sufficient or whether a statin should be considered. The dietary approach would be to introduce more oily fish (salmon, mackerel, sardines), shift some of the animal fat from saturated sources (beef fat, butter) towards monounsaturated sources (olive oil, avocado), and consider adding soluble fibre through ground flaxseed or psyllium husk, which is compatible with a predominantly animal-based diet.\n\nHer thyroid is working but not optimally. TSH at 2.1 is within the ideal range, and her thyroid antibodies are both negative, ruling out autoimmune thyroid disease. Free T4 at 16.6 is within the ideal range. However, her Free T3, which is the active thyroid hormone that cells actually use for energy, is 3.7 against a range of 2.6 to 7.1 and an optimal band of 4.5 to 6.5. This means the thyroid is producing adequate T4 but the conversion to the active T3 form is below ideal. The FT3-to-FT4 ratio is 0.223, which sits at the very bottom of the reference range of 0.2 to 0.45 and below the optimal zone of 0.27 to 0.4. Poor T4-to-T3 conversion is one of the most common causes of fatigue, afternoon energy crashes, and feeling cold, and it is particularly relevant here because she describes chronic low energy and an afternoon crash as her primary complaints. T3 conversion depends on selenium, zinc, iron and adequate calorie intake, and her carnivore diet should provide most of these, but her very low vegetable intake means she may be missing selenium from Brazil nuts and zinc from shellfish and seeds. This is a finding worth monitoring: if her energy does not improve with the changes in this report, a repeat of FT3 in three months and a conversation with her GP about whether a small dose of supplemental T3 (liothyronine) alongside her existing thyroid output could help would be reasonable.\n\nHer hormone picture is consistent with established menopause. FSH at 95.97 and LH at 35.29 confirm postmenopausal status. Oestradiol is below 43, which is expected. Progesterone at 0.61 is within the postmenopausal range. However, her SHBG, which is sex hormone binding globulin, is markedly elevated at 169.4 against an upper limit of 146. SHBG binds testosterone and makes it unavailable to tissues. Her total testosterone at 0.8 is within the female range of 0.5 to 2.6, but because SHBG is so high, her free testosterone is only 0.0042, well below the lower limit of 0.013, and her free androgen index is 0.47 against a lower limit of 0.5. Her bioavailable testosterone is 0.09 against an optimal range of 0.12 to 0.55. In practical terms, very little testosterone is reaching her tissues. Low free testosterone in postmenopausal women is associated with reduced energy, difficulty building and maintaining muscle, lower libido, and brain fog. The high SHBG is likely driven by her lean body composition and low insulin (insulin suppresses SHBG, so very insulin-sensitive people tend to have higher SHBG). This is worth discussing with her GP or an HRT prescriber, as testosterone replacement in postmenopausal women is increasingly recognised as beneficial for energy, muscle preservation and quality of life.\n\nHer white blood cell count at 3.33 is below the laboratory range of 4 to 10, driven by neutrophils at 1.77 against a lower limit of 2.0. Her basophils at 0.01 are marginally below the lower limit of 0.02. Lymphocytes, monocytes and eosinophils are all within range. A mildly low white cell count in a lean, healthy 65-year-old woman who is not unwell is most commonly benign ethnic neutropenia or simply a constitutional variant, particularly in people of European ancestry where this is seen in up to 5 to 10 percent of the population. Her CRP at 0.7 is well within the optimal range of below 1.0, and her immunoglobulins are all normal, so there is no sign of infection, chronic inflammation or immune deficiency. Her ESR at 13 is marginally above the upper limit of 12 for her age, but at one point above, this is within the margin of laboratory variation and does not change the picture. The low WBC should be noted by her GP as a baseline so that future results can be compared, but on its own it does not indicate disease.\n\nHer reticulocyte percentage at 0.91 is within range, but the absolute reticulocyte count at 41.6 is below the lower limit of 50. Reticulocytes are young red blood cells released by the bone marrow. Her haemoglobin at 145 is strong, sitting near the top of the female range, so the bone marrow is not failing to produce red cells. A low absolute reticulocyte count with a strong haemoglobin simply means the marrow does not need to produce new cells at a high rate because the existing ones are lasting well. Her iron studies support this: ferritin at 146 is within the optimal range for a woman, serum iron at 17.3 is good, and transferrin saturation at 29.6 percent is ideal. Her transferrin at 2.33 is marginally below the lower limit of 2.5. Transferrin is the protein that carries iron in the blood, and a mildly low transferrin with adequate iron stores and saturation suggests the body is not demanding more iron transport capacity because stores are sufficient. This is not a concern.\n\nHer C-peptide at 0.455 ug/l (approximately 150.6 pmol/L) is below the laboratory range of 1.1 to 4.4. C-peptide is produced by the pancreas alongside insulin, and a low C-peptide with a low insulin and a perfect glucose and HbA1c is not a sign of pancreatic failure. It means the pancreas is producing exactly as much insulin as it needs to, which on a very low carbohydrate carnivore diet is very little. This is a physiological response to low carbohydrate intake, not pathology.\n\nHer magnesium at 0.83 is within the laboratory range but below the optimal band of 0.85 to 1.05. Given that she supplements magnesium, this suggests either the dose or the form could be optimised. Magnesium glycinate before bed at 400mg would be the recommendation. Her B12 at 437 is within range but below the optimal zone of 500 to 900 for a carnivore diet, which is surprising because animal products are rich in B12; a sublingual methylcobalamin supplement would bring this into the ideal range. Her folate at 12 is within range but this is notable on a carnivore diet with very low vegetable intake, as folate is predominantly found in leafy greens and legumes; liver is the main animal source and should be included regularly if she is not already eating it.\n\nHer DHEA-S at 1.4 umol/L (approximately 516 ug/dL) is within range. Her creatine kinase at 61 is within range, reflecting no unusual muscle damage from her training. Her blood counts are otherwise healthy: haemoglobin, red cells, haematocrit, MCV, MCH, MCHC, platelets and MPV are all within range. Her oestradiol being below 43 is expected postmenopausally and is not abnormal; the laboratory flags it but the postmenopausal range extends to 118.2, so this is within the expected range for her status.","links":"The thread that ties several of the findings together is the carnivore diet and its metabolic consequences. A diet composed almost exclusively of animal products, with 0 to 1 portions of vegetables and fruit a day, produces a very specific metabolic signature: excellent insulin sensitivity (HOMA-IR 0.52, fasting insulin 2.86, glucose 4.1, HbA1c 33), low triglycerides (0.74), high HDL (2.2), but elevated LDL (5.05) and ApoB (1.16). The low C-peptide is part of the same pattern: the pancreas simply does not need to produce much insulin because the carbohydrate load is minimal. The presence of urinary ketones confirms she is in a state of nutritional ketosis, which is entirely consistent with her dietary approach. The diet also explains the elevated total antioxidant activity, likely boosted by her omega-3 supplementation and the absence of oxidative stress from processed foods and sugar.\n\nThe second thread is the hormonal picture and its connection to her energy complaints. The combination of low free T3 (3.7, below optimal), very low free testosterone (0.0042, below range), and high SHBG (169.4, above range) creates a hormonal environment where the two hormones most responsible for cellular energy production and tissue vitality are both underperforming. Free T3 drives the metabolic rate of every cell in the body, and free testosterone supports muscle maintenance, energy and mood. With both low, her chronic fatigue and afternoon crash have a plausible hormonal explanation that the blood results can point to, even though neither TSH nor total testosterone is outside the laboratory range. Her lean body composition (BMI 21.2) and very low insulin both contribute to the high SHBG, which in turn traps the limited testosterone she produces.\n\nThe digestive symptoms, the on and off stomach pain, and the bloating sit alongside the elevated CEA, and while these may be entirely separate issues, they share enough anatomical territory to warrant investigation together. The stomach pain and bloating on a carnivore diet could relate to bile acid production (a very high fat diet demands significant bile output), low fibre intake affecting gut motility, or an underlying condition such as gastritis, a Helicobacter pylori infection, or diverticular disease. The elevated CEA adds urgency to investigating the gut rather than attributing symptoms to diet alone. Her pancreatic enzymes (amylase 37, lipase 37) are both mid-range, which makes pancreatic causes less likely. Her coeliac screen is negative.\n\nThe nocturia, urinating two to three times per night, is worth noting alongside her clean urinalysis and her strong kidney function. The urine shows no infection, no glucose (ruling out undiagnosed diabetes driving osmotic diuresis), and her kidney filtration is excellent. At 65, nocturia is common and can be driven by reduced bladder capacity, reduced nocturnal ADH (antidiuretic hormone) production, or her blood pressure medication, which may include a diuretic component. This is worth mentioning to her GP, particularly to review whether her antihypertensive regimen contributes.\n\nWhat has been positively excluded is important. There is no anaemia, no iron deficiency, no B12 or folate deficiency severe enough to cause symptoms, no thyroid autoimmunity, no diabetes, no kidney disease, no liver disease, no coeliac disease, no immune deficiency, no significant inflammation, and no urinary tract pathology. The dizziness and light-headedness she reports could relate to her blood pressure medication (postural hypotension is common with antihypertensives, particularly in lean individuals), to the low free T3 and low free testosterone affecting vascular tone and energy, or to the very low insulin and lean mass meaning she has limited glycogen reserves and may be more susceptible to drops in blood pressure on standing. A home blood pressure diary, measuring both sitting and standing, would help clarify whether her medication dose is too high for her current weight and metabolic health.","lifestyle":"Add one portion of oily fish (salmon, mackerel, sardines) at least three times a week, replacing some of the saturated animal fat in your meals. Anchor: make two of your weekly dinners fish-based, and keep a tin of sardines for a third. Why: oily fish provides omega-3 in its most bioavailable form and helps lower LDL particle count, which is the driver behind your ApoB of 1.16.\nAdd one tablespoon of ground flaxseed or psyllium husk to a meal or a glass of water each day. Anchor: first thing in the morning before breakfast. Why: soluble fibre binds cholesterol in the gut and lowers LDL, and it also supports gut motility, which may help with the bloating and stomach pain you describe.\nInclude liver (chicken, lamb or beef) once a week. Anchor: batch-cook and freeze portions. Why: liver is the richest animal source of folate, B12, vitamin A and copper, covering nutritional gaps that a carnivore diet without organ meats can leave, and will support your B12 of 437 and folate of 12.\nEat a small protein-rich snack at 2 to 3pm on days when the afternoon crash hits. Anchor: set a phone reminder for 2pm. Why: your insulin is very low and your glycogen stores are limited on a carnivore diet, so a mid-afternoon dip may be a genuine fuel gap rather than a sleep issue. A few slices of chicken, some cheese, or a boiled egg may be enough to bridge it.\nContinue your four training sessions per week but consider adding one session of dedicated zone 2 cardio (brisk walking, cycling or swimming where you can hold a conversation) for 30 to 45 minutes. Anchor: attach it to one of your existing training days as a warm-up or cool-down, or add it as a fifth session. Why: zone 2 cardio improves mitochondrial density, which directly supports energy production, and it lowers cardiovascular risk alongside your existing resistance training.\nKeep your 10,000 to 15,000 daily steps. This is an excellent foundation and is contributing to your strong metabolic health.\nTake your magnesium supplement (glycinate form, 400mg) in the evening before bed rather than at another time of day. Anchor: with your last glass of water before bed. Why: your magnesium at 0.83 is just below the optimal zone of 0.85, and evening dosing supports both absorption and sleep quality.\nAim for 7 to 7.5 hours of sleep by bringing your bedtime forward by 30 minutes. Anchor: set an alarm for wind-down time. Why: 6 to 7 hours is adequate but not optimal for recovery at 65, particularly with four training sessions a week, and the additional sleep may help the afternoon energy dip.","flags":"CEA (carcinoembryonic antigen) is 4.08 ng/ml, above the non-smoker upper limit of 2.3. In a 65-year-old woman with longstanding digestive symptoms (bloating, on and off stomach pain), this warrants investigation. GP should consider a repeat CEA, FIT test and referral for colonoscopy.\nApoB is 1.16 g/L, above the 0.9 target. LDL is 5.05 against an upper limit of 3.0. Non-HDL cholesterol is 5.3 against an upper limit of 4.0. Total cholesterol is 7.5. These are driven by high saturated fat intake on a carnivore diet. Mitigating factors: HDL 2.2 (excellent), triglycerides 0.74 (excellent), ApoB/A1 ratio 0.545 (lower risk), Lp(a) below 25 (ideal, confirming all LDL is modifiable). Given hypertension and family history of cardiovascular disease before 60, the ApoB should be addressed through diet modification and a GP discussion about statin consideration.\nFree T3 is 3.7 pmol/L, within the laboratory range of 2.6 to 7.1 but below the optimal zone of 4.5 to 6.5. FT3:FT4 ratio is 0.223, at the bottom of range and below optimal. This suggests suboptimal T4-to-T3 conversion and may contribute to chronic fatigue and afternoon energy crash.\nSHBG is 169.4 nmol/L, above the upper limit of 146. Free testosterone (calculated) is 0.0042 nmol/L, below the lower limit of 0.013. Free androgen index is 0.47, below the lower limit of 0.5. Bioavailable testosterone is 0.09 nmol/L, below optimal. High SHBG is binding most of her testosterone, leaving very little available to tissues. Associated with fatigue, difficulty maintaining muscle, and reduced vitality. Worth discussing testosterone replacement with GP or HRT prescriber.\nWhite cell count is 3.33, below the lower limit of 4.0, driven by neutrophils at 1.77 (lower limit 2.0). CRP 0.7 and immunoglobulins all normal. Most likely a constitutional variant (benign neutropenia). Should be recorded as a baseline for future comparison.\nC-peptide is 0.455 ug/l (approximately 150.6 pmol/L), below the laboratory range of 1.1 to 4.4. In the context of perfect glucose (4.1), HbA1c (33), and very low insulin (2.86), this reflects low carbohydrate intake on a carnivore diet, not pancreatic insufficiency.\nTransferrin is 2.33 g/L, marginally below the lower limit of 2.5. Iron stores are adequate (ferritin 146, saturation 29.6%), so this reflects sufficient iron status rather than an iron transport problem.\nReticulocyte absolute count is 41.6, below the lower limit of 50. Haemoglobin is strong at 145. The marrow is not under-producing; it does not need to because existing red cells are lasting well.\nESR is 13 mm/hour, marginally above the limit of 12. At one point above with CRP of 0.7 and no clinical signs of inflammation, this is within laboratory variation.\nBasophils at 0.01 are marginally below the lower limit of 0.02. This is clinically insignificant.\nReassuring negatives: kidney function excellent (cystatin C eGFR 116), liver fully healthy (ALT 23, GGT 15, APRI 0.327, NAFLD score -1.383), metabolic health exceptional (HOMA-IR 0.52, HbA1c 33, glucose 4.1), no anaemia (Hb 145, ferritin 146), thyroid antibodies negative, coeliac screen negative, CA125 clear (10.7), CA19-9 clear (1.23), rheumatoid factor negative, immunoglobulins normal, urinalysis clean, no diabetes, CRP 0.7 (below 1.0), Lp(a) ideal (below 25).","recommendations":"Discuss the elevated CEA of 4.08 (non-smoker limit 2.3) with your GP alongside your longstanding digestive symptoms. Ask about a repeat CEA, a FIT test and whether a colonoscopy referral is appropriate given your age and symptoms.\nDiscuss your lipid profile with your GP: ApoB 1.16 (target below 0.9), LDL 5.05 (target below 3.0). Given your hypertension and family history of cardiovascular disease before 60, ask whether dietary modification alone is sufficient or whether a statin should be considered. Your Lp(a) is ideal (below 25), meaning all of the elevated LDL is modifiable.\nDiscuss your free testosterone of 0.0042 (below 0.013) and SHBG of 169.4 (above 146) with your GP or an HRT prescriber. Testosterone replacement in postmenopausal women is increasingly used for energy, muscle maintenance and quality of life, and may help your chronic fatigue.\nAsk your GP to check your Free T3 (currently 3.7, below optimal of 4.5) if energy does not improve in three months. Suboptimal T4-to-T3 conversion may be contributing to the afternoon crash.\nMention the low white cell count (3.33, neutrophils 1.77) so it is recorded as your baseline. No action needed unless it falls further on a future test.\nDiscuss your nocturia (two to three times per night) with your GP, particularly whether your blood pressure medication could be contributing and whether a medication review is appropriate given your lean body composition (BMI 21.2) and excellent metabolic health.\nMention the dizziness and light-headedness and ask about postural blood pressure measurement (sitting then standing). In a lean woman on long-term antihypertensives, the dose may be more than currently needed.\nCalorie target: approximately 1,750 to 1,950 kcal per day (BMR estimated at 1,270 kcal, multiplied by 1.45 to 1.55 for her activity level with four training sessions and 10,000 to 15,000 steps). Protein target: 78 to 96g per day (1.3 to 1.6g per kg at 59.9 kg with moderate resistance training). Retest in three to four months, repeating CEA, full lipid panel with ApoB, FT3 and FBC to track the markers that matter most.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily with a fat-containing meal. Her level at 165 is excellent and current supplementation is working well; maintain the current dose to stay in the optimal range of 75 to 120 and above. Always take with vitamin K2.\nVitamin K2 (MK-7), 100 to 200 mcg daily, taken with vitamin D. K2 directs calcium into bones and away from artery walls, which matters alongside her blood pressure history and her cardiovascular risk profile.\nMagnesium glycinate, 400mg in the evening before bed. Her magnesium at 0.83 is just below the optimal zone of 0.85. Glycinate is the best-absorbed form and supports sleep quality and muscle recovery.\nOmega-3 fish oil, 2 to 3g of combined EPA and DHA daily with food. Continue current supplementation. This supports the cardiovascular picture (ApoB 1.16, LDL 5.05) and contributes anti-inflammatory benefits reflected in her CRP of 0.7.\nSublingual methylcobalamin (vitamin B12), 1,000 mcg daily. Her B12 at 437 is within range but below the optimal zone of 500 to 900. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets.\nSelenium, 100 to 200 mcg daily (selenomethionine form), with a meal. Selenium is a co-factor for the enzyme that converts T4 to the active T3 form, and her Free T3 at 3.7 is below optimal. On a carnivore diet with no Brazil nuts or grains, supplementation is the most reliable way to ensure adequate selenium.\nZinc, 15 to 25mg daily (zinc picolinate or bisglycinate), taken with food but away from any iron-rich meal by at least two hours. Zinc also supports T4-to-T3 conversion and immune function, relevant given her low white cell count.\nDO NOT take iron supplements. Her ferritin is 146, her transferrin saturation is 29.6%, and her serum iron is 17.3. Iron stores are adequate and supplementation could push them into excess.\nThe most important changes from this report are not supplements. They are the GP conversations about the CEA and the lipid profile, the dietary shifts to lower ApoB (oily fish three times a week, soluble fibre daily, reducing saturated fat), and the investigation of whether testosterone replacement and a blood pressure medication review could address the chronic fatigue, dizziness and nocturia.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 42 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 42.1. Weakest systems: lipids & cardiovascular 12%, tumor markers 24%, kidney function 27%. Biggest drags: LDL Cholesterol, Apolipoprotein B, White Blood Cell Count, Sex Hormone Binding Globulin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"52.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3743","lower_normal":"","upper_normal":"70","lower_optimal":"","upper_optimal":"65","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4643","units":"years","description":"PhenoAge is a biological age estimate calculated from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP and white cell count. Her PhenoAge of 52.4 against a calendar age of 65 means her biology is performing nearly thirteen years younger than her chronological age. The drivers of this excellent result include her low CRP (0.7), healthy albumin (40), excellent glucose (4.1), clean kidney function (creatinine 45) and normal ALP (80). This is one of the standout findings in the report.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, not the ten-year chance of an event. Her score of 35 is below the 40 threshold but above the ideal target of 20, driven almost entirely by the elevated ApoB (1.16) and LDL (5.05). Her outstanding HDL (2.2), excellent triglycerides (0.74), low CRP (0.7) and ideal Lp(a) are keeping the score from being higher. Reducing ApoB through the dietary changes recommended in this report should bring this score towards the ideal zone.","low_causes":"Low ApoB, high HDL, low triglycerides, low CRP","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the amount of sugar circulating in the bloodstream at the moment the sample was taken. Her result of 4.1 is excellent, sitting right at the start of the optimal zone. This reflects the very low carbohydrate content of her carnivore diet and confirms her blood sugar control is outstanding for a 65-year-old.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Diabetes, insulin resistance, stress, infection, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6 al range of 75 to 120. This excellent level reflects her supplementation. There is no risk of toxicity at this level, but she could consider slightly reducing her dose to maintain a level in the 100 to 120 range, which is the sweet spot. For now, continuing at 2,000 IU daily is appropriate.","low_causes":"Insufficient sunlight, poor supplementation, dark skin, obesity, malabsorption","high_causes":"Supplementation, excessive sunlight exposure","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.986","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3339","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.5573","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate levels by controlling how much calcium is released from bones, absorbed from the gut and retained by the kidneys. Her result of 0.986 pmol/L sits right at the bottom of the laboratory range of 0.98 to 4.73. With a normal corrected calcium of 2.52 and a strong vitamin D of 165, this makes sense: the high vitamin D is providing plenty of calcium from the gut, so the parathyroid gland does not need to work to maintain calcium levels. This is a healthy suppression rather than a parathyroid problem.","low_causes":"High vitamin D levels, high calcium levels, magnesium deficiency","high_causes":"Vitamin D deficiency, low calcium, kidney disease, parathyroid adenoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"437","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4364","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. Her result of 437 pg/mL is within the laboratory range of 193 to 982 but below the optimal zone of 500 to 900. This is somewhat surprising on a carnivore diet, which is naturally rich in B12 from meat. Absorption can decline with age, and a sublingual methylcobalamin supplement (1,000 mcg daily, dissolved under the tongue for direct absorption) would bring this into the ideal range.","low_causes":"Poor absorption (age-related, pernicious anaemia, PPIs), vegan or vegetarian diet","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and cell division. Her result of 12 ng/mL is within the optimal range, which is a good result on a carnivore diet with very low vegetable intake. She is likely getting folate from liver or eggs. Maintaining this through regular organ meat consumption is important, as folate is predominantly found in leafy green vegetables.","low_causes":"Low vegetable intake, alcohol, malabsorption, pregnancy, certain medications","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7239","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL and VLDL. Her result of 7.5 mmol/L is above the desirable threshold of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk because it includes the protective HDL. Her HDL of 2.2 accounts for a large portion of the total, which is why the TC/HDL ratio of 3.41 is within the healthy range. The individual fractions and ApoB are more informative.","low_causes":"Malnutrition, liver disease, hyperthyroidism, certain medications","high_causes":"High saturated fat intake, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2176","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood that come from dietary fat and from the liver converting excess sugar into fat. Her result of 0.74 mmol/L is excellent, well within the optimal zone of below 1.0. Low triglycerides are a hallmark of low-carbohydrate diets and reflect the absence of sugar-driven fat production in the liver.","low_causes":"Very low carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate or sugar intake, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues. Her result of 0.34 mmol/L is well within the optimal range, reflecting low triglyceride production consistent with her very low carbohydrate intake.","low_causes":"Low carbohydrate intake, good metabolic health","high_causes":"High carbohydrate intake, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7097","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5161","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL (high-density lipoprotein) is known as the protective cholesterol because it removes LDL from artery walls and transports it back to the liver for disposal. Her result of 2.2 mmol/L is outstanding, well above the optimal threshold of 1.6 for women. High HDL is strongly protective against cardiovascular disease and is one of the clearest benefits of her low-carbohydrate dietary approach.","low_causes":"Sedentary lifestyle, obesity, smoking, high sugar diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, low-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9400","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) cholesterol deposits cholesterol in artery walls and is the primary driver of atherosclerosis (plaque build-up). Her result of 5.05 mmol/L is significantly above the upper limit of 3.0 and well above the optimal target of below 2.6. On a carnivore diet high in saturated animal fat, this degree of elevation is commonly seen. Given her hypertension and family history of cardiovascular disease before 60, this level warrants action through dietary modification and a GP discussion.","low_causes":"Low-fat diet, statin use, hyperthyroidism, liver disease","high_causes":"High saturated fat intake, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3789","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL and is a better predictor of cardiovascular risk than total cholesterol alone. Her ratio of 3.41 is within the optimal zone of below 3.5, reflecting how her high HDL of 2.2 offsets the elevated total cholesterol. This is one of the reassuring features of her lipid profile.","low_causes":"Very high HDL, very low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7332","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL fraction. Her result of 29.33% is well above the 20% minimum and within the optimal zone, confirming that a substantial portion of her total cholesterol is the beneficial, protective type.","low_causes":"Low HDL, metabolic syndrome, obesity","high_causes":"High HDL, excellent metabolic health","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol subtracts the protective HDL from total cholesterol, giving a measure of all the potentially harmful cholesterol fractions combined. Her result of 5.3 mmol/L is above the upper limit of 4.0, driven by the elevated LDL. This aligns with the ApoB finding and confirms that reducing LDL is the priority.","low_causes":"Low-fat diet, statin use","high_causes":"High saturated fat intake, familial hypercholesterolaemia, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7607","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles and is a marker of the body's capacity to remove cholesterol from artery walls. Her result of 2.13 g/L is excellent, well above the normal threshold of 1.4. This reflects robust reverse cholesterol transport, meaning her body is actively clearing cholesterol from arteries.","low_causes":"Low HDL, smoking, sedentary lifestyle, metabolic syndrome","high_causes":"High HDL, regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this is essentially a direct count of atherogenic (artery-damaging) particles. Her result of 1.16 g/L is above the 0.9 target, sitting at the borderline-high threshold. Each particle can enter the artery wall and deposit cholesterol, so reducing this number is the single most impactful cardiovascular change she can make. Given her hypertension and family history, the GP should be part of this conversation.","low_causes":"Low LDL, statin use, low-fat diet","high_causes":"High saturated fat intake, familial hypercholesterolaemia, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.545","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4542","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio balances the number of harmful particles (ApoB) against the protective capacity (ApoA1). Her ratio of 0.545 is within the lower-risk zone of below 0.6, driven by her exceptionally high ApoA1 of 2.13 offsetting the elevated ApoB. This ratio is one of the best single predictors of cardiovascular risk, and being below 0.6 is reassuring even though the ApoB alone is above target.","low_causes":"Low ApoB, high ApoA1, excellent metabolic health","high_causes":"High ApoB, low ApoA1, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a) is an inherited variant of LDL that carries additional clotting and inflammatory properties. Unlike other cholesterol markers, it cannot be changed by diet, exercise or most medications. Her result of below 25 nmol/L is ideal (below 32). This is genuinely useful information because it confirms that all of her elevated LDL and ApoB is driven by modifiable factors, specifically her dietary saturated fat intake, rather than by an inherited risk she cannot change.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4019","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme found in muscles (skeletal and cardiac) that is released when muscle is damaged or stressed. Her result of 61 U/L is within the optimal range, indicating no excessive muscle breakdown from her training and no cardiac muscle stress.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4851","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the main hormone produced by the thyroid gland and acts as the raw material that cells convert into the active hormone T3. Her result of 16.6 pmol/L is within the optimal range of 14 to 20, confirming the thyroid is producing adequate T4. The issue is not production but conversion to T3.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4555","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH is produced by the pituitary gland in the brain and tells the thyroid how much hormone to make. A higher TSH means the brain is asking the thyroid to work harder. Her result of 2.1 mIU/L is within the optimal range of 1.0 to 2.5, confirming the brain-thyroid communication is working well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroid antibodies","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4148","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use to regulate energy production, body temperature and metabolic rate. Her result of 3.7 pmol/L is within the laboratory range of 2.6 to 7.1 but below the optimal zone of 4.5 to 6.5. This means that while the thyroid produces adequate T4 (16.6), the conversion to the active T3 is not happening as efficiently as it could. Low Free T3 is one of the most common causes of fatigue, afternoon energy dips, feeling cold and difficulty losing weight, and it is highly relevant to her longstanding low energy. The conversion process depends on selenium, zinc and adequate calorie intake.","low_causes":"Poor T4-to-T3 conversion, selenium or zinc deficiency, calorie restriction, chronic illness, ageing","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3261","units":"U/mL","description":"TPO antibodies are markers of autoimmune attack on the thyroid gland, seen in conditions such as Hashimoto's thyroiditis. Her result of below 6.6 U/mL is well within the normal range and below the autoimmune threshold, ruling out autoimmune thyroid disease as a cause of her low FT3.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"3.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4091","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to make hormones. Her result of 3.6 U/mL is below the autoimmune cutoff of 4.4, further confirming no autoimmune thyroid disease. Both thyroid antibodies being negative is reassuring.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.223","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3640","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3-to-FT4 ratio indicates how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). Her ratio of 0.223 sits at the very bottom of the reference range of 0.2 to 0.45 and below the optimal zone of 0.27 to 0.4. This confirms suboptimal conversion and is the main driver behind the low Free T3 of 3.7. Supporting conversion with selenium and zinc may help improve this ratio and, with it, her energy levels.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c19","name":"CA19-9","group":"TUMOR MARKERS","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0166","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA19-9 is a tumour marker primarily associated with pancreatic and biliary (bile duct) cancers. Her result of 1.23 U/mL is very low, well within the normal range of below 37. This is reassuring and helps rule out pancreatic pathology alongside her normal amylase and lipase.","low_causes":"Normal finding","high_causes":"Pancreatic cancer, bile duct cancer, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"4.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8870","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4348","units":"ng/mL","description":"CEA (carcinoembryonic antigen) is a protein that can be produced by certain tissues, particularly in the bowel. It is used as a screening marker for colorectal and other gastrointestinal cancers. Her result of 4.08 ng/mL is above the non-smoker upper limit of 2.3. CEA can be raised by a number of benign conditions including gut inflammation, diverticular disease, gastritis and benign polyps, so an elev
