<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Pamela Maisey","dob":"14/01/1961","report_date":"2026-10-31","summary":"Patient is a 65-year-old female presenting with a BMI of 21.2, following a carnivore diet (mostly or exclusively animal products), eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She trains four times per week (two cardio, two resistance) at moderate intensity with 10,000 to 15,000 daily steps. She sleeps 6 to 7 hours, wakes feeling refreshed, but reports an afternoon energy crash; stress feels hard to manage rarely. She does not drink alcohol. She supplements with vitamin D, magnesium and omega-3 fish oil. She takes medication for hypertension, which she has been on for over ten years. Her family history includes heart attack or stroke before the age of 60. She reports low energy and fatigue that she describes as chronic and lifelong, palpitations or dizziness that have also persisted for years, and bloating or digestive discomfort with on-and-off stomach pain. She also notes increased nocturia, getting up two and occasionally three times a night. She has not had blood tests before. Her goals are to improve energy levels, improve long-term health and longevity, and improve cardiovascular fitness.\n\nHer PhenoAge, a biological ageing score built from markers of inflammation, blood sugar, kidney function and blood cell health, comes in at 52.4 against a calendar age of 65, which places her biological age more than twelve years younger than her chronological age. That is an excellent result and reflects genuinely healthy metabolic and immune function beneath the surface. Before turning to the areas that need attention, it is worth setting out how much is working well in this panel, because the list is long.\n\nHer blood sugar control is outstanding. Fasting glucose at 4.1 is right in the middle of the ideal range, and her HbA1c, a measure of average blood sugar over the preceding three months, is 33 mmol/mol, well inside the optimal zone and a long way from the pre-diabetic threshold of 42. Fasting insulin at 2.86 is at the very low end of the reference range, and her HOMA-IR, a calculation that combines glucose and insulin to estimate how sensitive the body's cells are to insulin, is 0.52, which is exceptional. At this level the body is clearing glucose from the bloodstream with minimal insulin effort. This pattern is consistent with a carnivore diet, which is naturally very low in carbohydrate, and with her lean body composition at BMI 21.2. Her liver is in excellent health. ALT at 23 and AST at 26 are both well within range, Gamma GT at 15 is about as clean as that marker gets, bilirubin is healthy at 15, and albumin at 40 reflects good synthetic function. Her APRI score, a marker of liver scarring, is 0.33, well inside the ideal zone. Her FIB-4, a fibrosis index that uses age, platelets, ALT and AST, is 1.77, which is above the standard threshold of 1.45 but at 65 and over, a score below 2.0 is generally not considered significant. In her case the score is being pushed up by her age sitting in the numerator and by a relatively low ALT sitting in the denominator; with every actual liver marker clean, this is the arithmetic of the formula rather than a sign of liver disease. Her kidney function is excellent. Cystatin C at 0.65 gives an estimated GFR of 116, which is superb at 65. Urea, uric acid and electrolytes are all within range. Her calcium is healthy at 2.52 corrected, and her parathyroid hormone at 0.986, sitting right at the lower boundary of the reference range, is consistent with adequate calcium and vitamin D. Her vitamin D is 165 nmol/L, which is well above the sufficient threshold of 50 and above the optimal range of 75 to 120. This is a reflection of consistent supplementation and is safe at this level, though there is no added benefit beyond about 120, so she could reduce her dose slightly. Her thyroid stimulating hormone, TSH, is 2.1, sitting comfortably in the ideal zone of 1.0 to 2.5, free T4 at 16.6 is healthy, and both thyroid antibodies are negative, ruling out autoimmune thyroid disease. Her CA-125, a screening marker for ovarian pathology, is 10.7, well within the normal range, and CA 19-9 at 1.23 is similarly reassuring. Her immunoglobulins IgG, IgM, IgA and IgE are all within range, rheumatoid factor is negative, and her coeliac screen is negative. Her urinalysis is clean across the board, with no protein, no glucose, no blood, no white cells, no nitrites and no casts. The presence of trace ketones is expected on a carnivore diet and simply confirms she is in mild nutritional ketosis. Her amylase and lipase, markers of pancreatic health, are both well within range, which is reassuring given her report of abdominal pain. Her cortisol at 396 is in a healthy morning range and does not suggest adrenal dysfunction. Her ApoA1 at 2.13 is excellent, her HDL at 2.2 is very high, and her triglycerides at 0.74 are ideal. Her TG to HDL ratio, one of the best markers of metabolic health, is 0.34, which is exceptional. Her atherogenic index is negative at minus 0.47, reflecting a favourable balance between protective and harmful lipid particles. Her iron studies show healthy iron at 17.3, healthy ferritin at 146, and a transferrin saturation of 29.6 percent, all within the ideal zone. Her creatine kinase at 61 is within range and does not suggest muscle damage from training.\n\nTurning to the areas that warrant attention, the most important finding in this report is the lipid pattern, viewed alongside her family history of heart attack or stroke before the age of 60. Her total cholesterol is 7.5, her LDL is 5.05 against a target of below 3.0, and her ApoB, which counts the actual number of cholesterol-carrying particles that can enter the artery wall, is 1.16 against a target of below 0.9. Her non-HDL cholesterol is 5.3 against a target of below 4.0. Her Lp(a), an inherited lipoprotein that adds cholesterol-independent cardiovascular risk, is below 25 nmol/L, which is genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors rather than by an inherited particle she cannot change. Her Cardiovascular Risk Score, a TrueVitals index that combines ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c on a scale of 0 to 100, is 35 out of 100. That score sits within the acceptable range of 0 to 40 but above the ideal threshold of 20, and the inputs driving it are the ApoB and LDL. What makes this picture more nuanced than a simple \"cholesterol is high\" is the context. Her HDL is 2.2, which is exceptionally protective. Her triglycerides are 0.74, which is ideal. Her ApoB to ApoA1 ratio, which is the single best summary of lipid-driven risk, is 0.545, just inside the lower-risk threshold of below 0.6. Her hsCRP, a marker of vascular inflammation, is 0.7, which is low. So the picture is one of elevated LDL particle count alongside a metabolic environment that is otherwise remarkably clean. The carnivore diet, which is high in saturated fat, is the most likely driver of the elevated LDL and ApoB. The question is whether the protective factors are enough to offset the particle count, and with a family history of premature cardiovascular disease, the answer leans toward acting on the ApoB. The Lp(a)-corrected LDL, which strips out the small contribution Lp(a) makes to the LDL measurement, is 4.97, confirming that virtually all of the LDL elevation is modifiable. We would recommend discussing this lipid profile with her GP, bringing the ApoB of 1.16, the family history, and the otherwise favourable metabolic context. The GP may consider whether a statin or other lipid-lowering therapy is warranted given the family history, or whether a trial of dietary modification is the first step.\n\nHer free T3 is 3.7 pmol/L. While this is within the laboratory range of 2.6 to 7.1, it sits below the optimal zone of 4.5 to 6.5. Free T3 is the active thyroid hormone, the form the body's cells actually use for energy, temperature regulation, metabolism and mood. The FT3 to FT4 ratio, which measures how efficiently the body is converting the storage hormone T4 into the active T3, is 0.223, which is at the lower boundary of the reference range of 0.2 to 0.45 and below the optimal zone of 0.27 to 0.4. This means the thyroid is producing adequate T4 but the conversion into the active form is not as efficient as it could be. Poor T3 conversion is a recognised contributor to fatigue, afternoon energy crashes, feeling cold, and brain fog, and it may be one piece of the puzzle behind her lifelong low energy. Common drivers of poor conversion include low selenium, low zinc, stress, low calorie intake, and low iron, though her iron is fine. At 65, conversion efficiency also naturally declines. This is not hypothyroidism and does not need thyroid medication, but optimising the nutrients that support conversion, particularly selenium and zinc, may help.\n\nHer white blood cell count is 3.33, below the lower limit of 4.0, driven by neutrophils at 1.77, below the lower limit of 2.0. Her basophils at 0.01 are marginally below the lower limit of 0.02. A white cell count in this range is not uncommon in lean, healthy women, and in clinical practice a count between 3.0 and 4.0 with no recurrent infections is often considered a normal variant, sometimes called benign ethnic neutropenia although it occurs in all ethnicities. Her lymphocytes at 1.27 are within range, her inflammatory markers are low, and her immunoglobulins are all healthy, which taken together suggests her immune system is functioning well despite the lower neutrophil count. However, given that this is her first blood test, it would be worth her GP noting this as a baseline and repeating it in three to six months to confirm it is stable rather than a new decline.\n\nHer reticulocyte absolute count is 41.6, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A mildly low count at 65 with a healthy haemoglobin of 145 and healthy iron stores most likely reflects a bone marrow that is producing at a slightly slower pace because it does not need to replace cells any faster. Her haemoglobin, red cell count, MCV and MCH are all within range, so there is no anaemia and no functional consequence. Her ESR, the erythrocyte sedimentation rate, is 13 against an upper limit of 12 for her age. ESR is a non-specific marker of inflammation and at one point above the limit this is clinically insignificant, particularly with an hsCRP of 0.7 confirming there is no active systemic inflammation.\n\nHer transferrin is 2.33, marginally below the lower limit of 2.5. Transferrin is the protein that carries iron through the bloodstream. A mildly low transferrin with normal iron, normal ferritin and a healthy transferrin saturation of 29.6 percent does not suggest iron deficiency or overload. It can be a normal variant or reflect the fact that on a carnivore diet, iron absorption is very efficient through haem iron, meaning the body downregulates the transport protein because it does not need as much of it. This is worth noting but does not need action.\n\nHer hormonal picture is consistent with established menopause. FSH at 95.97 and LH at 35.29 confirm the ovaries have stopped cycling. Oestradiol is below 43 pmol/L, which is the expected postmenopausal level, and progesterone at 0.61 is similarly in the postmenopausal range. Her total testosterone at 0.8 is within the female reference range, but her free androgen index is 0.47, just below the lower limit of 0.5, and her calculated free testosterone is 0.0042 nmol/L, below the lower limit of 0.013. The reason is her SHBG, sex hormone binding globulin, which at 169.4 is well above the upper limit of 146. SHBG is a protein that binds testosterone and oestradiol, making them unavailable to the body's tissues. High SHBG is common in lean postmenopausal women, particularly on low-carbohydrate diets, because insulin normally suppresses SHBG production and with very low insulin (hers is 2.86) SHBG rises. The consequence is that although she is making a reasonable amount of testosterone for her age and sex, very little of it is free and bioavailable. Bioavailable testosterone, the fraction available to tissues, is 0.09 nmol/L, below the optimal range of 0.12 to 0.55. Low free testosterone in postmenopausal women is associated with reduced energy, reduced muscle recovery, lower libido, and difficulty building or maintaining lean mass. This is worth discussing with her GP or an HRT-prescribing clinician, as testosterone replacement is increasingly used in postmenopausal women for these symptoms.\n\nHer C-peptide is 0.455 ug/L, which is below the laboratory range of 1.1 to 4.4. C-peptide is released alongside insulin by the pancreas, in a one-to-one ratio, and is used to confirm how much insulin the body is making. In her case, the low C-peptide is entirely consistent with her very low fasting insulin of 2.86 and her very low carbohydrate intake on a carnivore diet. The pancreas is simply not being asked to produce much insulin because there is very little glucose coming in. Her fasting glucose and HbA1c are both excellent, confirming that this is a reflection of low demand rather than failing supply. Her HOMA-B, a calculation that estimates pancreatic beta cell function, is 95.3, within the healthy range of 80 to 200, confirming the pancreas is working normally. This is not a concern.\n\nHer magnesium at 0.83 is within the laboratory range of 0.53 to 1.11 but sits below the optimal zone of 0.85 to 1.05. Given that she supplements magnesium, this suggests she may benefit from a slightly higher dose or a change of form. Magnesium is important for blood pressure regulation, heart rhythm, sleep quality and muscle recovery, all of which are relevant to her goals and symptoms.\n\nHer B12 at 437 is within the laboratory range but below the optimal zone of 500 to 900. On a carnivore diet, which is rich in B12 from animal sources, this is a little surprising. Absorption can decline with age, and her on-and-off stomach discomfort raises the possibility that absorption may not be optimal. Sublingual methylcobalamin bypasses the gut and would be a sensible addition.\n\nHer folate at 12 is within range, but on a carnivore diet with 0 to 1 portions of vegetables a day, folate intake is likely marginal. Folate is needed for DNA repair, red blood cell production and homocysteine metabolism. While 12 is adequate, it is not generous, and given the very low vegetable intake it would be worth monitoring.\n\nRegarding her symptoms, the afternoon energy crash is the most consistent pattern to explain. Her blood sugar control is excellent, so this is not a glucose dip. The most likely contributors are her suboptimal free T3 and conversion ratio, which mean the cells may not be receiving enough active thyroid hormone to sustain energy through the day; her low free testosterone and high SHBG; her sleep of 6 to 7 hours, which at 65 may be slightly below what she needs for full recovery, particularly with the nocturia disrupting it two to three times; and possibly her below-optimal magnesium. The palpitations and dizziness she has experienced for years are worth her GP knowing about. Her haemoglobin is healthy so anaemia is excluded, her thyroid is not overactive, her potassium and calcium are within range, her cortisol is normal, and her heart-related blood markers are reassuring. However, palpitations and dizziness alongside hypertension and a blood pressure medication warrant a clinical assessment including an ECG and potentially a 24-hour monitor, which blood tests alone cannot replace. The bloating and digestive discomfort are not explained by any marker in this panel. Her coeliac screen is negative, her pancreatic enzymes are normal, her liver is healthy, and there is no inflammation. The most likely causes are ones that blood cannot measure: low fibre intake on a carnivore diet affecting gut motility, a possible food intolerance, gastric acid changes with age, or a functional gut issue such as irritable bowel syndrome. A food and symptom diary and a discussion with her GP about whether a hydrogen breath test for small intestinal bacterial overgrowth or lactose intolerance would be appropriate are sensible next steps. The nocturia, getting up two to three times a night, is worth mentioning to her GP alongside the blood pressure medication review, as some antihypertensives can affect fluid balance and bladder function, and nocturia at this frequency may also warrant a simple assessment of bladder function.\n\nHer total antioxidant activity at 1.89 is above the upper limit of 1.77. This is driven by her supplementation with omega-3 and vitamin D alongside a diet rich in animal-source antioxidants. It is not a concern and reflects a well-supplemented antioxidant status.\n\nHer creatinine at 45 is marginally below the lower limit of 49. In a lean woman of 59.9 kg with a BMI of 21.2 and moderate training, a low creatinine simply reflects low muscle mass. Her Cystatin C-based eGFR of 116 confirms that kidney function is excellent, and the low creatinine is a body composition finding rather than a kidney one. Her urea to creatinine ratio at 115.6 is mildly above the upper reference of 100, which is a mathematical consequence of the low creatinine denominator with a normal urea, not a sign of dehydration or kidney pathology.","links":"The findings in this report connect around three themes: a carnivore diet producing a metabolically clean but lipid-elevated pattern, a postmenopausal hormonal environment compounded by very high SHBG, and a set of symptoms that blood tests only partly explain.\n\nThe first thread ties together the exceptional insulin sensitivity (HOMA-IR 0.52, fasting insulin 2.86, glucose 4.1, HbA1c 33) alongside the elevated LDL, ApoB and total cholesterol. This is a recognised pattern in people eating very low carbohydrate diets high in saturated fat. The metabolic machinery is working beautifully: triglycerides are low, HDL is very high, inflammatory markers are minimal, and the body is insulin-sensitive to a degree that would be unusual even in a much younger person. But the saturated fat intake is driving up LDL particle count, and each of those particles carries the potential to enter the artery wall regardless of how clean the metabolic environment is. The Lp(a) below 25 confirms this is not an inherited lipoprotein problem, which means the elevation is modifiable. The family history of premature cardiovascular disease adds weight to acting on the ApoB rather than accepting it as a trade-off of the diet.\n\nThe second thread connects the hormonal findings. Very low insulin on a carnivore diet removes the brake on SHBG production, so SHBG climbs to 169. That binds up testosterone, pushing the free androgen index below range and calculated free testosterone well below range. The result is low bioavailable testosterone at 0.09 nmol/L alongside an already low postmenopausal oestradiol. This hormonal environment may contribute to fatigue, reduced recovery from training, difficulty gaining muscle, and lower motivation, all of which overlap with her primary complaint of chronic low energy.\n\nThe third thread is the gap between symptoms and blood results. Her fatigue is lifelong and chronic, yet her bloods are remarkably healthy. What the panel has positively excluded is substantial: anaemia, iron deficiency, thyroid disease, coeliac disease, diabetes, kidney disease, liver disease, adrenal insufficiency, active inflammation, and immune deficiency. What it has found that could contribute includes the below-optimal free T3 and low conversion ratio (the body may not be delivering enough active thyroid hormone to sustain afternoon energy), the low free testosterone, and the marginally below-optimal magnesium. But these are partial explanations at best. The bloating and stomach pain are not explained by any blood marker, and the palpitations and dizziness require clinical assessment that blood cannot provide. The nocturia may relate to her blood pressure medication or to age-related bladder changes.\n\nThe low white cell count and low reticulocytes sit outside these main threads. In a lean, healthy 65-year-old woman with no infections, no immune symptoms, and healthy immunoglobulins, these are most likely normal variants reflecting a quieter bone marrow. They need documenting as a baseline and repeating to confirm stability, but they do not currently fit a disease pattern.\n\nWhat was excluded matters as much as what was found. The negative coeliac screen, the clean pancreatic enzymes, and the absence of inflammation mean the digestive symptoms are unlikely to be autoimmune, pancreatic, or inflammatory in origin, pointing instead toward functional gut causes that blood tests cannot detect. The normal calcium, potassium, cortisol and thyroid function mean the palpitations and dizziness are unlikely to be metabolic, pointing toward a cardiac or vestibular cause that needs clinical investigation.","lifestyle":"Introduce one to two portions of vegetables or salad a day, starting with a side salad at one meal or a handful of leafy greens cooked into what you already eat. Anchor: add it to whichever meal feels easiest. Why: 0 to 1 portions of vegetables a day means very low fibre, very low folate, and very limited plant polyphenols, all of which affect gut motility and may be behind the bloating and stomach pain. Even on a carnivore framework, one to two portions of low-carbohydrate vegetables will not change ketosis but will improve gut health.\nAdd two to three Brazil nuts a day with your first meal. Why: Brazil nuts are the richest food source of selenium, which is the rate-limiting mineral for converting T4 into the active thyroid hormone T3. Your FT3 is 3.7 and your conversion ratio is 0.223, both below ideal. Two to three Brazil nuts provide roughly 150 to 200 micrograms of selenium, which is the dose shown to support conversion.\nSwitch to magnesium glycinate 400mg taken before bed instead of your current magnesium supplement. Anchor: part of your evening routine after brushing teeth. Why: your magnesium at 0.83 is just below the optimal zone of 0.85, and glycinate is the best-absorbed form for raising serum levels while also supporting sleep quality. This may help with the nocturia as magnesium supports smooth muscle relaxation in the bladder.\nAdd 200g of oily fish (salmon, mackerel, sardines) twice a week in place of two meat-based meals. Anchor: pick two fixed days. Why: oily fish provides omega-3 in its most bioavailable form and displaces some saturated fat, which is the dietary lever most likely to bring your ApoB of 1.16 down toward the 0.9 target. This also supports your cardiovascular goal given your family history.\nWalk for fifteen minutes immediately after your largest meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk improves glucose clearance and lipid metabolism, and walking after eating is one of the simplest interventions for the afternoon energy crash you describe.\nAim for 7 to 7.5 hours of sleep rather than 6 to 7, with a fixed wake time seven days a week. Anchor: set a non-negotiable lights-out time 7.5 hours before your alarm. Why: the nocturia is already fragmenting your sleep two to three times a night. Starting with a slightly longer window gives you more total sleep even after the interruptions, and consistent wake times strengthen circadian rhythm, which supports afternoon energy.\nCalorie target: approximately 1,750 to 1,900 kcal per day based on a BMR of roughly 1,280 kcal and a moderate activity multiplier of 1.45 to 1.5. Your BMI of 21.2 is healthy and you do not need to lose weight, but on a carnivore diet with average portions, there is a risk of under-eating, and insufficient energy intake can suppress thyroid conversion and white cell production. Protein target: 78 to 96 grams per day (1.3 to 1.6g per kg of bodyweight), which your carnivore diet likely meets, but it is worth checking that total calorie intake is adequate.","flags":"ApoB 1.16 g/L, above the 0.9 target, alongside LDL 5.05 (target below 3.0), total cholesterol 7.5, and non-HDL 5.3 (target below 4.0). These are offset by excellent HDL 2.2, triglycerides 0.74, ApoB/A1 ratio 0.545 (below 0.6), and Lp(a) below 25. Carnivore diet high in saturated fat is the likely driver. Family history of premature cardiovascular disease makes this actionable. GP discussion recommended regarding whether dietary modification alone or lipid-lowering therapy is warranted.\nSHBG 169.4 nmol/L, above the upper limit of 146, driving free androgen index to 0.47 (below 0.5) and calculated free testosterone to 0.0042 nmol/L (below 0.013). Bioavailable testosterone 0.09 nmol/L, below optimal of 0.12. Driven by very low insulin on a carnivore diet removing the brake on SHBG production. May contribute to fatigue, poor recovery and difficulty building muscle. GP or HRT prescriber discussion recommended regarding postmenopausal testosterone replacement.\nFree T3 3.7 pmol/L, within the laboratory range of 2.6 to 7.1 but below the optimal zone of 4.5 to 6.5. FT3:FT4 ratio 0.223, at the lower boundary of the reference range and below the optimal of 0.27 to 0.4. Suggests suboptimal T4-to-T3 conversion, which may contribute to the afternoon energy crash and chronic fatigue. Selenium and zinc supplementation recommended to support conversion.\nWhite cell count 3.33, below the lower limit of 4.0, driven by neutrophils 1.77 (below 2.0). Basophils 0.01, marginally below 0.02. No infections, no immune symptoms, immunoglobulins all within range. Most likely a benign variant in a lean healthy woman. Recommend GP notes this as baseline and repeats in three to six months to confirm stability.\nReticulocyte absolute count 41.6, below the lower limit of 50. Haemoglobin 145, red cell count 4.57, iron studies all healthy. Low reticulocyte production in the context of adequate haemoglobin and iron stores reflects a bone marrow producing at a pace that matches demand. No action needed but included in the baseline repeat.\nC-peptide 0.455 ug/L, below the laboratory range of 1.1 to 4.4. Consistent with very low insulin demand on a carnivore diet. Fasting glucose 4.1, HbA1c 33, HOMA-IR 0.52, HOMA-B 95.3 all confirm this is low demand rather than failing pancreatic function. Not a concern.\nTransferrin 2.33 g/L, marginally below the lower limit of 2.5. Iron 17.3, ferritin 146, transferrin saturation 29.6% all healthy. Likely reflects efficient haem iron absorption on a carnivore diet downregulating the transport protein. Not a concern.\nESR 13 mm/hour, one point above the upper limit of 12 for her age. hsCRP 0.7 confirms no active systemic inflammation. Clinically insignificant at this margin.\nCreatinine 45 umol/L, marginally below the lower limit of 49. Reflects low muscle mass in a lean 59.9 kg woman. Cystatin C eGFR 116 confirms excellent kidney function. Body composition finding, not a kidney concern.\nUrea:creatinine ratio 115.6, above the upper reference of 100. Mathematical consequence of the low creatinine denominator with normal urea. Not a sign of dehydration or kidney pathology given the clinical context.\nFIB-4 score 1.77, above the standard threshold of 1.45. At 65 and over, a score below 2.0 is generally not considered significant in the absence of other clinical indicators. In her case, age in the numerator and a healthy ALT of 23 in the denominator are the arithmetic drivers; ALT, AST, GGT, bilirubin, albumin, APRI and NAFLD fibrosis score are all clean, with no evidence of liver disease.\nReassuring negatives: thyroid function normal with negative antibodies, coeliac screen negative, pancreatic enzymes normal, CA-125 and CA 19-9 normal, immunoglobulins all within range, rheumatoid factor negative, fasting glucose and HbA1c excellent, kidney function excellent by Cystatin C, liver markers all clean, haemoglobin healthy, iron stores healthy, cortisol normal, urinalysis clean, hsCRP low, Lp(a) below 25.","recommendations":"Discuss the lipid profile with your GP: ApoB 1.16 (target below 0.9), LDL 5.05 (target below 3.0), alongside a family history of premature cardiovascular disease. Bring the full lipid context: HDL 2.2, triglycerides 0.74, ApoB/A1 ratio 0.545, hsCRP 0.7, Lp(a) below 25. Ask whether dietary modification alone or lipid-lowering therapy is the appropriate first step.\nDiscuss the low free testosterone (free androgen index 0.47, calculated free testosterone 0.0042) and high SHBG (169.4) with your GP or an HRT-prescribing clinician. Ask whether postmenopausal testosterone replacement could help with energy, recovery and muscle maintenance.\nMention the white cell count of 3.33 and neutrophils of 1.77 to your GP. Ask for this to be recorded as a baseline and repeated in three to six months to confirm it is a stable pattern.\nDiscuss the palpitations and dizziness with your GP. Blood tests have excluded metabolic causes (calcium, potassium, thyroid, cortisol, haemoglobin all normal). An ECG and potentially a 24-hour heart monitor would be appropriate next steps.\nDiscuss the nocturia (two to three times a night) alongside the blood pressure medication review. Some antihypertensives affect fluid balance and bladder function, and the GP may consider whether a timing or medication adjustment could help.\nDiscuss the bloating and stomach pain with your GP. Coeliac screen and pancreatic enzymes are normal. A hydrogen breath test for small intestinal bacterial overgrowth or lactose intolerance may be the next investigation, alongside a food and symptom diary.\nRetest in four to six months: lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB), full blood count (to confirm white cell baseline), free T3, SHBG and free testosterone. Calorie target 1,750 to 1,900 kcal/day, protein target 78 to 96g/day.","supplementation":"Vitamin D3 (cholecalciferol): reduce to 1,000 IU daily, taken with your fattiest meal. Why: your vitamin D is 165 nmol/L, well above the optimal ceiling of 120. You are well-stocked and can maintain levels with a lower dose. Continue year-round.\nVitamin K2 (MK-7): 100 micrograms daily, taken with your vitamin D. Why: K2 directs calcium into bone and away from arteries, which is important given the cardiovascular focus of this report and your healthy calcium of 2.52.\nMagnesium glycinate: 400mg before bed. Why: your magnesium is 0.83, just below the optimal zone of 0.85. Glycinate is the best-absorbed form and supports sleep, blood pressure regulation and muscle recovery.\nOmega-3 fish oil: continue at 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: supports the cardiovascular goal alongside the dietary changes to lower ApoB, and has mild anti-inflammatory properties.\nSelenium: 200 micrograms daily (selenomethionine form), taken with a meal. Why: selenium is the rate-limiting mineral for converting T4 into the active thyroid hormone T3. Your FT3 of 3.7 and conversion ratio of 0.223 are both below optimal.\nZinc (bisglycinate): 15mg daily, taken with food but at a different meal from any calcium-rich food. Why: zinc supports thyroid conversion alongside selenium, supports immune function relevant to the lower white cell count, and supports testosterone availability.\nVitamin B12 (sublingual methylcobalamin): 1,000 micrograms daily, dissolved under the tongue. Why: your B12 at 437 is within range but below the optimal zone of 500 to 900. Sublingual bypasses the gut, which is relevant given your digestive symptoms.\nDo not take iron supplements. Your ferritin at 146 and iron at 17.3 are healthy, and additional iron on a haem-iron-rich carnivore diet could push stores too high.\nThe most important changes from this report are not supplements. They are introducing some vegetables for gut health and fibre, swapping two meat meals for oily fish each week to lower ApoB, ensuring total calorie intake is adequate at 1,750 to 1,900 kcal per day, and having the GP conversations about the lipid profile, the palpitations, and the hormonal picture.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 42 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 41.6. Weakest systems: lipids & cardiovascular 13%, kidney function 20%, hematology 34%. Biggest drags: Creatinine, LDL Cholesterol, Apolipoprotein B, C-Peptide.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"52.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3743","lower_normal":"","upper_normal":"70","lower_optimal":"","upper_optimal":"65","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4643","units":"years","description":"PhenoAge is a biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. It estimates the body's biological age based on how these markers compare to population averages. Her PhenoAge of 52.4 against a calendar age of 65 places her biological age more than twelve years younger than her chronological age. The markers driving this favourable result include her low CRP of 0.7, healthy glucose of 4.1, healthy albumin of 40, and low ALP of 80. This is an excellent result that reflects genuinely healthy underlying physiology.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built rather than the ten-year chance of an event. Her score of 35 is within the acceptable range of 0 to 40 but above the ideal threshold of 20. The inputs driving the score are her ApoB of 1.16 and LDL of 5.05. The protective factors (HDL 2.2, triglycerides 0.74, hsCRP 0.7, Lp(a) below 25, HbA1c 33) are holding the score below the flagged threshold of 40, but the ApoB remains the key modifiable driver.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the bloodstream after an overnight fast. Her result of 4.1 mmol/L sits right in the middle of the ideal range of 4.0 to 5.4, reflecting excellent blood sugar regulation. This is consistent with her very low carbohydrate intake on a carnivore diet and confirms that the body is managing glucose efficiently.","low_causes":"Fasting, excess insulin, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin, the oxygen-carrying protein in red blood cells, that has glucose attached to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Her result of 5.2% is well below the pre-diabetic threshold of 6.0% and reflects excellent long-term glucose management.","low_causes":"","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the international standard unit. Her result of 33 mmol/mol is well inside the optimal zone of below 36, and a long way from the pre-diabetic threshold of 42. This confirms excellent blood sugar control over the past three months.","low_causes":"","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3372","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Lower is generally better, as high fasting insulin indicates the body's cells are becoming resistant and the pancreas has to work harder. Her result of 2.86 mIU/L is very low, sitting at the bottom of the reference range and well within the optimal zone of 2.0 to 8.0. This reflects the very low carbohydrate demand of her carnivore diet and confirms exceptional insulin sensitivity.","low_causes":"Low carbohydrate diet, very lean body composition, pancreatic insufficiency (when accompanied by high glucose)","high_causes":"Insulin resistance, pre-diabetes, obesity, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.455","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2682","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts alongside insulin. It is used to confirm how much insulin the body is genuinely producing, as unlike insulin itself, C-peptide is not cleared by the liver. Her result of 0.455 ug/L is below the laboratory range of 1.1 to 4.4. In her case this is entirely expected: her fasting insulin is also very low at 2.86, her glucose and HbA1c are excellent, and HOMA-IR is 0.52. The low C-peptide simply reflects low insulin demand on a carnivore diet, not failing pancreatic function.","low_causes":"Low carbohydrate diet reducing insulin demand, type 1 diabetes, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3400","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR combines fasting glucose and fasting insulin into a single score that estimates how sensitive the body's cells are to insulin. A score below 1.0 indicates excellent insulin sensitivity, above 1.9 suggests early resistance, and above 2.9 indicates significant resistance. Her result of 0.52 is exceptional, sitting right at the bottom of the reference range, meaning her body clears glucose from the bloodstream with minimal insulin effort. This is one of the strongest metabolic findings in the report.","low_causes":"Low carbohydrate diet, lean body composition, high insulin sensitivity","high_causes":"Insulin resistance, pre-diabetes, obesity, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"This marker converts the HbA1c into an estimated average blood glucose over the preceding three months, making it easier to understand day-to-day blood sugar levels. Her estimated average glucose of 5.6 mmol/L is within the optimal zone, confirming consistently healthy blood sugar control.","low_causes":"Low carbohydrate diet, fasting","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4426","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose into a single score that estimates insulin resistance. It is particularly useful as a screening tool for metabolic syndrome. Her result of 7.79 is within the optimal zone of below 8.5, confirming excellent metabolic health and insulin sensitivity.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"145","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6111","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"150","low e standard reference expects. This is driven primarily by the low neutrophil count. In a lean, healthy 65-year-old woman with no history of recurrent infections and healthy immunoglobulins, a count between 3.0 and 4.0 is most likely a benign constitutional variant. It should be documented as a baseline and repeated in three to six months to confirm stability.","low_causes":"Benign ethnic neutropenia, viral infection, autoimmune disease, medications, bone marrow suppression, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3180","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and form the first line of defence against bacterial infections. Her count of 1.77 is below the lower limit of 2.0. In clinical practice, mild neutropenia in this range (above 1.5) is common in lean individuals, women, and people of certain ethnic backgrounds, and is termed benign neutropenia when no infections are present. Her lymphocytes, immunoglobulins and CRP are all healthy, indicating the immune system is functioning well despite the lower neutrophil count.","low_causes":"Benign ethnic neutropenia, viral infection, autoimmune disease, medications, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, steroid use, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.27","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3783","lower_norma
