e most specific marker of liver cell injury. Her result of 23 IU/L is within the optimal zone of below 25 for a female, confirming there is no significant liver cell damage.","low_causes":"","high_causes":"Fatty liver disease, alcohol, medications, hepatitis, obesity, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5625","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. Unlike ALT, it is not specific to the liver. Her result of 26 IU/L is within the optimal range, confirming healthy liver, heart and muscle cells.","low_causes":"","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6103","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis (scarring) using age, platelets, ALT and AST. Her result of 1.77 is above the standard threshold of 1.45 but below the age-adjusted threshold of 2.0 that applies at 65 and over. At 65 and over, a score below 2.0 is generally not considered significant in the absence of other clinical indicators. In her case, her age of 65 pushes up the numerator, and her healthy ALT of 23 keeps the denominator relatively small, inflating the score arithmetically. With every actual liver marker (ALT, AST, GGT, bilirubin, albumin) clean, the APRI score healthy at 0.33, and the NAFLD fibrosis score in the safe zone, this FIB-4 is driven by the formula rather than by liver disease.","low_causes":"","high_causes":"Liver fibrosis, age-driven calculation, low platelet count, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4412","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications and bile duct problems. Her result of 15 IU/L is well within the optimal zone of below 25 for a female. This is a very clean result and confirms the liver is under no metabolic or toxic strain.","low_causes":"","high_causes":"Alcohol, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3598","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced by the pancreas and salivary glands that breaks down starch. Her result of 37 IU/L is within the healthy range. A normal amylase is reassuring given her report of on-and-off stomach pain, as significantly elevated amylase would suggest pancreatic inflammation.","low_causes":"Chronic pancreatitis (late stage), pancreatic insufficiency","high_causes":"Acute pancreatitis, gallstones, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5035","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6312","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down fats. It is more specific to the pancreas than amylase. Her result of 37 U/L is within the healthy range, further confirming that the pancreas is healthy and that her abdominal symptoms are unlikely to be pancreatic in origin.","low_causes":"Chronic pancreatitis (late stage), pancreatic insufficiency","high_causes":"Acute pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5614","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4035","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is the most abundant mineral in the body, essential for bone strength, nerve signalling, muscle contraction and heart rhythm. Her result of 2.47 mmol/L is within the ideal range, confirming healthy calcium levels. This is consistent with her good vitamin D status and healthy parathyroid function.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium measurement for the albumin level, giving a more accurate picture of the biologically active calcium. Her result of 2.52 mmol/L is within the ideal zone, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5900","units":"mmol/L","description":"Phosphate works alongside calcium to build and maintain bones and teeth, and is essential for energy production in every cell. Her result of 0.8 mmol/L is within the laboratory range but very close to the lower boundary and below the optimal zone. Low phosphate can occur with a high-meat diet as protein increases urinary phosphate excretion. At this level it is not a clinical concern but may be worth monitoring alongside her bone health.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding, high protein diet, antacids, alcohol","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5057","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including muscle and nerve function, blood pressure regulation, blood sugar control and energy production. Her result of 0.83 mmol/L is within the laboratory range but just below the optimal zone of 0.85 to 1.05. Given that she already supplements magnesium, this suggests she may benefit from a slightly higher dose or a switch to a better-absorbed form such as magnesium glycinate. Suboptimal magnesium is relevant to her blood pressure, palpitations, sleep quality and energy levels.","low_causes":"Diuretics, alcohol, diarrhoea, poor absorption, diabetes, low dietary intake","high_causes":"Kidney disease, excess supplementation, magnesium-containing medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"165","within_normal":"TRUE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood. It is primarily made in the skin from sunlight and supplemented during winter months. Her result of 165 nmol/L is well above the sufficient threshold of 50 and above the optimal ceiling of 120 nmol/L, reflecting consistent supplementation. While not harmful at this level, there is no added clinical benefit beyond about 120 nmol/L, so she can reduce her dose to a maintenance level of 1,000 IU daily.","low_causes":"Insufficient sunlight, low dietary intake, malabsorption, obesity, dark skin, ageing","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Intact Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"0.986","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3339","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3796","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH is a hormone produced by the parathyroid glands that regulates calcium and phosphate levels. When calcium drops, PTH rises to pull calcium from bones and increase absorption from the gut. Her result of 0.986 pmol/L sits right at the lower boundary of the reference range. This very low PTH is consistent with her high vitamin D level of 165, which is maximising calcium absorption and suppressing the need for PTH. With calcium at 2.52, the system is in balance. The very low PTH alongside high vitamin D is a physiological response, not a concern.","low_causes":"High vitamin D, high calcium, hypoparathyroidism, magnesium deficiency","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"437","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4364","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. It is found almost exclusively in animal products. Her result of 437 pg/mL is within the laboratory range but below the optimal zone of 500 to 900. On a carnivore diet, which is the richest possible dietary source of B12, this is a little surprising and may suggest that absorption is less efficient than expected. Absorption of B12 declines with age due to reduced stomach acid production, and her report of digestive discomfort raises the possibility of impaired gastric absorption. Sublingual methylcobalamin, which is absorbed directly through the lining of the mouth and bypasses the gut, would be a sensible addition.","low_causes":"Vegetarian or vegan diet, pernicious anaemia, low stomach acid, medications (metformin, PPIs), malabsorption, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA repair, red blood cell production and amino acid metabolism. Her result of 12 ng/mL is within the healthy range. However, on a carnivore diet with 0 to 1 portions of vegetables a day, dietary folate is limited primarily to liver and eggs. While adequate now, this is worth monitoring over time, particularly as folate and B12 work together in key metabolic pathways.","low_causes":"Low vegetable intake, alcohol, coeliac disease, malabsorption, pregnancy, medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, excess dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7239","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures the total amount of cholesterol carried in the blood, including both the protective HDL and the potentially harmful LDL. Her result of 7.5 mmol/L is above the desirable level of below 5.18. However, total cholesterol on its own is a limited measure because it includes HDL, which is protective. Her HDL of 2.2 accounts for a large share of the total, making the number look worse than the underlying risk. The more important markers to focus on are her ApoB and LDL, which measure the harmful fraction directly.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"High saturated fat diet, hypothyroidism, familial hypercholesterolaemia, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2176","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood that come from dietary fat and from excess carbohydrate that the liver converts to fat. Her result of 0.74 mmol/L is well within the optimal zone of below 1.0, which is an excellent finding. Low triglycerides are a hallmark of a low-carbohydrate diet and reflect healthy fat metabolism.","low_causes":"Low carbohydrate diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate diet, alcohol, obesity, diabetes, metabolic syndrome, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL is a lipoprotein made by the liver that carries triglycerides to tissues. Her result of 0.34 mmol/L is well within the healthy range, consistent with her low triglyceride level and healthy fat metabolism.","low_causes":"Low carbohydrate diet, malnutrition","high_causes":"High carbohydrate diet, obesity, metabolic syndrome, diabetes, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"1.0000","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7692","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL is the protective form of cholesterol that carries excess cholesterol from artery walls back to the liver for disposal, a process called reverse cholesterol transport. Her result of 2.2 mmol/L is well above the desirable threshold of 1.55 and above the optimal level of 1.6 for a female. This is an exceptionally high HDL, which provides significant cardiovascular protection and is one of the most positive findings in the lipid panel.","low_causes":"Smoking, obesity, sedentary lifestyle, high carbohydrate diet, metabolic syndrome, medications","high_causes":"Regular exercise, moderate alcohol, genetic factors, high-fat low-carb diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9400","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL is the form of cholesterol that delivers cholesterol to tissues but can also deposit it in artery walls, driving atherosclerosis. Her result of 5.05 mmol/L is well above the target of below 3.0. On a carnivore diet high in saturated fat, elevated LDL is a recognised response as the liver upregulates cholesterol production and reduces LDL receptor clearance. With a family history of premature cardiovascular disease, this level warrants action. Her Lp(a)-corrected LDL of 4.97 confirms that virtually all of this elevation is modifiable.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, hypothyroidism, familial hypercholesterolaemia, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3789","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL cholesterol. A lower ratio indicates a more favourable balance between harmful and protective cholesterol. Her result of 3.41 is within the optimal zone of below 3.5, which is a genuinely positive finding given her elevated total cholesterol. The very high HDL is pulling this ratio into a healthy range.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"29.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7332","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6250","upper_optimal_position":"1.0000","units":"%","description":"This measures what proportion of total cholesterol is made up of the protective HDL. Her result of 29.3% is well above the desirable threshold of 20%, indicating that a large share of her total cholesterol is the protective type.","low_causes":"Low HDL, metabolic syndrome, obesity, smoking","high_causes":"High HDL, exercise, healthy fat metabolism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially atherogenic (artery-damaging) lipoproteins in a single number: LDL, VLDL, IDL and Lp(a). Her result of 5.3 mmol/L is above the target of below 4.0, driven primarily by the elevated LDL. This is a more complete measure of harmful cholesterol than LDL alone and supports the need to address the LDL elevation.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition","high_causes":"High saturated fat diet, hypothyroidism, familial hypercholesterolaemia, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7607","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. Each HDL particle carries one ApoA1 molecule, so ApoA1 is essentially a count of protective HDL particles. Her result of 2.13 g/L is well above the normal threshold of 1.4, confirming an abundance of protective HDL particles. This is an excellent result.","low_causes":"Low HDL, metabolic syndrome, smoking, sedentary lifestyle","high_causes":"High HDL, exercise, healthy fat metabolism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle. Because each of these particles carries exactly one ApoB molecule, the ApoB level is effectively a count of all the cholesterol-carrying particles that can enter and damage the artery wall. It is considered the single best measure of atherogenic risk. Her result of 1.16 g/L is above the desirable threshold of 0.9 and above the optimal target of 0.8. Each of these particles, regardless of how much cholesterol it carries, can cross the artery lining and contribute to plaque formation. With a family history of premature cardiovascular disease, this is the most actionable lipid finding in the report.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition, statin therapy","high_causes":"High saturated fat diet, hypothyroidism, familial hypercholesterolaemia, obesity, diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.545","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4542","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"","description":"The ApoB/A1 ratio compares the number of harmful cholesterol particles (ApoB) to the number of protective particles (ApoA1). It is considered the best single summary of lipid-driven cardiovascular risk. Her result of 0.545 is just inside the lower-risk threshold of below 0.6, which is a genuinely reassuring finding given the elevated absolute ApoB. The very high ApoA1 of 2.13 is pulling this ratio into a favourable zone, providing significant counterbalance to the LDL particle count.","low_causes":"High HDL, low LDL, excellent metabolic health","high_causes":"High LDL, low HDL, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lp(a) is an inherited lipoprotein that carries cholesterol and promotes clotting and inflammation independently of LDL. It does not change with diet or exercise. Her result of below 25 nmol/L is within the ideal range of below 32, which is genuinely useful information. It means her elevated LDL and ApoB are driven entirely by modifiable factors (primarily dietary saturated fat) rather than by an inherited particle she cannot change. This makes dietary and, if needed, pharmacological intervention more likely to succeed.","low_causes":"","high_causes":"Inherited (genetic), does not change with lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4019","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme found in muscles, the heart and the brain. It leaks into the blood when muscle fibres are damaged, such as after intense exercise. Her result of 61 U/L is within the healthy range, confirming no significant muscle damage from her training.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"16.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4851","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"Free T4 is the unbound, available form of thyroxine, the main hormone produced by the thyroid gland. T4 is the storage form that circulates in the blood and is converted into the active form, T3, in tissues throughout the body. Her result of 16.6 pmol/L is within the ideal range, confirming that the thyroid is producing adequate hormone. The question is whether her body is converting it efficiently into T3, which her FT3 and conversion ratio suggest could be better.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, medications","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4555","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH is the hormone produced by the pituitary gland in the brain that tells the thyroid how much hormone to make. A high TSH means the brain is asking the thyroid to work harder (suggesting underactive thyroid), while a low TSH suggests it is making too much. Her result of 2.1 mIU/L sits within the ideal zone of 1.0 to 2.5, confirming that the pituitary-thyroid communication is working well and the thyroid is not being pushed to produce more.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4148","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"Free T3 is the active thyroid hormone, the form that actually enters cells and drives metabolism, energy production, body temperature and mood. While the thyroid mainly produces T4, the body converts it into T3 in the liver, kidneys and other tissues. Her result of 3.7 pmol/L is within the laboratory range of 2.6 to 7.1 but below the optimal zone of 4.5 to 6.5. This means the cells may not be receiving enough active thyroid hormone for optimal energy and metabolism, which could contribute to her afternoon energy crash and chronic fatigue. Common factors that impair T4-to-T3 conversion include low selenium, low zinc, stress, caloric restriction and ageing.","low_causes":"Poor T4-to-T3 conversion, low selenium or zinc, caloric restriction, illness, ageing, liver or kidney disease","high_causes":"Hyperthyroidism, thyroiditis, T3-containing supplements","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are produced by the immune system when it attacks thyroid peroxidase, an enzyme the thyroid needs to make its hormones. Elevated TPO antibodies are the hallmark of Hashimoto's thyroiditis, the most common autoimmune cause of underactive thyroid. Her result of below 6.6 U/mL is well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"3.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4091","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses as a building block for its hormones. Elevated levels can indicate autoimmune thyroid disease. Her result of 3.6 U/mL is within the normal range of below 4.4. Combined with the negative TPO antibodies, this rules out autoimmune thyroid disease.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.223","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3640","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"This ratio measures how efficiently the body converts the storage thyroid hormone T4 into the active form T3. A lower ratio suggests less efficient conversion. Her result of 0.223 sits at the lower boundary of the reference range and below the optimal zone of 0.27 to 0.40. This confirms the suboptimal T4-to-T3 conversion suggested by her FT3 of 3.7. Selenium and zinc are the key nutrients that support the deiodinase enzymes responsible for this conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0166","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_ rming normal early immune response capability.","low_causes":"Immunodeficiency, medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4624","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.5591","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces: the gut lining, respiratory tract, and urinary tract. It is also important for the coeliac screen, as the coeliac test (tTG-IgA) requires adequate IgA to be reliable. Her result of 1.6 g/L is within the healthy range, confirming the coeliac screen is valid and her mucosal immunity is working well.","low_causes":"Selective IgA deficiency, immunodeficiency","high_causes":"Chronic infection, autoimmune disease, liver disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"14.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0745","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"IgE is the antibody involved in allergic reactions and in defending against parasites. Her result of 14.9 IU/mL is low and well within the normal range, indicating no active allergic or parasitic process. This is useful context for her bloating and digestive symptoms, as a high IgE might have pointed toward a food allergy.","low_causes":"","high_causes":"Allergies, asthma, eczema, parasitic infection, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2500","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"Rheumatoid factor is an antibody sometimes found in rheumatoid arthritis and other autoimmune conditions. Her result of 7 IU/mL is within the normal range of below 14, providing no evidence of rheumatoid arthritis or related autoimmune conditions.","low_causes":"","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.711","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0494","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"This is the screening test for coeliac disease, which measures antibodies against the enzyme tissue transglutaminase. These antibodies are produced when the immune system reacts to gluten. Her result of 0.711 CU is negative and well within the normal range, ruling out coeliac disease as a cause of her digestive symptoms. The test is valid because her IgA level is normal.","low_causes":"","high_causes":"Coeliac disease, gluten sensitivity, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.89","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7518","lower_normal":"1.3","upper_normal":"1. 18.2","lower_optimal":"0","upper_optimal":"118.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen in women, responsible for bone density, cardiovascular protection, skin elasticity, brain function and reproductive health. Her result of below 43 pmol/L is within the expected postmenopausal range of 0 to 118.2, confirming that the ovaries are no longer producing significant oestrogen. This is consistent with her FSH and LH levels confirming menopause.","low_causes":"Menopause, low body fat, excessive exercise, pituitary disease, medications","high_causes":"Ovarian cysts, HRT, obesity (adipose tissue converts androgens to oestrogen), liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4210","lower_normal":"0","upper_normal":"2.32","lower_optimal":"0","upper_optimal":"2.32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is a hormone produced by the ovaries after ovulation. In postmenopausal women, progesterone drops to very low levels. Her result of 0.61 nmol/L is within the expected postmenopausal range of 0 to 2.32.","low_causes":"Menopause, anovulation, luteal phase deficiency","high_causes":"Pregnancy, ovarian cysts, HRT, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"35.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5030","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"LH is a hormone produced by the pituitary gland that in premenopausal women triggers ovulation. After menopause, LH rises because the pituitary is trying to stimulate ovaries that are no longer responding. Her result of 35.29 mIU/mL is within the expected postmenopausal range of 15.9 to 54.0, confirming the menopausal state.","low_causes":"Pituitary disease, medications, stress, underweight","high_causes":"Menopause, primary ovarian failure, PCOS (mildly elevated)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"95.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5940","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"FSH is a hormone produced by the pituitary gland that stimulates the ovaries to produce eggs and oestrogen. After menopause, FSH rises significantly as the pituitary sends stronger and stronger signals to ovaries that no longer respond. Her result of 95.97 mIU/mL is well within the postmenopausal range of 23 to 116.3, and the high level confirms established menopause.","low_causes":"Pituitary disease, medications, pregnancy","high_causes":"Menopause, primary ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and is important for energy, mood, libido, bone density and muscle maintenance. Her result of 0.8 nmol/L is within the laboratory range of 0.5 to 2.6 but at the lower boundary of the optimal zone. While the total testosterone is technically adequate, her very high SHBG of 169.4 is binding most of it, leaving very little free and bioavailable for tissues to use.","low_causes":"Menopause, ageing, low DHEA, adrenal insufficiency, oral contraceptives","high_causes":"PCOS, adrenal hyperplasia, ovarian tumour, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3317","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a calculation that estimates the proportion of testosterone that is free and active, using total testosterone and SHBG. Her result of 0.47 is below the lower limit of 0.5, driven by her very high SHBG of 169.4 which binds most of her testosterone. This means that although her total testosterone is within range, the amount available to her tissues is below where it should be. Low free androgen activity in postmenopausal women is associated with fatigue, reduced muscle recovery, lower libido, and difficulty maintaining lean mass.","low_causes":"High SHBG, menopause, low carbohydrate diet (low insulin raises SHBG), thyroid disease, liver disease","high_causes":"PCOS, obesity (low SHBG), insulin resistance, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3687","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3873","upper_optimal_position":"0.5736","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It declines naturally with age, typically peaking in the mid-twenties and falling steadily thereafter. Her result of 1.4 umol/L is within the laboratory range but below the optimal zone. At 65, some decline is expected. DHEA-S provides a reservoir for sex hormone production, and a lower level contributes to the overall low free testosterone picture.","low_causes":"Ageing, adrenal insufficiency, chronic stress","high_causes":"Adrenal hyperplasia, adrenal tumour, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"112","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3963","lower_normal":"38","upper_normal":"430","lower_optimal":"50","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3435","upper_optimal_position":"0.5986","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production but also involved in immune function and reproductive regulation. Her result of 112 uIU/mL is within the postmenopausal reference range of 38 to 430, confirming normal pituitary function.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, SSRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"169.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7327","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.5933","units":"nmol/L","description":"SHBG is a protein produced by the liver that binds sex hormones, primarily testosterone and oestradiol, making them unavailable to tissues. When SHBG is high, less testosterone and oestradiol are free to act. Her result of 169.4 nmol/L is above the upper limit of 146. The most likely driver is her very low insulin on a carnivore diet: insulin normally suppresses SHBG production, and with fasting insulin at 2.86, there is minimal suppression, allowing SHBG to climb. This is the mechanism behind her low free androgen index and low calculated free testosterone. Other factors that raise SHBG include ageing, low body weight, and hyperthyroidism (though her thyroid is normal).","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism, steroid use","high_causes":"Low insulin, lean body composition, menopause, liver disease, hyperthyroidism, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.0042","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3210","lower_normal":"0.013","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3432","upper_optimal_position":"0.5963","units":"nmol/L","description":"Free testosterone is the small fraction of total testosterone that is not bound to SHBG or albumin and is therefore available to enter cells and drive its effects on energy, mood, muscle and bone. Her result of 0.0042 nmol/L is well below the lower limit of 0.013, driven by the very high SHBG of 169.4 binding most of her total testosterone. This is the most functionally significant finding in the hormonal panel and may be a meaningful contributor to her chronic fatigue, reduced exercise recovery, and overall energy levels.","low_causes":"High SHBG, menopause, low insulin (low-carb diet), ageing, liver disease","high_causes":"PCOS, obesity (low SHBG), insulin resistance, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3576","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone is the fraction that is either free or loosely bound to albumin (from which it can easily dissociate), representing the testosterone actually available to tissues. Her result of 0.09 nmol/L is within the reference range but below the optimal zone of 0.12 to 0.55. This is driven by the very high SHBG binding up most of her total testosterone. Low bioavailable testosterone in postmenopausal women is associated with fatigue, reduced muscle recovery, lower libido, and difficulty maintaining lean mass, all of which are relevant to her symptoms and goals.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"0.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol that is not bound to SHBG. Her result of 0.25 is cons const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');

    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
