<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Tanisha Orchard","dob":"05/10/1998","report_date":"2026-08-10","summary":"Tanisha is a 27-year-old female presenting with a BMI of 23.7, following a standard mixed diet rated 8 out of 10 for quality with a volume of 5 out of 10. She trains more than 9 times per week (5 or more cardio, 4 resistance) with 10,000 to 15,000 daily steps. She takes omeprazole for suspected gastritis, which she believes developed after a sickness bug caught while travelling in South East Asia three months ago. She reports low energy and fatigue, bloating and digestive discomfort, and hair thinning. Her goals are to improve energy, improve digestion and gut health, and prevent disease.\n\nHer cardiovascular picture is outstanding and deserves recognition. Her ApoB at 0.68 is within ideal, meaning very few particles are depositing cholesterol into her artery walls. Her HDL at 2.2, the protective cholesterol that carries cholesterol back out of artery walls, is excellent. Nearly half of her total cholesterol is the protective type. Her ApoB/A-I ratio at 0.305, which compares harmful particles against protective ones, is one of the best results seen, with the protective side massively outnumbering the harmful. Her triglycerides at 0.3 are extremely low. Her Lipoprotein(a) at 25 is within range, confirming no inherited cardiovascular risk. The cardiovascular picture reflects her training and her diet quality, and it is genuinely excellent.\n\nHer blood sugar control is perfect. Her glucose at 4.2, HbA1c at 28 (4.7%), and HOMA-IR at 0.67 all show textbook insulin sensitivity. Her liver is pristine, with ALT at 12, Gamma GT at 18, FIB-4 at 1.16 and no scarring. Her kidneys are healthy, with Cystatin C at 1.0 and eGFR at 90. Her thyroid is working, with TSH at 1.94, FT4 at 18.9, FT3 at 4.5, and both antibody tests negative. Her B12 at 466 is within ideal, which is a good result on omeprazole since PPIs impair B12 absorption. Her folate at 11 is within ideal. Her CRP at 0.5 and ESR at 4 show no inflammation at all. Her IgE at 1.2 is very low, which is useful information because it means IgE-mediated food allergy is very unlikely as a cause of the bloating. Her coeliac screen is negative. Her rheumatoid factor is normal. Her immune antibodies are all healthy. Her calcium, corrected calcium and phosphate are within ideal. Her female cancer markers (CA-125 and CA 15-3) are both within ideal. Her urinalysis is clear.\n\nDespite all of this working well, the report has found a pattern that explains her symptoms and needs addressing. Her body is not receiving enough fuel for the work it is doing.\n\nHer cortisol is 155, below the lower limit of 172. Cortisol is the body's main stress hormone, produced by the adrenal glands. During acute stress or exercise, cortisol rises as a useful, normal response. But when the body is under sustained physiological stress, particularly from burning more energy than it is receiving over weeks or months, the adrenal response flattens rather than staying elevated. It falls below normal as the body conserves resources. At 155, the adrenal system is running below its floor, and at her training volume with a diet volume of only 5 out of 10, this is the clearest marker that the energy balance is negative.\n\nThis is a pattern that sports medicine calls Relative Energy Deficiency in Sport, or RED-S. It is not a disease. It is the body's intelligent response to insufficient fuel. When there is not enough coming in, the body prioritises the functions essential for immediate survival and quietly downgrades the ones it can do without in the short term. The evidence of that economising is visible across the report.\n\nHer white cell count at 3.22 and neutrophils at 1.62 are both below range. The immune system is one of the first things the body reduces when fuel is short, because maintaining a full complement of immune cells is metabolically expensive. Her reticulocyte absolute at 48.706 is marginally below range, meaning red blood cell production is beginning to slow. Her platelets at 154 are at the lower end with large MPV at 11.5, meaning the body is producing fewer platelets but making them bigger to compensate. All of these point in the same direction.\n\nHer SHBG is 171.3, above the female range that ends at 155. SHBG is a protein made by the liver that binds sex hormones and holds them out of circulation. When the body detects an energy deficit, the liver raises SHBG production as part of the conservation response, and reproductive and androgenic hormones are among the first things it dials down. PPIs can also raise SHBG. At 171.3, the SHBG is binding up virtually all of her testosterone, giving a free testosterone of 0.005, which is at the absolute floor.\n\nThis matters because testosterone in women is not just a male hormone in small amounts. It supports energy, mood, motivation, the ability to build and maintain muscle, bone density, and the health of hair follicles. At 0.005, the hair follicles are receiving almost no androgenic support, which is a plausible contributor to the hair thinning she describes. The fatigue connects here too. And the difficulty building muscle despite training 9+ times per week makes complete sense when the hormone that supports muscle protein synthesis is functionally absent and the building materials (calories and protein) are insufficient.\n\nHer ferritin at 16 is within the laboratory range for a woman but functionally depleted at her training volume. Ferritin is the storage form of iron. The body uses iron to make haemoglobin, to produce energy inside cells, to support brain function, and to maintain healthy hair. At 16 with 9+ training sessions, 10,000 to 15,000 steps, and menstrual iron losses, the demand on iron is very high. The omeprazole is making this worse, because PPIs reduce stomach acid, and stomach acid is needed to convert dietary iron into the form the gut can absorb. Low ferritin is one of the commonest causes of fatigue and hair thinning, and at 16 it is contributing to both.\n\nHer haemoglobin at 152 and red blood cell count at 4.97 are both marginally above the female range, and her MCHC at 346 is marginally above range. This could reflect training adaptation (the body producing more red cells to support oxygen delivery) or mild dehydration concentrating the blood. With ferritin at 16, the iron stores are not supporting red cell overproduction, so dehydration is more likely.\n\nHer magnesium at 0.8 is below the ideal level. Magnesium supports muscle function, sleep quality and nerve signalling, and at her training volume with PPIs impairing absorption, supplementation is important.\n\nHer vitamin D at 84 is below the ideal level of 100, and her PTH at 3.5 is at the upper boundary of ideal, which may reflect the body working harder to maintain calcium absorption in the face of lower vitamin D and the PPI reducing calcium uptake.\n\nHer FT3 at 4.5, the active thyroid hormone, is within range but sitting at its floor. In the context of underfuelling, the thyroid can slow as part of the same conservation response, reducing metabolic rate to match the reduced fuel supply. If the fuelling improves and FT3 rises with it, that would confirm the picture.\n\nRegarding the bloating and digestive discomfort: her coeliac screen is negative and her IgE at 1.2 rules out IgE-mediated food allergy. The omeprazole she is taking suggests acid-related symptoms, and the history of a sickness bug in South East Asia raises the question of whether the gastritis is post-infectious. The GP should consider H. pylori testing (a breath test or stool antigen test), since H. pylori is a common cause of persistent gastritis and is easily acquired while travelling. If H. pylori is found, eradication treatment would address the underlying cause rather than the PPI just managing the symptoms. A stool test for parasites may also be worth considering given the travel history.\n\nHer lipase at 52 is within range but at the higher end. Worth noting alongside the digestive symptoms but not a concern at this level.\n\nHer eosinophils are not raised, which is modestly reassuring against parasitic infection, though it does not completely exclude it.\n\nHer sodium at 137 is marginally below ideal. Her potassium at 3.6 is just above the lower limit. Both consistent with sweat losses at her training volume.\n\nHer CEA marker at 0.47 is within the ideal range.","links":"The single most important recommendation from this report is to eat more. The blood is showing a body that is training at a very high volume on insufficient fuel, and virtually every abnormal finding in this report traces back to that energy deficit.\n\nAt 68kg and 169.5cm with 9+ training sessions and 10,000 to 15,000 steps, maintenance is roughly 2,400 to 2,800 calories. A diet volume of 5 out of 10 suggests she is eating well below this. She does not need to eat badly. Her diet quality at 8 out of 10 is excellent and should stay that way. She needs to eat more of the same good food.\n\nA target of at least 2,200 to 2,500 calories daily, with 100 to 120g of protein (1.5 to 1.8g per kilogram), would begin to close the energy gap. With active gastritis making larger meals uncomfortable, the most practical approach is to eat more often rather than eating more at each sitting. Five or six smaller meals across the day, each containing 20 to 25g of protein, avoids overloading the stomach while still reaching the target. Calorie-dense foods that are gentle on the gut help: nut butters, avocado, olive oil drizzled on food, smoothies with protein powder and banana, oats with seeds and honey, well-cooked rice and root vegetables. Liquid calories (smoothies, shakes, soups blended smooth) are often better tolerated than solid food when the stomach is irritated. A post-training shake with protein powder, banana and oat milk is an easy way to add 300 to 400 calories and 25 to 30g of protein without needing to sit down to a full meal.\n\nActive recovery matters as much as the training itself. At 9+ sessions per week, the body needs adequate rest days and sleep to rebuild what the training breaks down. If she is not already taking at least one full rest day per week, she should consider it. The training is the stimulus, but the adaptation, the muscle growth, the fitness gains, happen during recovery, and recovery requires fuel and rest.\n\nFor the iron: an iron supplement (ferrous bisglycinate at 25 to 50mg with vitamin C, taken on an empty stomach or 2 hours away from the omeprazole) is recommended. The PPI reduces iron absorption, so taking them apart matters. Iron-rich food (red meat, shellfish, dark leafy greens paired with vitamin C to improve absorption) should be increased.\n\nFor the gastritis and bloating: the GP should test for H. pylori (breath test or stool antigen test), since it is a common cause of persistent gastritis and is easily acquired while travelling. If found, eradication treatment would address the cause. A stool test for parasites may also be worth considering given the South East Asia travel history. If the omeprazole is needed long-term, the impacts on iron, B12, calcium and magnesium absorption should be actively managed with supplementation.\n\nVitamin D3 at 2,000 IU daily with K2 MK-7 at 100 micrograms.\n\nMagnesium glycinate at 300 to 400mg before bed. Her level at 0.8 is below ideal, the PPI impairs absorption, and magnesium supports sleep quality and muscle recovery.\n\nThe neutrophil count of 1.62 should be flagged to the GP and repeated to confirm whether it improves as the energy balance improves.\n\nEnsure adequate potassium through food (bananas, potatoes, avocados, beans, leafy greens).\n\nA follow-up in 12 weeks: cortisol, full blood count with neutrophils and reticulocytes, ferritin, SHBG, free testosterone, vitamin D, magnesium, FT3, and H. pylori if not yet tested.","flags":"Cortisol 155, below the range that starts at 172. Adrenal output has flattened from sustained underfuelling alongside heavy training (9+ sessions per week, diet volume 5/10). Consistent with Relative Energy Deficiency in Sport (RED-S). The answer is increased caloric intake, not reduced training.\n\nWBC 3.22 (below 4). Neutrophils 1.62 (below 2). Retics absolute 48.706 (below 50). Platelets 154 near the floor, MPV 11.5 above range. All consistent with the body economising on cell production in the context of low energy availability. Neutrophils should be flagged to GP and repeated.\n\nSHBG 171.3 (above 155). Free testosterone 0.005, at the floor. Free androgen index 0.58, at the floor. Testosterone 1.0, lower end. SHBG is binding virtually all available testosterone. Driven by low energy availability and PPI use. Connects to the hair thinning, the fatigue, and the difficulty building muscle.\n\nFerritin 16, within range but functionally depleted at this training volume. Iron 12.1, lower end. Transferrin saturation 19.2, below ideal. PPI impairs iron absorption. Contributing to the fatigue and hair thinning. Supplement iron.\n\nHaemoglobin 152 (above female range 150). RBC 4.97 (above female range 4.8). MCHC 346 marginally above range. Training adaptation or dehydration.\n\nMagnesium 0.8, below ideal 0.85. Training volume and PPI impairing absorption.\n\nVitamin D 84, below ideal 100. PTH 3.5, at the upper boundary of ideal.\n\nBloating: coeliac negative, IgE 1.2 (IgE-mediated food allergy ruled out). Consider H. pylori testing and stool parasitology given SE Asia travel history.\n\nSodium 137, marginally below ideal. Potassium 3.6, near the floor. Sweat losses.\n\nCEA still awaited.\n\nReassuring: lipids outstanding (ApoB 0.68, HDL 2.2, ApoB/A-I 0.305). Blood sugar excellent. Thyroid functioning (FT3 at lower end, may improve with fuelling). Liver pristine. Kidneys healthy. CRP 0.5, ESR 4. B12 466 (good on PPI). CA-125 and CA 15-3 both ideal. Coeliac negative. Rheumatoid factor normal. Urine clear.","recommendations":"Discuss the al":"TRUE","result_position":"0.4095","lower_normal":"11.5","upper_normal":"15","lower_optimal":"12","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.380952381","upper_optimal_position":"0.5238095238","range_type":"normal"},{"key":"plateletcount","name":"Platelets","group":"HEMATOLOGY","units":"x10^9/L","description":"Within the laboratory range at 154, near the lower limit and below ideal. Platelets are the cells that form the initial plug when a blood vessel is damaged. A count at the lower end can be natural variation, or it can be part of the picture of a body economising on cell production when the energy supply is tight.","low_causes":"Low energy availability, natural variation","high_causes":"Inflammation","padding":"1","one_sided":"0.5","result":"154","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3385","lower_normal":"150","upper_normal":"410","lower_optimal":"200","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974358974","upper_optimal_position":"0.5897435897","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","units":"fL","description":"Above range at 11.5. MPV measures the size of platelets, and larger platelets are younger platelets. With the platelet count at the lower end (154), the body is producing fewer platelets but making them larger to compensate. This pattern is consistent with either natural variation or the economising picture.","low_causes":"Bone marrow suppression","high_causes":"Platelet turnover, low energy availability","padding":"1","one_sided":"0.5","result":"11.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"8","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333333333","upper_optimal_position":"0.6555555556","range_type":"normal"},{"key":"wbc","name":"White cell count","group":"HEMATOLOGY","units":"x10^9/L","description":"Below range at 3.22, and this is part of the broader pattern in this report.\n\nWhite blood cells are the immune system's workforce. At 3.22, the total count is below the lower limit. The shortfall is in the neutrophils (below) rather than the lymphocytes, which are at the lower end of range but within it. In a lean woman of 27 training 9+ times per week on a diet volume of 5 out of 10, this fits the picture of a body that is receiving less energy than it is expending and is economising on the functions it can do without in the short term. Immune cell production is one of the first things the body quietly downgrades when fuel is short.","low_causes":"Low energy availability, training volume, underfuelling","high_causes":"Infection","padding":"1","one_sided":"0.5","result":"3.22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.29","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5555555556","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophils","group":"HEMATOLOGY","units":"x10^9/L","description":"Below range at 1.62. Neutrophils are the front-line defence against bacterial infection, and at 1.62 the count is meaningfully below the limit of 2. In the context of this report, this is most likely driven by the combination of high training volume and inadequate fuelling, but the GP should be aware.","low_causes":"Low energy availability, training","high_causes":"Bacterial infection","padding":"1","one_sided":"0.5","result":"1.62","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.308","lower_normal":"2","upper_normal":"7","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3 3333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5277777778","range_type":"normal"},{"key":"basophilcount","name":"Basophils","group":"HEMATOLOGY","units":"x10^9/L","description":"Within range.","low_causes":"Not significant","high_causes":"Allergy","padding":"1","one_sided":"0.5","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3703703704","upper_optimal_position":"0.5925925926","range_type":"normal"},{"key":"reticulocytecount","name":"Reticulocyte Count","group":"HEMATOLOGY","units":"%","description":"Within the laboratory range.","low_causes":"Bone marrow suppression","high_causes":"Blood loss","padding":"1","one_sided":"0.5","result":"0.98","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4133","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4166666667","upper_optimal_position":"0.5833333333","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Retics Absolute","group":"HEMATOLOGY","units":"x10^9/L","description":"Marginally below range at 48.706. Reticulocytes are brand new red blood cells being released by the bone marrow, and at 48.706 the production rate is just under the threshold. With ferritin at 16, the bone marrow is beginning to feel the iron supply tighten. Despite this, the haemoglobin is still healthy at 152, so the body has not yet developed anaemia, but production is slowing and the direction warrants attention.","low_causes":"Low iron, low energy availability","high_causes":"Blood loss","padding":"1","one_sided":"0.5","result":"48.706","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3247","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3666666667","upper_optimal_position":"0.5333333333","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","units":"umol/l","description":"Within the laboratory range at 12.1, toward the lower end. Serum iron fluctuates through the day and can be affected by recent food intake, so the ferritin below gives a more reliable picture of overall iron status.","low_causes":"Iron deficiency","high_causes":"Recent intake","padding":"1","one_sided":"0.5","result":"12.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3418","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"15","upper_optimal":"22","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3908629442","upper_optimal_position":"0.5093062606","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","units":"ng/ml","description":"Within the laboratory range at 16 but well below the ideal level of 30 for a woman, and functionally depleted given her training volume.\n\nFerritin is the storage form of iron. The body uses iron to make haemoglobin (which carries oxygen to every cell), to produce energy inside cells, to support brain function, and to maintain healthy hair, skin and nails. When stores run low, even before full anaemia develops, people commonly experience fatigue, brain fog, poor recovery from training, and hair thinning, all of which Tanisha reports.\n\nAt 16 with 5+ cardio and 4 resistance sessions per week, plus 10,000 to 15,000 daily steps, the demand on iron is very high. Endurance exercise causes iron loss through sweat, through the destruction of red cells in the feet during impact exercise, and through the increased demand for oxygen-carrying capacity. Her omeprazole is making this worse, because PPIs reduce stomach acid, and stomach acid is needed to convert dietary iron into the form the gut can absorb.\n\nIron supplementation alongside vitamin C is recommended, and the ferritin should be rechecked at 12 weeks. An ideal target for someone at her training volume would be above 50, and ideally above 80.","low_causes":"Low intake, menstruation, training losses, PPI impaired absorption","high_causes":"Inflammation","padding":"1","one_sided":"0.5","result":"16","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3405","lower_normal":"10","upper_normal":"291","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3570581257","upper_optimal_position":"0.4994068802","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","units":"umol/l","description":"Within the ideal range. The transport system has capacity to carry more iron if it becomes available.","low_causes":"Iron overload","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","result":"58.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4818","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"65","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3956386293","upper_optimal_position":"0.5514018692","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","units":"%","description":"Within the laboratory range at 19.2, near the lower boundary and below ideal. Consistent with the low ferritin.","low_causes":"Iron deficiency","high_causes":"Iron overload","padding":"1","one_sided":"0.5","result":"19.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3441","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963963964","upper_optimal_position":"0.5315315315","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","units":"g/L","description":"Within the ideal range.","low_causes":"Iron overload","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","result":"2.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3666666667","upper_optimal_position":"0.5222222222","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","units":"nmol/L","description":"Within the laboratory range at 1.0, at the lower end for a woman. Testosterone in women supports energy, mood, motivation, muscle building, bone density and hair health.","low_causes":"Low energy availability, high SHBG","high_causes":"Natural variation","padding":"1","one_sided":"0.5","result":"1.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4127","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4126984127","upper_optimal_position":"0.5714285714","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","units":"nmol/l","description":"At the absolute floor at 0.005, and this is one of the most important findings in the report.\n\nFree testosterone is the fraction not bound to carrier proteins, meaning it is the fraction actually available to tissues. At 0.005, virtually none of her testosterone is reaching the cells that need it. The reason is visible in the SHBG below.\n\nThis matters because testosterone in women is not just a male hormone in small amounts. It supports energy levels, the ability to build and maintain muscle (directly relevant to her training goals), bone density, mood, motivation, and the health of hair follicles. At 0.005, the hair follicles are receiving almost no androgenic support, which is a plausible contributor to the hair thinning she describes. The fatigue may also be partly connected, since testosterone supports cellular energy production.","low_causes":"Very high SHBG binding all available testosterone","high_causes":"Low SHBG","padding":"1","one_sided":"0.5","result":"0.005","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.005","upper_normal":"0.03","lower_optimal":"0.01","upper_optimal":"0.025","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4","upper_optimal_position":"0.6","range_type":"normal"},{"key":"freeandrogenindex","name":"Free Androgen Index","group":"HORMONES","units":"Ratio","description":"Within the laboratory range but at the floor. Confirms the very low free testosterone availability.","low_causes":"Very high SHBG","high_causes":"Low SHBG","padding":"1","one_sided":"0.5","result":"0.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3382","lower_normal":"0.5","upper_normal":"6","lower_optimal":"1","upper_optimal":"4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3636363636","upper_optimal_position":"0.5454545455","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","units":"nmol/l","description":"Above range at 171.3, and this is the mechanism behind the very low free testosterone.\n\nSHBG is a protein made by the liver that binds sex hormones and holds them out of circulation. At 171.3, it is above the female range and is binding up virtually all available testosterone, which is why the free testosterone is only 0.005.\n\nSHBG rises in two relevant situations. The first is low energy availability, which is a pattern where the body receives less fuel than it expends over a sustained period. When this happens, the liver increases SHBG production as part of the body's response to conserve resources, and reproductive and androgenic hormones are among the first things it dials down. The second is PPI use, since omeprazole is associated with raised SHBG through effects on liver metabolism.\n\nAt her training volume (5+ cardio, 4 resistance, 10,000 to 15,000 steps) with a diet volume of only 5 out of 10, the energy balance is likely negative, and the SHBG reflects that. Increasing caloric intake to match the training demand would be the most direct way to bring SHBG down, free testosterone up, and relieve several of the symptoms she describes.","low_causes":"Obesity, insulin resistance","high_causes":"Low energy availability, PPI use, caloric deficit","padding":"1","one_sided":"0.5","result":"171.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.706","lower_normal":"17","upper_normal":"155","lower_optimal":"30","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3647342995","upper_optimal_position":"0.5821256039","range_type":"normal"},{"key":"estradiol","name":"Oestradiol","group":"HORMONES","units":"pmol/L","description":"At 622. Her progesterone at 15.76 and the LH/FSH levels confirm she was in the luteal phase of her cycle (the second half, after ovulation). Oestradiol at 622 in the luteal phase is within the expected range, and her cycle appears to be functioning, which at this level of training and low energy availability is a positive sign.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"622","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_norma :"HORMONES","units":"uIU/ml","description":"Within the ideal range.","low_causes":"Not significant","high_causes":"Stress","padding":"1","one_sided":"0.5","result":"125","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4141","lower_normal":"45","upper_normal":"375","lower_optimal":"100","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3888888889","upper_optimal_position":"0.5909090909","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","units":"nmol/l","description":"Below range at 155, and this is a significant finding that ties the broader picture together.\n\nCortisol is the body's main stress hormone, produced by the adrenal glands. In the short term, cortisol rises in response to stress and exercise, which is a useful and normal response. Over a sustained period, when the body is under chronic physiological stress, particularly from insufficient fuelling alongside heavy training, the adrenal response can flatten. Rather than staying high, cortisol production falls below normal as the body conserves energy.\n\nAt 155, against a lower limit of 172, the adrenal system is running below its floor. In a woman training 9+ times per week with a diet volume of only 5 out of 10, this is the clearest marker of what sports medicine calls Relative Energy Deficiency in Sport (RED-S), formerly known as the female athlete triad. The body is receiving less fuel than it is burning, and it is responding by quietly downgrading the functions it can survive without in the short term: cortisol production, immune cell counts (WBC 3.22, neutrophils 1.62), red blood cell production (reticulocytes 48.706), and reproductive hormone availability (SHBG 171.3 binding all available testosterone).\n\nThe answer is not less training. It is more food. Specifically, more total calories to match the energy output, and more protein to support recovery and muscle building. Thi function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

//  INTERACTIONS
// ============================================================
function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');

    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
