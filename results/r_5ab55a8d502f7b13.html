 phosphate are healthy. His vitamin D at 131 is excellent and reflects good supplementation practice.\n\nHis creatine kinase (CK, an enzyme released from muscle tissue during intense exercise) at 260 is within the range of 40 to 320, which is reassuring given his training volume. His IGF-1 (insulin-like growth factor 1, a hormone that mediates growth and recovery) at 12.2 nmol/L is at the very bottom of the age-adjusted range of 7.58 to 28.63. Low IGF-1 is another recognised feature of caloric restriction and sleep deprivation, both of which suppress the growth hormone axis. This is likely contributing to his poor recovery.\n\nHis cortisol at 367 nmol/L falls within the morning reference range and does not suggest adrenal dysfunction, though it sits in the middle of the range rather than being elevated as one might expect with his stress load, which may reflect adaptation to chronic stress.\n\nHis immune markers are healthy. His IgG, IgM, and IgA are all within range. His rheumatoid factor is negative. His coeliac screen (tissue transglutaminase IgA) is negative. His total antioxidant activity at 1.49 is within range.\n\nHis full blood count is largely healthy. His haemoglobin at 158, red blood cells at 4.94, haematocrit at 0.473, and RDW at 12 are all within range. His white cell count at 7.01, neutrophils, lymphocytes, monocytes, eosinophils, and basophils are all within their respective ranges. His reticulocytes at 1.13% and absolute reticulocytes at 55.8 are within range. His platelets at 169 are within range, though at the lower end. His MCH (mean corpuscular haemoglobin, the average amount of haemoglobin in each red cell) at 32.1 is marginally above the upper limit of 32, which at this margin is typically laboratory variation and not clinically significant. His MPV (mean platelet volume, the average size of platelets) at 10.3 is marginally above the upper limit of 10.1; larger platelets are often seen when platelet count is at the lower end of the range, as the bone marrow compensates by producing fewer but larger platelets. Neither finding is a concern.\n\nHis urinalysis shows heavy ketones (4+), which is entirely expected on a low-carb diet and confirms genuine carbohydrate restriction. His urine protein shows a trace positive (+), which can occur after intense exercise and is most likely exercise-induced proteinuria. His urine white blood cells at 40 are above the significance threshold of 10, but his nitrites are negative, his bacterial count is less than 10 to the third, and the culture showed insignificant growth. In the absence of symptoms of urinary tract infection, this is most likely related to intense physical activity, dehydration, or sample timing. If Kevin experiences any urinary symptoms such as burning, frequency, or discomfort, a repeat sample would be appropriate. His urine RBCs, glucose, casts, and urobilinogen are all unremarkable.\n\nPutting the whole picture together, Kevin is a man who is training exceptionally hard, eating a very clean diet but likely not enough of it, sleeping far too little, and running on caffeine to bridge the gap. His body is responding predictably: it has turned down thyroid output, depleted circulating iron despite adequate stores, dropped IGF-1, and generated significant systemic inflammation. His hormone profile requires immediate GP review to clarify the source of the supraphysiological testosterone and guide appropriate monitoring. His PSA needs urological follow-up. And the lifestyle factors, particularly sleep and caloric intake, are the foundations on which every other improvement will be built.","links":"Kevin's results point to several clear actions, and the order in which they are addressed matters.\n\nThe first priority is a GP appointment to discuss the hormone profile. Kevin should bring the following numbers: testosterone 74.2 (upper limit 28.7), free testosterone 3.105 (upper limit 1.04), SHBG 6.2 (lower limit 17.3), LH less than 0.07 (lower limit 1.5), FSH less than 0.3 (lower limit 1.4), oestradiol 334 (upper limit 146), and the free androgen index of 1,197 (upper limit 150). The GP needs to understand whether Kevin is using any exogenous testosterone, anabolic agents, or pro-hormone supplements, as this determines the clinical pathway. If exogenous use is confirmed, the conversation should cover cardiovascular monitoring (haematocrit, lipids, blood pressure), liver health, fertility implications given the complete gonadotropin suppression, and the elevated oestradiol which may warrant discussion about aromatase management. If there is no exogenous source, the GP should investigate testosterone-secreting pathology, which would be unusual but must be excluded given the magnitude of the elevation.\n\nThe second GP conversation is about the PSA. Kevin should bring: PSA 3.75 (age-adjusted limit 2.5), free PSA ratio 0.171 (below the 0.19 reassurance threshold). The GP should consider a repeat PSA once the hormone situation is clarified, a digital rectal examination, and referral for multiparametric MRI or urological opinion.\n\nThe third GP conversation is the inflammation. ESR 42 (limit 12), CRP 18 (limit 5). The GP should consider whether the training volume and sleep deprivation are sufficient to explain this, or whether further investigation is warranted, including a broader autoimmune screen if clinically indicated.\n\nThe fourth conversation point is the IgE at 188 (limit 100). Kevin may benefit from specific allergen testing (RAST panel or skin prick testing) to identify whether environmental or dietary allergens are contributing to his inflammatory burden and joint symptoms.\n\nBeyond the GP, the single most impactful change Kevin can make is sleep. Fewer than six hours most nights is insufficient for recovery, immune regulation, hormone balance, thyroid function, and inflammation control. Every marker that is suboptimal in this report, from the low free T3 to the elevated CRP to the low IGF-1 to the poor recovery he reports, is worsened by sleep deprivation. The target should be seven to eight hours of actual sleep, not just time in bed. Practical steps include setting a fixed wake time seven days a week, getting outside within an hour of waking to anchor the circadian rhythm, cutting caffeine entirely after midday (and ideally reducing total caffeine intake given his reported overuse), keeping the bedroom cool (around 18 degrees Celsius), and removing screens from the bedroom for the final hour before sleep. This is not optional self-care; it is the single highest-yield intervention available.\n\nThe second lifestyle change is caloric intake. Kevin rates his diet quality at 10 out of 10, which is excellent, but his volume at 5 out of 10 suggests he is significantly undereating for his training load. At 102 kg with nine or more training sessions per week and 7,500 to 10,000 daily steps, his estimated maintenance calories are approximately 3,050 to 3,250 per day (using a very active multiplier of 1.75 on an estimated basal metabolic rate of around 1,750 to 1,860 kcal). If he is eating at a volume of 5 out of 10, he may be consuming 2,000 to 2,400 calories, which would represent a significant deficit. This level of deficit, sustained alongside his training volume, is the classic driver of the suppressed thyroid, low IGF-1, and functional iron deficiency pattern seen in his results. If weight loss is a goal, a modest deficit of 300 to 500 calories below maintenance (approximately 2,550 to 2,950 per day) would still support fat loss while allowing recovery. Protein should be at least 1.6 to 2.0 g per kilogram of body weight, which for Kevin means 163 to 204 grams per day, and on a low-carb diet this is achievable but needs deliberate attention.\n\nThe third change is training load management. Nine or more sessions per week alongside fewer than six hours of sleep is a recipe for the exact pattern of inflammation, suppressed thyroid, poor recovery, and fatigue that Kevin is experiencing. Reducing to six or seven sessions per week (three to four resistance, three cardio) while improving sleep and caloric intake would likely produce better training adaptations with less physiological cost. Recovery is not weakness; it is where adaptation happens.\n\nKevin should also moderate his caffeine intake. Caffeine overuse depletes magnesium, disrupts sleep architecture even when consumed early in the day, raises cortisol, and can impair iron absorption when consumed near meals. A practical target is no more than two to three caffeinated drinks per day, all consumed before midday, and ideally not within an hour of meals.\n\nFor retesting, we would recommend repeating the following markers in 10 to 12 weeks: full hormone panel (testosterone, free testosterone, SHBG, LH, FSH, oestradiol), PSA and free PSA, CRP and ESR, iron studies (serum iron, transferrin saturation, ferritin), thyroid panel (TSH, FT4, FT3), vitamin B12, and a repeat fasting insulin and C-Peptide. This timeframe allows any lifestyle changes and GP interventions to take effect before reassessment.","flags":"URGENT: Hormone profile consistent with exogenous androgen use. Testosterone 74.2 nmol/L (limit 28.7), free testosterone 3.105 nmol/L (limit 1.04), FAI 1,197 (limit 150), SHBG 6.2 nmol/L (lower limit 17.3), oestradiol 334 pmol/L (limit 146), progesterone 4.72 nmol/L (limit 3.88), LH less than 0.07 mIU/ml (lower limit 1.5), FSH less than 0.3 mIU/ml (lower limit 1.4). Complete gonadotropin suppression with supraphysiological androgens and elevated oestradiol from aromatisation. Requires clinical review to confirm source, assess cardiovascular risk, monitor haematocrit, and discuss fertility.\n\nURGENT: PSA 3.75 ng/ml (age-adjusted limit 2.5) with free PSA ratio 0.171 (below 0.19 reassurance threshold). At age 40, this warrants urological referral. May be partly driven by the androgenic environment but must be investigated regardless.\n\nSignificant inflammation: ESR 42 mm/hr (limit 12), hs-CRP 18 mg/L (limit 5). Two independent inflammatory markers both significantly elevated. Consider causes including high training volume, sleep deprivation, occult inflammatory or autoimmune condition. Rheumatoid factor negative, coeliac screen negative.\n\nIgE elevated at 188 IU/ml (limit 100). Suggests allergic sensitisation. Consider specific allergen testing.\n\nIron studies: functional iron deficiency pattern in context of inflammation. Serum iron 8.1 umol/L (lower limit 11.6), transferrin saturation 14.53% (lower limit 18%), ferritin 266 ng/ml (within range but may be inflammation-elevated). Consider soluble transferrin receptor to distinguish true deficiency from inflammatory sequestration.\n\nThyroid: FT4 12 pmol/L (lower limit 11.5, optimal floor 14), FT3 3.8 pmol/L (optimal floor 4.5). TSH 1.21 (normal). Both antibodies negative. Pattern suggests low energy availability or chronic stress suppressing thyroid output rather than primary thyroid disease.\n\nInsulin and C-Peptide below laboratory range: insulin 2.06 mIU/L (lower limit 2.6), C-Peptide 0.357 ug/L or approximately 118 pmol/L (lower limit 1.1 ug/L or 364 pmol/L). In context of fasting glucose 3.7, HbA1c 30, and low-carb diet, this reflects low insulin demand rather than pancreatic insufficiency. HOMA-IR 0.34 confirms excellent insulin sensitivity.\n\nPTH marginally low at 0.933 pmol/L (lower limit 0.98). Calcium and phosphate normal. Vitamin D 131 nmol/L. Most likely physiological suppression from high vitamin D.\n\nUrine WBCs 40 (threshold 10) with negative nitrites, insignificant bacterial growth, no symptoms reported. Likely exercise-related or sample timing. Repeat if urinary symptoms develop.\n\nUrine protein trace positive. Likely exercise-induced proteinuria. Repeat on a rest day if persistent.\n\nMCH 32.1 pg (upper limit 32), MPV 10.3 fL (upper limit 10.1). Both marginally above range and not clinically significant.\n\nReassuring negatives: Lp(a) normal (below 25 nmol/L), confirming cardiovascular risk is modifiable. Rheumatoid factor negative. Coeliac screen negative. Both thyroid antibodies negative, excluding autoimmune thyroid disease. Kidney function excellent (Cystatin C eGFR 96). Haemoglobin, haematocrit, and red cell indices normal. Tumour markers CA 19-9 and CEA normal. CK within range despite high training volume. FIB-4 below threshold. No significant urinary RBCs.","recommendations":"1. Book a GP appointment as the first priority. Bring this report and discuss the hormone profile (testosterone 74.2, LH and FSH undetectable, oestradiol 334, SHBG 6.2), the PSA (3.75 with free ratio 0.171), and the inflammatory markers (CRP 18, ESR 42). Be transparent about any supplement or hormonal use.\n\n2. Increase sleep to a minimum of seven hours per night. Set a fixed wake time, cut caffeine after midday, remove screens from the bedroom, and keep the room cool. This is the single most impactful change available.\n\n3. Increase caloric intake to approximately 2,600 to 2,950 calories per day with a protein floor of at least 163 grams per day (1.6 g/kg). The current volume of eating is likely too low to support the training load and is contributing to suppressed thyroid output, low IGF-1, and functional iron deficiency.\n\n4. Reduce training volume to six or seven sessions per week (three to four resistance, three cardio) until inflammation has resolved, sleep has improved, and recovery is no longer a reported symptom.\n\n5. Reduce caffeine to no more than two to three servings per day, all before midday, and avoid consuming caffeine within one hour of meals to protect iron absorption.\n\n6. Request allergen-specific testing (RAST panel or skin prick testing) given the elevated IgE at 188, particularly if joint symptoms or any respiratory or skin symptoms are present.\n\n7. Retest in 10 to 12 weeks: full hormone panel, PSA and free PSA, CRP, ESR, iron studies, thyroid panel, B12, fasting insulin, and C-Peptide.","supplementation":"Given Kevin's results, the following supplements are recommended. However, given the complexity of his hormone profile, he should discuss all supplementation with his GP to ensure nothing interacts with his current SSRI or any other treatments that may be initiated.\n\nMagnesium glycinate, 400 mg elemental magnesium, taken before bed. Kevin's magnesium at 0.83 is below the optimal floor of 0.85, and his high training volume, caffeine overuse, and sleep restriction all deplete magnesium aggressively. Glycinate is the best-absorbed form and has a calming effect that supports sleep quality, which is Kevin's most pressing need.\n\nVitamin B12 as sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. His B12 at 395 is within the laboratory range but below the optimal floor of 500. Sublingual delivery bypasses any absorption issues in the gut. Methylcobalamin is the active form that requires no conversion.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with a fat-containing meal. With CRP at 18 and ESR at 42, Kevin has significant systemic inflammation, and omega-3 fatty acids have well-documented anti-inflammatory effects. EPA in particular supports the resolution of inflammation and may also support HDL levels, which are currently low.\n\nKevin's vitamin D at 131 nmol/L is excellent and he should continue whatever supplementation regimen has achieved this. If he is supplementing, maintaining 2,000 to 3,000 IU of cholecalciferol daily with 100 to 200 mcg of vitamin K2 (MK-7 form) is appropriate. K2 directs calcium into bones rather than soft tissues and arteries.\n\nDO NOT take iron supplements. Although Kevin's serum iron and transferrin saturation are low, his ferritin at 266 indicates substantial iron in storage. The low circulating iron is most likely being driven by the inflammatory process locking iron away, not by a true deficiency. Supplementing iron when ferritin is already elevated could push stores into the harmful range. The correct approach is to address the inflammation, after which circulating iron should normalise.\n\nThe most important changes from this report are not supplements. They are sleep, with a target of seven to eight hours per night; caloric intake, with a target of 2,600 to 2,950 calories and at least 163 grams of protein per day; a reduction in training volume to allow recovery; a reduction in caffeine; and a GP appointment to address the hormone profile, PSA, and inflammatory markers.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"38","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3393","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Kevin's ALT at 38 IU/l is within the laboratory limit of 56 but sits above the tighter optimal threshold of 30 for men. In someone training nine or more times per week, mild ALT elevation often reflects muscle turnover rather than liver pathology, especially when GGT, bilirubin, and albumin are all clean. This is worth monitoring but not a concern on its own.","low_causes":"","high_causes":"Liver disease, hepatitis, alcohol excess, medications (including statins and paracetamol), intense exercise causing muscle damage, fatty liver disease, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4531","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6146","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It rises with liver damage but also after intense exercise because it is abundant in skeletal and cardiac muscle tissue. Kevin's AST at 32 is comfortably within range and within the optimal zone, indicating no significant liver or muscle stress despite his demanding training schedule.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, alcohol excess, hepatitis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1986","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake, bile duct problems, and metabolic stress on the liver. It is often the first liver enzyme to rise when the liver is under strain. Kevin's GGT at 29 is within the laboratory range of 4 to 73 but sits above the tighter optimal threshold of 25. This is a minor observation. Given that all other liver markers are clean, this does not suggest liver disease.","low_causes":"","high_causes":"Alcohol excess, bile duct obstruction, liver disease, metabolic syndrome, medications, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and digestive system. Elevated levels can indicate bile duct obstruction, bone disease, or liver pathology. Kevin's ALP at 50 is at the lower end of the range, indicating healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, pernicious anaemia","high_causes":"Bile duct obstruction, liver disease, bone disorders (Paget's disease), vitamin D deficiency, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells break down. The liver processes it for excretion. Elevated levels can indicate liver disease, bile duct obstruction, or excessive red cell breakdown. Kevin's bilirubin at 10 is comfortably within range, confirming healthy liver clearance.","low_causes":"","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome (benign inherited condition)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined level of albumin and globulin in the blood. It reflects the liver's ability to produce proteins and the immune system's activity. Kevin's total protein at 72 is within the optimal range, indicating healthy liver synthetic function and immune protein production.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease (protein loss)","high_causes":"Chronic infection, chronic inflammation, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins, and medications around the body and keeps fluid from leaking out of blood vessels. Kevin's albumin at 41 is within the optimal range, confirming that the liver's protein-producing capacity is healthy.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease (nephrotic syndrome)","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5741","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6481","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) and transport proteins. The level reflects immune system activity and liver function. Kevin's globulin at 31 is within range, suggesting a normally active immune system.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two main protein fractions in the blood. A balanced ratio indicates that the liver is producing adequate albumin and the immune system is not overproducing globulins. Kevin's A/G ratio at 1.32 is within the optimal range.","low_causes":"Overproduction of globulins (inflammation, infection, autoimmune disease), underproduction of albumin (liver disease)","high_causes":"Underproduction of globulins (immune deficiency)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"Fibrosis-4 Score","group":"LIVER & METABOLIC","result":"1.23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4241","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that uses age, platelet count, AST, and ALT to estimate the likelihood of liver fibrosis (scarring). A score below 1.3 in someone under 65 suggests a low risk of significant fibrosis. Kevin's score at 1.23 is below the threshold, which is reassuring and means there is no indication of liver scarring.","low_causes":"","high_causes":"Liver fibrosis or cirrhosis, chronic hepatitis, alcohol-related liver disease, age (score naturally increases with age), low platelets, low ALT inflating the calculation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands that helps digest carbohydrates. Elevated levels can indicate pancreatic inflammation (pancreatitis). Kevin's amylase at 72 is mid-range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4894","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down fats. It is a more specific marker of pancreatic health than amylase. Kevin's lipase at 43 is within range, confirming the pancreas is functioning normally.","low_causes":"","high_causes":"Pancreatitis, pancreatic cancer, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3572","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures all the cholesterol carried in the blood, including LDL, HDL, and VLDL fractions. While a useful screening number, the breakdown into individual fractions (particularly LDL, HDL, and ApoB) is more informative than the total. Kevin's total cholesterol at 3.7 is well within the desirable range below 5.18.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic infection","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2206","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat in the blood, derived from dietary fat and also produced by the liver from excess carbohydrates and alcohol. They are a key indicator of metabolic health. Kevin's triglycerides at 0.75 are excellent, well within the optimal zone below 1.0, and reflect his low-carbohydrate diet and good metabolic function.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate or sugar diet, alcohol excess, obesity, metabolic syndrome, diabetes, hypothyroidism, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) cholesterol carries triglycerides from the liver to tissues. Elevated VLDL is associated with metabolic syndrome and cardiovascular risk. Kevin's VLDL at 0.34 is low, consistent with his excellent triglyceride level.","low_causes":"","high_causes":"High carbohydrate diet, obesity, metabolic syndrome, diabetes, alcohol excess","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4327","lower_normal":"1.04","upper_normal":"2.04","lower_optimal":"1.4","upper_optimal":"2.04","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for disposal. Higher levels are protective against cardiovascular disease. Kevin's HDL at 0.9 is below the 1.04 lower limit for men and well below the optimal threshold of 1.4. Low HDL can be driven by systemic inflammation, sleep deprivation, very low carbohydrate intake, certain medications including SSRIs, and physical stress. Improving sleep, managing inflammation, and ensuring adequate caloric intake should support HDL recovery over time.","low_causes":"Smoking, obesity, sedentary lifestyle, metabolic syndrome, very low-fat diet, inflammation, sleep deprivation, certain medications","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6067","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol carries cholesterol from the liver to tissues and artery walls. It is the primary driver of atherosclerosis when elevated. Kevin's LDL at 2.45 is within the laboratory range and within the optimal zone below 2.6, which is an excellent result, particularly on a high-protein diet.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, kidney disease, obesity, low thyroid function","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.11","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4567","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick snapshot of cardiovascular risk by comparing total cholesterol to the protective HDL fraction. A lower ratio is better. Kevin's ratio at 4.11 is within the laboratory limit of 4.5 but above the optimal threshold of 3.5, driven primarily by his low HDL rather than high total cholesterol.","low_causes":"","high_causes":"Low HDL, high total cholesterol, poor metabolic health","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"24.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4054","lower_normal":"20","upper_normal":"100","lower_optimal":"20","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"This shows what percentage of total cholesterol is carried by HDL. A higher percentage indicates a more favourable ratio of protective to potentially harmful cholesterol. Kevin's HDL percentage at 24.32% is above the 20% threshold, though ideally it would be higher as his HDL improves.","low_causes":"Low HDL, metabolic syndrome, inflammation","high_causes":"Excellent cardiovascular health, regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic lipoproteins (LDL, VLDL, and remnants) in a single number and is considered a better risk predictor than LDL alone. Kevin's non-HDL at 2.8 is well within the desirable range below 4.","low_causes":"","high_causes":"High LDL, high triglycerides, metabolic syndrome, familial hyperlipidaemia","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"0.97","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4042","lower_normal":"1.2","upper_normal":"2.4","lower_optimal":"1.4","upper_optimal":"2.4","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main structural protein of HDL particles. It reflects the number of HDL particles available to perform reverse cholesterol transport, the process by which cholesterol is removed from artery walls. Kevin's ApoA1 at 0.97 is below the desirable level of 1.20, which mirrors his low HDL and confirms that he has fewer protective HDL particles than ideal.","low_causes":"Smoking, obesity, sedentary lifestyle, inflammation, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL, and Lp(a) particle. It is considered the single best blood marker of cardiovascular risk because it directly counts the number of atherogenic particles in the bloodstream, regardless of how much cholesterol each one carries. Kevin's ApoB at 0.76 is below the desirable target of 0.9 and within the optimal zone below 0.8, which is an excellent result for long-term cardiovascular health.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, metabolic syndrome, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.78","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5571","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio balances the number of atherogenic particles (ApoB) against the number of protective particles (ApoA1). It is one of the strongest predictors of cardiovascular risk. A ratio below 0.7 is considered low risk. Kevin's ratio at 0.78 sits in the average risk band, above the 0.7 threshold. This is driven primarily by his low ApoA1 (reflecting low HDL) rather than excessive ApoB. As his HDL and ApoA1 improve, this ratio should move into the low-risk zone.","low_causes":"Excellent HDL production, low atherogenic particle count","high_causes":"Low HDL, high LDL particle count, metabolic syndrome, inflammation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that promotes atherosclerosis, blood clotting, and arterial inflammation. Unlike LDL, it cannot be significantly changed through diet or exercise and is entirely inherited. It only needs to be measured once in a lifetime because the level is set by genetics. Kevin's Lp(a) at below 25 nmol/L is normal, which is genuinely useful information because it confirms that his cardiovascular risk is driven entirely by modifiable factors such as HDL, lifestyle, and inflammation rather than an inherited lipid risk.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic inheritance (cannot be modified by diet or lifestyle)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2767","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful marker of insulin resistance and metabolic health. A lower ratio indicates better metabolic function. Kevin's ratio at 0.83 is within the optimal zone below 0.87, which is a strong indicator of metabolic health despite the low HDL, because the very low triglycerides are keeping the ratio favourable.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, low HDL","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2188","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It captures the cholesterol carried by triglyceride-rich remnant particles, which are increasingly recognised as independent drivers of cardiovascular disease. Kevin's remnant cholesterol at 0.35 is well within the optimal zone below 0.5.","low_causes":"","high_causes":"High triglycerides, metabolic syndrome, diabetes, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. It is the most basic screening tool for diabetes and metabolic health. Kevin's glucose at 3.7 is within the laboratory range but below the optimal floor of 4.0. On a very low-carbohydrate diet, fasting glucose levels are often lower than on a standard diet because the body is running primarily on fat and ketones for fuel. This is physiological, not pathological, and is consistent with the heavy ketones found in his urine.","low_causes":"Low-carbohydrate diet, prolonged fasting, excessive insulin production (insulinoma), adrenal insufficiency, excessive exercise","high_causes":"Diabetes, pre-diabetes, stress, infection, medications (corticosteroids), Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin molecules in red blood cells that have glucose attached to them. Because red blood cells live for about three months, it provides a rolling average of blood sugar levels over that period. Kevin's HbA1c at 4.9% is well within the normal range (below 6.0%) and reflects excellent blood sugar control over the past three months.","low_causes":"Blood loss, haemolytic anaemia, very low carbohydrate intake","high_causes":"Diabetes, pre-diabetes, consistently elevated blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised IFCC units. A value below 42 mmol/mol is considered normal, 42 to 47 indicates pre-diabetes, and above 48 indicates diabetes. Kevin's HbA1c at 30 mmol/mol is well within the optimal zone below 36, confirming excellent long-term blood sugar control.","low_causes":"Blood loss, haemolytic anaemia, very low carbohydrate intake","high_causes":"Diabetes, pre-diabetes, consistently elevated blood sugar","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.06","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2923","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3243","upper_optimal_position":"0.4135","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to maintain blood sugar levels after an overnight fast. In the context of a low-carbohydrate diet with excellent blood sugar and HbA1c, a low insulin level reflects low demand rather than pancreatic failure. Kevin's insulin at 2.06 is marginally below the laboratory lower limit of 2.6 but sits within the optimal band of 2 to 8 that reflects excellent insulin sensitivity. His body simply does not need much insulin because his carbohydrate intake is very low.","low_causes":"Low-carbohydrate diet, prolonged fasting, excellent insulin sensitivity, type 1 diabetes (in which case glucose would be high)","high_causes":"Insulin resistance, metabolic syndrome, obesity, pre-diabetes, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.357","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2257","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is a fragment released by the pancreas in equal amounts to insulin. It confirms how much insulin the body is actually producing, independent of any external insulin administration. Kevin's C-Peptide at 0.357 ug/L (approximately 118 pmol/L) is below the laboratory range. In the context of a fasting glucose of 3.7 and HbA1c of 30 on a low-carb diet, this reflects genuinely low insulin demand. The pancreas is producing only as much insulin as is needed, which is very little when carbohydrate intake is minimal. This is worth monitoring at retest to confirm it remains proportionate to dietary context.","low_causes":"Low-carbohydrate diet, fasting, type 1 diabetes (when glucose is high), exogenous insulin use","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease (reduced clearance)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.34","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.2267","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using fasting glucose and insulin to estimate how resistant the body's cells are to insulin. Lower values indicate better insulin sensitivity. Kevin's HOMA-IR at 0.34 is below the laboratory lower limit of 0.5, but as the laboratory note confirms, below 1.0 indicates optimal insulin sensitivity. Being below the lower end of the reference range in the favourable direction is a positive finding, reflecting excellent metabolic efficiency from his low-carb approach.","low_causes":"Excellent insulin sensitivity, low-carbohydrate diet, fasting","high_causes":"Insulin resistance, metabolic syndrome, obesity, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"206","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B (Homeostatic Model Assessment of Beta-cell function) estimates how well the pancreatic beta cells are producing insulin relative to the glucose level. It is calculated as (20 x Insulin) / (Glucose - 3.5). Kevin's HOMA-B calculates to approximately 206, marginally above the upper reference of 200. This is a mathematical artefact: when fasting glucose is very low at 3.7, the denominator in the calculation (3.7 minus 3.5 = 0.2) becomes very small, which inflates the result. This does not indicate pancreatic overwork. In the context of healthy glucose and HbA1c, this is not a clinical concern.","low_causes":"Pancreatic beta-cell failure, late type 2 diabetes, type 1 diabetes","high_causes":"Mathematical artefact with very low glucose, early insulin resistance (compensatory increase), insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is produced by the liver in response to inflammation anywhere in the body. At low levels (below 3), it is used as a cardiovascular risk marker. At Kevin's level of 18 mg/L, well above the upper limit of 5, it is indicating an active inflammatory process rather than cardiovascular risk per se. This level of CRP, combined with the elevated ESR, confirms genuine systemic inflammation. The source needs to be identified: possibilities include the extreme training volume with inadequate recovery and sleep, an underlying inflammatory or autoimmune condition, or chronic musculoskeletal inflammation contributing to his joint pain.","low_causes":"","high_causes":"Infection, autoimmune disease, chronic inflammatory conditions, obesity, extreme exercise, tissue damage, sleep deprivation","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"42","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2917","units":"mm/hour","description":"The erythrocyte sedimentation rate (ESR) measures how quickly red blood cells settle to the bottom of a test tube over one hour. When inflammation is present, proteins in the blood cause red cells to clump together and settle faster. Kevin's ESR at 42 is more than three times the upper limit of 12, which is a significant elevation. Combined with the CRP of 18, this confirms an active inflammatory process. The ESR tends to rise and fall more slowly than CRP, meaning the inflammation may have been present for some time.","low_causes":"Polycythaemia, sickle cell disease, very high white blood cell count","high_causes":"Infection, autoimmune disease, chronic inflammation, malignancy, anaemia, tissue damage","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nlr","name":"NLR","group":"INFLAMMATION","result":"2.30","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) is calculated by dividing neutrophils by lymphocytes. It provides a snapshot of the balance between the innate immune system (neutrophils, which respond first to threats) and the adaptive immune system (lymphocytes, which provide targeted immune responses). Kevin's NLR at 2.30 is within the laboratory range of 1 to 3 but above the optimal ceiling of 2.0, which is consistent with his elevated inflammatory markers.","low_causes":"Viral infection (relative lymphocytosis)","high_causes":"Bacterial infection, physiological stress, chronic inflammation, intense exercise, sleep deprivation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6179","units":"mmol/l","description":"Sodium is the primary electrolyte that regulates fluid balance, blood pressure, and nerve and muscle function. Kevin's sodium at 141 is within the optimal range, indicating healthy fluid and electrolyte balance.","low_causes":"Excessive water intake, diuretics, adrenal insufficiency, SIADH, heart failure, liver disease","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve signalling. Both too high and too low can be dangerous. Kevin's potassium at 4.1 is within the optimal range.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, dehydration, haemolysed sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"105","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/l","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance, blood pressure, and acid-base equilibrium. Kevin's chloride at 98 is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, over-hydration, adrenal insufficiency","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive saline infusion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"22.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3576","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is a key buffer in the blood that helps maintain pH balance. It works with the kidneys and lungs to keep blood at the correct acidity. Kevin's bicarbonate at 22.7 is within the optimal range. On a very low-carb diet producing significant ketones, bicarbonate can sometimes be mildly reduced as it buffers ketoacids, so this level is reassuring.","low_causes":"Metabolic acidosis, diabetic ketoacidosis, kidney disease, severe diarrhoea, intense exercise","high_causes":"Metabolic alkalosis, vomiting, diuretics, respiratory disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"24.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/l","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate). It reflects the balance of measured and unmeasured charged particles in the blood. An elevated anion gap indicates the presence of unmeasured acids. Kevin's anion gap calculates to 24.4, which is above the upper limit of 16. The most likely explanation on a very low-carbohydrate diet with 4+ urinary ketones is nutritional ketosis: the ketone bodies (beta-hydroxybutyrate and acetoacetate) are unmeasured anions that widen the gap. This is an expected finding in someone in deep ketosis and is not the same as diabetic ketoacidosis, which occurs with very high glucose and insulin deficiency. His glucose is 3.7 and his HbA1c is 30, so diabetic ketoacidosis is not the explanation. However, this level of ketosis alongside extreme training and sleep deprivation warrants awareness, and ensuring adequate hydration and electrolyte intake is important.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Ketosis (nutritional or d
