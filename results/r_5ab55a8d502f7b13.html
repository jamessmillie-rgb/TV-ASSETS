 range, which may indicate that the allergen exposure is not currently driving a major eosinophilic response.","low_causes":"Corticosteroid use, acute stress","high_causes":"Allergic reactions, parasitic infection, asthma, eczema, drug reactions, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Basophils are the least common white blood cells and are involved in allergic reactions and inflammation. Kevin's basophils at 0.04 are within range.","low_causes":"Acute allergic reaction (transient), hyperthyroidism, corticosteroid use","high_causes":"Allergic conditions, chronic inflammation, hypothyroidism, chronic myeloid leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"1.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage indicates how actively the bone marrow is producing new red cells. Kevin's reticulocyte count at 1.13% is within the optimal range, indicating steady, healthy red cell production.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, chronic disease, low energy availability","high_causes":"Blood loss (compensatory), haemolytic anaemia, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"55.822","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3888","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells per litre, providing a more precise measure than percentage alone. Kevin's absolute reticulocytes at 55.8 are within the laboratory range but just below the optimal floor of 55. This is a borderline finding and not clinically significant.","low_causes":"Iron, B12, or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"8.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2374","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6118","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to the transport protein transferrin. It fluctuates throughout the day and with meals, but Kevin's fasting level of 8.1 umol/L is below the lower limit of 11.6. In the context of a ferritin of 266 (meaning iron stores are adequate), the low serum iron most likely reflects functional iron deficiency driven by his significant systemic inflammation. When the body detects inflammation, it withholds iron from circulation as a defence mechanism (since bacteria need iron to grow), locking it into ferritin storage instead.","low_causes":"Iron deficiency, chronic disease/inflammation (functional deficiency), blood loss, malabsorption, low dietary intake","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3489","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6267","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. The body produces more transferrin when iron stores are low (to catch more iron) and less when stores are adequate. It is also a negative acute phase reactant, meaning it drops during inflammation. Kevin's transferrin at 2.22 is within the laboratory range but at the lower end and below the optimal floor of 2.3, which is consistent with either adequate iron stores or the inflammatory suppression seen in his other markers.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency (compensatory increase), pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"14.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2399","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3522","upper_optimal_position":"0.4928","units":"%","description":"Transferrin saturation tells you what percentage of the available transferrin carriers are actually loaded with iron. It combines iron and transferrin into a single metric. Kevin's saturation at 14.53% is below the lower limit of 18% and well below the optimal floor of 25%. This confirms that despite adequate iron in storage (ferritin 266), not enough iron is being made available for use. This functional iron deficiency pattern, driven by inflammation, may be contributing to Kevin's fatigue and poor recovery.","low_causes":"Iron deficiency, chronic inflammation (functional deficiency), blood loss","high_causes":"Haemochromatosis, iron overload, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4268","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3364","upper_optimal_position":"0.6239","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the maximum amount of iron that transferrin in the blood could carry if fully saturated. It reflects the body's capacity to transport iron. Kevin's TIBC at 53 is within the optimal range.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency (compensatory increase), pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"266","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6044","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3600","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the protein that stores iron inside cells, and blood ferritin levels reflect total body iron stores. It is also an acute phase reactant, meaning it rises during inflammation regardless of iron status. Kevin's ferritin at 266 is within the laboratory range for a male (22 to 322) but above the optimal ceiling of 200. Given his CRP of 18 and ESR of 42, some of this ferritin elevation is likely inflammation-driven rather than reflecting genuinely excessive iron stores. The true iron status picture is best assessed by the low serum iron and transferrin saturation, which suggest iron is locked in storage rather than being freely available.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, malabsorption, heavy exercise","high_causes":"Iron overload, haemochromatosis, inflammation (acute phase response), liver disease, metabolic syndrome, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"74.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5244","upper_optimal_position":"0.6831","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, red blood cell production, libido, mood, and energy. It is produced mainly by the testes under the control of LH from the pituitary gland. Kevin's testosterone at 74.2 nmol/L is more than two and a half times the upper limit of 28.7. This level, combined with completely suppressed LH and FSH, is the hallmark pattern of exogenous androgen administration. The pituitary detects the very high circulating testosterone and shuts down its own stimulating hormones because it concludes no further production is needed. This requires immediate GP review.","low_causes":"Aging, obesity, chronic illness, opioid use, sleep deprivation, overtraining, low caloric intake, hypogonadism","high_causes":"Exogenous testosterone or anabolic steroid use, testosterone-secreting tumour (rare), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"3.105","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"1.04","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3520","upper_optimal_position":"0.6667","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone not bound to carrier proteins (SHBG or albumin) and therefore available to enter cells and exert its effects. Kevin's free testosterone at 3.105 nmol/L is approximately three times the upper limit of 1.04. The extremely low SHBG of 6.2 means almost none of his testosterone is being bound, leaving a disproportionate amount in the free, active form. This amplifies the androgenic effects throughout the body.","low_causes":"Low total testosterone, high SHBG, aging, obesity, chronic illness","high_causes":"Exogenous androgen use, very low SHBG, polycystic ovarian syndrome (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"6.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1277","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3822","upper_optimal_position":"0.5804","units":"nmol/l","description":"Sex hormone binding globulin (SHBG) is a protein produced by the liver that binds testosterone and oestradiol, controlling how much of each is free and active. Kevin's SHBG at 6.2 is profoundly suppressed, less than a third of the lower limit of 17.3. SHBG is suppressed by high androgen levels, insulin resistance, and certain medications. In Kevin's case, the supraphysiological testosterone is the most likely driver, as the liver reduces SHBG production in response to the androgenic load.","low_causes":"High androgen levels, insulin resistance, obesity, hypothyroidism, anabolic steroid use","high_causes":"Aging, liver disease, hyperthyroidism, oestrogen excess, low body weight","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1196.77","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index (FAI) is calculated as (total testosterone / SHBG) x 100 and estimates the proportion of testosterone that is biologically active. Kevin's FAI at 1,197 is approximately eight times the upper limit of 150, driven by both the extremely high testosterone and the profoundly suppressed SHBG. This confirms an overwhelmingly androgenic hormonal environment.","low_causes":"Low testosterone, high SHBG","high_causes":"High testosterone, very low SHBG, exogenous androgen use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"334","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4109","units":"pmol/L","description":"Oestradiol is a form of oestrogen. Men produce small amounts from the conversion of testosterone by the enzyme aromatase, which is found in fat tissue, liver, and other organs. Kevin's oestradiol at 334 pmol/L is more than double the male upper limit of 146.1. With testosterone at 74.2, there is a much larger pool of testosterone available for conversion to oestradiol by aromatase, which explains the elevation. Elevated oestradiol in men can cause fluid retention, breast tissue sensitivity or growth (gynaecomastia), mood changes, and may affect cardiovascular risk. This should be discussed with the GP.","low_causes":"Low testosterone (less substrate for conversion), aromatase inhibitor use, very low body fat","high_causes":"High testosterone (increased aromatisation), obesity (more aromatase in fat tissue), liver disease, exogenous androgen use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"4.72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7076","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in supporting testosterone production and modulating the nervous system. Kevin's progesterone at 4.72 is above the male upper limit of 3.88. Elevated progesterone in men can occur alongside exogenous androgen use, as some anabolic agents can be converted to or influence progesterone pathways. This is a secondary finding that fits the broader hormonal picture.","low_causes":"Adrenal insufficiency, low cholesterol","high_causes":"Exogenous progesterone or progestins, adrenal hyperplasia, certain anabolic agents","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"0.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0090","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3397","upper_optimal_position":"0.6090","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and signals the testes to produce testosterone. When testosterone is very high (whether from the testes or from an external source), the pituitary shuts down LH production through negative feedback. Kevin's LH at less than 0.07 is completely suppressed, far below the lower limit of 1.5. This is the expected pituitary response to supraphysiological testosterone and confirms that the testosterone is not being driven by pituitary overstimulation.","low_causes":"Exogenous testosterone or anabolic steroid use (negative feedback), pituitary disease, severe illness, extreme stress","high_causes":"Primary hypogonadism (testes failing, pituitary compensating), post-menopausal (in women)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"0.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0179","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3369","upper_optimal_position":"0.5018","units":"mIU/ml","description":"Follicle stimulating hormone (FSH) is produced by the pituitary and is essential for sperm production in the testes. Like LH, it is suppressed by negative feedback when androgen levels are very high. Kevin's FSH at less than 0.3 is completely suppressed, below the lower limit of 1.4. Complete FSH suppression means sperm production is likely significantly impaired. This has important fertility implications that should be discussed with the GP.","low_causes":"Exogenous testosterone or anabolic steroid use, pituitary disease, severe illness","high_causes":"Primary testicular failure, aging, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"185","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4788","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6515","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production in women but also present in men. Elevated prolactin in men can suppress testosterone and libido and may indicate a pituitary adenoma. SSRIs can raise prolactin levels. Kevin's prolactin at 185 is within the optimal range, which is reassuring.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary adenoma (prolactinoma), SSRIs and other medications, hypothyroidism, stress, chest wall irritation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3437","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"3","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3531","upper_optimal_position":"0.5720","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It naturally declines with age. Kevin's DHEA-S at 2.7 umol/L (approximately 995 ug/dL) is within the laboratory range but just below the optimal floor of 3.0. This is a minor observation and may reflect adrenal adaptation to stress or the hormonal environment.","low_causes":"Aging, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, DHEA supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"367","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4677","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6188","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the early morning and declining through the day. It regulates metabolism, immune function, blood pressure, and the stress response. Kevin's cortisol at 367 is within the optimal range for a morning sample, suggesting adequate adrenal function.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic fatigue","high_causes":"Chronic stress, Cushing's syndrome, corticosteroid medications, depression, sleep deprivation, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igf1","name":"IGF-1","group":"HORMONES","result":"12.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3554","lower_normal":"7.58","upper_normal":"28.63","lower_optimal":"15","upper_optimal":"28.63","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3686","upper_optimal_position":"0.6667","units":"nmol/l","description":"Insulin-like growth factor 1 (IGF-1) is produced mainly by the liver in response to growth hormone. It drives muscle growth, tissue repair, and recovery. It is sensitive to caloric intake and sleep, both of which stimulate growth hormone release. Kevin's IGF-1 at 12.2 is within the age-adjusted laboratory range (7.58 to 28.63 for age 40 to 44) but sits near the bottom. Given his high training volume, this low IGF-1 is likely being suppressed by the combination of caloric restriction (diet volume 5/10) and chronic sleep deprivation (fewer than six hours). These two factors are the most potent suppressors of the growth hormone axis and are likely contributing significantly to his poor recovery.","low_causes":"Caloric restriction, sleep deprivation, liver disease, growth hormone deficiency, chronic illness, malnutrition","high_causes":"Acromegaly (growth hormone excess), obesity (paradoxically), puberty","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3824","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3439","upper_optimal_position":"0.4494","units":"mIU/l","description":"Thyroid stimulating hormone (TSH) is produced by the pituitary gland and tells the thyroid to produce its hormones. A high TSH means the pituitary is pushing the thyroid harder because output is low; a low TSH means there is plenty of thyroid hormone circulating. Kevin's TSH at 1.21 is within the optimal range of 1.0 to 2.5, meaning the pituitary is satisfied with the thyroid hormone level. However, the pituitary can accept a lower-than-ideal thyroid output during caloric restriction or stress without raising TSH, which appears to be happening here given the low FT4 and FT3.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism (primary), subclinical hypothyroidism, recovery from illness, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3363","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3557","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the storage form of thyroid hormone. The thyroid produces it and releases it into the bloodstream, where it is converted into the active form (T3) in tissues. Kevin's FT4 at 12 is within the laboratory range but sits very close to the lower limit of 11.5, only 0.5 above the floor. It is below the optimal range of 14 to 20. This low-normal FT4 with a normal TSH is a pattern seen in low energy availability (caloric restriction) and chronic physiological stress, where the body downregulates thyroid output to conserve energy. It may be contributing to fatigue, sluggish metabolism, and difficulty recovering from training.","low_causes":"Hypothyroidism, low energy availability, caloric restriction, chronic stress, pituitary disease, non-thyroidal illness","high_causes":"Hyperthyroidism, excessive thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4222","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use for energy, metabolism, and heat production. It is produced primarily by converting T4 in the liver, kidneys, and other tissues. Kevin's FT3 at 3.8 is within the laboratory range of 2.6 to 7.1 but below the optimal band of 4.5 to 6.5. Low T3 is one of the body's primary energy-conserving responses to caloric restriction and stress. The body reduces conversion of T4 to T3 to slow metabolism and conserve energy. This is very likely contributing to Kevin's fatigue and could be improved by increasing caloric intake, improving sleep, and reducing physiological stress.","low_causes":"Caloric restriction, low energy availability, chronic stress, non-thyroidal illness, selenium deficiency, liver disease","high_causes":"Hyperthyroidism, T3-dominant thyroiditis, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence is associated with autoimmune thyroid conditions such as Hashimoto's thyroiditis. Kevin's TPO antibodies are below 6.6, within the normal range, ruling out autoimmune thyroid disease as a cause of his low thyroid hormones.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, their presence suggests autoimmune thyroid disease. Kevin's thyroglobulin antibodies are below 1.3, well within range, further confirming that his thyroid function is not being affected by autoimmune attack.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (sometimes)","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"131","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4367","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin in response to sunlight and obtained from a few dietary sources. Kevin's vitamin D at 131 nmol/L is excellent, well above the sufficient threshold of 50 and above the optimal floor of 75. It is slightly above the optimal ceiling of 120 but well within the safe range below 150. This reflects good supplementation practice and is contributing to his healthy calcium and phosphate levels.","low_causes":"Insufficient sun exposure, dark skin, obesity (fat sequesters it), malabsorption, liver or kidney disease, lack of supplementation","high_causes":"Supplementation, excessive sun exposure (rarely), granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"395","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3592","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4561","upper_optimal_position":"0.6163","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is found in animal products (meat, fish, eggs, dairy). Kevin's B12 at 395 is within the laboratory range but below the optimal floor of 500 const data = REPORT_DATA;

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';

  // detail

  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}

document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

dob.addEventListener('input',function(){

  this.value=f;
});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');

  }
}
