<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Craig Lawson","dob":"09/11/1976","report_date":"2026-09-15","summary":"Craig is a 49-year-old male presenting with a BMI of 21.6, following a carnivore diet rated 8 out of 10 for quality with a volume of 5 out of 10. He trains 6 times per week, split evenly between 3 cardio and 3 resistance sessions, with 7,500 to 10,000 daily steps. He takes no medications and reports no alcohol or smoking habits. He reports low energy, fatigue, and poor exercise recovery. His goals are to improve energy levels, improve mood, and boost his immune system. He notes intolerance to gluten and maize.\n\nThere are two findings that should be discussed with Craig's GP. The first is his iron status. His transferrin saturation is 56.6%, above the upper limit of 55%, alongside a ferritin of 302, which while technically within the laboratory range of 22 to 322, is high for a lean 49-year-old man. His serum iron at 31.1 is sitting right at the top of its range of 11.6 to 31.3, and his transferrin, the protein that carries iron in the blood, is 2.19, barely above the lower limit of 2.15. His total iron binding capacity is 51.7, also sitting in the lower portion of its range. Taken together, this pattern shows the blood is carrying a lot of iron relative to the available transport capacity, and the stores are well loaded. On a carnivore diet rich in haem iron, which the body absorbs very efficiently, this picture can develop over time without any underlying genetic cause. However, at a transferrin saturation above 55% with ferritin above 300, the GP should consider testing for hereditary haemochromatosis, a common genetic condition in people of European ancestry where the body absorbs more iron than it needs. The test is a simple blood test for the HFE gene. This matters because excess iron, if left to accumulate, deposits in the liver, heart, and pancreas and can cause damage over years. If the HFE test is negative, the explanation is almost certainly dietary, and reducing red meat intake or donating blood periodically would bring the levels down.\n\nThe second GP finding is his lipid profile. Craig's total cholesterol is 7.1, well above the desirable threshold of 5.18. His LDL cholesterol, the fraction that drives arterial plaque formation, is 5.24 against an upper limit of 3.0. His ApoB, a direct count of the number of atherogenic particles in the blood and widely considered the single best predictor of cardiovascular risk, is 1.25, above the desirable threshold of 0.9 and classified as high. His non-HDL cholesterol, which captures all the harmful fractions together, is 5.5 against a limit of 4.0. His ApoB to ApoA-I ratio, which balances harmful against protective particles, is 0.81, placing him in the average risk band of 0.7 to 0.9 rather than the lower risk band below 0.7. This is a pattern commonly seen on carnivore and ketogenic diets and it presents a genuine paradox, because alongside these elevated harmful markers, Craig's protective markers are excellent. His HDL cholesterol is 1.6, above the desirable threshold of 1.55 and well into the protective range. His ApoA-I, the protein on HDL particles, is 1.55, comfortably above 1.2. His triglycerides are 0.73, excellent by any standard and well below 1.7. His VLDL is 0.33, very low. His triglyceride to HDL ratio is 0.46, which is superb. There is genuinely good news here too. His Lp(a), lipoprotein little a, a genetically inherited and unchangeable particle that independently drives cardiovascular risk, is below 25, which is normal. This is useful information because it means the elevated LDL and ApoB are being driven entirely by modifiable factors, almost certainly his very high intake of animal fat and cholesterol, rather than by an inherited particle he cannot change. Craig should discuss the ApoB level with his GP. At 1.25, this represents a significant particle burden regardless of how good the HDL and triglycerides look. The GP may want to calculate a formal cardiovascular risk score and discuss whether dietary modification alone is sufficient or whether further intervention should be considered.\n\nTurning to what is working well, there is a lot to be positive about. Craig's glucose metabolism is in excellent shape. His fasting glucose is 5.4, his HbA1c, a measure of average blood sugar over three months, is 36 mmol per mol, and his HOMA-IR, a calculation that estimates insulin resistance, is 0.63, well within the insulin-sensitive range below 1.0. His fasting insulin at 2.62 is right at the lower boundary of the laboratory range, reflecting very low insulin demand, exactly what would be expected on a carnivore diet with minimal carbohydrate. His C-Peptide, which the lab measured at 0.624 micrograms per litre or approximately 207 pmol per litre, is below the laboratory range. However, in the context of a perfectly normal glucose, a normal HbA1c, and very low insulin, this simply reflects that the pancreas does not need to produce much insulin because there is very little carbohydrate to process. This is a sign of metabolic efficiency, not pancreatic insufficiency. His HOMA-B, a calculation estimating the pancreas's insulin-producing capacity, comes out low at 27.6, but again, this is driven by the very low insulin demand rather than a failing pancreas. If glucose were creeping up alongside low C-Peptide, the interpretation would be different, but with glucose, HbA1c, and HOMA-IR all looking excellent, this is a reassuring picture.\n\nHis liver is in very good health. ALT at 20 is well within range and below the optimal threshold of 30 for men. AST at 24 is mid-range. Gamma GT at 17 is excellent, below the optimal cutoff of 25, indicating no metabolic strain, no fatty infiltration, and no alcohol-related stress. Albumin at 44 and total protein at 73 are both healthy. His bilirubin at 16 is within range. His FIB-4 score, a calculation that estimates liver fibrosis risk, is 1.73, which is above the standard threshold of 1.45. However, this score is being inflated by the calculation rather than by any sign of liver disease. Craig's platelets at 152, while within range, sit near the lower boundary of 150, and at age 49, the age component of the formula also pushes the number up. With every actual liver marker, ALT, AST, GGT, bilirubin, and albumin, looking healthy, the FIB-4 score does not suggest real fibrosis. It is still worth mentioning to his GP for completeness, but it should not cause concern in the context of these clean liver markers.\n\nHis lipase at 64 is marginally above the upper limit of 60. Lipase is an enzyme produced by the pancreas to digest fats, and on a carnivore diet with a very high fat intake, a mildly elevated lipase is expected because the pancreas is working harder to process dietary fat. His amylase at 84 is well within range, and he reports no abdominal pain, nausea, or digestive symptoms that would suggest pancreatic inflammation. At this margin, this is almost certainly a dietary finding rather than a clinical one.\n\nCraig's kidney function is adequate but worth monitoring. His creatinine-based eGFR is 72, and his Cystatin C-based eGFR, which is a more reliable measure because it is not influenced by muscle mass or diet, is 81. Cystatin C itself is 1.0 against a limit of 1.1. At 49, an eGFR of 81 is acceptable but sits below the optimal threshold of 90. His urea at 8.1 is right at the top of its range of 3.2 to 8.2, which is entirely expected on a high-protein carnivore diet because urea is the end product of protein metabolism. His uric acid at 280 is well within range and within the optimal band. His electrolytes are all healthy, with sodium at 144, chloride at 98, and bicarbonate at 24.9 all sitting comfortably within their ranges. His corrected calcium at 2.47 and magnesium at 1.06 are both within range, with magnesium sitting within the optimal band of 0.85 to 1.05. His parathyroid hormone at 1.082 is within range, confirming normal calcium regulation.\n\nHis inflammation markers are reassuring. His hs-CRP, a sensitive marker of systemic inflammation, is 0.8, below the optimal threshold of 1.0, which at any BMI is a good result but at BMI 21.6 with 6 training sessions per week confirms that his body is not in a state of chronic inflammation. His ESR is below 2, effectively undetectable, which is excellent.\n\nHis thyroid is functioning well. TSH at 1.56 sits within the optimal range of 1.0 to 2.5. Free T3 at 5.0 is within the optimal band of 4.5 to 6.5, and Free T4 at 13.7 is within the laboratory range but sits below the optimal threshold of 14. This is not a concern in the presence of a normal TSH and a healthy Free T3, as it simply reflects where his thyroid naturally sits. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease.\n\nHis testosterone at 22.3 is healthy and within the optimal range of 18 to 30. His free testosterone, the portion available for the body to actually use, is 0.411, well within range. His SHBG, sex hormone binding globulin, the protein that binds testosterone and makes it unavailable, is 42.8, within the optimal band of 25 to 55. His free androgen index at 52.1 is healthy. LH, FSH, oestradiol, prolactin, progesterone, and DHEA-S are all within their respective ranges. This is an excellent hormonal profile for a 49-year-old man and should be supporting energy, recovery, and mood rather than hindering them.\n\nHis immune system markers are all within range. IgG, IgM, IgA, and IgE are all normal, and his rheumatoid factor is well within range. His tissue transglutaminase IgA, the screening test for coeliac disease, is negative, which is useful information given his reported gluten intolerance. A negative result means there is no active coeliac-pattern immune response, though it is important to note that this test is only reliable if the person has been eating gluten regularly, and on a carnivore diet Craig will not have been. His intolerance may be real and clinically significant without meeting the threshold for coeliac disease, or the test may simply not have had the dietary exposure needed to trigger a positive result.\n\nHis creatine kinase at 204 is within range and appropriate for someone training 6 days per week. His cortisol at 435 is within the morning reference range, sitting in a healthy mid-range position. His total antioxidant activity at 1.71 is within range. His prostate markers are excellent, with PSA at 0.6, well below 2.5, and a free PSA ratio of 0.5, which is very reassuring. His tumour markers CA 19-9 and CEA are both within normal limits. His urinalysis is clean, with no protein, glucose, blood, white cells, or nitrites detected.\n\nHis full blood count is largely healthy. Haemoglobin at 153, red cells at 4.92, haematocrit at 0.435, MCV at 88.4, and MCH at 31 are all within range. His white cell count at 4.4 is within range, with a healthy differential across neutrophils, lymphocytes, monocytes, eosinophils, and basophils. His neutrophil to lymphocyte ratio calculates to 2.02, within the normal range of 1 to 3. His platelets at 152 are within range but sit right at the lower boundary. His MCHC at 351 is marginally above the upper limit of 345. At this margin, and noting the lab's own caveat that MCHC can be affected by temperature and storage, this is most likely a laboratory artefact rather than a clinical finding. His reticulocyte percentage at 0.66% is within range, but his absolute reticulocyte count at 32.5 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count suggests the bone marrow is producing red cells at a slower rate than expected. Given that his haemoglobin is healthy at 153, the body may simply not be signalling for many new red cells because it has enough. However, combined with a diet volume of only 5 out of 10 and his reported fatigue and poor recovery, this could also reflect insufficient caloric intake limiting bone marrow output. This is worth watching on a retest.\n\nComing back to Craig's symptoms of low energy, fatigue, and poor exercise recovery, the blood results largely rule out the common culprits. His thyroid is working well, his testosterone is healthy, his iron stores are full, his blood sugar is excellent, and his inflammation is low. Two findings could be contributing. His folate at 4 is within the laboratory range of 3 to 17 but sits well below the optimal threshold of 8. Folate, also known as vitamin B9, is essential for energy production, red blood cell formation, and DNA repair. On a carnivore diet that excludes plant foods, folate intake is almost entirely dependent on liver and eggs, and if Craig is not eating those regularly, his levels will drift down. A folate of 4 is low enough to contribute to fatigue and impaired recovery. His B12 at 397 is within the laboratory range but below the optimal threshold of 500. On a carnivore diet rich in animal products, B12 would usually be expected to be higher, and the combination of below-optimal B12 and below-optimal folate suggests that the overall micronutrient density of the diet, despite being rated 8 out of 10 for quality, may not be matching Craig's needs at a volume of 5 out of 10. His vitamin D at 104 is within the optimal range of 75 to 120, which is a genuine positive. The other factor worth considering is total caloric intake. At 70kg, 180cm, and training 6 days per week with a diet volume of only 5 out of 10, Craig may simply not be eating enough to fuel his activity. A low reticulocyte count, borderline low folate, and below-optimal B12 are all consistent with a body that is receiving good quality nutrition but not quite enough of it to support the training load and recovery demands he is placing on it.","links":"Craig's results point to several clear action steps, and the most impactful ones relate to his diet volume, his folate status, and the conversations he needs to have with his GP.\n\nStarting with energy intake, Craig weighs 70kg at 180cm with a BMI of 21.6 and trains 6 days per week. Using a moderate to high activity multiplier, his estimated maintenance calorie requirement is approximately 2,450 to 2,700 calories per day. With a diet volume of 5 out of 10, there is a reasonable chance he is falling short of this, and on a carnivore diet where meals can be very satiating due to high protein and fat content, under-eating is surprisingly common. Craig should aim for a minimum of 2,400 calories per day, ideally tracking for a week or two to establish his current baseline. Protein intake should be at least 1.6 grams per kilogram of body weight, which for Craig means a minimum of 112 grams per day, and ideally up to 2 grams per kilogram or 140 grams per day given his training frequency. On a carnivore diet, protein is rarely the issue, but total calories may be.\n\nFor folate, which at 4 ng per ml is technically within the laboratory range but well below the optimal threshold of 8, the best dietary approach on a carnivore framework is to increase intake of liver, which is the richest animal source of folate. Even 100 to 150 grams of beef or chicken liver per week would make a significant difference. Eggs are another good source. If Craig finds it difficult to eat liver regularly, a methylfolate supplement at 400 to 800 micrograms daily would be appropriate. This is particularly important because folate works in tandem with B12 for red blood cell production and energy metabolism, and both are currently below optimal.\n\nFor the iron findings, Craig should ask his GP to order an HFE gene test to screen for hereditary haemochromatosis. He should bring the following numbers to the appointment: transferrin saturation 56.6% (above 55%), ferritin 302 ng per ml, transferrin 2.19 g per L (near the lower limit of 2.15), and serum iron 31.1 (at the top of range). If the HFE test is negative, the explanation is dietary, and Craig could consider reducing his red meat intake modestly in favour of poultry, fish, and eggs, or donating blood once or twice a year to naturally reduce iron stores. He should not take any iron supplements.\n\nFor the lipid profile, Craig should discuss his ApoB of 1.25 with his GP. The specific numbers to bring are: total cholesterol 7.1, LDL 5.24, ApoB 1.25, non-HDL cholesterol 5.5, alongside the positives of HDL 1.6, triglycerides 0.73, and a normal Lp(a) below 25. The normal Lp(a) is important context because it confirms the elevated LDL is driven by modifiable factors. On a carnivore diet, the primary driver of elevated LDL and ApoB is high saturated fat intake. Craig could trial introducing oily fish two to three times per week, which provides omega-3 fatty acids that benefit the lipid profile while remaining within an animal-based framework. If he is willing to expand his diet slightly, soluble fibre from sources compatible with his intolerances, such as oats if tolerated, or psyllium husk, can reduce LDL by 5 to 10%. The GP may wish to calculate a QRISK3 score to formally assess 10-year cardiovascular risk and discuss whether the lipid levels warrant further intervention.\n\nFor the kidney function finding, with a Cystatin C eGFR of 81, Craig should ensure adequate hydration, particularly around training, and the GP should note this as a baseline for future monitoring. A high-protein diet does increase the kidneys' filtration workload, and while an eGFR of 81 is not in the concerning range, it would be worth repeating Cystatin C on his next blood test to ensure it remains stable.\n\nFor sleep and recovery, which directly affect energy levels and exercise recovery, Craig should ensure he has a fixed wake time, gets outside within an hour of waking for natural light exposure, cuts caffeine by early afternoon, and keeps his bedroom cool. Sleep is when growth hormone peaks, when muscle repair occurs, and when the immune system does its maintenance work. If Craig is training 6 days per week and not sleeping 7 to 8 hours, the training may be doing more harm than good.\n\nCraig should retest in 4 to 6 months, specifically repeating: a full iron panel including transferrin saturation and ferritin, a lipid panel including ApoB, folate, B12, Cystatin C eGFR, a full blood count including reticulocytes, and C-Peptide if the GP has any concerns about the low reading.","flags":"GP ITEMS:\n\n1. Transferrin saturation 56.6% (above 55%), ferritin 302 ng/ml (upper quarter of range), transferrin 2.19 g/L (just above lower limit of 2.15), serum iron 31.1 umol/L (at top of range 11.6-31.3), TIBC 51.7 (lower portion of range). Pattern is consistent with iron loading. Recommend HFE gene testing to exclude hereditary haemochromatosis. Patient follows a carnivore diet high in haem iron, which is an alternative explanation if HFE is negative.\n\n2. ApoB 1.25 g/L (above 0.9 desirable, classified high), LDL 5.24 mmol/L (above 3.0), total cholesterol 7.1 mmol/L, non-HDL 5.5 (above 4.0), ApoB/A-I ratio 0.81 (average risk band). Lp(a) below 25 nmol/L (normal), confirming modifiable aetiology. HDL 1.6, triglycerides 0.73, ApoA-I 1.55 are all favourable. Likely diet-driven on carnivore diet. Recommend formal cardiovascular risk assessment.\n\n3. FIB-4 1.73 (above 1.45 threshold). Driven by age component and borderline-low platelets (152). All direct liver markers are normal: ALT 20, AST 24, GGT 17, bilirubin 16, albumin 44. Low clinical suspicion for fibrosis but noted for GP awareness.\n\nOTHER FLAGS:\n\n4. C-Peptide 0.624 ug/L (207 pmol/L), below range of 1.1-4.4 ug/L. In context of normal glucose (5.4), normal HbA1c (36), and very low insulin (2.62), this reflects low insulin demand on a very low carbohydrate diet rather than pancreatic insufficiency. No action required unless glucose rises on future testing.\n\n5. Absolute reticulocytes 32.5 x10^9/L (below 50). Haemoglobin is normal at 153. May reflect adequate red cell mass suppressing erythropoietin drive, or could indicate suboptimal bone marrow stimulation related to low energy availability. Monitor on retest.\n\n6. MCHC 351 g/L (above 345). Marginal elevation, likely laboratory artefact related to sample temperature and storage as noted by the lab. No clinical concern.\n\n7. Lipase 64 U/L (above 60). Marginal elevation. Amylase 84 is normal. No symptoms of pancreatitis. High dietary fat intake on carnivore diet is the likely explanation.\n\n8. Folate 4 ng/ml. Within laboratory range (3-17) but well below optimal (above 8). Likely dietary insufficiency on carnivore diet. Contributing factor for fatigue and low reticulocyte production.\n\n9. FT4 13.7 pmol/L. Within laboratory range (11.5-22.7) but below optimal (14-20). TSH 1.56 and FT3 5.0 are both within optimal ranges. No thyroid dysfunction but noted for baseline.\n\nREASSURING NEGATIVES: Normal Lp(a) excludes inherited lipoprotein-driven risk. Negative thyroid antibodies exclude autoimmune thyroid disease. Negative coeliac screen (though limited value on gluten-free diet). PSA 0.6 with free ratio 0.5 is excellent. hs-CRP 0.8 and ESR below 2 exclude significant systemic inflammation. Normal glucose, HbA1c, and HOMA-IR exclude insulin resistance and diabetes. Normal testosterone, free testosterone, and full hormonal profile exclude hormonal causes of fatigue. Normal immunoglobulins. Clean urinalysis. Normal tumour markers.","recommendations":"1. Discuss iron status with GP and request HFE gene testing for hereditary haemochromatosis. Bring transferrin saturation of 56.6%, ferritin 302, and transferrin 2.19 to the appointment. Do not take any iron supplements.\n\n2. Discuss ApoB of 1.25 and LDL of 5.24 with GP for formal cardiovascular risk assessment. Bring the full lipid panel and the normal Lp(a) result, which confirms the elevation is modifiable.\n\n3. Increase total caloric intake to at least 2,400 calories per day with a protein target of 112 to 140 grams per day. Track intake for one to two weeks to establish whether current eating matches these targets.\n\n4. Increase folate intake by eating 100 to 150 grams of beef or chicken liver per week, or supplement with 400 to 800 micrograms of methylfolate daily.\n\n5. Consider adding sublingual methylcobalamin at 1,000 micrograms daily to bring B12 from 397 closer to the optimal range above 500.\n\n6. Introduce oily fish such as salmon, mackerel, or sardines two to three times per week for omega-3 fatty acids, which benefit cardiovascular markers and may help modestly reduce LDL and ApoB.\n\n7. Ensure 7 to 8 hours of sleep per night with a fixed wake time, natural light exposure within one hour of waking, and a cool bedroom. This is critical for training recovery.\n\n8. Consider donating blood once or twice per year if HFE gene test is negative but iron markers remain elevated on retest.\n\n9. Retest in 4 to 6 months: full iron panel, lipid panel including ApoB, folate, B12, Cystatin C eGFR, full blood count with reticulocytes.","supplementation":"Based on Craig's results, the following supplements are recommended:\n\nMethylfolate (5-MTHF), 400 to 800 micrograms daily, taken with food. Craig's folate is 4 ng per ml, well below the optimal level of 8 or above. On a carnivore diet without plant sources of folate, supplementation is the most reliable way to correct this. Methylfolate is the active form and does not require conversion by the body. This supports red blood cell production, DNA repair, and energy metabolism, and may help address the low absolute reticulocyte count.\n\nSublingual methylcobalamin (vitamin B12), 1,000 micrograms daily, dissolved under the tongue. Craig's B12 at 397 is within the laboratory range but below the optimal threshold of 500. Sublingual delivery bypasses the digestive system and ensures reliable absorption. B12 works in partnership with folate, and correcting both together is more effective than addressing either alone.\n\nOmega-3 fish oil, providing 2 to 3 grams of combined EPA and DHA daily, taken with his largest meal. With an ApoB of 1.25 and LDL of 5.24, omega-3 supplementation provides anti-inflammatory and lipid-modifying benefits. It supports a modest reduction in triglycerides, which are already excellent, but more importantly provides cardiovascular protection through anti-inflammatory pathways and improved endothelial function. If Craig introduces oily fish regularly as recommended, the supplement dose can be reduced to 1 to 2 grams daily.\n\nVitamin D3 (cholecalciferol), 2,000 IU daily, taken with a fat-containing meal. Craig's vitamin D at 104 is within the optimal range of 75 to 120. This is a maintenance dose to preserve this level through the winter months and year-round.\n\nVitamin K2 (MK-7), 100 micrograms daily, taken alongside vitamin D. K2 directs calcium into bones and teeth and away from soft tissues and arteries. It should always accompany vitamin D supplementation.\n\nMagnesium glycinate, 300 mg before bed. Craig's magnesium at 1.06 is within range and just at the top of the optimal band, but given his training volume of 6 sessions per week and his reported poor recovery, supplemental magnesium supports muscle relaxation, sleep quality, and recovery. The glycinate form is well absorbed and less likely to cause digestive discomfort.\n\nDO NOT take iron supplements. Craig's ferritin is 302, his transferrin saturation is 56.6%, and his iron stores are already elevated. Additional iron supplementation could contribute to harmful iron accumulation.\n\nThe most important changes from this report are not supplements. They are eating enough total calories to fuel 6 training sessions per week, discussing the iron and lipid findings with his GP, and ensuring adequate sleep and recovery.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5867","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5867","units":"mmol/l","description":"Blood glucose measures the concentration of sugar in the blood at the time of the test. After an overnight fast, a healthy reading falls between 3.5 and 6.0 mmol/L, with the optimal range being 4.0 to 5.4. Craig's fasting glucose of 5.4 sits right at the upper edge of the optimal band. On a carnivore diet with minimal carbohydrate, glucose is maintained through gluconeogenesis, where the liver produces glucose from protein and fat. This level confirms excellent blood sugar regulation with no suggestion of insulin resistance or pre-diabetes.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress response, high carbohydrate intake, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c, or glycated haemoglobin, reflects average blood sugar levels over the previous two to three months by measuring how much glucose has attached to red blood cells. A reading below 6.0% is considered normal, with pre-diabetes defined as 6.0 to 6.4% and diabetes above 6.5%. Craig's result of 5.4% confirms excellent long-term blood sugar control, consistent with his carnivore diet and low insulin demand.","low_causes":"Low carbohydrate intake, increased red blood cell turnover","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Below 42 mmol/mol is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Craig's result of 36 sits well within the normal range and at the optimal threshold, confirming stable and healthy blood sugar management over the past two to three months.","low_causes":"Low carbohydrate intake, increased red blood cell turnover","high_causes":"Insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3342","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3060","upper_optimal_position":"0.5751","units":"mIU/L","description":"Insulin is the hormone produced by the pancreas that allows cells to take up glucose from the blood. Fasting insulin levels indicate how much insulin the body needs to produce to keep blood sugar under control. Lower levels indicate better insulin sensitivity. Craig's insulin at 2.62 sits right at the lower boundary of the laboratory range, reflecting very low insulin demand. On a carnivore diet with minimal carbohydrate, the pancreas simply does not need to produce much insulin, and this is a healthy, efficient metabolic state.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"207","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1321","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1456","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It provides a reliable measure of how much insulin the pancreas is actually producing because, unlike insulin itself, C-Peptide is not cleared by the liver. Craig's result converts to approximately 207 pmol/L, which falls below the laboratory range. However, in the context of a normal fasting glucose of 5.4, a normal HbA1c of 36, and a very low insulin of 2.62, this reflects minimal insulin production because minimal insulin is needed. This is a feature of metabolic efficiency on a very low carbohydrate diet, not a sign of pancreatic failure.","low_causes":"Very low carbohydrate diet, low insulin demand, type 1 diabetes, advanced type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2100","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"","description":"HOMA-IR, or Homeostatic Model Assessment for Insulin Resistance, is a calculation that uses fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 indicates good insulin sensitivity, above 1.9 suggests early insulin resistance, and above 2.9 indicates significant insulin resistance. Craig's HOMA-IR of 0.63 confirms excellent insulin sensitivity, meaning his cells respond very efficiently to the small amount of insulin his pancreas produces.","low_causes":"Very low carbohydrate diet, high insulin sensitivity, lean body composition","high_causes":"Insulin resistance, metabolic syndrome, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"27.6","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1033","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, the cells responsible for producing insulin. It is calculated from fasting insulin and glucose. Craig's HOMA-B is 27.6, well below the standard range of 80 to 200. However, this calculation assumes a typical mixed diet. On a carnivore diet with minimal carbohydrate, the pancreas is deliberately producing very little insulin because very little is needed, so the formula interprets this low output as reduced capacity when it is actually reduced demand. With glucose and HbA1c both normal, the pancreas is meeting its requirements comfortably.","low_causes":"Very low carbohydrate diet, low insulin demand, beta cell dysfunction in advanced diabetes","high_causes":"Insulin resistance with compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, making it a sensitive marker of liver health. Craig's ALT at 20 is well within the laboratory range and below the optimal threshold of 30 for men, indicating the liver is in excellent health with no signs of strain, inflammation, or fatty infiltration.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver disease, alcohol excess, viral hepatitis, medication effects, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3646","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. It is less liver-specific than ALT because it also rises after intense exercise or muscle damage. Craig's AST at 24 is well within range, and interpreted alongside his clean ALT and GGT, confirms a healthy liver.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver damage, heart attack, muscle injury, intense exercise, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1164","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"Gamma GT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol consumption, bile duct obstruction, and fatty liver disease. It is often the first liver marker to rise when the liver is under metabolic stress. Craig's GGT at 17 is excellent, well below the optimal threshold of 25, and indicates the liver is functioning cleanly with no evidence of metabolic strain.","low_causes":"Generally not clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, certain medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3381","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase is an enzyme found in the liver, bones, kidneys, and digestive system. It can be elevated in liver disease or bone disorders but is also influenced by normal bone turnover. Craig's ALP at 47 is within the laboratory range, sitting just above the lower limit of 46. This is a normal finding and does not suggest liver or bone pathology.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disorders, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5521","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes bilirubin and excretes it in bile. Elevated levels can indicate liver disease, bile duct obstruction, or increased red blood cell breakdown, while mildly elevated levels in the presence of normal liver enzymes often indicate Gilbert's syndrome, a harmless inherited trait. Craig's bilirubin at 16 is within range and does not suggest any liver pathology.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4533","upper_optimal_position":"0.6067","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. It reflects the liver's synthetic capacity, nutritional status, and immune function. Craig's total protein at 73 is within the optimal range, indicating good nutritional status and normal protein production by the liver.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Chronic inflammation, chronic infection, dehydration, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5208","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and minerals around the body and maintains fluid balance. It is also one of the most reliable markers of overall nutritional status and liver function. Craig's albumin at 44 is within the optimal range, confirming good liver synthetic function and adequate protein nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin encompasses a family of proteins that includes antibodies (immunoglobulins) and transport proteins. It is calculated by subtracting albumin from total protein. Craig's globulin at 29 is within the optimal range, indicating a healthy balance of immune and transport proteins.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, liver disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"","description":"The albumin to globulin ratio compares the two main protein fractions in the blood. A healthy ratio confirms that the liver is producing albumin adequately and that globulin levels are not being pushed up by chronic inflammation or immune activation. Craig's ratio of 1.52 is within the optimal range.","low_causes":"Liver disease, chronic inflammation, autoimmune disease, overproduction of globulin","high_causes":"Immunodeficiency, underproduction of globulin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5966","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that estimates the likelihood of liver fibrosis, or scarring, using age, platelet count, ALT, and AST. A score below 1.45 is reassuring, while scores above this threshold warrant further assessment. Craig's FIB-4 at 1.73 is above the standard threshold. However, this score is being driven by the mathematical formula rather than by real liver disease. His age of 49 pushes the numerator up, his borderline-low platelets of 152 make the denominator smaller, and a relatively low ALT of 20 further reduces the denominator. All of his actual liver markers, ALT, AST, GGT, bilirubin, and albumin, are healthy. The lab itself notes that a score below 2.0 can be insignificant in the absence of other clinical indicators.","low_causes":"Young age, high platelet count, high ALT","high_causes":"Liver fibrosis, older age, low platelet count, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4924","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"118","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starches. It is used as a marker of pancreatic health. Craig's amylase at 84 is well within range, indicating normal pancreatic function. On a carnivore diet with minimal starch intake, amylase demand is low and a mid-range result is expected.","low_causes":"Chronic pancreatitis with loss of function, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7234","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"U/L","description":"Lipase is a pancreatic enzyme that digests dietary fat. Elevated levels can indicate pancreatic inflammation, but mild elevations are commonly seen in people consuming a very high-fat diet because the pancreas is working harder to produce adequate lipase for fat digestion. Craig's lipase at 64 is marginally above the upper limit of 60. With a normal amylase and no symptoms of pancreatitis such as abdominal pain, nausea, or vomiting, this is almost certainly a reflection of his high-fat carnivore diet rather than pancreatic pathology.","low_causes":"Generally not clinically significant","high_causes":"Acute pancreatitis, chronic pancreatitis, high-fat diet, gallstones, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6854","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol fractions in the blood, including LDL, HDL, and VLDL. While a number below 5.18 is considered desirable, total cholesterol alone is a blunt tool because it does not distinguish between harmful and protective cholesterol. Craig's total cholesterol of 7.1 is elevated, driven primarily by his very high LDL of 5.24. However, his HDL of 1.6 and triglycerides of 0.73 are both excellent, meaning the composition of his cholesterol matters as much as the total. The ApoB level provides the most clinically useful assessment of risk.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and sugar intake and the liver's fat processing. Low levels are associated with good metabolic health and insulin sensitivity. Craig's triglycerides at 0.73 are excellent, well below the 1.7 threshold and within the optimal range below 1.0. This is a consistent feature of well-formulated low-carbohydrate diets and confirms that his liver is processing fat efficiently.","low_causes":"Very low carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High sugar and refined carbohydrate intake, alcohol excess, insulin resistance, obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2132","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein cholesterol, carries triglycerides from the liver to tissues. Elevated VLDL is associated with insulin resistance and metabolic syndrome. Craig's VLDL at 0.33 is well within the optimal range, consistent with his excellent triglycerides and insulin sensitivity.","low_causes":"Very low carbohydrate diet, good insulin sensitivity","high_causes":"Insulin resistance, high carbohydrate diet, alcohol excess, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"1.04","upper_normal":"3.12","lower_optimal":"1.4","upper_optimal":"3.12","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, or high-density lipoprotein, is often called 'good' cholesterol because it removes excess cholesterol from the arteries and transports it back to the liver for disposal. Higher levels are protective against cardiovascular disease. Craig's HDL at 1.6 is above the desirable threshold of 1.55 and within the optimal range above 1.4 for men. This is a strong protective marker and is one of the clear metabolic benefits of his current dietary pattern.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, high-fat diets","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8733","lower_normal":"0","upper_normal":"3.0","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL, or low-density lipoprotein, is the primary carrier of cholesterol in the blood and is the fraction most strongly associated with atherosclerosis, the build-up of plaque in artery walls. An ideal level is below 3.0 mmol/L, with below 2.6 considered optimal. Craig's LDL at 5.24 is significantly elevated, nearly double the upper desirable limit. On a carnivore diet high in saturated fat and dietary cholesterol, elevated LDL is a common finding. While some argue that LDL particle size matters, and Craig's excellent triglycerides suggest his particles are likely the larger, less dense type, the ApoB count provides the most definitive measure of particle-driven risk, and at 1.25 that is clearly elevated.","low_causes":"Very low-fat diet, hyperthyroidism, malabsorption, liver disease","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4933","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio provides a quick estimate of cardiovascular risk by balancing total cholesterol against the protective HDL fraction. A ratio below 4.5 is considered acceptable, though below 3.5 is optimal. Craig's ratio of 4.44 sits just within the acceptable range, kept from being worse by his strong HDL of 1.6 offsetting the very high total cholesterol of 7.1.","low_causes":"High HDL, low total cholesterol","high_causes":"High total cholesterol, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"22.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5635","lower_normal":"20.0","upper_normal":"80","lower_optimal":"20.0","upper_optimal":"80","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol indicates what proportion of the total cholesterol is the protective HDL fraction. Above 20% is desirable. Craig's HDL percentage of 22.54% is above the desirable threshold, meaning more than one-fifth of his total cholesterol is the protective type.","low_causes":"Low HDL relative to total cholesterol, metabolic syndrome","high_causes":"High HDL, low total cholesterol, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions, including LDL, VLDL, and remnant cholesterol, in a single number. A level below 4.0 is desirable. Craig's non-HDL at 5.5 is above this threshold, reflecting his elevated LDL. This marker, along with ApoB, provides a better assessment of cardiovascular risk than total cholesterol alone.","low_causes":"Low LDL, low-fat diet, hyperthyroidism","high_causes":"High saturated fat diet, familial hypercholesterolaemia, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"1.2","upper_normal":"3.0","lower_optimal":"1.4","upper_optimal":"3.0","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5556","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Higher levels indicate more HDL particles in the blood and greater cardiovascular protection. Craig's ApoA-I at 1.55 is above the desirable threshold of 1.20 and within the optimal range above 1.4, confirming a healthy number of protective HDL particles.","low_causes":"Genetic factors, smoking, sedentary lifestyle, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this marker provides a direct count of the number of particles in the blood that can penetrate artery walls and contribute to plaque formation. It is widely considered the single best blood marker for predicting cardiovascular risk. A level below 0.9 is desirable, and below 0.8 is optimal. Craig's ApoB at 1.25 is classified as high, meaning there is a significant number of atherogenic particles in his blood. This is the most clinically relevant lipid finding in his panel and should be discussed with his GP.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption, statin therapy","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5786","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA-I ratio compares the number of atherogenic (harmful) particles to protective HDL particles. It is one of the best single summary measures of cardiovascular risk from blood lipids. A ratio below 0.7 indicates lower risk, 0.7 to 0.9 is average risk, and above 0.9 is higher risk. Craig's ratio of 0.81 places him in the average risk band. While the elevated ApoB pushes this ratio up, his strong ApoA-I of 1.55 provides meaningful counterbalance.","low_causes":"Low ApoB, high ApoA-I, low-fat diet, statin use","high_causes":"High ApoB, low ApoA-I, high saturated fat diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5"
