,"units":"nmol/l","description":"Lipoprotein(a), often written Lp(a), is a genetically determined lipoprotein that independently increases cardiovascular risk through three mechanisms: it deposits cholesterol into artery walls like LDL, it promotes blood clotting, and it drives inflammation. Unlike other cholesterol markers, Lp(a) is almost entirely determined by genetics and cannot be meaningfully changed through diet, exercise, or most medications. It only needs to be tested once in a lifetime because the level is essentially fixed. Craig's Lp(a) is below 25, which is normal and falls within the low-risk category. This is genuinely useful information because it confirms that his elevated LDL and ApoB are driven entirely by modifiable factors, most likely his high saturated fat intake on a carnivore diet, rather than by an inherited particle he cannot change. This result should be recorded permanently in his medical notes.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited), not modifiable by diet or lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1533","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a powerful marker of metabolic health and insulin sensitivity. A lower ratio indicates better metabolic function, with below 0.87 considered optimal and below 1.5 within the normal range. Craig's ratio of 0.46 is excellent, reflecting the combination of very low triglycerides and high HDL. This is one of the strongest metabolic indicators in his panel and is a genuine benefit of his dietary pattern.","low_causes":"Excellent insulin sensitivity, low carbohydrate diet, regular exercise","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1625","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It captures the cholesterol carried in triglyceride-rich remnant particles, which are independently associated with cardiovascular risk and inflammation. A level below 0.5 is optimal. Craig's remnant cholesterol at 0.26 is well within the optimal range, indicating very little triglyceride-rich particle burden.","low_causes":"Good metabolic health, low carbohydrate diet, insulin sensitivity","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.08","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein is produced by the liver in response to inflammation anywhere in the body. It is one of the most sensitive markers of systemic inflammation and is also used as an independent predictor of cardiovascular risk. A level below 1.0 mg/L is considered optimal and indicates low cardiovascular risk from inflammation. Craig's hs-CRP at 0.8 is within the optimal range, confirming that despite his elevated lipid markers, his body is not in a state of chronic inflammation. This is a reassuring finding.","low_causes":"Low systemic inflammation, healthy body composition, anti-inflammatory diet","high_causes":"Acute infection, chronic inflammation, obesity, autoimmune disease, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"Erythrocyte sedimentation rate measures how quickly red blood cells settle in a tube over one hour. A faster rate indicates more inflammation. Craig's ESR is below 2, effectively undetectable, which is an excellent result confirming no significant inflammatory process in the body. Combined with the low hs-CRP, this paints a very clean inflammatory picture.","low_causes":"Low inflammation, polycythaemia","high_causes":"Infection, autoimmune disease, chronic inflammation, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"144","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5179","units":"mmol/l","description":"Sodium is the primary electrolyte in the blood and is essential for fluid balance, nerve function, and muscle contraction. It is tightly regulated by the kidneys. Craig's sodium at 144 is well within range and within the optimal band, indicating healthy fluid balance and kidney regulation.","low_causes":"Excess fluid intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess sodium intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3590","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5179","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance, blood pressure, and acid-base balance. It is regulated by the kidneys. Craig's chloride at 98 is within range and at the lower edge of the optimal band.","low_causes":"Vomiting, diuretics, metabolic alkalosis, adrenal insufficiency","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4818","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a key buffer in the blood that helps maintain the body's acid-base balance. The kidneys regulate bicarbonate levels, making this marker relevant to both kidney function and metabolic health. Craig's bicarbonate at 24.9 is within the optimal range, confirming healthy acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5439","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.5877","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. Blood calcium is tightly regulated by parathyroid hormone and vitamin D. Craig's calcium at 2.52 is within the optimal range, indicating healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate picture of the physiologically active calcium. This correction is important because calcium binds to albumin, so if albumin is high or low, the total calcium can be misleading. Craig's corrected calcium at 2.47 is within the optimal range, confirming healthy calcium levels.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6379","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4828","upper_optimal_position":"0.6207","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, bone health, and blood sugar regulation. It is particularly important for training recovery and sleep quality. Craig's magnesium at 1.06 is within the laboratory range and just above the upper end of the optimal band. Blood magnesium represents only about 1% of total body magnesium, so a healthy blood level is reassuring but does not exclude intracellular depletion, especially with regular intense training.","low_causes":"Poor dietary intake, excessive sweating, alcohol, certain medications, diabetes","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"280","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3741","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5773","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in high concentrations in red meat, organ meats, and seafood. Elevated levels can lead to gout and are associated with kidney stones and cardiovascular risk. On a carnivore diet, uric acid levels are worth monitoring because purine intake is high. Craig's uric acid at 280 is well within the optimal range, indicating that his kidneys are clearing uric acid efficiently despite his high-purine diet.","low_causes":"Low purine diet, kidney over-excretion, certain medications","high_causes":"High purine diet, kidney impairment, gout, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"8.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6400","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3393","upper_optimal_position":"0.5800","units":"mmol/l","description":"Urea is a waste product produced by the liver when it processes protein. The kidneys filter urea out of the blood, so elevated levels can indicate either high protein intake or reduced kidney function. Craig's urea at 8.1 is within the laboratory range but near the upper limit of 8.2 and above the optimal upper threshold of 7.0. On a carnivore diet with a high protein intake, an elevated urea is expected because the liver is processing more protein-derived nitrogen. This is a dietary finding rather than a kidney concern, particularly as his other kidney markers are adequate.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney impairment, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"104","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5897","units":"umol/l","description":"Creatinine is a waste product from muscle metabolism that is filtered by the kidneys. It is used to estimate kidney function. Craig's creatinine at 104 sits right at the upper limit of the laboratory range. On a carnivore diet rich in creatine from meat, creatinine levels are often higher than they would be on a mixed diet because dietary creatine is converted to creatinine. This is why the Cystatin C-based eGFR, which is unaffected by diet or muscle mass, provides a more reliable picture of Craig's true kidney function.","low_causes":"Low muscle mass, low protein diet","high_causes":"High protein/meat diet, high muscle mass, kidney impairment, dehydration, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate calculated from creatinine estimates how well the kidneys are filtering blood. Above 60 is considered normal, and above 90 is optimal. Craig's creatinine-based eGFR of 72 is within the normal range but below optimal. However, this calculation is inflated by his high creatinine, which is likely diet-driven on a carnivore diet. The Cystatin C-based eGFR of 81 provides a more accurate picture and should be used as the reference point.","low_causes":"Kidney disease, dehydration, medication effects","high_causes":"Pregnancy, high cardiac output states","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6750","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR is calculated from Cystatin C, a small protein produced by all nucleated cells at a constant rate. Unlike creatinine, it is not affected by muscle mass, diet, or meat consumption, making it a more reliable marker of kidney function for someone on a carnivore diet. Craig's Cystatin C eGFR of 81 is within the normal range above 60 but below the optimal threshold of 90. At 49, this is acceptable but worth monitoring over time to ensure stability. Adequate hydration, particularly around training sessions, supports kidney function.","low_causes":"Kidney disease, dehydration","high_causes":"Excellent kidney function","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4545","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein filtered by the kidneys at a constant rate. Higher levels indicate reduced kidney filtration. Craig's Cystatin C at 1.0 is within the laboratory range of below 1.1 but above the optimal threshold of 0.9. This is consistent with the Cystatin C eGFR of 81 and confirms that kidney function is adequate but not at peak performance.","low_causes":"Excellent kidney filtration","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"153","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to the tissues and returns carbon dioxide for exhalation. It is the single most important marker for detecting anaemia. Craig's haemoglobin at 153 is well within the male range of 130 to 170 and within the optimal band, confirming adequate oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic lung disease, high altitude, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.5","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures the total number of red cells per litre of blood. Red cells are responsible for carrying oxygen throughout the body. Craig's RBC at 4.92 is within the optimal range, indicating healthy red cell production.","low_causes":"Anaemia, B12 or folate deficiency, chronic disease, bone marrow suppression","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.435","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Craig's haematocrit at 0.435 is within the optimal range, indicating a healthy balance of red cells and plasma.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"13.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5143","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"%","description":"Red cell distribution width measures the variation in size of red blood cells. A wider distribution can indicate iron deficiency, B12 or folate deficiency, or mixed anaemias. Craig's RDW at 13.4% is within the optimal range, indicating uniform red cell production.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, thalassaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"88.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"Mean corpuscular volume measures the average size of red blood cells. Small cells can indicate iron deficiency, while large cells can suggest B12 or folate deficiency. Craig's MCV at 88.4 is within the optimal range, indicating red cells of normal size.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin per red blood cell. Craig's MCH at 31 is within the optimal range, confirming adequate haemoglobin loading of red cells.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"351","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures the average concentration of haemoglobin within red blood cells. Craig's MCHC at 351 is marginally above the upper limit of 345. The lab notes that MCHC can be affected by temperature and storage conditions during sample transit. At this margin, and with all other red cell indices being normal, this is most likely a laboratory artefact rather than a genuine clinical finding. True elevations in MCHC are rare and seen in conditions like hereditary spherocytosis, which would present with other abnormalities not present in Craig's results.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Laboratory artefact from sample handling, hereditary spherocytosis, severe dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"152","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5962","units":"x10^9/L","description":"Platelets are cell fragments that enable blood clotting. Craig's platelet count at 152 is within the laboratory range but sits just above the lower limit of 150, and below the optimal threshold of 180. Mildly low platelet counts can be a normal variant in some individuals. It is worth noting on future blood tests to ensure stability, but in the absence of bleeding symptoms or bruising, this does not suggest a significant problem. It does, however, inflate his FIB-4 score by making the denominator of the calculation smaller.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, excessive alcohol, medications, normal variation","high_causes":"Iron deficiency, inflammation, infection, post-splenectomy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"8.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6111","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets are often younger and more active. Craig's MPV at 8.5 is within the optimal range, indicating normal platelet production and turnover.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Increased platelet destruction with compensatory production, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"4","upper_normal":"10","lower_optimal":"5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"White blood cells are the immune system's frontline defence. The total count encompasses several types of immune cells. Craig's WBC at 4.4 is within the laboratory range but below the optimal threshold of 5. A mildly lower white cell count is common in lean, fit individuals with low body fat and can also reflect a body that is slightly under-fuelled. In the absence of recurrent infections, this is not a concern, but it adds to the pattern suggesting Craig may benefit from eating more.","low_causes":"Lean body composition, intense training, low caloric intake, viral infections, bone marrow suppression","high_causes":"Infection, inflammation, stress, smoking, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3717","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the body's first responders to bacterial infection. Craig's neutrophils at 2.69 are within the optimal range, indicating healthy immune surveillance.","low_causes":"Viral infection, intense exercise, low caloric intake, bone marrow suppression, medications","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3887","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for adaptive immunity, including the production of antibodies and the destruction of virus-infected and cancer cells. Craig's lymphocytes at 1.33 are within the laboratory range but below the optimal threshold of 1.5. As with the overall white cell count, this can reflect lean body composition and a body that is slightly under-fuelled.","low_causes":"Intense exercise, low caloric intake, stress, viral infection, corticosteroids","high_causes":"Viral infection, chronic inflammation, lymphocytic leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that mature into macrophages in tissues, where they engulf pathogens and dead cells. Craig's monocytes at 0.34 are within the optimal range.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Chronic infection, chronic inflammation, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5139","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic reactions. Craig's eosinophils at 0.03 are within the optimal range and very low, indicating no active allergic or parasitic process.","low_causes":"Acute stress, corticosteroid use","high_causes":"Allergies, asthma, parasitic infection, drug reactions, eosinophilic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell and play a role in allergic and inflammatory responses. Craig's basophils at 0.01 are at the lower end of the range, which is a normal finding as basophils are typically present in very small numbers.","low_causes":"Acute allergic reaction (paradoxical decrease), corticosteroid use","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.66","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells recently released from the bone marrow. The percentage reflects the rate at which the bone marrow is producing new red cells. Craig's reticulocyte percentage at 0.66% is within the laboratory range but below the optimal threshold of 0.8%. This suggests a relatively low rate of red cell production, though with a healthy haemoglobin the body may simply not be signalling for many new cells.","low_causes":"Adequate haemoglobin suppressing production, iron or B12/folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"32.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2250","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of immature red blood cells in the blood. Craig's absolute reticulocytes at 32.5 are below the lower limit of 50, indicating the bone marrow is producing new red cells at a rate below what is typically expected. With haemoglobin at a healthy 153, one explanation is that the body has enough red cells and is not stimulating the bone marrow to produce more. However, this finding is also consistent with a body that is slightly under-fuelled, where bone marrow output is being quietly economised because of insufficient caloric intake relative to training demands. This should be monitored on retest.","low_causes":"Adequate haemoglobin suppressing erythropoietin, nutritional deficiency (iron, B12, folate), bone marrow suppression, low energy availability","high_causes":"Blood loss, haemolytic anaemia, recovery from iron or B12 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil/Lymphocyte Ratio","group":"HEMATOLOGY","result":"2.02","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5100","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a calculated marker that reflects the balance between innate and adaptive immunity. It is increasingly used as a marker of systemic inflammation and physiological stress. A ratio between 1 and 3 is normal, with 1 to 2 being optimal. Craig's NLR at 2.02 is within the normal range and just above the optimal threshold, indicating a healthy balance of immune cell types with no evidence of physiological stress.","low_causes":"Low physiological stress","high_causes":"Infection, inflammation, physiological stress, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"31.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6567","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3789","upper_optimal_position":"0.6117","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals. Craig's serum iron at 31.1 is right at the top of the laboratory range of 11.6 to 31.3 and above the optimal upper threshold. On a carnivore diet rich in haem iron, which is absorbed very efficiently by the gut, high serum iron is expected. This finding is part of the broader iron loading pattern that should be discussed with Craig's GP.","low_causes":"Iron deficiency, chronic disease, vegetarian/vegan diet, malabsorption","high_causes":"Haemochromatosis, high haem iron diet, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.19","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3422","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.5","upper_optimal":"3.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4111","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. The liver produces more transferrin when iron stores are low (to capture more iron) and less when stores are adequate or high. Craig's transferrin at 2.19 is just above the lower limit of 2.15, indicating the liver has downregulated transferrin production because iron stores are already well loaded. This low transferrin, combined with high serum iron, produces the elevated transferrin saturation of 56.6% that flags for further investigation.","low_causes":"Iron overload, chronic inflammation, liver disease, haemochromatosis","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"51.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3903","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"umol/l","description":"Total iron binding capacity measures the maximum amount of iron the blood can carry. It reflects the amount of transferrin available to bind iron. Craig's TIBC at 51.7 is within the laboratory range but in the lower portion, consistent with his low transferrin. The body has reduced its iron-carrying capacity because stores are already high.","low_causes":"Iron overload, chronic inflammation, haemochromatosis, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"56.55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7100","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5296","units":"%","description":"Transferrin saturation is the percentage of transferrin that is currently loaded with iron. It is calculated from serum iron and TIBC. A saturation above 45% in men warrants investigation for hereditary haemochromatosis, and above 55% is a stronger signal. Craig's transferrin saturation at 56.6% is above the upper limit of 55%, indicating that a higher proportion of his iron-carrying capacity is occupied than is desirable. This is the most important iron finding in his panel and the primary reason to recommend HFE gene testing through his GP.","low_causes":"Iron deficiency, chronic disease, chronic inflammation","high_causes":"Haemochromatosis, iron overload, high haem iron diet, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"302","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6444","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's main iron storage protein. Each molecule can hold up to 4,500 atoms of iron. Ferritin levels reflect the total iron stored in the body, primarily in the liver, spleen, and bone marrow. Craig's ferritin at 302 is within the laboratory range of 22 to 322 but sits well above the optimal upper threshold of 200 for men. Combined with a transferrin saturation above 55% and a near-floor transferrin, this indicates substantial iron loading. While ferritin can also rise with inflammation, Craig's CRP is only 0.8 and ESR is below 2, ruling out an inflammatory cause. The high ferritin is therefore reflecting genuinely high iron stores, likely driven by his carnivore diet's high haem iron content and possibly by a genetic predisposition that should be investigated.","low_causes":"Iron deficiency, blood loss, vegetarian/vegan diet, malabsorption, heavy menstruation","high_causes":"Iron overload, haemochromatosis, high haem iron diet, inflammation, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4130","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3866","upper_optimal_position":"0.5280","units":"mIU/l","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how hard to work. A higher TSH means the pituitary is pushing the thyroid harder because output is insufficient, while a lower TSH means thyroid output is adequate or excessive. Craig's TSH at 1.56 is within the optimal range of 1.0 to 2.5, indicating the pituitary is satisfied with the thyroid's output and the thyroid is not being over- or under-stimulated.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from thyroid illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"13.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3862","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3556","upper_optimal_position":"0.5889","units":"pmol/l","description":"Free T4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. It is converted into T3, the more active thyroid hormone, in the tissues. Craig's Free T4 at 13.7 is within the laboratory range but just below the optimal threshold of 14. In the context of a normal TSH and a healthy Free T3, this reflects where his thyroid naturally sits and is not a concern. If TSH were elevated, a low-normal FT4 would have a different significance.","low_causes":"Hypothyroidism, iodine deficiency, pituitary dysfunction","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4296","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the unbound, active form of triiodothyronine, the most metabolically potent thyroid hormone. It is produced primarily by the conversion of T4 in the liver, kidneys, and tissues. Craig's Free T3 at 5.0 is within the optimal range of 4.5 to 6.5, confirming that his body is converting T4 to T3 effectively and that thyroid hormone is reaching the tissues at a healthy level. This is the thyroid marker most directly relevant to how someone feels, and a healthy Free T3 is reassuring for energy and metabolism.","low_causes":"Hypothyroidism, poor T4 to T3 conversion, caloric restriction, chronic illness","high_causes":"Hyperthyroidism, thyroiditis, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Elevated levels are the hallmark of Hashimoto's thyroiditis, the most common cause of hypothyroidism. Craig's TPO antibodies are below 6.6, well within the normal range of below 13.8, ruling out autoimmune thyroid disease.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein produced by the thyroid that is used to make thyroid hormones. Elevated levels, like TPO antibodies, indicate autoimmune thyroid disease. Craig's result is below 1.3, which falls in the undetectable range seen in more than 80% of the population. This is a normal result.","low_causes":"Absence of autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"104","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, mood regulation, and muscle function. It is produced in the skin from sunlight and obtained from oily fish, eggs, and fortified foods. Levels below 30 nmol/L are deficient, 30 to 50 is insufficient, above 50 is sufficient, and the optimal range is 75 to 120. Craig's vitamin D at 104 is well within the optimal range. This is an excellent result and likely reflects a combination of sun exposure and his animal-product-rich diet. Maintaining this level year-round with a maintenance dose of vitamin D3 during the darker months is advisable.","low_causes":"Insufficient sun exposure, dark skin, northern latitude, obesity, malabsorption, low dietary intake","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"397","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3593","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4616","upper_optimal_position":"0.5951","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, DNA synthesis, and energy production. It is found exclusively in animal products, making it typically well supplied on a carnivore diet. Craig's B12 at 397 is within the laboratory range but below the optimal threshold of 500. This is lower than would be expected on a diet consisting exclusively of animal products and may reflect either insufficient variety in the types of animal products consumed, or an absorption issue. Liver is by far the richest dietary source. Below-optimal B12 can contribute to fatigue and impaired recovery, particularly when combined with below-optimal folate.","low_causes":"Low dietary intake, malabsorption, pernicious anaemia, certain medications, low intrinsic factor","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5238","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, is essential for DNA synthesis, cell division, red blood cell formation, and methylation, a critical process for energy production, detoxification, and neurotransmitter synthesis. The richest food sources are leafy green vegetables, legumes, and liver. On a carnivore diet that excludes plant foods, folate intake depends heavily on liver and eggs. Craig's folate at 4 is within the laboratory range of 3 to 17 but significantly below the optimal threshold of 8. This is the most likely nutritional contributor to his fatigue and poor recovery, and it may also be contributing to the low absolute reticulocyte count by limiting the building blocks available for new red blood cell production.","low_causes":"Low dietary intake (especially low plant or liver intake), malabsorption, alcohol, certain medications, coeliac disease","high_causes":"Supplementation, high dietary intake of leafy greens","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"1.082","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3424","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"0.98","upper_optimal":"4.73","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"Parathyroid hormone is produced by the parathyroid glands and regulates calcium levels in the blood. When calcium drops, PTH rises to pull calcium from bones, increase absorption from the gut, and reduce calcium loss through the kidneys. Craig's PTH at 1.082 is within range, sitting near the lower end, which is appropriate given his healthy calcium and excellent vitamin D levels. There is no overactivity of the parathyroid glands.","low_causes":"Hypoparathyroidism, high calcium, high vitamin D","high_causes":"Vitamin D deficiency, low calcium, hyperparathyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"435","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4585","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"250","upper_optimal":"550","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4041","upper_optimal_position":"0.6074","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural daily rhythm, peaking in the morning to help the body wake up and declining through the day. It plays essential roles in energy metabolism, immune regulation, and the stress response. Craig's morning cortisol at 435 is within the optimal range, indicating healthy adrenal function and an appropriate morning cortisol response. Neither suppressed (which could indicate adrenal fatigue) nor elevated (which would suggest chronic stress).","low_causes":"Adrenal insufficiency, chronic stress leading to exhaustion, pituitary dysfunction","high_causes":"Acute or chronic stress, Cushing's syndrome, corticosteroid medication, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"108","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3699","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1370","upper_optimal_position":"0.4452","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen in men and is produced from testosterone by the enzyme aromatase. In men, small amounts of oestradiol are essential for bone health, brain function, and cardiovascular protection. Craig's oestradiol at 108 is within the laboratory range and within the optimal band, indicating a healthy testosterone-to-oestrogen balance.","low_causes":"Low body fat, aromatase inhibitor use, low testosterone","high_causes":"Obesity, excess aromatase activity, liver disease, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4182","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.88","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in regulating other hormones and has neuroprotective properties. Craig's progesterone at 1.65 is within range.","low_causes":"Adrenal insufficiency, low cholesterol","high_causes":"Adrenal hyperplasia, testicular tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4017","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3641","upper_optimal_position":"0.6026","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and stimulates the testes to produce testosterone. Craig's LH at 3.01 is within the optimal range, indicating healthy pituitary-testicular communication. The pituitary is not having to over-stimulate the testes, which is consistent with his healthy testosterone level.","low_causes":"Pituitary dysfunction, steroid use, obesity","high_causes":"Primary testicular failure, age-related decline, Klinefelter syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"8.25","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5735","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3569","upper_optimal_position":"0.5569","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland and supports sperm production in men. Craig's FSH at 8.25 is within the laboratory range but just above the optimal upper threshold of 8. This is a normal finding for a 49-year-old man and does not suggest any testicular dysfunction.","low_causes":"Pituitary dysfunction, steroid use","high_causes":"Primary testicular dysfunction, age-related changes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"22.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5149","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, essential for muscle mass, bone density, fat distribution, energy levels, mood, libido, and cognitive function. Craig's testosterone at 22.3 is within the optimal range of 18 to 30 for men. This is an excellent result for a 49-year-old and suggests his hormonal environment should be supporting energy, recovery, and mood. The fact that testosterone is healthy while Craig still reports fatigue and poor recovery suggests other factors, likely nutritional, are the primary drivers of his symptoms.","low_causes":"Aging, obesity, chronic illness, sleep deprivation, alcohol, pituitary dysfunction, medications","high_causes":"Exogenous testosterone use, testicular tumour, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3939","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6364","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production but also involved in immune regulation and reproductive function. In men, elevated prolactin can suppress testosterone and libido. Craig's prolactin at 105 is within the optimal range, ruling out prolactin excess as a cause of his symptoms.","low_causes":"Dopamine agonist medication","high_causes":"Pituitary adenoma, stress, medications (antidepressants, antipsychotics), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"52.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4842","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically available by factoring in SHBG levels. It is calculated as (total testosterone / SHBG) x 100. Craig's FAI at 52.1 is within the optimal range, confirming that an adequate amount of his testosterone is free and available for use.","low_causes":"High SHBG, low testosterone, liver disease","high_causes":"Low SHBG, polycystic ovary syndrome (females), steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"1511.85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4803","lower_normal":"162.14","upper_normal":"4939.9","lower_optimal":"500","upper_optimal":"3500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3871","upper_optimal_position":"0.5960","units":"ug/dL","description":"DHEA sulphate is the most abundant steroid hormone in the body, produced by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. DHEA-S naturally declines with age, so a healthy level at 49 is a positive indicator of adrenal function. Craig's DHEA-S, converted from 4.1 umol/L to approximately 1,512 ug/dL, is well within the optimal range, indicating healthy adrenal reserve.","low_causes":"Aging, adrenal insufficiency, chronic stress, chronic illness","high_causes":"Adrenal hyperplasia, adrenal tumour, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"42.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5093","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3818","upper_optimal_position":"0.5758","units":"nmol/l","description":"Sex hormone binding globulin is a protein produced by the liver that binds testosterone, making it unavailable for use by the body. Only testosterone not bound to SHBG (free testosterone) is biologically active. Too-high SHBG can reduce free testosterone, while too-low SHBG can indicate insulin resistance. Craig's SHBG at 42.8 is within the optimal range of 25 to 55, indicating a healthy balance. The liver is producing an appropriate amount of binding protein, and a good proportion of Craig's testosterone remains free and active.","low_causes":"Obesity, insulin resistance, type 2 diabetes, hypothyroidism, anabolic steroid use","high_causes":"Aging, liver disease, hyperthyroidism, low caloric intake, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.411","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4378","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3893","upper_optimal_position":"0.5582","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone not bound to SHBG or albumin, making it immediately available for use by the body's cells. It drives the biological effects of testosterone including muscle protein synthesis, energy, libido, and mood. Craig's free testosterone at 0.411 is within the optimal range, confirming that an adequate amount of testosterone is available for his body to use. This is a positive finding and, combined with his healthy total testosterone of 22.3, means his hormonal profile is well-positioned for muscle recovery and energy.","low_causes":"High SHBG, low total testosterone, aging, chronic illness","high_causes":"Low SHBG, exogenous testosterone, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa"," // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>

    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
