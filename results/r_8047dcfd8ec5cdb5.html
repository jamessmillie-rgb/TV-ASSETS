<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"James McDevitt","dob":"20/07/1992","report_date":"2026-10-13","summary":"This is a 34-year-old male presenting with a BMI of 24.7, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). He does no structured cardio or resistance training, walking 5,000 to 7,500 steps a day. He sleeps 7 to 8 hours but is slow to get going on waking, with energy described as tired on waking; stress feels hard to manage some weeks. He drinks 5 to 9 alcoholic drinks a week. He takes an SNRI (venlafaxine or duloxetine). He has no previous blood test on file. He reports low mood and anxiety, low sex drive and libido, headaches, and low energy and fatigue, present for a matter of weeks. His goals are to improve energy levels, lose body fat, and prevent disease.\n\nThe finding in this report that matters most, and the one that should go to his GP first, is the lipid panel. His total cholesterol is 8.0, well above the desirable threshold of 5.18. His LDL cholesterol, the fraction that deposits cholesterol into artery walls, is 5.56 against an upper limit of 3.0. His ApoB, a direct count of the particles carrying cholesterol into artery walls and the single best predictor of cardiovascular risk, is 1.82 against a target of below 0.9, placing it in the \"very high\" category. His triglycerides are 2.52, above the fasting target of 1.70. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls, is 1.30, which is above the high-risk threshold of 1.04 but below the desirable level of 1.55. His ApoB to ApoA-I ratio, which summarises the balance between atherogenic and protective particles, is 1.21 against a target of below 0.7, placing him firmly in the higher-risk category. His Lp(a), a genetically inherited lipoprotein that accelerates plaque formation, is 37.9 against a threshold of 32. Lp(a) is fixed at birth, cannot be changed by diet or exercise, and should be recorded permanently in his medical notes. It means a small but meaningful portion of his cardiovascular risk is inherited. However, after correcting his LDL for the cholesterol carried by Lp(a), his Lp(a)-corrected LDL is still 5.44, which means the vast majority of his elevated LDL is driven by modifiable factors: diet, body composition, alcohol, and exercise. His cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 75 out of 100, where below 20 is ideal and below 40 is acceptable. At 34, his ten-year risk of a heart attack or stroke is statistically low because he is young, but the score measures the damage being built right now, and 75 is high. The gap between a low ten-year risk and a high building-risk score is the window he has to act, and that window narrows with every year these numbers stay where they are. This entire lipid picture needs a GP conversation. At this level of ApoB, diet and lifestyle changes should be started immediately and given three to six months to work, after which a statin discussion may be appropriate if the numbers have not come down meaningfully.\n\nHis testosterone is 9.7 against a laboratory range of 8.4 to 28.7, but the recommended level is above 12, and the optimal range starts at 18. At 34, this is low. His free androgen index, which reflects how much testosterone is available to tissues, is 31.7, just above the lower limit of 30. His free testosterone, the unbound fraction that enters cells and drives the effects a man feels, is 0.2 against a range of 0.13 to 1.04. His bioavailable testosterone, which includes both the free fraction and the loosely bound fraction, is 4.59, within range but at the lower end. His SHBG, the protein that binds testosterone and makes it unavailable, is 30.6, which is within range and not unusually high, so the low testosterone is not being caused by excessive binding. It is genuinely low production. This connects directly to his reported symptoms: low sex drive, low energy, and low mood are all recognised features of below-optimal testosterone in a young man. The SNRI he takes can itself suppress libido and blunt energy, and distinguishing between medication effects and low testosterone effects is difficult without a trial, but the number is low enough that it deserves investigation in its own right. His LH is 3.59, within range, which tells us the pituitary gland is not shouting at the testes to produce more, which may mean the brain's feedback system has not recognised the shortfall or that the setpoint is low. His cortisol at 275 is within the morning reference range. His DHEA-S at 6.3 is healthy. His prolactin at 76 is well within range, which rules out a prolactin-driven suppression of testosterone. His oestradiol at 79 is within the male range. The GP should repeat testosterone on an early-morning fasted sample to confirm, and if it remains below 12, further investigation including a full pituitary hormone profile is warranted.\n\nThere is genuine good news elsewhere. His blood sugar control is excellent. Fasting glucose is 4.3 against an upper ideal of 5.4, HbA1c is 35, well below the pre-diabetes threshold of 42, and his fasting insulin is 7.45 with a HOMA-IR of 1.42. HOMA-IR is a measure of how hard the pancreas has to work to keep blood sugar in check; his sits within the ideal band, meaning his cells are responding well to insulin and his pancreas is not under strain. His estimated average glucose, derived from HbA1c, is 5.9, comfortably within range. His C-peptide, a marker of how much insulin the pancreas is actually producing, is 1.28, just above the lower limit, consistent with a pancreas that does not need to produce much because insulin sensitivity is good. This is a strong positive at a time when his diet includes sugary food some days and ultra-processed food weekly, but it is not a free pass; it means the metabolic machinery is healthy now and worth protecting.\n\nHis thyroid is working well. TSH is 1.24, sitting in the ideal zone between 1.0 and 2.5. Free T4 is 17.7, mid-range and ideal. Free T3, the active thyroid hormone that drives energy and metabolism, is 5.6, within the optimal band. His FT3 to FT4 ratio is 0.316, confirming good conversion from storage hormone to active hormone. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which rules out autoimmune thyroid disease. The thyroid is not the explanation for his fatigue.\n\nHis liver is in reasonable shape. ALT is 44 against a laboratory upper limit of 56, but the optimal threshold for a male is below 30, and 44 is above that. GGT is 28, within the laboratory range of 4 to 73 but above the optimal threshold of 25. AST is 32, within range. His FIB-4 score, which estimates liver scarring using age, platelets, AST and ALT, is 0.82, well below the threshold of 1.45, meaning there is no sign of fibrosis. His APRI score is 0.4, also reassuring. The mildly elevated ALT in the context of 5 to 9 drinks a week, weekly ultra-processed food, and sugary food some days is most likely driven by a combination of alcohol and dietary fat load. Neither enzyme is alarming, but both are above optimal, and they will be the first markers to respond when diet and alcohol improve. His bilirubin at 16 is within range. Albumin at 42, total protein at 75, and globulin at 33 are all healthy. His amylase and lipase, markers of pancreatic health, are both within range.\n\nHis kidney function shows one finding that needs context. His cystatin C is 1.11, marginally above the upper limit of 1.10. Cystatin C is a protein filtered by the kidneys and is a more reliable measure of kidney function than creatinine in people who do not do resistance training, because creatinine is influenced by muscle mass. His cystatin C-based eGFR is 89, just below the optimal threshold of 90. His combined eGFR, which uses both creatinine and cystatin C, is also 89. At 34, an eGFR of 89 is marginally below where it should be. This is not kidney disease, but it is worth establishing as a baseline and repeating in twelve months. His creatinine-based eGFR is above 90, which is reassuring, and the small discrepancy between the two calculations is within normal variation. His urea, sodium, chloride, and bicarbonate are all within range. His uric acid at 521 is within the laboratory range of 220 to 547 but above the optimal band of 200 to 380. Uric acid at this level, close to the saturation point, increases the risk of gout and is associated with cardiovascular risk and kidney strain. It is driven by purine-rich food (red meat, offal, shellfish, beer), fructose from sugary food and drink, and alcohol. Reducing alcohol and sugary food will bring this down.\n\nHis full blood count has three findings below range. His white cell count is 3.92, just below the lower limit of 4.0. His neutrophils, the most abundant white cell and the first responder to bacterial infection, are 1.75 against a lower limit of 2.0. His absolute reticulocyte count, which measures new red blood cells being released from the bone marrow, is 47.08 against a lower limit of 50. All three are marginally below range. In the absence of infection, recurrent illness, weight loss, or other red flags, the most likely explanation at 34 is benign ethnic neutropenia (common in people of European ancestry and entirely harmless) or simply sitting at the lower end of the population distribution. His lymphocytes at 1.81 are healthy, his haemoglobin at 160 is strong, and his red cell indices are all normal. His NLR, the ratio of neutrophils to lymphocytes which reflects the balance between innate and adaptive immunity, is 0.97, just below the optimal lower bound of 1.0, driven by the low neutrophil count. His ESR, a general inflammation marker, is 12, at the upper boundary of normal. His hsCRP, a more specific inflammation marker, is 1.2, within the laboratory range of below 5 but above the optimal threshold of 1.0. A CRP between 1 and 3 is classified as moderate cardiovascular risk. Together, these suggest a low-grade inflammatory signal that fits with the dietary pattern and the lipid picture. The white cell findings should be noted and repeated in six months to confirm they are stable.\n\nHis IgE, an immunoglobulin associated with allergic responses, is 120 against an upper limit of 100. This does not diagnose an allergy, but it tells us his immune system is producing more of the antibody class involved in allergic and atopic reactions than expected. If he has hay fever, eczema, asthma, or unexplained skin reactions, this number supports that picture. If he has none of those, it is worth noting and monitoring. His IgG, IgA, and IgM are all within range, and his rheumatoid factor is undetectable. His coeliac screen (tissue transglutaminase IgA) is negative.\n\nHis iron studies are healthy. Ferritin at 97 sits within the optimal band of 50 to 200. Serum iron at 22.9, transferrin at 3.25, iron binding capacity at 74.2, and transferrin saturation at 28% are all within range and well balanced. There is no iron deficiency and no iron overload.\n\nHis vitamin D is 68, which is sufficient (above 50) but below the optimal level of 75. At 68 he will not feel symptoms from vitamin D alone, but supplementing to bring it above 75 supports immune function, mood, bone density, and testosterone production. His B12 at 322 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. B12 below 500 can contribute to fatigue, brain fog, and low mood, all of which he reports. His folate at 13 is healthy. His calcium at 2.52 (corrected 2.52) is within range. Phosphate at 1.0 and magnesium at 1.06 are within range, with magnesium sitting at the upper end, which is a positive.\n\nHis total antioxidant activity at 2.28 is above the upper limit of 1.77. This is not a concern; it reflects dietary antioxidant intake or supplementation and is a favourable finding. His creatine kinase at 116 is within range.\n\nHis prostate markers are excellent. PSA at 0.26 with a free PSA ratio of 0.50 is as clean as it gets at 34. His tumour markers CA19-9 at 10.72 and CEA at 1.58 are both well within range.\n\nHis urinalysis is clear. No protein, glucose, ketones, blood, white cells, or nitrites. Bacterial culture and sensitivities are to follow.\n\nHis PhenoAge, a composite biological age score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count, is 27.2 against a chronological age of 34, meaning his biological age is nearly seven years younger than his calendar age. This is a genuinely strong result and tells us that despite the lipid picture, the rest of his body is in good metabolic shape. The lipid findings are the outlier, not the norm, and that makes them eminently fixable.\n\nHis MPV at 10.3 is marginally above the upper limit of 10.1. At this margin, this is usually normal variation and not clinically significant. His MCHC at 344 is at the upper boundary of 345, within range.\n\nPutting all of this together, the story of this report is a 34-year-old man whose metabolic health, thyroid, kidneys, liver, blood sugar, and immune system are fundamentally sound, but whose lipid panel is significantly and unambiguously elevated and whose testosterone is below where it should be at his age. The lipid picture is the urgent priority because it is building cardiovascular risk right now, and the testosterone warrants investigation because it connects to half of his symptoms. His diet, with less than one portion of fruit or vegetables a day, sugary food some days, ultra-processed food weekly, and 5 to 9 drinks a week, is the single biggest lever he has. His complete absence of structured exercise is the second. These two changes, applied consistently for three to six months, will move the lipid numbers, the liver enzymes, the uric acid, the CRP, and very possibly the testosterone.","links":"The dominant finding is the lipid panel, and it does not exist in isolation. His total cholesterol of 8.0, LDL of 5.56, ApoB of 1.82, and triglycerides of 2.52 are all significantly elevated, and they share a common set of drivers. A diet low in vegetables and fibre (0 to 1 portions a day), with regular sugary food and weekly ultra-processed food, provides a high load of saturated fat, refined carbohydrate, and fructose. Saturated fat raises LDL by downregulating the liver's LDL receptors, meaning less cholesterol is cleared from the blood. Fructose and refined carbohydrate drive triglyceride production in the liver, which raises VLDL (his is 1.15, above the 0.78 limit) and in turn raises the number of atherogenic particles measured by ApoB. Alcohol at 5 to 9 drinks a week adds to triglyceride production directly and contributes additional calories. The complete absence of structured exercise removes one of the most effective ways to raise HDL and lower triglycerides. His HDL at 1.30 is not low enough to be dangerous, but it is below the desirable level, and exercise is the single most reliable way to raise it.\n\nThe Lp(a) at 37.9 adds a small inherited component. Lp(a) is a modified LDL particle that is stickier and more inflammatory than standard LDL. It cannot be changed by lifestyle or most medications. However, his Lp(a)-corrected LDL is 5.44, confirming that the inherited contribution is small and the vast majority of his LDL elevation is modifiable. This is useful information: it means diet, exercise, and potentially a statin can bring his numbers down substantially.\n\nThe testosterone at 9.7 may be connected to the same lifestyle picture. Visceral fat (even at a healthy BMI, body composition matters), poor diet quality, alcohol, and lack of resistance training are all associated with lower testosterone in young men. His SHBG is not high, so the issue is production rather than binding. The SNRI he takes can independently suppress libido and may blunt the hypothalamic-pituitary-gonadal axis, making it difficult to separate medication effects from a genuine testosterone deficit. A morning fasted repeat will clarify whether this is a consistent finding or a single low reading.\n\nThe mildly suppressed white cell count and neutrophils, the borderline reticulocytes, the CRP of 1.2, and the ESR of 12 form a loose cluster. None is dramatically abnormal, but together they suggest the immune system is operating at the quiet end of normal. This could reflect benign constitutional variation, mild nutritional shortfall (a diet with almost no fruit or vegetables provides limited micronutrient support for immune cell production), or the early effects of the metabolic and inflammatory load from the lipid picture. The low-grade inflammation measured by CRP and ESR fits with the lipid profile: elevated lipids drive endothelial inflammation, which CRP reflects.\n\nThe findings that have been positively excluded are important. His thyroid is working well with negative antibodies, ruling out autoimmune thyroid disease as a cause of fatigue or mood changes. His blood sugar and insulin sensitivity are excellent, ruling out metabolic syndrome despite the lipid picture. His liver shows no fibrosis. His kidneys are functioning, with only a marginal cystatin C elevation. His iron stores are healthy. His coeliac screen is negative. His prostate markers are clean. These exclusions narrow the field: the symptoms he reports, fatigue, low mood, low libido, and headaches, are most likely driven by the low testosterone, the SNRI's side effects, poor diet quality, lack of exercise, and the pattern of being tired on waking despite adequate sleep hours, which suggests sleep quality rather than quantity is the issue.","lifestyle":"Add two to three portions of vegetables to your meals each day, starting today. One portion with lunch, one with dinner, and a piece of fruit as a snack. Anchor: put them on the plate first before anything else. Why: vegetables provide soluble fibre that binds cholesterol in the gut and lowers LDL, and your current intake of 0 to 1 portions a day is the single biggest gap in your diet.\nSwap sugary snacks and drinks for whole food alternatives: nuts, Greek yoghurt, berries, dark chocolate above 70%. Anchor: when you reach for something sweet, reach for one of these instead. Why: fructose from sugar drives triglyceride production in the liver, which is behind your triglycerides of 2.52 and your VLDL of 1.15.\nAdd a palm-sized portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, beans. Anchor: protein goes on the plate before carbohydrate. Why: protein supports testosterone production, preserves lean mass during any fat loss, and keeps you full, reducing snacking. Your target is 117 to 144 grams of protein a day.\nEat oily fish (salmon, mackerel, sardines) twice a week, replacing one red meat meal. Why: omega-3 from oily fish lowers triglycerides, reduces inflammation (your CRP is 1.2), and supports mood.\nStart resistance training twice a week, even bodyweight exercises at home: squats, press-ups, rows, lunges, 30 minutes per session. Anchor: fixed days, same time. Why: resistance training is the most effective way to raise testosterone naturally, and your testosterone at 9.7 is below where it should be at 34. It also raises HDL, lowers triglycerides, and improves insulin sensitivity.\nAdd a 15-minute walk after your largest meal. Anchor: plate in the sink, shoes on. Why: post-meal walking lowers the glucose and triglyceride response to that meal, which directly targets your triglyceride level.\nReduce alcohol to under 7 drinks a week, ideally under 4. Anchor: set alcohol-free days (Monday to Thursday). Why: alcohol raises triglycerides, contributes to liver enzyme elevation (your ALT is 44, above the optimal 30), suppresses testosterone, and adds empty calories.\nFix your wake time to the same time every day, including weekends, and get outside within 30 minutes of waking. Why: you sleep 7 to 8 hours but wake tired and slow to get going, which suggests your circadian rhythm needs anchoring. Morning light resets the cortisol awakening response and improves energy through the day.","flags":"Lipid panel significantly elevated: total cholesterol 8.0 (target below 5.18), LDL 5.56 (limit 3.0), ApoB 1.82 (target below 0.9, classified \"very high\"), triglycerides 2.52 (target below 1.70), HDL 1.30 (below desirable 1.55), VLDL 1.15 (limit 0.78), non-HDL 6.70 (limit 4.0), TC/HDL ratio 6.15 (limit 4.5), ApoB/A-I ratio 1.21 (target below 0.7), Lp(a)-corrected LDL 5.44 (limit 3.0), atherogenic index 0.287 (limit 0.21), Castelli II 4.28 (limit 3.5). Cardiovascular risk score 75/100 (target below 40). This profile requires GP review and aggressive dietary intervention; statin discussion if no improvement after three to six months.\nLp(a) 37.9 nmol/L (limit 32), slightly elevated, genetically inherited and unchangeable. Should be recorded permanently in medical notes. First-degree relatives should be tested.\nTestosterone 9.7 nmol/L, within the laboratory range of 8.4 to 28.7 but below the recommended level of 12 and well below the optimal range of 18 to 30. Free androgen index 31.7 (lower limit 30). Symptoms of low libido, fatigue, and low mood are consistent. Recommend early-morning fasted repeat; if confirmed below 12, further investigation warranted.\nCystatin C 1.11 mg/L (limit 1.10), marginally above range. Cystatin C-based eGFR 89 and combined eGFR 89, both just below the optimal threshold of 90. Not kidney disease at this margin, but should be repeated in twelve months to establish trajectory.\nUric acid 521 umol/L, within range (limit 547) but above optimal (380). Approaching saturation point; driven by diet, fructose, and alcohol. Risk factor for gout and associated with cardiovascular and kidney risk.\nWhite cell count 3.92 (limit 4.0), neutrophils 1.75 (limit 2.0), absolute reticulocytes 47.08 (limit 50), all marginally below range. Most likely benign constitutional variation at 34. Recommend repeat in six months to confirm stability.\nIgE 120 IU/ml (limit 100). Suggests atopic tendency. Worth correlating with any allergic symptoms.\nhsCRP 1.2 mg/L, above optimal (1.0). Low-grade inflammatory signal consistent with the lipid and dietary picture. ESR 12, at the upper boundary.\nALT 44 IU/L, within laboratory range (limit 56) but above optimal (30). GGT 28, within range but above optimal (25). Likely driven by alcohol and dietary fat load. No fibrosis (FIB-4 0.82, APRI 0.4).\nVitamin D 68 nmol/L, sufficient but below optimal (75). B12 322 pg/ml, within range but below optimal (500).\nMPV 10.3 fL (limit 10.1), marginally above range. Not clinically significant at this margin.\nReassuring negatives: thyroid function ideal with negative antibodies, blood sugar and insulin sensitivity excellent (HbA1c 35, HOMA-IR 1.42), iron studies balanced (ferritin 97, saturation 28%), liver fibrosis excluded (FIB-4 0.82), coeliac screen negative, PSA 0.26 with free ratio 0.50, tumour markers clear, kidney function adequate, urinalysis clean, PhenoAge 27.2 (seven years younger than calendar age).","recommendations":"Discuss the lipid panel with your GP. Bring these numbers: ApoB 1.82, LDL 5.56, total cholesterol 8.0, triglycerides 2.52, Lp(a) 37.9. Ask about the timeline for dietary intervention before considering a statin, and request that Lp(a) is recorded permanently in your notes.\nAsk your GP to repeat testosterone on an early-morning fasted blood draw. If it confirms below 12 nmol/L, request further investigation including LH, FSH (already measured and within range), prolactin, and a pituitary profile. Mention the SNRI as a possible contributor.\nDiscuss the Lp(a) result and request that first-degree relatives (parents, siblings) are offered testing.\nMention the marginally low white cell count (3.92) and neutrophils (1.75) so they are noted on your record. Request a repeat full blood count in six months.\nMention the cystatin C of 1.11 and eGFR of 89 so a baseline is established. Request repeat kidney function in twelve months.\nIf you experience joint pain, swelling, or redness in the big toe, mention the uric acid of 521 to your GP.\nCalorie and protein targets: to lose body fat gradually while preserving lean mass, aim for 2,000 to 2,200 kcal per day (your estimated maintenance is around 2,550 based on your height, weight, and current activity level). Protein target: 117 to 144 grams per day (1.3 to 1.6 g per kg). Retest in four to six months: repeat lipid panel (including ApoB and Lp(a)), testosterone (morning fasted), full blood count, liver enzymes, hsCRP, cystatin C, and vitamin D.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal that contains fat. Why: your vitamin D is 68, below the optimal level of 75. Vitamin D supports immune function, mood, bone density, and testosterone production.\nVitamin K2 (MK-7): 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones and away from arteries, which is especially relevant with your lipid profile.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (yours are 2.52), reduces inflammation (CRP 1.2), and supports cardiovascular health. Choose a high-EPA formulation.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 is 322, below the optimal level of 500. Suboptimal B12 can contribute to fatigue, low mood, and brain fog, all of which you report.\nMagnesium glycinate: 300 mg before bed. Why: your magnesium at 1.06 is adequate but at the upper boundary of the lab range; supplementing supports sleep quality, stress resilience, and muscle recovery, all relevant given your report of waking tired and stress some weeks.\nThe most important changes from this report are not supplements. They are adding vegetables and fibre to every meal, cutting back on sugar and alcohol, and starting resistance training twice a week. Those changes will move your lipid panel, your liver enzymes, your testosterone, and your energy more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 62; held to 49 by LDL 5 or above, two or more systems rated \"See your GP\". Weakest systems: lipids & cardiovascular 14%, immunology 50%, specialized tests 66%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Triglycerides, Remnant Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3487","lower_normal":"","upper_normal":"39","lower_optimal":"","upper_optimal":"34","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4359","units":"years","description":"PhenoAge is a composite biological age score built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. It estimates how old the body looks biologically, independent of calendar age. At 27.2 against a chronological age of 34, this means the body is ageing nearly seven years slower than average. The markers driving this favourable result are the healthy glucose, normal albumin, and good lymphocyte count. This is one of the strongest results in the report and means that despite the lipid findings, the underlying biology is in good shape.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP, and HbA1c. It measures the cardiovascular risk being built right now, regardless of age. At 75, this is well above the acceptable threshold of 40 and far above the ideal of below 20. The score is driven primarily by the very high ApoB (1.82) and LDL (5.56), with contributions from the elevated triglycerides (2.52), the below-optimal HDL (1.30), the slightly elevated Lp(a) (37.9), and the CRP (1.2). At 34, the ten-year risk of a cardiovascular event remains statistically low because of youth, but the score shows that damage is being accumulated. The gap between the low short-term risk and the high building-risk is the window for acting.","low_causes":"Healthy lipids, low inflammation, good blood sugar control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting glucose measures the concentration of sugar in the blood after an overnight fast. At 4.3, this sits within the optimal range of 4.0 to 5.4, meaning the body is clearing glucose from the blood efficiently. This is a strong result given the dietary pattern reported and reflects healthy insulin signalling.","low_causes":"Prolonged fasting, excessive insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate intake, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.45","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.475","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, or coated with sugar, over the preceding two to three months. It gives a longer-term picture of blood sugar control than a single fasting glucose. At 5.4%, this is well below the pre-diabetes threshold of 6.0% and reflects excellent average blood sugar control.","low_causes":"Blood loss, haemolytic anaemia, recent transfusion","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. At 35 mmol/mol, this is well below the pre-diabetes threshold of 42 and below the optimal ceiling of 36. Over the past two to three months, blood sugar has been well controlled.","low_causes":"Blood loss, haemolytic anaemia","high_causes":"Insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3888","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4481","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to release to keep blood sugar stable overnight. At 7.45, this sits within the optimal range of 2 to 8, meaning the pancreas is not working harder than it should. Lower is generally better because high fasting insulin is an early sign of insulin resistance, often appearing years before glucose itself rises. This is a reassuring result.","low_causes":"Type 1 diabetes, low carbohydrate diet, high insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate diet, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"423.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3871","lower_normal":"364.1","upper_normal":"14 ":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index (triglyceride-glucose index) is an alternative measure of insulin resistance calculated from fasting triglycerides and fasting glucose. At 9.07, this is above the upper limit of 8.8, driven by the elevated triglycerides of 2.52 rather than by glucose (which is healthy at 4.3). This suggests early metabolic stress from the triglyceride burden, even though HOMA-IR is within range. Reducing triglycerides through dietary changes will bring this index down.","low_causes":"High insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"28.06","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4241","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is loaded with iron. At 28%, this sits in the optimal range of 25 to 40%, meaning iron is being transported efficiently without overload or deficiency.","low_causes":"Iron deficiency, chronic disease, poor dietary iron intake","high_causes":"Haemochromatosis, iron overload, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"22.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5083","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3739","upper_optimal_position":"0.6107","units":"umol/L","description":"Serum ir ower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a key buffer in the blood that maintains the correct pH. At 25, this is within the optimal range and confirms normal acid-base balance.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6200","units":"mmol/L","description":"Urea is a waste product of protein metabolism, filtered out by the kidneys. At 6.1, this is within the optimal range and reflects normal kidney function and adequate protein intake.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney impairment, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys at a steady rate. At 84, this is within the optimal range. The creatinine-based eGFR is above 90, confirming good kidney clearance by this measure.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney impairment, dehydration, high muscle mass, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys are filtering waste, using creatinine and age. Above 90 is ideal, and this result confirms healthy kidney filtration by this measure. The creatinine-based eGFR tends to overestimate function in people with low muscle mass and underestimate it in those with high muscle mass.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration","high_causes":"Hyperfiltration, early diabetes, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"This eGFR is calculated from cystatin C, a protein filtered by the kidneys that is not affected by muscle mass, making it more reliable than creatinine-based eGFR in some situations. At 89, this is just below the optimal threshold of 90. At 34, this is marginally below ideal and worth establishing as a baseline for future comparison. It does not indicate kidney disease.","low_causes":"Chronic kidney disease, acute kidney injury","high_causes":"Hyperfiltration, thyroid disorders","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"521","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6378","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5780","units":"umol/L","description":"Uric acid is the end product of purine metabolism. At 521, this is within the laboratory range (limit 547) but well above the optimal band of 200 to 380. At this level, uric acid approaches the saturation point where it can crystallise in joints, causing gout. It is also associated with cardiovascular risk, kidney strain, and metabolic syndrome. The main dietary drivers are red meat, organ meats, shellfish, beer, and fructose from sugary food and drinks. Reducing alcohol and sugary food will be the most effective way to bring this down.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"High purine diet, alcohol, fructose, obesity, kidney impairment, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet, or exercise, making it a more reliable marker of kidney function in many people. At 1.11, this is marginally above the upper limit of 1.10. In isolation, this does not indicate kidney disease, but it should be noted as a baseline and repeated in twelve months.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Reduced kidney function, hypothyroidism, inflammation, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"89","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7417","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and cystatin C inputs for the most accurate estimate of kidney filtration. At 89, this is just below the optimal threshold of 90. At 34, this is marginally below ideal and should be monitored. The creatinine-based eGFR alone is above 90, and the cystatin C-based eGFR is 89; the combined figure confirms the cystatin C is pulling the estimate down slightly. This does not indicate kidney disease but should be established as a baseline.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"72.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5144","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between causes of kidney impairment. At 72.6, this is within the optimal range and suggests normal kidney function with no evidence of dehydration or gastrointestinal bleeding.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4133","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 75, this is within the optimal range and reflects healthy liver production and immune function.","low_causes":"Liver disease, malnutrition, kidney disease (nephrotic syndrome)","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins, and minerals, and maintains fluid balance. At 42, this is within the optimal range, confirming healthy liver synthetic function and adequate nutrition.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulins are a group of proteins that include antibodies and transport proteins. At 33, this is within the laboratory range but just above the optimal upper limit of 32. This minor elevation is not concerning and may reflect a mild immune response or normal variation.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5143","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3905","upper_optimal_position":"0.6048","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones, and bile ducts. At 84, this is within the optimal range and suggests healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, Paget's disease, growing bones (children)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5375","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when red blood cells break down. The liver processes and excretes it. At 16, this is within the optimal range. Mild elevations can sometimes indicate Gilbert's syndrome, a harmless inherited condition, but at 16 this is not elevated.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3929","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are under strain or damaged, ALT leaks into the blood. At 44, this is within the laboratory range (limit 56) but above the optimal threshold of 30 for a male. This level suggests the liver is working harder than ideal, most likely due to a combination of dietary fat load, alcohol intake, and possibly the SNRI. It is not alarming and there is no sign of fibrosis, but it should improve with dietary changes and reduced alcohol.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver, alcohol, medications, viral hepatitis, obesity, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5313","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. At 32, this is within the optimal range. AST is less liver-specific than ALT because it is also released during muscle activity, but in the context of a normal creatine kinase, this result is reassuring.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, heart attack, muscle damage, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1918","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/L","description":"Gamma GT (GGT) is a liver enzyme that is particularly sensitive to alcohol, medications, and bile duct issues. At 28, this is within the laboratory range for a male (limit 73) but above the optimal threshold of 25. GGT is the liver enzyme most responsive to alcohol, and at 5 to 9 drinks per week, this mild elevation is consistent with that intake. It is not concerning at this level but will be worth monitoring as a marker of whether lifestyle changes are taking effect.","low_causes":"Generally not clinically significant","high_causes":"Alcohol, medications, fatty liver, bile duct obstruction, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4621","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3901","upper_optimal_position":"0.6288","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. At 64, this is within the optimal range and confirms the pancreas is healthy.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"
