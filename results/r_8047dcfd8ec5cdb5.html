 At 2.52, this is within the optimal range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4184","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4138","upper_optimal_position":"0.6034","units":"mmol/L","description":"Phosphate works with calcium for bone and tooth strength and is essential for energy production. At 1.0, this is within the optimal range.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malabsorption, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive intake, cell breakdown","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6379","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6172","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function, and sleep regulation. At 1.06, this is within the laboratory range but just above the optimal upper limit of 1.05. This is effectively at the top of the ideal band and is a positive finding. Magnesium supports relaxation, sleep quality, and stress resilience.","low_causes":"Poor dietary intake, alcohol, diuretics, malabsorption, diabetes","high_causes":"Kidney disease, excessive supplementation, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrectedsodium","name":"Glucose-Corrected Sodium","group":"ELECTROLYTES & MINERALS","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mmol/L","description":"Glucose-corrected sodium adjusts sodium for the dilutional effect of elevated blood glucose. At a glucose of 4.3, the correction is negligible, and the corrected sodium of 141 matches the measured sodium. This is reported for context and is not applicable at present.","low_causes":"Overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"serumosmolality","name":"Calculated Serum Osmolality","group":"ELECTROLYTES & MINERALS","result":"292.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"275","upper_normal":"295","lower_optimal":"280","upper_optimal":"292","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6167","units":"mOsm/kg","description":"Serum osmolality estimates the concentration of dissolved particles in the blood and reflects hydration status. At 292.4, this is within the laboratory range but just above the optimal upper limit of 292. This suggests borderline hydration and is consistent with the specific gravity of 1.015 in the urine. Increasing daily water intake would be a simple improvement.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"68","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2833","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4762","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a hormone produced in the skin by sunlight and essential for bone health, immune function, mood, and testosterone production. At 68, this is sufficient (above the deficiency threshold of 30 and the insufficiency threshold of 50) but below the optimal level of 75 to 120. Given the season (October in the UK), levels will drop further over winter without supplementation. Supplementing with 3,000 IU of vitamin D3 daily with food will bring this into the optimal range.","low_causes":"Lack of sunlight, dark skin, obesity, malabsorption, northern latitude, winter","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5253","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4053","upper_optimal_position":"0.5720","units":"pmol/L","description":"Parathyroid hormone (PTH) regulates calcium and phosphate balance by controlling how much calcium the kidneys retain and how much the bones release. At 3.2, this is within the optimal range, confirming normal calcium regulation. The normal PTH alongside a healthy corrected calcium is reassuring.","low_causes":"Hypoparathyroidism, magnesium deficiency, high calcium","high_causes":"Hyperparathyroidism, vitamin D deficiency, chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"322","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3876","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4558","upper_optimal_position":"0.5819","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. At 322, this is within the laboratory range (193 to 982) but below the optimal level of 500. B12 below 500 is associated with fatigue, low mood, brain fog, and reduced energy, all of which are reported symptoms. Sublingual methylcobalamin at 1,000 mcg daily is the most effective way to raise B12 because it bypasses any absorption issues in the gut.","low_causes":"Poor dietary intake (especially vegan/vegetarian), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5476","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, cell division, and red blood cell production. At 13, this is within the optimal range. Adequate folate alongside B12 ensures healthy red cell production and supports mental health.","low_causes":"Poor dietary intake, alcohol, malabsorption, medications, pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.12","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver. It is one of the most useful markers for assessing cardiovascular risk. At 1.2, this is within the laboratory range (limit 5) but above the optimal level of below 1.0. A CRP between 1 and 3 is classified as moderate cardiovascular risk by the American Heart Association. In the context of an elevated lipid panel, this adds to the overall cardiovascular risk picture. The most common drivers are visceral fat, poor diet quality, alcohol, and lack of exercise.","low_causes":"Healthy lifestyle, low inflammation","high_causes":"Infection, chronic inflammation, obesity, smoking, metabolic syndrome, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7737","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including LDL, HDL, and VLDL. At 8.0, this is well above the desirable level of below 5.18. Total cholesterol alone does not tell the full story because it includes protective HDL, but at 8.0, the number is driven predominantly by very high LDL. This level needs active management.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, lack of exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.52","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7412","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily in VLDL particles. They rise after eating and are stored as body fat. At 2.52, this is above the fasting target of 1.70 and well above the optimal level of below 1.0. Elevated triglycerides are driven by refined carbohydrates, sugar, fructose, alcohol, and excess calories. They are an independent cardiovascular risk factor and contribute to the production of small, dense LDL particles. Reducing sugar, ultra-processed food, and alcohol will bring this down.","low_causes":"Low fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High carbohydrate diet, sugar, alcohol, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7372","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) is the particle that carries triglycerides from the liver into the blood. At 1.15, this is above the upper limit of 0.78, reflecting the elevated triglyceride production. VLDL is remodelled in the blood into smaller, denser LDL particles, which are more atherogenic. Reducing triglyceride production through dietary changes will lower VLDL.","low_causes":"Low fat diet, malabsorption","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4194","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective cholesterol fraction that removes cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. At 1.30, this is above the high-risk threshold of 1.04 but below the desirable level of 1.55 and below the optimal of 1.4 for a male. HDL is most effectively raised by regular exercise, particularly vigorous exercise, and by moderate alcohol reduction (paradoxically, moderate alcohol can raise HDL, but the net cardiovascular effect of 5 to 9 drinks per week is negative). Starting resistance and cardio training will be the most effective way to raise this.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, poor diet","high_causes":"Regular exercise, moderate alcohol, genetic factors, medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8853","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) carries cholesterol from the liver into the artery walls. It is the primary driver of atherosclerosis, the buildup of plaque that causes heart attacks and strokes. At 5.56, this is nearly double the upper limit of 3.0 and more than double the optimal target of below 2.6. This is the most important lipid number in the report. Every 1 mmol/L reduction in LDL reduces cardiovascular events by approximately 22%. Diet, exercise, weight management, and potentially statin therapy are all effective at lowering LDL.","low_causes":"Hyperthyroidism, malabsorption, liver disease, very low fat diet","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"6.15","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6833","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a simple measure of cardiovascular risk. At 6.15, this is above the target of below 4.5, driven by the very high total cholesterol and the below-optimal HDL. A ratio above 6 carries significantly increased cardiovascular risk.","low_causes":"High HDL, low total cholesterol","high_causes":"High LDL, low HDL, high triglycerides","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"16.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4063","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the total is protective. At 16.25%, this is below the target of above 20%, meaning too little of the total cholesterol is the protective HDL fraction. Raising HDL through exercise and lowering LDL through diet will improve this ratio.","low_causes":"Sedentary lifestyle, obesity, high LDL, metabolic syndrome","high_causes":"Regular exercise, healthy weight, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8375","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol in one number: LDL, VLDL, and remnants. At 6.7, this is well above the target of below 4.0. Non-HDL is considered a more complete measure of atherogenic cholesterol than LDL alone because it includes triglyceride-rich particles.","low_causes":"Low LDL, healthy diet","high_causes":"High LDL, high triglycerides, poor diet, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6292","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA-I is the main protein in HDL particles and reflects the capacity of the reverse cholesterol transport system. At 1.51, this is above the minimum of 1.20 and within the optimal range above 1.40. This is a genuine positive within an otherwise concerning lipid panel and means the protective arm of lipid metabolism is functioning adequately.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single protein on every LDL, VLDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this is a direct count of the atherogenic particles in the blood and is considered the best single predictor of cardiovascular risk. At 1.82, this is classified as \"very high\" (above 1.4) and is more than double the desirable target of below 0.9. Every one of these particles has the potential to enter an artery wall and contribute to plaque. This number drives the urgency of the GP conversation.","low_causes":"Low LDL, healthy diet, statin therapy","high_causes":"High LDL, familial hypercholesterolaemia, high saturated fat diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.2053","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8609","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A-I ratio compares the number of atherogenic particles (ApoB) to the protective capacity (ApoA-I). It is the single best summary of the lipid balance. At 1.21, this is well above the lower-risk threshold of 0.7 and places him in the higher-risk category. The ratio is driven predominantly by the very high ApoB of 1.82. Reducing ApoB through diet, exercise, and potentially medication will bring this ratio down.","low_causes":"Low ApoB, high ApoA-I, healthy lifestyle","high_causes":"High ApoB, low ApoA-I, poor diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"37.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5922","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a modified LDL particle with an extra protein (apolipoprotein(a)) attached. It is stickier than regular LDL, more inflammatory, and promotes blood clotting. Critically, Lp(a) levels are almost entirely genetically determined: they are set at birth and cannot be meaningfully changed by diet, exercise, or most medications. At 37.9, this is slightly above the 32 nmol/L threshold, placing it in the \"slightly increased risk\" category (32 to 90). This should be recorded permanently in medical notes because it will never change. First-degree relatives (parents, siblings, children) should be offered testing. The useful information here is that the vast majority of the elevated LDL is modifiable, because after correcting for Lp(a), LDL is still 5.44.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"116","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4238","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6071","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle and heart tissue. It rises with muscle damage from exercise, injury, or disease. At 116, this is within the optimal range and confirms no significant muscle damage. In someone not currently exercising, this baseline is useful for comparison if resistance training is started.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Strenuous exercise, muscle injury, rhabdomyolysis, statin therapy, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5179","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4554","upper_optimal_position":"0.5848","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone, produced by the thyroid gland and converted into the active form (T3) in tissues. At 17.7, this sits in the optimal range of 14 to 20, meaning the thyroid is producing an ideal amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3829","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4399","upper_optimal_position":"0.5451","units":"mIU/L","description":"TSH is released by the pituitary gland to tell the thyroid how much hormone to produce. It works like a thermostat: when thyroid hormone drops, TSH rises to demand more. At 1.24, this is within the ideal range of 1.0 to 2.5, meaning the pituitary is satisfied with the amount of thyroid hormone being produced. This rules out both overactive and underactive thyroid.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4222","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, energy, mood, and body temperature in every cell. At 5.6, this is within the optimal range of 4.5 to 6.5. Good T3 levels mean the body is converting T4 to T3 efficiently, which is confirmed by the healthy FT3:FT4 ratio.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, thyroiditis, excessive T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland. Their presence indicates autoimmune thyroid disease, most commonly Hashimoto's thyroiditis. At below 6.6, these are well below the threshold of 13.8, which rules out autoimmune thyroid disease.","low_causes":"Normal thyroid immunity","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. At below 1.3, this is undetectable and confirms the absence of autoimmune thyroid disease, consistent with the negative TPO antibodies.","low_causes":"Normal thyroid immunity","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.316","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3:FT4 ratio measures how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.316, this is within the optimal range, confirming efficient thyroid hormone conversion. Poor conversion is sometimes a cause of persistent fatigue even when TSH and FT4 are normal, but that is not the case here.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"PSA (Total)","group":"PROSTATE","result":"0.26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.052","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"ng/ml","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. It is used as a screening marker for prostate conditions including benign enlargement and prostate cancer. At 0.26, this is very low and reassuring. It establishes a useful baseline for future comparison.","low_causes":"Normal prostate health","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"Free PSA is the unbound fraction of total PSA. The ratio of free to total PSA helps distinguish benign prostate conditions from malignancy. At 0.13, with a total PSA of 0.26, the free-to-total ratio is 50%, which is very reassuring (above 25% favours benign).","low_causes":"Normal prostate","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"PSA Ratio","group":"PROSTATE","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA ratio is the free PSA divided by total PSA. At 0.50, this is well above the normal threshold of 0.19 and is very reassuring. A high ratio strongly favours benign prostate health.","low_causes":"Possible prostate malignancy (requires further investigation)","high_causes":"Benign prostate, normal prostate health","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"10.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1449","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker associated with pancreatic, biliary, and gastrointestinal cancers. It is used for screening and monitoring rather than diagnosis. At 10.72, this is well within the normal range and provides reassurance.","low_causes":"Normal, Lewis antigen negative individuals (cannot produce CA 19-9)","high_causes":"Pancreatic cancer, biliary disease, pancreatitis, bowel inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3435","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a tumour marker associated with colorectal and other gastrointestinal cancers. At 1.58, this is within the non-smoker range of 0 to 2.3 and is reassuring.","low_causes":"Normal health","high_causes":"Colorectal cancer, other GI cancers, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4965","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3860","upper_optimal_position":"0.6140","units":"g/L","description":"IgG is the most abundant immunoglobulin in the blood and provides the majority of antibody-based immunity against infections. At 11.2, this is within the laboratory range and indicates a functioning adaptive immune system.","low_causes":"Immune deficiency, medications, kidney disease","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody produced in response to a new infection. At 0.8, this is within the laboratory range and confirms a normal initial immune response.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, autoimmune disease, lymphoma, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4839","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, airways, and urinary tract. At 1.8, this is within the laboratory range. Adequate IgA also validates the coeliac screen (which uses IgA-based antibodies), confirming the negative result is reliable.","low_causes":"Selective IgA deficiency (common, usually harmless), immune deficiency","high_causes":"Chronic infection, liver disease, autoimmune disease, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"120","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"75","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"IU/ml","description":"IgE is the immunoglobulin associated with allergic responses. It drives the release of histamine from mast cells, causing symptoms like sneezing, itching, rashes, and airway narrowing. At 120, this is above the upper limit of 100, suggesting the immune system has an atopic tendency, meaning it is primed for allergic-type reactions. This does not diagnose a specific allergy but may explain symptoms such as hay fever, eczema, food sensitivities, or unexplained skin reactions. If any of these are present, specific allergen testing (RAST or skin prick) through the GP could identify the triggers.","low_causes":"Low allergic tendency, immune deficiency","high_causes":"Allergies (hay fever, eczema, asthma), parasitic infection, drug reactions, atopic dermatitis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"<4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis and other autoimmune conditions. At below 4, this is well within the normal range and rules out rheumatoid factor-positive autoimmune disease.","low_causes":"Normal immune function","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infection, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA (Coeliac)","group":"AUTOIMMUNE & CELIAC","result":"0.674","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0469","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"This is a screening test for coeliac disease, an autoimmune condition in which gluten triggers damage to the lining of the small intestine. At 0.674, this is negative (well below the 7.19 threshold) and rules out coeliac disease, provided a gluten-containing diet is being followed, which it is. This exclusion is useful because coeliac can cause fatigue, headaches, and mood changes.","low_causes":"No coeliac disease","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"2.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4043","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals, which are molecules that damage cells. At 2.28, this is above the upper limit of 1.77. An elevated total antioxidant activity is not a concern; it reflects a higher-than-expected antioxidant capacity, which may come from dietary antioxidants, supplements, or uric acid (uric acid is itself an antioxidant). Given the elevated uric acid of 521, this likely contributes to the high total antioxidant reading.","low_causes":"Poor dietary antioxidant intake, chronic disease, oxidative stress","high_causes":"High dietary antioxidant intake, supplementation, elevated uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"275","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3820","upper_optimal_position":"0.5821","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and dropping through the day. At 275, this is within the optimal range for a morning sample. Normal cortisol rules out adrenal insufficiency and Cushing's syndrome.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid medications, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2703","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4449","units":"pmol/L","description":"Oestradiol is the primary oestrogen in males, produced in small amounts by the testes and by conversion of testosterone in fat tissue. At 79, this is within the male reference range and the optimal band. In men, oestradiol is important for bone health, brain function, and cardiovascular protection, but excessive levels can cause breast tenderness or gynaecomastia.","low_causes":"Low testosterone, low body fat, aromatase inhibitors","high_causes":"Obesity, liver disease, excessive aromatisation of testosterone, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"1.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3668","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5721","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. It plays a role in balancing other hormones and supporting neurological function. At 1.19, this is within the range and not a concern.","low_causes":"Adrenal insufficiency, low testosterone","high_causes":"Adrenal tumour, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"3.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4211","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5897","units":"mIU/ml","description":"LH (luteinising hormone) is released by the pituitary gland to stimulate the testes to produce testosterone. At 3.59, this is within the optimal range. In the context of low testosterone, a normal LH raises the question of whether the pituitary is responding appropriately to the low testosterone signal, or whether the brain's feedback setpoint is suppressed by lifestyle factors, weight, or medication.","low_causes":"Pituitary disease, steroid use, opioids, obesity","high_causes":"Primary testicular failure, Klinefelter's syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"4.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3904","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"12.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5693","units":"mIU/ml","description":"FSH (follicle stimulating hormone) is released by the pituitary gland to stimulate sperm production in the testes. At 4.09, this is within the optimal range, suggesting normal pituitary signalling and sperm production capacity.","low_causes":"Pituitary disease, steroid use, opioids","high_causes":"Primary testicular failure, Klinefelter's syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"9.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3975","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for sex drive, muscle mass, bone density, mood, energy, and red blood cell production. At 9.7, this is within the laboratory range (8.4 to 28.7) but below the recommended level of above 12 and well below the optimal range of 18 to 30. At 34, this is low and connects directly to the reported symptoms of low sex drive, low energy, and low mood. The main modifiable drivers of low testosterone at this age are lack of exercise (particularly resistance training), poor diet quality, alcohol, poor sleep quality, and stress. The SNRI medication may also contribute. A morning fasted repeat is recommended to confirm, and if it remains below 12, further investigation is warranted.","low_causes":"Obesity, sedentary lifestyle, alcohol, poor sleep, stress, medications (SNRIs, opioids), pituitary disease, primary testicular failure","high_causes":"Steroid use, adrenal tumour, testicular tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3636","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a pituitary hormone that, when elevated in men, can suppress testosterone and libido. At 76, this is within the optimal range and rules out a prolactin-producing pituitary adenoma as a cause of the low testosterone.","low_causes":"Generally not clinically significant","high_causes":"Pituitary adenoma (prolactinoma), medications (antipsychotics, SSRIs/SNRIs), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"31.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3474","lower_normal":"30","upper_normal":"150","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is calculated from total testosterone and SHBG and reflects the proportion of testosterone available to tissues. At 31.7, this is just above the lower limit of 30 and below the optimal range of 40 to 120. It confirms that most of the already-low testosterone is being bound by SHBG, leaving little available for the tissues that need it. This is consistent with the reported symptoms.","low_causes":"Low testosterone, high SHBG, ageing, liver disease","high_causes":"Steroid use, PCOS (in women), low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2,322.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4813","lower_normal":"162.14","upper_normal":"4939.9","lower_optimal":"800","upper_optimal":"4000","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4667","upper_optimal_position":"0.6333","units":"ug/dL","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. The lab reported 6.3 umol/L, which converts to approximately 2,323 ug/dL. This is within the optimal range and confirms healthy adrenal function. Adequate DHEA-S supports energy, immune function, and hormone production.","low_causes":"Adrenal insufficiency, chronic stress, ageing","high_causes":"Adrenal tumour, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"30.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4243","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3820","upper_optimal_position":"0.6078","units":"nmol/L","description":"SHBG (sex hormone binding globulin) is a protein that binds testosterone in the blood, making it unavailable to tissues. At 30.6, this is within the optimal range and not unusually high. This means the low free androgen index and the low testosterone are not caused by SHBG over-binding; the issue is genuinely low testosterone production.","low_causes":"Obesity, insulin resistance, hypothyroidism, steroid use","high_causes":"Liver disease, hyperthyroidism, ageing, oestrogen, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{" // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
