upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol and captures all the atherogenic (artery-damaging) lipoproteins including LDL, VLDL and Lp(a). Her result of 5.6 is above the 4.0 threshold, confirming the elevated burden of harmful cholesterol particles seen in the ApoB result.","low_causes":"Low cholesterol production, hyperthyroidism","high_causes":"Diet, genetic predisposition, hypothyroidism, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5214","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and drives their protective function, enabling cholesterol removal from artery walls. Her result of 2.12 is well above the 1.4 threshold and within the optimal range, confirming excellent HDL particle quality and function. This is one of the strongest results in her lipid panel.","low_causes":"Metabolic syndrome, smoking, sedentary lifestyle, genetic factors","high_causes":"Exercise, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.61","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8944","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein carried on every LDL, VLDL and Lp(a) particle. Because each particle carries exactly one ApoB molecule, this result directly counts the number of atherogenic particles in the blood, making it a better predictor of cardiovascular risk than LDL cholesterol alone. Her result of 1.61 is nearly double the desirable threshold of 0.9 and well above the optimal target of 0.8. This is the most important lipid number in her report and the primary target for improvement through dietary changes and, if needed, medical treatment.","low_causes":"Low cholesterol production, hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, insulin resistance, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.759","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6325","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio is the single best summary of the balance between harmful and protective cholesterol particles. Her result of 0.759 is in the average-risk band (0.6 to 0.8 for women), above the lower-risk threshold of 0.6. The numerator (ApoB 1.61) is driving this ratio up, while the denominator (ApoA1 2.12) is doing its best to counterbalance. Reducing ApoB through diet will bring this ratio down.","low_causes":"High HDL, low LDL","high_causes":"High LDL/ApoB, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"65.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined cholesterol particle that deposits cholesterol in artery walls, promotes blood clotting and drives inflammation. Unlike LDL, Lp(a) is almost entirely inherited and does not change with diet, exercise or most medications. Her result of 65.34 is above the 32 nmol/L threshold, placing her in the slightly increased risk category (32 to 90). This is a permanent piece of her cardiovascular risk profile. It should be recorded in her permanent medical record and never needs to be retested because it does not change. Her first-degree relatives (parents, siblings, children) should be offered Lp(a) testing because it runs in families. The reassuring aspect is that her Lp(a) is not in the high-risk categories, and reducing her modifiable LDL will offset most of the inherited risk.","low_causes":"Genetic, not modifiable","high_causes":"Genetic, not modifiable","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3952","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle tissue that is released into the blood when muscles are damaged or worked hard. Her result of 53 is within the normal and optimal ranges, indicating no significant muscle damage from her training.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"13.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the main hormone produced by the thyroid gland. It circulates in the blood and is converted into the more active T3 in tissues throughout the body. Her result of 13.9 is within the laboratory range of 11.5 to 22.7 but just below the optimal threshold of 14. While this is not hypothyroid, a FT4 sitting at the lower end of the range can contribute to fatigue, hair changes and elevated LDL cholesterol because thyroid hormone helps clear LDL from the bloodstream. With negative thyroid antibodies, autoimmune thyroid disease is excluded, but this is worth monitoring with a repeat in six months.","low_causes":"Hypothyroidism, pituitary dysfunction, sick euthyroid syndrome, medications","high_causes":"Hyperthyroidism, excess thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4773","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3773","upper_optimal_position":"0.4948","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how hard to work. A high TSH means the pituitary is having to push harder because the thyroid is not producing enough hormone; a low TSH means the thyroid is overproducing. Her result of 2.38 is within the optimal range of 1.0 to 2.5, which is reassuring and suggests the pituitary is comfortable with the current thyroid output, even though FT4 is sitting just below ideal.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, iodine deficiency, thyroid autoimmunity, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells actually use for metabolism, energy production and temperature regulation. It is produced by converting FT4 in the liver, kidneys and other tissues. Her result of 4.7 is within the optimal range of 4.5 to 6.5, confirming that she is converting T4 to T3 adequately. This is a positive finding because it means the active hormone is where it should be, even though FT4 is slightly below ideal.","low_causes":"Hypothyroidism, sick euthyroid syndrome, calorie restriction, chronic illness","high_causes":"Hyperthyroidism, excess T3 medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as happens in Hashimoto's thyroiditis. Her result of below 6.6 is well within the normal range of below 13.8, which rules out TPO-driven autoimmune thyroid disease. Given her family history of thyroid disease, this is a particularly valuable exclusion.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to produce its hormones. Elevated levels can indicate autoimmune thyroid disease. Her result of below 1.3 is well within the normal range of below 4.4, with more than 80% of the population having undetectable levels. Combined with the negative TPO antibodies, this confirms no autoimmune thyroid process is present.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer (monitoring)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.338","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5173","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3:FT4 ratio measures how efficiently the body converts the inactive thyroid hormone (T4) into the active form (T3). Her result of 0.338 is within the normal and optimal ranges, confirming good thyroid hormone conversion. This is driven by her FT3 being in the optimal range despite FT4 sitting just below ideal.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca1","name":"CA125","group":"TUMOR MARKERS","result":"33.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4757","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"U/mL","description":"CA125 is a protein that can be elevated in ovarian cancer but is also raised by many benign conditions including endometriosis, fibroids, menstruation, pelvic inflammatory disease and liver disease. Her result of 33.3 is within the laboratory range of below 35 but in the upper portion. Given her heavy, painful periods, a mildly elevated CA125 can be associated with endometriosis or uterine fibroids. This is not a cancer marker in isolation and is not cause for alarm, but it adds context to the menstrual symptoms and may be worth discussing with her GP.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, menstruation, pelvic inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca15","name":"CA15-3","group":"TUMOR MARKERS","result":"18.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3052","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"U/mL","description":"CA15-3 is a protein used primarily in monitoring breast cancer. Her result of 18.31 is within the normal range of below 30 and within the optimal range. Given her family history of cancer, this is a reassuring finding.","low_causes":"Not clinically significant","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type": ts":"g/L","description":"IgG (immunoglobulin G) is the most abundant antibody in the blood and provides long-term immunity against infections the body has previously encountered. Her result of 16.4 is marginally above the upper limit of 16.0. A mildly raised IgG can reflect chronic immune stimulation, recent or resolving infection, or autoimmune activation. In her case, alongside the raised lymphocytes and the significantly raised IgE, it suggests the immune system is in a state of heightened activity. The small margin above range means this is not alarming on its own, but it contributes to the overall immune picture that needs GP review.","low_causes":"Immune deficiency, medications, nephrotic syndrome","high_causes":"Chronic infection, autoimmune conditions, liver disease, chronic immune stimulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/L","description":"IgM (immunoglobulin M) is the first antibody the body produces in response to a new infection. Her result of 2.2 is within the normal range of 0.5 to 3.0, suggesting no active primary immune response.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, autoimmune conditions, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5161","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6344","units":"g/L","description":"IgA (immunoglobulin A) is the antibody found predominantly in mucosal surfaces such as the gut, lungs and urinary tract, where it provides first-line defence. Her result of 2.1 is within the normal and optimal ranges. An adequate IgA also confirms that the coeliac screen (tTG IgA) is reliable, because IgA deficiency can cause false-negative coeliac results.","low_causes":"Selective IgA deficiency (genetic), medications","high_causes":"Liver disease, coeliac disease, chronic infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"236","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"60","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"IU/mL","description":"IgE (immunoglobulin E) is the antibody class involved in allergic responses and defence against parasites. Her result of 236 is more than double the upper limit of 100, indicating a significant allergic tendency. This could be driven by environmental allergens (dust mites, pollen, pet dander, mould), food sensitivities, eczema, asthma or, less commonly, parasitic infection (though her normal eosinophils make this unlikely). The raised IgE may be connected to her bloating symptoms if a food sensitivity is contributing. Her GP should take an allergy-focused history, and if specific triggers are suspected, specific IgE testing (blood tests for individual allergens) or skin prick testing would help identify them.","low_causes":"Not clinically significant","high_causes":"Allergic conditions, atopic dermatitis, asthma, parasitic infection, hyper-IgE syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rf","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/mL","description":"Rheumatoid factor is an antibody that can be elevated in rheumatoid arthritis and other autoimmune conditions. Her result of 4 is well within the normal range of below 14, effectively ruling out rheumatoid arthritis as a cause of any joint symptoms.","low_causes":"Not clinically significant","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, chronic infections, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.685","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0476","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"CU","description":"Tissue transglutaminase IgA (tTG IgA) is the primary screening test for coeliac disease, an autoimmune condition where gluten triggers damage to the small intestine. Her result of 0.685 is well below the negative threshold of 7.19, effectively ruling out coeliac disease as a cause of her bloating and digestive discomfort, provided she has been eating a gluten-containing diet. Her normal IgA level confirms the test is reliable.","low_causes":"No coeliac disease (on gluten-containing diet)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7389","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4762","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the overall capacity of the blood to neutralise free radicals and prevent oxidative damage to cells. Her result of 1.96 is above the upper limit of 1.77. This is almost certainly being driven by her omega-3 fish oil supplementation, which increases antioxidant capacity. This is not a concern and is in fact a positive finding, reflecting enhanced protection against oxidative stress.","low_causes":"Poor diet, low fruit and vegetable intake, chronic disease, smoking","high_causes":"Antioxidant supplementation, high fruit and vegetable intake, omega-3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"273","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3601","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3719","upper_optimal_position":"0.5817","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural rhythm, peaking in the morning and declining through the day. Her morning result of 273 is within the normal range and within the optimal band. This rules out adrenal insufficiency (Addison's disease) and suggests her adrenal response is appropriate. Her afternoon energy crash, combined with a normal morning cortisol, may reflect a natural dip in cortisol rhythm that is being amplified by dietary patterns or sleep architecture.","low_causes":"Adrenal insufficiency, pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, medications (prednisolone)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"423","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"204.8","upper_normal":"786.1","lower_optimal":"204.8","upper_optimal":"786.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"Oestradiol is the primary oestrogen and the main female sex hormone, essential for reproductive function, bone density, skin health, mood and cardiovascular protection. Her result of 423 falls within the luteal phase range (204.8 to 786.1), which, together with her progesterone at 28.25, is consistent with the luteal phase of her menstrual cycle. This confirms she is still producing oestrogen and ovulating, which is expected at 49 even as the perimenopause progresses.","low_causes":"Menopause, perimenopause, low body fat, eating disorders, pituitary dysfunction","high_causes":"Ovulation, pregnancy, oestrogen therapy, obesity, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"28.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5835","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"14","upper_optimal":"60","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3812","upper_optimal_position":"0.6312","units":"nmol/L","description":"Progesterone is produced by the ovary after ovulation and is essential for preparing the uterine lining for pregnancy, supporting mood and counterbalancing oestrogen. Her result of 28.25 falls within the luteal phase range (10.62 to 81.28), confirming that ovulation has occurred this cycle. A progesterone above 10 in the luteal phase is considered confirmation of ovulation.","low_causes":"Anovulation, perimenopause, luteal phase deficiency","high_causes":"Luteal phase, pregnancy, ovarian cysts, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"11.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5362","lower_normal":"0.5","upper_normal":"16.9","lower_optimal":"1.0","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3364","upper_optimal_position":"0.6187","units":"mIU/mL","description":"LH (luteinising hormone) is produced by the pituitary gland and triggers ovulation and stimulates progesterone production by the ovary. Her result of 11.91 falls within the luteal phase range of 0.5 to 16.9. In the context of perimenopause, LH can fluctuate considerably between cycles.","low_causes":"Pituitary dysfunction, hormonal contraceptives, eating disorders","high_causes":"Perimenopause, menopause, PCOS, ovulation surge","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"18.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"1.5","upper_normal":"9.1","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3399","upper_optimal_position":"0.6183","units":"mIU/mL","description":"FSH (follicle stimulating hormone) is produced by the pituitary gland and stimulates the ovaries to develop follicles (eggs). Her result of 18.4 is above the follicular phase range of 2.5 to 10.2 and above the luteal phase range of 1.5 to 9.1, but below the postmenopausal threshold of 23.0. In combination with her still having regular (if heavy) periods and a positive progesterone confirming ovulation, this elevated FSH is the hallmark of perimenopause: the ovaries are requiring more stimulation from the pituitary to function. This is the hormonal context for many of her symptoms including fatigue, low libido and hair thinning, and it represents a normal physiological transition rather than a disease.","low_causes":"Hormonal contraceptives, pituitary dysfunction, pregnancy","high_causes":"Perimenopause, menopause, premature ovarian insufficiency, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4127","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.5873","units":"nmol/L","description":"Testosterone is essential for women as well as men, playing a role in libido, muscle mass, bone density, energy, mood and hair health. Her result of 1.0 is within the laboratory range of 0.5 to 2.6 but below the optimal threshold of 1.2, sitting in the lower third. At 49 with perimenopausal hormone changes, declining testosterone is expected, but it is a plausible contributor to her low libido and hair thinning. There is no straightforward supplement that safely raises female testosterone; this is a conversation for her GP or a menopause-aware clinician, particularly if HRT is being considered, as testosterone can be included in a menopause management plan.","low_causes":"Ageing, perimenopause, adrenal insufficiency, oral contraceptives, low DHEA-S","high_causes":"PCOS, adrenal tumours, congenital adrenal hyperplasia, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4461","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"","description":"The free androgen index (FAI) estimates the proportion of testosterone that is biologically active by dividing total testosterone by SHBG. Her result of 2.53 is within the normal and optimal ranges. Despite her total testosterone being at the lower end, the FAI is adequate because her SHBG at 39.5 is not excessively high, meaning a reasonable proportion of her testosterone is available to tissues.","low_causes":"Low testosterone, high SHBG, ageing","high_causes":"PCOS, insulin resistance, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dhea","name":"DHEA-Sulphate","group":"HORMONES","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3638","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3828","upper_optimal_position":"0.5543","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It is the most abundant steroid hormone in the body and declines steadily with age. Her result of 0.9 umol/L (approximately 332 ug/dL) is within the laboratory range but below the optimal threshold. At 49, a declining DHEA-S is physiologically expected but contributes to the overall picture of lower androgen availability, which connects to her low libido and hair thinning.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumours, congenital adrenal hyperplasia, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"296","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4786","lower_normal":"59","upper_normal":"619","lower_optimal":"100","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3738","upper_opti "group":"INFLAMMATION","result":"0.69","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1150","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio (NLR) divides neutrophils by lymphocytes and is used as a marker of systemic inflammation and immune balance. Her result of 0.69 is below the lower limit of 1.0, driven entirely by the elevated lymphocyte count (the denominator). A low NLR from lymphocytosis is not an independent inflammatory concern but rather a mathematical consequence of the raised lymphocytes. This ratio will normalise when the cause of the lymphocytosis is identified and addressed.","low_causes":"Elevated lymphocytes, viral infection, allergic activation","high_causes":"Bacterial infection, chronic stress, systemic inflammation, tissue damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"41.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2918","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio (PLR) divides the platelet count by the lymphocyte count and is used as a marker of inflammation and immune balance. Her result of 41.3 is below the lower limit of 60, driven entirely by her elevated lymphocyte count (4.29) inflating the denominator. Her platelets at 177 are within range. This is a mathematical consequence of the lymphocytosis rather than a separate inflammatory finding, and it will normalise when the lymphocyte count is explained.","low_causes":"Elevated lymphocy egular exercise","high_causes":"Insulin resistance, high carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3625","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated by subtracting both HDL and LDL from total cholesterol. It represents the cholesterol carried by VLDL and other triglyceride-rich particles, which are increasingly recognised as an independent cardiovascular risk factor. Her result of 0.58 is within the laboratory range of below 0.8 but above the optimal threshold of 0.5. This mirrors the triglyceride level and will improve with the same dietary changes.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"4.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8017","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"The Lp(a)-corrected LDL subtracts the cholesterol contribution of Lp(a) from the total LDL, showing how much of the LDL elevation is modifiable through diet and medication versus how much is inherited via Lp(a). Her corrected LDL of 4.81 is still well above the 3.0 threshold, confirming that the vast majority of her LDL elevation is driven by modifiable factors rather than Lp(a). This is actually useful information because it means diet, exercise and, if needed, medication can make a substantial difference.","low_causes":"Low cholesterol production, effective statin therapy","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.178","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5598","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from triglycerides and HDL and reflects the balance between atherogenic (artery-damaging) and protective lipids. Her result of minus 0.178 is within the optimal range, reflecting her excellent HDL and reasonable triglycerides. This is one of the positive aspects of her lipid profile.","low_causes":"High HDL, low triglycerides","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3257","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II ratio divides LDL by HDL and is used as a cardiovascular risk marker. Her result of 2.28 is within the optimal range of below 2.5, pulled down by her very high HDL of 2.2. This ratio looks more favourable than the ApoB because the excellent HDL is masking the high LDL. The ApoB remains the more important number for guiding treatment.","low_causes":"High HDL, low LDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"agratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3190","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"","description":"The albumin-to-globulin ratio (A/G ratio) compares the two main protein groups in the blood. A low ratio can indicate excess globulin production (from immune activation, chronic infection or liver disease) or low albumin. Her result of 1.08 is just below the lower limit of 1.1, driven by her globulin being at the top of its range (36 g/L) due to the raised IgG and IgE, while her albumin at 39 is slightly below optimal. This is a mathematical consequence of the immune findings rather than a separate problem.","low_causes":"Elevated globulins, low albumin, chronic infection, autoimmune conditions, liver disease","high_causes":"Low globulins, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1816","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"The FIB-4 score is a screening tool that uses age, AST, ALT and platelet count to estimate the likelihood of liver fibrosis (scarring). Her score of 0.97 is comfortably below the 1.3 threshold for further investigation, which, alongside her excellent liver enzymes, rules out significant liver fibrosis."," // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';

  // detail

    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;

    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
