const REPORT_DATA = {"patient_name":"Sonia Barca","dob":"25/02/1977","report_date":"2026-10-12","summary":"Patient is a 49-year-old female presenting with a BMI of 26.3, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are slightly below average (volume 4 out of 10). She trains four times per week (two cardio, two resistance) at moderate intensity with 7,500 to 10,000 daily steps. She sleeps 6 to 7 hours and wakes feeling refreshed, though energy follows an afternoon crash pattern. Stress feels hard to manage some weeks. She does not drink alcohol. She supplements with omega-3 fish oil, protein powder and iron. Her family history includes bowel, breast, prostate or ovarian cancer, thyroid disease and dementia. She has had a previous blood test where something was flagged. She reports low energy and fatigue, low sex drive and libido, bloating and digestive discomfort, and hair thinning and hair loss. Her goals are to balance hormones, improve digestion and gut health, and reduce stress and anxiety.\n\nThis report contains one finding that should go to her GP promptly. Her PhenoAge, a biological ageing score built from nine blood markers, comes out at 69.2 against her calendar age of 49, twenty years older. That gap is driven principally by her raised lymphocyte count and her elevated RDW (red cell distribution width, which measures how much variation there is in the size of her red blood cells), and it flags a pattern the GP should investigate rather than a diagnosis in itself. The lymphocyte count at 4.29 is above the upper limit of 3.0, and the RDW at 21.9 is well above the upper limit of 14.0. Together these two results are responsible for most of the PhenoAge gap and both need clinical explanation. We will return to them below.\n\nHer Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from her lipid markers, inflammation and blood sugar, is 50 out of 100, above the flagged threshold of 40. That score is being driven by her ApoB at 1.61, her LDL at 5.02 and her Lp(a) at 65.34. The Lp(a) is inherited and unchangeable, but the LDL and ApoB are modifiable, and bringing them down will pull the score with them.\n\nBefore working through the concerns, there is a good deal of genuinely positive news in this report, and it matters because it narrows down what is actually going on. Her liver is in excellent health. ALT (alanine aminotransferase, the main enzyme that rises when liver cells are under strain) is 21, well within the ideal range for a woman, and Gamma GT (gamma-glutamyl transferase, the enzyme most sensitive to metabolic load, alcohol and medication) is just 11, about as clean as that marker gets. Her FIB-4 score, an index that screens for liver scarring, is 0.97, comfortably below the threshold of 1.45, and every other liver marker is normal. Her APRI (AST-to-platelet ratio index, another fibrosis screen) is 0.226, well within range. Her kidneys are working well. Creatinine is 59 with a creatinine-based eGFR above 90, and Cystatin C, a more accurate kidney marker that is not affected by muscle mass, is 1.07 giving a Cystatin C eGFR of 87, which at 49 is reasonable and within the normal range though just below the optimal threshold of 90. The combined eGFR is 87. Her uric acid at 281 is within range. Her electrolytes are balanced, with sodium, chloride, bicarbonate and magnesium all within normal limits. Her magnesium at 1.05 sits right at the top of the optimal band, which is genuinely good to see. Her fasting glucose at 5.1 is within the ideal range, and her HbA1c (glycated haemoglobin, a measure of average blood sugar over the past three months) at 34 mmol/mol is excellent, well below the 42 threshold for concern. Her inflammatory marker hsCRP (high-sensitivity C-reactive protein, which measures low-grade systemic inflammation) is 0.9, below the ideal threshold of 1.0, which at a BMI of 26.3 is a reassuring result and suggests no significant systemic inflammation. Her ESR (erythrocyte sedimentation rate, another inflammation marker) is just 2. Her cortisol at 273 is within the normal morning range, which is helpful context given she reports stress some weeks. Her thyroid antibodies are both negative: TPO (thyroid peroxidase antibodies) below 6.6 and thyroglobulin antibodies below 1.3, which rules out autoimmune thyroid disease and is particularly valuable given her family history of thyroid disease. Her coeliac screen (tissue transglutaminase IgA) is negative, which is relevant given her bloating symptoms. Her rheumatoid factor is 4, well within range. Her tumour markers are all clean: CA125 at 33.3 is within range, CA15-3 at 18.31 is within range, CA19-9 at 12.31 is within range, and CEA is below 0.5. Given her family history of cancer, these are useful exclusions. Her urinalysis is entirely clean: no protein, no glucose, no blood, no white cells, no nitrites, insignificant growth on culture. Her prolactin at 296 is within the normal non-pregnant range. Her oestradiol at 423 and progesterone at 28.25 are consistent with the luteal phase of her cycle, which fits with her still having periods. Her creatine kinase at 53 is within range.\n\nNow the findings that need attention, starting with the blood picture. Her RDW at 21.9 is significantly above the upper limit of 14.0. RDW measures how much variation there is in the size of red blood cells, and a result this high means the bone marrow is producing red cells of very different sizes. The most common reason for this is iron deficiency driving a mixed population of cells: some made when iron was available, some made when it was not. Her MCV (mean corpuscular volume, the average size of her red cells) is 82.3, just below the lower limit of 83, which points toward smaller-than-ideal cells, another hallmark of iron-restricted production. Her ferritin at 58 is within the laboratory range and is not overtly low, but ferritin can be misleadingly normal in the presence of inflammation or when iron is being supplemented, and she is taking an iron supplement. Her transferrin (the protein that carries iron through the blood) is 2.09, below the lower limit of 2.5. Transferrin usually rises when the body needs more iron, so a low transferrin with a borderline ferritin and a very high RDW is an unusual pattern. Low transferrin can be seen when the body is suppressing it as part of an inflammatory or chronic-disease response (transferrin is what is called a negative acute phase reactant, meaning it drops during inflammation), or it can be seen in iron overload, though her transferrin saturation at 40.96% is at the upper end of normal rather than overtly elevated. Her CRP is low at 0.9, which makes the inflammatory explanation less likely. Her red blood cell count at 5.28 is above the upper limit of 4.8 for women, which alongside a haemoglobin of 147 (at the top of the female range) suggests the body is producing extra red cells, possibly as compensation for the smaller cell size or for the heavy, painful periods she reports. With heavy periods, chronic blood loss drives the marrow to work harder, producing more cells but of variable size, and the RDW climbs. This is the most likely explanation for the pattern: her heavy periods are creating ongoing iron turnover, the marrow is compensating by producing more and slightly smaller cells, and the RDW reflects that mixed production. The iron supplement she is taking is likely helping to keep her ferritin from falling further, but the RDW at 21.9 suggests the supply is not fully keeping up with the demand. Her reticulocyte count (the percentage of brand-new red cells released from the marrow) at 1.11% and reticulocyte absolute count at 58.6 are both within range, which means the marrow is producing at a normal rate rather than in crisis mode, but the RDW tells us the quality of production is uneven. Her GP should review this pattern: a full iron panel repeat in eight weeks, off the iron supplement for five days before the blood draw, would clarify whether the ferritin is being held up artificially by supplementation, and the GP may wish to investigate the heavy periods themselves, particularly given her age and family history.\n\nHer lymphocyte count at 4.29 is above the upper limit of 3.0, and this is the other result driving her PhenoAge gap. Lymphocytes are the white blood cells responsible for immune memory and targeted immune responses. A raised count can reflect a recent or resolving viral infection, chronic low-grade immune activation, or, rarely, a lymphoproliferative condition. Her IgG (immunoglobulin G, the main antibody class the body uses for long-term immunity) is 16.4, marginally above the upper limit of 16.0, which could reflect the same immune activation that is pushing lymphocytes up. Her IgE (immunoglobulin E, the antibody class involved in allergic responses) is 236, more than double the upper limit of 100. Raised IgE indicates an allergic tendency, which could be environmental allergens, food sensitivities, eczema or asthma, or parasitic exposure. The combination of raised lymphocytes and raised IgE raises the possibility of a chronic allergic or atopic process quietly driving immune activation. This is worth discussing with her GP. A repeat full blood count in six to eight weeks would confirm whether the lymphocytosis is persistent (which warrants further investigation including a blood film) or whether it was a transient response to an infection around the time of sampling. The IgE finding is worth exploring with an allergy-focused history, and if specific triggers are suspected, specific IgE testing or skin prick testing could identify them. Given her bloating symptoms, a food-related allergic component is at least worth considering alongside the other digestive explanations.\n\nHer Platelet-to-Lymphocyte Ratio (PLR), which divides platelets by lymphocytes, is 41.3, below the lower limit of 60. This is being driven entirely by the raised lymphocyte count (the denominator is large), not by low platelets. Her platelets at 177 are within range. The PLR here is a mathematical consequence of the lymphocytosis rather than a separate finding, and it will normalise when the lymphocyte count is explained. Similarly, her Systemic Immune-Inflammation Index (SII) at 122 is just below the lower limit of its range, again because the raised lymphocyte count is inflating the denominator. Neither of these ratios represents a separate problem.\n\nHer lipid profile is the area that needs the most sustained attention. Her total cholesterol is 7.8, her LDL (low-density lipoprotein, the cholesterol particle that deposits in artery walls) is 5.02, well above the upper limit of 3.0, and her ApoB (apolipoprotein B, which counts the actual number of cholesterol-carrying particles in the blood and is a better predictor of cardiovascular risk than LDL alone) is 1.61, nearly double the desirable threshold of 0.9. Her non-HDL cholesterol (total cholesterol minus HDL, capturing all the harmful fractions) is 5.6, above the 4.0 threshold. Her Lp(a) (lipoprotein(a), a genetically determined particle that adds cholesterol to the artery wall, promotes clotting and drives inflammation) is 65.34, above the 32 nmol/L threshold. Lp(a) is entirely inherited, it does not change with diet or exercise, and it represents a permanent piece of her cardiovascular risk profile. This result should be recorded in her permanent medical record, and her first-degree relatives (siblings, children, parents) should be offered Lp(a) testing because it runs in families. After subtracting the Lp(a) contribution, her Lp(a)-corrected LDL is 4.81, still well above the 3.0 upper limit, which means the vast majority of her elevated LDL is coming from modifiable factors rather than from Lp(a) alone. The modifiable drivers here are diet, body composition and, potentially, her thyroid. On the positive side of the lipid picture, her HDL (high-density lipoprotein, the protective cholesterol that removes deposits from arteries) is 2.2, which is excellent. Her triglycerides at 1.46 are within the fasting desirable range, and her TG/HDL ratio at 0.66 is in the optimal band, which is a strong marker of insulin sensitivity and metabolic health. Her Atherogenic Index of Plasma at minus 0.178 is within the optimal range. Her Castelli II ratio (LDL divided by HDL) at 2.28 is within the optimal range. Her ApoA1 (the protein on HDL particles) is 2.12, very healthy. So the picture is not uniformly bad: her HDL and triglyceride profile are genuinely protective, but the sheer volume of ApoB-carrying particles is high enough that it needs to come down, especially with a raised Lp(a) adding inherited risk on top.\n\nHer thyroid results are worth looking at carefully in the context of both the lipid findings and her symptoms. Her TSH (thyroid stimulating hormone, the signal from the pituitary gland telling the thyroid how hard to work) is 2.38, within the laboratory range of 0.55 to 4.78 and within the optimal band of 1.0 to 2.5. However, her FT4 (free thyroxine, the main hormone the thyroid produces) is 13.9, within the laboratory range but below the optimal threshold of 14.0. Her FT3 (free triiodothyronine, the active thyroid hormone that cells actually use) is 4.7, within range and within the optimal band. Her FT3:FT4 ratio at 0.338 is within optimal, suggesting good conversion. So the thyroid is functioning, the antibodies are negative, and autoimmune thyroid disease is excluded. But FT4 sitting just below ideal with a TSH at the higher end of optimal could mean the thyroid is working a little harder than it should to maintain output. A thyroid running at the lower end of its capacity can contribute to elevated LDL because thyroid hormone drives the clearance of LDL from the blood. It can also contribute to fatigue, hair thinning and low mood. This is not a diagnosis of hypothyroidism; the numbers are within range. But it is a thread worth following with a repeat in six months, and it provides useful context for the lipid findings.\n\nHer amylase is 150, above the upper limit of 118. Amylase is an enzyme produced by the pancreas and the salivary glands to digest starch. A raised amylase can indicate pancreatic inflammation (pancreatitis), but in pancreatitis the level is usually several times the upper limit and accompanied by severe abdominal pain. Her lipase (another pancreatic enzyme and a more specific marker for pancreatic problems) is 39, comfortably within range at 13 to 60. When amylase is raised but lipase is normal, the source is usually the salivary glands (so-called macroamylase or salivary-type amylase) rather than the pancreas. This is a common, benign finding. However, because she reports bloating and digestive discomfort and has a family history of bowel cancer, it is worth mentioning to her GP so they can decide whether any further investigation is warranted. The clean lipase is reassuring that the pancreas itself is not inflamed.\n\nHer HOMA-IR (Homeostatic Model Assessment of Insulin Resistance, which multiplies fasting insulin by fasting glucose and divides by a constant to estimate how hard the body has to work to control blood sugar) is 1.7, above the optimal upper limit of 1.5 but below the 1.9 threshold where the laboratory considers early insulin resistance to begin. At a BMI of 26.3 with a diet volume of 4 out of 10, this is a very early signal rather than an established problem. Her glucose and HbA1c are both excellent, which means the pancreas is coping well. Her C-Peptide (a molecule released in equal amounts to insulin and used to measure how much insulin the pancreas is producing) is 0.973 micrograms per litre, which converts to approximately 322 pmol/L, below the lower limit of the laboratory range of 1.1 micrograms per litre. However, C-Peptide is sensitive to sample handling, and the lab note states that samples not separated within four hours can decrease to 44% of baseline. Given that her insulin at 7.51 is well within range and her glucose and HbA1c are excellent, the low C-Peptide is most likely a sample artefact rather than a sign of impaired pancreatic function. The HOMA-IR at 1.7 suggests a very mild degree of insulin resistance, which at her age and BMI is easily addressable with the dietary changes below.\n\nHer vitamin D at 34 nmol/L is in the insufficient range (30 to 50). Given her South Asian ethnicity, higher melanin levels reduce vitamin D synthesis from sunlight, and this is a very common finding. Her PTH (parathyroid hormone, which rises when calcium or vitamin D is low to maintain calcium levels) is 3.4, within range but sitting in the upper half, which is consistent with the body beginning to compensate for low vitamin D by pulling more calcium from bone. With a family history of dementia and her age, optimising vitamin D is particularly important because vitamin D receptors are found throughout the brain and adequate levels are associated with better cognitive outcomes. Her corrected calcium at 2.47 is within range, so the PTH has not yet had to overwork.\n\nHer vitamin B12 at 280 is within the laboratory range of 193 to 982 but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production and energy metabolism. At 280 she is unlikely to be clinically deficient, but she is a long way from the level associated with optimal function. Low B12 can contribute to fatigue and brain fog. Her folate at 6 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. Folate works alongside B12 in red cell production and in keeping homocysteine (an amino acid that damages blood vessels when elevated) low. Both being below optimal with a diet volume of only 4 out of 10 and just 2 to 3 portions of vegetables a day makes nutritional intake the most likely explanation.\n\nHer total antioxidant activity (TAA) at 1.96 is above the upper limit of 1.77. This is almost certainly being driven by her omega-3 supplementation and is not a concern. It simply means her blood has more antioxidant capacity than the reference population, which is a positive finding.\n\nHer testosterone at 1.0 nmol/L is within the female laboratory range of 0.5 to 2.6, and her free androgen index at 2.53 and bioavailable testosterone at 0.35 are both within range. However, testosterone at 1.0 is in the lower third of the range, and at 49 with symptoms of low libido, hair thinning and fatigue, this is a thread worth following. Her DHEA-S (dehydroepiandrosterone sulphate, a precursor hormone produced by the adrenal glands that the body converts into testosterone and oestrogen) is 0.9 micromol/L, which converts to approximately 332 micrograms per decilitre, within range but at the lower end. Low DHEA-S at 49 is expected as adrenal androgen production declines with age, but it does contribute to the low-libido picture. Her SHBG at 39.5 is within range, so binding is not the issue; the total production is simply on the lower side.\n\nHer FSH at 18.4 is above the follicular and luteal phase ranges (up to 10.2 and 9.1 respectively) but below the postmenopausal threshold of 23. This, combined with her still having periods (heavy and painful ones), her oestradiol at 423 and her progesterone at 28.25, is consistent with the perimenopause: the transition phase where FSH begins to climb as the ovaries require more stimulation, cycles may become heavier or more irregular, and symptoms such as fatigue, low libido and hair changes can emerge. This is not a diagnosis but a very plausible hormonal context for several of her symptoms.\n\nHer Mentzer Index at 15.6 is reported for context. This index divides MCV by red blood cell count and is used to distinguish iron-deficiency anaemia from thalassaemia trait. A value above 13 favours iron deficiency over thalassaemia, which is relevant given her South Asian ethnicity (thalassaemia trait is more common in South Asian populations). The value of 15.6 suggests iron deficiency is the more likely explanation for her low MCV and high RDW, though it does not exclude thalassaemia trait entirely, and if the GP is investigating the blood picture, a haemoglobin electrophoresis would settle this definitively.\n\nPutting the minor findings together: her globulin at 36 is at the very top of the range and is being pulled up by the raised IgG and IgE. Her MCHC at 338 is within range. Her MPV at 9.9 is within range. Her De Ritis ratio (AST divided by ALT) at 0.76 is marginally below the optimal band of 0.8 to 1.3, which at these low enzyme levels is simply mathematical rather than clinically meaningful. Her NAFLD fibrosis score at minus 1.506 is within optimal and rules out significant liver fibrosis. Her TyG index at 8.69, a marker that combines triglycerides and glucose to screen for insulin resistance, is within the normal range. Her estimated average glucose at 5.8 is within range. Her free oestradiol index and glucose-corrected sodium are informational and unremarkable. Her serum osmolality at 289 is within the optimal band.","links":"The findings in this report cluster into three connected stories and one independent finding.\n\nThe first story is the blood picture: a high RDW, a low MCV, a high red blood cell count, a low transferrin and a borderline ferritin in a woman with heavy, painful periods who is already supplementing iron. The periods are driving chronic blood loss. The marrow is compensating by producing more red cells, but they are smaller and more variable in size than they should be, which is the hallmark of iron-restricted production. The iron supplement is likely preventing the ferritin from falling into overtly deficient territory, but the RDW at 21.9 tells us the supply is not keeping pace with the demand. The low transferrin is the puzzle piece: it should rise in iron deficiency, not fall. With a CRP below 1.0, the inflammatory explanation is unlikely. The Mentzer Index at 15.6 favours iron deficiency over thalassaemia trait but does not exclude it, and given her South Asian ethnicity, thalassaemia trait should be formally excluded. The GP investigation here has two arms: confirm the iron status off supplements, and consider haemoglobin electrophoresis.\n\nThe second story is the lipid profile and cardiovascular risk. Her ApoB, LDL and Lp(a) are all elevated, producing a Cardiovascular Risk Score of 50 out of 100. The Lp(a) at 65.34 is inherited and permanent, and it adds a layer of risk that cannot be removed by lifestyle alone. But the Lp(a)-corrected LDL at 4.81 shows that most of the LDL elevation is modifiable. Her excellent HDL, low triglycerides and optimal TG/HDL ratio mean the metabolic machinery is working well; the problem is the sheer volume of ApoB particles. The FT4 sitting just below ideal is a possible contributor because thyroid hormone helps clear LDL from the blood, and even subtle thyroid underperformance can raise LDL. Diet and body composition are the primary levers, with the thyroid angle worth monitoring.\n\nThe third story is the immune activation: lymphocytes above range, IgG marginally above range, and IgE more than double the upper limit. The raised IgE points toward an allergic or atopic process. This could be environmental (dust mites, pollen, animal dander), food-related or both, and it may connect to her bloating if a food sensitivity is involved. The raised lymphocytes could be part of the same immune activation, or they could reflect a recent viral infection. A repeat blood count will distinguish transient from persistent lymphocytosis, and if persistent, further investigation is needed.\n\nThe independent finding is the hormonal picture of perimenopause: FSH climbing above follicular and luteal norms, heavy periods, low-end testosterone and DHEA-S, and symptoms of fatigue, low libido and hair thinning. This is the context in which several of her symptoms sit, and it is worth discussing with her GP or a menopause-aware clinician.\n\nWhat has been excluded matters too. Autoimmune thyroid disease is excluded by negative antibodies. Coeliac disease is excluded by a negative tTG IgA. Liver disease is excluded by excellent enzymes and fibrosis scores. Diabetes is excluded by an HbA1c of 34 and a fasting glucose of 5.1. Significant inflammation is excluded by a CRP of 0.9 and an ESR of 2. Kidney disease is excluded by normal creatinine and Cystatin C. All tumour markers are within range. The urinalysis is entirely clean.","lifestyle":"Add a palm-sized portion of protein to every meal and snack, starting with breakfast. Eggs, Greek yoghurt, lentils, chicken or fish. Anchor: protein goes on the plate first, before anything else. Why: at a diet volume of 4 out of 10 with training four days a week, she is likely under-eating protein, and adequate protein supports iron absorption, muscle recovery and the hormone production behind her low-end testosterone.\nIncrease vegetable and fruit portions from 2 to 3 a day to at least 5. Add one extra portion at lunch and one at dinner this week. Leafy greens (spinach, kale, broccoli) are the priority because they provide folate, which at 6 is below ideal, and fibre for the bloating. Anchor: when preparing a meal, the vegetables go into the pan or onto the plate before the main component. Why: folate at 6 is below the optimal threshold of 8 and is most effectively raised through food.\nEat two portions of oily fish per week (salmon, mackerel, sardines, anchovies). Anchor: fix the same two days each week as fish days. Why: omega-3 from whole fish is better absorbed than from supplements and helps lower ApoB, which at 1.61 is nearly double where it should be. She can continue her omega-3 supplement on the other days.\nAdd 3g of soluble fibre at breakfast: a tablespoon of ground flaxseed or psyllium husk stirred into porridge or yoghurt. Build up gradually over two weeks to avoid worsening bloating. Anchor: goes into the breakfast bowl every morning. Why: soluble fibre binds cholesterol in the gut before it reaches the bloodstream and is one of the most effective dietary tools for lowering LDL.\nReplace any refined carbohydrates (white bread, white rice, pastry) with whole grains (oats, brown rice, quinoa, rye bread), one meal at a time. Why: slower-releasing carbohydrates lower the insulin demand that is behind her HOMA-IR of 1.7 and support steadier afternoon energy.\nWalk for 15 minutes after her largest meal of the day. Anchor: plate cleared, shoes on. Why: a post-meal walk blunts the glucose and insulin spike after eating, directly addressing the mild insulin resistance, and will help with the afternoon energy crash she describes.\nGet outside within 30 minutes of waking for at least 10 minutes of natural light, even on overcast days. Anchor: before checking the phone. Why: morning light sets the circadian clock, supports cortisol rhythm (relevant to her afternoon crash), and what little vitamin D synthesis is possible through the skin happens with direct exposure.\nSet a caffeine cut-off at 1pm if she drinks coffee or tea in the afternoon. Why: caffeine has a half-life of five to six hours and may be contributing to the afternoon crash pattern by disrupting the quality of sleep even when she feels refreshed on waking, and improving deep sleep supports hormone balance and recovery.","flags":"Lymphocytes 4.29 (upper limit 3.0). Persistent lymphocytosis needs a repeat FBC in six to eight weeks. If confirmed, a blood film and clinical review are warranted. IgG 16.4 (upper limit 16.0) is marginal and may be part of the same immune activation. IgE 236 (upper limit 100) points toward an allergic or atopic process and should be explored with an allergy-focused history and, if indicated, specific IgE or skin prick testing.\nRDW 21.9% (upper limit 14.0), MCV 82.3 (lower limit 83), RBC 5.28 (upper limit 4.8 female), transferrin 2.09 (lower limit 2.5). This pattern in a woman with heavy, painful periods and iron supplementation suggests ongoing iron-restricted erythropoiesis. Repeat iron studies off supplements after five days, and consider haemoglobin electrophoresis to exclude thalassaemia trait given South Asian ethnicity. Mentzer Index 15.6 favours iron deficiency but does not exclude trait.\nApoB 1.61 (desirable below 0.9), LDL 5.02 (upper limit 3.0), non-HDL cholesterol 5.6 (upper limit 4.0), total cholesterol 7.8 (desirable below 5.18), Lp(a) 65.34 (upper limit 32). Lp(a) is inherited, permanent and should be recorded in her notes; first-degree relatives should be offered testing. Lp(a)-corrected LDL 4.81 confirms most of the elevation is modifiable. ApoB/A1 ratio 0.759 (upper limit 0.6). Cardiovascular Risk Score 50/100 (flagged above 40). HDL 2.2, triglycerides 1.46, TG/HDL ratio 0.66 are all protective.\nHOMA-IR 1.7 (optimal upper limit 1.5). Very mild insulin resistance, below the 1.9 threshold for early clinical resistance. Addressable with dietary changes.\nC-Peptide 0.973 ug/L (lower limit 1.1). Most likely a sample-handling artefact given normal insulin, glucose and HbA1c. Lab note confirms C-Peptide degrades if not separated within four hours.\nAmylase 150 (upper limit 118) with lipase 39 (within range 13 to 60). Isolated amylase elevation with normal lipase is most commonly salivary in origin and benign. Worth mentioning to GP given bloating symptoms and family history.\nVitamin D 34 nmol/L (insufficient, optimal above 75). South Asian ethnicity increases risk. PTH 3.4 within range but upper half, consistent with early compensation.\nVitamin B12 280 pg/mL (optimal above 500). Folate 6 ng/mL (optimal above 8). Both below optimal, likely dietary.\nFT4 13.9 pmol/L (lab range 11.5 to 22.7, optimal 14 to 20). Just below optimal. Antibodies negative. Not hypothyroid but worth monitoring alongside the lipid findings.\nFSH 18.4 mIU/mL, above follicular (2.5 to 10.2) and luteal (1.5 to 9.1) ranges but below postmenopausal (23 to 116.3). Consistent with perimenopause.\nPhenoAge 69.2 against calendar age 49 (difference 20.2 years). Driven by raised lymphocytes and RDW. Will improve as those findings are investigated and addressed.\nReassuring negatives: liver function excellent (ALT 21, GGT 11, FIB-4 0.97, APRI 0.226), kidney function normal (creatinine 59, Cystatin C 1.07, combined eGFR 87), HbA1c 34, fasting glucose 5.1, CRP 0.9, ESR 2, thyroid antibodies negative, coeliac screen negative, all tumour markers within range (CA125 33.3, CA15-3 18.31, CA19-9 12.31, CEA below 0.5), cortisol 273 within range, urinalysis clean.","recommendations":"Discuss the raised lymphocyte count (4.29, upper limit 3.0) and raised IgE (236, upper limit 100) with her GP. Request a repeat full blood count in six to eight weeks to confirm whether the lymphocytosis is persistent, and if so, request a blood film. The IgE warrants an allergy-focused history and consideration of specific IgE or skin prick testing, particularly given her bloating symptoms.\nDiscuss the blood picture: RDW 21.9, MCV 82.3, RBC 5.28, transferrin 2.09. Request repeat iron studies after five days off the iron supplement, and request haemoglobin electrophoresis to exclude thalassaemia trait given her South Asian ethnicity. Discuss investigation and management of her heavy, painful periods.\nDiscuss the lipid profile: ApoB 1.61, LDL 5.02, Lp(a) 65.34. Request that Lp(a) is recorded permanently in her medical record. First-degree relatives should be offered Lp(a) testing. Discuss whether statin therapy is appropriate given the combination of raised ApoB, raised Lp(a) and family history; dietary changes should be implemented first and the lipids rechecked in three to four months.\nDiscuss vitamin D insufficiency (34 nmol/L) and request a repeat after three months of supplementation at 3,000 IU daily to confirm levels have reached the sufficient range.\nDiscuss the perimenopausal hormone picture (FSH 18.4, testosterone 1.0, heavy periods) in the context of her symptoms of low libido, fatigue and hair thinning. A referral to a menopause-aware clinician may be helpful if symptoms are significantly affecting quality of life.\nCalorie target: approximately 1,750 to 1,900 kcal per day (BMR estimated at 1,380 kcal using the Mifflin-St Jeor equation, multiplied by 1.45 for light-to-moderate activity, with a modest deficit for gradual body composition improvement). Protein target: 91 to 112g per day (1.3 to 1.6g per kg body weight for moderate training). Retest in four months with: full blood count, iron studies, lipid profile including ApoB, thyroid (TSH, FT4), vitamin D, B12 and folate, and IgE.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with her largest meal containing fat. Why: her level at 34 nmol/L is insufficient, and South Asian skin produces less vitamin D from sunlight. The higher dose accounts for her BMI and ethnicity. Continue for three months then retest; the target is 75 to 100 nmol/L.\nVitamin K2 (MK-7): 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone rather than soft tissue and should always accompany vitamin D supplementation, particularly when PTH is in the upper half of its range.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: her B12 at 280 is below the optimal threshold of 500. Sublingual delivery bypasses the gut and is more reliably absorbed than oral tablets.\nMethylfolate: 400 mcg daily. Why: her folate at 6 is below the optimal threshold of 8. Methylfolate is the active form and is preferable to folic acid, particularly for anyone who may carry an MTHFR variant.\nIron (ferrous bisglycinate): continue her current iron supplement at 25 to 50mg on alternate days, taken with a source of vitamin C (orange juice, berries or a vitamin C tablet) and away from tea, coffee and calcium by at least two hours. Why: her ferritin at 58 is adequate but the RDW at 21.9 and MCV at 82.3 suggest iron turnover is outpacing supply, driven by heavy periods. If the GP confirms thalassaemia trait, the iron strategy may need to change, so the GP review comes first. Do not increase the dose above 50mg without GP guidance.\nOmega-3 (fish oil): continue at 2 to 3g combined EPA and DHA daily. Why: with an ApoB of 1.61 and LDL of 5.02, omega-3 supports triglyceride metabolism and may modestly reduce ApoB. Take with food for absorption.\nThe most important changes from this report are not supplements. They are increasing food volume and vegetable intake, adding soluble fibre, eating oily fish twice a week, and getting the raised lymphocytes and blood picture reviewed by her GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 50.9; held to 49 by two or more systems rated \"See your GP\". Weakest systems: digestive 8%, lipids & cardiovascular 10%, immunology 24%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Red Cell Distribution Width.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"69.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6407","lower_normal":"","upper_normal":"54","lower_optimal":"","upper_optimal":"49","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4537","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count). Her PhenoAge of 69.2 against a calendar age of 49 represents a gap of 20.2 years. This is being driven principally by her significantly elevated RDW at 21.9 and her raised lymphocyte count at 4.29, both of which are heavily weighted in the PhenoAge formula. It is important to understand that this does not mean she is biologically 69; it means that two specific markers are pulling the score up, and both are being investigated. When the RDW improves with effective iron management and the heavy period investigation, and when the lymphocyte count is explained and addressed, her PhenoAge will fall substantially.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"50","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the cardiovascular risk being built rather than a ten-year event probability. Her score of 50 is above the flagged threshold of 40, driven primarily by ApoB at 1.61, LDL at 5.02 and Lp(a) at 65.34. The Lp(a) is inherited and unchangeable, but reducing the ApoB and LDL through diet and, if needed, medication will bring this score down. At 49, the ten-year risk from conventional calculators is likely low, but the gap between a low ten-year risk and a high lifetime risk score is the window for acting.","low_causes":"Healthy lipids, low inflammation, optimal blood sugar","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. Her result of 5.1 is within the ideal range of 4.0 to 5.4, meaning her body is controlling blood sugar effectively at the moment. This is a reassuring finding alongside her excellent HbA1c.","low_causes":"Prolonged fasting, excess insulin production, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress, high carbohydrate diet, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin that has been glycated (coated with sugar) over the past two to three months, providing a longer-term picture of blood sugar control than a single fasting glucose. Her result of 5.3% is well within the normal range (below 6.0%) and within the optimal range, indicating excellent blood sugar management over recent months.","low_causes":"Anaemia, blood loss, haemolytic conditions","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high sugar diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4048","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in international units. Her result of 34 mmol/mol is well below the 42 threshold for pre-diabetes and within the optimal range of below 36. This confirms excellent long-term blood sugar control.","low_causes":"Anaemia, blood loss, haemolytic conditions","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4150","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.4297","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. Her result of 7.51 is within the ideal range of 2 to 8, meaning the pancreas is not having to overwork to maintain her healthy glucose level. This is a good result, though when combined with her glucose of 5.1 in the HOMA-IR calculation, there is a very mild signal of early insulin resistance that is worth addressing through diet.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, high carbohydrate diet, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.973","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2394","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin, and it is used to measure true pancreatic insulin production. Her result of 0.973 is just below the lower limit of 1.1. However, C-Peptide is sensitive to sample handling, and the laboratory notes that samples not separated within four hours can lose up to 56% of their concentration. Given that her insulin level at 7.51 is well within range and her glucose and HbA1c are both excellent, the low C-Peptide is most likely a sample-handling artefact rather than a sign of impaired pancreatic function.","low_causes":"Sample degradation, type 1 diabetes, low insulin demand from low-carbohydrate diet","high_causes":"Insulin resistance, insulinoma, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5667","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) multiplies fasting insulin by fasting glucose and divides by a constant to estimate how hard the body has to work to control blood sugar. Her result of 1.7 is above the optimal upper limit of 1.0 and above the laboratory reference upper limit of 1.5, but below the 1.9 threshold the laboratory considers the start of early insulin resistance. At a BMI of 26.3 with a diet volume of 4 out of 10, this is a very early signal that is easily addressable through dietary changes, particularly increasing protein, fibre and reducing refined carbohydrates.","low_causes":"High insulin sensitivity, low carbohydrate diet, very active lifestyle","high_causes":"Insulin resistance, high carbohydrate diet, excess body fat, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"The estimated average glucose converts the HbA1c into an estimated average blood sugar over the past two to three months. Her result of 5.8 mmol/L is within the optimal range of below 6.2, confirming consistently healthy blood sugar levels.","low_causes":"Hypoglycaemia, anaemia affecting HbA1c","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4937","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG (triglyceride-glucose) index combines fasting triglycerides and glucose to screen for insulin resistance. Her result of 8.69 is within the normal range of below 8.8 but above the optimal threshold of 8.5, mirroring the mild insulin resistance signal seen in the HOMA-IR. This is being driven by triglycerides at 1.46, and both will improve with the same dietary adjustments.","low_causes":"High insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"147","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6333","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Her result of 147 is near the top of the female range (120 to 150) and within the optimal band. This is a strong result and rules out anaemia despite her heavy periods, suggesting the iron supplement and the body's compensatory red cell production are maintaining oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia, high altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8267","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6667","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Her result of 5.28 is above the upper limit of 4.8 for women. In the context of her low MCV and high RDW, this likely represents the bone marrow compensating for smaller-than-normal red cells by producing more of them, a pattern commonly seen with chronic iron-restricted production or in thalassaemia trait. The heavy, painful periods she reports are the most likely driver of the increased production demand.","low_causes":"Iron deficiency, B12 or folate deficiency, blood loss, bone marrow disorders, chronic disease","high_causes":"Iron deficiency with compensation, thalassaemia trait, dehydration, polycythaemia vera, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.434","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5800","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6567","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Her result of 0.434 is within the normal range of 0.36 to 0.46 and within the optimal band. This is consistent with adequate red cell mass and rules out both anaemia and polycythaemia at the whole-blood level.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"21.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9972","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6250","units":"%","description":"Red cell distribution width measures the variation in size among red blood cells. A healthy marrow produces cells of uniform size, so a narrow RDW reflects consistent production. Her result of 21.9% is significantly above the upper limit of 14%, indicating substantial variation in red cell size. This is the hallmark of iron-restricted erythropoiesis: the marrow alternates between producing normal-sized cells when iron is available and smaller cells when it is not, creating a mixed population. This is the most significant finding in her blood count and is likely driven by her heavy periods outpacing her iron supplementation.","low_causes":"Healthy, uniform red cell production","high_causes":"Iron deficiency, B12 or folate deficiency, thalassaemia trait, mixed nutritional deficiency, recent blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume","group":"HEMATOLOGY","result":"82.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3204","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of red blood cells. Her result of 82.3 is just below the lower limit of 83, meaning her red cells are slightly smaller than ideal. Small red cells (microcytosis) are most commonly caused by iron deficiency or thalassaemia trait. Combined with her high RDW and elevated red blood cell count, this points toward iron-restricted production, and given her South Asian ethnicity, thalassaemia trait should also be considered and formally excluded.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin","group":"HEMATOLOGY","result":"27.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3867","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin per red blood cell. Her result of 27.8 is within the laboratory range of 27 to 32 but just below the optimal threshold of 28. Like MCV, a low MCH reflects smaller or less haemoglobin-dense red cells, consistent with the iron-restricted production pattern seen elsewhere in the blood count.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"338","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5889","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. Her result of 338 is within the normal range and within the optimal band, indicating that while the cells are slightly smaller than ideal, each cell is packed with a normal concentration of haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact from temperature or storage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"177","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3681","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that help the blood clot. Her result of 177 is within the laboratory range of 150 to 410 but just below the optimal threshold of 180. At this margin, this is not clinically significant and is likely her normal baseline. It is worth noting that platelets can be slightly lower during the luteal phase of the menstrual cycle.","low_causes":"Viral infections, autoimmune conditions, medications, bone marrow disorders, liver disease","high_causes":"Iron deficiency, infection, inflammation, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5778","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6667","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. Her result of 9.9 is within the normal and optimal ranges, suggesting healthy platelet turnover.","low_causes":"Bone marrow suppression, medications","high_causes":"Increased platelet destruction, inflammation, iron deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"7.74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5400","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"x10^9/L","description":"The total white blood cell count measures the overall number of immune cells in the blood. Her result of 7.74 is within the normal and optimal ranges. However, looking at the differential (the breakdown of white cell types), the lymphocyte fraction is elevated, which is discussed separately.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications","high_causes":"Infection, inflammation, stress response, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"2.95","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3967","lower_normal":"2","upper_normal":"7","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the body's first responders to bacterial infections. Her result of 2.95 is within the laboratory range of 2 to 7 but just below the optimal threshold of 3. This is a marginal finding and at this level is not a concern, but it is worth noting alongside her elevated lymphocytes, as the balance between neutrophils and lymphocytes is part of the immune picture.","low_causes":"Viral infections, autoimmune conditions, medications, bone marrow disorders, ethnic variation","high_causes":"Bacterial infection, inflammation, stress, smoking, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymp","name":"Lymphocytes","group":"HEMATOLOGY","result":"4.29","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8317","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for targeted immune responses, including antibody production and viral defence. Her result of 4.29 is above the upper limit of 3.0, a finding called lymphocytosis. This can be caused by a recent or resolving viral infection, chronic low-grade immune activation, allergic responses, or, rarely, a lymphoproliferative condition. Given her raised IgE (suggesting allergic activation), this may represent chronic immune stimulation from an allergic or atopic process. A repeat full blood count in six to eight weeks is needed to determine whether this is persistent or transient.","low_causes":"Acute stress, corticosteroid use, HIV, autoimmune conditions","high_causes":"Viral infection, chronic immune activation, allergic conditions, lymphoproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mono","name":"Monocytes","group":"HEMATOLOGY","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that act as the clean-up crew of the immune system, engulfing debris and helping to coordinate immune responses. Her result of 0.4 is within the normal and optimal ranges.","low_causes":"Bone marrow disorders, hairy cell leukaemia","high_causes":"Chronic infection, autoimmune conditions, recovery from acute infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosi","name":"Eosinophils","group":"HEMATOLOGY","result":"0.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"Eosinophils are white blood cells involved in allergic responses and parasitic defence. Her result of 0.08 is within range. Interestingly, despite her very elevated IgE, eosinophils are not raised, which makes a parasitic cause unlikely and favours an environmental or food allergen as the IgE driver.","low_causes":"Cushing's syndrome, acute stress, corticosteroid use","high_causes":"Allergic conditions, parasitic infection, asthma, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"baso","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells and are involved in allergic and inflammatory responses. Her result of 0.02 is at the lower end of the normal range and within optimal.","low_causes":"Acute allergic reactions (degranulation), corticosteroid use","high_causes":"Allergic conditions, chronic myeloid leukaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4350","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are immature red blood cells freshly released from the bone marrow. The percentage tells us how actively the marrow is producing new cells. Her result of 1.11% is within the normal and optimal ranges, indicating a steady, normal rate of red cell production rather than the accelerated output that would be expected in severe blood loss or haemolytic anaemia.","low_causes":"Iron or B12 deficiency, bone marrow suppression, aplastic anaemia, chronic kidney disease","high_causes":"Haemolytic anaemia, acute blood loss, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"58.608","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3907","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"85","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"The absolute reticulocyte count gives the total number of young red blood cells per litre of blood. Her result of 58.6 is within the normal range of 50 to 100, confirming that the marrow is producing at a normal rate. The high RDW is not being caused by overproduction but rather by variability in the quality of each batch of cells produced.","low_causes":"Iron or B12 deficiency, bone marrow suppression","high_causes":"Blood loss, haemolytic anaemia, recovery from nutritional deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"15.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index divides MCV by red blood cell count and is used to help distinguish between iron-deficiency anaemia and thalassaemia trait. A value above 13 favours iron deficiency, while a value below 13 favours thalassaemia trait. Her result of 15.6 favours iron deficiency as the cause of her low MCV and high RDW, though given her South Asian ethnicity, thalassaemia trait should still be formally excluded with a haemoglobin electrophoresis.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"1.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0833","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"ESR (erythrocyte sedimentation rate) measures how quickly red blood cells settle in a tube over an hour, which rises when there is inflammation or infection in the body. Her result of 2 is very low and within the optimal range, confirming no significant systemic inflammation. This is an excellent result.","low_causes":"Healthy, polycythaemia, sickle cell disease","high_causes":"Infection, autoimmune conditions, chronic inflammation, cancer, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"crp","name":"hs-CRP","group":"INFLAMMATION","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures low-grade systemic inflammation, which is one of the key drivers of cardiovascular disease, insulin resistance and ageing. Her result of 0.9 is below the ideal threshold of 1.0, which at a BMI of 26.3 is a genuinely positive finding. It means there is no significant inflammatory burden in the body right now and makes an inflammatory explanation for the low transferrin less likely.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, cardiovascular risk, obesity, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"40.96","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5413","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3919","upper_optimal_position":"0.5270","units":"%","description":"Transferrin saturation measures the percentage of iron-carrying capacity that is actually filled with iron. Her result of 40.96% is within the laboratory range and at the upper edge of the optimal band of 25 to 40%. This tells us that the iron currently in circulation is adequate, but the low transferrin (the carrier protein itself) means the total carrying capacity is reduced, so the saturation percentage is pushed up. This is why the GP should repeat full iron studies after a short break from iron supplements.","low_causes":"Iron deficiency, chronic disease, blood loss","high_causes":"Iron overload, haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"21.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5272","lower_normal":"9","upper_normal":"30.4","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4114","upper_optimal_position":"0.6131","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. Her result of 21.5 is within the normal range and within the optimal band. This is a snapshot that can vary with meals and time of day, so it is interpreted alongside the other iron markers. The adequate serum iron alongside a high RDW and low transferrin reflects the complexity of her iron picture.","low_causes":"Iron deficiency, chronic disease, blood loss, poor dietary intake","high_causes":"Iron supplementation, haemochromatosis, liver disease, excess dietary iron","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tra","name":"Transferrin","group":"IRON STUDIES","result":"2.09","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2026","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6410","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. Her result of 2.09 is below the lower limit of 2.5. In iron deficiency, transferrin usually rises as the body tries to capture more iron from the gut. A low transferrin is unusual in this context and raises two possibilities: it could be suppressed as a negative acute phase reactant (though her CRP is low, making this less likely), or it could reflect an inherited tendency toward lower transferrin production. The low transferrin also artificially inflates the transferrin saturation percentage because there is less carrier protein for the iron to fill. This finding should be discussed with her GP.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"50.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3715","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3520","upper_optimal_position":"0.5773","units":"umol/L","description":"TIBC measures the total capacity of the blood to carry iron, and it is directly related to transferrin levels. Her result of 50.1 is within the laboratory range but at the lower end, reflecting the low transferrin. In iron deficiency, TIBC typically rises; its low-normal position here is consistent with the transferrin pattern and reinforces the need for GP investigation.","low_causes":"Chronic disease, iron overload, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3904","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5000","units":"ng/mL","description":"Ferritin is the body's iron storage protein, and it reflects how much iron is held in reserve. Her result of 58 is within the laboratory range and within the optimal band of 40 to 150 for women. This looks adequate, but in the context of iron supplementation and a very high RDW, ferritin may be held up artificially by the supplement. A repeat off supplements for five days will give a truer picture of her stored iron.","low_causes":"Iron deficiency, blood loss, heavy periods, poor dietary iron, malabsorption","high_causes":"Iron overload, inflammation, liver disease, infection, haemochromatosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is an essential electrolyte that regulates fluid balance, nerve function and blood pressure. Her result of 140 is within the normal and optimal ranges, indicating healthy fluid and electrolyte balance.","low_causes":"Overhydration, heart failure, kidney disease, medications, adrenal insufficiency","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cl","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance and acid-base equilibrium. Her result of 102 is within the normal and optimal ranges.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hco3","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"22.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3697","lower_normal":"20","upper_normal":"31","lower_optimal":"23","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3606","upper_optimal_position":"0.6061","units":"mmol/L","description":"Bicarbonate is a buffer in the blood that helps maintain the body's acid-base balance. Her result of 22.1 is within the laboratory range of 20 to 31 but just below the optimal threshold of 23. At this margin, this is unlikely to be clinically significant and may reflect a mildly more acidic metabolic state, possibly from exercise or diet composition.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"4.0","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3493","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product from protein breakdown, filtered out by the kidneys. Her result of 3.9 is within the laboratory range but just below the optimal threshold of 4.0. A low urea can reflect low dietary protein intake, which at a diet volume of 4 out of 10 with a standard mixed diet is plausible. This is another signal that protein intake may need to increase.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"High protein diet, dehydration, kidney disease, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4146","lower_normal":"49", re in many people. Her result of 87 is within the normal range (above 60) but just below the optimal threshold of 90. At 49, this is a reasonable result and not a cause for concern, but it is worth monitoring over time. The combined creatinine-plus-Cystatin-C eGFR of 87 is the most accurate single number for her kidney function.","low_causes":"Kidney disease, ageing, inflammation, thyroid dysfunction","high_causes":"Hyperfiltration, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"281","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4804","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.2476","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. Her result of 281 is within the normal and optimal ranges for women, indicating no excess production or reduced clearance.","low_causes":"Low purine diet, medications, liver disease","high_causes":"High purine diet, kidney impairment, gout, metabolic syndrome, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.07","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4864","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all cells and filtered by the kidneys. Because it is not influenced by muscle mass, sex or diet, it gives a more accurate picture of kidney function than creatinine alone. Her result of 1.07 is within the laboratory range (below 1.1) but above the optimal threshold of 0.9. This is a slightly higher value than ideal and is the reason her Cystatin C eGFR is 87 rather than above 90. It is not a cause for concern at present but is worth monitoring.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Reduced kidney function, inflammation, hypothyroidism, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"87","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7250","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C to give the most accurate estimate of kidney function, removing the biases of either marker alone. Her result of 87 is within the normal range (above 60) but just below the optimal threshold of 90. At 49, this is a reasonable result and not concerning, but it is worth monitoring over time to ensure stability.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"66.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4783","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between different causes of abnormal kidney markers. Her result of 66.1 is within the normal and optimal ranges, confirming no pre-rena
