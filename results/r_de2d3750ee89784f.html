<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Bertrand Nouvel","dob":"05/10/1979","report_date":"2026-10-17","summary":"Customer is a 47-year-old male presenting with a BMI of 25.6, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food daily; portions are about average (volume 5 out of 10). He trains three times per week (two cardio, one resistance) at moderate intensity with 5,000 to 7,500 daily steps. He sleeps 6 to 7 hours and wakes feeling refreshed, with steady energy throughout the day; stress feels hard to manage some weeks. He drinks 5 to 9 alcoholic drinks per week. He takes no medications and supplements with creatine. He has no diagnosed conditions, no family history reported, and has not had a previous blood test. He reports poor exercise recovery, low sex drive, joint pain and stiffness, and hair thinning, all present for over a year. His goals are to improve long-term health and longevity, improve energy levels, and prevent disease.\n\nThis is a strong set of results overall. His PhenoAge, a composite biological age score built from nine blood markers including albumin, glucose, CRP, white cell count and kidney function, comes in at 39.6 against a calendar age of 47, meaning his blood is ageing roughly seven and a half years younger than his passport. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 15, which sits comfortably inside the ideal bracket of 20 or below. Those two numbers set the tone for the report: his body is in good metabolic shape and his cardiovascular machinery is running cleanly.\n\nHis lipid panel is genuinely impressive. Total cholesterol is 4.6, LDL is 2.6, and his ApoB, the protein that carries LDL particles into artery walls and is the single best predictor of cardiovascular risk, is 0.8, which is right at the desirable threshold. His Lp(a), a genetically inherited lipoprotein that deposits cholesterol, encourages clotting and drives arterial inflammation, is below 25 nmol/L, well under the 32 threshold. This is useful information to have permanently on his medical record because it means any future lipid management is about modifiable factors, not inherited risk. His HDL at 1.4 is healthy and his triglycerides at 1.49 are within the acceptable window, giving an ApoB to ApoA1 ratio of 0.54, which is low risk. The Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) to show what is genuinely modifiable, is 2.52, confirming that most of his LDL is diet and lifestyle driven and responsive to change. His remnant cholesterol, the cholesterol left over after LDL and HDL are subtracted, is 0.52, marginally above the optimal 0.5 target but well within the acceptable range.\n\nHis liver is in excellent health. ALT at 19 and GGT at 16 are both well within ideal ranges, and the GGT in particular is impressive given his alcohol intake of 5 to 9 drinks a week, because GGT is usually the first liver enzyme to rise with regular alcohol. This tells us his liver is handling the current load without visible strain. His FIB-4 score, a fibrosis screening index that combines age, platelet count, AST and ALT to estimate liver scarring, is 1.16, comfortably below the 1.45 threshold and ruling out any suggestion of fibrosis. His bilirubin at 27 is above the upper limit of 21, but with every liver enzyme clean, this pattern is characteristic of Gilbert syndrome, a harmless inherited trait affecting 5 to 10 percent of the population where the liver is slightly slower at processing bilirubin. It does not progress, does not need treatment, and the mildly yellow tinge it can occasionally give the whites of the eyes is cosmetic rather than medical.\n\nHis thyroid is working well. TSH, the hormone the pituitary gland uses to tell the thyroid how hard to work, is 1.27, sitting right in the ideal zone. Free T4 at 18.4 and Free T3 at 5.2 are both within optimal ranges, and the FT3 to FT4 ratio of 0.28 confirms efficient conversion from the storage hormone to the active one. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. His prostate screening is entirely clear, with a PSA of 0.18, far below any threshold of concern.\n\nHis inflammation markers are reassuring. High-sensitivity CRP (hsCRP), which measures low-grade systemic inflammation and is one of the strongest predictors of future cardiovascular events, is 0.9, just inside the optimal band of below 1.0. His ESR, the erythrocyte sedimentation rate, which picks up a different type of inflammatory signal, is 2, as low as it gets. The Systemic Immune-Inflammation Index and Platelet-to-Lymphocyte Ratio are both within ideal ranges. Rheumatoid factor is negative, which is relevant given his joint pain and stiffness, because it makes rheumatoid arthritis unlikely as the explanation. His tissue transglutaminase IgA is negative, ruling out coeliac disease. His immunoglobulins, IgG, IgM, IgA and IgE, are all within their reference ranges, and his white cell count and differential are healthy throughout.\n\nHis kidney function needs a word of explanation because the numbers look different depending on which method is used. His creatinine at 110 is marginally above the laboratory range of 65 to 104, and the creatinine-based eGFR is 69, which in isolation would look concerning. However, creatinine is a breakdown product of muscle, and it rises with muscle mass and with creatine supplementation, both of which apply here. The more reliable measure is Cystatin C, a small protein filtered by the kidneys that is not affected by muscle mass or supplements. His Cystatin C is 1.01, within the reference range, and the Cystatin C-based eGFR is 79. The combined eGFR, which uses both creatinine and Cystatin C, is also 79. While 79 is above the 60 threshold that defines chronic kidney disease and is not alarming, it is below the 90 level considered fully optimal for a 47-year-old. Given the creatine supplementation, the Cystatin C-based figure is the one to trust, and a value of 79 may simply reflect a mild effect of age and hydration, but it would be worth repeating in six months to confirm it is stable rather than declining. The creatinine itself should not be flagged as a concern in this context.\n\nHis blood sugar control is excellent. Fasting glucose is 4.6 and HbA1c, a measure of average blood sugar over the past two to three months, is 29 mmol/mol, well within the optimal range. His fasting insulin at 2.24 is just below the laboratory lower limit of 2.6, and his C-Peptide, a molecule released in equal amounts to insulin and used as a more stable measure of how much insulin the pancreas is producing, is 0.6 ug/L (199 pmol/L), also below the reference range. His HOMA-IR, a score that estimates insulin resistance by combining fasting glucose and insulin, is 0.46, below the lower boundary of the range but in the favourable direction, meaning he is highly insulin sensitive. Taken together, this picture is not one of pancreatic insufficiency. His glucose and HbA1c are both excellent, which means the pancreas is producing exactly the amount of insulin the body needs, and the body is responding to it efficiently. A low insulin and C-Peptide with perfect glucose control means the tissues are very sensitive to insulin, so the pancreas does not need to work hard. This is a metabolic positive, not a problem.\n\nHis iron studies tell an interesting story. Serum iron at 37 is above the upper limit of 31.3, while ferritin at 126, transferrin at 2.64 and iron binding capacity at 62.1 are all within their reference ranges. The transferrin saturation, calculated from serum iron and iron binding capacity, comes out at approximately 60 percent, which is above the ideal range of 25 to 40 percent. A single elevated serum iron with normal ferritin and normal transferrin can reflect recent dietary iron intake, a meal rich in red meat or iron-fortified food on the day before the test, or the normal diurnal variation in serum iron, which can swing by 50 percent across the day. However, given the elevated saturation, it would be sensible to repeat fasting iron studies in the morning on a separate occasion. If the saturation remains above 45 percent on a repeat, a genetic test for haemochromatosis, the HFE gene test, would be the next step. Haemochromatosis is an inherited condition where the body absorbs too much iron, affecting roughly 1 in 200 people of European ancestry. For now, this is not diagnostic of anything, but it warrants a recheck.\n\nHis testosterone at 25.5 is genuinely strong for a 47-year-old, sitting well inside the optimal band of 18 to 30 nmol/L. His SHBG, sex hormone binding globulin, the protein that carries testosterone in the blood, is 50.2, within optimal range. His calculated free testosterone at 0.423 nmol/L and bioavailable testosterone at 10.58 nmol/L are both healthy. His LH and FSH, the pituitary hormones that drive testosterone production, are in the lower half of their ranges, consistent with a healthy feedback loop where the pituitary does not need to push the testes hard because output is already good. Oestradiol at 138 is within range. DHEA-S at 2.3 umol/L (848 ug/dL) and prolactin at 83 are both unremarkable. Given that his testosterone is strong and his thyroid is healthy, his low libido and hair thinning are unlikely to be hormonally driven. Progesterone at 0.69 is below the laboratory range of 0.89, but in men progesterone is produced in small amounts and levels below range carry no clinical significance.\n\nHis cortisol at 198 nmol/L is within the expected morning range. His vitamin D at 52 nmol/L sits right at the boundary between insufficient and sufficient. For optimal health, immune function, bone density and the joint health he is concerned about, the target is 75 to 120 nmol/L, so supplementation is warranted. His B12 at 395 is within the laboratory range but below the optimal threshold of 500, which means stores could be improved. Folate at 12.78 is healthy, and calcium, phosphate and magnesium are all within their reference ranges.\n\nHis bicarbonate at 32.8 is above the upper limit of 31, a mild metabolic alkalosis. This is most commonly caused by dehydration, antacid use, or prolonged vomiting, but at this margin it can also be a normal variant, particularly if the sample sat for a period before processing. It is not clinically significant on its own but is worth noting for the GP if it recurs.\n\nHis amylase at 128 is above the upper limit of 118. Amylase is an enzyme produced mainly by the pancreas and salivary glands to break down starch. A mild elevation like this, roughly 8 percent above the upper limit, is common and usually benign. His lipase, the other pancreatic enzyme and the more specific one, is 54, well within the range of 13 to 60, which makes pancreatic inflammation (pancreatitis) very unlikely. The most likely explanation is normal variation, possibly with a contribution from salivary amylase. No action is needed unless symptoms develop.\n\nHis creatine kinase (CK) at 364 is above the upper limit of 320. CK is an enzyme released from muscle when fibres are damaged or worked hard. At 364, this is a modest elevation that is entirely consistent with his training, particularly if the blood was drawn within 48 hours of a session. It tells us his muscles are experiencing mechanical stress, which connects directly to his report of poor exercise recovery. This is not a cause for concern but does suggest that his recovery strategy, sleep, protein intake and training spacing, could be improved.\n\nHis total antioxidant activity (TAA) at 2.03 is above the upper limit of 1.77. This is likely driven by his creatine supplementation, which is a known antioxidant, and possibly by good dietary antioxidant intake from his 4 to 5 daily portions of vegetables and fruit. An elevated TAA is not harmful.\n\nTurning to the symptoms he reports: his poor exercise recovery connects to the elevated CK and to his training pattern. One resistance session and two cardio sessions at moderate intensity with only 5,000 to 7,500 steps is not an enormous training load, yet his recovery is poor. The combination of daily sugar intake, 6 to 7 hours of sleep, and a volume rating of 5 out of 10 suggests he may not be fuelling recovery adequately, particularly around protein. His joint pain and stiffness is worth investigating further: rheumatoid factor is negative and inflammation is low, which rules out the main inflammatory arthritis. At 47 with moderate activity, early osteoarthritis is possible, and vitamin D at 52 is not helping. For his low libido, the blood does not point to a hormonal cause, as testosterone is strong and thyroid is healthy. This leaves lifestyle factors as the more likely drivers: sleep at 6 to 7 hours may be enough for him given he wakes refreshed, but libido is sensitive to stress, alcohol (which suppresses testosterone acutely even when the baseline is good), and general fatigue. His hair thinning at 47 is most likely androgenetic alopecia, the common male-pattern hair loss driven by genetics and DHT sensitivity, and this is not something blood markers typically explain.\n\nHis MCH at 32.6 is marginally above the upper limit of 32, and his MCHC at 349 is marginally above the upper limit of 345. Both of these are red blood cell indices that describe the average amount and concentration of haemoglobin in each cell. At these margins, the most likely explanation is normal variation, and neither is clinically significant. His MPV at 10.1 sits exactly at the upper limit, which is unremarkable.","links":"The dominant story in this report is one of metabolic efficiency. The very low fasting insulin and C-Peptide, the excellent HOMA-IR, the strong HbA1c and fasting glucose, and the clean lipid profile all point to a body that is handling fuel well. The low insulin demand is not a sign of pancreatic weakness; it is a sign that the tissues are highly responsive, so the pancreas can do its job with minimal output. This is one of the most protective metabolic patterns for long-term health and disease prevention, which is exactly what this customer is aiming for.\n\nThe kidney function and the creatinine result need to be read through the lens of his creatine supplementation. Creatine is converted to creatinine and excreted by the kidneys, so any creatinine-based calculation will overestimate kidney strain in someone who supplements. The Cystatin C-based eGFR of 79 is the accurate measure here, and while it is not yet in the ideal band above 90, it is a long way from the threshold that defines disease. A repeat in six months will establish whether this is stable, which is the most likely outcome, or trending.\n\nThe elevated serum iron and calculated transferrin saturation are the loose end in this report. Ferritin and transferrin are both normal, which argues against a chronic iron overload state, and a single elevated serum iron can reflect dietary timing and diurnal variation. But the saturation figure is high enough that a repeat, ideally fasting and in the morning, is the right next step. If it stays elevated, the HFE gene test resolves the question definitively.\n\nThe symptoms he reports, poor recovery, low libido, joint pain and hair thinning, do not have a single unifying explanation in the blood. The recovery issue connects to his elevated CK and his nutrition and sleep pattern. The joint pain has no inflammatory marker behind it and no autoimmune signature, so mechanical causes and early osteoarthritis are the most likely explanations. The low libido sits against a strong testosterone, a healthy thyroid and clean metabolic markers, so lifestyle factors including alcohol, stress and sleep quality are the primary suspects. Hair thinning at 47 with no thyroid or iron abnormality is almost certainly genetic. None of these require urgent action, but the recovery and joint issues will benefit from the dietary and supplement changes below.\n\nThe vitamin D at 52 is the easiest win in the report. Bringing it into the 75 to 120 range will support joint health, immune function and recovery. The B12 at 395 is adequate but not optimal, and topping it up is straightforward. The daily sugar habit is the single dietary change most worth addressing, because while it is not yet causing metabolic harm, the insulin sensitivity that protects him now can erode with time, and sugar is the fastest way to accelerate that erosion.","lifestyle":"Cut back on daily sugary food and drink to two or three days a week, then aim for once a week. Anchor: when you reach for something sweet, swap it for fruit, dark chocolate (70%+) or yoghurt with berries on most days. Why: your insulin sensitivity is exceptional right now, with a HOMA-IR of 0.46, and daily sugar is the single habit most likely to erode that advantage over time.\nAdd a palm-sized portion of protein to every meal, aiming for 130 to 145 grams of protein per day across the day. Anchor: protein goes on the plate first, before anything else. Why: your CK is elevated at 364 and you report poor recovery; protein is the raw material for muscle repair, and at your current volume rating of 5 out of 10 you are likely undereating it.\nEat a larger breakfast or add a mid-morning snack on training days so your total calorie intake on those days reaches approximately 2,400 to 2,500 kcal. Anchor: prepare this the night before so it is waiting. Why: your insulin and C-Peptide are low enough to suggest your body is running on minimal fuel, which is metabolically efficient but can impair recovery and libido when combined with training.\nAdd one more resistance session per week, making it two per week, and space them at least 48 hours apart. Anchor: pick two fixed days so it becomes routine. Why: resistance training is the strongest driver of bone density, joint support, testosterone maintenance and metabolic health into your fifties, and one session a week is not enough stimulus.\nWalk for 15 minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk improves glucose disposal and supports the already excellent insulin sensitivity you have.\nTake vitamin D3 with your fattiest meal of the day (details in supplementation). Why: your vitamin D at 52 is below the optimal 75 to 120 range and is likely contributing to your joint stiffness.\nSet a caffeine cut-off at 1pm and aim for a fixed wake time seven days a week. Why: 6 to 7 hours is workable since you wake refreshed, but consistency protects sleep architecture, which governs recovery, libido and cortisol rhythm.\nReduce alcohol to under 7 drinks per week, ideally 4 or fewer, and have at least three alcohol-free days. Why: alcohol impairs muscle recovery, suppresses testosterone acutely even when baseline levels are strong, disrupts sleep quality beneath the level you notice, and is a plausible contributor to both your low libido and poor recovery.","flags":"Serum iron 37 umol/L, above the upper limit of 31.3. Transferrin saturation approximately 60%, above the ideal range of 25 to 40%. Ferritin and transferrin are both normal. This may reflect dietary timing or diurnal variation, but a fasting morning repeat is needed to confirm. If saturation remains above 45% on repeat, HFE gene testing for haemochromatosis is warranted.\nCystatin C-based eGFR 79, below the optimal threshold of 90 but above the 60 cut-off for chronic kidney disease. Creatinine at 110 is above range but explained by creatine supplementation. Recommend repeat in six months to confirm stability.\nBicarbonate 32.8 mmol/L, marginally above the upper limit of 31. Mild metabolic alkalosis, likely positional or related to sample handling. Not significant in isolation but worth noting if it recurs.\nFasting insulin 2.24 mIU/L, below range (2.6 to 24.9), and C-Peptide 0.6 ug/L (199 pmol/L), below range (1.1 to 4.4). In the context of excellent glucose (4.6) and HbA1c (29), this reflects high insulin sensitivity rather than pancreatic insufficiency. No action required.\nCreatine kinase 364 U/L, above the upper limit of 320. Consistent with exercise-induced muscle breakdown. Clinically insignificant but connects to reported poor recovery.\nAmylase 128 IU/L, above the upper limit of 118. Lipase 54 is well within range, making pancreatitis very unlikely. Most likely normal variation or salivary contribution. No action required.\nBilirubin 27 umol/L, above the upper limit of 21. All liver enzymes clean. Pattern consistent with Gilbert syndrome, a benign inherited trait. No action required.\nVitamin D 52 nmol/L, sufficient by NHS criteria but below the optimal range of 75 to 120 nmol/L. Supplementation recommended.\nB12 395 pg/ml, within range but below the optimal threshold of 500. Supplementation recommended.\nProgesterone 0.69 nmol/L, below range (0.89 to 3.88). In men, low progesterone has no established clinical significance.\nMCH 32.6 pg (range 27 to 32) and MCHC 349 g/L (range 315 to 345) are both marginally above range. At these margins, this is normal variation and not clinically significant.\nTotal antioxidant activity 2.03 mmol/L, above range (1.3 to 1.77). Likely driven by creatine supplementation and dietary antioxidant intake. Not harmful.\nReassuring negatives: thyroid function and antibodies normal, hsCRP 0.9 (optimal), ESR 2, rheumatoid factor negative, coeliac screen negative, PSA 0.18, all tumour markers clear, immunoglobulins normal, IgE normal, liver enzymes and fibrosis score clear, HbA1c 29, Lp(a) below 25, urine clear.","recommendations":"Discuss the elevated serum iron and transferrin saturation with your GP. Bring the numbers: serum iron 37 (limit 31.3), transferrin saturation approximately 60% (target 25 to 40%). Ask for a repeat fasting morning iron panel, and if saturation remains above 45%, request the HFE gene test for haemochromatosis.\nMention the Cystatin C-based eGFR of 79 and explain you take creatine. Ask for a repeat Cystatin C in six months to confirm kidney function is stable.\nMention the mild bicarbonate elevation (32.8, limit 31) so it is on record, and ask for it to be rechecked on the next blood draw.\nDiscuss joint pain and stiffness with your GP. Rheumatoid factor, CRP and ESR are all negative or low, which makes inflammatory arthritis unlikely. Consider an X-ray of the affected joints to check for early osteoarthritis, and ask whether a physiotherapy referral would help.\nDiscuss low libido. Your testosterone is strong at 25.5 and thyroid is healthy, so the blood does not explain it. Ask your GP to consider alcohol, stress and sleep quality as contributing factors, and whether further investigation is warranted.\nRetest in six months: repeat iron studies (fasting, morning), Cystatin C and eGFR, vitamin D and B12 to check supplementation response, and CK to see whether recovery has improved. Your daily calorie target for steady weight with moderate activity is approximately 2,300 to 2,500 kcal, with a protein floor of 130 to 145 grams per day (1.6 to 1.8 g/kg).","supplementation":"Vitamin D3 (cholecalciferol), 3,000 IU daily, taken with your fattiest meal for absorption. Why: your vitamin D is 52 nmol/L and the target is 75 to 120. At your BMI this dose should bring you into range within three months.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than arteries. Always pair it with D3.\nSublingual methylcobalamin (vitamin B12), 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 395 is adequate but below the optimal 500 threshold. Sublingual bypasses the gut for better absorption.\nMagnesium glycinate, 300 to 400 mg, taken before bed. Why: supports sleep quality, muscle recovery and joint health, and your magnesium at 0.9 is within range but not at the top.\nOmega-3 fish oil, 2 g of combined EPA and DHA daily, taken with food. Why: supports joint comfort, reduces low-grade inflammation, and complements your already good cardiovascular profile.\nContinue creatine at your current dose. It supports muscle recovery and strength, and the elevated creatinine it causes is accounted for in this report.\nDO NOT take iron supplements. Your serum iron and transferrin saturation are already elevated, and additional iron could cause harm if haemochromatosis is present. Wait for the repeat iron panel before any iron supplementation is considered.\nThe most important changes from this report are not supplements. They are reducing daily sugar, increasing protein to 130 to 145 grams a day, adding a second resistance session, and reducing alcohol to under seven drinks a week.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"60","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 60 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 59.8. Weakest systems: iron studies 26%, liver & metabolic 32%, kidney function 44%. Biggest drags: Creatinine, Total Bilirubin, Transferrin Saturation, Bicarbonate.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"39.6","within_normal":"TRUE", ","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, giving a picture of average blood sugar over the past two to three months. At 29 mmol/mol, this is well below the 42 threshold for pre-diabetes and inside the optimal band, confirming excellent long-term glucose control.","low_causes":"Low red cell lifespan, chronic blood loss, haemolytic anaemia","high_causes":"Diabetes, pre-diabetes, sustained high blood sugar","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3178","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5754","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to manage blood sugar. At 2.24 mIU/L, this is just below the laboratory lower limit of 2.6 but sits within the optimal band of 2 to 8. In the context of a perfect fasting glucose of 4.6 and HbA1c of 29, this low insulin is a positive finding: the body is so responsive to insulin that the pancreas barely needs to produce any. This is high insulin sensitivity, not pancreatic failure.","low_causes":"High insulin sensitivity, low carbohydrate diet, lean body composition, prolonged fasting","high_causes":"Insulin resistance, metabolic syndrome, type 2 diabetes, PCOS, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"199","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1752","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6011","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin, and because it is more stable in the blood, it gives a reliable measure of how much insulin the pancreas is actually producing. At 199 pmol/L (0.6 ug/L), this is below the reference range. However, just like the insulin result, when glucose and HbA1c are both excellent, a low C-Peptide reflects low insulin demand rather than pancreatic insufficiency. The pancreas is producing exactly what is needed.","low_causes":"High insulin sensitivity, low carbohydrate intake, type 1 diabetes (in that context glucose would be high)","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an average daily glucose reading. At 5 mmol/L, this confirms that over the past two to three months, blood sugar has been well controlled on average.","low_causes":"Low carbohydrate diet, high insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4892","lower_normal":"","up e, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5741","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is an electrolyte essential for heart rhythm, muscle contraction and nerve signalling. At 4.8 mmol/L, this is within the reference range and right at the upper boundary of the optimal band. This is a healthy result.","low_causes":"Diuretics, vomiting, diarrhoea, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, sample haemolysis, potassium-sparing diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4949","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works with sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. At 102 mmol/L, this is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, renal tubular acidosis, excessive saline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"32.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7212","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.33333
