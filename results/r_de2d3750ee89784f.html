om muscle metabolism, filtered by the kidneys and commonly used to estimate kidney function. At 110 umol/L, this is above the laboratory range of 65 to 104. However, creatinine is directly affected by muscle mass and by creatine supplementation, both of which apply here. The more reliable kidney marker, Cystatin C, is within range, confirming that the elevated creatinine is a supplementation artefact rather than a sign of kidney impairment.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"Creatine supplementation, high muscle mass, kidney disease, dehydration, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste based on creatinine. At 69, this is above the 60 threshold for chronic kidney disease but below the 90 ideal. In this case, the creatinine-based eGFR is artificially lowered by creatine supplementation. The Cystatin C-based eGFR of 79 is more reliable and is the figure to follow.","low_causes":"Kidney disease, dehydration, certain medications","high_causes":"Low muscle mass, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4591","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein freely filtered by the kidneys and is the most reliable marker of kidney function because, unlike creatinine, it is not affected by muscle mass, diet or creatine supplements. At 1.01 mg/L, this is within the reference range, confirming that kidney filtration is adequate. The eGFR derived from Cystatin C (79) is the most trustworthy kidney function measure in this report.","low_causes":"Generally not clinically significant","high_causes":"Reduced kidney function, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cgfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"The Cystatin C-based eGFR estimates kidney filtration rate using Cystatin C instead of creatinine, making it more reliable in anyone who supplements creatine or has high muscle mass. At 79, this is above the 60 threshold for kidney disease but below the ideal level of 90. This is the most accurate kidney function measure in this report and is worth repeating in six months to confirm it is stable.","low_causes":"Reduced kidney function, ageing","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"397","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5148","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2722","upper_optimal_position":"0.5230","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in red meat, organ meats, and some fish. At 397 umol/L, this is within the laboratory range but above the optimal upper limit of 380 for a male. Elevated uric acid is associated with gout, kidney stones and cardiovascular risk. Given his joint symptoms, keeping uric acid in check is worth attention. Reducing alcohol and sugary food (fructose raises uric acid) and staying well hydrated are the main levers.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High purine diet, alcohol, fructose, kidney impairment, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"79","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"The combined eGFR uses both creatinine and Cystatin C to estimate kidney filtration rate, making it more robust than either alone. At 79, this is above the 60 threshold for chronic kidney disease but below the ideal 90. Given the creatine supplementation, the creatinine component is artificially elevated, pulling the combined figure down. A repeat Cystatin C in six months will confirm stability.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not typically clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"44.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between pre-renal (dehydration) and renal causes of elevated creatinine. At 44.5, this is in the lower end of the reference range and just below the optimal lower boundary of 45. The low ratio reflects the elevated creatinine from creatine supplementation rather than any kidney pathology.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6533","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 75 g/L, this is within the optimal range and confirms that the liver is producing proteins normally and the immune system is contributing its share.","low_causes":"Liver disease, kidney disease, malnutrition, malabsorption","high_causes":"Dehydration, chronic infection, inflammatory conditions, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and drugs, and maintains fluid balance. At 46 g/L, this is within the optimal range and is one of the inputs into the PhenoAge calculation. A strong albumin is one of the reasons his biological age is younger than his calendar age.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4944","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin is a group of proteins in the blood that includes antibodies and transport proteins. At 29 g/L, this is within the optimal range and reflects a healthy balance of immune and transport proteins.","low_causes":"Liver disease, kidney disease, immunodeficiency","high_causes":"Chronic infection, inflammation, autoimmune conditions, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5619","units":"IU/L","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones and bile ducts. At 53 IU/L, this is within the optimal range and confirms healthy liver and bone metabolism.","low_causes":"Malnutrition, hypothyroidism, anaemia","high_causes":"Liver disease, bile duct obstruction, bone disorders, Paget's disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"27","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8042","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. At 27 umol/L, this is above the upper limit of 21. However, with every liver enzyme in healthy range, ALT at 19 and GGT at 16, this pattern is characteristic of Gilbert syndrome, a harmless inherited trait where the liver is slightly slower at processing bilirubin. It affects 5 to 10 percent of the population, does not progress, does not need treatment, and is not a sign of liver disease.","low_causes":"Generally not clinically significant","high_causes":"Gilbert syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1696","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/L","description":"ALT (alanine aminotransferase) is a liver enzyme that rises when liver cells are damaged. At 19 IU/L, this is well within the optimal range of below 30 for a male, confirming that the liver is under no metabolic strain.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, fatty liver, alcohol, medications, viral hepatitis, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4896","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5729","units":"IU/L","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart and muscles. At 28 IU/L, this is within the optimal range. Because AST also comes from muscle, it can rise with exercise, but at 28 it is comfortably within normal.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, heart attack, intense exercise, muscle damage, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1096","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.1438","units":"IU/L","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol and bile duct issues. At 16 IU/L, this is well within the optimal range of below 25, and is especially reassuring given alcohol intake of 5 to 9 drinks per week. The liver is handling the current alcohol load without visible strain.","low_causes":"Generally not clinically significant","high_causes":"Alcohol, fatty liver, bile duct disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"128","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5568","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5455","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands to break down starch. At 128 IU/L, this is marginally above the upper limit of 118. A mild elevation like this is common and usually benign, particularly when lipase, the more specific pancreatic enzyme, is well within range at 54. The most likely explanation is normal variation or a salivary contribution. No action is needed unless symptoms such as abdominal pain develop.","low_causes":"Pancreatic insufficiency, cystic fibrosis","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease, macroamylasaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4362","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6172","units":"U/L","description":"Lipase is an enzyme produced almost exclusively by the pancreas to break down dietary fat. At 54 U/L, this is within the healthy range and, critically, is the more specific marker for pancreatic inflammation. Its normal level confirms that the mildly elevated amylase is not due to pancreatic disease.","low_causes":"Pancreatic insufficiency (rare)","high_causes":"Pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6140","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6228","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.56 mmol/L, this is within the reference range and close to the upper boundary of the optimal band. His corrected calcium of 2.46 confirms this is accurate after adjusting for albumin levels.","low_causes":"Vitamin D deficiency, parathyroid disease, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium result for albumin levels to give a more accurate picture. At 2.46 mmol/L, this is within the optimal range, confirming healthy calcium regulation.","low_causes":"Vitamin D deficiency, parathyroid disease, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5299","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3793","upper_optimal_position":"0.6092","units":"mmol/L","description":"Phosphate works with calcium to maintain bone health and plays a role in energy production. At 1.3 mmol/L, this is within the optimal range and confirms healthy bone mineral metabolism.","low_causes":"Vitamin D deficiency, hyperparathyroidism, malnutrition, antacid use","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5310","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4310","upper_optimal_position":"0.5862","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions including muscle relaxation, sleep regulation and energy production. At 0.9 mmol/L, this sits within the optimal range. Supplementing magnesium glycinate before bed may still benefit his recovery and sleep quality, as blood magnesium represents only about 1% of total body stores.","low_causes":"Alcohol, diuretics, poor dietary intake, diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.5500","units":"nmol/L","description":"Vitamin D is a fat-soluble hormone essential for calcium absorption, bone health, immune function, mood and muscle recovery. At 52 nmol/L, this is just above the sufficiency threshold of 50 but well below the optimal range of 75 to 120. Given his joint pain, recovery issues and desire for disease prevention, bringing this up to the 75 to 100 range with supplementation is one of the most impactful changes in this report.","low_causes":"Low sun exposure, darker skin, obesity, malabsorption, northern latitude, winter months","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5573","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5573","units":"pmol/L","description":"PTH (parathyroid hormone) regulates calcium and phosphate levels by signalling the bones, kidneys and gut. At 3.5 pmol/L, this is within the reference range and right at the upper boundary of the optimal band. PTH tends to rise when vitamin D is low because the body compensates to maintain calcium. Once vitamin D supplementation brings levels into the 75 to 100 range, PTH should settle lower.","low_causes":"Excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, primary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"395","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4522","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5225","upper_optimal_position":"0.6164","units":"pg/ml","description":"Vitamin B12 is essential for red blood cell production, nerve function and DNA synthesis. At 395 pg/ml, this is within the laboratory range but below the optimal threshold of 500. Suboptimal B12 can contribute to fatigue and poor cognitive function. Supplementation with sublingual methylcobalamin is recommended to bring levels into the 500 to 900 range.","low_causes":"Vegetarian or vegan diet, malabsorption, atrophic gastritis, pernicious anaemia, metformin","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"12.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4399","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and nervous system function. At 12.78 ng/ml, this is within the optimal range, confirming good dietary intake of green leafy vegetables and fortified foods.","low_causes":"Poor diet, malabsorption, alcohol, pregnancy, certain medications","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4458","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the combined amount of all cholesterol types in the blood. At 4.6 mmol/L, this is within the desirable range of below 5.18. On its own, total cholesterol is a blunt measure, but the detailed breakdown shows a healthy balance between the subtypes.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, kidney disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4382","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of stored fat in the body and are carried in the blood. At 1.49 mmol/L, this is within the laboratory fasting range of below 1.7 but above the optimal target of below 1.0. Triglycerides respond strongly to dietary sugar and refined carbohydrates, and his daily sugar intake is likely the main driver. Reducing sugary food from daily to a few times per week should bring this down. Alcohol also raises triglycerides.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism","high_causes":"Sugar, refined carbohydrates, alcohol, obesity, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. At 0.68 mmol/L, this is within the reference range but above the optimal threshold of 0.6. Like triglycerides, it tracks with sugar and alcohol intake.","low_causes":"Low-fat diet, malabsorption","high_causes":"High sugar intake, alcohol, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4516","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the 'good' cholesterol that carries excess cholesterol back to the liver for disposal. At 1.4 mmol/L, this is above the 1.04 lower limit and in the acceptable range, but below the optimal target of above 1.4 for a male (i.e. it needs to be clearly above 1.4). HDL responds well to regular exercise, reducing alcohol, and increasing omega-3 intake. Adding a second resistance session and the recommended omega-3 supplement should help raise this.","low_causes":"Sedentary lifestyle, smoking, poor diet, obesity, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics, omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4333","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) is the 'bad' cholesterol that deposits in artery walls and drives atherosclerosis. At 2.6 mmol/L, this is within the laboratory range of 0.5 to 3.0 and right at the optimal ceiling of 2.6. Ideally LDL would sit below 2.6 for long-term cardiovascular protection. His ApoB of 0.8, which is a better measure of atherogenic particle count, is desirable.","low_causes":"Very low-fat diet, hyperthyroidism, malabsorption","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3656","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio is a simple cardiovascular risk measure. At 3.29, this is within the optimal range of below 3.5, indicating a favourable balance between total and protective cholesterol.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"30.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5072","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol. At 30.4%, this is above the 20% minimum and above the 25% optimal threshold, indicating that a good proportion of total cholesterol is the protective HDL type.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol includes all the atherogenic (artery-damaging) cholesterol types: LDL, VLDL and remnant cholesterol combined. At 3.2 mmol/L, this is within the optimal range of below 3.4 and confirms that total atherogenic burden is well controlled.","low_causes":"Very low-fat diet, malabsorption","high_causes":"Diet, genetics, metabolic syndrome, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6167","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein in HDL particles and drives the protective function of HDL by carrying cholesterol back to the liver. At 1.48 g/L, this is above the 1.2 minimum and above the optimal 1.4 threshold, confirming healthy HDL function.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein embedded in every LDL, VLDL and Lp(a) particle, and is the single best blood marker of cardiovascular risk because it counts the actual number of atherogenic particles rather than the cholesterol they carry. At 0.8 g/L, this is right at the optimal threshold of 0.8, sitting within the desirable band of below 0.9. This is a strong result for cardiovascular protection.","low_causes":"Very low-fat diet, malabsorption, hyperthyroidism","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3857","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"","description":"The ApoB/A1 ratio is one of the best summary measures of cardiovascular risk, balancing harmful particles (ApoB) against protective ones (ApoA1). At 0.54, this is within the optimal range of below 0.6 and well within the lower risk band of below 0.7.","low_causes":"High HDL function, low atherogenic burden","high_causes":"High LDL particle count, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically inherited lipoprotein that deposits cholesterol in artery walls, encourages blood clotting and drives arterial inflammation. Unlike LDL, it cannot be lowered by diet or exercise. At below 25 nmol/L, this is well under the 32 threshold and is a genuinely useful finding to have permanently on his medical record. It means that any future lipid management is about modifiable factors such as diet and exercise, not inherited risk.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"364","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7238","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from muscle cells when they are damaged or worked hard. At 364 U/L, this is above the upper limit of 320. In someone who trains regularly and supplements creatine, a modest elevation is expected and reflects exercise-induced muscle fibre breakdown. It connects to his report of poor exercise recovery and suggests his muscles are under more mechanical stress than his current recovery strategy can handle. Improving protein intake, sleep and training spacing should bring this down.","low_causes":"Sedentary lifestyle, low muscle mass","high_causes":"Exercise, muscle injury, rhabdomyolysis (at very high levels), statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7965","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3738","upper_optimal_position":"0.6107","units":"umol/L","description":"Serum iron measures the amount of iron currently circulating in the blood. At 37 umol/L, this is above the upper limit of 31.3. A single elevated serum iron can reflect recent dietary intake (red meat, iron-fortified food), the normal diurnal variation in iron (levels swing by up to 50% across the day), or, if persistent, could suggest haemochromatosis. With ferritin and transferrin both normal, a chronic overload state is less likely, but the calculated transferrin saturation is elevated and warrants a fasting morning repeat.","low_causes":"Iron deficiency, chronic disease, blood loss, malabsorption","high_causes":"Haemochromatosis, recent iron-rich meal, haemolysis, liver disease, iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4753","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5889","units":"g/L","description":"Transferrin is the protein that carries iron in the bloodstream. At 2.64 g/L, this is within the optimal range. A normal transferrin argues against both iron deficiency (where it rises) and chronic iron overload (where it can fall).","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"62.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5221","lower_normal":"44","upper_normal":"76.1","lower_optimal":"48","upper_optimal":"72","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3746","upper_optimal_position":"0.6180","units":"umol/L","description":"TIBC measures the total capacity of the blood to carry iron. At 62.1 umol/L, this is within the optimal range. A normal TIBC alongside elevated serum iron gives a high transferrin saturation, which is the finding that needs a repeat test.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"126","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4487","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the storage form of iron. At 126 ng/ml, this is within the optimal range of 50 to 200 for a male. A normal ferritin is reassuring because in genuine haemochromatosis, ferritin tends to rise progressively. The elevated serum iron with normal ferritin suggests a transient elevation rather than chronic overload, but the repeat test will confirm this.","low_causes":"Iron deficiency, blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, inflammation, infection, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5381","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5869","units":"pmol/L","description":"Free T4 is the storage form of thyroid hormone, produced by the thyroid gland. At 18.4 pmol/L, this is within the optimal range of 14 to 20, confirming adequate thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excess thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3836","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3701","upper_optimal_position":"0.4898","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how hard to work. A high TSH means the thyroid is underperforming; a low TSH means it is overactive. At 1.27 mIU/L, this is within the optimal range of 1.0 to 2.5, confirming that the thyroid is working well with minimal pituitary stimulation.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroiditis, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5259","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the active form of thyroid hormone that drives metabolism, energy and body temperature. At 5.2 pmol/L, this is within the optimal range of 4.5 to 6.5, confirming efficient conversion from T4 to T3.","low_causes":"Hypothyroidism, low energy availability, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, thyroiditis, T3-secreting nodule","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies are markers of autoimmune thyroid disease, particularly Hashimoto's thyroiditis. At below 6.6 U/ml, this is negative and rules out autoimmune thyroid activity.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. At below 1.3 U/ml, this is negative and, together with the negative TPO antibodies, comprehensively rules out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, thyroid cancer follow-up interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.283","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.283, this is within the optimal range and confirms healthy thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0360","lower_normal":  cancer when total PSA is also elevated","high_causes":"Benign prostatic conditions","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"8.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1101","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/ml","description":"CA 19-9 is a tumour marker primarily associated with pancreatic and gastrointestinal cancers. At 8.15 U/ml, this is well within the normal range of below 37 and raises no concerns.","low_causes":"Generally not clinically significant","high_causes":"Pancreatic cancer, bile duct cancer, colorectal cancer, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3152","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a tumour marker associated with colorectal and other cancers. At 1.45 ng/ml, this is within the normal non-smoker range of below 2.3 and raises no concerns.","low_causes":"Generally not clinically significant","high_causes":"Colorectal cancer, lung cancer, breast cancer, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5158","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3509","upper_optimal_position":"0.6140","units":"g/L","description":"IgG is the most abundant antibody in the blood and provides long-term immunity against infections. At 11.7 g/L, this is within the reference range and confirms a healthy adaptive immune system.","low_causes":"Immunodeficiency, certain medications, bone marrow disorders","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.6","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody the immune system produces in response to a new infection. At 0.8 g/L, this is within the reference range.","low_causes":"Immunodeficiency, certain medications","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5849","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is the antibody that protects mucosal surfaces including the gut, lungs and urinary tract. At 2.8 g/L, this is within the reference range. A normal IgA also validates the coeliac screen, which relies on IgA-based antibodies.","low_causes":"Selective IgA deficiency (common, usually harmless), immunodeficiency","high_causes":"Chronic infection, liver disease, coeliac disease, IgA // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){

  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');

    runIntro();

    gerr.style.display='block'; dob.classList.add('shake');

}
