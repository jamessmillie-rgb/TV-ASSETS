<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Paulina Siwa","dob":"07/01/1994","report_date":"2026-10-21","summary":"Customer is a 32-year-old female presenting with a BMI of 21.5, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food daily; portions are about average (volume 5 out of 10). She trains three times per week (two cardio, one resistance) at moderate intensity with 10,000 to 15,000 daily steps. She sleeps 7 to 8 hours but feels tired most mornings, with energy at its lowest on waking. Stress feels hard to manage some weeks. She drinks 1 to 4 alcoholic drinks per week. She has an egg allergy and suspects milk may be causing skin problems and digestive issues. She has a copper coil (IUD) inserted seven months ago and reports lower abdominal pain since insertion. She has recently started iron, vitamin D and magnesium supplements. She has a family history of thyroid disease. She reports joint pain and stiffness, headaches, brain fog and bloating or digestive discomfort, all of which she describes as having been present for as long as she can remember. Her goals are to balance her hormones, improve digestion and gut health, and improve long-term health and longevity.\n\nThe finding in this report that deserves the most attention is her free testosterone, which at 0.0084 nmol/L sits below the lower limit of 0.013. Free testosterone is the fraction of total testosterone that is not bound to proteins in the blood and is therefore available for the body to use. Her total testosterone at 0.8 nmol/L is within the laboratory range of 0.5 to 2.6 but sits in the lower quarter. The reason so little of it is free is her sex hormone binding globulin, or SHBG, which at 71.1 nmol/L is within the laboratory range of 27.8 to 146 but sits in the upper half. SHBG is a protein made by the liver that binds testosterone and oestradiol, and the higher it is, the less of those hormones are available to tissues. At her lean BMI of 21.5, SHBG tends to run higher naturally, and being on no hormonal contraception means there is no exogenous oestrogen pushing it further up. The copper coil is non-hormonal, so it does not directly affect SHBG. However, the practical consequence is that her tissues are seeing less testosterone than is ideal. Testosterone in women supports energy, mood, joint health, muscle recovery and libido. Her joint stiffness and brain fog are both recognised features of low free testosterone, so while they may not be entirely explained by this one finding, there is a plausible link. This is worth discussing with her GP, who may want to repeat the test in the follicular phase of her cycle to confirm the pattern and consider whether any intervention is appropriate.\n\nHer creatine kinase, or CK, is 357 U/L against an upper limit of 200. CK is an enzyme released from muscle cells when they are damaged or worked hard. At this level it is almost certainly explained by her physical job as a cleaner combined with her three training sessions per week, and the fact that she walks 10,000 to 15,000 steps a day. Sustained physical work, especially when it involves lifting, bending and being on her feet all day, keeps CK elevated. This is not a concern in isolation and does not suggest muscle disease, but it is worth noting because persistently elevated CK can sometimes be seen with statin use or thyroid problems, both of which have been excluded here. No action is needed.\n\nHer folate at 19 ng/mL is above the upper laboratory limit of 17. This is not harmful. Folate is a B vitamin essential for DNA synthesis, red blood cell production and methylation. Above-range folate is almost always dietary or supplemental and carries no clinical risk. If she is taking a multivitamin or eating fortified cereals, that explains it entirely.\n\nHer total antioxidant activity at 1.81 mmol/L is marginally above the upper limit of 1.77. This reflects either supplementation, a diet rich in colourful vegetables and fruit, or both. It is a positive finding and requires no action.\n\nTurning to the positives, and there are many. Her cardiovascular profile is exceptional. Her total cholesterol at 5.0 mmol/L sits right at the desirable threshold, and the composition is what matters: her HDL cholesterol, the protective fraction that removes cholesterol from artery walls, is 2.5 mmol/L, which is outstanding and well above the 1.6 optimal threshold for women. Her LDL cholesterol at 2.16 mmol/L is within the optimal range of below 2.6, and her apolipoprotein B, or ApoB, which is the most accurate single measure of how many cholesterol-carrying particles are in the blood, is 0.58 g/L, well below the 0.8 optimal target. Her triglycerides at 0.81 mmol/L are below the 1.0 optimal threshold. Her Lp(a), which is a genetically inherited lipoprotein that drives cardiovascular risk and cannot be changed by diet or exercise, is below 25 nmol/L, safely under the 32 threshold. This is genuinely useful information because it means she carries no inherited lipid risk, and her already excellent profile is entirely the product of her lifestyle and genetics working together. Her ApoB to ApoA-I ratio at 0.27 is well within the lower-risk range of below 0.6. Her Cardiovascular Risk Score, a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 0 out of 100, which is as good as it gets.\n\nHer blood sugar control is excellent. Fasting glucose at 5.0 mmol/L is within the ideal range of 4.0 to 5.4, her HbA1c at 36 mmol/mol, which reflects average blood sugar over the past three months, is right at the optimal threshold, and her fasting insulin at 3.87 mIU/L is within the ideal range of 2 to 8. Her HOMA-IR, a calculated index of insulin resistance derived from glucose and insulin, is 0.86, confirming she is insulin-sensitive. Her C-peptide at 381 pmol/L (converted from 1.15 ug/L) is within range. This is a clean metabolic picture with no sign of insulin resistance or blood sugar dysregulation, which is reassuring given her family history of type 2 diabetes and an important baseline to maintain.\n\nHer liver is in excellent health. ALT at 21, AST at 25, Gamma GT at 17 and bilirubin at 17 are all well within range, and her FIB-4 score at 0.56 and APRI at 0.2 both confirm there is no sign of liver fibrosis or fatty change. Her amylase at 41 and lipase at 40, both enzymes from the pancreas, are within range, which is relevant to her bloating symptoms because it confirms the pancreas is producing digestive enzymes normally.\n\nHer kidney function is strong. Cystatin C at 0.98 gives a cystatin C-based eGFR of 93 and a combined eGFR of 93, both comfortably above the 90 optimal threshold. Urea, creatinine, sodium, potassium, chloride and bicarbonate are all within range. Her uric acid at 246 umol/L is within the optimal range for women.\n\nHer thyroid is working well, which is particularly reassuring given her family history of thyroid disease. TSH at 0.72 mIU/L is within the laboratory range of 0.55 to 4.78 and within the optimal band of 1.0 to 2.5, sitting just below it, which at 32 in a healthy woman is normal physiological variation rather than overactivity. Free T4 at 14.9 pmol/L is within the optimal range of 14 to 20. Free T3, the active thyroid hormone that cells actually use, is 5.5 pmol/L, within the optimal band of 4.5 to 6.5. Her FT3 to FT4 ratio at 0.369 confirms good conversion from T4 to T3. Both thyroid antibodies, TPO and thyroglobulin, are negative, which means there is no autoimmune thyroid activity despite the family history. This does not guarantee she will never develop thyroid autoimmunity, but right now the gland is healthy and the antibodies are absent.\n\nHer full blood count is entirely normal. Haemoglobin at 144 g/L is strong for a woman, sitting in the upper part of the 120 to 150 range. Red blood cells, white blood cells, platelets, MCV, MCH and all differential counts are within range. Her ESR at 7 and hsCRP at 0.3 mg/L, both markers of inflammation, are low, which effectively rules out any significant systemic inflammatory process driving her joint pain.\n\nHer iron studies tell an interesting story. Ferritin at 36 ng/mL is within the laboratory range of 10 to 291 but below the optimal threshold of 40. For a menstruating woman with a copper coil, which is known to increase menstrual blood loss, this is not surprising. She has recently started iron supplements and reports that her brain fog has already improved, which supports the idea that her ferritin was lower before supplementation and may have been contributing to her fatigue and cognitive symptoms. Her serum iron at 27.8 umol/L is healthy, her transferrin saturation at 44.1% is within the optimal range of 25 to 40%, sitting slightly above it but not at a level that raises concern, and her transferrin at 2.51 g/L is right at the lower end of the range. The combination of a rising iron and saturation with a ferritin still below optimal suggests the supplements are working and ferritin is on its way up. She should continue her iron supplement until ferritin reaches at least 50, ideally 70 to 80, and then retest.\n\nHer vitamin D at 76 nmol/L is within the sufficient range and within the optimal band of 75 to 120. She has recently started supplementing, so this is heading in the right direction. She should continue at a maintenance dose to keep it above 75 through the winter months.\n\nHer B12 at 588 pg/mL is within the optimal range of 500 to 900. Her folate at 19 ng/mL is above range but benign, as discussed. Her magnesium at 0.84 mmol/L is within the laboratory range of 0.53 to 1.11 but just below the optimal threshold of 0.85. She has recently started magnesium supplements, which should bring this into the ideal band. Given her sleep quality, with tiredness on waking despite 7 to 8 hours, magnesium glycinate taken before bed may help improve sleep depth.\n\nHer immune markers are unremarkable. IgG, IgM and IgA are all within range, IgE at 29 is well within the normal limit of 100, and rheumatoid factor is negative, which is relevant to her joint stiffness and effectively rules out rheumatoid arthritis as a cause. Her tissue transglutaminase IgA, the screening test for coeliac disease, is negative. This is important because her bloating, digestive discomfort and brain fog could all be features of coeliac disease, and this result makes that diagnosis very unlikely while she is eating gluten.\n\nHer tumour markers are all clear. CA125 at 10.1, CA15-3 at 15.52, CA19-9 at 7.06 and CEA at 0.56 are all well within their respective limits.\n\nHer hormonal picture, aside from the free testosterone discussed above, shows a pattern consistent with the luteal phase of her menstrual cycle. Oestradiol at 633 pmol/L falls within the luteal range of 204.8 to 786.1, and progesterone at 73.47 nmol/L falls within the luteal range of 10.62 to 81.28, confirming she ovulated this cycle. LH at 1.73 and FSH at 3.31 are consistent with the luteal phase. DHEA-S at 4.4 umol/L (1,621 ug/dL) is within range. Prolactin at 174 uIU/mL is within the non-pregnant range. Cortisol at 271 nmol/L is within the morning reference range, sitting in the lower half, which is consistent with her pattern of feeling tired on waking and potentially wired at night, suggesting her cortisol rhythm may be slightly shifted.\n\nHer urinalysis is clear. Protein, glucose, ketones, blood and nitrites are all negative. Bacterial culture and sensitivities are pending.\n\nHer PhenoAge, a composite biological ageing marker built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 21.3 years against her calendar age of 32, making her biologically almost eleven years younger than her chronological age. This is an excellent result and reflects how well her metabolic, immune and organ systems are functioning.\n\nReturning to her symptoms, bloating, digestive discomfort, brain fog, joint stiffness and headaches have been present for as long as she can remember. The bloods have positively excluded several important causes: coeliac disease is negative, pancreatic enzymes are normal, inflammation markers are low, thyroid function is healthy, liver and kidney function are excellent, and there is no anaemia. The findings that could be contributing are her borderline-low ferritin, which she is already addressing with supplements and which may explain some of the brain fog, and her low free testosterone, which could contribute to joint stiffness and cognitive symptoms. However, the bloating and digestive discomfort are not explained by any blood marker. Given her suspicion that milk is causing skin and digestive problems, the most likely explanation for the bloating is a food intolerance, most probably lactose intolerance or a sensitivity to dairy proteins. A hydrogen breath test through her GP would confirm or exclude lactose intolerance. Alternatively, a structured elimination trial, removing dairy completely for three to four weeks and then reintroducing it systematically, would clarify whether dairy is the trigger. Her egg allergy is already managed by avoidance. The daily sugar intake is also worth addressing, as high sugar consumption can feed gas-producing bacteria in the gut, worsen bloating and contribute to headaches. The lower abdominal pain since the copper coil insertion is a separate issue that she should discuss with her GP or the clinic that fitted it, especially if it is worsening or persistent, as coil position can be checked with an ultrasound.\n\nHer MCHC at 345 g/L sits exactly at the upper limit of 345 and is not a concern. Her calcium, phosphate and parathyroid hormone are all within range, confirming healthy bone metabolism.","links":"The thread that ties this report together is a young, lean, active woman whose blood work is overwhelmingly healthy but whose symptoms, particularly the bloating, brain fog, joint stiffness and morning tiredness, are not fully explained by the results. That mismatch is itself useful information, because it narrows the search.\n\nThe clearest biochemical finding is the low free testosterone. Her total testosterone sits in the lower quarter of the female range, and her SHBG is running high enough to bind most of what is there. At a BMI of 21.5 with no hormonal contraception, higher SHBG is physiologically expected, but the consequence is a free testosterone below the reference floor. This single finding connects to two of her four symptoms: joint stiffness and brain fog are both recognised features of low androgen availability in women. It does not explain the bloating or the headaches.\n\nThe ferritin at 36, below the optimal threshold of 40, connects to the brain fog from a different direction. Iron is essential for oxygen delivery to the brain and for dopamine synthesis, and suboptimal stores are one of the most common causes of cognitive dulling in menstruating women. She has noticed improvement since starting iron, which supports this explanation. The copper coil increases menstrual blood loss and likely contributed to the ferritin drifting down before she began supplementing.\n\nThe bloating and digestive discomfort sit outside the blood panel entirely. Coeliac disease has been excluded, pancreatic enzymes are normal, and there is no inflammatory signal. Her suspicion about dairy, combined with a history of symptoms that have been present for as long as she can remember, points toward a food intolerance, most probably lactose intolerance or dairy protein sensitivity. The daily sugar intake could be compounding this by increasing fermentation and gas production in the gut. A hydrogen breath test or a structured dairy elimination trial is the logical next step.\n\nThe headaches are the loosest thread. They are not explained by blood pressure (not measured here), not by anaemia (haemoglobin is strong), not by thyroid dysfunction, and not by inflammation. They could be related to the low free testosterone, to the suboptimal ferritin, to the daily sugar intake causing blood sugar fluctuations between meals, to dehydration, to her sleep quality, or to tension from the physical demands of her work. They are worth mentioning to the GP in the context of the other findings but do not point to a single blood-based cause.\n\nWhat was excluded matters. The negative thyroid antibodies against a family history of thyroid disease are genuinely reassuring. The negative coeliac screen rules out a condition that would explain every one of her symptoms. The low CRP and ESR rule out inflammatory arthritis or any systemic inflammatory process. The negative rheumatoid factor rules out rheumatoid arthritis specifically. The clean metabolic picture, with no insulin resistance and a healthy HbA1c, is an important baseline given the family history of type 2 diabetes.\n\nThe one area to watch is the copper coil. It does not show in the blood, but the lower abdominal pain she describes since insertion is a symptom her GP should assess. Copper coils can occasionally migrate, and a simple ultrasound confirms position. This is separate from the blood findings but important enough to flag.","lifestyle":"Cut out or significantly reduce daily sugary food and drinks. Swap for whole fruit, nuts or dark chocolate when the craving hits. Anchor: when you reach for something sweet after a meal, have one of these instead. Why: daily sugar feeds the gas-producing bacteria behind your bloating and may be contributing to your headaches and energy dips.\nTry a full dairy elimination for three to four weeks, replacing milk with oat or coconut alternatives and removing cheese, yoghurt and cream. Keep a symptom diary throughout. Anchor: start on a Monday, write one line about your stomach each evening. Why: your suspicion about milk is plausible and the only way to confirm it is a clean removal followed by deliberate reintroduction.\nAdd a palm-sized portion of protein to every meal, especially breakfast and lunch. Good sources given your egg allergy: Greek yoghurt (if dairy is not the trigger), chicken, fish, lentils, beans, tofu, nuts. Anchor: protein goes on the plate before anything else. Why: protein stabilises blood sugar between meals and supports the muscle recovery your active job demands. Your target is 73 to 90 grams per day.\nContinue your iron supplement (ferrous bisglycinate, 25mg, taken with a source of vitamin C such as orange juice) until your ferritin reaches at least 50, ideally 70 to 80. Anchor: take it with breakfast or lunch, not at the same time as your magnesium or vitamin D. Why: your ferritin at 36 is below optimal for a menstruating woman with a copper coil, and your brain fog has already improved since starting it.\nTake your magnesium glycinate (300 to 400mg) before bed rather than at another time of day. Anchor: put the bottle next to your toothbrush. Why: your magnesium at 0.84 is just below the optimal threshold of 0.85, and glycinate taken before bed supports deeper sleep, which matters because you wake tired most mornings despite 7 to 8 hours.\nAdd one more resistance training session per week, aiming for two total. Focus on compound movements: squats, deadlifts, rows, presses. Anchor: attach it to a day you already train cardio and do the resistance first. Why: resistance training supports joint health, builds the muscle that protects against the joint stiffness you describe, and helps maintain bone density.\nGet outside within the first hour of waking, even for ten minutes. Anchor: before your first cup of tea or coffee. Why: morning light resets your circadian clock and shifts cortisol to peak earlier in the day, which directly addresses your pattern of feeling tired on waking and potentially wired at night.\nSet a caffeine cut-off of 1pm. Anchor: after lunch, switch to water, herbal tea or decaf. Why: caffeine after early afternoon delays sleep onset and reduces deep sleep, which may be why you feel tired despite adequate hours in bed.","flags":"Free testosterone 0.0084 nmol/L, below the lower limit of 0.013. Total testosterone 0.8 nmol/L is in range but in the lower quarter. SHBG 71.1 nmol/L is in the upper half of the reference range, binding most available testosterone. Low free testosterone is associated with joint stiffness, brain fog and fatigue in women. Recommend GP review and repeat testing in the follicular phase to confirm.\nCreatine kinase 357 U/L, above the upper limit of 200. Almost certainly exercise and occupational in origin given her physical job and training schedule. No symptoms of muscle disease. No action required unless it rises further or she develops muscle pain or dark urine.\nFerritin 36 ng/mL, within the laboratory range of 10 to 291 but below the optimal threshold of 40 for a menstruating woman. She has a copper coil increasing menstrual losses and has recently started iron supplementation with subjective improvement in brain fog. Continue supplementation and retest in three to four months.\nMagnesium 0.84 mmol/L, within the laboratory range but marginally below the optimal threshold of 0.85. She has recently started magnesium supplementation.\nFolate 19 ng/mL, above the upper laboratory limit of 17. Benign, likely dietary or supplemental. No action needed.\nTotal antioxidant activity 1.81 mmol/L, marginally above the upper limit of 1.77. Likely supplemental or dietary. No clinical concern.\nSystemic Immune-Inflammation Index 793, above the optimal upper limit of 450 but within the laboratory range of 100 to 600. This is a composite index; her individual inflammatory markers (CRP 0.3, ESR 7) are both low, so the modest elevation here is driven by the neutrophil count at 4.45 and the lymphocyte count at 1.75, both individually normal. No action needed.\nBacterial count and urine culture pending. Urinalysis otherwise clear with no white cells, no red cells, no nitrites, no protein.\nReassuring negatives: coeliac screen (tTG IgA) negative, thyroid antibodies both negative despite family history of thyroid disease, rheumatoid factor negative, all tumour markers clear (CA125 10.1, CA15-3 15.52, CA19-9 7.06, CEA 0.56), hsCRP 0.3, ESR 7, IgE 29, HOMA-IR 0.86 confirming insulin sensitivity, eGFR 93, FIB-4 0.56, no anaemia (Hb 144).","recommendations":"Discuss low free testosterone (0.0084 nmol/L, below 0.013) with your GP. Ask for a repeat test taken in the early follicular phase (days 2 to 5 of your cycle) to confirm the finding. Bring the SHBG value of 71.1 nmol/L and total testosterone of 0.8 nmol/L so the GP can see the full picture.\nAsk your GP or the clinic that fitted your copper coil to check its position with an ultrasound, given the persistent lower abdominal pain since insertion seven months ago.\nAsk your GP about a hydrogen breath test for lactose intolerance, given your long-standing bloating, digestive discomfort and suspicion that milk worsens your symptoms.\nContinue iron supplementation (ferrous bisglycinate 25mg daily with vitamin C) and retest ferritin in three to four months, aiming for a level of at least 50, ideally 70 to 80 ng/mL.\nMaintain your current calorie intake at approximately 1,800 to 2,000 kcal per day to support your active lifestyle and lean body composition (estimated TDEE 2,000 kcal at moderate activity). Aim for 73 to 90 grams of protein per day (1.3 to 1.6 g/kg). Retest in six months: free testosterone, ferritin, magnesium, vitamin D and a basic thyroid panel (TSH, FT4) to track progress and monitor the family history.","supplementation":"Iron: ferrous bisglycinate, 25mg daily, taken with breakfast or lunch alongside a source of vitamin C (orange juice, kiwi, bell pepper). Do not take at the same time as magnesium, calcium or tea/coffee as these block absorption. Why: ferritin at 36 is below the optimal threshold of 40 in a menstruating woman with a copper coil, and brain fog has already improved since starting.\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with a meal containing fat. Why: vitamin D at 76 nmol/L is within the optimal band but only just, and winter months will push it down without continued supplementation.\nVitamin K2: MK-7, 100 mcg daily, taken with vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones rather than soft tissues and arteries.\nMagnesium: glycinate, 300 to 400mg elemental magnesium, taken before bed. Why: magnesium at 0.84 is marginally below the 0.85 optimal threshold, and glycinate form supports sleep quality, which matters given the pattern of waking tired.\nOmega-3: fish oil providing 2g combined EPA and DHA daily, taken with a meal. Why: omega-3 supports joint comfort, which is relevant to her joint stiffness, and complements an already excellent cardiovascular profile.\nDo not take additional folate or folic acid supplements. Folate is already above range at 19 ng/mL.\nThe most important changes from this report are not supplements. They are removing daily sugar, trialling a dairy elimination to identify the cause of the bloating, continuing to build ferritin back up, and discussing the low free testosterone and coil position with her GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 81.6; held to 59 by a system rated \"See your GP\". Weakest systems: vitamins & nutrients 44%, inflammation 54%, hormones 60%. Biggest drags: Free Testosterone (Calculated), Creatine Kinase, TSH, Systemic Immune-Inflammation Index.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"21.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2878","lower_normal":"","upper_normal":"37","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4324","units":"years","description":"PhenoAge is a composite biological ageing marker built from nine blood tests: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Her PhenoAge of 21.3 years against a calendar age of 32 means she is biologically almost eleven years younger than her chronological age. This is an excellent result, driven by her very low CRP, healthy albumin, low glucose and normal blood counts. It reflects how well her metabolic, immune and organ systems are functioning and provides a strong foundation for her long-term health goals.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built rather than the ten-year probability of an event. Her score of 0 is the lowest possible, reflecting exceptional lipid, inflammatory and metabolic health across every input. There is nothing to act on here.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT is an enzyme found mainly inside liver cells. When the liver is under strain, ALT leaks into the blood and the level rises. Her ALT at 21 is well within the optimal threshold of below 25 for women, confirming the liver is healthy and under no metabolic stress.","low_causes":"","high_causes":"Fatty liver disease, alcohol, medications, hepatitis, obesity, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.5833","units":"IU/l","description":"AST is an enzyme found in the liver, heart and muscles. It rises when any of these tissues are damaged. Her AST at 25 is comfortably within the optimal range, and in the context of a normal ALT and normal CK pattern (her CK is elevated from exercise, no ition":"0.5818","units":"nmol/l","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. It should peak in the morning and decline through the day. Her cortisol at 271 nmol/L is within the morning reference range, sitting in the lower half. This is consistent with her report of feeling tired on waking, as a cortisol that does not peak strongly in the morning can leave a person feeling slow to start the day. Morning light exposure and consistent wake times help reset the cortisol rhythm.","low_causes":"Adrenal insufficiency, chronic fatigue, prolonged stress","high_causes":"Acute stress, Cushing's syndrome, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"633","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5528","lower_normal":"204.8","upper_normal":"786.1","lower_optimal":"300","upper_optimal":"700","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3850","upper_optimal_position":"0.5868","units":"pmol/L","description":"Oestradiol is the main oestrogen in premenopausal women. Her oestradiol at 633 pmol/L falls within the luteal phase range of 204.8 to 786.1, consistent with a normal menstrual cycle. This confirms healthy ovarian oestrogen production.","low_causes":"Menopause, low body weight, eating disorders, premature ovarian failure","high_causes":"Ovarian cysts, oestrogen-producing tumours, obesity, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"73.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5818","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"15","upper_optimal":"75","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3540","upper_optimal_position":"0.6378","units":"nmol/L","description":"Progesterone r function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}

      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>

}

  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = st.note ? `<strong>${esc(sys.label)}</strong>${esc(st.label)} · ${esc(st.note)}` : `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
