<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Jeremy Cutler","dob":"29/03/1955","report_date":"2026-10-09","summary":"Jeremy is a 71-year-old male presenting with a BMI of 31.4, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food some days; portions are large (volume 9 out of 10). He trains zero times per week with 2,000 to 5,000 daily steps. He sleeps 6 to 7 hours, feels tired most mornings, with an afternoon energy crash. Stress feels hard to manage most days. He drinks 1 to 4 alcoholic drinks per week. He takes a statin and has recently started vitamin D supplementation, and also takes Ginkgo Biloba. His previous NHS blood test flagged low phosphate, for which he was prescribed Sandoz Phosphate effervescent tablets for two to three months. He has a family history of heart attack or stroke before 60, dementia, and bowel, breast, prostate or ovarian cancer. He reports low energy and fatigue, poor sleep and insomnia, weight gain and difficulty losing weight, and low sex drive, all lasting over a year. His goals are to balance hormones, boost immune system and prevent disease.\n\nThe finding that should be discussed with his GP first is a pattern across three connected results: his parathyroid hormone (PTH), his calcium, and his immunoglobulins. PTH is a hormone released by four tiny glands behind the thyroid that controls calcium levels in the blood. Jeremy's PTH is 7.9 pmol/L, well above the upper limit of 4.73, meaning the parathyroid glands are working considerably harder than they should be. His total calcium is 2.66, marginally above the upper limit of 2.65, and his corrected calcium (adjusted for the albumin level in the blood) is 2.54, which sits within the laboratory range of 2.2 to 2.6 but is towards the top. The combination of elevated PTH alongside a calcium that is high-normal to marginally above range raises the possibility of primary hyperparathyroidism, a condition where one or more of those small glands becomes overactive and pushes calcium upward. This is the most common cause of elevated PTH with calcium at the upper end in a 71-year-old man. It is worth noting that his previous NHS blood test found low phosphate, and phosphate is one of the minerals that primary hyperparathyroidism pushes down, because PTH causes the kidneys to excrete more of it. His current phosphate at 1.2 is within the laboratory range of 0.78 to 1.65, so the Sandoz supplementation appears to have corrected the deficiency, but the fact that it was low in the first place fits the pattern. His GP should be made aware of this combination: the raised PTH, the borderline-high calcium, and the history of low phosphate, because together they suggest the parathyroid glands need investigating with a repeat paired calcium and PTH, a 24-hour urinary calcium collection, and possibly imaging.\n\nThe second finding for the GP is Jeremy's immunoglobulin levels. Immunoglobulins are the antibodies the immune system produces to fight infection. IgG, the most abundant antibody in the blood and the backbone of long-term immunity, is 4.3 g/L against a lower limit of 6.5, which is significantly below range. IgM, the antibody the body produces first when it encounters a new infection, is 0.3 g/L against a lower limit of 0.5. IgA, which protects the gut lining and mucosal surfaces, is 1.1, which is within range. Two out of three immunoglobulin classes being below range is a finding that needs investigating. In a 71-year-old, this could reflect age-related decline in antibody production (immunosenescence), but the degree of the IgG deficit, at roughly two-thirds below the lower limit, is more than what age alone typically explains. The GP should consider whether there is an underlying cause such as a protein-losing condition, medication effect, or a haematological process, and may wish to repeat the immunoglobulins, check a serum protein electrophoresis, and review his infection history. This finding is directly relevant to Jeremy's goal of boosting his immune system: his immune defences are measurably below where they should be, and understanding why is the first step.\n\nTurning to what is working well, and there is genuine good news here. Jeremy's liver is in excellent health. His ALT is 27 and his AST is 20, both comfortably within range, his Gamma GT is 22 which is well below the upper limit of 73 and below the tighter optimal threshold of 25, his bilirubin is 15 and his albumin is a strong 47. The APRI score, which screens for liver scarring, is 0.357, well within the healthy range. The FIB-4 score is 1.95, which is above the standard threshold of 1.45, but at 71 this score is being driven almost entirely by age and the mildly low platelet count in the calculation rather than by any sign of liver disease, and the lab itself notes that a score below 2 in someone over 65 with no other clinical indicators is not significant. Every actual liver marker is healthy, so the FIB-4 number does not reflect liver damage. His kidney function via creatinine gives an eGFR of 85, and the more accurate Cystatin C measurement gives an eGFR of 76. Cystatin C is a protein filtered by the kidneys that is not affected by muscle mass, making it more reliable than creatinine, particularly at 71 with a BMI of 31.4 and no resistance training. An eGFR of 76 at 71 represents mild age-related decline rather than kidney disease, as GFR drops naturally by roughly 1 ml per minute per year from the age of 40, placing his expected level around 80. His urea at 4.7 and creatinine at 80 are both healthy. His uric acid at 329 is comfortably within range. His PSA, the prostate-specific antigen, is 0.2, which is exceptionally low for a 71-year-old and essentially rules out prostate concerns, which is particularly reassuring given his family history of cancer. The free PSA ratio of 0.95 is excellent. His tumour markers CA19-9 and CEA are both well within normal limits. His ESR, an inflammation marker, is 4, which is very low, and his hsCRP, a more sensitive measure of systemic inflammation, is 0.5, which is below the tight optimal threshold of 1.0. At a BMI of 31.4 with ultra-processed food most days, having inflammation this low is a genuinely positive finding. His rheumatoid factor is negative. His coeliac screen is negative. His creatine kinase at 111 is mid-range, showing no muscle damage.\n\nHis blood sugar control tells a more nuanced story. His fasting glucose is 4.5, which is excellent and well within the optimal range. His HbA1c, which measures average blood sugar over the previous two to three months, is 39 mmol/mol, which is within the normal range of below 42 and sits within the optimal band of below 36 when expressed as a percentage (5.7%). His insulin, however, is 10.03 mIU/L, and when combined with his glucose of 4.5, this gives a HOMA-IR of 2.01. HOMA-IR is a measure of how hard the pancreas has to work to keep blood sugar under control. A score below 1.0 is optimal, below 1.5 is acceptable, and above 1.9 indicates early insulin resistance. At 2.01, Jeremy's pancreas is producing more insulin than it should need to maintain that healthy glucose level. The TyG index, another measure of metabolic efficiency built from triglycerides and glucose, is 9.3 against an optimal of below 8.5, which confirms the same message from a different angle. This is the metabolic pattern of someone whose body is managing blood sugar but is having to work harder than it should, and it is being driven by three things: the BMI of 31.4, the ultra-processed food most days, and the very low activity level. The triglycerides confirm this: at 3.06 mmol/L, well above the fasting target of below 1.7, they reflect excess carbohydrate and processed food being converted to fat in the liver. This is the single most diet-responsive marker in the report and will come down substantially with the dietary changes below.\n\nHis lipid profile overall is shaped by the statin, which is doing its job on the LDL side. His total cholesterol is 4.1, his LDL is 1.69, and his ApoB (apolipoprotein B, the protein that carries LDL particles and the single best predictor of cardiovascular risk from cholesterol) is 0.8, which sits at the desirable threshold of below 0.9 and at the tighter optimal of below 0.8. His Lp(a), a genetically inherited lipoprotein that increases cardiovascular risk independently of LDL, is below 25 nmol/L against a target of below 32, which is genuinely useful information: it means the cardiovascular risk from his lipids is entirely modifiable through diet and medication rather than being driven by an inherited factor he cannot change. His HDL at 1.3 is between the low-risk and high-risk thresholds; it is not low enough to be flagged but is below the optimal of above 1.4. HDL is the cholesterol that carries fat away from artery walls, and the most effective ways to raise it are regular movement and reducing refined carbohydrate, both of which Jeremy has room to improve. His ApoA1, the protein on HDL particles, is 1.55, which is healthy. The ApoB to ApoA1 ratio is 0.52, which is well within the low-risk zone of below 0.7. However, the triglyceride elevation at 3.06 pushes his VLDL (the triglyceride-carrying particle made by the liver) to 1.39 against a target of below 0.78, and his atherogenic index of plasma to 0.372 against an optimal of below 0.11. The remnant cholesterol, the cholesterol left in VLDL after it delivers its triglycerides, and the cardiovascular risk score of 30 out of 100 (acceptable is below 40, ideal is below 20) are both being driven primarily by the triglycerides. Given his family history of heart attack or stroke before 60, bringing the triglycerides down is the most important cardiovascular action in this report, and it is entirely achievable through dietary change.\n\nHis thyroid is an interesting finding. TSH, the hormone the pituitary gland sends to tell the thyroid how hard to work, is 4.77 against an upper limit of 4.78, sitting right at the boundary. This is not technically above range, but it is well above the optimal band of 1.0 to 2.5, which means the pituitary is having to push quite hard to maintain thyroid output. The good news is that the thyroid is responding: his free T4 (the storage form of thyroid hormone) is 18.7, which is well within the optimal range of 14 to 20, and his free T3 (the active form) is 5.3, also within the optimal range of 4.5 to 6.5. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease (Hashimoto's thyroiditis). What this pattern suggests is that the thyroid needs more encouragement than average to produce the right amount of hormone, but it is still managing. At 71, TSH does drift upward naturally, and a level just under 5 without antibodies does not usually require treatment, but it is worth monitoring because if the TSH continues to rise above 5 or 6 over the coming years, the thyroid may start to fall behind. This is relevant to his fatigue and weight gain symptoms, because even subclinical thyroid underperformance can contribute to both.\n\nJeremy's hormone profile shows a pattern consistent with age but below optimal levels. His testosterone is 12.8 nmol/L, which is within the laboratory range of 8.4 to 28.7 but well below the optimal range of 18 to 30. His free androgen index, which reflects how much testosterone is available for the body to use, is 23.88 against a lower limit of 30, which is below range. His SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable) is 53.6, which is towards the upper end of the range. The combination of low-normal total testosterone, elevated SHBG binding most of it, and a below-range free androgen index means that the amount of testosterone actually available to his tissues is limited. His bioavailable testosterone at 4.61 nmol/L is within the reference range but towards the lower end. His FSH at 35.64 and LH at 19.48 are both well above their respective upper limits, which is expected at 71 because the pituitary increases these hormones as the testes produce less testosterone with age. His oestradiol at 150 pmol/L is marginally above the upper limit of 146.1. At a BMI of 31.4, body fat contains an enzyme called aromatase that converts testosterone to oestradiol, which partly explains both the elevated oestradiol and the relatively low testosterone. His DHEA-S at 1.3 umol/L (479 ug/dL) is within range. His progesterone at 0.53 is below the male reference range of 0.89 to 3.88, but in men progesterone is not clinically significant at these levels. His cortisol at 271 nmol/L is within the morning reference range. This hormone picture is directly relevant to his low libido, fatigue and difficulty losing weight, and while much of it is age-related, reducing body fat would lower the aromatase activity, improve the testosterone-to-oestradiol balance, and increase the amount of free testosterone available.\n\nHis vitamin D is 57 nmol/L, which is classified as sufficient (above 50) but is well below the optimal range of 75 to 120. He has only recently started supplementation, so this is likely his baseline or close to it. At a BMI of 31.4, vitamin D is sequestered in body fat, meaning he needs a higher dose than a lean person to reach optimal levels. His B12 at 236 pg/mL is within the laboratory range of 193 to 982 but well below the optimal of 500 to 900. B12 is essential for nerve function, energy production and red blood cell formation, and levels below 300 are associated with fatigue, poor concentration and low mood, all of which Jeremy reports. His folate at 9 ng/mL is within range and within the optimal band of above 8. His total antioxidant activity at 1.96 is above the upper limit of 1.77, which is most likely driven by the Ginkgo Biloba supplement he takes, as this is a potent antioxidant and commonly elevates this marker.\n\nHis full blood count shows a few findings worth noting. His platelets at 140 are below the lower limit of 150. At 71, a mildly low platelet count is common and is most often related to age, but it should be tracked on repeat testing. His MPV (mean platelet volume, the average size of his platelets) is 10.9 against an upper limit of 10.1. When platelet count is low, the bone marrow often produces larger platelets to compensate, so the elevated MPV alongside the low count is a consistent and expected pattern rather than two separate problems. His MCH (mean cell haemoglobin, the average amount of haemoglobin in each red blood cell) is 33.6 against an upper limit of 32. This is marginally above range and, with an MCV of 98.1 (within range but towards the upper end), suggests slightly larger red cells carrying slightly more haemoglobin. In the context of a B12 of 236, which is sub-optimal, this could be an early signal that B12 is not quite supporting red cell production optimally, as B12 deficiency causes red cells to enlarge. Improving B12 may bring both the MCV and MCH down over time. His haemoglobin at 159, haematocrit at 0.464, white cell count at 6.26, and all differential white cells are healthy.\n\nHis PhenoAge, a biological ageing score calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 62.4 years against his calendar age of 71, meaning his blood markers suggest a biological age nearly nine years younger than his actual age. This is a genuinely positive finding, driven largely by his excellent inflammation markers, healthy albumin and clean liver enzymes.\n\nHis urinalysis is clean: no protein, no glucose, no blood, no white cells, no nitrites. The bacterial culture and sensitivities are pending.\n\nIn summary, the priorities from this report are: investigation of the elevated PTH with borderline-high calcium and the history of low phosphate; investigation of the low immunoglobulins; dietary change to address the elevated triglycerides, insulin resistance and excess weight; optimisation of vitamin D and B12; and monitoring of the thyroid, platelets and hormone levels over time.","links":"The most important thread running through this report connects the elevated parathyroid hormone, the borderline-high calcium and the history of low phosphate into a single pattern. PTH controls calcium by pulling it from bone, increasing absorption from the gut and reducing how much the kidneys excrete. When one of the four parathyroid glands becomes overactive, it produces too much PTH, which drives calcium upward and pushes phosphate down. Jeremy's PTH at 7.9 is nearly double the upper limit, his total calcium is marginally above range, and his previous NHS blood test found low phosphate. The Sandoz supplement has corrected the phosphate for now, but the underlying cause of the phosphate loss, the overactive PTH, appears to still be present. This combination is the classic presentation of primary hyperparathyroidism, which is the most common endocrine disorder in people over 50 and is usually caused by a benign adenoma on one of the parathyroid glands. It is treatable, often with a straightforward surgical procedure, and investigation should be the first action from this report.\n\nThe second thread is metabolic. Jeremy's triglycerides at 3.06, HOMA-IR at 2.01, TyG index at 9.3 and VLDL at 1.39 all point in the same direction: the liver is converting excess dietary carbohydrate and processed food into fat faster than the body can clear it. At a BMI of 31.4 with very low physical activity and ultra-processed food most days, this is the expected metabolic consequence. The statin is managing the LDL and ApoB effectively, but statins do not address triglycerides or insulin resistance. These markers will respond to dietary change and increased movement, and given the family history of cardiovascular disease before 60, bringing them into range is a priority.\n\nThe third thread connects the immunoglobulin findings to his goal of immune health. Both IgG and IgM are below range, with IgG significantly so. This is not explained by the statin (statins can mildly lower IgG but not typically to this degree), and while age-related immunosenescence is a contributor, the extent of the IgG deficit warrants investigation to exclude other causes. If a serum protein electrophoresis is normal and there is no protein loss elsewhere, this may simply represent his baseline immune profile, but it should be characterised before being accepted as such.\n\nThe hormone findings, while notable, are largely explained by two factors: age and body composition. At 71 with a BMI of 31.4, the elevated FSH and LH reflect the natural decline in testicular function, the elevated oestradiol reflects aromatase activity in body fat converting testosterone to oestrogen, and the low free androgen index reflects SHBG binding what testosterone remains. Reducing body fat is the single most effective intervention for improving this balance without medication.\n\nOne important exclusion: the thyroid antibodies are both negative, which means the borderline-high TSH is not being driven by autoimmune thyroid disease. This is reassuring because it means the thyroid is unlikely to deteriorate rapidly, though it should be monitored annually. The borderline TSH may contribute modestly to his fatigue and weight gain but is not the primary driver; the metabolic picture above is the larger factor.","lifestyle":"Add a portion of protein to every meal before anything else goes on the plate: eggs or Greek yoghurt at breakfast, chicken or fish at lunch, and a palm-sized portion of meat, fish or legumes at dinner. Anchor: put the protein on the plate first, then build around it. Why: protein blunts the insulin response behind your HOMA-IR of 2.01 and keeps you full longer, which will help with weight loss at a BMI of 31.4. Your protein target is 145 to 180 grams per day.\nSwap ultra-processed meals for whole-food alternatives one meal at a time, starting with the meal you eat most processed food at. Replace ready meals, crisps, pastries and sugary snacks with meals built around vegetables, whole grains and protein. Anchor: when you reach for a processed option, swap it for the closest whole-food version. Why: ultra-processed food most days is the main driver of your triglycerides at 3.06 and your insulin resistance.\nIncrease your vegetable and fruit intake from 2 to 3 portions to at least 5 portions a day by adding one portion to lunch and one to dinner this week, then a third the following week. Anchor: before you sit down to eat, put the vegetables on the plate. Why: fibre from vegetables slows carbohydrate absorption, lowers triglycerides, feeds gut bacteria and supports the immune system that is underperforming in your bloods.\nWalk for 20 minutes after your largest meal every day. Anchor: plate in the sink, shoes on, out the door. Why: a post-meal walk lowers the glucose and insulin response to that meal, directly addressing your HOMA-IR of 2.01, and will help shift the afternoon energy crash you describe.\nAdd two more walks of at least 20 minutes on other days, building toward a daily total of 5,000 to 7,000 steps. Anchor: attach one to your morning routine (before or after breakfast) and one to the evening. Why: regular walking raises HDL (yours is 1.3, below the optimal of 1.4), lowers triglycerides, supports weight loss and improves sleep quality.\nSet a fixed wake time seven days a week, get outside within an hour of waking for natural light, and cut caffeine after midday. Anchor: alarm at the same time every day, then shoes on and step outside before anything else. Why: you sleep 6 to 7 hours and wake tired most mornings with an afternoon crash; a fixed wake time and morning light reset the cortisol rhythm that drives both patterns, and cutting afternoon caffeine protects sleep quality.\nReduce sugary food from some days to once a week or less. Anchor: designate one day as the day you have something sweet, and on other days choose fruit or yoghurt instead. Why: sugar drives triglyceride production in the liver and worsens insulin resistance, both of which are elevated in your results.\nCalorie target for gradual weight loss: 2,000 to 2,200 calories per day (your estimated maintenance is around 2,600 based on your weight, height and activity level). Protein floor: 145 grams per day. Weight target range: 95 to 100 kg as a first milestone, which would bring your BMI to 27 to 28 and meaningfully improve your triglycerides, insulin sensitivity, testosterone and energy levels. Retest in 12 weeks; the markers that will show the plan is working are triglycerides, HOMA-IR, HbA1c, weight and waist circumference.","flags":"PTH 7.9 pmol/L, nearly double the upper limit of 4.73, with total calcium 2.66 (marginally above 2.65) and corrected calcium 2.54 (high-normal). Combined with a history of low phosphate on previous NHS bloods, this pattern raises the possibility of primary hyperparathyroidism. Recommend paired repeat calcium and PTH, 24-hour urinary calcium, and referral for imaging if confirmed.\nIgG 4.3 g/L, significantly below the lower limit of 6.5. IgM 0.3 g/L, below the lower limit of 0.5. Two of three immunoglobulin classes are below range. Recommend serum protein electrophoresis and clinical review to investigate the cause.\nTriglycerides 3.06 mmol/L, well above the fasting target of 1.7. VLDL calculated at 1.39 against a target of below 0.78. HOMA-IR 2.01 against an optimal of below 1.0, indicating early insulin resistance. TyG index 9.3 against an optimal of below 8.5. Atherogenic index of plasma 0.372 against optimal of below 0.11. All five markers are driven by excess dietary carbohydrate and processed food at a BMI of 31.4. Cardiovascular Risk Score 30 out of 100, acceptable but above the ideal threshold of 20, driven primarily by the triglycerides.\nTSH 4.77 mIU/L, at the upper boundary of the laboratory range (4.78) and above the optimal of 2.5. Both thyroid antibodies negative. FT4 and FT3 are both optimal. This is a borderline finding that does not require treatment at present but should be monitored annually; if TSH rises above 5 to 6, the GP should reassess.\nTestosterone 12.8 nmol/L, within range but below optimal of 18. Free androgen index 23.88, below the lower limit of 30. Oestradiol 150 pmol/L, marginally above 146.1. FSH 35.64 and LH 19.48, both above range, consistent with age-related testicular decline. SHBG 53.6, towards the upper end, limiting free testosterone. Weight loss and increased activity are the primary interventions.\nVitamin B12 236 pg/mL, within range but below optimal of 500. May be contributing to fatigue and the marginally elevated MCH of 33.6.\nVitamin D 57 nmol/L, sufficient but below optimal of 75. Recently started supplementation; dose should be increased given BMI of 31.4.\nPlatelets 140, below the lower limit of 150. MPV 10.9, above the upper limit of 10.1. Consistent compensatory pattern at 71 but should be tracked on repeat testing.\nMCH 33.6, marginally above the upper limit of 32. MCV 98.1, within range but towards upper end. Likely related to sub-optimal B12. Progesterone 0.53, below the male range of 0.89; not clinically significant in men.\nReassuring negatives: PSA 0.2 with free ratio 0.95 (prostate risk extremely low), CA19-9 and CEA both well within limits, coeliac screen negative, rheumatoid factor negative, hsCRP 0.5, ESR 4, liver enzymes all healthy, fasting glucose 4.5, HbA1c 39, Lp(a) below 25, ApoB 0.8, kidney function stable for age, thyroid antibodies negative, urinalysis clean.","recommendations":"Discuss the elevated PTH at 7.9 with borderline-high calcium and the history of low phosphate with your GP. Ask for a paired repeat calcium and PTH on a fresh morning sample, a 24-hour urinary calcium collection, and referral for parathyroid imaging if results confirm the pattern. Bring this report showing PTH 7.9, total calcium 2.66, corrected calcium 2.54 and the previous low phosphate finding.\nDiscuss the low immunoglobulins with your GP: IgG 4.3 (lower limit 6.5), IgM 0.3 (lower limit 0.5). Ask for a serum protein electrophoresis and review of infection history to investigate the cause.\nAsk your GP to add a fasting lipid profile and HOMA-IR to your next routine blood test to track the triglycerides at 3.06 and insulin resistance at 2.01 as you make dietary changes.\nMention the TSH of 4.77 and ask for it to be included in annual monitoring. If it rises above 5 to 6 on repeat testing, thyroid replacement may be considered.\nDiscuss the hormone picture with your GP if low libido and fatigue do not improve with weight loss over the next three to six months: testosterone 12.8, free androgen index 23.88, oestradiol 150. Testosterone replacement therapy is an option but should follow lifestyle optimisation.\nDiscuss the platelet count of 140 with your GP and ensure it is tracked on repeat bloods. A stable mild reduction at 71 is usually benign, but a downward trend would need investigation.\nCalorie target: 2,000 to 2,200 calories per day. Protein target: 145 to 180 grams per day. Weight target: 95 to 100 kg as a first milestone. Retest in 12 weeks with a focus on triglycerides, HOMA-IR, HbA1c, full blood count, immunoglobulins, PTH, calcium and phosphate.","supplementation":"Vitamin D3 (cholecalciferol): 4,000 IU daily, taken with your largest meal that contains fat. At a BMI of 31.4, body fat sequesters vitamin D and you need a higher dose than a lean person. Your current level of 57 needs to reach 75 to 120 for optimal benefit. Always take with vitamin K2 (below) to direct the calcium to bones rather than arteries.\nVitamin K2 (MK-7): 200 mcg daily, taken with the vitamin D. K2 ensures calcium is deposited in bone rather than soft tissue, which is particularly important given your elevated PTH and borderline-high calcium.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Your B12 at 236 is below the optimal of 500 and may be contributing to your fatigue and the marginally enlarged red cells (MCH 33.6). Sublingual delivery bypasses absorption issues that become more common with age.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. This will help lower your triglycerides at 3.06, support cardiovascular health given your family history, and has a modest anti-inflammatory effect.\nMagnesium glycinate: 300 to 400 mg before bed. Your magnesium at 0.91 is within range but magnesium glycinate supports sleep quality (you wake tired most mornings), helps with stress management, and is the best-absorbed form for evening use.\nDo not start iron supplements. Your ferritin at 142 and iron studies are healthy; additional iron would risk pushing stores too high.\nThe Ginkgo Biloba you take is likely driving your total antioxidant activity above range at 1.96; this is not harmful but is worth noting. There is limited robust evidence for cognitive benefit from Ginkgo Biloba, and it can interact with blood thinners, so if you are ever prescribed anticoagulants, mention it to your GP.\nThe most important changes from this report are not supplements. They are reducing ultra-processed food, increasing protein and vegetables, walking daily, and losing weight toward 95 to 100 kg. These will do more for your triglycerides, insulin resistance, hormones and energy than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 53 out of 100. Every marker is s er_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite score from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built in the arteries, not a ten-year event probability. Jeremy's score of 30 is within the acceptable range of below 40 but above the ideal threshold of 20. The score is being driven primarily by the elevated triglycerides at 3.06 and the sub-optimal HDL at 1.3. His statin-controlled LDL of 1.69, healthy Lp(a) and low CRP are all working in his favour. Bringing the triglycerides below 1.7 with dietary change will likely move this score toward the ideal zone.","low_causes":"Healthy lipids, low inflammation, good metabolic control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6508","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver, and it reflects both liver function and nutritional status. Jeremy's albumin at 47 is well within the optimal range and shows his liver is producing protein efficiently. A strong albumin is one of the drivers of his favourable PhenoAge score.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"66", ":"Chronic stress, Cushing's syndrome, steroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"150","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5133","lower_normal":"0","upper_normal":"146.1","lower_optimal":"0","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4108","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone. In men, small amounts are produced in the testes and from conversion of testosterone by an enzyme called aromatase, which is found in body fat. Jeremy's oestradiol at 150 is marginally above the male upper limit of 146.1. At a BMI of 31.4, excess body fat increases aromatase activity, converting more testosterone to oestradiol, which contributes to both the elevated oestradiol and the relatively low testosterone. Reducing body fat will help rebalance this ratio.","low_causes":"Low body fat, aromatase inhibitors","high_causes":"Obesity, liver disease, aromatase excess, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2233","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6222","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and testes. Jeremy's progesterone at 0.53 is below the male reference range of 0.89 to 3.88. In men, progesterone below range is rarely clinically significant and does not require treatment. It may reflect the general age-related decline in gonadal hormone production.","low_causes":"Age-related decline, adrenal insufficiency","high_causes":"Adrenal hyperplasia, medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"19.48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7456","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and stimulates the testes to produce testosterone. Jeremy's LH at 19.48 is well above the upper limit of 9.3. This is expected at 71 because as testosterone production declines with age, the pituitary increases LH output in an attempt to stimulate the testes further. It confirms the pituitary is working correctly and the low testosterone is being driven by the testes rather than by the pituitary.","low_causes":"Pituitary disease, steroid use, obesity","high_causes":"Primary testicular failure, age-related decline, Klinefelter's","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"35.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8728","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"12","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5693","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland and supports sperm production in men. Jeremy's FSH at 35.64 is well above the upper limit of 18.1, consistent with age-related testicular decline. Like the elevated LH, this confirms the pituitary is responding appropriately to declining testicular function.","low_causes":"Pituitary disease, steroid use","high_causes":"Primary testicular failure, age-related decline","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"12.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4532","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, energy, mood and libido. Jeremy's testosterone at 12.8 is within the laboratory range of 8.4 to 28.7 but well below the optimal of 18 to 30. At 71, some decline is expected, but his level is also being suppressed by the excess body fat (which converts testosterone to oestradiol via aromatase) and elevated SHBG (which binds testosterone and makes it unavailable). His low libido and fatigue are consistent with this level. Weight loss is the most effective first step to improving testosterone naturally.","low_causes":"Age, obesity, stress, sleep deprivation, medication, pituitary disease","high_causes":"Steroid use, tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prol","name":"Prolactin","group":"HORMONES","result":"119","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4242","lower_normal":"45","upper_normal":"375","lower_optimal":"45","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6105","units":"uIU/ml","description":"Prolactin is a pituitary hormone that, in high levels, can suppress testosterone and libido. Jeremy's prolactin at 119 is within the optimal range, ruling out hyperprolactinaemia as a cause of his low libido.","low_causes":"Not clinically significant","high_causes":"Pituitary tumour, medication (antipsychotics, antidepressants), str hyroid is producing adequate hormone despite the borderline-high TSH pushing it to work harder.","low_causes":"Hypothyroidism, pituitary disease, medication","high_causes":"Hyperthyroidism, thyroiditis, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"4.77","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6593","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4985","units":"mIU/l","description":"Thyroid stimulating hormone is the signal the pituitary gland sends to the thyroid, telling it to produce more or less thyroid hormone. A higher TSH means the pituitary is pushing harder because it senses the thyroid output is not quite enough. Jeremy's TSH at 4.77 sits right at the upper boundary of the laboratory range (4.78) and well above the optimal of 1.0 to 2.5. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. This borderline elevation suggests the thyroid needs more encouragement than average to maintain output and should be monitored annually.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, age","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4889","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active form of thyroid hormone, responsible for driving metabolism, energy and heat production. Jeremy's FT3 at 5.3 is within the optimal range of 4.5 to 6.5, showing the thyroid is still converting T4 to the active T3 form adequately despite the elevated TSH.","low_causes":"Hypothyroidism, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"TPO Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies are produced by the immune system when it attacks the thyroid gland, and are the primary marker for autoimmune thyroid disease (Hashimoto's thyroiditis). Jeremy's TPO antibodies are below 6.6 against a limit of 13.8, which is negative and rules out autoimmune thyroid disease as the cause of his elevated TSH.","low_causes":"Not applicable","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. Jeremy's thyroglobulin antibodies are below 1.3 against a limit of 4.4, which is well within the normal range. More than 80% of people have undetectable levels, and Jeremy is among them.","low_causes":"Not applicable","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.283","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4440","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone (T4) to the active form (T3). Jeremy's ratio at 0.283 is within the optimal range, showing good peripheral conversion despite the elevated TSH.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3800","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood and muscle function. Jeremy's vitamin D at 57 nmol/L is classified as sufficient (above 50) but is well below the optimal range of 75 to 120. He has only recently started supplementation, so this is likely close to his baseline. At a BMI of 31.4, body fat sequesters vitamin D, meaning a higher dose of 4,000 IU daily is needed to reach optimal levels. This is particularly important given the elevated PTH and the need for calcium to be properly regulated.","low_causes":"Low sun exposure, dark skin, obesity, malabsorption, age","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"236","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3626","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4555","upper_optimal_position":"0.6147","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation and DNA synthesis. Jeremy's B12 at 236 is within the laboratory range of 193 to 982 but well below the optimal of 500 to 900. Levels below 300 are associated with fatigue, poor concentration, low mood and nerve symptoms, several of which Jeremy reports. His marginally elevated MCH (33.6) and upper-end MCV (98.1) suggest early macrocytic changes that may be related to sub-optimal B12. Sublingual methylcobalamin at 1,000 mcg daily is recommended.","low_causes":"Poor diet, malabsorption, age-related decline, pernicious anaemia, medication (metformin, PPIs)","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in red blood cell production and DNA synthesis. Jeremy's folate at 9 is within the optimal range of above 8, showing adequate intake from his diet.","low_causes":"Poor diet, alcohol, malabsorption, medication","high_causes":"Supplementation, high folate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"7.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7765","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6138","units":"pmol/L","description":"Parathyroid hormone is produced by four small glands behind the thyroid and controls calcium levels in the blood by pulling calcium from bone, increasing gut absorption and reducing kidney excretion. Jeremy's PTH at 7.9 is nearly double the upper limit of 4.73. Combined with a total calcium marginally above range (2.66 vs 2.65), corrected calcium at the top of the range (2.54), and a history of low phosphate on previous NHS bloods, this pattern raises the possibility of primary hyperparathyroidism. This is the most common cause of elevated PTH with high-normal or elevated calcium in someone over 50 and is usually caused by a benign adenoma on one of the parathyroid glands. His sub-optimal vitamin D at 57 could contribute to secondary PTH elevation, but secondary hyperparathyroidism typically drives calcium downward rather than upward, making primary hyperparathyroidism the more likely explanation. The GP should arrange a paired repeat calcium and PTH, a 24-hour urinary calcium collection, and consider imaging if confirmed.","low_causes":"Hypoparathyroidism, excess calcium, high vitamin D","high_causes":"Primary hyperparathyroidism, vitamin D deficiency (secondary), kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7133","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.4","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3809","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
