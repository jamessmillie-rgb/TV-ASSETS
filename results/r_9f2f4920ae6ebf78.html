const REPORT_DATA = {"patient_name":"Gary O'Brien","dob":"30/08/1980","report_date":"2026-08-22","summary":"Gary is a 45-year-old male presenting with a BMI of 23.1, following a low-carb, high-protein diet rated 7 out of 10 for quality with a volume of just 3 out of 10. He trains over five days per week in cardio alongside three resistance sessions, working as a Muay Thai coach, with 2,000 to 5,000 daily steps outside of training. He takes no medications, does not drink alcohol and has never smoked. He reports low energy, fatigue, brain fog and joint pain or stiffness. His goals are to improve energy levels, improve long-term health and longevity, and prevent disease. He notes a family history of low B12 and pernicious anaemia, a small basal cell carcinoma awaiting removal, and reports excellent sleep quality with a resting heart rate of 42 to 45 bpm and HRV of 90 to 120 ms. He stopped all supplements one month ago to get a clean baseline, having previously had high active B12 and high vitamin D on his 2022 panel.\n\nThe single most important finding in this report is that Gary is not eating enough. His diet volume at 3 out of 10, combined with a training load that is frankly enormous for someone at this calorie intake, is creating a pattern called low energy availability, sometimes referred to as Relative Energy Deficiency in Sport. Several findings across this report point to the same root cause, and understanding that connection is the key to interpreting almost everything flagged here.\n\nBefore unpacking that pattern, there is a great deal of good news. Gary's metabolic health is outstanding. His fasting glucose is 4.1, comfortably within the optimal zone, and his HbA1c, a measure of average blood sugar over the past three months, is 36 mmol/mol, which is as low as it gets within the healthy range. His HOMA-IR, a calculation that estimates how sensitive his cells are to insulin, is 0.47, which is actually below the lower end of the reference range and firmly in the insulin-sensitive category. For someone whose goal is disease prevention and longevity, this is one of the best metabolic profiles we see. His liver is in excellent health. ALT at 36 and AST at 30 are both within range, GGT at 23 is below the optimal threshold of 25, and his FIB-4 score, a calculation that estimates liver fibrosis risk, is 1.05, well under the threshold. Bilirubin, albumin, total protein, amylase and lipase are all exactly where they should be. His kidney function is superb. Cystatin C, a protein filtered by the kidneys that gives a more accurate estimate of filtration rate than creatinine alone, is 0.69, giving a calculated eGFR of 115, which represents excellent renal health at 45. His creatinine-based eGFR is also above 90. His inflammation is negligible. High-sensitivity CRP, the most reliable blood marker of systemic inflammation, is 0.3, which is outstanding and particularly reassuring given his heavy training load and joint symptoms. His ESR, another inflammatory marker, is 4, equally clean. This effectively rules out any significant inflammatory process driving his joint pain. His thyroid is functioning well. TSH at 2.36 is within the optimal band of 1.0 to 2.5, free T4 at 15.7 is within the laboratory range, and both thyroid antibodies are negative, which rules out autoimmune thyroid disease. Free T3 at 4.1 is within the laboratory range but sits below the optimal threshold of 4.5, and this is worth noting because T3 is the active thyroid hormone that drives energy and metabolism. In the context of low calorie intake, the body often downregulates T3 conversion as an energy-conservation strategy, which could be contributing to his fatigue and brain fog. His prostate health is excellent. PSA at 0.32 is very low for his age, with a healthy free PSA ratio, and both tumour markers CA 19-9 and CEA are well within range. His testosterone is 19.6, sitting within the optimal band of 18 to 30 for a man of his age, with SHBG at 41.4 and a free androgen index of 47.3, all of which look healthy. DHEA-S, a precursor hormone produced by the adrenal glands, is 6.1 umol/L, which is mid-range and reassuring. His cortisol at 330 is within the expected morning window. His vitamin D has come down from the 191 nmol/L he recorded in 2022 to 95 nmol/L after a month off supplements, which is actually a very good landing point, sitting comfortably within the optimal range of 75 to 120. His B12 at 647 is solidly within the optimal range of 500 to 900, and given his family history of pernicious anaemia this is genuinely reassuring. It suggests he is absorbing B12 effectively through his diet, though this should be monitored periodically given the family pattern. Folate at 13 is healthy. His calcium, magnesium, phosphate and electrolytes are all within range. His immune system markers, IgG, IgM, IgA and IgE, are all within their reference ranges, rheumatoid factor is negative, and coeliac screening via tissue transglutaminase is negative. His urine is clean with no protein, glucose, blood, white cells or nitrites detected.\n\nNow to the pattern that ties many of the flagged results together. Gary's neutrophils, the most abundant type of white blood cell and the body's first line of defence against bacterial infection, are 1.44, below the lower limit of 2.0. His total white cell count at 4.5 is technically within range but sitting right at the floor. His red blood cell count at 4.2 is below the lower limit of 4.5, and his reticulocytes, the young red blood cells freshly released from the bone marrow, are 35.7 in absolute terms against a lower limit of 50. Put these together and the bone marrow is quietly producing fewer cells across multiple lines. His MCV, the average size of each red cell, is 99.6, right at the top of the range, and his MCH, the average amount of haemoglobin packed into each cell, is 34, above the upper limit of 32. This combination of fewer but larger, more heavily loaded red cells is a recognised pattern when the body is making the most of limited raw materials. His haemoglobin itself is 143, which is within range, so the body is compensating effectively for now, but the underlying production rate is reduced. His CRP is 0.3, which essentially rules out infection or chronic inflammation as the cause. His B12 and folate are both healthy, so the classic nutritional causes of large red cells are not the explanation. What remains is the most likely driver: low energy availability. When total calorie intake is persistently below what the body needs to support both daily function and a heavy training schedule, the body responds by quietly downgrading the functions it can survive without in the short term. Bone marrow output slows. The immune system runs leaner. T3 conversion may drop. This is the body's way of economising. At a diet volume of 3 out of 10 with what amounts to eight or more training sessions per week as a Muay Thai coach, Gary is almost certainly running a meaningful calorie deficit that is not intentional and not serving him. This is the most likely explanation for his fatigue, brain fog, and possibly some component of his joint stiffness, because tendons and connective tissue also depend on adequate energy and protein availability for repair.\n\nHis C-Peptide, which converts to approximately 130 pmol/L, is below the laboratory range of 364 to 1457 pmol/L. C-Peptide is released alongside insulin from the pancreas in a one-to-one ratio and is a direct measure of how much insulin the body is producing. In Gary's case, with a fasting glucose of 4.1 and an HbA1c of 36, this low C-Peptide simply reflects very low insulin demand. His pancreas does not need to produce much insulin because his cells are extremely sensitive to it and his carbohydrate intake is low. This is not a sign of pancreatic insufficiency. It is entirely consistent with his low-carb diet and excellent insulin sensitivity.\n\nHis HOMA-IR at 0.47, below the lower reference of 0.5, is flagged by the laboratory but the lab's own commentary confirms that below 1.0 indicates optimal insulin sensitivity. This is a favourable result.\n\nHis uric acid at 216 is marginally below the lower limit of 220. Uric acid is a waste product from purine metabolism that also acts as an antioxidant. Very low levels can occasionally be associated with reduced antioxidant capacity and are sometimes seen in people with low dietary purine intake, which can occur on a restricted calorie diet. This is not clinically urgent but adds to the picture of the body running on minimal resources.\n\nHis transferrin at 1.99 is marginally below the lower limit of 2.15. Transferrin is the protein that carries iron through the blood. With a CRP of 0.3, this is not an inflammatory suppression. Given that his ferritin is 130, which is mid-range and healthy, his serum iron is 20.8, his transferrin saturation is 41.6% which is at the upper end of the optimal band of 25 to 40%, and his total iron binding capacity is within range, this pattern does not suggest iron overload requiring haemochromatosis investigation. The mildly low transferrin could reflect low energy availability reducing protein synthesis, as transferrin is made by the liver and its production can decrease when calorie intake is insufficient. This should be rechecked on a repeat panel once calorie intake has been addressed.\n\nTurning to his lipid profile. His total cholesterol is 5.7, above the desirable threshold of 5.18. His LDL cholesterol, the particles that carry cholesterol into artery walls, is 3.9 against a target of below 3.0. His ApoB, a direct count of the number of atherogenic particles in the blood and the single most useful cardiovascular risk marker, is 0.96 against a target of below 0.9. His non-HDL cholesterol at 4.1 is marginally above the 4.0 threshold. On the positive side, his HDL at 1.6 is excellent, sitting above the optimal threshold of 1.4 for a man, his ApoA1 at 1.58 is healthy, his triglycerides at 0.52 are outstandingly low, and his ApoB to A1 ratio at 0.61 is within the lower risk band below 0.7. His Lp(a), a genetically determined lipoprotein that independently increases cardiovascular risk, is pending and will need to be reviewed when it arrives, as it will determine whether his elevated LDL is entirely driven by modifiable factors or whether there is an inherited component. For someone whose goal is longevity and disease prevention, an ApoB of 0.96 is worth addressing. The good news is that his metabolic health is exceptional, his triglycerides are very low, and his HDL is strong, which means dietary modification alone may be enough to bring his LDL and ApoB into the optimal range. Increasing soluble fibre from oats, beans, lentils and flaxseed, adding oily fish two to three times per week, and potentially moderating saturated fat intake from any concentrated sources in his current diet would be the first steps. If these changes do not bring ApoB below 0.9 on retest, this would be worth discussing with his GP.\n\nHis potassium at 5.2 is within range but sitting very close to the upper limit of 5.3. The lab notes that delayed processing or time on cells can elevate potassium, so this may be a sample-handling artefact. It is worth rechecking on the next panel but does not require urgent action given the normal kidney function and the absence of any medication that would elevate potassium.\n\nHis creatine kinase at 154 is within range, which is reassuring given his training volume and confirms he is not in a state of significant muscle damage. His total antioxidant activity at 1.36 is within range. His progesterone at 1.35 is within the male reference range and is not clinically significant. His oestradiol at 71 is within range. His bacterial count and urine culture are pending and will be reviewed when available.\n\nLate-arriving results: Gary's urine culture and bacterial count have now returned. The mid-stream urine specimen showed no growth and a bacterial count of less than 1 CFU/ml, confirming the absence of any urinary tract infection. Combined with his negative nitrites and white blood cells reported earlier, his urinary health is entirely clean. The only result still outstanding from this panel is his Lp(a), which remains important for completing the cardiovascular risk picture and should be reviewed as soon as it arrives.","links":"The most impactful change Gary can make is increasing his total calorie intake. At 69 kg, 173 cm, 45 years old, and training at the volume he does, his estimated maintenance calories sit somewhere between 2,600 and 2,900 per day. A diet volume of 3 out of 10 suggests he is meaningfully below this. He does not need to count calories obsessively, but he should aim to eat substantially more than he currently does, targeting at least 2,400 to 2,600 calories per day as a starting point, and adjusting upward if energy does not improve. His protein target, given his training load and goals, should be 1.6 to 2.0 grams per kilogram of body weight per day, which translates to 110 to 138 grams of protein daily. On a low-carb, high-protein diet rated 7 out of 10 for quality, the food choices are likely good, so the answer is simply more of them. Adding an extra meal or a substantial snack containing protein and healthy fats each day would be a reasonable starting point. This single change is the most likely intervention to improve his energy, reduce his brain fog, support tendon and joint repair, and normalise his neutrophil count and red cell production.\n\nFor his lipid profile, introducing soluble fibre from oats, beans, lentils, flaxseed and psyllium husk would help reduce LDL and ApoB. If his current low-carb approach excludes these foods, he may wish to consider a more moderate carbohydrate intake that includes these fibre sources, as the cardiovascular benefit of lowering ApoB below 0.9 is well established for longevity. Adding oily fish such as salmon, mackerel or sardines two to three times per week would provide EPA and DHA, which support both cardiovascular health and joint comfort. If he is consuming significant amounts of saturated fat from coconut oil, butter or fatty cuts of meat, moderating these and replacing some with olive oil and nuts would help shift the lipid profile.\n\nGiven his family history of pernicious anaemia, B12 should be retested annually even while it remains healthy. If it begins to trend downward on future panels, intrinsic factor antibodies and a methylmalonic acid test would be the next steps to investigate early pernicious anaemia.\n\nFor his GP, the key conversation points are: neutrophils at 1.44, below the lower limit of 2.0, in the context of probable low energy availability rather than haematological pathology, though a repeat full blood count in three months would be prudent to confirm this normalises with increased calorie intake; red blood cell count at 4.2 with low absolute reticulocytes at 35.7 and elevated MCV and MCH, again likely energy-related; transferrin marginally below range at 1.99; and LDL at 3.9 with ApoB at 0.96, which may warrant discussion around cardiovascular risk reduction strategies if dietary changes do not bring these into range within six months. The pending Lp(a) result should be shared with the GP when it arrives.\n\nFor his joint and tendon pain, the normal CRP and ESR effectively rule out inflammatory arthritis. Given his work as a Muay Thai coach, mechanical overuse is the most likely explanation. Adequate calorie and protein intake are essential for tendon repair, and collagen synthesis depends on vitamin C and adequate energy availability. Ensuring he consumes vitamin C-rich foods daily and eats enough overall is more important for his tendons than any supplement.\n\nFor sleep, Gary already reports excellent sleep metrics with a resting heart rate of 42 to 45 and HRV of 90 to 120, which is genuinely impressive. No changes are needed here.\n\nA retest in three to four months is recommended, focusing on: full blood count with reticulocytes, to confirm that increased calorie intake normalises neutrophils, red cell count and reticulocyte output; a lipid panel including ApoB, to assess the effect of dietary changes; transferrin, to confirm normalisation; Lp(a) if not yet returned; and free T3, to assess whether it rises with improved energy availability.","flags":"Neutrophils 1.44, below lower limit of 2.0. In the context of very low calorie intake relative to training load, normal CRP, normal B12 and folate, this most likely reflects bone marrow economisation due to low energy availability rather than primary haematological pathology. Recommend repeat FBC in three months after calorie intake has been addressed. If neutrophils remain below 2.0 despite adequate nutrition, further haematological investigation would be warranted.\n\nRed blood cell count 4.2, below lower limit of 4.5, with absolute reticulocytes 35.7, below lower limit of 50. MCV 99.6, upper end of range. MCH 34, above upper limit of 32. Haemoglobin maintained at 143. Pattern is consistent with reduced bone marrow output with compensatory macrocytosis. B12 and folate are both healthy, ruling out megaloblastic causes. Most likely driven by low energy availability.\n\nC-Peptide 0.394 ug/L (approximately 130 pmol/L), below range of 364 to 1457 pmol/L (converted). In the context of fasting glucose 4.1, HbA1c 36, and HOMA-IR 0.47, this reflects very low insulin demand due to excellent insulin sensitivity and low carbohydrate intake rather than pancreatic insufficiency.\n\nHOMA-IR 0.47, below lower reference of 0.5. Lab commentary confirms below 1.0 is optimal insulin sensitivity. This is a favourable finding.\n\nTransferrin 1.99, marginally below lower limit of 2.15. CRP 0.3 excludes inflammatory suppression. Ferritin 130 and transferrin saturation 41.6% are reassuring against iron overload. May reflect reduced hepatic protein synthesis in the setting of low calorie intake. Recommend repeat.\n\nLDL 3.9, above target of 3.0. ApoB 0.96, above target of 0.9. Non-HDL cholesterol 4.1, above target of 4.0. Total cholesterol 5.7, above desirable 5.18. Offset by excellent HDL 1.6, triglycerides 0.52, ApoB/A1 ratio 0.61. Lp(a) pending. Dietary modification recommended as first-line approach.\n\nUric acid 216, marginally below lower limit of 220. Likely reflects low dietary purine intake in the context of restricted calories. Not clinically urgent.\n\nPotassium 5.2, within range but near upper limit of 5.3. May reflect sample handling. Kidney function is excellent. Recommend repeat on next panel.\n\nLp(a) pending. Bacterial count and urine culture pending.\n\nReassuring negatives: CRP 0.3 rules out systemic inflammation. ESR 4 confirms. Thyroid antibodies both negative rule out autoimmune thyroid disease. Coeliac screen negative. Rheumatoid factor negative. PSA 0.32 with healthy free ratio. All tumour markers clean. Liver function entirely normal. Kidney function excellent with Cystatin C eGFR 115. Fasting glucose 4.1 and HbA1c 36 rule out any glycaemic concern. B12 647 effectively rules out current B12 deficiency despite family history. Vitamin D 95 is optimal without supplementation.","recommendations":"Increase total calorie intake to at least 2,400 to 2,600 calories per day, aiming for a diet volume of at least 6 out of 10, to address the low energy availability pattern driving suppressed neutrophils, low red cell production and likely contributing to fatigue, brain fog and impaired tendon repair.\n\nEnsure daily protein intake of 110 to 138 grams, which equates to 1.6 to 2.0 grams per kilogram of body weight, spread across at least three meals.\n\nIntroduce soluble fibre sources such as oats, beans, lentils, flaxseed and psyllium husk to help reduce LDL and ApoB. If the current low-carb approach excludes these, consider a moderate adjustment to include them given the clear cardiovascular benefit.\n\nAdd oily fish two to three times per week for EPA and DHA, supporting both cardiovascular health and joint comfort.\n\nDiscuss the following with his GP: neutrophils at 1.44 with plan to retest after increasing calorie intake; LDL at 3.9 and ApoB at 0.96 for cardiovascular risk discussion; and the Lp(a) result when it arrives.\n\nRetest in three to four months with full blood count including reticulocytes, lipid panel with ApoB, transferrin, free T3, and Lp(a) if not yet returned.\n\nContinue monitoring B12 annually given the family history of pernicious anaemia.\n\nMaintain current sleep habits, which are excellent.\n\nConsider reducing caffeine intake, particularly if consuming energy drinks, as these may mask fatigue that is actually driven by under-eating and could contribute to the brain fog when the stimulant effect wears off.","supplementation":"Gary stopped all supplements one month ago to get a clean baseline, and the results show that his vitamin D has landed at 95 nmol/L, which is within the optimal range of 75 to 120. He does not need to restart vitamin D supplementation immediately, but given that this level will continue to drift downward without supplementation, particularly through the autumn and winter months, he should resume a maintenance dose of 2,000 IU of vitamin D3 (cholecalciferol) daily, taken with a fat-containing meal, from October onward. This should be paired with 100 mcg of vitamin K2 in the MK-7 form daily, which directs calcium into bone rather than into artery walls.\n\nOmega-3 fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food, would support his cardiovascular profile by helping to maintain his already excellent triglycerides while providing anti-inflammatory support for his joints and tendons. This is particularly relevant given his ApoB at 0.96 and his joint and tendon complaints.\n\nMagnesium glycinate at 300 to 400 mg taken before bed would support recovery from his heavy training schedule. His serum magnesium at 1.06 is within range but serum levels do not always reflect intracellular stores, and at his training volume, magnesium turnover is high. Glycinate is the preferred form as it is well absorbed and has a calming effect that supports sleep quality.\n\nHis B12 at 647 is solidly optimal and does not currently require supplementation. However, given his family history of pernicious anaemia, if B12 trends downward on future panels, sublingual methylcobalamin at 1,000 mcg daily would be the appropriate form, as sublingual delivery bypasses any potential absorption issues related to intrinsic factor.\n\nHis folate at 13 is healthy and does not require supplementation.\n\nHe should not take iron supplements. His ferritin at 130 is healthy and his transferrin saturation at 41.6% is already at the upper end of the optimal band. Additional iron would risk pushing saturation above the desirable range.\n\nFor tendon support specifically, 10 to 15 grams of hydrolysed collagen peptides taken with 500 mg of vitamin C approximately 30 to 60 minutes before training may support collagen synthesis in tendons and connective tissue. The evidence base is moderate but the mechanism is sound and the risk is negligible.\n\nThe most important changes from this report are not supplements. They are eating substantially more food, particularly protein, to match the energy demands of his training and coaching schedule, and introducing soluble fibre and oily fish to bring his LDL and ApoB into the optimal range.","biomarkers":[{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3214","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT, or alanine aminotransferase, is an enzyme found predominantly in the liver. When liver cells are damaged or inflamed, ALT leaks into the bloodstream. Gary's ALT at 36 is within the laboratory reference range of up to 56, though it sits above the tighter optimal threshold of below 30 that is associated with minimal liver strain. At this level, and with GGT, AST, bilirubin and albumin all healthy, there is no suggestion of liver disease. The mildly above-optimal reading could simply reflect his high training volume, as intense exercise can transiently raise ALT.","low_causes":"","high_causes":"Liver disease, hepatitis, alcohol excess, medications, fatty liver, intense exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4844","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST, or aspartate aminotransferase, is an enzyme found in the liver, heart, muscle and other tissues. It rises when any of these tissues are damaged. Gary's AST at 30 is comfortably within range and within the optimal band, confirming no significant tissue stress from his heavy training schedule.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart disease, intense exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1575","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1644","units":"IU/l","description":"GGT, or gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems and metabolic stress. It is one of the earliest markers to rise when the liver is under strain. Gary's GGT at 23 is well below the laboratory limit of 73 and sits below the optimal threshold of 25 for a male, reflecting excellent liver health. As a non-drinker, this is expected but still reassuring.","low_causes":"","high_causes":"Alcohol excess, bile duct obstruction, fatty liver, medications, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6048","units":"IU/l","description":"ALP, or alkaline phosphatase, is an enzyme found in the liver, bones and bile ducts. It can rise with liver disease, bile duct obstruction or bone conditions. Gary's ALP at 62 is well within range, confirming healthy liver and bone metabolism.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone disease, bile duct obstruction, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. It is processed by the liver and excreted in bile. Gary's bilirubin at 14 is within range, confirming normal red cell turnover and healthy liver clearance.","low_causes":"","high_causes":"Gilbert's syndrome, liver disease, haemolysis, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"70","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3453","upper_optimal_position":"0.6173","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood, reflecting nutritional status, liver function and immune health. Gary's total protein at 70 is within the optimal range, indicating adequate protein synthesis despite his low calorie intake.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and medications through the bloodstream and maintains fluid balance. Gary's albumin at 42 is within the optimal range, reflecting healthy liver synthetic function.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4815","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin encompasses a group of proteins including antibodies and transport proteins. Gary's globulin at 28 is mid-range, reflecting a healthy immune system and adequate protein production.","low_causes":"Immune deficiency, liver disease, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio reflects the balance between these two protein groups. Gary's ratio of 1.50 is within the optimal range, indicating a healthy balance of liver function and immune activity.","low_causes":"Liver disease, autoimmune conditions, chronic infection","high_causes":"Immune deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3621","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculation that estimates the risk of liver fibrosis, or scarring, using age, AST, ALT and platelet count. Gary's score of 1.05 is well below the 1.3 threshold for further investigation, confirming no evidence of liver fibrosis.","low_causes":"","high_causes":"Liver fibrosis, cirrhosis, age over 65, low platelets, low ALT","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4508","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is an enzyme produced mainly by the pancreas and salivary glands that helps digest carbohydrates. Gary's amylase at 67 is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4255","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3404","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase. Gary's lipase at 51 is within the laboratory range though above the tighter optimal threshold. With amylase also within range and no symptoms of pancreatic distress, this is not a concern.","low_causes":"","high_causes":"Pancreatitis, gallstones, bowel obstruction, kidney disease","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5510","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures all the cholesterol carried in the blood, including LDL, HDL and VLDL fractions. Gary's total cholesterol at 5.7 is above the desirable threshold of 5.18. However, total cholesterol alone is a relatively blunt tool. The more meaningful markers are LDL, ApoB and the HDL and triglyceride values, which together paint a more nuanced picture of cardiovascular risk.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, low physical activity, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6500","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.42","units":"mmol/l","description":"LDL cholesterol, often called 'bad' cholesterol, carries cholesterol from the liver into the artery walls, where it can contribute to plaque formation over time. Gary's LDL at 3.9 is above the upper limit of 3.0 and above the optimal target of below 2.6. In someone whose goal is longevity and disease prevention, and who does not drink or smoke and has excellent metabolic health, this is the primary modifiable cardiovascular risk factor in his profile. The pending Lp(a) result will help clarify whether there is a genetic component contributing to this elevation.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, familial hypercholesterolaemia, low-carb high-fat diets","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7692","lower_normal":"1.04","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL cholesterol, often called 'good' cholesterol, carries excess cholesterol away from the arteries and back to the liver for disposal. Higher levels are protective against cardiovascular disease. Gary's HDL at 1.6 is above the optimal threshold of 1.4 for a male, which is an excellent result and reflects his active lifestyle and healthy metabolic profile.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome, poor diet","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1529","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats in the blood that come from dietary fat and from carbohydrates converted by the liver. High levels are associated with cardiovascular disease and metabolic syndrome. Gary's triglycerides at 0.52 are outstandingly low, well below the optimal threshold of 1.0. This is consistent with his low-carb diet and excellent insulin sensitivity.","low_causes":"Low-carb diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate diet, obesity, metabolic syndrome, alcohol, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1538","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.50","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, or very low-density lipoprotein, carries triglycerides from the liver to the tissues. Gary's VLDL at 0.24 is very low, consistent with his excellent triglyceride level and low carbohydrate intake.","low_causes":"Low-carb diet, fasting","high_causes":"High carbohydrate diet, metabolic syndrome, obesity, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5125","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol represents all the atherogenic, or potentially artery-damaging, cholesterol in the blood. It is calculated by subtracting HDL from total cholesterol. Gary's non-HDL at 4.1 is marginally above the target of 4.0. This largely mirrors the elevated LDL finding.","low_causes":"Hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, genetic factors, hypothyroidism, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3956","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio is a useful summary measure of cardiovascular risk, reflecting the balance between atherogenic and protective cholesterol. Gary's ratio of 3.56 is within the optimal band, meaning his strong HDL is partially offsetting his elevated total cholesterol.","low_causes":"","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hdl_percentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"28.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7018","lower_normal":"20","upper_normal":"100","lower_optimal":"25","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"This measures what proportion of total cholesterol is carried by the protective HDL fraction. A higher percentage is more favourable. Gary's 28% exceeds the desirable threshold of 20% and the optimal threshold of 25%, reflecting his strong HDL level.","low_causes":"Sedentary lifestyle, obesity, metabolic syndrome","high_causes":"Regular exercise, healthy diet, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.96","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5333","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB, or apolipoprotein B, is a protein found on the surface of every LDL, VLDL and intermediate-density lipoprotein particle. Because there is exactly one ApoB molecule per particle, measuring ApoB gives a direct count of the total number of atherogenic particles in the blood. This is considered the single best blood marker for predicting cardiovascular risk. Gary's ApoB at 0.96 is above the desirable target of below 0.9 and the optimal target of below 0.8. For someone focused on longevity and disease prevention, reducing ApoB through dietary changes should be a priority.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetic factors, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6583","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"ApoA1, or apolipoprotein A1, is the main protein on HDL particles. Higher levels reflect greater HDL particle number and better reverse cholesterol transport, the process by which cholesterol is removed from artery walls. Gary's ApoA1 at 1.58 is above the optimal threshold of 1.4, confirming strong protective cholesterol transport.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic and protective lipoprotein particles in a single number. A ratio below 0.7 indicates lower cardiovascular risk. Gary's ratio of 0.61 is within the lower risk band, though marginally above the tighter optimal threshold of 0.6 for a male. This reflects the tug-of-war between his elevated LDL/ApoB and his strong HDL/ApoA1.","low_causes":"","high_causes":"Elevated LDL/ApoB, low HDL/ApoA1","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/l","description":"Lp(a), or lipoprotein(a), is a genetically determined lipoprotein that independently increases cardiovascular risk. It is inherited, cannot be changed by diet or lifestyle, and only needs to be measured once in a lifetime because the level is essentially fixed. Gary's result is pending and will be reviewed when available. This is an important result because if Lp(a) is elevated, it would mean his cardiovascular risk is higher than the other lipid markers suggest, and if it is low, it would confirm that his elevated LDL is driven entirely by modifiable factors.","low_causes":"","high_causes":"Genetic inheritance","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1250","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, and represents the cholesterol carried by triglyceride-rich remnant particles. These remnants are increasingly recognised as independently atherogenic. Gary's remnant cholesterol at 0.20 is well within the optimal range of below 0.5, consistent with his very low triglycerides.","low_causes":"Low triglycerides, low-carb diet","high_causes":"High triglycerides, metabolic syndrome, obesity, diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1100","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.29","units":"","description":"The triglyceride to HDL ratio is a surrogate marker of insulin resistance and small dense LDL particles. A lower ratio suggests larger, more buoyant LDL particles that are less atherogenic. Gary's ratio of 0.33 is excellent, confirming that his LDL particles are likely of the larger, less dangerous type despite their elevated number.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. It reflects how well the body manages blood sugar levels. Gary's glucose at 4.1 is within the optimal range of 4.0 to 5.4, confirming excellent blood sugar regulation.","low_causes":"Fasting, insulin excess, adrenal insufficiency","high_causes":"Diabetes, pre-diabetes, stress, infection, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the preceding two to three months. Gary's HbA1c at 5.5% is within the normal range of below 6.0%.","low_causes":"Haemolytic anaemia, blood loss, low red cell lifespan","high_causes":"Diabetes, pre-diabetes, high carbohydrate intake, iron deficiency","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the international standard unit. Gary's result of 36 is at the upper edge of the optimal threshold and well below the pre-diabetes threshold of 42. This confirms excellent long-term blood sugar control.","low_causes":"Haemolytic anaemia, blood loss","high_causes":"Diabetes, pre-diabetes","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3386","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3108","upper_optimal_position":"0.5360","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar in check. Lower levels in the context of normal glucose indicate excellent insulin sensitivity, meaning the body needs very little insulin to manage blood sugar. Gary's insulin at 2.6 is at the floor of the laboratory range and within the optimal band of 2 to 8, reflecting outstanding metabolic efficiency consistent with his low-carb diet and active lifestyle.","low_causes":"Low-carb diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, obesity, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.394","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1493","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin. It serves as a reliable measure of how much insulin the body is actually producing, because unlike insulin itself, C-Peptide is not cleared by the liver before reaching the bloodstream. Gary's C-Peptide at 0.394 ug/L, which converts to approximately 130 pmol/L, is below the laboratory range. However, with a fasting glucose of 4.1 and HbA1c of 36, this low C-Peptide simply reflects that his pancreas does not need to produce much insulin. His cells are so insulin-sensitive that a tiny amount of insulin is sufficient to maintain perfect blood sugar control. This is not a sign of pancreatic failure.","low_causes":"Low-carb diet, high insulin sensitivity, fasting, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.47","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.3133","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"","description":"HOMA-IR, or Homeostatic Model Assessment of Insulin Resistance, is a calculation using fasting glucose and insulin to estimate how resistant the body's cells are to insulin. Lower values indicate better insulin sensitivity. Gary's HOMA-IR at 0.47 is technically below the laboratory's lower reference of 0.5, but the lab's own notes confirm that below 1.0 indicates optimal insulin sensitivity. This is one of the best metabolic markers in his panel and reflects a body that manages blood sugar with remarkable efficiency.","low_causes":"Excellent insulin sensitivity, low-carb diet, fasting","high_causes":"Insulin resistance, metabolic syndrome, obesity, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"86.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"180","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6500","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, which are responsible for producing insulin. Gary's HOMA-B at 86.7 is within the healthy range of 80 to 200, confirming that his pancreatic beta cells are functioning adequately. The value sits at the lower end because insulin demand is low, not because the cells are struggling.","low_causes":"Beta cell exhaustion, type 1 diabetes, long-standing type 2 diabetes","high_causes":"Insulin resistance causing compensatory insulin production","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP, or C-reactive protein, is produced by the liver in response to inflammation anywhere in the body. It is one of the most sensitive markers of systemic inflammation. Gary's hs-CRP at 0.3 is well below the optimal threshold of 1.0, indicating negligible systemic inflammation. For someone training at his volume with joint and tendon complaints, this is particularly reassuring because it rules out any significant inflammatory process as the cause of his pain.","low_causes":"","high_causes":"Infection, chronic inflammation, autoimmune disease, cardiovascular risk, obesity","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation. Gary's ESR at 4 is low, confirming the absence of significant inflammation seen in the hs-CRP result.","low_causes":"","high_causes":"Infection, autoimmune disease, malignancy, anaemia, pregnancy","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"nlr","name":"NLR (Neutrophil-Lymphocyte Ratio)","group":"INFLAMMATION","result":"0.56","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1467","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio reflects the balance between the innate immune system (neutrophils) and the adaptive immune system (lymphocytes). Gary's NLR at 0.56 is below the lower limit of 1.0 because his neutrophils are suppressed while his lymphocytes are healthy. This low ratio is driven entirely by the low neutrophil count rather than any lymphocyte excess, and is consistent with the low energy availability pattern described elsewhere in this report.","low_causes":"Low neutrophils, benign ethnic neutropenia, low energy availability, chronic endurance training","high_causes":"Infection, inflammation, physiological stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"138","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4487","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is the main electrolyte in the blood and plays a critical role in fluid balance, nerve function and muscle contraction. Gary's sodium at 138 is within the optimal range.","low_causes":"Excessive sweating, diuretics, adrenal insufficiency, overhydration","high_causes":"Dehydration, excessive salt intake, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is an essential electrolyte that regulates heart rhythm, nerve signals and muscle contractions. Gary's potassium at 5.2 is within the laboratory range but sitting very close to the upper limit of 5.3 and above the optimal ceiling of 5.0. The lab notes that delayed sample processing can falsely elevate potassium, which is a common occurrence. Given his excellent kidney function and no medications that would raise potassium, this is most likely a sample-handling effect and should be rechecked on his next panel.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating","high_causes":"Sample haemolysis, delayed processing, kidney disease, ACE inhibitors, potassium supplements","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4487","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain fluid balance and acid-base balance in the blood. Gary's chloride at 100 is within the optimal range.","low_causes":"Vomiting, metabolic alkalosis, diuretics","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"24.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4788","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is a buffer in the blood that helps maintain the body's acid-base balance. Gary's bicarbonate at 24.9 is within the optimal range, confirming normal acid-base regulation.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"18.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7163","lower_normal":"8","upper_normal":"16","lower_optimal":"8","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is a calculation using sodium, potassium, chloride and bicarbonate that helps identify metabolic disturbances. Gary's anion gap at 18.3 is above the upper limit of 16. On a low-carb diet, mild ketosis can produce a slightly elevated anion gap due to the production of ketone bodies, which are unmeasured anions. With his normal bicarbonate of 24.9, normal glucose, and no symptoms of metabolic distress, this is most likely a benign dietary effect rather than a pathological acidosis.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Ketosis, lactic acidosis, diabetic ketoacidosis, renal failure, toxin ingestion","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4912","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.20","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6228","units":"mmol/l","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction and blood clotting. Gary's calcium at 2.38 is within the optimal range, reflecting healthy calcium regulation.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3458","upper_optimal_position":"0.6208","units":"mmol/L","description":"Corrected calcium adjusts the calcium level for the albumin concentration in the blood, giving a more accurate picture of the biologically active calcium. Gary's corrected calcium at 2.38 is within the optimal range, confirming healthy calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, malignancy, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4176","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3414","upper_optimal_position":"0.6107","units":"mmol/l","description":"Phosphate is a mineral essential for bone formation, energy production and cell function. It works closely with calcium and PTH. Gary's phosphate at 1.0 is within the optimal range.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malnutrition, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6379","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5195","upper_optimal_position":"0.6276","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle relaxation, nerve function and sleep regulation. Gary's magnesium at 1.06 is within the laboratory range but marginally above the optimal ceiling of 1.05. Serum magnesium is a relatively insensitive marker of total body magnesium, as only about 1% of magnesium is found in the blood. At his training volume, intracellular magnesium turnover is high, and supplementation remains worthwhile for recovery and sleep support.","low_causes":"Poor diet, alcohol, diuretics, intense exercise, malabsorption","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"216","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3193","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5829","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and in the body's own cells. It also functions as an antioxidant. Gary's uric acid at 216 is marginally below the lower limit of 220. Very low uric acid can occasionally be associated with reduced antioxidant defence and is sometimes seen with low dietary purine intake, which is consistent with his restricted calorie consumption. This is not clinically urgent but adds to the picture of the body running on minimal nutritional resources.","low_causes":"Low purine diet, low calorie intake, liver disease, Fanconi syndrome","high_causes":"Gout, kidney disease, high purine diet, alcohol, metabolic syndrome, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4867","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3400","upper_optimal_position":"0.6187","units":"mmol/l","description":"Urea is a waste product from protein metabolism, produced by the liver and excreted by the kidneys. It reflects both kidney function and protein intake. Gary's urea at 5.8 is within the optimal range, indicating healthy kidney clearance and adequate but not excessive protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4957","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6325","units":"umol/l","description":"Creatinine is a waste product from normal muscle metabolism, filtered by the kidneys and excreted in urine. It is used to estimate kidney function. Gary's creatinine at 84 is within the optimal range, indicating healthy kidney filtration.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate calculated from creatinine estimates how well the kidneys are filtering blood. Gary's eGFR is above 90, indicating normal kidney function. The lab reported this as >90, confirming healthy filtration.","low_causes":"Kidney disease, dehydration, medications","high_causes":"High muscle mass, pregnancy, high cardiac output","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3136","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all cells in the body and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass or diet, making it a more accurate marker of kidney function. Gary's Cystatin C at 0.69 is well within the optimal range and gives a calculated eGFR of 115, confirming excellent kidney health.","low_causes":"","high_causes":"Kidney disease, hyperthyroidism, corticosteroid use","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"cystatin_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"115","within_normal":"TRUE","w cytes (Absolute)","group":"HEMATOLOGY","result":"35.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2047","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells being released into the blood per litre. While the percentage can appear normal even when production is reduced (because there are fewer total red cells), the absolute count reveals the true output. Gary's absolute reticulocytes at 35.7 are below the lower limit of 50, confirming that the bone marrow is producing fewer new red blood cells than expected. This is consistent with the low energy availability pattern, where the body reduces red cell production to conserve resources.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, low energy availability, chronic disease","high_causes":"Haemolysis, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"20.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4898","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3552","upper_optimal_position":"0.6116","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. Gary's serum iron at 20.8 is within the optimal range, confirming adequate iron availability for red blood cell production and metabolic processes.","low_causes":"Iron deficiency, chronic disease, malabsorption, blood loss","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_si const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

const systemsWith = SYSTEMS.filter(sys => sys.groups.some(g => groups[g] && groups[g].length));
function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
