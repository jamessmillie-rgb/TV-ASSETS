<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Raffaella Coleman","dob":"21/01/1990","report_date":"2026-09-02","summary":"Raffaella is a 36-year-old female presenting with a BMI of 31.4, following a standard mixed diet rated 5 out of 10 for quality with a volume of 8 out of 10. She trains twice per week, one cardio session and one resistance session, with 5,000 to 7,500 daily steps. She reports no medications. She reports sleep restriction of less than six hours most nights. She reports low energy and fatigue, bloating and digestive discomfort, and weight gain with difficulty losing weight. Her goals are to lose body fat, balance hormones, and prevent disease. Raffaella is a solo mother to a 21-month-old, which she identifies as the primary driver of her sleep deprivation and exhaustion. She recognises that her diet is relatively high in sugar and has specifically asked for insight into insulin sensitivity, metabolic health, thyroid function, reproductive hormones, cortisol, inflammation, iron status, cardiovascular health, and liver and kidney function. She has also asked whether the timing of her blood draw relative to her menstrual cycle matters, which it does, and this is addressed below.\n\nThe most important finding in this report is a significantly elevated haemoglobin of 172, which is above the upper limit of 150 for women, alongside a raised red blood cell count of 5.99 against an upper limit of 4.8 and a raised haematocrit (the proportion of blood made up of red cells) of 0.507 against an upper limit of 0.46. These three markers move together and they tell the same story: Raffaella's blood is producing more red cells than expected. In a 36-year-old woman this is unusual and needs investigation. The most common benign explanation is dehydration, which concentrates the blood and makes all three values appear higher than they truly are. If Raffaella was fasting and had not drunk much water before the blood draw, or if the sample sat for some time before processing, this could account for the result. However, the degree of elevation, particularly the haemoglobin sitting 22 points above the upper limit, means this cannot simply be assumed to be dehydration without confirmation. Her GP should repeat a full blood count on a fresh, well-hydrated morning sample. If the values remain elevated, the GP will want to investigate further, potentially including a JAK2 mutation screen, erythropoietin level, and oxygen saturation, to rule out conditions such as polycythaemia vera (a bone marrow disorder that overproduces red cells) or secondary polycythaemia driven by chronic low oxygen states. This is not a diagnosis. It is a finding that needs a clear answer. The raised ESR (erythrocyte sedimentation rate, a measure of how quickly red cells settle in a tube) of 22 against an upper limit of 12 adds a layer to this picture. ESR rises with inflammation, infection, and changes in blood protein composition, but it can also be influenced by the elevated haematocrit itself. It should be repeated alongside the full blood count.\n\nThe second finding that warrants a conversation with her GP is a significantly elevated Lipoprotein(a), known as Lp(a), at 166.57 nmol/L against a target of below 32. Lp(a) is a genetically inherited lipoprotein particle that behaves like a particularly sticky form of LDL cholesterol. It deposits cholesterol into artery walls, promotes clotting, and drives local inflammation. Unlike standard cholesterol markers, Lp(a) cannot be meaningfully changed by diet, exercise, or weight loss because it is determined almost entirely by genetics. Raffaella's level places her in the moderate risk category, between 90 and 200. This is important information that should be recorded permanently in her medical notes and discussed with her GP. It also means that her first-degree relatives, including her parents and any siblings, should be offered Lp(a) testing because the trait is inherited. Lp(a) at this level also shifts the interpretation le sample, her GP should investigate further.\n\nRaffaella asked specifically about insulin sensitivity, and the results here tell an important and nuanced story. Her fasting glucose is 5.6, which sits at the very top of the laboratory range of 3.5 to 6.0 and above the optimal ceiling of 5.4. Her HbA1c (glycated haemoglobin, a measure of average blood sugar over the past two to three months) is 37 mmol/mol, which is within the normal range of below 42 and within the optimal range of below 36 when the percentage equivalent of 5.6% is considered, though 37 mmol/mol places it just above the tightest optimal threshold. Her fasting insulin at 6.24 is within range and within optimal limits, which is reassuring. However, her HOMA-IR (Homeostatic Model Assessment of Insulin Resistance, a calculation that combines fasting glucose and insulin to estimate how hard the body is working to control blood sugar) is 1.55, above the upper limit of 1.5 and above the ideal threshold of 1.0. What this combination suggests is that the body is starting to need slightly more effort to keep blood sugar in check. The fasting glucose being at the top of range while insulin remains relatively low means the system is coping but without much headroom. This is exactly the early metabolic signal Raffaella was looking for. It is not diabetes, it is not even pre-diabetes, but it is the earliest detectable shift in the direction of insulin resistance, and it is occurring in the context of a self-described high-sugar diet, a BMI of 31.4, sleep deprivation, and limited exercise. Every one of those factors independently drives insulin resistance, and together they are likely the complete explanation. The excellent news is that this is entirely reversible at this stage, and the specific lifestyle changes outlined below should be enough to bring HOMA-IR back below 1.0 without medication.\n\nRaffaella's iron status deserves careful attention. Her serum iron is 6.9, below the lower limit of 9. Her transferr opausal range of 0 to 118.2. Her progesterone is 3.2 nmol/L, which falls within the follicular phase range of 0 to 4.45 but below the luteal phase range of 10.62 to 81.28. Her LH (luteinising hormone) is 5.05 and FSH (follicle stimulating hormone) is 11.94. If this sample was taken in the follicular phase (the first half of the cycle, between the start of a period and ovulation), these values are broadly consistent with that phase, though the FSH is slightly above the upper follicular range of 10.2, which can be seen with early follicular draws or with emerging ovarian changes. If this sample was taken in the luteal phase (the second half, after ovulation), the low progesterone would suggest that ovulation may not have occurred in that cycle, which is one explanation for irregular cycles. The significant low mood around her periods that Raffaella describes could be related to these hormonal fluctuations, particularly if progesterone is not rising adequately in the luteal phase. To answer her question about timing: for the most useful hormonal snapshot, the ideal approach is to test on day 2 or 3 of a period for baseline FSH, LH, and oestradiol, and then again around day 21 (or 7 days after suspected ovulation) for progesterone. If cycles continue to be irregular, this is worth discussing with her GP, who may consider referral for further hormonal assessment. Her testosterone at 0.9, SHBG (sex hormone binding globulin) at 54, DHEA-S at 6.8, and free androgen index at 1.67 are all within range, which is reassuring and does not suggest an androgen-driven hormonal imbalance such as polycystic ovary syndrome.\n\nHer cortisol at 323 nmol/L falls within the normal morning range of 145.4 to 619.4. A single morning cortisol is a limited snapshot and does not fully capture adrenal function, particularly in someone with chronic sleep deprivation, where the cortisol rhythm may be disrupted even if the morning value appears normal. Her symptoms of exhaustion, weight gain concentrated around the middle, difficulty losing weight, and mood disruption around her period are all consistent with a cortisol pattern that is being driven by chronic sleep debt rather than an adrenal disorder.\n\nHer CRP (C-reactive protein, a marker of systemic inflammation) is 3.3, which is within the laboratory range of below 5 but significantly above the optimal threshold of below 1.0. At a BMI of 31.4, some degree of CRP elevation is expected because adipose tissue is metabolically active and produces inflammatory signalling molecules. The raised ESR of 22 supports the presence of low-grade systemic inflammation. Reducing body fat, improving sleep duration, and increasing physical activity are the most effective ways to bring inflammation down.\n\nHer kidney function is in excellent health. Cystatin C (a more reliable filtration marker than creatinine, particularly in women and at higher BMI) is 0.89, giving an eGFR of 105, exactly where it should be at 36. Her creatinine-based eGFR is above 90. Her urea, sodium, chloride, bicarbonate, and potassium are all within range. Her uric acid at 248 is within range and within optimal limits for women.\n\nHer liver function is clean. ALT at 24 is within the optimal threshold of below 25 for women. AST at 26 is within range. GGT at 26 is within range, sitting just above the optimal threshold of 25 but well within the laboratory limit of 38. Alkaline phosphatase, bilirubin, albumin, and total protein are all within range. Her FIB-4 score (a calculation that estimates liver fibrosis risk) is 1.21, below the 1.3 threshold, confirming no suggestion of liver scarring. Amylase and lipase, markers of pancreatic function, are both within range.\n\nHer vitamin D at 69 nmol/L is sufficient by NHS standards (above 50) but below the optimal range of 75 to 120 that is associated with the best outcomes for immune function, mood, bone health, and metabolic health. At a BMI of 31.4, vitamin D is sequestered by fat tissue, meaning more is needed to achieve the same blood level. Supplementation is recommended below. Her vitamin B12 at 292 is within the laboratory range of 193 to 982 but below the optimal floor of 500. B12 is essential for nerve function, energy production, and red blood cell formation, and suboptimal levels can contribute to fatigue and brain fog. Her folate at 13 is within range and above the optimal floor of 8, which is good.\n\nHer calcium, corrected calcium, phosphate, magnesium, and parathyroid hormone are all within range. Her magnesium at 0.87 sits within the optimal band of 0.85 to 1.05, which is reassuring given her sleep deprivation, as magnesium supports sleep quality.\n\nHer white blood cell differential is entirely within range, with a healthy neutrophil-to-lymphocyte ratio. Her platelets at 158 are within range, though sitting near the lower boundary of 150. Her creatine kinase at 76 is within range. Her immunoglobulins IgG, IgM, and IgA are all within range. Rheumatoid factor is negative. Tissue transglutaminase IgA is negative, which effectively rules out coeliac disease as a contributor to her bloating and digestive discomfort. Her tumour markers CA-125, CA 19-9, and CEA are all within their respective ranges, which is reassuring. Her total antioxidant activity at 1.72 is within range. Her prolactin at 180 is within the non-pregnant range of 59 to 619.\n\nHer C-Peptide, CA 15-3, and IgE results are listed as pending from the laboratory. These will be reviewed when available.\n\nTo answer Raffaella's question about cycle timing: yes, the timing of a blood test relative to the menstrual cycle matters significantly for reproductive hormones. For cortisol, the time of day matters more than the cycle day, and a morning fasting sample, which this appears to have been, is the standard approach. A single cortisol reading cannot diagnose adrenal dysfunction. If Raffaella wants a more complete picture of her cortisol rhythm, a four-point salivary cortisol test taken at waking, midday, evening, and bedtime provides more useful information.","links":"Raffaella's results point to several clear areas for action, and the good news is that the majority of what needs to change is within her control.\n\nThe first priority is the GP conversation. The elevated haemoglobin, red blood cell count, and haematocrit need to be repeated on a fresh, well-hydrated morning sample. Raffaella should drink at least 500ml of water in the hour before the blood draw and ensure she is not dehydrated from fasting. She should bring the following numbers to her GP: haemoglobin 172 (limit 150), RBC 5.99 (limit 4.8), haematocrit 0.507 (limit 0.46), and ESR 22 (limit 12). If the repeat confirms the elevation, the GP should consider a JAK2 mutation screen, erythropoietin level, and pulse oximetry. The urine red blood cell count of 420 should also be repeated on a mid-cycle, non-menstrual sample. The Lp(a) of 166.57 should be recorded permanently in her medical notes, and her GP should be aware that this is a genetically inherited cardiovascular risk factor that cannot be modified by lifestyle. First-degree relatives should be offered testing.\n\nFor weight loss, Raffaella's estimated maintenance calories at her current weight of 83kg, height of 162.5cm, and activity level sit at approximately 2,050 to 2,150 calories per day. A sustainable fat loss target would be 1,600 to 1,750 calories per day, aiming for a loss of 0.5 to 0.75kg per week. A realistic initial target would be to reach 73 to 75kg over six to nine months, which would bring her BMI to approximately 27 to 28. Her protein intake should be at least 108 to 125 grams per day (1.3 to 1.5g per kg of body weight), spread across three to four meals. Protein is the most important macronutrient for preserving muscle mass during weight loss, for satiety (feeling full), and for stabilising blood sugar. Given her self-identified high-sugar diet, the single most impactful dietary change would be to reduce free sugars, particularly sugary drinks, biscuits, chocolate, and sweetened cereals, and replace them with protein-rich and fibre-rich alternatives. Specifically, aiming for 25 to 30 grams of fibre per day from vegetables, legumes, oats, and whole grains will help with both blood sugar regulation and the bloating she reports. Soluble fibre from oats, beans, lentils, and psyllium husk also helps to reduce LDL cholesterol, which is particularly valuable given her elevated Lp(a). Oily fish twice per week (salmon, mackerel, sardines) provides omega-3 fatty acids that lower triglycerides, reduce inflammation, and support brain function during sleep deprivation.\n\nFor sleep, Raffaella recognises that her sleep is restricted by her circumstances as a solo parent to a toddler, and no blood test report can solve that. However, even within those constraints, there are evidence-based strategies that can improve the quality of the sleep she does get. A fixed wake time, even on weekends, helps anchor the circadian rhythm. Getting outside within an hour of waking, even for ten minutes, resets the cortisol awakening response and improves daytime alertness. Cutting caffeine by midday protects the second half of sleep architecture. Keeping the bedroom cool, around 18 degrees, supports deeper sleep. Magnesium glycinate before bed, recommended below, supports sleep quality through its effect on GABA receptors. Sleep deprivation directly worsens insulin resistance, increases cortisol, promotes fat storage (particularly abdominal fat), and amplifies premenstrual mood symptoms, so any improvement in sleep will have cascading benefits across multiple findings in this report.\n\nFor exercise, increasing from two sessions per week to three or four would have a meaningful impact on insulin sensitivity, inflammation, mood, and weight loss. Even one additional 30-minute walk per day, ideally bringing daily steps to 7,500 to 10,000, would make a measurable difference to HOMA-IR and CRP. Resistance training is particularly important for improving insulin sensitivity because muscle tissue is the primary destination for glucose uptake. If Raffaella can increase her resistance training to two sessions per week, this would be the single most effective exercise change she could make for her metabolic goals.\n\nFor the irregular cycles and premenstrual low mood, Raffaella should discuss her results with her GP, bringing the following values: oestradiol 116, progesterone 3.2, FSH 11.94 (slightly above follicular range), LH 5.05. She should request a day 2 to 3 baseline hormone panel and a day 21 progesterone if she can identify her cycle reliably. The bloating she reports may be partly cyclical and hormonally driven, and partly dietary. Reducing sugar, increasing fibre, and ensuring adequate hydration will help with the dietary component. If bloating persists despite these changes, a food diary tracking symptoms against specific meals may help identify triggers.\n\nA retest in three to four months is recommended, focusing on: full blood count (to confirm or clear the haemoglobin finding), ESR, iron studies including ferritin (to confirm iron stores are recovering), fasting glucose, insulin, and HOMA-IR (to track metabolic improvement), CRP, vitamin D, and B12. Reproductive hormones should ideally be tested at specific cycle points as described above.","flags":"GP-URGENT: Haemoglobin 172 g/L (limit 150), RBC 5.99 (limit 4.8), Haematocrit 0.507 (limit 0.46). Polycythaemia in a 36-year-old female requires investigation. Repeat on well-hydrated sample. If confirmed, consider JAK2 mutation, erythropoietin level, oxygen saturation.\n\nGP-URGENT: Lipoprotein(a) 166.57 nmol/L (target below 32). Genetically determined, moderate risk category (90 to 200). Cannot be modified by lifestyle. Should be recorded permanently. First-degree relatives should be tested. Increases the importance of keeping modifiable lipid markers (LDL, ApoB) as low as possible.\n\nFLAGGED: ESR 22 mm/hour (limit below 12). Raised inflammatory marker. May be secondary to elevated haematocrit, BMI-related inflammation, or iron deficiency. Should be repeated with the full blood count.\n\nFLAGGED: Urine RBCs 420 rbc/ul (threshold below 25). Most likely menstrual contamination given absence of protein, WBCs, nitrites, bacteria, or casts. Should be repeated on a mid-cycle, non-menstrual sample. If persistent, urological investigation warranted.\n\nFLAGGED: HOMA-IR 1.55 (upper limit 1.5, optimal below 1.0). Early insulin resistance signal in the context of BMI 31.4, high-sugar diet, sleep deprivation, and low activity. Fasting glucose 5.6 at the top of range supports this. Not pre-diabetic. Reversible with lifestyle modification.\n\nFLAGGED: Serum Iron 6.9 umol/L (lower limit 9). Transferrin Saturation 10.86% (lower limit 18%). Ferritin 22 ng/ml (optimal above 40 for women). Pattern consistent with early iron deficiency. Common in premenopausal women, particularly post-pregnancy. Likely contributing to fatigue symptoms.\n\nFLAGGED: ApoB/ApoA1 Ratio 0.60 (target below 0.6 for women). Borderline. Driven in part by Lp(a) contribution to ApoB. Modifiable component through diet optimisation.\n\nFLAGGED: hs-CRP 3.3 mg/L (optimal below 1.0). Low-grade systemic inflammation, likely driven by BMI, sleep deprivation, and iron deficiency. Not acutely concerning but should improve with weight loss and lifestyle changes.\n\nFLAGGED: Vitamin B12 292 pg/ml (optimal above 500). Suboptimal. May contribute to fatigue. Supplementation recommended.\n\nFLAGGED: Vitamin D 69 nmol/L (optimal 75 to 120). Insufficient for optimal health. Sequestration by adipose tissue at BMI 31.4 means higher supplementation doses needed.\n\nFLAGGED: FSH 11.94 mIU/ml. Slightly above the follicular range upper limit of 10.2 if drawn in the follicular phase. May be normal variation or early signal of ovarian change. Recommend cycle-timed repeat.\n\nPENDING: C-Peptide, CA 15-3, IgE results to follow from laboratory.\n\nReassuring negatives: Thyroid function normal with negative antibodies, ruling out autoimmune thyroid disease. Coeliac screen negative. Kidney function excellent (Cystatin C eGFR 105). Liver function clean with FIB-4 below threshold. Fasting insulin within optimal range. Triglycerides excellent. HDL excellent. All tumour markers within range. Rheumatoid factor negative. Testosterone, DHEA-S, and free androgen index all within range, not suggestive of PCOS. No urinary infection.","recommendations":"1. See GP with this report. Priority items: elevated haemoglobin, RBC, and haematocrit for repeat and investigation; Lp(a) 166.57 for permanent medical record; urine RBCs for repeat on non-menstrual sample.\n\n2. Reduce dietary sugar and increase protein to 108 to 125 grams per day. Target 1,600 to 1,750 calories per day for gradual fat loss of 0.5 to 0.75kg per week. Aim for 25 to 30 grams of fibre per day.\n\n3. Increase daily steps to 7,500 to 10,000. Add one additional resistance training session per week (total two per week minimum).\n\n4. Prioritise sleep quality within current constraints: fixed wake time, morning daylight exposure, caffeine cut-off by midday, cool bedroom.\n\n5. Include oily fish twice per week for omega-3 and cardiovascular benefit.\n\n6. Include iron-rich foods daily: red meat two to three times per week, dark leafy greens, lentils, with a source of vitamin C at the same meal to enhance absorption.\n\n7. Begin supplementation as outlined below.\n\n8. Request cycle-timed hormone tests from GP: day 2 to 3 for FSH, LH, and oestradiol; day 21 for progesterone.\n\n9. Repeat urine sample during a clearly non-menstrual window.\n\n10. Retest in three to four months: full blood count, ESR, iron studies with ferritin, fasting glucose, insulin, HOMA-IR, CRP, vitamin D, B12.","supplementation":"Iron: Ferrous bisglycinate, 25mg daily, taken with a source of vitamin C (a small glass of orange juice or a vitamin C tablet) on an empty stomach or with a light meal. Do not take within two hours of tea, coffee, or calcium-containing foods or supplements, as these inhibit absorption. Raffaella's serum iron, transferrin saturation, and ferritin are all below optimal levels, and iron deficiency is likely contributing significantly to her fatigue. Recheck ferritin after three months and discontinue once ferritin is consistently above 50.\n\nVitamin D3: Cholecalciferol, 3,000 to 4,000 IU daily, taken with a meal containing fat. At a BMI of 31.4, a higher dose is needed because fat tissue sequesters vitamin D and reduces the amount available in the bloodstream. The goal is to bring her level from 69 into the optimal range of 75 to 120 nmol/L.\n\nVitamin K2: MK-7 form, 100 to 200 mcg daily, taken alongside vitamin D. Vitamin K2 directs calcium into bones and teeth and away from soft tissues and arteries. It should always accompany vitamin D supplementation.\n\nMagnesium: Magnesium glycinate, 300 to 400mg daily, taken before bed. The glycinate form is preferred because it is well absorbed and has a calming effect that supports sleep quality. Raffaella's magnesium is within range but sleep support is a priority given her chronic sleep restriction.\n\nVitamin B12: Sublingual methylcobalamin, 1,000 mcg daily, dissolved under the tongue. Sublingual delivery bypasses the digestive system and is more reliably absorbed than standard oral tablets. Her B12 at 292 is below the optimal floor of 500 and may be contributing to her fatigue and low energy.\n\nOmega-3: Fish oil providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports cardiovascular health, which is particularly important given her elevated Lp(a), and has anti-inflammatory effects that should help bring her CRP down. It also supports mood regulation, which may help with the premenstrual low mood she describes.\n\nThe most important changes from this report are not supplements. They are reducing sugar intake and increasing protein, getting more sleep wherever possible, increasing daily movement and resistance training, and seeing her GP to investigate the elevated haemoglobin and record her Lp(a). The supplements support recovery, but the lifestyle changes drive it.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5067","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5933","units":"mmol/L","description":"Blood glucose measures the concentration of sugar circulating in the bloodstream after fasting. It is the body's primary fuel source. Raffaella's result of 5.6 sits at the top of the laboratory range and above the optimal ceiling of 5.4. While this is not pre-diabetic, it is higher than ideal and, combined with her HOMA-IR of 1.55, suggests the earliest stages of reduced insulin sensitivity. A high-sugar diet, sleep deprivation, elevated BMI, and limited exercise all drive fasting glucose upward. Reducing dietary sugar, increasing protein and fibre, improving sleep, and adding exercise should bring this down.","low_causes":"Prolonged fasting, excessive insulin production, liver disease, adrenal insufficiency","high_causes":"High-sugar diet, insulin resistance, pre-diabetes, stress, sleep deprivation, obesity, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, reflecting average blood sugar control over the past two to three months. A normal result is below 6.0%, with pre-diabetes defined as 6.0 to 6.4%. Raffaella's result of 5.6% is within the normal range and indicates that her average blood sugar control over recent months has been acceptable, even though her fasting glucose on the day of the test was at the top of range.","low_causes":"Iron deficiency anaemia (can falsely lower), haemolytic conditions, blood loss","high_causes":"High-sugar diet, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4386","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol units, the standard used in UK laboratories. A result below 42 is normal, 42 to 47 is pre-diabetes, and above 48 is diabetes. Raffaella's result of 37 is within the normal range. The optimal threshold is below 36, so at 37 she is marginally above the tightest target, which is consistent with the early insulin resistance pattern identified by her HOMA-IR.","low_causes":"Iron deficiency anaemia, haemolytic conditions, blood loss","high_causes":"High-sugar diet, insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"6.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3878","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5753","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar under control. A low-normal insulin with a normal glucose is the ideal combination, meaning the body is insulin-sensitive and does not need to work hard. Raffaella's insulin at 6.24 is within both the laboratory range and the optimal range, which is a positive finding. However, when combined with her fasting glucose of 5.6, the resulting HOMA-IR is marginally elevated, meaning the insulin is sufficient but the glucose it is managing is higher than ideal.","low_causes":"Low-carbohydrate diet, high insulin sensitivity, prolonged fasting","high_causes":"Insulin resistance, high-sugar or high-carbohydrate diet, obesity, sleep deprivation, PCOS, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"To follow","within_normal":"","within_optimal":"","result_position":"","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"ug/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin and provides a more stable measure of insulin production because it is not cleared by the liver as quickly as insulin itself. This result is pending from the laboratory and will be reviewed when available.","low_causes":"Type 1 diabetes, low insulin production, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.55","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6833","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's effects. A value below 1.0 indicates excellent insulin sensitivity. Above 1.5 is the upper limit of the reference range, and above 1.9 indicates early insulin resistance. Raffaella's result of 1.55 is marginally above the upper limit, indicating the earliest detectable shift toward insulin resistance. This is being driven by her fasting glucose sitting at the top of range while her insulin remains relatively low. The combination of a high-sugar diet, BMI of 31.4, chronic sleep deprivation, and limited exercise explains this finding entirely, and it is fully reversible at this stage.","low_causes":"High insulin sensitivity, low-carbohydrate diet, regular exercise, lean body composition","high_causes":"Insulin resistance, high-sugar diet, obesity, sleep deprivation, physical inactivity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"59.43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2476","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates the functional capacity of the beta cells in the pancreas, the cells responsible for producing insulin. It is calculated as (20 x Insulin) / (Glucose - 3.5). Raffaella's result of 59.4 is below the lower limit of 80. In this context, where her fasting glucose and HbA1c are within normal limits and she does not have diabetes, a below-range HOMA-B suggests that the pancreas is producing a modest amount of insulin relative to the glucose level. This is not pancreatic failure, but it does indicate that the beta cells are not compensating upward in response to the rising glucose, which is the pattern that precedes insulin resistance progressing further. Improving insulin sensitivity through lifestyle changes will reduce the demand on the pancreas.","low_causes":"Early beta cell decline, type 1 diabetes, LADA, low-carbohydrate diet (physiological)","high_causes":"Insulin resistance with compensatory hyperinsulinaemia, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"172","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9067","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6167","units":"g/L","description":"Haemoglobin is the oxygen-carrying protein inside red blood cells. It picks up oxygen in the lungs and delivers it to every tissue in the body. The normal range for women is 120 to 150 g/L. Raffaella's result of 172 is significantly above the upper limit. This is an unusual finding in a premenopausal woman and needs investigation. The most benign explanation is dehydration at the time of the blood draw, which concentrates the blood and makes haemoglobin appear higher. However, at 22 points above the upper limit, dehydration alone may not fully account for this, and the GP should repeat the test on a well-hydrated sample. If confirmed, further investigation is needed to exclude polycythaemia vera (a bone marrow disorder) or secondary causes.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, pregnancy","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia, smoking, high altitude, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8867","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. These cells carry haemoglobin, which transports oxygen. The normal range for women is 3.8 to 4.8. Raffaella's result of 5.99 is significantly above the upper limit and is consistent with the elevated haemoglobin and haematocrit. All three markers are telling the same story: there are more red cells in her blood than expected. This needs to be repeated on a well-hydrated sample and, if confirmed, investigated by her GP.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, bone marrow disorders, blood loss","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia, smoking, high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit (HCT)","group":"HEMATOLOGY","result":"0.507","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8133","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is made up of red blood cells. A higher haematocrit means thicker, more viscous blood. The normal range for women is 0.36 to 0.46. Raffaella's result of 0.507 is above the upper limit and consistent with the elevated haemoglobin and red blood cell count. Elevated haematocrit increases blood viscosity, which can impair circulation. This finding should be repeated on a well-hydrated sample as part of the GP investigation.","low_causes":"Anaemia, overhydration, blood loss, chronic disease","high_causes":"Dehydration, polycythaemia vera, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width (RDW)","group":"HEMATOLOGY","result":"13.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5278","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3417","upper_optimal_position":"0.6583","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. A normal RDW means red cells are uniform in size, which indicates consistent, healthy production. In the context of iron deficiency, RDW often rises as the body starts producing smaller cells alongside normal-sized ones. Raffaella's RDW at 13.4 is within range, suggesting her iron deficiency has not yet progressed to the point of affecting red cell production significantly.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiencies, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume (MCV)","group":"HEMATOLOGY","result":"84.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3389","upper_optimal_position":"0.6500","units":"fL","description":"MCV measures the average size of red blood cells. Small cells (low MCV) are typically seen in iron deficiency, while large cells (high MCV) are seen in B12 or folate deficiency. Raffaella's MCV at 84.7 is at the lower end of the range, which, in the context of her low iron stores, may reflect the very early stages of iron-deficient red cell production. It is still within range and not yet microcytic (abnormally small).","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin (MCH)","group":"HEMATOLOGY","result":"28.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6333","units":"pg","description":"MCH measures the average amount of haemoglobin per red blood cell. It moves in parallel with MCV. Raffaella's result of 28.8 is within range, indicating that each red cell is carrying an adequate amount of haemoglobin.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Corpuscular Haemoglobin Concentration (MCHC)","group":"HEMATOLOGY","result":"340","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the concentration of haemoglobin within each red blood cell. It is one of the most tightly regulated blood values. Raffaella's result of 340 is within range, confirming that the haemoglobin is appropriately concentrated within her red cells.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"Hereditary spherocytosis, sample artefact, cold agglutinins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"158","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3436","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6103","units":"x10^9/L","description":"Platelets are small cell fragments that clump together to form clots and stop bleeding. Raffaella's count of 158 is within the laboratory range but sitting near the lower boundary of 150. In the context of an elevated haematocrit and possible dehydration, the platelet count may be slightly diluted relative to plasma volume changes. This is not a concern on its own but should be noted on the repeat blood count.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications, liver disease","high_causes":"Iron deficiency, inflammation, infection, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume (MPV)","group":"HEMATOLOGY","result":"8.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more metabolically active. Raffaella's MPV of 8.7 is within range, indicating normal platelet turnover.","low_causes":"Bone marrow suppression, inflammatory conditions (chronic)","high_causes":"Increased platelet turnover, iron deficiency, inflammation, post-bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"5.27","within_normal":"TRU
