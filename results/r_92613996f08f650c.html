onsible for adaptive immunity, including the production of antibodies and the killing of virus-infected cells. Raffaella's count of 1.99 is within range, indicating healthy immune function.","low_causes":"HIV, autoimmune conditions, steroid use, stress, malnutrition","high_causes":"Viral infections, chronic infections, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3917","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and also help regulate the inflammatory response. Raffaella's count of 0.34 is within range.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infections, autoimmune conditions, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.08","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.03","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3403","upper_optimal_position":"0.6111","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Raffaella's count of 0.08 is within range and does not suggest any allergic or parasitic process.","low_causes":"Steroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infections, autoimmune conditions, eczema","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic and inflammatory responses. Raffaella's count at 0.02 sits at the lower boundary and is normal.","low_causes":"Generally not clinically significant, steroid use","high_causes":"Allergic reactions, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_pct","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.7","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly produced red blood cells released from the bone marrow. The percentage indicates how actively the bone marrow is producing new red cells. Raffaella's result of 1.18% is within range. Notably, in the context of her elevated haemoglobin and RBC, a normal reticulocyte percentage means the bone marrow is not being over-stimulated acutely. If the polycythaemia were driven by a recent stimulus (such as sudden hypoxia), reticulocytes would typically be elevated.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow failure, chronic disease","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia, EPO stimulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_abs","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"70.682","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4720","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the total number of young red blood cells per litre of blood, rather than as a percentage. Raffaella's result of 70.7 is within range, confirming that the bone marrow is producing red cells at a normal rate.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow failure","high_causes":"Haemolytic anaemia, blood loss, EPO stimulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"Erythrocyte Sedimentation Rate (ESR)","group":"INFLAMMATION","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9167","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates higher levels of inflammatory proteins in the blood. Raffaella's ESR of 22 is above the upper limit of 12 for women. ESR can be elevated by inflammation, infection, anaemia, and changes in blood protein composition. In Raffaella's case, the elevated BMI, the low-grade inflammation indicated by her CRP, and the iron deficiency could all contribute. It should be repeated alongside the full blood count to see if it normalises.","low_causes":"Polycythaemia, sickle cell disease, heart failure, very low fibrinogen","high_causes":"Inflammation, infection, autoimmune disease, anaemia, pregnancy, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"High-Sensitivity C-Reactive Protein (hs-CRP)","group":"INFLAMMATION","result":"3.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3300","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP is a marker of systemic inflammation produced by the liver. Unlike standard CRP, the high-sensitivity version can detect very low levels of chronic inflammation that are associated with cardiovascular risk, metabolic disease, and obesity. The laboratory range is below 5, but the optimal target for long-term health is below 1.0. Raffaella's result of 3.3 is within the laboratory range but well above optimal. At a BMI of 31.4, this level of CRP elevation is expected because adipose tissue produces inflammatory cytokines. Chronic sleep deprivation and iron deficiency also contribute to systemic inflammation. Weight loss, improved sleep, and increased physical activity are the most effective ways to reduce CRP.","low_causes":"Low body fat, anti-inflammatory medications, healthy lifestyle","high_causes":"Obesity, infection, chronic inflammation, autoimmune conditions, smoking, sleep deprivation, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrin_sat","name":"Transferrin Saturation","group":"IRON STUDIES","result":"10.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1395","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures what percentage of the body's iron-transport protein (transferrin) is currently loaded with iron. It gives a snapshot of how much iron is available for immediate use. The normal range is 18 to 55%, with an optimal range of 25 to 40%. Raffaella's result of 10.86% is significantly below the lower limit, meaning that her iron-transport system is running largely empty. This is consistent with her low serum iron and low ferritin and confirms early iron deficiency.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss, pregnancy, inadequate dietary intake","high_causes":"Haemochromatosis, iron overload, liver disease, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"6.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1905","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3740","upper_optimal_position":"0.5827","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates through the day and with meals but, in a fasting sample, provides a useful snapshot. Raffaella's result of 6.9 is below the lower limit of 9. Low circulating iron means less is available for haemoglobin production, energy metabolism, and immune function. This contributes directly to fatigue.","low_causes":"Iron deficiency, chronic disease, inflammation, blood loss, inadequate dietary intake, pregnancy","high_causes":"Haemochromatosis, iron overload, liver disease, excessive supplementation, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3410","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.7","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. In iron deficiency, the body typically produces MORE transferrin (trying to capture whatever iron is available), so the level usually rises. Raffaella's transferrin at 2.53 is at the very bottom of the range rather than elevated. This could suggest that the iron deficiency is relatively early, or that inflammation (as suggested by her CRP) is suppressing transferrin production, since transferrin is a negative acute-phase protein that decreases during inflammation.","low_causes":"Inflammation (acute phase response), liver disease, protein malnutrition, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"60.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4898","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron. It is derived from transferrin levels. In iron deficiency, TIBC typically rises as the body tries to maximise its ability to capture available iron. Raffaella's TIBC at 60.8 is within range, which, in combination with her low serum iron, results in the low transferrin saturation.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3476","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3654","upper_optimal_position":"0.5488","units":"ng/ml","description":"Ferritin is the body's primary iron storage protein. Each ferritin molecule holds thousands of iron atoms in a stable, non-toxic form. The laboratory range for women is 10 to 291, but many women feel fatigued below a level of 40, which is the optimal floor. Raffaella's ferritin at 22 is within the laboratory range but below the optimal threshold. In combination with her low serum iron and low transferrin saturation, this confirms depleted iron stores. For a 36-year-old woman who has been through pregnancy and is menstruating with irregular cycles, this is a common finding. Iron supplementation is recommended to rebuild stores, targeting a ferritin above 50.","low_causes":"Iron deficiency, blood loss, pregnancy, menstruation, inadequate dietary intake, coeliac disease","high_causes":"Haemochromatosis, inflammation (acute phase reactant), liver disease, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is the primary electrolyte that regulates fluid balance, blood pressure, and nerve function. Raffaella's sodium at 140 is well within the optimal range, indicating good hydration and electrolyte balance.","low_causes":"Overhydration, diuretics, heart failure, kidney disease, adrenal insufficiency, vomiting","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"mmol/L","description":"Potassium is essential for normal heart rhythm, muscle contraction, and nerve signalling. Raffaella's potassium at 4.0 is within range and within optimal limits.","low_causes":"Diuretics, vomiting, diarrhoea, excessive sweating, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium-sparing diuretics, sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride works alongside sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. Raffaella's chloride at 102 is within range.","low_causes":"Vomiting, diuretics, metabolic alkalosis, overhydration","high_causes":"Dehydration, metabolic acidosis, kidney disease, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5182","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's primary acid buffer, maintaining blood pH within a narrow range. Raffaella's bicarbonate at 26.1 is within range, indicating healthy acid-base balance.","low_causes":"Metabolic acidosis, diarrhoea, kidney disease, diabetic ketoacidosis","high_causes":"Metabolic alkalosis, vomiting, diuretic use, COPD","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4561","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3456","upper_optimal_position":"0.6070","units":"mmol/L","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. About 99% is stored in bones, with only a tiny fraction circulating in the blood, which is tightly regulated by parathyroid hormone (PTH) and vitamin D. Raffaella's calcium at 2.29 is within range.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level to account for the amount of albumin in the blood (since calcium binds to albumin). This gives a more accurate picture of the physiologically active calcium. Raffaella's corrected calcium at 2.32 is within range, and her PTH ll recommended for its sleep-supporting effects, which are independent of blood levels.","low_causes":"Poor dietary intake, alcohol, diuretics, diarrhoea, diabetes, high-sugar diet","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"248","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3238","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines found in certain foods and in the body's own cells. Elevated levels can lead to gout and are associated with metabolic syndrome and cardiovascular risk. Raffaella's result of 248 is within both the laboratory range and the optimal range for women.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High-purine diet, obesity, alcohol, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3800","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product formed when the liver breaks down protein. The kidneys filter it out of the blood and excrete it in urine. Raffaella's urea at 3.9 is within range, indicating normal kidney function and protein metabolism.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4146","lower_normal":"49","upper_normal":"90","lower_optimal":"52","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3561","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. It is used to estimate kidney function (eGFR). Raffaella's creatinine at 59 is within range. It is relatively low, which is normal for a woman with modest muscle mass.","low_causes":"Low muscle mass, liver disease, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, intense exercise, high meat intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"eGFR estimates how well the kidneys are filtering waste from the blood, calculated from the creatinine level, age, and sex. Above 90 is considered normal. Above 60 is the clinical threshold. Raffaella's creatinine-based eGFR is above 90, indicating healthy kidney filtration.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration, certain medications","high_causes":"Hyperfiltration (diabetes, pregnancy), very low muscle mass","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"105","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8750","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"","description":"Cystatin C eGFR is a more reliable measure of kidney filtration than creatinine-based eGFR, particularly in women and in people with higher or lower than average muscle mass, because Cystatin C production is not affected by muscle. Raffaella's Cystatin C eGFR of 105 confirms excellent kidney function.","low_causes":"Chronic kidney disease, acute kidney injury, dehydration","high_causes":"Hyperfiltration (early diabetes, pregnancy)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells in the body at a constant rate. It is freely filtered by the kidneys and is used as an alternative measure of kidney function. Raffaella's Cystatin C at 0.89 is within range, confirming healthy kidney filtration.","low_causes":"Generally not clinically significant","high_causes":"Kidney disease, thyroid disease, steroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6133","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. It provides a broad assessment of nutritional status and liver and immune function. Raffaella's result of 74 is within range.","low_causes":"Malnutrition, liver disease, kidney disease (protein loss), malabsorption","high_causes":"Dehydration, chronic infection, autoimmune disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"41","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4792","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3583","upper_optimal_position":"0.6208","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains fluid balance, transports hormones and nutrients, and is a marker of liver synthetic function and nutritional status. Raffaella's albumin at 41 is within range and within optimal limits, confirming healthy liver function and adequate nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, burns","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6111","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/L","description":"Globulin encompasses a group of proteins including immunoglobulins (antibodies) and transport proteins. It is calculated by subtracting albumin from total protein. Raffaella's globulin at 33 is within the laboratory range but above the optimal ceiling of 32. This is a marginal finding and, given that her individual immunoglobulin levels are all within range, is not a concern.","low_causes":"Immunodeficiency, malnutrition, liver disease","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5952","units":"","description":"The albumin-to-globulin ratio compares the two main protein groups in the blood. A low ratio can suggest chronic inflammation, immune overactivity, or liver disease. Raffaella's ratio of 1.24 is within range.","low_causes":"Chronic inflammation, autoimmune disease, liver disease, myeloma","high_causes":"Immunodeficiency, genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4857","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP is an enzyme found in the liver, bones, kidneys, and intestines. Elevated levels can indicate bile duct obstruction, bone disease, or liver inflammation. Raffaella's ALP at 78 is within range.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Bile duct obstruction, bone disease, liver disease, pregnancy, growth (children)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. It is processed by the liver and excreted in bile. Elevated bilirubin causes jaundice. Raffaella's bilirubin at 6 is within range.","low_causes":"Generally not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2143","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that is released into the bloodstream when liver cells are damaged. It is the most specific marker for liver inflammation. While the laboratory range extends to 56, the optimal threshold for women is below 25. Raffaella's ALT at 24 is within the optimal range, indicating that the liver is not under metabolic strain.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver disease, alcohol, viral hepatitis, medications, obesity, coeliac disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"IU/L","description":"AST is an enzyme found in the liver, heart, muscles, and kidneys. It is less specific to the liver than ALT. Raffaella's AST at 26 is within range and within optimal limits.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart attack, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4172","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculated score that estimates the degree of liver fibrosis (scarring) using age, platelet count, ALT, and AST. A score below 1.3 in someone under 65 suggests low risk of significant fibrosis. Raffaella's score of 1.21 is below this threshold, confirming no evidence of liver scarring.","low_causes":"Young age, healthy liver, high platelet count","high_causes":"Liver fibrosis, cirrhosis, older age, low platelet count, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT (GGT)","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3421","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol use, bile duct problems, and metabolic stress. It is often the first liver enzyme to rise when the liver is under strain. The laboratory range for women is 4 to 38, with an optimal threshold of below 25. Raffaella's GGT at 26 is within the laboratory range but marginally above the optimal ceiling. This is a minor finding and, in the context of entirely normal ALT, AST, bilirubin, and FIB-4, does not indicate liver disease.","low_causes":"Generally not clinically significant","high_causes":"Alcohol, fatty liver disease, bile duct obstruction, medications, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"30","upper_normal":"118","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.6023","units":"IU/L","description":"Amylase is a digestive enzyme produced primarily by the pancreas and salivary glands. It breaks down starch into simpler sugars. Elevated levels can indicate pancreatitis. Raffaella's amylase at 52 is within range, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis, advanced pancreatic disease","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6262","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fats. It is more specific to the pancreas than amylase and is the preferred marker for diagnosing pancreatitis. Raffaella's lipase at 40 is within range.","low_causes":"Chronic pancreatitis, advanced pancreatic disease","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4350","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL, and VLDL. On its own it is a limited marker because it does not distinguish between protective HDL and atherogenic LDL. Raffaella's total cholesterol at 4.5 is within the desirable range of below 5.18.","low_causes":"Malnutrition, liver disease, hyperthyroidism, malabsorption","high_causes":"Diet, obesity, hypothyroidism, genetics, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1765","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, derived from dietary intake and produced by the liver. They are the most responsive lipid marker to diet, sugar intake, alcohol, and insulin resistance. Raffaella's triglycerides at 0.6 are excellent, well below both the laboratory limit and the optimal ceiling. This is one of the strongest positives in her lipid profile and suggests that, despite her high-sugar diet, her liver is handling fat metabolism well.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High-sugar diet, alcohol, obesity, insulin resistance, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1731","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. It is a precursor to LDL. Low VLDL reflects the excellent triglyceride result. Raffaella's VLDL at 0.27 is within range and optimal.","low_causes":"Low triglyceride production, low-fat diet","high_causes":"High-sugar diet, insulin resistance, obesity, alcohol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5313","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective form of cholesterol. It collects excess cholesterol from artery walls and returns it to the liver for disposal. Higher HDL is better. The desirable level is above 1.55 for women, with an optimal level above 1.6. Raffaella's HDL at 1.7 is above the optimal threshold, which is a genuine positive, particularly at a BMI of 31.4 where HDL is often suppressed.","low_causes":"Smoking, obesity, sedentary lifestyle, high-sugar diet, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4120","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5067","units":"mmol/L","description":"LDL (low-density lipoprotein) is the form of cholesterol most associated with cardiovascular disease. It deposits cholesterol into artery walls where it can form plaques. Raffaella's LDL at 2.53 is within both the laboratory range and the optimal range of below 2.6. However, in the context of her significantly elevated Lp(a), keeping LDL as low as possible is more important than it would be for someone with a normal Lp(a). Dietary approaches including soluble fibre, oily fish, and reducing saturated fat can help maintain or reduce this level.","low_causes":"Very low-fat diet, hyperthyroidism, liver disease, malabsorption, statins","high_causes":"High saturated fat diet, obesity, hypothyroidism, genetics, liver disease, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"Total Cholesterol / HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.65","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2944","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"This ratio divides total cholesterol by HDL cholesterol and provides a simple summary of cardiovascular risk. Lower is better. Below 4.5 is the laboratory target, and below 3.5 is optimal. Raffaella's ratio of 2.65 is excellent.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"37.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4723","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"%","description":"HDL percentage shows what proportion of total cholesterol is made up of the protective HDL fraction. A higher percentage is better, with above 20% being the minimum target. Raffaella's result of 37.78% is excellent, meaning over a third of her total cholesterol is the protective type.","low_causes":"Obesity, sedentary lifestyle, high-sugar diet, smoking","high_causes":"Regular exercise, healthy diet, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol particles (LDL, VLDL, Lp(a), and remnants) in one number. It is increasingly regarded as a better predictor of cardiovascular risk than LDL alone. Raffaella's non-HDL at 2.8 is within the target of below 4.","low_causes":"Very low LDL, low triglycerides, healthy diet","high_causes":"High LDL, high triglycerides, obesity, insulin resistance, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4857","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and reflects the functional capacity of the protective cholesterol system. Higher is better, with a target of 1.4 or above. Raffaella's ApoA1 at 1.36 is marginally below the target of 1.4. This is a minor finding, and her HDL at 1.7 confirms that her protective cholesterol is functioning well. Increasing exercise is the most effective way to raise ApoA1.","low_causes":"Obesity, sedentary lifestyle, smoking, metabolic syndrome, genetics","high_causes":"Regular exercise, moderate alcohol, oestrogen, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4556","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein carried on every atherogenic lipoprotein particle, including LDL, VLDL, and Lp(a). Because each particle carries exactly one ApoB, the ApoB level tells you the total number of atherogenic particles in the blood, which is a stronger predictor of cardiovascular risk than LDL cholesterol alone. Raffaella's ApoB at 0.82 is within the laboratory target of below 0.9 but above the optimal target of below 0.8. Importantly, a portion of her ApoB is being contributed by Lp(a) particles, which cannot be reduced by lifestyle changes. The modifiable portion of her ApoB (from LDL and VLDL) is likely well within optimal range.","low_causes":"Very low LDL, statins, healthy diet, hyperthyroidism","high_causes":"High LDL, elevated Lp(a), obesity, insulin resistance, hypothyroidism, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.603","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5025","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/ApoA1 ratio is one of the best single markers of cardiovascular risk. It compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA1). For women, below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Raffaella's ratio of 0.60 sits right on the boundary. This is being pushed up by her genetically elevated Lp(a), which contributes ApoB particles that cannot be reduced by lifestyle. Improving the ratio from here means either reducing modifiable ApoB (through diet) or increasing ApoA1 (through exercise), or both.","low_causes":"High HDL, low LDL, exercise, healthy diet","high_causes":"High LDL, elevated Lp(a), low HDL, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"166.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined lipoprotein particle that behaves like a particularly atherogenic form of LDL. It deposits cholesterol into artery walls, promotes blood clotting by interfering with the clot-dissolving system, and drives local inflammation. Unlike other lipid markers, Lp(a) is determined almost entirely by genetics and cannot be meaningfully reduced by diet, exercise, or weight loss. Raffaella's Lp(a) at 166.57 is significantly above the target of below 32, placing her in the moderate risk category (90 to 200). This is an inherited trait. It should be recorded permanently in her medical notes, and first-degree relatives, including parents and siblings, should be offered Lp(a) testing. There are currently no approved medications that lower Lp(a) specifically, though several are in clinical trials. The practical implication is that keeping all modifiable cardiovascular risk factors (LDL, ApoB, blood pressure, blood sugar, body weight, inflammation, exercise) as optimised as possible becomes more important for Raffaella than for someone with a normal Lp(a).","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), kidney disease, hypothyroidism (modest effect)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"Triglyceride/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1167","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a surrogate marker for insulin resistance and small, dense LDL particles. A lower ratio is better. Below 0.87 is optimal. Raffaella's ratio of 0.35 is excellent, reflecting her low triglycerides and healthy HDL. This is the strongest metabolic positive in the report and suggests that, while her HOMA-IR is marginally elevated, her lipid metabolism is handling fats very efficiently.","low_causes":"Excellent insulin sensitivity, low triglyceride production, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high-sugar diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1688","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich remnant lipoproteins. It is calculated as total cholesterol minus HDL minus LDL. Elevated remnant cholesterol is independently associated with cardiovascular disease and inflammation. Raffaella's remnant cholesterol at 0.27 is within the optimal range of below 0.5, reflecting her excellent triglyceride metabolism.","low_causes":"Low triglycerides, healthy diet, good insulin sensitivity","high_causes":"High triglycerides, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio (NLR)","group":"INFLAMMATION","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"NLR divides the neutrophil count by the lymphocyte count to provide a simple marker of systemic inflammation and immune balance. A ratio between 1 and 3 is normal, with 1 to 2 being optimal. Raffaella's NLR of 1.43 is within the optimal range, indicating good immune balance despite her elevated CRP.","low_causes":"Generally not clinically significant","high_causes":"Infection, inflammation, physiological stress, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2875","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation, and metabolic health. It is produced in the skin when exposed to sunlight and is obtained from oily fish, eggs, and fortified foods. The NHS considers levels above 50 nmol/L sufficient, but the optimal range for the best health outcomes is 75 to 120 nmol/L. Raffaella's level at 69 is sufficient but below optimal. At a BMI of 31.4, fat tissue sequesters vitamin D, reducing the amount available in the bloodstream and meaning a higher supplementation dose is needed to achieve the same blood level. Supplementation with 3,000 to 4,000 IU daily is recommended.","low_causes":"Limited sun exposure, dark skin, obesity (sequestration), malabsorption, limited dietary intake","high_causes":"Excessive supplementation, granulomatous diseases","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4293","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6138","units":"pmol/L","description":"PTH is produced by the parathyroid glands and regulates calcium and phosphate balance. When calcium is low, PTH rises to mobilise calcium from bones and increase absorption from the gut. Raffaella's PTH at 2.2 is within range, and her calcium is normal, confirming healthy calcium-PTH regulation.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D, magnesium deficiency","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"292","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3792","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.6159","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis, and energy metabolism. It is obtained from animal products including meat, fish, eggs, and dairy. The laboratory range starts at 193, but levels below 500 are considered suboptimal because symptoms of insufficiency can begin before frank deficiency is reached. Raffaella's B12 at 292 is within the laboratory range but below the optimal floor of 500. Suboptimal B12 may contribute to fatigue, low energy, difficulty concentrating, and mood disturbance, all of which Raffaella is experiencing. Sublingual methylcobalamin supplementation is recommended.","low_causes":"Low dietary intake (especially vegan/vegetarian), malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in DNA synthesis, red blood cell production, and methylation reactions. Good dietary sources include dark leafy greens, legumes, and fortified cereals. Raffaella's folate at 13 is within range and above the optimal floor of 8, which is a positive finding.","low_causes":"Poor dietary intake, alcohol, malabsorption, coeliac disease, pregnancy, medications","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone (TSH)","group":"THYROID","result":"1.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4464","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4821","units":"mIU/L","description":"TSH is produced by the pituitary gland in the brain and tells the thyroid gland how much thyroid hormone to produce. When thyroid hormone levels are low, TSH rises to push the gland harder. When thyroid levels are adequate, TSH sits in the lower half of the range. Raffaella's TSH at 1.98 is within the optimal range of 1.0 to 2.5, indicating that the brain is satisfied with the thyroid hormone output. This effectively takes the thyroid off the list of potential causes of her symptoms.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid hormone resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4911","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5600","units":"pmol/L","description":"Free T4 is the inactive form of thyroid hormone produced by the thyroid gland. It circulates in the blood and is converted into the active form (T3) in tissues. Raffaella's FT4 at 16.8 is within the optimal range of 14 to 20, confirming healthy thyroid hormone production.","low_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, Graves' disease, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4852","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use. It is converted from T4 in the liver, kidneys, and other tissues. It drives metabolic rate, energy production, temperature regulation, and mood. Raffaella's FT3 at 4.9 is within the optimal range of 4.5 to 6.5, confirming that the conversion from T4 to T3 is working normally.","low_causes":"Hypothyroidism, sick euthyroid syndrome, selenium deficiency, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, Graves' disease, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/ml","description":"TPO antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a condition called Hashimoto's thyroiditis. A negative result means there is no autoimmune attack on the thyroid. Raffaella's result is below 6.6, well within the normal range of below 13.8, ruling out Hashimoto's as a contributor to her symptoms.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5000","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Elevated levels are associated with autoimmune thyroid disease. Raffaella's result is below 1.3, which is undetectable, as is the case in over 80% of the population. This confirms no autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"323","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4624","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5821","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a circadian rhythm, peaking in the early morning and declining through the day. A morning cortisol within the range of 145 to 619 is expected. Raffaella's cortisol at 323 is within range. However, a single morning cortisol is a limited snapshot and does not capture the full cortisol rhythm. In the context of chronic sleep deprivation, the cortisol pattern may be disrupted (flattened, with inadequate morning peak and elevated evening levels) even if the morning value looks normal. If Raffaella wants a more detailed picture of her cortisol pattern, a four-point salivary cortisol test provides more useful information.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, chronic fatigue","high_causes":"Chronic stress, sleep deprivation, Cushing's syndrome, steroid medication, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"116","within_normal":"TRUE","within_optimal":"","result_position":"0.3757","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, produced mainly by the ovaries. It fluctuates dramatically across the menstrual cycle: low in the early follicular phase, rising as an egg develops, peaking at mid-cycle, and then rising again in the luteal phase before dropping before a period. Interpretation depends entirely on when in the cycle the blood was drawn. Raffaella's oestradiol at 116 falls within the follicular phase range (71.6 to 529.2) and also within the postmenopausal range (0 to 118.2). Given her age of 36 and the fact that she is still menstruating, this most likely represents a follicular phase sample. Cycle-timed testing would provide a more interpretable result.","low_causes":"Menopause, ovarian insufficiency, low body fat, hypothalamic amenorrhoea, breastfeeding","high_causes":"Mid-cycle surge, pregnancy, PCOS, obesity, oestrogen therapy, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"3.2","within_normal":"TRUE","within_optimal":"","result_position":"0.4824","lower_normal":"0.0","upper_normal":"4.45","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"nmol/L","description":"Progesterone is produced by the corpus luteum (the structure left after an egg is released from the ovary) and rises significantly in the luteal phase (second half) of the menstrual cycle. It prepares the uterine lining for potential pregnancy and supports mood, sleep, and body temperature regulation. In the follicular phase, progesterone is normally low (0 to 4.45). In the luteal phase, it should be above 10.62, with a mid-luteal peak above 14.12. Raffaella's progesterone at 3.2 is consistent with a follicular phase sample. If this blood was taken in the luteal phase, however, the low value would suggest that ovulation may not have occurred in that cycle (an anovulatory cycle), which could explain her irregular periods. A day-21 progesterone test would help clarify this.","low_causes":"Follicular phase (normal), anovulation, luteal phase defect, perimenopause, stress","high_causes":"Luteal phase (normal), pregnancy, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"5.05","within_normal":"TRUE","within_optimal":"","result_position":"0.4196","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"LH is produced by the pituitary gland and triggers ovulation at mid-cycle. In the follicular phase, it is normally low to moderate (1.9 to 12.5). At mid-cycle, it surges to trigger egg release (8.7 to 76.3). In PCOS, the LH-to-FSH ratio is often elevated (above 2:1). Raffaella's LH at 5.05 gives an LH-to-FSH ratio of 0.42, which is normal and does not suggest PCOS.","low_causes":"Pituitary disease, hypothalamic amenorrhoea, severe stress, anorexia","high_causes":"Mid-cycle surge (normal), menopause, PCOS, premature ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"11.94","within_normal":"TRUE","within_optimal":"","result_position":"0.6228","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"","upper_optimal":"","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"","upper_optimal_position":"","units":"mIU/ml","description":"FSH is produced by the pituitary gland and stimulates the ovaries to develop follicles (eggs). In the follicular phase, the normal range is 2.5 to 10.2. Raffaella's FSH at 11.94 is slightly above the upper follicular range. An early follicular FSH above 10 can suggest that the ovaries are requiring more stimulation to develop follicles, which can be an early indicator of declining ovarian reserve. However, this is a single measurement, and FSH fluctuates. It does not indicate menopause (FSH would need to be above 23 consistently). If Raffaella is concerned about her fertility or the irregular cycles, a day 2 to 3 FSH and oestradiol test would give a clearer baseline. This should be discussed with her GP.","low_causes":"Pituitary disease, hypothalamic amenorrhoea, severe stress, PCOS (sometimes)","high_causes":"Perimenopause, menopause, premature ovarian failure, early follicular normal variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3905","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4127","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands. It supports muscle maintenance, bone density, libido, energy, and mood. The normal range for women is 0.5 to 2.6. Raffaella's testosterone at 0.9 is within the laboratory range but below the optimal floor of 1.0. This is a minor finding. Low-normal testosterone in women can contribute to fatigue, reduced motivation, and difficulty building muscle. It is not low enough to suggest a hormonal disorder and may simply reflect the combined effects of sleep deprivation, stress, and low activity.","low_causes":"Ageing, adrenal insufficiency, oral contraceptives, oophorectomy, chronic stress, sleep deprivation","high_causes":"PCOS, adrenal hyperplasia, ovarian tumours, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index (FAI)","group":"HORMONES","result":"1.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3944","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates how much testosterone is biologically available after accounting for the amount bound to SHBG. A higher FAI means more biologically active testosterone. In PCOS, FAI is often elevated. Raffaella's FAI at 1.67 is within range and not suggestive of androgen excess.","low_causes":"High SHBG, low testosterone, ageing, hypothyroidism","high_causes":"PCOS, low SHBG, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"6.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5289","lower_normal":"0.26","upper_normal":"11","lower_optimal":"3.0","upper_optimal":"9.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4188","upper_optimal_position":"0.6060","units":"umol/L","description":"DHEA-S is the most abundant steroid hormone in the body, produced primarily by the adrenal glands. It serves as a precursor to both testosterone and oestrogen. Levels decline with age. Raffaella's DHEA-S at 6.8 umol/L (approximately 2,508 ug/dL) is within range and within optimal limits, indicating healthy adrenal function.","low_causes":"Ageing, adrenal insufficiency, chronic stress, medications","high_causes":"PCOS, adrenal hyperplasia, adrenal tumours, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"180","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4018","lower_normal":"59","upper_normal":"619","lower_optimal":"80","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3708","upper_optimal_position":"0.5655","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland that stimulates breast milk production and influences the menstrual cycle. In non-pregnant, non-breastfeeding women, the normal range is 59 to 619. Elevated prolactin can cause irregular periods and suppress ovulation. Raffaella's prolactin at 180 is within range and does not suggest a prolactin-secreting pituitary issue.","low_causes":"Dopamine agonist medications, pituitary underfunction","high_causes":"Prolactinoma, medications (antipsychotics, metoclopramide), hypothyroidism, stress, breastfeeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin (SHBG)","group":"HORMONES","result":"54","within_normal":"TRUE","w const data = REPORT_DATA;
const bms = (data.biomarkers || []).map(b => ({ ...b }));

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{

  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{

//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
