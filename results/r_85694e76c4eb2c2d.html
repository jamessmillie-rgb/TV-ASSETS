<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Phil Harding","dob":"11/02/1980","report_date":"2026-09-25","summary":"Phil is a 46-year-old male presenting with a BMI of 31.2, following a standard mixed diet rated 7 out of 10 for quality with a volume of 7 out of 10. He trains twice per week, one cardio session and one resistance session at moderate intensity, with 2,000 to 5,000 daily steps. He takes no medications and has no diagnosed conditions. He reports consuming one to four alcoholic drinks per week and overusing caffeine or energy drinks. He reports low energy and fatigue, low mood and anxiety, brain fog, and difficulty losing weight. His goals are to improve energy levels, lose body fat, and improve mood. He has a family history of thyroid disease and an autoimmune condition. He notes that all prior blood tests have returned normal results save for slightly high cholesterol, but that he does not feel great and wants to optimise his health rather than settle for the bare minimum.\n\nThe most important finding in this report is the lipid panel, and it is the finding Phil should take to his GP. His total cholesterol is 7.1, well above the desirable limit of 5.18. His LDL cholesterol, the fraction that drives plaque formation in arteries, is 4.61 against a target of below 3.0. His ApoB, a protein that sits on the surface of every atherogenic lipoprotein particle and is the single best predictor of cardiovascular risk, is 1.59, which is almost double the 0.9 threshold and classified as very high. His triglycerides are 2.94, above the 1.70 fasting target, which pushes up his VLDL, the very low density lipoprotein that carries triglycerides in the blood, to 1.34 against a limit of 0.78. His HDL cholesterol, the protective fraction that removes cholesterol from artery walls and returns it to the liver, is 1.20, which is above the high-risk threshold of 1.04 but below the desirable level of 1.55. His ApoB to ApoA-I ratio, which summarises the balance between harmful and protective lipoproteins in a single number, is 1.01, well above the 0.7 threshold and in the higher-risk category. Taken together, this is a lipid profile that is building cardiovascular risk at a meaningful rate, and it is doing so at 46, which means the exposure is accumulating during the years when intervention makes the biggest difference.\n\nCritically, his Lp(a), lipoprotein(a), is 165.8 against a limit of 32. Lp(a) is a genetically determined lipoprotein particle that deposits cholesterol in artery walls, promotes clotting, and drives inflammation. It is entirely inherited, cannot be changed by diet, exercise or any currently available supplement, and it does not change over a lifetime. A level of 165.8 places Phil in the moderate-risk category and means that a significant portion of his cardiovascular risk is not modifiable through lifestyle alone. This is a result that should be recorded permanently in his medical notes because it changes the threshold at which his GP should consider intervention. It also means his first-degree relatives, parents, siblings and children, should be tested for Lp(a) because the trait is passed directly. When Lp(a) is subtracted from the LDL calculation, his Lp(a)-corrected LDL is 4.07, which is still well above the 3.0 target, confirming that even the modifiable portion of his LDL is elevated. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 95 out of 100, driven primarily by the Lp(a), the ApoB and the LDL. At 46, his ten-year risk of a cardiovascular event may still be statistically low, but the score reflects the rate at which risk is being built, and the gap between those two numbers is the window Phil has to act.\n\nBefore moving to what needs to change, there is genuine good news in this report and it matters. Phil's thyroid is working well. TSH, the signal from the pituitary gland that tells the thyroid how hard to work, is 2.05, right in the middle of the ideal range. Free T4 at 21.2 and Free T3 at 5.9 are both in excellent positions, and his FT3 to FT4 ratio of 0.278 confirms the thyroid is converting its storage hormone into the active form efficiently. Both thyroid antibodies, TPO and thyroglobulin, are undetectable, which is particularly reassuring given his family history of thyroid disease and autoimmune conditions. This does not eliminate future risk, but right now the thyroid is not contributing to his fatigue, brain fog or weight difficulties. His liver is in good health. ALT at 34, AST at 32 and GGT at 25 are all within the laboratory range, and while ALT is above the stricter optimal threshold of 30 for a male, it is marginal. His bilirubin, albumin and total protein are all healthy, and the APRI score of 0.46 and FIB-4 of 1.45 both indicate no significant liver fibrosis. His amylase and lipase, enzymes produced by the pancreas to digest food, are both within range, confirming normal pancreatic function. His kidney function is solid. Creatinine at 83 gives a standard eGFR above 90, and Cystatin C at 1.05, a more accurate measure of kidney filtration that is not affected by muscle mass, gives a Cystatin C eGFR of 89, just below the optimal threshold of 90 but functionally normal at 46. Urea, sodium, chloride, bicarbonate and potassium are all within range. Uric acid at 342 is within the laboratory range and within the optimal band. His prostate markers are excellent. PSA at 1.05 against a limit of 2.5, with a free PSA ratio of 0.514, is entirely reassuring. His tumour markers, CA19-9 and CEA, are both well within normal limits. His immune system shows IgG and IgA at healthy levels, IgE at 91 just under the 100 limit, and rheumatoid factor is undetectable. Tissue transglutaminase, the coeliac screening antibody, is negative, which rules out active coeliac disease as a cause of his symptoms. His urinalysis is clean, with no protein, glucose, blood, white cells or nitrites detected. Cortisol at 365 is within the morning reference range, and his adrenal function appears normal. His testosterone at 19.3 is within the optimal band of 18 to 30 for a male, his SHBG at 42 is well positioned, and his free testosterone at 0.347 and bioavailable testosterone at 8.49 are both within range, though bioavailable testosterone is at the upper end of range. DHEA-S at 3.7 is healthy. These are positive findings at 46 and at a BMI of 31.2, where testosterone is often suppressed.\n\nThe insulin and blood sugar picture is where the lipid findings connect to Phil's weight and energy complaints. His fasting glucose at 4.7 is healthy, and his HbA1c at 38 mmol/mol is within the normal range. However, his fasting insulin at 9.36, while within the laboratory range of 2.6 to 24.9, is above the optimal ceiling of 8, and his HOMA-IR, a calculation that estimates how resistant the body's cells are to insulin, is 1.96, above the 1.5 upper limit and crossing the 1.9 threshold that marks early insulin resistance. What this means in practice is that Phil's pancreas is having to produce more insulin than it should to keep his blood sugar in a healthy range. The blood sugar looks fine because the pancreas is compensating, but the compensation itself is the problem. Elevated insulin promotes fat storage, particularly around the abdomen, makes it harder to lose weight, and is one of the most common drivers of the afternoon energy crash Phil describes. It also drives triglyceride production in the liver, which is why his triglycerides are 2.94 and his VLDL is elevated. The insulin resistance and the lipid picture are not separate findings; they are the same metabolic pattern viewed from two angles. The elevated triglycerides lower HDL by displacing cholesterol from HDL particles, which is why his HDL is below the desirable level. The LDL is partly driven by the same insulin-mediated overproduction and partly by the Lp(a), which is genetic and fixed.\n\nPhil's hs-CRP, a measure of systemic inflammation, is 0.9, which is within the optimal range of below 1.0. This is a genuinely good result at a BMI of 31.2 and suggests that, for now, the metabolic strain is not producing a significant inflammatory response. His ESR at 2 confirms this. The low inflammation buys time; it means the arterial damage from the lipid exposure is accumulating more slowly than it would if CRP were elevated as well.\n\nHis IgM, one of the five classes of immunoglobulin, is 0.2 against a lower limit of 0.5. IgM is the first antibody the body produces in response to a new infection, and a low level can reflect a natural variation in immune architecture, previous illness patterns, or occasionally an underlying immune condition. At this level, it is worth noting on his GP record. It does not mean Phil is immunocompromised in a practical sense, but it should be rechecked in six months and his GP should be aware.\n\nPhil's full blood count is largely healthy. Haemoglobin at 161, red cell count at 5.14, and haematocrit at 0.481 are all solidly within range. His white cell count and differential are normal, with a neutrophil to lymphocyte ratio of 1.93, within the optimal band. His iron studies show ferritin at 158, well within the optimal range for a male, serum iron at 29.5 and transferrin saturation at 49.56%, which is within range but approaching the upper boundary of 55%. This is not alarming in isolation, but given that transferrin at 2.37 is at the lower end of its range, the combination suggests iron stores are ample and absorption is efficient. This does not warrant investigation for haemochromatosis at present because ferritin is not elevated and the saturation is within range, but if transferrin saturation rises above 55% on a future test, the GP should consider an HFE gene test. His reticulocyte percentage at 0.91 is healthy, though the absolute reticulocyte count at 46.8 is marginally below the lower limit of 50. At this margin, with normal haemoglobin and no signs of anaemia, this is most likely a reflection of a well-supplied bone marrow that does not need to push new red cells out quickly. It is not a concern.\n\nPhil's vitamin B12 at 472 is within the laboratory range but below the optimal threshold of 500. Given that his folate is 23, above the upper limit of 17, the B12 to folate balance is worth addressing. High folate can mask the effects of a B12 that is sliding toward insufficiency, and B12 is involved in energy production, mood regulation and cognitive function, all three of which Phil is reporting as problems. His vitamin D at 77 is within the optimal range of 75 to 120 but sitting right at the lower edge. At a BMI of 31.2, fat tissue sequesters vitamin D, so maintaining this level requires ongoing supplementation, and pushing it toward the middle of the optimal range, around 100, would be worthwhile. His calcium, phosphate, magnesium and parathyroid hormone are all within healthy ranges.\n\nPhil's progesterone is 0.55, below the male reference range of 0.89 to 3.88. In men, progesterone plays a minor role in mood regulation and sleep quality. At this level it is unlikely to be the primary driver of his symptoms, but it adds a small piece to the picture. His oestradiol at 105 is within range for a male. His MPV, mean platelet volume, is 12 against an upper limit of 10.1. MPV reflects the average size of platelets, and larger platelets are sometimes seen with low-grade inflammation or when the bone marrow is producing platelets at a higher rate. With a normal platelet count, normal CRP and normal ESR, this is most likely a constitutional finding rather than a clinical concern, but it should be noted.\n\nHis total antioxidant activity at 1.96 is above the upper limit of 1.77. This is typically driven by dietary antioxidants, vitamin C, polyphenols and other compounds from food and supplements. It is not a concern and may reflect his diet quality, which he rates at 7 out of 10.Phil's PhenoAge, a biological age estimate calculated from nine blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 40 against a calendar age of 46: about six years younger than he is.\n\nNow, to Phil's symptoms. The fatigue, afternoon crash, brain fog and low mood have a plausible explanation in this report, and it is not one single marker but a pattern. The early insulin resistance means his blood sugar control is less stable than it looks on a single fasting reading. After a meal, particularly one rich in refined carbohydrate or sugar, which his quiz tells us he consumes daily, insulin spikes higher than it should, drives blood sugar down too fast, and produces the classic afternoon crash he describes. The brain fog and low mood that accompany this are well-recognised features of the same pattern. His B12 at 472, while not deficient, is below the level at which cognitive function and mood are optimally supported. His sleep is under six hours per night and he describes being slow to get going in the morning. Sleep deprivation below seven hours is independently associated with insulin resistance, impaired glucose metabolism, increased appetite for high-calorie food, reduced willpower, low mood, poor concentration and difficulty losing weight. It is likely contributing to every one of Phil's reported symptoms and to several of his abnormal results. His caffeine overuse is almost certainly a compensatory response to the poor sleep but creates its own cycle: caffeine after midday delays sleep onset, shortens deep sleep, and makes the next morning worse. The low step count of 2,000 to 5,000 means Phil is spending most of his day sedentary, which reduces insulin sensitivity, lowers mood, and contributes to the weight he is finding difficult to shift.\n\nThe weight difficulty is explained by the insulin resistance, the sleep deprivation, the low activity level and the daily sugar intake. At a BMI of 31.2, losing body fat is Phil's single most powerful lever for improving almost every abnormal result in this report. Reducing body fat improves insulin sensitivity, which lowers fasting insulin and HOMA-IR, which reduces triglyceride production, which raises HDL, which improves the ApoB to ApoA-I ratio. It will not change the Lp(a), and it may not normalise the LDL on its own given how high it is, but it will move every modifiable marker in the right direction.","links":"The central thread running through Phil's results is a metabolic pattern driven by insulin resistance, compounded by a significant genetic cardiovascular risk factor. His fasting insulin at 9.36 and HOMA-IR at 1.96 show that his cells are becoming resistant to insulin's signal, forcing the pancreas to produce more of it to keep blood sugar in check. The blood sugar looks normal because the compensation is working, but the excess insulin is driving a cascade of downstream effects: overproduction of triglycerides in the liver, elevation of VLDL, suppression of HDL, and promotion of fat storage, particularly visceral fat. This is why his triglycerides are 2.94, his VLDL is 1.34, his HDL is below the desirable threshold, and his weight is proving difficult to shift.\n\nThe LDL at 4.61 and ApoB at 1.59 are partly driven by this same insulin-mediated metabolic dysfunction and partly by genetics. His Lp(a) at 165.8 is entirely inherited and contributes a fixed, unmodifiable component to his LDL and his overall cardiovascular risk. Even after correcting for the Lp(a) contribution, his LDL remains at 4.07, well above target, confirming that the modifiable portion is also elevated. The Cardiovascular Risk Score of 95 out of 100 reflects the combined impact of these factors and is the most important number in this report for long-term health planning.\n\nThe symptoms Phil reports, fatigue, brain fog, afternoon crashes and low mood, are best explained not by a single deficiency but by the convergence of insulin resistance, chronic sleep deprivation under six hours, caffeine overuse, low physical activity and daily sugar consumption. Each of these independently impairs energy, cognition and mood. Together they create a self-reinforcing cycle: poor sleep increases insulin resistance and appetite, caffeine compensates for the fatigue but worsens the sleep, the insulin resistance promotes fat storage and energy crashes, and the low activity level reduces the body's ability to clear glucose and improve insulin sensitivity. The blood results confirm that the thyroid, testosterone, cortisol, liver, kidneys and red blood cell production are all functioning well, which means the symptoms are driven by lifestyle factors rather than an organ-level disease process.\n\nThe IgM at 0.2 sits outside this metabolic pattern and appears to be an independent finding. It could represent a natural variation, a previous immune event, or occasionally the earliest sign of a selective IgM deficiency. It does not explain Phil's symptoms but should be recorded and rechecked.\n\nWhat was excluded matters as much as what was found. Phil's thyroid is working excellently with negative antibodies, which is significant given his family history. There is no anaemia, no iron deficiency, no vitamin D deficiency, no significant B12 deficiency, no coeliac disease, no liver disease, no kidney disease, no testosterone deficiency, and no systemic inflammation. The prostate and tumour markers are clear. This means the path forward is defined by the metabolic and cardiovascular findings alongside the lifestyle factors driving his symptoms, and these are all modifiable except the Lp(a).","lifestyle":"Cut all sugary drinks, sweets and added sugar from Monday to Friday, keeping the weekend flexible to start. Anchor: when you shop, do not buy them for the house. Why: daily sugar is the single biggest driver of the fasting insulin of 9.36 and HOMA-IR of 1.96 that are behind your weight gain, afternoon crashes and elevated triglycerides of 2.94.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, leftover meat. Anchor: protein goes on the plate before anything else. Why: protein blunts the insulin spike, keeps you full longer, and protects muscle while you lose fat. Your target is 130 to 160 grams of protein per day.\nWalk for 15 to 20 minutes immediately after your largest meal, every day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, directly improving the HOMA-IR of 1.96 and helping shift the triglycerides of 2.94.\nBuild your daily steps to 7,500 within four weeks, then 10,000 within eight weeks. Anchor: set a phone reminder at 10am and 3pm to check your count and walk the gap. Why: at 2,000 to 5,000 steps you are sedentary for most of the day, which maintains insulin resistance regardless of what you eat.\nAdd one more resistance session per week so you are doing two. Anchor: pick a fixed day and time and protect it. Why: resistance training is the most effective single intervention for improving insulin sensitivity, and at two sessions per week you will preserve and build muscle while losing fat, which keeps your testosterone at its current healthy level of 19.3.\nSet a fixed caffeine cut-off at 1pm, no exceptions. Anchor: switch to decaf or water after lunch. Why: caffeine after 1pm is almost certainly contributing to your under-six-hour sleep, and the sleep deprivation is independently driving insulin resistance, brain fog, low mood, appetite and weight gain.\nSet a fixed wake time seven days a week and protect seven hours in bed. Anchor: alarm at the same time every day, including weekends. Why: sleep under six hours increases insulin resistance by up to 40% and impairs every symptom you are reporting. This is not optional if you want the other changes to work.\nAim for a calorie intake of 2,000 to 2,200 per day to lose 0.5 to 0.75kg per week, from a current estimated maintenance of around 2,700. Your target weight range is 82 to 88kg, which would bring your BMI below 28. Track loosely for the first four weeks to calibrate portions, then eat to hunger and protein target once you have a feel for it.","flags":"Lipid panel critically elevated with high inherited risk: Total cholesterol 7.1 (desirable below 5.18), LDL 4.61 (target below 3.0), ApoB 1.59 (target below 0.9, classified very high), triglycerides 2.94 (target below 1.70), VLDL 1.34 (limit 0.78), HDL 1.20 (desirable above 1.55), ApoB/A-I ratio 1.01 (target below 0.7), Lp(a) 165.8 (limit 32, moderate risk, entirely genetic). Lp(a)-corrected LDL 4.07 (target below 3.0) confirms that the modifiable LDL component is also elevated. Cardiovascular Risk Score 95/100. This combination of very high ApoB, elevated LDL and Lp(a) at 165.8 warrants a GP conversation about lipid-lowering therapy alongside lifestyle change, and Lp(a) should be recorded permanently in his medical notes. First-degree relatives should be offered Lp(a) testing.\nHOMA-IR 1.96 (range 0.5 to 1.5) with fasting insulin 9.36 mIU/L (optimal below 8). Early insulin resistance, likely driven by excess refined carbohydrate, low activity and sleep deprivation. Directly linked to elevated triglycerides and low HDL.\nIgM 0.2 g/L (range 0.5 to 3.0). Isolated low IgM with normal IgG and IgA. May represent natural variation, prior immune event, or selective IgM deficiency. Should be recorded and rechecked in six months.\nProgesterone 0.55 nmol/L (range 0.89 to 3.88). Below range in a male, minor clinical significance. Unlikely to explain symptoms at this margin but noted for record.\nAbsolute reticulocyte count 46.8 (range 50 to 100) with normal haemoglobin and reticulocyte percentage. Marginally below range, most likely reflects adequate iron stores and no demand for accelerated red cell production. Not clinically significant.\nMPV 12 fL (range 7.1 to 10.1). Elevated mean platelet volume with normal platelet count, CRP and ESR. Most likely constitutional. Not a concern in isolation.\nFolate 23 ng/ml (range 3 to 17). Above range, likely dietary or supplemental. Not harmful but notable alongside a B12 of 472 that is below the optimal threshold of 500.\nTotal Antioxidant Activity 1.96 mmol/L (range 1.3 to 1.77). Above range, likely reflects dietary antioxidant intake. Not a concern.\nFIB-4 1.45 (threshold 1.45). At the borderline, but all individual liver markers are within range and the APRI of 0.46 is reassuring. Driven by the calculation rather than liver disease.\nReassuring negatives: Thyroid function excellent with negative antibodies despite family history. Testosterone 19.3 within optimal range. Cortisol normal. Kidney function normal. Liver enzymes within range. No anaemia or iron deficiency. CRP 0.9 within optimal range. ESR 2. PSA 1.05 with free ratio 0.514. CA19-9 and CEA normal. Coeliac screen negative. Rheumatoid factor undetectable. Urinalysis clean.\nNot returned by the laboratory: Urine bacterial count and urine culture and sensitivities are pending.","recommendations":"Discuss the lipid panel with your GP as a priority. Bring these numbers: ApoB 1.59 (target below 0.9), LDL 4.61 (target below 3.0), Lp(a) 165.8 (limit 32, genetic, unchangeable), triglycerides 2.94, HDL 1.20, and Cardiovascular Risk Score 95/100. Given the combination of very high ApoB and significantly elevated Lp(a), lipid-lowering therapy should be discussed alongside the dietary and lifestyle changes in this report. The Lp(a) result should be recorded permanently in your medical notes.\nAsk your GP to offer Lp(a) testing to your first-degree relatives, parents, siblings and children, as this is an inherited trait and early identification allows earlier risk management.\nMention the IgM of 0.2 (range 0.5 to 3.0) to your GP. It should be noted in your record and rechecked in six months to establish whether it is stable or declining.\nAddress the insulin resistance through the dietary and activity changes in the lifestyle section. The GP may want to recheck fasting insulin and HOMA-IR in three to four months to confirm improvement before considering any medication.\nRetest in four months with the following markers to track progress: full lipid panel including ApoB, fasting insulin, HOMA-IR, HbA1c, IgM, and liver function. If the GP starts lipid-lowering medication, liver function should be checked at six weeks.\nCalorie target: 2,000 to 2,200 kcal per day. Protein target: 130 to 160 grams per day (approximately 1.3 to 1.6g per kg of body weight). Target weight: 82 to 88 kg. These targets support a sustainable fat loss of 0.5 to 0.75 kg per week while preserving muscle mass and supporting testosterone.","supplementation":"Omega-3 fish oil: 3g combined EPA and DHA daily, taken with food. Choose a high-strength liquid or capsule that delivers at least 1,500mg EPA. Why: omega-3 at this dose lowers triglycerides, which are 2.94, and supports the HDL recovery alongside the dietary changes. It also has a modest anti-inflammatory effect that supports long-term cardiovascular health.\nVitamin D3 (cholecalciferol): 3,000 IU daily, taken with a meal containing fat. Why: your vitamin D at 77 is just inside the optimal range but at a BMI of 31.2, fat tissue sequesters vitamin D and you need a higher maintenance dose to push toward 100 nmol/L where the benefits for immune function, mood and insulin sensitivity are strongest.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bone and away from arteries, and should always accompany vitamin D supplementation, particularly when cardiovascular health is a priority.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 472 is below the optimal threshold of 500 and given your symptoms of fatigue, brain fog and low mood, pushing B12 into the 500 to 900 range may provide a noticeable improvement. Sublingual methylcobalamin bypasses gut absorption, which is more reliable than oral tablets.\nMagnesium glycinate: 300 to 400 mg before bed. Why: your magnesium at 0.89 is within range but at the lower half of optimal, and magnesium glycinate specifically supports sleep quality and onset, which is the most important lifestyle change in this report given your sleep is under six hours.\nDo not take iron supplements. Your ferritin is 158, your serum iron is 29.5 and your transferrin saturation is 49.56%. Additional iron would risk pushing saturation above the safe threshold.\nThe most important changes from this report are not supplements. They are cutting daily sugar, increasing protein to 130 to 160 grams per day, walking after meals, building to 10,000 steps, fixing the caffeine cut-off at 1pm, and protecting seven hours of sleep. These changes will move the insulin resistance, triglycerides, HDL and weight more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"51","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4636","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 51 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 51.1. Weakest systems: lipids & cardiovascular 5%, immunology 26%, glucose & insulin 44%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Lipoprotein(a), Remnant Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3922","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the rate at which cardiovascular risk is being built, not the ten-year probability of an event. Phil's score of 95 is driven primarily by Lp(a) at 165.8, ApoB at 1.59 and LDL at 4.61. At 46, his ten-year risk of a cardiovascular event may still be statistically low, but this score reflects a very high rate of risk accumulation, and the gap between those two numbers is the window for acting.","low_causes":"Excellent lipid profile, low Lp(a), low inflammation","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after an overnight fast. Phil's result of 4.7 is within the optimal range, indicating that his blood sugar is being well controlled at the point of testing. However, this number should be interpreted alongside his insulin level: the glucose looks healthy because the pancreas is producing enough insulin to keep it there. The effort required to maintain this level is what HOMA-IR reveals.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia","high_causes":"Insulin resistance, pre-diabetes, diabetes, acute stress, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6167","units":"%","description":"HbA1c expressed as a percentage reflects average blood sugar control over the past two to three months. Phil's result of 5.6% is within the normal range and below the 6.0% pre-diabetes threshold. This confirms that overall glucose control has been adequate over recent months, though the insulin resistance identified by HOMA-IR suggests the body is working harder than it should to achieve this.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Pre-diabetes, diabetes, iron deficiency, chronic high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised measure of average blood sugar over the past two to three months. Phil's result of 38 is within the normal range of below 42, though it sits just above the stricter optimal threshold of 36. This is not pre-diabetes, but it is nudging upward and is consistent with the early insulin resistance pattern seen in HOMA-IR. The dietary changes in this report should bring it back toward 34 to 36.","low_causes":"Anaemia, blood loss, haemoglobin variants","high_causes":"Pre-diabetes, diabetes, chronic high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"9.36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4355","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.4165","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to maintain blood sugar levels after an overnight fast. Phil's result of 9.36 is within the laboratory range of 2.6 to 24.9 but above the optimal ceiling of 8 mIU/L. This means the pancreas is producing more insulin than it should need to, which is the hallmark of early insulin resistance. Elevated fasting insulin promotes fat storage, drives triglyceride production, and is a key driver of afternoon energy crashes. It is the most actionable metabolic finding in this report.","low_causes":"Low   if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
