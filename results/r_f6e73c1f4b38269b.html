<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"dob":"18/04/1975","flags":"Lipoprotein(a) above 212.5 nmol/L (high risk threshold 200 nmol/L). Inherited, non-modifiable cardiovascular risk factor. GP should record permanently, consider testing first-degree relatives, and incorporate into overall cardiovascular risk assessment. Discuss whether statin therapy to push modifiable ApoB and LDL as low as possible is appropriate given the inherited burden.\nThyroid Peroxidase antibodies 27 U/mL (limit 13.8) and Thyroglobulin antibodies 651.4 U/mL (limit 4.4). Pattern strongly associated with Hashimoto's thyroiditis. Thyroid function currently normal (TSH 0.8, FT4 18.2, FT3 5.0). Recommend annual TSH and FT4 monitoring to detect early decline.\nApoB 0.91 g/L (target below 0.9) and LDL 3.05 mmol/L (target below 3.0). Marginally above targets but Lp(a)-corrected LDL is 2.36, showing the modifiable fraction is within range. Management strategy depends on GP's assessment of total cardiovascular risk including the Lp(a).\nTransferrin saturation 51.22% (lab range 18 to 55%, ideal 25 to 40%) with ferritin 272 ng/mL and transferrin 2.2 g/L at the floor of its range. Consider HFE gene test to exclude hereditary haemochromatosis, particularly given European ancestry.\nVitamin B12 249 pg/mL (lab range 193 to 982, ideal 500 to 900) and folate 7 ng/mL (lab range 3 to 17, ideal above 8). Both below optimal. Likely contributing to low absolute reticulocyte count of 29.6 (range 50 to 100). Supplement B12 and increase dietary folate.\nAbsolute reticulocyte count 29.6 x10^9/L (range 50 to 100). Below range, most likely nutritional (low B12 and borderline folate). Expected to normalise with supplementation. Not associated with anaemia at present (haemoglobin 161).\nLipase 61 U/L (upper limit 60). One unit above range, likely GLP-1 medication effect. Amylase normal at 60. No clinical concern but worth GP noting in context of Mounjaro use.\nProgesterone 0.69 nmol/L (range 0.89 to 3.88). Below range but clinically insignificant in men. No action required.\nCardiovascular Risk Score 55 out of 100 (flagged threshold 40). Driven primarily by Lp(a); modifiable lipids, inflammation and blood sugar are in good shape.\nReassuring negatives: glucose 5.1, HbA1c 38, insulin 5.72 and HOMA-IR 1.3 show no insulin resistance or pre-diabetes. Liver function entirely normal with FIB-4 1.1 and APRI 0.235. Kidney function strong with combined eGFR 93. PSA 0.85 with free ratio 25.9%. CRP 0.7 and ESR 4 exclude active inflammation. Rheumatoid factor negative. Coeliac screen negative. CA19-9 and CEA within range. Urinalysis clear.","links":"The central story in this report is a man who has made a transformative change to his metabolic health through significant weight loss and GLP-1 medication, and whose modifiable risk factors are now in a genuinely strong position, but who carries an inherited cardiovascular risk that needs medical attention and whose thyroid is under immune attack that has not yet caused dysfunction but will need monitoring.\n\nThe Lp(a) at above 212.5 nmol/L is the dominant cardiovascular finding. It is entirely genetic, inherited from one or both parents, and it does not respond to any lifestyle intervention. His LDL of 3.05 and ApoB of 0.91 are marginally above their respective targets, but when the Lp(a) contribution is removed, the Lp(a)-corrected LDL drops to 2.36, showing that the modifiable component of his cholesterol is well controlled. His triglycerides, TG/HDL ratio, remnant cholesterol and ApoB/A1 ratio are all within or near the ideal range. The cardiovascular risk score of 55 is driven by the Lp(a) rather than by anything he can change through food or exercise. This means the GP conversation is about pharmacological risk reduction: whether a statin to push the modifiable LDL and ApoB as low as possible makes sense given the inherited risk, and whether any other interventions are appropriate.\n\nThe thyroid antibodies (TPO 27, thyroglobulin 651.4) sit as a separate finding with a different timeline. The thyroid is currently working normally, but the immune process is active and progressive. Over the coming years, this may lead to a gradual rise in TSH and a decline in thyroid hormone output. If and when that happens, it could contribute to the very symptoms he is already experiencing: fatigue, difficulty losing weight, joint stiffness and slow mornings. Annual thyroid monitoring will catch this early enough to treat it before it causes significant problems.\n\nThe low B12 and borderline folate connect directly to the low absolute reticulocyte count. The bone marrow needs B12 and folate to build red blood cells efficiently, and when both are below optimal, red cell production slows. His haemoglobin is still healthy because the existing red cells are normal in size and content, but the pipeline is running below capacity. Correcting the B12 with sublingual methylcobalamin and increasing dietary folate should resolve the reticulocyte count and may also improve his morning energy.\n\nThe iron picture (transferrin saturation 51.22%, ferritin 272, transferrin 2.2 at the floor of its range) is worth pursuing because of his European ancestry. This pattern could reflect normal iron status at the upper end of the range, or it could be the early signature of heterozygous or homozygous haemochromatosis. A single HFE gene test would settle the question permanently and, if positive, would lead to simple management (regular blood donation or venesection).\n\nThe findings that do not need further investigation are the below-range progesterone (clinically insignificant in men), the marginally elevated lipase (one unit above range, likely GLP-1 related), and the elevated total antioxidant activity (supplement-driven). These are noted for completeness but do not form part of the clinical picture.","summary":"This is a 51-year-old male following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are slightly below average (volume 4 out of 10). He trains four times per week (three cardio, one resistance) at moderate intensity, with 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking, with an afternoon energy crash; stress rarely feels hard to manage. Alcohol is 1 to 4 drinks per week. He is taking Mounjaro (tirzepatide, currently 7.5 mg) and a multivitamin. His family history includes bowel, breast, prostate or ovarian cancer. He has lost 20 to 25 kg over the past 18 to 24 months, dropping four inches from his waist (42 inches down to 38 inches), and he has not had blood tests before. He reports weight gain and difficulty losing weight alongside joint pain and stiffness, both longstanding. His goals are to improve long-term health and longevity, improve cardiovascular fitness, and lose body fat.\n\nThe most important finding in this report is his Lipoprotein(a), reported at above 212.5 nmol/L, which places it well above the 200 nmol/L threshold for high cardiovascular risk. Lipoprotein(a), usually written as Lp(a), is an inherited particle that behaves like LDL cholesterol but also promotes blood clotting and drives inflammation in artery walls. It is set by genetics, does not change with diet, exercise or weight loss, and cannot currently be lowered by any widely available treatment. At this level, this needs to go to his GP. The GP should record the Lp(a) level permanently in his notes, consider testing first-degree relatives (parents, siblings, children), and factor it into his overall cardiovascular risk assessment. It also changes the way the rest of his lipid panel should be read, because even if the modifiable lipids were perfect, this inherited particle alone would carry significant risk.\n\nHis second key finding is a pair of strongly positive thyroid antibodies. Thyroid Peroxidase antibodies, known as TPO antibodies, are at 27, above the upper limit of 13.8. Thyroglobulin antibodies are at 651.4, dramatically above the upper limit of 4.4. These antibodies are made by the immune system and attack the thyroid gland. When both are elevated like this, the pattern is strongly associated with a condition called Hashimoto's thyroiditis, which is the most common cause of underactive thyroid. Right now, his thyroid is still working well: his TSH (thyroid stimulating hormone, the signal the brain sends to tell the thyroid to produce more hormone) is 0.8, comfortably within the ideal range of 1.0 to 2.5 and certainly within the laboratory range. His Free T4 (the main thyroid hormone) is 18.2, well within the ideal range. His Free T3 (the active form of thyroid hormone) is 5.0, which is within the ideal range. The ratio of FT3 to FT4, which shows how well the body is converting storage hormone into active hormone, is 0.275, right at the lower edge of optimal. So the thyroid is functioning normally today, but the antibodies tell us the immune system is actively targeting it. Over months to years, this can gradually erode thyroid function, leading to fatigue, weight gain, brain fog, and joint stiffness, symptoms he already reports. His GP should be aware of these antibodies and should check TSH and FT4 annually going forward to catch any decline early.\n\nTurning to the positives, and there are many. His blood sugar control is excellent. His glucose is 5.1, within the ideal range of 4.0 to 5.4. His HbA1c, which measures average blood sugar over the past two to three months, is 38 mmol/mol (5.6%), comfortably within the normal range and below the pre-diabetes threshold of 42. His insulin is 5.72, sitting within the ideal range of 2 to 8, which is genuinely impressive given his recent weight loss journey and Mounjaro use. His HOMA-IR, a calculation that combines glucose and insulin to estimate how sensitive the body's cells are to insulin, is 1.3, and with both of its inputs sitting within their ideal ranges this reflects healthy insulin sensitivity. His C-Peptide, a marker of how much insulin the pancreas is actually producing, is 1.24 ug/L, within the laboratory range. This metabolic picture tells a clear story: the combination of significant weight loss and Mounjaro has brought his metabolic health into a strong position, and there is no sign of insulin resistance or pre-diabetes.\n\nHis liver is in excellent health. ALT, the most specific liver enzyme, is 19, well within the ideal range. AST is 20, GGT is 34, ALP is 62, bilirubin is 16, and albumin is 44, all within their respective ranges. The De Ritis ratio (AST divided by ALT) is 1.05, within the ideal range. His FIB-4 score, which estimates liver scarring using age, platelets, AST and ALT, is 1.1, below the 1.3 threshold and showing no sign of fibrosis. The APRI score, another fibrosis estimate, is 0.235, well within the ideal range. This is a clean liver under no metabolic strain.\n\nHis kidney function is strong. His creatinine-based eGFR is above 90. His Cystatin C, a more precise measure of kidney filtration that is not affected by muscle mass, is 1.02, within range, giving a Cystatin C eGFR of 93, which is above the optimal threshold of 90. The combined eGFR is 93. Urea is 4.5, sodium is 140, potassium is 4.7, chloride is 99, and bicarbonate is 29.7, all within range. His uric acid is 354, within the laboratory range and within the ideal range of 200 to 380. His serum osmolality is 289.6, within the ideal range, confirming good hydration and electrolyte balance.\n\nHis full blood count is healthy. Haemoglobin is 161, right in the middle of the male range. Red blood cells, haematocrit, MCV, MCH, and MCHC are all within range. Platelets are 213, white cell count is 6.52, and the differential (neutrophils, lymphocytes, monocytes, eosinophils, basophils) is entirely normal. His neutrophil to lymphocyte ratio is 1.69, within the ideal range of 1.0 to 2.0, and his systemic immune-inflammation index is 360, within the ideal range, both suggesting no systemic inflammation. His ESR is 4, very low, and his hsCRP, the most sensitive measure of background inflammation, is 0.7, within the ideal range of below 1.0. For a man who has lost over 20 kg, this inflammation profile is outstanding. His reticulocyte percentage is 0.57%, within range, but his absolute reticulocyte count is 29.6, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and the absolute count reflects how quickly the marrow is producing them. At this level, the bone marrow is producing red cells at a slower pace than expected. The most likely explanation is nutritional: his B12 is low (discussed below) and his folate is at the lower end, and both are essential raw materials for red cell production. With those corrected, the reticulocyte count would be expected to rise.\n\nHis iron studies show good stores but a transferrin saturation worth noting. Ferritin is 272, within the laboratory range and within the ideal range of 50 to 200 for optimal, sitting above the ideal ceiling but well within the lab range of 22 to 322. Serum iron is 28.3, transferrin is 2.2 (just above the lower limit of 2.15), and iron binding capacity is 54.8, all within range. His transferrin saturation, which measures the proportion of the body's iron transport protein that is loaded with iron, is 51.22%, within the laboratory range of 18 to 55% but above the ideal range of 25 to 40%. This is not at a level that demands urgent investigation, but with a saturation consistently above 45% and ferritin in the upper part of the range, it would be reasonable for his GP to check this on a repeat sample and, if it remains elevated, consider an HFE gene test. HFE is the gene responsible for hereditary haemochromatosis, a common inherited condition in people of European ancestry where the body absorbs too much iron from food. One in every eight or nine people of European descent carries one copy of the gene, and around one in 200 carries two copies. It is easily managed once identified, and given that his transferrin is sitting right at the bottom of its range while saturation is high, it is worth ruling out.\n\nHis Vitamin B12 is 249 pg/mL, within the laboratory range of 193 to 982 but well below the ideal range of 500 to 900. B12 is essential for nerve function, red blood cell production, and DNA synthesis. At this level, his body has enough to avoid deficiency symptoms, but not enough for optimal function. This is likely contributing to his low reticulocyte count and may also be playing a role in his fatigue and slow mornings. His folate is 7 ng/mL, within the laboratory range of 3 to 17 but below the ideal of above 8. B12 and folate work together in the same biochemical pathway, and both being below ideal is a pattern that should be corrected. His Vitamin D is 80 nmol/L, which is sufficient and within the ideal range of 75 to 120. His magnesium is 0.91, within the ideal range of 0.85 to 1.05, and his calcium and phosphate are within range. His parathyroid hormone is 1.506 pmol/L, within range, confirming normal calcium regulation.\n\nHis lipid panel, read alongside the Lp(a) finding, tells an important story. His total cholesterol is 4.8, his HDL is 1.4 (within the laboratory range but below the ideal of above 1.4 for men, sitting right on the border), his LDL is 3.05, marginally above the upper limit of 3.0, and his ApoB is 0.91, just above the target of 0.9. ApoB is the protein carried by every LDL particle and is the best single measure of the number of cholesterol particles in the blood, which matters more than the amount of cholesterol they carry. His triglycerides are 0.83, excellent and within the ideal range of below 1.0. His TG to HDL ratio is 0.59, within the ideal range, and his remnant cholesterol is 0.35, within the ideal range. The ApoB to ApoA1 ratio is 0.61, within the lower risk range of below 0.7. Now, here is where the Lp(a) changes the picture. Lp(a) particles also carry ApoB, so some of the measured ApoB and LDL is coming from the Lp(a) he cannot change. His Lp(a)-corrected LDL, which estimates what the LDL would be without the Lp(a) contribution, is 2.36, within the laboratory range and within the ideal range. This means the modifiable part of his LDL, the part that responds to diet, exercise and medication, is actually in a good place. The cardiovascular risk score, a TrueVitals composite built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 55 out of 100, which is above the flagged threshold of 40. This score is being driven almost entirely by the Lp(a): his modifiable lipids, inflammation and blood sugar are all in good shape. The GP conversation should focus on the overall cardiovascular risk picture, including whether statin therapy or aspirin would be appropriate given the Lp(a) level, because the inherited risk cannot be removed but the total burden can be reduced by pushing every modifiable factor as low as possible.\n\nHis testosterone is 19.7 nmol/L, within the ideal range of 18 to 28.7 for a man of 51, which is a strong result. Free testosterone is 0.292 nmol/L, within the laboratory range. His SHBG (sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation) is 56.2, within range but towards the upper end, and his free androgen index is 35.05, within range. His bioavailable testosterone is 7 nmol/L, within the ideal range. Oestradiol is 90, cortisol is 236 (within the morning range), LH and FSH are within range, prolactin is within range, and DHEA-S is 2.2 umol/L, within range. His progesterone is 0.69, below the laboratory range of 0.89 to 3.88. In men, progesterone is produced in small amounts and plays a minor role in mood and sleep. At this level, it is not a clinical concern and is not uncommon in men; it does not require action.\n\nHis prostate markers are reassuring. PSA is 0.85, well below the 3.5 threshold for his age, and the free PSA ratio is 0.259 (25.9%), above the reassuring threshold of 0.19. With a family history of cancer, this is good news. His tumour markers CA19-9 and CEA are both within range, which is reassuring given the family history of bowel cancer. These markers are not screening tools and cannot rule out cancer on their own, but normal levels in the absence of symptoms are a positive finding.\n\nHis immune system markers are all within range. IgG, IgM, IgA, and IgE are within their respective ranges, with IgE at 3.24, very low, suggesting no allergic activation. Rheumatoid factor is below 4, negative, which is relevant given his joint pain. Tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of any symptoms.\n\nHis lipase is 61, marginally above the upper limit of 60. Lipase is an enzyme produced by the pancreas that helps digest fats. A result one unit above the upper limit is not clinically significant and does not suggest pancreatitis or pancreatic disease, especially with a normal amylase of 60. GLP-1 medications like Mounjaro can occasionally cause mild elevations in pancreatic enzymes without any underlying pathology, and this is the most likely explanation. It does not require action but is worth the GP noting.\n\nHis Total Antioxidant Activity is 1.86, above the upper limit of 1.77. This measures the overall antioxidant capacity of the blood and is elevated most commonly by supplementation. His multivitamin is the likely driver, and this is not a concern.\n\nHis PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase, is 43 years against a calendar age of 51, making him eight years biologically younger than his chronological age. This is an excellent result and reflects the combined impact of his weight loss, good metabolic health, low inflammation and strong organ function.\n\nHis HOMA-B, which estimates how hard the pancreas is working to produce insulin, is 71.5, below the reference range of 80 to 200. This does not indicate pancreatic failure. His glucose and HbA1c are both healthy, which means the pancreas is simply not being asked to produce much insulin, exactly what Mounjaro is designed to achieve. The GLP-1 medication reduces the demand on the pancreas by improving how efficiently insulin works and by slowing glucose absorption. A low HOMA-B in this context is a sign that the medication and weight loss are working, not a sign that the pancreas is struggling.\n\nRegarding his joint pain and stiffness, the bloods provide useful exclusions. Rheumatoid factor is negative, ruling out the most common autoimmune cause of inflammatory joint disease. His CRP and ESR are both low, making active inflammatory arthritis unlikely. Uric acid is within range, making gout unlikely. Thyroid antibodies are positive, and Hashimoto's thyroiditis is associated with joint stiffness in some people, so this may be contributing. The most likely explanation for longstanding joint pain and stiffness in a 51-year-old man who has carried significant extra weight for years is mechanical: the joints have borne the load, and even with the weight now coming down, the cartilage changes are already established. Continued weight loss, maintaining his resistance training, and ensuring adequate protein to support joint and muscle health are the most effective levers. If the stiffness does not improve as weight continues to fall, a GP review and imaging of the worst-affected joints would be the next step.\n\nHis urinalysis is entirely clear: no protein, no glucose, no blood, no white cells, no nitrites, no bacterial growth, and no casts. This is a clean result.","is_retest":false,"lifestyle":"Add a palm-sized portion of protein to every meal, particularly breakfast and lunch. Anchor: protein goes on the plate before anything else. Why: at a diet volume of 4 out of 10 and on Mounjaro, which suppresses appetite, you are at risk of losing muscle alongside fat. Protein at 1.4 to 1.6 g per kg, which is 126 to 144 g per day, protects lean mass during weight loss and supports joint health.\nIncrease vegetables and fruit from 2 to 3 portions to 5 or more per day, adding one portion at each main meal. Start with a handful of spinach or rocket on whatever you are already eating. Why: more folate from green vegetables will help correct the below-optimal folate of 7, and the fibre supports the gut changes Mounjaro causes.\nEat two portions of oily fish per week (salmon, mackerel, sardines). Anchor: replace one of your weekly takeaway meals with a fish-based dish. Why: omega-3 lowers triglycerides (yours are already good), reduces inflammation, and provides the best dietary route to lowering modifiable cardiovascular risk alongside the Lp(a) you cannot change.\nAdd one more resistance training session per week, moving from one to two. Anchor: pair it with one of your existing cardio days so the habit is already built. Why: resistance training preserves muscle during GLP-1-assisted weight loss, supports joint stability which helps your joint pain, and improves insulin sensitivity. Moderate intensity is right for now.\nTake a 10 to 15 minute walk after your largest meal each day. Anchor: plate in the sink, shoes on. Why: a post-meal walk blunts the glucose and insulin response to that meal, supporting the excellent metabolic picture Mounjaro has helped create.\nGet outside within 30 minutes of waking, even if just to walk to the end of the road and back. Why: morning light resets the circadian clock and helps shift the slow-to-get-going mornings and afternoon crash you describe. It also supports Vitamin D maintenance through the summer months.\nSet a caffeine cut-off at 1pm if you drink coffee or tea. Why: caffeine after early afternoon is the most common hidden driver of the afternoon crash and slow-wake pattern you describe. It does not stop you falling asleep but it fragments deep sleep, which is when the body recovers.\nCalorie target for continued fat loss: approximately 1,800 to 2,100 kcal per day (maintenance is roughly 2,400 kcal based on moderate activity; a deficit of 300 to 500 kcal per day will support steady fat loss of 0.3 to 0.5 kg per week). Protein floor: 126 to 144 g per day. A realistic next weight target is 82 to 85 kg, which would bring further metabolic benefit without being an aggressive goal.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","units":"/100","result":"59","padding":"1","one_sided":"0.5","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","range_type":"no upper","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 79.2; held to 59 by a system rated \"See your GP\". Weakest systems: thyroid 33%, hematology 65%, digestive 68%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Reticulocytes (Absolute), Thyroid Peroxidase Antibodies.","high_causes":"","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","units":"years","result":"43","padding":"1","one_sided":"0.5","low_causes":"Low inflammation, healthy blood counts","range_type":"no lower","description":"PhenoAge is a biological age estimate calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge of 43 against a calendar age of 51 means he is ageing eight years slower than average, which is an excellent result. The drivers of this favourable gap are his low CRP (0.7), healthy glucose (5.1), good albumin (44), normal kidney function and well-balanced blood count. Continued weight loss, improved nutrition and consistent training should maintain or widen this gap.","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","lower_normal":"","upper_normal":"56","lower_optimal":"","upper_optimal":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3839","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4554"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","units":"/100","result":"55","padding":"1","one_sided":"0.5","low_causes":"Excellent lipid profile, low inflammation, low Lp(a)","range_type":"no lower","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built, not the ten-year chance of an event. His score of 55 is above the flagged threshold of 40, driven almost entirely by the Lp(a) above 212.5 nmol/L. His modifiable inputs (triglycerides, hsCRP, HbA1c) are in excellent shape, and the ApoB and LDL are only marginally above target. The strategy is to push every modifiable factor as low as possible to offset the inherited Lp(a) burden, and to discuss with the GP whether pharmacological intervention (statin therapy) would further reduce overall risk.","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6875","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","units":"mmol/L","result":"5.1","padding":"1","one_sided":"0.5","low_causes":"Fasting, excessive insulin, alcohol, adrenal insufficiency","range_type":"normal","description":"Blood glucose measures the amount of sugar circulating in the bloodstream at the moment the sample is taken. His glucose of 5.1 sits comfortably within the ideal range of 4.0 to 5.4, which is excellent news. Combined with his healthy insulin and HbA1c, this shows no sign of insulin resistance or impaired glucose regulation.","high_causes":"Diabetes, pre-diabetes, stress, infection, corticosteroid use","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","units":"%","result":"5.6","padding":"1","one_sided":"0.5","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","range_type":"no lower","description":"HbA1c percentage is an alternative expression of the same glycated haemoglobin measurement. His 5.6% is below the pre-diabetes threshold of 6.0% and confirms well-controlled blood sugar over the past two to three months.","high_causes":"Diabetes, pre-diabetes, iron deficiency, splenectomy","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4750"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","units":"mmol/mol","result":"38","padding":"1","one_sided":"0.5","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","range_type":"no lower","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has bonded with glucose over the past two to three months, giving a longer-term view of blood sugar control than a single fasting glucose reading. His result of 38 mmol/mol is comfortably below the pre-diabetes threshold of 42 and within the normal range. While it sits just above the tighter ideal of below 36, it is not a concern and reflects good metabolic control in the context of significant recent weight loss.","high_causes":"Diabetes, pre-diabetes, iron deficiency, splenectomy","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4524","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","units":"mIU/L","result":"5.72","padding":"1","one_sided":"0.5","low_causes":"Type 1 diabetes, pancreatic insufficiency, low carbohydrate intake, GLP-1 medication","range_type":"normal","description":"Fasting insulin measures the amount of insulin the pancreas is producing in a resting state. Insulin is the hormone that moves glucose from the blood into cells. When the body becomes resistant to insulin, the pancreas compensates by producing more. His insulin of 5.72 sits within the ideal range of 2 to 8, which is an excellent result and shows his cells are responding well to insulin. Combined with the Mounjaro and his weight loss, this confirms strong insulin sensitivity.","high_causes":"Insulin resistance, obesity, metabolic syndrome, PCOS, insulinoma","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3800","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","units":"ug/L","result":"1.24","padding":"1","one_sided":"0.5","low_causes":"Type 1 diabetes, low carbohydrate intake, GLP-1 medication, fasting","range_type":"normal","description":"C-Peptide is released by the pancreas in equal amounts to insulin, making it a reliable marker of how much insulin the body is actually producing (unlike an insulin measurement, which can be affected by external insulin injections). His C-Peptide of 1.24 ug/L is within the laboratory range but towards the lower end, reflecting low insulin demand rather than pancreatic weakness. With healthy glucose and HbA1c, this is consistent with good insulin sensitivity enhanced by Mounjaro.","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney disease","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.5","upper_optimal":"3.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3475","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3737","upper_optimal_position":"0.5758"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","units":"","result":"1.3","padding":"1","one_sided":"0.5","low_causes":"High insulin sensitivity, low carbohydrate diet, fasting, GLP-1 medication","range_type":"normal","description":"HOMA-IR is a calculation that combines glucose and insulin to estimate how sensitive the body's cells are to insulin. A score below 1.0 indicates excellent insulin sensitivity; below 1.5 is healthy; above 1.9 suggests early insulin resistance. His HOMA-IR of 1.3 reflects healthy insulin sensitivity. Both of its inputs, glucose at 5.1 and insulin at 5.72, are within their respective ideal ranges, and the result confirms the metabolic picture: the combination of weight loss and Mounjaro has brought his insulin sensitivity into a strong position.","high_causes":"Insulin resistance, obesity, metabolic syndrome, PCOS, high carbohydrate diet","lower_normal":"0.5","upper_normal": function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
