mperature or storage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"318","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5308","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6154","units":"x10^9/L","description":"Platelets are small blood cells that help form clots to stop bleeding. At 318, Suzanne's platelet count is within the optimal range, indicating healthy bone marrow production and no increased risk of bleeding or clotting.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, medications, alcohol","high_causes":"Iron deficiency, infection, inflammation, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"9.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"Mean platelet volume measures the average size of platelets. Larger platelets tend to be younger and more active. At 9.5, Suzanne's MPV is within range.","low_causes":"Bone marrow disorders, chronic inflammation","high_causes":"Increased platelet production, platelet destruction, immune thrombocytopenia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Count","group":"HEMATOLOGY","result":"5.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's front line. The total count reflects overall immune activity. At 5.58, Suzanne's white cell count is within the optimal range, indicating a normally functioning immune system at the time of the blood draw, despite her known IgM deficiency.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, medications","high_causes":"Infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.66","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4440","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cell and are the first responders to bacterial infections. At 3.66, Suzanne's neutrophil count is within the optimal range.","low_causes":"Viral infections, medications, autoimmune conditions, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.44","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4067","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes include T cells, B cells, and natural killer cells, which are responsible for targeted immune responses and producing antibodies. At 1.44, Suzanne's lymphocytes are within the laboratory range but just below the optimal floor of 1.5. This could contribute to her susceptibility to infections alongside her low IgM.","low_causes":"Viral infections, autoimmune conditions, corticosteroids, stress, nutritional deficiency","high_causes":"Viral infections, chronic inflammation, lymphocytic leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4000","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells. At 0.36, Suzanne's monocyte count is within the optimal range.","low_causes":"Bone marrow disorders, certain infections","high_causes":"Chronic infection, autoimmune disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5903","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasites and in allergic responses. At 0.09, Suzanne's eosinophil count is low-normal, consistent with no active allergic or parasitic process.","low_causes":"Corticosteroid use, stress, acute infection","high_causes":"Allergies, asthma, parasitic infections, eczema, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory responses. At 0.03, Suzanne's basophil count is normal.","low_causes":"Normal finding, hyperthyroidism, acute allergic reaction","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3917","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage reflects the rate of red blood cell production. At 0.85%, Suzanne's reticulocyte percentage is within the laboratory range but at the lower end, consistent with the B12 deficiency slowing red cell production.","low_causes":"B12 deficiency, folate deficiency, iron deficiency, bone marrow disorders, chronic disease","high_causes":"Blood loss, haemolytic anaemia, recovery from anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"37.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2505","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells being produced. At 37.57, this is below the lower limit of 50, confirming that the bone marrow is not producing new red blood cells at the expected rate. In the context of B12 deficiency, this is a recognised finding. B12 is essential for DNA synthesis in rapidly dividing cells, and red blood cell precursors in the bone marrow are among the most actively dividing cells in the body. Correcting the B12 deficiency should allow reticulocyte production to recover.","low_causes":"B12 deficiency, folate deficiency, iron deficiency, bone marrow suppression, chronic disease","high_causes":"Recovery from blood loss, haemolytic anaemia, response to anaemia treatment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"NLR","group":"HEMATOLOGY","result":"2.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5900","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is a simple but useful marker of systemic inflammation and immune balance. A higher ratio can indicate inflammatory stress. At 2.54, Suzanne's NLR is within the laboratory range of 1 to 3 but above the optimal ceiling of 2.0. This is influenced by her lymphocytes sitting at the lower end, and in the context of her recent surgery and known immune history, this is expected and not concerning in isolation.","low_causes":"Strong lymphocyte response, viral infection","high_causes":"Bacterial infection, chronic inflammation, physiological stress, post-surgical state","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"26.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6090","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"27","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6044","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. It fluctuates throughout the day and with meals. At 26.6, Suzanne's serum iron is in the upper portion of the optimal range, indicating she has adequate circulating iron available for use despite her lower ferritin stores.","low_causes":"Iron deficiency, chronic disease, poor absorption, heavy menstruation","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.48","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3128","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6026","units":"g/L","description":"Transferrin is the protein that transports iron through the bloodstream. The liver produces it, and levels typically rise when iron stores are low (the body makes more to scavenge available iron) and fall when stores are adequate. At 2.48, Suzanne's transferrin is marginally below the lower limit of 2.5, a very small deviation of 0.02. Given that her serum iron and transferrin saturation are both healthy, this is not clinically significant and likely reflects normal biological variation.","low_causes":"Chronic inflammation, liver disease, iron overload, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"42.71","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5584","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3523","upper_optimal_position":"0.5252","units":"%","description":"Transferrin saturation measures the percentage of transferrin molecules that are actually carrying iron. At 42.71%, Suzanne's saturation is within the laboratory range but above the optimal ceiling of 40%. This reflects the slightly low transferrin with adequate serum iron, meaning a higher proportion of the available transferrin is loaded with iron. It does not suggest iron overload given that her ferritin is actually on the low side.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"56.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4620","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3364","upper_optimal_position":"0.6013","units":"umol/l","description":"TIBC measures the total capacity of the blood to bind and transport iron. It rises in iron deficiency and falls in iron overload. At 56.6, Suzanne's TIBC is within the optimal range, confirming a balanced iron transport system.","low_causes":"Iron overload, chronic disease, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3524","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4397","upper_optimal_position":"0.5690","units":"ng/ml","description":"Ferritin is a protein that stores iron in the body's cells, and the blood level reflects total iron reserves. At 26, Suzanne's ferritin is within the laboratory range of 10 to 291 but below the optimal floor of 40 for women. This means she has limited iron reserves, which is typical on a long-term vegan diet. With the additional iron demands of fracture healing and tissue repair, building these stores is important. Low ferritin is also associated with hair thinning and fatigue, both of which she is experiencing.","low_causes":"Low iron intake (vegan diet), poor absorption, chronic blood loss, heavy menstruation","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.58","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4146","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4612","units":"mIU/l","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how hard to work. A high TSH means the thyroid is underperforming and the pituitary is shouting louder; a low TSH suggests the thyroid is producing too much hormone. At 1.58, Suzanne's TSH is right in the optimal sweet spot of 1.0 to 2.5, indicating perfectly balanced thyroid regulation.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free T4","group":"THYROID","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4670","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3893","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. At 16, Suzanne's FT4 is within the optimal range of 14 to 20, confirming adequate thyroid hormone production.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the active thyroid hormone that cells actually use for metabolism, energy production, and temperature regulation. The body converts T4 into T3. At 5.1, Suzanne's FT3 is within the optimal range of 4.5 to 6.5, confirming her thyroid is not only producing adequate hormone but also converting it effectively into the active form.","low_causes":"Hypothyroidism, chronic illness, poor T4 to T3 conversion, nutritional deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"TPO Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies are produced when the immune system attacks the thyroid gland. Elevated levels are the hallmark of Hashimoto's thyroiditis, the most common cause of hypothyroidism. At less than 6.6, well below the threshold of 13.8, Suzanne's result rules out thyroid autoimmunity.","low_causes":"No thyroid autoimmunity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, elevated levels suggest thyroid autoimmunity. At less than 1.3, well below the 4.4 threshold, this result is negative and consistent with more than 80% of the population who have undetectable levels.","low_causes":"No thyroid autoimmunity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3067","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6333","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, and mood regulation. At 46, Suzanne's vitamin D is in the insufficient range, below the sufficient threshold of 50 and well below the optimal range of 75 to 120. On a vegan diet with limited sun exposure, vitamin D deficiency is common because few plant foods contain it. Given her active fracture healing, her history of recurrent infections, and her low IgM, optimising vitamin D is particularly important. Vitamin D directly activates antimicrobial peptides in immune cells and supports the innate immune response that compensates when IgM is deficient.","low_causes":"Limited sun exposure, dark skin, vegan diet, malabsorption, obesity, aging","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"142","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2341","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5556","upper_optimal_position":"0.6667","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell formation, and DNA synthesis. It is found almost exclusively in animal products. At 142, Suzanne's B12 is significantly below the lower limit of 193 and far below the optimal range of 500 to 900. This is the most clinically significant finding in her report. On a long-term vegan diet, B12 stores deplete gradually over years because the body stores several years' worth in the liver, meaning deficiency can develop silently. At this level, nerve function and red cell production are likely being affected, which is consistent with her symptoms of brain fog and hair thinning. Her low absolute reticulocytes support this interpretation.","low_causes":"Vegan or vegetarian diet without supplementation, pernicious anaemia, malabsorption, metformin use, age-related decline in absorption","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, or vitamin B9, works alongside B12 in DNA synthesis and red blood cell formation. At 13, Suzanne's folate is well within the optimal range above 8, which is expected on a plant-rich vegan diet that includes dark leafy greens, legumes, and other folate-rich foods. This healthy folate level means her B12 deficiency is the sole nutritional driver of her low reticulocytes, not a combined deficiency.","low_causes":"Poor diet, alcohol use, malabsorption, pregnancy, certain medications","high_causes":"Supplementation, high intake of folate-rich foods","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4627","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5733","units":"pmol/L","description":"Parathyroid hormone regulates calcium and phosphate balance in the blood. When calcium drops, PTH rises to pull calcium from bones and increase absorption. At 2.9, Suzanne's PTH is within the optimal range, working in harmony with her normal calcium levels. This is reassuring for her bone health and fracture recovery.","low_causes":"Hyperparathyroidism surgery, autoimmune damage, magnesium deficiency","high_causes":"Vitamin D deficiency, kidney disease, low calcium, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"379","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4934","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5822","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural daily rhythm, peaking in the morning and declining through the day. At 379, measured in the morning window, Suzanne's cortisol is within the optimal range, indicating a healthy stress response and adrenal function.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary dysfunction","high_causes":"Chronic stress, Cushing's syndrome, steroid medication, shift work, illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"0","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"300","lower_normal_position":"0","upper_normal_position":"0.6667","lower_optimal_position":"0.1890","upper_optimal_position":"0.5671","units":"pmol/L","description":"Oestradiol is the primary form of oestrogen and is critical for bone health, cardiovascular protection, brain function, and mood. In post-menopausal women not on HRT, levels are typically below 118. At 140, Suzanne's oestradiol is above the post-menopausal range, which indicates that her HRT is successfully replacing oestrogen to pre-menopausal levels. This is the intended therapeutic effect and supports her bone healing, cardiovascular health, and cognitive function.","low_causes":"Meno per_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/ml","description":"Follicle stimulating hormone is produced by the pituitary gland to stimulate the ovaries. In menopause, FSH rises significantly because the ovaries are no longer producing eggs or adequate oestrogen. At 75.22, well above the 40 threshold that confirms post-menopausal status, this is consistent with her age and hormonal picture. Despite HRT replacing oestrogen, FSH remains elevated because HRT does not restore ovarian function.","low_causes":"Pituitary dysfunction, hormonal contraception, pregnancy","high_causes":"Menopause, ovarian failure, premature ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4444","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women supports muscle mass, bone density, energy, and libido. At 1.2, Suzanne's testosterone is within the female reference range and within the optimal band. However, with her SHBG at 76.6 and a calculated free testosterone of 0.012, a significant proportion of this testosterone is bound and unavailable to tissues, which could contribute to difficulty building muscle.","low_causes":"Menopause, adrenal insufficiency, pituitary dysfunction, oral HRT","high_causes":"PCOS, adrenal hyperplasia, androgen-secreting tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"1.57","within_normal":"TRUE","within_optimal":"TRUE","result_posi l_position":"0.6667","lower_optimal_position":"0.3449","upper_optimal_position":"0.4994","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. Levels naturally decline with age. At 0.8 umol/L (approximately 295 ug/dL), Suzanne's DHEA-S is within the laboratory range but below the optimal floor of 1.5 umol/L. This age-related decline is expected at 62 and contributes to the lower free testosterone available for muscle building.","low_causes":"Aging, adrenal insufficiency, chronic illness","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"164","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4184","lower_normal":"38","upper_normal":"430","lower_optimal":"50","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3638","upper_optimal_position":"0.6301","units":"uIU/ml","description":"Prolactin is a pituitary hormone best known for its role in milk production. In non-pregnant, non-lactating women, elevated levels can indicate pituitary issues or medication effects. At 164, within the post-menopausal range of 38 to 430, Suzanne's prolactin is normal.","low_causes":"Dopamine agonist medication, pituitary dysfunction","high_causes":"Pituitary adenoma, medications, hypothyroidism, stress, chest wall irritation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.012","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4000","lower_normal":"0.005","upper_normal":"0.035","lower_optimal":"0.015","upper_optimal":"0.030","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6111","units":"nmol/l","description":"Free testosterone is the small fraction of total testosterone that is not bound to proteins and is therefore available for use by tissues. At 0.012, Suzanne's free testosterone is within the laboratory range but below the optimal floor of 0.015. This is the testosterone actually available for muscle building, bone maintenance, and energy. Her relatively high SHBG is the main reason more of her total testosterone is being bound rather than remaining free.","low_causes":"High SHBG, menopause, low total testosterone, oral oestrogen","high_causes":"Low SHBG, PCOS, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4086","lower_normal":"25","upper_normal":"200","lower_optimal":"25","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"U/L","description":"Creatine kinase is an enzyme found in muscles, including the heart. It rises when muscle tissue is damaged, whether from exercise, injury, or disease. At 48, Suzanne's CK is well within range, suggesting her muscles are recovering well from training and her post-surgical recovery is not causing excessive muscle breakdown.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, heart attack, muscular dystrophy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"9.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4702","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant antibody class and provides long-term immunity against infections. It is the antibody that 'remembers' previous infections and vaccinations. At 9.4, Suzanne's IgG is within range, indicating this arm of her immune memory is functioning normally. This is particularly reassuring given her low IgM, as it means her adaptive immune system retains the ability to mount targeted responses to previously encountered pathogens.","low_causes":"Primary immunodeficiency, medications, protein loss","high_causes":"Chronic infection, autoimmune disease, multiple myeloma, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"0.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/l","description":"IgM is the first antibody produced when the immune system encounters a new infection. It provides rapid, short-term defence while the immune system develops more targeted IgG antibodies. At 0.4, below the lower limit of 0.5, Suzanne's IgM remains low, consistent with her known history of selective IgM deficiency. This leaves her more vulnerable to new infections, particularly bacterial respiratory infections, which aligns with her history of frequent severe chest infections. Her immunology team is already involved in monitoring this.","low_causes":"Selective IgM deficiency (primary), secondary to medications or other immune conditions","high_causes":"Acute infection, Waldenstrom's macroglobulinaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"1.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4516","lower_normal":"0.4","upper_normal":"3.5","lower_optimal function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }

function pickSystem(sysId){

  document.querySelectorAll('.grp').forEach(g=>{

function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{

  document.querySelectorAll('.grp').forEach(g=>{

    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
