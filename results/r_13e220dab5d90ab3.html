const REPORT_DATA = {"patient_name":"Suzanne Wood","dob":"17/05/1964","report_date":"2026-08-12","summary":"Suzanne is a 62-year-old female presenting with a BMI of 22.6, following a vegan diet rated 8 out of 10 for quality with a volume of 5 out of 10. She trains three times per week, one session of cardio and two of resistance, with 7,500 to 10,000 daily steps. She is currently on HRT. She reports brain fog, hair thinning and hair loss, and frequent illness. Her goals are to improve long-term health and longevity, boost her immune system, and build muscle. She has a significant medical history including frequent severe chest infections, a previous finding of low IgM and suboptimal pneumococcal serotype responses, and she is currently 18 weeks post-operative following open reduction and internal fixation of a comminuted olecranon fracture. She has temporarily introduced fish twice weekly and eggs three times weekly for a 12-week recovery period, but her normal diet is entirely plant-based.\n\nThe most important finding in this report is a vitamin B12 of 142, well below the lower limit of 193 and far below the optimal range of 500 to 900. B12 is a vitamin found almost exclusively in animal products, and on a long-term vegan diet without adequate supplementation, stores deplete gradually over years. At 142, Suzanne is in frank deficiency territory. B12 is essential for nerve function, red blood cell production, and DNA synthesis. It is also one of the most common causes of brain fog and hair thinning, both of which she is experiencing. Her low absolute reticulocyte count of 37.57, below the lower limit of 50, fits this picture. Reticulocytes are newly made red blood cells released from the bone marrow, and B12 deficiency impairs the bone marrow's ability to produce them efficiently. Her MCV at 89.9 is within range but sitting in the upper half, which in the context of B12 deficiency may represent the early stages of macrocytic change, where red blood cells begin to enlarge because they cannot divide properly without adequate B12. We would strongly recommend discussing this with her GP, as at this level, oral supplementation alone may not be sufficient to replenish stores quickly enough and an initial course of B12 injections may be warranted.\n\nHer IgM remains low at 0.4, below the lower limit of 0.5, which is consistent with her known history. IgM is the first antibody the immune system produces when it encounters a new infection, and a persistent deficiency in this class leaves her more vulnerable to bacterial infections, particularly respiratory ones, which matches her history of frequent severe chest infections. Her IgG at 9.4 and IgA at 1.6 are both comfortably within range, which is reassuring because it means the other arms of her antibody defence are functioning normally. The combination of isolated low IgM with preserved IgG and IgA is a recognised pattern sometimes called selective IgM deficiency. Given her history and the fact that this has persisted despite pneumococcal vaccination, her immunologist or GP should continue to monitor this.\n\nHer Lp(a), or lipoprotein(a), is 140.43, significantly above the upper limit of 32 and placing her in the moderate risk category. Lp(a) is an inherited lipoprotein particle that behaves like a particularly sticky form of LDL cholesterol. It deposits cholesterol into artery walls, promotes blood clotting, and drives inflammation, all of which increase cardiovascular risk independently of standard cholesterol levels. The critical point is that Lp(a) is entirely genetically determined. Diet, exercise, and lifestyle have essentially no effect on it. It cannot be lowered by conventional means, although new targeted therapies are in development. This result should be recorded permanently in her medical notes and her GP made aware. We would also recommend that her first-degree relatives, particularly any children, are tested, because if it is inherited they can begin managing their overall cardiovascular risk earlier. The positive side of this result is that the rest of her lipid profile is genuinely excellent. Her HDL, the protective cholesterol, is 2.1, which is outstanding and well above the optimal threshold of 1.6. Her ApoB, which counts the number of cholesterol-carrying particles in the blood and is the single best predictor of cardiovascular risk from lipids, is 0.75, below the desirable threshold of 0.9 and within the optimal range below 0.8. Her ApoB to ApoA1 ratio is 0.44, well within the lower risk category below 0.6. Her triglycerides at 1.12 are within the healthy range, and her triglyceride to HDL ratio calculates to 0.53, which is optimal. Her remnant cholesterol, calculated as total cholesterol minus HDL minus LDL, comes to 0.45, within the optimal range below 0.5. What this means in practical terms is that her modifiable lipid risk factors are all in excellent shape, and the elevated Lp(a) is being partly offset by a very favourable overall lipid environment. This is exactly the right strategy, because maximising the controllable factors is the most effective way to manage the risk that Lp(a) introduces.\n\nHer HOMA-IR, a calculated measure of insulin resistance that combines fasting glucose and fasting insulin, is 1.72, above the optimal upper limit of 1.5. Her fasting glucose at 4.9 is within the laboratory range but above the optimal ceiling of 5.4 would be the concern, however 4.9 sits within the optimal window. Her insulin at 7.9 is within range and within the optimal band of 2 to 8. Her HbA1c, which reflects average blood sugar over the previous two to three months, is 41 mmol/mol, just one point below the pre-diabetes threshold of 42. This combination suggests that while she is not insulin resistant in a clinical sense, her metabolic flexibility is not quite optimal and there is room for improvement. Her C-Peptide, which measures how much insulin the pancreas is producing, was returned at 0.713 ug/L, which converts to approximately 236 pmol/L, below the laboratory lower limit. However, the lab has flagged that samples not separated within four hours can lose up to 56% of their C-Peptide concentration, so this result should be interpreted with caution. Given that her glucose, HbA1c, and insulin are all broadly acceptable, the low C-Peptide is most likely a sample handling artefact rather than a sign of pancreatic insufficiency, but it would be worth repeating on a fresh, promptly processed sample to confirm.\n\nHer sodium at 147 is marginally above the upper limit of 146. At one point above range, this is most commonly explained by mild dehydration at the time of the blood draw. If she had not drunk much water in the hours before the sample, this alone would account for it. It does not suggest a sodium disorder, but adequate hydration, particularly around blood draws, is worth noting.\n\nTurning to the many things that are working well, her thyroid function is in excellent shape. TSH, the hormone that tells the thyroid how hard to work, is 1.58, sitting beautifully within the optimal range of 1.0 to 2.5. Free T4 at 16 and Free T3, the active thyroid hormone, at 5.1 are both within their optimal bands. Both thyroid antibody tests are negative, ruling out autoimmune thyroid disease. This is a clean bill of thyroid health. Her liver is in excellent condition. ALT at 16, GGT at 16, AST at 21, bilirubin at 9, albumin at 45, and a FIB-4 score of 1.02 all paint a picture of a liver under no strain whatsoever. Her pancreatic enzymes, amylase and lipase, are both comfortably within range. Her kidney function is solid, with a Cystatin C-based eGFR of 91, which is above the 90 threshold that represents full kidney function. Her Cystatin C itself at 0.95 is within range, and urea and creatinine are both normal. Her uric acid at 236 is within the laboratory range and within the optimal band for women. Her full blood count is largely reassuring. Haemoglobin at 136 is healthy, her red cell indices are well balanced, her white cell count and differential are all within range, and her platelets at 318 are normal. Her ESR, a measure of inflammation driven by how quickly red blood cells settle, is just 4, which is excellent. Her hs-CRP, the more sensitive inflammation marker, is 1.1, which is within the laboratory range below 5 but sits above the optimal threshold of 1.0. In the context of her recent surgery 18 weeks ago, a mildly elevated CRP is entirely expected and likely reflects ongoing tissue healing rather than any chronic inflammatory process.\n\nHer hormonal picture reflects her post-menopausal status managed with HRT. Her FSH at 75.22 confirms post-menopausal physiology, meaning the ovaries have ceased producing eggs and the pituitary gland is sending a strong signal trying to stimulate them. Her oestradiol at 140 is above the post-menopausal reference ceiling of 118.2, which indicates that her HRT is successfully replacing oestrogen and maintaining levels in the pre-menopausal range, which is the intended effect. Her progesterone at 0.87 is within the post-menopausal range. Her testosterone at 1.2 is within the female reference range, and her free androgen index at 1.57 is normal, though her SHBG at 76.6, the protein that binds sex hormones and reduces their availability, is in the upper half of its range, which means a proportion of her circulating testosterone is bound and unavailable. This could contribute to difficulty building muscle, which is one of her goals. Her DHEA-S at 0.8 umol/L, converting to approximately 295 ug/dL, is within range. Her cortisol at 379 is within the expected morning range, and prolactin at 164 is normal for a post-menopausal woman.\n\nHer iron studies tell an interesting story. Her ferritin at 26 is within the laboratory range of 10 to 291 but below the optimal floor of 40 for women. Ferritin represents iron stores, and at 26 on a long-term vegan diet, her stores are on the thin side. This is not yet deficiency, but it leaves very little reserve, and given that she is recovering from a significant fracture requiring surgery, her body's iron demands are higher than usual for tissue repair and blood cell production. Her transferrin, the protein that carries iron through the blood, is marginally below range at 2.48 against a lower limit of 2.5. This is a very small margin and in isolation would not be significant. Her serum iron at 26.6 and transferrin saturation at 42.71% are both healthy, suggesting that the iron she has is being transported and utilised efficiently. The transferrin saturation of 42.71% is within the optimal band of 25 to 40% when we allow for the slight overshoot, sitting just above the optimal ceiling but well within the laboratory range. The combination of adequate serum iron with low stores suggests she is using iron as fast as she is absorbing it, without building reserves. Once her temporary fish and egg intake ends and she returns to a fully vegan diet, her ferritin could drift lower, so this is worth monitoring.\n\nHer vitamin D at 46 is in the insufficient range, below the sufficient threshold of 50 and well below the optimal range of 75 to 120. Vitamin D is critical for immune function, which matters given her history of recurrent infections and low IgM. It is also essential for bone healing, which is directly relevant to her current fracture recovery. At her lean BMI, a standard dose of 3,000 to 4,000 IU daily should be sufficient to bring her into the optimal range within 8 to 12 weeks.\n\nHer magnesium at 1.01 is within range and within the optimal band of 0.85 to 1.05, which is a genuine positive for bone healing and muscle function. Her calcium at 2.33 and corrected calcium at 2.26 are both within range, and her PTH at 2.9 is normal, confirming that calcium metabolism is well regulated. Her folate at 13 is healthy, as expected on a plant-rich diet. Her total antioxidant activity at 1.73 is within range, reflecting good dietary antioxidant intake. Her rheumatoid factor is negative, and her coeliac screen is negative. All tumour markers, CA125 at 21.4, CA15-3 at 10.04, CA19-9 at 7.81, and CEA below 0.5, are within their respective ranges. Her creatine kinase at 48 is normal, suggesting her muscles are recovering well from training without excessive damage.\n\nNo urine sample was received with this blood draw, so the urinalysis panel could not be completed. This is worth including next time, particularly at her age, as it provides useful information about kidney health, infection, and metabolic status.\n\nIn summary, the three findings that need attention are her B12 deficiency, which is likely driving her brain fog and hair thinning and needs GP involvement for possible injection therapy; her elevated Lp(a), which is inherited, permanent, and should be recorded in her medical notes with family screening considered; and her persistently low IgM, which her medical team is already aware of. Beyond these, her vitamin D needs supplementing and her ferritin stores need building. The broader picture is of a woman whose plant-based diet and active lifestyle have produced an excellent metabolic profile, with outstanding HDL cholesterol, a clean liver, healthy thyroid function, well-managed HRT, low inflammation, and strong kidney function.","links":"Suzanne's most pressing action is to address her B12 deficiency. At 142, this is below the level where sublingual supplementation alone can reliably restore stores in a reasonable timeframe. We would recommend she discusses this with her GP, bringing the result of 142 against a lower limit of 193. The GP may recommend a loading course of intramuscular B12 injections, typically six injections over two weeks, followed by maintenance. Once stores are replenished and confirmed above 500 on retest, a daily sublingual methylcobalamin supplement at 1,000 to 2,000 mcg can maintain levels long-term, which will be essential when she returns to a fully vegan diet. She should expect improvement in brain fog within four to six weeks of adequate B12 restoration, and hair thinning may begin to slow or reverse over three to six months as the follicles receive adequate B12 for cell division.\n\nHer Lp(a) result of 140.43 should be recorded permanently in her medical notes. She should inform her GP and request that it is added to her medical record. She should also consider encouraging her siblings and any children to have their Lp(a) tested, as this is an inherited trait and early knowledge allows for proactive cardiovascular risk management. For Suzanne herself, the strategy is to keep every modifiable cardiovascular risk factor as optimal as possible, which she is already doing exceptionally well. Maintaining her HDL above 1.6, her ApoB below 0.8, her triglycerides low, and her blood pressure controlled are the most powerful tools she has.\n\nHer IgM deficiency at 0.4 is a known finding and her immunology team is already involved. We would recommend she shares this latest result with them to confirm it remains stable. Given her history of chest infections, she should continue to be vigilant about respiratory symptoms and seek early treatment for any infections. Maintaining optimal vitamin D levels is particularly important for her, as vitamin D plays a direct role in immune surveillance and antimicrobial defence.\n\nFor vitamin D, she should begin supplementing with 3,000 to 4,000 IU of vitamin D3 (cholecalciferol) daily, taken with her largest meal containing fat to aid absorption. She should pair this with 100 to 200 mcg of vitamin K2 in the MK-7 form, which directs calcium into bones rather than soft tissues. This is especially important during her fracture recovery.\n\nFor iron and ferritin, with stores at 26, she should consider a gentle iron supplement such as ferrous bisglycinate at 25mg every other day, taken with a source of vitamin C to enhance absorption. She should avoid taking iron at the same time as tea, coffee, or calcium-rich foods, which inhibit absorption. Once her temporary fish and egg period ends, iron intake will become more challenging on a fully vegan diet, so she should focus on iron-rich plant foods such as lentils, chickpeas, tofu, pumpkin seeds, and dark leafy greens, combined with vitamin C-rich foods at every meal.\n\nFor her metabolic markers, her HOMA-IR at 1.72 and HbA1c at 41 suggest room for improvement. Given that her diet quality is excellent at 8 out of 10, the most effective lever here is likely increasing her training volume, particularly resistance training. At two resistance sessions per week with one cardio session, adding a third resistance session and a second cardio session would meaningfully improve insulin sensitivity. Resistance training in particular drives glucose uptake into muscle cells through a pathway that does not depend on insulin, directly improving HOMA-IR.\n\nFor her goals of building muscle and recovery from surgery, protein intake is critical. At 66.1kg with moderate training and active fracture recovery, she should aim for 1.4 to 1.6 grams of protein per kilogram of body weight, which translates to 93 to 106 grams of protein per day. On a vegan diet, this requires deliberate planning. Key sources include tofu, tempeh, seitan, edamame, lentils, chickpeas, black beans, hemp seeds, and a quality plant-based protein powder. She should aim for at least 25 to 30 grams of protein at each of her three main meals, with the remainder from snacks. Her current diet volume is rated 5 out of 10, which at her BMI of 22.6 suggests she may not be eating enough to support her recovery and muscle-building goals. Her estimated maintenance calories at her activity level are approximately 1,850 to 1,950 per day. For muscle building and fracture recovery, she should aim for at least 1,900 to 2,000 calories, ensuring she is not in a deficit during this healing period.\n\nFor her brain fog, the B12 deficiency is the most likely driver, but adequate sleep, hydration, and stress management also play a role. She should aim for a fixed wake time, exposure to natural light within an hour of waking, a caffeine cut-off by early afternoon, and a cool dark bedroom.\n\nA retest in 12 weeks is recommended, focusing on B12, ferritin, full blood count with reticulocytes, vitamin D, HOMA-IR, HbA1c, C-Peptide on a promptly processed sample, IgM, and sodium. This timing aligns with the end of her temporary fish and egg period, giving a clear picture of where she stands as she transitions back to a fully vegan diet.","flags":"URGENT GP DISCUSSION: Vitamin B12 at 142 pg/ml, below the lower limit of 193. Frank deficiency on a long-term vegan diet. Symptoms of brain fog and hair thinning are consistent. Low absolute reticulocytes at 37.57 (lower limit 50) may reflect early B12-related impairment of red cell production. MCV at 89.9 is within range but upper half, consistent with early macrocytic trend. GP should consider loading B12 injections. Repeat B12 and full blood count in 8 to 12 weeks.\n\nLp(a) at 140.43 nmol/L, significantly above the 32 nmol/L threshold, placing her in the moderate inherited cardiovascular risk category. This is genetically fixed and should be recorded permanently in her medical notes. First-degree relatives should be offered testing. Modifiable lipid risk factors are all excellent, with ApoB 0.75, HDL 2.1, and triglycerides 1.12, which is the correct management strategy.\n\nIgM at 0.4 g/L, below the lower limit of 0.5. Known finding with history of selective IgM deficiency, recurrent chest infections, and prior pneumococcal serotype testing. IgG 9.4 and IgA 1.6 are both normal. Immunology team already involved.\n\nHOMA-IR at 1.72, above the optimal threshold of 1.5 but below the early insulin resistance threshold of 1.9. HbA1c at 41 mmol/mol, one point below the pre-diabetes threshold of 42. Fasting glucose 4.9 and insulin 7.9 are both within range. Pattern suggests early metabolic drift warranting lifestyle optimisation rather than medication.\n\nC-Peptide at 0.713 ug/L (approximately 236 pmol/L), below the laboratory lower limit of 1.1 ug/L (364 pmol/L). Lab has flagged potential sample degradation if not separated within 4 hours. In the context of normal glucose, insulin, and HbA1c, most likely a pre-analytical artefact. Recommend repeat on a promptly processed sample.\n\nSodium at 147 mmol/L, one point above the upper limit of 146. Most likely mild dehydration at the time of the draw. No clinical concern at this margin but worth rechecking on retest.\n\nTransferrin at 2.48 g/L, marginally below the lower limit of 2.5. A very small deviation. Serum iron, transferrin saturation, and TIBC are all normal. Not clinically significant in isolation.\n\nFerritin at 26 ng/ml, within the laboratory range but below the optimal floor of 40 for women. Low stores on a long-term vegan diet with increased demand from fracture recovery.\n\nVitamin D at 46 nmol/L, in the insufficient range below 50 and well below the optimal range of 75 to 120. Supplementation recommended, particularly given immune vulnerability and active bone healing.\n\nReassuring negatives: Thyroid function is optimal with negative antibodies. Liver function is entirely clean. Kidney function is preserved with Cystatin C eGFR of 91. CRP mildly elevated at 1.1 but consistent with post-surgical recovery. All tumour markers are within range. Rheumatoid factor is negative. Coeliac screen is negative. Full blood count is largely normal. Lipid profile is excellent aside from Lp(a). Calcium metabolism is normal with appropriate PTH. No urine sample was received.","recommendations":"1. See GP urgently regarding B12 of 142. Discuss loading B12 injections followed by long-term sublingual methylcobalamin supplementation. This is the most likely cause of brain fog and hair thinning.\n\n2. Record Lp(a) of 140.43 permanently in medical notes. Discuss with GP. Encourage first-degree relatives to be tested.\n\n3. Share IgM result of 0.4 with immunology team for ongoing monitoring.\n\n4. Begin vitamin D3 supplementation at 3,000 to 4,000 IU daily with vitamin K2 MK-7 at 100 to 200 mcg daily. Critical for immune function and bone healing.\n\n5. Begin gentle iron supplementation with ferrous bisglycinate 25mg every other day with vitamin C to build ferritin stores above 40.\n\n6. Increase protein intake to 93 to 106 grams per day to support muscle building and fracture recovery. Consider a plant-based protein powder to bridge any gap.\n\n7. Increase diet volume. At a volume of 5 out of 10, she may not be eating enough to support recovery, immune function, and muscle building. Aim for at least 1,900 to 2,000 calories per day.\n\n8. Add a third resistance training session per week and consider a second cardio session to improve insulin sensitivity and support muscle-building goals.\n\n9. Repeat C-Peptide on a promptly processed sample to confirm whether the low result was a sample handling issue.\n\n10. Retest in 12 weeks: B12, ferritin, full blood count with reticulocytes, vitamin D, HOMA-IR, HbA1c, C-Peptide, IgM, and sodium. This timing coincides with the end of her temporary fish and egg period.\n\n11. Include a urine sample with the next blood draw for a complete urinalysis panel.","supplementation":"Vitamin B12: Sublingual methylcobalamin, 2,000 mcg daily, dissolved under the tongue first thing in the morning on an empty stomach. This is non-negotiable on a vegan diet. However, given her current level of 142, she should discuss with her GP whether a loading course of intramuscular injections is needed first to restore stores more rapidly. Once B12 is confirmed above 500 on retest, the sublingual dose can be maintained at 1,000 mcg daily for life.\n\nVitamin D3: Cholecalciferol, 4,000 IU daily, taken with her largest meal containing fat. At her current level of 46, this dose should bring her into the optimal range of 75 to 120 within 8 to 12 weeks. Once confirmed in the optimal range, a maintenance dose of 2,000 IU daily should sustain it.\n\nVitamin K2: MK-7 form, 200 mcg daily, taken alongside vitamin D. This directs calcium into bones rather than arteries, which is particularly important during her fracture healing and given her elevated Lp(a).\n\nMagnesium: Magnesium glycinate, 300mg before bed. Her magnesium is within the optimal range at 1.01, but supplementation supports bone healing, sleep quality, and muscle recovery. The glycinate form is the best tolerated and has a mild calming effect that supports sleep.\n\nIron: Ferrous bisglycinate, 25mg every other day, taken with a glass of orange juice or other vitamin C source on an empty stomach. Avoid taking within two hours of tea, coffee, calcium supplements, or her magnesium. The every-other-day dosing pattern has been shown to improve absorption compared to daily dosing. Continue until ferritin is confirmed above 50 on retest, then reassess.\n\nOmega-3: While she is temporarily including fish twice weekly, she is likely getting adequate EPA and DHA. Once she returns to a fully vegan diet, an algae-based omega-3 supplement providing at least 500mg combined EPA and DHA daily is recommended. This supports cardiovascular health, which is particularly relevant given her elevated Lp(a), and also supports the anti-inflammatory environment needed for ongoing bone healing.\n\nThe most important changes from this report are not supplements. They are getting her B12 assessed and treated by her GP, increasing her food intake to support recovery and muscle building, increasing her protein to 93 to 106 grams per day, and adding training volume to improve her metabolic markers.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6133","units":"mmol/l","description":"Fasting blood glucose measures the amount of sugar in the blood after an overnight fast. At 4.9, Suzanne's result sits within the optimal range of 4.0 to 5.4, meaning her body is managing blood sugar effectively at rest. This is a reassuring finding, particularly when considered alongside her other metabolic markers.","low_causes":"Prolonged fasting, excessive insulin production, certain medications","high_causes":"Insulin resistance, pre-diabetes, diabetes, stress, illness, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4917","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it, providing a picture of average blood sugar control over the previous two to three months. At 5.9%, Suzanne's result is within the normal range below 6.0% but above the optimal ceiling of 5.6%. This places her in the upper end of normal, just below the pre-diabetes threshold of 6.0 to 6.4%. It suggests her blood sugar management over recent months has been adequate but could be tighter.","low_causes":"Low carbohydrate diet, high red blood cell turnover, certain anaemias","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5556","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the IFCC-standardised version of HbA1c, measuring the same thing as the percentage value but in different units. At 41, Suzanne is one point below the pre-diabetes threshold of 42. While still within the normal range, this warrants attention and lifestyle optimisation to ensure it trends downward rather than upward over time.","low_causes":"Low carbohydrate diet, high red blood cell turnover","high_causes":"Insulin resistance, pre-diabetes, diabetes, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4119","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.4122","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. Lower levels generally indicate better insulin sensitivity, meaning the body's cells respond readily to insulin's signal. At 7.9, Suzanne's insulin is within the optimal range of 2 to 8, suggesting her pancreas is not having to overwork to maintain blood sugar control.","low_causes":"High insulin sensitivity, low carbohydrate diet, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate or high sugar diet, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.713","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1485","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/l","description":"C-Peptide is released by the pancreas in equal amounts to insulin, and measuring it provides a reliable gauge of how much insulin the pancreas is actually producing, independent of any external insulin. At 0.713, Suzanne's result is below the lower limit of 1.1. However, the laboratory has flagged that C-Peptide can degrade significantly in samples not separated within four hours, losing up to 56% of its concentration. Given that her fasting glucose, HbA1c, and insulin are all within acceptable ranges, this low result is most likely a pre-analytical artefact rather than a sign of genuine pancreatic insufficiency. A repeat on a promptly processed sample would clarify this.","low_causes":"Sample degradation, low insulin demand, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.72","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7467","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index that combines fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's effects. A lower score means better insulin sensitivity. At 1.72, Suzanne's result is above the optimal upper limit of 1.5 but below the threshold of 1.9 that indicates early insulin resistance. This suggests her metabolic flexibility could be improved, most effectively through increased training volume, particularly resistance exercise, which drives glucose into muscles through insulin-independent pathways.","low_causes":"High insulin sensitivity, low carbohydrate diet, very active lifestyle","high_causes":"Insulin resistance, excess calorie intake, sedentary lifestyle, visceral fat accumulation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"112.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5238","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates how well the beta cells in the pancreas are functioning by calculating how much insulin they produce relative to the blood sugar level. At 112.86, Suzanne's pancreatic function is well within the healthy range of 80 to 200, indicating her pancreas is producing an appropriate amount of insulin for her glucose levels.","low_causes":"Beta cell dysfunction, type 1 diabetes, late-stage type 2 diabetes, low carbohydrate diet","high_causes":"Insulin resistance causing compensatory overproduction, early type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2857","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so higher levels suggest liver strain. At 16, Suzanne's ALT is well within the optimal range below 25 for women, indicating her liver cells are healthy and intact with no signs of metabolic strain.","low_causes":"Normal finding, very healthy liver","high_causes":"Fatty liver disease, alcohol use, medications, viral hepatitis, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"IU/l","description":"AST is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. At 21, Suzanne's AST is comfortably within range, confirming the picture of a healthy liver alongside her clean ALT and GGT results.","low_causes":"Normal finding","high_causes":"Liver disease, muscle damage, heart disease, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2105","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5439","units":"IU/l","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications, and bile duct issues. It is often the first liver marker to rise when the liver is under strain. At 16, well within the optimal range below 25, this is an excellent result confirming that Suzanne's liver is processing its workload comfortably.","low_causes":"Normal finding","high_causes":"Alcohol use, fatty liver, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4619","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6048","units":"IU/l","description":"ALP is an enzyme found in the liver and bones. It can rise with liver disease, bile duct problems, or increased bone activity. At 69, Suzanne's ALP is well within range. Given her recent fracture surgery, it is reassuring that ALP is not markedly elevated, though a modest rise during bone healing would have been expected and acceptable.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bone healing, bone disease, liver disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when red blood cells are broken down. The liver processes and excretes it. Elevated levels can indicate liver problems or excessive red blood cell breakdown. At 9, Suzanne's bilirubin is healthy and unremarkable.","low_causes":"Normal finding","high_causes":"Liver disease, gallstones, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"78","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6173","units":"g/l","description":"Total protein measures the combined levels of albumin and globulin in the blood, reflecting the liver's synthetic capacity and the immune system's antibody production. At 67, Suzanne's result is within the optimal range, though sitting in the lower half. This is consistent with her lower globulin levels, which are partly explained by her low IgM.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease","high_causes":"Chronic infection, chronic inflammation, multiple myeloma, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5625","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and medications, and maintains fluid balance. At 45, Suzanne's albumin is in an excellent position within the optimal range, reflecting healthy liver synthetic function and adequate protein intake.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"22","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"18","upper_normal":"36","lower_optimal":"23","upper_optimal":"33","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins) produced by the immune system and transport proteins made by the liver. At 22, Suzanne's globulin is within the laboratory range but just below the optimal floor of 23. This is consistent with her known low IgM, as immunoglobulins contribute to the globulin pool.","low_causes":"Immunoglobulin deficiency, liver disease, malnutrition","high_causes":"Chronic infection, chronic inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"2.05","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5595","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.6190","units":"","description":"The albumin to globulin ratio compares the two main protein groups in the blood. A ratio that is too high can suggest low globulin (as in immunodeficiency), while too low may suggest chronic inflammation or liver disease. At 2.05, Suzanne's ratio is within the optimal range, though the slightly lower globulin means it sits in the upper half.","low_causes":"Chronic inflammation, liver disease, autoimmune disease","high_causes":"Immunoglobulin deficiency, genetic factors","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3517","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"The FIB-4 score is a calculated index that estimates the risk of liver fibrosis (scarring) using age, ALT, AST, and platelet count. At 1.02, well below the threshold of 1.45 (or 2.0 for those over 65), Suzanne's score indicates no significant risk of liver fibrosis.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis, advancing age, low platelet count","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"LIVER & METABOLIC","result":"51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4091","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6061","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Elevated levels can indicate pancreatic inflammation. At 51, Suzanne's amylase is comfortably within range, indicating healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6241","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down fats. It is more specific to the pancreas than amylase. At 48, Suzanne's lipase is within range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, bowel disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4826","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including HDL, LDL, and VLDL. On its own it tells a limited story, and the breakdown into its components is more informative. At 5.0, Suzanne's total cholesterol is within the desirable range below 5.18, which is a good starting point. The breakdown reveals an excellent profile underneath.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.12","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3294","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, largely influenced by recent food intake, carbohydrate consumption, and alcohol. At 1.12, Suzanne's triglycerides are within the healthy fasting range below 1.7 but above the optimal ceiling of 1.0. This is a minor elevation and consistent with normal dietary variation rather than any metabolic concern, particularly given her excellent HDL and overall lipid profile.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate or sugar intake, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3269","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/l","description":"VLDL is a lipoprotein that carries triglycerides from the liver to tissues. It is considered a component of atherogenic (artery-damaging) cholesterol. At 0.51, Suzanne's VLDL is within the optimal range, contributing to her overall favourable lipid picture.","low_causes":"Very low fat diet, hyperthyroidism","high_causes":"High triglycerides, insulin resistance, obesity, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6774","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL is often called 'good' cholesterol because it carries cholesterol away from artery walls and back to the liver for disposal. Higher levels are protective against cardiovascular disease. At 2.1, Suzanne's HDL is outstanding, well above the optimal threshold of 1.6 for women. This is one of the strongest markers in her report and provides significant cardiovascular protection, which is particularly important given her elevated Lp(a).","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol intake, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL is often called 'bad' cholesterol because it deposits cholesterol into artery walls, contributing to plaque formation. At 2.45, Suzanne's LDL is within the optimal range below 2.6. For someone with an elevated Lp(a), keeping LDL as low as possible is particularly beneficial, and this result is very well controlled.","low_causes":"Very low fat diet, hyperthyroidism, malnutrition, statin use","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2644","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The ratio of total cholesterol to HDL provides a quick snapshot of cardiovascular risk. A lower ratio is better. At 2.38, Suzanne's ratio is excellent, well within the optimal range, reflecting the protective influence of her very high HDL.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6774","lower_normal":"20","upper_normal":"62","lower_optimal":"30","upper_optimal":"62","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6190","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of protective HDL. At 42%, nearly half of Suzanne's total cholesterol is the beneficial type, which is an excellent result.","low_causes":"Low HDL, metabolic syndrome, obesity","high_causes":"High HDL, very active lifestyle, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol fractions including LDL, VLDL, and Lp(a). At 2.9, Suzanne's result is within the optimal range below 3.4, indicating that her atherogenic cholesterol burden is well controlled.","low_causes":"Very low fat diet, malnutrition, hyperthyroidism","high_causes":"Diet, genetics, hypothyroidism, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6107","lower_normal":"1.4","upper_normal":"2.8","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein component of HDL particles. Higher levels reflect more HDL particles and greater cardiovascular protection. At 1.71, Suzanne's ApoA1 is healthy and consistent with her excellent HDL level.","low_causes":"Low HDL, metabolic syndrome, genetic factors","high_causes":"Regular exercise, healthy diet, genetics, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL, and Lp(a) particle. Each atherogenic particle carries exactly one ApoB molecule, so this is essentially a count of how many potentially harmful cholesterol particles are in the blood. It is widely considered the single best lipid marker for predicting cardiovascular risk. At 0.75, Suzanne's ApoB is below the desirable threshold of 0.9 and within the optimal range below 0.8. This is an excellent result, particularly meaningful given her elevated Lp(a), because it means the total number of atherogenic particles remains well controlled despite the Lp(a) contribution.","low_causes":"Very low fat diet, hyperthyroidism, malnutrition","high_causes":"High saturated fat diet, genetics, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ratio of ApoB to ApoA1 is considered the best single summary metric for lipid-driven cardiovascular risk. It compares the number of harmful cholesterol particles (ApoB) to the number of protective ones (ApoA1). At 0.44, Suzanne falls well within the lower risk category below 0.6, indicating her cardiovascular lipid balance is strongly favourable.","low_causes":"Excellent cardiovascular lipid balance","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"140.43","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). It deposits cholesterol into artery walls, promotes blood clot formation, and drives inflammation. At 140.43, Suzanne's Lp(a) is significantly above the normal threshold of 32, placing her in the moderate risk category (90 to 200). This is entirely inherited and cannot be changed by diet, exercise, or currently available medications, though new targeted therapies are in development. It should be recorded permanently in her medical record, and first-degree relatives should consider being tested. The strategy for managing elevated Lp(a) is to optimise every modifiable cardiovascular risk factor, which Suzanne is doing exceptionally well.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1765","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful marker of insulin resistance and metabolic health. Lower values indicate better metabolic function. At 0.53, Suzanne's ratio is well within the optimal range below 0.87, confirming that despite the marginally elevated HOMA-IR, her overall metabolic picture is healthy.","low_causes":"Excellent metabolic health, high HDL","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2813","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol represents the cholesterol carried by triglyceride-rich lipoprotein remnants, calculated as total cholesterol minus HDL minus LDL. These remnants are increasingly recognised as an independent cardiovascular risk factor. At 0.45, Suzanne's remnant cholesterol is within the optimal range below 0.5.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1100","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein is produced by the liver in response to inflammation anywhere in the body. It is used to assess both cardiovascular risk and general inflammatory burden. At 1.1, Suzanne's result is within the laboratory range below 5 but above the optimal threshold of 1.0. In the context of her surgery 18 weeks ago, this mild elevation most likely reflects residual tissue healing rather than chronic inflammation. A retest once she is further from surgery will clarify whether this returns to the optimal range.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, recent surgery or injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle in a tube over one hour. Faster settling indicates more inflammation, as inflammatory proteins cause red blood cells to clump together. At 4, Suzanne's ESR is excellent and well within the optimal range, indicating minimal systemic inflammation despite her recent surgery.","low_causes":"Healthy state, low inflammation","high_causes":"Infection, autoimmune disease, chronic inflammation, cancer, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"147","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7436","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"mmol/l","description":"Sodium is an essential electrolyte that regulates fluid balance, blood pressure, and nerve and muscle function. At 147, Suzanne's sodium is one point above the upper limit of 146. This degree of elevation is almost always explained by mild dehydration at the time of the blood draw rather than a sodium disorder. Ensuring adequate water intake, particularly in the hours before a blood test, should normalise this on retest.","low_causes":"Overhydration, diuretics, kidney disease, heart failure, adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, diabetes insipidus, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"mmol/l","description":"Potassium is an electrolyte critical for heart rhythm, muscle contraction, and nerve signalling. At 4.6, Suzanne's potassium is within the optimal range, reflecting healthy kidney function and adequate dietary intake from her plant-rich diet.","low_causes":"Diuretics, vomiting, diarrhoea, low dietary intake","high_causes":"Kidney disease, ACE inhibitors, potassium supplements, sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"102","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain fluid balance and acid-base equilibrium. At 102, Suzanne's chloride is within the optimal range and moving in the expected direction alongside her mildly elevated sodium.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"26.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5394","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"29","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3636","upper_optimal_position":"0.6061","units":"mmol/l","description":"Bicarbonate is a key buffer in the blood that helps maintain the pH balance. At 26.8, Suzanne's result is within the optimal range, indicating her acid-base balance is well regulated.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Metabolic alkalosis, vomiting, diuretic use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4795","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3743","upper_optimal_position":"0.6082","units":"mmol/l","description":"Calcium is essential for bone health, muscle contraction, nerve signalling, and blood clotting. At 2.33, Suzanne's calcium is within the optimal range, which is particularly reassuring given her active fracture healing. Her normal PTH alongside normal calcium confirms her calcium regulation is working properly.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.26","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3833","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the calcium result for the albumin level, giving a more accurate picture of the calcium that is physiologically active. At 2.26, Suzanne's corrected calcium is within the laboratory range but just below the optimal floor of 2.25. Given her insufficient vitamin D at 46, improving vitamin D levels should help optimise calcium absorption and metabolism.","low_causes":"Vitamin D deficiency, hypoparathyroidism, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6092","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6207","units":"mmol/l","description":"Magnesium is involved in over 300 enzyme reactions in the body, including energy production, muscle function, nerve signalling, and bone formation. At 1.01, Suzanne's magnesium sits within the optimal range of 0.85 to 1.05. This is an excellent result, particularly relevant for her bone healing and muscle-building goals.","low_causes":"Poor dietary intake, alcohol use, diuretics, diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"uric_acid","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"236","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3190","upper_optimal_position":"0.5190","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and in the body's own cells. Elevated levels can lead to gout and are associated with cardiovascular and kidney risk. At 236, Suzanne's uric acid is within the optimal range for women of 160 to 320.","low_causes":"Low purine diet, liver disease, certain medications","high_causes":"High purine diet (organ meats, shellfish), alcohol, kidney disease, obesity, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"22.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8500","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/l","description":"The anion gap is calculated from sodium, potassium, chloride, and bicarbonate, and reflects unmeasured anions in the blood. It can help identify metabolic acidosis. At 22.8, Suzanne's anion gap is above the typical range of 8 to 16. However, this calculation is being driven by her sodium at 147, which is itself mildly elevated, most likely from dehydration. In the absence of metabolic symptoms and with a normal bicarbonate, this elevated anion gap does not suggest a metabolic acidosis and is most likely a laboratory artefact of the mildly elevated sodium. It should normalise when sodium normalises on retest with adequate hydration.","low_causes":"Hypoalbuminaemia, laboratory error","high_causes":"Metabolic acidosis, dehydration, diabetic ketoacidosis, kidney disease, lactic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","r ","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate measures how well the kidneys are filtering waste from the blood. An eGFR above 90 indicates normal kidney function. Suzanne's result of greater than 90 confirms healthy kidney filtration.","low_causes":"Kidney disease, dehydration, medications, aging","high_causes":"Hyperfiltration (early diabetes), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.95","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4318","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/l","description":"Cystatin C is a protein produced at a constant rate by all cells in the body and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, making it a more reliable marker of kidney function, particularly in people with low muscle mass. At 0.95, Suzanne's Cystatin C is within range and at the boundary of optimal.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Kidney disease, hypothyroidism, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7583","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"The Cystatin C-based eGFR provides a more accurate estimate of kidney filtration than creatinine-based eGFR in many populations. At 91, Suzanne's result confirms her kidney function is above the 90 threshold that represents full healthy
