ower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a pancreatic enzyme that breaks down dietary fat. His result of 87 is above the upper limit of 60. In acute pancreatitis, lipase typically rises to three or more times the upper limit with severe abdominal pain, but at 87, less than 1.5 times the limit, and with normal amylase, undetectable CRP and no abdominal symptoms, this is not pancreatitis. A mildly elevated lipase can be seen with high-fat meals in the preceding 24 hours, creatine supplementation, or as a normal variant. Worth noting for the GP record so it can be tracked over time.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Pancreatitis, gallstones, kidney disease, high-fat diet, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5211","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6140","units":"mmol/l","description":"Calcium is essential for bone strength, nerve signalling, muscle contraction and blood clotting. His result of 2.4 is within the healthy and optimal ranges, confirming normal calcium homeostasis.","low_causes":"Vitamin D deficiency, hypoparathyroidism, magnesium deficiency, kidney disease","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cca","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium level for the albumin concentration, giving a more accurate picture of available calcium. His result of 2.48 is within the healthy and optimal ranges. Despite his very high vitamin D and suppressed PTH, calcium has remained within normal limits, which is reassuring.","low_causes":"Vitamin D deficiency, hypoparathyroidism, magnesium deficiency","high_causes":"Hyperparathyroidism, malignancy, excess vitamin D, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phos","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5820","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6149","units":"mmol/l","description":"Phosphate works closely with calcium in bone metabolism and energy production. His result of 1.5 is within the healthy range and at the top of the optimal band. This is consistent with good bone health and active energy metabolism.","low_causes":"Hyperparathyroidism, vitamin D deficiency, malnutrition, refeeding syndrome","high_causes":"Kidney disease, hypoparathyroidism, excess vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4995","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5219","upper_optimal_position":"0.5907","units":"mmol/l","description":"Magnesium is essential for over 300 enzymatic reactions including muscle contraction, nerve signalling, energy production and sleep regulation. His result of 0.82 is within the laboratory range but below the optimal floor of 0.85. Given his high training volume at very hard intensity, magnesium demand is elevated. His 450 mg supplementation with magnesium glycinate is appropriate and should be continued. Serum magnesium is a crude measure because only 1% of the body's magnesium circulates in the blood, so a level at 0.82 may underestimate intracellular depletion.","low_causes":"Intense exercise, sweating, insufficient dietary intake, medications, alcohol","high_causes":"Kidney disease, excessive supplementation, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"> 375","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.95","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"0.750","units":"nmol/L","description":"Vitamin D 25(OH) measures the main circulating form of vitamin D, which is essential for bone health, immune function, mood and muscle performance. His result is above 375 nmol/L, which is supraphysiological and well above the optimal range of 75 to 120. This is clearly driven by his 5,000 IU daily supplementation. While vitamin D toxicity with clinical symptoms is rare and typically requires levels well above 500, there is no evidence that levels above 120 provide additional benefit, and his suppressed PTH of 0.668 shows the excess vitamin D is already affecting the calcium-parathyroid axis. He should reduce his dose to 2,000 IU daily and retest in three months.","low_causes":"Insufficient sunlight, dark skin, low dietary intake, malabsorption, obesity","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"0.668","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2444","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3755","upper_optimal_position":"0.5601","units":"pmol/L","description":"Parathyroid hormone is produced by four small glands behind the thyroid and is the master regulator of calcium and phosphate balance. When calcium rises, PTH falls, and vice versa. His result of 0.668 is below the lower limit of 0.98. In the context of a vitamin D above 375, this is a predictable physiological response: very high vitamin D increases calcium absorption from the gut, which raises ionised calcium, which signals the parathyroid glands to reduce PTH output. His corrected calcium at 2.48 and phosphate at 1.5 are both within range, so no mineral imbalance has occurred. The PTH will recover naturally when vitamin D falls into the 75 to 120 range after reducing the supplementation dose.","low_causes":"Excess vitamin D, hypercalcaemia, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, kidney disease, calcium deficiency, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"1633","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8760","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4561","upper_optimal_position":"0.5614","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. His result of 1,633 is well above the upper limit of 982, which is expected given his B12 supplementation and multivitamin. Excess B12 is water-soluble and excreted by the kidneys, so levels this high from supplementation are not harmful. He could reduce to a lower maintenance dose or rely on dietary intake and his multivitamin.","low_causes":"Vegetarian or vegan diet, malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5714","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, also known as vitamin B9, works alongside B12 in DNA synthesis, red blood cell production and methylation. His result of 14 is within the healthy and optimal ranges, confirming good dietary and supplemental intake from his multivitamin and vegetable consumption of 4 to 5 portions daily.","low_causes":"Poor dietary intake, malabsorption, alcohol, medications, pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crp","name":"HS-CRP","group":"INFLAMMATION","result":"< 0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.02","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/l","description":"High-sensitivity C-reactive protein is the most reliable single marker of systemic inflammation. It is produced by the liver in response to inflammatory signals from anywhere in the body. His result is below 0.2, which is essentially undetectable and sits well inside the optimal ceiling of 1.0 mg/L. This confirms that there is no systemic inflammation, no hidden infection, and no metabolic inflammatory process. In a man training at this intensity, this is an excellent result.","low_causes":"Low inflammation, healthy lifestyle","high_causes":"Infection, chronic inflammation, metabolic syndrome, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.29","within_normal":"FALSE","within_optimal":"TRUE","result_position":"0.1393","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR, the homeostatic model assessment of insulin resistance, is calculated from fasting glucose and fasting insulin. It estimates how resistant the body's cells are to the effects of insulin. His result of 0.29 is below the laboratory lower limit of 0.5 but in the favourable direction: below 1.0 indicates excellent insulin sensitivity, which is confirmed here. His tissues respond so efficiently to insulin that very little is needed to maintain normal blood sugar. This is the metabolic signature of a lean, active individual on a healthy diet.","low_causes":"Exceptional insulin sensitivity, lean body mass, regular exercise, low-carbohydrate diet","high_causes":"Insulin resistance, obesity, metabolic syndrome, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4143","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from the HbA1c and represents the average blood sugar over the past two to three months. His result of 5.8 mmol/L is within the healthy and optimal ranges, confirming excellent long-term glucose control.","low_causes":"Low carbohydrate intake, high activity level","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4034","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The triglyceride-glucose index is a surrogate marker of insulin resistance calculated from fasting glucose and triglycerides. His result of 7.1 is well within the optimal range of below 8.5, confirming excellent insulin sensitivity consistent with his HOMA-IR of 0.29.","low_causes":"Exceptional insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2799","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of HDL, LDL and VLDL cholesterol. His result of 2.9 is well below the desirable upper limit of 5.18, reflecting an excellent overall lipid profile.","low_causes":"Hyperthyroidism, malnutrition, liver disease, very low-fat diet","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat storage in the blood, rising after meals and with excess sugar, alcohol and refined carbohydrate intake. His result of 0.39 is outstandingly low and well inside the optimal ceiling of 1.0. This reflects a clean diet with low sugar intake, no alcohol and excellent insulin sensitivity.","low_causes":"Very low-fat diet, hyperthyroidism, malnutrition","high_causes":"High sugar or alcohol intake, insulin resistance, obesity, medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1154","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL, very low-density lipoprotein, carries triglycerides from the liver to tissues. His result of 0.18 is well within the healthy and optimal ranges, consistent with his excellent triglyceride level.","low_causes":"Very low-fat diet","high_causes":"Insulin resistance, obesity, high sugar intake, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL, high-density lipoprotein, is often called the 'good' cholesterol because it carries cholesterol away from artery walls back to the liver for disposal. His result of 1.4 is above the desirable threshold of 1.04 and sits right at the optimal floor of 1.4 for a man. This reflects his clean diet, regular training and lack of alcohol, all of which support HDL production.","low_causes":"Sedentary lifestyle, smoking, obesity, very low-fat diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol intake, genetics, omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2083","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL, low-density lipoprotein, carries cholesterol to tissues and, when elevated, deposits it in artery walls, driving atherosclerosis. His result of 1.25 is well inside the optimal ceiling of 2.6 and significantly below the upper limit of 3.0. Given his family history of premature cardiovascular disease, this is particularly reassuring.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, familial hypercholesterolaemia, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2300","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a quick summary of cardiovascular risk from the lipid profile. Below 4.5 is desirable, and below 3.5 is optimal. His result of 2.07 is excellent.","low_causes":"Very high HDL relative to total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"48.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8047","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the circulating cholesterol is the protective HDL fraction. His result of 48.28% means nearly half of his total cholesterol is HDL, well above the desirable minimum of 20%, which is an excellent ratio.","low_causes":"Low HDL, metabolic syndrome","high_causes":"High HDL, very low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL and represents all the potentially atherogenic cholesterol fractions combined. His result of 1.5 is well below the desirable limit of 4.0 and the optimal ceiling of 3.4, confirming very low atherogenic cholesterol.","low_causes":"Very low LDL and triglycerides, malnutrition","high_causes":"High LDL, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5458","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.3","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5417","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles and reflects the body's capacity to perform reverse cholesterol transport, moving cholesterol out of artery walls. His result of 1.31 is above the desirable threshold of 1.20 and just above the optimal floor of 1.30.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein that sits on the surface of every LDL, VLDL and Lp(a) particle, and because each atherogenic particle carries exactly one ApoB molecule, it is the single best measure of the total number of particles that can enter and damage artery walls. His result of 0.43 is well below both the desirable ceiling of 0.9 and the optimal target of 0.8. Given his family history of premature cardiovascular events, this is one of the most reassuring numbers in the report.","low_causes":"Hyperthyroidism, malnutrition, medications","high_causes":"High LDL, familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.328","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1823","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio is a summary of the balance between atherogenic (artery-damaging) and protective cholesterol particles. Below 0.7 is lower risk and below 0.6 is optimal. His result of 0.328 is excellent, confirming that the protective HDL particles significantly outnumber the atherogenic LDL particles.","low_causes":"High HDL, low LDL, excellent cardiovascular health","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"< 25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), often written Lp(a), is a genetically determined lipoprotein particle that adds cardiovascular risk independently of LDL. Unlike other lipid markers, it cannot be meaningfully changed by diet, exercise or most medications. His result is below 25 nmol/L, which is ideal and well below the 32 nmol/L threshold. This is genuinely useful information because it means any future cardiovascular risk is driven entirely by modifiable factors such as LDL, ApoB, diet and lifestyle, not by an inherited particle he cannot change.","low_causes":"Genetic variation (favourable)","high_causes":"Genetic variation (inherited), kidney disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"515","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8036","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase is an enzyme found mainly in skeletal muscle, heart and brain that is released into the blood when muscle fibres are damaged. His result of 515 is above the upper limit of 320 for a man. In a person training resistance five or more times per week at very hard intensity, CK levels of 400 to 800 are routinely seen and simply reflect the volume of muscle breakdown and repair. It does not indicate rhabdomyolysis, which typically produces CK levels in the thousands with dark urine and severe muscle pain. This is a training marker, not pathology.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense resistance training, muscle injury, rhabdomyolysis, medications (statins), hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"21.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6333","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3929","upper_optimal_position":"0.5536","units":"pmol/l","description":"Free T4 is the unbound, active form of thyroxine, the hormone the thyroid gland produces in the largest quantity. It serves as the reservoir for conversion into the more potent T3. His result of 21.6 is within the laboratory range and above the optimal floor of 14, sitting toward the upper end. This indicates robust thyroid output. In the context of a normal TSH, this is simply a sign that the thyroid is producing well.","low_causes":"Hypothyroidism, iodine deficiency, pituitary disease","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4182","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3666","upper_optimal_position":"0.4776","units":"mIU/l","description":"Thyroid stimulating hormone is produced by the pituitary gland and tells the thyroid how much hormone to make. When TSH is high, the pituitary is asking for more thyroid output; when low, it is asking for less. His result of 1.75 is within the optimal range of 1.0 to 2.5, indicating the pituitary is satisfied with the thyroid's output. This is particularly notable given his family history of thyroid disease.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroid autoimmunity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the active thyroid hormone that directly drives metabolic rate, energy production, body temperature and brain function. His result of 5.1 is within the optimal range of 4.5 to 6.5. This confirms that the body is converting T4 to T3 effectively and metabolic drive is healthy.","low_causes":"Hypothyroidism, low energy availability, calorie restriction, illness (sick euthyroid)","high_causes":"Hyperthyroidism, excess thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies are autoantibodies that attack the thyroid gland. When elevated, they indicate the immune system is targeting the thyroid, most commonly seen in Hashimoto's thyroiditis. His result is below 6.6, well under the threshold of 13.8, meaning there is no autoimmune thyroid activity. Given his family history of thyroid disease, this is a valuable negative finding.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are a second type of thyroid autoantibody. His result is below 1.3, well under the threshold of 4.4. Combined with the negative TPO antibodies, this rules out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.236","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage thyroid hormone T4 into the active hormone T3. His result of 0.236 is within the laboratory range but below the optimal floor of 0.27. This is largely because his FT4 is high at 21.6 rather than because his FT3 is low; FT3 at 5.1 is within the optimal band. The ratio is not a clinical concern when both individual hormones are in a healthy position.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0480","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"1.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3","units":"ng/ml","description":"Prostate-specific antigen is a protein produced by the prostate gland. It is used as a screening marker for prostate health, with elevations potentially indicating benign prostate enlargement, infection or, less commonly, prostate cancer. His result of 0.24 is very low and well within the healthy range, indicating a healthy prostate. This establishes an important baseline, particularly relevant if he transitions to TRT, as testosterone can influence PSA over time.","low_causes":"Normal elated stress.","low_causes":"Adrenal insufficiency, low energy availability, overtraining","high_causes":"Chronic stress, Cushing's syndrome, medications, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"197","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6741","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"120","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1369","upper_optimal_position":"0.4107","units":"pmol/L","description":"Oestradiol is the most potent form of oestrogen, produced in men primarily by the aromatase enzyme converting testosterone. His result of 197 is well above the male upper limit of 146.1. This elevation is being driven by the aromatisation of his supra-physiological testosterone of 32.5 nmol/L. hCG is particularly potent at stimulating intratesticular aromatase. Elevated oestradiol in men is associated with fatigue, brain fog, low libido, water retention, mood changes and poor exercise recovery, which matches his reported symptoms closely. This is the most clinically significant finding in the report and should be discussed with his prescribing clinician.","low_causes":"Low testosterone, aromatase inhibitor use, low body fat","high_causes":"High testosterone (aromatisation), hCG therapy, obesity, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.96","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3411","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"1.0","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3456","upper_optimal_position":"0.5905","units":"nmol/L","description":"Progesterone in men is produced by the adrenal glands and testes in small amounts and plays a supporting role in neurological function and as a precursor to other hormones. His result of 0.96 is just above the lower limit of 0.89. In the context of his hormonal therapy, this is unremarkable and does not require action.","low_causes":"Normal male variation, adrenal fatigue","high_causes":"Congenital adrenal hyperplasia, adrenal tumours, hCG therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3790","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2.0","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3547","upper_optimal_position":"0.5595","units":"mIU/ml","description":"Luteinising hormone is produced by the pituitary gland and stimulates testosterone production by the Leydig cells in the testes. His result of 2.46 is within the laboratory range. Enclomiphene blocks oestrogen receptors at the hypothalamus, which should raise LH, but the high circulating testosterone exerts negative feedback that partially counteracts this effect, keeping LH in the lower half of the range. If he transitions to exogenous TRT, LH will suppress to near zero because the brain will detect sufficient testosterone and stop signalling the testes; the hCG will provide the gonadal stimulation needed for fertility.","low_causes":"Testosterone therapy, pituitary disease, high-dose opioids","high_causes":"Primary hypogonadism, menopause in women, pituitary tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"4.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4652","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2.0","upper_optimal":"10.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667"," const data = REPORT_DATA;

const esc = (s) => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
