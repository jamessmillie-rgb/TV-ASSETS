<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Jamie Beale","dob":"27/06/1992","report_date":"2026-10-26","summary":"This is a 34-year-old male of mixed ethnicity presenting with a BMI of 27.7, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains seven times per week (two cardio sessions plus five or more resistance sessions at very hard intensity) with 7,500 to 10,000 daily steps. Sleep is 7 to 8 hours, slow to get going on waking, with an afternoon energy crash. Stress rarely feels hard to manage. He drinks no alcohol. He is on hormonal therapy: hCG 500 IU three times a week and enclomiphene 12.5 mg daily, started approximately six to seven months ago to address a longstanding low testosterone associated with a varicocele diagnosed around age 26 to 27. His total testosterone had been consistently around 14 to 15 nmol/L on biannual testing. He supplements with vitamin D 5,000 IU daily, sublingual B12, magnesium 450 mg, omega-3 at 2 to 4 g daily, a multivitamin, zinc picolinate 30 mg, creatine 5 to 10 g daily, boron, and protein powder providing 200 to 220 g of protein a day across five to six meals. Family history includes heart attack or stroke before 60. A previous blood test flagged something. He reports brain fog, low energy and fatigue, poor exercise recovery, and low sex drive and libido, lasting months. His goals are to build muscle, improve energy levels, and balance hormones. He is considering stopping enclomiphene and moving to testosterone replacement therapy and wants a full baseline before deciding.\n\nThe hormone picture is the centre of this report. His total testosterone has risen to 32.5 nmol/L, above the laboratory upper limit of 28.7. That is a significant response to the hCG and enclomiphene combination, and it means the testes are responding well and natural production is being successfully stimulated. His SHBG, which stands for sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation, sits at 38.6, comfortably within the ideal range of 25 to 55. His calculated free testosterone, the fraction available to tissues, is 0.748 nmol/L, well within the laboratory range of 0.13 to 1.04 and above the optimal floor. His bioavailable testosterone, a broader measure of the testosterone accessible to tissues, is 15.98 nmol/L, well above the upper end of the standard reference range. His free androgen index at 84.2 confirms that testosterone availability is genuinely high. So the therapy is working, and SHBG is not mopping up the extra testosterone. That is important because his suspicion that rising SHBG might be behind the returning symptoms does not appear to be the case.\n\nHowever, his oestradiol is 197 pmol/L, well above the male upper limit of 146.1. Oestradiol is the main oestrogen in men, produced by an enzyme called aromatase that converts testosterone into oestradiol. When testosterone rises, more substrate is available for aromatase, and oestradiol follows. At a BMI of 27.7 with a good deal of muscle mass, aromatase activity in adipose tissue is moderate but the sheer amount of testosterone being produced provides plenty of raw material. This is the most likely explanation for his returning symptoms. Elevated oestradiol in men is associated with brain fog, fatigue, reduced libido, water retention, mood changes, and poor recovery, which is exactly the symptom cluster he describes. The fact that he felt better initially and then the symptoms returned over months is consistent with a gradual rise in oestradiol as the testosterone level climbed and stabilised. This finding should be discussed with his prescribing clinician. The options typically include a low-dose aromatase inhibitor alongside the current protocol, adjusting the hCG dose downward since hCG is a strong driver of intratesticular aromatase activity, or transitioning to TRT at a dose that produces a lower peak testosterone and therefore less aromatisation. If he does move to TRT with continued hCG for fertility, monitoring oestradiol at each blood draw will be essential.\n\nHis LH is 2.46 and FSH is 4.76, both within the laboratory range. Enclomiphene works by blocking oestrogen receptors in the hypothalamus, which tricks the brain into producing more LH and FSH. The fact that LH is in the lower half of the range rather than the upper half, despite the oestrogen blockade, may suggest the hypothalamus is partially compensating for the high circulating testosterone. If he transitions to exogenous testosterone, LH and FSH will fall to near zero because the brain no longer needs to stimulate the testes; the hCG will take over that role for fertility. His prolactin is 80, low and healthy, which rules out prolactin as a contributor to the low libido. His cortisol at 423 is within the morning reference range and looks healthy for a man training at this intensity. His DHEA-S at 2.9 umol/L, equivalent to roughly 1,069 ug/dL, is well within range, confirming the adrenal androgen pathway is functioning normally. Progesterone at 0.96 is just above the lower limit of 0.89 and is of no clinical significance in a man on this protocol.\n\nTurning to what is working well, and there is a great deal to feel good about here. His cardiovascular profile is exceptional. Total cholesterol is 2.9, LDL is 1.25, well inside the optimal target of below 2.6, and his ApoB, apolipoprotein B, the protein that carries atherogenic particles and the single best predictor of cardiovascular risk, is 0.43, comfortably below the ideal threshold of 0.8. His HDL is 1.4, which sits right at the optimal floor for a man, and his triglycerides at 0.39 are outstandingly low. His Lp(a), lipoprotein(a), a genetically inherited particle that adds cardiovascular risk independently of LDL, is below 25 nmol/L, which is ideal and means the cardiovascular risk is entirely modifiable. Given his family history of heart attack or stroke before 60, this is genuinely reassuring: the inherited lipid risk factor most difficult to change is not present, and every other lipid marker is in excellent shape. His Cardiovascular Risk Score, a TrueVitals composite index scored from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 0 out of 100, as clean as it gets. His ApoB to ApoA1 ratio at 0.33 is well below the low-risk threshold of 0.7.\n\nHis inflammation markers are pristine. High-sensitivity CRP, the most reliable single marker of systemic inflammation, is below 0.2 mg/L, essentially undetectable. ESR at 12 sits right at the upper boundary of the reference range but in the context of a CRP that low and the volume of training he does, this is likely driven by muscle repair rather than any inflammatory process. The systemic immune-inflammation index at 303 and the platelet to lymphocyte ratio at 121.8 are both comfortably within the optimal range.\n\nHis liver is in good health. ALT at 22 is well within the optimal ceiling of 30 for a man. GGT at 27, gamma-glutamyl transferase, a sensitive marker of liver stress from alcohol, medications or metabolic strain, is comfortably below the optimal target of 25 when adjusted for sex, sitting within range but marginally above the tightest optimal threshold. AST at 33 is within range and is expected to be slightly higher than ALT in someone training this hard because AST is also released from skeletal muscle. The APRI score at 0.41, a fibrosis screening index, is well within the optimal range, and the NAFLD fibrosis score at minus 1.513 rules out any suggestion of fatty liver disease. Bilirubin at 13, albumin at 39, total protein at 71 and ALP at 106 are all within range. The De Ritis ratio, the AST to ALT ratio, at 1.5 is within the laboratory range of 0.6 to 1.6 but above the optimal band of 0.8 to 1.3; this is driven by the relatively higher AST from muscle breakdown rather than liver pathology, given that the ALT and all other liver markers are clean.\n\nHis lipase is 87 U/L, above the upper limit of 60. Lipase is an enzyme produced mainly by the pancreas that breaks down dietary fat. A mildly raised lipase without symptoms of abdominal pain, nausea or vomiting is a common incidental finding. His amylase, another pancreatic enzyme, is 91 and within range, which is reassuring. At this margin, the most common explanations are a high-fat meal within 12 to 24 hours of the test, creatine supplementation at the dose he takes, or normal individual variation. It does not suggest pancreatitis when amylase is normal, CRP is undetectable, and there are no abdominal symptoms. Worth mentioning to his GP for a note on file, but not a concern on its own.\n\nHis kidney function requires a word of explanation. His creatinine is 112 umol/L, above the laboratory upper limit of 104, which gives a creatinine-based eGFR of 73. On paper, this looks like reduced kidney function. However, creatinine is a waste product of creatine metabolism, and he takes 5 to 10 g of creatine daily on top of a very high protein intake and intense resistance training, all of which raise serum creatinine without any kidney impairment. This is exactly why the panel includes cystatin C, a protein filtered by the kidneys whose level is not affected by muscle mass, diet or supplementation. His cystatin C is 0.84 mg/L, well within the healthy range, giving a cystatin C-based eGFR of 94, and a combined eGFR of 94. His kidneys are working well. The creatinine is simply reflecting his supplement regimen and training load, not kidney disease. Urea at 7.5 is within range and consistent with a high-protein diet. Uric acid at 224 is just above the lower limit and well within the optimal band.\n\nHis blood sugar and insulin metabolism tell an interesting story. Fasting glucose at 3.9 is below the optimal floor of 4.0 but within the laboratory range. HbA1c at 34 mmol/mol, a measure of average blood sugar over the previous two to three months, is excellent and below the optimal ceiling of 36. His fasting insulin is 1.67 mIU/L, below the laboratory lower limit of 2.6. HOMA-IR, the homeostatic model of insulin resistance, is 0.29, below the lower limit of the reference range in the favourable direction. This pattern, low glucose with very low insulin and a very low HOMA-IR, is a sign of exceptional insulin sensitivity. His tissues are so responsive to insulin that the pancreas barely needs to produce any to keep blood sugar controlled. This is the metabolic signature of a lean, heavily training individual on a clean diet. It is a positive finding, not a concern. C-peptide, which would confirm the picture, is pending.\n\nHis thyroid is functioning well. TSH at 1.75 is within the optimal range of 1.0 to 2.5. Free T4 at 21.6 is at the upper end of the laboratory range and above the optimal floor of 14. Free T3 at 5.1, the active thyroid hormone that drives metabolic rate, is within the optimal range. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. This is particularly worth noting given his family history of thyroid disease. The FT3 to FT4 ratio at 0.236 is within the laboratory range but fractionally below the optimal band of 0.27 to 0.4, suggesting that conversion from T4 to T3 could be marginally more efficient. In practice, with both hormones individually in a good place and no symptoms pointing to thyroid dysfunction, this is not driving anything.\n\nHis full blood count is largely healthy. Haemoglobin at 143, haematocrit at 0.418, and red cell count at 4.9 are all comfortably within range, which is important to establish as a baseline before any potential TRT, since exogenous testosterone stimulates red cell production and can push haematocrit above 0.50, increasing blood viscosity. His current values give him plenty of headroom. His white cell count at 4.59 is within range, with a balanced differential. Neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within their respective ranges. The neutrophil to lymphocyte ratio at 1.51 is within the optimal band.\n\nHis MPV, mean platelet volume, a measure of the average size of his platelets, is 11.5 fL, above the upper limit of 10.1. Larger platelets are younger and more metabolically active. A raised MPV in isolation, with a normal platelet count of 201 and no other haematological abnormality, is almost always a normal variant and is commonly seen in fit, young men. It is not a concern. His reticulocyte percentage at 0.86 is within range, but the absolute reticulocyte count at 42.14 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. At this margin, with haemoglobin and red cell count both healthy, the bone marrow is producing enough red cells to maintain a normal blood count and the absolute number is only fractionally low. This is worth noting but does not suggest a production problem.\n\nHis iron studies are in good order. Ferritin at 257 is within the laboratory range and within the optimal band for a man of 50 to 200 on the tighter scale; at 257, it is above the optimal ceiling and approaching the upper end. Serum iron at 22.9, transferrin at 2.18, TIBC at 50.9, and transferrin saturation at 41.83% are all within range, with the saturation sitting at the top of the optimal band of 25 to 40%. The iron picture is replete and healthy. He does not need iron supplementation.\n\nHis vitamin D is above 375 nmol/L, which is supraphysiological. This is clearly driven by his 5,000 IU daily supplementation. While vitamin D toxicity is rare and usually requires sustained levels well above 375, there is no benefit to levels this high, and some evidence suggests that very high vitamin D may increase calcium absorption to the point where it affects the parathyroid axis. His PTH, parathyroid hormone, which regulates calcium and phosphate balance, is 0.668 pmol/L, below the lower limit of 0.98. PTH and vitamin D have an inverse relationship: when vitamin D is very high, calcium absorption increases, ionised calcium rises, and the parathyroid glands suppress PTH production because the body no longer needs PTH to maintain calcium levels. His corrected calcium at 2.48 is within the healthy range, and phosphate at 1.5 is within range, so the suppressed PTH has not caused any mineral imbalance. The solution is straightforward: reduce the vitamin D dose from 5,000 IU to 2,000 IU daily, retest in three months, and aim for a level between 75 and 120 nmol/L, which is the range associated with the best outcomes without suppressing the parathyroid axis. His B12 at 1,633 pg/mL is well above the upper limit of 982, which is expected given his supplementation. Excess B12 is water-soluble and excreted by the kidneys, so this is not harmful. Folate at 14 is within the optimal range.\n\nHis magnesium at 0.82 is within the laboratory range of 0.53 to 1.11 but below the optimal floor of 0.85. Given his training volume and intensity, magnesium demand is high, and his 450 mg supplement is appropriate. Corrected calcium at 2.48 and phosphate at 1.5 are both healthy.\n\nHis immunoglobulins, IgG at 12.9, IgM at 0.9, and IgA at 2.7, are all within their respective ranges, indicating a healthy immune system. Rheumatoid factor is below 4, negative, and tissue transglutaminase IgA is negative at 0.664, ruling out coeliac disease. Total antioxidant activity at 1.62 is within range and reflects the benefit of his supplement stack and vegetable intake. PSA at 0.24 is very low, with a free PSA ratio of 0.417, both completely reassuring. CEA at 0.5 and CA19-9 below 1.2 are both well within range. His urinalysis is clean, with no protein, glucose, blood, white cells or nitrites.\n\nHis PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 27.9 years against a calendar age of 34, placing him 6.1 years younger biologically. This is an excellent result and reflects the combined effect of his training, diet, low inflammation and healthy metabolic markers.\n\nHis creatine kinase at 515 U/L is above the upper limit of 320. Creatine kinase, often shortened to CK, is an enzyme released from muscle cells during and after exercise. In a man training five or more resistance sessions a week at very hard intensity, a CK of 515 is entirely expected and is a measure of training load rather than muscle damage. It does not need treatment or investigation.\n\nTo summarise the key actions: the oestradiol at 197 is the finding that explains his symptoms and needs to go to his prescribing clinician. The vitamin D at above 375 is harmless at present but should be reduced to 2,000 IU daily to bring the level into the 75 to 120 range and allow PTH to recover. If he transitions to TRT, a baseline of haematocrit 0.418, haemoglobin 143, PSA 0.24 and the full lipid panel documented here gives him an excellent reference set to track any drift.","links":"The central thread of this report is the interplay between his hormonal therapy and the symptoms that brought him here. The hCG and enclomiphene combination has successfully raised his total testosterone from a baseline of 14 to 15 nmol/L to 32.5, with free testosterone and bioavailable testosterone both well above their optimal ranges. SHBG has not risen, so the extra testosterone is genuinely available to tissues. On paper, the hormonal therapy has done exactly what it was designed to do.\n\nThe problem is oestradiol. At 197 pmol/L, it sits 35% above the male upper limit. Testosterone is the substrate for aromatase, the enzyme that produces oestradiol, and the more testosterone circulating, the more oestradiol is produced. HCG in particular is known to drive intratesticular aromatase activity independently of peripheral adipose tissue. This means that the very therapy raising his testosterone is also raising his oestradiol, and oestradiol at this level produces fatigue, brain fog, reduced libido and poor recovery, the exact symptoms he reports. The timeline fits too: he felt better initially when testosterone rose and oestradiol had not yet climbed proportionally, and then the symptoms returned as oestradiol caught up over the following months.\n\nWhat the report rules out is equally important. His thyroid is working well, with TSH, FT4 and FT3 all in a healthy position and both antibodies negative, so the fatigue is not thyroid-driven. His iron stores are replete, haemoglobin is solid, and there is no anaemia. His fasting glucose, HbA1c and insulin all point to exceptional insulin sensitivity, so blood sugar crashes are not behind the afternoon slump. His cortisol is healthy, his CRP is undetectable, and there is no inflammatory process. His B12 and folate are both well supplied. The bloods have systematically excluded the common metabolic causes of fatigue and brain fog, leaving the oestradiol as the most plausible explanation.\n\nThe vitamin D and PTH finding is a separate story. His vitamin D above 375 is driving PTH suppression to 0.668, below the lower limit. This is a physiological feedback response, not a parathyroid gland problem: the glands are working correctly by turning down PTH when calcium absorption is already high. Calcium and phosphate remain normal, so no harm has been done, but restoring PTH to its working range by reducing vitamin D intake is the right move.\n\nThe elevated creatinine and apparently reduced creatinine-based eGFR of 73 is the kind of finding that could cause unnecessary alarm. The cystatin C eGFR of 94 confirms the kidneys are healthy and the creatinine is simply reflecting his creatine intake and muscle mass. This is a textbook example of why cystatin C is included in the panel. The mildly raised lipase with a normal amylase, no symptoms and undetectable CRP is an incidental finding that does not fit into a clinical pattern. The low absolute reticulocyte count is marginal and does not connect to the other findings given normal haemoglobin and iron stores.\n\nThe cardiovascular picture, particularly in the context of a family history of premature cardiovascular events, is the strongest positive in the report. Every lipid marker, every inflammatory marker, and the inherited Lp(a) risk factor are either ideal or close to it. Whatever he decides about his hormonal therapy going forward, this baseline confirms that his cardiovascular risk profile at 34 is excellent.","lifestyle":"Continue the current training split and step count. Five-plus resistance sessions at high intensity with two cardio sessions and 7,500 to 10,000 steps is an excellent foundation. The bloods confirm the body is handling this load well, with CRP undetectable, CK elevated only from training, and metabolic markers in excellent shape.\nReduce vitamin D from 5,000 IU to 2,000 IU daily, taken with a fat-containing meal. Why: your level is above 375, which has suppressed your parathyroid hormone to 0.668 below its lower limit of 0.98. The goal is 75 to 120 nmol/L, which maintains the bone and immune benefits without disrupting the calcium feedback loop.\nKeep the omega-3 at 2 to 4 g EPA plus DHA daily. Your triglycerides at 0.39, CRP below 0.2 and lipid profile are all exceptional, and the omega-3 is likely contributing.\nKeep magnesium at 450 mg in the evening before bed. Your serum magnesium at 0.82 is just below the optimal floor of 0.85. At your training volume, demand is high and this dose is appropriate. Anchor: take it as part of your evening wind-down.\nConsider adding 4 to 5 portions of oily fish per week (salmon, mackerel, sardines) alongside the supplement, as whole-food sources provide additional selenium and vitamin D that the lower supplement dose will no longer cover as heavily.\nAddress the afternoon crash with meal timing. You eat 5 to 6 meals a day which is good, but if the largest carbohydrate-containing meal falls at lunch, move some of those carbohydrates to the post-training meal instead. Anchor: post-training meal becomes the carbohydrate-rich meal of the day. Why: spreading carbohydrate load around training windows rather than concentrating it midday can reduce the post-meal insulin response that, even at your low insulin levels, may trigger the afternoon energy dip.\nMaintain protein at 200 to 220 g daily across 5 to 6 meals. At 98 kg and your training intensity, this gives you approximately 2.0 to 2.2 g per kg, which is at the top of the evidence-based range for muscle building and recovery. Your calorie target for maintenance at this activity level is approximately 3,050 to 3,200 kcal per day (BMR of roughly 1,960 multiplied by an activity factor of 1.6 for very active). If the goal is to build muscle with minimal fat gain, aim for 3,200 to 3,400 kcal.\nPrioritise the morning light exposure to help the slow-to-get-going feeling. Anchor: within 30 minutes of waking, get outside or to a bright window for 10 to 15 minutes. Why: morning light anchors the circadian cortisol rise that sets energy for the first half of the day. Your cortisol at 423 is healthy, but the timing of the peak matters as much as the level.","flags":"Oestradiol 197 pmol/L, above the male upper limit of 146.1. This is the most clinically relevant finding in the report. Elevated oestradiol secondary to aromatisation of supra-physiological testosterone is the most likely explanation for his brain fog, fatigue, poor recovery and low libido. Requires discussion with his prescribing clinician regarding dose adjustment, the role of hCG in driving aromatase, and whether an aromatase inhibitor or protocol change is warranted.\nTestosterone 32.5 nmol/L, above the upper limit of 28.7, with free testosterone 0.748 nmol/L and bioavailable testosterone 15.98 nmol/L both elevated. Confirms the hCG and enclomiphene protocol is producing a supra-physiological response. Not harmful in isolation but is driving the oestradiol elevation. Baseline documented for comparison if transitioning to TRT.\nVitamin D above 375 nmol/L with PTH suppressed to 0.668 pmol/L (lower limit 0.98). The supraphysiological vitamin D is suppressing parathyroid hormone through the normal calcium feedback mechanism. Corrected calcium at 2.48 and phosphate at 1.5 are within range, so no harm has occurred. Reduce supplementation to 2,000 IU daily and retest in three months.\nFasting insulin 1.67 mIU/L, below the lower limit of 2.6, with HOMA-IR 0.29. This reflects exceptional insulin sensitivity in a lean, heavily training individual on a clean diet. Glucose at 3.9 and HbA1c at 34 are both excellent. This is a favourable finding, not a pancreatic insufficiency.\nCreatinine 112 umol/L, above the upper limit of 104, with creatinine-based eGFR 73. Cystatin C 0.84 mg/L and cystatin C-based eGFR 94 confirm normal kidney function. The elevated creatinine is driven by creatine supplementation at 5 to 10 g daily and high muscle mass.\nLipase 87 U/L, above the upper limit of 60, with amylase 91 within range. In the absence of abdominal symptoms, normal amylase and undetectable CRP, this is most likely related to high-fat dietary intake or creatine supplementation. Worth noting for the GP record.\nMPV 11.5 fL, above the upper limit of 10.1. Isolated finding with normal platelet count of 201. Common normal variant in young, fit men. No clinical significance.\nReticulocyte absolute count 42.14, marginally below the lower limit of 50, with reticulocyte percentage 0.86% within range. Haemoglobin and red cell count are normal. Marginal finding, not indicative of a production deficit.\nCracking kinase 515 U/L, above the upper limit of 320. Expected in a man training resistance five or more times per week at very hard intensity. Training marker, not pathology.\nESR 12 mm/hour, at the upper boundary of the reference range. With CRP below 0.2, this is likely exercise-related and does not indicate systemic inflammation.\nReassuring negatives: lipid profile excellent with ApoB 0.43 and Lp(a) below 25; cardiovascular risk score 0 out of 100; thyroid function optimal with negative antibodies; liver healthy with ALT 22, GGT 27, APRI 0.41 and NAFLD score minus 1.5; kidney function confirmed normal by cystatin C eGFR 94; HbA1c 34; CRP below 0.2; ferritin 257 with iron studies balanced; PSA 0.24; coeliac screen negative; immunoglobulins normal; urinalysis clean; PhenoAge 27.9 years, 6.1 years below calendar age.\nNot reported on this occasion: C-Peptide, IgE, Bacterial Count, Urine Culture and Sensitivities.","recommendations":"Discuss the oestradiol level of 197 pmol/L with your prescribing clinician. Bring the testosterone of 32.5, SHBG of 38.6, free testosterone of 0.748, LH of 2.46, FSH of 4.76 and oestradiol of 197. The conversation should cover whether to reduce the hCG dose, whether a low-dose aromatase inhibitor is appropriate, or whether to transition to TRT at a dose targeting testosterone in the 20 to 25 nmol/L range to reduce aromatisation.\nIf transitioning to TRT, request haematocrit, haemoglobin, PSA and a lipid panel at 6 to 8 weeks, then every 3 to 6 months for the first year. Your baseline haematocrit is 0.418 and PSA is 0.24, both with plenty of headroom.\nMention the lipase of 87 to your GP for a note on the record. No investigation is needed at present given normal amylase, no symptoms and undetectable CRP, but it provides context if the value appears on a future test.\nReduce vitamin D supplementation from 5,000 IU to 2,000 IU daily. Retest vitamin D and PTH in 3 months to confirm the level has come into the 75 to 120 nmol/L range and PTH has recovered above 0.98.\nGiven the family history of premature cardiovascular disease, share the lipid results with your GP so they are on file: ApoB 0.43, LDL 1.25, HDL 1.4, triglycerides 0.39, Lp(a) below 25. These are excellent and confirm low inherited and modifiable cardiovascular risk.\nRetest in 3 to 4 months with: testosterone, free testosterone, SHBG, oestradiol, LH, FSH, haematocrit, haemoglobin, PSA, vitamin D, PTH, lipid panel and liver function. If transitioning to TRT, time the blood draw at trough, immediately before the next injection. Calorie target: 3,200 to 3,400 kcal daily for lean mass gain. Protein target: 200 to 220 g daily (2.0 to 2.2 g per kg), which he is already achieving.","supplementation":"Vitamin D3 cholecalciferol: reduce from 5,000 IU to 2,000 IU daily, taken with a fat-containing meal. Why: your level is above 375 nmol/L and has suppressed PTH to 0.668. The target is 75 to 120 nmol/L.\nVitamin K2 MK-7: 100 to 200 mcg daily, taken alongside the vitamin D. Why: K2 directs calcium into bone rather than soft tissue and is a standard companion to vitamin D supplementation.\nMagnesium glycinate: continue at 400 to 450 mg in the evening before bed. Why: your serum magnesium at 0.82 is just below the optimal floor of 0.85, and at your training volume demand is high. Glycinate is the best-absorbed form and supports sleep quality.\nOmega-3 fish oil: continue at 2 to 4 g EPA plus DHA daily, ideally split between two meals. Why: your triglycerides at 0.39 and CRP below 0.2 suggest this is contributing to an excellent cardiovascular and inflammatory profile.\nZinc picolinate: continue at 30 mg daily, taken with food. Why: zinc supports testosterone production and immune function. At this dose alongside a multivitamin, monitor for copper depletion on future tests if zinc is continued long-term.\nCreatine monohydrate: continue at 5 g daily. The higher dose of 10 g offers no additional benefit for muscle performance and will further elevate creatinine, making kidney monitoring via creatinine-based eGFR unreliable. A consistent 5 g is sufficient.\nBoron: continue at current dose. Boron may support free testosterone by modestly reducing SHBG, although the evidence is modest. At your current SHBG of 38.6 this is not a priority, but it is not harmful.\nDo not take iron supplements. Your ferritin is 257 with a transferrin saturation of 41.83%, meaning iron stores are fully replete. Additional iron could push stores toward overload.\nB12: your level is 1,633, well above range from supplementation. Consider reducing to a maintenance dose of 500 mcg sublingual methylcobalamin every other day rather than daily, or relying on dietary intake and the multivitamin alone.\nThe most important changes from this report are not supplements. They are addressing the oestradiol level with your prescribing clinician and reducing the vitamin D dose to allow your parathyroid hormone to recover.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 58.9. Weakest systems: vitamins & nutrients 3%, digestive 7%, specialized tests 7%. Biggest drags: Vitamin B12, MPV, Reticulocytes Absolute, Creatinine.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3577","lower_normal":"","upper_normal":"39","lower_optimal":"","upper_optimal":"34","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4359","units":"years","description":"PhenoAge is a biological ageing estimate developed from clinical biomarkers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. His PhenoAge of 27.9 against a calendar age of 34 places him 6.1 years biologically younger. The main drivers are his undetectable CRP, excellent glucose control and healthy albumin. This is an excellent result and reflects the cumulative benefit of his training, diet and healthy lifestyle.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built rather than the ten-year probability of an event. His score is 0, as clean as it gets, driven by excellent values across every input: ApoB 0.43, LDL 1.25, HDL 1.4, triglycerides 0.39, Lp(a) below 25, CRP below 0.2 and HbA1c 34. Given his family history of premature cardiovascular disease, this is the single most reassuring finding in the report.","low_causes":"Excellent lipid, inflammatory and metabolic profile","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GL normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"7.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6133","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/l","description":"Urea is a waste product formed when the liver breaks down protein, filtered out by the kidneys. His result of 7.5 is within the laboratory range but above the optimal ceiling of 7.0. At a protein intake of 200 to 220 g daily, a urea at the upper end of range is entirely expected and reflects normal protein metabolism rather than kidney strain. His cystatin C eGFR of 94 confirms normal kidney clearance.","low_causes":"Low-protein diet, liver disease, overhydration","high_causes":"High-protein diet, dehydration, kidney impairment, GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"112","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7359","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6410","units":"umol/l","description":"Creatinine is a waste product of creatine metabolism in muscle, filtered by the kidneys. His result of 112 is above the laboratory upper limit of 104. However, he takes 5 to 10 g of creatine daily and has significant muscle mass from 16 years of weight training, both of which raise creatinine independently of kidney function. His cystatin C, which is unaffected by muscle mass or creatine supplementation, is 0.84 with an eGFR of 94, confirming his kidneys are working normally. The creatinine is a supplement and physique artefact, not a sign of kidney disease."," ine-based eGFR of 73 is an artefact.","low_causes":"Kidney disease, inflammation, thyroid dysfunction","high_causes":"Corticosteroid use, hyperthyroidism","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ua","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"224","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3373","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5162","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines found in certain foods and in the body's own cells. His result of 224 is at the lower end of the laboratory range and within the optimal band of 200 to 380 for a man. Low uric acid at this level is healthy and indicates efficient kidney clearance with no risk of gout or urate deposition.","low_causes":"Low purine diet, medications, liver disease","high_causes":"High purine diet, dehydration, kidney disease, gout, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cyc","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3818","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced by all nucleated cells in the body at a constant rate and filtered by the kidneys. Unlike creatinine, its level is not affected by muscle mass, diet, exercise or creatine supplementation, making it the gold-standard kidney marker for active individuals. His result of 0.84 is well within the healthy range and confirms that his kidneys are functioning normally.","low_causes":"Normal variation","high_causes":"Kidney disease, inflammation, thyroid dysfunction, corticosteroid use","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C to produce the most accurate estimate of kidney filtration rate. His result of 94 is within the optimal range of above 90, confirming healthy kidney function. The combined calculation corrects for the creatinine elevation caused by his creatine supplementation and muscle mass.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4833","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between different causes of elevated urea or creatinine. His result of 67 is within the healthy and optimal ranges, consistent with a high-protein diet and creatine use without any sign of pre-renal or post-renal pathology.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","resul
