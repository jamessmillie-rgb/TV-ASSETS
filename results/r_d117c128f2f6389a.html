<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kenan Arif","dob":"04/11/1988","report_date":"2026-11-10","summary":"Patient is a 38-year-old male presenting with a BMI of 27.4, following a standard mixed diet rated 5 out of 10 for quality with a volume of 7 out of 10. He trains once per week with cardio only and no resistance training, averaging 7,500 to 10,000 daily steps. He consumes more than 7 alcoholic drinks per week and reports overuse of caffeine or energy drinks. He reports weight gain and difficulty losing weight, hair thinning and hair loss, and joint pain and stiffness. His goals are to improve long-term health and longevity, prevent disease, and lose body fat. He has provided important additional context: he sometimes experiences discomfort, pins and needles, and a warm sensation in his left arm, alongside mild musculoskeletal pain on the left side of his chest, likely intercostal in origin. He has had multiple cardiac investigations including ECG, bloodwork, and blood pressure checks, all of which have come back normal. He notes the symptoms are likely nerve-related but understandably cause him anxiety given their location.\n\nThe most reassuring place to start is his heart. His cardiac markers are clean. His troponin was not part of this panel, but hsCRP, which measures systemic inflammation including vascular inflammation, is at 3.3, which we will come back to, and his lipid ratios tell a nuanced story, but there is nothing here that points to an acute cardiac problem. His blood pressure has been checked and is fine, his ECG is fine. The left arm symptoms he describes, pins and needles with a warm sensation, are consistent with a nerve irritation pattern, possibly from the thoracic outlet or cervical spine, and the intercostal discomfort on the left chest wall fits a musculoskeletal origin. None of his blood results contradict the reassurance he has already received from his cardiac investigations.\n\nHis thyroid is working well. TSH at 0.98 is within the laboratory range and just a fraction below the ideal lower bound of 1.0, Free T4 at 18.1 is comfortably within the optimal window, Free T3 at 5.6 is in excellent territory, and both thyroid antibodies are negative. His thyroid is not contributing to his weight difficulty or hair thinning. His testosterone is strong at 24.2, well within the optimal range for a 38-year-old male, and his free testosterone at 0.59 is healthy. SHBG at 27.1 is at the lower end of the reference range but is keeping enough testosterone bioavailable, with a bioavailable testosterone of 14.14 sitting comfortably in the ideal band. DHEA-S at 8.4 umol/L is robust. LH and FSH are both within range, and prolactin at 182 is unremarkable. His cortisol at 179 is within the expected afternoon window and is not a concern. His prostate screen is clean, with a PSA of 0.56, well below the 2.5 threshold, and a free PSA ratio of 26.8%, which is reassuring.\n\nHis blood sugar control is in good shape. HbA1c at 34 mmol/mol is within the optimal range, meaning his average blood sugar over the past three months has been well controlled. Insulin at 10.71 is within the laboratory range. C-Peptide at 1.35 ug/L is within range and confirms the pancreas is producing insulin appropriately. His kidney electrolytes are balanced, with sodium at 140, chloride at 97, bicarbonate at 29.1, and potassium at 5.0, all within range. Calcium at 2.55 and corrected calcium at 2.5 are both healthy, and his parathyroid hormone at 1.6 is appropriately low in response to adequate calcium levels. Magnesium at 0.87 sits within the optimal band. His uric acid at 359 is within the ideal range for a male. His immune markers are largely unremarkable: IgG at 14.3, IgA at 1.5, and IgE at 55.8 are all within range, and rheumatoid factor is negative at less than 4, which is relevant given his joint pain. The coeliac screen is negative. His tumour markers, CA19-9 and CEA, are both undetectable. His urinalysis is entirely clean: no protein, no glucose, no blood, no white cells, no nitrites, and insignificant bacterial growth.\n\nHis B12 at 747 is in excellent territory, well within the optimal range of 500 to 900. Folate at 14 is healthy. Vitamin D at 79 is sufficient and sits just inside the optimal range of 75 to 120, though at his weight there is room to push it higher because adipose tissue sequesters vitamin D, meaning the circulating level underestimates what a leaner person would achieve on the same intake. His iron studies are balanced: ferritin at 242 is within the laboratory range but above the optimal ceiling of 200 for a male, well within the laboratory range and not a concern at this level. Transferrin saturation at 43.7% is within range, serum iron at 26.9 is healthy, and transferrin at 2.45 and iron binding capacity at 54.5 are both within range.\n\nHis PhenoAge is 34.2 against a calendar age of 38, meaning his biological age as estimated from his blood markers is nearly four years younger than his actual age. This is a genuinely positive finding. The markers driving it in the right direction are his healthy albumin, low white cell count (within range), and well-controlled HbA1c. The one thing pulling it in the wrong direction is the hsCRP at 3.3, and improving that alone would widen the gap further.\n\nNow to the findings that need attention. His Cardiovascular Risk Score is 60 out of 100, which is above the ideal threshold of 20 and above the acceptable threshold of 40. This score is not a ten-year event risk; it measures the cardiovascular risk being built right now, and at 38 the window for changing it is wide. The inputs driving it are his ApoB at 1.05, his LDL at 3.11, and his hsCRP at 3.3. The context matters here, because alongside those three numbers sit some genuinely strong protective markers: his HDL at 1.9 is excellent, well above the 1.4 optimal threshold for a male, his ApoB to ApoA1 ratio at 0.64 is below the 0.7 lower-risk threshold, his triglycerides at 1.48 are within the desirable range, and his Lp(a) is less than 25, which is ideal and means his elevated LDL is driven entirely by modifiable factors rather than genetics. His Lp(a)-corrected LDL is 3.03, confirming that virtually all of his LDL is the modifiable, lifestyle-driven type.\n\nApoB, or apolipoprotein B, is arguably the single most important cardiovascular marker. Each potentially harmful lipoprotein particle, whether it carries LDL cholesterol, VLDL, or Lp(a), has exactly one ApoB molecule on its surface, so the ApoB count tells you how many of those particles are circulating. His is 1.05, above the 0.9 desirable threshold and into the borderline-high category. His LDL at 3.11 is marginally above the 3.0 upper limit. Together, these mean he has more atherogenic particles than ideal, and over years those particles deposit cholesterol in artery walls. The good news is that at 38, with an excellent HDL, low Lp(a), and a favourable ApoB/A1 ratio, this is a modifiable pattern. The levers are diet, body composition, and alcohol.\n\nHis hsCRP at 3.3 is the second finding that matters. High-sensitivity C-reactive protein is a measure of systemic, low-grade inflammation. Below 1.0 is ideal, 1.0 to 3.0 is average risk, and above 3.0 is higher risk. At 3.3, his is just above that higher-risk threshold. In a 38-year-old male with a BMI of 27.4, more than 7 drinks per week, and no resistance training, the most likely drivers are excess body fat (visceral fat is metabolically active and produces inflammatory cytokines), alcohol (which promotes liver-mediated inflammation even when liver enzymes look largely clean), and the absence of resistance training (which is anti-inflammatory over time). The hsCRP is relevant to his joint pain and stiffness too: systemic inflammation amplifies the perception of musculoskeletal discomfort, and bringing that number below 1.0 could make a noticeable difference to how his joints feel.\n\nHis ALT at 82 is the most notable liver finding. ALT, or alanine aminotransferase, is an enzyme concentrated in liver cells; when those cells are stressed or damaged, ALT leaks into the bloodstream. The upper limit of the laboratory range is 56, and his is significantly above that. His AST at 39 is within range, giving a De Ritis ratio (AST divided by ALT) of 0.48, which is below the normal range of 0.6 to 1.6. An inverted De Ritis ratio, where ALT is much higher than AST, is characteristic of metabolic or fatty liver rather than alcoholic liver disease (where AST tends to be higher than ALT). His GGT at 23 is well within the ideal range below 25, which is further evidence against alcohol-driven damage, because GGT is the marker that rises first with regular alcohol exposure. His FIB-4 score at 0.79 and APRI at 0.47 both make significant fibrosis (scarring) very unlikely, and his NAFLD Fibrosis Score at minus 2.83 sits comfortably in the low-risk zone. His bilirubin, albumin, and alkaline phosphatase are all normal. Put together, the picture is a liver under metabolic strain, likely from a combination of excess body fat (particularly visceral fat at a BMI of 27.4), a diet rated 5 out of 10, and alcohol above 7 drinks per week, but without any sign of scarring or progressive damage. This is reversible with weight loss, dietary improvement, and reducing alcohol.\n\nHis oestradiol at 163 is above the upper limit of 146.1 for a male. Oestradiol is the primary oestrogen, and in men it is produced mainly by an enzyme called aromatase, which converts testosterone into oestradiol. Aromatase is concentrated in adipose tissue, so at a BMI of 27.4 with some excess body fat, increased aromatase activity is the most likely explanation. His testosterone is still strong at 24.2, so the elevated oestradiol is not suppressing testosterone production, but over time a rising oestradiol can contribute to further fat deposition (particularly around the chest and abdomen), water retention, and potentially to the hair changes he is experiencing. Reducing body fat is the most effective way to lower oestradiol because it reduces the amount of aromatase available.\n\nHis Cystatin C at 1.11 is marginally above the upper limit of 1.1. Cystatin C is a protein produced at a constant rate by all nucleated cells, and because it is freely filtered by the kidneys and not affected by muscle mass (unlike creatinine), it gives a more accurate picture of kidney filtration. His creatinine-based eGFR is above 90, but his Cystatin C-based eGFR is 83, and the combined eGFR is 83. An eGFR of 83 at 38 is below the optimal threshold of 90 and suggests his kidney filtration is mildly reduced for his age. This is not an alarming finding, but it is worth noting and monitoring. The most likely contributors are his elevated hsCRP (chronic low-grade inflammation affects renal microvasculature over time), his body composition, and possibly his caffeine intake and hydration patterns. This is worth mentioning to his GP, and it is a marker that should appear on his next retest to establish whether it is stable or trending.\n\nHis creatine kinase at 468 is above the upper limit of 320. CK is an enzyme found in skeletal muscle, cardiac muscle, and brain. When muscle fibres are damaged or stressed, CK leaks into the blood. Given that his cardiac investigations have been normal, this is almost certainly skeletal muscle in origin. Even without resistance training, a single session of vigorous cardio, carrying heavy objects, or even sleeping awkwardly on a limb can elevate CK for several days. If he exercised within 48 to 72 hours before the blood draw, that is the most likely explanation. It is worth repeating on a sample taken after 72 hours of rest to confirm it settles.\n\nHis IgM at 0.4 is marginally below the lower limit of 0.5. IgM is the first antibody the immune system produces in response to a new infection. A mildly low IgM in isolation, with IgG and IgA both healthy, is rarely significant and is most commonly a normal variant. It does not indicate immunodeficiency. It is worth noting for his records but does not require investigation unless he experiences unusually frequent or severe infections.\n\nHis total antioxidant activity at 2.2 is above the upper limit of 1.77. This marker measures the overall capacity of the blood to neutralise free radicals. An elevated result is typically driven by supplementation (particularly vitamins C and E, polyphenol-rich foods, or antioxidant supplements) or by a diet rich in colourful vegetables, fruits, tea, and coffee. Given his caffeine intake, coffee and energy drinks are rich in polyphenols and could easily account for this. It is not a concern.\n\nHis MCHC at 346 is marginally above the upper limit of 345. MCHC measures the average concentration of haemoglobin inside each red blood cell. At one point above the limit, this is within the margin of laboratory variation and is not clinically significant. His absolute reticulocyte count at 40.7 is below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow. A mildly low count with a normal percentage (0.84%) and healthy haemoglobin (151), MCV, and iron stores simply means the bone marrow is not being asked to produce red cells at a high rate, because there is no anaemia, no blood loss, and no increased destruction. This is not a concern.\n\nHis hair thinning is worth addressing directly. His thyroid is working well, his iron stores are adequate, his testosterone is strong, and his B12 and folate are healthy, so the common blood-driven causes of hair loss are not present here. In a 38-year-old male with good testosterone and a low SHBG of 27.1, the most likely explanation is androgenetic alopecia, which is male pattern hair loss driven by the conversion of testosterone to dihydrotestosterone (DHT) at the hair follicle. This is genetic and not something blood tests diagnose, but the hormonal profile is consistent with it. His elevated oestradiol could also play a minor role. If the hair loss is a priority, a conversation with his GP or a dermatologist about DHT-blocking treatments would be the next step.\n\nHis joint pain and stiffness, with a negative rheumatoid factor and negative coeliac screen, are unlikely to be autoimmune or inflammatory arthritis in origin. His hsCRP at 3.3 suggests low-grade systemic inflammation, which amplifies joint discomfort. At 97 kg with no resistance training, his joints are bearing load without the muscular support that resistance work provides. Reducing body fat, starting resistance training (which strengthens the muscles around joints and reduces the load on cartilage), and bringing the hsCRP down are the most effective approaches.\n\nOverall, this is a report with strong foundations. His thyroid, testosterone, blood sugar control, kidney electrolytes, immune system, B12, folate, and prostate are all in good health, and his PhenoAge is nearly four years younger than his calendar age. The areas that need work are interconnected: excess body fat is driving the elevated ALT, the raised oestradiol, and contributing to the hsCRP. His ApoB and LDL are above target but are entirely modifiable given his ideal Lp(a). The plan is straightforward: improve diet quality, reduce alcohol, lose body fat, and add resistance training. These four changes will improve nearly every flagged marker on this report.","links":"The thread running through this report is body composition and its downstream effects. At a BMI of 27.4, with a diet rated 5 out of 10 for quality and more than 7 alcoholic drinks per week, the excess adipose tissue is the engine behind most of the flagged findings. Visceral fat produces inflammatory cytokines that raise hsCRP, it houses the aromatase enzyme that converts testosterone to oestradiol, and it creates the metabolic load on the liver that is pushing ALT to 82.\n\nThe lipid picture is more nuanced than a simple \"cholesterol is high\" story. His HDL at 1.9 is genuinely protective, his Lp(a) is ideal, and his ApoB/A1 ratio is in the lower-risk zone. But his ApoB at 1.05 and LDL at 3.11 mean there are more atherogenic particles circulating than there should be, and the hsCRP at 3.3 means those particles are operating in an inflammatory environment, which accelerates the rate at which they deposit into artery walls. This is why the Cardiovascular Risk Score lands at 60: the combination of raised ApoB, raised LDL, and raised hsCRP is worse than any one of them alone. The fact that Lp(a) is ideal is the silver lining, because it confirms the entire lipid picture is modifiable.\n\nThe liver tells a consistent story. ALT at 82 with a clean GGT at 23 and an inverted De Ritis ratio of 0.48 points to metabolic (fatty) liver rather than alcohol-driven damage. The fibrosis scores are all reassuring, so there is no scarring, but the ALT is high enough to confirm the liver is under real strain. Weight loss is the single most effective intervention for metabolic fatty liver; even a 5 to 7% reduction in body weight (roughly 5 to 7 kg) is associated with significant improvements in liver enzymes and hepatic fat content.\n\nThe Cystatin C at 1.11 and combined eGFR of 83 are the one finding that does not fit neatly into the body composition story, though chronic low-grade inflammation and excess weight do affect renal microvasculature over time. At 38, an eGFR of 83 is mildly below where it should be and is worth monitoring. Hydration, caffeine intake (which is a mild diuretic), and the metabolic burden from excess weight are all plausible contributors. If the hsCRP comes down and body composition improves, the eGFR should be repeated to see whether it tracks upward.\n\nWhat has been excluded is important. His thyroid is not the cause of his weight difficulty or hair thinning. Autoimmune conditions including rheumatoid arthritis and coeliac disease are unlikely given negative rheumatoid factor and negative tTG antibodies. His testosterone is strong and his blood sugar control is good, so hormonal and metabolic causes of weight gain are not present. The weight difficulty is most likely the straightforward result of calorie intake exceeding expenditure, with a diet rated 5 out of 10 and alcohol adding significant untracked calories.\n\nThe creatine kinase at 468 is the loose end. It is almost certainly muscular in origin given his clean cardiac history, but it is worth repeating after 72 hours of rest to confirm it normalises. If it remains elevated without an exercise explanation, his GP should be aware.","lifestyle":"Start two resistance training sessions per week, even 30 minutes each. Bodyweight exercises, dumbbells, or machines all count. Anchor: pick two fixed days and treat them like appointments. Why: resistance training is the single most effective intervention for joint pain (it strengthens the muscles supporting the joints), it lowers hsCRP, it improves insulin sensitivity, it raises metabolic rate, and it preserves muscle mass during weight loss. Every flagged marker on this report improves with resistance training.\nAim for a calorie intake of approximately 2,000 to 2,200 kcal per day. At 97 kg with a goal of fat loss, this creates a moderate deficit of around 300 to 500 kcal below your estimated maintenance of approximately 2,500 kcal. A target weight range of 82 to 88 kg would bring your BMI into the 23 to 25 range. Your protein target is 130 to 155 grams per day (1.3 to 1.6 g per kg), which protects muscle during a deficit and supports the resistance training.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, smoked salmon, or a protein shake. Anchor: protein goes on the plate first. Why: protein at 130 to 155 grams per day keeps you full, preserves muscle, and reduces the insulin demand from each meal.\nReduce alcohol to under 7 drinks per week, ideally under 4. Anchor: set a rule of no drinking on weeknights, or limit to two drinks per occasion. Why: alcohol contributes empty calories (a pint of beer is 200 to 250 kcal, a large glass of wine is 230 kcal), it raises hsCRP, it stresses the liver (your ALT is 82), and it impairs sleep quality even when it feels like it helps you fall asleep.\nReplace one ultra-processed or takeaway meal per week with a home-cooked meal built around protein, vegetables, and whole grains. Anchor: pick the meal that is easiest to swap. Why: your diet quality is rated 5 out of 10, and small consistent improvements in food quality lower ApoB and hsCRP over months.\nAdd 2 to 3 portions of oily fish per week (salmon, mackerel, sardines, trout). Anchor: swap one meat meal and add one tin of sardines on toast as a lunch. Why: the omega-3 in oily fish lowers triglycerides, reduces hsCRP, and is the most evidence-based dietary change for cardiovascular risk reduction. Your ApoB at 1.05 and hsCRP at 3.3 will both benefit.\nAdd a source of soluble fibre to your daily diet: oats at breakfast, a handful of almonds, or a tablespoon of ground flaxseed in a smoothie or on yoghurt. Anchor: add it to your first meal. Why: soluble fibre binds bile acids in the gut, forcing the liver to pull LDL cholesterol out of the blood to make more. It is one of the most effective dietary tools for lowering LDL and ApoB.\nCut caffeine intake after 1pm. Anchor: set a phone alarm at 1pm as your last caffeine window. Why: caffeine has a half-life of 5 to 6 hours, meaning a coffee at 3pm still has half its effect at 9pm. Given your overuse of caffeine, this is likely affecting sleep quality, recovery, and your hsCRP. It may also be contributing to the pins and needles and warm sensation in your left arm, as caffeine is a vasoconstrictor and nerve stimulant.","flags":"ALT at 82 IU/l, significantly above the upper limit of 56. With GGT at 23 (clean), AST at 39 (within range), an inverted De Ritis ratio of 0.48, and reassuring fibrosis scores (FIB-4 0.79, APRI 0.47, NAFLD Fibrosis Score minus 2.83), this pattern is consistent with metabolic (fatty) liver driven by excess body fat and alcohol rather than progressive liver disease. Recommend GP review, lifestyle modification, and repeat in 3 to 4 months.\nApoB at 1.05 g/L, above the desirable threshold of 0.9 (borderline high). LDL at 3.11 mmol/L, marginally above the 3.0 upper limit. Lp(a)-corrected LDL at 3.03 confirms virtually all LDL is modifiable. HDL at 1.9 is excellent and ApoB/A1 ratio at 0.64 is in the lower-risk zone. The Cardiovascular Risk Score is 60 out of 100, driven primarily by ApoB, LDL, and hsCRP. Lp(a) below 25 is ideal, confirming this lipid profile is entirely modifiable through diet, body composition, and alcohol reduction.\nhsCRP at 3.3 mg/L, above the ideal threshold of 1.0 and above the higher-risk threshold of 3.0. In the context of a BMI of 27.4, more than 7 drinks per week, and no resistance training, this likely reflects metabolic inflammation from visceral adiposity and alcohol. Worth mentioning to the GP alongside the lipid and liver findings.\nOestradiol at 163 pmol/L, above the male upper limit of 146.1. Most likely driven by increased aromatase activity in adipose tissue. Testosterone remains strong at 24.2 so this is not yet suppressing the hypothalamic-pituitary-gonadal axis, but reducing body fat should bring oestradiol back within range.\nCystatin C at 1.11 mg/L, marginally above the upper limit of 1.1. Combined eGFR of 83, below the optimal threshold of 90 for a 38-year-old. Worth mentioning to the GP and repeating at 6 months to establish a trend. Most likely contributors are chronic low-grade inflammation, excess body weight, and high caffeine intake.\nCreatine kinase at 468 U/L, above the upper limit of 320. Almost certainly skeletal muscle in origin given clean cardiac history. Worth repeating after 72 hours of complete rest. If persistently elevated without an exercise explanation, further investigation warranted.\nIgM at 0.4 g/L, marginally below the lower limit of 0.5. Isolated finding with IgG and IgA both healthy. Most likely a normal variant. No investigation needed unless recurrent or unusually severe infections develop.\nMCHC at 346 g/L, one point above the upper limit of 345. Within the margin of laboratory variation and not clinically significant. Absolute reticulocyte count at 40.7, below the lower limit of 50, with a normal reticulocyte percentage of 0.84% and healthy haemoglobin at 151. The bone marrow is not being stimulated to overproduce because there is no anaemia or blood loss; this is a normal finding.\nTotal antioxidant activity at 2.2 mmol/L, above the upper limit of 1.77. Most likely driven by high caffeine intake (coffee and energy drinks are rich in polyphenols). Not a concern.\nReassuring negatives: thyroid autoimmunity is unlikely (both antibodies negative), rheumatoid arthritis is unlikely (RF negative), coeliac disease is unlikely (tTG negative with adequate IgA), prostate pathology is unlikely (PSA 0.56 with healthy free ratio), diabetes is unlikely (HbA1c 34), significant liver fibrosis is unlikely (FIB-4 0.79, APRI 0.47), and anaemia is not present (Hb 151 with adequate iron stores).\nNot reported on this occasion: fasting glucose.","recommendations":"Discuss the ALT of 82 with your GP. Take this report showing the clean GGT, reassuring fibrosis scores, and the inverted De Ritis ratio. The GP may wish to arrange a liver ultrasound to assess for hepatic steatosis (fatty liver) and to confirm the absence of other causes. A repeat ALT in 3 to 4 months after dietary and alcohol changes will show whether the liver is responding.\nDiscuss the lipid findings with your GP, specifically the ApoB of 1.05 and LDL of 3.11. Emphasise that Lp(a) is ideal at less than 25, meaning the entire lipid profile is modifiable. The GP should assess overall cardiovascular risk including family history and blood pressure. Lifestyle modification (diet, weight loss, alcohol reduction) is the first-line approach; if ApoB remains above 0.9 after 6 months of sustained change, the GP may consider further intervention.\nMention the hsCRP of 3.3 alongside the lipid and liver findings. The GP should be aware that this is above the higher-risk threshold and is likely metabolically driven. It provides additional motivation for the lifestyle plan and is a useful tracking marker.\nMention the Cystatin C of 1.11 and combined eGFR of 83. The GP may wish to check a urine albumin-to-creatinine ratio to assess for any early kidney changes, and to repeat the Cystatin C at 6 months to confirm this is stable.\nAsk the GP about the persistently elevated CK of 468 if it was not preceded by vigorous exercise within 72 hours. If it was, no action is needed.\nIf hair thinning is a priority, ask the GP or a dermatologist about androgenetic alopecia assessment. The blood results exclude thyroid, iron, and hormonal causes; the hormonal profile (strong testosterone, low SHBG) is consistent with DHT-driven hair loss, which has effective treatments if caught early.\nCalorie target: 2,000 to 2,200 kcal per day. Protein target: 130 to 155 grams per day (1.3 to 1.6 g/kg). Weight target range: 82 to 88 kg. Retest in 4 to 6 months with: ALT, GGT, hsCRP, full lipid panel with ApoB, Cystatin C, oestradiol, and fasting glucose. These are the markers that will show the plan is working.","supplementation":"Vitamin D3 (cholecalciferol): 3,000 IU daily, taken with your largest meal (fat improves absorption). Why: your level at 79 is just inside the optimal range, but at a BMI of 27.4 adipose tissue sequesters vitamin D, so a slightly higher maintenance dose will help you hold above 75 and ideally push toward 100. At your weight, 2,000 IU may not be enough.\nVitamin K2 (MK-7): 100 mcg daily, taken alongside vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bones and teeth rather than into artery walls. Always pair with vitamin D supplementation.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides, reduces hsCRP (yours is 3.3), and is associated with improvements in ApoB-driven cardiovascular risk. Choose a high-EPA formulation for the anti-inflammatory effect. This supplements the oily fish in the diet, not replaces it.\nMagnesium glycinate: 300 mg before bed. Why: your magnesium at 0.87 is within the optimal range, but glycinate supports sleep quality, muscle recovery, and stress, all of which are relevant given your caffeine use, joint discomfort, and the absence of resistance training recovery support. Glycinate is the best-tolerated form and has a mild calming effect.\nDo not take iron supplements. Your ferritin at 242 is adequate and above the optimal ceiling of 200. Additional iron at this level risks pushing stores into the range where iron becomes pro-oxidant and pro-inflammatory, which is the opposite of what your hsCRP needs.\nThe most important changes from this report are not supplements. They are reducing alcohol to under 7 drinks per week, improving diet quality, starting resistance training twice per week, and losing 9 to 15 kg of body fat. These will move the ALT, ApoB, hsCRP, oestradiol, and Cystatin C in the right direction, and no supplement can replicate that.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 59. Weakest systems: inflammation 16%, specialized tests 19%, lipids & cardiovascular 41%. Biggest drags: Apolipoprotein B, High-Sensitivity C-Reactive Protein, ALT (Alanine Aminotransferase), Oestradiol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"34.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3977","lower_normal":"","upper_normal":"43","lower_optimal":"","upper_optimal":"38","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4419","units":"years","description":"PhenoAge is a biological age estimate derived from blood markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count. His PhenoAge of 34.2 against a calendar age of 38 means his blood markers suggest a biological age nearly four years younger. The markers pulling it in the favourable direction are his healthy albumin, well-controlled glucose (estimated average glucose from HbA1c was used in place of fasting glucose), low ALP, and healthy white cell count. The main marker pulling in the other direction is his hsCRP at 3.3. Bringing the CRP below 1.0 through the lifestyle changes recommended would widen this gap further. Note: fasting glucose was not returned by the laboratory, so the estimated average glucose from HbA1c (5.8 mmol/L) was used in its place.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP, and HbA1c. It measures the cardiovascular risk being built right now, not the ten-year chance of an event. His score of 60 is above both the ideal threshold of 20 and the acceptable threshold of 40. The three inputs driving the score are ApoB at 1.05, LDL at 3.11, and hsCRP at 3.3. His excellent HDL, ideal Lp(a), and well-controlled HbA1c are pulling the score down, but the ApoB and inflammation are pushing it up. At 38, the ten-year event risk remains low, but the gap between that and this score of 60 is the window for acting through diet, weight loss, alcohol reduction, and exercise.","low_causes":"Healthy lipids, low inflammation, good metabolic control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"242","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5778","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the protein the body uses to store iron. His level at 242 is within the laboratory range but sits above the optimal ceiling of 200 for a male. This is not a concern at this level, but it means iron stores are ample and supplementation is not needed. Ferritin can also rise with inflammation, and with his hsCRP at 3.3, a small inflammatory contribution is possible.","low_causes":"Iron deficiency, chronic blood loss, vegetarian or vegan diet, malabsorption, heavy menstruation","high_ uscle mass, high cardiac output, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.11","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5045","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all cells and freely filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet, or body size, making it a more accurate marker of kidney filtration in someone of his build. His level at 1.11 is marginally above the upper limit of 1.1, giving a Cystatin C-based eGFR of 83, which is below the optimal threshold of 90 for a 38-year-old. This suggests mildly reduced kidney filtration. The most likely contributors are chronic low-grade inflammation (hsCRP 3.3), excess body weight, and high caffeine intake. This is worth mentioning to his GP and repeating at 6 months.","low_causes":"Hyperthyroidism, corticosteroid use","high_causes":"Reduced kidney function, inflammation, obesity, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"359","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"220","upper_normal":"547","lower_optimal":"220","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4964","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, found in foods like red meat, shellfish, and alcohol. His level at 359 is within the optimal range for a male, meaning there is no excess uric acid accumulation. This is relevant ":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood. His level at 80 is at the top of the optimal range, reflecting healthy liver production and immune function.","low_causes":"Malnutrition, liver disease, kidney disease (nephrotic syndrome), malabsorption","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It transports hormones, vitamins, and drugs, and maintains fluid balance. His level at 44 is within the optimal range, confirming the liver's synthetic function is healthy.","low_causes":"Liver disease, malnutrition, kidney disease, chronic inflammation, overhydration","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulin is a group of proteins including immunoglobulins (antibodies) and transport proteins. His level at 36 is at the upper boundary of the laboratory range. This can reflect the immune system's activity level. With his IgG at ses":"Gilbert's syndrome (benign, inherited), liver disease, bile duct obstruction, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (Alanine Aminotransferase)","group":"LIVER & METABOLIC","result":"82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7321","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT is an enzyme concentrated in liver cells. When the liver is under stress or its cells are damaged, ALT leaks into the bloodstream. His level at 82 is significantly above the upper limit of 56 and well above the optimal ceiling of 30. With a clean GGT at 23, an inverted De Ritis ratio (AST:ALT of 0.48), and reassuring fibrosis scores, this pattern is most consistent with metabolic (fatty) liver driven by excess body fat and a diet rated 5 out of 10, with alcohol as a contributing factor. This is reversible with weight loss, dietary improvement, and alcohol reduction.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease (NAFLD/NASH), alcohol, medications, viral hepatitis, obesity, metabolic syndrome, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (Aspartate Aminotransferase)","group":"LIVER & METABOLIC","result":"39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6042","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5104","units":"IU/l","description":"AST is an enzyme found in the liver, heart, and muscles. His level at 39 is within the laboratory range but above the optimal ceiling of 30. Since AST is also found in muscle, the elevated CK at sis). His score at 0.79 is well below the 1.45 threshold for concern, making significant liver fibrosis unlikely. This is reassuring alongside the elevated ALT: the liver is under metabolic strain but has not developed scarring.","low_causes":"Not applicable","high_causes":"Liver fibrosis, cirrhosis, advanced liver disease, low platelets, age-driven calculation artefact","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5341","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.5985","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands. It breaks down starches. His level at 83 is within the optimal range, confirming healthy pancreatic function.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis, pancreatic insufficiency","high_causes":"Acute pancreatitis, pancreatic obstruction, mumps, kidney disease, macroamylasaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4823","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5603","units":"U/L","description":"Lipase is a digestive enzyme that breaks down fats, produced almost exclusively by the pancreas. His level at 34 is within the optimal range. Together with the healthy amylase, this confirms the pancreas is functioning well with no sign of inflammation or obstruction.","low_causes":"Chronic pancreatitis (end-stage), cystic fibrosis","high_causes":"Acu al":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7000","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is the protective HDL fraction. At 33.9%, more than a third of his total cholesterol is HDL, which is excellent and well above the 20% minimum. It confirms that the elevated total cholesterol number is significantly inflated by the protective fraction.","low_causes":"Low HDL, metabolic syndrome, obesity, inactivity","high_causes":"Healthy HDL, regular exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"mmol/l","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol fractions (LDL, VLDL, remnant). His level at 3.7 is within the laboratory range but above the optimal target of 3.0. This aligns with the ApoB and LDL findings and confirms the need for dietary and lifestyle changes to reduce the atherogenic cholesterol burden.","low_causes":"Healthy diet and lifestyle, medications (statins)","high_causes":"Diet, obesity, metabolic syndrome, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6792","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5833","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles, and its level reflects the number of protective HDL particles circulating. His level at 1.63 is well above the 1.2 threshold, consistent with his excellent HDL of 1.9. ApoA1 promotes reverse cholesterol transport, pulling cholesterol out of artery walls.","low_causes":"Metabolic syndrome, obesity, inactivity, smoking, familial deficiency","high_causes":"Regular exercise, moderate alcohol, genetics, medications","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.05","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5833","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the single most important cardiovascular risk marker. Each LDL, VLDL, and Lp(a) particle carries exactly one ApoB molecule on its surface, so the ApoB level directly counts how many atherogenic particles are circulating. His level at 1.05 is above the desirable threshold of 0.9 and in the borderline-high category (1.0 to 1.19). This means he has more atherogenic particles than ideal, and over time these deposit cholesterol into artery walls. With Lp(a) below 25, the entire ApoB load is modifiable through diet, body composition, and alcohol reduction.","low_causes":"Healthy diet and lifestyle, statin therapy, hyperthyroidism","high_causes":"Diet (saturated and trans fat), obesity, metabolic syndrome, familial hypercholesterolaemia, hypothyroidism, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.644","within_normal":"TRUE","within_optimal":"FALSE","result_position": function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
