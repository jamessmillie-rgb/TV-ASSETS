poprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"31.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4886","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), often written Lp(a), is a specialised lipoprotein particle that is entirely genetically determined. Unlike LDL or triglycerides, Lp(a) cannot be meaningfully changed by diet, exercise, or most medications. It promotes atherosclerosis, encourages blood clotting, and drives inflammation in artery walls. Elza's Lp(a) at 31.27 nmol/L is just under the 32 threshold, placing her in the normal-risk category. This is genuinely useful information because it means her elevated LDL, ApoB, and triglycerides are driven entirely by modifiable factors: weight, diet, physical activity, and insulin resistance. This result should be recorded permanently in her medical notes, and because Lp(a) is inherited, testing of first-degree relatives is not necessary in this case as her level is normal.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7688","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL (6.1 - 1.3 - 3.57 = 1.23). It represents the cholesterol carried in triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. Elza's remnant cholesterol of 1.23 is above both the normal limit of 0.8 and the optimal limit of 0.5, reflecting her significantly elevated triglycerides. As triglycerides come down through dietary changes and weight loss, remnant cholesterol will fall in parallel.","low_causes":"Low triglycerides, healthy metabolism","high_causes":"High triglycerides, insulin resistance, type 2 diabetes, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7700","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is calculated by dividing triglycerides by HDL (3.0 / 1.3 = 2.31). It is one of the best simple markers of insulin resistance and small dense LDL particles. A ratio below 0.87 is optimal, below 1.5 is normal, and above 1.5 suggests metabolic dysfunction. Elza's ratio of 2.31 is elevated and consistent with her insulin resistance picture. This ratio tends to improve rapidly with dietary changes that reduce refined carbohydrates and with increased physical activity.","low_causes":"High insulin sensitivity, low triglycerides, high HDL","high_causes":"Insulin resistance, high triglycerides, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"5.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is produced by the liver in response to inflammation anywhere in the body. Unlike the standard CRP test used to detect acute infections, the high-sensitivity version detects the low-grade chronic inflammation that drives cardiovascular disease, insulin resistance, and joint damage. Elza's hs-CRP of 5.0 is at the upper boundary of the lab range and well above the optimal ceiling of 1.0 mg/L. Multiple factors are contributing: her BMI of 35, her insulin resistance, and her rheumatoid arthritis. Elevated hs-CRP in someone with established coronary artery disease is particularly significant as it reflects ongoing vascular inflammation. Weight loss and better control of her rheumatoid arthritis would both be expected to reduce this level.","low_causes":"Low body fat, low inflammation, statin therapy, regular exercise","high_causes":"Obesity, insulin resistance, autoimmune disease, infection, cardiovascular disease, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"mm/hour","description":"The erythrocyte sedimentation rate measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling indicates more inflammation, because inflammatory proteins make red blood cells clump together and fall faster. Elza's ESR of 66 is markedly elevated against an upper limit of 12. While ESR does rise modestly with age and higher BMI, a level of 66 is well beyond what those factors alone would explain. The most likely driver is active rheumatoid arthritis, though the elevated BMI and insulin resistance are also contributing. This result warrants rheumatology review, particularly as Elza has not been seen by any clinician for two years.","low_causes":"Polycythaemia, sickle cell disease, low fibrinogen","high_causes":"Rheumatoid arthritis, other autoimmune disease, infection, malignancy, anaemia, obesity, ageing","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"136","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"133","upper_normal":"146","lower_optimal":"135","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6103","units":"mmol/L","description":"Sodium is the main electrolyte that regulates fluid balance and blood pressure. It is tightly controlled by the kidneys, and medications like ARBs and diuretics directly affect sodium handling. Elza's sodium of 136 is within both the laboratory and optimal ranges. Given that she takes both Losartan (an ARB) and a diuretic, a normal sodium is reassuring as these medications can sometimes cause sodium to drop too low.","low_causes":"Diuretics, excessive water intake, heart failure, liver disease, SIADH","high_causes":"Dehydration, excessive salt intake, Cushing's syndrome, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4259","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.6167","units":"mmol/L","description":"Potassium is essential for nerve function, muscle contraction, and heart rhythm. It is particularly important to monitor in patients taking both an ARB, which tends to raise potassium, and a diuretic, which tends to lower it. The two medications have opposing effects, and Elza's potassium at 4.0 sits in a healthy balance within both the normal and optimal ranges. This should continue to be monitored at her GP reviews.","low_causes":"Diuretics, vomiting, diarrhoea, poor dietary intake","high_causes":"ARBs, ACE inhibitors, kidney disease, potassium supplements, haemolysed sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"93","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2179","lower_normal":"95","upper_normal":"108","lower_optimal":"97","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3487","upper_optimal_position":"0.6179","units":"mmol/L","description":"Chloride is an electrolyte that works alongside sodium to maintain fluid balance, blood pressure, and acid-base equilibrium. Elza's chloride of 93 is below the lower limit of 95. Low chloride, or hypochloraemia, is a well-recognised effect of diuretic therapy, particularly loop diuretics like furosemide. The diuretic causes the kidneys to excrete more chloride than usual. Combined with her bicarbonate sitting at the lower end of its range, this is consistent with a diuretic effect rather than a separate pathology. Her GP should be aware when reviewing her medication.","low_causes":"Diuretics, vomiting, metabolic alkalosis, heart failure","high_causes":"Dehydration, kidney disease, metabolic acidosis, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"21.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3788","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3848","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is the body's main acid buffer, helping to maintain the blood's pH within a very narrow range. Elza's bicarbonate of 21.5 is within the laboratory range but below the optimal floor of 22. This mild reduction is consistent with her diuretic therapy and the low chloride seen alongside it. It is not a concern in isolation but adds context to the electrolyte picture.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, certain medications","high_causes":"Metabolic alkalosis, vomiting, diuretics, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"anion_gap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"25.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8125","lower_normal":"8","upper_normal":"16","lower_optimal":"10","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"mmol/L","description":"The anion gap is calculated as (sodium + potassium) minus (chloride + bicarbonate), giving (136 + 4) - (93 + 21.5) = 25.5. It reflects unmeasured charged particles in the blood. Elza's anion gap of 25.5 is above the upper limit of 16. However, this elevation is almost entirely driven by her low chloride from diuretic therapy. When chloride is artificially low, the calculation produces a higher gap without there necessarily being an excess of unmeasured acids. In the absence of elevated glucose, ketones, or signs of acute illness, this is most likely a diuretic-driven artefact. Her GP should be aware as part of the overall electrolyte review.","low_causes":"Low albumin, laboratory error","high_causes":"Diabetic ketoacidosis, lactic acidosis, kidney failure, toxins, diuretic-induced electrolyte shifts","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3667","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.2","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5933","units":"mmol/L","description":"Urea is a waste product formed when the body breaks down protein. It is filtered by the kidneys and excreted in urine. Elza's urea of 3.7 is within the optimal range, suggesting her kidneys are clearing protein waste efficiently and her protein intake is adequate without being excessive.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"49","upper_normal":"90","lower_optimal":"50","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3415","upper_optimal_position":"0.5854","units":"umol/L","description":"Creatinine is a waste product produced by muscles and filtered by the kidneys. It is the most commonly used marker for kidney function. Elza's creatinine of 49 sits right at the lower boundary of the range. A very low creatinine in a 68-year-old woman with low step count and no resistance training reflects low muscle mass rather than exceptional kidney function. This is why her Cystatin C measurement is more informative, as it is not influenced by muscle mass.","low_causes":"Low muscle mass, small body frame, vegetarian diet","high_causes":"Kidney disease, dehydration, high protein diet, high muscle mass, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"120","lower_optimal":"90","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"The estimated glomerular filtration rate calculated from creatinine estimates how well the kidneys are filtering blood. Elza's creatinine-based eGFR is reported as above 90, which appears reassuring. However, because her creatinine is very low due to low muscle mass, this eGFR likely overestimates her true kidney function. Her Cystatin C-based eGFR of 76 is a more accurate reflection and should be the primary measure used going forward.","low_causes":"Kidney disease, dehydration, medications, ageing","high_causes":"High muscle mass, high protein diet, pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.21","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","description":"Cystatin C is a small protein produced at a constant rate by all cells in the body and filtered freely by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet, or exercise, making it a more accurate marker of kidney function, particularly in older adults and those with low muscle mass. Elza's Cystatin C of 1.21 is above the upper limit of 1.1, and her Cystatin C-based eGFR of 76 places her in stage 2 chronic kidney disease (eGFR 60 to 89). At 68 with hypertension, diabetes, and diuretic therapy, this level of reduction is not unexpected but needs to be monitored. Her GP should track Cystatin C-based eGFR rather than creatinine-based eGFR at future reviews.","low_causes":"Normal finding in younger individuals with healthy kidneys","high_causes":"Reduced kidney function, ageing, diabetes, hypertension, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4222","lower_normal":"90","upper_normal":"180","lower_optimal":"90","upper_optimal":"180","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"This is the estimated glomerular filtration rate calculated from Cystatin C rather than creatinine. Elza's Cystatin C eGFR of 76 is below the 90 threshold, placing her in stage 2 CKD. This is a more accurate assessment of her kidney function than the creatinine-based eGFR above 90. Stage 2 CKD indicates mildly reduced kidney function. In someone with diabetes, hypertension, and coronary artery disease, kidney function monitoring is an essential part of long-term care. Her ARB medication is actually kidney-protective in this context.","low_causes":"Kidney disease, diabetes, hypertension, ageing, medications","high_causes":"Normal finding in young healthy individuals","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"331","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5095","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5524","units":"umol/L","description":"Uric acid is a waste product formed when the body breaks down purines, found in certain foods and produced by the body's own cells. It is filtered by the kidneys. Elza's uric acid of 331 is within the laboratory range but above the optimal female ceiling of 320. Mildly elevated uric acid is associated with insulin resistance, diuretic use, and higher BMI, all of which are present. At this level it is not a cause for concern, but it adds to the metabolic picture and should be monitored.","low_causes":"Low purine diet, medications (allopurinol), liver disease","high_causes":"Diuretics, insulin resistance, obesity, high purine diet, kidney disease, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"125","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3889","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Elza's haemoglobin of 125 is within the female reference range of 120 to 150 but sits at the lower boundary of the optimal range at 125. She is not anaemic, but her haemoglobin is not robust. Combined with her borderline-low transferrin saturation and slightly low MCV, there are early signs that iron supply to her bone marrow may be beginning to limit optimal red blood cell production.","low_causes":"Iron deficiency, chronic disease, kidney disease, bone marrow disorders, bleeding","high_causes":"Dehydration, polycythaemia, smoking, living at high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.35","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. Elza's RBC of 4.35 is within both the normal and optimal range for women, indicating adequate red cell production by the bone marrow.","low_causes":"Iron deficiency, chronic disease, kidney disease, bone marrow disorders","high_causes":"Dehydration, polycythaemia, smoking, living at high altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.357","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3233","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. Elza's haematocrit of 0.357 is fractionally below the lower limit of 0.36. This marginal reduction is consistent with her borderline haemoglobin and slightly reduced MCV. It may also reflect mild haemodilution from her diuretic therapy or the chronic inflammatory state seen in her ESR. At this margin, it is not a clinical concern but should be monitored alongside her iron indices on repeat testing.","low_causes":"Anaemia, chronic disease, overhydration, bleeding","high_causes":"Dehydration, polycythaemia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3148","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV, mean corpuscular volume, measures the average size of red blood cells. Smaller cells (low MCV) often indicate iron deficiency or chronic disease, while larger cells suggest B12 or folate deficiency. Elza's MCV of 82 is one point below the lower limit of 83. This marginally low MCV, combined with her borderline-low transferrin saturation of 19.41%, could suggest early iron-restricted erythropoiesis, where the iron supply to the bone marrow is beginning to limit the size of new red blood cells. Her ferritin at 76 indicates adequate iron stores, so this is not classic iron deficiency but may reflect functional iron availability. The lab notes that MCV can be affected by temperature and storage, so this should be confirmed on repeat testing.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease, lead poisoning","high_causes":"B12 deficiency, folate deficiency, alcohol, hypothyroidism, liver disease, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"28.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"27","upper_normal":"32","lower_optimal":"27.5","upper_optimal":"31.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"pg","description":"MCH, mean corpuscular haemoglobin, measures the average amount of haemoglobin per red blood cell. Elza's MCH of 28.7 is within the normal and optimal range, indicating that each red blood cell is carrying an appropriate amount of oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 deficiency, folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"349","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7111","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6666666667","units":"g/L","description":"MCHC, mean corpuscular haemoglobin concentration, measures the average concentration of haemoglobin within each red blood cell. Elza's MCHC of 349 is marginally above the upper limit of 345. At this margin, this is almost certainly laboratory variation, and the lab notes that MCHC can be affected by temperature and storage. It has no clinical significance and does not require any action.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"Hereditary spherocytosis, laboratory artefact, sample handling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"14.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6944","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6042","units":"%","description":"RDW, red cell distribution width, measures the variation in size among red blood cells. A higher RDW means more variation, which occurs when the bone marrow is producing red cells of inconsistent size. Elza's RDW of 14.4% is marginally above the upper limit of 14. This mild increase is consistent with the borderline-low MCV and transferrin saturation, suggesting some variation between older, normal-sized red cells and newer, slightly smaller ones as iron availability fluctuates. It is a subtle finding that supports monitoring of her iron indices.","low_causes":"Normal red cell production","high_causes":"Iron deficiency, B12 or folate deficiency, mixed nutritional deficiency, chronic disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"263","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4769","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"370","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6282","units":"x10^9/L","description":"Platelets are cell fragments that help blood to clot. Elza's platelet count of 263 is within both the normal and optimal ranges, indicating healthy platelet production and no bleeding or clotting risk from this measure.","low_causes":"Viral infections, medications, liver disease, autoimmune conditions, bone marrow disorders","high_causes":"Iron deficiency, inflammation, infection, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"7.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4222","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6111","units":"fL","description":"MPV, mean platelet volume, measures the average size of platelets. Larger platelets are younger and more active. Elza's MPV of 7.9 is within the normal and optimal range, indicating a healthy balance of platelet production and turnover.","low_causes":"Inflammatory bowel disease, aplastic anaemia, certain medications","high_causes":"Immune thrombocytopenia, myeloproliferative disorders, sepsis, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"5.82","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4353","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's front-line defence against infection and disease. Elza's WBC of 5.82 is within both the normal and optimal ranges, indicating a healthy and balanced immune response. This is reassuring given her autoimmune condition, as some treatments for rheumatoid arthritis can suppress white cell counts.","low_causes":"Viral infections, autoimmune conditions, bone marrow disorders, medications, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid therapy, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"2.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3600","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and are the first responders to bacterial infections. Elza's neutrophils at 2.4 are within the laboratory range but below the optimal floor of 2.5. This is a modest finding and is within the normal variation seen in the general population. It is not a concern on its own.","low_causes":"Viral infections, medications, autoimmune conditions, bone marrow disorders, nutritional deficiency","high_causes":"Bacterial infection, inflammation, stress, steroid therapy, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5600","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Lymphocytes are white blood cells responsible for the adaptive immune response, including antibody production and fighting viral infections. Elza's lymphocytes at 2.76 are within the normal and optimal ranges, indicating a healthy adaptive immune system.","low_causes":"Viral infections (including HIV), steroid therapy, autoimmune conditions, stress","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that mature into macrophages in tissues, where they engulf bacteria, dead cells, and debris. Elza's monocytes at 0.45 are within the optimal range, indicating normal tissue repair and immune surveillance function.","low_causes":"Bone marrow disorders, certain medications","high_causes":"Chronic infection, chronic inflammation, autoimmune conditions, certain cancers","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and in allergic responses. Elza's eosinophils at 0.2 are within the optimal range, with no sign of allergic activation or parasitic infection.","low_causes":"Steroid therapy, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infections, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2917","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"Basophils are the rarest type of white blood cell, involved in allergic and inflammatory responses. Elza's basophils at 0.01 are fractionally below the lower limit of 0.02. This is a common finding with no clinical significance, as basophils circulate in such small numbers that minor variation between samples is expected.","low_causes":"Normal variation, acute allergic reaction (consumed into tissues), steroid therapy, hyperthyroidism","high_causes":"Allergic conditions, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_pct","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.38","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, immature red blood cells freshly released from the bone marrow. Their proportion tells us how actively the bone marrow is producing new red cells. Elza's reticulocyte percentage of 1.38% is within the optimal range, indicating normal bone marrow activity and adequate red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow suppression","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_abs","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"60.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4001","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells being produced. Elza's absolute reticulocyte count of 60.03 is within the normal range, confirming adequate bone marrow output of new red cells.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, bone marrow suppression","high_causes":"Haemolytic anaemia, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nlr","name":"Neutrophil-to-Lymphocyte Ratio","group":"HEMATOLOGY","result":"0.87","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2900","lower_normal":"1.0","upper_normal":"3.0","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil-to-lymphocyte ratio is calculated by dividing neutrophils by lymphocytes (2.4 / 2.76 = 0.87). It is used as a marker of systemic inflammation and immune balance. A ratio between 1.0 and 3.0 is considered normal. Elza's NLR of 0.87 is fractionally below the lower limit of 1.0, driven by her lymphocytes being at the upper end of their range relative to her neutrophils. This is not clinically significant and may simply reflect her individual immune cell balance.","low_causes":"High lymphocyte count, low neutrophil count, normal variation","high_causes":"Infection, inflammation, physical stress, cardiovascular disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"19.41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3445","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3841","upper_optimal_position":"0.5577","units":"%","description":"Transferrin saturation tells us what percentage of the iron-carrying protein transferrin is actually loaded with iron. Think of transferrin as a fleet of delivery trucks: saturation tells you how full those trucks are. Elza's saturation of 19.41% is just above the lower limit of 18% but well below the optimal floor of 25%. This means her iron transport system is running with trucks that are mostly empty, which could limit the bone marrow's ability to build red blood cells efficiently. This borderline-low saturation, alongside her slightly low MCV, is worth monitoring on repeat testing. Her ferritin stores are adequate, so this may reflect functional iron availability rather than true deficiency.","low_causes":"Iron deficiency, chronic disease, inflammation, inadequate dietary iron","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"13.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4114","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5817","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and with meals, so is best interpreted alongside other iron markers. Elza's serum iron of 13.7 is within the laboratory range but below the optimal floor of 12 only narrowly. It is consistent with her borderline-low transferrin saturation.","low_causes":"Iron deficiency, chronic disease, inflammation, poor dietary intake","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4128","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6103","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to where it is needed, primarily the bone marrow for red blood cell production. The liver produces more transferrin when iron stores are low, trying to squeeze more efficiency from limited supply. Elza's transferrin of 2.81 is within the normal and optimal range, indicating her body is not yet trying to compensate for iron deficiency by producing extra carrier protein.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity (TIBC)","group":"IRON STUDIES","result":"62.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5104","lower_normal":"44"," e primarily produced by the ovaries after ovulation. In post-menopausal women, levels are very low. Elza's progesterone of 0.69 is within the post-menopausal reference range of 0 to 2.32 and is consistent with her status following hysterectomy.","low_causes":"Menopause, anovulation, hysterectomy","high_causes":"Pregnancy, ovulation, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"15.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4091","lower_normal":"15.9","upper_normal":"54","lower_optimal":"15.9","upper_optimal":"54","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"mIU/mL","description":"LH, luteinising hormone, is produced by the pituitary gland and rises significantly after menopause because the ovaries no longer produce hormones to suppress it. Elza's LH of 15.6 is fractionally below the post-menopausal lower limit of 15.9. This minor shortfall has no clinical significance and is consistent with normal variation in post-menopausal hormone levels, particularly given that the degree of FSH elevation confirms her menopausal status.","low_causes":"Pituitary disorders, anorexia, severe stress, HRT suppression","high_causes":"Menopause, primary ovarian failure, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"36.15","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5706","lower_normal":"23","upper_normal":"116.3","lower_optimal":"23","upper_optimal":"116.3","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5","upper_optimal_position":"1","units":"mIU/mL","description":"FSH, follicle stimulating hormone, is produced by the pituitary gland and rises substantially after menopause. Elza's FSH of 36.15 is within the post-menopausal reference range of 23 to 116.3, confirming her post-menopausal status following hysterectomy.","low_causes":"Pituitary disorders, anorexia, HRT suppression","high_causes":"Menopause, primary ovarian failure, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3651","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5714","units":"nmol/L","description":"Testosterone in women is produced by the ovaries and adrenal glands and plays important roles in muscle maintenance, bone density, libido, and energy. Elza's testosterone of 0.7 is within the laboratory range but below the optimal floor of 0.8. Following hysterectomy, if her ovaries were also removed, testosterone levels would be expected to decline. At this level, it may contribute to her difficulty building muscle and maintaining energy, though other factors in her profile are likely more significant.","low_causes":"Menopause, oophorectomy, adrenal insufficiency, ageing, obesity","high_causes":"PCOS, adrenal tumours, steroid use, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"2.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4587","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically active, calculated from total testosterone and SHBG. Elza's FAI of 2.76 is within the optimal range. Despite her low SHBG, her total testosterone is also low, so the proportion of free testosterone available to tissues is within normal limits.","low_causes":"High SHBG, low testosterone, menopause","high_causes":"Low SHBG, PCOS, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"663.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3533","lower_normal":"95.81","upper_normal":"4053.5","lower_optimal":"95.81","upper_optimal":"2500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5407","units":"ug/dL","description":"DHEA-S is an androgen precursor produced by the adrenal glands. It naturally declines with age and serves as a reservoir that the body can convert into testosterone and oestrogen as needed. Elza's DHEA-S converts to 663.3 ug/dL (from 1.8 umol/L x 368.5), which is within range and indicates adequate adrenal androgen reserve for her age.","low_causes":"Ageing, adrenal insufficiency, chronic illness","high_causes":"Adrenal tumours, PCOS, congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"168","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"38","upper_normal":"430","lower_optimal":"38","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5918","units":"uIU/mL","description":"Prolactin is a hormone produced by the pituitary gland, best known for its role in milk production but with broader functions in immune regulation and metabolism. Elza's prolactin of 168 is within the post-menopausal reference range and is at a healthy level.","low_causes":"Medications (dopamine agonists), pituitary damage","high_causes":"Pituitary adenoma, medications (antipsychotics, antidepressants), hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"25.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3131","lower_normal":"27.8","upper_normal":"146","lower_optimal":"35","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3535","upper_optimal_position":"0.5926","units":"nmol/L","description":"SHBG, sex hormone binding globulin, is a protein produced by the liver that binds sex hormones in the blood, regulating how much is available for tissues to use. Elza's SHBG of 25.4 is below the lower limit of 27.8. Low SHBG is one of the most reliable metabolic markers of insulin resistance. It is strongly associated with elevated BMI, high triglycerides, and type 2 diabetes, all of which are present in Elza's profile. As insulin sensitivity improves through weight loss and increased activity, SHBG typically rises. This is a metabolic marker more than a hormonal one in this context.","low_causes":"Insulin resistance, type 2 diabetes, obesity, hypothyroidism, PCOS","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy, anorexia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"free_testosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.015","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5","lower_normal":"0.005","upper_normal":"0.035","lower_optimal":"0.005","upper_optimal":"0.035","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to proteins in the blood and therefore available to enter cells and exert its effects. Elza's calculated free testosterone of 0.015 nmol/L is within normal limits for a post-menopausal woman.","low_causes":"High SHBG, low total testosterone, menopause","high_causes":"Low SHBG, PCOS, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4371","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4400","upper_optimal_position":"0.5561","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland to control the thyroid. When the thyroid is underactive, TSH rises to push it harder; when overactive, TSH drops. Elza's TSH of 1.88 sits comfortably within the optimal range of 1.0 to 2.5, indicating her thyroid is working well with no sign of over- or under-activity. This is particularly reassuring because thyroid dysfunction is more common in women over 60 and can worsen both weight management and cardiovascular risk.","low_causes":"Hyperthyroidism, pituitary disorders, excess thyroid medication","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"16.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4780","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. It is converted into the more active T3 in tissues throughout the body. Elza's FT4 of 16.4 is within the optimal range of 14 to 20, indicating healthy thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disorders, severe illness","high_causes":"Hyperthyroidism, excess thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3, or triiodothyronine, is the most biologically active thyroid hormone. It is largely produced by conversion of T4 in tissues. Elza's FT3 of 5.0 is within the optimal range of 4.5 to 6.5, confirming that her body is converting T4 to T3 efficiently. This is the hormone that directly drives metabolic rate, energy, and body temperature.","low_causes":"Hypothyroidism, severe illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, excess thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are immune proteins that attack thyroid peroxidase, an enzyme the thyroid needs to produce hormones. Their presence suggests the immune system is targeting the thyroid, as seen in the autoimmune condition Hashimoto's thyroiditis. Elza's TPO antibodies are below 6.6, well within the normal range, ruling out autoimmune thyroid disease.","low_causes":"Normal finding, no autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce hormones. Like TPO antibodies, their presence suggests autoimmune thyroid disease. Elza's thyroglobulin antibodies are below 1.3, which the lab notes is consistent with over 80% of the population. Autoimmune thyroid disease is ruled out.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5298","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3743","upper_optimal_position":"0.6082","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve transmission, and heart rhythm. Elza's total calcium of 2.42 is within the optimal range, indicating healthy calcium balance. This is reassuring given her age, post-menopausal status, and diuretic use, all of which can affect calcium handling.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, malabsorption","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium measurement for the albumin level, because about half of blood calcium is bound to albumin. This gives a more accurate picture of the physiologically active calcium. Elza's corrected calcium of 2.47 is within the optimal range, confirming genuine calcium balance.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease","high_causes":"Hyperparathyroidism, cancer, excess vitamin D, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4563","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.85","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3414","upper_optimal_position":"0.6034","units":"mmol/L","description":"Phosphate works with calcium to build and maintain bones and teeth, and is essential for energy production in every cell. Elza's phosphate of 1.1 is within the optimal range, indicating normal phosphate metabolism and balanced calcium-phosphate handling.","low_causes":"Hyperparathyroidism, vitamin D deficiency, refeeding syndrome, alcoholism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D, rhabdomyolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4310","upper_optimal_position":"0.6207","units":"mmol/L","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle function, nerve transmission, and blood pressure regulation. Elza's magnesium of 0.99 is within the optimal range of 0.85 to 1.05, reflecting her magnesium glycinate supplementation. This is particularly reassuring because diuretics can deplete magnesium, and her supplementation is effectively countering this effect. Low magnesium can worsen insulin resistance, blood pressure, and muscle cramps, so maintaining this level is important.","low_causes":"Diuretics, alcohol, diarrhoea, poor dietary intake, diabetes","high_causes":"Kidney disease, excessive supplementation, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4889","lower_normal":"50","upper_normal":"150","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function, and mood regulation. It is produced in the skin when exposed to sunlight and supplemented through diet or capsules. Elza's vitamin D of 88 nmol/L is sufficient and falls within the optimal band of 75 to 120, reflecting her D3 supplementation. However, at a BMI of 35, body fat sequesters vitamin D, reducing its bioavailabi // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ============================================================
function toggleGrp(el){ el.classList.toggle('open'); animateBarsIn(el); }
function toggleCard(el){
  const open = el.classList.toggle('open');
  const d = el.querySelector('.bc-detail');
  d.style.maxHeight = open ? d.firstElementChild.scrollHeight + 24 + 'px' : '0px';
}
function goTo(id){ const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function pickSystem(sysId){
  const sys = SYSTEMS.find(s=>s.id===sysId); if(!sys) return;
  // open matching groups, close others, scroll to first
  document.querySelectorAll('.grp').forEach(g=>{
    const on = sys.groups.includes(g.dataset.group);
    g.classList.toggle('open', on);
    if(on) animateBarsIn(g);
  });
  const first = sys.groups.map(g=>document.getElementById('grp-'+slug(g))).find(Boolean);
  if(first){
    // reset filters so the group is visible
    document.getElementById('search').value=''; setActiveFilter('all'); applyFilter();
    setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),60);
    first.classList.add('grp-flash'); setTimeout(()=>first.classList.remove('grp-flash'),1200);
  }
}

// tooltip for body map
const tipEl = document.createElement('div'); tipEl.className='bodytip'; document.body.appendChild(tipEl);
function tip(e,sysId){
  const sys=SYSTEMS.find(s=>s.id===sysId); const st=sys&&sys._st; if(!st) return;
  tipEl.innerHTML = `<strong>${esc(sys.label)}</strong>${st.optimal} of ${st.total} optimal${st.flagged?` · <span class="tip-red">${st.flagged} flagged</span>`:''}`;
  tipEl.classList.add('show'); tipMove(e);
}
function tipMove(e){ const t=(e&&e.touches&&e.touches[0])||e; if(!t||t.clientX==null){ tipHide(); return; } tipEl.style.left=t.clientX+'px'; tipEl.style.top=(t.clientY-14)+'px'; }
function tipHide(){ tipEl.classList.remove('show'); }

// filters
function setFilter(btn){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilter(); }
function setActiveFilter(f){ document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active', b.dataset.f===f)); }
function applyFilter(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const f=document.querySelector('.fbtn.active').dataset.f;
  document.querySelectorAll('.bc').forEach(c=>{
    let show=true;
    if(q && !c.dataset.name.includes(q)) show=false;
    if(f==='flag' && c.dataset.status!=='flag') show=false;
    if(f==='optimal' && c.dataset.status!=='optimal') show=false;
    c.style.display=show?'':'none';
  });
  document.querySelectorAll('.grp').forEach(g=>{
    const vis=[...g.querySelectorAll('.bc')].some(c=>c.style.display!=='none');
    g.style.display=vis?'':'none';
    if((q||f!=='all')&&vis) g.classList.add('open');
  });
}
window.setFilter=setFilter; window.applyFilter=applyFilter;

// range bar fill on reveal
function animateBarsIn(scope){
  (scope||document).querySelectorAll('.rbar-dot:not(.lit)').forEach(d=>{
    d.classList.add('lit'); requestAnimationFrame(()=>{ d.style.left=d.dataset.x+'%'; });
  });
}

// theme toggle
function toggleTheme(){
  const b=document.body; const light=b.getAttribute('data-theme')==='light';
  b.setAttribute('data-theme', light?'dark':'light');
  document.getElementById('themeLabel').textContent = light?'Light':'Dark';
}
window.toggleTheme=toggleTheme;

// print
function printReport(){
  document.querySelectorAll('.grp,.bc').forEach(el=>el.classList.add('open'));
  document.querySelectorAll('.bc-detail').forEach(d=>{ d.style.maxHeight='none'; });
  window.print();
}
window.printReport=printReport;

// scroll reveal + active nav
const revObs=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); }),{threshold:0.08});
document.querySelectorAll('.reveal').forEach(el=>revObs.observe(el));

const navSections=['overview','body','findings','flags','results'];
const navObs=new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){
    document.querySelectorAll('.nav-links a,.mnav a').forEach(a=>a.classList.toggle('active', a.dataset.t===e.target.id));
  }});
},{rootMargin:'-45% 0px -50% 0px'});
navSections.forEach(id=>{ const el=document.getElementById(id); if(el) navObs.observe(el); });

// ============================================================
//  GATE + LAUNCH ANIMATION
// ============================================================
function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const optFrac=assessable.length?optimalCount/assessable.length:0;
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const t0=performance.now(), dur=1400;
  const pctEl=document.getElementById('ringPct');
  function step(t){
    const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
    fill.style.strokeDashoffset=C*(1-optFrac*e);
    fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
    pctEl.innerHTML=Math.round(healthPct*e)+'<span>%</span>';
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
