<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"Elza Tornyi Jonasne","dob":"08/08/1958","report_date":"2026-08-29","summary":"Elza is a 68-year-old female presenting with a BMI of 35.3, following a standard mixed diet rated 8 out of 10 for quality with a volume of 5 out of 10. She trains twice per week with cardio only, no resistance training, and takes fewer than 2,000 daily steps. She takes Losartan and a diuretic, and supplements daily with inositol, creatine monohydrate, green banana flour, sulforaphane, hyaluronic acid, magnesium glycinate, MSM, glucosamine sulphate, CoQ10, vitamin C, vitamin D3 with K2, and omega-3. She has a significant medical history: a coronary artery stent placed 26 years ago, cholecystectomy at the same time, hysterectomy 20 years ago, and carries diagnoses of type 2 diabetes, rheumatoid arthritis, coronary artery disease, and hypertension. She has not been able to see her GP practice for two years due to appointment difficulties. She reports weight gain and difficulty losing weight, joint pain and stiffness, and low mood or anxiety. Her goals are to improve long-term health and longevity, improve cardiovascular fitness, and prevent disease.\n\nGiven that Elza has not seen her GP for two years and carries four significant diagnoses, this report identifies several findings that should prompt a GP appointment, and we would encourage her to use this report as a reason to request one.\n\nThe most pressing area is her cardiovascular and metabolic risk profile. Her HbA1c has returned at 47 mmol/mol, which sits right at the upper boundary of the pre-diabetes range and on the threshold of a formal diabetes diagnosis at 48. HbA1c, or glycated haemoglobin, measures the average blood sugar over the preceding two to three months by looking at how much sugar has attached itself to red blood cells. At 47, her blood sugar control has deteriorated to a point where, combined with her existing type 2 diabetes diagnosis, her GP needs to review whether her current management is adequate. Her fasting glucose at 5.4 is still within the laboratory range but sits at the upper end of normal. Her fasting insulin at 11.08 mIU/L is within range but above the optimal ceiling of 8, and when combined with her glucose, her HOMA-IR, a calculation that estimates how resistant the body's cells are to insulin, comes out at 2.66, which is above the 1.7 threshold that suggests meaningful insulin resistance. Her C-Peptide, a molecule released alongside insulin that tells us how much insulin the pancreas is actually producing, converts to 632 pmol/L, which is within range and confirms the pancreas is working adequately. The picture here is not one of pancreatic failure but of the body needing to produce more insulin than it should to keep blood sugar under control, and even then, the HbA1c shows it is not quite managing.\n\nHer lipid profile adds to the cardiovascular concern, and this matters more than usual because she already has confirmed coronary artery disease and a stent. Her total cholesterol is 6.1 mmol/L, above the desirable threshold of 5.18. Her LDL cholesterol, the form that deposits into artery walls, is 3.57 against a target of below 3, and for someone with established coronary disease, many cardiologists would set a much tighter target of below 1.8. Her ApoB, the protein that carries LDL particles and is considered the most accurate single measure of atherogenic risk, is 1.12 g/L against a target of below 0.9, placing it in the borderline-high category. Her triglycerides at 3.0 mmol/L are significantly elevated, well above the 1.7 fasting target. Triglycerides are blood fats that rise with insulin resistance, excess carbohydrate intake, and higher body weight, and all three are likely contributing here. This drives her VLDL, the triglyceride-rich lipoprotein produced by the liver, to 1.36 against a target of below 0.78, and her remnant cholesterol to 1.23 mmol/L against a target of below 0.8. Remnant cholesterol represents the cholesterol left behind when triglyceride-rich particles are partially broken down, and elevated levels are independently associated with cardiovascular events. Her HDL at 1.3 is in the intermediate zone, below the desirable 1.55 threshold, and her ApoB to ApoA-I ratio at 0.81 places her just above the higher-risk threshold of 0.8 for women. The one genuinely reassuring finding in this panel is her Lp(a) at 31.27 nmol/L, just under the 32 threshold. Lp(a), or lipoprotein little a, is entirely inherited and unchangeable, and a normal level means that her elevated cardiovascular lipid markers are driven entirely by modifiable factors: weight, diet composition, insulin resistance, and potentially medication. This is actually good news because it means intervention can make a real difference. This Lp(a) result should be recorded permanently in her medical notes.\n\nHer inflammatory markers tell an important part of the story. Her hs-CRP, high-sensitivity C-reactive protein, which measures low-grade systemic inflammation, is 5 mg/L, at the upper boundary of the lab range and well above the optimal ceiling of 1.0. At this level, it reflects significant chronic inflammation. Multiple factors are contributing: her BMI of 35.3, her insulin resistance, her rheumatoid arthritis, and possibly her coronary artery disease itself. Her ESR, the erythrocyte sedimentation rate, which measures how quickly red blood cells settle in a tube and rises with inflammation, is markedly elevated at 66 mm/hour against an upper limit of 12. This is a striking result. While ESR can be mildly elevated with age and higher BMI, 66 is well beyond what those factors alone would explain. The most likely driver is her rheumatoid arthritis, and this level suggests her joint disease may be more active than she realises. The combination of ESR 66 with a rheumatoid factor of 7, which is within the normal range of below 14, is worth noting. A normal rheumatoid factor does not exclude active rheumatoid disease, as approximately 20 to 30 percent of people with confirmed rheumatoid arthritis are seronegative. However, it does mean that her ESR elevation could also reflect other inflammatory processes, and her GP should consider whether further investigation is warranted.\n\nHer kidney function shows a split picture that needs attention. Her creatinine-based eGFR is reported as above 90, which looks reassuring, but her Cystatin C, a small protein filtered by the kidneys that gives a more accurate picture of kidney function than creatinine alone, especially in older adults and those with lower muscle mass, is elevated at 1.21 mg/L against an upper limit of 1.1. Her Cystatin C-based eGFR is 76, which places her in stage 2 chronic kidney disease. At 68 with hypertension, diabetes, and diuretic use, the Cystatin C result is the more reliable of the two and should be the one her GP monitors. A Cystatin C eGFR of 76 is not alarming, but it does mean kidney function is mildly reduced and needs regular surveillance, particularly given the medications she takes. Her chloride at 93 is below the lower limit of 95, which is a recognised effect of diuretic therapy and may also relate to her bicarbonate sitting at the lower end of its range at 21.5. This pattern, called hypochloraemic metabolic alkalosis, is common with diuretics and is not dangerous in isolation, but her GP should be aware.\n\nTurning to the positives, and there are genuine ones here. Her liver is in excellent health despite the metabolic load her body is carrying. Her ALT at 8 and AST at 16 are both well within range, and her Gamma GT at 31 is within the female range of 4 to 38. At a BMI of 35 with insulin resistance and no gallbladder, having clean liver enzymes is a meaningful finding. Her FIB-4 score, a calculation that estimates liver fibrosis risk, is 1.46, which is marginally above the 1.45 threshold. However, the lab itself notes that for someone over 65, a score below 2 is the relevant threshold, and with an ALT of thin the laboratory range but below the optimal floor of 500. B12 is essential for nerve function, red blood cell formation, and energy metabolism, and at 252, her levels are not critically low but are suboptimal and could be contributing to her low mood and fatigue. Given her cholecystectomy, bile salt-dependent absorption of fat-soluble vitamins is impaired, and sublingual B12 bypasses the gut entirely, making it the preferred route. Her folate at 12 ng/mL is above the optimal threshold of 8 and is in a good place.\n\nHer SHBG, sex hormone binding globulin, a protein that binds sex hormones in the blood, is low at 25.4 against a lower limit of 27.8. Low SHBG is strongly associated with insulin resistance and higher BMI, and both are present here. This is a metabolic marker more than a hormonal one, and it tends to improve as insulin sensitivity improves. Her total testosterone at 0.7 and free androgen index at 2.76 are both within the female reference range. Her oestradiol at 46 and FSH at 36.15 are consistent with her post-menopausal status following hysterectomy, and her progesterone at 0.69 is within the post-menopausal reference.\n\nHer iron studies show a pattern worth watching. Her transferrin saturation at 19.41% is just above the lower limit of 18% and below the optimal floor of 25%. Her ferritin at 76 is within the optimal female range of 40 to 150, and her serum iron, transferrin, and iron binding capacity are all within range. The borderline-low saturation alongside adequate ferritin is not a concern at present but should be monitored on repeat testing.\n\nHer red cell indices show a few marginal findings. Her MCV at 82 is one point below the lower limit of 83, and her haematocrit at 0.357 is fractionally below 0.36, while her RDW at 14.4 is marginally above 14 and her MCHC at 349 is marginally above 345. Taken together, the mildly low MCV with a borderline-low transferrin saturation could suggest early iron-restricted erythropoiesis, where the iron supply to the bone marrow is beginning to limit the size of new red blood cells. Her haemoglobin at 125 is within the female range, so she is not anaemic, but these subtle shifts alongside the borderline saturation are worth noting. Her slightly elevated RDW, which measures the variation in red blood cell size, is consistent with this early picture. Her MCHC at 349 is marginally above range and at this margin is likely laboratory variation, possibly influenced by sample storage.\n\nHer urine sample shows a positive nitrite result and a bacterial count of 10 to the fifth CFU/mL, but the lab has reported mixed growth with probable contamination, noting that a plain bottle was received rather than one containing boric acid. Her white blood cells are below 1 and red blood cells are below 1, meaning there is no evidence of urinary tract inflammation. In the absence of urinary symptoms, this result most likely reflects sample contamination rather than infection, but if she is experiencing any urinary symptoms such as burning, frequency, or urgency, a repeat mid-stream sample in a boric acid bottle would be worthwhile.\n\nHer total antioxidant activity at 1.37 is within range, and her creatine kinase at 40 is at the lower end of the female range, consistent with her low level of resistance training. Her cortisol at 435 is within the morning reference range. Her uric acid at 331 is within range and within the optimal band for women.","links":"Elza's results present a clear set of priorities, and the most important step is getting back in front of her GP. Having not been seen for two years with type 2 diabetes, coronary artery disease, hypertension, and rheumatoid arthritis, this report provides both the reason and the evidence to push for an appointment. She should bring this report and specifically highlight four findings: her HbA1c at 47 mmol/mol, which is at the diabetes threshold and means her blood sugar management needs formal review; her lipid profile, particularly her LDL at 3.57 and ApoB at 1.12, which in someone with a coronary stent and established heart disease are well above guideline targets and may warrant statin therapy or dose adjustment; her ESR at 66, which suggests her rheumatoid arthritis may be more active than her current symptoms suggest and warrants rheumatology review; and her Cystatin C eGFR of 76, which should become the tracked kidney function measure going forward.\n\nFor weight management, which connects directly to her insulin resistance, lipid profile, inflammation, and joint symptoms, Elza's estimated basal metabolic rate at 88 kg and 158 cm is approximately 1,430 kcal. With her current activity level of twice-weekly cardio and fewer than 2,000 steps, her maintenance calories sit around 1,860 to 2,000. A moderate deficit of 1,400 to 1,550 kcal per day would target a loss of 0.3 to 0.5 kg per week, aiming for a first target of 80 kg, which would bring her BMI below 32 and would likely improve her insulin sensitivity, lower her triglycerides, and reduce the inflammatory load on her joints. Her protein intake should be at least 105 to 115 grams per day, calculated at 1.2 to 1.3 g/kg of body weight, to preserve muscle mass during weight loss. Given that she rates her diet quality at 8 out of 10, the focus should be on portion control and calorie density rather than food quality, which she is already managing well. Without a gallbladder, she should continue to spread fat intake across meals rather than consuming large amounts in one sitting, as bile is released continuously rather than on demand.\n\nFor her lipid profile specifically, she should increase her intake of soluble fibre, which binds cholesterol in the gut: oats, barley, beans, lentils, and psyllium husk are the richest sources. Oily fish twice per week, which she may already be getting through her omega-3 supplementation, helps lower triglycerides. Reducing refined carbohydrates, particularly sugar and white flour products, will help lower triglycerides more than reducing dietary fat will. Given her established coronary disease, the conversation with her GP about statin therapy is important. Statins lower LDL and ApoB and reduce cardiovascular events in people with existing heart disease. This is a conversation she should have, not a recommendation to start a specific medication.\n\nFor her step count, which is currently below 2,000, even a modest increase to 4,000 to 5,000 daily steps would meaningfully improve insulin sensitivity and cardiovascular fitness. Walking is particularly valuable because it does not stress arthritic joints the way higher-impact exercise does. If joint pain limits walking, swimming or water-based exercise would achieve similar benefits with less joint load. Adding even one session of light resistance work per week, which could be bodyweight exercises or resistance bands, would help preserve muscle mass, improve insulin sensitivity, and support bone density at 68.\n\nHer B12 should be addressed with sublingual methylcobalamin at 1,000 mcg daily. The sublingual route is important because her cholecystectomy means bile-dependent absorption pathways are compromised. She should retest B12 in 12 weeks to confirm the level is rising toward the 500 to 900 optimal range.\n\nHer vitamin D at 88 is sufficient but could be higher. At her BMI, body fat sequesters vitamin D, meaning she needs a higher dose to achieve the same blood level. Increasing to 3,000 to 4,000 IU of D3 daily, taken with her largest meal containing fat, and continuing her K2 alongside it, would aim to bring her level above 100 on repeat testing.\n\nFor her joint symptoms, her current glucosamine sulphate supplementation is reasonable, and her omega-3 may provide some anti-inflammatory benefit. The most impactful change for her joints would be the weight loss outlined above, as every kilogram of body weight lost removes approximately 4 kg of force from the knees during walking.\n\nFor her low mood and anxiety, B12 optimisation may help, as suboptimal B12 is associated with mood disturbance. Her step count increase and any weight loss would also be expected to improve mood. If symptoms persist or worsen, she should discuss this with her GP, as both her rheumatoid arthritis and her chronic disease burden are independent risk factors for depression.\n\nA retest in four to six months should include: HbA1c, fasting glucose, fasting insulin, a full lipid panel including ApoB, hs-CRP, ESR, Cystatin C, full blood count, B12, vitamin D, and iron studies including transferrin saturation. The CA 15-3 result should be chased from the current sample.","flags":"GP-URGENT FINDINGS:\n\n1. HbA1c 47 mmol/mol (6.5%), at the formal diabetes diagnosis threshold of 48 mmol/mol and above the pre-diabetes ceiling of 42. In a patient with existing type 2 diabetes, coronary artery disease, and a stent, this warrants review of diabetic management including consideration of pharmacotherapy.\n\n2. Lipid profile significantly above targets for secondary prevention of coronary artery disease: LDL 3.57 mmol/L (target below 1.8 for established CAD per ESC guidelines), ApoB 1.12 g/L (target below 0.9, ideally below 0.65 for established CAD), triglycerides 3.0 mmol/L (target below 1.7 fasting), non-HDL 4.8 mmol/L, ApoB/A-I ratio 0.81 (above 0.8 higher-risk threshold for women). Statin therapy and/or intensification should be discussed. Lp(a) 31.27 nmol/L is normal, confirming modifiable aetiology.\n\n3. ESR 66 mm/hour (limit below 12). Markedly elevated. Rheumatoid factor 7 IU/mL is within range (below 14), but seronegative RA is common. This ESR level in a patient with diagnosed rheumatoid arthritis suggests active disease and warrants rheumatology review.\n\n4. Cystatin C 1.21 mg/L (limit below 1.1), Cystatin C eGFR 76. Stage 2 CKD. Creatinine-based eGFR over 90 likely overestimates true function. Cystatin C is the more reliable measure at this BMI and age. Baseline for monitoring. Patient is on ARB and diuretic.\n\nSYSTEMIC FINDINGS:\n\n5. hs-CRP 5.0 mg/L (limit below 5). At the upper boundary. Reflects cumulative inflammatory burden from BMI 35.3, insulin resistance, and rheumatoid arthritis. Cardiovascular risk implications in setting of established CAD.\n\n6. HOMA-IR 2.66 (calculated, optimal below 1.7). Confirms insulin resistance. Fasting insulin 11.08 mIU/L, above optimal ceiling of 8.\n\n7. Chloride 93 mmol/L (range 95 to 108). Below range. Consistent with diuretic therapy. Bicarbonate 21.5 at lower end. Pattern consistent with hypochloraemic effect of diuretic.\n\n8. SHBG 25.4 nmol/L (range 27.8 to 146). Below range. Associated with insulin resistance and elevated BMI.\n\n9. B12 252 pg/mL (range 193 to 982, optimal above 500). Suboptimal. Cholecystectomy may impair absorption. Sublingual supplementation recommended.\n\nMINOR/MARGINAL FINDINGS:\n\n10. MCV 82 fL (range 83 to 101), HCT 0.357 (range 0.36 to 0.46), RDW 14.4% (range 11.6 to 14), MCHC 349 g/L (range 315 to 345). All marginally outside range. Pattern of borderline-low MCV with borderline-low transferrin saturation (19.41%) may reflect early iron-restricted erythropoiesis. Haemoglobin 125 is within range. Monitor on repeat.\n\n11. Basophils 0.01 x10^9/L (range 0.02 to 0.1). Fractionally below range. No clinical significance at this margin.\n\n12. FIB-4 1.46 (threshold 1.45, but 2.0 for over-65s per lab guidance). Driven by age and very low ALT denominator. All liver markers within range. No evidence of fibrosis.\n\n13. Urine nitrites positive, bacterial count 10^5 CFU/mL, but mixed growth with probable contamination in plain bottle. No WBCs or RBCs detected. Likely contamination. Repeat in boric acid bottle if symptomatic.\n\n14. CA 15-3: result to follow. Should be reviewed when available.\n\nReassuring negatives: Lp(a) normal (inherited cardiovascular risk excluded), thyroid function optimal with negative antibodies, coeliac screen negative, rheumatoid factor negative, tumour markers CA-125, CA 19-9, and CEA all within range, liver enzymes clean, calcium and PTH balanced, magnesium optimal on supplementation, IgE below 100 (no significant allergic sensitisation), urine protein negative, urine glucose negative.","recommendations":"1. Request a GP appointment as a priority, using this report as supporting evidence. Bring the specific findings: HbA1c 47, LDL 3.57, ApoB 1.12, ESR 66, and Cystatin C eGFR 76.\n\n2. Discuss diabetic management review with GP. HbA1c at 47 is at the threshold and current management is not achieving adequate control.\n\n3. Discuss statin therapy or intensification with GP. With established coronary artery disease and a stent, her LDL and ApoB targets should be substantially lower than current levels.\n\n4. Request rheumatology review or referral given ESR of 66 with diagnosed rheumatoid arthritis. Current disease activity may be higher than symptoms suggest.\n\n5. Begin calorie tracking at 1,400 to 1,550 kcal per day with a protein floor of 105 to 115 grams per day. First weight target: 80 kg.\n\n6. Increase daily steps from below 2,000 to 4,000 to 5,000. Consider swimming or water-based exercise if joint pain limits walking.\n\n7. Consider adding one light resistance training session per week using bodyweight exercises or resistance bands.\n\n8. Increase soluble fibre intake: oats, barley, beans, lentils, psyllium husk. Reduce refined carbohydrates to help lower triglycerides.\n\n9. Start sublingual methylcobalamin 1,000 mcg daily for B12.\n\n10. Increase vitamin D3 dose to 3,000 to 4,000 IU daily, taken with food, continuing K2.\n\n11. Chase the CA 15-3 result from this sample.\n\n12. Retest in four to six months: HbA1c, fasting glucose, fasting insulin, full lipid panel with ApoB, hs-CRP, ESR, Cystatin C, full blood count, B12, vitamin D, iron studies with transferrin saturation.","supplementation":"Elza is already taking an impressive supplement regimen, and several of her results reflect that effort positively. Her magnesium at 0.99 within the optimal range confirms her magnesium glycinate is working well, and she should continue at her current dose of 300 to 400 mg, ideally taken in the evening before bed for its additional benefit on sleep quality. Her vitamin D at 88 reflects her D3 and K2 supplementation, but at a BMI of 35 where body fat sequesters vitamin D, she should increase her D3 dose to 3,000 to 4,000 IU daily, taken with her largest meal containing fat, and continue taking K2 (MK-7, 100 to 200 mcg) alongside it. She should aim for a blood level above 100 nmol/L on repeat testing.\n\nShe should add sublingual methylcobalamin at 1,000 mcg daily for her B12, which at 252 pg/mL is below the optimal level of 500. The sublingual route is specifically important for Elza because her cholecystectomy 26 years ago means bile-dependent absorption in the gut is impaired, and sublingual delivery bypasses this entirely by absorbing directly through the tissue under the tongue.\n\nHer omega-3 supplementation should continue at a dose providing 2 to 3 grams of combined EPA and DHA daily. This supports her cardiovascular health, may help with triglyceride reduction, and provides modest anti-inflammatory benefit relevant to her rheumatoid arthritis. She should check the label to ensure she is getting the full 2 to 3 grams of EPA plus DHA, not just 2 to 3 grams of fish oil, as many products contain far less active ingredient than the capsule weight suggests.\n\nHer CoQ10 supplementation is sensible and should continue at 100 to 200 mg daily, particularly if statin therapy is started following her GP discussion, as statins can reduce the body's natural CoQ10 production. The ubiquinol form is better absorbed than ubiquinone, especially over age 60.\n\nHer glucosamine sulphate, MSM, and hyaluronic acid are reasonable joint support supplements given her rheumatoid arthritis, and she may continue these. Her inositol supplementation is interesting and may offer modest benefit for insulin sensitivity, which aligns with her metabolic picture. Her creatine monohydrate at 3 to 5 grams daily is a well-evidenced supplement for muscle preservation and cognitive function, both relevant at 68, and she should continue it. Her green banana flour provides resistant starch which supports gut health and may modestly improve insulin sensitivity. Her sulforaphane and vitamin C may continue as general antioxidant and cellular health support.\n\nShe should NOT add iron supplements. While her transferrin saturation is borderline-low at 19.41%, her ferritin at 76 is well within the optimal range, meaning her iron stores are adequate. Supplementing iron when ferritin is sufficient can cause gastrointestinal side effects without benefit.\n\nThe most important changes from this report are not supplements. They are getting back to her GP to review her diabetes management and discuss statin therapy, reducing her calorie intake to 1,400 to 1,550 kcal per day with at least 105 grams of protein, increasing her daily steps from below 2,000 toward 4,000 to 5,000, and increasing her soluble fibre intake to help bring her triglycerides down.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose measures the concentration of sugar in the blood after a period without eating. It provides a snapshot of how well the body is managing blood sugar at that moment. Elza's result of 5.4 mmol/L is within the laboratory range but sits at the upper boundary of the optimal band of 4.0 to 5.4. In the context of her HbA1c at 47, this fasting level is not alarming on its own but reflects the underlying insulin resistance that is driving her blood sugar control gradually upward. Improving insulin sensitivity through weight loss, increased activity, and dietary fibre would be expected to bring this number down.","low_causes":"Excess insulin, prolonged fasting, excessive exercise, certain medications","high_causes":"Insulin resistance, type 2 diabetes, stress, infection, certain medications including diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_pct","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"6.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4500","units":"%","description":"HbA1c measures the percentage of haemoglobin, the oxygen-carrying protein in red blood cells, that has become glycated, meaning sugar has bonded to it. Because red blood cells live for about three months, this gives an average picture of blood sugar control over that period. Elza's result of 6.5% sits at the formal diabetes diagnostic threshold. Below 6.0% is considered normal, 6.0 to 6.4% is pre-diabetes, and 6.5% and above meets the diagnostic criterion for type 2 diabetes. Given her existing diagnosis of type 2 diabetes, this confirms that her current management is not achieving adequate glycaemic control and should be reviewed by her GP.","low_causes":"Iron deficiency anaemia, blood loss, haemolytic conditions","high_causes":"Type 2 diabetes, insulin resistance, high carbohydrate intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"47","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5595","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the internationally standardised IFCC units of mmol/mol. Elza's result of 47 mmol/mol sits just below the diabetes threshold of 48 (the lab's percentage result of 6.5% and the mmol/mol result are slightly discordant due to rounding in the conversion equation, but both place her at or very near the diagnostic boundary). Normal is below 42, pre-diabetes is 42 to 47, and diabetes is 48 and above. At 47, she sits at the very top of the pre-diabetes range, and this is the number her GP should track going forward.","low_causes":"Iron deficiency anaemia, blood loss, haemolytic conditions","high_causes":"Type 2 diabetes, insulin resistance, high carbohydrate intake, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"11.08","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4604","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5753","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing into the blood when no food has been eaten. Insulin is the hormone that moves sugar from the blood into cells for energy. When cells become resistant to insulin's signal, the pancreas has to produce more to achieve the same effect. Elza's fasting insulin of 11.08 mIU/L is within the laboratory range of 2.6 to 24.9 but sits above the optimal ceiling of 8. This elevated fasting insulin confirms that her body is working harder than it should to keep blood sugar controlled, consistent with the insulin resistance suggested by her other metabolic markers.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, type 2 diabetes, excess carbohydrate intake, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"632","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5191","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1000","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5818","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. Because it is not cleared by the liver the way insulin is, it gives a more accurate picture of how much insulin the pancreas is actually producing. Elza's result converts to 632 pmol/L (from 1.91 ug/L), which is within the normal range. This confirms that her pancreas is producing insulin adequately. The issue is not pancreatic failure but insulin resistance, where the body's cells do not respond efficiently to the insulin being produced.","low_causes":"Type 1 diabetes, late-stage type 2 diabetes with beta cell exhaustion, exogenous insulin use","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"2.66","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7700","lower_normal":"0","upper_normal":"1.73","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2890","units":"","description":"HOMA-IR, the Homeostatic Model Assessment of Insulin Resistance, is calculated from fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 is considered optimal, below 1.73 is within the normal range, and above 1.73 suggests meaningful insulin resistance. Elza's score of 2.66, calculated as (11.08 x 5.4) / 22.5, confirms clinically significant insulin resistance. This is the metabolic engine driving her elevated HbA1c, her high triglycerides, her low SHBG, and much of her difficulty losing weight. The encouraging aspect is that insulin resistance is highly modifiable through weight loss, increased physical activity, and dietary changes.","low_causes":"High insulin sensitivity, low carbohydrate diet, high physical activity","high_causes":"Obesity, sedentary lifestyle, excess carbohydrate intake, type 2 diabetes, certain medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"116.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5942","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"","description":"HOMA-B estimates the function of the beta cells in the pancreas, the cells that produce insulin. Calculated as (20 x 11.08) / (5.4 - 3.5) = 116.6, Elza's result falls within the normal range of 80 to 200. This confirms that her pancreas is still producing insulin at an adequate rate. The insulin resistance picture is not one of the pancreas failing to keep up but of the body demanding more insulin than it should need.","low_causes":"Beta cell exhaustion, late-stage type 2 diabetes, type 1 diabetes","high_causes":"Insulin resistance causing compensatory overproduction, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT, alanine aminotransferase, is an enzyme found primarily inside liver cells. When liver cells are damaged or inflamed, ALT leaks into the bloodstream, so a raised level suggests the liver is under strain. Elza's ALT of 8 IU/L is well below both the laboratory limit of 56 and the optimal female ceiling of 25. This is an excellent result, particularly at a BMI of 35 where fatty liver disease is common. Her liver is showing no sign of metabolic strain despite the insulin resistance and elevated triglycerides seen elsewhere in her results.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Fatty liver disease, hepatitis, alcohol, medications, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3646","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5312","units":"IU/L","description":"AST, aspartate aminotransferase, is an enzyme found in the liver, heart, and muscles. Like ALT, it rises when these tissues are damaged. Elza's AST of 16 is within the optimal range and confirms her liver is healthy. The combination of a very low ALT and a normal AST is as clean a liver picture as one can get.","low_causes":"Normal finding, vitamin B6 deficiency","high_causes":"Liver disease, heart damage, muscle damage, alcohol, strenuous exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4079","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5392","units":"IU/L","description":"GGT, gamma-glutamyl transferase, is a liver enzyme that is particularly sensitive to alcohol use, bile duct issues, and metabolic stress on the liver. Elza's GGT of 31 is within the female laboratory range of 4 to 38 but sits above the optimal ceiling of 25. Given her cholecystectomy and the altered bile flow that results from not having a gallbladder, a GGT in this range is not unexpected and is not a cause for concern. The key finding is that it is within the laboratory range despite her significant metabolic load.","low_causes":"Normal finding","high_causes":"Alcohol, bile duct obstruction, fatty liver, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5905","units":"IU/L","description":"ALP, alkaline phosphatase, is an enzyme found in the liver, bile ducts, and bones. It rises with bile duct obstruction, bone disease, or liver disease. Elza's ALP of 74 is comfortably within range. Given her cholecystectomy, a normal ALP is reassuring as it confirms no bile duct complications.","low_causes":"Zinc deficiency, hypothyroidism, anaemia","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4167","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. It is processed by the liver and excreted in bile. Elza's bilirubin of 8 is within the normal and optimal range, confirming healthy liver processing and no issues with red blood cell breakdown.","low_causes":"Normal finding","high_causes":"Liver disease, bile duct obstruction, haemolytic anaemia, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"60","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform essential functions including maintaining blood volume, fighting infection, and transporting hormones. Elza's total protein of 75 is within the optimal range, indicating good nutritional status and normal liver synthetic function.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, chronic inflammation, dehydration, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"34","upper_normal":"50","lower_optimal":"38","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains blood volume, carries hormones and medications, and reflects nutritional status and liver function. Elza's albumin of 40 is within the optimal range, confirming her liver is synthesising protein well.","low_causes":"Liver disease, kidney disease, malnutrition, chronic inflammation","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"g/L","description":"Globulin is a group of proteins that includes antibodies and inflammatory proteins. Elza's globulin of 35 is within the laboratory range but sits near the upper boundary and above the optimal ceiling of 32. Mildly elevated globulin is consistent with chronic inflammation, as seen with her elevated ESR and CRP, and with her rheumatoid arthritis. This is not a separate concern but part of the same inflammatory picture.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"A/G Ratio","group":"LIVER & METABOLIC","result":"1.14","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5714","units":"","description":"The albumin-to-globulin ratio is calculated by dividing albumin by globulin (40/35 = 1.14). It reflects the balance between these two protein groups. Elza's ratio of 1.14 is just within the normal range but below the optimal floor of 1.2, reflecting the slightly elevated globulin driven by her chronic inflammatory conditions. As inflammation improves, this ratio would be expected to rise.","low_causes":"Chronic inflammation, autoimmune disease, liver disease, kidney disease","high_causes":"Immune deficiency, certain genetic conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3650","lower_normal":"0","upper_normal":"2.0","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"","description":"The FIB-4 score is a calculation that estimates the risk of liver fibrosis, or scarring, using age, ALT, AST, and platelet count. The lab has flagged Elza's score of 1.46 as above the standard 1.45 threshold, but importantly notes that for patients over 65, the relevant threshold is 2.0. At 68, Elza's score of 1.46 is well below this age-appropriate threshold. Furthermore, her very low ALT of 8 makes the denominator of the calculation small, which artificially inflates the score. With all her liver enzymes within range and her albumin healthy, there is no evidence of liver fibrosis.","low_causes":"Normal finding, young age","high_causes":"Liver fibrosis, cirrhosis, older age, low platelet count, low ALT","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"30","upper_normal":"118","lower_optimal":"30","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6136","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatic inflammation. Elza's amylase at 30 sits at the lower limit of the range, which is normal and indicates no pancreatic stress.","low_causes":"Chronic pancreatitis with gland damage, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5567","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6666666667","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down dietary fats. It is more specific to the pancreas than amylase. Elza's lipase at 48 is within range and confirms healthy pancreatic function. This is relevant given her cholecystectomy, as the pancreas takes on additional digestive responsibility when the gallbladder is absent.","low_causes":"Chronic pancreatitis with gland destruction","high_causes":"Acute pancreatitis, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5890","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol carried in the blood, including LDL, HDL, and VLDL. While total cholesterol alone is a relatively crude measure, Elza's result of 6.1 mmol/L is above the desirable threshold of 5.18 and reflects the combined elevation of her LDL, VLDL, and triglycerides. In the context of her established coronary artery disease, this level warrants pharmacological intervention alongside lifestyle changes.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Diet, obesity, insulin resistance, hypothyroidism, genetics, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"3.0","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8824","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the main form of fat in the blood, produced by the liver from dietary carbohydrates and fats and also absorbed directly from food. Elza's triglycerides at 3.0 mmol/L are significantly elevated, nearly double the upper fasting limit of 1.7. High triglycerides are strongly driven by insulin resistance, excess refined carbohydrate intake, and elevated body weight, all of which are present here. Elevated triglycerides independently increase cardiovascular risk by contributing to the formation of small, dense LDL particles that are more likely to penetrate artery walls. Reducing refined carbohydrates, losing weight, and increasing physical activity are the most effective ways to lower triglycerides.","low_causes":"Low-fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"Insulin resistance, type 2 diabetes, excess carbohydrates, obesity, alcohol, certain medications including diuretics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4194","lower_normal":"1.55","upper_normal":"3.1","lower_optimal":"1.6","upper_optimal":"3.1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein, is often called 'good' cholesterol because it collects excess cholesterol from the arteries and carries it back to the liver for disposal. Higher levels are protective against cardiovascular disease. Elza's HDL of 1.3 falls below the desirable threshold of 1.55 for women. Low HDL is associated with insulin resistance, elevated triglycerides, higher BMI, and low physical activity, all of which are factors in Elza's profile. Increasing physical activity, particularly aerobic exercise, is one of the most effective ways to raise HDL.","low_causes":"Insulin resistance, obesity, sedentary lifestyle, smoking, high carbohydrate diet, certain medications","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.57","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5713","lower_normal":"0","upper_normal":"3.0","lower_optimal":"0","upper_optimal":"2.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4333","units":"mmol/L","description":"LDL, low-density lipoprotein, is the form of cholesterol that deposits into artery walls and drives atherosclerosis, the build-up of plaques that narrow arteries. Elza's LDL of 3.57 is above the general population target of below 3.0 and significantly above the target of below 1.8 that most cardiologists would set for someone with established coronary artery disease and a stent. This is one of the most important findings in her report and should be discussed with her GP, as statin therapy or intensification would likely be recommended given her cardiovascular history.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, statin therapy","high_causes":"Diet high in saturated fat, obesity, insulin resistance, genetics, hypothyroidism, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8718","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL, very low-density lipoprotein, is a triglyceride-rich particle produced by the liver. It carries triglycerides to tissues for energy or storage and is a precursor to LDL. Elza's VLDL of 1.36 is significantly elevated, nearly double the upper limit of 0.78, directly reflecting her elevated triglycerides. VLDL particles contribute to cardiovascular risk and are a marker of metabolic overload. Reducing triglycerides through the measures described elsewhere in this report will bring VLDL down in parallel.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"Insulin resistance, type 2 diabetes, excess carbohydrates, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.69","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5211","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by HDL to give a single number reflecting cardiovascular risk. A ratio below 4.5 is desirable, and below 3.5 is optimal. Elza's ratio of 4.69 is above the desirable threshold, driven by both her elevated total cholesterol and her below-target HDL. Improvements in either direction, lowering total cholesterol or raising HDL, will improve this ratio.","low_causes":"High HDL, low total cholesterol","high_causes":"High total cholesterol, low HDL, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_pct","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"21.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5328","lower_normal":"20.0","upper_normal":"60","lower_optimal":"25","upper_optimal":"60","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6250","upper_optimal_position":"1","units":"%","description":"HDL percentage shows what proportion of total cholesterol is made up of the protective HDL fraction. Elza's 21.31% is just above the 20% minimum but below the optimal threshold of 25%. Ideally, a larger proportion of total cholesterol should be carried in HDL form. Increasing activity and reducing triglycerides would improve this proportion.","low_causes":"Insulin resistance, obesity, sedentary lifestyle, high triglycerides","high_causes":"Regular exercise, genetics, moderate alcohol, lean body composition","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol (6.1 - 1.3 = 4.8). It captures all the atherogenic, or artery-damaging, cholesterol fractions in a single number, including LDL, VLDL, and remnant cholesterol. Many guidelines now consider non-HDL a better predictor of cardiovascular risk than LDL alone, particularly when triglycerides are elevated. Elza's non-HDL of 4.8 is above the target of below 4.0 and should be targeted alongside her LDL.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"High LDL, high triglycerides, insulin resistance, obesity, diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4964","lower_normal":"1.4","upper_normal":"2.8","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It is arguably a better measure of the protective cholesterol fraction than HDL cholesterol itself. Elza's ApoA1 of 1.39 is fractionally below the desirable threshold of 1.4, consistent with her below-target HDL cholesterol. This small shortfall is meaningful primarily in the context of her ApoB/A1 ratio.","low_causes":"Insulin resistance, obesity, sedentary lifestyle, smoking","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.12","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6222","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Because each atherogenic particle carries exactly one ApoB molecule, this marker effectively counts the number of particles capable of depositing cholesterol into artery walls. Many cardiologists consider ApoB the single best predictor of cardiovascular risk. Elza's ApoB of 1.12 is above the desirable limit of 0.9 and in the borderline-high category (1.0 to 1.19). For someone with established coronary artery disease, the target would ideally be below 0.65. This is the number that should drive the conversation about lipid-lowering therapy with her GP.","low_causes":"Statin therapy, hyperthyroidism, malnutrition","high_causes":"High LDL, high triglycerides, insulin resistance, obesity, genetics, diet high in saturated fat","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.81","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6750","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of atherogenic particles (ApoB) to protective particles (ApoA1). It is considered one of the best single summary measures of cardiovascular lipid risk. For women, below 0.6 is lower risk, 0.6 to 0.8 is average risk, and above 0.8 is higher risk. Elza's ratio of 0.81 places her just into the higher-risk category, driven by both elevated ApoB and marginally low ApoA1. Reducing ApoB through medication and lifestyle while increasing ApoA1 through exercise would improve this ratio from both directions.","low_causes":"Statin therapy, high HDL, regular exercise","high_causes":"High LDL, high triglycerides, low HDL, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Li
