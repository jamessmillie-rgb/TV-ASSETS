<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Melika Cheurfi","dob":"20/01/1982","report_date":"2026-09-28","summary":"Melika is a 44-year-old female presenting with a BMI of 20.4, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food rarely; portions are about average (volume 5 out of 10). She trains six times per week (one cardio session and five or more resistance sessions at moderate intensity) with 10,000 to 15,000 daily steps. She sleeps eight or more hours but wakes tired most mornings, with energy lowest on waking. Stress rarely feels hard to manage. She drinks 1 to 4 alcoholic drinks per week. She supplements with vitamin D, magnesium, creatine and omega-3 fish oil. She has a family history of heart attack or stroke before 60 and reports a previous blood test where something was flagged. She reports low energy and fatigue, feeling cold or cold hands and feet, low sex drive, and hair thinning, all lasting months. Her goals are to improve long-term health and longevity, improve energy levels, and lose body fat.\n\nThe most striking finding in this report is the pattern across Melika's insulin, free testosterone, thyroid conversion and red cell production. Taken individually, each looks like a minor laboratory curiosity. Taken together, they tell a coherent story about a body that is running on too little fuel for what it is being asked to do, and that pattern connects directly to the fatigue, the cold extremities, the low libido and the hair thinning she describes.\n\nBefore exploring those concerns, there is a great deal of good news in this panel. Melika's kidney function is excellent. Her Cystatin C, a protein filtered by the kidneys and a more reliable marker of filtration than creatinine alone in lean individuals, is 0.69, giving a combined eGFR of 109, which is textbook for her age. Her liver is in very good health. Gamma GT at 17 is clean, ALT at 30 sits just at the upper edge of the optimal band for women, AST at 31 is comfortably within range, bilirubin at 7 is low and healthy, and her FIB-4 score of 1.0 rules out any early fibrosis. The APRI score of 0.313 and NAFLD Fibrosis Score of minus 2.972 both confirm there is no metabolic liver strain whatsoever. Her De Ritis ratio, the ratio of AST to ALT, sits at 1.03, which is within the ideal band. Her blood sugar control is excellent: fasting glucose at 4.3 and HbA1c at 34 mmol per mol are both comfortably within the optimal range, and her estimated average glucose of 5.8 confirms she is metabolising carbohydrate efficiently. Her inflammatory markers are reassuring. ESR at 10 is within range. Her Platelet to Lymphocyte Ratio of 112.7 and Systemic Immune-Inflammation Index of 300 are both within the ideal band, which means her immune system is not being driven by chronic low-grade inflammation. Her white cell count at 5.1 is healthy, with a balanced differential: neutrophils, lymphocytes, monocytes, eosinophils and basophils are all within range. Her total antioxidant activity at 1.68 is within the ideal range, suggesting good dietary antioxidant intake. Haemoglobin at 136, red blood count at 4.52, haematocrit at 0.416 and MCV at 92.1 are all healthy, so she is not anaemic. Her serum iron at 20.1 and transferrin saturation at 38.67 percent are both excellent, sitting right in the optimal band for iron delivery. Her calcium at 2.37 and corrected calcium at 2.42 are both healthy. Her magnesium at 1.09 is at the top of the laboratory range and above the optimal ceiling of 1.05, which simply reflects her magnesium supplementation and is not a concern. Vitamin D at 131 is excellent, well within the optimal range of 75 to 120, and above it, which again reflects supplementation and is perfectly safe at this level. Her folate at 12 is within the ideal range. Her immune system shows no signs of allergy or autoimmune activation: IgE at 58.9 is well within range, IgG, IgM and IgA are all normal, rheumatoid factor is undetectable, and her tissue transglutaminase is negative, ruling out coeliac disease. Her thyroid antibodies, both TPO and thyroglobulin, are negative, which rules out Hashimoto's thyroiditis and other autoimmune thyroid disease. Her tumour markers, CA125 at 10.3, CA15-3 at 6.02, CA19-9 at 5.1 and CEA at 1.18, are all well within range. Creatine kinase at 90 is healthy for someone training five or more resistance sessions per week, which is reassuring for muscle recovery. Her cortisol at 356, taken in the morning window, is appropriate and shows a normal stress response. Her prolactin at 115 is within the non-pregnant female range. Amylase at 77 and lipase at 40 are both healthy, ruling out pancreatic strain. Her urine is clean: no protein, no glucose, no blood, no white cells, no nitrites, no casts, and the culture is pending.\n\nNow the concerns, and they thread together. The first is Melika's free testosterone. Her total testosterone at 0.8 is within the female reference range, but her SHBG, sex hormone binding globulin, the protein that carries sex hormones in the blood, is 122.4. That is within the laboratory range of 27.8 to 146 but extremely high for a woman of 44. SHBG binds testosterone so tightly that it cannot enter cells and do its work, and with an SHBG this high, Melika's calculated free testosterone is 0.006, below the lower limit of 0.01. Her Free Androgen Index, another way of expressing the same thing, is 0.65, technically within range but sitting right at the floor. Her bioavailable testosterone, the fraction available to tissues, is 0.12, which just touches the lower edge of the optimal band. In practical terms, very little testosterone is getting to her tissues. Testosterone in women is responsible for libido, energy, mood, muscle maintenance and hair follicle health. The combination of very low free testosterone and high SHBG is a strong candidate to explain the low sex drive, some of the fatigue, and the hair thinning she reports. High SHBG in women is driven by low body weight, low calorie intake, high oestrogen relative to androgens, and sometimes thyroid status. At a BMI of 20.4 with five or more resistance sessions a week and portions rated 5 out of 10, under-fuelling is the most likely driver.\n\nThe second concern reinforces this. Melika's fasting insulin is 2.22, just below the lower limit of 2.6, and her C-Peptide, the molecule released alongside insulin that tells us how much the pancreas is producing, is 0.251 micrograms per litre, which converts to approximately 83 picomoles per litre, well below the lower limit of 364 picomoles per litre. Her HOMA-IR, a measure of insulin resistance calculated from insulin and glucose, is 0.42, below the lower limit of 0.5 but in the favourable direction, meaning she is exquisitely insulin-sensitive. In isolation, low insulin and a low HOMA-IR in someone with perfect blood sugar is a positive finding: it means the pancreas barely needs to produce insulin to keep glucose controlled. But when insulin is this low alongside very low C-Peptide, it reflects a body that is receiving minimal carbohydrate and minimal total energy, and the pancreas has simply turned its output down to match. Combined with her lean frame, high training volume and average portion sizes, this suggests her total calorie intake is lower than what her body needs to run all its systems at full capacity.\n\nThe third piece is her thyroid. TSH at 1.37 is ideal, and Free T4 at 17.8 is healthy. Both antibodies are negative. But Free T3, the active thyroid hormone that actually drives metabolism, body temperature, energy and hair growth, is 3.9. The laboratory range starts at 2.6, so this is technically within range, but the optimal band sits between 4.5 and 6.5, and Melika is well below that. Her FT3 to FT4 ratio is 0.219, which sits at the very bottom of the reference range of 0.2 to 0.45 and below the optimal band of 0.27 to 0.4. This means her thyroid gland is producing adequate raw material (T4), but the body is not converting enough of it into the active form (T3). This conversion happens mainly in the liver and kidneys, and the body deliberately slows it down when calorie intake is low, as a way of conserving energy. Low T3 is one of the most sensitive markers of energy deficit, and it produces exactly the symptoms Melika describes: fatigue, feeling cold, cold hands and feet, hair thinning, and difficulty losing body fat despite training hard.\n\nThe fourth finding is her reticulocyte count. Reticulocytes are newly made red blood cells, freshly released from the bone marrow. Her percentage is 0.55, just above the lower limit, but her absolute count is 24.86, well below the lower limit of 50. This means the bone marrow is producing red cells at a reduced rate. Her haemoglobin is healthy at 136, so she is not anaemic, but the marrow is running slowly. Red cell production is an energy-expensive process, and the body reduces it when overall energy availability is low, particularly when iron stores are not generous. Speaking of which, her ferritin at 37 is within the laboratory range but below the optimal level of 40 for women. For a woman training as hard as Melika does, with menstrual losses still occurring (her cycle is regular, and her oestradiol at 222 and progesterone at 12.45 are consistent with the luteal phase), a ferritin of 37 is on the thin side. Ferritin is the stored form of iron, and at this level, the bone marrow has enough to avoid anaemia but not enough to produce red cells at full capacity. This also contributes to fatigue and cold extremities.\n\nHer transferrin is 2.07, below the lower limit of 2.5. Transferrin is the transport protein that carries iron through the blood, and the body adjusts its production based on iron need. Low transferrin can mean either that the body does not need more iron (because stores are adequate) or that inflammation is suppressing it (transferrin is a negative acute phase protein). Her CRP at 1.3 is below 5 but above the optimal threshold of 1.0, which is mildly elevated. At this level, it could contribute to suppressing transferrin slightly, but the more likely explanation in Melika's case is that her body is simply not demanding more iron delivery because its overall metabolic rate is dialled down.\n\nHer RDW, the red cell distribution width, which measures how variable the size of red blood cells is, comes in at 15.4, above the upper limit of 14. When RDW is elevated alongside a normal MCV and normal haemoglobin, it usually means the bone marrow is producing a mix of different-sized cells because it is transitioning, often because iron supply is intermittently tight. This fits with a ferritin of 37 and a reticulocyte count at the floor.\n\nHer uric acid at 157 is below the lower limit of 184. Uric acid is a waste product from the breakdown of purines, found in protein-rich foods and in the body's own cells. Low uric acid is not a disease, but it is associated with very low purine intake, which can reflect low total food intake, particularly low protein and meat consumption. In the context of everything else in this report, it adds another data point to the picture of a body receiving less fuel than it needs.\n\nHer ALP, alkaline phosphatase, at 39 is below the laboratory lower limit of 46. ALP in premenopausal women reflects bone turnover, liver function and nutritional status. With a clean liver, the low ALP here most likely reflects low zinc or low overall nutritional intake. ALP requires zinc as a cofactor, and although zinc was not measured directly in this panel, low ALP in a lean, heavily training woman is worth noting.\n\nHer parathyroid hormone, PTH, at 0.711 is below the lower limit of 0.98. PTH regulates calcium by telling the kidneys to keep it and the bones to release it. When vitamin D is very high, as Melika's is at 131, PTH is suppressed because the body does not need to work to maintain calcium levels. Her corrected calcium is 2.42, healthy and mid-range. This is almost certainly a physiological suppression from excellent vitamin D status rather than a pathological finding, and it does not need investigation, but it is worth knowing that her current vitamin D dose could be reduced slightly, aiming for a level closer to 100 to 120 rather than 131, to allow PTH to sit within its reference range.\n\nHer vitamin B12 at 1823 is well above the upper limit of 982. Elevated B12 in the absence of supplementation can occasionally flag liver disease or a blood disorder, but Melika's liver is clean and her blood count is normal. The most common explanation for a B12 this high is supplementation. She does not list B12 as a current supplement, so it may be present in a multivitamin, a B-complex, or her creatine or omega-3 products. Alternatively, some people have naturally high B12 transport protein levels. This is not a concern, but it would be worth checking whether any of her supplements contain B12, and if they do, she could stop taking it, as her stores are more than sufficient.\n\nTurning to her lipid profile, Melika's total cholesterol at 4.9 is desirable, and her HDL at 1.9 is excellent, well above the optimal threshold of 1.6 for women. Her triglycerides at 1.03 are within the healthy range. Her TC to HDL ratio at 2.58 is excellent. Her Apolipoprotein A1, the protein that builds HDL particles, is 1.78, healthy and strong. Her Lp(a) at 25.97 is below 32, which is genuinely reassuring and means her inherited cardiovascular risk from this marker is low. Her Lp(a)-corrected LDL, which removes the cholesterol carried by Lp(a) particles to show the truly modifiable portion, is 2.5, within range. Her atherogenic index of plasma at minus 0.266 and Castelli II ratio at 1.36 are both within the optimal bands. However, her ApoB is 0.99, above the desirable threshold of 0.9. ApoB, Apolipoprotein B, is the single protein found on every LDL, VLDL and Lp(a) particle, so counting ApoB particles tells us the total number of cholesterol-carrying particles in the blood. It is considered the best single predictor of cardiovascular risk. At 0.99, Melika is in the \"above desirable\" band. Her LDL at 2.58 is within the laboratory range but above the optimal target of 2.0. Given her family history of heart attack or stroke before 60, this is worth taking seriously. Her ApoB to A1 ratio at 0.556 is within the lower-risk band of below 0.6, which is reassuring, but the absolute ApoB number is what matters most for long-term risk. Her Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c that measures the risk being accumulated right now, is 35 out of 100, within the acceptable range of below 40 but above the ideal threshold of 20. The ApoB and CRP are the two inputs driving that score. With a family history of early cardiovascular disease, reducing ApoB below 0.9 through dietary changes, specifically increasing soluble fibre and oily fish while moderating saturated fat, would be a meaningful step.\n\nHer hsCRP at 1.3 deserves a brief mention in its own right. It is well within the laboratory range of below 5, but the optimal threshold for long-term cardiovascular risk is below 1.0. At 1.3, this is mildly above optimal. In a lean, active woman with no obvious inflammatory source, this could reflect training-related muscle inflammation (she trains six days a week), the mild iron deficit, or simply normal variation. It is not a concern on its own, but it contributes to the cardiovascular risk score and is worth rechecking.\n\nHer oestradiol at 222 and progesterone at 12.45, taken together with an LH of 9.63 and FSH of 8.61, are consistent with the luteal phase of a regular menstrual cycle. FSH below 10 at 44 suggests she is not yet perimenopausal from a hormonal standpoint, which is positive. Her DHEA-S at 2.6 micromoles per litre (approximately 958 micrograms per decilitre) is within range.\n\nHer MPV, mean platelet volume, at 10.5 is marginally above the upper limit of 10.1. MPV measures the average size of platelets. A mildly elevated MPV with a normal platelet count of 248 is a common incidental finding and is not clinically significant.\n\nPutting this all together, the thread running through this report is energy availability. Melika eats a clean diet with rarely any processed or sugary food, she trains hard six days a week, she walks 10,000 to 15,000 steps a day, and she sleeps eight or more hours. But her portions are average, her BMI is 20.4, and her body is showing the signs of running a caloric deficit against her activity level. The suppressed insulin and C-Peptide, the below-optimal Free T3 and low FT3 to FT4 conversion ratio, the very high SHBG binding up her testosterone, the low reticulocyte production, the low-normal ferritin, the low uric acid and the low ALP all point in the same direction. The body responds to chronic energy deficit by quietly downgrading the functions it can survive without in the short term: it slows thyroid conversion to reduce metabolic rate (which causes cold extremities and fatigue), it raises SHBG to reduce the availability of sex hormones (which lowers libido and contributes to hair thinning), it reduces red cell production to conserve iron and energy, and it turns insulin production down to match the low fuel supply.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 44 against a calendar age of 44, so the blood chemistry reads as the calendar age. The good news is that every one of these findings is reversible with more food, specifically more protein and more total calories, and a slight reduction in training volume or a more structured approach to recovery nutrition.","links":"The findings in this report are not scattered across different body systems by coincidence. They share a single common driver: the gap between Melika's energy expenditure and her energy intake. At a BMI of 20.4, training six days per week at moderate intensity, and walking 10,000 to 15,000 steps, her total daily energy expenditure is high. Her portions are self-rated as average, and with 2 to 3 portions of fruit and vegetables and rarely any processed food, the quality of what she eats is reasonable, but the volume appears insufficient for the demand.\n\nThe body has a hierarchy of priorities when fuel is scarce. It protects blood sugar first, and Melika's glucose and HbA1c are perfect, confirming that this system is fully protected. It keeps the heart beating and the brain running. But it quietly reduces spending on everything it classifies as non-essential in the short term. Thyroid conversion is one of the first things to slow: the body stops converting T4 into the active hormone T3, reducing metabolic rate and heat production. This is exactly what her FT3 of 3.9 and FT3 to FT4 ratio of 0.219 show, and it explains the morning fatigue, the feeling cold, and the cold hands and feet. The thyroid gland itself is healthy, TSH is perfect and antibodies are negative, so this is not thyroid disease. It is the body's thermostat being deliberately turned down.\n\nThe next system to be dialled back is reproduction. SHBG rises when the body senses low energy availability, binding testosterone and reducing its tissue availability. Melika's SHBG at 122.4 is doing exactly that, leaving her free testosterone at 0.006, half the lower limit. This explains the low libido and contributes to the hair thinning, because hair follicles are testosterone-sensitive. Her cycle is still regular and her oestradiol and progesterone suggest a normal luteal phase, so the reproductive axis has not shut down, but the androgenic arm has been significantly suppressed.\n\nRed cell production is another energy-expensive process the body economises on. Her reticulocyte absolute count at 24.86, half the lower limit, shows the bone marrow producing fewer new red cells than it should. She is not anaemic because her existing red cells are healthy, but the production line is running at half speed. Her ferritin at 37, while within the laboratory range, is below optimal for a menstruating woman who trains heavily, and the low transferrin at 2.07 suggests the body is not requesting more iron delivery. The elevated RDW at 15.4 reflects the variable cell sizes produced when the marrow is working with intermittently tight iron supply.\n\nThe insulin and C-Peptide findings complete the picture. Fasting insulin of 2.22 and C-Peptide converting to approximately 83 picomoles per litre are not signs of pancreatic failure; her blood sugar is perfect and her HOMA-IR of 0.42 shows exceptional insulin sensitivity. But the pancreas has turned its output down to match the low fuel coming in, and these very low levels are a reliable marker of chronic low energy intake.\n\nWhat was excluded matters too. There is no autoimmune thyroid disease (both antibodies negative). There is no coeliac disease (TTG negative), which can cause hair loss and malabsorption. There is no iron deficiency anaemia (haemoglobin 136, iron 20.1, saturation 38.67 percent). There is no significant inflammation (ESR 10, CRP 1.3, SII 300). There is no kidney or liver disease. There is no perimenopausal hormone shift (FSH 8.61). There is no cortisol abnormality. The symptoms are not coming from disease; they are coming from a fuel deficit.\n\nThe one finding that sits outside this pattern is the ApoB at 0.99, which is driven by LDL particle number rather than by energy deficit. Given the family history of early cardiovascular disease, this is an independent finding that warrants its own dietary attention, specifically increasing soluble fibre intake, eating oily fish two to three times per week, and being mindful of saturated fat sources, while simultaneously increasing total calories.","lifestyle":"Add a palm-sized portion of protein to every meal and to at least one snack. Eggs, Greek yoghurt, chicken, fish, lentils or tofu. Anchor: protein goes on the plate first, before anything else. Why: increasing total protein and calorie intake is the single most important change in this report, and it addresses the suppressed insulin, the low free testosterone, the reduced T3 conversion, and the low reticulocyte production.\nIncrease total portion sizes by roughly 20 percent, starting with your largest meal. An extra handful of rice, pasta, potato or bread alongside the protein. Anchor: serve yourself what you normally would, then add one more spoonful. Why: at a BMI of 20.4 with six training sessions and 10,000 to 15,000 steps, your body is spending more energy than it is receiving, and every flagged marker in this report improves when that gap closes.\nEat a snack containing protein and carbohydrate within 30 to 60 minutes of finishing each resistance session. A banana with nut butter, a protein shake with oats, or yoghurt with fruit and granola. Anchor: pack it in your gym bag so it is there when you finish. Why: post-training nutrition supports muscle recovery, replenishes glycogen, and signals to the body that fuel is available, which helps restore T3 conversion and reticulocyte production.\nEat oily fish (salmon, mackerel, sardines, trout) two to three times per week. Anchor: batch-cook or buy tinned for convenience and slot into lunches. Why: oily fish provides omega-3 that supports ApoB reduction, which matters given your family history of early cardiovascular disease, and also provides protein and calories.\nAdd a daily source of soluble fibre: oats at breakfast, a handful of beans or lentils in a salad or stew, or an apple or pear as a snack. Anchor: keep porridge oats and tinned lentils in the kitchen as staples. Why: soluble fibre lowers LDL particle number and ApoB, and your ApoB at 0.99 is the one lipid marker above the desirable threshold.\nTake one full rest day per week from resistance training, reducing from six sessions to five. Anchor: choose a fixed day, protect it, and use it for a walk or gentle stretching only. Why: recovery is when the body rebuilds, and in an energy-deficit state, training without adequate rest deepens the deficit and worsens T3 suppression, SHBG elevation and reticulocyte suppression.\nGet outside within 30 minutes of waking for 10 to 15 minutes of daylight. Anchor: the first thing after getting up, before coffee. Why: morning light resets the circadian clock, improves cortisol awakening response, and directly addresses the pattern of being tired on waking but with energy improving later in the day.\nReduce your vitamin D supplement to 2,000 IU daily (from whatever your current dose is). Anchor: take it with your largest meal that contains some fat. Why: your vitamin D is 131, which is above the optimal ceiling of 120 and is suppressing your parathyroid hormone below range. Reducing the dose slightly will keep vitamin D in the ideal window of 75 to 120 while allowing PTH to normalise.","flags":"Free Testosterone 0.006 nmol/L, below the lower limit of 0.01, driven by SHBG at 122.4 binding most of her total testosterone of 0.8. Associated with low libido, fatigue and hair thinning. Likely driven by chronic low energy availability at BMI 20.4 with high training volume. Recommend discussing with GP if symptoms persist after three months of increased calorie and protein intake.\nFree T3 3.9 pmol/L, within laboratory range (2.6 to 7.1) but well below the optimal band of 4.5 to 6.5. FT3:FT4 ratio 0.219, at the floor of the reference range and below optimal. Indicates reduced conversion of T4 to active T3, most likely driven by low energy availability. Explains fatigue, cold extremities and possibly hair thinning. Not thyroid disease: TSH 1.37 ideal, both antibodies negative.\nFasting Insulin 2.22 mIU/L, below the lower limit of 2.6. C-Peptide 0.251 ug/L (approximately 83 pmol/L), well below the lower limit of 364 pmol/L. HOMA-IR 0.42, below range in the favourable direction. Blood sugar is perfect (glucose 4.3, HbA1c 34). Pattern reflects very low calorie and carbohydrate intake rather than pancreatic insufficiency.\nReticulocyte absolute count 24.86, below the lower limit of 50, with reticulocyte percentage 0.55 just above the floor. Bone marrow is producing red cells at a reduced rate. Haemoglobin 136 so not anaemic, but production is slowed, consistent with low energy availability and borderline ferritin.\nFerritin 37 ng/ml, within laboratory range (10 to 291) but below the optimal level of 40 for a menstruating woman training six days per week. Transferrin 2.07 g/L, below the lower limit of 2.5. Iron 20.1 and saturation 38.67 percent are both healthy, so iron delivery is adequate but stores are thinning.\nRDW 15.4%, above the upper limit of 14. With normal MCV and haemoglobin, this reflects variable red cell sizing from intermittently tight iron supply and low reticulocyte production.\nApoB 0.99 g/L, above the desirable threshold of 0.9. LDL 2.58 mmol/L, within range but above optimal of 2.0. Given family history of heart attack or stroke before 60, ApoB should be brought below 0.9 through dietary modification. HDL 1.9, ApoA1 1.78, triglycerides 1.03, Lp(a) 25.97, ApoB/A1 ratio 0.556 are all healthy or optimal.\nCardiovascular Risk Score 35 out of 100, within the acceptable range of below 40 but above the ideal threshold of 20, driven by ApoB and hsCRP.\nhsCRP 1.3 mg/L, within laboratory range but above the optimal threshold of 1.0. Mildly elevated; may reflect training load, mild iron deficit, or normal variation.\nUric acid 157 umol/L, below the lower limit of 184. Associated with low purine and low total food intake. Not pathological but adds to the energy deficit picture.\nALP 39 IU/L, below the lower limit of 46. In a premenopausal woman with a clean liver, low ALP may reflect low zinc or low overall nutritional intake.\nPTH 0.711 pmol/L, below the lower limit of 0.98. Corrected calcium 2.42 is healthy. PTH is suppressed by the very high vitamin D of 131. Reducing vitamin D supplementation dose slightly will allow PTH to normalise.\nVitamin B12 1823 pg/ml, above the upper limit of 982. Liver and blood count are normal. Most likely from supplementation in one of her current products. Not a concern but worth identifying the source and stopping the additional B12.\nMPV 10.5 fL, marginally above the upper limit of 10.1, with a normal platelet count of 248. Not clinically significant.\nReassuring negatives: thyroid function healthy with negative antibodies (TSH 1.37, FT4 17.8, TPO < 6.6, TgAb < 1.3), no coeliac disease (TTG negative, IgA 1.9), no anaemia (Hb 136), excellent kidney function (Cystatin C 0.69, combined eGFR 109), clean liver (GGT 17, FIB-4 1.0, APRI 0.313), excellent blood sugar (glucose 4.3, HbA1c 34), no significant inflammation (ESR 10, SII 300, PLR 112.7), normal tumour markers, normal immunoglobulins, no perimenopausal shift (FSH 8.61), normal cortisol, Lp(a) 25.97 below threshold.","recommendations":"Discuss the low free testosterone (0.006, below 0.01) and very high SHBG (122.4) with her GP, explaining that the most likely driver is low energy availability but that if symptoms persist after three months of dietary changes, further hormonal investigation may be warranted.\nAsk the GP to note the Free T3 of 3.9 and FT3:FT4 ratio of 0.219, both below optimal, as evidence of reduced thyroid conversion likely driven by under-fuelling rather than thyroid disease. If fatigue and cold extremities persist despite calorie increase, a repeat thyroid panel including reverse T3 would clarify.\nMention the low reticulocyte absolute count (24.86, below 50) and ferritin (37, below optimal of 40) to the GP. If fatigue does not improve with dietary changes and iron-rich foods, a trial of low-dose iron supplementation may be appropriate, guided by a repeat ferritin and full blood count.\nBring the ApoB of 0.99 (above 0.9) and family history of heart attack or stroke before 60 to the GP's attention. Dietary changes (soluble fibre, oily fish, moderate saturated fat) should be the first-line approach, with a repeat lipid panel in six months to assess progress.\nMention the elevated B12 of 1823 so the GP is aware. Identify the supplemental source and stop it; no further investigation needed unless B12 remains elevated after supplementation is removed.\nAim for approximately 1,800 to 2,000 calories per day (current estimated TDEE of approximately 2,100 to 2,200 based on her weight, height and activity level, with a small surplus initially to close the energy gap before titrating to maintenance). Protein target: 85 to 105 grams per day (1.6 to 2.0 grams per kilogram at 53.5 kilograms, appropriate for her resistance training volume). Retest in four months, repeating: full blood count with reticulocytes, ferritin, transferrin, Free T3, SHBG, free testosterone, fasting insulin, C-Peptide, ApoB and hsCRP.","supplementation":"Vitamin D3 (cholecalciferol): reduce to 2,000 IU daily, taken with a meal containing fat. Her level of 131 is above the optimal ceiling of 120 and is suppressing PTH. A lower dose will maintain vitamin D in the 75 to 120 sweet spot.\nVitamin K2 (MK-7): 100 micrograms daily, taken with the vitamin D. K2 directs calcium into bones and away from arteries, and should always accompany vitamin D supplementation.\nMagnesium glycinate: continue at 300 to 400 milligrams before bed. Her level of 1.09 is at the top of range, which is fine, and magnesium supports sleep quality, muscle recovery and over 300 enzymatic reactions.\nOmega-3 fish oil: continue at 2 to 3 grams of combined EPA and DHA daily, taken with food. Supports ApoB reduction and anti-inflammatory pathways, both relevant with her ApoB at 0.99 and family history.\nCreatine monohydrate: continue at 3 to 5 grams daily. Supports resistance training performance and recovery, and emerging evidence suggests cognitive benefits.\nIron (ferrous bisglycinate): 25 milligrams every other day, taken with a source of vitamin C (orange juice, kiwi, bell pepper) and away from tea or coffee by at least one hour. Why every other day: absorption is better on alternate days. Her ferritin at 37 is below optimal for a menstruating woman training six days per week, and her reticulocyte production is suppressed. Reassess after three months with a repeat ferritin.\nDo not take additional B12. Her level of 1823 is nearly double the upper limit. Check whether her creatine, omega-3 or any other supplement contains B12, and if so, switch to a product without it.\nThe most important changes from this report are not supplements. They are eating more food, specifically more protein and more total calories, to close the energy gap that is suppressing her thyroid conversion, her free testosterone, her reticulocyte production and her ferritin stores.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"54","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4909","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 54 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 54. Weakest systems: vitamins & nutrients 14%, glucose & insulin 22%, iron studies 42%. Biggest drags: C-Peptide, Vitamin B12, Apolipoprotein B, Red Cell Distribution Width.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","g e function, mood and muscle function. Melika's result of 131 is above the sufficient threshold and within the laboratory range, but above the optimal ceiling of 120. This reflects her vitamin D supplementation and is not harmful at this level, but the dose could be reduced slightly to bring the level into the 75 to 120 optimal window, which would also allow her parathyroid hormone (currently suppressed below range) to normalise.","low_causes":"Insufficient sun exposure, dark skin, inadequate supplementation, malabsorption, obesity","high_causes":"Supplementation, excessive sun exposure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"0.711","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2230","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4053","upper_optimal_position":"0.5587","units":"pmol/L","description":"PTH, parathyroid hormone, regulates calcium levels by telling the kidneys to retain calcium and the bones to release it. It works in balance with vitamin D. Melika's PTH of 0.711 is below the lower limit of 0.98. However, her corrected calcium is 2.42 (healthy and mid-range), and her vitamin D is 131, which is above the optimal ceiling. When vitamin D is this high, PTH is physiologically suppressed because the body does not need it to maintain calcium. This is almost certainly a normal response to high vitamin D rather than a parathyroid gland problem. Reducing her vitamin D supplement dose should allow PTH to return to its reference range.","low_causes":"High vitamin D, hypoparathyroidism, magnesium deficiency, post-thyroid surgery","high_causes":"Vitamin D deficiency, kidney disease, hyperparathyroidism, calcium deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucosecorrecte Total cholesterol is the sum of all cholesterol in the blood, including HDL (protective), LDL (potentially harmful) and VLDL. Melika's result of 4.9 is within the desirable range of below 5.18 and within the optimal band. Total cholesterol alone does not tell the full story; the breakdown into HDL, LDL and ApoB matters more.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet high in saturated fat, genetic predisposition, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3029","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and carbohydrate intake. Melika's result of 1.03 is within the healthy range of below 1.7 but just above the optimal threshold of 1.0. This is a healthy level overall and shows no metabolic concern.","low_causes":"Very low fat diet, malabsorption, hyperthyroidism","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3013","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, very low-density lipoprotein, carries triglycerides from the liver to tissues. Melika's result of 0.47 is within the optimal range, indicating healthy triglyceride metabolism and no excess fat being transported.","low_causes":"Very low fat or carbohydrate diet","high_causes":"High carbohydrate diet, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5938","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL, high-density lipoprotein, is the protective form of cholesterol that removes excess cholesterol from arteries and returns it to the liver for disposal. Higher is better. Melika's result of 1.9 is excellent, well above the optimal threshold of 1.6 for women. This is a strong cardiovascular protective factor and reflects her active lifestyle and healthy diet quality.","low_causes":"Sedentary lifestyle, obesity, smoking, high carbohydrate diet, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.58","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4387","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5333","units":"mmol/L","description":"LDL, low-density lipoprotein, carries cholesterol to tissues and can deposit it in artery walls if levels are too high. Melika's result of 2.58 is within the laboratory range of 0.5 to 3.0 but above the optimal target of below 2.0. Given her family history of heart attack or stroke before 60, lowering isease, hyperthyroidism","high_causes":"High saturated fat diet, genetic factors, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6357","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main structural protein of HDL particles. Higher levels indicate more HDL particles and better cholesterol removal from arteries. Melika's result of 1.78 is excellent and well above the minimum of 1.4, reflecting a strong HDL system.","low_causes":"Genetic factors, sedentary lifestyle, smoking, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB, Apolipoprotein B, is the single protein found on every LDL, VLDL and Lp(a) particle. Counting ApoB tells us the total number of cholesterol-carrying particles in the blood, which is now considered the single best predictor of cardiovascular risk, better than LDL concentration alone. Melika's result of 0.99 is above the desirable threshold of 0.9, placing her in the 'above desirable' band. Given her family history of heart attack or stroke before 60, this is the finding that deserves the most attention in her lipid profile. Her excellent HDL and ApoA1 are protective, and her ApoB/A1 ratio at 0.556 is in the lower-risk band, but the absolute ApoB number is what needs to come down. Dietary changes, specifically increasing soluble fibre (oats, beans, lentils), eating oily fish two to three times per week, and being mindful of saturated fat sources, are the first-line approach. A repeat in six months will show whether these changes are working.","low_causes":"Very low fat diet, liver disease, hyperthyroidism, statin therapy","high_causes":"High saturated fat diet, genetic factors (familial hypercholesterolaemia), hypothyroidism, insulin resistance, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.556","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio summarises the balance between harmful cholesterol-carrying particles (ApoB) and protective particles (ApoA1). A ratio below 0.6 is considered lower risk. Melika's result of 0.556 falls within the lower-risk band, meaning her strong HDL system is partially offsetting the elevated ApoB. However, the ApoB in absolute terms still needs to come down.","low_causes":"High HDL, low LDL, healthy lifestyle","high_causes":"High LDL, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"25.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4059","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that deposits cholesterol in artery walls, promotes clotting and drives inflammation. Unlike LDL, it cannot be changed by diet or exercise; the level is fixed by genetics. Melika's result of 25.97 is below the 32 threshold, placing her in the normal-risk category. This is genuinely useful information because it means the elevated ApoB in her profile is driven entirely by modifiable factors (diet and lifestyle) rather than by an inherited Lp(a) burden. It also means her first-degree relatives are less likely to carry elevated Lp(a).","low_causes":"Genetic variation (favourable)","high_causes":"Genetic inheritance (fixed, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"160","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3952","upper_optimal_position":"0.6048","units":"U/L","description":"Creatine kinase (CK) is an enzyme released from muscles when they are damaged during exercise or injury. Melika's result of 90 is within the optimal range, which is reassuring for someone training five or more resistance sessions per week. It suggests her muscles are recovering well between sessions and she is not overtraining from a muscular damage perspective.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle damage, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5223","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/L","description":"Free T4 (thyroxine) is the thyroid hormone produced directly by the thyroid gland. It is the raw material that the body converts into the active hormone T3. Melika's FT4 of 17.8 is within the optimal range, confirming that her thyroid gland itself is producing adequate hormone. The issue in this report is not T4 production but T3 conversion.","low_causes":"Hypothyroidism, pituitary disease, severe illness, medications","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3979","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3686","upper_optimal_position":"0.4632","units":"mIU/L","description":"TSH, thyroid stimulating hormone, is produced by the pituitary gland and tells the thyroid how much hormone to make. A high TSH means the thyroid is not producing enough and the brain is trying harder; a low TSH means it is producing too much. Melika's TSH of 1.37 is within the optimal range of 1.0 to 2.5, confirming that the pituitary is satisfied with thyroid output and the thyroid gland itself is working well.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, recovery from illness, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3815","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolism, body temperature, energy production and hair growth. The body makes most of its T3 by converting T4 in the liver and kidneys. Melika's FT3 of 3.9 is within the laboratory range but well below the optimal band of 4.5 to 6.5. With a healthy TSH and a good FT4, this means the thyroid gland is producing adequate raw material, but the body is not converting enough of it into active T3. This conversion is deliberately slowed when calorie intake is too low for the body's energy demands, as a way of conserving energy by reducing metabolic rate. Low T3 produces exactly the symptoms Melika reports: fatigue, feeling cold, cold hands and feet, hair thinning, and difficulty losing body fat despite regular training.","low_causes":"Low energy availability (caloric deficit), chronic illness, selenium deficiency, iron deficiency, medications, ageing","high_causes":"Hyperthyroidism, excessive T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/ml","description":"TPO antibodies are markers of autoimmune attack on the thyroid gland, seen in Hashimoto's thyroiditis. Melika's result of below 6.6 is well within the normal range and negative, ruling out autoimmune thyroid disease as a cause of her low T3 conversion.","low_causes":"Absence of autoimmune thyroid disease (normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tgantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3409","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to make hormones. Elevated levels indicate autoimmune thyroid disease. Melika's result of below 1.3 is undetectable, which is normal (over 80% of the population have undetectable levels). Combined with negative TPO antibodies, this comprehensively rules out autoimmune thyroid disease.","low_causes":"Absence of autoimmune thyroid disease (normal)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer monitoring","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.219","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3587","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the inactive thyroid hormone T4 into the active form T3. A low ratio means the body is producing adequate T4 but not converting enough of it. Melika's ratio of 0.219 sits at the very bottom of the reference range and below the optimal band of 0.27 to 0.4. This reduced conversion is the mechanism behind her low FT3 of 3.9, which is driven by the FT3 being low while FT4 at 17.8 is healthy. In the context of her other results, this reduced conversion is most likely a physiological response to chronic low energy availability.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca125","name":"CA-125","group":"TUMOR MARKERS","result":"10.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1471","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA-125 is a protein that can be elevated in ovarian cancer but also in benign conditions like endometriosis, menstruation and pelvic inflammation. Melika's result of 10.3 is well within the normal range, providing reassurance.","low_causes":"Normal (no clinical significance)","high_causes":"Ovarian cancer, endometriosis, menstruation, pelvic inflammatory disease, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA 15-3","group":"TUMOR MARKERS","result":"6.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1003","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 15-3 is a protein used as a marker for breast cancer monitoring. Melika's result of 6.02 is well within the normal range, providing reassurance.","low_causes":"Normal (no clinical significance)","high_causes":"Breast cancer, liver disease, ovarian or lung cancer","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0689","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37" Tissue transglutaminase IgA (tTG) is the primary screening test for coeliac disease, an autoimmune condition triggered by gluten that damages the gut lining and can cause malabsorption, fatigue, hair loss and anaemia. Melika's result of 0.426 is negative (well below the 7.19 threshold), ruling out coeliac disease as a cause of her symptoms. The test is validated by her normal IgA level of 1.9.","low_causes":"Absence of coeliac disease (normal)","high_causes":"Coeliac disease, dermatitis herpetiformis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5738","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4681","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the reactive molecules that damage cells and drive ageing. Melika's result of 1.68 is within the optimal range, reflecting good dietary antioxidant intake from her vegetables and fruit and potentially her omega-3 supplementation.","low_causes":"Poor diet, smoking, chronic disease, oxidative stress","high_causes":"High fruit and vegetable intake, antioxidant supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"356","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4445","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3719","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's primary stress hormone, produced by the
