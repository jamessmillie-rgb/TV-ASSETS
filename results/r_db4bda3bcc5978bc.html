<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Alexander Edward Hanton-Rhys","dob":"21/09/1996","report_date":"2026-10-06","summary":"Alexander is a 30-year-old male presenting with a BMI of 25.6, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). He trains five times per week (two cardio, three resistance) at moderate intensity with 7,500 to 10,000 daily steps. He sleeps 6 to 7 hours and is slow to get going on waking, with energy described as tired on waking; stress feels hard to manage some weeks. Alcohol is 5 to 9 drinks per week. He takes creatine and probiotics, no medications, and no diagnosed conditions. He has no family history reported and no previous blood test. He reports no specific symptoms but his goals are to build muscle, improve energy levels and improve mood. He notes that he used to take multivitamins or occasional vitamin D during winter but stopped because he did not notice a difference and would like to know whether supplementation is actually needed.\n\nThe overall picture here is reassuring. Alexander's blood is telling a story of a healthy 30-year-old whose body is functioning well across most systems, with a handful of areas where targeted changes will move the dial on his energy and mood goals.\n\nStarting with the positives, and there are plenty. His cardiovascular profile is genuinely excellent. Total cholesterol is 4.8, well within the desirable range, with an HDL of 2.2, which is unusually high and strongly protective. HDL is the lipoprotein that carries cholesterol away from artery walls back to the liver for disposal, and at 2.2 it is doing that job exceptionally well. His LDL, the lipoprotein that deposits cholesterol into artery walls, sits at 2.28, comfortably within the optimal zone below 2.6. Triglycerides at 0.75 are excellent, well below the 1.0 optimal threshold. Apolipoprotein B, which is a direct count of the number of potentially harmful cholesterol-carrying particles in the blood and is considered by many cardiologists to be the single best predictor of cardiovascular risk, is 0.83, below the 0.9 desirable limit. Apolipoprotein A1, the protein that sits on the protective HDL particles, is 1.88, well above the 1.20 floor. The ApoB to A1 ratio, which captures the balance between atherogenic and protective particles in a single number, is 0.441, firmly in the lower-risk category below 0.7. Put together, this is a lipid profile that most people would be very happy with at any age, let alone at 30.\n\nHis liver is in excellent health. ALT at 24 is below the tighter optimal cutoff of 30, Gamma GT (an enzyme that rises with alcohol exposure, metabolic strain or bile duct issues) is just 21, well within optimal range, AST at 33 is clean, and albumin at 47 shows strong synthetic function. The FIB-4 score, a formula that combines age, platelets, AST and ALT to screen for liver scarring, is 1.0, well below the 1.45 threshold, confirming there is no sign of fibrosis. The APRI and NAFLD fibrosis scores both confirm the same thing. Despite drinking 5 to 9 units a week, the liver is showing no metabolic strain whatsoever.\n\nKidney function is healthy. Creatinine at 85 gives an eGFR above 90, which is where it should be at 30. Urea at 5.8 is mid-range and the urea-to-creatinine ratio is 68.2, well within normal. Uric acid at 387 is within the laboratory range, though it sits above the tighter optimal band of 200 to 380 for men. At this margin it is not a concern, but it is worth keeping an eye on, particularly as alcohol and sugary foods both drive uric acid up.\n\nHis thyroid is working well. TSH (thyroid stimulating hormone, the signal the pituitary sends to the thyroid to tell it how hard to work) is 1.0, right in the sweet spot of the optimal 1.0 to 2.5 band. Free T4 at 17.6 and free T3 at 5.0 are both within optimal ranges, and the FT3 to FT4 ratio at 0.284 shows the thyroid is converting its storage hormone into the active form efficiently. The thyroid is not contributing to his fatigue or low mood.\n\nInflammation is low. High-sensitivity CRP (a protein the liver releases into the blood when there is inflammation anywhere in the body) is 0.9, just within the optimal cutoff of 1.0. The systemic immune-inflammation index and platelet-to-lymphocyte ratio are both within their optimal bands. His white cell count at 6.69 is healthy, with neutrophils and lymphocytes both sitting within range. Monocytes and basophils are fine.\n\nHis HbA1c, which reflects average blood sugar over the past two to three months by measuring how much glucose has attached itself to red blood cells, is 36 mmol/mol (5.4%), right at the optimal threshold. Estimated average glucose from this reading is 6.1, within the optimal band. There is no sign of insulin resistance or pre-diabetes.\n\nCreatine kinase, an enzyme released when muscle fibres break down during exercise, is 222, well within the 40 to 320 range and consistent with his three resistance sessions per week. The cardiac markers CK-MB at 3.16 (below the 4.9 limit) and the ratio of CK-MB to total CK confirm that the CK is coming from skeletal muscle, not the heart.\n\nHis urinalysis is completely clean. No protein, no glucose, no ketones, no white cells, no red blood cells, no casts, no bacterial growth. This rules out kidney inflammation, urinary tract infection and diabetes-related kidney spillover in one go.\n\nPhenoAge, a composite biological age score built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes in at 23.6 years against his calendar age of 30, putting him 6.4 years younger biologically. This is a strong result and reflects the clean inflammation, healthy liver and kidney function and good blood sugar control.\n\nNow to the areas that deserve attention, starting with the most important one for his goals.\n\nTestosterone at 13.3 nmol/L is within the laboratory reference range of 8.4 to 28.7, and above the lab's recommended floor of 12, but it is well below the optimal band of 18 to 30 for a 30-year-old man. Testosterone is the primary anabolic hormone that drives muscle protein synthesis, recovery, motivation, mood and energy. At 13.3 he has less than half the hormonal support of a man sitting at the optimal midpoint. Free testosterone, which is the fraction not bound to proteins and therefore available to act on tissues, is 0.2586, and bioavailable testosterone (the portion not tightly bound to SHBG) is 6.6, both within their respective ranges but towards the lower half. SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable) is 32.6, which is mid-range and not the explanation for the low total. LH (luteinising hormone, the signal the pituitary sends to the testes to produce testosterone) is 2.54, which is within range but sitting in the lower third. This suggests the pituitary is not pushing the testes particularly hard, which can be driven by poor sleep quality, insufficient recovery, chronic low-grade stress or alcohol. Alexander sleeps 6 to 7 hours and describes himself as tired on waking and slow to get going, and drinks 5 to 9 units a week. Alcohol directly suppresses testosterone production, and sleep is when the bulk of testosterone is manufactured, with the majority produced during deep sleep in the first half of the night. A man getting 6 hours of fragmented or insufficiently deep sleep can produce measurably less testosterone than the same man getting 7.5 to 8 hours. This is very likely the single biggest factor behind both his energy and mood goals and his desire to build muscle. Improving sleep quantity and quality and reducing alcohol are the two highest-yield levers in this report.\n\nCortisol at 227 nmol/L is within the morning reference range of 145 to 619 but sits in the lower quarter. Cortisol should peak in the first 30 to 60 minutes after waking, driving alertness and energy. A lower morning cortisol combined with feeling tired on waking and wired at night (his energy pattern) raises the possibility of a shifted cortisol rhythm, where cortisol is low when it should be high and higher later in the day when it should be falling. This is not a disease; it is a pattern driven by late-night light exposure, irregular sleep timing, caffeine after midday and chronic background stress. It responds well to a fixed wake time, morning light and an evening wind-down routine.\n\nDHEA-S at 8.1 umol/L (approximately 2,986 ug/dL) is within range but sitting in the middle. DHEA-S is the adrenal precursor to both testosterone and oestrogen, and at 30 it should be near its lifetime peak. It is adequate here but worth watching in context of the lower testosterone.\n\nMyoglobin at 87.73 is flagged above the upper limit of 72. Myoglobin is a protein found inside muscle cells that stores oxygen, and it leaks into the blood when muscle fibres are damaged, whether from exercise, a knock or delayed sample processing. At 87.73, with a CK-MB of 3.16 (well below the cardiac concern threshold of 4.9) and no chest pain or cardiac symptoms, this is almost certainly exercise-related muscle turnover from his resistance training. The lab notes that results can be elevated after exercise and on samples not received same day. This does not need investigation but is worth noting so that it is not misinterpreted on a future test.\n\nCorrected calcium at 2.18 is marginally below the lower limit of 2.2. Corrected calcium adjusts the raw calcium reading (2.3, which is within range) for the albumin level to give a more accurate picture of how much calcium is actually available in the blood. At 2.18, this is 0.02 below the lower boundary, which is within the margin of laboratory variation, and the lab themselves note that calcium can be falsely reduced in older specimens. This is not a finding that suggests a calcium disorder, particularly with a healthy albumin of 47, no bone symptoms and no parathyroid issues. It does not need GP follow-up at this margin, but if it were to be low again on a repeat test, parathyroid hormone would be worth checking.\n\nChloride at 91 is below the lower limit of 95. Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain the acid-base balance of the blood. Sodium at 134 is within range but also sitting at the lower end. Low chloride can be caused by vomiting, excessive sweating, or simply hydration status at the time of the blood draw. In the absence of symptoms, with a normal urea and creatinine and no kidney disease, this is most likely a transient finding related to hydration on the morning of the test. However, because bicarbonate was not measured on this panel and potassium was not returned, the anion gap cannot be calculated, which limits the ability to fully interpret this. If Alexander was well hydrated or had been sweating heavily before the test, that would explain it. It is worth mentioning to the GP only if it persists on repeat testing.\n\nEosinophils are reported as less than 0.02, which the lab has flagged as abnormal. Eosinophils are a type of white blood cell involved in fighting parasites and in allergic responses. A very low count is rarely clinically significant and is often seen in acute stress responses or after intense exercise. With no allergies, no parasitic exposure and no steroid medication, this is a normal variant and does not need follow-up.\n\nMCHC at 348 is marginally above the upper limit of 345. MCHC is the mean corpuscular haemoglobin concentration, a measure of how densely packed the haemoglobin is inside each red blood cell. At 3 units above the limit, and with the lab noting that MCHC can be affected by temperature and storage, this is laboratory variation rather than a clinical finding. MPV at 11.4 is above the upper limit of 10.1. MPV is the mean platelet volume, measuring how large the platelets are on average. Larger platelets are younger platelets, freshly released from the bone marrow, and a mildly elevated MPV with a normal platelet count of 203 simply means the bone marrow is producing healthy, active platelets. Neither of these findings needs any action.\n\nTurning to Alexander's question about supplements. His vitamin D at 78 nmol/L is above the sufficiency threshold of 50 but below the optimal band of 75 to 120. He is right at the lower edge of optimal, and given that he stopped supplementing, this level will almost certainly drop over the winter months when UVB exposure in the UK falls to near zero. By February or March, he could easily be in the insufficient range. The answer to his question is yes, vitamin D supplementation does make a measurable difference for him, and the fact that he is sitting at 78 after summer sun exposure means that without supplementation through winter he will fall below where he wants to be. A consistent 2,000 to 3,000 IU daily through October to April, taken with a meal containing fat, will keep him in the 80 to 100 range.\n\nActive B12 at 108.1 pmol/L is within the laboratory range of 25.1 to 165. Active B12 measures the fraction of vitamin B12 that is actually available for the body to use, rather than total B12 which includes inactive forms. However, the optimal range for energy, neurological function and mood sits above 80 to 100, and at 108 he is adequate but not abundant. On a mixed diet with regular meat intake, this is expected and does not need supplementation, but it does mean that a multivitamin containing B12 was not wasted on him. Folate at 9 is above the optimal floor of 8, which is fine. Magnesium at 0.88 is within the optimal band of 0.85 to 1.05, which is reassuring given his training load.\n\nTo answer Alexander's broader question directly: the multivitamin was probably doing more than he realised for his vitamin D, and stopping it has left him right on the edge. A targeted approach with specific supplements at the right doses will be more effective than a generic multivitamin, and the supplementation section below sets out exactly what to take, in what form and when.","links":"The findings in Alexander's report connect around two central themes: suboptimal testosterone for his age and a set of minor electrolyte and haematological flags that are almost certainly transient.\n\nThe testosterone story is the most clinically meaningful thread. At 13.3, his total testosterone is technically within the laboratory range but sits well below the optimal zone for a 30-year-old. His LH is not elevated, which means the pituitary is not compensating, and his SHBG is not high, which means binding is not the issue. The most likely drivers are sleep and alcohol. He is getting 6 to 7 hours and waking unrefreshed, which directly impairs the nocturnal testosterone pulse. Alcohol at 5 to 9 drinks a week adds a second suppressive effect on the hypothalamic-pituitary-gonadal axis. His cortisol sitting in the lower quarter of the morning range fits this picture: a man whose sleep architecture is not delivering the deep restorative phases that drive both the cortisol awakening response and testosterone production. This single cluster, sleep quality plus alcohol, is the most likely explanation for his below-optimal testosterone, his fatigue on waking and his difficulty with mood and energy.\n\nThe low chloride and borderline-low sodium are almost certainly hydration-related. Without potassium or bicarbonate on this panel, the acid-base picture is incomplete, but the kidney function markers are all clean and there are no symptoms to suggest a metabolic acidosis or alkalosis. If Alexander drank a large volume of water before fasting or sweated heavily the evening before, that would dilute both sodium and chloride. This is worth a mental note but not a GP visit.\n\nThe corrected calcium at 2.18 is 0.02 below the lower limit, but the raw calcium at 2.3 is within range. The correction formula adjusts for albumin, and with an albumin of 47 (high-normal), the correction can slightly overcorrect downward. The lab also notes that calcium can fall in older specimens. This is not a pattern that suggests parathyroid disease or calcium deficiency, and it does not connect to any other finding in the report.\n\nThe haematological flags, MCHC marginally above, MPV above, eosinophils below the detection limit, are all isolated and benign. They do not connect to each other or to any clinical concern. Myoglobin above range is explained by his resistance training and possibly sample transit time.\n\nWhat has been positively excluded is worth noting. There is no thyroid dysfunction, no insulin resistance, no liver disease, no kidney impairment, no iron deficiency, no B12 or folate deficiency, no inflammation, no autoimmune signal, no cardiovascular risk and no urinary pathology. The bloods have narrowed the field for his energy and mood goals down to testosterone, sleep and the cortisol rhythm, all of which are modifiable without medication.","lifestyle":"Fix your wake time to the same time every day, including weekends, within a 30-minute window. Anchor: set one alarm and get up when it goes off, no snoozing. Why: a fixed wake time is the single most powerful reset for the cortisol awakening response, and your low morning cortisol at 227 combined with feeling tired on waking suggests your rhythm has drifted.\nGet outside within 30 minutes of waking for at least 10 minutes, even on overcast days. Anchor: shoes on before coffee. Why: morning daylight through the eyes sets the cortical clock that tells cortisol to peak and melatonin to fall, directly addressing the tired-on-waking pattern you describe.\nCut caffeine after 1pm. Anchor: your last coffee is with or just after lunch. Why: caffeine has a half-life of 5 to 6 hours, meaning a 3pm coffee still has half its stimulant effect at 9pm, reducing the deep sleep phases where testosterone is produced. Your testosterone at 13.3 needs every hour of deep sleep it can get.\nReduce alcohol to 4 or fewer drinks per week, ideally with 3 to 4 alcohol-free days in a row. Anchor: pick your drinking days at the start of each week and stick to the plan. Why: alcohol directly suppresses testosterone production and disrupts sleep architecture. Moving from 5 to 9 down to under 4 is one of the fastest ways to shift both testosterone and morning energy.\nAdd a palm-sized portion of protein to every meal, aiming for 120 to 130g of protein across the day. Anchor: protein goes on the plate first. Why: at 73kg training five times a week, you need 1.6 to 2.0g per kilogram, which is 117 to 146g per day. Protein provides the building blocks for muscle that your training is trying to create, and adequate protein also supports testosterone production.\nIncrease vegetable and fruit portions from 2 to 3 up to 5 or more per day. Anchor: add one portion to lunch and one to dinner this week, then build. Why: vegetables and fruit provide the micronutrients, fibre and antioxidants that support recovery, gut health and the immune system. At 2 to 3 portions you are getting the minimum; at 5 or more you start to see measurable benefits in inflammation and energy.\nReduce sugary foods from some days to once or twice a week. Anchor: swap the habitual sugary snack for Greek yoghurt with berries or a handful of nuts. Why: frequent sugar intake drives uric acid production (yours is 387, above the optimal 380 ceiling) and contributes to energy crashes that worsen the afternoon and evening fatigue pattern.\nAim for 7.5 to 8 hours in bed, lights out to alarm, every night. Anchor: set a bedtime alarm 8 hours before your fixed wake time. Why: testosterone is produced primarily during deep sleep, and at 6 to 7 hours you are cutting short the hormonal window. Adding even 30 to 45 minutes will make a measurable difference to the 13.3 reading.","flags":"Testosterone 13.3 nmol/L, within the laboratory range of 8.4 to 28.7 but below the optimal band of 18 to 30 for a 30-year-old male. LH 2.54, lower third of range, suggesting the pituitary drive is not maximally stimulating production. Sleep restriction (6 to 7 hours, unrefreshed) and alcohol (5 to 9 drinks/week) are the most likely modifiable drivers. Not a GP-urgent finding at this level but worth repeating in 3 to 4 months after lifestyle changes to confirm the direction of travel.\nCorrected calcium 2.18 mmol/L, marginally below the lower limit of 2.2 (raw calcium 2.3 is within range). At 0.02 below the boundary, with healthy albumin and no symptoms, this is most likely laboratory or specimen variation. The lab notes calcium can be falsely reduced in older specimens. Does not require GP follow-up at this margin but should be noted if repeated.\nChloride 91 mmol/l, below the lower limit of 95, with sodium 134 at the lower end of its range. Most likely hydration-related in the absence of symptoms, vomiting or kidney disease. Potassium and bicarbonate were not available on this panel to calculate the anion gap. Worth noting but not acting on unless persistent.\nMyoglobin 87.73 ug/l, above the upper limit of 72. With CK-MB 3.16 (below 4.9) and no cardiac symptoms, this is exercise-related skeletal muscle turnover, possibly amplified by sample transit time. The lab notes results can be elevated after exercise and on samples not received same day. No action needed.\nMCHC 348 g/L, marginally above the upper limit of 345. Lab notes MCHC can be affected by temperature and storage. At this margin, laboratory variation rather than a clinical finding.\nMPV 11.4 fL, above the upper limit of 10.1. With a normal platelet count of 203, this reflects healthy young platelet production and is not a concern.\nEosinophils reported as less than 0.02, flagged by the lab. Very low eosinophils are rarely significant and can occur with acute stress or post-exercise. No follow-up needed.\nReassuring negatives: thyroid function normal (TSH 1.0, FT4 17.6, FT3 5.0), no insulin resistance (HbA1c 36), liver completely clean (ALT 24, GGT 21, FIB-4 1.0), kidney function normal (eGFR >90), iron stores adequate (ferritin 139, transferrin saturation 23.69%), no inflammation (hsCRP 0.9), B12 and folate adequate, vitamin D sufficient at 78, cardiac markers normal, urinalysis clean with no growth.","recommendations":"Discuss the below-optimal testosterone of 13.3 nmol/L with your GP if lifestyle changes over the next 3 to 4 months do not improve energy and mood. Bring the LH of 2.54 and SHBG of 32.6 to the appointment. The GP may wish to repeat testosterone, LH, FSH and prolactin on a fasted morning sample taken before 10am to confirm the baseline.\nMention the low chloride of 91 (range 95 to 108) and borderline sodium of 134 at your next routine appointment. These are most likely hydration-related but should be noted on your record.\nAsk the GP to check potassium and bicarbonate at your next blood draw to complete the electrolyte picture that this panel did not include.\nRetest in 3 to 4 months (January or February 2027) to assess the effect of sleep, alcohol and dietary changes. Key markers to repeat: testosterone, LH, cortisol (morning, before 10am), vitamin D (to check winter level), chloride, corrected calcium and a fasting glucose and insulin if available on the repeat panel.\nCalorie target: approximately 2,400 to 2,600 kcal per day to support muscle gain at a lean body composition (maintenance estimated at 2,400 based on a BMR of approximately 1,700 and a moderate activity multiplier of 1.6, with a small surplus for muscle building). Protein target: 120 to 146g per day (1.6 to 2.0g per kg of bodyweight at 73kg).","supplementation":"Vitamin D3 (cholecalciferol), 2,000 to 3,000 IU daily, taken with your largest meal that contains fat (lunch or dinner). Why: your level of 78 is just inside the optimal band but will drop over winter without supplementation. This replaces the occasional winter tablet with a consistent dose that will keep you in the 80 to 100 range year-round. Take with vitamin K2 below.\nVitamin K2 (MK-7), 100 mcg daily, taken at the same meal as vitamin D3. Why: K2 directs the calcium that vitamin D helps absorb into bones and teeth rather than into artery walls. They work as a pair.\nMagnesium glycinate, 300 to 400mg elemental magnesium, taken 30 to 60 minutes before bed. Why: your serum magnesium at 0.88 is within optimal range, but magnesium glycinate specifically supports sleep quality and muscle recovery. Given that improving deep sleep is the highest priority in this report for testosterone, mood and energy, this is a well-justified addition. The glycinate form is better absorbed and less likely to cause digestive upset than oxide or citrate.\nOmega-3 fish oil, 2g combined EPA and DHA daily, taken with food. Why: your inflammatory markers are already good (hsCRP 0.9), but omega-3 supports mood, brain function and recovery from training, all three of which align with your goals. Look for a product that lists EPA and DHA separately on the label and provides at least 1,000mg EPA per day.\nContinue creatine monohydrate at 3 to 5g daily, taken at any time. Why: creatine is one of the most evidence-backed supplements for muscle building and cognitive function, and your CK at 222 shows your muscles are using it. There is no reason to stop.\nContinue your probiotic if you feel it helps digestion, though the evidence for specific strains varies. Your urinalysis and digestive markers are clean, so this is a personal preference rather than a clinical need.\nThe most important changes from this report are not supplements. They are fixing your sleep to 7.5 to 8 hours with a consistent wake time, reducing alcohol to under 4 drinks a week, and eating 120 to 146g of protein daily. These three changes will do more for your testosterone, energy and mood than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6727","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 74 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 73.7. Weakest systems: cardiac markers 17%, kidney function 59%, electrolytes & minerals 68%. Biggest drags: Chloride, Myoglobin, Sodium, Corrected Calcium.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"23.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3371","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a composite biological age score developed from nine blood biomarkers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count). At 23.6 years against a calendar age of 30, Alexander is biologically 6.4 years younger than his chronological age. This is a strong result driven by his low inflammation (CRP 0.9), healthy kidney function (creatinine 85), excellent albumin (47) and balanced blood count. Fasting glucose was not returned by the laboratory, so estimated average glucose from HbA1c (6.1 mmol/L) was used in its place. Improving sleep and testosterone may push PhenoAge further in the favourable direction on retest.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"23.69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3487","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5315","units":"%","description":"Transferrin saturation measures the percentage of the iron-carrying protein transferrin that is currently loaded with iron. At 23.69%, Alexander's result is within the laboratory range of 18 to 55 but sits below the optimal band of 25 to 40%. This means the iron transport system is functioning but is not fully loaded. In combination with his adequate ferritin and serum iron, this does not suggest iron deficiency, but it does mean his iron availability is at the lower end of ideal rather than abundant. Ensuring regular red meat, dark leafy greens or iron-rich foods in the diet will keep this in a good place.","low_causes":"Iron deficiency, chronic disease, low dietary iron, malabsorption","high_causes":"Haemochromatosis, iron overload, excessive supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"14.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3476","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3455","upper_optimal_position":"0.5013","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood, bound to transferrin. At 14.4 umol/l, this sits just within the optimal band of 14 to 25. Iron is essential for oxygen transport by haemoglobin, energy production in the mitochondria and immune function. This result, combined with adequate ferritin and a normal haemoglobin, confirms there is no iron deficiency.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, malabsorption, chronic disease","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.42","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3933","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.2","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein the liver produces to carry iron through the blood to where it is needed. At 2.42 g/L, this is within the optimal range. Transferrin rises when the body needs more iron (iron deficiency) and falls when there is too much iron or when inflammation suppresses its production. A normal transferrin alongside normal ferritin and serum iron confirms the iron transport system is balanced.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"139","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4627","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein. Each ferritin molecule can hold thousands of iron atoms, and the blood level reflects how much iron the body has in reserve. At 139 ng/ml, Alexander's stores are healthy and well within the optimal band of 50 to 200 for a man. This means the body has a comfortable buffer of iron to draw on for red blood cell production, energy metabolism and immune function. No iron supplementation is needed.","low_causes":"Iron deficiency, chronic blood loss, vegetarian or vegan diet, coeliac disease, heavy training","high_causes":"Haemochromatosis, inflammation, infection, liver disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Iron Binding Capacity","group":"IRON STUDIES","result":"53","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4272","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6045","units":"umol/l","description":"Total iron binding capacity (TIBC) measures the total amount of iron that transferrin in the blood could carry if every binding site were full. At 53 umol/l, this is within the optimal range. A high TIBC signals iron deficiency (the body making more transferrin to catch more iron), and a low TIBC can indicate iron overload or chronic disease. Alexander's result confirms balanced iron metabolism.","low_causes":"Iron overload, chronic disease, malnutrition, liver disease","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"141","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"130","upper_normal":"170","lower_optimal":"135","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. At 141 g/L, this is within the optimal range for a man. This confirms there is no anaemia and that the blood is carrying oxygen efficiently to support Alexander's training and recovery.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, smoking, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Count","group":"HEMATOLOGY","result":"4.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3500","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10/12/l","description":"The red blood cell count measures how many red blood cells are in each litre of blood. At 4.55, Alexander's count is just within the laboratory range but below the tighter optimal band of 4.6 to 5.3. It is a very marginal miss, only 0.05 below optimal. With haemoglobin at 141, adequate iron stores and no symptoms of anaemia, this does not suggest any pathology. Red cell count can vary day to day with hydration status.","low_causes":"Anaemia, blood loss, bone marrow suppression, chronic disease, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"HCT","group":"HEMATOLOGY","result":"0.406","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3397","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"l/l","description":"Haematocrit measures the proportion of blood volume that is made up of red blood cells. At 0.406, this is within the laboratory range but just below the optimal band of 0.41 to 0.48. Like the red cell count, this is a very marginal finding and consistent with well-hydrated blood rather than any deficiency. No action needed.","low_causes":"Anaemia, overhydration, blood loss, chronic disease","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"MCV","group":"HEMATOLOGY","result":"89.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4481","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"95","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5556","units":"fl","description":"Mean corpuscular volume measures the average size of each red blood cell. At 89.2 fl, this is within the optimal range. Small red cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. A normal MCV confirms that the building blocks for red cell production are adequate.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"MCH","group":"HEMATOLOGY","result":"31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"Mean corpuscular haemoglobin measures the average amount of haemoglobin inside each red blood cell. At 31 pg, this is within the optimal range, confirming that each red cell is carrying a healthy quantity of oxygen-carrying protein.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"MCHC","group":"HEMATOLOGY","result":"348","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/L","description":"Mean corpuscular haemoglobin concentration measures how densely packed the haemoglobin is within each red blood cell. At 348 g/L, this is 3 units above the upper limit of 345. The lab notes that MCHC can be affected by temperature and sample storage conditions, and at this margin this is almost certainly a laboratory artefact rather than a clinical finding. True MCHC elevation can be seen in hereditary spherocytosis, but that would present with anaemia, jaundice and an abnormal blood film, none of which are present here. No action needed.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, cold agglutinins, laboratory artefact from sample handling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"RDW","group":"HEMATOLOGY","result":"12.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"14","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"%","description":"Red cell distribution width measures the variation in size among the red blood cells. At 12.9%, this is within the optimal range, meaning the red cells are uniform in size. A raised RDW can be an early sign of iron, B12 or folate deficiency before other markers change. Alexander's normal RDW confirms consistent red cell production.","low_causes":"Generally not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"203","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4013","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are the small cell fragments responsible for blood clotting. At 203, this is within the optimal range, confirming normal clotting capacity. Neither too few (bleeding risk) nor too many (clotting risk).","low_causes":"Viral infection, medications, liver disease, alcohol, autoimmune conditions, bone marrow disorders","high_causes":"Infection, inflammation, iron deficiency, post-surgery, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"MPV","group":"HEMATOLOGY","result":"11.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7100","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"8","upper_optimal":"10.1","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.6667","units":"fL","description":"Mean platelet volume measures the average size of the platelets. Larger platelets are younger platelets, freshly released from the bone marrow, and tend to be more metabolically active. At 11.4 fL, this is above the upper limit of 10.1. With a normal platelet count of 203, this simply means the bone marrow is producing healthy, active platelets. A mildly elevated MPV in isolation, without a low platelet count, is not a clinical concern and does not need follow-up.","low_causes":"Bone marrow suppression, aplastic anaemia, chemotherapy","high_causes":"Active platelet production, recovery from infection, immune thrombocytopenia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Cell Count","group":"HEMATOLOGY","result":"6.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4483","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. At 6.69, this is within the optimal range, confirming a healthy and appropriately active immune system. Neither elevated (suggesting infection or inflammation) nor suppressed (suggesting immune compromise).","low_causes":"Viral infection, autoimmune conditions, bone marrow suppression, medications, low energy availability","high_causes":"Bacterial infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3627","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infections. At 3.48, this is within the optimal range, showing a healthy innate immune system.","low_causes":"Viral infection, medications, autoimmune conditions, low energy availability, alcohol","high_causes":"Bacterial infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5000","upper_optimal_position":"0.6667","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for adaptive immunity, including antibody production and the memory that makes vaccines work. At 2.91, this is within the optimal range and near the top of the laboratory range, reflecting a robust adaptive immune system.","low_causes":"Viral infection, HIV, autoimmune conditions, steroid use, stress","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.27","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3625","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues to become macrophages, engulfing debris, dead cells and pathogens. At 0.27, this is within the optimal range. A normal monocyte count reflects healthy tissue maintenance and no chronic inflammatory stimulus.","low_causes":"Bone marrow suppression, steroid use","high_causes":"Chronic infection, autoimmune disease, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"<0.02","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0000","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5278","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the immune response to parasites and in allergic reactions. Alexander's result is reported as below the detection limit of 0.02. The lab has flagged this, but a very low eosinophil count is rarely clinically significant. It can be seen after acute stress, intense exercise or as a normal variant. In the absence of recurrent infections or any concerning symptoms, this does not need follow-up.","low_causes":"Acute stress, steroid use, Cushing's syndrome, acute infection","high_causes":"Allergic conditions, parasitic infection, asthma, eczema, drug reactions, eosinophilic disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3444","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"x10^9/L","description":"Basophils are the least common white blood cells and play a role in allergic responses and inflammation. At 0.02, this is within the optimal range. Basophils are present in very small numbers even in health.","low_causes":"Acute allergic reaction, steroid use, hyperthyroidism","high_causes":"Allergic reactions, chronic inflammation, hypothyroidism, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"19.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by the red blood cell count. It is reported for context and is not applicable at present. A value above 13 suggests iron deficiency anaemia if MCV is low, while a value below 13 suggests thalassaemia trait. At 19.6 with a normal MCV, this is consistent with normal red cell production and is not clinically relevant.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5187","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product formed when the liver breaks down protein, and the kidneys then filter it out of the blood. At 5.8 mmol/l, this is within the optimal range, confirming healthy kidney filtration and normal protein metabolism. Given Alexander's moderate protein intake and training load, this is exactly where it should be.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Dehydration, high protein diet, kidney disease, gastrointestinal bleeding, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"KIDNEY FUNCTION","result":"134","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3590","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"mmol/l","description":"Sodium is the main electrolyte that controls the volume of fluid outside cells and is critical for nerve and muscle function. At 134 mmol/l, this is within the laboratory range but below the optimal band of 136 to 143. It sits only 1 unit above the lower reference limit. In the absence of symptoms such as confusion, nausea or headaches, this is most likely related to hydration status at the time of the blood draw rather than a sodium disorder. It should be interpreted alongside the low chloride (see below).","low_causes":"Overhydration, excessive sweating, vomiting, diarrhoea, medications (diuretics, SSRIs), kidney disease, adrenal insufficiency","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"KIDNEY FUNCTION","result":"91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3026","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4103","upper_optimal_position":"0.5641","units":"mmol/l","description":"Chloride is an electrolyte that works closely with sodium and bicarbonate to maintain fluid balance and the acid-base equilibrium of the blood. At 91 mmol/l, this is below the lower reference limit of 95. Low chloride (hypochloraemia) can be caused by excessive sweating, vomiting, overhydration or metabolic alkalosis. Alexander has no symptoms of any of these, and his kidney function is otherwise clean, so this is most likely a transient finding related to hydration on the morning of the test. Bicarbonate and potassium were not included on this panel, so the full acid-base picture cannot be assessed. Worth noting at the next blood draw.","low_causes":"Overhydration, vomiting, metabolic alkalosis, excessive sweating, Addison's disease, diuretics","high_causes":"Dehydration, metabolic acidosis, kidney disease, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5043","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3761","upper_optimal_position":"0.6325","units":"umol/l","description":"Creatinine is a waste product produced by muscles at a fairly constant rate and filtered out by the kidneys. At 85 umol/l, this is within the optimal range and gives an eGFR above 90, confirming healthy kidney function for a 30-year-old man. Given that Alexander takes creatine, which can modestly raise creatinine levels, this result is reassuring.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high meat diet, creatine supplementation, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Estimated glomerular filtration rate (eGFR) estimates how efficiently the kidneys are filtering waste from the blood. At above 90, this confirms normal kidney function. The kidneys are clearing waste products effectively.","low_causes":"Chronic kidney disease, dehydration, heart failure, kidney obstruction, medications","high_causes":"High muscle mass (can give falsely high readings), pregnancy","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"387","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5038","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.2721","upper_optimal_position":"0.5217","units":"umol/l","description":"Uric acid is produced when the body breaks down purines, compounds found in certain foods (red meat, organ meats, shellfish, beer) and in the body's own cells. The kidneys filter uric acid out. At 387 umol/l, this is within the laboratory range of 220 to 547 but just above the tighter optimal ceiling of 380 for men. Elevated uric acid is associated with gout, kidney stones and cardiovascular risk over time. Alcohol (particularly beer) and sugary foods and drinks are two of the biggest dietary drivers of uric acid. Reducing both, as recommended in this report, will help bring this down.","low_causes":"Low purine diet, medications (allopurinol), Fanconi syndrome","high_causes":"High purine diet, alcohol, fructose, dehydration, kidney disease, metabolic syndrome, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"68.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4900","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between causes of abnormal kidney markers. At 68.2, this is within the optimal range. A high ratio can suggest dehydration, upper gastrointestinal bleeding or a high-protein diet, while a low ratio can suggest liver disease or low protein intake. Alexander's result is well balanced.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3722","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4035","upper_optimal_position":"0.5789","units":"mmol/l","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.3 mmol/l, the raw (uncorrected) calcium is within the optimal range. Calcium must be interpreted alongside albumin, as the protein-bound fraction varies with albumin levels. See corrected calcium below for the adjusted reading.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, sarcoidosis, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3167","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the raw calcium value for the albumin concentration to give a more accurate picture of the calcium available in the blood. At 2.18, this is marginally below the lower limit of 2.2. The gap is only 0.02, which is within
