<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Alexander Edward Hanton-Rhys","dob":"21/09/1996","report_date":"2026-10-06","summary":"Alexander is a 30-year-old male presenting with a BMI of 25.6, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are about average (volume 5 out of 10). He trains five times per week (two cardio, three resistance) at moderate intensity, with 7,500 to 10,000 daily steps. He sleeps 6 to 7 hours, feels slow to get going on waking, with energy described as tired on waking; stress feels hard to manage some weeks. He drinks 5 to 9 alcoholic drinks per week. He currently supplements with creatine and probiotics. He has no diagnosed medical conditions and takes no medication. He has not had blood tests done before. He reports no specific symptoms but notes that he used to take multivitamins or occasional vitamin D during winter and stopped because he did not notice a difference, and would like to know whether they are actually needed. His goals are to build muscle, improve energy levels and improve mood.\n\nThe most striking feature of this report is how much is working well for a first set of bloods at 30. Alexander's lipid profile is genuinely excellent. His total cholesterol is 4.8, his LDL (low-density lipoprotein, the particle that deposits cholesterol into artery walls) is 2.28, well within the ideal target of below 2.6, and his ApoB (apolipoprotein B, the protein carried by every atherogenic particle and the single best measure of cardiovascular risk) is 0.83, comfortably under the 0.9 threshold. His HDL (high-density lipoprotein, the particle that removes cholesterol from arteries) is 2.2, which is unusually high and strongly protective. His triglycerides are 0.75, well inside the ideal of below 1.0. His ApoB-to-ApoA1 ratio, which summarises the balance between particles building up plaque and particles clearing it, is 0.441, firmly in the lower-risk category. His cardiovascular risk score, a TrueVitals index from 0 to 100 built from the lipid and metabolic markers, came out at a level that reflects an excellent lipid and metabolic profile. For someone whose goal includes disease prevention, this is the best possible starting point.\n\nHis liver is in excellent health. ALT (alanine aminotransferase, the enzyme most sensitive to liver-cell damage) is 24, inside the tighter optimal threshold of below 30. Gamma GT (gamma-glutamyl transferase, the enzyme that responds earliest to alcohol, fat accumulation or medication strain on the liver) is 21, well below 25, which is about as clean as that marker gets, especially with 5 to 9 drinks a week. His AST (aspartate aminotransferase) is 33, his albumin is 47 and his total protein is 72, all within the ideal range. The FIB-4 score, a composite of age, platelets, AST and ALT that screens for liver scarring, is 1.0, well below the 1.45 threshold and confirming no sign of fibrosis. His APRI score, another liver fibrosis index, is 0.406, also well within range. The NAFLD fibrosis score is negative at minus 2.542, ruling out non-alcoholic fatty liver disease. Bilirubin at 17 is within range and is a mild elevation that is common in healthy young men, often reflecting Gilbert's syndrome, a harmless inherited variation in how bilirubin is processed that affects around 5 to 10 percent of the population and carries no clinical significance.\n\nHis kidney function is healthy. Creatinine is 85 with an eGFR above 90, exactly where it should be at 30. Urea is 5.8 and the urea-to-creatinine ratio is 68.2, both well within range. Uric acid at 387 is within the laboratory range of 220 to 547, though slightly above the optimal ceiling of 380; at this margin and with no history of gout, it is not a concern but worth noting for future tracking.\n\nHis thyroid is working well. TSH (thyroid stimulating hormone, the signal the pituitary sends to the thyroid to tell it how much hormone to produce) is 1.0, sitting right in the ideal zone of 1.0 to 2.5. Free T4 (the inactive form of thyroid hormone circulating in the blood) is 17.6 and free T3 (the active form that cells actually use for metabolism) is 5.0, both within their ideal ranges. The FT3-to-FT4 ratio, which reflects how efficiently the body converts T4 into active T3, is 0.284, within the ideal band. The thyroid is not contributing to his fatigue on waking.\n\nHis blood sugar control is excellent. HbA1c (glycated haemoglobin, which reflects average blood sugar over the past two to three months) is 36 mmol/mol, at the upper edge of the optimal range but inside it. The estimated average glucose derived from that HbA1c is 6.1 mmol/L, also within the ideal ceiling.\n\nHis inflammatory markers are reassuring. hs-CRP (high-sensitivity C-reactive protein, a broad marker of systemic inflammation) is 0.9, just inside the optimal threshold of below 1.0. The platelet-to-lymphocyte ratio and the systemic immune-inflammation index are both well within range. His white cell count is 6.69, his neutrophils are 3.48 and his lymphocytes are 2.91, all healthy. The neutrophil-to-lymphocyte ratio is 1.20, sitting in the ideal zone.\n\nHis iron studies are adequate. Ferritin (the body's iron storage protein) is 139, inside the ideal band of 50 to 200 for a man. Serum iron is 14.4, transferrin is 2.42 and total iron binding capacity is 53, all within range. His transferrin saturation is 23.69 percent, which is within the laboratory range of 18 to 55 but just below the optimal floor of 25 percent. This is not iron deficiency, but it means the body is using iron efficiently without a large surplus in active circulation, and it can be improved with dietary attention to iron-rich food.\n\nHis haemoglobin is 141, healthy for a man. Red blood cell count is 4.55, haematocrit is 0.406, MCV (the size of each red cell) is 89.2, MCH (the weight of haemoglobin in each cell) is 31 and RDW (red cell distribution width, showing how uniform the cells are) is 12.9, all within ideal ranges. Platelets are 203, healthy.\n\nHis cardiac markers are reassuring. CK-MB (creatine kinase MB, a form of the enzyme found in heart muscle) is 3.16, within the normal range of below 4.9. Creatine kinase itself is 222, within the range of 40 to 320 and consistent with his resistance training and creatine supplementation.\n\nHis urinalysis is clean: protein, glucose, ketones, white cells and red cells are all negative, and casts are negative. Bacterial count and urine culture are pending.\n\nHis PhenoAge, an algorithm that estimates biological age from blood markers including albumin, creatinine, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 22.3 years against a calendar age of 30. That is nearly eight years younger than his chronological age, which is a strong result and reflects the overall health of his blood.\n\nTurning to the areas that deserve attention, the most important finding for Alexander's goals of building muscle, improving energy and improving mood is his testosterone. Total testosterone is 13.3 nmol/L. While this sits above the laboratory floor of 8.4, it is well below the optimal range of 18 to 30 for a healthy 30-year-old man. His free androgen index is 40.8 and his calculated free testosterone is 0.259 nmol/L, both within range, and his SHBG (sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation) is 32.6, which is healthy and not excessively high, meaning the low total testosterone is not being explained by over-binding. His bioavailable testosterone, the fraction available to tissues, is 6.6 nmol/L, within the laboratory range of 2 to 9 but below the optimal floor of 4 to 9 only just. LH (luteinising hormone, the signal the pituitary sends to the testes to produce testosterone) is 2.54, within range but sitting in the lower third. This pattern, where a low-normal LH produces a below-optimal testosterone, suggests the pituitary is not asking for more testosterone rather than the testes being unable to make it. The most common drivers at 30 are insufficient sleep (6 to 7 hours is below the 7 to 9 hours associated with optimal testosterone production), moderate alcohol intake (5 to 9 drinks a week has a measurable suppressive effect on testosterone) and stress. For Alexander's specific goals, testosterone is the lever that matters most: it drives muscle protein synthesis, energy, mood, motivation and recovery. Every percentage point it rises will feed directly into those goals.\n\nHis cortisol is 227 nmol/L. The morning reference range runs from 145 to 619, so this is within range but sitting in the lower third. A cortisol that is not robustly in the middle of its morning range, combined with reporting feeling tired on waking and slow to get going, is consistent with a pattern where the cortisol awakening response, the surge the adrenal glands produce in the first 30 to 45 minutes after waking to get the body alert, is blunted. This is not a disease; it is a functional pattern driven by the same inputs that suppress testosterone: short sleep, irregular sleep timing and alcohol. It is also consistent with his energy pattern of being tired on waking.\n\nHis DHEA-sulphate (dehydroepiandrosterone sulphate, a precursor hormone produced by the adrenal glands that feeds into testosterone and oestrogen production and supports energy and resilience to stress) is 8.1 umol/L, within range and healthy.\n\nHis vitamin D is 78 nmol/L. This is above the sufficiency threshold of 50 and inside the optimal range of 75 to 120, but sitting at the very bottom of that band. Given that this sample was taken in early October, at the tail end of summer sun exposure, this is likely close to his annual peak. Without supplementation through winter, it will fall below 50 by January. Alexander mentioned stopping vitamin D supplementation because he did not notice a difference. The honest answer to his question is that vitamin D at 78 is not low enough to cause symptoms he would feel day to day, but allowing it to fall into insufficiency over winter will quietly affect immune function, mood (which is one of his goals), testosterone production (which is already below optimal), bone mineral density and recovery from training. The supplement works, but it works as prevention rather than as something he would feel immediately.\n\nHis active B12 (the fraction of vitamin B12 available for the body to use, as opposed to total B12 which includes inactive forms bound to proteins) is 108.1 pmol/L, within the laboratory range of 25.1 to 165 but below the optimal threshold of around 125. B12 supports nerve function, red blood cell production, energy metabolism and mood. At this level there is no deficiency, but there is room to optimise, particularly given his goals around energy and mood.\n\nHis folate (vitamin B9, essential for DNA synthesis, red blood cell production and methylation, the chemical process that regulates gene expression and neurotransmitter production) is 9 ng/ml, within the laboratory range of 3 to 17 and just above the optimal floor of 8. With 2 to 3 portions of vegetables and fruit per day, this is adequate but could be higher with more leafy greens.\n\nHis magnesium is 0.88 mmol/L, within the optimal range of 0.85 to 1.05. This is a genuine positive for someone training five times a week, as magnesium is heavily used in muscle contraction, recovery and sleep quality.\n\nHis corrected calcium is 2.18 mmol/L, which sits just below the lower limit of the reference range at 2.2. The raw calcium is 2.3 and within range, and the correction adjusts for albumin concentration. At this margin, a single reading 0.02 below the lower limit is very likely to reflect normal variation, sample handling or a minor fluctuation in albumin on the day. There are no symptoms of low calcium (muscle cramps, tingling, spasms) and no other mineral abnormality to support a genuine calcium problem. This does not need a GP visit but it would be sensible to include calcium on any future blood test to confirm it sits within range on a fresh sample.\n\nHis chloride is 91 mmol/L, below the laboratory range of 95 to 108. Chloride is an electrolyte that works alongside sodium and bicarbonate to maintain the body's acid-base balance and fluid volume. Low chloride, called hypochloraemia, can occur with dehydration or vomiting, but the most common cause of a mildly low chloride in a healthy young man with no symptoms is simply variation in hydration on the day of the test, or a mild metabolic alkalosis. His sodium is 134, at the very bottom of its range, which moves in the same direction and supports a hydration explanation. Without bicarbonate or potassium (which were not included in this panel), the acid-base picture is incomplete, but with no symptoms and no medication that would drive it, this is very likely a transient finding. It is worth mentioning to the GP only if it persists on repeat testing.\n\nHis MCHC (mean corpuscular haemoglobin concentration, the average concentration of haemoglobin inside each red cell) is 348, marginally above the upper limit of 345. The laboratory itself notes that MCHC can be affected by temperature and storage. At this margin, this is almost certainly a laboratory artefact rather than a clinical finding. His MPV (mean platelet volume, the average size of his platelets) is 11.4, above the upper limit of 10.1. A raised MPV in isolation, with a normal platelet count and no inflammatory signal, typically reflects younger, more active platelets being released from the bone marrow, which is a feature of a healthy bone marrow rather than a problem. It can also be seen with moderate alcohol consumption. Neither finding requires action.\n\nHis eosinophils are reported as below 0.02, which the laboratory has flagged as abnormal. Eosinophils are white blood cells involved in allergic responses and parasitic defence. A value at or just below the detection threshold in a healthy person with no allergy symptoms, no medications and no steroid use is a normal variant and not clinically significant. The total white cell count, neutrophils and lymphocytes are all healthy, confirming the immune system is functioning well.\n\nHis myoglobin is 87.73 ug/L, above the upper limit of 72. Myoglobin is a protein found in muscle cells that is released into the bloodstream when muscle fibres are damaged, which happens routinely during resistance training. Alexander trains three times a week with resistance and supplements with creatine, and his CK at 222 is consistent with regular training. A myoglobin of 87.73 is well below the 110 threshold that suggests cardiac damage and is entirely consistent with post-exercise muscle turnover. The CK-MB at 3.16 confirms the heart is not the source. This is a training artefact, not a concern.\n\nTo bring together the overall picture: Alexander's metabolic, cardiovascular, liver, kidney, thyroid and blood health are all in excellent shape for a 30-year-old man. His biological age by PhenoAge is nearly eight years younger than his calendar age. The areas where the report points to genuine room for improvement are his testosterone, which sits below the optimal range and is the single biggest lever for his goals of building muscle, improving energy and improving mood; his sleep, which at 6 to 7 hours with a tired-on-waking pattern is not giving his body enough recovery time to produce optimal testosterone or cortisol; and his vitamin D, which needs year-round supplementation to stay in the optimal band. His B12 would benefit from a small top-up. His alcohol intake of 5 to 9 drinks a week is not causing liver damage, as the GGT confirms, but it is contributing to the testosterone and cortisol picture and is the most modifiable variable in his lifestyle alongside sleep.","links":"The thread running through Alexander's results is a body that is metabolically and structurally healthy but not hormonally optimised, and the explanation sits squarely in lifestyle rather than pathology.\n\nThe below-optimal testosterone at 13.3 is the central finding, and it connects to three inputs that the quiz reveals. First, sleep: 6 to 7 hours with a tired-on-waking pattern means he is probably spending fewer than 6 hours actually asleep once sleep onset and night waking are accounted for. Testosterone is produced almost entirely during deep sleep, and studies consistently show that reducing sleep from 8 hours to 5 hours drops testosterone by 10 to 15 percent within a week. Second, alcohol: 5 to 9 drinks a week, even spread across the week, has a measurable suppressive effect on testicular testosterone production and on the LH signal that drives it. His LH at 2.54, low-normal, is consistent with mild central suppression. Third, the cortisol at 227, low in its morning range, and the tired-on-waking pattern together suggest that the hypothalamic-pituitary-adrenal axis (the system that governs cortisol, and which shares signalling pathways with the hypothalamic-pituitary-gonadal axis that governs testosterone) is running at reduced output. These are not separate problems; they are one story. Fix the sleep, moderate the alcohol, and both cortisol and testosterone are likely to move.\n\nThe lipid profile, liver, kidney, thyroid and blood sugar stand entirely outside this pattern and are independently excellent. The HDL at 2.2 is unusually high and suggests a genetic predisposition to efficient reverse cholesterol transport. The ApoB at 0.83 means particle count is low. The triglycerides at 0.75 reflect good insulin sensitivity even without a fasting insulin measurement on this panel. The HbA1c at 36 confirms that over the past three months blood sugar has been well controlled. The liver is handling 5 to 9 drinks a week without any visible strain, which is a positive finding but not a guarantee it will remain so if intake increases.\n\nThe vitamin D at 78 in early October, the B12 at 108 and the folate at 9 are all adequate but not optimal. None of them individually would explain his fatigue on waking, but collectively they sit at the lower edge of their ideal bands, and bringing them up is a low-cost, evidence-based step that supports the goals he has named.\n\nThe corrected calcium at 2.18, chloride at 91 and sodium at 134 form a cluster at the bottom of their respective ranges. Without bicarbonate and potassium, which were not part of this panel, the acid-base picture is incomplete. The most likely explanation is hydration status on the morning of the test. None of the three is far enough outside range to warrant investigation on its own, but if all three persist on repeat testing, they would justify a venous blood gas to check the full electrolyte picture.\n\nThe MCHC, MPV, eosinophils and myoglobin are all minor findings with clear explanations: laboratory artefact, normal platelet biology, a detection-threshold result, and post-exercise muscle protein release respectively. None requires action or follow-up.","lifestyle":"Extend your sleep window to at least 7.5 hours in bed, targeting 7 hours of actual sleep. Set a fixed wake time seven days a week and work backwards to set a non-negotiable lights-out. Anchor: set a phone alarm for 45 minutes before your target lights-out as your wind-down cue. Why: testosterone is produced almost entirely during deep sleep, and moving from 6 to 7 hours up to 7 to 7.5 hours is the single most powerful lever for raising your testosterone from 13.3 toward the 18-plus optimal range, as well as improving your cortisol awakening response and your tired-on-waking pattern.\nGet outside within 30 minutes of waking, even for 5 minutes, before looking at your phone. Anchor: shoes by the door the night before, step outside before the kettle goes on. Why: bright morning light resets the circadian clock, triggers the cortisol awakening response that is currently blunted (cortisol 227, low in its morning range), and improves sleep onset the following night.\nCut caffeine by 1pm. Anchor: after lunch is the last cup. Why: caffeine has a half-life of 5 to 7 hours, and afternoon or evening caffeine fragments deep sleep, which is the phase in which testosterone is produced.\nReduce alcohol to under 5 drinks per week, ideally keeping 3 to 4 consecutive alcohol-free days. Anchor: choose your drinking days at the start of the week rather than deciding in the moment. Why: 5 to 9 drinks per week is suppressing LH (currently 2.54, low-normal) and testosterone production without causing liver damage (GGT 21 confirms that), so the goal is to remove the hormonal cost while the liver is still handling it well.\nAdd a palm-sized portion of protein to every meal, prioritising breakfast. Eggs, Greek yoghurt, chicken, or a whey shake with your creatine. Anchor: protein goes on the plate first, before anything else. Why: at 73 kg training five times a week at moderate intensity, you need 95 to 117 grams of protein per day to support muscle growth, and hitting that target at breakfast rather than back-loading it into dinner improves muscle protein synthesis across the whole day.\nIncrease vegetables and fruit from 2 to 3 portions to at least 5 per day. Add one extra portion at lunch and one at dinner this week. Anchor: when you plate your meal, half the plate is vegetables or salad before you add anything else. Why: more leafy greens will push your folate above 9, improve your fibre intake for gut health (supporting the probiotics you already take), and increase potassium intake, which may explain the low chloride and sodium cluster.\nKeep your current training split of 3 resistance and 2 cardio sessions. Prioritise compound lifts (squat, deadlift, bench press, rows, overhead press) and progressive overload. Why: heavy compound movements are the strongest non-sleep stimulus for testosterone production, and progressive overload is what drives muscle growth at your stage. Your CK at 222 shows you are recovering well from your current load.\nCool your bedroom to 16 to 18 degrees and avoid screens in the last 30 minutes before bed. Anchor: phone charges outside the bedroom from tonight. Why: a cool room and reduced blue light improve deep sleep duration, feeding directly into testosterone production and the cortisol awakening response.","flags":"Testosterone 13.3 nmol/L (optimal above 18, laboratory range 8.4 to 28.7). Below optimal for a 30-year-old male. LH 2.54, low-normal, suggesting central rather than testicular cause. Most likely driven by short sleep, alcohol intake and stress. Not yet below range but warrants lifestyle optimisation and retesting in 4 to 6 months.\nCorrected calcium 2.18 mmol/L, just below lower limit of 2.2. Raw calcium 2.3 within range. At this margin, most likely reflects normal variation or sample handling. No symptoms of hypocalcaemia. Recommend repeating on a fresh sample at next test.\nChloride 91 mmol/L, below range of 95 to 108. Sodium 134, at the floor of its range. Together suggest mild dehydration on the day or a transient shift. No symptoms, no medication cause. Bicarbonate and potassium not available on this panel. Repeat if persistent.\nMyoglobin 87.73 ug/L, above range of 25 to 72 but well below the 110 threshold for cardiac concern. CK-MB 3.16, normal. Consistent with resistance training and creatine supplementation. Not a cardiac finding.\nMCHC 348 g/L, marginally above 345. Laboratory notes temperature and storage can affect this marker. At this margin, a laboratory artefact.\nMPV 11.4 fL, above range of 7.1 to 10.1. Platelet count normal at 203. Reflects younger, more active platelets. No clinical concern.\nEosinophils below 0.02 x10^9/L. At or below the detection limit in a healthy individual with no allergy symptoms or steroid use. Normal variant.\nReassuring negatives: liver function excellent with GGT 21 and ALT 24 despite moderate alcohol intake; lipid profile exceptional with ApoB 0.83 and HDL 2.2; HbA1c 36 ruling out insulin resistance; thyroid function ideal with TSH 1.0; kidney function normal with eGFR above 90; iron stores healthy with ferritin 139; CRP 0.9 ruling out systemic inflammation; cardiac markers normal with CK-MB 3.16; urinalysis clean.","recommendations":"Discuss testosterone with your GP if lifestyle changes over the next 4 to 6 months do not bring it above 18 nmol/L. Bring this report showing total testosterone 13.3, LH 2.54 and SHBG 32.6. The GP may want to repeat a morning testosterone (before 10am, fasted) alongside LH, FSH and prolactin to confirm the pattern.\nMention the corrected calcium of 2.18 (just below 2.2) at your next GP visit or blood test. It is very likely normal variation, but a repeat on a fresh morning sample will confirm.\nMention the chloride of 91 and sodium of 134, both at the bottom of their ranges. The GP may want to check a venous blood gas or add bicarbonate and potassium to the next panel to complete the electrolyte picture.\nRetest in 4 to 6 months (spring 2027) to track testosterone response to sleep and alcohol changes. Key markers to repeat: testosterone (morning, fasted), LH, FSH, vitamin D, B12, folate, corrected calcium, full blood count, chloride and sodium. Add fasting insulin and glucose if available, as these were not on this panel and would complete the metabolic picture.\nCalorie and protein targets: at 73 kg, 169 cm, age 30, training five times per week at moderate intensity, your estimated maintenance calories are approximately 2,450 to 2,550 per day (BMR approximately 1,700 multiplied by an activity factor of 1.45 to 1.5). To build muscle with minimal fat gain, aim for 2,550 to 2,700 calories per day. Protein target: 95 to 117 grams per day (1.3 to 1.6 g per kg bodyweight), ideally spread across four meals with at least 25 grams per sitting.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 IU daily from October through April, taken with a meal containing fat. Your level of 78 nmol/L in early October is at the bottom of the optimal band and will fall below 50 by midwinter without supplementation. This is the supplement you asked about: it works, but as prevention rather than something you feel immediately. Consider 3,000 IU daily if you want to aim for the middle of the optimal range (around 100 nmol/L) by your next test.\nVitamin K2 (MK-7): 100 mcg daily, taken at the same time as your vitamin D. K2 directs the calcium that vitamin D helps absorb into bone rather than soft tissue. With your corrected calcium at 2.18 and vitamin D supplementation starting, K2 is a sensible companion.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Your active B12 at 108 pmol/L is within range but below optimal, and sublingual delivery bypasses gut absorption to improve uptake. This supports energy production and mood, both of which are among your goals.\nMagnesium glycinate: 300 mg before bed. Your magnesium at 0.88 is within optimal range, but supplementing at bedtime supports sleep quality, muscle recovery and the deeper sleep that drives testosterone production. This is one of the few supplements where most people notice a difference within two weeks.\nDo not take iron supplements. Your ferritin at 139 and transferrin saturation at 23.69 percent show healthy iron stores. Supplementing iron when stores are already adequate risks pushing ferritin above the optimal ceiling and causing oxidative stress.\nThe most important changes from this report are not supplements. They are extending sleep to 7 to 7.5 hours, getting morning light exposure, reducing alcohol to under 5 drinks per week, and hitting 95 to 117 grams of protein daily. These will move your testosterone, cortisol, energy and mood more than any supplement can.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 75 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Good. Raw 75.3. Weakest systems: cardiac markers 23%, kidney function 59%, electrolytes & minerals 68%. Biggest drags: Chloride, Myoglobin, Sodium, Corrected Calcium.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"22.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3186","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is an algorithm that estimates biological age from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Alexander's PhenoAge of 22.3 years against a calendar age of 30 means his blood is ageing nearly eight years younger than his chronological age. This is a strong result, driven by his healthy albumin (47), low CRP (0.9), low ALP (50), normal white cell count (6.69) and healthy red cell indices. Note: fasting glucose was not returned by the laboratory, so the estimated average glucose from HbA1c (5.4 mmol/L) was used in its place.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemi mal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet-to-lymphocyte ratio is another inflammatory index. Alexander's PLR of 69.8 is within the laboratory range but just below the optimal floor of 80, driven by his lymphocyte count sitting near the top of its range at 2.91. Both inputs are individually healthy, so this ratio simply reflects the mathematical relationship between them rather than a clinical concern.","low_causes":"High lymphocyte count, low platelet count","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"243","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4287","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index combines neutrophils, platelets and lymphocytes into a single score that reflects overall immune activation and inflammatory status. Alexander's SII of 243 is well within the ideal range of 150 to 450, confirming no chronic inflammation.","low_causes":"Immune suppression, very low neutrophils","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5147","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5804","units":"pmol/l","description":"Free T4 (free thyroxine) is the inactive form of thyroid hormone that circulates in the blood and is converted into the active form, T3, by the body's tissues. Alexander's FT4 of 17.6 is within the ideal range of 14 to 20, confirming the thyroid is producing an appropriate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3686","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3686","upper_optimal_position":"0.4632","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is the signal the pituitary gland sends to the thyroid to tell it how much hormone to produce. When the thyroid is working well, the pituitary does not need to shout, and TSH stays low. Alexander's TSH of 1.0 is at the bottom edge of the optimal range of 1.0 to 2.5, confirming excellent thyroid regulation with minimal pituitary drive needed.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroiditis, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4593","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (free triiodothyronine) is the active form of thyroid hormone that cells use for metabolism, energy production and temperature regulation. Alexander's FT3 of 5.0 is within the ideal range of 4.5 to 6.5, confirming that his body is converting FT4 into active T3 efficiently.","low_causes":"Hypothyroidism, chronic illness, calorie restriction, low T4","high_causes":"Hyperthyroidism, thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.284","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio measures how efficiently the body converts inactive thyroid hormone (T4) into active thyroid hormone (T3). Alexander's ratio of 0.284 is within the ideal range, confirming healthy conversion. Poor conversion can drive fatigue even when TSH and FT4 look normal.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"13.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4132","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle growth, bone density, mood, energy, motivation, libido and red blood cell production. Alexander's total testosterone of 13.3 nmol/L is above the laboratory floor of 8.4 but well below the optimal range of 18 to 30 for a healthy 30-year-old man. This is the most important finding in the report for his goals of building muscle, improving energy and improving mood. The most likely drivers are insufficient sleep (6 to 7 hours), moderate alcohol intake (5 to 9 drinks per week) and intermittent stress. A morning repeat after 3 to 4 months of lifestyle changes will show whether the level responds.","low_causes":"Insufficient sleep, alcohol, obesity, stress, ageing, pituitary dysfunction, chronic illness, medications","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"40.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4233","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5833","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is not bound to SHBG and is therefore biologically active. Alexander's FAI of 40.8 is within the laboratory range but below the optimal floor of 50, reflecting his below-optimal total testosterone. As total testosterone improves, the FAI will follow.","low_causes":"Low testosterone, high SHBG, ageing","high_causes":"High testosterone, low SHBG, PCOS (in women), anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"SHBG","group":"HORMONES","result":"32.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3849","upper_optimal_position":"0.5920","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds testosterone and takes it out of active circulation. Alexander's SHBG of 32.6 is within the ideal range of 25 to 55 for a man, meaning it is not excessively binding his testosterone. The below-optimal total testosterone is therefore a production issue, not a binding issue.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use","high_causes":"Ageing, hyperthyroidism, liver disease, oestrogen therapy, low calorie intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.2586","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4669","lower_normal":"0.138","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3870","upper_optimal_position":"0.5192","units":"nmol/l","description":"Calculated free testosterone estimates the fraction of testosterone not bound to any protein, and therefore immediately available to tissues. Alexander's free testosterone of 0.259 nmol/L is within the laboratory range but below the optimal floor of 0.3. This is consistent with his below-optimal total testosterone and will improve as total testosterone rises.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"High total testosterone, low SHBG, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3778","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3974","upper_optimal_position":"0.6154","units":"mIU/ml","description":"LH (luteinising hormone) is the signal the pituitary gland sends to the testes to produce testosterone. Alexander's LH of 2.54 is within the laboratory range but in the lower third and below the optimal floor of 3. A low-normal LH alongside below-optimal testosterone suggests the pituitary is not driving testosterone production hard enough, a pattern called central or functional hypogonadism. This is typically driven by lifestyle factors such as sleep deprivation, alcohol and stress rather than structural pituitary disease.","low_causes":"Stress, sleep deprivation, alcohol, obesity, medications, pituitary dysfunction","high_causes":"Primary testicular failure, Klinefelter syndrome, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"227","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2422","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"300","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4424","upper_optimal_position":"0.5836","units":"nmol/l","description":"Cortisol is the body's primary stress and alertness hormone, produced by the adrenal glands. A healthy morning cortisol should sit in the upper portion of its range because the cortisol awakening response, a surge in the first 30 to 45 minutes after waking, is what gets the body alert and energised for the day. Alexander's cortisol of 227 is within the laboratory range of 145 to 619 but sits in the lower third and below the optimal floor of 300. This is consistent with his report of feeling tired on waking and slow to get going. A blunted morning cortisol response is commonly driven by short or disrupted sleep, irregular sleep timing, and chronic low-level stress. It shares the same drivers as his below-optimal testosterone.","low_causes":"Adrenal insufficiency, chronic fatigue, chronic stress (late stage), disrupted sleep","high_causes":"Acute stress, Cushing's syndrome, steroid medication, high training load","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate", 33","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5809","units":"ug/l","description":"Myoglobin is a protein found inside muscle cells that stores oxygen for use during contraction. When muscle fibres are damaged, as happens routinely during resistance training, myoglobin is released into the bloodstream. Alexander's myoglobin of 87.73 is above the upper limit of 72 but well below the 110 threshold that would raise concern for cardiac damage. His CK-MB is normal at 3.16, confirming the source is skeletal muscle. This is a training artefact, consistent with his three resistance sessions per week and creatine supplementation, and does not require follow-up.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myocardial infarction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineph","name":"Urine pH","group":"URINALYSIS","result":"5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH of 5 indicates mildly acidic urine, which is within the normal physiological range. Urine pH varies throughout the day depending on diet, hydration and metabolic state.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineprotein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"mg/l","description":"No protein detected in the urine. This is the expected result and confirms the kidneys are filtering properly without leaking   if (b.within_normal === 'FALSE') return 'flag';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;

  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
