 the margin of laboratory variation. The lab notes that calcium can be falsely reduced in older specimens. With a raw calcium of 2.3 (within range), healthy albumin of 47, no symptoms of low calcium (tingling, muscle cramps, numbness) and no bone issues, this is not a finding that suggests a calcium disorder. It does not need GP follow-up at this margin, but if it were to be low again on a repeat test, parathyroid hormone would be worth checking.","low_causes":"Vitamin D deficiency, hypoparathyroidism, kidney disease, magnesium deficiency, malabsorption","high_causes":"Hyperparathyroidism, malignancy, vitamin D excess, sarcoidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and homocysteine metabolism. At 9 ng/ml, this is above the optimal floor of 8. Folate works alongside B12, and with both adequate, the methylation cycle that supports energy, mood and cell repair is functioning normally. Increasing vegetable intake from the current 2 to 3 portions to 5 or more will naturally boost folate further, as leafy greens are one of the richest dietary sources.","low_causes":"Poor dietary intake, alcohol, malabsorption, coeliac disease, pregnancy, medications (methotrexate, anticonvulsants)","high_causes":"Supplementation, high vegetable intake, B12 deficiency (folate trap)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6500","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is both a vitamin and a hormone that regulates calcium absorption, bone health, immune function, mood and muscle strength. At 78 nmol/L, Alexander is above the sufficiency threshold of 50 and just into the lower edge of the optimal band of 75 to 120. This is a reasonable level at the end of summer, but without supplementation it will decline significantly over the winter months when UVB radiation in the UK is too weak for the skin to produce vitamin D. This directly answers Alexander's question: vitamin D supplementation through the winter months is worthwhile, and a consistent daily dose of 2,000 to 3,000 IU will maintain a level of 80 to 100 through to spring.","low_causes":"Insufficient sun exposure, dark skin, winter months, low dietary intake, obesity, malabsorption","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4351","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6149","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions in the body, including energy production, muscle and nerve function, protein synthesis and blood sugar regulation. At 0.88 mmol/l, this is within the optimal band of 0.85 to 1.05. This is a reassuring result given Alexander's training load. Serum magnesium is a late marker of deficiency (the body prioritises blood levels by pulling from bone and muscle), so being within optimal suggests tissue stores are adequate.","low_causes":"Poor dietary intake, alcohol, intense exercise, medications (PPIs, diuretics), diabetes, malabsorption","high_causes":"Kidney disease, excessive supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It carries hormones, vitamins and drugs through the bloodstream and maintains the osmotic pressure that keeps fluid inside blood vessels. At 47 g/l, this is within the optimal range and reflects strong liver synthetic function and good nutritional status.","low_causes":"Liver disease, kidney disease (nephrotic syndrome), malnutrition, chronic inflammation, burns","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6267","units":"g/l","description":"Total protein measures the combined albumin and globulin in the blood. At 72 g/l, this is within the optimal range, reflecting balanced protein status. The albumin component (47) and globulin component (25) are both healthy.","low_causes":"Malnutrition, liver disease, kidney disease, malabsorption","high_causes":"Dehydration, chronic infection, myeloma, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3390","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6095","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones and bile ducts. At 50 IU/l, this is within the optimal range. A raised ALP can indicate bile duct obstruction, bone disorders or liver infiltration. A normal ALP at 30, when bone turnover from growth is complete, is expected and reassuring.","low_causes":"Zinc deficiency, hypothyroidism, pernicious anaemia, coeliac disease","high_causes":"Bile duct obstruction, bone disorders (Paget's, fracture healing), liver disease, pregnancy, growth","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4630","lower_normal":"18","upper_normal":"36","lower_optimal":"20","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5926","units":"g/l","description":"Globulins are a group of proteins in the blood that include antibodies (immunoglobulins), transport proteins and clotting factors. At 25 g/l, this is within the optimal range, reflecting a healthy immune system and balanced protein production.","low_causes":"Immunodeficiency, liver disease, kidney disease","high_causes":"Chronic infection, autoimmune conditions, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"17","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"18","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6042","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes and excretes it. At 17 umol/l, this is within range and sitting at the upper end of optimal. Bilirubin at this level, with entirely clean liver enzymes, is a normal variant. Some people naturally run higher bilirubin due to Gilbert's syndrome, a harmless inherited trait affecting about 5 to 10% of the population. Whether or not Alexander has Gilbert's, this is not a concern.","low_causes":"Generally not significant","high_causes":"Gilbert's syndrome, liver disease, bile duct obstruction, haemolysis, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT/GPT","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2857","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is an enzyme found predominantly in liver cells. When liver cells are damaged or inflamed, ALT leaks into the blood. At 24 IU/l, this is below the stricter optimal cutoff of 30 for men, confirming the liver is under no strain. This is a genuinely clean result.","low_causes":"Generally not significant","high_causes":"Fatty liver disease, alcohol, hepatitis, medications, intense exercise, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"33","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"IU/l","description":"AST (aspartate aminotransferase) is found in the liver, heart and muscles. At 33 IU/l, this is within the optimal range. AST can be mildly elevated after resistance training because it is also present in skeletal muscle, so a normal result in someone training three times a week is reassuring.","low_causes":"Generally not significant","high_causes":"Liver disease, heart attack, muscle damage, intense exercise, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1918","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is an enzyme found in the liver and bile ducts. It is particularly sensitive to alcohol and metabolic strain. At 21 IU/l, this is well within the optimal cutoff of 25 for men. Despite drinking 5 to 9 units a week, the liver is showing no sign of alcohol-related enzyme elevation, which is reassuring. This does not mean alcohol is not affecting other systems (testosterone production, sleep quality), but the liver itself is handling it without visible strain at present.","low_causes":"Generally not significant","high_causes":"Alcohol, fatty liver disease, bile duct obstruction, medications, metabolic syndrome, pancreatitis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4633","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the combined amount of all cholesterol carried in the blood, including the protective HDL, the harmful LDL and the triglyceride-rich VLDL. At 4.8 mmol/l, this is below the desirable limit of 5.18 and within the optimal band. However, total cholesterol is a blunt tool. The breakdown into HDL, LDL, ApoB and triglycerides tells the real story, and Alexander's breakdown is excellent.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet (saturated fat), genetics, hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2206","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat circulating in the blood. They come from dietary fat and from the liver converting excess carbohydrate and alcohol into fat. At 0.75 mmol/l, this is well below the optimal cutoff of 1.0. Low triglycerides reflect good insulin sensitivity and efficient fat metabolism. This is an excellent result.","low_causes":"Low fat diet, hyperthyroidism, malabsorption, malnutrition","high_causes":"Excess carbohydrate or alcohol, obesity, insulin resistance, diabetes, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"Very Low-Density Lipoprotein","group":"LIPIDS & CARDIOVASCULAR","result":"0.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2179","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to the tissues. At 0.34 mmol/l, this is well within range, consistent with the excellent triglyceride level. Low VLDL reflects efficient metabolic processing of dietary fats.","low_causes":"Low fat diet, hyperthyroidism","high_causes":"Excess carbohydrate, alcohol, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7097","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.4516","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol that carries excess cholesterol away from artery walls back to the liver for disposal. At 2.2 mmol/l, this is exceptionally high and well above both the desirable threshold of 1.55 and the optimal floor of 1.4 for men. HDL at this level provides significant cardiovascular protection and is one of the strongest positives in this report. Exercise, genetics and a healthy weight all contribute to high HDL.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, metabolic syndrome, medications","high_causes":"Regular exercise, genetics, moderate alcohol, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3800","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5733","units":"mmol/l","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits cholesterol into artery walls, driving atherosclerosis over time. At 2.28 mmol/l, this is well within the optimal target of below 2.6 and comfortably inside the laboratory range. Combined with the very high HDL, this gives Alexander an excellent TC:HDL ratio of 2.18 and an LDL:HDL ratio of 1.04, both of which reflect very low cardiovascular risk.","low_causes":"Hyperthyroidism, malnutrition, liver disease, malabsorption","high_causes":"Saturated fat intake, genetics (familial hypercholesterolaemia), hypothyroidism, obesity, diabetes, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2422","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio divides total cholesterol by the protective HDL fraction. At 2.18, this is well below the 4.5 upper limit and within the optimal band. A lower ratio indicates that a larger proportion of the total cholesterol is protective HDL. This is an excellent result.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high LDL, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"45.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9166","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"%","description":"HDL percentage shows what proportion of the total cholesterol is protective HDL. At 45.83%, nearly half of Alexander's total cholesterol is the beneficial type. This is well above the 20% floor and reflects an excellent cholesterol composition.","low_causes":"Low HDL, metabolic syndrome, obesity, sedentary lifestyle","high_causes":"Very high HDL, exercise, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7833","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. It enables HDL to pick up cholesterol from artery walls and deliver it back to the liver. At 1.88 g/L, this is well above the 1.20 desirable floor and the 1.4 optimal floor, consistent with his exceptionally high HDL. This provides strong cardiovascular protection.","low_causes":"Sedentary lifestyle, smoking, obesity, metabolic syndrome, genetics","high_causes":"Exercise, genetics, moderate alcohol, healthy weight","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.83","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein found on every LDL, VLDL and intermediate-density lipoprotein particle. Because each particle carries exactly one ApoB molecule, the ApoB level is effectively a direct count of the total number of atherogenic (artery-damaging) particles in the blood. Many cardiologists consider it the single best measure of cardiovascular risk. At 0.83 g/L, Alexander's result is below the desirable limit of 0.9 but above the tighter optimal target of 0.8. This is a good result, not a concern, and the ApoB to A1 ratio of 0.441 firmly in the lower-risk zone confirms that the balance between harmful and protective particles is excellent.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"High saturated fat diet, genetics, hypothyroidism, obesity, insulin resistance, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"APO B/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.441","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3150","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio captures the balance between the atherogenic particles (ApoB, which drive cholesterol into arteries) and the protective particles (ApoA1, which remove it). At 0.441, this is well within the lower-risk zone below 0.7 and inside the optimal band. This single number is one of the best summaries of cardiovascular risk, and Alexander's is excellent.","low_causes":"High HDL, low LDL, exercise, healthy weight","high_causes":"High LDL, low HDL, metabolic syndrome, smoking, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4500","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4667","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has glucose attached to it. Because red blood cells live for about 120 days, this gives an average blood sugar picture over the past two to three months. At 5.4%, this is within the normal range (below 6.0%) and within optimal. There is no sign of pre-diabetes or diabetes.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease (reduced red cell lifespan)","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"36","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4286","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c result expressed in the IFCC units used by NHS laboratories. At 36 mmol/mol, this is exactly at the optimal ceiling and well below the 42 threshold for pre-diabetes. Blood sugar control is excellent.","low_causes":"Haemolytic anaemia, blood loss, chronic kidney disease","high_causes":"Pre-diabetes, diabetes, high carbohydrate diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4357","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximate average blood sugar level over the past two to three months. At 6.1 mmol/L, this is within the optimal band and consistent with the normal HbA1c of 36 mmol/mol. Blood sugar control is excellent.","low_causes":"Low carbohydrate diet, frequent exercise, insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5148","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 is the unbound form of thyroxine, the storage hormone the thyroid gland produces. At 17.6 pmol/l, this is within the optimal range of 14 to 20. The thyroid is producing an appropriate amount of its primary hormone.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency, medications","high_causes":"Hyperthyroidism (Graves' disease), thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3725","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4373","upper_optimal_position":"0.4726","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland to tell the thyroid how hard to work. A high TSH means the pituitary is shouting at a sluggish thyroid; a low TSH means the thyroid is producing too much on its own. At 1.0 mIU/l, this is right at the lower edge of the optimal band of 1.0 to 2.5, meaning the pituitary is barely having to push the thyroid at all. The thyroid is functioning efficiently with minimal stimulation.","low_causes":"Hyperthyroidism, thyroiditis, pituitary disease, excessive thyroid medication","high_causes":"Hypothyroidism, iodine deficiency, recovery from illness, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4815","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the active thyroid hormone that enters cells and drives metabolism, energy production, body temperature and mood. At 5.0 pmol/L, this is within the optimal range of 4.5 to 6.5. The thyroid is converting its storage hormone (FT4) into the active form at a healthy rate, confirmed by the FT3:FT4 ratio of 0.284. The thyroid is not contributing to his fatigue.","low_causes":"Hypothyroidism, sick euthyroid syndrome, low calorie intake, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, T3 thyrotoxicosis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.284","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3-to-FT4 ratio reflects how efficiently the thyroid is converting its storage hormone (T4) into the active hormone (T3). At 0.284, this is within the optimal range. A low ratio can suggest impaired conversion due to selenium deficiency, chronic illness or calorie restriction. Alexander's ratio confirms healthy thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"hscrp","name":"HS-CRP","group":"INFLAMMATION","result":"0.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0900","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity C-reactive protein (hs-CRP) is a protein produced by the liver in response to inflammation anywhere in the body. It is used as both a marker of acute infection and, at low levels, as a predictor of cardiovascular risk. At 0.9 mg/l, this is within the optimal band of below 1.0 and well below the laboratory limit of 5. This confirms that there is no significant systemic inflammation at the time of the test and that Alexander's cardiovascular inflammation risk is low.","low_causes":"Good health, low inflammation","high_causes":"Infection, chronic inflammation, obesity, smoking, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"activeb12","name":"Active B12","group":"VITAMINS & NUTRIENTS","result":"108.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5305","lower_normal":"25.1","upper_normal":"165","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4648","upper_optimal_position":"0.6309","units":"pmol/L","description":"Active B12 (holotranscobalamin) measures the fraction of vitamin B12 in the blood that is bound to transcobalamin II and is therefore available for cells to use. This is a more accurate measure than total B12, which includes inactive forms bound to haptocorrin. At 108.1 pmol/L, this is within the optimal range. B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. Alexander's level is adequate on a mixed diet containing meat, and B12 deficiency is not contributing to his fatigue. No B12 supplementation is needed at this level.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, coeliac disease, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ckmb","name":"CK-MB","group":"CARDIAC MARKERS","result":"3.16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3224","lower_normal":"0","upper_normal":"4.9","lower_optimal":"0","upper_optimal":"4.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/L","description":"CK-MB is the form of creatine kinase found primarily in heart muscle. It is used alongside total CK to assess whether elevated CK is coming from the heart (suggesting cardiac damage) or from skeletal muscle (suggesting exercise or injury). At 3.16, this is well below the 4.9 upper limit. With a total CK of 222 from resistance training, the normal CK-MB confirms the muscle enzyme elevation is skeletal, not cardiac. There is no sign of heart muscle damage.","low_causes":"Not clinically significant","high_causes":"Myocardial infarction, myocarditis, cardiac surgery, cardiac contusion","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"myoglobin","name":"Myoglobin","group":"CARDIAC MARKERS","result":"87.73","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6144","lower_normal":"25","upper_normal":"72","lower_optimal":"25","upper_optimal":"60","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5714","units":"ug/l","description":"Myoglobin is an oxygen-storage protein found inside both skeletal and cardiac muscle cells. When muscle cells are damaged, myoglobin leaks into the blood. At 87.73 ug/l, this is above the upper limit of 72 but well below the 110 threshold the lab identifies as highly suggestive of myocardial infarction. With CK-MB at 3.16 (normal), no chest pain, and regular resistance training three times a week, this elevation is coming from skeletal muscle breakdown during exercise. The lab also notes that results can be elevated on samples not received same day, so sample transit time may also be contributing. This does not require follow-up.","low_causes":"Not clinically significant","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, myocardial infarction, sample delay","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"13.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4143","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male sex hormone, responsible for muscle mass, bone density, red blood cell production, fat distribution, libido, mood and energy. At 13.3 nmol/L, Alexander's result falls within the broad laboratory range of 8.4 to 28.7 but is well below the optimal band of 18 to 30 for a 30-year-old man. This means he has roughly half the testosterone of a man sitting in the middle of the optimal zone. His LH at 2.54 (lower third of range) suggests the pituitary gland is not maximally stimulating the testes, which points to functional suppression rather than testicular failure. The most likely drivers are sleep restriction (6 to 7 hours, unrefreshed waking) and alcohol (5 to 9 drinks a week), both of which directly suppress the hypothalamic-pituitary-gonadal axis. This is the finding most relevant to his goals of building muscle, improving energy and improving mood. Lifestyle changes targeting sleep and alcohol should be the first intervention, with a repeat test in 3 to 4 months to assess the response.","low_causes":"Poor sleep, alcohol, obesity, stress, medications (opioids, finasteride), ageing, pituitary disease, testicular failure, chronic illness","high_causes":"Anabolic steroid use, testosterone replacement therapy, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"40.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3633","lower_normal":"30","upper_normal":"150","lower_optimal":"50","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4444","upper_optimal_position":"0.5833","units":"","description":"The free androgen index is a ratio of total testosterone to SHBG, expressed as a percentage. It estimates the proportion of testosterone that is free and biologically active. At 40.8, this is within the laboratory range of 30 to 150 but below the optimal band of 50 to 120. This reflects the low total testosterone rather than high SHBG binding. As testosterone improves with sleep and alcohol changes, the FAI will rise in proportion.","low_causes":"Low testosterone, high SHBG, liver disease, hyperthyroidism, medications","high_causes":"High testosterone, low SHBG, obesity, insulin resistance, PCOS (female)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"32.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4377","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3849","upper_optimal_position":"0.5910","units":"nmol/l","description":"SHBG (sex hormone binding globulin) is a protein produced by the liver that binds testosterone (and oestrogen) tightly, making it unavailable for tissues to use. At 32.6 nmol/l, this is within the optimal range of 25 to 55. This means SHBG is not the reason for the low testosterone. The binding is normal; there is simply not enough testosterone being produced to begin with.","low_causes":"Obesity, insulin resistance, hypothyroidism, anabolic steroid use, PCOS (female)","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen therapy, low testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.2586","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4006","lower_normal":"0.138","upper_normal":"1.04","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5128","upper_optimal_position":"0.6095","units":"nmol/l","description":"Free testosterone is the small fraction of total testosterone (typically 2 to 3%) that is not bound to any protein and is therefore immediately available to enter cells and exert its effects. At 0.2586 nmol/l, this is within the laboratory range but below the optimal band of 0.3 to 0.8. This is consistent with the low total testosterone. Free testosterone is the fraction that actually drives muscle protein synthesis, energy, mood and libido at the tissue level.","low_causes":"Low total testosterone, high SHBG, ageing, poor sleep, alcohol, obesity","high_causes":"Testosterone therapy, anabolic steroids, low SHBG","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"2.54","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3989","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"3","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5385","units":"mIU/ml","description":"LH (luteinising hormone) is the signal the pituitary gland sends to the testes to produce testosterone. At 2.54 mIU/ml, this is within the laboratory range of 1.5 to 9.3 but below the optimal band of 3 to 7. A low-normal LH alongside a low-normal testosterone suggests that the pituitary is not pushing the testes hard enough, which is a pattern seen with sleep deprivation, alcohol, chronic stress and excessive training without adequate recovery. If the testes were failing, LH would be high as the pituitary tries harder to compensate. The fact that it is low points to the brain (hypothalamus and pituitary) as the level where suppression is happening.","low_causes":"Sleep deprivation, alcohol, stress, calorie restriction, medications (opioids), pituitary disease","high_causes":"Primary hypogonadism (testicular failure), menopause (female), PCOS (female)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"227","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2389","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"300","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4361","upper_optimal_position":"0.5692","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. In a healthy pattern, cortisol peaks sharply in the first 30 to 60 minutes after waking (the cortisol awakening response), driving alertness and energy, then gradually declines through the day and reaches its lowest point around midnight. At 227 nmol/l, Alexander's result is within the morning laboratory range of 145 to 619 but sits in the lower quarter. Combined with his report of feeling tired on waking and slow to get going, this suggests his cortisol awakening response may not be peaking as strongly as it should. This pattern is associated with irregular sleep timing, late-night light exposure, chronic stress and caffeine use later in the day. It is not a disease state; it is a rhythm that has drifted and can be corrected with consistent sleep and wake times, morning light exposure and an evening wind-down.","low_causes":"Adrenal insufficiency (Addison's), pituitary disease, chronic fatigue, shifted cortisol rhythm","high_causes":"Chronic stress, Cushing's syndrome, steroid medications, shift work, acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"8.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5250","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"5","upper_optimal":"11","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4858","upper_optimal_position":"0.5725","units":"umol/L","description":"DHEA-S (dehydroepiandrosterone sulphate) is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. It peaks in the late twenties and gradually declines with age. At 8.1 umol/L, this is within the optimal range for a 30-year-old man and near its expected lifetime peak. DHEA-S levels reflect adrenal health and the raw material available for hormone production. A normal DHEA-S with low testosterone further supports the interpretation that the suppression is happening at the pituitary/hypothalamic level rather than at the adrenal or testicular production level.","low_causes":"Ageing, adrenal insufficiency, chronic illness, steroid use","high_causes":"Adrenal hyperplasia, adrenal tumours, PCOS (female), stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5524","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone is the fraction of total testosterone that is either free or loosely bound to albumin, and therefore available for tissues to use. It excludes the tightly bound SHBG fraction. At 6.6 nmol/L, this is within the optimal range of 4 to 9. While total testosterone and free testosterone are below optimal, the bioavailable fraction is adequate because SHBG is not excessively high. This means the testosterone that is being produced is reaching tissues, but total production needs to increase to fully support muscle building, energy and mood.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"222","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5429","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"280","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.6190","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in skeletal muscle, heart muscle and brain. It leaks into the blood when muscle fibres are damaged during exercise or injury. At 222 U/L, this is within the optimal range for a man doing three resistance sessions per week. The level confirms muscle is being used and broken down during training, which is a normal and necessary part of muscle adaptation and growth. CK-MB at 3.16 confirms the elevation is from skeletal muscle, not the heart.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Resistance training, endurance exercise, muscle injury, rhabdomyolysis, statin medications, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures how acidic or alkaline the urine is. A pH of 5 is mildly acidic, which is normal. Urine pH fluctuates with diet, hydration and the time of day and is not a concern at this level.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineprotein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Protein in the urine (proteinuria) can indicate kidney damage or inflammation. A negative result confirms the kidneys are filtering properly and not leaking protein.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineglucose","name":"Urine Glucose","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Glucose in the urine appears when blood sugar exceeds the kidney's reabsorption threshold, typically above 10 mmol/L. A negative result is consistent with the normal HbA1c and confirms no diabetes-related glucose spillover.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ketones","name":"Ketones","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Ketones appear in urine when the body is burning fat for fuel instead of glucose, which happens during fasting, low-carbohydrate diets or uncontrolled diabetes. A negative result is normal on a standard mixed diet.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinewbc","name":"Urine WBCs","group":"URINALYSIS","result":"<1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"wbc/ul","description":"White blood cells in the urine indicate infection or inflammation in the urinary tract. At less than 1, this is well below the significance threshold of 10 and rules out urinary tract infection or kidney inflammation.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinerbc","name":"Urine RBCs","group":"URINALYSIS","result":"<1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"rbc/ul","description":"Red blood cells in the urine (haematuria) can indicate kidney stones, infection, inflammation or, in older individuals, bladder or kidney pathology. At less than 1, this is well below the significance threshold of 25 and is completely normal.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"casts","name":"Casts","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Casts are cylindrical structures formed in the kidney tubules. Their presence can indicate kidney disease. A negative result confirms healthy kidney tubular function.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bacterialcount","name":"Bacterial Count","group":"URINALYSIS","result":"<1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"CFU/ml","description":"Bacterial count in the urine measures whether bacteria are present. At less than 1 CFU/ml, this confirms no bacterial growth and rules out urinary tract infection.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urineculture","name":"Urine Culture and Sensitivities","group":"URINALYSIS","result":"No growth","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"The urine culture incubates the sample to check for bacterial growth. No growth confirms const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
