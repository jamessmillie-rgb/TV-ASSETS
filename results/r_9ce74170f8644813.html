<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"David Lenton","dob":"02/08/1989","report_date":"2026-09-26","summary":"David is a 37-year-old male presenting with a BMI of 25.6, following a high-carb, low-fat diet rated 5 out of 10 for quality with a volume of 6 out of 10. He trains eight or more times per week, with five or more cardio sessions and three resistance sessions, at very high intensity, with over 15,000 daily steps. He reports no medications and no alcohol. He describes very high-intensity exercise or bodybuilding as a habit. He reports low energy and fatigue, low sex drive and libido, and joint pain and stiffness. His goals are to build muscle, boost his immune system and improve his sleep quality.\n\nThe finding that stands out most in this report, and the one David should discuss with his GP before anything else, is a pattern in his red blood cells that points towards a possible inherited haemoglobin condition. His MCV, which measures the average size of each red blood cell, is 66.2 femtolitres, well below the lower limit of 83. His MCH, which measures the average amount of haemoglobin packed into each cell, is 22 picograms against a lower limit of 27. His RDW, which measures the variation in red cell size, is 21.8 percent against an upper limit of 15, meaning his red cells vary widely in size. At the same time, his red blood cell count is 6.36, above the upper limit of 5.5. This combination, small red cells, low haemoglobin per cell, wide size variation, and an elevated red cell count, is a pattern strongly associated with a haemoglobin variant such as thalassaemia trait. Thalassaemia is an inherited condition where the body makes a slightly different form of haemoglobin, the protein inside red blood cells that carries oxygen. In thalassaemia trait, the body compensates by producing more red blood cells that are individually smaller, which is exactly what we see here. His Mentzer Index, which divides MCV by red blood cell count, comes out at 10.4, below the threshold of 13 that is used as a screening tool; values below 13 favour thalassaemia trait over iron deficiency as the explanation. His iron studies are entirely healthy, with ferritin at 176, transferrin saturation at 30.6 percent and serum iron at 20.9, so iron deficiency is not driving this picture. The GP should arrange a haemoglobin electrophoresis, which is a simple blood test that identifies the exact type of haemoglobin present. Thalassaemia trait is not a disease and does not cause illness, but it is important to know about for two reasons: it explains a set of blood results that would otherwise look alarming on every future test, and it has implications for family planning, because if both parents carry the trait, there is a chance of a child inheriting a more significant form.\n\nWith that flagged, there is a great deal of good news in this report. David's cardiovascular health is exceptional. His total cholesterol is 4.1, his LDL is 2.15, his ApoB, which is the best single measure of the number of cholesterol-carrying particles in the bloodstream, is 0.79, below the 0.9 threshold and within the ideal range below 0.8. His HDL, the protective cholesterol that removes fat from artery walls, is 1.5, just below the ideal of 1.55 but a strong result for a man. His triglycerides are 1.06, within the ideal range. His Lp(a), a genetically fixed lipoprotein that independently drives cardiovascular risk and cannot be changed by diet or exercise, is below 25, which is genuinely useful information because it means his entire lipid profile is driven by modifiable factors and nothing inherited is working against him. His Cardiovascular Risk Score, a composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), CRP and HbA1c, is 5 out of 100, which is outstanding. His ApoB to ApoA1 ratio is 0.491 against a threshold of 0.7, and his Castelli II ratio is 1.43 against an ideal below 2.5. Every angle of cardiovascular risk is clean.\n\nHis liver is working well overall. GGT at 24 is within the ideal range below 25, and bilirubin at 12, alkaline phosphatase at 76, and albumin at 46 are all healthy. His FIB-4 score, which screens for liver scarring, is 1.01, well below the 1.45 threshold, and his NAFLD Fibrosis Score is minus 3.2, confirming no sign of fatty liver disease. His AST at 50 is above its upper limit of 45, but his ALT at 56 sits right at its upper limit, and the De Ritis ratio, which divides AST by ALT, is 0.89, within the ideal range. In a man training at very high intensity with a creatine kinase of 356, which is above the 320 upper limit and reflects muscle breakdown from heavy training, the AST is almost certainly being driven by muscle damage rather than liver pathology. AST is present in both liver and muscle cells, and intense resistance training releases it from muscle into the bloodstream. The GGT being clean confirms the liver itself is not under strain. David should be aware that his ALT and AST will likely be mildly elevated on any test taken within 48 to 72 hours of a hard training session, and this is not a concern.\n\nHis kidney function is excellent. Cystatin C, which is a more reliable marker of kidney filtration than creatinine in active people because it is not influenced by muscle mass, is 0.86, giving an estimated GFR of 108, exactly where it should be at 37. His creatinine-based eGFR is also above 90. Sodium, chloride and bicarbonate are all within range. His uric acid at 334 is within the ideal range below 380. His urea at 9.3 is above the upper limit of 8.2, and his urea-to-creatinine ratio at 112 is above the ideal upper limit of 90. Urea rises with high protein intake and with dehydration after intense exercise, and given that David trains at very high intensity with over 15,000 steps a day, this is most likely a reflection of protein turnover and mild post-exercise dehydration rather than kidney stress. The clean cystatin C and normal creatinine confirm the kidneys are filtering well.\n\nHis thyroid is in excellent health. TSH at 2.02 is within the ideal range of 1.0 to 2.5, Free T4 at 18.9 is within the ideal range of 14 to 20, and Free T3 at 6.1 is within the ideal range of 4.5 to 6.5. His FT3 to FT4 ratio is 0.323, within the ideal range, meaning his body is converting the storage hormone T4 into the active hormone T3 efficiently. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease.\n\nHis immune system is balanced. IgG, IgA and IgM are all within their reference ranges, IgE is low at 9.88 against a limit of 100, suggesting no allergic drive, and rheumatoid factor is negative at 5. His coeliac screen, tissue transglutaminase IgA, is negative. His white cell count at 6.96 with neutrophils at 3.84 and lymphocytes at 2.56 is well balanced, and his neutrophil-to-lymphocyte ratio is 1.5, within the ideal range of 1.0 to 2.0. His ESR is 1, and his CRP is 0.6, both confirming very low systemic inflammation. His platelet-to-lymphocyte ratio and systemic immune-inflammation index are both within ideal ranges. His prostate markers are clean, with a PSA of 0.64 and a free-to-total ratio of 28.1 percent. His tumour markers CA19-9 and CEA are both within range. His cortisol at 339 is within the morning reference range. His testosterone at 21 is within the optimal range of 18 to 30, his free testosterone at 0.3798 is healthy, and his SHBG at 41.8 is within the ideal range. His oestradiol, LH, FSH, prolactin, DHEA-S and progesterone are all within their reference ranges. His magnesium at 0.95 is within the ideal range of 0.85 to 1.05, and his calcium and corrected calcium are both healthy. His parathyroid hormone at 1.336 is within range.\n\nHis vitamin B12 at 517 is within the laboratory range but below the optimal level of 500 to 900; it is adequate but not generous, and on a high-carb, low-fat diet that may be lower in animal protein, this is worth keeping an eye on. His folate at 23 is above the upper limit of 17. Elevated folate is common with supplementation or a diet high in leafy greens and fortified foods. It is not harmful, but very high folate can mask a developing B12 deficiency by keeping the blood count looking normal while neurological damage progresses silently. Given that his B12 is in the lower half of ideal, David should ensure he is getting adequate B12 rather than relying on folate alone. His vitamin D at 76 is within the optimal range of 75 to 120, sitting right at the lower edge of ideal.\n\nHis total antioxidant activity at 2.25 is above the upper limit of 1.77. This marker measures the overall capacity of the blood to neutralise free radicals, and it rises with antioxidant-rich foods, supplements and, notably, with intense exercise, which upregulates the body's own antioxidant defence systems. In a man training at this intensity, an elevated TAA is expected and is a positive finding rather than a concern.\n\nTurning to the insulin and blood sugar picture, which is interesting and needs some context. His fasting glucose at 4.6 is within the ideal range. His HbA1c at 41 mmol per mol, which measures the average blood sugar over the past two to three months, is within the normal range below 42 but sitting close to the upper boundary. His fasting insulin at 2.2 is below the lower limit of 2.6, and his C-Peptide at 0.472 micrograms per litre, which converts to approximately 156 pmol/L, is below its lower limit of 1.1 micrograms per litre. C-Peptide is released by the pancreas in equal amounts to insulin and is a more stable measure of how much insulin the pancreas is producing. His HOMA-IR, which estimates insulin resistance, is 0.45, below the lower limit of 0.5, meaning he is highly insulin-sensitive, which is a genuinely positive finding. His HOMA-B, which estimates how hard the pancreas is working, would be low, reflecting the low insulin output. In a lean, very active man on a high-carb diet with a normal fasting glucose, this pattern usually reflects excellent insulin sensitivity: the body needs very little insulin to keep blood sugar controlled, so the pancreas produces very little. This is metabolically efficient. However, because the HbA1c at 41 is at the upper end of normal despite very low insulin, it is worth keeping an eye on this over time. At present the glucose is 4.6, which is reassuring, but if HbA1c drifts above 42 on a future test while insulin remains this low, it could suggest the pancreas is running lean on output rather than simply being efficient. For now, this is the favourable explanation, and his estimated average glucose of 6.8 is within the normal range below 7.\n\nTurning to David's symptoms. He reports low energy and fatigue, low libido, and joint pain and stiffness. His testosterone at 21 is within the optimal range, his thyroid is working well, his iron stores are adequate, his B12 is reasonable, his blood sugar is controlled, and his inflammation markers are very low. The bloods do not point to a single hormonal or metabolic cause for these symptoms. What they do point to, taken alongside his quiz, is training load and recovery. David is training at very high intensity eight or more times a week with over 15,000 daily steps, on a diet rated only 5 out of 10 for quality with moderate volume. His creatine kinase at 356 confirms significant muscle breakdown, and his slightly elevated AST is consistent with that. His cortisol at 339 is within the morning range but not high, suggesting his adrenal stress response is not being overdriven, which is reassuring, but chronic high training volume can produce fatigue, low libido and joint stiffness through accumulated mechanical stress and inadequate recovery rather than through a single blood marker. His sleep quality, which he wants to improve, is likely both a cause and a consequence: poor sleep impairs recovery, and under-recovery impairs sleep. The joint pain and stiffness at 37 in a man training this hard is most likely mechanical, driven by training volume and insufficient rest days, rather than inflammatory, given that his CRP is 0.6, his ESR is 1 and his rheumatoid factor is negative.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 55.3, about 18 years older than a calendar age of 37.\n\nIn summary, David's cardiovascular health, liver, kidneys, thyroid, immune system, hormones and inflammation are all in strong shape. The priority finding is the red blood cell pattern that should be investigated with a haemoglobin electrophoresis. The symptoms of fatigue, low libido and joint stiffness are most likely driven by training volume outpacing recovery and diet quality, and the practical steps below are designed to close that gap.","links":"The central thread in this report is a man whose metabolic and cardiovascular health is excellent but whose red blood cell indices tell a story that needs resolving. The combination of a low MCV at 66.2, low MCH at 22, elevated RDW at 21.8 and a high red blood cell count at 6.36, alongside completely normal iron studies, is the hallmark of a haemoglobin variant rather than a nutritional deficiency. Iron deficiency would show falling ferritin, rising transferrin and low saturation; David has none of those. The Mentzer Index at 10.4, well below the 13 threshold, supports thalassaemia trait as the most likely explanation. This is a single inherited finding that explains four abnormal blood count markers in one stroke.\n\nThe second thread connects the elevated AST at 50 and creatine kinase at 356 to training intensity. Both enzymes are released from damaged muscle fibres, and in a man doing five or more cardio sessions and three resistance sessions a week at very high intensity, these numbers are expected. The liver is not the source: GGT at 24 is clean, bilirubin is normal, the FIB-4 and NAFLD scores both confirm no scarring or fat accumulation, and the De Ritis ratio at 0.89 is within ideal. If David had his blood taken within 48 hours of a heavy session, these elevations are entirely explained by training.\n\nThe third thread is the insulin picture. Fasting insulin at 2.2 and C-Peptide at 156 pmol/L are both below their lower reference limits, but fasting glucose at 4.6 is normal and HOMA-IR at 0.45 confirms exceptional insulin sensitivity. The body is running on very little insulin because it does not need more. The HbA1c at 41, while normal, is at the upper end, which creates a small question mark for future monitoring. The most likely explanation is that the high-carb diet produces modest glucose peaks after meals that average out to a slightly higher HbA1c, but fasting control is excellent. This is not a problem today but is worth tracking.\n\nThe fourth thread connects David's symptoms to his lifestyle rather than to any blood marker. Fatigue, low libido and joint stiffness in a 37-year-old with optimal testosterone, clean thyroid, adequate iron, low inflammation and normal B12 are not explained by the blood. They are explained by a training volume that exceeds eight sessions a week at very high intensity on a diet of middling quality with moderate volume. Chronic under-recovery suppresses energy, blunts libido through central nervous system fatigue rather than hormonal failure, and leaves joints stiff from accumulated mechanical stress. The CK at 356 is the blood marker that confirms the body is being asked to repair a lot of tissue. Improving sleep, increasing diet quality and building in genuine rest days are the levers that will shift these symptoms.\n\nThe findings that were excluded are clinically important. Thyroid autoimmunity is ruled out. Coeliac disease is negative. Inflammatory markers are at the floor. Kidney function is pristine. Liver health, once the training effect is accounted for, is excellent. Cardiovascular risk is among the lowest we see. These exclusions narrow the field to recovery and lifestyle as the explanation for how David feels.","lifestyle":"Add a portion of oily fish (salmon, mackerel, sardines) twice a week, and increase fruit and vegetable portions to at least five a day. Anchor: batch-cook a fish meal on Sunday and Wednesday. Why: your diet is rated 5 out of 10 for quality, and improving it is the single biggest lever for your energy, recovery and long-term health. Oily fish provides omega-3 and vitamin D, and more vegetables provide the micronutrients your training volume demands.\nAdd a palm-sized portion of protein to every meal, aiming for at least 130 grams of protein per day spread across four eating occasions. Anchor: protein goes on the plate first, before carbohydrate. Why: at 83 kilograms training at this intensity, you need 1.6 to 2 grams per kilogram, which is 133 to 166 grams a day, to support muscle repair and bring that CK of 356 down.\nTake one full rest day per week with no structured training, only walking. Anchor: pick the same day each week and protect it. Why: your CK at 356 and AST at 50 confirm your muscles are under significant repair load. Recovery is when muscle is built, not during the session. Your fatigue, low libido and joint stiffness are the symptoms of a body that is not getting enough recovery between sessions.\nSet a fixed wake time seven days a week, within 30 minutes of the same time, and get outside within the first hour for at least 10 minutes of natural light. Anchor: alarm goes off, shoes go on, walk around the block. Why: a consistent wake time is the strongest single driver of sleep quality, which is one of your three goals. Morning light resets the circadian clock that governs sleep onset.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, meaning a 3pm coffee still has half its stimulant effect at 9pm. With sleep quality as a goal, this is a quick win.\nAim for a calorie intake of approximately 2,700 to 2,900 kcal per day to support your training and maintain weight at 83 kilograms. Your estimated maintenance is around 2,800 to 3,000 kcal based on your height, weight and very high activity level, so eat at or just below this to maintain lean mass while improving body composition. Your protein floor is 133 grams per day.\nDrink at least two to three litres of water across the day, with 500ml in the hour before training and sipping throughout. Anchor: carry a bottle and refill at meals. Why: your urea at 9.3 and urea-to-creatinine ratio at 112 suggest mild dehydration, likely from the volume of training and steps. Adequate hydration supports kidney function, joint lubrication and recovery.","flags":"Red blood cell indices: MCV 66.2 (range 83 to 101), MCH 22 (range 27 to 32), RDW 21.8 percent (range 11.5 to 15), RBC 6.36 (range 4.5 to 5.5), Mentzer Index 10.4. This pattern, with completely normal iron studies, is strongly suggestive of thalassaemia trait. Haemoglobin electrophoresis is recommended to confirm.\nAST 50 IU/L (range 13 to 45) with CK 356 U/L (range 40 to 320). Both are elevated in the context of very high-intensity training. GGT at 24 and all other liver markers are clean, confirming the source is skeletal muscle rather than liver. No action needed beyond awareness that these will be elevated around training.\nFasting insulin 2.2 mIU/L (range 2.6 to 24.9) and C-Peptide 0.472 ug/L (range 1.1 to 4.4), both below range, with fasting glucose 4.6 and HbA1c 41. HOMA-IR 0.45 confirms high insulin sensitivity. This pattern reflects very efficient insulin economy rather than pancreatic insufficiency. HbA1c at 41 is at the upper end of normal and should be monitored on retest.\nUrea 9.3 mmol/L (range 3.2 to 8.2), urea-to-creatinine ratio 112 (ideal below 90). Most likely driven by high protein intake and post-exercise dehydration. Cystatin C eGFR of 108 confirms normal kidney filtration.\nSerum folate 23 ng/ml (range 3 to 17). Elevated, likely dietary or supplemental. Not harmful in isolation but should be noted alongside a B12 of 517, which is adequate but not generous, as high folate can mask early B12 deficiency.\nTotal antioxidant activity 2.25 mmol/L (range 1.3 to 1.77). Expected in a man training at very high intensity. Not a clinical concern.\nBioavailable testosterone 9.49 nmol/L (range 2 to 9). Marginally above the upper reference limit, reflecting healthy total testosterone and well-balanced SHBG. This is a positive finding.\nReassuring negatives: cardiovascular risk score 5 out of 100, Lp(a) below 25, ApoB 0.79, CRP 0.6, ESR 1, thyroid antibodies negative, coeliac negative, rheumatoid factor negative, PSA 0.64 with free ratio 28.1 percent, cystatin C eGFR 108, FIB-4 1.01, NAFLD score minus 3.2, all immunoglobulins within range, IgE 9.88, cortisol 339, testosterone 21 with free testosterone 0.38.","recommendations":"Arrange a haemoglobin electrophoresis through your GP. Bring these numbers: MCV 66.2, MCH 22, RDW 21.8, RBC 6.36, Mentzer Index 10.4, ferritin 176, transferrin saturation 30.6 percent. The iron studies are normal, which makes thalassaemia trait the most likely explanation rather than iron deficiency. This test confirms the diagnosis and is important for your permanent medical record and for family planning.\nMention the fasting insulin of 2.2 and C-Peptide of 0.472 to your GP for a note on file. Explain that HOMA-IR is 0.45 and glucose is 4.6, so the picture is one of high insulin sensitivity rather than deficiency. No action is needed now, but HbA1c at 41 should be rechecked in six months to confirm it is not drifting upward.\nAsk your GP to record your Lp(a) result of below 25 nmol/L permanently. This is genetically fixed and never needs retesting. It confirms that your cardiovascular risk is entirely within your control through lifestyle.\nRetest in six months with a focus on: HbA1c, fasting insulin, C-Peptide, full blood count (to confirm the red cell pattern is stable post-electrophoresis), CK and AST (ideally after 72 hours of rest to get a true baseline), and vitamin D to ensure levels hold through winter. Aim for a calorie intake of 2,700 to 2,900 kcal per day with a protein floor of 133 grams per day.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily taken with your largest meal that contains fat. Your level of 76 is right at the lower edge of optimal, and through the autumn and winter months without supplementation it will drop below the ideal threshold. Take alongside vitamin K2 (MK-7), 100 micrograms daily, which directs calcium into bone rather than soft tissue.\nMagnesium glycinate, 300 to 400 milligrams taken 30 to 60 minutes before bed. Your magnesium at 0.95 is within the ideal range, but at this training volume magnesium is lost through sweat, and glycinate form supports sleep quality, which is one of your three goals.\nOmega-3 fish oil providing 2 grams of combined EPA and DHA daily, taken with food. Your lipid profile is already excellent, but omega-3 supports joint comfort, which is relevant to your joint stiffness, and supports recovery from the training volume you are doing.\nDo not take iron supplements. Your ferritin is 176, your transferrin saturation is 30.6 percent, and your iron stores are healthy. Supplementing iron when stores are adequate risks pushing levels towards overload.\nThe most important changes from this report are not supplements. They are improving diet quality from 5 out of 10 towards 8, building in a full rest day each week, fixing a consistent sleep schedule, and ensuring protein intake reaches 133 to 166 grams a day.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 63.8; held to 59 by a system rated \"See your GP\". Weakest systems: hematology 28%, glucose & insulin 42%, kidney function 44%. Biggest drags: C-Peptide, Urea, Red Blood Count, RDW.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"55.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6583","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"37","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4405","units":"years","description":"PhenoAge is calculated from your measured results. It sits outside the ideal range. It is being driven by RDW, which sits outside the ideal range.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0625","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built by current biomarker levels, independent of age. David's score of 5 out of 100 is outstanding, well within the ideal range below 20. Every input is contributing favourably: ApoB at 0.79, HDL at 1.5, triglycerides at 1.06, Lp(a) below 25, CRP at 0.6, and HbA1c at 41. This is one of the lowest cardiovascular risk profiles we see.","low_causes":"Healthy lipids, low inflammation, good metabolic control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5960","units":"mmol/L","description":"Blood glucose is the concentration of sugar in the bloodstream after fasting, and it reflects how well the body controls its primary fuel source. David's result of 4.6 mmol/L sits within the ideal range of 4.0 to 5.4, indicating healthy fasting glucose control. In a man on a high-carb diet training at very high intensity, a fasting glucose of 4.6 confirms that the body is clearing sugar efficiently overnight.","low_causes":"Prolonged fasting, excessive exercise, reactive hypoglycaemia, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress response, high-carbohydrate meals before testing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4917","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.45","units":"%","description":"HbA1c expressed as a percentage reflects average blood sugar control over the past two to three months. David's result of 5.9% is within the normal range below 6.0% but close to the pre-diabetes threshold. This needs context: his MCV of 66.2 and the likely thalassaemia trait can affect HbA1c measurement, as smaller, shorter-lived red blood cells may alter how much glucose attaches to haemoglobin. His fasting glucose of 4.6 is reassuringly normal, suggesting actual glucose control is better than the HbA1c alone might imply. The mmol/mol value below is the more precise measure.","low_causes":"Shortened red cell lifespan, haemolytic anaemia, chronic blood loss","high_causes":"Sustained high blood sugar, pre-diabetes, type 2 diabetes, iron deficiency","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"41","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4881","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"HbA1c in mmol/mol is the internationally standardised measure of average blood sugar over the past two to three months. Haemoglobin, the oxygen-carrying protein in red blood cells, slowly collects glucose from the bloodstream, and HbA1c measures how much has accumulated. David's result of 41 is within the normal range below 42 but sitting right at the upper boundary. In context, his fasting glucose is a healthy 4.6 and his HOMA-IR is 0.45, confirming excellent insulin sensitivity. The likely thalassaemia trait means his red blood cells may have a different lifespan, which can affect HbA1c readings. This should be rechecked in six months to confirm it remains stable.","low_causes":"Shortened red cell lifespan, haemoglobinopathy, recent blood loss","high_causes":"Sustained elevated blood sugar, insulin resistance, pre-diabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin Levels","group":"GLUCOSE & INSULIN","result":"2.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3155","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3064","upper_optimal_position":"0.5487","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is releasing to keep blood sugar controlled overnight. Insulin is the hormone that moves glucose from the bloodstream into cells. David's result of 2.2 mIU/L is just below the laboratory lower limit of 2.6 but within the optimal zone we look for, between 2 and 8. In a lean, very active man with a fasting glucose of 4.6, this reflects outstanding insulin sensitivity: the body needs very little insulin to keep glucose perfectly controlled. This is metabolically efficient and is a genuinely positive finding. It is not a sign of pancreatic failure.","low_causes":"High insulin sensitivity, very active lifestyle, low-carbohydrate diet, prolonged fasting","high_causes":"Insulin resistance, obesity, polycystic ovarian syndrome, high-carbohydrate diet, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.472","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2219","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a fragment released by the pancreas in equal amounts to insulin, making it a stable measure of insulin production. David's result of 0.472 ug/L, which converts to approximately 156 pmol/L, is below the lower limit of 1.1. This mirrors the low fasting insulin of 2.2 and tells the same story: the pancreas is producing very little insulin because very little is needed. With a normal fasting glucose of 4.6 and a HOMA-IR of 0.45 confirming excellent insulin sensitivity, this reflects efficient metabolic health rather than pancreatic dysfunction. The lab notes that C-Peptide can decrease in unseparated samples, but the consistency with the low insulin result supports this being a genuine finding.","low_causes":"High insulin sensitivity, low insulin demand, type 1 diabetes, prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, kidney impairment","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4857","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the approximate average blood sugar over the past two to three months. David's result of 6.8 mmol/L is within the normal range below 7 but above the ideal of 6.2. This mirrors his HbA1c sitting at the upper end of normal. As noted above, thalassaemia trait can affect HbA1c measurement and therefore this estimated average. His fasting glucose of 4.6 is reassuring.","low_causes":"Low carbohydrate intake, excellent insulin sensitivity, shortened red cell lifespan","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE cription":"Cystatin C is a protein produced at a constant rate by all cells in the body and freely filtered by the kidneys. Unlike creatinine, its level is not affected by muscle mass, diet or exercise, making it the gold standard for assessing kidney function in active individuals. David's result of 0.86 mg/L is within the ideal range and confirms his kidneys are working well.","low_causes":"Hyperthyroidism, steroid use","high_causes":"Reduced kidney function, hypothyroidism, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"108","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C to estimate kidney filtration, providing the most accurate single measure of kidney function. David's result of 108 mL/min/1.73m2 is well above the optimal threshold of 90, confirming excellent kidney health at 37.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Hyperfiltration, early diabetes","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"112","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7333","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea-to-creatinine ratio helps distinguish between pre-renal causes (such as dehydration or high protein intake) and intrinsic kidney disease. David cription":"Calculated Serum Osmolality is calculated from your measured results. It sits outside the ideal range. It is being driven by Urea, which sits outside the ideal range.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"517","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5448","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5227","upper_optimal_position":"0.6188","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production and DNA synthesis. It is found almost exclusively in animal products. David's result of 517 pg/ml is within the optimal range of 500 to 900, though sitting at the lower edge. On a high-carb, low-fat diet, B12 intake may be lower if animal protein sources are limited. Given the high folate of 23, maintaining adequate B12 is particularly important, as high folate can mask early B12 deficiency by keeping the blood count normal while neurological damage progresses silently.","low_causes":"Vegan or vegetarian diet, malabsorption, pernicious anaemia, metformin use","high_causes":"Supplementation, liver disease, kidney disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7381","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate, also known as vitamin B9, is essential for DNA synthesis, cell division and red blood cell production. It is abundant in leafy greens, legumes, fortified cereals and supplements. David's result of 23 ng/ml is above the upper limit of 17, most likely from a combination of a diet high in folate-rich foods and possibly fortified food sources. Elevated folate itself is not harmful, but it is important in the context of a B12 at 517, which is at the lower edge of optimal. High folate can correct the blood changes of B12 deficiency while allowing neurological damage to continue undetected. David should ensure his B12 remains above 500 and consider a sublingual methylcobalamin supplement if he reduces animal protein intake.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, pregnancy, alcohol, medication effects","high_causes":"Supplementation, high intake of fortified foods, leafy green-rich diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"HS-CRP","group":"INFLAMMATION","result":"0.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0600","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein is a marker of systemic inflammation produced by the liver. It is used both to detect infection and to assess cardiovascular risk: levels below 1.0 mg/L are associated with low cardiovascular risk, while levels above 3.0 suggest higher risk. David's result of 0.6 mg/L is within the ideal range below 1.0, confirming very low systemic inflammation. This is an impressive finding in a man training at very high intensity, and it confirms that his joint stiffness is not driven by an inflammatory process.","low_causes":"Generally a positive finding","high_causes":"Infection, chronic inflammation, obesity, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3962","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol fractions in the blood: LDL, HDL and VLDL. David's result of 4.1 mmol/L is within the ideal range below 5.0, reflecting a healthy overall cholesterol level.","low_causes":"Hyperthyroidism, malnutrition, liver disease, chronic illness","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, kidney disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3118","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are the form in which the body stores fat from food. After a meal, excess calories are converted to triglycerides and stored in fat cells. Fasting triglycerides reflect baseline fat metabolism. David's result of 1.06 mmol/L is within the normal fasting range below 1.7 but just above the ideal threshold of 1.0. On a high-carb diet, triglycerides tend to sit slightly higher than on a lower-carb pattern because excess carbohydrate is converted to triglycerides by the liver. This is not a concern at this level but explains why it is not quite at the optimal floor.","low_causes":"Low-carb diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate intake, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3077","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"Very low-density lipoprotein cholesterol is the primary carrier of triglycerides in the bloodstream. David's result of 0.48 mmol/L is within the ideal range, confirming healthy triglyceride metabolism.","low_causes":"Low-fat diet, malnutrition","high_causes":"High carbohydrate intake, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7212","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL cholesterol is the protective fraction that removes excess cholesterol from artery walls and transports it back to the liver for disposal. Higher levels are better. David's result of 1.5 mmol/L is above the risk threshold of 1.04 and a strong result for a man, though just below the ideal level of 1.55 or above. His high activity level is likely supporting this value. Regular exercise is one of the strongest drivers of HDL.","low_causes":"Sedentary lifestyle, obesity, smoking, poor diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetic factors, omega-3 intake","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.15","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3583","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5333","units":"mmol/L","description":"LDL cholesterol carries cholesterol from the liver to the tissues and, in excess, deposits it in artery walls, forming the basis of atherosclerosis. David's result of 2.15 mmol/L is within the laboratory range of 0.5 to 3.0 but just above the ideal threshold of below 2.0. His ApoB at 0.79, which is a more precise measure of the number of LDL particles, is within the ideal range below 0.8. This slight discrepancy is normal and means the particle number, which is what drives risk, is well controlled. No action is needed.","low_causes":"Hyperthyroidism, malnutrition, chronic illness","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3033","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple cardiovascular risk marker. A lower ratio indicates a better balance of protective HDL relative to total cholesterol. David's result of 2.73 is well within the ideal range below 3.5 and the risk threshold of 4.5, confirming an excellent balance.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"36.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"20","upper_normal":"","lower_optimal":"28","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7","upper_optimal_position":"1","units":"%","description":"HDL percentage shows what proportion of total cholesterol is the protective HDL fraction. A higher percentage is better. David's result of 36.59% is well above the minimum of 20%, meaning over a third of his total cholesterol is the protective type. This is an excellent ratio.","low_causes":"Low HDL, high total cholesterol","high_causes":"High HDL, regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3250","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol fractions in a single number. David's result of 2.6 mmol/L is within the ideal range below 3.0, confirming low overall atherogenic cholesterol burden.","low_causes":"Low total cholesterol, high HDL","high_causes":"High LDL, high triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6708","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein of HDL particles. Higher levels reflect more protective HDL particles in circulation. David's result of 1.61 g/L is above both the reference threshold of 1.2 and the ideal of 1.4, confirming a strong protective lipid profile.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4389","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the single protein on every LDL, VLDL and Lp(a) particle, making it the best single measure of the total number of cholesterol-carrying particles in the bloodstream. Each particle carries one ApoB molecule, so the ApoB level directly counts them. David's result of 0.79 g/L is below both the desirable threshold of 0.9 and the ideal of 0.8. This is the most important number in the lipid panel, and it confirms that David's cardiovascular risk from cholesterol-carrying particles is low.","low_causes":"Hyperthyroidism, malnutrition, statin therapy","high_causes":"Insulin resistance, high saturated fat intake, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.491","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3507","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful cholesterol-carrying particles to the number of protective HDL particles. A lower ratio indicates better cardiovascular protection. David's result of 0.491 is well below the lower risk threshold of 0.7 and within the ideal range, confirming an excellent balance of harmful and protective particles.","low_causes":"High HDL, low LDL, healthy lifestyle","high_causes":"High LDL, low HDL, metabolic syndrome, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically determined lipoprotein particle that independently drives cardiovascular risk. Unlike LDL, it cannot be changed by diet, exercise or most medications. It only needs to be measured once in a lifetime because it does not change. David's result of below 25 nmol/L is within the ideal range below 32, which is genuinely useful information. It means that his entire cardiovascular risk profile is driven by modifiable factors like diet, exercise and body composition, and nothing inherited is working against him. This result should be recorded permanently.","low_causes":"Genetic (favourable variant)","high_causes":"Genetic (inherited), cannot be modified by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"356","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7095","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme found primarily in skeletal muscle, cardiac muscle and the brain. It is released into the bloodstream when muscle tissue is damaged, which occurs naturally during intense exercise. David's result of 356 U/L is above the upper limit of 320, which is expected given his very high-intensity training with five cardio and three resistance sessions per week. In the absence of chest pain, rhabdomyolysis symptoms (dark urine, severe muscle pain) or cardiac concerns, an elevated CK in this range is a normal consequence of heavy training. It also explains the mildly elevated AST, as AST is released alongside CK from damaged muscle fibres.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, myocarditis, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"18.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5536","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3899","upper_optimal_position":"0.5595","units":"pmol/L","description":"Free T4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. It is converted into the more active T3 in tissues throughout the body. David's result of 18.9 pmol/L is within the ideal range of 14 to 20, confirming strong thyroid output.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4492","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4881","units":"mIU/L","description":"Thyroid stimulating hormone is produced by the pituitary gland in the brain to control how much thyroid hormone the thyroid makes. A higher TSH means the brain is asking for more hormone, often a sign the thyroid is struggling. A lower TSH means the brain is satisfied with current levels. David's result of 2.02 mIU/L is within the ideal range of 1.0 to 2.5, confirming that the brain and thyroid are communicating well and thyroid output is appropriate.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary suppression","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5926","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 is the most active thyroid hormone, converted from T4 in tissues including the liver, kidneys and muscles. It drives metabolism, energy production and heat generation. David's result of 6.1 pmol/L is within the ideal range of 4.5 to 6.5, confirming efficient conversion of T4 to T3 and active thyroid metabolism. This is relevant to his energy levels: the thyroid is not the reason for his fatigue.","low_causes":"Hypothyroidism, low energy availability, chronic illness, selenium deficiency","high_causes":"Hyperthyroidism, excess thyroid medication, T3 supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"<6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, a condition called Hashimoto's thyroiditis. David's result of below 6.6 U/ml is well within the negative range below 13.8, confirming no autoimmune thyroid activity. This rules out Hashimoto's as a cause of his symptoms.","low_causes":"Normal finding, no autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid disease. David's result of below 1.3 U/ml is undetectable, which is the case for over 80% of the population. Combined with the negative TPO antibodies, autoimmune thyroid disease is confidently excluded.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, thyroid cancer monitoring, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.323","within_normal":"TRUE","within_optimal":"TRUE // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}
