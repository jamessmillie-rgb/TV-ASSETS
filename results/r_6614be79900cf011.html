<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Johann Marais","dob":"15/07/1993","report_date":"2026-10-08","summary":"Johann is a 33-year-old male presenting with a BMI of 25, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are small, or he often skips meals (volume 2 out of 10). He trains three times per week (two cardio, one resistance) at an easy intensity with 7,500 to 10,000 daily steps. He sleeps 7 to 8 hours but is slow to get going on waking, with steady energy through the day. Stress rarely feels hard to manage. He drinks 1 to 4 alcoholic drinks per week, smokes tobacco, and uses cannabis. He reports hair thinning and hair loss that has persisted for over a year. His family history includes thyroid disease and bowel, breast, prostate or ovarian cancer. He has not had a previous blood test. His goals are to lose body fat, improve long-term health and longevity, and build muscle.\n\nThe finding in this report that needs the most attention is Johann's lipid profile, which is significantly elevated across every atherogenic marker. His ApoB is 1.82 g/L, more than double the 0.9 threshold, and his LDL cholesterol is 5.75 mmol/L against a target of under 3. ApoB, or apolipoprotein B, is the protein that sits on the surface of every LDL particle, and it is the single best measure of how many cholesterol-carrying particles are circulating in the blood and therefore how much cholesterol is being deposited into artery walls. At 1.82, this is a level that, sustained over years, significantly accelerates the development of atherosclerosis, the build-up of plaque inside arteries that eventually causes heart attacks and strokes. His total cholesterol is 7.7 mmol/L, his non-HDL cholesterol is 6.4 (target under 4), and his TC to HDL ratio is 5.92 (target under 4.5). His HDL cholesterol, the protective form that carries cholesterol away from artery walls and back to the liver, is 1.3 mmol/L, which is within the laboratory range but below the optimal level of 1.4 for a man. His ApoB to ApoA-I ratio, which summarises the balance between atherogenic and protective particles, is 1.26, well above the 0.7 threshold and firmly in the higher-risk category. His Castelli II ratio (LDL divided by HDL) is 4.42 against a target of under 3.5. His triglycerides at 1.54 mmol/L are within the laboratory range but above the optimal target of under 1.0. His Lp(a)-corrected LDL, which strips out the cholesterol carried by lipoprotein(a) to show how much is truly modifiable by diet and medication, is 5.67, confirming that virtually all of his LDL elevation is driven by modifiable factors. His Lp(a) itself is below 25 nmol/L, which is normal and inherited, and this is genuinely useful information because it means the entire lipid picture is driven by factors that can be changed: diet, body composition, exercise, and if needed, medication. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 90 out of 100, which is very high. At 33, his ten-year absolute risk of a cardiovascular event remains low simply because of his age, but the gap between that low ten-year risk and this very high score is the window he has to act before cumulative damage narrows it. The inputs driving the score are his ApoB and LDL, with contributions from his hsCRP and below-optimal HDL. This lipid profile needs to go to his GP, not as an emergency, but as a priority conversation about whether dietary intervention alone will be enough or whether early statin therapy should be considered. At 33 with an ApoB of 1.82 and no obvious dietary driver (he is not eating large amounts of saturated fat based on the quiz), the possibility of familial hypercholesterolaemia, an inherited condition where the liver clears LDL particles more slowly than normal, should be explored. His GP can arrange a DLCN (Dutch Lipid Clinic Network) score or refer for genetic testing.\n\nHis hsCRP, or high-sensitivity C-reactive protein, a marker of systemic inflammation, is 3 mg/L. While this is within the laboratory range of under 5, it is above the optimal threshold of under 1 and sits in a range that is associated with increased cardiovascular risk. CRP at this level in a 33-year-old with no infection, no obesity and no autoimmune condition is worth investigating. Smoking is a well-established driver of chronic low-grade inflammation, and cannabis use can also contribute. The combination of elevated CRP alongside the lipid profile amplifies the cardiovascular concern, because inflammation accelerates the process by which cholesterol-laden plaques become unstable. Reducing or stopping smoking would be expected to lower this number.\n\nHis thyroid panel shows a TSH (thyroid stimulating hormone, the signal from the pituitary gland that tells the thyroid how hard to work) of 1.24, which is ideal. His FT4 (free thyroxine, the storage form of thyroid hormone) is 20 pmol/L, in the upper part of the optimal range. His FT3 (free triiodothyronine, the active form that cells actually use) is 6.3 pmol/L, which is excellent and sits in the upper part of the optimal band. His FT3 to FT4 ratio is 0.315, confirming efficient conversion from storage to active hormone. However, his thyroid peroxidase antibodies (TPO antibodies) are 84.1 U/mL, significantly above the upper limit of 13.8. TPO antibodies are immune proteins that target an enzyme the thyroid needs to produce its hormones. Their presence at this level, with a negative thyroglobulin antibody, is the hallmark of the early stages of a pattern associated with Hashimoto's thyroiditis, an autoimmune condition in which the immune system gradually damages the thyroid gland. Right now, Johann's thyroid is working perfectly: TSH is ideal, FT3 and FT4 are excellent, and there is no sign of the thyroid struggling. The antibodies mean that the immune process is present but has not yet affected function. This is important information for his GP, given his family history of thyroid disease, because it means his thyroid function should be monitored annually with TSH and FT4. In some people the antibodies remain elevated for years without the thyroid ever failing; in others, function gradually declines. Knowing this now gives Johann the advantage of early detection. Hair thinning is a recognised feature of thyroid autoimmunity, even when thyroid function tests remain normal, because the antibodies themselves may affect hair follicle cycling. This is one possible contributor to the hair loss he has noticed over the past year, though it is not the only one, and it is worth raising with his GP.\n\nHis testosterone is 28.6 nmol/L, right at the top of the reference range and in the optimal band for a man of 33. This is an excellent result. His SHBG (sex hormone binding globulin, the protein that binds testosterone and controls how much is free to act on tissues) is 55.7 nmol/L, which is within the laboratory range but toward the upper end. His free testosterone, the fraction not bound to proteins and therefore available to tissues, is 0.451 nmol/L, which is within the laboratory range. His bioavailable testosterone (the free fraction plus the loosely bound fraction) is 11.28 nmol/L, which is above the upper end of the reference range, meaning his tissues are receiving a strong androgenic signal. His free androgen index is 51.35, within range. His DHEA-S (dehydroepiandrosterone sulphate, an adrenal androgen precursor) is 4.2 umol/L, healthy for his age. His oestradiol is 152 pmol/L, marginally above the upper limit of 146.1. In men, oestradiol is produced by the conversion of testosterone to oestrogen by an enzyme called aromatase. A testosterone at the top of the range will naturally produce a slightly higher oestradiol, and at 152 this is only fractionally above the limit. It does not require treatment but is worth noting as context for the overall hormonal picture. His prolactin, LH and FSH are all within range. With regard to his hair loss, his androgenic profile is strong, and male pattern hair loss is driven by the sensitivity of hair follicles to dihydrotestosterone (DHT), a potent metabolite of testosterone. A high testosterone does not cause hair loss in every man, but in those with a genetic predisposition, it accelerates the process. This is a conversation for his GP, and if he has not already discussed it, a referral to a dermatologist with an interest in hair loss would be appropriate.\n\nHis liver enzymes show ALT at 69 IU/L (upper limit 56) and AST at 47 IU/L (upper limit 45), both mildly elevated. ALT (alanine aminotransferase) is an enzyme concentrated in liver cells, and its presence in the blood above the normal level indicates some degree of liver cell turnover or strain. AST (aspartate aminotransferase) is found in both liver and muscle cells. His GGT (gamma-glutamyl transferase) at 27 is well within range and below the optimal threshold of 25, which is reassuring because GGT is the enzyme most sensitive to alcohol and metabolic strain, and its being clean at 27 suggests this is not an alcohol-driven picture. His FIB-4 score (a calculated index that estimates liver scarring using age, platelets, AST and ALT) is 0.99, comfortably below 1.3, ruling out significant fibrosis. His APRI score is 0.622, above the optimal threshold of 0.5 but below 1.5, consistent with no significant scarring. His De Ritis ratio (AST divided by ALT) is 0.68, just at the lower limit of the reference range, which in the context of elevated transaminases suggests the source is predominantly the liver rather than muscle. His NAFLD fibrosis score is minus 2.923, firmly in the low-risk zone. In a 33-year-old man who smokes tobacco and uses cannabis, the most likely explanations for mildly elevated ALT and AST are metabolic strain from the combination of smoking and cannabis (cannabis can cause mild transaminase elevation through direct hepatic metabolism), the sugary food consumed some days, and possibly the early metabolic load reflected in the lipid profile. His bilirubin at 16, alkaline phosphatase at 62, albumin at 46 and total protein at 75 are all healthy, confirming the liver is synthesising and excreting normally. The enzymes should be rechecked in three months after lifestyle changes.\n\nHis IgE is 408 IU/mL, more than four times the upper limit of 100. IgE (immunoglobulin E) is the antibody class associated with allergic responses. This level suggests Johann has a significant allergic sensitisation, whether to environmental allergens (dust mites, pollen, animal dander, mould) or potentially to something in his diet. It does not tell us what the allergen is, only that the immune system is producing a strong allergic response to something. Smoking and cannabis use can both irritate the airways and amplify IgE production. This result warrants a conversation with his GP about whether skin prick testing or specific IgE panels would be helpful in identifying the trigger, particularly if he has any nasal congestion, skin irritation or respiratory symptoms he may not have reported.\n\nHis fasting glucose at 4.6 mmol/L is excellent, sitting in the optimal band. His HbA1c (glycated haemoglobin, a measure of average blood sugar over the preceding two to three months) is 39 mmol/mol, which is within the normal range of under 42 but above the optimal threshold of under 36. This is not pre-diabetes, but it is drifting in that direction and, at 33, is worth noting as a marker to track. His fasting insulin at 5.44 mIU/L is within the optimal band of 2 to 8, meaning his pancreas is not working hard to control blood sugar. His HOMA-IR (a calculation that estimates insulin resistance using fasting glucose and insulin) is 1.11, within the ideal range, confirming he is insulin-sensitive. His C-Peptide is 0.777 ug/L (approximately 257 pmol/L), which is below the laboratory range of 1.1 to 4.4 ug/L. C-Peptide is released by the pancreas in equal amounts to insulin, and in the context of a normal fasting glucose, a normal HbA1c and a low-normal insulin, this low C-Peptide simply reflects low insulin demand rather than pancreatic failure. His estimated average glucose is 6.5 mmol/L, within range but above the optimal of 6.2, consistent with the HbA1c sitting above the tightest threshold. His TyG index is 8.64, within range.\n\nHis kidney function shows a creatinine-based eGFR of over 90, but his Cystatin C, a small protein filtered by the kidneys that is less affected by muscle mass than creatinine, is 1.18 mg/L against an upper limit of 1.1. Cystatin C provides a more accurate picture of kidney filtration than creatinine alone, and at 1.18 it gives a Cystatin C-based eGFR of 82, and a combined creatinine plus Cystatin C eGFR of 82 mL/min/1.73m2, which is below the optimal threshold of 90. At 33, an eGFR of 82 is lower than expected. It is not in the range that defines chronic kidney disease (that threshold is below 60), and it may represent normal variation, but it is a result the GP should be aware of so that it can be rechecked in six to twelve months to confirm it is stable. Smoking is a known contributor to reduced kidney filtration over time, and this is another reason to address tobacco use. His urea, sodium, chloride, bicarbonate and uric acid are all within range. His uric acid at 487 umol/L is within the laboratory range but above the optimal band of 200 to 380 for a man, which is consistent with the metabolic picture and the lipid profile. His serum osmolality is 294 mOsm/kg, at the upper end of the range, suggesting he could benefit from better hydration.\n\nHis red blood cell count is 5.71, marginally above the upper limit of 5.5. His haemoglobin at 167 g/L is within range but near the top, and his haematocrit at 0.487 is within range. Smoking is the most common cause of a mildly elevated red cell count in a young man, because the carbon monoxide in tobacco smoke binds to haemoglobin, reducing its oxygen-carrying capacity, and the body compensates by producing more red cells. This is a physiological response, not a disease, but it does increase blood viscosity over time. His reticulocyte percentage is 0.76%, within range, but his absolute reticulocyte count is 43.4, below the lower limit of 50, suggesting the bone marrow is not producing red cells at a particularly high rate, which fits with the polycythaemia being a chronic compensatory response to smoking rather than an acute production problem. His iron studies are healthy: ferritin at 184 is in the optimal band for a man, transferrin saturation at 41.2% is within the optimal band, serum iron at 26.8 is healthy, and transferrin and iron binding capacity are both normal. His white cell count, differential, platelets, MCV, MCH, RDW, MPV and ESR are all within range.\n\nHis vitamin D at 71 nmol/L is sufficient but below the optimal band of 75 to 120 and would benefit from supplementation. His B12 at 427 pg/mL is within the laboratory range but below the optimal threshold of 500. His folate at 12 ng/mL is healthy. His calcium, corrected calcium, magnesium and phosphate are all within range, with magnesium at 1.0 sitting nicely in the optimal band. His PTH (parathyroid hormone, which regulates calcium and phosphate balance) is 3.4 pmol/L, within range. His total antioxidant activity at 2.3 is above the laboratory range, which can be driven by dietary antioxidants, supplements or even compounds in cannabis and is not a concern.\n\nHis cortisol at 337 nmol/L is within the morning reference range. His amylase and lipase are both within range, confirming normal pancreatic function. His immunoglobulins IgG, IgM and IgA are all within range, and his coeliac screen (tissue transglutaminase IgA) is negative. His rheumatoid factor is negative. His PSA at 0.82 is well within range for his age, and his free PSA ratio at 0.585 is reassuringly high. His tumour markers Ca19-9 and CEA are both within normal limits. His creatine kinase at 127 is within range. His urinalysis shows no protein, glucose, blood, white cells, nitrites or casts, which is reassuringly clean. Urine culture results are pending.\n\nHis PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 29.8 years against a calendar age of 33, meaning he is ageing 3.2 years slower than average. The main marker pulling his PhenoAge up from an even better number is his CRP at 3, and addressing the smoking and inflammation would push this further in the right direction.\n\nHis PLR (platelet to lymphocyte ratio) at 66.8 is marginally below the reference range of 60 to 210 but still within the lower boundary area and not clinically significant. His systemic immune-inflammation index at 228 is within range. His MCHC at 344 is one point below the upper limit and is unremarkable. His phosphate at 0.8 is at the lower boundary of the reference range, which at this margin is laboratory variation and does not require action.","links":"The dominant story in Johann's blood is a lipid profile that is significantly and uniformly elevated, with an ApoB of 1.82 and an LDL of 5.75, both far above target. His Lp(a) is normal, which means the entire elevation is modifiable, but the degree of elevation at 33 with a BMI of only 25, light training, modest alcohol intake and no obvious high-saturated-fat diet raises the possibility of familial hypercholesterolaemia, an inherited condition affecting roughly 1 in 250 people where the LDL receptor on liver cells works less efficiently, causing LDL to accumulate. This is the single most important finding in the report and the one that needs a GP conversation first.\n\nThe second thread is inflammation. His hsCRP at 3 mg/L is above optimal in a man with no infection, no obesity and no autoimmune disease. Smoking is the most likely driver. Chronic low-grade inflammation and elevated LDL are a damaging combination because inflamed artery walls are more permeable to LDL particles, and inflamed plaques are more likely to rupture. His IgE at 408 tells a related but separate story: his immune system is mounting a strong allergic response to something, and smoking and cannabis use both amplify airway and systemic IgE. Whether the allergen is environmental or dietary, identifying and reducing exposure would lower the immune burden.\n\nThe third thread connects his thyroid antibodies, his hair loss and his family history. TPO antibodies at 84.1 with perfect thyroid function and a family history of thyroid disease is the early signature of autoimmune thyroid activity. His thyroid does not need treatment now, but it needs watching. His hair loss may be partly driven by the antibodies and partly by his strong androgenic profile (testosterone at the top of the range and bioavailable testosterone above the upper reference). These two mechanisms can overlap, and a dermatologist would be able to distinguish the contribution of each.\n\nThe liver enzymes at ALT 69 and AST 47 with a clean GGT and normal fibrosis scores are a fourth, quieter thread. Smoking and cannabis metabolism, combined with the sugary food and the metabolic load suggested by the lipid profile, are the most plausible explanations. No scarring. No synthetic failure. But the liver is showing some strain, and rechecking after three months of lifestyle change will confirm whether the numbers normalise.\n\nFinally, the Cystatin C at 1.18 giving an eGFR of 82 at 33 is a loose end. It is not disease, but it is below where it should be, and smoking is a known contributor to early renal filtration decline. It deserves a recheck to confirm stability, and it is another reason to address the tobacco.\n\nThe reassuring exclusions are extensive: no diabetes, no insulin resistance, no anaemia, no thyroid failure, no coeliac disease, no autoimmune inflammation, no prostate concern, no urinary abnormality, clean tumour markers, and a PhenoAge 3.2 years younger than his calendar age.","lifestyle":"Stop or reduce smoking. This is the single biggest lever in the report. Smoking is driving the CRP, contributing to the elevated red cell count, accelerating the damage being done by the lipid profile, and may be affecting the Cystatin C. Even halving the number of cigarettes per day while working toward stopping completely will begin to lower the CRP within weeks. Anchor: set a quit date with GP support (nicotine replacement, varenicline or a referral to a stop-smoking service). Why: CRP at 3, red cell count at 5.71, and Cystatin C at 1.18 are all connected to tobacco.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, leftover chicken. Anchor: protein goes on the plate before anything else. Why: at a diet volume of 2 out of 10 with a goal of building muscle, Johann is almost certainly not eating enough protein. Target: 105 to 130 grams per day (1.3 to 1.6 g/kg at 81 kg for his activity level and muscle-building goal).\nIncrease vegetable and fruit portions from 2 to 3 per day to at least 5. Add one portion to lunch and one to dinner this week, then a third the following week. Anchor: every meal has at least one portion of colour on the plate. Why: soluble fibre from vegetables, oats, beans and lentils directly lowers LDL cholesterol by binding bile acids in the gut, and increasing fibre is the first dietary intervention for the lipid profile.\nReplace sugary snacks with nuts, seeds, or dark chocolate (85%+). Anchor: swap, do not add. Keep a bag of mixed nuts at the desk or in the bag. Why: the sugar on some days contributes to the triglycerides at 1.54 and the HbA1c drift toward 39, and nuts actively lower LDL cholesterol.\nEat oily fish (salmon, mackerel, sardines) twice a week. Anchor: pick two fixed days. Why: omega-3 fatty acids lower triglycerides, reduce inflammation (CRP), and improve HDL function, hitting three abnormals with one habit.\nIncrease resistance training from one session to two or three per week, and raise the intensity from easy to moderate. Anchor: add one session this week, a second in two weeks. Why: resistance training raises HDL, improves insulin sensitivity, lowers triglycerides, builds the muscle Johann wants, and is the most effective exercise modality for long-term metabolic health. With 7,500 to 10,000 steps already, the aerobic base is reasonable, but the resistance work is the missing piece.\nReduce or stop cannabis use. Anchor: begin by not using on training days. Why: cannabis contributes to liver enzyme elevation and may amplify IgE. Reducing use gives the liver a cleaner run and may help the ALT and AST normalise.\nCalorie target: approximately 2,200 to 2,400 kcal per day to support a modest fat loss of 0.25 to 0.5 kg per week while preserving and building muscle (maintenance is roughly 2,500 to 2,600 kcal at his activity level; a 200 to 400 kcal deficit is appropriate given his BMI of 25 and his goal of losing body fat). Protein floor: 105 to 130 g per day. Target weight range: 75 to 78 kg, reassessed at retest.","flags":"ApoB 1.82 g/L (target under 0.9), LDL 5.75 mmol/L (target under 3), total cholesterol 7.7, non-HDL 6.4 (target under 4), TC/HDL ratio 5.92 (target under 4.5), ApoB/A-I ratio 1.26 (target under 0.7), Castelli II 4.42 (target under 3.5), Lp(a)-corrected LDL 5.67 (target under 3), Cardiovascular Risk Score 90/100. Severely and uniformly elevated atherogenic lipid profile. Lp(a) normal, confirming the elevation is entirely modifiable. The degree of elevation at 33 with a BMI of 25 raises the possibility of familial hypercholesterolaemia. GP referral recommended for DLCN scoring or genetic testing and discussion of statin therapy.\nTPO antibodies 84.1 U/mL (upper limit 13.8) with thyroglobulin antibody negative, TSH 1.24 (ideal), FT4 20 and FT3 6.3 (both optimal). Autoimmune thyroid activity with preserved function, consistent with the early phase of Hashimoto's thyroiditis. Family history of thyroid disease. Recommend annual thyroid monitoring (TSH, FT4).\nhsCRP 3 mg/L (optimal under 1). Elevated systemic inflammation in the absence of infection or obesity. Smoking is the most likely driver. Amplifies cardiovascular risk in the context of the lipid profile.\nIgE 408 IU/mL (upper limit 100). Significant allergic sensitisation. Source unidentified. Consider skin prick testing or specific IgE panel. Smoking and cannabis may be amplifying the response.\nALT 69 IU/L (upper limit 56), AST 47 IU/L (upper limit 45), GGT 27 (within range), FIB-4 0.99, APRI 0.622, NAFLD fibrosis score minus 2.923. Mild transaminase elevation with no fibrosis. Likely metabolic and related to smoking, cannabis and dietary factors. Recheck in three months.\nCystatin C 1.18 mg/L (upper limit 1.1), Cystatin C eGFR 82, combined eGFR 82 (optimal above 90). Below-expected renal filtration at 33. Smoking is a known contributor. Recheck in six to twelve months to confirm stability.\nRed blood cell count 5.71 (upper limit 5.5), haemoglobin 167 (within range), haematocrit 0.487 (within range). Mild polycythaemia consistent with smoking-related compensatory erythropoiesis. Absolute reticulocytes 43.4 (lower limit 50), consistent with chronic rather than acute production.\nOestradiol 152 pmol/L (upper limit 146.1). Marginally above range, consistent with testosterone at the top of the reference range driving aromatase conversion. No action required.\nC-Peptide 0.777 ug/L (lower limit 1.1). Below range but in the context of normal glucose, normal HbA1c and low-normal insulin, this reflects low insulin demand, not pancreatic insufficiency.\nReassuring negatives: fasting glucose 4.6 and HbA1c 39 (no diabetes), HOMA-IR 1.11 (insulin-sensitive), thyroid function intact (TSH 1.24, FT4 20, FT3 6.3), coeliac screen negative, PSA 0.82 with free ratio 0.585, Ca19-9 and CEA normal, liver synthesis intact (albumin 46, bilirubin 16), iron stores optimal (ferritin 184, transferrin saturation 41.2%), B12 427, folate 12, calcium and magnesium normal, urinalysis clean, PhenoAge 29.8 (3.2 years younger than calendar age).","recommendations":"Discuss the lipid profile with your GP as a priority. Bring these numbers: ApoB 1.82, LDL 5.75, total cholesterol 7.7, non-HDL 6.4. Ask about familial hypercholesterolaemia screening (DLCN score or HFE genetic testing) and whether early statin therapy is appropriate given the degree of elevation at 33.\nAsk your GP about the TPO antibodies at 84.1 and your family history of thyroid disease. Request annual thyroid monitoring with TSH and FT4. Mention the hair thinning as a possible related symptom.\nDiscuss the IgE at 408 with your GP. Ask whether skin prick testing or a specific IgE panel would be helpful in identifying the allergen driving this response.\nAsk for smoking cessation support: nicotine replacement therapy, varenicline, or a referral to a stop-smoking service. The smoking is contributing to the CRP at 3, the red cell count at 5.71, and possibly the Cystatin C at 1.18.\nRequest a recheck of Cystatin C and eGFR in six to twelve months to confirm the eGFR of 82 is stable.\nRequest a recheck of ALT and AST in three months after dietary changes and reduction in cannabis use.\nIf hair loss is a priority, ask your GP for a referral to a dermatologist with an interest in androgenetic alopecia. Mention the TPO antibodies and the testosterone at 28.6.\nRetest the full panel in six months (target April 2027). Key markers to repeat: ApoB, LDL, total cholesterol, HDL, triglycerides, hsCRP, ALT, AST, GGT, Cystatin C, TPO antibodies, TSH, FT4, HbA1c, IgE. Calorie target: 2,200 to 2,400 kcal per day. Protein target: 105 to 130 g per day. Weight target: 75 to 78 kg.","supplementation":"Vitamin D3 (cholecalciferol), 3,000 IU daily, taken with a meal containing fat. Why: vitamin D at 71 nmol/L is sufficient but below the optimal band of 75 to 120. At 3,000 IU daily, expect to reach 90 to 100 nmol/L within three months.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs calcium into bones and away from artery walls, which is especially relevant given the cardiovascular findings in this report.\nOmega-3 fish oil, 2 to 3 g of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides (currently 1.54, target under 1.0), reduces inflammation (CRP 3), and supports HDL function. Choose a high-EPA formulation.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. Why: B12 at 427 pg/mL is within the laboratory range but below the optimal threshold of 500. Sublingual methylcobalamin bypasses any absorption issues.\nMagnesium glycinate, 300 mg before bed. Why: magnesium at 1.0 is within the optimal band, but glycinate supports sleep quality (he is slow to get going on waking) and muscle recovery for his training goal.\nThe most important changes from this report are not supplements. They are stopping smoking, increasing dietary fibre and protein, reducing sugar, eating oily fish twice a week, increasing resistance training, and having the GP conversation about the lipid profile.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"53","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4818","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 53 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 52.8. Weakest systems: lipids & cardiovascular 18%, immunology 19%, inflammation 31%. Biggest drags: LDL Cholesterol, Apolipoprotein B, hs-CRP, ALT (GPT).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"29.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3921","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a biological ageing estimate calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Johann's PhenoAge is 29.8 years against a calendar age of 33, meaning he is ageing approximately 3.2 years slower than the population average. The main marker pulling his PhenoAge up from an even better number is his CRP at 3. Addressing the smoking and reducing inflammation would push this further in the right direction.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, so it measures the ell formation. Johann's result of 12 ng/mL is within the optimal range, confirming adequate folate intake from his diet.","low_causes":"Poor diet, malabsorption, coeliac disease, alcohol, medications","high_causes":"Supplementation, B12 deficiency masking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3000","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity C-reactive protein (hs-CRP) is a marker of systemic inflammation produced by the liver in response to inflammatory signals from the body. Johann's result of 3 mg/L is within the laboratory range of under 5 but significantly above the optimal threshold of under 1. In a 33-year-old with no infection, no obesity and no autoimmune condition, a CRP of 3 suggests chronic low-grade inflammation. Smoking is the most likely driver, and this level places him in a higher cardiovascular risk category, especially alongside the elevated lipid profile. Stopping smoking would be expected to bring this below 1.","low_causes":"Normal health, anti-inflammatory medications","high_causes":"Smoking, infection, inflammation, obesity, cardiovascular risk, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.7","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7432","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol measures all the cholesterol in the blood, including VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. Johann's result of 0.7 mmol/L is within the laboratory range but above the optimal level of under 0.6, consistent with the mildly elevated triglycerides.","low_causes":"Low fat diet, malnutrition","high_causes":"High carbohydrate diet, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4194","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/L","description":"HDL (high-density lipoprotein) is the protective form of cholesterol that removes cholesterol from artery walls and carries it back to the liver for disposal. Johann's result of 1.3 mmol/L is above the minimum threshold but below the optimal level of 1.4 for a man. Increasing exercise (particularly resistance training), eating oily fish and nuts, and stopping smoking are the most effective ways to raise HDL.","low_causes":"Smoking, sedentary lifestyle, poor diet, obesity, insulin resistance","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7667","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL (low-density lipoprotein) carries cholesterol into artery walls, where it can accumulate and form plaque. Johann's result of 5.75 mmol/L is nearly the desirable minimum of 20%, reflecting the imbalance between his very high total cholesterol and his below-optimal HDL. This will improve as the total cholesterol comes down and HDL rises.","low_causes":"High LDL, low HDL, metabolic syndrome","high_causes":"Excellent lipid profile, regular exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"6.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8000","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.2","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4000","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the atherogenic (artery-damaging) cholesterol fractions in one number. Johann's result of 6.4 mmol/L is well above the target of under 4, confirming the severity of his atherogenic burden.","low_causes":"Excellent lipid profile, low saturated fat diet","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, insulin resistance, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6042","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles and drives their protective function. Johann's result of 1.45 g/L is above both the reference minimum and the optimal threshold of 1.4, confirming that his HDL particles are structurally sound. The problem is not HDL quality but the overwhelming volume of atherogenic particles opposing it.","low_causes":"Smoking, sedentary lifestyle, poor diet, metabolic syndrome","high_causes":"Exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the protein on the surface of every LDL, VLDL and Lp(a) particle. One ApoB molecule sits on each particle, so the ApoB level directly counts the number of atherogenic particles in the blood. Johann's result of 1.82 g/L is more than double the desirable threshold of 0.9 and is classified as 'very high' by laboratory criteria. This is the single best predictor of cardiovascular risk in the panel, and at this level it confirms a very high atherogenic particle count that needs intervention. The normal Lp(a) means the entire elevation is driven by modifiable LDL particles.","low_causes":"Excellent lipid profile, statin therapy, low saturated fat diet","high_causes":"Familial hypercholesterolaemia, high saturated fat diet, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic particles (those that deposit cholesterol in artery walls) and protective particles (those that remove it). Johann's result of 1.26 is well above the lower-risk threshold of 0.7 and places him firmly in the higher-risk category. This single number captures the seriousness of the lipid imbalance more concisely than any individual marker.","low_causes":"Excellent lipid balance, exercise, healthy diet","high_causes":"High LDL, low HDL, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is an inherited, genetically fixed lipoprotein that deposits cholesterol in artery walls, promotes clotting and drives inflammation. Johann's result of below 25 nmol/L is normal (under 32). This is genuinely useful information because it means his severely elevated LDL and ApoB are driven entirely by modifiable factors: diet, body composition, exercise and potentially genetics affecting the LDL receptor (familial hypercholesterolaemia), rather than by Lp(a). Lp(a) is a once-in-a-lifetime measurement that should be recorded permanently.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited, not modifiable by diet or exercise)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatine_kinase","name":"Creatine Kinase (CK)","group":"SPECIALIZED TESTS","result":"127","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4369","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found in muscle cells that is released into the blood when muscle fibres are damaged or working hard. Johann's result of 127 U/L is within the optimal range, confirming no significant muscle damage and supporting the interpretation that his elevated AST is liver-sourced rather than muscle-sourced.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statins","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5848","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4554","upper_optimal_position":"0.5848","units":"pmol/L","description":"Free T4 (thyroxine) is the storage form of thyroid hormone, produced by the thyroid gland and converted to the active form T3 in tissues. Johann's result of 20 pmol/L sits at the upper end of the optimal band of 14 to 20, confirming that the thyroid is producing an excellent amount of hormone. Despite the presence of TPO antibodies, thyroid output is not being affected.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excessive thyroid medication, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3829","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4399","upper_optimal_position":"0.4753","units":"mIU/L","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland and tells the thyroid how hard to work. A high TSH means the thyroid is underperforming and the pituitary is shouting louder. Johann's result of 1.24 mIU/L is in the optimal band of 1.0 to 2.5, confirming that his pituitary is satisfied with thyroid output. This is reassuring in the context of the positive TPO antibodies.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, iodine deficiency, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"6.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5778","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that cells use for energy, metabolism and temperature regulation. Johann's result of 6.3 pmol/L is in the upper part of the optimal band of 4.5 to 6.5, confirming excellent thyroid function at the tissue level.","low_causes":"Hypothyroidism, low energy intake, chronic illness, poor T4 to T3 conversion","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies (TPO)","group":"THYROID","result":"84.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"10","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3623","units":"U/mL","description":"Thyroid peroxidase (TPO) antibodies are immune proteins that target the thyroid enzyme needed to produce thyroid hormones. Johann's result of 84.1 U/mL is significantly above the upper limit of 13.8. The presence of TPO antibodies at this level, alongside a negative thyroglobulin antibody, is the serological hallmark of the pattern associated with Hashimoto's thyroiditis, an autoimmune condition in which the immune system gradually damages the thyroid gland. Importantly, Johann's thyroid function is currently excellent (TSH 1.24, FT4 20, FT3 6.3), so the immune process has not affected output. Given his family history of thyroid disease, this is not unexpected, and it means his thyroid should be monitored annually. Hair thinning can occur with thyroid autoimmunity even when function is preserved.","low_causes":"No autoimmune thyroid activity","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibody","name":"Thyroglobulin Antibody","group":"THYROID","result":"<1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target the protein from which thyroid hormones are made. Johann's result is below 1.3 U/mL, well within the normal range. Over 80% of the population have undetectable levels. The negative result, alongside the positive TPO antibodies, is consistent with a single-antibody autoimmune thyroid pattern.","low_causes":"No autoimmune thyroid activity (normal finding)","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.315","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
