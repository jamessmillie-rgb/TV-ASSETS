<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Lara Lockhart","dob":"27/05/2006","report_date":"2026-09-20","sample_date":"2026-09-02","panel":"Signature","lab":"Randox Health","summary":"Lara is a 20-year-old female presenting with a BMI of 28.1, following a high-carbohydrate, low-fat diet rated 3 out of 10 for quality with a volume of 4 out of 10. She does no structured cardio or resistance training and walks 2,000 to 5,000 steps a day. She takes sertraline, guanfacine, melatonin and the combined oral contraceptive pill. She reports joint pain and stiffness, mainly in her hands, bloating and digestive discomfort on a background of long-standing IBS, frequent infections, daytime fatigue, eczema and jawline acne, night sweats and hot flushes, recurrent thrush and urinary infections, and a weight gain of more than 20 kilograms over the past year. Her goals are to reduce stress and anxiety, improve digestion and gut health, and improve her energy. She has hypermobility, is neurodivergent, had a pelvic MRI that found no endometriosis, and believes she caught glandular fever when she started university last September.\n\nThere is no finding in this report that needs to go to her GP as an emergency, and it is worth saying that first, because the year she describes would make anyone wonder. Her thyroid is working well, with the active hormone Free T3 at a healthy 5.67 and both thyroid antibodies negative, so an underactive thyroid is not the cause of the weight gain or the tiredness. Her kidneys are in excellent shape: cystatin C, the filtration marker that is not skewed by muscle mass, gives an eGFR of 129, and there is no protein leaking into the urine. Her full blood count is good, with a haemoglobin of 135 despite heavy periods, so she is not anaemic. The autoimmune screen matters enormously for someone with new hand joint pain and a raised inflammatory marker, and every part of it is negative: rheumatoid factor, anti-CCP (the most specific antibody for rheumatoid arthritis), antinuclear antibodies, complement C4, the coeliac antibody and both thyroid antibodies. The IL-17 family of inflammatory messengers, which drive psoriasis-type joint disease, are all low. Rheumatoid arthritis and lupus are therefore unlikely explanations for her hands, and hypermobility becomes the most probable one. Her lipoprotein (a), the inherited cholesterol particle that cannot be changed by lifestyle, is within the ideal range, which means everything wrong with her cholesterol is acquired and fixable. Every cancer screening marker is normal, including CA 125, which also rises with endometriosis and sits low here in keeping with her MRI. The Epstein-Barr antibodies confirm what she suspected: EBNA IgG and VCA IgG are strongly positive and VCA IgM is negative, which is the fingerprint of glandular fever that has passed. Fatigue after glandular fever can genuinely last a year, and it is a fair contributor to her daytime tiredness.\n\nThe central finding is insulin resistance, and almost everything else in this report is downstream of it. Insulin is the hormone that moves sugar out of the blood after a meal. Her fasting insulin is 151 pmol/L, which is 21.8 mIU/L against an ideal of 8 or below, and her C-peptide, a steadier measure of how hard the pancreas is working, is 3.28 against an ideal of 2.5. Her glucose is 5.21 and her HbA1c 38, both inside the laboratory range but above ideal, and putting glucose and insulin together gives a HOMA-IR of 5.0, where 1.5 or below is ideal. In plain terms, her body is producing three times the insulin it should need to keep her blood sugar where it is. Adiponectin, a hormone made by fat tissue that keeps the body sensitive to insulin, is 2.07 against a lower limit of 3.81, and it falls as visceral fat rises. Insulin at this level is a fat-storage signal, an appetite signal and an inflammatory signal all at once. It explains 20 kilograms in a year far better than eating habits do, it drives jawline acne through its effect on the skin, it lowers HDL and raises triglycerides, and it keeps her sex hormone binding globulin lower than it should be on the pill. At 20, with a normal uric acid, ideal urine albumin and no damage anywhere, this is entirely reversible, and reversing it is the plan.\n\nHer cholesterol is the first consequence. Total cholesterol is 5.61 against a limit of 5.0 and LDL, the cholesterol in the particles that deposit in artery walls, is 3.81 against a limit of 3.0. The number that counts best is apolipoprotein B, which counts the artery-damaging particles themselves: at 1.33 g/L it is well above the ideal of 0.8. HDL, the protective particle, is 1.15 against a limit of 1.55, and the ApoB to ApoA-I ratio of 1.19 is double the ideal for a woman. The good news inside this is that small dense LDL, the most harmful form, is only slightly above ideal, and Lp(a) is fine. Put together, her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 that scores the lipids, inflammation and blood sugar without any age term, comes out at 85, where 20 or below is ideal. That is a high score, and it should be read alongside the fact that her actual chance of a heart event in the next ten years is very low because she is 20: the score measures the risk being built, and at 20 there is time to unbuild it. This is the lipid signature of insulin resistance and the combined pill, not an inherited cholesterol disorder, and it responds to weight loss, resistance training and less refined carbohydrate more reliably than to anything else. Her GP may also wish to review the type of contraception in light of the cholesterol and the clotting risk of oestrogen, though her D-dimer is normal.\n\nHer liver is showing the earliest sign of the same process. GGT, the liver enzyme most sensitive to metabolic strain, is 47.9 against a limit of 42, and ALT, the enzyme most specific to liver cells, is 28.5, inside the laboratory range but above the 25 ideal for women. Alkaline phosphatase, bilirubin and bile acids are all ideal and GLDH is normal, so this is not bile duct disease or liver cell damage; it is fat beginning to accumulate in the liver, which at 20 reverses completely. GGT is also the number that will confirm her plan is working before the scales do.\n\nHer inflammatory marker hsCRP is 6.28 against a limit of 1.0. In the absence of a current infection, the most likely driver at 20 is excess body fat, which is itself inflammatory, with insulin resistance behind it. Her white cell count, neutrophils and monocytes all sit in the upper part of their ranges in keeping with that, while IL-8, the messenger that recruits neutrophils to bacterial infection, is at the bottom of its range, which argues against an active infection at the time of the draw. Her raised IgE, eczema and hand pain could each add a little to the CRP. Because new joint pain in the hands with a CRP at this level deserves a proper look even when the autoimmune screen is negative, we would recommend her GP repeats the CRP when she is well, and if it stays above 5 refers her to be examined.\n\nImmunity is the theme behind her year of infections, and the antibody results are reassuring in that she is not short of them: IgG, IgA and IgM are all normal, and the coeliac test is valid because IgA is not deficient. What she is short of is zinc. At 9.2 against a limit of 10.7 and an ideal of 12 or more, zinc is low, and zinc is central to immune defence, skin repair and healing. Low zinc is associated with recurrent infections, slow healing, acne and dermatitis, which reads like her list. Copper, which competes with zinc, is 32.1 against a limit of 24.4. The combined pill raises copper reliably because oestrogen increases its carrier protein, and that is almost certainly the cause, but a high copper next to a low zinc widens the gap between them in a way that is associated with inflammation and poorer immune function. Her IgE is 104.5 against a limit of 100, with a basophil count marginally above range at 0.08, and together these confirm a mild allergic tendency behind the eczema and dermatitis. Vitamin D is 74, a whisker below the 75 ideal floor in a September sample, and it will fall through the winter without support. B12 is 359 with an active B12 of 58, both inside the range but below ideal, and a red cell size at the top of its ideal band fits that. Ferritin is 31 against an ideal of 40 or more, and with heavy periods and a CRP that inflates ferritin the true iron store is probably a little lower still; transferrin saturation of 19.8 percent, below the 25 percent ideal, says the same thing. Iron stores at this level do not cause anaemia but are associated with fatigue and poorer exercise tolerance.\n\nHer hormones read as expected for someone on the combined pill: FSH, LH, oestradiol and progesterone are all suppressed because the pill switches off the signals from the brain to the ovaries, and this is not a fertility finding. Testosterone and the free androgen index are both ideal, which weighs against polycystic ovary syndrome as the explanation for the acne and weight gain and points back to insulin. Prolactin is 533 against a limit of 496. Sertraline is a well-recognised cause of a mild prolactin rise of exactly this size and the pill adds to it, so this is expected rather than alarming, but her GP should be aware because a persistent rise can affect periods, mood and libido and is worth a second sample taken rested. Her morning cortisol of 563 is inside the range but high in it; the pill raises the protein that carries cortisol, so the measured total goes up without more active hormone, though anxiety, poor sleep and pain all keep cortisol up and cortisol in turn worsens insulin resistance. Night sweats and hot flushes are recognised effects of sertraline, and a raised prolactin can contribute; nothing in the hormone panel points to an ovarian cause.\n\nHer digestive results narrow the IBS question rather than answer it. H. pylori is negative, coeliac is negative, the pancreatic enzymes are ideal, and CA 125 is low. Gastrin is marginally below range at 4.96, which usually means the stomach is making acid normally and carries no concern. With those excluded, the two things in this report that most plausibly feed her bloating are the diet pattern behind the insulin resistance and the low zinc, which affects the gut lining.\n\nThe remaining findings are minor. Sodium at 146.2 and chloride at 108.2 are each a fraction above their limits, with a low urea, which reads as a morning sample from someone who had not drunk much rather than anything else. Bicarbonate at 18.1 is below the 20 limit; the commonest causes at her age are breathing faster when anxious, which lowers it, and a sample that sat before analysis, and with a normal anion gap and normal kidneys it is not an acid problem, though it is worth repeating once. Parathyroid hormone is 1.3 against a limit of 1.6 with an ideal calcium, which usually means the gland has nothing to do; not a concern now, but worth checking at her next test. HB-EGF, a growth factor, is above range, but that sample arrived at the wrong temperature and the result should not be read into. NGAL, a kidney injury marker, is below its range, which simply means there is no kidney stress.","links":"Insulin resistance is the thread. A fasting insulin of 151 pmol/L (21.8 mIU/L), a C-peptide of 3.28, a HOMA-IR of 5.0 and an adiponectin of 2.07 are four views of the same process, and it explains the weight gain, the acne, the low HDL of 1.15, the triglycerides of 1.43, the raised GGT of 47.9, the ALT drifting above ideal, the SHBG sitting lower than it should on the pill, and most of the hsCRP of 6.28. The cholesterol picture, with an ApoB of 1.33 g/L and an LDL of 3.81, is the same story seen from the artery’s side, with the combined pill adding to it. Lp(a) is ideal and small dense LDL is close to ideal, so none of this is inherited and all of it is modifiable at 20.\n\nHer immune year has a nutritional explanation running underneath it. Zinc at 9.2 is low, copper at 32.1 is high, vitamin D at 74 is a fraction below ideal, ferritin at 31 is below ideal with heavy periods, and B12 at 359 is adequate rather than abundant. Zinc and vitamin D both regulate the IgE pathway that is behind her eczema and dermatitis, zinc is needed for skin repair and wound healing, and a wide copper to zinc gap is associated with poorer immune function. The Epstein-Barr antibodies confirm past glandular fever, which is a fair contributor to a year of fatigue and vulnerability to infection. None of this is a deficiency in the sense of a disease, but taken together it is a body that has been running short of the things immunity is built from.\n\nThe joint pain in her hands is the finding that deserved the most careful exclusion, and the exclusion is good. Rheumatoid factor, anti-CCP, ANA and C4 are all negative or normal, and the IL-17 family is low. With hypermobility already diagnosed, that is the most likely explanation, and the muscle enzymes CK and aldolase being normal argue against a muscle cause for her wider body pain. The one loose end is the hsCRP: inflammation from body fat is the probable driver, but a CRP above 5 alongside new joint pain should be repeated when she is well, and if it stays there she should be examined.\n\nThe prolactin of 533, the cortisol high in its range, the night sweats and the hot flushes all have sertraline and the combined pill as common threads. These are not reasons to stop either medication, which is a conversation for her prescriber, but they are worth raising together, because the pill is also contributing to the cholesterol and the copper, and there are contraceptive options that do not.","lifestyle":"Start with the honest picture: a diet rated 3 out of 10, high in refined carbohydrate and low in protein, is the single biggest reason her insulin is three times where it should be, and it is a long way from where it needs to be. It is also the lever that moves the most numbers in this report at once. None of the habits below need a diet plan; they attach to things she already does.\nPut a palm-sized portion of protein on the plate first at every meal, before anything else. Eggs or Greek yoghurt at breakfast, chicken, fish, tofu, beans or cottage cheese later. Anchor: whatever she already eats stays, protein goes on the plate first. Why: protein at each meal blunts the insulin spike behind a fasting insulin of 151 and keeps her full for hours, which is what stops the weight gain.\nSwap one white carbohydrate for a slow one, one meal at a time, starting with breakfast this week: oats or rye instead of cereal or white bread, then potatoes with skins, wholegrain rice or pasta at dinner the week after. Anchor: change breakfast only until it is automatic, then move to the next meal. Why: slower carbohydrate lowers the insulin her pancreas is over-producing, and with IBS a gradual change avoids a fibre shock.\nMake sugary drinks and fruit juice a weekend-only thing, and put a bottle of water where the drinks used to be. Anchor: fill the water bottle when she makes her morning coffee. Why: liquid sugar goes straight to insulin and to the liver, and her GGT of 47.9 and sodium of 146 both point at what she drinks.\nWalk for fifteen minutes straight after her biggest meal of the day. Anchor: plate in the sink, shoes on, out of the door. Why: a walk after eating flattens the glucose and insulin rise from that meal, which is the mechanism behind a HOMA-IR of 5.0, and it takes her steps from under 5,000 towards 7,000 without a gym.\nTwo short resistance sessions a week, twenty minutes each, bodyweight or light dumbbells, with a coach or physio who understands hypermobility for the first few sessions. Anchor: the same two days every week, after the post-meal walk. Why: muscle is where insulin does its work, and two sessions a week is the single most effective change for insulin resistance and for raising an HDL of 1.15. Hypermobility is a reason to do it well, not a reason to avoid it.\nFix the wake time, even at weekends, and get outside within an hour of waking. Anchor: alarm, then straight out with the water bottle. Why: a fixed wake time and morning light reset the sleep drive she is currently supplying with melatonin, and better sleep lowers the cortisol that sits high in her range and worsens insulin resistance.\nTen minutes of anything that slows breathing before bed: reading, stretching, a warm shower, no screen. Anchor: melatonin goes on the bedside table, and the ten minutes happen between taking it and lights out. Why: slower breathing is also the simplest fix for a bicarbonate of 18.1 that reads as anxious over-breathing, and it addresses the stress goal directly.","flags":"Fasting insulin 151 pmol/L (21.8 mIU/L), ideal 8 mIU/L or below; C-peptide 3.28 (ideal below 2.5); calculated HOMA-IR 5.0 (ideal below 1.5); adiponectin 2.07 (range 3.81 to 14.10). Insulin resistance with compensating over-production and metabolically unhealthy weight gain. Randox’s own HOMA-IR is pending and will be added when it arrives.\nTotal cholesterol 5.61 (limit 5.00), LDL 3.81 (limit 3.00), HDL 1.15 (limit 1.55), ApoB 1.33 g/L (ideal below 0.8), ApoB to A-I ratio 1.19 (limit 0.90), triglycerides 1.43 (ideal below 1.0). Cardiovascular Risk Score 85 out of 100. The lipid pattern of insulin resistance with the combined pill contributing; Lp(a) 30.4 ideal and small dense LDL 36.6 close to ideal, so nothing here is inherited.\nhsCRP 6.28 (limit 1.00) with new hand joint pain. Autoimmune screen negative. Repeat when well; if it remains above 5, GP examination and a hypermobility-informed physiotherapy referral.\nGGT 47.9 (range 8 to 42) and ALT 28.5 (ideal below 25). Early fatty liver pattern; ALP, bilirubin, bile acids, GLDH, FIB-4 and APRI all normal. Reversible with weight loss.\nZinc 9.2 (range 10.7 to 17.5) low; copper 32.1 (range 12.6 to 24.4) high, expected on the combined pill. Wide copper to zinc gap in someone with a year of recurrent infections, eczema and acne.\nIgE 104.5 (limit 100.0) and basophils 0.08 (range 0.01 to 0.06). Mild allergic tendency behind the eczema and dermatitis.\nFerritin 31 (ideal 40 or above) and transferrin saturation 19.8 percent (ideal 25 to 40) with heavy periods and a CRP that inflates ferritin. Iron stores below ideal, no anaemia (haemoglobin 135).\nVitamin D 74 (ideal 75 to 120) in September; B12 359 ng/L (ideal 500 to 900) with active B12 58.2 (ideal above 70). Both adequate rather than abundant.\nProlactin 533 (range 102 to 496). Most likely sertraline, with the combined pill adding to it. Repeat rested; GP aware.\nBicarbonate 18.1 (range 20 to 31), sodium 146.2 (limit 146.0) and chloride 108.2 (limit 108.0). Marginal, consistent with hydration and a sample that sat; anion gap inflated by the same. Repeat once.\nPTH 1.3 (range 1.6 to 6.9) with calcium 2.35 ideal and vitamin D adequate. Watch at the next test, no action now.\nTSH 2.83 (ideal 1.0 to 2.5) with FT3, FT4 and both thyroid antibodies normal. Watch. Cortisol 563, high in range, pill effect on carrier protein. FSH, LH, oestradiol and progesterone suppressed by the combined pill as expected.\nGastrin 4.96 (range 6 to 55), no concern. NGAL 436 below range, no concern. HB-EGF 167 (limit 136) not interpretable: sample received at incorrect temperature.\nEpstein-Barr EBNA IgG and VCA IgG positive, VCA IgM negative: past glandular fever, not active. Consistent with the year of fatigue.\nReassuring negatives: rheumatoid factor, anti-CCP, ANA and C4 normal; coeliac negative with IgA sufficient; H. pylori negative; thyroid, intrinsic factor and parietal cell antibodies negative; all eight cancer screening markers within range; troponin, CK-MB and D-dimer normal; kidney function and urine albumin ideal; Lp(a) ideal.\nNot returned by the laboratory: leptin, resistin, IL-6, TNF-alpha, complement C3, pepsinogens I and II, gastrin-17, glutathione reductase, thyroxine-binding globulin, mesothelin, cystatin C (urine), NGAL (urine), KIM-1, the FABP 4 to 9 series, the cytokine autoantibody series and a further set of interleukins and adhesion molecules. IL-6 and leptin would have added to the insulin resistance picture and are worth requesting next time. Red cell folate pending. PhenoAge calculated with an assumed RDW of 13 percent because Randox does not report it.","recommendations":"Hand joint pain with hsCRP 6.28: the autoimmune screen here (RF, anti-CCP, ANA, C4, IL-17) is negative, which is reassuring. Please repeat the CRP when she is well; if it is still above 5, an examination, and a hypermobility-informed physiotherapy referral either way.\nProlactin 533 against a limit of 496: a repeat sample taken rested, noting sertraline as the probable cause. If persistently raised, the post-PEG recovery test decides whether it is biologically active.\nInsulin resistance at 20 (fasting insulin 21.8 mIU/L, HOMA-IR 5.0, adiponectin 2.07, HbA1c 38) with 20 kg gained in a year: worth documenting now so that a repeat in four months can show the direction of travel, and worth considering alongside the sertraline, which is associated with weight gain in some people.\nThe combined pill is contributing to her cholesterol (ApoB 1.33), copper (32.1), cortisol and prolactin, and she has heavy periods. A review of contraceptive options is reasonable.\nBicarbonate 18.1 and PTH 1.3 with a normal calcium: both to be repeated at the next test rather than acted on now.\nDaytime fatigue on nightly melatonin, with past glandular fever confirmed on antibodies: worth a sleep conversation, since poor sleep raises both cortisol and insulin.\nTargets: about 1,850 calories a day with 110 grams of protein and 30 grams of fibre built up over several weeks, aiming for 78 kg then 74 kg. Retest in four months. The markers that will show the plan is working, in the order they move: GGT, triglycerides, fasting insulin, hsCRP, HDL, ApoB.","supplementation":"Zinc picolinate 25 mg daily with food for three months, then 15 mg, taken away from iron. Zinc 9.2 is low and copper 32.1 is high; zinc supports immunity, skin repair and the gut lining, and narrows the copper to zinc gap.\nVitamin D3 2,000 IU daily with K2 through the winter, aiming to hold her level between 75 and 120. At 74 in September she will fall below 60 by February without it, and vitamin D helps regulate the IgE pathway behind her eczema.\nIron bisglycinate 25 mg every other day with vitamin C, away from zinc, to lift ferritin from 31 towards 60 given heavy periods. Recheck at four months and stop if ferritin is above 80.\nSublingual methylcobalamin 1,000 mcg daily for three months. B12 of 359 ng/L with an active B12 of 58 is adequate rather than abundant, and tiredness is her complaint.\nMagnesium glycinate 300 mg in the evening. Her serum level is only just inside ideal, magnesium improves insulin sensitivity and sleep, and the glycinate form is gentle on IBS.\nOmega-3 fish oil providing 2 grams of EPA and DHA daily, with a meal, for the triglycerides of 1.43 and the inflammatory picture.\nBerberine 500 mg twice daily with meals is an evidence-based option for insulin resistance at her age, but it interacts with some medications and must be cleared with her prescriber first because she takes sertraline and guanfacine.\nDo not take a multivitamin containing copper, or any thyroid support: copper is already high and the thyroid is working well.\nThe most important changes are not supplements. They are protein at every meal, slower carbohydrate, two to three resistance sessions a week, a daily walk, and a conversation with her GP about the pill and the prolactin.","biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7000","lower_normal":"60","upper_normal":"","lower_optimal":"80","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6667","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 84 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Raw weighted score 84.1; capped below 85 while a system is rated \"Needs attention\"; final 84.","low_causes":"One or more systems needing a GP, several sub-optimal systems","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"20.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4120","lower_normal":"","upper_normal":"25","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4000","units":"years","description":"PhenoAge is a biological age estimated from nine blood markers (Levine 2018). Randox does not report red cell distribution width, one of the nine, so a typical value of 13 percent was used for that input; the effect on the result is under a year either way. It sits above her calendar age of 20 because of the hsCRP, glucose and white cell count, and it will fall as the insulin resistance and inflammation resolve.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, where 20 or below is ideal and 40 or below is acceptable. It deliberately ignores age, so it shows the risk being built rather than the risk already realised. At 85 it is high, driven by the ApoB of 1.33, the HDL of 1.15 and the hsCRP of 6.28. Her ten-year chance of an event is still very low because she is 20; this score is the reason to act now so that it stays that way. Every input except Lp(a) is modifiable, and Lp(a) is the one that is fine.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"alanineaminotransferase","name":"Alanine Aminotransferase (ALT)","group":"LIVER & METABOLIC","units":"IU/L","description":"ALT is the enzyme most specific to liver cells. At 28.5 it is within the laboratory range but above the 25 ideal for women. At 20, with a GGT above range and insulin resistance, a mildly raised ALT most often reflects fat beginning to accumulate in the liver. It is early and fully reversible.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"28.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2591","lower_normal":"","upper_normal":"55","lower_optimal":"","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2273","range_type":"no lower"},{"key":"alkalinephosphatase","name":"Alkaline Phosphatase (ALP)","group":"LIVER & METABOLIC","units":"IU/L","description":"ALP comes from liver, bone and gut. At 76 it is within range and ideal, and a normal ALP alongside a raised GGT rules out a bile duct problem.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"76","within_normal is above the 3.0 limit, driven by a high non-HDL and a low HDL together.","low_causes":"","high_causes":"Low HDL, high non-HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldlcholesterol","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.65","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3250","lower_normal":"","upper_normal":"1","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"mmol/L","description":"VLDL is estimated from triglycerides and carries them out of the liver. At 0.65 it is within range but above ideal.","low_causes":"","high_causes":"Raised triglycerides, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlhdlratio","name":"LDL:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4729","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2857","units":"ratio","description":"LDL:HDL Ratio is calculated from your measured results. It sits outside the ideal range. It is being driven by LDL Cholesterol, which sits outside the ideal range.","low_causes":"","high_causes":"High LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlparticlecount","name":"LDL Particle Count (estimated)","group":"LIPIDS & CARDIOVASCULAR","result":"1330","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5115","lower_normal":"","upper_normal":"1300","lower_optimal":"","upper_optimal":"1000","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3846","units":"nmol/L","description":"LDL particle number estimated from ApoB, one particle per ApoB molecule. At about 1330 nmol/L it is above the 1300 limit, the particle-count view of the ApoB result.","low_causes":"","high_causes":"Raised ApoB","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"smallldlpercent","name":"Small LDL % of Total LDL","group":"LIPIDS & CARDIOVASCULAR","result":"24.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3543","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"%","description":"The share of LDL carried in small dense particles. At 24.8 percent it is within range and just inside ideal: her LDL is mostly the larger, less harmful kind.","low_causes":"","high_causes":"Insulin resistance, raised triglycerides","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Glucose","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"Fasting glucose is the sugar in the blood before eating. At 5.21 it is within the laboratory range but above the 5.0 ideal for someone her age. On its own this would not concern anyone. Next to an insulin of 151 it tells a different story: the pancreas is having to produce a great deal of insulin to hold glucose at this level. That effort is the definition of insulin resistance, and it is the thread that ties together her weight gain, low HDL, raised triglycerides, low adiponectin and raised GGT.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"5.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4678","lower_normal":"4","upper_normal":"7","lower_optimal":"4","upper_optimal":"5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4444","range_type":"normal"},{"key":"hba1c","name":"HbA1c","group":"GLUCOSE & INSULIN","units":"mmol/mol","description":"HbA1c is average blood sugar over the past three months. At 38 it is below the 42 limit but above the 36 ideal, sitting in the zone that tends to drift into prediabetes over the following years if insulin resistance is not addressed. At 20 that drift is entirely reversible.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"38.03","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4527","lower_normal":"","upper_normal":"42","lower_optimal":"","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4286","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","units":"pmol/l","description":"Fasting insulin is the hormone that moves sugar out of the blood, and a high fasting level means the body is having to shout to be heard. At 151 pmol/L, which is 21.8 mIU/L, it is within the laboratory range but nearly three times the ideal ceiling of 8 mIU/L. A HOMA-IR calculated from this and her glucose comes to 5.0, where below 1.5 is ideal. Insulin at this level drives fat storage, appetite, acne, low HDL and inflammation, and it explains 20 kilograms of weight gain in a year far better than willpower does. This is the finding to build her plan around.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"151.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6194","lower_normal":"17.8","upper_normal":"173","lower_optimal":"14","upper_optimal":"56","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3252","upper_optimal_position":"0.4154","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","units":"mmol/l","description":"NEFA are free fatty acids released from fat stores. At 0.40 they are within range and ideal.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"0.400","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2222","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","units":"ng/ml","description":"C-peptide is produced in equal amounts to insulin and is a steadier measure of how hard the pancreas is working. At 3.28 it is within the laboratory range but above the 2.5 ideal, confirming the fasting insulin: high insulin output to compensate for insulin resistance.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"3.28","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5535","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4747","range_type":"normal"},{"key":"fructosamine","name":"Fructosamine","group":"GLUCOSE & INSULIN","units":"umol/l","description":"Fructosamine reflects average blood sugar over the past two to three weeks. At 224 it is ideal, consistent with the HbA1c.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"224","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4966","lower_normal":"151","upper_normal":"300","lower_optimal":"151","upper_optimal":"250","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5548","range_type":"normal"},{"key":"adiponectin","name":"Adiponectin","group":"GLUCOSE & INSULIN","units":"ug/ml","description":"Adiponectin is a hormone made by fat tissue that makes the body more sensitive to insulin and calms inflammation. It falls as visceral fat rises. At 2.07 it is below the 3.81 limit and a long way below ideal. Low adiponectin is one of the earliest and most sensitive signals of metabolically unhealthy weight gain, and it rises again with weight loss, exercise and sleep. This result and the insulin are two views of the same problem.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"2.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2770","lower_normal":"3.81","upper_normal":"14.1","lower_optimal":"7","upper_optimal":"14.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4367","upper_optimal_position":"0.6667","range_type":"normal"},{"key":"metabolicassessment","name":"Metabolic Assessment","group":"GLUCOSE & INSULIN","units":"","description":"Fasting insulin 151 pmol/L (21.8 mIU/L), C-peptide 3.28, HOMA-IR 5.0, adiponectin 2.07, HbA1c 38. Glucose still controlled at the cost of very high insulin output. The central finding of this report.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"Insulin resistance","within_normal":"FALSE","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4571","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Average glucose estimated from HbA1c. Above ideal, consistent with early insulin resistance.","low_causes":"","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8.69","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4937","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines triglycerides and glucose as a marker of insulin resistance. Above ideal, agreeing with HOMA-IR.","low_causes":"","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"5.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"2.5","lower_optimal":"","upper_optimal":"1.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3000","units":"ratio","description":"HOMA-IR estimates insulin resistance from fasting glucose and insulin together. At 5.03 it is above the 2.5 limit and more than three times the ideal of 1.5. This is the clearest single statement of insulin resistance on the panel and the number the plan is built around. Calculated from glucose 5.21 and insulin 21.7 mIU/L; Randox’s own value is pending and will replace it when it arrives.","low_causes":"","high_causes":"Insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homab","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"254","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7952","lower_normal":"60","upper_normal":"200","lower_optimal":"80","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5476","units":"%","description":"HOMA-B estimates how hard the insulin-producing cells are working. At 254 percent it is above the laboratory range, which means the pancreas is compensating for resistance by over-producing. Beta cells can keep this up for years, but the earlier the demand is reduced the better.","low_causes":"Beta cell exhaustion","high_causes":"Compensation for insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glucoseinsulinratio","name":"Glucose:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"4.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4778","lower_normal":"4.5","upper_normal":"","lower_optimal":"7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7778","upper_optimal_position":"1.0000","units":"mg/dL per mIU/L","description":"The glucose to insulin ratio, in mg/dL per mIU/L, falls as insulin resistance rises. At 4.3 it is below the 4.5 limit, agreeing with HOMA-IR that insulin resistance is present.","low_causes":"Insulin resistance","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"adiponectininsulinratio","name":"Adiponectin:Insulin Ratio","group":"GLUCOSE & INSULIN","result":"0.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1667","lower_normal":"0.3","upper_normal":"","lower_optimal":"0.7","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"1.0000","upper_optimal_position":"1.0000","units":"ratio","description":"The adiponectin to insulin ratio combines the two most sensitive markers of metabolically unhealthy weight. At 0.10 it is well below the 0.3 limit: low adiponectin and high insulin at the same time.","low_causes":"Low adiponectin with high insulin, metabolically unhealthy weight","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"highsensitivitycreactiveprotein","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","units":"mg/l","description":"hsCRP measures low-grade inflammation throughout the body. At 6.28 it is above the 1.0 limit and six times the ideal. In the absence of a current infection, a value like this at 20 is most often driven by excess body fat, which is itself inflammatory, and by insulin resistance. Her raised IgE, eczema, hand joint pain and a year of recurrent infections could each add to it. The autoimmune markers being negative makes an inflammatory arthritis less likely, but with new hand joint pain this level should be repeated by her GP once she is well, and if it stays above 5 it needs a proper look.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"6.28","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"1","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.5000","range_type":"no lower"},{"key":"antistreptolysino","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","units":"iu/ml","description":"ASO detects antibodies from a recent streptococcal throat or skin infection. Below 28 it is negative, so her recurrent throat infections were not streptococcal in the recent past.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","result":"<28.0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0700","lower_normal":"","upper_normal":"200","lower_optimal":"","upper_optimal":"200","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.5000","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","units":"ug/ml","description":"D-dimer is a breakdown product of blood clots. At 0.165 it is within range and ideal, with no sign of abnormal clotting. Worth noting because the combined pill raises clotting risk.","low_causes":"","high_causes":"","padding":"1","one_sid const data = REPORT_DATA;

  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');
const totalTested = bms.length;
const flaggedCount = bms.filter(b => b.within_normal === 'FALSE').length;
const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

// ---- groups --------------------------------------------------
const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
