<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Rebecca Rodwell","dob":"24/01/1996","report_date":"2026-10-05","summary":"Rebecca is a 30-year-old female presenting with a BMI of 32.8, following a standard mixed diet rated 6 out of 10 for quality with a volume of 8 out of 10. She trains four times per week (two cardio, two resistance) with 2,000 to 5,000 daily steps. She takes tadalafil 5 mg daily when she remembers, and reports using some supplements and recently experimenting with di- and tri-peptides. She uses cannabis and recreational drugs. She reports weight gain and difficulty losing weight, joint pain and stiffness, and hair thinning or hair loss. Her goals are to reduce stress and anxiety, improve digestion and gut health, and balance hormones.\n\nThere is a great deal of good news in this report and two findings that need attention. Starting with the positives: Rebecca's metabolic health is excellent. Her HbA1c, which is a three-month average of blood sugar, is 33.66 mmol/mol, well inside the ideal range and about as good as this marker gets. Her fasting insulin at 54.9 pmol/L and her C-peptide at 1.86 ng/ml are both comfortably within range, which means her pancreas is producing the right amount of insulin and her cells are responding to it well. At a BMI of 32.8, this is a genuinely reassuring finding, because elevated weight often comes with rising insulin resistance, and Rebecca shows no sign of that. Her fructosamine at 239 umol/L confirms the same picture from a different angle. Her liver is in excellent health. ALT at 12.4 and GGT at 15.2 are both well within the ideal range, and the fibrosis scores (FIB-4 at 0.76 and APRI at 0.22) confirm there is no scarring or strain. At her weight, with cannabis and recreational drug use in the picture, a clean liver panel is a genuine positive. Her kidneys are working well. Creatinine at 80.1 gives an eGFR of 88, and Cystatin C at 0.87 gives an eGFR of 98, which at 30 is exactly where it should be. Cystatin C is a more reliable measure of kidney function than creatinine, especially at higher body weight, and both routes to the answer agree that her kidneys are healthy. Her microalbumin-to-creatinine ratio at 0.3 is essentially zero, ruling out any early kidney stress. Her thyroid is working well. TSH at 0.958 mIU/L sits in the ideal zone, Free T4 at 15.40 pmol/L and Free T3 at 4.60 pmol/L are both within range, and both thyroid antibodies (anti-TPO and anti-thyroglobulin) are negative, which rules out autoimmune thyroid disease as a contributor to her symptoms. Her Lp(a), which is lipoprotein(a), a genetically inherited particle that adds cholesterol to the artery wall and cannot be changed by diet or exercise, is 13.7 nmol/L, well below the 75 nmol/L threshold. This is genuinely useful information. It means that all of the cholesterol findings discussed below are driven entirely by modifiable factors, not by an inherited particle she cannot control. That is an important distinction because it means diet, exercise and weight loss can move every number that matters. Her coeliac screen is negative. Rheumatoid factor and anti-CCP antibodies are both negative, which effectively rules out rheumatoid arthritis as the explanation for her joint pain and stiffness. Her tumour markers are all within range. Her cardiac markers (troponin T, CK-MB, myoglobin, creatine kinase) are all normal, ruling out any cardiac muscle stress. Her D-dimer is below the detection threshold, meaning there is no evidence of abnormal clotting. Her immunoglobulins are within range, her EBV (Epstein-Barr virus) antibodies show no past or current infection, and her IgE at 84.6 is within range, so there is no sign of an active allergic or parasitic process. Her homocysteine at 7.5 umol/L is within the ideal range, which is a positive cardiovascular and neurological marker. Her PhenoAge, a composite biological age estimate built from albumin, creatinine, blood sugar, CRP, lymphocyte percentage, MCV, alkaline phosphatase and white cell count, is 27.3 years against a calendar age of 30, meaning her body is ageing roughly three years younger than her passport suggests. RDW is not measured on this panel, so a typical 13 percent was assumed, and fasting glucose was not returned, so the estimated average glucose from HbA1c was used. The effect of both substitutions on the estimate is small.\n\nThe first finding that needs attention is her lipid profile. Her LDL cholesterol (low-density lipoprotein, the particle that deposits cholesterol in artery walls) is 3.82 mmol/L, above the 3.0 target. Her HDL cholesterol (high-density lipoprotein, the particle that removes cholesterol from artery walls) is 1.01 mmol/L, below the 1.55 target for women. It is the combination that matters most: the total cholesterol-to-HDL ratio at 5.13 and the ApoB-to-ApoA1 ratio at 1.07 (above the 0.9 threshold for women) tell a clear story. ApoB is a protein carried by every atherogenic particle, so a ratio above 0.9 means the particles depositing cholesterol outnumber the particles removing it by too wide a margin. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 60, above the 40 threshold. The score has no age term, so it measures the risk being built rather than the ten-year chance of an event. At 30, her ten-year risk of a cardiovascular event is low, and the gap between that and a score of 60 is the window for acting. What is driving it is the low HDL and the elevated LDL, with a small contribution from hsCRP at 1.23. The reassuring details are that her triglycerides at 0.76 mmol/L are excellent, her small dense LDL at 26.69 mg/dL is low (only 18 percent of her total LDL), and her Lp(a) is low. So this is not a dangerous pattern right now, but it is a pattern that will become dangerous if it runs for another decade without intervention. The modifiable levers are weight (fat loss improves HDL more reliably than almost any other intervention), exercise (aerobic exercise raises HDL and lowers LDL), diet (increasing soluble fibre from oats, beans, lentils and vegetables, increasing oily fish to two to three portions a week, and reducing saturated fat from processed and fried food), and reducing or stopping cannabis, which is associated with lower HDL in some studies. With her Lp(a) being low, all of these levers will work.\n\nThe second finding that needs attention is her morning cortisol. Cortisol is the hormone produced by the adrenal glands that governs the stress response, energy, blood pressure and immune regulation. It follows a daily rhythm, peaking in the morning and falling through the day. Rebecca's cortisol was drawn at around 10:00 in the morning and came back at 120 nmol/L, below the lower limit of 138. A morning cortisol below the reference range is not something to ignore, and it is not something to panic about either. It could reflect a transient dip from poor sleep the night before the test, it could be related to cannabis use (chronic cannabis use can blunt the morning cortisol peak), or it could reflect underactivity of the adrenal glands that needs further investigation. We would recommend that Rebecca discusses this with her GP. The GP will likely arrange a repeat early-morning cortisol, ideally drawn between 8:00 and 9:00 am, and may consider a short Synacthen test, which is a stimulation test that checks whether the adrenal glands can respond when asked to produce more cortisol. It is important to tell the GP about any steroid medicines of any kind, whether tablets, inhalers, creams or injections, because these suppress the body's own cortisol production and would explain the finding without any adrenal problem being present. A low morning cortisol could contribute to her fatigue, difficulty losing weight and her sense of stress, because cortisol plays a role in all three. It is worth investigating properly.\n\nHer adiponectin is 2.65 ug/ml, below the lower limit of 3.81. Adiponectin is a hormone produced by fat cells that improves insulin sensitivity and has anti-inflammatory properties. Paradoxically, the more body fat a person carries, the less adiponectin the fat tissue produces, and low adiponectin is associated with insulin resistance, inflammation and cardiovascular risk. In Rebecca's case, her insulin and blood sugar are excellent despite the low adiponectin, which means her metabolic health is holding up well, but the low adiponectin is a signal that her fat tissue is under metabolic strain and is an additional reason to prioritise fat loss. As weight comes down, adiponectin typically rises.\n\nHer hsCRP (high-sensitivity C-reactive protein, a marker of systemic inflammation) is 1.23 mg/L, above the ideal threshold of 1.0. At a BMI of 32.8, a CRP in this range is common and is driven primarily by the inflammatory signals from excess fat tissue. It connects to the low adiponectin: both are signs that the fat tissue is metabolically active in ways that promote low-grade inflammation. This is not a worrying level, and it will come down with weight loss. Her complement C3 at 1.631 g/L is marginally above the upper limit of 1.6. C3 is part of the innate immune system, and mild elevations are commonly seen alongside raised CRP and higher body weight as part of the same low-grade inflammatory picture. It does not need separate investigation.\n\nHer ASO titre (antistreptolysin O, an antibody the immune system produces after a streptococcal infection such as strep throat or a skin infection) is 255.9 IU/ml, above the 200 threshold. This does not mean she has an active infection. It means her immune system encountered a streptococcal bacterium at some point in the recent past and mounted an antibody response. ASO can stay elevated for weeks to months after the infection has cleared. If she has not had a recent sore throat, skin infection or scarlet fever, this is most likely a residual elevation that will fall over time. It is worth mentioning to her GP, particularly given her joint pain, because in rare cases persistent streptococcal antibodies can contribute to joint inflammation (a process called reactive arthritis). The negative rheumatoid factor and anti-CCP make rheumatoid arthritis very unlikely, but the combination of joint pain with a raised ASO is worth the GP knowing about.\n\nHer EGF (epidermal growth factor) is 17 pg/ml, below the lower limit of 29. EGF is a growth factor involved in tissue repair, skin turnover and gut lining maintenance. A low EGF could be relevant to her goals around digestion and gut health, as it plays a role in maintaining the integrity of the gut lining. It is not a marker that typically prompts GP intervention on its own, but it adds context to her digestive symptoms.\n\nHer iron stores deserve attention even though ferritin at 19.14 ug/L is technically within the laboratory range of 15 to 150. For a menstruating woman, a ferritin below 30 is associated with fatigue, hair thinning and reduced exercise tolerance, and below 50 is considered suboptimal. At 19, Rebecca's iron stores are low enough to contribute to her hair thinning and potentially to difficulty with weight loss, because iron is essential for thyroid hormone production and energy metabolism. Her transferrin saturation at 21.4 percent is below the optimal 25 percent floor. This is a finding she can act on directly with dietary changes and supplementation.\n\nHer vitamin D at 84 nmol/L is within the laboratory range but below the optimal 100 nmol/L target, and at a BMI of 32.8 she will need a higher dose than a lean person because fat tissue sequesters vitamin D. Her folic acid at 7.2 ug/L is within the laboratory range but below the optimal 8 ug/L target, and her red cell folate at 817 confirms adequate but not generous stores. Her B12 at 876 ng/L is above the laboratory range of 197 to 771, but her active B12 at 107 pmol/L is within range, which means the total B12 is being inflated by inactive forms, most likely from supplementation. This is not a concern. Her zinc at 11.2 umol/L is within the laboratory range but at the very bottom, below the optimal 12 umol/L floor. Zinc is involved in immune function, hormone production, skin and hair health, and gut lining repair, so borderline zinc alongside her symptoms of hair thinning and her goal of gut health is worth addressing.\n\nHer LH-to-FSH ratio is 4.06, above the 2.0 upper limit. LH (luteinising hormone) and FSH (follicle-stimulating hormone) work together to regulate the menstrual cycle. An LH-to-FSH ratio above 2 in a woman of reproductive age with weight gain, hair thinning and difficulty losing weight raises the possibility of polycystic ovary syndrome (PCOS). This is not a diagnosis from a single ratio, and her testosterone at 1.03 nmol/L and free androgen index at 3.11 percent are both within range, which is reassuring. However, the combination of the elevated ratio, her symptoms and her BMI is worth discussing with her GP, who may arrange a pelvic ultrasound and a clinical assessment.\n\nHer progesterone at 43.10 nmol/L and oestradiol at 910 pmol/L are within range for the luteal phase of the menstrual cycle (the second half, after ovulation). The exact interpretation depends on where in her cycle she was when the blood was drawn, which is not recorded. If this was mid-luteal, the progesterone confirms ovulation occurred, which is reassuring.\n\nThe full blood count was analysed later than ideal (the laboratory noted the sample was received outside stability time), so the mildly low MCHC at 307 g/L and the mildly raised monocyte count at 0.90 are most likely effects of sample age rather than genuine findings. The remaining blood count values, including haemoglobin at 126, white cell count at 6.32, platelets at 211 and neutrophils at 3.18, are all within range. A repeat full blood count is only needed if symptoms warrant it.\n\nHer monocyte-to-HDL ratio at 0.89 and monocyte-to-lymphocyte ratio at 0.44 are above their respective thresholds, but both are being driven primarily by the low HDL and the monocyte count that may be artefactual from the delayed sample processing. The lymphocyte-to-monocyte ratio at 2.27 and the neutrophil-to-monocyte ratio at 3.5 are similarly affected. These ratios will be more reliable on a fresh sample. Her testosterone-to-cortisol ratio at 8.58 is above the upper optimal limit of 6, but this is entirely driven by the low cortisol in the denominator rather than by high testosterone, so it does not carry independent meaning.","links":"The thread running through Rebecca's results is a body that is metabolically healthy at its core but carrying enough excess weight to shift several markers in an unfavourable direction. Her blood sugar control, insulin sensitivity, liver function and kidney function are all excellent, which means the metabolic machinery is working well. But the excess fat tissue is producing measurable downstream effects: low HDL, low adiponectin, mildly raised CRP, and mildly raised complement C3. These four findings share a single explanation: adipose tissue at a BMI of 32.8 is metabolically active in ways that lower the protective HDL particles, reduce the insulin-sensitising hormone adiponectin, and release low-grade inflammatory signals. The good news is that all four will improve with fat loss, and because her underlying metabolic health is strong, she is well placed to make that change.\n\nThe lipid pattern is atherogenic but modifiable. Her LDL at 3.82 and ApoB-to-ApoA1 ratio at 1.07 put her in a risk category that matters over the next two to three decades, but her Lp(a) at 13.7 confirms that the entire pattern is driven by weight, diet and activity rather than by an inherited particle. Her triglycerides at 0.76 and small dense LDL at only 18 percent of total LDL are both excellent, meaning the quality of her LDL particles is good even though the quantity is too high. Weight loss, increased aerobic exercise, dietary fibre and oily fish will move both the LDL down and the HDL up.\n\nThe low morning cortisol at 120 nmol/L is a separate finding that does not fit neatly into the metabolic picture. It could be related to cannabis use, which is known to blunt the hypothalamic-pituitary-adrenal axis over time, or it could reflect adrenal underactivity that needs investigation. It connects to her symptoms of stress and difficulty losing weight, because cortisol regulates energy availability, appetite signalling and the body's response to physical and emotional stress. The GP follow-up with an early-morning repeat and consideration of a Synacthen test is the right next step.\n\nThe raised LH-to-FSH ratio at 4.06 is worth investigating in the context of her weight, hair thinning and difficulty losing weight, because these are features associated with PCOS. Her androgens are within range, which does not rule PCOS out (not all presentations involve raised androgens) but does make a severe androgen-driven picture less likely. A pelvic ultrasound and clinical assessment would clarify.\n\nThe raised ASO at 255.9 is most likely a residual antibody response to a past streptococcal exposure and will probably fall on retesting in two to three months. Its relevance to her joint pain is low given the negative rheumatoid factor and anti-CCP, but the GP should be aware of the combination.\n\nWhat has been ruled out is as important as what has been found. Autoimmune thyroid disease, coeliac disease, rheumatoid arthritis, significant anaemia, kidney disease, liver disease and diabetes have all been excluded. The iron stores are low and the zinc is borderline, both of which are correctable and relevant to her hair thinning. The vitamin D is adequate but not optimal, and supplementation at a higher dose is straightforward.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, smoked salmon, or leftover chicken. Anchor: protein goes on the plate before anything else. Why: protein protects muscle during fat loss, keeps you full for longer, and supports the 143 g daily target your lean mass needs.\nSwap white bread, pastry and sugary snacks for oats, beans, lentils and wholegrain alternatives, one meal at a time starting with breakfast this week. Why: soluble fibre from oats and pulses directly lowers LDL cholesterol and feeds beneficial gut bacteria, which connects to both your lipid results and your goal of improving digestion.\nEat two to three portions of oily fish a week (salmon, mackerel, sardines, trout). Anchor: pick two fixed days and make fish the default dinner. Why: omega-3 from oily fish raises HDL, lowers triglycerides and has anti-inflammatory effects that will help bring your hsCRP down.\nWalk for fifteen to twenty minutes after your largest meal every day. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal and adds to your daily step count, which at 2,000 to 5,000 has room to grow. Aim for 7,500 as a first target.\nAdd one extra resistance session per week, building to three over a month. Focus on compound movements (squats, deadlifts, rows, presses). Why: resistance training is the most effective way to raise HDL, improve body composition and protect lean mass during fat loss, and it supports joint health.\nCut caffeine after 2 pm and keep a fixed wake time seven days a week, even on weekends. Anchor: set an alarm for the same time every day. Why: consistent sleep supports cortisol rhythm, and your low morning cortisol suggests the daily cortisol cycle may not be peaking properly.\nGet outside within thirty minutes of waking, even for five minutes. Why: morning light resets the circadian clock that drives the cortisol peak, which is the hormone that came back low on this test.\nConsider reducing or stopping cannabis. Why: chronic cannabis use is associated with blunted morning cortisol, lower HDL cholesterol, and increased appetite, three findings that are present in this report. This is the single lifestyle change with the widest reach across your results.","flags":"Cortisol 120 nmol/L, below the morning reference range of 138 to 690, drawn at approximately 10:00. This is a genuine low morning cortisol that warrants GP assessment. Recommend a repeat fasting cortisol drawn between 08:00 and 09:00. The GP may consider a short Synacthen test to assess adrenal reserve. Any steroid use (tablets, inhalers, creams, nasal sprays, injections) must be disclosed as it suppresses endogenous cortisol.\nLDL cholesterol 3.82 mmol/L (target below 3.0), HDL cholesterol 1.01 mmol/L (target above 1.55 for women), total cholesterol-to-HDL ratio 5.13 (target below 5.0), ApoB-to-ApoA1 ratio 1.07 (target below 0.9 for women). Atherogenic lipid pattern driven primarily by low HDL. Lp(a) 13.7 nmol/L (low, reassuring) confirms this is entirely modifiable. Small dense LDL 26.69 mg/dL (18 percent of total LDL, low). Cardiovascular Risk Score 60 out of 100. Lifestyle intervention is the first-line approach: weight loss, aerobic exercise, dietary fibre, oily fish.\nAdiponetin 2.65 ug/ml, below the lower limit of 3.81. Low adiponectin is associated with insulin resistance and cardiovascular risk. In this case insulin and blood sugar are excellent, so the low adiponectin reflects metabolic strain from excess adipose tissue rather than active insulin resistance. Expected to improve with fat loss.\nhsCRP 1.23 mg/L, above the ideal threshold of 1.0. Low-grade inflammation consistent with BMI 32.8. Not at a level requiring investigation in isolation but contributes to cardiovascular risk score. Expected to fall with weight loss.\nASO titre 255.9 IU/ml, above the 200 threshold. Indicates recent streptococcal exposure. Most likely residual and will fall over months. Worth mentioning to the GP given the concurrent joint pain, although negative RF and anti-CCP make rheumatoid arthritis very unlikely.\nLH-to-FSH ratio 4.06, above the 2.0 upper limit. In a 30-year-old woman with weight gain, hair thinning and difficulty losing weight, this raises the possibility of PCOS. Testosterone and free androgen index are within range. Recommend GP assessment including pelvic ultrasound.\nFerritin 19.14 ug/L, technically within the laboratory range (15 to 150) but below the optimal 50 for a menstruating woman. Transferrin saturation 21.4 percent, below the optimal 25 percent. Low iron stores may contribute to hair thinning, fatigue and reduced exercise tolerance. Supplementation recommended.\nEGF 17 pg/ml, below the lower limit of 29. Low epidermal growth factor may be relevant to gut lining integrity and tissue repair. No specific GP action required but adds context to digestive goals.\nComplement C3 1.631 g/L, marginally above the 1.6 upper limit. Part of the low-grade inflammatory picture seen with elevated BMI. No separate investigation needed.\nVitamin B12 876 ng/L, above the laboratory range of 197 to 771. Active B12 107 pmol/L is within range (25 to 165), confirming adequate B12 status. The elevated total B12 is most likely from supplementation.\nFull blood count was analysed outside the sample stability window. MCHC 307 g/L (below 320) and monocyte count 0.90 (above 0.8) are most likely artefacts of delayed processing rather than genuine findings. Remaining FBC values are within range. Repeat only if symptoms warrant.\nReassuring negatives: thyroid function normal with negative antibodies; coeliac screen negative; rheumatoid factor and anti-CCP negative; kidney function excellent (Cystatin C eGFR 98); liver enzymes and fibrosis scores normal; HbA1c 33.66 (excellent); fasting insulin and C-peptide normal; D-dimer undetectable; cardiac markers normal; tumour markers all within range; EBV antibodies negative; Lp(a) 13.7 (low); homocysteine 7.5 (ideal); PhenoAge 27.3 (2.7 years younger than calendar age).\nAssays on the Randox Signature specification that their laboratory does not currently process (not outstanding, not arriving later, and not part of what the customer receives or pays for): Apolipoprotein CII, Apolipoprotein CIII, Glucose, Leptin, Resistin, IL-6, TNFa, Cystatin C (Urine), NGAL, Bicarbonate, KIM-1, Urinalysis panel (Bilirubin, Glucose, Ketones, Nitrite, pH, Protein, Red Blood Cells, Urobilinogen, White Blood Cells), Gastrin, Pepsinogen I, Pepsinogen II, PGI/II ratio, Gastrin-17, multiple interleukins (IL-1a, IL-1b, IL-2, IL-3, IL-4, IL-7, IL-10, IL-12p70, IL-13, IL-23), soluble receptors (sIL-2Ra, sIL-6R, sTNFRI, sTNFRII), growth factors (Amphiregulin, TGF-a, VEGF), chemokines (MIP-1a), MMP-9, selectins (E, L, P), adhesion molecules (ICAM-1, VCAM-1), PD-1, ANA, Intrinsic Factor Antibodies, FABP-4 through FABP-9, and the full autoantibody panel (G-CSF, GM-CSF, IFN-a, IFN-gamma, IFN-omega, TNFa, and interleukin autoantibodies).","recommendations":"Discuss the low morning cortisol (120 nmol/L, below the 138 lower limit) with your GP. Ask for a repeat cortisol drawn between 08:00 and 09:00, fasting. Tell the GP about any steroid medicines you use or have used recently (tablets, inhalers, creams, nasal sprays or injections). If the repeat is still low, the GP may arrange a short Synacthen test to assess adrenal reserve.\nDiscuss the raised LH-to-FSH ratio (4.06, above 2.0) with your GP in the context of your weight gain, hair thinning and difficulty losing weight. Ask whether a pelvic ultrasound and clinical assessment for PCOS is appropriate.\nMention the raised ASO titre (255.9 IU/ml, above 200) to your GP, particularly in light of your joint pain. The GP may wish to repeat this in two to three months to confirm it is falling.\nAsk your GP to review your lipid profile (LDL 3.82, HDL 1.01, ApoB:ApoA1 1.07) in the context of your age, BMI and family history. Lifestyle intervention is the first step, but the GP should document the baseline.\nBegin iron supplementation (see supplementation section) and retest ferritin, transferrin saturation and a full blood count in three months.\nAim for a calorie intake of approximately 2,200 kcal per day (about 300 below your estimated daily expenditure of 2,513) with a protein floor of 143 g per day (1.3 g per kg of body weight). A first weight target of 95 kg (from 110 kg) gives a meaningful improvement in every marker flagged in this report; the long-term target is approximately 83 kg. Retest in four to six months with a focus on lipids, ferritin, cortisol (early morning via GP), HbA1c and adiponectin.","supplementation":"Iron as ferrous bisglycinate, 25 mg daily, taken with a source of vitamin C (a glass of orange juice or a vitamin C tablet) on an empty stomach or with a light meal. Take at least two hours away from tea, coffee or calcium supplements. Why: ferritin at 19.14 is below the optimal 50 for a menstruating woman, and low iron stores are a plausible contributor to hair thinning and fatigue.\nVitamin D3 as cholecalciferol, 4,000 IU daily, taken with your largest meal (it needs fat for absorption). Why: vitamin D at 84 nmol/L is within the laboratory range but below the optimal 100, and at a BMI of 32.8 a higher dose is needed because fat tissue sequesters vitamin D.\nVitamin K2 as MK-7, 100 mcg daily, taken alongside the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bone rather than into arteries.\nZinc as zinc picolinate or bisglycinate, 15 mg daily, taken with an evening meal. Why: zinc at 11.2 is below the optimal 12 and is involved in hair health, gut lining repair and immune function, all relevant to your symptoms and goals.\nOmega-3 fish oil providing 2 g of combined EPA and DHA daily, taken with food. Why: omega-3 raises HDL, has anti-inflammatory effects (relevant to your hsCRP of 1.23), and supports gut lining integrity.\nFolate as methylfolate, 400 mcg daily. Why: folic acid at 7.2 is just below the optimal 8, and methylfolate is the active form that does not require conversion.\nDo not take additional B12 supplements beyond what you are currently taking. Your active B12 at 107 pmol/L is within range, and your total B12 at 876 suggests your current supplementation is more than adequate.\nThe most important changes from this report are not supplements. They are reducing body weight through a sustained calorie deficit with adequate protein, increasing daily movement and exercise, and discussing the low cortisol and the raised LH-to-FSH ratio with your GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 64.6; held to 59 by a system rated \"See your GP\". Weakest systems: lipids & cardiovascular 31%, inflammation 51%, hematology 61%. Biggest drags: LDL Cholesterol, HDL Cholesterol, Non-HDL Cholesterol, Cortisol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"27.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3900","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a biological age estimate built from albumin, creatinine, blood sugar, CRP, lymphocyte percentage, MCV, alkaline phosphatase and white cell count. Rebecca's PhenoAge is 27.3 against a calendar age of 30, meaning her body is ageing approximately 2.7 years younger than her passport. RDW is not measured on this panel, so a typical 13% was assumed, and fasting glucose was not returned, so the estimated average glucose from HbA1c (5.7 mmol/L) was used in its place. The effect of both substitutions is small. Improvements in hsCRP and weight will push PhenoAge even lower.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"60","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7500","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term, so it measures the risk being built rather than the ten-year chance of a cardiovascular event. Rebecca's score of 60 is above the 40 threshold. The main drivers are her low HDL (1.01), elevated LDL (3.82), elevated ApoB-to-ApoA1 ratio (1.07) and hsCRP (1.23). At 30, her ten-year event risk is low, and the gap between that and a score of 60 is the window for acting through diet, exercise and weight loss.","low_causes":"Ideal lipid profile, low inflammation, healthy metabolic markers","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"126.0","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3887","lower_normal":"115","upper_normal":"165","lower_optimal":"125","upper_optimal":"155","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"g/l","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. Rebecca's haemoglobin at 126 g/L is within the normal range for women (115 to 165) but sits in the lower quarter. This is not anaemia, but combined with her low ferritin it suggests her iron stores are not generous enough to push haemoglobin to an optimal level. As iron stores improve with supplementation, haemoglobin may rise modestly.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, heavy menstruation, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"41.100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4700","lower_normal":"37","upper_normal":"47","lower_optimal":"38","upper_optimal":"44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"%","description":"Haematocrit is the percentage of blood volume occupied by red blood cells. Rebecca's haematocrit at 41.1% is comfortably within the ideal range, meaning her blood has a healthy balance between red cells and plasma.","low_causes":"Anaemia, overhydration, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin (MCH)","group":"HEMATOLOGY","result":"30.1","within_normal":"TRUE","wit tion, steroid use, autoimmune conditions, malnutrition","high_causes":"Viral infection, chronic lymphocytic leukaemia, autoimmune disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytecount","name":"Monocyte Count","group":"HEMATOLOGY","result":"0.90","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"0.2","upper_normal":"0.8","lower_optimal":"0.2","upper_optimal":"0.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5556","units":"10^9/l","description":"Monocytes are white blood cells that engulf and destroy pathogens and dead cells, and play a role in inflammation. Rebecca's monocyte count at 0.90 is marginally above the upper limit of 0.8. However, the laboratory noted that this sample was received outside the stability window for haematology, and monocyte counts can be affected by delayed processing. This is most likely a sample-age artefact rather than a genuine elevation.","low_causes":"Bone marrow suppression, steroid therapy","high_causes":"Chronic inflammation, infection, autoimmune conditions, sample ageing artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophilcount","name":"Neutrophil Count","group":"HEMATOLOGY","result":"3.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4054","lower_normal":"2","upper_normal":"7.5","lower_optimal":"2.5","upper_optimal":"6.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3636","upper_optimal_position":"0.5758","units":"10^9/l","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. Rebecca's neutrophil count at 3.18 is within the ideal range, confirming a healthy innate immune response.","low_causes":"Viral infection, medication, low energy availability, autoimmune conditions","high_causes" S","result":"63.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"44.8","upper_normal":"80.6","lower_optimal":"50","upper_optimal":"75","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3819","upper_optimal_position":"0.6140","units":"umol/l","description":"TIBC measures the blood's total capacity to bind and transport iron. When iron stores are low, the body produces more transport protein to capture every available iron molecule, so TIBC tends to rise. Rebecca's TIBC at 63.2 is within range, though the fact that it is not elevated despite low ferritin may reflect the body's compensatory mechanisms working adequately for now.","low_causes":"Iron overload, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.89","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4981","lower_normal":"2","upper_normal":"3.8","lower_optimal":"2.3","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/l","description":"Transferrin is the protein that transports iron through the blood to where it is needed. Rebecca's transferrin at 2.89 g/L is within the ideal range, confirming normal iron transport capacity.","low_causes":"Chronic inflammation, liver disease, malnutrition, iron overload","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"21.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3943","lower_normal":"15","upper_normal":"50","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4286","upper_optimal_position":"0.5238","units":"%","description":"Transferrin saturation tells us what percentage of the iron-carrying protein transferrin is actually loaded with iron. Rebecca's saturation at 21.4% is within the laboratory range but below the optimal 25%. This is consistent with her low ferritin and confirms that iron availability is suboptimal. Iron supplementation should improve this.","low_causes":"Iron deficiency, chronic disease, heavy menstruation","high_causes":"Haemochromatosis, iron supplementation, haemolysis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalcholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5180","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"4.5","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.45","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol carried in the blood, including LDL, HDL and VLDL. Rebecca's total cholesterol at 5.18 mmol/L is above the 5.0 target. On its own, total cholesterol is a blunt tool; what matters more is the balance between LDL and HDL, which is discussed in the markers below.","low_causes":"Malnutrition, hyperthyroidism, liver failure, malabsorption","high_causes":"Diet high in saturated fat, obesity, hypothyroidism, familial hypercholesterolaemia, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ldlcholesterol","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6367","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.4333","units":"mmol/l","description":"LDL cholesterol is the low-density lipoprotein particle that carries cholesterol from the liver into the artery wall, where it can accumulate and form plaques over time. Rebecca's LDL at 3.82 mmol/L is above the 3.0 target and well above the optimal 2.6. This is the primary driver of her elevated cardiovascular risk score. Because her Lp(a) is low, this LDL is entirely modifiable through diet, exercise and weight loss.","low_causes":"Hyperthyroidism, malnutrition, statin use, malabsorption","high_causes":"Diet high in saturated fat, obesity, sedentary lifestyle, familial hypercholesterolaemia, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3258","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"","lower_optimal_position":"0.5161","upper_optimal_position":"","units":"mmol/l","description":"HDL cholesterol is the high-density lipoprotein particle that removes cholesterol from the artery wall and returns it to the liver for disposal. It is protective. Rebecca's HDL at 1.01 mmol/L is below the 1.55 target for women. Low HDL is the other half of her atherogenic lipid pattern: the particles removing cholesterol are too few relative to those depositing it. The most effective ways to raise HDL are regular aerobic exercise, weight loss, and increasing omega-3 intake from oily fish. Cannabis use is associated with lower HDL in some studies and reducing or stopping it may help.","low_causes":"Sedentary lifestyle, obesity, smoking, cannabis use, high refined carbohydrate diet, genetic factors","high_causes":"Regular aerobic exercise, moderate alcohol intake, genetic factors, weight loss","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5130","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"3.5","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.35","units":"","description":"This ratio divides total cholesterol by HDL to give a single number summarising cardiovascular risk. Below 5 is the laboratory target, below 3.5 is ideal. Rebecca's ratio at 5.13 is above both thresholds, driven by the combination of elevated total cholesterol and low HDL. Improving HDL through exercise and weight loss will bring this ratio down.","low_causes":"High HDL, low total cholesterol, regular exercise","high_causes":"Low HDL, high LDL, obesity, sedentary lifestyle, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1652","lower_normal":"","upper_normal":"2.3","lower_optimal":"","upper_optimal":"1.0","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily from dietary sources and liver production. They rise with sugar, alcohol and excess calories. Rebecca's triglycerides at 0.76 mmol/L are excellent, well within the ideal range. This is a genuine positive, especially at her BMI, and means her liver is not overproducing fat-carrying particles.","low_causes":"Low-fat diet, malnutrition, hyperthyroidism, malabsorption","high_causes":"High sugar or alcohol intake, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"103.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3504","lower_normal":"101","upper_normal":"223","lower_optimal":"130","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4126","upper_optimal_position":"0.6038","units":"mg/dl","description":"ApoA-I is the main protein on HDL particles, the protective cholesterol carriers. Higher ApoA-I means more HDL particles doing their job. Rebecca's ApoA-I at 103.5 mg/dL is just above the lower limit of 101 and well below the optimal 130. This mirrors her low HDL and confirms that the number of protective particles is too low. Exercise and weight loss are the most effective interventions.","low_causes":"Sedentary lifestyle, obesity, smoking, metabolic syndrome","high_causes":"Regular exercise, genetic factors, moderate alcohol intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"111","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4302","lower_normal":"53","upper_normal":"182","lower_optimal":"53","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.4302","units":"mg/dl","description":"ApoB is the protein carried by every atherogenic (artery-damaging) lipoprotein particle, primarily LDL. One ApoB molecule means one particle. Rebecca's ApoB at 111 mg/dL is within the laboratory range but above the optimal target of 80, and when converted to g/L (1.11) it is above the 0.9 threshold that represents elevated cardiovascular risk. This is the single best measure of how many damaging particles are in the blood, and reducing it through diet, weight loss and exercise is the priority.","low_causes":"Statin therapy, low-fat diet, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, obesity, insulin resistance, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5944","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.6","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333","units":"","description":"The ApoB-to-ApoA1 ratio compares the number of atherogenic (damaging) particles to the number of protective particles. A ratio below 0.6 is ideal for women, below 0.9 is acceptable. Rebecca's ratio at 1.07 is above both thresholds, meaning the damaging particles significantly outnumber the protective ones. This is the single most important lipid finding in the report and the strongest reason to act on diet, exercise and weight.","low_causes":"High HDL, regular exercise, low LDL","high_causes":"Low HDL, high LDL, obesity, sedentary lifestyle, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"4.20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4647","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"2.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3529","upper_optimal_position":"0.6176","units":"mg/dl","description":"Apolipoprotein E is involved in clearing triglyceride-rich lipoproteins from the blood. Rebecca's ApoE at 4.20 mg/dL is within the ideal range, consistent with her excellent triglycerides.","low_causes":"Genetic variation (ApoE2 genotype), liver disease","high_causes":"Type III hyperlipoproteinaemia, genetic variation","pa h sugar diet, polycystic ovary syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nonesterifiedfattyacids","name":"Non-Esterified Fatty Acids","group":"GLUCOSE & INSULIN","result":"0.530","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2944","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.6","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.3333","units":"mmol/l","description":"Non-esterified fatty acids (NEFAs) are free fatty acids released from fat tissue into the blood. Elevated NEFAs can indicate insulin resistance, as insulin normally suppresses their release. Rebecca's NEFAs at 0.530 are within the ideal range, consistent with her good insulin sensitivity.","low_causes":"Fed state, good insulin sensitivity","high_causes":"Fasting, insulin resistance, uncontrolled diabetes, stress, high fat diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cpeptide","name":"C-peptide","group":"GLUCOSE & INSULIN","result":"1.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4621","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.3","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.6061","units":"ng/ml","description":"C-peptide is released in equal amounts to insulin when the pancreas makes insulin. It is a more stable measure of pancreatic insulin production than insulin itself. Rebecca's C-peptide at 1.86 ng/ml is within the ideal range, confirming her pancreas is producing an appropriate amount of insulin. Fasting glucose and the urine dipstick were not performed by the laboratory on this sample; the metabolic assessment is based on HbA1c, fasting insulin, C-peptide and fructosamine, all of which are normal.","low_causes":"Type 1 diabetes, low carbohydrate diet, exogenous insulin us ange_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"120","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2753","lower_normal":"138","upper_normal":"690","lower_optimal":"200","upper_optimal":"550","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4457","upper_optimal_position":"0.5797","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning (typically 200 to 550 nmol/L between 7 am and 10 am) and falling through the day. Rebecca's cortisol was drawn during the morning window and came back at 120 nmol/L, below the lower limit of 138. A morning cortisol below range is a finding that should be discussed with her GP. It could reflect chronic cannabis use blunting the adrenal axis, a transient dip from poor sleep, or genuine adrenal underactivity. The GP should arrange a repeat early-morning cortisol (8 to 9 am) and may consider a short Synacthen test. Any steroid medicines (tablets, inhalers, creams, injections) should be disclosed as they suppress the body's own cortisol production.","low_causes":"Adrenal insufficiency, pituitary disease, chronic cannabis use, steroid use (exogenous), chronic fatigue","high_causes":"Acute stress, Cushing's syndrome, steroid medication, depression, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folliclestimulatinghormo","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"3.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3412","lower_normal":"","upper_normal":"134.8","lower_optimal":"","upper_optimal":"20","lower_normal_position":"","upper_normal_position":"0.5","lower_optimal_position":"","upper_optimal_position":"0.0742","units":"iu_l","description":"FSH is a pituitary hormone that stimulates the ovaries to develop follicles and produce oestrogen. Rebecc function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));

      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

  const st = statusOf(b);

  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail

    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];

  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);

  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;

      <span class="bc-tick tick-${col}"></span>
