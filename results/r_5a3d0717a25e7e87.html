<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Rebecca Rodwell","dob":"24/01/1996","report_date":"2026-10-05","summary":"Rebecca is a 30-year-old female presenting with a BMI of 32.8, following a standard mixed diet rated 6 out of 10 for quality with a volume of 8 out of 10. She trains four times per week (two cardio, two resistance) with 2,000 to 5,000 daily steps. She takes tadalafil 5 mg daily when she remembers, and some supplements and di/tri-peptides. She reports cannabis use and recreational drug use. She reports weight gain and difficulty losing weight, joint pain and stiffness, and hair thinning or hair loss. Her goals are to reduce stress and anxiety, improve digestion and gut health, and balance hormones.\n\nThe strongest findings in this report are a genuinely excellent metabolic profile for someone carrying extra weight, a clean liver, healthy kidneys, and a reassuringly low Lp(a), set against two areas that need attention: a lipid pattern that is building cardiovascular risk faster than it should at 30, and a morning cortisol that came back below the laboratory range and needs a GP conversation.\n\nStarting with the positives, and there are many. Rebecca's blood sugar control is excellent. HbA1c, which is a three-month average of blood sugar, is 33.66 mmol/mol, comfortably inside the ideal band and a long way from the pre-diabetic threshold of 42. Fasting insulin at 54.9 pmol/L, C-peptide at 1.86 ng/ml, and fructosamine at 239 umol/L are all within range, meaning the pancreas is producing the right amount of insulin and blood sugar is being managed efficiently. At a BMI of 32.8, this is a genuinely reassuring set of results because it shows that insulin resistance has not yet developed, and that is a window worth protecting with the lifestyle changes discussed below. Adiponectin at 2.65 ug/ml is the one metabolic marker sitting below range (the lower limit is 3.81). Adiponectin is a hormone released by fat tissue that helps cells respond to insulin and has anti-inflammatory properties; lower levels are commonly seen at higher body fat percentages and tend to rise as weight comes down. It is not a finding for the GP, but it is a metabolic signal that supports the case for gradual fat loss.\n\nHer liver is in excellent health. ALT at 12.4, GGT at 15.2, AST below 18.7, and bilirubin at 8.42 are all well within range, and the FIB-4 score (a composite index that screens for liver scarring) is 0.76, which rules out any meaningful fibrosis. The APRI score of 0.222 and NAFLD fibrosis score of negative 1.744 confirm the same picture. At a BMI above 30, where fatty liver is common, a liver this clean is a genuine positive.\n\nKidney function is strong. Creatinine is 80.1 umol/L, cystatin C is 0.87 mg/L, and the eGFR from cystatin C (which is more reliable than the creatinine-based eGFR at higher body weight) is 98 ml/min, comfortably above the 90 threshold for full function. The microalbumin-to-creatinine ratio at 0.3 is essentially zero, meaning there is no protein leaking into the urine. Urea, uric acid, and beta-2-microglobulin are all within range.\n\nHer thyroid is working well. TSH (thyroid stimulating hormone, the brain's signal telling the thyroid how hard to work) is 0.958, inside the ideal band of 1.0 to 2.5, and just fractionally below. Free T4 at 15.40 and free T3 at 4.60 are both within their ideal ranges, and the FT3-to-FT4 ratio of 0.299 confirms healthy conversion. Both thyroid antibodies, anti-TPO and anti-thyroglobulin, are negative, which rules out autoimmune thyroid disease. This is important because Rebecca reports hair thinning, which can be thyroid-driven, and in this case the thyroid is not the explanation.\n\nCoeliac antibodies are negative, rheumatoid factor is below the detection threshold, and anti-CCP antibodies (a more specific test for rheumatoid arthritis) are negative. Rebecca reports joint pain and stiffness, and these results are useful because they make inflammatory arthritis and coeliac disease very unlikely explanations. The joint symptoms are more likely related to the extra weight placing mechanical load on the joints, and may improve as body composition changes.\n\nLp(a), which is lipoprotein(a), a genetically inherited particle that deposits cholesterol and promotes clotting, is 13.7 nmol/L, well below the 32 nmol/L ideal threshold and far below the 75 risk threshold. This is genuinely useful information because it means the elevated LDL and the unfavourable lipid ratios in this report are driven entirely by modifiable factors, not by an inherited particle that cannot be changed. It also means Rebecca's first-degree relatives do not need Lp(a) testing on her account.\n\nHomocysteine at 7.5 umol/L is inside the ideal range below 9. D-dimer is undetectable. The cardiac markers, troponin T, CK-MB, myoglobin, and FABP-3, are all well within range. The cancer screening panel is entirely clear, with every tumour marker within its reference range and hCG below 0.2, confirming she is not pregnant. H. pylori antibodies are negative. Epstein-Barr virus serology shows no evidence of current or past infection. Gastric parietal cell antibodies are negative, which rules out autoimmune gastritis as a cause of any digestive symptoms.\n\nNow to the two findings that need attention.\n\nThe lipid panel tells a clear story. Total cholesterol is 5.18 mmol/L, above the 5.0 target. LDL cholesterol is 3.82 mmol/L, above the 3.0 target. HDL cholesterol, the protective fraction that carries cholesterol away from artery walls, is 1.01 mmol/L, which is below the 1.55 lower limit for women. The total cholesterol to HDL ratio is 5.13, above the 5.0 ceiling, and the ApoB-to-ApoA1 ratio (the single best summary of cardiovascular lipid risk, comparing the number of particles depositing cholesterol against the number removing it) is 1.07, above the 0.9 threshold and above the stricter 0.6 threshold for women. ApoB itself, at 111 mg/dl (equivalent to 1.11 g/L), is above the ideal target of 0.8 g/L. What makes this pattern distinctive is that the problem is not simply high LDL; it is the combination of elevated LDL and low HDL, which means cholesterol is being deposited faster than it is being removed. Small dense LDL, the most damaging sub-fraction, is 26.69 mg/dl, which is well within range and suggests the LDL particles are mostly large and buoyant rather than small and dense. Triglycerides at 0.76 mmol/L are excellent, and VLDL cholesterol at 0.35 is low. The Lp(a)-corrected LDL is 3.78, confirming that almost all the LDL is modifiable. The cardiovascular risk score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 60, which is above the 40 action threshold. At 30, Rebecca's ten-year risk of a cardiovascular event is low simply because of her age, but the score measures the risk being built, and the gap between the two is the window for acting. The drivers are the low HDL and the elevated ApoB. The good news is that every component of this pattern responds to the same set of changes: regular aerobic exercise raises HDL more reliably than any other intervention, gradual fat loss improves the ratio, and increasing soluble fibre, oily fish, and reducing saturated fat lower LDL. These changes are outlined in the lifestyle section below.\n\nThe second finding is her morning cortisol. Cortisol is the hormone produced by the adrenal glands that regulates the stress response, energy, blood pressure, and immune function. It follows a daily rhythm, peaking in the early morning and falling through the day. Rebecca's cortisol was drawn during the morning window and came back at 120 nmol/L, below the laboratory lower limit of 138. A single low morning cortisol does not diagnose adrenal insufficiency, but it is a result that should not be left uninvestigated. We would recommend Rebecca discusses this with her GP, who may wish to repeat the cortisol at 8 to 9 am as a first step, and if it is confirmed low, may consider a short Synacthen test (a stimulation test that checks whether the adrenal glands can respond to a challenge). It is important to mention to the GP any steroid medicines of any kind, whether tablets, inhalers, creams, nasal sprays or injections, past or present, because exogenous steroids are the most common reason for a suppressed morning cortisol. Cannabis use can also influence the hypothalamic-pituitary-adrenal axis, and this is worth mentioning to the GP as well. Low cortisol could contribute to the fatigue, difficulty losing weight, and stress sensitivity that Rebecca describes, so investigating this is worthwhile.\n\nhsCRP (high sensitivity C-reactive protein, a marker of systemic inflammation) is 1.23 mg/L, above the ideal threshold of 1.0 but below the 3.0 level that would indicate clinically significant inflammation. At a BMI of 32.8, a mildly elevated CRP is most commonly driven by adipose tissue itself, which is metabolically active and produces low-grade inflammation. This is consistent with the low adiponectin. As body composition improves, CRP typically falls. Complement C3 at 1.631 is marginally above the 1.6 upper limit, which is a very small exceedance and is commonly seen alongside mild systemic inflammation. It does not indicate complement activation or immune disease on its own.\n\nASO (antistreptolysin O) is 255.9 IU/ml, above the 200 upper limit. ASO is an antibody the immune system produces after a streptococcal infection (such as strep throat or a skin infection). An elevated level means Rebecca has had a streptococcal exposure at some point in the recent past, and the antibody is still circulating. In the absence of current symptoms of rheumatic fever (joint swelling, rash, chest pain) or kidney inflammation (which the normal kidney markers rule out), this is most likely a residual titre from a past infection that is resolving. It does not need treatment, but if Rebecca has had a recent sore throat or skin infection, it is worth mentioning to the GP for context.\n\nEpidermal Growth Factor (EGF) at 17 pg/ml is below the 29 lower limit. EGF is a signalling protein involved in tissue repair and cell growth. Mildly low levels are a non-specific finding that can be seen with inflammation, low platelet activation, or simply sample variation, and in isolation it does not point to a specific condition. It is noted for completeness but is not a concern.\n\nVitamin B12 is 876 ng/L, above the laboratory upper limit of 771. Active B12, which measures the fraction of B12 that cells can actually use, is 107.0 pmol/L, well within range. This pattern, a high total B12 with a normal active B12, is most commonly seen with B12 supplementation. If Rebecca is taking a B12 supplement, this explains the result entirely and is not a concern. If she is not supplementing, it would be worth mentioning to her GP at the next visit, although the normal active B12 is reassuring.\n\nVitamin D at 84 nmol/L is within the laboratory range but below the ideal band of 75 to 120. At a BMI above 30, vitamin D is sequestered in fat tissue, meaning a higher intake is needed to maintain adequate blood levels. A maintenance dose of 3,000 to 4,000 IU daily through the autumn and winter months would be reasonable to bring this into the upper part of the ideal range.\n\nFolic acid at 7.2 ug/L is within the laboratory range of 3 to 26.8 but just below the ideal threshold of 8. Red cell folate at 817.52 is healthy, suggesting tissue stores are adequate, but a modest increase in folate-rich foods (dark leafy greens, legumes, fortified grains) or a methylfolate supplement would be reasonable.\n\nZinc at 11.2 umol/L is within range but below the ideal of 12. Zinc is important for immune function, wound healing, hair growth, and hormone metabolism, and given Rebecca's report of hair thinning, optimising zinc is worthwhile.\n\nIron status shows ferritin at 19.14 ug/L, which is within the laboratory range (lower limit 15) but below the ideal threshold of 40 for women. Ferritin is the body's iron storage protein, and at this level there is very little reserve. Iron at 13.5, transferrin at 2.89, TIBC at 63.2, and transferrin saturation at 21.4% are all within range but the saturation is below the ideal 25%. This pattern, low stores with adequate circulating iron, means the body is managing for now but has no buffer. Low ferritin is a common contributor to hair thinning and fatigue in women of reproductive age and is worth addressing with both diet and supplementation.\n\nHer reproductive hormones are consistent with a luteal phase reading. Oestradiol at 910.0 pmol/L and progesterone at 43.10 nmol/L are both within range and suggest the blood was drawn in the luteal phase (the second half of the menstrual cycle, after ovulation). LH at 12.9, FSH at 3.18, and prolactin at 252 are all within range. Testosterone at 1.030 nmol/L is within the female range, SHBG at 33.10 is at the lower end of range (lower limit 32.4), and the free androgen index at 3.11 is within range. Free testosterone at 0.018 nmol/L and bioavailable testosterone at 0.45 nmol/L are both within their ideal bands. DHEA-S at 3.8 umol/L is within range. The LH-to-FSH ratio is 4.06, which is above the ideal threshold of 2. An elevated LH-to-FSH ratio in a woman of reproductive age can be associated with polycystic ovary syndrome (PCOS), although the ratio alone does not diagnose it. Given that Rebecca reports weight gain, hair thinning, and difficulty losing weight, and given the low HDL and mildly raised CRP (all of which can cluster in PCOS), it would be worth discussing this pattern with her GP, who may wish to arrange a pelvic ultrasound and a repeat hormone panel in the early follicular phase (days 2 to 5 of the cycle) to assess this properly.\n\nIGF-1 at 25.5 nmol/L is within range. Magnesium at 0.930 mmol/L is within the ideal band. Calcium (adjusted) at 2.21 is at the very bottom of the range (lower limit 2.2), and PTH at 2.6 is within range. This is technically within limits but worth watching; it does not need action now.\n\nThe blood count was analysed later than ideal, and the laboratory noted that the sample was received outside its stability window. Two values, MCHC at 307 (below the 320 lower limit) and monocytes at 0.90 (above the 0.8 upper limit), are most likely an effect of sample age rather than genuine findings. Red cells swell slightly in stored samples, which lowers the MCHC calculation, and white cell differentials can shift. The remaining blood count markers, haemoglobin at 126, red cell count at 4.18, MCV at 98.3, platelets at 211, and white cell count at 6.32, are all within range. A repeat full blood count is only needed if symptoms warrant it.\n\nPhenoAge, a biological ageing estimate built from albumin, creatinine, CRP, alkaline phosphatase, white cell count, lymphocyte percentage, MCV, and red cell distribution width, is 26.2 years against a calendar age of 30, which is 3.8 years younger. This is a positive result and reflects the strong metabolic, liver and kidney health in this report.\n\nIn summary, Rebecca's metabolism, liver, kidneys, thyroid, and cancer screening are all in excellent shape. The two areas to act on are the lipid pattern, which is modifiable through exercise, diet and gradual fat loss, and the low morning cortisol, which needs a GP conversation and a repeat test. The LH-to-FSH ratio and the cluster of symptoms around weight, hair and difficulty losing weight are worth exploring with the GP as a possible PCOS picture. Iron stores and zinc are below ideal and are worth supplementing, particularly given the hair thinning.","links":"The findings in this report cluster around two connected themes and one independent one.\n\nThe first theme is body composition and its downstream effects. At a BMI of 32.8 with an estimated body fat of 40.9%, Rebecca is carrying a significant amount of metabolically active adipose tissue. This tissue drives the low HDL (adipose tissue reduces the production and increases the clearance of HDL particles), the low adiponectin (paradoxically, the more fat tissue there is, the less adiponectin it produces, which impairs insulin sensitivity), and the mildly elevated hsCRP (fat cells release inflammatory cytokines). The slightly raised complement C3 fits this pattern too, as it is an acute-phase protein that tracks with low-grade inflammation. The positive news is that the metabolic machinery downstream of this, insulin, C-peptide, HbA1c, and fructosamine, is all working well, meaning insulin resistance has not yet developed. This is the window to act: the lipid pattern and the inflammation are reversible with gradual fat loss and increased aerobic exercise, and the metabolic health suggests the body will respond well.\n\nThe second theme is the lipid profile itself. The elevated LDL (3.82), elevated ApoB (1.11 g/L), low HDL (1.01), and an ApoB-to-ApoA1 ratio of 1.07 paint a picture of net cholesterol accumulation in artery walls. The reassurance here is that Lp(a) is low at 13.7, meaning none of this is genetically fixed, and small dense LDL is low at 26.69 mg/dl, meaning the LDL particles are mostly the larger, less harmful type. Triglycerides are excellent. The cardiovascular risk score of 60 is driven almost entirely by the HDL and ApoB, and those are the levers to pull.\n\nThe third finding, the low morning cortisol at 120 nmol/L, stands somewhat independently. While chronic stress and high body fat can influence the hypothalamic-pituitary-adrenal axis, cortisol below the morning range is not a typical consequence of weight alone and needs its own investigation. Cannabis use can suppress cortisol production through effects on the HPA axis, and any exogenous steroid use (even topical creams or nasal sprays) can suppress adrenal output. The GP needs to know about all of these when assessing the result.\n\nThe LH-to-FSH ratio of 4.06 may connect to both themes. In PCOS, elevated LH relative to FSH drives androgen production, which can contribute to hair thinning, weight gain concentrated around the abdomen, and an unfavourable lipid profile. Rebecca's androgens are within the female range, but the ratio, combined with the symptom profile and the metabolic picture, is enough to warrant formal assessment.\n\nWhat was excluded is important. The thyroid is not driving the weight gain or hair loss: TSH, FT4, FT3, and both antibodies are all normal. Coeliac disease is excluded. Rheumatoid arthritis is excluded by negative RF and anti-CCP. The liver is not under metabolic strain despite the elevated BMI. The kidneys are functioning fully. There is no iron overload, no B12 deficiency, no vitamin D deficiency requiring urgent correction, and no evidence of current infection or active autoimmune disease.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, chicken, fish, or a protein shake. Anchor: protein goes on the plate before anything else. Why: at 110 kg with an estimated lean mass of 65 kg, Rebecca needs at least 143 g of protein a day to protect muscle during fat loss, and most people eating a standard mixed diet are well below that at breakfast and lunch.\nSwap refined carbohydrates (white bread, pasta, pastries, sugary cereals) for whole grains, oats, sweet potato, or legumes, one meal at a time, starting with whichever meal currently has the most processed carbohydrate. Why: slower carbohydrates improve the lipid profile, keeping triglycerides low and helping raise HDL over time.\nEat two portions of oily fish a week (salmon, mackerel, sardines, trout). Anchor: pick two fixed days, such as Monday and Thursday, so it becomes routine. Why: omega-3 from oily fish lowers ApoB, raises HDL, and has anti-inflammatory effects that will help bring hsCRP below 1.0.\nAdd a 20-minute walk after the largest meal of the day, every day. Anchor: plate in the sink, shoes on. Why: a post-meal walk blunts the glucose and insulin response to that meal, and at 2,000 to 5,000 daily steps, total movement is the single easiest lever to pull. Aim to build to 7,500 steps a day over the next month.\nAdd one extra resistance session per week, building from two to three. Anchor: attach it to an existing gym day or a fixed weekday. Why: resistance training raises HDL, improves insulin sensitivity, protects lean mass during a calorie deficit, and increases BMR. At a BMI of 32.8, the return on each session is large.\nIncrease soluble fibre: oats, beans, lentils, flaxseed, apples, and psyllium husk. Start with one additional portion a day and build up gradually to avoid bloating. Why: soluble fibre directly lowers LDL cholesterol by binding bile acids in the gut, forcing the liver to pull LDL from the blood to make more.\nAim for a calorie intake of around 2,200 kcal per day, with at least 143 g of protein. This is roughly 300 kcal below estimated expenditure and will produce a steady, sustainable fat loss of around 0.3 to 0.5 kg per week. The first milestone is 100 kg; the longer-term target is around 83 kg, where BMI reaches the healthy range.\nReduce or stop cannabis use, particularly in the weeks before the repeat cortisol test, and discuss all recreational drug use honestly with the GP. Why: cannabis suppresses the hypothalamic-pituitary-adrenal axis and may be contributing to the low cortisol, and recreational drugs can influence cardiovascular risk, hormonal balance, and mental health in ways that the blood cannot always detect.","flags":"Cortisol 120 nmol/L, below the morning range of 138 to 690, drawn during the morning window. A single low morning cortisol needs confirmation and investigation. Recommend repeat early-morning (8 to 9 am) cortisol via GP, with consideration of a short Synacthen test if confirmed low. Any past or current steroid use (tablets, inhalers, creams, injections, nasal sprays) and cannabis use should be disclosed to the GP as both can suppress adrenal output.\nLipid pattern: LDL 3.82 mmol/L (target below 3.0), HDL 1.01 mmol/L (below the 1.55 lower limit for women), total cholesterol to HDL ratio 5.13 (above 5.0), ApoB 111 mg/dl (above the 80 mg/dl ideal), ApoB-to-ApoA1 ratio 1.07 (above the 0.6 threshold for women). Cardiovascular risk score 60 out of 100. Lp(a) is low at 13.7 nmol/L and small dense LDL is low, confirming this pattern is entirely modifiable through lifestyle. Driven by low HDL and elevated ApoB rather than by an inherited particle.\nLH-to-FSH ratio 4.06 (ideal below 2.0), in the context of weight gain, difficulty losing weight, hair thinning, low HDL, and mildly raised CRP. This pattern could be consistent with polycystic ovary syndrome. Recommend early follicular phase (day 2 to 5) hormone panel and pelvic ultrasound via GP.\nAdiponetin 2.65 ug/ml, below the 3.81 lower limit. Adiponectin is an insulin-sensitising, anti-inflammatory hormone produced by fat tissue; levels fall as body fat rises. Expected to improve with fat loss.\nhsCRP 1.23 mg/L, above the 1.0 ideal. Low-grade inflammation most likely driven by adipose tissue at BMI 32.8. Not clinically urgent but a marker to track as body composition changes.\nComplement C3 1.631 g/L, marginally above the 1.6 upper limit. A very small exceedance consistent with the mildly raised CRP. Not a concern in isolation.\nASO 255.9 IU/ml, above the 200 upper limit. Indicates past streptococcal exposure. In the absence of symptoms of rheumatic fever or nephritis (kidney markers are all normal), this is most likely a resolving titre. Mention to GP if there has been a recent sore throat or skin infection.\nEGF 17 pg/ml, below the 29 lower limit. A non-specific finding that can accompany inflammation or sample variation. Not a concern in isolation.\nFerritin 19.14 ug/L, within range but below the ideal of 40 for women. Transferrin saturation 21.4%, below the ideal of 25%. Low iron stores may contribute to hair thinning and fatigue. Supplementation recommended.\nFolic acid 7.2 ug/L, within range but below the ideal of 8. Red cell folate adequate at 817. Increase dietary folate or add methylfolate.\nZinc 11.2 umol/L, within range but below the ideal of 12. Relevant to hair health, immune function, and hormone metabolism.\nVitamin B12 876 ng/L, above the 771 upper limit, with active B12 normal at 107 pmol/L. Most likely explained by supplementation. If not supplementing, mention to GP.\nFull blood count was received by the laboratory outside the sample stability window. MCHC 307 (below 320) and monocytes 0.90 (above 0.8) are most likely artefacts of sample age. Remaining blood count markers are within range. Repeat FBC only if symptoms warrant it.\nReassuring negatives: Lp(a) low at 13.7, excellent HbA1c at 33.66, normal insulin and C-peptide, liver enzymes all clean with FIB-4 0.76 ruling out fibrosis, kidney function strong with eGFR (cystatin C) 98, thyroid normal with negative antibodies, coeliac antibodies negative, rheumatoid factor and anti-CCP negative, all tumour markers clear, cardiac markers clear, H. pylori negative, EBV serology negative, gastric parietal cell antibodies negative, D-dimer undetectable.\nAssays on the Randox Signature specification that their laboratory does not currently process (not outstanding, not arriving later, and not part of what the customer receives or pays for): Apolipoprotein CII, Apolipoprotein CIII, Glucose (serum and urine), Leptin, Resistin, IL-6, TNF-alpha, urinary Cystatin C, NGAL (serum and urine), Bicarbonate, KIM-1, full urine dipstick panel (bilirubin, glucose, ketones, nitrite, pH, protein, RBC, urobilinogen, WBC), Gastrin, Pepsinogen I, Pepsinogen II, PGI/PGII ratio, Gastrin-17, a large panel of interleukins and cytokines (IL-1a, IL-1b, IL-2, IL-3, IL-4, IL-6, IL-7, IL-10, IL-12p70, IL-13, IL-23, sIL-2Ra, sIL-6R, sTNFRI, sTNFRII), growth factors (Amphiregulin, TGF-alpha, VEGF), adhesion molecules (E-Selectin, L-Selectin, P-Selectin, ICAM-1, VCAM-1), MIP-1a, MMP-9, PD-1, ANA, Intrinsic Factor Antibodies, FABP-4 through FABP-9, and a panel of cytokine autoantibodies (G-CSF, GM-CSF, IFN-alpha, IL-10, IL-12p35, IL-12p40, IL-17A, IL-17F, IL-18, IL-1a, IL-1b, IL-2, IL-22, IL-4, IL-6, IL-7, IL-8, IFN-gamma, IFN-omega, TNF-alpha autoantibodies).","recommendations":"Discuss the low morning cortisol (120 nmol/L, below the 138 lower limit) with the GP. Ask for a repeat early-morning cortisol drawn between 8 and 9 am, and mention any past or present use of steroid medications of any kind (tablets, inhalers, creams, injections, nasal sprays) and cannabis use. The GP may consider a short Synacthen test if the repeat is confirmed low.\nDiscuss the LH-to-FSH ratio of 4.06 alongside the symptom picture (weight gain, difficulty losing weight, hair thinning) and ask whether a PCOS assessment is appropriate. This would typically include a hormone panel drawn on day 2 to 5 of the cycle and a pelvic ultrasound.\nDiscuss the lipid pattern: LDL 3.82, HDL 1.01, ApoB 1.11 g/L, ApoB-to-ApoA1 ratio 1.07. Ask the GP to note the cardiovascular risk score of 60 and the low Lp(a) confirming modifiability. A retest in six months will show whether lifestyle changes are shifting the pattern, and the GP can decide at that point whether medication (such as a statin) is warranted.\nMention the ASO of 255.9 if there has been a recent sore throat or skin infection, so the GP can note it in the record.\nMention the elevated B12 (876) if not taking a B12 supplement, so the GP can note it.\nAim for a calorie intake of around 2,200 kcal per day with at least 143 g of protein, increasing daily steps to 7,500 and adding a third resistance session per week. The first weight milestone is 100 kg. Retest in six months with a focus on the lipid panel (LDL, HDL, ApoB, ApoB-to-ApoA1 ratio), hsCRP, adiponectin, ferritin, zinc, folic acid, vitamin D, and a repeat cortisol (via GP before six months if they wish).","supplementation":"Vitamin D3 (cholecalciferol): 3,000 to 4,000 IU daily, taken with the meal that contains the most fat. Why: vitamin D is 84 nmol/L, within range but below the ideal of 100, and at a BMI above 30, fat tissue sequesters vitamin D, meaning a higher dose is needed to maintain adequate blood levels. Always pair with vitamin K2.\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. Why: K2 directs calcium into bone rather than arteries and is a standard companion to vitamin D supplementation.\nIron (ferrous bisglycinate): 25 mg every other day, taken with a source of vitamin C (orange juice, kiwi, or a vitamin C tablet) and away from tea, coffee, and dairy. Why: ferritin is 19.14, below the ideal of 40 for women, and transferrin saturation is 21.4%, below the ideal of 25%. Low iron stores contribute to hair thinning and fatigue. Every-other-day dosing improves absorption.\nZinc (zinc picolinate or bisglycinate): 15 mg daily, taken with food. Why: zinc is 11.2, below the ideal of 12, and zinc is important for hair growth, immune function, and hormone metabolism. Take separately from iron by at least two hours.\nOmega-3 fish oil (high-EPA formulation): 2 to 3 g of combined EPA and DHA daily, taken with food. Why: omega-3 raises HDL, lowers ApoB and triglycerides, and reduces inflammation, all of which address the lipid pattern and the hsCRP of 1.23.\nMethylfolate (5-MTHF): 400 mcg daily. Why: folic acid is 7.2, just below the ideal of 8, and methylfolate is the active form that does not require conversion.\nMagnesium (glycinate): 300 mg before bed. Why: magnesium is 0.930, within the ideal band, but supplementation supports sleep quality, stress management, and muscle recovery, all of which are relevant to Rebecca's goals of reducing stress and improving recovery.\nThe most important changes from this report are not supplements. They are increasing daily movement to at least 7,500 steps, adding a third resistance session, eating 143 g of protein a day in a modest calorie deficit of around 2,200 kcal, and getting the low cortisol assessed by the GP.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 63.7; held to 59 by a system rated \"See your GP\". Weakest systems: lipids & cardiovascular 31%, inflammation 50%, hematology 52%. Biggest drags: LDL Cholesterol, HDL Cholesterol, Non-HDL Cholesterol, Cortisol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"26.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3743","lower_normal":"","upper_normal":"35","lower_optimal":"","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4286","units":"years","description":"PhenoAge is a biological ageing estimate built from albumin, creatinine, glucose, CRP, alkaline phosphatase, white cell count, lymphocyte percentage, MCV, and red cell distribution width. Rebecca's PhenoAge is 26.2 years against a calendar age of 30, which is 3.8 years younger biologically. This is a positive result, driven by the excellent albumin, healthy creatinine, and strong metabolic markers. RDW was not measured on this panel, so a typical 13.0% to artery walls, where it accumulates over time and eventually forms plaques. Rebecca's LDL is 3.82 mmol/L, above the 3.0 target and well above the ideal of 2.6. At 30, this is a result to take seriously because the damage from LDL is cumulative over a lifetime. The good news is that with Lp(a) low and small dense LDL low, this LDL is largely the larger, less penetrative type and is modifiable through diet, exercise, and body composition changes.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet high in saturated fat, obesity, sedentary lifestyle, genetic factors, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlcholesterol","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.01","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3255","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL cholesterol is the protective fraction, often called 'good' cholesterol, because HDL particles remove cholesterol from artery walls and carry it back to the liver for disposal. Rebecca's HDL is 1.01 mmol/L, below the 1.55 lower limit for women. Low HDL is the most common lipid abnormality seen at higher body fat percentages and with low physical activity, and it is one of the biggest drivers of the unfavourable lipid ratios in this report. Regular aerobic exercise is the single most effective way to raise HDL, followed by gradual fat loss and increasing omega-3 intake.","low_causes":"Sedentary lifestyle, obesity, smoking, high-carbohydrate diet, genetic factors","high_causes":"Regular aerobic exercise, moderate alcohol intake, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"totalcholesterolhdlchole","name":"Total Cholesterol / HDL Cholesterol Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"5.13","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5130","lower_normal":"","upper_normal":"5","lower_optimal":"","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3500","units":"%","description":"The total cholesterol to HDL ratio summarises the balance between all cholesterol and the protective HDL fraction. Rebecca's ratio of 5.13 is above the 5.0 ceiling, driven by the combination of elevated total cholesterol and low HDL. This ratio is a better predictor of cardiovascular risk than total cholesterol alone.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high LDL, obesity, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1652","lower_normal":"","upper_normal":"2.3","lower_optimal":"","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2174","units":"mmol/l","description":"Triglycerides are fats carried in the blood, largely influenced by carbohydrate intake, alcohol, and metabolic health. Rebecca's triglycerides at 0.76 mmol/L are excellent, well within the ideal band below 1.0. This is a genuinely positive finding and is consistent with the healthy insulin and HbA1c results.","low_causes":"Malnutrition, hyperthyroidism, malabsorption","high_causes":"High carbohydrate or alcohol intake, obesity, insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteinai","name":"Apolipoprotein A-I","group":"LIPIDS & CARDIOVASCULAR","result":"103.5","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3537","lower_normal":"101","upper_normal":"223","lower_optimal":"120","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3822","upper_optimal_position":"0.6036","units":"mg/dl","description":"Apolipoprotein A-I is the main structural protein of HDL particles. It drives the removal of cholesterol from artery walls. Rebecca's ApoA-I at 103.5 mg/dl is just above the lower limit of 101 but well below ideal. Like HDL itself, ApoA-I responds to aerobic exercise and fat loss.","low_causes":"Sedentary lifestyle, obesity, smoking, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinb","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"111","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3915","lower_normal":"53","upper_normal":"182","lower_optimal":"","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.2791","units":"mg/dl","description":"Apolipoprotein B is the protein found on every LDL, VLDL, and Lp(a) particle. Each atherogenic particle carries exactly one ApoB molecule, so the ApoB level is effectively a count of all the particles depositing cholesterol into artery walls. Rebecca's ApoB is 111 mg/dl (1.11 g/L), within the broad laboratory range but well above the ideal target of 0.8 g/L (80 mg/dl). ApoB is considered the single best marker of cardiovascular lipid risk, and reducing it through diet, exercise and fat loss is the primary lipid goal.","low_causes":"Low LDL, hyperthyroidism, malnutrition","high_causes":"High LDL, obesity, high saturated fat diet, insulin resistance, genetic factors","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"apolipoproteinbairatio","name":"Apolipoprotein B / A-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5944","lower_normal":"","upper_normal":"0.9","lower_optimal":"","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"","description":"The ApoB-to-ApoA1 ratio is arguably the single best summary metric for lipid-driven cardiovascular risk, comparing the number of particles depositing cholesterol (ApoB) to the number removing it (ApoA-I). Rebecca's ratio is 1.07, above both the general threshold of 0.9 and the stricter 0.6 threshold recommended for women. A ratio above 1.0 means there are more atherogenic particles than protective ones. Both sides of this ratio are modifiable: exercise and fat loss raise ApoA-I, while dietary changes lower ApoB.","low_causes":"High HDL, low LDL, active lifestyle","high_causes":"Low HDL, high LDL, sedentary lifestyle, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apolipoproteine","name":"Apolipoprotein E","group":"LIPIDS & CARDIOVASCULAR","result":"4.20","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4647","lower_normal":"2.2","upper_normal":"7.3","lower_optimal":"3","upper_optimal":"6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3824","upper_optimal_position":"0.5804","units":"mg/dl","description":"Apolipoprotein E is involved in cholesterol metabolism and the clearance of triglyceride-rich particles. Rebecca's 4.20 mg/dl is within the normal and ideal range.","low_causes":"Genetic variation, low lipid levels","high_causes":"High triglycerides, genetic variation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"smallldlcholesterol","name":"Small LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"26.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2195","lower_normal":"","upper_normal":"60.8","lower_optimal":"","upper_optimal":"40","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"mg/dl","description":"Small dense LDL particles are the most damaging LDL sub-type because their small size allows them to penetrate artery walls more easily. Rebecca's small LDL at 26.69 mg/dl is well within the ideal range, which is reassuring. It means the majority of her LDL particles are the larger, less penetrative type.","low_causes":"Low LDL overall, healthy metabolism","high_causes":"Insulin resistance, metabolic syndrome, high triglycerides","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lipoproteina","name":"Lipoprotein (a)","group":"LIPIDS & CARDIOVASCULAR","result":"13.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0913","lower_normal":"","upper_normal":"75","lower_optimal":"","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2133","units":"nmol/l","description":"Lipoprotein(a), often shortened to Lp(a), is a genetically determined particle that deposits cholesterol, encourages blood clotting, and promotes inflammation in artery walls. The level is almost entirely inherited and does not change with diet or exercise. Rebecca's Lp(a) at 13.7 nmol/L is well below the 32 nmol/L ideal threshold, which is genuinely useful information. It means the elevated LDL and ApoB in this report are driven entirely by modifiable factors such as diet, exercise, and body composition, not by an inherited particle that cannot be changed. This is a permanent piece of medical information worth recording.","low_causes":"Genetic factors (favourable)","high_causes":"Genetic factors (inherited, not modifiable)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"homocysteine","name":"Homocysteine","group":"LIPIDS & CARDIOVASCULAR","result":"7.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"5","upper_normal":"20","lower_optimal":"","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0","upper_optimal_position":"0.2250","units":"umol/l","description":"Homocysteine is an amino acid that at high levels damages blood vessel walls and increases cardiovascular risk. Rebecca's homocysteine at 7.5 umol/L is well within the ideal range below 9, indicating healthy B-vitamin metabolism and no added vascular risk from this pathway.","low_causes":"Good B-vitamin status","high_causes":"B12 deficiency, folate deficiency, genetic MTHFR variants, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High Sensitivity C-Reactive Protein (hsCRP)","group":"INFLAMMATION","result":"1.23","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6150","lower_normal":"","upper_normal":"1","lower_optimal":"","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"mg/l","description":"hsCRP is a protein produced by the liver in response to inflammation anywhere in the body. It is the most widely used marker of low-grade systemic inflammation and is also used in cardiovascular risk assessment. Rebecca's hsCRP is 1.23 mg/L, above the ideal threshold of 1.0 but well below 3.0, placing her in the mildly elevated category. At a BMI of 32.8, adipose tissue is the most likely source of this low-grade inflammation, and the level is expected to fall with gradual fat loss.","low_causes":"Low body fat, absence of infection or inflammation, regular exercise","high_causes":"Obesity, infection, chronic inflammation, autoimmune disease, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"aso","name":"Antistreptolysin O (ASO)","group":"INFLAMMATION","result":"255.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6398","lower_normal":"","upper_normal":"200","lower_optimal":"","upper_optimal":"150","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3750","units":"iu/ml","description":"Antistreptolysin O (ASO) is an antibody produced by the immune system in response to infection with group A streptococcus bacteria (the cause of strep throat, scarlet fever, and some skin infections). Rebecca's ASO is 255.9 IU/ml, above the 200 upper limit. This indicates a streptococcal exposure at some point in the recent past. The antibody can remain elevated for weeks to months after the infection has cleared. In the absence of symptoms of rheumatic fever or kidney inflammation (and Rebecca's kidney markers are all normal), this is most likely a residual antibody titre that is resolving.","low_causes":"No recent streptococcal infection","high_causes":"Recent or resolving streptococcal infection, chronic carriage","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ddimer","name":"D-Dimer","group":"INFLAMMATION","result":"<0.160","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1806","lower_normal":"","upper_normal":"0.443","lower_optimal":"","upper_optimal":"0.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3386","units":"ug/ml","description":"D-dimer is a breakdown product of blood clots. A low or undetectable level effectively rules out significant clot formation anywhere in the body. Rebecca's D-dimer is below the detection threshold, which is an excellent result.","low_causes":"No significant clot formation","high_causes":"Blood clot (DVT, PE), recent surgery, inflammation, pregnancy, infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"il5","name":"Interleukin-5 (IL-5)","group":"INFLAMMATION","result":"0.86","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2886","lower_normal":"","upper_normal":"1.49","lower_optimal":"","upper_optimal":"1 al infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egf","name":"Epidermal Growth Factor (EGF)","group":"INFLAMMATION","result":"17","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2931","lower_normal":"29","upper_normal":"240","lower_optimal":"40","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5521","upper_optimal_position":"0.8112","units":"pg/ml","description":"Epidermal Growth Factor is a signalling protein that stimulates cell growth, proliferation, and tissue repair. Rebecca's EGF at 17 pg/ml is below the 29 lower limit. Mildly low EGF is a non-specific finding that can be seen with inflammation, low platelet activation, or simply as normal variation. In isolation, it does not point to a specific condition and is not a concern.","low_causes":"Low platelet activation, inflammation, sample variation","high_causes":"Active tissue repair, certain cancers, wound healing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hbegf","name":"Heparin-binding EGF-like growth factor (HB-EGF)","group":"INFLAMMATION","result":"112.40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5468","lower_normal":"17.99","upper_normal":"135.99","lower_optimal":"17.99","upper_optimal":"135.99","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pg/ml","description":"HB-EGF is a growth factor involved in wound healing, heart development, and tissue repair. Rebecca's 112.40 pg/ml is within the normal range.","low_causes":"Normal variation","high_causes":"Tissue injury, cardiac stress, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcp1","name":"Monocyte Chemotactic Protein-1 (MCP-1)","group":"INFLAMMATION","result":"131","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3377","lower_normal":"130","upper_normal":"43 ","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3074","units":"ug/l","description":"CK-MB is the heart-specific fraction of creatine kinase, an enzyme released when heart muscle is damaged. Rebecca's 0.598 ug/L is very low, ruling out any heart muscle injury.","low_causes":"Normal heart function","high_causes":"Heart attack, myocarditis, cardiac surgery","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatinekinase","name":"Creatine Kinase","group":"CARDIAC MARKERS","result":"49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4095","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"150","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3619","upper_optimal_position":"0.5714","units":"IU/L","description":"Creatine kinase (CK) is an enzyme found in muscle tissue. It rises after intense exercise, muscle injury, or in certain muscle diseases. Rebecca's CK at 49 IU/L is within the normal and ideal range, indicating no muscle stress or damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"myoglobin","name":"Myoglobin","group":"CARDIAC MARKERS","result":"22.80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1966","lower_normal":"","upper_normal":"58","lower_optimal":"","upper_optimal":"40","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3448","units":"ug/l","description":"Myoglobin is a protein in muscle tissue that stores oxygen. It is released into the blood when muscle is damaged. Rebecca's 22.80 ug/L is within the normal range, confirming no muscle injury.","low_causes":"Normal muscle state","high_causes":"Muscle injury, rhabdomyolysis, intense ex const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>

  </div>`;
}
