<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Harriet Blackmore","dob":"24/04/1980","report_date":"2026-10-07","summary":"Harriet is a 46-year-old female presenting with a BMI of 21.3, following a standard mixed diet rated 5 out of 10 for quality with a volume of 6 out of 10. She trains three times per week (three cardio sessions, no resistance training) with 10,000 to 15,000 daily steps. She takes HRT (hormone replacement therapy) and mounjaro (tirzepatide). She reports joint pain and stiffness, hair thinning, and low energy. Her goal is disease prevention. She describes herself as a runner who is worried about iron levels and chronic stiffness that has persisted for years, unrelated to exercise, recently worsened by a bout of diarrhoea.\n\nThe finding that stands out most in this report is a raised CA-125, a tumour marker, at 48.7 U/ml against an upper limit of 35. CA-125 is a protein shed by cells lining the abdomen and pelvis, and it is best known as a marker used in the investigation of ovarian cancer. Before that causes alarm, it is important to understand that CA-125 rises in a wide range of non-cancerous conditions: endometriosis, ovarian cysts, pelvic inflammatory disease, liver disease, and even during menstruation or in the luteal phase of the cycle. Her liver markers are clean and there is no ascites or kidney disease to explain it, and her other tumour markers (CA 15-3 and CA 19-9) are both well within range. Given the NICE guideline that any woman with a CA-125 above 35 should be referred for a pelvic ultrasound, we would recommend discussing this with her GP promptly. The most likely explanation is a benign gynaecological cause, but it needs to be excluded properly.\n\nHer CEA (carcinoembryonic antigen, a marker associated with bowel, lung and other cancers) is 2.39 against a non-smoker upper limit of 2.3. This is so marginally above range that it is almost certainly a normal variant, and CEA can rise slightly with any gut inflammation, which fits with her recent diarrhoea. It does not need urgent action, but it should be noted alongside the CA-125 so her GP has the full picture.\n\nThe other finding that deserves early attention is her Lp(a), which is 108.7 nmol/L against a target of below 32. Lp(a), pronounced \"lipoprotein little a\", is a genetically inherited particle that is structurally similar to LDL cholesterol but carries an additional protein called apolipoprotein(a). It deposits cholesterol into artery walls, promotes blood clotting, and drives local inflammation, making it a powerful independent risk factor for cardiovascular disease. Because it is entirely genetic, it does not change with diet, exercise, or conventional cholesterol-lowering medication. Harriet's level sits in the moderate risk category (90 to 200 nmol/L). This is a permanent finding that should be recorded in her medical notes, and her first-degree relatives (parents, siblings, children) should be offered testing because they each have a roughly 50 percent chance of carrying the same trait.\n\nThe good news is that everything else in her cardiovascular profile is exceptional. Her total cholesterol is 4.2, her LDL is just 1.74, and when the cholesterol carried by Lp(a) itself is subtracted, her Lp(a)-corrected LDL falls to only 1.39, which means the modifiable, diet-and-lifestyle-driven portion of her LDL is extremely low. Her ApoB (apolipoprotein B, the protein that sits on every atherogenic particle and is the best single measure of cardiovascular risk from lipids) is 0.63, well below the 0.8 optimal threshold. Her HDL is 2.1, which is outstanding, her triglycerides are 0.81, and her ApoB to ApoA-I ratio is 0.34, one of the lowest ratios we see. Her TG/HDL ratio is 0.39 and her atherogenic index of plasma is negative at minus 0.41, both indicating a metabolic profile that is strongly protective. In practical terms, this means the risk created by her Lp(a) is being offset to a significant degree by the quality of the rest of her lipid panel. Her cardiovascular risk score, a composite index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 35 out of 100. That score would be in the teens without the Lp(a) contribution, so the single input pulling it up is the inherited particle she cannot change. The strategy for her is to keep every modifiable risk factor as low as possible, because that is the only lever available.\n\nHer liver is in excellent health. ALT at 25 is within the tighter female optimal of below 25 (right at the boundary), GGT at 23 is below the 25 optimal threshold, AST at 32 is comfortably mid-range, and her FIB-4 score (a fibrosis screening index built from age, platelets, AST and ALT) is 1.21, well below the 1.45 threshold, confirming no sign of liver scarring. Her bilirubin at 18 is towards the upper end of the 5 to 21 range but with completely clean liver enzymes, which is consistent with a mild Gilbert's trait, a harmless inherited variation in bilirubin metabolism that affects roughly five to ten percent of people. Her amylase and lipase, enzymes from the pancreas, are both mid-range and healthy.\n\nHer blood sugar control is superb. Fasting glucose is 4.2, HbA1c (glycated haemoglobin, which reflects average blood sugar over the past two to three months) is 28 mmol/mol, and fasting insulin is 3.73, giving a HOMA-IR (a measure of how hard the body has to work to keep blood sugar in check) of 0.7, which is optimal. She is taking tirzepatide (mounjaro), a GLP-1 and GIP receptor agonist used for weight management and blood sugar regulation, and these results suggest it is working well alongside her naturally lean frame. Her C-Peptide, which the lab flagged as marginally below range at 1.09 ug/L (converting to approximately 361 pmol/L), reflects the low insulin demand of a lean, insulin-sensitive person on tirzepatide rather than any pancreatic insufficiency. The glucose and HbA1c confirm the pancreas is producing exactly the right amount of insulin for her needs.\n\nHer thyroid is working well. TSH (thyroid stimulating hormone, the brain's signal telling the thyroid how hard to work) is 2.16, FT4 (the storage hormone) is 16.6, and FT3 (the active hormone the body actually uses) is 4.8, all within the ideal range. Her FT3 to FT4 ratio is 0.29, confirming good conversion from storage to active hormone. Both thyroid antibodies (TPO and thyroglobulin) are negative, ruling out autoimmune thyroid disease. The thyroid is not contributing to her fatigue or hair thinning.\n\nHer full blood count is largely healthy. Haemoglobin at 125 is within the female range of 120 to 150, white cell count is 6.96, platelets are 243, and the differential (the breakdown of white cell types) is balanced. Her reticulocyte percentage is 0.99, which is normal, but her absolute reticulocyte count is 38.9 against a lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and an absolute count below 50 means the marrow is producing red cells at a slightly slow rate. At a haemoglobin of 125, just five points above the lower limit, this is worth watching. The bone marrow may be running slightly lean on raw materials, most likely iron.\n\nHer iron picture is mixed. Ferritin at 63 is within the laboratory range and within the female optimal band of 40 to 150, which is reassuring and suggests she is not iron-depleted. However, her transferrin (the transport protein that carries iron in the blood) is 2.27 against a lower limit of 2.5, which is unexpectedly low. Transferrin usually rises when the body needs more iron and falls in two situations: when there is too much iron (which her ferritin does not suggest) or as part of an inflammatory or acute phase response, because transferrin is a negative acute phase reactant, meaning the body suppresses its production during inflammation. Her hsCRP (high-sensitivity C-reactive protein, a measure of systemic inflammation) is 3.3 mg/L. While this is within the laboratory limit of 5, it is above the optimal threshold of 1.0 and is high enough to act as a negative acute phase driver on transferrin. Given her chronic stiffness and recent diarrhoea, this low-grade inflammatory signal could explain both the suppressed transferrin and some of her symptoms. Her serum iron at 13.9 and transferrin saturation at 24.4 percent are both adequate, so iron delivery to the tissues is not compromised at present, but the combination of borderline haemoglobin, low reticulocyte production and suppressed transferrin means she should have a repeat iron panel in three months.\n\nHer kidney function shows a finding that needs explanation. Her creatinine-based eGFR is 87, and her cystatin C (a small protein filtered by the kidneys that gives a more accurate picture of kidney function than creatinine alone, especially in lean or muscular people) is 1.13 against an upper limit of 1.1. The cystatin C-derived eGFR is 76, and the combined creatinine-cystatin C eGFR is also 76. An eGFR of 76 at age 46 is below the optimal threshold of 90 and sits in the mildly reduced category. Her urea is also slightly elevated at 8.5 against a limit of 8.2, and her urea to creatinine ratio is 118 against an upper limit of 100, which suggests a component of dehydration or high protein intake relative to fluid intake, particularly relevant for a runner. Her serum osmolality is calculated at 300.7 against an upper limit of 295, which further supports mild dehydration at the time of the sample. Dehydration concentrates cystatin C and urea and can push the eGFR down by 10 to 15 points. It is likely that with better hydration, her true eGFR would be closer to 85 to 90. That said, a cystatin C above 1.1 at 46 warrants a repeat test with deliberate hydration beforehand. We would recommend discussing this with her GP and repeating the cystatin C and urea in three months, ideally after drinking at least two litres of water the day before the test.\n\nHer uric acid at 204 is within range (184 to 464) and within the female optimal band of 160 to 320, which is a good sign for joint health and confirms her stiffness is not gout-related.\n\nHer hormonal profile reflects a woman on HRT whose cycle is still active. Her oestradiol at 165 pmol/L is consistent with a follicular phase reading, LH at 11.33 and FSH at 9.66 are both within follicular range and below the postmenopausal threshold, confirming that HRT is maintaining cyclical hormone levels. Her progesterone at 6.96 does not fit neatly into either the follicular range (below 4.45) or the luteal range (above 10.62), which may indicate she was in the early luteal transition at the time of the blood draw. Her testosterone at 0.8 is within the female range of 0.5 to 2.6 but is at the lower end, and her free testosterone (the fraction not bound to proteins and therefore available for use) is 0.007, below the lower limit of 0.01. Free testosterone matters for energy, libido, muscle recovery, hair health and mood, and a low free testosterone may be contributing to her fatigue and hair thinning. The reason it is low is her SHBG (sex hormone binding globulin, the protein that binds testosterone and takes it out of circulation) at 93.5, which is towards the upper end of range. High SHBG binds more testosterone, leaving less free. HRT, particularly oral oestrogen, raises SHBG, and tirzepatide may contribute to this as well. This is worth discussing with her HRT prescriber, as adjusting the testosterone component of her HRT (a small dose of transdermal testosterone is now commonly prescribed for perimenopausal and menopausal women) or switching to transdermal oestrogen if she is on oral could lower SHBG and improve free testosterone. Her DHEA-S at 6.4 umol/L (approximately 2,358 ug/dL) is healthy and mid-range, and her cortisol at 204 nmol/L is within the morning reference range, suggesting her adrenal function is adequate. Her prolactin at 216 is within normal limits.\n\nHer creatine kinase (CK, an enzyme released from muscle cells during damage or heavy use) is 203 against an upper limit of 200. For a runner, this is entirely expected and reflects normal muscle turnover from training. It is not a concern.\n\nHer vitamin D at 59 nmol/L is sufficient by NHS standards (above 50) but below the optimal range of 75 to 120. At her lean BMI, a dose of 2,000 to 3,000 IU daily through the autumn and winter should bring this into the ideal zone. Her B12 at 317 is within the laboratory range but below the optimal threshold of 500, and given her recent diarrhoea and gut symptoms, absorption may be impaired. Sublingual methylcobalamin (a form absorbed through the lining of the mouth, bypassing the gut) at 1,000 mcg daily would be the best route. Her folate at 11 is healthy and within the optimal band. Her calcium and corrected calcium are both at the top of range (2.55 and 2.60 respectively), parathyroid hormone is mid-range at 2.7, and magnesium at 0.97 is within the optimal band of 0.85 to 1.05. Bone mineral metabolism looks well maintained.\n\nHer immune markers are all within range. IgG, IgM, IgA and IgE are healthy, rheumatoid factor is 6 (well below the 14 threshold, which is reassuring given her joint stiffness), and coeliac screening (tissue transglutaminase IgA) is negative, ruling out coeliac disease as a cause of her diarrhoea and malabsorption symptoms. Her total antioxidant activity at 1.87 is above the upper range of 1.77, which is a positive finding indicating good antioxidant status from diet or supplementation.\n\nHer PhenoAge, a biological ageing index built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 36.6 against her calendar age of 46, meaning her blood markers suggest a biological age roughly nine and a half years younger than her actual age. This is an excellent result and reflects good metabolic health overall.\n\nHer urinalysis is clean: no protein, glucose, blood, white cells, nitrites or casts. Bacterial culture and sensitivities are pending and will be reported when available.\n\nTurning to the symptoms that brought Harriet to this test, the chronic joint stiffness is the most important thread. Rheumatoid factor is negative, coeliac disease is excluded, uric acid is normal, and there is no sign of a systemic autoimmune process in her immunoglobulins. However, her hsCRP at 3.3 is a genuine low-grade inflammatory signal, and her suppressed transferrin supports this. The stiffness she describes, present even without exercise, worsened by a bout of diarrhoea, and lasting years, could reflect a systemic inflammatory process that blood tests alone cannot fully characterise. Possible drivers include a gut-related inflammatory condition (given the diarrhoea), a connective tissue or hypermobility issue (common in lean female runners), or an early inflammatory arthropathy that has not yet produced a positive rheumatoid factor (seronegative inflammatory arthritis). We would recommend her GP considers inflammatory markers including ESR (which is reassuringly low at 2, arguing against a florid inflammatory arthritis) and potentially refers for a specialist rheumatology or gastroenterology opinion depending on which symptom, the stiffness or the diarrhoea, is felt to be the primary driver. If the diarrhoea has been going on for years alongside joint stiffness, inflammatory bowel disease (Crohn's disease or ulcerative colitis) should be considered, as joint symptoms are one of the most common extra-intestinal manifestations of IBD. A faecal calprotectin test, which measures gut inflammation directly, would be a useful next step.\n\nHer hair thinning is most likely related to the low free testosterone and possibly suboptimal iron delivery, though her ferritin at 63 is adequate. Thyroid causes have been excluded. If adjusting testosterone through HRT does not improve it, a dermatology opinion or trichology assessment would be reasonable.\n\nHer fatigue has multiple plausible contributors: the low free testosterone, the suboptimal B12, the low-grade inflammation, the possible gut absorption issue, and the vitamin D sitting below optimal. None of these alone would cause significant fatigue, but together they form a pattern of mild systemic under-resourcing that can sap energy over time. Addressing each of them, through supplementation, hydration, and a conversation with her HRT prescriber about free testosterone, should produce a noticeable improvement.","links":"The central thread running through this report is a low-grade inflammatory process that connects several apparently separate findings. Harriet's hsCRP at 3.3 is above the optimal threshold of 1.0, her transferrin is suppressed below range at 2.27 (transferrin falls during inflammation as part of the acute phase response), and her absolute reticulocyte count is low at 38.9, suggesting the bone marrow is not producing red cells at full capacity. She has chronic joint stiffness lasting years, recent diarrhoea, and fatigue. These pieces fit together: a smouldering inflammatory process, potentially arising from the gut, is suppressing transferrin, mildly dampening red cell production, and driving chronic stiffness. The negative rheumatoid factor and low ESR argue against a classic rheumatoid arthritis, but seronegative inflammatory arthritis and the extra-intestinal joint manifestations of inflammatory bowel disease are both consistent with this picture.\n\nThe second thread is hormonal. Her SHBG is high at 93.5, likely driven by HRT and possibly tirzepatide, and this is binding her testosterone tightly enough that her free testosterone has fallen below range at 0.007. Low free testosterone contributes to fatigue, difficulty recovering from training, hair thinning, and reduced muscle protein synthesis, all of which she reports or is at risk of. This is a modifiable finding: a small dose of transdermal testosterone prescribed alongside her HRT, or a switch from oral to transdermal oestrogen to lower SHBG, could improve the free fraction meaningfully.\n\nThe third thread is the Lp(a) at 108.7, which is entirely separate from everything else. It is genetic, fixed, and permanent. What makes it manageable is that every other cardiovascular marker is excellent: ApoB 0.63, LDL 1.74 (Lp(a)-corrected LDL only 1.39), HDL 2.1, triglycerides 0.81. The cardiovascular risk score of 35 is being driven almost entirely by Lp(a), and the modifiable component of her risk is minimal. The strategy is to keep it that way and to ensure her GP records the Lp(a) result permanently.\n\nThe kidney findings (cystatin C 1.13, eGFR 76, urea 8.5, osmolality 300.7) are most likely explained by dehydration at the time of the blood draw, which is common in runners. A repeat test with deliberate hydration will clarify whether the eGFR is genuinely reduced or was an artefact of fluid status. The CA-125 at 48.7 does not connect to the inflammatory or hormonal threads and needs its own investigation via pelvic ultrasound. The CEA at 2.39, barely above the non-smoker limit, is most likely a reflection of the gut inflammation and does not warrant separate investigation unless the CA-125 workup raises further questions.\n\nWhat has been excluded is clinically useful. Coeliac disease is negative, thyroid autoimmunity is absent, rheumatoid factor is negative, kidney scarring markers are clean, liver fibrosis is excluded, and there is no sign of iron deficiency despite her concerns. These exclusions narrow the diagnostic search significantly and should be shared with her GP.","lifestyle":"Add a portion of oily fish (salmon, mackerel, sardines) twice a week, or increase to three times if you already eat it once. Anchor: your main evening meal on two fixed days. Why: omega-3 fatty acids lower hsCRP (yours is 3.3, above the 1.0 optimal) and support joint comfort, which is your main complaint.\nAdd one resistance training session per week, starting with bodyweight exercises: squats, lunges, press-ups and a plank. Anchor: a fixed day when you are not running. Why: you currently do zero resistance work, and resistance training builds the lean mass that protects joints from the repetitive impact of running, supports bone density at 46, and improves free testosterone utilisation.\nDrink at least two litres of water on non-running days and two and a half litres on running days, starting with a large glass first thing in the morning. Anchor: fill a bottle the night before and place it next to your bed. Why: your urea, osmolality and cystatin C all suggest you were dehydrated at the time of this test, which may be affecting your kidney readings and your joint stiffness.\nAdd two to three portions of vegetables or salad to your daily intake, aiming for at least five portions of fruit and vegetables a day. Anchor: add a side salad or vegetable to every main meal, starting with lunch this week. Why: your diet quality is rated 5 out of 10, and increasing plant intake provides soluble fibre (which feeds gut bacteria and may help the diarrhoea), antioxidants, and anti-inflammatory polyphenols.\nEat a palm-sized portion of protein at every meal, including breakfast. Anchor: eggs, Greek yoghurt, smoked salmon or leftover chicken before anything else on the plate. Why: at 60 kg with regular running, you need roughly 78 to 96 grams of protein a day to support muscle repair, hair growth and immune function. Spreading it across meals improves absorption.\nSet a fixed wake time seven days a week and get outside within an hour of waking for at least ten minutes of natural light. Anchor: shoes by the door, walk before coffee. Why: morning light exposure sets your circadian rhythm, supports cortisol's natural morning rise, and improves energy through the day, which matters given your fatigue.\nAim for a daily calorie intake of approximately 1,800 to 2,000 kcal on rest days and 2,100 to 2,300 kcal on running days. Why: at 60 kg, 168 cm, with your activity level, your estimated TDEE is around 2,100 kcal; eating below 1,800 risks under-fuelling, which could explain your low reticulocyte count and low free testosterone.","flags":"CA-125 is 48.7 U/ml, above the upper limit of 35. NICE guideline NG12 recommends pelvic ultrasound for any woman with CA-125 above 35 to exclude ovarian pathology. Other tumour markers (CA 15-3 and CA 19-9) are within range. Likely benign gynaecological cause but must be investigated.\nLp(a) is 108.7 nmol/L, above the 32 nmol/L threshold, placing her in the moderate inherited cardiovascular risk category. This is genetic and permanent. Should be recorded in her medical notes and first-degree relatives offered testing. All modifiable lipid markers are excellent (ApoB 0.63, LDL 1.74, HDL 2.1, triglycerides 0.81).\nCystatin C is 1.13 mg/L (above 1.1 limit), giving a cystatin C-based eGFR of 76 and combined eGFR of 76 at age 46. Urea is 8.5 (above 8.2 limit), urea:creatinine ratio is 118 (above 100), and calculated osmolality is 300.7 (above 295), all consistent with dehydration at the time of sampling. Recommend repeat cystatin C and renal profile in three months with deliberate hydration beforehand.\nhsCRP is 3.3 mg/L, above the optimal threshold of 1.0 though within the laboratory limit of 5. This is a genuine low-grade inflammatory signal that may relate to her chronic joint stiffness and gut symptoms. Transferrin is suppressed at 2.27 g/L (below 2.5 lower limit), consistent with an acute phase response driven by the inflammation.\nAbsolute reticulocyte count is 38.9, below the lower limit of 50, indicating slightly reduced red cell production by the bone marrow. Haemoglobin is 125, just above the lower limit of 120. In the context of suppressed transferrin and raised CRP, this may reflect inflammation-driven suppression of erythropoiesis.\nFree testosterone (calculated) is 0.007 nmol/L, below the lower limit of 0.01, driven by high SHBG at 93.5. Total testosterone at 0.8 is within range. Low free testosterone may contribute to fatigue, hair thinning and poor muscle recovery. Discuss with HRT prescriber regarding transdermal testosterone supplementation or switching oestrogen delivery route.\nCEA is 2.39 ng/ml, marginally above the non-smoker upper limit of 2.3. At this margin, most likely reflects gut inflammation rather than malignancy. Should be noted alongside the CA-125 finding.\nC-Peptide is 1.09 ug/L (approximately 361 pmol/L), marginally below the lower limit of 1.1 ug/L. In the context of normal glucose (4.2), excellent HbA1c (28), and tirzepatide use, this reflects low insulin demand rather than pancreatic insufficiency.\nCreatine kinase is 203 U/L, marginally above the upper limit of 200. Expected finding in an active runner and not clinically significant.\nReassuring negatives: thyroid function and antibodies normal (TSH 2.16, FT4 16.6, FT3 4.8, TPO and thyroglobulin antibodies negative), coeliac disease excluded (tTG IgA negative), rheumatoid factor negative at 6 (limit 14), liver function excellent (ALT 25, GGT 23, FIB-4 1.21), blood sugar control optimal (HbA1c 28, HOMA-IR 0.7), immunoglobulins all within range, uric acid normal, ESR 2, urinalysis clean.","recommendations":"Discuss the CA-125 result of 48.7 (above 35) with your GP and request a pelvic ultrasound as recommended by NICE guideline NG12. Bring this report showing the normal CA 15-3 and CA 19-9 results.\nAsk your GP to record your Lp(a) of 108.7 nmol/L permanently in your medical notes and to offer testing to your first-degree relatives (parents, siblings, children). Discuss whether any additional cardiovascular risk reduction measures are warranted given the moderate Lp(a) alongside your otherwise excellent lipid profile.\nDiscuss the cystatin C of 1.13 and combined eGFR of 76 with your GP. Request a repeat renal profile including cystatin C in three months, ensuring you are well hydrated the day before. Bring the urea (8.5) and osmolality (300.7) results that suggest dehydration was a factor.\nDiscuss your chronic joint stiffness and recurrent diarrhoea with your GP. Request a faecal calprotectin test to assess for gut inflammation, as the combination of joint stiffness and chronic diarrhoea raises the possibility of inflammatory bowel disease. If calprotectin is raised, a gastroenterology referral would be appropriate.\nDiscuss your free testosterone of 0.007 (below 0.01) with your HRT prescriber. A small dose of transdermal testosterone (typically a pea-sized amount of 2% testosterone cream or gel daily) may improve energy, hair quality and muscle recovery. If you are on oral oestrogen, switching to transdermal oestrogen may lower SHBG and improve free testosterone without additional testosterone supplementation.\nRepeat the hsCRP in three months to determine whether 3.3 is a transient finding related to the diarrhoea or a persistent baseline. If it remains above 2.0, further investigation of the inflammatory source is warranted.\nCalorie target: 1,800 to 2,000 kcal on rest days, 2,100 to 2,300 kcal on running days. Protein target: 78 to 96 grams per day (1.3 to 1.6 g/kg). Retest in three to four months: cystatin C, renal profile, full blood count with reticulocytes, iron studies, hsCRP, vitamin D, B12, and free testosterone.","supplementation":"Vitamin D3 (cholecalciferol): 2,000 to 3,000 IU daily, taken with a meal containing fat. Why: your vitamin D is 59 nmol/L, below the optimal range of 75 to 120. At your lean BMI, this dose should bring you into the ideal zone within three months. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 mcg daily, taken alongside your vitamin D. Why: K2 directs calcium into bones and teeth rather than soft tissue, and should always accompany vitamin D supplementation, especially with your corrected calcium already at the top of range (2.60).\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Why: your B12 is 317 pg/ml, within the laboratory range but below the optimal threshold of 500. Sublingual absorption bypasses the gut, which matters given your diarrhoea and possible absorption issues.\nOmega-3 fish oil: 2 grams of combined EPA and DHA daily, taken with food. Why: omega-3 fatty acids lower hsCRP (yours is 3.3), support joint comfort, and are cardioprotective, which matters with your elevated Lp(a).\nMagnesium glycinate: 300 mg before bed. Why: your magnesium at 0.97 is within the optimal band, but supplementation supports sleep quality, muscle recovery after running, and may help with joint stiffness. Glycinate is the best-absorbed form and has a mild calming effect.\nDo not take iron supplements. Your ferritin at 63 is within the optimal range for women, and your serum iron and transferrin saturation are adequate. The low transferrin is driven by inflammation, not iron deficiency, and supplementing iron when stores are sufficient can cause gut irritation and worsen diarrhoea.\nThe most important changes from this report are not supplements. They are the GP conversations about CA-125, kidney function and the gut-joint connection, the discussion with your HRT prescriber about free testosterone, consistent hydration, and adding resistance training to support the joints that running loads every day.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5182","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 57 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 57.3. Weakest systems: iron studies 25%, inflammation 27%, lipids & cardiovascular 37%. Biggest drags: Lipoprotein(a), Urea, Reticulocytes (Absolute), Transferrin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"36.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3588","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is a biological ageing index calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Harriet's PhenoAge of 36.6 against her calendar age of 46 means her blood markers suggest a biological age roughly nine and a half years younger than her actual age. This is an excellent result driven by her healthy glucose, strong albumin, low ALP and healthy blood counts. The main marker holding PhenoAge back from being even lower is her hsCRP of 3.3; reducing inflammation could improve it further.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It has no age term and measures the risk being built regardless of age. Harriet's score of 35 is within the acceptable range of below 40 but above the ideal threshold of below 20. The score is being driven almost entirely by her Lp(a) of 108.7 and hsCRP of 3.3. All modifiable lipid inputs (ApoB 0.63, LDL 1.74, HDL 2.1, triglycerides 0.81) and HbA1c (28) are excellent. The strategy is to keep every modifiable factor as low as possible and to address the hsCRP, which is the only component she can influence.","low_causes":"","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Fasting blood glucose is the amount of sugar in the blood after an overnight fast. Harriet's level of 4.2 is within the ideal range of 4.0 to 5.4 mmol/L, indicating excellent blood sugar control. This is consistent with her lean frame and the blood sugar-lowering effects of tirzepatide.","low_causes":"Fasting, excessive exercise, medication effects","high_causes":"Diabetes, insulin resistance, stress, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3917","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c me   if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  if(norm(dob.value)===norm(data.dob)){

    runIntro();
  } else {

  }
}
