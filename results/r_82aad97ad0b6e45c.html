<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Harriet Blackmore","dob":"24/04/1980","report_date":"2026-10-07","summary":"Harriet is a 46-year-old female presenting with a BMI of 21.3, following a standard mixed diet rated 5 out of 10 for quality with a volume of 6 out of 10. She trains three times per week (three cardio sessions, no resistance training) with 10,000 to 15,000 daily steps. She is on HRT and also takes tirzepatide (Mounjaro). She reports joint pain and stiffness, hair thinning, and low energy. Her goals are disease prevention. She describes herself as a runner who is worried about iron levels and chronic stiffness that persists even during weeks without exercise, and notes that it has been exacerbated by a bout of diarrhoea recently and has been going on for years.\n\nThe finding in this report that warrants the most immediate attention is her CA-125, a tumour marker called cancer antigen 125. Her result is 48.7 U/ml, above the upper limit of 35. CA-125 is a protein produced by cells on the surface of the ovaries and other tissues, and it is the marker GPs use as part of the investigation pathway for ovarian cancer. However, it is important to understand that CA-125 is not specific to cancer. It rises with endometriosis, ovarian cysts, pelvic inflammatory disease, fibroids, liver disease, and even with menstruation and perimenopause. Given that Harriet is 46, on HRT, and therefore likely perimenopausal, there are several benign explanations. Her oestradiol at 165 pmol/L sits in the follicular or early luteal range rather than the postmenopausal range, and her FSH at 9.66 is still within the premenopausal follicular range, which suggests she may still be cycling or that her HRT is maintaining hormone levels. Nevertheless, NICE guidelines are clear: a CA-125 above 35 in a woman with symptoms should trigger a pelvic ultrasound. The joint pain and abdominal symptoms she describes make this investigation proportionate and straightforward, and we would recommend she discusses this with her GP promptly. The most likely outcome is a benign explanation, but the scan is the way to confirm that.\n\nHer CEA, another tumour marker called carcinoembryonic antigen, is 2.39 ng/ml against a non-smoker upper limit of 2.3. This is a marginal elevation of 0.09 above the threshold. CEA can be raised by inflammation, and her CRP at 3.3 provides a plausible explanation. It can also fluctuate with gastrointestinal upset, and she has been experiencing diarrhoea. At this margin, a single reading carries very little weight, but it is worth noting on the GP record and repeating in three to six months to confirm it settles.\n\nTurning to the positives, and there are many. Her metabolic health is genuinely excellent. Her fasting glucose is 4.2, her HbA1c is 28 mmol/mol, which is the equivalent of an estimated average blood sugar of 4.9, and her fasting insulin is just 3.73 mIU/L. Her HOMA-IR, a measure of insulin resistance calculated from glucose and insulin, is 0.7, which places her firmly in the insulin-sensitive category. For a woman on tirzepatide, which works partly by improving insulin sensitivity and reducing appetite, these numbers confirm the medication is doing exactly what it should. Her pancreas is producing very little insulin because it does not need to produce more, and her cells are responding to every molecule it releases. Her C-Peptide, a marker of how much insulin the pancreas is making, is 1.09 ug/L, which converts to 361 pmol/L. The lab has flagged this as marginally below range at 1.1, but in the context of a fasting glucose of 4.2 and an HbA1c of 28, this is not a sign of pancreatic insufficiency. It simply reflects very low insulin demand, which is the metabolic picture tirzepatide is designed to create.\n\nHer liver is in excellent health. Her ALT is 25, her GGT is 23, her AST is 32, and her bilirubin is 18, all comfortably within range. Her FIB-4 score, a formula that estimates liver scarring using age, platelets, AST and ALT, is 1.21, well below the threshold of 1.45. Her APRI score, another fibrosis index, is 0.329, and her NAFLD Fibrosis Score is minus 2.507, both of which rule out any meaningful liver fibrosis. Her amylase and lipase, enzymes produced by the pancreas, are both within range, which is reassuring given her gastrointestinal symptoms and rules out pancreatic inflammation as a cause of her diarrhoea.\n\nHer lipid profile is one of the cleanest results in this report. Her total cholesterol is 4.2, her LDL is 1.74, her HDL is 2.1, and her triglycerides are 0.81. Her HDL at 2.1 is outstanding and accounts for 50% of her total cholesterol, which is a marker of excellent cardiovascular protection. Her ApoB, a measure of the number of potentially harmful cholesterol-carrying particles in the blood, is 0.63, well below the 0.9 threshold and below the optimal 0.8 target. Her ApoB to ApoA1 ratio is 0.34, which is very low risk. Her triglyceride to HDL ratio, one of the best surrogate markers for insulin resistance and small dense LDL particles, calculates to 0.39, which is excellent. Her remnant cholesterol, the cholesterol carried by VLDL and intermediate particles, is 0.36, well within the optimal range. Her Castelli II ratio, LDL divided by HDL, is 0.83. Her atherogenic index of plasma is minus 0.414. Every single lipid marker is not just within range but within the optimal band. When her Lp(a)-corrected LDL is calculated, removing the cholesterol contribution from Lp(a), her modifiable LDL drops to 1.39, which shows that her lifestyle-driven cholesterol metabolism is functioning superbly.\n\nHowever, there is one important exception in the cardiovascular picture, and it is the reason her Cardiovascular Risk Score sits at 35 out of 100 rather than in the ideal zone below 20. Her Lp(a), which stands for lipoprotein little a, is 108.7 nmol/L against a desirable level below 32. Lp(a) is a genetically inherited lipoprotein that behaves like a stickier version of LDL. It deposits cholesterol in artery walls, promotes blood clotting, and drives local inflammation, and it does all three independently of conventional LDL. Because it is determined almost entirely by genetics, it does not change with diet, exercise, or most medications. Her level of 108.7 places her in the moderate risk category, between 90 and 200. This is a permanent piece of medical information that should be recorded on her GP notes and never needs repeating because the number does not change. The genuinely good news is that every modifiable lipid marker in her panel is already optimal. Her LDL is low, her HDL is high, her ApoB is excellent, and her triglycerides are low. This means the risk from Lp(a) is not being amplified by any other cardiovascular factor, which is the best position she can be in. We would recommend that her first-degree relatives, parents, siblings, and children, are also tested for Lp(a), because if the trait has been inherited, early knowledge allows early management.\n\nHer thyroid is working well. Her TSH, the hormone the pituitary gland uses to tell the thyroid how hard to work, is 2.16, within the optimal range. Her free T4, the main hormone the thyroid produces, is 16.6, and her free T3, the active form that cells actually use, is 4.8, both within their ideal ranges. Her FT3 to FT4 ratio is 0.289, confirming good conversion from storage hormone to active hormone. Both thyroid antibodies, TPO and thyroglobulin, are negative, which rules out autoimmune thyroid disease as a contributor to her fatigue or hair thinning.\n\nHer immune system is well balanced. Her total white cell count is 6.96, her neutrophils are 3.99, her lymphocytes are 2.53, and all differential white cell types are within range. Her immunoglobulins, IgG, IgM, IgA, and IgE, are all within their respective ranges, with IgE at just 6.31 suggesting no significant allergic or parasitic drive. Her rheumatoid factor is 6, well below the 14 threshold, which is relevant given her joint stiffness. This does not fully exclude inflammatory arthritis, but it makes rheumatoid arthritis less likely. Her ESR, a measure of how quickly red blood cells settle and an indicator of systemic inflammation, is just 2, which is about as low as it gets. Her Systemic Immune-Inflammation Index is 383 and her Platelet to Lymphocyte Ratio is 96, both within their optimal ranges. Her tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of her diarrhoea and joint symptoms, which is a useful exclusion given her history.\n\nHer CRP, a marker of acute inflammation produced by the liver, is 3.3 mg/L. This is within the laboratory range of under 5, but in cardiovascular risk terms, the ideal level is below 1.0 and anything above 3.0 is considered elevated inflammatory risk. Given her joint stiffness, diarrhoea, and running load, a CRP of 3.3 could reflect low-grade musculoskeletal inflammation, gastrointestinal inflammation, or post-exercise inflammation. It is not dramatically high, but it is not where it should be for a lean, active woman, and it connects to the symptom picture she describes. If the joint stiffness and diarrhoea have been present for years, this level of chronic low-grade inflammation may be contributing to her fatigue as well.\n\nHer iron studies tell a nuanced story. Her ferritin, the storage form of iron, is 63, which is within the optimal range for a woman and is reassuring for a runner worried about iron levels. Her serum iron is 13.9 and her transferrin saturation is 24.38%, just below the optimal threshold of 25% but within the laboratory range. Her TIBC (total iron binding capacity) is 55.2, also within range. However, her transferrin, the protein that carries iron in the blood, is 2.27 g/L, below the lower limit of 2.5. Transferrin is a negative acute phase reactant, meaning that when inflammation is present, the liver produces less of it. With a CRP of 3.3 and chronic symptoms suggesting ongoing inflammation, the low transferrin is most likely being suppressed by the inflammatory process rather than reflecting iron overload. Her iron stores are adequate and her saturation is within range, so the picture is not one of deficiency, but the low transferrin should be noted and rechecked once the inflammatory source has been addressed.\n\nHer reticulocyte percentage is 0.99, within range, but her absolute reticulocyte count is 38.9, below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a low absolute count means the marrow is producing red cells at a slightly reduced rate. Her haemoglobin at 125, while within range, sits at the lower end. For a runner, adequate red cell production is important for oxygen delivery to muscles. The combination of borderline low reticulocytes and lower-end haemoglobin may reflect the chronic inflammation suppressing erythropoiesis, a recognised effect. It may also contribute to her fatigue during training. This is worth monitoring.\n\nHer kidney function shows a finding that needs attention. Her creatinine-based eGFR is 87, which is above 60 and within the laboratory's acceptable range, but her cystatin C is 1.13 mg/L, above the upper limit of 1.1. Cystatin C is a protein filtered by the kidneys that is not affected by muscle mass, making it a more reliable measure of kidney function than creatinine alone, particularly in lean individuals. Her cystatin C-based eGFR calculates to 76, and the combined creatinine and cystatin C eGFR is also 76 ml/min/1.73m2. An eGFR of 76 at 46 is below the optimal threshold of 90 and places her in the G2 category, which is mildly reduced kidney function. This does not mean kidney disease, but it does warrant monitoring. Her urea is 8.5, marginally above the upper limit of 8.2, and her urea to creatinine ratio is 118, above the ideal upper limit of 100. A raised urea to creatinine ratio can reflect dehydration, high protein intake relative to fluid, or reduced renal perfusion. For a runner doing high-intensity training, especially one who has been experiencing diarrhoea, dehydration is the most likely explanation. Tirzepatide can also reduce appetite and fluid intake, which may compound this. We would recommend she discusses the cystatin C result with her GP, ensures she is drinking adequately around training, and repeats cystatin C and urea in three months to see if hydration correction normalises the values.\n\nHer hormonal picture is consistent with perimenopause and HRT. Her oestradiol at 165 pmol/L sits in the follicular range rather than the postmenopausal range, and her FSH at 9.66 and LH at 11.33 are both within premenopausal ranges, which suggests her HRT is maintaining hormonal levels or that she is still cycling. Her progesterone at 6.96 nmol/L sits between the follicular upper limit of 4.45 and the luteal lower limit of 10.62, which could reflect an early luteal sample or the effect of HRT. Her total testosterone is 0.8 nmol/L, within the female range, but her free testosterone, the portion not bound to proteins and available for cells to use, is 0.007 nmol/L, below the lower limit of 0.01. Her SHBG, sex hormone binding globulin, is 93.5, which is on the higher side of the range and is binding most of her testosterone, leaving very little in the free, active form. Her bioavailable testosterone, which includes loosely bound testosterone, is 0.15 nmol/L, within the optimal range, which is reassuring. However, the low free testosterone could contribute to her hair thinning, reduced muscle recovery, fatigue, and difficulty building lean tissue. This is worth discussing with her HRT prescriber, as testosterone supplementation is increasingly used in perimenopausal women for exactly these symptoms. Her DHEA-S is 6.4 umol/L, which converts to approximately 2,358 ug/dL and is within range, and her cortisol at 204 nmol/L is within the morning reference range, confirming her adrenal function is normal.\n\nHer creatine kinase, an enzyme released from muscle when it is damaged or under strain, is 203 U/L, marginally above the upper limit of 200. For a runner who trains at high intensity, a CK of 203 is entirely expected and reflects normal post-exercise muscle breakdown. If the sample was taken within 48 hours of a run, this is a non-finding.\n\nHer vitamin D is 59 nmol/L, which the laboratory classifies as sufficient at above 50, but which falls short of the optimal range of 75 to 120. Vitamin D plays a role in immune regulation, bone health, muscle recovery, and mood, and for a runner with joint stiffness, optimising it is worthwhile. At her lean BMI, a daily supplement of 2,000 to 3,000 IU should bring her into the optimal range within three months. Her B12 at 317 pg/ml is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and energy metabolism, and suboptimal levels can contribute to fatigue and may partly explain her low reticulocyte production. Her folate at 11 ng/ml is within the optimal range, and her magnesium at 0.97 is within the optimal range, both of which are positive. Her calcium is 2.55, corrected calcium is 2.6, and her PTH is 2.7, all within range, confirming her bone mineral metabolism is working normally.\n\nHer total antioxidant activity is 1.87 mmol/L, above the upper limit of 1.77. This is typically driven by supplementation with antioxidants, vitamin C, or polyphenol-rich foods and drinks, and is not a concern.\n\nHer urinalysis is clean, with no protein, glucose, ketones, blood, or white cells detected. Her urine culture and bacterial count are pending.\n\nHer PhenoAge, a biological ageing score calculated from nine blood markers, is 37.8 years against her calendar age of 46, making her biologically 8.2 years younger than her chronological age. This is an excellent result and reflects her lean body composition, low insulin, low glucose, low inflammation markers, and healthy albumin. The markers driving this favourable score include her glucose, albumin, CRP, lymphocyte count, and white cell count. Her Cardiovascular Risk Score is 35 out of 100, within the acceptable range of under 40 but above the ideal threshold of 20, and this is being driven almost entirely by her Lp(a) at 108.7. Without the Lp(a), her modifiable cardiovascular risk would be among the lowest we see.\n\nReturning to her symptoms, her chronic joint stiffness and fatigue are the findings that blood tests alone cannot fully explain. What has been positively excluded is reassuring: her thyroid is normal, she is not anaemic, her iron stores are adequate, her B12 is acceptable though not optimal, her blood sugar and insulin are excellent, coeliac disease has been ruled out, and her rheumatoid factor is negative. What remains on the table is the CRP of 3.3 suggesting low-grade systemic inflammation, the possibility of an inflammatory or autoimmune process that standard blood tests do not capture (seronegative inflammatory arthritis, enthesopathy, hypermobility spectrum disorder), and the chronic diarrhoea, which may itself be driving inflammation and nutrient malabsorption. The diarrhoea that has been going on for years needs investigating in its own right. A stool calprotectin test would help distinguish inflammatory bowel disease from irritable bowel syndrome, and a hydrogen breath test could identify small intestinal bacterial overgrowth or lactose intolerance, both of which cause diarrhoea, bloating, fatigue, and can impair nutrient absorption. We would recommend she raises both the joint stiffness and the chronic diarrhoea with her GP as separate investigation pathways, because resolving the gut issue may reduce the inflammation that is contributing to everything else.","links":"The central thread in Harriet's results is a lean, metabolically healthy woman whose blood sugar, insulin and lipid markers are working at an exceptional level, but who is dealing with two unresolved clinical problems: chronic joint stiffness that predates her running and persists during rest, and chronic diarrhoea that has been present for years. These two symptoms are likely connected, and the CRP of 3.3 is the number that ties them together. A CRP that high in a woman with a BMI of 21.3, excellent metabolic health, and no liver disease points to a source of chronic inflammation, and the two most obvious candidates are the gut and the joints themselves.\n\nThe low transferrin at 2.27 supports this interpretation. Transferrin is a negative acute phase reactant, meaning the liver reduces its production when inflammation is present. Her iron stores are adequate, her saturation is acceptable, and her TIBC is normal, so this is not iron deficiency or iron overload. It is the inflammatory signal suppressing a single protein. The marginally low absolute reticulocyte count of 38.9 fits the same pattern: chronic inflammation is a recognised suppressor of erythropoiesis, and it may explain why her haemoglobin, while within range at 125, sits at the lower end for an active woman. If the gut inflammation is addressed and the CRP falls, both transferrin and reticulocyte production should improve.\n\nThe second thread is the Lp(a) at 108.7. This is entirely separate from everything else in the report because it is genetic, fixed, and has nothing to do with her diet, training, or symptoms. It sits in the moderate risk category and it is the sole reason her Cardiovascular Risk Score is 35 rather than in the teens. Every other cardiovascular marker, LDL, HDL, ApoB, triglycerides, and ApoB to ApoA1 ratio, is optimal. The Lp(a)-corrected LDL of 1.39 confirms that her modifiable LDL cholesterol is very low. This means the risk from Lp(a) stands alone and is not being multiplied by any lifestyle factor, which is the best achievable position. It should be recorded permanently on her GP notes and her first-degree relatives should be tested.\n\nThe third thread is the cystatin C of 1.13 and the combined eGFR of 76. At 46 with no hypertension, no diabetes, and no nephrotoxic medication, this is unexpected. The raised urea and urea to creatinine ratio point to dehydration as the most likely acute explanation, and tirzepatide's appetite-suppressing effect may mean she is drinking less than her running demands. A single cystatin C reading does not confirm reduced kidney function, but it does require a repeat in three months with attention to hydration in the interim. If the repeat confirms the finding, her GP should investigate further.\n\nThe CA-125 at 48.7 is a finding that must be investigated but is most likely benign. The elevation is modest, her other tumour markers are normal or marginally above threshold, and at 46 with HRT and possible residual cycling, hormonal causes and benign gynaecological conditions are far more common explanations than malignancy. A pelvic ultrasound is the appropriate next step, and NICE guidelines make this a straightforward GP referral.\n\nFinally, the low free testosterone of 0.007 against a lower limit of 0.01 is being driven by her SHBG at 93.5, which is binding the majority of her total testosterone. Her bioavailable testosterone is still within range, so the clinical significance is borderline, but it may be contributing to her hair thinning, fatigue, and reduced recovery. This is a conversation for her HRT prescriber rather than a separate GP referral.","lifestyle":"Prioritise hydration around training. Carry a water bottle on every run and aim for at least 2.5 litres of fluid across the day, more on training days. Anchor: fill a bottle before you lace up, and finish it by the time you stretch. Why: your urea at 8.5, urea to creatinine ratio of 118, and cystatin C at 1.13 all suggest you are running slightly dry, and tirzepatide can reduce thirst cues.\nAdd two portions of oily fish per week (salmon, mackerel, sardines) or, if that is not realistic, take a daily omega-3 supplement. Anchor: replace one existing dinner per week and add one lunch. Why: omega-3 is anti-inflammatory and may help both the CRP of 3.3 and the joint stiffness you describe, and it supports the cardiovascular protection you already have from your excellent HDL.\nIncrease vegetable and fruit intake to at least five portions a day, with an emphasis on dark leafy greens, berries, and cruciferous vegetables. Anchor: add a portion to every meal you already eat. Why: the fibre supports gut health and may help the chronic diarrhoea, the micronutrients support the B12 and vitamin D gaps, and the polyphenols support antioxidant status.\nAdd two resistance training sessions per week, even 20 to 30 minutes of bodyweight exercises or light weights. Anchor: on two non-running days, before your shower. Why: you have zero resistance sessions currently, and at 46, resistance training protects bone density, supports joint stability around the stiff areas, builds the lean tissue that your low free testosterone is making harder to maintain, and improves metabolic health further.\nAim for a protein target of 78 to 96 grams per day (1.3 to 1.6 g per kg of bodyweight), spread across three meals. Anchor: build every meal around the protein source first. Why: as a runner with borderline reticulocyte production and low free testosterone, adequate protein supports red cell production, muscle repair, and recovery.\nTake your vitamin D supplement with your largest meal of the day, ideally one that contains fat. Anchor: with dinner or lunch, same time every day. Why: your vitamin D at 59 needs to reach 75 to 120 for optimal bone, immune, and muscle function, and fat-soluble vitamins absorb better with food.\nKeep a symptom diary for the diarrhoea: what you ate, when the episode occurred, and what you noticed. Anchor: a note on your phone after each episode, takes 30 seconds. Why: this gives your GP the pattern they need to decide between calprotectin, breath testing, or colonoscopy, and it often reveals a trigger you have not noticed.","flags":"CA-125 at 48.7 U/ml, above the upper limit of 35. In a 46-year-old woman on HRT with abdominal symptoms, this requires a pelvic ultrasound to exclude ovarian pathology. Most likely explanation is benign (hormonal, endometriosis, cyst) but NICE NG12 guidelines mandate investigation.\nLp(a) at 108.7 nmol/L, above the desirable limit of 32, placing her in the moderate risk category (90 to 200). Genetically determined, does not change with lifestyle, should be recorded permanently on GP notes. First-degree relatives should be tested. All modifiable lipid markers are optimal, so the Lp(a) risk is not being amplified.\nCystatin C at 1.13 mg/L, above the upper limit of 1.1, giving a combined eGFR of 76 ml/min/1.73m2, below the optimal threshold of 90. Urea at 8.5 mmol/L (above 8.2) and urea to creatinine ratio of 118 (above 100) suggest dehydration as the most likely acute cause, possibly compounded by tirzepatide reducing fluid intake. Repeat cystatin C and urea in three months with attention to hydration.\nCEA at 2.39 ng/ml, marginally above the non-smoker limit of 2.3. At this margin, likely driven by CRP of 3.3 and gastrointestinal symptoms. Repeat in three to six months to confirm it settles.\nhs-CRP at 3.3 mg/L. Within the laboratory range of under 5 but above the cardiovascular optimal of under 1.0. In a lean woman with chronic joint stiffness and chronic diarrhoea, this suggests an ongoing low-grade inflammatory process. Investigate the source.\nTransferrin at 2.27 g/L, below the lower limit of 2.5. Most likely suppressed as a negative acute phase reactant in the context of CRP 3.3. Iron stores are adequate (ferritin 63). Recheck after the inflammatory source is addressed.\nAbsolute reticulocytes at 38.9, below the lower limit of 50. Mild suppression of red cell production, possibly secondary to chronic inflammation. Haemoglobin 125 is within range but at the lower end. Monitor with repeat FBC once inflammation is investigated.\nFree testosterone (calculated) at 0.007 nmol/L, below the lower limit of 0.01, driven by SHBG of 93.5 binding the majority of total testosterone (0.8 nmol/L). Bioavailable testosterone is within range at 0.15 nmol/L. May contribute to hair thinning, fatigue, and reduced recovery. Discuss with HRT prescriber.\nC-Peptide at 1.09 ug/L (361 pmol/L), marginally below the laboratory lower limit of 1.1 ug/L. In the context of fasting glucose 4.2, HbA1c 28, and HOMA-IR 0.7, this reflects very low insulin demand rather than pancreatic insufficiency. No action required.\nCreatine kinase at 203 U/L, marginally above the upper limit of 200. Expected in a runner who trains at high intensity. No concern.\nTotal antioxidant activity at 1.87 mmol/L, above the upper limit of 1.77. Likely reflects dietary antioxidant intake or supplementation. Not a concern.\nReassuring negatives: thyroid function and antibodies normal, coeliac screen negative, rheumatoid factor negative, immunoglobulins balanced, IgE low, liver function and fibrosis scores all clear, metabolic health excellent (HOMA-IR 0.7, HbA1c 28), ESR 2, urinalysis clean, CA15-3 and CA19-9 within range, amylase and lipase within range.","recommendations":"Discuss the CA-125 of 48.7 with your GP and request a pelvic ultrasound as per NICE NG12 guidelines. Mention your chronic abdominal symptoms and your HRT status, as both are relevant to interpretation.\nAsk your GP to record your Lp(a) of 108.7 nmol/L permanently on your medical notes. This is a genetic marker that does not change and should be flagged for any future cardiovascular risk assessment. Recommend testing for first-degree relatives.\nDiscuss the cystatin C of 1.13 and combined eGFR of 76 with your GP. Request a repeat of cystatin C, urea, and creatinine in three months, ensuring good hydration in the week before the test. Mention the tirzepatide as it may be contributing to reduced fluid intake.\nRaise the chronic diarrhoea as a separate investigation. Request a stool calprotectin to distinguish inflammatory bowel disease from functional bowel syndrome, and consider a hydrogen breath test for lactose intolerance or small intestinal bacterial overgrowth.\nRaise the chronic joint stiffness with your GP. Although rheumatoid factor is negative, seronegative inflammatory conditions exist. An anti-CCP antibody test and inflammatory markers review may be warranted, along with consideration of referral to rheumatology if the stiffness persists.\nDiscuss the low free testosterone of 0.007 with your HRT prescriber. Testosterone supplementation in perimenopausal women is increasingly supported for fatigue, libido, hair health, and muscle recovery. Bring the SHBG of 93.5 as context.\nRepeat CEA in three to six months to confirm the marginal elevation of 2.39 (limit 2.3) has settled. Bring the CRP of 3.3 and diarrhoea history as context for the GP.\nCalorie and protein targets: at 60 kg, 168 cm, training three to four times per week, her estimated maintenance is approximately 1,800 to 2,000 kcal per day. Protein target is 78 to 96 g per day (1.3 to 1.6 g per kg). Given she is on tirzepatide and appetite may be suppressed, she should aim for at least 1,600 kcal per day as a floor to support training, red cell production, and recovery. Retest in three to four months: cystatin C, urea, creatinine, FBC with reticulocytes, CRP, transferrin, CA-125, CEA, vitamin D, and B12.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 to 3,000 IU daily, taken with your largest meal containing fat. Why: your vitamin D at 59 nmol/L is sufficient but below the optimal range of 75 to 120, and you need it for bone health, immune function, and joint recovery.\nVitamin K2 (MK-7), 100 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bone rather than soft tissue, supporting bone density and joint health.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 317 pg/ml is within range but below the optimal threshold of 500, and suboptimal B12 may be contributing to your fatigue and the low reticulocyte count. Sublingual delivery bypasses the gut, which matters given your chronic diarrhoea.\nOmega-3 fish oil, providing 2 to 3 g of combined EPA and DHA daily, taken with food. Why: your CRP at 3.3 suggests chronic low-grade inflammation, and omega-3 has a direct anti-inflammatory effect. It also supports cardiovascular protection alongside your already excellent lipid profile.\nMagnesium glycinate, 300 mg before bed. Why: your magnesium at 0.97 is within the optimal range, but magnesium glycinate supports muscle recovery, sleep quality, and may help with the joint stiffness, and it is commonly depleted in runners and those with chronic diarrhoea.\nDo not take iron supplements. Your ferritin at 63 is within the optimal range for a woman, and supplementing iron when stores are adequate risks pushing ferritin too high, especially with transferrin already low.\nThe most important changes from this report are not supplements. They are investigating the chronic diarrhoea and joint stiffness with your GP, ensuring adequate hydration around your training, and adding resistance exercise and protein to support recovery, red cell production, and lean tissue maintenance.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5182","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 57 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 57. Weakest systems: inflammation 24%, iron studies 25%, lipids & cardiovascular 37%. Biggest drags: Lipoprotein(a), Urea, Reticulocytes (Absolute), Transferrin.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"36.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3588","lower_normal":"","upper_normal":"51","lower_optimal":"","upper_optimal":"46","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4510","units":"years","description":"PhenoAge is a biological ageing score calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, ALP, and white cell count. Harriet's PhenoAge is 37.8 years against a calendar age of 46, meaning she is biologically 8.2 years younger than her chronological age. This is an excellent result driven by her low glucose, healthy albumin, low white cell count, normal MCV, and good lymphocyte balance. Her CRP of 3.3 is the one input working against the score; if that comes down, her PhenoAge will improve further. Note: fasting glucose was not returned by the laboratory, so the estimated average glucose from HbA1c (4.7 mmol/L) was used in its place.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0   }
  let markers = [];

  if (!markers.length) return null;

  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };

}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
