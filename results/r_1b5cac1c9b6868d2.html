rhydration, certain medications, kidney or adrenal issues","high_causes":"Dehydration, excess salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"103","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5385","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4103","upper_optimal_position":"0.6154","units":"mmol/L","description":"Chloride is an electrolyte that works with sodium to maintain fluid balance and acid-base balance. At 103, this is within the optimal range.","low_causes":"Vomiting, certain medications, metabolic alkalosis","high_causes":"Dehydration, kidney disease, metabolic acidosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"18.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2879","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer in the blood that helps maintain the acid-base balance. At 18.5, this is below the lower limit of 20, suggesting a mild metabolic acidosis, meaning the blood is slightly more acidic than it should be. In the context of a cystatin C-derived eGFR of 75, this could indicate that the kidneys are not buffering acid as efficiently as expected. It should be repeated alongside kidney function markers to confirm whether this is a persistent finding.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea, exercise","high_causes":"Metabolic alkalosis, vomiting, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product from protein metabolism, filtered by the kidneys. At 5, this is within the optimal range, confirming that protein metabolism and waste clearance are functioning normally.","low_causes":"Low protein diet, liver disease, overhydration","high_causes":"Kidney disease, dehydration, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"76","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5528","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"75","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3821","upper_optimal_position":"0.5447","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. At 76, this is within the normal range but just above the optimal ceiling of 75. Creatinine can be mildly elevated by creatine supplementation, which she takes. This may account for the reading being at the top of the optimal band. However, in the context of a raised cystatin C and an eGFR of 75, this adds a reason to monitor kidney function.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, dehydration, high protein diet, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"85","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.7083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from creatinine. At 85, this is above the 60 threshold but below the optimal level of 90. Her creatine supplementation may be mildly elevating creatinine and therefore underestimating her true eGFR. However, the cystatin C-based eGFR also shows 75, which is not affected by creatine. This warrants monitoring.","low_causes":"Kidney disease, dehydration, certain medications","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"280","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4476","lower_normal":"184","upper_normal":"464","lower_optimal":"184","upper_optimal":"320","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4952","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in certain foods and produced by the body. At 280, this is within the optimal range for women (160 to 320). Normal uric acid reduces the risk of gout and kidney stones and is a reassuring marker of metabolic health.","low_causes":"Low purine diet, medication","high_causes":"High purine diet, kidney disease, metabolic syndrome, alcohol","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.16","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5273","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein produced by all nucleated cells and filtered by the kidneys. Unlike creatinine, it is not affected by muscle mass, diet or creatine supplementation, making it a particularly useful marker for kidney function. At 1.16, this is above the upper limit of 1.1, indicating that kidney filtration is mildly reduced. This is the most reliable kidney marker in this panel and is the reason for recommending a repeat in three to six months.","low_causes":"Not clinically significant","high_causes":"Reduced kidney function, inflammation, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"75","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6250","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This eGFR combines both creatinine and cystatin C for the most accurate estimate of kidney function. At 75, this is above 60 (so not classified as kidney disease) but below the optimal threshold of 90. At 39 with no diabetes or hypertension, this is lower than expected. Chronic inflammation from rheumatoid arthritis and potentially creatine supplementation may contribute. This should be repeated in three to six months to establish a baseline and determine whether it is stable.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not clinically significant","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"65.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4767","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between pre-renal (dehydration, reduced blood flow) and intrinsic kidney causes of abnormal kidney function. At 65.8, this is within the optimal range, suggesting no pre-renal cause for the slightly reduced eGFR.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5467","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4400","upper_optimal_position":"0.6400","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 73, this is within the optimal range, confirming adequate protein synthesis by the liver and a functioning immune system.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic inflammation, infection, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3958","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and drugs, and maintains fluid balance. At 37, this is within the normal range but below the optimal band of 40 to 48. Albumin is a negative acute phase protein, meaning it falls during inflammation. Her raised ESR and active rheumatoid arthritis are the likely explanation for this being at the lower end, rather than liver disease (her liver markers are all clean).","low_causes":"Chronic inflammation, liver disease, kidney disease, malnutrition","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"36","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6667","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4074","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin is a group of proteins in the blood that includes antibodies and inflammatory markers. At 36, this is at the upper boundary of the normal range. Elevated globulin is a common finding in autoimmune and chronic inflammatory conditions because the immune system is producing more antibodies. In the context of rheumatoid arthritis, this is consistent with ongoing immune activity.","low_causes":"Immune deficiency, liver disease","high_causes":"Chronic inflammation, autoimmune disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3810","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5429","units":"IU/L","description":"ALP is an enzyme found in the liver and bones. At 56, this is within the optimal range, confirming healthy liver and bone metabolism.","low_causes":"Malnutrition, zinc deficiency","high_causes":"Liver disease, bone disease, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3958","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. At 8, this is within the optimal range, confirming healthy liver processing of bilirubin.","low_causes":"Not clinically significant","high_causes":"Liver disease, haemolysis, Gilbert's syndrome, bile duct obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0982","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT, or alanine transaminase, is a liver enzyme that rises when liver cells are damaged. At 11, this is well below the optimal ceiling of 25 for women, confirming the liver is under no strain at all. This is an excellent result.","low_causes":"Not clinically significant","high_causes":"Liver disease, fatty liver, alcohol, medication, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3854","lower_normal":"13","upper_normal":"45","lower_optimal":"14","upper_optimal":"30","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3438","upper_optimal_position" , parathyroid disease, malnutrition","high_causes":"Parathyroid disease, cancer, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5583","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts for albumin levels to give a more accurate picture of calcium status. At 2.47, this is within the optimal range, confirming healthy calcium metabolism alongside her excellent vitamin D and normal parathyroid hormone.","low_causes":"Vitamin D deficiency, parathyroid disease","high_causes":"Parathyroid disease, cancer, excessive vitamin D supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4943","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3793","upper_optimal_position":"0.5900","units":"mmol/L","description":"Phosphate is a mineral essential for bones, energy production and cell function. At 1.2, this is within the optimal range.","low_causes":"Vitamin D deficiency, parathyroid disease, malnutrition","high_causes":"Kidney disease, parathyroid disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.82","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5172","upper_optimal_position":"0.6322","units":"mmol/L","description":"Magnesium is a mineral involved in over 300 enzyme reactions, including muscle relaxation, sleep quality, stress management and nerve function. At 0.82, this is within the normal range but below the optimal band of 0.85 to 1.05. Given she is already supplementing with magnesium, the dose or form may benefit from an upgrade. Magnesium glycinate is the best-absorbed form and has a calming effect that would directly address her wired-at-night pattern.","low_causes":"Poor dietary intake, alcohol, chronic disease, medication","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"208","within_normal":"TRUE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation and muscle function. It is produced in the skin from sunlight and supplemented orally. At 208, this is well above the sufficient threshold and above the optimal ceiling of 120, reflecting consistent supplementation. While not dangerous, there is no additional benefit above 120 and there is a very small theoretical risk from very high levels over time. Reducing the dose to a maintenance level of 1,000 to 2,000 IU daily would keep her in the ideal range of 75 to 120.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","r  At 281.4, this is within the optimal range, confirming normal fluid and electrolyte balance.","low_causes":"Overhydration, low sodium","high_causes":"Dehydration, high sodium intake, raised glucose or urea","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"478","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4537","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.6320","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell production, DNA synthesis and energy metabolism. At 478, this is within the laboratory range but below the optimal threshold of 500. B12 supports energy and cognitive function, both of which she is struggling with. Supplementing with sublingual methylcobalamin would bring this into the optimal range.","low_causes":"Vegetarian or vegan diet, malabsorption, pernicious anaemia, age","high_causes":"Supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6905","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production and cell division. At 18, this is marginally above the upper limit of 17. This is not a concern; high folate reflects adequate dietary intake or supplementation and does not cause harm. It is a reassuring result for red cell production.","low_causes":"Poor diet, malabsorption, alcohol, pregnancy","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.1400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1000","units":"mg/L","description":"hs-CRP (high-sensitivity C-reactive protein) is a marker of inflammation produced by the liver. Unlike ESR, which rises with many types of inflammation, CRP responds more specifically to acute inflammatory signals. At 1.4, this is within the laboratory range below 5 but above the ideal threshold of 1.0. The modest elevation, alongside the much higher ESR, is consistent with chronic, smouldering inflammation from her rheumatoid arthritis rather than an acute flare. A CRP above 1.0 also adds a small amount of cardiovascular risk, which is relevant given her Lp(a).","low_causes":"Low inflammation, good metabolic health","high_causes":"Infection, chronic inflammation, autoimmune disease, obesity, cardiovascular risk","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA125","group":"TUMOR MARKERS","result":"14.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2129","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA125 is a protein that can be elevated in ovarian cancer but also rises with endometriosis, menstruation and pelvic inflammation. At 14.9, this is well within the normal range, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, menstruation, pelvic inflammatory disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA15-3","group":"TUMOR MARKERS","result":"22.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3787","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"CA15-3 is a tumour marker associated with breast cancer. At 22.72, this is within the normal range below 30, which is reassuring.","low_causes":"Not clinically significant","high_causes":"Breast cancer, liver disease, lung disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5695","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol types in the blood, including HDL (protective), LDL (harmful when elevated) and VLDL. At 5.9, this is above the desirable threshold of 5.18. However, total cholesterol alone is a crude measure. Her very high HDL at 2.3 accounts for a large portion of this total, meaning the harmful fraction is smaller than the headline number suggests. The ratio of total cholesterol to HDL at 2.57 is excellent.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1971","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats in the blood, primarily driven by carbohydrate and sugar intake. At 0.67, this is well within the optimal range below 1.0. Excellent triglycerides alongside low insulin and a low HOMA-IR confirm that her metabolic health is very good despite her dietary pattern.","low_causes":"Low-carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"High carbohydrate or sugar diet, alcohol, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1923","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL is a type of lipoprotein that carries triglycerides from the liver to tissues. At 0.3, this is within the optimal range, reflecting excellent triglyceride metabolism.","low_causes":"Not clinically significant","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7419","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5161","upper_optimal_position":"1.0000","units":"mmol/L","description":"HDL, or high-density lipoprotein, is the protective cholesterol that removes excess cholesterol from artery walls and transports it back to the liver for disposal. At 2.3, this is excellent, well above both the desirable threshold of 1.55 and the optimal threshold for women of 1.6. A high HDL is one of the strongest protective factors against cardiovascular disease.","low_causes":"Smoking, obesity, sedentary lifestyle, poor diet, insulin resistance","high_causes":"Genetics, regular exercise, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.34","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7120","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, is the cholesterol that deposits into artery walls and drives atherosclerosis. At 3.34, this is above the upper limit of 3.0 and above the optimal target of 2.6. However, a meaningful portion of this measured LDL is actually Lp(a) particles being counted in the total. Her Lp(a)-corrected LDL is 2.66, which shows the modifiable, diet-driven portion is closer to target. Dietary changes focusing on soluble fibre, oily fish and reducing saturated fat can bring this modifiable portion down further.","low_causes":"Low-fat diet, hyperthyroidism, malnutrition","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2856","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL to give a summary of cardiovascular risk. At 2.57, this is well within the optimal range below 3.5, reflecting how her excellent HDL offsets the elevated total cholesterol.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"38.98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9745","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"%","description":"This shows what proportion of total cholesterol is the protective HDL type. At 39%, nearly four in every ten cholesterol particles are protective HDL. This is an excellent ratio and well above the minimum of 20%.","low_causes":"Low HDL, metabolic syndrome","high_causes":"High HDL, good metabolic health","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3750","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, capturing all the potentially harmful cholesterol types (LDL, VLDL, Lp(a)). At 3.6, this is within the laboratory range below 4 but above the optimal target of 3.0. Again, Lp(a) particles are included in this number, so the modifiable portion is smaller than it appears.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"Diet, genetics, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9143","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.5714","upper_optimal_position":"1.0000","units":"g/L","description":"ApoA1 is the main protein on HDL particles. A high ApoA1 reflects a large number of protective HDL particles. At 2.56, this is excellent and well above the normal threshold of 1.4.","low_causes":"Smoking, obesity, sedentary lifestyle, metabolic syndrome","high_causes":"Genetics, regular exercise, good metabolic health","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.03","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL and Lp(a) particle. It counts the total number of cholesterol-carrying particles in the blood and is considered a more accurate predictor of cardiovascular risk than LDL cholesterol alone, because it counts particles rather than the amount of cholesterol they carry. At 1.03, this is above the target of 0.9 and in the borderline high category (1.0 to 1.19). However, Lp(a) particles each carry one ApoB protein, so her very high Lp(a) inflates this number. The modifiable component, driven by diet, is smaller than the headline figure suggests. Bringing LDL down through dietary changes will improve this number, though the Lp(a)-driven portion will remain.","low_causes":"Low-fat diet, hyperthyroidism","high_causes":"Diet, genetics, elevated Lp(a), insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoba1ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.40","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio compares the number of harmful cholesterol particles (ApoB) to the number of protective particles (ApoA1). It is considered one of the best summary measures of cardiovascular lipid risk. At 0.40, this is well within the lower-risk category below 0.6 and within the optimal range. Her very high ApoA1 (reflecting excellent HDL) is the reason this ratio is so favourable despite her raised ApoB.","low_causes":"Excellent HDL, low LDL","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"210.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"nmol/L","description":"Lp(a) is a genetically determined lipoprotein particle that deposits cholesterol into artery walls, encourages blood clotting and drives inflammation. Unlike LDL, it cannot be meaningfully changed by diet, exercise or standard lipid-lowering medication. At 210, this is in the high-risk category (200 to 400). It is the single largest driver of her cardiovascular risk score. This is inherited; she is born with this level and it will remain throughout her life. It should be recorded permanently in her medical notes, and first-degree relatives (parents, siblings, children) should be offered testing, because if one parent carries a high Lp(a), each child has a 50% chance of inheriting it. Her GP should discuss overall cardiovascular risk management in light of this result.","low_causes":"Genetics (favourable)","high_causes":"Genetics (inherited)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4229","lower_normal":"25","upper_normal":"200","lower_optimal":"30","upper_optimal":"170","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3429","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase is an enzyme released when muscle cells are damaged. It rises after intense exercise and in muscle disease. At 72, this is within the optimal range, confirming her muscles are recovering well from her training programme.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5030","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5863","units":"pmol/L","description":"FT4 is the storage form of thyroid hormone, produced by the thyroid gland and converted into the active form (FT3) in tissues. At 17.2, this is within the optimal range of 14 to 20, confirming good thyroid hormone production.","low_causes":"Hypothyroidism, pituitary disease","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"2.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4712","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3688","upper_optimal_position":"0.4870","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland to tell the thyroid how much hormone to make. When the thyroid is underactive, TSH rises to push it harder. At 2.3, this is within the optimal range of 1.0 to 2.5, confirming the pituitary is not having to push the thyroid and that thyroid function is normal.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4741","upper_optimal_position":"0.6222","units":"pmol/L","description":"FT3 is the active thyroid hormone that drives metabolism, energy, mood and temperature regulation. At 5.3, this is within the optimal range of 4.5 to 6.5, confirming that her body is converting the storage hormone (FT4) into the active form efficiently. Good FT3 levels make thyroid-related fatigue or brain fog unlikely.","low_causes":"Hypothyroidism, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"TPO antibodies are produced when the immune system attacks the thyroid gland, which is the mechanism behind Hashimoto's thyroiditis. At less than 6.6, this is well below the threshold of 13.8, making autoimmune thyroid disease very unlikely. This is particularly reassuring given that autoimmune conditions can cluster.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein involved in thyroid hormone production. At less than 1.3, this is well below the threshold of 4.4 and consistent with no autoimmune thyroid disease. More than 80% of the population have undetectable levels.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.308","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"This ratio compares the active thyroid hormone (FT3) to the storage form (FT4). At 0.308, this is within the optimal range of 0.27 to 0.4, confirming efficient conversion from storage to active hormone. Poor conversion would show a low ratio and is sometimes seen in chronic illness or calorie restriction.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ca199","name":"CA19-9","group":"TUMOR MARKERS","result":"30.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4054","units":"U/mL","description":"CA19-9 is a tumour marker associated with pancreatic and gastrointestinal cancers. At 30.8, this is within the normal range below 37 but above the optimal threshold of 30. This is within normal limits and not a concern. CA19-9 can be mildly elevated by inflammation, which is present in her case.","low_causes":"Not clinically significant","high_causes":"Pancreatic cancer, bile duct disease, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2435","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"ng/mL","description":"CEA, or carcinoembryonic antigen, is a tumour marker used to monitor certain cancers, particularly bowel cancer. At 1.12, this is well within the normal range (below 2.3), which is reassuring.","low_causes":"Not clinically significant","high_causes":"Colorectal cancer, other cancers, smoking, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"11.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5053","lower_normal":"6.5","upper_normal":"16","lower_optimal":"7.0","upper_optimal":"14","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3509","upper_optimal_position":"0.5965","units":"g/L","description":"IgG is the most abundant antibody in the blood, providing long-term immunity against infections. At 11.4, this is within the normal range, confirming healthy adaptive immune function.","low_causes":"Immune deficiency, medication","high_causes":"Chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"3.63","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7507","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"g/L","description":"IgM is the first antibody the immune system produces in response to a new infection or immune challenge. It is also the antibody class most associated with ongoing autoimmune activation. At 3.63, this is above the upper limit of 3.0. In the context of rheumatoid arthritis, a raised IgM is consistent with ongoing autoimmune immune activation. This supports the finding from the raised ESR that her disease may be more active than her symptoms suggest, and should be discussed with her rheumatology team.","low_causes":"Immune deficiency","high_causes":"Acute or chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5806","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.7","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3656","upper_optimal_position":"0.6129","units":"g/L","description":"IgA is an antibody found primarily in mucous membranes (gut, lungs, saliva) and is the body's first line of defence at mucosal surfaces. At 2.7, this is within the normal range. Adequate IgA is also important because the coeliac screening test (tissue transglutaminase IgA) only works if IgA levels are sufficient, and hers are.","low_causes":"Selective IgA deficiency (common, usually harmless), immune deficiency","high_causes":"Chronic infection, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"41.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2075","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"IgE is the antibody involved in allergic reactions and defence against parasites. At 41.5, this is within the normal range below 100, making a significant allergic contribution to her symptoms unlikely.","low_causes":"Not clinically significant","high_causes":"Allergies, asthma, eczema, parasitic infection","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"AUTOIMMUNE & CELIAC","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1786","lower_normal":"0","upper_normal":"14","lower_optimal":"0","upper_optimal":"14","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"IU/mL","description":"Rheumatoid factor is an autoantibody associated with rheumatoid arthritis. A negative result (below 14) means the rheumatoid arthritis is classified as seronegative, which occurs in approximately 20 to 30% of cases. At 5, this is well within range. Seronegative rheumatoid arthritis is still active disease, as confirmed by her raised ESR and IgM, and can still cause significant joint damage and systemic inflammation.","low_causes":"Seronegative rheumatoid arthritis, no autoimmune disease","high_causes":"Rheumatoid arthritis, Sjogren's syndrome, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ttg","name":"Tissue Transglutaminase IgA","group":"AUTOIMMUNE & CELIAC","result":"0.365","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0254","lower_normal":"0","upper_normal":"7.19","lower_optimal":"0","upper_optimal":"7.19","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.5000","units":"CU","description":"This is the screening test for coeliac disease, an autoimmune condition where the body reacts to gluten and damages the gut lining. At 0.365, this is strongly negative (below 7.19), making coeliac disease very unlikely. This is useful given her joint pain and fatigue, as coeliac disease can mimic some of these symptoms.","low_causes":"No coeliac disease","high_causes":"Coeliac disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"taa","name":"Total Antioxidant Activity","group":"SPECIALIZED TESTS","result":"1.86","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7305","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mmol/L","description":"Total antioxidant activity measures the blood's capacity to neutralise free radicals (harmful molecules that damage cells). At 1.86, this is marginally above the upper limit of 1.77. This likely reflects her supplementation with vitamin D and creatine and is not a concern. Additional antioxidant supplementation is not needed.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Supplementation, high dietary antioxidant intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"413","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5215","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3717","upper_optimal_position":"0.5827","units":"nmol/L","description":"Cortisol is the body's main stress hormone, produced by the adrenal glands. It follows a daily rhythm, peaking in the morning and falling through the day. At 413, this is within the optimal morning range. While not dramatically elevated, it is in the upper half of the range, which is consistent with someone who reports stress most days and feels wired at night. A wired-at-night pattern often reflects cortisol not falling as it should in the evening.","low_causes":"Adrenal insufficiency, chronic fatigue","high_causes":"Chronic stress, Cushing's syndrome, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"480","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4911","lower_normal":"204.8","upper_normal":"786.1","lower_optimal":"204.8","upper_optimal":"786.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, responsible for reproductive function, bone health, brain function and skin quality. At 480, this is within the luteal phase reference range (204.8 to 786.1), consistent with a regular menstrual cycle. This confirms normal ovarian function at 39.","low_causes":"Menopause, perimenopause, low body fat, over-exercise","high_causes":"Ovulation, pregnancy, obesity, HRT","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"84.76","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6831","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"14.12","upper_optimal":"81.28","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3498","upper_optimal_position":"0.6667","units":"nmol/L","description":"Progesterone is a hormone produced after ovulation that prepares the uterus for pregnancy and has a calming effect on the brain. At 84.76 nmol/L, this is marginally above the laboratory upper limit of 81.28. This most likely reflects a sample drawn at peak luteal output shortly after ovulation, and is consistent with confirmed ovulation given her oestradiol and LH. It should be noted with her GP for context. Good progesterone supports sleep quality and mood, though her wired-at-night pattern may reflect other factors such as cortisol rhythm and stress.","low_causes":"Anovulation, perimenopause, luteal phase defect","high_causes":"Pregnancy, ovarian cysts, adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4228","lower_normal":"0.5","upper_normal":"16.9","lower_optimal":"0.5","upper_optimal":"16.9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"LH is a pituitary hormone that triggers ovulation and stimulates the ovaries to produce sex hormones. At 4.9, this is within the luteal phase range (0.5 to 16.9), consistent with a post-ovulatory cycle phase.","low_causes":"Pituitary disease, extreme weight loss, over-exercise","high_causes":"Menopause, PCOS, pituitary tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"5.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5211","lower_normal":"1.5","upper_normal":"9.1","lower_optimal":"1.5","upper_optimal":"9.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"mIU/mL","description":"FSH is a pituitary hormone that stimulates the ovaries to develop follicles and produce eggs. At 5.78, this is within the luteal phase range (1.5 to 9.1). An FSH well below 40 at 39 is reassuring and does not suggest perimenopause.","low_causes":"Pituitary disease, PCOS","high_causes":"Menopause, perimenopause, ovarian failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"0.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3651","lower_normal":"0.5","upper_normal":"2.6","lower_optimal":"1.0","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4127","upper_optimal_position":"0.6032","units":"nmol/L","description":"Testosterone in women is important for libido, energy, mood, muscle maintenance and bone density. At 0.7, this is within the laboratory range (0.5 to 2.6) but below the optimal threshold of 1.0. While the total amount is within range, what matters more is how much is free and available to tissues, and her very high SHBG is binding almost all of it.","low_causes":"Age, chronic inflammation, adrenal insufficiency, oral contraceptives","high_causes":"PCOS, adrenal hyperplasia, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"0.55","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3361","lower_normal":"0.5","upper_normal":"6.5","lower_optimal":"1.0","upper_optimal":"5.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"","description":"The free androgen index estimates the proportion of testosterone that is biologically active, calculated from total testosterone and SHBG. At 0.55, this sits right at the floor of the normal range (0.5 to 6.5) and well below the optimal threshold of 1.0. This confirms that her very high SHBG is leaving very little testosterone available for her tissues, which directly connects to her low libido, difficulty with body composition and may contribute to her fatigue.","low_causes":"High SHBG, low testosterone, chronic inflammation, oral contraceptives","high_causes":"PCOS, low SHBG, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4246","lower_normal":"0.26","upper_normal":"11","lower_optimal":"2.5","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4029","upper_optimal_position":"0.5736","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to both testosterone and oestrogen. At 3.2, this is within the normal range. DHEA-S declines with age and stress. Her level is adequate but not high, which is consistent with her chronic stress and inflammatory condition.","low_causes":"Adrenal insufficiency, chronic stress, age","high_causes":"Adrenal hyperplasia, PCOS, adrenal tumour","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"327","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4929","lower_normal":"59","upper_normal":"619","lower_optimal":"59","upper_optimal":"619","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"uIU/mL","description":"Prolactin is a pituitary hormone best known for stimulating milk production but also involved in immune regulation and mood. At 327, this is within the normal non-pregnant range (59 to 619). Normal prolactin makes a pituitary cause of her hormonal pattern unlikely.","low_causes":"Dopamine agonist medication","high_causes":"Pregnancy, breastfeeding, pituitary tumour, stress, medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"127.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6148","lower_normal":"27.8","upper_normal":"146","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3677","upper_optimal_position":"0.5369","units":"nmol/L","description":"SHBG is a protein made by the liver that binds sex hormones (testosterone and oestrogen), making them unavailable to tissues. At 127.6, this is within the laboratory range (27.8 to 146) but far above the optimal ceiling of 100. A very high SHBG means most of her testosterone is bound and inactive, which is why her free testosterone and free androgen index are so low despite a total testosterone within range. SHBG rises with inflammation, which in her case is being driven by active rheumatoid arthritis. If inflammatory disease control improves, SHBG should fall and free testosterone should rise without any hormonal intervention.","low_causes":"Obesity, insulin resistance, PCOS, hypothyroidism","high_causes":"Chronic inflammation, liver disease, oral contraceptives, hyperthyroidism, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.005","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3264","lower_normal":"0.01","upper_normal":"0.25","lower_optimal":"0.02","upper_optimal":"0.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5972","units":"nmol/L","description":"Free testosterone is the fraction of testosterone not bound to proteins and available to act on tissues. It is calculated from total testosterone, SHBG and albumin. At 0.005, this is below the lower limit of 0.01, meaning essentially none of her testosterone is available to her tissues. This is the direct driver of her low libido and likely contributes to her difficulty gaining muscle and managing body composition. The cause is her very high SHBG at 127.6, which is binding virtually all of her circulating testosterone. Chronic inflammation from rheumatoid arthritis is the most probable driver of the elevated SHBG. Improving disease control is the first step to improving this number.","low_causes":"High SHBG, chronic inflammation, oral contraceptives, liver disease","high_causes":"PCOS, low SHBG, exogenous testosterone","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"0.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3636","lower_normal":"0.05","upper_normal":"0.6","lower_optimal":"0.12","upper_optimal":"0.55","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6364","units":"nmol/L","description":"Bioavailable testosterone includes both the free testosterone and the portion loosely bound to albumin, which can still act on tissues. At 0.1, this is within the reference range but below the optimal threshold of 0.12. This confirms the pattern seen with free testosterone: her very high SHBG is leaving minimal testosterone available for her body to use.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"3.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The free oestradiol index estimates the proportion of oestradiol not bound to SHBG. At 3.76, this is reported for context. Despite her high SHBG, there is sufficient free oestradiol, as oestradiol binds to SHBG with less affinity than testosterone.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"ph","name":"Urine pH","group":"URINALYSIS","result":"6.5","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine pH measures how acidic or alkaline the urine is. At 6.5, this is slightly acidic, which is normal and typical.","low_causes":"","high_causes":"","padding":"","one_sided":"","range_type":""},{"key":"urineprotein","name":"Urine Protein","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_ // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
