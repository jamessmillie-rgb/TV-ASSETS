<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Kayleigh Blannin","dob":"15/08/1987","report_date":"2026-11-10","summary":"Customer is a 39-year-old female presenting with a BMI of 24.1, following an ultra-processed and fast-food heavy diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food some days; portions are about average (volume 5 out of 10). She trains four times per week (three cardio, one resistance) at moderate intensity with 7,500 to 10,000 daily steps. She sleeps 7 to 8 hours but wakes tired most mornings, feels wired at night, and finds stress hard to manage most days. She drinks 1 to 4 alcoholic drinks per week. She takes no medications but supplements with vitamin D, magnesium and creatine. She has a diagnosis of rheumatoid arthritis. She has had a previous blood test where everything was reported as normal. She reports brain fog, weight gain and difficulty losing weight, low sex drive, and joint pain and stiffness, all lasting over a year. Her goals are to improve mood, improve long-term health and longevity, and reduce stress and anxiety.\n\nThe finding in this report that should be discussed with her GP first is the combination of a markedly raised ESR alongside a significantly elevated Lp(a) and a raised IgM, particularly in the context of her rheumatoid arthritis. Her ESR, which stands for erythrocyte sedimentation rate and measures how quickly red blood cells settle in a tube over one hour, is 36, three times the upper limit of 12. ESR rises when inflammation is present anywhere in the body, and in someone with rheumatoid arthritis this is a strong signal that the disease may be more active than her symptoms alone suggest. Rheumatoid arthritis is a condition where the immune system attacks the lining of the joints, and when it is active, it drives systemic inflammation that shows up not just as joint stiffness but as fatigue, brain fog and mood changes, all of which she reports. Her hs-CRP, which is a more specific marker of acute inflammation, is 1.4, which is above the ideal threshold of 1.0 but not dramatically elevated. The discrepancy between a very high ESR and a modestly raised CRP is characteristic of chronic, smouldering inflammation rather than an acute flare, and this pattern fits well with someone who has had symptoms for over a year. Her IgM, one of the five classes of antibody the immune system produces, is 3.63, above the upper limit of 3.0. IgM is the first antibody the body makes in response to an immune challenge, and a raised IgM in the context of rheumatoid arthritis may reflect ongoing autoimmune activation. Her rheumatoid factor at 5 is well within the normal range below 14, which is reassuring and suggests the disease is seronegative, but the ESR and IgM together indicate that inflammatory activity is present and warrants a conversation with her rheumatology team about whether her current management is adequate.\n\nHer Lp(a) is 210, which places it in the high-risk category above 200. Lp(a), or lipoprotein little a, is an inherited particle that carries cholesterol into artery walls, encourages blood clotting, and drives inflammation. It is genetically determined and does not change meaningfully with diet, exercise or lifestyle. This is a number she is born with, it will not improve, and it is the single biggest driver of her cardiovascular risk score in this report, which the pipeline has calculated at 70 out of 100. That score has no age term, so it measures the risk being built in her arteries right now, not a ten-year probability. At 39, her ten-year risk of a cardiovascular event is still low simply because of her age, but the gap between a low ten-year risk and a high underlying score is the window she has for acting. Her GP should be made aware of this result. It should be recorded permanently in her medical notes, and it is worth testing first-degree relatives, because if one parent carries a high Lp(a) their children have a 50% chance of inheriting it. The good news is that when Lp(a) is corrected out of her LDL, her Lp(a)-corrected LDL falls to 2.66, which is much closer to the target of below 3 and shows that a meaningful portion of her measured LDL is actually Lp(a) particles rather than conventional LDL cholesterol. This matters because the modifiable portion of her lipid risk is smaller than the headline numbers suggest.\n\nBefore exploring the rest of the lipid picture, there is a good deal of reassurance in these results. Her liver is in excellent health. ALT at 11 and GGT at 14 are both comfortably within the ideal range, and her FIB-4 score at 0.94 confirms there is no sign of liver scarring or fatty change. Her APRI at 0.201 and NAFLD fibrosis score at minus 1.7 both reinforce this. Her pancreas is working well, with amylase at 90 and lipase at 46 both sitting comfortably within range. Her thyroid is functioning normally. TSH at 2.3 is within the optimal window of 1.0 to 2.5, free T4 at 17.2 is within the ideal range, free T3 at 5.3 is within the optimal band, and both thyroid antibodies are negative, which makes autoimmune thyroid disease very unlikely and is important given that autoimmune conditions can cluster. Her FT3 to FT4 ratio at 0.308 confirms she is converting the storage hormone to the active hormone efficiently. Her blood sugar control is excellent. Fasting glucose at 4.4 is within the ideal range, HbA1c at 37 in mmol/mol is just above the strictest optimal threshold of 36 but, expressed in percentage terms at 5.5%, sits within the optimal band, though still well within the normal range below 42. Her HOMA-IR, which combines fasting glucose and insulin to estimate how sensitive her cells are to insulin, is 0.88, which is below 1.0 and places her in the insulin-sensitive category, an excellent result. Her fasting insulin at 4.48 is within the optimal range. Her estimated average glucose at 6.2 and TyG index at 7.76 are both within their ideal ranges. Her calcium metabolism is healthy, with corrected calcium at 2.47 and parathyroid hormone at 1.9, both well within range. Phosphate at 1.2 is normal. Her uric acid at 280 is within the ideal range. Her vitamin D is 208, which is well above the sufficient threshold of 75 and reflects consistent supplementation; this is a strong result. Her coeliac screen is negative, which is useful given her joint and fatigue symptoms. Her IgG and IgA are within range, and her IgE at 41.5 is within normal limits, making a significant allergic component unlikely. Her tumour markers are all reassuring: CA125 at 14.9, CA15-3 at 22.72, CA19-9 at 30.8 and CEA at 1.12 are all within their respective ranges. Her urinalysis is clean, with no protein, no glucose, no blood, negative nitrites and insignificant growth on culture. Her creatine kinase at 72 is normal and suggests her muscles are recovering well from training.\n\nTurning to her lipid profile in more detail, her total cholesterol is 5.9, above the desirable threshold of 5.18. Her LDL at 3.34 is above the upper limit of 3.0, and her ApoB, which counts the number of cholesterol-carrying particles in the blood and is considered a more accurate measure of cardiovascular risk than LDL alone, is 1.03, above the target of 0.9 and in the borderline high category. However, her HDL at 2.3 is excellent, well above the desirable threshold of 1.55, and her triglycerides at 0.67 are excellent, well below 1.0. Her ApoA1, the protein on HDL particles, is 2.56, which is strong. Her ApoB to ApoA1 ratio at 0.40 is well within the lower-risk category below 0.6. Her TG to HDL ratio, which is a surrogate for insulin resistance and small dense LDL, is 0.29, which is outstanding. Her atherogenic index of plasma at minus 0.536 and her Castelli II ratio at 1.45 are both well within the ideal ranges. Her remnant cholesterol at 0.26 is within the optimal band below 0.5. So the lipid picture is a mix: exceptional HDL, exceptional triglycerides, an excellent ratio profile, but an LDL and ApoB that are above target, and a very high Lp(a) that she cannot change. The strategy here is to bring the modifiable portion of her LDL down through diet, because her Lp(a)-corrected LDL at 2.66 shows there is room to get the controllable part into the ideal range, while the Lp(a) itself is a conversation for her GP about whether additional intervention is warranted given the overall picture.\n\nHer kidney function needs attention. Her cystatin C is 1.16, above the upper limit of 1.1. Cystatin C is a small protein filtered by the kidneys and is considered a more reliable measure of kidney function than creatinine alone, particularly in women. Her cystatin C-derived eGFR is 75, and the combined creatinine and cystatin C eGFR is also 75, both below the optimal threshold of 90. Her creatinine-based eGFR at 85 is slightly higher but still below ideal. At 39, with a healthy BMI and no diabetes or hypertension, an eGFR of 75 is lower than expected and warrants monitoring. It does not indicate kidney disease at this stage, but it is a number her GP should be aware of and should be repeated in three to six months to establish whether it is stable or trending. Her urea at 5 and urea-to-creatinine ratio at 65.8 are both normal, and there is no protein in her urine, which is reassuring. Her bicarbonate is 18.5, below the lower limit of 20. A low bicarbonate can reflect a mild metabolic acidosis, and in the context of a slightly reduced eGFR, this could suggest the kidneys are not buffering acid as efficiently as they should. This is another reason to repeat these markers and discuss with her GP.\n\nHer red cell distribution width, or RDW, is 14.5, just above the upper limit of 14. RDW measures the variation in size of red blood cells, and a mildly raised RDW can reflect early iron deficiency, B12 or folate issues, or chronic inflammation. Her ferritin at 40 is within the laboratory range but below the optimal threshold of 40 to 150 for women, sitting right at the floor. Her transferrin saturation at 23.14% is below the optimal range of 25 to 40%. Her serum iron at 16.1 and transferrin at 2.77 are both within range. Together, this suggests her iron stores are adequate but not generous, and the slightly raised RDW may reflect the combination of borderline iron status and chronic inflammation from her rheumatoid arthritis. Her reticulocyte count at 0.51% is right at the lower boundary of the range, and her absolute reticulocyte count at 21, well below the lower limit of 50, suggests the bone marrow is producing red cells at the lower end of its capacity. In the context of chronic inflammatory disease, this pattern can reflect what is called anaemia of chronic disease, where inflammation suppresses the bone marrow's ability to produce red cells efficiently even when iron is technically available. Her haemoglobin at 130 is within range but at the lower end, and her albumin at 37 is within range but again at the lower end. These subtle findings are consistent with the inflammatory burden of rheumatoid arthritis quietly affecting multiple systems.\n\nHer free testosterone, calculated at 0.005, is below the lower limit of 0.01, and her bioavailable testosterone at 0.1 is below the optimal range of 0.12 to 0.55. Her total testosterone at 0.7 is within range, and her SHBG, sex hormone binding globulin, which is the protein that binds testosterone and makes it unavailable to tissues, is 127.6, which while within the laboratory range of 27.8 to 146, is very high. This is the mechanism: SHBG is binding so much of her testosterone that the amount free to act on tissues is below the threshold. Low free testosterone in women is associated with reduced libido, difficulty building muscle, fatigue and low mood, all of which she reports. Her free androgen index at 0.55 confirms the picture, sitting right at the floor of the range. High SHBG can be driven by inflammation, by oral contraceptives (she is not on one), by low body weight (her BMI is healthy at 24.1), or by thyroid function (hers is normal). In her case, chronic inflammation from rheumatoid arthritis is the most likely driver. Her oestradiol at 480 is consistent with a luteal phase reading, which fits with a regular cycle, and her LH at 4.9 and FSH at 5.78 are consistent with a premenopausal woman in the luteal phase. Her progesterone at 84.76 nmol/L is marginally above the laboratory upper limit of 81.28, which at this margin in the luteal phase most likely reflects a sample taken at peak progesterone output shortly after ovulation; it is worth noting to her GP for context but is not a cause for alarm. Her DHEA-S at 3.2 is within range. Her prolactin at 327 is within the normal non-pregnant range. Her cortisol at 413 is within the morning reference range, and while not dramatically elevated, is in the upper half of the range, which is consistent with someone reporting stress most days and feeling wired at night.\n\nHer C-peptide at 0.914 is below the lower limit of 1.1. C-peptide is released by the pancreas in equal amounts to insulin and is used as a measure of how much insulin the pancreas is producing. However, her fasting insulin at 4.48 is within the ideal range, her glucose is 4.4, and her HOMA-IR is 0.88, all of which confirm she is insulin-sensitive and her pancreas is producing exactly the right amount of insulin for her needs. Given that every other marker of glucose metabolism is excellent, this below-range C-peptide most likely reflects low insulin demand rather than a true clinical finding, and it does not warrant concern on its own.\n\nHer PhenoAge, a composite biological age score built from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 40.1 against a calendar age of 39, a difference of 1.1 years. The small gap is being driven primarily by her raised CRP and mildly raised RDW, both consequences of her inflammatory condition. Bringing inflammation under better control would be expected to bring her PhenoAge back in line with or below her calendar age. Her cardiovascular risk score is 70 out of 100, which is high and is driven almost entirely by her Lp(a) at 210. Without the Lp(a), her lipid profile would generate a much lower score given her excellent HDL, triglycerides and ratios.\n\nHer folate at 18 is marginally above the upper limit of 17. This is not a concern and likely reflects dietary intake or supplementation; high folate does not cause harm. Her total antioxidant activity at 1.86 is marginally above the range of 1.3 to 1.77, which may reflect her supplementation with creatine and vitamin D and is not a concern. Her magnesium at 0.82 is within the laboratory range but below the optimal band of 0.85 to 1.05, which given she is supplementing with magnesium suggests either the dose is modest or absorption could be improved. Her globulin at 36 is at the upper boundary of the range, consistent with chronic immune activation from her rheumatoid arthritis. Her serum osmolality at 281.4 is within the ideal range. Her De Ritis ratio at 1.64 is marginally above the upper limit of 1.6, but with both AST and ALT well within their individual ranges and all other liver markers clean, this is an artefact of having a very low ALT (11) making the denominator small, and carries no clinical significance.","links":"The thread running through this report is chronic inflammation from rheumatoid arthritis, and how it is quietly affecting multiple systems beyond the joints. The raised ESR at 36, the modestly elevated hs-CRP at 1.4, the raised IgM at 3.63, the globulin at the top of its range, and the suppressed reticulocyte production all point to the immune system being persistently active. Rheumatoid arthritis does not stay in the joints; when it is active it releases inflammatory cytokines that circulate throughout the body, and those cytokines suppress bone marrow output (explaining the low reticulocytes and borderline haemoglobin), raise SHBG (explaining the very low free testosterone despite a normal total testosterone), and contribute to fatigue, brain fog and low mood.\n\nThe low free testosterone is not a separate problem; it is a downstream consequence of the same inflammatory process. SHBG at 127.6 is binding almost all of her circulating testosterone, leaving a free testosterone of 0.005 against a lower limit of 0.01. This directly connects to her reported low libido, difficulty with weight and body composition, and potentially her joint stiffness beyond what the arthritis itself causes. If the inflammatory disease is brought under better control, SHBG should fall and free testosterone should rise without any hormonal intervention.\n\nThe Lp(a) at 210 is a separate and independent finding with no connection to the rheumatoid arthritis. It is inherited, unchangeable, and represents a cardiovascular risk factor that will be present for her entire life. The elevated LDL and ApoB are partly inflated by Lp(a) particles being counted in the LDL measurement, which is why the Lp(a)-corrected LDL at 2.66 is much closer to target. The modifiable portion of her cardiovascular risk, the part driven by diet and lifestyle, is smaller than it first appears, but it is still worth optimising because with a fixed risk factor like Lp(a) she cannot afford to have additional modifiable risk layered on top.\n\nThe kidney findings, a cystatin C of 1.16 and an eGFR of 75, sit slightly apart from the inflammatory story. Rheumatoid arthritis and the medications used to treat it can affect kidney function over time, so while an eGFR of 75 at 39 may reflect natural variation, it needs to be tracked. The low bicarbonate at 18.5 could indicate the kidneys are not buffering acid as efficiently as expected and adds a reason to repeat these markers. If her rheumatology team prescribes or has prescribed NSAIDs or DMARDs, kidney monitoring becomes part of that ongoing care.\n\nWhat has been excluded is important. Thyroid disease, coeliac disease, diabetes, significant anaemia, liver disease, allergic disease and malignancy have all been made unlikely by these results. The symptoms she reports, brain fog, fatigue, weight difficulty, low libido and joint stiffness, are all well-recognised features of active rheumatoid arthritis and its inflammatory effects on hormones, energy and cognition. Better disease control is likely to improve all of them.","lifestyle":"Add a palm-sized portion of protein to every meal, starting with breakfast: eggs, Greek yoghurt, tinned fish, or leftover meat. Anchor: protein goes on the plate before anything else. Why: her diet is very low in vegetables and fruit and likely low in protein; adequate protein supports muscle recovery from her four weekly sessions, helps with the weight difficulty she reports, and supports immune function in the context of her rheumatoid arthritis. Aim for at least 80 to 100 grams of protein per day.\nBuild vegetable and fruit portions from 0 to 1 up to at least 4 a day, adding one extra portion per week. Start with one piece of fruit at breakfast and one handful of vegetables at dinner. Why: plant fibre feeds beneficial gut bacteria that produce short-chain fatty acids, which reduce systemic inflammation, and the antioxidants in coloured vegetables directly combat the oxidative stress from her inflammatory condition. Soluble fibre from oats, beans and lentils also helps lower the modifiable portion of her LDL cholesterol.\nReplace ultra-processed snacks with whole-food alternatives one swap at a time: nuts and seeds instead of crisps, dark chocolate instead of confectionery, oatcakes with cheese instead of biscuits. Anchor: when buying the weekly shop, swap one processed item for one whole-food item each week. Why: ultra-processed foods contain emulsifiers and additives that may increase intestinal permeability and worsen inflammatory conditions, and the sugary foods she eats some days drive insulin spikes that, while her insulin sensitivity is currently excellent, contribute to long-term risk.\nEat two portions of oily fish per week: salmon, mackerel, sardines or trout. Anchor: pick two fixed evenings. Why: omega-3 fatty acids from oily fish reduce the inflammatory cytokines driving her raised ESR and have a direct effect on joint stiffness in rheumatoid arthritis, and they help lower ApoB.\nWalk outside within the first hour of waking, even for ten minutes. Anchor: before the first cup of coffee. Why: morning light resets the circadian clock, which directly addresses her pattern of feeling wired at night and tired in the morning. This is the single most effective free intervention for a shifted cortisol rhythm.\nSet a caffeine cut-off at 1pm. Why: caffeine has a half-life of five to six hours, so a coffee at 3pm still has half its stimulant effect at 9pm, which contributes to the wired-at-night pattern she describes and impairs sleep quality even when sleep duration is adequate.\nAdd one more resistance session per week, making two per week in total. Anchor: attach it to an existing training day as a swap for one cardio session. Why: resistance training is the most effective intervention for maintaining bone density and muscle mass in inflammatory disease, supports insulin sensitivity, and at her current single session per week she is below the threshold where meaningful strength adaptation occurs. Two sessions per week is the minimum effective dose.\nSpend ten minutes before bed doing a structured wind-down: dim lights, no screens, and either a breathing exercise (four counts in, seven hold, eight out) or gentle stretching. Anchor: set a phone alarm labelled 'wind down' 30 minutes before her target bedtime. Why: her stress is hard to manage most days and she is wired at night; a consistent wind-down routine lowers evening cortisol and allows the transition into sleep that her body is currently struggling with.","flags":"ESR 36, three times the upper limit of 12, in a patient with rheumatoid arthritis. This indicates active systemic inflammation and should be discussed with her rheumatology team to assess whether her disease management needs adjustment. IgM at 3.63 (above the limit of 3.0) and globulin at 36 (at the upper boundary) support ongoing immune activation.\nLp(a) 210 nmol/L, in the high-risk category above 200. This is an inherited, unchangeable cardiovascular risk factor. It should be recorded permanently in her medical notes. First-degree relatives should be offered testing. Her GP should discuss overall cardiovascular risk management in light of this result, including whether lipid-lowering therapy is appropriate given the combination of raised Lp(a), LDL 3.34 and ApoB 1.03.\nFree testosterone (calculated) 0.005 nmol/L, below the lower limit of 0.01, with SHBG 127.6 nmol/L (high within range) binding nearly all circulating testosterone. Bioavailable testosterone 0.1, below the optimal range. This is the likely driver of her low libido, difficulty with body composition and may contribute to fatigue and mood. Chronic inflammation from rheumatoid arthritis is the probable cause of the elevated SHBG.\nLDL 3.34 (above the limit of 3.0) and ApoB 1.03 (above the target of 0.9, borderline high category). However, Lp(a)-corrected LDL is 2.66, showing that a significant portion of measured LDL is Lp(a) particles. HDL 2.3, triglycerides 0.67, TG/HDL ratio 0.29 and ApoB/A1 ratio 0.40 are all excellent.\nCystatin C 1.16 (above the limit of 1.1), with cystatin C-derived eGFR 75 and combined eGFR 75, both below the optimal threshold of 90. At 39 with no diabetes or hypertension, this is lower than expected and should be repeated in three to six months to confirm stability. Bicarbonate 18.5 (below the limit of 20) may reflect mildly reduced renal acid buffering.\nESR 36 with reticulocyte absolute count 21 (below the limit of 50) and reticulocyte percentage 0.51 (at the floor of the range). This pattern is consistent with inflammation-mediated suppression of red cell production. Haemoglobin 130 is within range but at the lower end. Ferritin 40 is at the floor of the optimal range and transferrin saturation 23% is below optimal.\nRDW 14.5, marginally above the upper limit of 14. In the context of borderline iron stores and chronic inflammation, this likely reflects mild variation in red cell size from both contributors.\nhs-CRP 1.4, above the ideal threshold of 1.0 but within the laboratory range below 5. Consistent with low-grade chronic inflammation.\nC-peptide 0.914, below the lower limit of 1.1. All other glucose metabolism markers (glucose 4.4, insulin 4.48, HbA1c 37, HOMA-IR 0.88) are excellent. In the context of her otherwise excellent glucose metabolism markers, this low C-peptide most likely reflects low insulin demand rather than a clinical finding.\nDe Ritis ratio 1.64, marginally above the upper limit of 1.6, driven by a very low ALT of 11. All individual liver markers are well within range and this carries no clinical significance.\nProgesterone 84.76 nmol/L, marginally above the upper limit of 81.28. In the context of a regular cycle and oestradiol consistent with the luteal phase, this is most likely a peak luteal reading and not a clinical concern, but should be noted with her GP for context.\nReassuring negatives: thyroid function is normal with negative antibodies, making autoimmune thyroid disease unlikely. Coeliac screen is negative. Glucose, insulin and HbA1c make diabetes and insulin resistance unlikely. Liver enzymes, FIB-4, APRI and NAFLD fibrosis score make liver disease and fatty liver unlikely. Rheumatoid factor is negative. IgE is normal, making significant allergic disease unlikely. All tumour markers (CA125, CA15-3, CA19-9, CEA) are within range. Urinalysis is clean with no protein, no blood and insignificant growth.","recommendations":"Discuss the ESR of 36 and IgM of 3.63 with her rheumatology team. These suggest her rheumatoid arthritis may be more active than her current symptoms indicate, and the team should assess whether her disease management plan needs adjusting. Better disease control is likely to improve her fatigue, brain fog, low libido and joint stiffness through lowering systemic inflammation and reducing SHBG.\nDiscuss the Lp(a) result of 210 nmol/L with her GP. This is an inherited cardiovascular risk factor in the high-risk category. It should be recorded permanently in her notes. Her GP should consider her overall cardiovascular risk profile including the raised LDL (3.34) and ApoB (1.03), and discuss whether lipid-lowering therapy is appropriate. First-degree relatives (parents, siblings, children) should be offered Lp(a) testing.\nDiscuss the low free testosterone of 0.005 (below the limit of 0.01) and very high SHBG of 127.6 with her GP. If inflammation control does not improve free testosterone over the next three to six months, further investigation or referral to endocrinology may be warranted.\nRepeat kidney function markers (cystatin C, creatinine, eGFR, bicarbonate) in three to six months to establish a trend. An eGFR of 75 at 39 warrants monitoring. If her rheumatology team prescribes or has prescribed NSAIDs or DMARDs, kidney monitoring should be part of that ongoing care.\nRepeat the full blood count including reticulocytes in three months. The low absolute reticulocyte count of 21 and borderline haemoglobin of 130 should be monitored, particularly as inflammatory control changes.\nCalorie and protein targets: at 61.7 kg, 160 cm, training four times per week at moderate intensity with good daily steps, her estimated maintenance calories are approximately 1,900 to 2,050 per day (BMR of approximately 1,370 multiplied by an activity factor of 1.45 to 1.5). Given her goal of weight management without aggressive loss, eating at or just below maintenance (1,800 to 1,950 calories) with a protein target of 80 to 100 grams per day (1.3 to 1.6 g per kg) would support muscle retention, immune function and satiety. Retest in three to four months with: ESR, CRP, full blood count with reticulocytes, cystatin C, creatinine, eGFR, bicarbonate, lipid profile with ApoB, SHBG, free testosterone and iron studies.","supplementation":"Vitamin D3 (cholecalciferol): reduce from current dose to a maintenance dose of 1,000 to 2,000 IU daily, taken with a fat-containing meal. Her level at 208 is excellent and above the optimal ceiling of 120, so a lower maintenance dose will keep her in the ideal range of 75 to 120 without accumulating further. Always take with vitamin K2.\nVitamin K2 (MK-7): 100 mcg daily, taken with her vitamin D. Why: K2 directs calcium into bones rather than arteries, which is important both for cardiovascular protection given her Lp(a) and for bone health in an inflammatory condition.\nMagnesium glycinate: 300 to 400 mg before bed. She is already supplementing magnesium, but her level at 0.82 is below the optimal range of 0.85 to 1.05, suggesting the dose or form could be improved. Glycinate is the best-absorbed form and has a calming effect that directly addresses her wired-at-night pattern. Taking it before bed supports sleep quality.\nOmega-3 fish oil: 2 to 3 grams of combined EPA and DHA daily, with food. Why: omega-3 fatty acids reduce the inflammatory cytokines driving her raised ESR, have a direct anti-inflammatory effect on joint tissue in rheumatoid arthritis, and help lower ApoB. Choose a product that states the EPA and DHA content, not just 'fish oil 1000mg'.\nVitamin B12 (sublingual methylcobalamin): 1,000 mcg daily, dissolved under the tongue. Her B12 at 478 is within the laboratory range but below the optimal threshold of 500. Sublingual delivery bypasses the gut and is more reliable than tablets. B12 supports energy, nerve function and red cell production, all relevant given her fatigue and low reticulocyte count.\nIron (ferrous bisglycinate): 25 mg every other day, taken with vitamin C (a glass of orange juice or a 250 mg tablet) on an empty stomach, away from her magnesium and any tea or coffee. Her ferritin at 40 is at the floor of the optimal range and her transferrin saturation at 23% is below optimal. Every-other-day dosing improves absorption compared to daily dosing. If she develops stomach discomfort, take with a small amount of food. Recheck ferritin after three months.\nDo not take high-dose antioxidant supplements. Her total antioxidant activity is already above range at 1.86, and additional antioxidant supplementation is unnecessary and could interfere with the body's natural inflammatory signalling.\nThe most important changes from this report are not supplements. They are getting her rheumatoid arthritis inflammation under better control through her rheumatology team, recording and acting on her Lp(a), building vegetables and protein into every meal, and fixing her sleep-wake rhythm with morning light and an evening wind-down.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 53.5; held to 49 by two or more systems rated \"See your GP\". Weakest systems: vitamins & nutrients 13%, lipids & cardiovascular 23%, immunology 31%. Biggest drags: Vitamin D, Lipoprotein(a), Apolipoprotein B, LDL Cholesterol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"40.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4557","lower_normal":"","upper_normal":"44","lower_optimal":"","upper_optimal":"39","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4432","units":"years","description":"PhenoAge is a composite biological age score calculated from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 40.1 against a calendar age of 39, her biological age is 1.1 years older than her chronological age. The small gap is being driven primarily by her raised CRP and mildly raised RDW, both consequences of her chronic inflammatory condition. Bringing inflammation under better control would be expected to bring PhenoAge back in line with or below her calendar age.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"70","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8750","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is a composite index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hs-CRP and HbA1c. It has no age term and measures the risk being built in the arteries right now. At 70, this is above the flagged threshold of 40 and is driven almost entirely by her Lp(a) at 210. Without the Lp(a), her lipid profile, with excellent HDL, exceptional triglycerides and favourable ratios, would generate a much lower score. At 39, her ten-year risk of a cardiovascular event is still low, but the gap between a low ten-year risk and a high underlying score is the window for acting. Her GP should be made aware.","low_causes":"Excellent lipid profile, low inflammation","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the amount of sugar circulating in her blood after fasting. At 4.4, this sits comfortably within the ideal range of 4.0 to 5.4, confirming that her body is managing blood sugar efficiently. This is a reassuring result given her concerns about weight management.","low_causes":"Fasting, excessive exercise, insulin excess","high_causes":"Diabetes, insulin resistance, stress, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"4.0","upper_normal":"6.0","lower_optimal":"4.0","upper_optimal":"5.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6000","units":"%","description":"HbA1c measures the average blood sugar over the past two to three months by looking at how much sugar has attached to haemoglobin in red blood cells. At 5.5%, this is well below the pre-diabetes threshold of 6.0% and within the optimal range, confirming excellent long-term blood sugar control.","low_causes":"Low carbohydrate intake, very active lifestyle","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5909","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c result expressed in mmol/mol, the unit used in UK laboratories. At 37, it is within the normal range below 42 and just above the optimal threshold of 36. This is not a concern; it reflects healthy blood sugar control. The slightly above-optimal reading reflects blood sugar levels that are well controlled but just outside the strictest optimal band.","low_causes":"Low carbohydrate intake, very active lifestyle","high_causes":"Diabetes, pre-diabetes, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3614","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.6","upper_optimal":"8.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4141","units":"mIU/L","description":"Insulin is the hormone the pancreas releases to move sugar from the blood into cells for energy. A high fasting insulin means the body is having to produce more insulin than it should to keep blood sugar under control, which is an early warning of insulin resistance. At 4.48, her insulin is within the optimal range of 2 to 8, confirming excellent insulin sensitivity. This is a strong result.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes","high_causes":"Insulin resistance, pre-diabetes, obesity, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.914","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3145","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5253","units":"ug/L","description":"C-peptide is a protein released by the pancreas in equal amounts to insulin. It is used to measure how much insulin the pancreas is producing. At 0.914, this is below the lower limit of 1.1. However, her fasting insulin at 4.48, glucose at 4.4 and HOMA-IR at 0.88 all confirm excellent insulin sensitivity and appropriate insulin production. In this context, a low C-peptide is most likely a reflection of low insulin demand rather than a genuine clinical finding.","low_causes":"Sample degradation, type 1 diabetes, low insulin demand","high_causes":"Insulin resistance, insulinoma, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homair","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.88","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4600","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR combines fasting glucose and insulin to estimate how sensitive the body's cells are to insulin. A score below 1.0 means the body is insulin-sensitive, which is the ideal state. At 0.88, this confirms excellent insulin sensitivity. Despite her concerns about weight gain, her metabolic health at the insulin level is working very well.","low_causes":"High insulin sensitivity, low carbohydrate diet","high_causes":"Insulin resistance, pre-diabetes, obesity, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an estimated daily average blood sugar. At 6.2, this is within the reference range, confirming good blood sugar control over the past two to three months.","low_causes":"Very low carbohydrate diet, high activity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4409","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index combines fasting triglycerides and glucose to estimate insulin resistance. At 7.76, this is within the optimal range, confirming excellent insulin sensitivity and consistent with her low HOMA-IR.","low_causes":"High insulin sensitivity","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"130","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4444","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen around the body. At 130, this is within the normal range for women (120 to 150) but sits in the lower portion. In the context of her chronic inflammatory condition and borderline iron stores, this is worth monitoring. She is not anaemic, but the combination of a lower-end haemoglobin with low reticulocyte production suggests the bone marrow is not producing red cells as vigorously as it could.","low_causes":"Iron deficiency, chronic disease, blood loss, B12 or folate deficiency","high_causes":"Dehydration, polycythaemia, living at altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.14","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6333","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells in the blood. At 4.14, this is within the normal and optimal range, confirming adequate red cell numbers even though production rate (reticulocytes) is low.","low_causes":"Anaemia, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.394","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4467","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit measures the proportion of blood volume occupied by red blood cells. At 0.394, this is within the normal and optimal range, indicating good hydration and adequate red cell mass.","low_causes":"Anaemia, overhydration, chronic disease","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"14.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7361","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.6","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5972","units":"%","description":"RDW measures the variation in size of red blood cells. A higher number means the cells are more varied in size, which can happen when the body is making red cells under stress from iron deficiency, B12 or folate issues, or chronic inflammation. At 14.5, this is marginally above the upper limit of 14. In the context of her borderline ferritin, below-optimal transferrin saturation and active rheumatoid arthritis, this likely reflects a combination of borderline iron stores and inflammatory effects on red cell production.","low_causes":"Typically not clinically significant","high_causes":"Iron deficiency, B12 or folate deficiency, chronic inflammation, mixed anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"95.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5611","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6111","units":"fL","description":"MCV measures the average size of red blood cells. At 95.3, this is within the optimal range. Normal-sized cells indicate that neither iron deficiency (which makes cells small) nor B12/folate deficiency (which makes cells large) is significantly affecting red cell production.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"31.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6267","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 31.4, this is within the optimal range, meaning each red cell is carrying a healthy amount of oxygen-transporting protein.","low_causes":"Iron deficiency","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"330","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the concentration of haemoglobin within red blood cells. At 330, this is within the optimal range, indicating the cells are packed with a healthy concentration of haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"224","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4282","lower_normal":"150","upper_normal":"410","lower_optimal":"170","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot. At 224, this is well within the optimal range, confirming healthy clotting function.","low_causes":"Viral infection, autoimmune disease, bone marrow suppression","high_causes":"Inflammation, iron deficiency, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6000","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets are younger and more active. At 9.5, this is within the optimal range, indicating normal platelet turnover.","low_causes":"Bone marrow suppression, older platelets","high_causes":"Increased platelet destruction or consumption, inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"6.55","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4750","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's army, fighting infections and managing inflammation. At 6.55, this is within the optimal range, indicating a well-functioning immune system that is neither suppressed nor overactive.","low_causes":"Viral infection, autoimmune disease, bone marrow suppression","high_causes":"Infection, inflammation, stress, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"3.22","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4147","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 3.22, this is within the optimal range.","low_causes":"Viral infection, autoimmune disease, medication","high_causes":"Bacterial infection, inflammation, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are the white blood cells responsible for targeted immune responses, including producing antibodies and fighting viruses. At 2.31, this is within the optimal range.","low_causes":"Viral infection, autoimmune disease, steroid use","high_causes":"Viral infection, chronic inflammation, leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5167","lower_normal":"0.2","upper_normal":"1.0","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0. ESR","group":"INFLAMMATION","result":"36","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5556","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. A high ESR indicates inflammation somewhere in the body. At 36, this is three times the upper limit of 12 and is the strongest signal of active inflammation in this report. In someone with rheumatoid arthritis, a raised ESR suggests the disease is more active than symptoms alone may indicate. This result should be discussed with her rheumatology team.","low_causes":"Low inflammation, polycythaemia","high_causes":"Inflammation, infection, autoimmune disease, anaemia, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count","group":"HEMATOLOGY","result":"0.51","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3350","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly produced red blood cells released from the bone marrow. The percentage tells us how actively the bone marrow is producing new red cells. At 0.51%, this is right at the floor of the normal range. Together with the very low absolute reticulocyte count, this suggests the bone marrow is producing red cells at a lower rate than expected, likely suppressed by the chronic inflammation from her rheumatoid arthritis.","low_causes":"Iron deficiency, chronic disease, bone marrow suppression, B12 or folate deficiency","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes Absolute","group":"HEMATOLOGY","result":"21.114","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1408","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"This is the absolute number of reticulocytes, or young red blood cells, in the blood. At 21, this is well below the lower limit of 50, meaning the bone marrow is producing far fewer new red cells than it should. In the context of active rheumatoid arthritis with an ESR of 36, this is consistent with inflammation-mediated suppression of red cell production, sometimes called anaemia of chronic disease. Despite her haemoglobin being within range at 130, the bone marrow is not replacing red cells at the expected rate. This should be monitored.","low_causes":"Chronic inflammatory disease, iron deficiency, bone marrow suppression","high_causes":"Blood loss, haemolysis, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"23","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index divides MCV by red blood cell count to help distinguish between iron deficiency anaemia and thalassaemia trait. At 23, with a normal MCV, this index does not apply and is reported for context.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","n timal_position":"0.3801","upper_optimal_position":"0.5981","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood. At 16.1, this is within the optimal range. Iron is essential for oxygen transport, energy production and immune function.","low_causes":"Iron deficiency, chronic disease, blood loss, vegetarian diet","high_causes":"Iron overload, haemochromatosis, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4026","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.6","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5897","units":"g/L","description":"Transferrin is the protein that transports iron through the blood. At 2.77, this is within the optimal range. Transferrin rises when iron stores are low (the body makes more transport protein to scavenge available iron) and falls in inflammation. Her normal transferrin alongside chronic inflammation is a reassuring sign that her iron transport system is functioning adequately.","low_causes":"Chronic inflammation, liver disease, iron overload","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"65.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5545","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"72","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.6241","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind iron. At 65.3, this is within the optimal range, indicating a healthy balance between
