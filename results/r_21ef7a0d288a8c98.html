mal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3712","upper_optimal_position":"0.6364","units":"IU/L","description":"Amylase is a digestive enzyme produced mainly by the pancreas and salivary glands that breaks down starch. Her level of 76 is within the optimal range, which is reassuring alongside the mildly elevated lipase, as significant pancreatic inflammation would typically raise both enzymes together.","low_causes":"Chronic pancreatitis (late stage), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"71","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7553","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"50","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5957","units":"U/L","description":"Lipase is a digestive enzyme produced by the pancreas that breaks down fats. Her level of 71 is above the upper limit of 60. A mildly elevated lipase with a normal amylase is a common finding and does not indicate acute pancreatitis, which would typically produce levels three or more times the upper limit. Mild elevations can occur after eating, with minor pancreatic irritation, or in conditions affecting the gut or gallbladder. It may be relevant to her bloating symptoms if fat digestion is slightly impaired. It should be mentioned to her GP, who may wish to monitor it or investigate further if symptoms persist.","low_causes":"Chronic pancreatitis (late stage)","high_causes":"Pancreatitis, gallstones, gut inflammation, coeliac disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"73","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3650","lower_normal":"50","upper_normal":"200","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5667","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation, and muscle function. It is produced in the skin from sunlight and is also obtained from food and supplements. Her level of 73 is sufficient by NHS standards but just below the optimal range of 75 to 120. She is already supplementing, which has brought her to this level, but a modest increase in dose should bring her into the optimal band. Vitamin D is particularly important for immune regulation and mood, both of which are relevant to her symptoms.","low_causes":"Insufficient sunlight, poor dietary intake, malabsorption, obesity, dark skin","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"3.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5373","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"4.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5373","units":"pmol/L","description":"PTH, or parathyroid hormone, regulates calcium levels in the blood by controlling how much calcium is absorbed from food, released from bones, and retained by the kidneys. Her level of 3.4 is within the laboratory range. Alongside normal calcium, this confirms healthy parathyroid function. PTH can be pushed slightly higher when vitamin D is below optimal, as the body works harder to maintain calcium levels, and this may normalise as her vitamin D improves.","low_causes":"Hypoparathyroidism, excess calcium, excess vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"701","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5645","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.5558","upper_optimal_position":"0.6229","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, red blood cell production, and DNA synthesis. Deficiency causes fatigue, neurological symptoms, and anaemia. Her level of 701 is within the optimal range of 500 to 900, confirming healthy B12 status. This rules out B12 deficiency as a cause of her fatigue and brain fog.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, metformin, aging","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"15","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6190","units":"ng/ml","description":"Folate, or vitamin B9, works alongside B12 in red blood cell production and DNA synthesis. It is found in leafy greens, legumes, and fortified foods. Her level of 9 is within the optimal range of above 8, confirming adequate folate status.","low_causes":"Poor dietary intake, malabsorption, alcohol, medications, pregnancy","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"hs-CRP","group":"INFLAMMATION","result":"0.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0500","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/L","description":"High-sensitivity CRP measures low levels of C-reactive protein, a marker produced by the liver in response to inflammation anywhere in the body. It is the most sensitive blood marker of systemic inflammation and also an independent cardiovascular risk factor. Her level is below 0.5, which is essentially at the floor of detection and means there is no measurable inflammatory process. This is an excellent result, particularly alongside her elevated Lp(a), because Lp(a) does more damage in an inflammatory environment and her body is not providing one.","low_causes":"No inflammation","high_causes":"Infection, autoimmune disease, obesity, cardiovascular risk, injury","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7053","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of HDL, LDL, and VLDL cholesterol. Her total of 7.3 is above the desirable limit of 5.18, but total cholesterol alone is a poor predictor of cardiovascular risk because it includes the protective HDL. Her very high HDL of 2.9 accounts for a large share of this total. The composition of the cholesterol, specifically ApoB and the Lp(a)-corrected LDL, matters more than the headline number.","low_causes":"Malnutrition, hyperthyroidism, liver disease, chronic illness","high_causes":"Diet, genetics, hypothyroidism, obesity, diabetes, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"1.49","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4382","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, derived from dietary fat and sugar and produced by the liver. They are best measured fasting. Her level of 1.49 is within the laboratory range of below 1.7 but above the optimal threshold of below 1.0. Triglycerides respond well to dietary changes: reducing refined carbohydrates and sugar, increasing omega-3 fatty acids from oily fish, and regular exercise all lower them.","low_causes":"Low fat diet, malnutrition, hyperthyroidism","high_causes":"High sugar and refined carbohydrate intake, alcohol, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.68","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4359","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, is produced by the liver to carry triglycerides to tissues. Her level of 0.68 is within the laboratory range of below 0.78 but above the optimal threshold of 0.6. VLDL tracks with triglycerides, and both would improve with the same dietary changes.","low_causes":"Low triglycerides","high_causes":"High triglycerides, insulin resistance, obesity, alcohol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9375","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/L","description":"HDL, or high-density lipoprotein, is often called 'good' cholesterol because it carries cholesterol away from artery walls and back to the liver for disposal. Higher is better. Her level of 2.9 is exceptionally high, well above the optimal threshold of 1.6 for women. This is a genuinely protective finding and one of the strongest positives in the report. It provides meaningful protection against cardiovascular disease, though it does not fully offset the risk from the elevated Lp(a).","low_causes":"Obesity, inactivity, smoking, metabolic syndrome, poor diet","high_causes":"Exercise, genetics, moderate alcohol, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.83","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6383","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/L","description":"LDL, or low-density lipoprotein, carries cholesterol to tissues and can deposit it in artery walls when levels are too high. Her LDL of 3.83 is above the upper limit of 3.0. However, her Lp(a)-corrected LDL is 3.24, showing that a meaningful portion of what the lab measures as LDL is actually the Lp(a) particle. The modifiable LDL is still above target, and dietary changes, particularly reducing saturated fat and increasing soluble fibre and omega-3, can bring it down. Her GP should also consider whether thyroid treatment may lower LDL, and whether lipid-lowering medication is appropriate given the Lp(a) burden.","low_causes":"Very low-fat diet, hyperthyroidism, malabsorption, liver disease","high_causes":"High saturated fat diet, genetics, hypothyroidism, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.52","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2800","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio divides total cholesterol by HDL and is a useful summary of cardiovascular risk. Her ratio of 2.52 is excellent, well below the 4.5 threshold, thanks to her exceptionally high HDL. This ratio is one of the strongest protective findings in the lipid panel.","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"39.73","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9933","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7500","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL. Her HDL accounts for nearly 40% of her total cholesterol, which is an excellent proportion. The higher this percentage, the more of the total cholesterol is the helpful kind.","low_causes":"Low HDL, high LDL or triglycerides","high_causes":"High HDL, low LDL","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5500","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL, and it captures all the potentially harmful cholesterol particles in one number: LDL, VLDL, IDL, and Lp(a). Her non-HDL of 4.4 is above the target of below 4.0. This includes her Lp(a) particles, which inflate the number and cannot be changed. The modifiable portion can be reduced through dietary changes and potentially medication.","low_causes":"Low-fat diet, malabsorption","high_causes":"High saturated fat diet, genetics, hypothyroidism, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8036","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles and is what gives HDL its protective function, enabling it to collect cholesterol from artery walls. Her level of 2.25 is excellent, well above the 1.4 threshold, and mirrors her exceptional HDL. This is a strong cardiovascular protective factor.","low_causes":"Obesity, inactivity, smoking, metabolic syndrome","high_causes":"Exercise, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.26","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every LDL, VLDL, IDL, and Lp(a) particle. Because each particle carries exactly one ApoB molecule, the ApoB level is effectively a count of all the potentially harmful cholesterol particles in the blood. It is considered the single best marker of cardiovascular risk from lipids. Her ApoB of 1.26 is above the desirable target of below 0.9 and in the 'high' category of 1.2 to 1.39. Part of this ApoB count comes from her Lp(a) particles, which cannot be changed, but the remainder is modifiable through diet, lifestyle, and potentially medication. Bringing ApoB below 0.9 is the most impactful lipid target in this report.","low_causes":"Low-fat diet, medications, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, genetics, hypothyroidism, insulin resistance, high Lp(a)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB/A1 ratio is considered the best single summary of the balance between harmful and protective cholesterol particles. Her ratio of 0.56 falls in the lower risk category of below 0.6. This is a positive finding that reflects the strong protective effect of her very high ApoA1 (and therefore HDL) partially offsetting the elevated ApoB. However, the ratio should not provide false reassurance: the absolute ApoB of 1.26 still means there are too many harmful particles in circulation.","low_causes":"High HDL, low LDL","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"182.39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that behaves like a particularly sticky and inflammatory form of LDL. It deposits cholesterol into artery walls, promotes blood clotting by interfering with the clot-dissolving system, and drives local inflammation. Her Lp(a) of 182.39 is significantly above the 32 nmol/L target, placing her in the moderate risk category of 90 to 200. This confirms her previous test result. Lp(a) is entirely inherited: it cannot be lowered by diet, exercise, or statin therapy. It should be recorded permanently in her medical notes, and first-degree relatives, parents, siblings, and children, should be encouraged to test their own levels. Novel therapies targeting Lp(a) are in late-stage clinical trials. In the meantime, reducing every other modifiable risk factor, particularly ApoB, blood pressure, inflammation, and blood sugar, becomes more important because of the fixed Lp(a) burden.","low_causes":"Genetics","high_causes":"Genetics (entirely inherited)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"INFLAMMATION","result":"0.89","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2967","lower_normal":"1","upper_normal":"3","lower_optimal":"1","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is calculated by dividing neutrophils by lymphocytes and is a marker of the balance between innate and adaptive immunity. It is also used as a marker of systemic inflammation. Her ratio of 0.89 is marginally below the lower limit of 1, driven by her lower-end neutrophils alongside healthy lymphocytes. With an undetectable CRP, this does not indicate an inflammatory process. It is a minor finding reflecting her overall lower-end innate immune cell counts.","low_causes":"Low neutrophils, benign ethnic neutropenia, lean habitus","high_causes":"Inflammation, infection, stress, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"68.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3520","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The platelet to lymphocyte ratio is a marker of systemic inflammation and immune balance. Her ratio of 68.4 is within the laboratory range but below the optimal band of 80 to 160, driven by her lower-end platelet count of 160 alongside a healthy lymphocyte count of 2.34. With her CRP undetectable, this is not an inflammatory signal and is not a concern.","low_causes":"Low platelets, high lymphocytes","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"143","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3620","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The SII combines neutrophils, platelets, and lymphocytes into a single index of systemic inflammation and immune activation. Her score of 143 is within the laboratory range but marginally below the optimal band of 150 to 450. This is being driven by her lower-end neutrophils and platelets. With an undetectable CRP, it does not indicate inflammation.","low_causes":"Low neutrophils, low platelets","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.51","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1700","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a powerful surrogate marker of insulin resistance and cardiovascular risk. Lower is better. Her ratio of 0.51 is excellent, well within the optimal range of below 0.87, reflecting her strong HDL and controlled triglycerides. This ratio independently confirms her insulin sensitivity.","low_causes":"High HDL, low triglycerides, insulin sensitivity","high_causes":"Insulin resistance, high triglycerides, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.57","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3563","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL, and represents the cholesterol carried by triglyceride-rich remnant particles, chylomicron remnants and IDL. Her remnant cholesterol of 0.57 is within the laboratory range of below 0.8 but above the optimal threshold of 0.5. This is a minor finding that tracks with her triglycerides and would improve with the same dietary changes.","low_causes":"Low triglycerides","high_causes":"High triglycerides, insulin resistance, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5400","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This calculation subtracts the cholesterol carried by Lp(a) particles from the total LDL, showing how much of the LDL is modifiable through diet, lifestyle, and medication. Her Lp(a)-corrected LDL of 3.24 is still above the 3.0 target, confirming that even after removing the Lp(a) contribution, there is modifiable LDL that can be brought down. This is the number to track with dietary changes and any medication.","low_causes":"Low-fat diet, statin therapy","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"-0.289","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5292","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from the logarithm of the triglyceride to HDL ratio and reflects the balance between pro-atherogenic and anti-atherogenic factors. Her score of -0.289 is within the optimal range, reflecting the strong protective effect of her very high HDL. A negative value indicates low atherogenic risk from this particular axis.","low_causes":"High HDL, low triglycerides","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1886","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The Castelli II index divides LDL by HDL to assess cardiovascular risk. Her ratio of 1.32 is excellent, well within the optimal range, because her very high HDL dilutes the impact of the elevated LDL in this calculation. While this is a positive finding, the absolute ApoB level remains the more important metric for her risk assessment given the Lp(a) burden.","low_causes":"High HDL, low LDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4714","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5714","units":"","description":"The albumin to globulin ratio compares the two main protein groups in the blood. A low ratio can indicate chronic inflammation or liver disease, while a high ratio is usually benign. Her ratio of 1.30 is within the optimal range, confirming a healthy balance between the two protein groups.","low_causes":"Liver disease, chronic inflammation, autoimmune disease, myeloma","high_causes":"Immune deficiency, very low globulin","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"1.32","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.2472","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"FIB-4 is a calculated score that estimates the likelihood of liver fibrosis, or scarring, using age, AST, ALT, and platelet count. Her score of 1.32 is within the laboratory range of below 1.45 and marginally above the optimal threshold of 1.3. At 47, her age contributes to the calculation, and with her lower-end platelets making the denominator smaller, the score is being driven by the calculation rather than by any sign of liver disease. All her actual liver markers, ALT, AST, GGT, bilirubin and albumin, are clean.","low_causes":"Young age, high platelets, low AST","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.297","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0990","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"APRI, or AST to Platelet Ratio Index, is another calculated score that assesses liver fibrosis risk. It is built from AST and platelet count. Her score of 0.297 is well within both the normal and optimal ranges, confirming no evidence of liver scarring.","low_causes":"Healthy liver, high platelets","high_causes":"Liver fibrosis, cirrhosis","padding":"1","on ating Hormone","group":"THYROID","result":"6.25","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7345","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4494","units":"mIU/L","description":"TSH, or thyroid stimulating hormone, is produced by the pituitary gland in the brain and tells the thyroid how much hormone to produce. When the thyroid is underperforming, the pituitary raises TSH to try to stimulate more output. Her TSH of 6.25 is above the upper limit of 4.78 and well above the optimal range of 1.0 to 2.5. This elevated TSH, combined with her low-normal FT4 and below-optimal FT3, and positive thyroid antibodies, is strongly associated with Hashimoto's thyroiditis. She should discuss this with her GP for assessment and consideration of levothyroxine treatment.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, thyroid recovery, medications, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"3.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3630","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5889","units":"pmol/L","description":"Free T3, or free triiodothyronine, is the active form of thyroid hormone that every cell in the body uses for energy production, metabolism, and brain function. It is converted from T4 in tissues throughout the body. Her FT3 of 3.9 is within the laboratory range of 2.6 to 7.1 but well below the optimal range of 4.5 to 6.5. This is significant because T3 is the hormone the body actually uses, and a level this low could directly contribute to her fatigue, brain fog, and low mood.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, illness, selenium or iron deficiency","high_causes":"Hyperthyroidism, excessive T3 supplementation, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"38.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are produced by the immune system and target thyroid peroxidase, an enzyme the thyroid needs to produce its hormones. Their presence indicates the immune system is attacking the thyroid gland. Her level of 38.9 is nearly three times the upper limit of 13.8, confirming an active autoimmune process. Together with the raised thyroglobulin antibodies, raised TSH, and low-normal thyroid hormones, this pattern is strongly associated with Hashimoto's thyroiditis.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, postpartum thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"31.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, a protein the thyroid uses to store and produce its hormones. Like TPO antibodies, their presence indicates an autoimmune attack on the thyroid. Her level of 31.2 is more than rming normal adrenal function. This rules out adrenal insufficiency or excess as a cause of her fatigue.","low_causes":"Adrenal insufficiency, Addison's disease, pituitary disease","high_causes":"Chronic stress, Cushing's syndrome, steroid use, depression","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"548","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"204.8","upper_normal":"786.1","lower_optimal":"300","upper_optimal":"700","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3877","upper_optimal_position":"0.6189","units":"pmol/L","description":"Oestradiol is the primary oestrogen hormone and is essential for reproductive function, bone health, cardiovascular protection, and brain function. Her level of 548 falls within the luteal phase reference range of 204.8 to 786.1, consistent with a post-ovulatory cycle phase. This is a healthy level and, together with her FSH of 2.4, confirms she is not yet in the perimenopausal transition.","low_causes":"Menopause, perimenopause, low body fat, excessive exercise, PCOS, hypothalamic amenorrhoea","high_causes":"Ovulation, pregnancy, obesity, liver disease, HRT","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"59.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5526","lower_normal":"10.62","upper_normal":"81.28","lower_optimal":"20","upper_optimal":"70","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3780","upper_optimal_position":"0.6155","units":"nmol/L","description":"Progesterone is produced by the corpus luteum after ovulation and is essential for preparing the uterine lining for pregnancy. Her level of 59.12 is within the luteal phase range and confirms she ovulated this cycle. A strong progesterone level in the lut // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

});

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
