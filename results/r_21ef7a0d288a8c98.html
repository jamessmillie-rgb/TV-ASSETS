<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Roxana Noor","dob":"19/02/1979","report_date":"2026-10-13","summary":"Customer is a 47-year-old female presenting with a BMI of 21.6, which is healthy and lean. She supplements with vitamin D, takes no medications, and has no diagnosed conditions. She reports low energy and fatigue, brain fog, bloating and digestive discomfort, and low mood and anxiety, all persisting for several months. Her goals are to improve energy levels, improve cardiovascular fitness, and lose body fat. She notes that a previous blood test showed very high Lp(a), and this report confirms that finding and adds several important new ones.\n\nThe most significant finding in this report is her thyroid. Her TSH is 6.25, above the upper limit of 4.78. TSH, or thyroid stimulating hormone, is the signal the pituitary gland sends to the thyroid to tell it to produce more hormone. When the thyroid is struggling to keep up, the pituitary raises the volume of that signal, and 6.25 means the pituitary is shouting. Her free T4, the main hormone the thyroid produces, is 11.9 against a lower limit of 11.5, sitting right at the floor of the laboratory range. Her free T3, the active form of thyroid hormone that every cell in the body uses for energy, is 3.9 against a range of 2.6 to 7.1, which places it in the lower quarter of the range and well below the optimal band of 4.5 to 6.5. Both thyroid antibodies are raised: thyroid peroxidase antibodies, known as TPO antibodies, are 38.9 against a limit of 13.8, and thyroglobulin antibodies are 31.2 against a limit of 4.4. This pattern, raised TSH with low-normal thyroid hormones and positive antibodies against both thyroid targets, is strongly associated with a condition called Hashimoto's thyroiditis, the most common cause of underactive thyroid and one in which the immune system gradually damages the thyroid gland. This is the finding that should go to her GP first, because Hashimoto's is treatable and because it may explain a large portion of her symptoms. Fatigue, brain fog, low mood, anxiety, digestive sluggishness, and difficulty losing body fat are all recognised features of insufficient thyroid hormone. It is also worth noting that an underactive thyroid slows the liver's clearance of LDL cholesterol from the bloodstream, so part of the lipid picture discussed below may be thyroid-driven and could improve with treatment.\n\nThe second major finding is her Lp(a), which she already knew about. Her Lp(a) is 182.39 nmol/L against a target of below 32. Lp(a), or lipoprotein little a, is a genetically determined particle that behaves like a particularly sticky form of LDL cholesterol. It deposits cholesterol into artery walls, promotes blood clotting, and drives local inflammation, all of which accelerate cardiovascular disease. It is entirely inherited, cannot be changed by diet or exercise, and the level she has today is the level she will carry for life. This is genuinely important information that should be recorded permanently in her medical notes, and she should encourage first-degree relatives, parents, siblings, and children, to have their own Lp(a) tested, because it runs in families. Her Cardiovascular Risk Score, a TrueVitals index built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 75 out of 100, driven almost entirely by the Lp(a) and the elevated ApoB. This score measures the risk being accumulated in the arteries right now, not a ten-year event probability, and at 47 the window for acting on it is wide.\n\nHer broader lipid panel shows a mixed picture. Total cholesterol is 7.3, which looks alarming at face value, but the composition matters more than the headline number. Her HDL cholesterol is 2.9, which is exceptionally high and genuinely protective. HDL is the particle that carries cholesterol away from artery walls and back to the liver for disposal, and 2.9 is well above the optimal threshold of 1.6 for women. Her ApoA1, the protein on HDL particles that drives their protective function, is 2.25, also excellent. Her triglycerides are 1.49, within the laboratory range and a marker of how the body handles dietary fat and sugar. Her ApoB/A1 ratio, the single best summary of the balance between particles depositing cholesterol and particles removing it, is 0.56, just under the 0.6 threshold for lower risk. However, her ApoB itself is 1.26 against a target of below 0.9, and her LDL is 3.83 against a target of below 3.0. When Lp(a) is subtracted from the LDL calculation, her Lp(a)-corrected LDL is 3.24, still above the 3.0 target but showing that a meaningful portion of what the lab calls LDL is actually the Lp(a) particle. Her non-HDL cholesterol is 4.4 against a target of below 4.0. So the picture is one of strong protective factors, outstanding HDL and an excellent ApoB/A1 ratio, sitting alongside genuine risk from the inherited Lp(a) burden and a modifiable ApoB that is too high. The Lp(a) cannot be changed, but the ApoB can, and bringing ApoB below 0.9 through dietary changes and, if her GP considers it appropriate, medication, would meaningfully reduce the total burden on her arteries.\n\nThere is a great deal of good news in this report. Her inflammation is essentially absent. Her hsCRP, the most sensitive marker of systemic inflammation, is below 0.5, which is as low as the assay can measure and means there is no detectable inflammatory process anywhere in the body. This is a genuinely excellent result, especially alongside the raised Lp(a), because Lp(a) does more damage in an inflammatory environment and her body is not providing one. Her ESR, erythrocyte sedimentation rate, is 28 against a limit of 12, which would normally raise a flag, but ESR can be elevated by high haemoglobin and high immunoglobulins, both of which she has, and in the context of an undetectable CRP it is very unlikely to represent active inflammation. It should be noted for her GP but interpreted cautiously. Her liver is in excellent health. ALT at 18 and GGT at 13 are both well within the optimal range, meaning the liver is under no metabolic strain. Her FIB-4 score at 1.32 and her APRI at 0.297 both rule out any suggestion of liver scarring. Her kidney function is healthy, with a Cystatin C eGFR of 93, comfortably above the 90 threshold for optimal function. Her blood sugar control is excellent: fasting glucose is 4.4, HbA1c is 37 mmol/mol, and HOMA-IR is 1.44, all within the ideal range. This means her body is handling sugar efficiently and there is no sign of insulin resistance. Her cortisol at 261 is within the expected morning range, suggesting the adrenal stress response is functioning normally. Her calcium, magnesium, sodium, and bicarbonate are all within their ideal bands. Her immune system shows healthy immunoglobulin levels across IgG, IgA, and IgM. Rheumatoid factor is negative and coeliac screening is negative, which rules out coeliac disease as a cause of her bloating and fatigue. Her tumour markers, CA125, CA19-9, and CEA, are all within range. Her total antioxidant activity at 1.74 is within range. Creatine kinase at 71 is healthy.\n\nHer C-Peptide is 0.874 ug/L, which converts to approximately 289 pmol/L, below the laboratory range of 1.1 to 4.4 ug/L (364 to 1,456 pmol/L). C-Peptide is released by the pancreas in equal amounts to insulin and is a measure of how much insulin the pancreas is producing. In her case, with a fasting glucose of 4.4 and an HbA1c of 37, this low C-Peptide simply reflects that her pancreas does not need to produce much insulin because her blood sugar is well controlled and she is insulin-sensitive. It is a positive finding rather than a concern, but it is worth mentioning to her GP alongside the thyroid results so it is on record.\n\nHer full blood count shows several results outside the laboratory range that, taken together, tell a coherent story. Her haemoglobin is 161 against a female upper limit of 150, her red blood cell count is 4.98 against a limit of 4.8, her MCH is 32.3 against a limit of 32, and her MCHC is 358 against a limit of 345. Her haematocrit at 0.449 is within range but sitting in the upper quarter. Elevated haemoglobin in a woman at this level has several possible explanations: chronic hypoxia from living at altitude or from sleep-disordered breathing, dehydration at the time of the sample, a myeloproliferative condition such as polycythaemia vera, or simply being at the high end of her personal normal. The MCH and MCHC being marginally above range follow from the high haemoglobin, as each red cell is carrying a little more haemoglobin than average. Her monocytes are 0.14 against a lower limit of 0.2, which is a very minor shortfall in a cell type that fluctuates throughout the day and is unlikely to be significant in isolation. Her platelets at 160 are within range but at the lower end, and her white cell count at 4.74 is within range. None of these findings are urgent, but the elevated haemoglobin should be discussed with her GP, who may wish to repeat the full blood count to confirm it and consider a JAK2 mutation test to exclude polycythaemia vera as a precaution.\n\nHer iron studies are largely healthy. Ferritin at 86 is within the optimal range for women, meaning iron stores are adequate. Serum iron at 28.9 and transferrin saturation at 46.59% are both within range, though the saturation is in the upper quarter. Her transferrin is 2.47 against a lower limit of 2.5, marginally below range. Transferrin is the protein that carries iron in the blood, and a slightly low level alongside adequate ferritin and high saturation may simply reflect that the body has enough iron and is not producing as much transport protein. In the context of her elevated haemoglobin, it is another reason for the GP to review the full picture.\n\nHer hormone profile is consistent with the luteal phase of her menstrual cycle, with progesterone at 59.12 and oestradiol at 548 both fitting the luteal reference ranges, and LH at 1.99 and FSH at 2.4 both low as expected after ovulation. Her total testosterone at 0.7 is within the female range. However, her free testosterone, the portion not bound to carrier proteins and available for the body to use, is 0.005 against a lower limit of 0.01, below range. Her SHBG, sex hormone binding globulin, is 112, which is within the laboratory range of 27.8 to 146 but very high, and SHBG is the protein that binds testosterone and takes it out of circulation. A high SHBG is the most common reason for low free testosterone in women, and it can contribute to fatigue, reduced motivation, difficulty building or maintaining muscle, and difficulty losing body fat, all of which align with her reported symptoms and goals. SHBG can be elevated by thyroid dysfunction, which circles back to the Hashimoto's pattern: treating the thyroid may help normalise SHBG and free up more testosterone.\n\nHer lipase is 71 against an upper limit of 60. Lipase is an enzyme produced by the pancreas to digest fat, and a mildly elevated level can occur with no pancreatic disease at all, particularly after eating, or with minor irritation of the pancreas or surrounding structures. Her amylase at 76 is normal, which is reassuring, because significant pancreatic inflammation would typically raise both enzymes together. Her bloating and digestive discomfort could be connected to mildly elevated lipase if fat digestion is slightly impaired, though this is speculative. It is worth mentioning to her GP, but in isolation and with a normal amylase it is unlikely to represent serious pathology.\n\nHer IgE is 117 against a limit of 100. IgE is the immunoglobulin associated with allergic responses, and a mildly elevated level could suggest an allergic tendency, whether to environmental allergens such as pollen or dust mites, or to certain foods. It could also contribute to her bloating if there is a low-grade allergic component to a food she is eating regularly. This is not a finding that needs urgent action, but if her bloating does not resolve with the thyroid being addressed, allergy testing may be a worthwhile next step.\n\nHer vitamin D is 73 nmol/L, which is sufficient by NHS standards but below the optimal range of 75 to 120. She is already supplementing, which is good, and a small increase in dose should bring her into the optimal band. Her vitamin B12 at 701 is healthy and within the optimal range. Her folate at 9 is within range and just above the optimal threshold of 8.\n\nHer CA15-3, a breast cancer screening marker, is 28.99 against a limit of 30. This is within the laboratory range. CA15-3 is not a diagnostic test for breast cancer; it is a monitoring tool, and minor fluctuations within range are common and not significant. It does not require any action but will be noted for the GP record.\n\nHer PhenoAge is 35.7 against a chronological age of 47, meaning her blood markers paint a picture of someone more than eleven years younger than her calendar age. This is driven by her excellent CRP, healthy albumin, good glucose control, and strong lymphocyte count. It is a genuinely positive finding and reflects a body that, despite the symptoms she is experiencing, is in good underlying metabolic health.\n\nHer urine is clear. No protein, no glucose, no nitrites, no bacteria, and no casts. Red blood cells at 20 are within the laboratory's not-significant threshold of below 25. Specific gravity at 1.03 suggests a concentrated sample, which may partly explain the elevated haemoglobin if she was mildly dehydrated at the time of collection.\n\nPutting this together, her four symptoms, fatigue, brain fog, low mood and anxiety, and bloating, have a plausible explanation sitting in this report. The Hashimoto's pattern, with a thyroid barely producing enough hormone and the pituitary working hard to compensate, is the most likely driver of the fatigue, brain fog, and low mood. Thyroid hormone affects every cell in the body, and when levels are low the brain feels it first, as sluggish thinking, flat mood, and a tiredness that sleep does not fix. The bloating could be partly thyroid-related, because low thyroid hormone slows gut motility, or it could relate to the mildly elevated lipase or the raised IgE suggesting a low-grade allergic response. Treating the thyroid is the single most important step, and many of her other symptoms may improve as a consequence, including SHBG normalising, free testosterone rising, and energy returning.","links":"The central thread in this report runs through the thyroid. A TSH of 6.25 with both antibody types positive and free T4 sitting at the floor of the range points strongly toward Hashimoto's thyroiditis. This is not a subtle finding: the immune system is actively targeting the thyroid gland, the gland is struggling to maintain output, and the downstream effects are visible across multiple systems. Fatigue, brain fog, low mood, anxiety, digestive sluggishness, and difficulty losing body fat are all recognised consequences of insufficient thyroid hormone, and all four of her reported symptoms align with this pattern.\n\nThe thyroid story connects to the hormonal picture. SHBG at 112, while within the laboratory range, is high enough to bind nearly all of her testosterone, leaving a free testosterone of just 0.005, half the lower limit. Thyroid dysfunction is a known driver of elevated SHBG, and if treatment normalises thyroid output, SHBG may fall and free testosterone may rise. That matters for her goals, because free testosterone supports muscle maintenance, fat metabolism, and the drive and motivation that underpin exercise adherence.\n\nThe lipid story has two chapters. The first is inherited and permanent: an Lp(a) of 182.39 means she carries a genetically determined cardiovascular risk that cannot be modified by lifestyle. The second is modifiable: an ApoB of 1.26 and an LDL of 3.83 that can be brought down through dietary changes and, if the GP considers it appropriate, medication. The exceptional HDL of 2.9 and the low ApoB/A1 ratio of 0.56 provide meaningful protection, but they do not cancel out the Lp(a) burden. Importantly, part of the LDL elevation may be thyroid-driven. An underactive thyroid reduces the number of LDL receptors on liver cells, slowing the clearance of LDL from the blood. Treating the thyroid may, on its own, lower ApoB and LDL to some degree.\n\nThe elevated haemoglobin at 161 is the one finding that does not fit neatly into the thyroid or lipid stories. It may simply reflect dehydration at the time of the sample, supported by a concentrated urine specimen, but it could also be a standalone finding that needs its own investigation. The GP will decide whether to repeat the count on a well-hydrated sample or proceed to a JAK2 test.\n\nThe ESR of 28, in the context of an undetectable CRP, is almost certainly a laboratory artefact of the high haemoglobin and high immunoglobulins rather than true inflammation. The mildly elevated lipase with a normal amylase, the marginally raised IgE, and the borderline-low transferrin are all minor loose ends that the GP should be aware of but that do not point to serious pathology.\n\nWhat has been excluded is important. There is no insulin resistance, no diabetes, no liver disease, no kidney disease, no coeliac disease, no rheumatoid process, no significant inflammation, and no concerning tumour marker elevation. The fatigue, brain fog, and low mood have a strong candidate explanation in the thyroid, and the bloating has several plausible contributors. The path forward is clear: the thyroid needs treating, the cardiovascular risk needs managing with the Lp(a) permanently on the medical record, and the haemoglobin needs confirming or explaining.","lifestyle":"Increase oily fish to two or three portions per week: salmon, mackerel, sardines, or trout. Anchor: plan two fish meals into the weekly shop. Why: omega-3 fatty acids lower triglycerides and ApoB, and with an ApoB of 1.26 this is one of the most effective dietary levers available.\nAdd a daily handful of oats, barley, or ground flaxseed to breakfast or a smoothie. Anchor: keep a jar next to the kettle or blender. Why: soluble fibre binds cholesterol in the gut and lowers LDL, which is the modifiable portion of her cardiovascular risk.\nReduce saturated fat by swapping butter, cheese, and fatty meat for olive oil, avocado, and nuts where possible, one swap at a time. Anchor: start with the cooking fat and the spread. Why: saturated fat raises LDL and ApoB, and reducing it is the highest-impact dietary change for her lipid profile.\nAim for a brisk walk of at least 30 minutes most days, ideally outdoors in morning light. Anchor: tie it to the start of the day or a lunch break. Why: cardiovascular exercise directly supports her goal of improving cardiovascular fitness, helps with body fat, and morning light supports mood, energy, and circadian rhythm, all of which she is struggling with.\nAdd two sessions of resistance training per week, starting with bodyweight or light weights. Anchor: pick two fixed days and protect them. Why: resistance training preserves and builds lean muscle, raises metabolic rate, supports fat loss at a healthy BMI of 21.6, and is one of the most effective interventions for long-term cardiovascular health.\nKeep a consistent wake time seven days a week, within 30 minutes. Anchor: set one alarm and stick to it, including weekends. Why: a fixed wake time is the single most powerful tool for stabilising circadian rhythm, which affects energy, mood, thyroid function, and cortisol patterns.\nIf caffeine is part of the daily routine, set a hard cut-off at 1pm. Why: caffeine has a half-life of five to six hours, and afternoon caffeine fragments sleep architecture even when it does not prevent falling asleep, which worsens fatigue and brain fog the next day.\nStay well hydrated throughout the day, aiming for at least 1.5 to 2 litres of water. Anchor: carry a bottle and finish it by mid-afternoon. Why: her concentrated urine sample suggests she may not be drinking enough, and mild dehydration can contribute to fatigue, brain fog, and may have contributed to the elevated haemoglobin reading.","flags":"TSH 6.25 (above limit of 4.78) with FT4 11.9 (at floor of range, limit 11.5) and FT3 3.9 (below optimal of 4.5). TPO antibodies 38.9 (above limit 13.8) and thyroglobulin antibodies 31.2 (above limit 4.4). This pattern is strongly associated with Hashimoto's thyroiditis and likely explains her fatigue, brain fog, low mood, and digestive symptoms. GP referral recommended for thyroid function assessment and consideration of levothyroxine.\nLp(a) 182.39 nmol/L (above limit of 32, moderate risk category 90 to 200). Entirely inherited, cannot be modified by lifestyle or most medications. Should be recorded permanently in her medical notes. First-degree relatives should be tested. Cardiovascular Risk Score 75/100, driven primarily by Lp(a) and ApoB.\nApoB 1.26 g/L (above target of 0.9), LDL 3.83 mmol/L (above target of 3.0), non-HDL cholesterol 4.4 (above target of 4.0). These are the modifiable components of her cardiovascular risk. Lp(a)-corrected LDL is 3.24, still above target. Part of the elevation may be thyroid-driven. HDL 2.9 and ApoB/A1 ratio 0.56 are strongly protective. GP should assess whether statin or other lipid-lowering therapy is appropriate given the Lp(a) burden.\nHaemoglobin 161 g/L (above female limit of 150), RBC 4.98 (above limit 4.8), MCH 32.3 (above limit 32), MCHC 358 (above limit 345). May reflect dehydration at time of sample, but polycythaemia vera should be excluded. GP should consider repeat FBC when well hydrated and JAK2 mutation testing.\nFree testosterone 0.005 nmol/L (below lower limit 0.01) with SHBG 112 nmol/L (within range but high). High SHBG is binding nearly all available testosterone. May be driven by thyroid dysfunction. Could contribute to fatigue, difficulty losing fat, and reduced motivation.\nESR 28 mm/hour (above limit of 12) with hsCRP below 0.5. In the context of undetectable CRP, this is very unlikely to represent active inflammation and may be driven by the high haemoglobin and immunoglobulin levels. GP should note but not act on this in isolation.\nC-Peptide 0.874 ug/L (below range of 1.1 to 4.4). With normal glucose and HbA1c, this reflects low insulin demand rather than pancreatic insufficiency. Note for GP record.\nTransferrin 2.47 g/L (marginally below limit of 2.5) with ferritin 86 and saturation 46.59%. Minor shortfall likely reflecting adequate iron stores. Note in context of elevated haemoglobin.\nLipase 71 U/L (above limit of 60) with normal amylase 76. Mild elevation unlikely to represent significant pancreatic pathology. May relate to her bloating symptoms. GP to note.\nIgE 117 IU/ml (above limit of 100). Suggests mild allergic tendency. Could contribute to bloating if food-related. Consider allergy testing if symptoms persist after thyroid treatment.\nMonocytes 0.14 (below limit 0.2). Minor shortfall, likely diurnal variation, not clinically significant.\nReassuring negatives: hsCRP below 0.5 (no systemic inflammation), HbA1c 37 and glucose 4.4 (no diabetes or insulin resistance), HOMA-IR 1.44 (insulin sensitive), liver enzymes all within optimal range with FIB-4 1.32 and APRI 0.297 (no liver disease), Cystatin C eGFR 93 (healthy kidney function), coeliac screen negative, rheumatoid factor negative, CA125 17.2, CA19-9 10.79 and CEA 2.03 (tumour markers clear), urine culture no growth, PhenoAge 35.7 (11 years younger than calendar age).","recommendations":"Discuss the thyroid results with her GP as the first priority. TSH 6.25 with positive TPO and thyroglobulin antibodies and FT4 at the floor of range is a pattern associated with Hashimoto's thyroiditis. The GP should assess whether levothyroxine is appropriate now or whether to monitor with a repeat in 6 to 8 weeks, and should be aware that treating the thyroid may improve her fatigue, brain fog, mood, digestion, SHBG, free testosterone, and part of the LDL elevation.\nAsk the GP to record the Lp(a) of 182.39 nmol/L permanently in her medical notes. This is inherited, lifelong, and a significant cardiovascular risk factor. She should encourage parents, siblings, and any children to have their own Lp(a) tested.\nDiscuss lipid-lowering therapy with her GP. With an ApoB of 1.26 and an Lp(a) of 182.39, the total burden on her arteries is high despite excellent HDL. A statin or PCSK9 inhibitor may be appropriate, and the GP should factor in that part of the LDL elevation may resolve with thyroid treatment.\nDiscuss the elevated haemoglobin of 161 with her GP. A repeat full blood count when well hydrated would clarify whether this is persistent. If confirmed, a JAK2 mutation test should be considered to exclude polycythaemia vera.\nMention the low free testosterone of 0.005 alongside the thyroid findings. If SHBG remains elevated after thyroid treatment, the GP or an endocrinologist may consider further investigation.\nMention the mildly elevated lipase of 71 and the raised IgE of 117 in the context of her bloating symptoms. If bloating persists after thyroid treatment, allergy testing and further digestive investigation may be worthwhile.\nRetest in 12 weeks after any thyroid treatment is initiated, repeating TSH, FT4, FT3, full lipid panel with ApoB, full blood count, SHBG, free testosterone, and vitamin D to assess the response.","supplementation":"Vitamin D3 (cholecalciferol): increase to 3,000 to 4,000 IU daily, taken with a meal containing fat. Her current supplementation has achieved 73 nmol/L, just below the optimal threshold of 75. A modest dose increase should bring her into the 75 to 120 optimal band. Always take with vitamin K2 (see below).\nVitamin K2 (MK-7): 100 to 200 mcg daily, taken alongside vitamin D. K2 directs the calcium that vitamin D helps absorb into bones rather than arteries, which matters for cardiovascular protection alongside her Lp(a) risk.\nOmega-3 fish oil: 2 to 3 g of combined EPA and DHA daily, taken with food. This is one of the most effective supplements for lowering ApoB and triglycerides, and with an ApoB of 1.26 and an Lp(a) that cannot be changed, reducing the modifiable lipid risk is a priority.\nMagnesium glycinate: 300 mg before bed. Her magnesium at 0.88 is within range but a bedtime dose supports sleep quality, mood, and muscle recovery, all relevant to her symptoms and goals.\nSelenium: 100 to 200 mcg daily (selenomethionine form). Selenium supports thyroid hormone conversion (T4 to T3) and may help manage the autoimmune process in Hashimoto's thyroiditis. Her FT3 at 3.9 suggests conversion could be better supported.\nThe most important changes from this report are not supplements. They are getting the thyroid assessed and treated by her GP, recording the Lp(a) permanently, and making the dietary changes to bring ApoB down.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 51.6; held to 49 by two or more systems rated \"See your GP\". Weakest systems: lipids & cardiovascular 18%, digestive 26%, inflammation 32%. Biggest drags: Haemoglobin, LDL Cholesterol, Apolipoprotein B, Lipoprotein(a).","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"35.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3433","lower_normal":"","upper_normal":"52","lower_optimal":"","upper_optimal":"47","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4519","units":"years","description":"PhenoAge is a biological age estimate calculated from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase, and white cell count. Her PhenoAge of 35.7 against a calendar age of 47 means her blood markers paint a picture of someone more than eleven years younger than her actual age. The main drivers of this excellent result are her undetectable CRP, healthy albumin, normal glucose, and strong lymphocyte count. This is a genuinely positive finding that reflects good underlying metabolic health despite her symptoms.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP, and HbA1c. It measures the cardiovascular risk being accumulated right now, not a ten-year event probability. Her score of 75 is high, driven almost entirely by her Lp(a) of 182.39 and her ApoB of 1.26. The score reflects ar attached to it. Her level of 5.5% is normal, well below the pre-diabetes threshold of 6.0%. This confirms her day-to-day blood sugar control is healthy.","low_causes":"Low red cell lifespan, blood loss, haemolysis","high_causes":"Diabetes, insulin resistance, chronic high sugar intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"37","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3929","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the unit used by UK laboratories. Her level of 37 is below the 42 threshold for pre-diabetes. At 37, she is marginally above the optimal threshold of 36, which is a trivial difference and not a concern. Blood sugar control is healthy.","low_causes":"Low red cell lifespan, blood loss, haemolysis","high_causes":"Diabetes, insulin resistance, chronic high sugar intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"7.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4054","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5483","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar in check. Lower is generally better, as high fasting insulin is the earliest marker of insulin resistance, often appearing years before blood sugar rises. Her level of 7.34 is within the optimal range of 2 to 8, confirming she is insulin-sensitive and her pancreas is workin
