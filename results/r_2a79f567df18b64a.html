<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Michael Andrew Feltham","dob":"25/06/1981","report_date":"2026-10-06","summary":"Michael is a 45-year-old male presenting with a BMI of 24.7, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains four times per week (two cardio, two resistance, hard intensity) with 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but reports feeling tired most mornings, with energy lowest on waking. Stress feels hard to manage some weeks. Alcohol intake is 1 to 4 drinks per week. He takes golimumab (Simponi) monthly for reactive arthritis and inflammatory disease, and reports frequent painkiller use (ibuprofen, paracetamol). He supplements with vitamin D, magnesium, omega-3 fish oil, creatine and probiotics. He has psoriasis. Family history includes osteoporosis and dementia. Previous blood tests have been normal. He reports frequent illness, bloating and digestive discomfort, low energy and fatigue, and joint pain and stiffness, all of which he describes as always present. His goals are disease prevention, improving energy levels and boosting immune function. Michael has provided detailed additional context: for the past several weeks he has had persistent low-grade malaise, reduced energy and diffuse muscle aches that are clearly outside his normal baseline. He has also developed right-sided neck and upper-back pain with intermittent tingling, numbness and occasional twitching into the right arm and hand, though strength and coordination remain normal. A cervical C5/C6 mechanical or nerve irritation has been suspected for the arm symptoms, but this does not explain the more general malaise and myalgia. The purpose of this test is to find an objective explanation for these symptoms.\n\nThe most important thing to say about this report is that the bloods do not reveal a single dramatic systemic abnormality that explains Michael's persistent malaise and myalgia. That is genuinely useful information, because it allows both him and his GP to narrow the search considerably. His inflammatory markers are exemplary: high-sensitivity CRP (a protein the liver produces in response to inflammation anywhere in the body) is below 0.5, and his ESR (erythrocyte sedimentation rate, another measure of systemic inflammation) is 1. On golimumab, these numbers confirm that the biologic is doing an excellent job of suppressing the inflammatory disease, and they effectively rule out an active flare of reactive arthritis or any other significant inflammatory process as the cause of his current symptoms. His Systemic Immune-Inflammation Index, a composite built from neutrophils, platelets and lymphocytes, sits at 221, comfortably within the ideal band, and his Platelet-to-Lymphocyte Ratio at 94.6 is similarly unremarkable. Creatine kinase (CK), the enzyme that leaks from damaged muscle fibres, is 157, sitting in the middle of the reference range. This is an important negative: if his diffuse myalgia were being driven by an active myositis or significant muscle breakdown, CK would almost certainly be elevated. His liver is in excellent health. ALT (alanine aminotransferase, a liver enzyme) at 33, AST (aspartate aminotransferase) at 26, and Gamma GT at 16 are all well within range, and the FIB-4 score (a fibrosis index built from age, platelets, AST and ALT) at 1.05 rules out any meaningful liver scarring. This is reassuring given the monthly golimumab and frequent painkiller use, both of which can burden the liver over time. His kidneys are working well: Cystatin C, a more reliable filtration marker than creatinine alone because it is unaffected by muscle mass, gives an eGFR of 101, and the combined creatinine-Cystatin C eGFR confirms the same number. Urea, creatinine and electrolytes are all within ideal ranges. His thyroid is functioning optimally, with a TSH (thyroid-stimulating hormone, the pituitary signal that tells the thyroid to work harder) of 1.05, free T4 at 20.8 and free T3 at 5.7, all sitting in the ideal zone and converting efficiently as confirmed by an FT3-to-FT4 ratio of 0.274. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. His blood sugar control is excellent: fasting glucose at 5.2, HbA1c (glycated haemoglobin, a three-month average of blood sugar) at 41 mmol/mol, insulin at 4.6 and a HOMA-IR (a measure of how sensitively the body responds to insulin) of 1.06 all confirm that he is insulin-sensitive with no drift toward resistance. His prostate screen is clean, with a PSA of 0.5 and a free PSA ratio of 0.82, both excellent. Tumour markers CA19-9 and CEA are negative. Rheumatoid factor is negative, and coeliac screening (tissue transglutaminase IgA) is negative, which rules out coeliac disease as a contributor to his bloating and fatigue. His urinalysis is completely clean across all parameters. His testosterone at 21 is within the optimal range for a 45-year-old man, SHBG (sex hormone binding globulin, the protein that binds testosterone and makes it unavailable) at 48.6 is mid-range, and free testosterone at 0.343 and bioavailable testosterone at 8.58 are both within range. Cortisol at 298 is within the expected morning window. His full blood count is largely reassuring: haemoglobin at 156, red cells at 4.94, white cells at 4.81 and platelets at 194 are all healthy. His PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes in at 35.1 against a calendar age of 45, which is nearly ten years younger and reflects the combined effect of low inflammation, good kidney and liver function, and healthy blood sugar.\n\nThere are, however, several findings that deserve attention, and while none individually is alarming, the pattern across them is worth exploring. The first is his oestradiol (the primary oestrogen), which at 241 is above the male upper limit of 146. In men, oestradiol is produced partly by the testes and partly by an enzyme called aromatase, which converts testosterone into oestradiol in fat tissue, liver and other organs. At a BMI of 24.7, excess aromatisation from body fat is unlikely to be the primary driver. Golimumab and other biologics can influence the hypothalamic-pituitary-gonadal axis, and immune modulation has been associated with shifts in sex hormone metabolism. His LH (luteinising hormone, the pituitary signal that drives testicular hormone production) at 1.88 is at the lower end of range, and his progesterone at 0.6 is below the male reference range of 0.89 to 3.88. The combination of elevated oestradiol, low-normal LH, and below-range progesterone suggests the pituitary is not responding to the higher oestradiol with the expected feedback adjustment. This pattern is worth discussing with his GP. Elevated oestradiol in men can contribute to fatigue, mood changes, water retention and joint discomfort, and it may be contributing to some of his current symptoms. The GP may wish to repeat the oestradiol on a morning fasted sample to confirm, and if it remains elevated, consider whether the golimumab or another factor is driving aromatisation.\n\nHis lipid profile shows a pattern that needs steady dietary attention rather than urgent action. Total cholesterol at 5.3, LDL at 3.21 and ApoB (apolipoprotein B, the protein that carries LDL particles and the single best predictor of cardiovascular risk from blood lipids) at 1.08 are all above their respective targets. His Lp(a) (lipoprotein(a), an inherited and unchangeable form of LDL-like particle) is below 25, which is normal and genuinely useful: it means the elevated LDL and ApoB are driven entirely by modifiable factors such as diet, and not by a genetic particle he cannot change. His Lp(a)-corrected LDL at 3.13 confirms this. On the positive side, his HDL at 1.6 is in the desirable zone, his triglycerides at 1.21 are within range, his TG-to-HDL ratio (a proxy for insulin resistance and small dense LDL) is 0.76, and his ApoB-to-ApoA1 ratio at 0.67 sits just below the lower-risk threshold of 0.7. His Cardiovascular Risk Score, a TrueVitals composite built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes in at 40, which is at the boundary of the acceptable range and driven almost entirely by the ApoB and LDL. With a family history of dementia, which shares vascular risk factors with cardiovascular disease, bringing ApoB below 0.9 and ideally below 0.8 is a worthwhile long-term goal. The levers are dietary: increasing soluble fibre from oats, beans, lentils and flaxseed, increasing oily fish to two to three portions a week, and reducing saturated fat from red meat, cheese and butter.\n\nHis serum iron at 33.3 is above the upper limit of 31.3, and his transferrin saturation at 53.47% is at the upper end of range (limit 55%). His ferritin at 100 and transferrin at 2.48 are both within range, and there is no sign of iron overload in the way that a very high ferritin with suppressed transferrin would suggest. A single elevated serum iron is most commonly a fasting-state or recent dietary effect: a red-meat-rich meal the evening before the test, or an iron-fortified food, can push the morning level above range transiently. It does not indicate haemochromatosis unless the pattern repeats across tests with a rising ferritin. This is worth noting but not acting on beyond repeating on the next test.\n\nHis absolute reticulocyte count at 44.46 is marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a slightly low count means the marrow is producing red cells at a slightly slower pace. At a haemoglobin of 156 with normal MCV and MCH, this is not causing anaemia and is not clinically significant. Golimumab, as an immunosuppressant, can mildly suppress bone marrow activity, and this is the most likely explanation. It is worth mentioning to his rheumatologist at his next review.\n\nHis C-peptide at 0.921 is below the laboratory range of 1.1 to 4.4. C-peptide is a byproduct of insulin production: every molecule of insulin the pancreas makes releases one molecule of C-peptide, so it is a direct measure of how much insulin the pancreas is producing. At a fasting glucose of 5.2 and an HbA1c of 41, both comfortably healthy, a low C-peptide simply reflects low insulin demand. His insulin at 4.6 and HOMA-IR at 1.06 confirm this: the pancreas is producing exactly the right amount of insulin for a body that is responding to it efficiently. This is not a concern.\n\nHis folate at 7 is within the laboratory range of 3 to 17 but below the optimal threshold of 8. Folate (vitamin B9) is essential for DNA repair, red cell production and the methylation cycle that clears homocysteine. At 7, it is not deficient, but at his training volume and with the fatigue he describes, optimising it to above 8 through increased green leafy vegetables, beans and lentils, or a methylfolate supplement, is a reasonable step. His B12 at 579 is within the optimal band.\n\nHis total antioxidant activity (TAA) at 1.87 is above the upper limit of 1.77. This marker measures the overall antioxidant capacity of the blood, and a result above range is almost always driven by supplementation, specifically his omega-3, vitamin D and possibly the creatine. It is not a concern and does not require any action.\n\nHis IgM (immunoglobulin M, the first antibody the immune system produces in response to a new infection) at 0.6 is at the very bottom of the reference range of 0.5 to 3.0. IgG at 9.4 and IgA at 1.9 are both healthy. A low-normal IgM in a patient on golimumab is expected: TNF-alpha inhibitors can suppress B-cell activity, particularly the IgM-producing subset. This is not causing immunodeficiency, but it does fit with his report of frequent illness, because IgM is the first-response antibody that neutralises new infections before the more targeted IgG response develops. This is worth discussing with his rheumatologist: it does not mean the golimumab should be stopped, but it contextualises his susceptibility to infections and may influence decisions about vaccination timing or prophylaxis.\n\nSo what is causing the malaise and myalgia? The bloods have positively excluded active systemic inflammation (CRP below 0.5, ESR 1), significant muscle damage (CK 157), thyroid dysfunction (TSH 1.05, FT4 20.8, FT3 5.7, antibodies negative), anaemia and iron deficiency (haemoglobin 156, ferritin 100), vitamin B12 deficiency (579), diabetes and insulin resistance (glucose 5.2, HbA1c 41, HOMA-IR 1.06), liver disease (ALT 33, GGT 16, FIB-4 1.05), kidney disease (eGFR 101), coeliac disease (TTG negative), testosterone deficiency (21 nmol/L) and any acute infection or inflammatory flare. That is a long and reassuring list. The most likely explanations for persistent malaise that blood cannot measure, given what Michael has told us, fall into several categories. First, golimumab itself: TNF-alpha inhibitors are well recognised to cause fatigue, malaise and diffuse myalgia as side effects, and these can fluctuate in intensity over time even on a stable dose. The timing of his symptoms relative to his injection cycle is worth tracking. Second, the cervical nerve irritation at C5/C6: nerve root irritation does not only cause arm symptoms; it can produce a background of muscular guarding, poor sleep quality and generalised discomfort that the body experiences as malaise. His report of feeling tired on waking despite 7 to 8 hours of sleep is consistent with disrupted sleep architecture from pain or discomfort. Third, his waking fatigue and tired-on-waking energy pattern could point to a sleep quality issue independent of duration: sleep apnoea (less likely at BMI 24.7 but not impossible), restless sleep from pain, or a shifted cortisol rhythm where the morning cortisol rise is blunted. Fourth, his frequent painkiller use deserves attention. Regular ibuprofen can cause subclinical gut inflammation and microbiome disruption that manifests as bloating, malaise and reduced nutrient absorption, and this may be contributing to both his digestive symptoms and his general feeling of being unwell. Paracetamol at regular doses is gentler on the gut but adds hepatic load. The next steps that would help settle the question are: a symptom diary tracking malaise severity against the golimumab injection cycle (does it worsen in the days after injection, or in the week before the next dose?), a trial of reducing or replacing regular ibuprofen with paracetamol alone or topical anti-inflammatories for the cervical symptoms, and if the waking fatigue persists despite these steps, a discussion with his GP about whether a sleep study is warranted.","links":"The findings in this report form two distinct threads, and neither is dramatic, which is itself the most important finding.\n\nThe first thread is the hormonal pattern: oestradiol at 241, well above the male limit of 146, alongside low-normal LH at 1.88 and below-range progesterone at 0.6. In a healthy hormonal feedback loop, elevated oestradiol should prompt the pituitary to reduce LH, which in turn would lower testosterone production, and over time the oestradiol would fall. Michael's testosterone is healthy at 21, so the system has not collapsed, but the pituitary appears to be tolerating the elevated oestradiol without correcting it. Golimumab, by modulating TNF-alpha, can influence the enzymes involved in steroid hormone metabolism, including aromatase, and this is the most plausible explanation for the pattern. It is not causing overt symptoms by itself, but elevated oestradiol in men is associated with fatigue, water retention, joint stiffness and mood changes, all of which overlap with what Michael is experiencing. The connection is plausible but not proven, and the GP or rheumatologist is best placed to assess whether the oestradiol level warrants monitoring or investigation.\n\nThe second thread is the cardiovascular lipid picture: ApoB at 1.08, LDL at 3.21 and total cholesterol at 5.3, offset by an excellent HDL of 1.6, healthy triglycerides and a normal Lp(a). The Cardiovascular Risk Score at 40 sits at the boundary of acceptable, driven almost entirely by the ApoB. With a family history of dementia, which shares pathophysiology with vascular disease through small vessel damage and amyloid clearance, reducing ApoB is a meaningful long-term investment. The fact that Lp(a) is normal confirms that the entire lipid elevation is diet-modifiable: soluble fibre, oily fish, and modest saturated fat reduction are the tools.\n\nWhat was excluded matters as much as what was found. Active inflammatory disease flare has been ruled out by a CRP below 0.5 and an ESR of 1, both of which are as low as they can be. Muscle damage has been ruled out by a mid-range CK. Thyroid disease has been excluded by ideal TSH, free hormones and negative antibodies. Anaemia, iron deficiency, B12 deficiency, coeliac disease, liver disease, kidney disease and diabetes have all been excluded with clean results. This narrows the explanation for his malaise to factors the blood cannot see: the golimumab itself, the cervical nerve irritation and its effect on sleep quality, the cumulative effect of regular NSAID use on gut health, or a combination of all three.\n\nThe loose end is the borderline-low IgM at 0.6 on golimumab. It is not causing immunodeficiency in a classical sense, his IgG and IgA are healthy, but it does offer a mechanistic explanation for his frequent illnesses. IgM is the rapid-response antibody, and a blunted IgM response means the initial defence against new pathogens is slightly slower, even though the downstream IgG response catches up. This is worth his rheumatologist knowing, particularly around decisions about infection season, vaccination and whether any adjustment to the golimumab timing might help.","lifestyle":"Increase oily fish to three portions a week (salmon, mackerel, sardines), replacing one red meat meal each time. Anchor: the weekly shop, swap like for like. Why: oily fish raises HDL and lowers ApoB, which at 1.08 is the main driver of your Cardiovascular Risk Score of 40, and the omega-3 supports the anti-inflammatory environment your golimumab is creating.\nAdd a daily portion of soluble fibre: a bowl of porridge oats at breakfast, or a handful of mixed beans stirred into lunch. Anchor: first meal of the day. Why: soluble fibre binds bile acids in the gut and forces the liver to pull LDL cholesterol from the blood to make more, directly lowering your LDL from 3.21 toward the target of under 3, and it feeds the gut bacteria that may help with your bloating.\nReduce regular ibuprofen use and discuss alternatives with your GP or physiotherapist. Use topical anti-inflammatory gel on the cervical area rather than oral NSAIDs where possible. Anchor: before reaching for the tablet box, try the gel first. Why: regular oral ibuprofen disrupts the gut lining and microbiome, which may be contributing to both your bloating and your general malaise, and your liver is currently handling it well but long-term use alongside golimumab adds cumulative load.\nAdd one extra portion of dark green leafy vegetables a day (spinach, broccoli, kale) to your existing 4 to 5 portions. Anchor: add it to whichever meal currently has the least colour on the plate. Why: this will push your folate from 7 to above the optimal threshold of 8, supporting red cell production, DNA repair and the methylation cycle.\nTrack your malaise severity on a simple 1-to-10 scale each day for one full golimumab cycle, noting the injection date. Anchor: rate it each morning when you wake. Why: if the malaise peaks at a consistent point in the cycle (often days 1 to 5 post-injection, or in the final week before the next dose), this gives your rheumatologist actionable information about whether timing adjustments might help.\nPrioritise sleep quality over duration: keep your wake time fixed (including weekends), get outside within an hour of waking for at least 10 minutes of natural light, and stop caffeine by 1pm. Anchor: alarm, shoes, outside before anything else. Why: your 7 to 8 hours is adequate in duration but you wake tired every morning, which points to poor sleep architecture, and morning light resets the circadian clock that drives both your cortisol awakening response and your deep sleep cycles.\nAim for 2,300 to 2,500 kcal per day to maintain your current healthy weight of 80 kg at your activity level, with at least 130 g of protein daily (1.6 g per kg), spread across three to four meals. Anchor: build each meal around a palm-sized protein source first, then add vegetables, then carbohydrate. Why: adequate protein supports muscle recovery from your four training sessions and supports immune function, which matters on an immunosuppressant.","flags":"Oestradiol 241 pmol/L, above the male upper limit of 146.1. Combined with low-normal LH at 1.88 and below-range progesterone at 0.6, this suggests increased aromatisation or altered hypothalamic-pituitary feedback. Golimumab is a plausible contributor. Recommend discussion with GP and rheumatologist; consider repeat fasted morning oestradiol and, if persistent, investigation of cause.\nApoB 1.08 g/L, above the target of 0.9; LDL 3.21 mmol/L, above the target of 3.0; total cholesterol 5.3, above the desirable limit of 5.18. Lp(a) below 25 confirms the elevation is entirely modifiable. Cardiovascular Risk Score 40 out of 100, at the upper boundary of acceptable. HDL 1.6 and triglycerides 1.21 are favourable. Dietary modification is the first-line approach; family history of dementia adds vascular motivation.\nSerum iron 33.3 umol/L, above the upper limit of 31.3; transferrin saturation 53.47%, near the upper limit of 55%. Ferritin 100 and transferrin 2.48 are normal. Most likely a transient dietary or fasting-related elevation. Recommend repeat on next test; if persistently elevated with rising ferritin, HFE gene testing for haemochromatosis would be appropriate.\nAbsolute reticulocytes 44.46 x10^9/L, below the lower limit of 50. Haemoglobin and red cell indices are normal, so this is not causing anaemia. Most likely mild bone marrow suppression from golimumab. Worth mentioning to rheumatologist at next review.\nC-peptide 0.921 ug/L (305 pmol/L), below the laboratory range of 1.1 to 4.4. In the context of normal glucose, HbA1c and HOMA-IR, this reflects appropriately low insulin demand and is not pathological.\nProgesterone 0.6 nmol/L, below the male range of 0.89 to 3.88. Discussed above in the context of the oestradiol and LH pattern.\nFolate 7 ng/ml, within range but below the optimal threshold of 8. Recommend increasing dietary folate or adding a methylfolate supplement.\nIgM 0.6 g/L, at the bottom of range (0.5 to 3.0), with normal IgG and IgA. Expected on golimumab; contextualises frequent illness. Worth noting with rheumatologist.\nTotal antioxidant activity 1.87 mmol/L, above the upper limit of 1.77. Driven by supplementation (omega-3, vitamin D, creatine). Not a concern.\nReassuring negatives: CRP below 0.5 and ESR 1 (no active inflammation), CK 157 (no muscle damage), TSH 1.05 with negative antibodies (no thyroid disease), haemoglobin 156 and ferritin 100 (no anaemia or iron deficiency), B12 579 (adequate), glucose 5.2, HbA1c 41, HOMA-IR 1.06 (no diabetes or insulin resistance), ALT 33, GGT 16, FIB-4 1.05 (no liver disease), eGFR 101 (normal kidney function), TTG negative (no coeliac disease), testosterone 21, free testosterone 0.343 (no testosterone deficiency), PSA 0.5 (normal prostate), urinalysis clean, RF negative.","recommendations":"Discuss the elevated oestradiol of 241 (limit 146) with your GP and rheumatologist. Bring the LH of 1.88 and progesterone of 0.6 as context. Ask whether golimumab could be contributing and whether a repeat fasted morning oestradiol is warranted. If persistent, further investigation into the cause of increased aromatisation may be appropriate.\nAsk your rheumatologist about the borderline-low IgM of 0.6 at your next review, in the context of your frequent illnesses. This does not mean the golimumab should change, but it is useful information for decisions about vaccination timing and infection prevention.\nMention the marginally low absolute reticulocyte count of 44.46 (limit 50) to your rheumatologist as part of the routine monitoring on golimumab. It is not causing anaemia but is worth tracking.\nDiscuss your regular ibuprofen use with your GP. Given the bloating and digestive discomfort, switching to topical anti-inflammatory gel for the cervical symptoms and reserving oral NSAIDs for flares may reduce gut irritation.\nAddress the lipid profile through diet: increase soluble fibre (oats, beans, lentils, flaxseed), oily fish (three portions per week), and reduce saturated fat from red meat, cheese and butter. Target ApoB below 0.9 and LDL below 3.0. If dietary changes over three to six months do not bring ApoB below 0.9, discuss whether a statin is appropriate given the family history of dementia and the cardiovascular risk score of 40.\nRepeat serum iron and transferrin saturation on the next blood test to confirm whether the elevation to 33.3 was transient. If persistently elevated with a rising ferritin, request HFE gene testing.\nRetest in six months, repeating: oestradiol, LH, progesterone, ApoB, LDL, full lipid panel, serum iron, transferrin saturation, ferritin, folate, reticulocytes, IgM, CRP and full blood count. Maintain calorie intake at 2,300 to 2,500 kcal per day with at least 130 g protein daily to support training recovery and immune function at your current healthy weight.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 to 3,000 IU daily, taken with your largest meal that contains fat. Your level at 88 nmol/L is within the sufficient range but below the optimal band of 100 to 120. With a family history of osteoporosis, maintaining vitamin D in the optimal zone is particularly important for bone mineral density.\nAdd vitamin K2 (MK-7) at 100 to 200 mcg daily, taken with the vitamin D. K2 directs calcium into bone rather than arteries, supporting both the osteoporosis prevention goal and cardiovascular health.\nContinue magnesium glycinate at 300 to 400 mg, taken before bed. Your magnesium at 0.91 is within the optimal band, which confirms the supplement is working. It also supports sleep quality, which is relevant given your tired-on-waking pattern.\nContinue omega-3 fish oil at 2 to 3 g of combined EPA and DHA daily. This supports the anti-inflammatory environment alongside golimumab and contributes to the cardiovascular goal of lowering ApoB and triglycerides.\nAdd methylfolate at 400 to 800 mcg daily. Your folate at 7 is below the optimal threshold of 8, and methylfolate is the bioactive form that bypasses any MTHFR polymorphism. Take it with food.\nContinue creatine monohydrate at 3 to 5 g daily. At your training volume this supports muscle recovery and is contributing to your above-range total antioxidant activity, which is not a concern.\nContinue probiotics. Given your bloating, digestive discomfort and regular NSAID use, maintaining gut flora diversity is sensible.\nDo not add iron. Your ferritin at 100 and serum iron at 33.3 (above range) mean additional iron could push stores into excess.\nThe most important changes from this report are not supplements. They are the dietary modifications to lower ApoB, the reduction in oral NSAID use, the conversation with your rheumatologist about oestradiol and IgM, and the sleep hygiene steps to address your waking fatigue.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 69.5; held to 59 by a system rated \"See your GP\". Weakest systems: hormones 33%, lipids & cardiovascular 41%, iron studies 67%. Biggest drags: Apolipoprotein B, Oestradiol, LDL Cholesterol, Transferrin Saturation.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"35.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3510","lower_normal":"","upper_normal":"50","lower_optimal":"","upper_optimal":"45","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"years","description":"PhenoAge is a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. Michael's PhenoAge of 35.1 against a calendar age of 45 means he is ageing nearly ten years slower than average. The main drivers of this favourable result are his very low CRP, healthy albumin, good kidney function and low white cell count. Maintaining these markers through continued anti-inflammatory management, good nutrition and regular exercise will keep this biological age advantage.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, an ll.","low_causes":"","high_causes":"Liver inflammation, fatty liver disease, medications, alcohol, strenuous exercise","padding":"1","one_sided":"0","range_type":"no lower"},{"key":"ast","name":"AST/GOT","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"13","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5625","units":"IU/l","description":"AST is an enzyme found in the liver, heart and muscles. Unlike ALT, which is more liver-specific, AST can rise from muscle damage as well as liver strain. Michael's AST at 26 is well within the optimal range, confirming that neither his liver nor his muscles are under significant stress, an important reassurance given his training load and his complaint of diffuse myalgia.","low_causes":"Vitamin B6 deficiency","high_causes":"Liver disease, muscle damage, heart injury, strenuous exercise, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1096","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1438","units":"IU/l","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. At 16, Michael's GGT is excellent and well within the optimal range. This is reassuring given his monthly golimumab and frequent painkiller use, confirming the liver is not under enzymatic stress from either.","low_causes":"","high_causes":"Alcohol use, liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0","range_type":"no lower" function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}
