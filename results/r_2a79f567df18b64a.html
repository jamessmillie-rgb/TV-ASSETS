<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Michael Andrew Feltham","dob":"25/06/1981","report_date":"2026-10-06","summary":"Michael is a 45-year-old male presenting with a BMI of 24.7, following a standard mixed diet, eating 4 to 5 portions of vegetables and fruit a day with takeaway or ultra-processed food weekly and sugary food rarely; portions are larger than average (volume 7 out of 10). He trains four times per week (two cardio, two resistance) at hard intensity with 5,000 to 7,500 daily steps. He sleeps 7 to 8 hours but feels tired most mornings, with energy at its lowest on waking. Stress feels hard to manage some weeks. He drinks 1 to 4 alcoholic drinks per week. He takes golimumab (Simponi) monthly for reactive arthritis and inflammatory disease, and uses painkillers frequently (ibuprofen or paracetamol). He supplements with vitamin D, magnesium, omega-3 fish oil, creatine and probiotics. His family history includes osteoporosis and dementia. A previous blood test returned normal results. He reports frequent illness, bloating and digestive discomfort, low energy and fatigue, and joint pain and stiffness, all of which he describes as having been present for as long as he can remember, though the current episode of persistent low-grade malaise, reduced energy and diffuse muscle aches is clearly outside his normal baseline and has been present for several weeks. He has also developed right-sided neck and upper-back pain with intermittent tingling, numbness and occasional twitching into the right arm and hand; his GP and physiotherapist suspect a C5/C6 cervical mechanical or nerve irritation. His goals are to prevent disease, improve energy levels and boost his immune system.\n\nThe context Michael has provided is unusually detailed and thoughtful, and the results deserve an equally careful read. The headline finding is that his blood work is, on the whole, remarkably clean for someone who feels as unwell as he does, and that in itself is useful clinical information. There is no systemic inflammation, no anaemia, no thyroid failure, no liver or kidney problem, and no sign of immune suppression beyond what golimumab is designed to produce. There are, however, a handful of findings that deserve attention, and one hormonal result that his GP should be made aware of.\n\nThe finding that should be discussed with his GP first is his oestradiol. Oestradiol is the most active form of oestrogen, produced in small amounts in men primarily through the conversion of testosterone by an enzyme called aromatase, which sits mainly in body fat. Michael's oestradiol is 241 pmol/L, well above the upper limit of 146. His testosterone is a healthy 21 nmol/L, sitting comfortably in the optimal zone, with a free testosterone of 0.343 nmol/L and a bioavailable testosterone of 8.58 nmol/L, both within their respective ranges. His SHBG (sex hormone binding globulin, the protein that carries testosterone in the blood and controls how much is available to tissues) is 48.6, which is well placed. So the testosterone production and delivery system is working properly, but an unusually large proportion of his testosterone appears to be being converted into oestradiol. At a BMI of 24.7 there is not a large amount of body fat to drive aromatase activity, which makes this harder to explain through the usual mechanism. Golimumab and other biologics have been associated with hormonal shifts, and this is worth raising with his rheumatology team. Elevated oestradiol in men can contribute to fatigue, mood changes, water retention, bloating and reduced drive, so this could plausibly be contributing to at least some of Michael's current symptoms. His progesterone is 0.6 nmol/L, below the lower limit of 0.89. In men, progesterone plays a minor role in mood, sleep quality and balancing oestrogen's effects, and a low progesterone alongside a high oestradiol tilts the ratio further. His LH and FSH are both in the lower part of their ranges, at 1.88 and 3.4 respectively, which suggests the pituitary gland is not driving the testes hard, possibly because the elevated oestradiol is feeding back and suppressing the signal. This entire pattern, raised oestradiol with low-normal gonadotropins and low progesterone, should be reviewed by his GP, ideally with an endocrinology referral if the oestradiol is confirmed on repeat.\n\nTurning to what is working well, and there is a great deal to feel reassured about. Michael's inflammatory markers are exceptional, particularly given that he has an inflammatory condition treated with a biologic. His hsCRP (high-sensitivity C-reactive protein, the most sensitive blood marker of systemic inflammation) is below 0.5, which is as low as the assay can measure. His ESR (erythrocyte sedimentation rate, another inflammation marker that responds more slowly) is 1, effectively zero. His platelet-to-lymphocyte ratio is 94.6, well within the optimal band, and his systemic immune-inflammation index is 221, also comfortably placed. Taken together, these tell us that whatever is causing Michael's malaise, it is not an inflammatory flare of his underlying condition, and the golimumab is doing an excellent job of suppressing disease activity. His rheumatoid factor is negative, and his CRP being this low makes active joint inflammation extremely unlikely as the explanation for his current symptoms.\n\nHis thyroid is in excellent health. TSH (thyroid stimulating hormone, the signal from the pituitary that tells the thyroid how hard to work) is 1.05, which sits right in the ideal zone. Free T4 (the storage form of thyroid hormone) is 20.8, at the upper end of the range, and free T3 (the active form that cells actually use for energy and metabolism) is 5.7, also well within the optimal band. His FT3-to-FT4 ratio is 0.274, confirming good conversion from storage to active hormone. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. This is an important exclusion given his family history of thyroid disease and his symptoms of fatigue and morning tiredness.\n\nHis liver is in excellent condition. ALT (alanine aminotransferase, the enzyme most specific to liver-cell damage) is 33, which is within the laboratory range but worth noting is above the stricter optimal cut-off of 30 for men, though only marginally. GGT (gamma-glutamyl transferase, which responds to alcohol, medication load and metabolic strain) is 16, which is genuinely low and reassuring, especially given that he takes a biologic, uses painkillers frequently and drinks moderately. AST is 26, alkaline phosphatase is 89, bilirubin is 13, albumin is 46, and total protein is 71, all exactly where they should be. His FIB-4 score (a composite that estimates liver scarring using age, platelets, AST and ALT) is 1.05, well below the threshold, and his APRI and NAFLD fibrosis scores both confirm no evidence of fibrosis or fatty liver disease. The De Ritis ratio (AST divided by ALT) is 0.79, sitting just below the optimal band of 0.8 to 1.3, which simply reflects the ALT being marginally the higher of the two enzymes rather than anything pathological. Given the frequent painkiller use, this clean liver picture is genuinely reassuring.\n\nHis kidney function is strong. Cystatin C (a protein filtered by the kidneys that gives a more reliable estimate of filtration than creatinine alone, especially in muscular or athletic people) is 0.84, giving a cystatin C eGFR of 101 and a combined eGFR of 101, both comfortably above 90. The creatinine-based eGFR of 86 is slightly lower, which is almost certainly because his muscle mass from regular training generates more creatinine, making the creatinine-based estimate look worse than reality. Urea is 5.9, sodium is 141, chloride is 101, bicarbonate is 26.5, and potassium is 4.1, all perfectly placed. His uric acid is 304, within both the laboratory and optimal ranges.\n\nHis blood sugar control is excellent. Fasting glucose is 5.2, HbA1c (glycated haemoglobin, which reflects average blood sugar over the previous two to three months) is 41 mmol/mol, and fasting insulin is 4.6, giving a HOMA-IR (a calculation that estimates how resistant the body's cells are to insulin) of 1.06. This places him firmly in the insulin-sensitive category. His estimated average glucose from HbA1c is 6.8, within range. Given his family history of type 2 diabetes, this clean metabolic picture is an important positive to document. His C-peptide, which is a byproduct released when the pancreas makes insulin and therefore a direct measure of insulin production, is 0.921 ug/L (305 pmol/L), which falls below the laboratory's lower limit of 1.1 ug/L. However, in the context of a low and entirely appropriate fasting insulin of 4.6, a normal glucose and a normal HbA1c, this simply reflects a pancreas that does not need to produce much insulin because the body is so sensitive to it. This is a positive finding, not a sign of pancreatic insufficiency.\n\nHis full blood count is largely unremarkable. Haemoglobin is 156, red cells are 4.94, haematocrit is 0.454, MCV is 91.8, MCH is 31.5 and MCHC is 344, all within range. Platelets are 194 with an MPV of 8.9, both healthy. His white cell count is 4.81, which is within the laboratory range of 4 to 10 but sits at the lower end. Within that, neutrophils are 2.34 (the cells that form the first line of defence against bacterial infection), lymphocytes are 2.05, monocytes are 0.36, eosinophils are 0.05 and basophils are 0.01. The neutrophil count, while within range, is at the lower end, and this is relevant to Michael's report of frequent illness. Golimumab suppresses TNF-alpha, a key inflammatory signalling molecule, and one consequence is a degree of immune modulation that can leave the white cell and neutrophil counts running lower than they otherwise would. This does not mean his immune system is failing, but it does mean his threshold for catching minor infections is likely lower than someone not on a biologic, which aligns directly with his symptom of frequent illness. His reticulocyte percentage is 0.9, within range, but the absolute reticulocyte count is 44.46, marginally below the lower limit of 50. Reticulocytes are young red blood cells freshly released from the bone marrow, and a slightly low count suggests the marrow is producing red cells at a slightly reduced tempo. At 44.46 against a lower limit of 50, this is a marginal finding. It is not causing anaemia (his haemoglobin is 156), and it may reflect the mild immunosuppressive effect of golimumab on marrow activity, or simply normal variation. It does not require action on its own but is worth documenting.\n\nHis immunoglobulin levels are reassuring. IgG (the antibody class responsible for long-term immunity) is 9.4, IgA (which protects mucosal surfaces including the gut) is 1.9, and IgM (the first-response antibody) is 0.6. The IgM sits right at the lower boundary of its range at 0.5 to 3, and while it is within range, a low-normal IgM on a biologic that suppresses immune signalling is consistent with the picture of a mildly dampened immune system. IgE (the allergy and parasitic-response antibody) is 62.1, within range. Tissue transglutaminase IgA is negative, ruling out coeliac disease as a cause of his bloating and digestive symptoms.\n\nHis lipid profile is mixed and worth discussing. Total cholesterol is 5.3, above the desirable threshold of 5.18. His HDL (high-density lipoprotein, the protective cholesterol that removes fat from artery walls) is 1.6, which is above the desirable threshold of 1.55 and a genuine positive. His triglycerides are 1.21, within the healthy range. However, his LDL (low-density lipoprotein, the cholesterol that deposits into artery walls) is 3.21, above the upper limit of 3.0, and his ApoB (apolipoprotein B, the protein that sits on every LDL particle and is the best single measure of how many atherogenic particles are circulating) is 1.08, above the desirable threshold of 0.9 and classified as borderline high. His Lp(a), a genetically determined lipoprotein that accelerates plaque formation, is below 25 nmol/L, which is normal and genuinely useful information because it means the elevated LDL and ApoB are driven entirely by modifiable factors: diet, exercise, and possibly the metabolic effects of his medication. His ApoB-to-ApoA1 ratio is 0.67, just under the 0.7 threshold for lower risk, and his atherogenic index of plasma is negative at minus 0.121, which is favourable. His LDL-to-HDL ratio is 2.01, within the optimal band. His cardiovascular risk score, a TrueVitals composite built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 40 out of 100, sitting right at the upper boundary of acceptable. The score is being driven primarily by the ApoB and LDL. Given his family history of dementia (cardiovascular health and brain health are closely linked through cerebral blood flow and small-vessel integrity), bringing the ApoB below 0.9 is a worthwhile long-term investment. The good news is that with a normal Lp(a), excellent HDL, good triglycerides and excellent insulin sensitivity, this is very achievable through dietary adjustment alone.\n\nHis iron studies show a serum iron of 33.3 umol/L, above the upper limit of 31.3, and a transferrin saturation of 53.47%, which sits within the laboratory range of 18 to 55 but is above the optimal ceiling of 40%. His ferritin is 100, well placed in the optimal band, and his transferrin is 2.48, within range. The mildly elevated serum iron is most likely a snapshot effect: serum iron fluctuates significantly throughout the day and with recent meals, and a single reading just above the upper limit with a normal ferritin and a normal transferrin does not indicate iron overload. However, given that the transferrin saturation is also running high, it would be worth repeating this on a future fasting morning sample. If the saturation remains above 45% on repeat, his GP may consider an HFE gene test to exclude hereditary haemochromatosis, though the normal ferritin makes this unlikely to be clinically significant even if a gene variant is present.\n\nHis vitamin D is 88 nmol/L, which is above the sufficiency threshold of 50 and within the optimal band of 75 to 120. His supplementation is working. His B12 is 579 pg/mL, within the optimal zone of 500 to 900. His folate is 7 ng/mL, which sits within the laboratory range of 3 to 17 but is below the optimal threshold of 8. Folate (vitamin B9) is essential for DNA repair, red blood cell production, methylation (the process by which the body processes homocysteine), and mood regulation. At 7, it is not deficient, but bringing it above 8 through more leafy greens or a methylfolate supplement would be a small but worthwhile gain, particularly given the marginal reticulocyte count. His calcium, corrected calcium, phosphate, magnesium and parathyroid hormone are all within range and well placed. His creatine kinase is 157, mid-range, which is reassuring given his report of diffuse muscle aches: a significantly elevated CK would suggest muscle breakdown, and 157 is entirely normal for someone who trains four times a week.\n\nHis cortisol is 298 nmol/L, which sits within the normal morning range. His DHEA-S (dehydroepiandrosterone sulphate, an adrenal hormone that supports energy, immune function and tissue repair) is 2.5 umol/L (921 ug/dL), which is within range. His prolactin is 78, within range. His PSA is 0.5 with a free PSA ratio of 0.82, both excellent and ruling out any prostate concern. His tumour markers CA19-9 and CEA are both well within range. His total antioxidant activity is 1.87 mmol/L, marginally above the upper limit of 1.77. This is almost certainly driven by his omega-3 and vitamin D supplementation and is not a concern.\n\nHis amylase is 82 and lipase is 34, both within range, ruling out pancreatic inflammation as a contributor to his bloating.\n\nHis PhenoAge, a biological ageing estimate built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase, is 36.6 years against a calendar age of 45, placing him 8.4 years younger biologically. This is an excellent result and reflects the combined effect of good metabolic health, low inflammation and healthy organ function.\n\nSo the central question Michael is asking, whether there is an objective explanation for his persistent malaise and myalgia, deserves a direct answer. The bloods do not reveal a single dramatic cause, but they do reveal a pattern that, taken together, may contribute. The elevated oestradiol is the most significant finding and could plausibly account for fatigue, reduced drive, bloating and a general sense of feeling off-baseline. The mildly dampened immune indices (low-normal WBC, low-normal neutrophils, borderline IgM, marginally low reticulocyte count) are consistent with golimumab doing its job but leaving the immune system running with less reserve, which explains the frequent minor illnesses and possibly the prolonged recovery from them. The suboptimal folate is unlikely to be the primary driver but is an easy fix. The cervical nerve irritation is mechanical and separate from the systemic picture, as his GP and physiotherapist have correctly identified.\n\nWhat the bloods have positively excluded is equally important: there is no active inflammation (CRP below 0.5, ESR 1), no anaemia (haemoglobin 156), no thyroid dysfunction (TSH 1.05, both antibodies negative), no liver damage (GGT 16, ALT 33, all fibrosis scores clear), no kidney impairment (cystatin C eGFR 101), no blood sugar problem (HbA1c 41, HOMA-IR 1.06), no coeliac disease (tTG negative), no muscle breakdown (CK 157), no B12 deficiency (579), and no immune deficiency in the formal sense (all immunoglobulins within range). The causes that blood cannot measure but that fit Michael's picture include sleep architecture (he sleeps 7 to 8 hours but wakes tired most mornings and is at his lowest on waking, which suggests the sleep may not be restorative, possibly due to the cervical pain disrupting positioning), the cumulative effect of frequent painkiller use (both ibuprofen and paracetamol can affect gut lining integrity and microbiome balance, which connects to his bloating), deconditioning from reduced training during this symptomatic period, and the psychological load of feeling unwell with no clear explanation. A sleep study or sleep tracker review, a trial of reducing painkiller frequency where pain allows, and a conversation with his rheumatologist about the oestradiol finding would be the most productive next steps.\n\nHis urinalysis results are pending and will be reviewed when they arrive.","links":"The findings in Michael's report organise into three connected threads rather than a list of isolated markers.\n\nThe first thread is hormonal. His testosterone is healthy at 21, his SHBG is well placed at 48.6, and his free and bioavailable testosterone are both within range, so the male hormone axis is producing and delivering adequately. But an unusually large amount of that testosterone is being converted into oestradiol, which at 241 is 65% above the upper limit. This conversion is usually driven by aromatase activity in body fat, but Michael's BMI of 24.7 makes that a less convincing explanation than it would be in someone carrying significant excess weight. Golimumab and other TNF-alpha inhibitors have been associated with alterations in sex hormone metabolism, and this is the more plausible driver. The low progesterone at 0.6 compounds the picture because progesterone normally provides a counterbalance to oestrogen's effects. The low-normal LH at 1.88 suggests the pituitary may be receiving a suppressive signal from the elevated oestradiol, reducing its drive to the testes. This hormonal imbalance could plausibly contribute to fatigue, bloating, reduced motivation and the general malaise Michael describes, and it may be the closest thing in this report to an objective explanation for his symptoms.\n\nThe second thread is immune modulation. Golimumab suppresses TNF-alpha, which is exactly what it should do for reactive arthritis, and the inflammatory markers confirm it is working beautifully: CRP below 0.5, ESR 1, all inflammatory indices within optimal ranges. But TNF-alpha suppression comes at a cost. The white cell count at 4.81 sits at the lower end of range, neutrophils at 2.34 are in the lower quarter, IgM at 0.6 is at the floor of its range, and the absolute reticulocyte count at 44.46 is marginally below the lower limit. None of these is dangerously low, and none would cause concern in isolation, but together they describe an immune system running with reduced reserve. This directly explains Michael's report of frequent illness: he is more susceptible to minor viral and bacterial infections because the very medication that controls his arthritis also dampens the immune response to everyday pathogens. The frequent painkiller use (particularly ibuprofen, which is itself mildly immunomodulatory and affects gut mucosal integrity) adds another layer.\n\nThe third thread is cardiovascular and metabolic, which is independent of the first two but important for Michael's goal of disease prevention and his family history of dementia. His metabolic health is excellent: fasting insulin of 4.6, HOMA-IR of 1.06, glucose of 5.2, HbA1c of 41. But his LDL at 3.21 and ApoB at 1.08 indicate that atherogenic particle number is above the ideal threshold. With a normal Lp(a) below 25, this is entirely modifiable through diet. His HDL at 1.6 and triglycerides at 1.21 are both favourable, which means the overall lipid picture is not alarming, but the ApoB needs to come down. The cardiovascular risk score of 40 sits at the boundary, and given his family history of dementia (where cerebrovascular health plays a protective role), investing in bringing ApoB below 0.9 over the next six to twelve months is one of the highest-value actions in this report.\n\nWhat has been ruled out matters as much as what has been found. Systemic inflammatory flare: excluded by CRP and ESR. Thyroid failure: excluded by TSH, FT4, FT3 and negative antibodies. Liver toxicity from medication or painkillers: excluded by GGT, ALT, fibrosis scores. Kidney impairment: excluded by cystatin C eGFR. Anaemia: excluded by haemoglobin and full blood count. Coeliac disease: excluded by tTG. Muscle breakdown: excluded by CK. B12 deficiency: excluded. Immune deficiency: excluded, though immune reserve is reduced.\n\nThe loose end is the elevated serum iron and transferrin saturation. At 33.3 and 53.47% respectively, with a normal ferritin of 100, this is most likely a diurnal fluctuation captured at a peak moment. But the saturation is high enough that a repeat fasting sample in three months would be prudent to confirm it has normalised, and if it has not, an HFE gene test would be the next step.","lifestyle":"Add two to three portions of oily fish per week: salmon, mackerel or sardines, ideally replacing a red-meat meal. Anchor: your weekly shop. Why: the omega-3 in oily fish lowers ApoB particle number and supports the anti-inflammatory environment your golimumab is creating; your ApoB of 1.08 needs to come below 0.9.\nAdd a daily portion of soluble fibre: a bowl of oats at breakfast, or a handful of almonds, or a portion of beans or lentils with your main meal. Anchor: first meal of the day. Why: soluble fibre binds bile acids and forces the liver to pull LDL from the blood to make more, directly lowering your LDL of 3.21.\nIncrease leafy greens to at least one large portion a day: spinach, kale, broccoli, or a mixed-leaf salad with your main meal. Anchor: add to whatever you are already eating, not instead of it. Why: these are the richest dietary source of folate, which at 7 is below the optimal threshold of 8, and they also provide magnesium and vitamin K2 for bone health given your family history of osteoporosis.\nReduce saturated fat by switching from butter to olive oil for cooking and choosing leaner cuts of meat where possible. Anchor: when you next buy cooking oil or butter. Why: saturated fat is the strongest dietary driver of LDL particle number, and this single swap can move ApoB by 10 to 15% over three months.\nWalk for fifteen to twenty minutes after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and triglyceride response to that meal and supports the already excellent insulin sensitivity your HOMA-IR of 1.06 reflects.\nFix your wake time to within thirty minutes every day, including weekends, and get outside into natural light within the first hour. Anchor: alarm plus immediate daylight. Why: you sleep 7 to 8 hours but wake tired most mornings and feel worst on waking; a locked wake time and morning light exposure are the two most effective tools for resetting the cortisol awakening response and improving sleep quality without changing sleep quantity.\nSet a caffeine cut-off at 1pm. Anchor: after lunch, switch to decaf or herbal. Why: caffeine's half-life is five to six hours, meaning an afternoon coffee is still active at bedtime and can fragment deep sleep without you realising, contributing to the unrefreshing sleep pattern you describe.\nDiscuss with your GP and physiotherapist whether you can reduce painkiller frequency by substituting movement, heat, or positional adjustments for some doses. Why: frequent ibuprofen use can affect gut-lining integrity and microbiome balance, which may be contributing to your bloating, and paracetamol adds to liver workload even though your liver markers are currently clean.","flags":"Oestradiol 241 pmol/L, above the upper limit of 146, with progesterone 0.6 nmol/L below the lower limit of 0.89 and LH at 1.88 (low-normal). This hormonal pattern suggests increased aromatase conversion of testosterone to oestradiol, possibly influenced by golimumab. GP review recommended, ideally with repeat oestradiol and consideration of endocrinology referral if confirmed.\nApoB 1.08 g/L, above the desirable threshold of 0.9 (borderline high), with LDL 3.21 mmol/L above the upper limit of 3.0 and total cholesterol 5.3 above the desirable threshold of 5.18. Lp(a) is normal below 25, confirming the elevation is modifiable. Cardiovascular risk score 40 out of 100 at the upper boundary. HDL 1.6, triglycerides 1.21 and ApoB/A1 ratio 0.67 are all favourable. Dietary modification is the first-line approach.\nSerum iron 33.3 umol/L, above the upper limit of 31.3, with transferrin saturation 53.47%, above the optimal ceiling of 40%. Ferritin 100 and transferrin 2.48 are within range. Most likely a diurnal fluctuation. Recommend repeat fasting iron studies in three months; if saturation remains above 45%, consider HFE gene test to exclude hereditary haemochromatosis.\nC-Peptide 0.921 ug/L (305 pmol/L), below the laboratory lower limit of 1.1 ug/L (364 pmol/L). In the context of fasting insulin 4.6, glucose 5.2 and HbA1c 41, this reflects low insulin demand from high insulin sensitivity, not pancreatic insufficiency. No action required.\nAbsolute reticulocyte count 44.46, marginally below the lower limit of 50. Haemoglobin 156 confirms no anaemia. Likely reflects mild bone marrow modulation from golimumab. Monitor on future tests.\nFolate 7 ng/mL, within range but below the optimal threshold of 8. Increase dietary folate through leafy greens or consider methylfolate supplementation.\nTotal antioxidant activity 1.87 mmol/L, marginally above the upper limit of 1.77. Most likely driven by omega-3 and vitamin D supplementation. Not a concern.\nReassuring negatives: CRP below 0.5 and ESR 1 (no systemic inflammation or disease flare), thyroid function optimal with negative antibodies (no autoimmune thyroid disease), liver markers clean with all fibrosis scores normal (no hepatotoxicity from medication or painkillers), cystatin C eGFR 101 (excellent kidney function), HbA1c 41 and HOMA-IR 1.06 (excellent metabolic health and insulin sensitivity), CK 157 (no muscle breakdown), B12 579 (adequate), all immunoglobulins within range (no formal immunodeficiency), tTG negative (no coeliac disease), PSA 0.5 (no prostate concern), tumour markers clear, rheumatoid factor negative, PhenoAge 36.6 (8.4 years younger than calendar age).","recommendations":"Discuss the elevated oestradiol of 241 (upper limit 146) with your GP, bringing the full hormonal panel: testosterone 21, SHBG 48.6, free testosterone 0.343, LH 1.88, FSH 3.4, progesterone 0.6. Request a repeat oestradiol on a morning fasting sample, and ask whether golimumab could be contributing. If confirmed, an endocrinology referral would be appropriate to explore the cause and discuss whether intervention is needed.\nRaise the lipid findings with your GP at your next routine appointment: ApoB 1.08 (target below 0.9), LDL 3.21 (target below 3.0), with the positive context that Lp(a) is normal, HDL is 1.6, and triglycerides are 1.21. Dietary modification should be tried first for three to six months before considering medication, and the cardiovascular risk score of 40 supports this timeline rather than urgency.\nRequest a repeat fasting iron panel (serum iron, transferrin, transferrin saturation, ferritin) in three months to confirm whether the serum iron of 33.3 and transferrin saturation of 53.47% normalise. If saturation remains above 45%, ask for an HFE gene test.\nDiscuss the frequent illness pattern with your rheumatologist in the context of golimumab therapy, noting the low-normal white cell count of 4.81, neutrophils of 2.34 and IgM of 0.6. Ask whether any adjustment to the biologic regimen or additional immune support is appropriate.\nDiscuss the frequent painkiller use with your GP, particularly whether ibuprofen could be contributing to gut symptoms given your bloating. Explore alternative pain management strategies for the cervical symptoms.\nCalorie and protein targets: at 80 kg, 180 cm, training four times per week at hard intensity, Michael's estimated basal metabolic rate is approximately 1,800 kcal, with a total daily energy expenditure of approximately 2,880 kcal (moderate-to-high activity multiplier of 1.6). To maintain current weight and support training and recovery, aim for 2,700 to 2,900 kcal per day. Protein target: 104 to 128 g per day (1.3 to 1.6 g per kg). Retest in three to four months, repeating oestradiol, LH, FSH, progesterone, iron studies (fasting), full lipid panel with ApoB, full blood count with reticulocytes, and folate.","supplementation":"Continue vitamin D3 (cholecalciferol) at 2,000 IU daily with a fat-containing meal. His level of 88 nmol/L is well within the optimal range, and this dose is maintaining it effectively. Given his family history of osteoporosis, maintaining vitamin D above 75 is particularly important for calcium absorption and bone density.\nAdd vitamin K2 (MK-7) 100 to 200 mcg daily, taken with the vitamin D. K2 directs calcium into bone and away from arteries, supporting both his family history of osteoporosis and his cardiovascular goals.\nContinue magnesium glycinate at 300 to 400 mg, taken before bed. His magnesium of 0.91 is within the optimal range, and this form supports sleep quality, which is relevant given his pattern of waking tired.\nContinue omega-3 fish oil at 2 to 3 g of combined EPA and DHA daily, taken with a meal. This supports the LDL and ApoB reduction he needs and provides anti-inflammatory benefit alongside the golimumab.\nAdd methylfolate 400 to 800 mcg daily. His folate of 7 is below the optimal threshold of 8, and the methylated form is better absorbed. This supports red cell production (relevant to his marginally low reticulocyte count), DNA repair and methylation.\nContinue creatine monohydrate at 3 to 5 g daily. This supports his training, cognitive function (relevant to his family history of dementia), and muscle recovery.\nContinue probiotics, ideally a multi-strain formulation containing Lactobacillus and Bifidobacterium species, taken daily. This supports gut integrity, which is relevant to his bloating and the potential gut-lining effects of frequent ibuprofen use.\nDO NOT take iron supplements. His ferritin is 100 and his serum iron is already above range at 33.3. Additional iron could push saturation higher and would be counterproductive until the repeat iron studies clarify the picture.\nThe most important changes from this report are not supplements. They are the dietary adjustments to bring ApoB below 0.9, the GP conversation about the elevated oestradiol, the review of painkiller frequency, and the morning light and fixed wake-time routine to address the unrefreshing sleep.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 67.4; held to 59 by a system rated \"See your GP\". Weakest systems: hormones 25%, lipids & cardiovascular 41%, iron studies 67%. Biggest drags: Apolipoprotein B, Oestradiol, LDL Cholesterol, Progesterone.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"35.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3510","lower_normal":"","upper_normal":"50","lower_optimal":"","upper_optimal":"45","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4500","units":"years","description":"PhenoAge is a biological ageing estimate calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, white cell count and alkaline phosphatase. Michael's PhenoAge of 36.6 against a calendar age of 45 places him 8.4 years younger biologically. The drivers of this favourable gap are his exceptionally low CRP (below 0.5), healthy albumin (46), and normal glucose. Note that the fasting glucose used in this calculation was the estimated average glucose from HbA1c (5.9 mmol/L) because a direct fasting glucose conversion was used in lieu of a separate fasting result for the PhenoAge formula. This is an excellent result that reflects the combined benefit of his active lifestyle, good nutrition and well-controlled inflammatory disease.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"40","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals composite index from 0 to 100, built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built by current biomarker levels, without an age term, so a young person with poor markers will score highly. Michael's score of 40 sits at the upper boundary of accep // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;

const groupOrder = ['OVERALL HEALTH','LIVER & METABOLIC','LIPIDS & CARDIOVASCULAR','GLUCOSE & INSULIN','INFLAMMATION','ELECTROLYTES & MINERALS','KIDNEY FUNCTION','HEMATOLOGY','IRON STUDIES','HORMONES','THYROID','VITAMINS & NUTRIENTS','CARDIAC MARKERS','DIGESTIVE','IMMUNOLOGY','PROSTATE','TUMOR MARKERS','SPECIALIZED TESTS','AUTOIMMUNE & CELIAC','URINALYSIS'];
const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
window.verifyDob=verifyDob;
dob.focus();
