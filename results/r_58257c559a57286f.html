<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Mark Jones","dob":"03/11/1974","report_date":"2026-09-30","summary":"Mark is a 51-year-old male presenting with a BMI of 32.4, following an ultra-processed and fast food heavy diet rated 3 out of 10 for quality with a volume of 5 out of 10. He does not train at all, with no cardio or resistance sessions per week, and takes between 7,500 and 10,000 steps daily. He reports sleeping fewer than six hours most nights. He has no medications listed. He reports low energy and fatigue, joint pain and stiffness, and weight gain with difficulty losing weight. His goals are to lose body fat, improve long-term health and longevity, and improve energy levels. He also notes that he has been to A&E twice in recent months with chest pains, where blood tests including an ECG found nothing wrong, with the department querying a viral infection. He describes aching over most of his body.\n\nMark's cardiovascular profile is the finding that needs the most attention in this report, and it is the area where his GP should be involved. His ApoB, which is the protein that carries LDL cholesterol particles into the artery wall and is the single best blood marker of cardiovascular risk, is 1.46 g/L. That is classified as \"very high\" by the laboratory, well above the 0.9 threshold and far above the ideal target of below 0.8. His LDL cholesterol is 3.82 mmol/L against an ideal of below 2.6. His total cholesterol is 6.1, and his non-HDL cholesterol, which captures everything that can deposit in the artery wall, is 4.8. His triglycerides are 2.37 mmol/L, above the 1.7 fasting threshold and well above the ideal of below 1.0, which reflects the ultra-processed diet directly: refined carbohydrates and excess sugar drive the liver to produce more triglyceride-rich particles. His VLDL, the carrier for those triglycerides, is elevated at 1.08 against a limit of 0.78. His HDL cholesterol, the protective fraction that removes cholesterol from the artery wall, is 1.3,  to maintain its output. His free T4, the main hormone the thyroid produces, is 14.5 pmol/L, which is within the laboratory range of 11.5 to 22.7 but sits at the lower end, below the optimal band of 14 to 20, just barely inside it. His free T3, the active form that cells actually use, is 6.0 pmol/L, which is well within the ideal range of 4.5 to 6.5 and shows the thyroid is still converting T4 to T3 effectively. The critical question with a raised TSH is whether it is autoimmune, which would suggest a pattern associated with Hashimoto's thyroiditis, or non-autoimmune subclinical hypothyroidism. Mark's thyroid peroxidase antibodies are below 6.6, well within the normal range of below 13.8, and his thyroglobulin antibodies are below 1.3, well within the normal range of below 4.4. Both are negative. This means the raised TSH is not autoimmune and is more likely a non-autoimmune subclinical pattern. At 51, with fatigue and weight gain as two of his main symptoms, it is worth noting that underactive thyroid function, even at this subclinical level, can contribute to both of those symptoms as well as to elevated cholesterol, because the thyroid helps clear LDL from the bloodstream and when it slows down, LDL clearance slows too. This could be contributing to the lipid picture above. His GP should be made aware of the TSH of 5.04 with negative antibodies so they can decide whether to monitor or investigate further.\n\nMark's insulin and blood sugar picture tells an important story. His fasting glucose is 4.1 mmol/L, which is excellent, sitting well within the ideal range of 4.0 to 5.4. His HbA1c, which measures average blood sugar over the previous two to three months, is 40 mmol/mol, just below the pre-diabetes threshold of 42 and within the normal range of below 42. However, his fasting insulin is 21.3 mIU/L. While this is within the laboratory range of 2.6 to 24.9, it is far above the optimal range of 2 to 8. His HOMA-IR, which is a calculated index of insulin resistance using fasting glucose and fasting insulin, is 3.88, well above the upper limit of 1.5 and above the threshold of 2.9 that indicates significant insulin resistance. What this pattern means is that Mark's blood sugar looks normal on the surface, but only because his pancreas is working very hard, producing a large amount of insulin to force the glucose down. The pancreas is compensating. This is early metabolic dysfunction, and it is the stage where dietary change has the biggest impact, before the pancreas can no longer keep up and blood sugar starts to rise. His C-Peptide, which is a more stable measure of how much insulin the pancreas is actually producing, is 2.53 ug/L (approximately 837 pmol/L), confirming brisk insulin production. His estimated average glucose is 6.6 mmol/L, above the optimal of below 6.2 but within the range of below 7. At a BMI of 32.4 with an ultra-processed diet, no exercise, and significant insulin resistance, this is the most important modifiable finding in the report alongside the lipid profile. The two are connected: insulin resistance drives the liver to produce more triglyceride-rich particles, which is exactly what his triglycerides and VLDL show.\n\nThere is genuine good news to pull out of these results. Mark's kidney function is solid, with a creatinine of 74 giving a standard eGFR above 90, and his Cystatin C, which is a more reliable measure of kidney filtration and is not affected by muscle mass, is 1.09, giving a Cystatin C eGFR of 88. At 51 with a BMI of 32.4, that is a healthy kidney. His urea is 5.8, mid-range, and his uric acid at 349 is within the optimal band of 200 to 380 for a man. His liver is handling the metabolic load well. His ALT, the main marker of liver cell inflammation, is 32, within the laboratory range of below 56 but above the tighter optimal of below 30 for a man. His GGT, gamma-glutamyl transferase, which rises with alcohol use, fatty liver and metabolic strain, is 27, within range of 4 to 73 but above the ideal of below 25. His AST is 27, his ALP is 63, his bilirubin is 10, and his albumin is 44, all healthy. His FIB-4 score, a calculation that estimates liver scarring using age, platelets, AST and ALT, is 1.41, just under the 1.45 threshold. At 51, age pushes this number up, and his slightly lower platelet count of 173 also inflates the score. With all the actual liver enzymes looking reasonable, this score is being driven by the calculation rather than by any sign of liver disease, but it is worth the GP noting for context. His APRI score, another fibrosis estimate, is 0.39, well within the ideal of below 0.5. His NAFLD Fibrosis Score is -1.057, within the range that excludes advanced fibrosis. His De Ritis ratio (AST:ALT) is 0.84, sitting in the optimal band. The liver is coping, but the slightly above-optimal ALT and GGT are early whispers of the metabolic strain from the diet and weight, not damage yet, but the liver is not coasting either.\n\nMark's inflammation markers are reassuring. His hsCRP, which is a sensitive marker of systemic inflammation, is 1.0 mg/L. At a BMI of 32.4 with body-wide aching and two recent A&E visits querying a viral infection, a CRP of 1.0 is a good finding. It sits at the upper edge of the ideal range of below 1.0, so it is not perfectly clean, but it effectively rules out any active significant inflammatory process right now. His ESR, which is another measure of inflammation that responds to chronic conditions, is 4 mm/hour, well below the limit of 12, which is excellent. His rheumatoid factor is 4, well within range of below 14, which makes inflammatory arthritis unlikely as a cause of his joint pain and body aching. His Platelet to Lymphocyte Ratio is 98.9, within the ideal range, and his Systemic Immune-Inflammation Index is 342, within the ideal range. The joint pain and body aching, given the clear inflammatory markers and the negative rheumatoid factor, may be related to the viral illness the A&E department queried, which can cause prolonged musculoskeletal aching for weeks to months after the acute phase, or it may be related to his weight, his sleep restriction, or both. Carrying 111 kg at 185 cm puts significant mechanical load on joints, particularly knees, hips and lower back.\n\nHis full blood count is largely healthy. His haemoglobin is 167 g/L, at the top of the male range of 130 to 170 but within it. His white cell count is 5.8, mid-range, with all differentials within normal limits. His neutrophils are 3.46, his lymphocytes 1.75, and his NLR (Neutrophil to Lymphocyte Ratio, a marker of systemic inflammation) calculates to 1.98, within the optimal range of 1.0 to 2.0. His platelets at 173 are within range of 150 to 410, though towards the lower end. His reticulocytes, the young red blood cells that show how actively the bone marrow is producing new cells, are 0.91% with an absolute count of 51.1, both within range. His red blood cell count is 5.62, slightly above the upper limit of 5.5. His MCHC, the average concentration of haemoglobin in each red cell, is 352, above the upper limit of 345. These two together, a slightly high red cell count and a slightly high MCHC, are marginal findings. They can be seen with mild dehydration, which concentrates the blood, and given that Mark sleeps fewer than six hours a night and follows an ultra-processed diet, mild chronic underhydration is plausible. His MCV at 84.3 is just inside the lower limit of 83, and his RDW at 14.9 is just inside the upper limit of 15, both borderline but within range. Neither is a concern at these margins.\n\nMark's iron studies are balanced. His ferritin, the body's iron store, is 63 ng/mL, within the optimal range of 50 to 200 for a man. His serum iron is 18, his transferrin is 3.02, his iron binding capacity is 67.8, and his transferrin saturation is 23.73%, just below the optimal lower bound of 25% but within the laboratory range of 18 to 55%. Iron status is not contributing to his fatigue.\n\nHis immune system markers are unremarkable. IgG at 13.1, IgM at 0.8, IgA at 1.8, and IgE at 87.9 are all within their respective ranges. The IgE being within range at 87.9 against a limit of 100 is worth noting because elevated IgE can indicate allergic or atopic conditions. His tissue transglutaminase antibody is negative, which rules out coeliac disease as a cause of his fatigue or joint symptoms.\n\nHis hormones are an area to watch. His testosterone is 12.6 nmol/L, within the laboratory range of 8.4 to 28.7 but below the optimal range of 18 to 30 for a man. At 51 with a BMI of 32.4 and no exercise, this is not unexpected. Excess body fat, particularly abdominal fat, contains an enzyme called aromatase that converts testosterone to oestradiol, and a lack of resistance training removes the strongest stimulus for testosterone production. His SHBG, sex hormone binding globulin, which is the protein that binds testosterone and makes it unavailable for use, is 33 nmol/L, within optimal range. His free androgen index is 38.18 and his free testosterone is 0.250 nmol/L, both within range but at the lower end. His bioavailable testosterone, which measures the fraction actually available to tissues, is 5.99 nmol/L, within the range of 2 to 9 and the optimal band of 4 to 9. His oestradiol is 68 pmol/L, within range of below 146.1. His DHEA-S is 1.7 umol/L (approximately 627 ug/dL), within range. His cortisol is 581 nmol/L, within the morning reference range of 145.4 to 619.4 but towards the upper end, which may reflect the stress of chronic poor sleep and the body aching he describes. His prolactin is 160 uIU/mL, LH is 3.44, and FSH is 5.85, all within range. His progesterone is 0.58 nmol/L, below the range of 0.89 to 3.88. In men, progesterone is produced in small amounts by the adrenal glands and testes, and a level below range in a man is a common finding with limited clinical significance, particularly at 51.\n\nHis vitamin D is 53 nmol/L, which the laboratory classifies as \"sufficient\" at above 50, but this is below the optimal range of 75 to 120. At a BMI of 32.4, vitamin D is sequestered in fat tissue, meaning Mark needs a higher dose to reach optimal levels. His vitamin B12 is 463 pg/mL, within range of 193 to 982 but below the optimal of 500. His folate is 11 ng/mL, within and above the optimal threshold of 8. His magnesium is 0.97 mmol/L, within the optimal range of 0.85 to 1.05, which is a genuine positive. His calcium is 2.36 and corrected calcium is 2.31, both within range, and his parathyroid hormone is 2.8 pmol/L, within range.\n\nHis prostate markers are excellent. PSA is 0.47, well below the 3.5 threshold, and his free PSA ratio is 0.362, well above the 0.19 normal cutoff. His tumour markers CA19-9 at 15.03 and CEA at 1.03 are both within range. His creatine kinase is 136, mid-range. His amylase is 58 and lipase is 48, both within range, confirming healthy pancreatic function.\n\nHis Total Antioxidant Activity is 1.79, marginally above the upper limit of 1.77. This is not a clinical concern and can be affected by recent food intake or mild haemolysis.\n\nMark's urinalysis is clean. Protein, glucose, ketones, urobilinogen, casts and nitrites are all negative. White cells and red cells are both below 1, which is normal. His urine culture is pending.Their PhenoAge, a biological age estimated from nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count), is 47.1, about 4 years younger than a calendar age of 51. His bicarbonate is 19.9 mmol/L, marginally below the lower limit of 20. At this margin, this is unlikely to be clinically significant, but it may reflect mild metabolic acid production, which can be associated with insulin resistance, or simply a variation in the sample.","links":"The central thread running through Mark's results is metabolic. His BMI of 32.4, ultra-processed diet, complete absence of structured exercise, and chronic sleep restriction of fewer than six hours a night form a cluster of inputs that explain almost every abnormal marker in this report. The insulin resistance, with a HOMA-IR of 3.88, is the metabolic engine driving much of the picture. Excess body fat, particularly visceral fat, makes cells less responsive to insulin, so the pancreas pumps out more to compensate, hence the fasting insulin of 21.3. That hyperinsulinaemia instructs the liver to ramp up production of triglyceride-rich VLDL particles, which is exactly what the triglycerides of 2.37 and VLDL of 1.08 show. Elevated triglycerides in turn drive down HDL cholesterol, because in a high-triglyceride environment the body swaps triglycerides into HDL particles and strips them out faster, which explains his HDL of 1.3 sitting below the ideal of 1.4. Meanwhile, the dietary saturated fat and refined carbohydrate load pushes LDL production up to 3.82 and ApoB to 1.46. Every lipid abnormality in this report traces back to the same metabolic root: too much energy, too much processed food, too little movement, and the insulin resistance that results.\n\nThe thyroid adds a second layer. His TSH of 5.04 with negative antibodies may be an early subclinical hypothyroid pattern, and one of the recognised effects of mild thyroid underfunction is impaired clearance of LDL cholesterol from the bloodstream. It is possible that his lipid numbers are partly magnified by the thyroid. Subclinical hypothyroidism also slows metabolic rate, which at a BMI of 32.4 with fatigue and difficulty losing weight is clinically relevant. His GP should assess whether this TSH warrants treatment or monitoring, and if treated, his lipids may improve modestly as a secondary benefit.\n\nThe symptoms Mark describes, fatigue, joint pain, body aching, and weight gain, are not explained by a single dramatic finding but by the cumulative effect of several moderate ones. Fewer than six hours of sleep is itself a powerful driver of fatigue, insulin resistance, elevated cortisol, increased appetite for processed food, and reduced pain tolerance. His cortisol at 581, near the top of the morning range, is consistent with a body under chronic low-grade stress from sleep deprivation. The joint pain and body aching have no inflammatory or autoimmune signature in these bloods: CRP is 1.0, ESR is 4, rheumatoid factor is 4, all clean. The most likely contributors are his weight, putting mechanical load on joints, the aftermath of whatever viral illness prompted his A&E visits, and the sleep restriction lowering his pain threshold. The below-optimal testosterone of 12.6 may also contribute to fatigue, reduced motivation and difficulty building or maintaining muscle mass, but at 51 with obesity and no training, the testosterone is more likely a consequence of the metabolic state than an independent cause.\n\nWhat was excluded matters. His Lp(a) being below 25 means there is no inherited lipid risk amplifying the picture, and that is genuinely reassuring because it confirms everything is modifiable. His liver, despite bearing the metabolic load, shows no sign of fibrosis or significant damage. His kidneys are healthy. His prostate markers are excellent. His coeliac screen is negative. His inflammatory markers rule out an active inflammatory or autoimmune process. The blood sugar is still being held in range by the compensating pancreas, which means there is a window to intervene before it progresses.\n\nThe loose end is the chest pain that took Mark to A&E twice. These bloods do not contain troponin or BNP, which are the acute cardiac markers an A&E would test, and since those were normal at the time, the chest pain is unlikely to be cardiac in origin. The A&E's working diagnosis of a viral infection is plausible, particularly given the widespread body aching. However, his cardiovascular risk profile, with an ApoB of 1.46 and a Cardiovascular Risk Score of 75, means his GP should be aware of the recurrent chest pain in the context of this lipid picture, even though the two may be unrelated. If no cardiac investigation beyond an ECG has been done, and given the lipid results, further assessment may be appropriate.","lifestyle":"Swap one ultra-processed meal a day for a home-cooked alternative built around protein and vegetables. A chicken stir-fry with frozen vegetables takes fifteen minutes and replaces a takeaway. Start with the meal you are most likely to grab fast food for. Anchor: the first meal you would normally order in. Why: every swap reduces the refined carbohydrate and saturated fat driving your ApoB of 1.46 and triglycerides of 2.37.\nAdd a palm-sized portion of protein to every meal, eggs, chicken, fish, Greek yoghurt, beans, before anything else goes on the plate. Anchor: protein goes on the plate first, every time. Why: protein blunts the insulin spike behind your HOMA-IR of 3.88 and keeps you full longer, reducing the urge to snack on processed food.\nWalk for fifteen minutes immediately after your largest meal. Anchor: plate in the sink, shoes on. Why: a post-meal walk lowers the glucose and insulin response to that meal, which directly targets the insulin resistance this report has found.\nBuild to three 30-minute brisk walks per week on top of your daily steps, aiming for a pace where you can talk but not sing. Anchor: pick three fixed days and a fixed time, and treat them like appointments. Why: aerobic exercise raises HDL cholesterol, lowers triglycerides, and improves insulin sensitivity, all of which are flagged in this report.\nAdd two resistance training sessions per week, even bodyweight exercises at home: squats, press-ups, rows with a bag. Anchor: pair them with your walk days or alternate. Why: resistance training is the strongest stimulus for testosterone production, and at a testosterone of 12.6 with no current training, this is the most effective lever you have. It also builds muscle, which burns more glucose at rest and improves insulin sensitivity.\nSet a fixed wake time seven days a week and protect at least seven hours in bed. Anchor: set a phone alarm for both bedtime and wake time. Why: fewer than six hours of sleep increases insulin resistance by up to 40% in some studies, raises cortisol, increases appetite for processed food, and lowers pain tolerance, which may be contributing to your joint pain and body aching.\nCut caffeine after 1pm to protect the sleep you do get. Anchor: after lunch, switch to water or herbal tea. Why: caffeine has a half-life of five to six hours, and late caffeine is one of the most common causes of poor sleep quality that people do not recognise.\nAim for a calorie intake of approximately 2,050 to 2,250 kcal per day, with at least 145g of protein daily. Your estimated maintenance is around 2,700 kcal based on your weight, height and activity level, so a deficit of 450 to 650 kcal per day targets a steady weight loss of 0.5 to 0.7 kg per week. A realistic first target is 100 kg, which would bring your BMI under 30, and a longer-term target of 90 to 95 kg.","flags":"ApoB 1.46 g/L (limit <0.9, classified \"very high\" by laboratory), LDL 3.82 mmol/L (ideal <2.6), triglycerides 2.37 mmol/L (ideal <1.0), HDL 1.3 mmol/L (ideal >1.4 male), TC/HDL ratio 4.69 (limit <4.5), non-HDL 4.8 (limit <4.0), VLDL 1.08 (limit <0.78), ApoB/A1 ratio 0.98 (higher risk >0.9), atherogenic index 0.261 (limit 0.21), Cardiovascular Risk Score 75/100 (ideal <20). All lipid markers are abnormal in the same direction. Lp(a) is below 25, confirming the entire lipid picture is lifestyle-driven. This is the primary GP conversation.\nTSH 5.04 mIU/L (upper limit 4.78) with negative TPO antibodies (<6.6, limit <13.8) and negative thyroglobulin antibodies (<1.3, limit <4.4). Non-autoimmune subclinical hypothyroidism pattern. FT4 14.5 sits at the lower end of the lab range. GP should decide whether to monitor or investigate further. Subclinical thyroid underfunction may be contributing to the lipid picture and to fatigue.\nHOMA-IR 3.88 (limit 1.5, significant insulin resistance above 2.9). Fasting insulin 21.3 mIU/L (lab range 2.6 to 24.9, optimal 2 to 8). Fasting glucose 4.1 and HbA1c 40 are normal, meaning the pancreas is compensating. This is pre-clinical metabolic dysfunction and the strongest indication for dietary and exercise intervention.\nTestosterone 12.6 nmol/L (lab range 8.4 to 28.7, optimal 18 to 30). Below optimal at 51 with BMI 32.4 and no exercise. Likely driven by adiposity and inactivity rather than primary hypogonadism. LH and FSH are normal, consistent with the axis not being suppressed centrally.\nVitamin D 53 nmol/L (sufficient by lab definition, optimal 75 to 120). Requires supplementation, particularly at BMI 32.4 where fat tissue sequesters vitamin D.\nRed blood cell count 5.62 (upper limit 5.5) and MCHC 352 g/L (upper limit 345). Marginal findings, most likely mild dehydration or laboratory variation. Not clinically significant at these margins.\nBicarbonate 19.9 mmol/L (lower limit 20). Marginally below range. May reflect mild metabolic acidosis associated with insulin resistance. Not significant in isolation.\nProgesterone 0.58 nmol/L (range 0.89 to 3.88). Below range but of limited clinical significance in a 51-year-old man.\nTotal Antioxidant Activity 1.79 mmol/L (upper limit 1.77). Marginally above range. Not clinically significant.\nReassuring negatives: kidney function healthy (Cystatin C eGFR 88, creatinine eGFR >90), liver showing no fibrosis (FIB-4 1.41, APRI 0.39, NAFLD score -1.057), CRP 1.0 and ESR 4 ruling out active inflammation, rheumatoid factor 4 ruling out inflammatory arthritis, coeliac screen negative, PSA 0.47 with excellent free ratio, Lp(a) below 25 ruling out inherited lipid risk, all tumour markers within range, immune markers within range, iron stores adequate, B12 and folate within range.","recommendations":"Discuss the lipid profile with your GP, bringing the ApoB of 1.46 and LDL of 3.82 as the key numbers. Given the Cardiovascular Risk Score of 75, the recurrent chest pain, and the absence of inherited risk from Lp(a), the GP may wish to consider further cardiovascular assessment and discuss whether lipid-lowering medication is appropriate alongside the dietary changes outlined in this report.\nDiscuss the TSH of 5.04 with negative antibodies. The GP should decide whether to repeat in 8 to 12 weeks to confirm, or to investigate further. If subclinical hypothyroidism is confirmed and treated, the lipid profile may partially improve as a secondary benefit.\nDiscuss the HOMA-IR of 3.88 and fasting insulin of 21.3 in the context of weight loss. The GP may wish to assess whether any additional metabolic support is appropriate alongside diet and exercise.\nMention the recurrent chest pain in the context of these cardiovascular results. If no investigation beyond an ECG has been performed, the GP may consider whether further cardiac assessment is warranted given the lipid picture.\nRetest in four to six months with the following markers to track progress: ApoB, LDL, HDL, triglycerides, HbA1c, fasting insulin, HOMA-IR, TSH, FT4, and vitamin D. The targets that will show the plan is working are ApoB falling below 1.0, triglycerides falling below 1.7, HDL rising above 1.4, HOMA-IR falling below 2.0, and vitamin D reaching 75 or above. Calorie target: 2,050 to 2,250 kcal per day. Protein target: at least 145g per day (approximately 1.3g per kg of current body weight). Weight target: 100 kg as a first milestone, 90 to 95 kg as a longer-term goal.","supplementation":"Vitamin D3 (cholecalciferol), 4,000 IU daily, taken with your largest meal containing fat. Why: your level is 53 nmol/L, below the optimal of 75 to 120, and at a BMI of 32.4 you need a higher dose because fat tissue absorbs and holds vitamin D. Retest in four to six months to check you are reaching 75 or above.\nVitamin K2 (MK-7), 100 to 200 mcg daily, taken with the vitamin D. Why: K2 directs the calcium that vitamin D helps absorb into bone rather than into artery walls, which is particularly important given your cardiovascular risk profile.\nOmega-3 fish oil, 2 to 3g of combined EPA and DHA daily, taken with food. Why: omega-3 lowers triglycerides, which are elevated at 2.37, and may help raise HDL. It also has anti-inflammatory properties that may help with the body aching.\nMagnesium glycinate, 300 to 400mg, taken before bed. Why: your magnesium at 0.97 is within the optimal range, but supplementing at bedtime supports sleep quality, which is your most restricted resource at fewer than six hours a night. Glycinate is the form least likely to cause gut issues and the most helpful for sleep.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue. Why: your B12 at 463 is within range but below the optimal of 500. Sublingual delivery bypasses digestion and is more reliably absorbed.\nThe most important changes from this report are not supplements. They are replacing ultra-processed food with home-cooked meals built around protein and vegetables, adding walking and resistance training, sleeping at least seven hours, and losing weight towards 100 kg. Those changes will move the insulin resistance, the lipid profile and the testosterone far more than any supplement.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4455","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 49 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 56.5; held to 49 by two or more systems rated \"See your GP\". Weakest systems: lipids & cardiovascular 16%, glucose & insulin 39%, electrolytes & minerals 55%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Remnant Cholesterol, Thyroid Stimulating Hormone.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"47.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4205","lower_normal":"","upper_normal":"56","lower_optimal":"","upper_optimal":"51","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4554","units":"years","description":"PhenoAge is calculated from your measured results. It is within the ideal range, as are the results it is calculated from.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built in the artery walls, regardless of age. Mark's score of 75 out of 100 is high, driven primarily by his ApoB of 1.46, LDL of 3.82, elevated triglycerides of 2.37 and below-optimal HDL of 1.3. A score of 20 or below is ideal. Because his Lp(a) is normal, the entire score is driven by modifiable factors: diet, weight and exercise. This score does not predict ten-year event risk, which at 51 would be lower than the score suggests, but it shows how much risk is accumulating and how large the window for intervention is.","low_causes":"Healthy lipid profile, low inflammation, good blood sugar control","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Fasting Glucose","group":"GLUCOSE & INSULIN","result":"4.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5933","units":"mmol/L","description":"Fasting glucose is the amount of sugar in the blood after an overnight fast. Mark's result of 4.1 mmol/L is excellent, sitting within the ideal range of 4.0 to 5.4 and well below the pre-diabetes threshold. However, this number should be read alongside his insulin, which reveals that the pancreas is working hard to keep glucose at this level.","low_causes":"Fasting, excessive exercise, reactive hypoglycaemia, insulin-producing tumours","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, stress response, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.8","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4833","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6333","units":"%","description":"HbA1c as a percentage, equivalent to the mmol/mol value below. Mark's 5.8% is within the normal range of below 6.0% t. Mark's result of 21.3 mIU/L is within the laboratory range of 2.6 to 24.9 but is far above the optimal range of 2 to 8. This means his pancreas is producing a large amount of insulin to force his blood sugar down to the normal reading of 4.1. The body's cells have become resistant to insulin's signal, so the pancreas compensates by producing more. This is the hallmark of insulin resistance and the earliest stage of metabolic dysfunction, well before blood sugar rises into the diabetic range.","low_causes":"Low carbohydrate diet, high insulin sensitivity, type 1 diabetes, prolonged fasting","high_causes":"Insulin resistance, excess body fat, high refined carbohydrate intake, lack of exercise, sleep deprivation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"2.53","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4781","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"2.1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.4354","units":"ug/L","description":"C-Peptide is released by the pancreas in equal amounts to insulin, but it is not cleared by the liver, making it a more stable measure of how much insulin the pancreas is actually producing. Mark's result of 2.53 ug/L (approximately 837 pmol/L) is within the laboratory range of 1.1 to 4.4 but above the optimal band, confirming that the pancreas is working hard to maintain normal blood sugar in the face of insulin resistance.","low_causes":"Type 1 diabetes, low insulin demand, prolonged fasting","high_causes":"Insulin resistance, obesity, type 2 diabetes, insulinoma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"3.88","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8927","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculated index of insulin resistance derived from fasting glucose and fasting insulin. A score below 1.0 indicates good insulin sensitivity. Above 1.9 suggests early insulin resistance. Above 2.9 indicates significant insulin resistance. Mark's HOMA-IR of 3.88 is well above the 2.9 threshold, confirming significant insulin resistance. His fasting glucose looks normal only because the pancreas is compensating with high insulin output. This is the most actionable metabolic finding in the report: dietary change, weight loss and exercise can reduce this score substantially.","low_causes":"High insulin sensitivity, low carbohydrate diet, athletic conditioning","high_causes":"Excess body fat, ultra-processed diet, lack of exercise, sleep deprivation, genetic predisposition","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"6.6","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4714","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated Average Glucose converts the HbA1c into an approximate average blood sugar over the past two to three months. Mark's estimated average of 6.6 mmol/L is within the range of below 7 but above the optimal of below 6.2, reflecting the fact that his HbA1c of 40 mmol/mol sits above the ideal band. This confirms average blood sugar is drifting higher than optimal, driven by the insulin resistance identified elsewhere.","low_causes":"Low carbohydrate diet, high insulin sensitivity","high_causes":"Prediabetes, ription":"Alkaline phosphatase is an enzyme found in the liver and bone. Mark's ALP of 63 IU/L is comfortably within the normal and optimal ranges, confirming no biliary or bone-related abnormality.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, bone disease, liver disease, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4896","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Mark's bilirubin of 10 umol/L is within the normal and optimal ranges, confirming healthy liver clearance.","low_causes":"Normal variation","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5533","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3573","upper_optimal_position":"0.6253","units":"g/L","description":"Total protein measures the combined level of albumin and globulin in the blood. Mark's result of 77 g/L is within both the laboratory range and the optimal band, indicating adequate protein production by the liver and a healthy immune component.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Chronic infection, inflammation, dehydration, myeloma","padding":"1","one_si auses":"Diet high in saturated fat, obesity, hypothyroidism, genetic factors, lack of exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6971","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are fats carried in the blood, primarily produced by the liver from dietary sugar and refined carbohydrate. Mark's triglycerides of 2.37 mmol/L are above the fasting limit of 1.7 and well above the ideal of below 1.0. Elevated triglycerides are one of the most diet-responsive markers in this report, driven directly by refined carbohydrate, sugar and ultra-processed food. They are also a consequence of insulin resistance, as high insulin instructs the liver to produce more triglyceride-rich particles.","low_causes":"Low carbohydrate diet, malnutrition, hyperthyroidism","high_causes":"Ultra-processed diet, excess sugar, insulin resistance, obesity, alcohol, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.08","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6923","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3846","units":"mmol/L","description":"VLDL, or very low-density lipoprotein, is the particle the liver produces to carry triglycerides into the bloodstream. Mark's VLDL of 1.08 mmol/L is above the upper limit of 0.78, directly reflecting his elevated triglyceride production. This is driven by the same dietary and metabolic factors as oB of 1.46, this is the primary cardiovascular risk finding. With Lp(a) below 25, the entire LDL elevation is driven by modifiable lifestyle factors: diet, weight and exercise.","low_causes":"Healthy diet, exercise, hyperthyroidism, malnutrition","high_causes":"Saturated fat intake, obesity, lack of exercise, hypothyroidism, genetic factors","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"4.69","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5211","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The TC/HDL ratio compares total cholesterol to the protective HDL fraction. A ratio below 4.5 is desirable. Mark's ratio of 4.69 is above the threshold, driven by both elevated total cholesterol and below-optimal HDL. This ratio will improve as HDL rises with exercise and triglycerides fall with dietary change.","low_causes":"High HDL, low total cholesterol, healthy lifestyle","high_causes":"Low HDL, high total cholesterol, obesity, lack of exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"21.31","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5328","lower_normal":"20","upper_normal":"100","lower_optimal":"28","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5100","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of the protective HDL fraction. Mark's 21.31% is above the 20% threshold but below the ideal of 28% or above, reflecting the same imbalance between his elevated LDL and his below-optimal HDL.","low_causes":"Low HDL, high LDL, obesity, lack of exercise","high_causes":"High HDL, healthy lifestyle, exercise","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6000","lower_normal":"0","upper_normal":"4.0","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/L","description":"Non-HDL cholesterol captures all the cholesterol fractions that can deposit in artery walls: LDL, VLDL and others. Mark's non-HDL of 4.8 mmol/L is above the 4.0 limit, reflecting the combined elevation of LDL and VLDL seen elsewhere in this report.","low_causes":"Healthy diet, exercise, medication","high_causes":"High saturated fat diet, obesity, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7450","lower_normal":"1.2","upper_normal":"100","lower_optimal":"1.4","upper_optimal":"100","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5070","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main protein on HDL particles. Mark's ApoA1 of 1.49 g/L is above the 1.20 threshold and within the optimal band, which is a positive finding even within the otherwise concerning lipid profile.","low_causes":"Lack of exercise, genetic factors, smoking, insulin resistance","high_causes":"Exercise, moderate alcohol, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8111","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B is the protein found on every LDL and VLDL particle, so ApoB effectively counts the number of atherogenic particles in the blood, making it the single best marker of cardiovascular risk. Mark's ApoB of 1.46 g/L is classified as \"very high\" by the laboratory, well above the 0.9 desirable limit and the 0.8 ideal target. Each ApoB-carrying particle can enter the artery wall and contribute to plaque build-up. This is the number Mark should bring to his GP.","low_causes":"Healthy diet, exercise, statin therapy, hyperthyroidism","high_causes":"High saturated fat diet, obesity, insulin resistance, hypothyroidism, genetic factors","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7000","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3571","units":"","description":"The ApoB to ApoA1 ratio summarises the balance between atherogenic (artery-damaging) and protective particles. A ratio above 0.9 places Mark in the higher risk category. His ratio of 0.98 is driven by the very high ApoB of 1.46 despite a reasonable ApoA1 of 1.49. This ratio will fall as the ApoB comes down with dietary change and, potentially, medication.","low_causes":"Healthy lipid balance, exercise, medication","high_causes":"High ApoB, low ApoA1, obesity, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"<25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein that increases cardiovascular risk by depositing cholesterol in artery walls, encouraging blood clotting and driving inflammation. Unlike other lipid markers, Lp(a) cannot be changed by diet, exercise or most medications. Mark's Lp(a) is below 25 nmol/L, well within the normal range of below 32. This is genuinely useful information because it means the entire lipid picture in this report is driven by modifiable lifestyle factors, not by an inherited risk that cannot be changed.","low_causes":"Genetic (favourable)","high_causes":"Genetic (inherited), cannot be changed by lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tghdl","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.82","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6067","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3000","units":"","description":"The triglyceride to HDL ratio is a marker of insulin resistance and small dense LDL particles. A ratio above 1.5 suggests insulin resistance and a more atherogenic lipid pattern. Mark's ratio of 1.82 is above the limit, driven by elevated triglycerides of 2.37 and below-optimal HDL of 1.3. This aligns with his HOMA-IR of 3.88 confirming insulin resistance.","low_causes":"Healthy diet, exercise, insulin sensitivity","high_causes":"Insulin resistance, high carbohydrate diet, obesity, low exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.98","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6125","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/L","description":"Remnant cholesterol is what is left after subtracting HDL and LDL from total cholesterol (TC minus HDL minus LDL). It captures the triglyceride-rich remnant particles that are increasingly recognised as independently atherogenic. Mark's remnant cholesterol of 0.98 mmol/L is above the 0.8 limit and well above the optimal of below 0.5, reflecting his elevated triglycerides and VLDL.","low_causes":"Healthy triglyceride levels, good diet","high_causes":"Elevated triglycerides, insulin resistance, high carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.74","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6233","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"This adjusts LDL cholesterol by removing the small contribution from Lp(a) particles, showing how much of the LDL is truly modifiable. Mark's Lp(a)-corrected LDL of 3.74 mmol/L is almost identical to his total LDL of 3.82, confirming that essentially all of his LDL is lifestyle-driven and can be reduced through diet, exercise and, if needed, medication.","low_causes":"Healthy diet, exercise, statin therapy","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.261","within_normal":"FALSE","within_optimal":"FALSE","r rker of systemic inflammation produced by the liver. Mark's hsCRP of 1.0 mg/L is within the laboratory range of below 5 but sits at the upper edge of the optimal range of below 1.0. At a BMI of 32.4 with body-wide aching and recent A&E visits querying a viral infection, a CRP of 1.0 is reassuring. It rules out any significant active inflammatory process and suggests that whatever caused the body aching is not producing ongoing systemic inflammation.","low_causes":"Low body fat, healthy diet, regular exercise","high_causes":"Infection, obesity, chronic disease, autoimmune conditions, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"esr","name":"ESR","group":"INFLAMMATION","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1667","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR, or erythrocyte sedimentation rate, measures how quickly red blood cells settle in a tube over one hour. A faster rate indicates inflammation. Mark's ESR of 4 mm/hour is well below the limit of 12, confirming no chronic inflammatory process. This is an excellent result, particularly in the context of his body aching symptoms.","low_causes":"Normal health, polycythaemia","high_causes":"Infection, inflammation, autoimmune disease, anaemia, malignancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"plr","name":"Platelet:Lymphocyte Ratio","group":"INFLAMMATION","result":"98.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4198","lower_normal":"60","upper_normal":"210","lower_optimal":"80","upper_optimal":"160","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.5556","units":"ratio","description":"The Platelet to Lymphocyte Ratio is a marker of systemic inflammation. Mark's PLR of 98.9 is within both the laboratory and optimal ranges, consistent with no significant inflammatory process.","low_causes":"Normal variation","high_causes":"Chronic inflammation, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sii","name":"Systemic Immune-Inflammation Index","group":"INFLAMMATION","result":"342","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4947","lower_normal":"100","upper_normal":"600","lower_optimal":"150","upper_optimal":"450","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"index","description":"The Systemic Immune-Inflammation Index combines platelet, neutrophil and lymphocyte counts into a single measure of immune activation and inflammation. Mark's SII of 342 is within both the laboratory and optimal ranges, confirming a calm immune and inflammatory baseline.","low_causes":"Normal health, immunosuppression","high_causes":"Chronic inflammation, infection, malignancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"na","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"143","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"145","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6410","units":"mmol/L","description":"Sodium is an electrolyte critical for fluid balance, nerve function and muscle contraction. Mark's sodium of 143 mmol/L is within both the laboratory and optimal ranges.","low_causes":"Excess water intake, diuretics, adrenal insufficiency, SIADH","high_causes":"Dehydration, excess salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pot","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.3","within_nor ancy, excess vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mg","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.97","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5287","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4885","upper_optimal_position":"0.5862","units":"mmol/L","description":"Magnesium is involved in over 300 enzyme reactions in the body, including energy production, muscle function and nerve signalling. Mark's magnesium of 0.97 mmol/L is within the optimal range of 0.85 to 1.05, which is a genuine positive.","low_causes":"Poor diet, alcohol, diabetes, diuretics, malabsorption","high_causes":"Kidney disease, excess supplementation, adrenal insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ua","name":"Uric Acid","group":"ELECTROLYTES & MINERALS","result":"349","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4587","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3272","upper_optimal_position":"0.5223","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, found in foods such as red meat, organ meats and some seafood. Mark's uric acid of 349 umol/L is within the optimal range of 200 to 380 for a man. Given his BMI and diet, this being within the optimal band is a positive finding, as elevated uric acid is common with obesity and insulin resistance.","low_causes":"Low purine diet, medications","high_causes":"High purine diet, obesity, insulin resistance, kidney disease, alcohol, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"aniongap","name":"Anion Gap","group":"ELECTROLYTES & MINERALS","result":"26.4","within_normal":"FALSE"," _type":"normal"},{"key":"crea","name":"Creatinine","group":"KIDNEY FUNCTION","result":"74","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4103","lower_normal":"65","upper_normal":"104","lower_optimal":"65","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5641","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. Mark's creatinine of 74 umol/L is within both the laboratory and optimal ranges. At a BMI of 32.4 with no resistance training, a lower creatinine is expected because creatinine production tracks muscle mass.","low_causes":"Low muscle mass, liver disease","high_causes":"Kidney disease, high muscle mass, dehydration, high protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"gfr","name":"eGFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.9500","lower_normal":"60","upper_normal":"200","lower_optimal":"90","upper_optimal":"200","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7250","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"The estimated glomerular filtration rate based on creatinine estimates how well the kidneys filter blood. Mark's eGFR is above 90, indicating healthy kidney function.","low_causes":"Kidney disease, dehydration, medications","high_causes":"High muscle mass, pregnancy, early diabetes","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cyc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"1.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4955","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.95","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4318","units":"mg/L","descri function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}
