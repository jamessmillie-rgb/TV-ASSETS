<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Jessica J Beadle","dob":"09/03/1993","report_date":"2026-10-23","summary":"Customer is a 33-year-old female presenting with a BMI of 22.5, following a standard mixed diet, eating 2 to 3 portions of vegetables and fruit a day with takeaway or ultra-processed food rarely and sugary food some days; portions are slightly below average (volume 4 out of 10). She does no structured cardio or resistance training and takes 5,000 to 7,500 steps a day. She sleeps under 6 hours a night, feels exhausted or wakes in the night, and her energy pattern was not specified. Stress feels hard to manage constantly. She does not drink alcohol, takes no medications and no supplements. She has no diagnosed conditions and no family history was recorded. She has not had a previous blood test. She reports low energy and fatigue, palpitations or dizziness, poor sleep and insomnia, and brain fog, all lasting over a year. Her goals are to improve long-term health and longevity, prevent disease, and improve energy levels.\n\nThe standout finding in this report is how remarkably healthy these bloods are for someone who feels as unwell as she does, and that mismatch is itself important information. Her PhenoAge, a composite biological ageing score built from markers including albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, comes in at 14.6 years against a calendar age of 33, which is an exceptional 18 years younger than her chronological age. Her Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, is 0 out of 100, the lowest possible score and a reflection of a genuinely excellent metabolic and cardiovascular profile.\n\nHer cardiovascular markers are outstanding. Total cholesterol is 3.2, LDL is 1.56, and ApoB, the protein that carries atherogenic lipoprotein particles into the artery wall and the single best predictor of cardiovascular risk, is 0.45 against a target of below 0.9 and an ideal of below 0.8. Her triglycerides at 0.39 are very low, her HDL at 1.4 is just below the ideal of 1.6 for a woman but well clear of any concern, and her ApoB to ApoA1 ratio at 0.36 is excellent. Her Lp(a)-corrected LDL, which strips out the cholesterol carried by Lp(a) particles to show what is modifiable through diet and lifestyle, is just 1.41. Remnant cholesterol is 0.06, well inside the ideal of below 0.5. The TG to HDL ratio is 0.28, a strong marker of insulin sensitivity. Her atherogenic index is negative at minus 0.555, which is as favourable as it gets.\n\nHer blood sugar control is excellent. Fasting glucose is 4.2, HbA1c is 29 mmol/mol (4.8%), and HOMA-IR, a measure of how sensitive the body's cells are to insulin, is 0.52, right at the bottom of the range, meaning her tissues respond to very small amounts of insulin. Her fasting insulin at 2.78 is just inside the lower limit but is genuinely low, reflecting a body that simply does not need much insulin to manage blood sugar. This is a positive finding in someone eating a mixed diet with moderate sugar intake.\n\nHer liver is in excellent health. ALT at 10 and Gamma GT at 10 are both very low, meaning the liver is under no metabolic strain at all. AST at 24 is well within range. Albumin at 46 is strong, reflecting good synthetic function and adequate protein intake. The APRI score at 0.37, which screens for liver fibrosis, is well within the ideal range. Her FIB-4 score at 1.55 is flagged above the 1.45 threshold, but this score is being entirely driven by the arithmetic rather than by any sign of liver disease. FIB-4 is calculated from age, platelets, AST and ALT. Her platelets at 162 are at the low end of the range, which makes the denominator small, and her ALT is just 10, which also inflates the ratio. With every direct liver marker in excellent shape, GGT pristine and no alcohol, this FIB-4 is a mathematical artefact and not a concern.\n\nHer thyroid is working well. TSH, the signal from the pituitary gland that tells the thyroid how hard to work, is 0.81, comfortably within the ideal range of 1.0 to 2.5 and actually just below it, which is fine at this level and consistent with a thyroid that is producing hormones efficiently without being pushed. Free T4 at 15.5 is within range, and Free T3, the active thyroid hormone that cells actually use for energy, is 5.2, sitting nicely within the ideal range of 4.5 to 6.5. The FT3 to FT4 ratio at 0.335 confirms good conversion of the storage hormone to the active form. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease.\n\nHer kidney function is strong. Cystatin C at 0.83 gives an eGFR of 106, exactly where it should be at 33. Creatinine-based eGFR confirms this at above 90. Sodium, chloride, bicarbonate, potassium and serum osmolality are all within range. Uric acid at 204 is within range. Her corrected calcium at 2.29 is within the laboratory range and PTH at 1.792 is healthy, meaning calcium regulation is working normally. Magnesium at 0.91 is within the ideal band of 0.85 to 1.05. Phosphate at 1.0 is within range.\n\nInflammation is essentially absent. High-sensitivity CRP, the most useful general marker of systemic inflammation, is below 0.2, which is the lowest the assay reports. ESR at 3 is very low. The systemic immune-inflammation index at 184 and the platelet to lymphocyte ratio at 99.4 are both comfortably within the ideal range. This rules out any chronic inflammatory process contributing to her fatigue or brain fog.\n\nHer digestive markers are healthy. Amylase at 62 and lipase at 39 are both well within range, showing the pancreas is functioning normally. Coeliac screening with tissue transglutaminase IgA is negative at 0.473 against a cut-off of 7.19, and her total IgA at 1.2 confirms the test is valid, so coeliac disease is excluded. Creatine kinase at 98 is mid-range, confirming no muscle damage.\n\nHer tumour markers are all reassuring. CA125 at 14.4, CA15-3 at 16.69, CA19-9 at 29.6 and CEA at 0.78 are all within their respective reference ranges.\n\nHer vitamin D at 106 is within the ideal range of 75 to 120, which is an excellent level and unusual without supplementation, so if she is getting adequate sun exposure, her body is clearly making good use of it. Vitamin B12 at 603 is within the ideal band of 500 to 900 and healthy. Folate at 7 is within the laboratory range of 3 to 17 but just below the ideal of above 8. At 7, this is worth noting but not a significant deficiency; increasing green leafy vegetables would bring it into the ideal range. Total antioxidant activity at 1.71 is within range.\n\nHer iron studies tell a nuanced story. Ferritin at 71 is within the ideal female range of 40 to 150, reflecting adequate iron stores. Serum iron at 19 is healthy, and transferrin saturation at 38.8% is right in the ideal range of 25 to 40%. However, transferrin itself at 1.95 is below the lower limit of 2.5. Transferrin is the protein that carries iron through the blood, and when it is low, the two main explanations are either that the body has plenty of iron and has downregulated production because less transport is needed, or that it is acting as a negative acute phase protein and has fallen in response to inflammation. In her case, CRP is below 0.2, so inflammation is not the explanation. Her iron stores are adequate and her saturation is ideal, so this is most likely her body producing less transferrin because it does not need more iron transport capacity. This is not a concern in itself but is worth mentioning to her GP so it can be noted as a baseline.\n\nHer hormones paint a clear picture of where she is in her menstrual cycle. Oestradiol at 1065 pmol/L and LH at 61.19 mIU/ml are both consistent with the midcycle peak, the point of ovulation. FSH at 22.87 is also within the midcycle range of 3.4 to 33.4. Progesterone at 3.63 is within the follicular range, which is expected at or just before ovulation since progesterone rises after the egg is released, not before. These values confirm a regular ovulatory cycle, which is consistent with what she reported. Testosterone at 0.7 is within the female range. Her SHBG at 83.8 is within range but towards the higher end, which is binding more of her total testosterone, and this is reflected in her calculated free testosterone at 0.007, which is just below the lower limit of 0.01. Bioavailable testosterone at 0.16 is within range. DHEA-S at 2.2 umol/L is within range. Prolactin at 287 is within the non-pregnant range. Cortisol at 405 is within the morning reference range.\n\nThe marginally low free testosterone at 0.007 against a lower limit of 0.01 may contribute to some of her symptoms, particularly the fatigue and brain fog, but at this margin it is a subtle factor rather than a primary explanation. It is being driven by the higher SHBG, which leaves less testosterone available for the tissues. This is not something that requires treatment but is worth knowing.\n\nTurning to her blood count, there are a few findings that together form a pattern. Her white cell count at 3.94 is just below the lower limit of 4.0, and her neutrophils at 1.85 are below the lower limit of 2.0. Neutrophils are the most abundant type of white blood cell and the body's first line of defence against bacterial infection. A mildly low count like this has several possible explanations. In women of European ancestry, a benign condition called benign ethnic neutropenia can produce counts in this range, but it is more commonly associated with people of African, Middle Eastern or Caribbean descent. In a lean woman who is eating below her needs (volume 4 out of 10), sleeping under 6 hours, and under constant stress, the more likely explanation is that the body is conserving resources. Chronic sleep deprivation is independently associated with suppressed neutrophil counts, and inadequate energy intake can reduce bone marrow output of white cells. Her lymphocytes at 1.63 are within range, so the low total white count is being driven specifically by the neutrophils.\n\nHer reticulocyte percentage at 0.74% is within range, but the absolute reticulocyte count at 34.1 is below the lower limit of 50. Reticulocytes are newly released red blood cells, fresh from the bone marrow, and a low count means the marrow is producing red cells at a slower rate than expected. Her haemoglobin at 135 is healthy and her red cell count at 4.61 is normal, so she is not anaemic, but the marrow is working at the lower end of its capacity. Again, in the context of under-eating and sleep deprivation, this is consistent with the body economising on production because the raw materials or the energy to drive production are limited.\n\nHer platelets at 162 are within range but towards the lower end. MPV at 10.3 is marginally above the upper limit of 10.1. MPV measures the average size of platelets, and when the count is lower, the body often compensates by producing slightly larger, more active platelets. At this margin, this is not a concern. MCHC at 346 is one point above the upper limit of 345, which is laboratory variation and not clinically meaningful.\n\nHer C-Peptide at 0.519 ug/L converts to approximately 172 pmol/L, which is below the laboratory reference range of 1.1 to 4.4 ug/L (approximately 364 to 1456 pmol/L). C-Peptide is released by the pancreas in equal amounts to insulin, so it is a direct measure of how much insulin the pancreas is producing. In her case, fasting glucose is 4.2 and HbA1c is 29, both excellent, so the pancreas is simply not being asked to produce much insulin. This is a reflection of excellent insulin sensitivity and relatively low carbohydrate demand at the time of the blood draw, not pancreatic failure. HOMA-IR confirms this at 0.52.\n\nHer urea at 3.1 is marginally below the lower limit of 3.2. Urea is a waste product of protein metabolism, and a low level in someone eating below their needs (volume 4 out of 10) is consistent with lower protein intake than the body ideally needs. This is not a kidney problem; her kidney function is excellent. It is a nutritional signal that she may not be eating enough protein.\n\nHer alkaline phosphatase at 37 is below the lower limit of 46. ALP is an enzyme found in the liver, bones and gut. A low level in a young woman with no liver disease and healthy bones is most commonly associated with low zinc or low magnesium. Her magnesium is within the ideal range at 0.91, so zinc is the more likely contributor, and zinc was not directly measured on this panel. Low ALP can also be associated with inadequate nutrition more broadly. It is not harmful in itself but reinforces the pattern of under-eating.\n\nHer Lp(a) at 46.64 nmol/L is above the ideal threshold of 32 but within the normal range and well below the level of about 125 nmol/L at which it is generally considered to add meaningful risk. Lp(a) is a genetically inherited lipoprotein particle that carries cholesterol and has prothrombotic properties; it cannot be changed through diet or lifestyle. At this level, it is worth knowing but not a concern on its own, particularly given her otherwise exceptional cardiovascular profile.\n\nHer immunoglobulins are within range. IgG at 14.4 is within range, IgM at 1.3 and IgA at 1.2 are both healthy. IgE at 6.5 is very low, suggesting no allergic activation. Rheumatoid factor at 17 is marginally above the upper limit of 14. Rheumatoid factor is an antibody that can indicate rheumatoid arthritis or other autoimmune conditions, but at this level, in a 33-year-old with no joint symptoms specifically described as swelling or warmth, a mildly positive result is more likely to be a non-specific finding. Up to 5 to 10% of healthy people have a mildly elevated rheumatoid factor. She does not report joint pain or stiffness as a symptom, and her CRP and ESR are both very low, so there is no active inflammation. This should be noted as a baseline and repeated if she ever develops joint symptoms, but it does not require investigation now.\n\nThe urinalysis is clean. Protein, glucose, ketones, urobilinogen and nitrites are all negative. There are no white cells, no red cells, and no casts. The bacterial count and culture are pending and will be reported when available.\n\nNow, the most important question this report needs to answer: why does she feel so exhausted, sleep so badly, experience palpitations and dizziness, and struggle with brain fog, when her blood is this healthy? The bloods do not explain her symptoms, and that is genuinely useful information. What has been positively excluded is substantial. Her thyroid is working well with TSH of 0.81, FT3 of 5.2 and negative antibodies. She is not anaemic, with haemoglobin of 135 and ferritin of 71. Her B12 is 603 and folate is 7. Her blood sugar and insulin sensitivity are excellent. There is no inflammation. Her liver and kidneys are healthy. Her cortisol is within the morning range. There is no coeliac disease. Her iron stores and saturation are adequate. Her vitamin D is ideal. Her hormones confirm a regular ovulatory cycle.\n\nWhat blood cannot measure is where the explanation almost certainly lies. She sleeps under 6 hours a night and feels exhausted or wakes in the night, and this has been going on for over a year. Chronic sleep deprivation below 6 hours is one of the most powerful drivers of fatigue, brain fog, palpitations, dizziness and poor concentration that exists. It dysregulates the autonomic nervous system, which can directly cause the palpitations and dizziness she describes, increases cortisol at the wrong times of day, impairs memory consolidation (brain fog), and suppresses immune cell production, which may be contributing to her low neutrophil count. She reports that stress feels hard to manage constantly, and chronic psychological stress compounds every effect of poor sleep: it raises nighttime cortisol, fragments sleep architecture, increases heart rate variability in the wrong direction, and directly causes the sensation of palpitations. She is also eating below her needs at a volume of 4 out of 10. At a BMI of 22.5, 165cm and 61.2kg, with even modest daily movement, she needs adequate fuel, and under-eating drives fatigue, brain fog, dizziness on standing, and the marrow suppression pattern seen in her white cells and reticulocytes. The combination of chronic sleep deprivation, constant unmanaged stress and under-eating is more than sufficient to explain every symptom she reports, and the blood results are consistent with this: a healthy body that is being run on too little sleep, too little food and too much stress.\n\nThe next steps that would help her most are not further blood tests but practical interventions. If her sleep does not improve with the habits below, a GP conversation about insomnia management would be worthwhile, and if the palpitations continue once sleep and eating improve, a resting ECG and a 24-hour heart monitor would settle whether there is a rhythm issue. A formal assessment for anxiety or stress-related conditions with her GP could also open doors to structured support.","links":"The central thread in this report is a mismatch between how healthy the blood is and how unwell she feels, and the explanation runs through sleep, stress and energy intake rather than through any organ system.\n\nHer metabolic health is genuinely excellent. A HOMA-IR of 0.52, an ApoB of 0.45, triglycerides of 0.39, hsCRP below 0.2 and an HbA1c of 29 place her in the lowest-risk category across every metabolic and cardiovascular measure. Her PhenoAge of 14.6 against a calendar age of 33 reflects this. There is no insulin resistance, no inflammatory burden, no lipid-driven risk and no liver strain. The cardiovascular risk score of 0 out of 100 confirms that the modifiable drivers of heart disease are as low as they can be.\n\nThe only cardiovascular finding of note is an Lp(a) of 46.64, which is inherited and sits between the ideal threshold of 32 and the level of about 125 where it begins to add meaningful risk. Given that every other lipid marker is exceptional, this Lp(a) does not change her risk profile in any practical way at present.\n\nThe haematological findings, specifically a white cell count of 3.94, neutrophils of 1.85 and absolute reticulocytes of 34.1, form a pattern that points to the bone marrow producing cells at a reduced rate. She is not anaemic, her iron stores are adequate, and her B12 and folate are reasonable, so the raw materials are present. The most likely driver is a combination of chronic sleep deprivation under 6 hours and under-eating at a volume of 4 out of 10. The body prioritises survival functions and quietly reduces output of cells it can get away with making fewer of. The mildly low urea at 3.1 and the below-range ALP at 37 reinforce the picture of someone not eating enough: urea reflects protein turnover, and ALP can fall when zinc or overall nutrition is insufficient.\n\nThe low transferrin at 1.95 initially looks concerning alongside iron studies, but with a CRP below 0.2 (ruling out an acute phase response), adequate ferritin at 71 and ideal transferrin saturation at 38.8%, this is most likely the body producing less transport protein because it does not need more. It does not indicate iron overload or deficiency.\n\nHer hormones confirm a midcycle blood draw, with oestradiol at 1065 and LH at 61.19 consistent with the ovulatory surge. The only hormonal flag is a free testosterone marginally below range at 0.007, driven by SHBG at the higher end at 83.8. This is a subtle finding that may contribute to fatigue and brain fog but is not the primary explanation.\n\nThe FIB-4 at 1.55, the De Ritis ratio at 2.4 and the rheumatoid factor at 17 are the three numbers that look abnormal on paper but are explained by the arithmetic or by normal population variation. FIB-4 is inflated by low platelets and very low ALT. The De Ritis ratio is high because AST is 24 while ALT is just 10, and both are well within range individually; in the absence of any liver pathology, this ratio has no clinical significance. The rheumatoid factor at 17 against a cut-off of 14, with no joint symptoms, no inflammation and no other autoimmune markers, is a non-specific finding seen in up to 10% of healthy people.\n\nWhat ties the symptoms together is not in the blood. Chronic sleep deprivation below 6 hours disrupts autonomic regulation (palpitations, dizziness), impairs memory and concentration (brain fog), drives fatigue directly, and suppresses immune cell production. Constant unmanaged stress amplifies all of these and fragments sleep further. Under-eating at a volume of 4 out of 10 at a healthy BMI deprives the body of the fuel it needs to recover. These three factors, acting together for over a year, explain every symptom she reports and are consistent with the mild marrow suppression seen in the blood count.","lifestyle":"Set a fixed wake time seven days a week and do not vary it by more than 30 minutes at weekends. Anchor: alarm at the same time every day, including days off. Why: a fixed wake time is the single strongest anchor for your circadian rhythm, and resetting it is the first step to improving sleep quality, which is the biggest driver of your fatigue, brain fog and palpitations.\nGet outside within 30 minutes of waking for at least 10 minutes, even on overcast days. Anchor: shoes on before you check your phone. Why: morning light suppresses melatonin and sets the cortisol awakening response, which helps you feel alert in the morning and sleepy at the right time at night.\nCut caffeine entirely after midday. If you drink coffee, have it within 90 minutes of waking and nothing caffeinated after 12pm. Anchor: set a phone reminder at noon. Why: caffeine has a half-life of 5 to 7 hours, meaning a 3pm coffee is still half-active at 10pm and directly fragments sleep architecture, which is already your weakest link.\nAdd a palm-sized portion of protein to every meal, starting with breakfast. Eggs, Greek yoghurt, tinned fish, chicken or tofu. Anchor: protein goes on the plate before anything else. Why: your urea at 3.1 and your eating volume of 4 out of 10 suggest you are not eating enough protein, and this is contributing to the low bone marrow output seen in your white cells and reticulocytes. At 61.2kg, aim for 80 to 95 grams of protein a day and roughly 1,800 to 2,000 calories, which is your estimated maintenance range at this activity level.\nAdd one extra portion of green leafy vegetables a day, either at lunch or dinner. Spinach, broccoli, kale, rocket or peas. Anchor: add it to whatever you are already eating rather than replacing something. Why: this will bring your folate from 7 into the ideal range above 8, provide zinc which may be behind your low ALP, and increase your vegetable intake from 2 to 3 portions towards 4 to 5.\nWalk for 20 minutes after your evening meal. Anchor: plate in the sink, shoes on, out the door. Why: a post-dinner walk lowers evening cortisol, improves blood sugar handling, and acts as a wind-down signal for sleep. At 5,000 to 7,500 steps, this will push you towards 8,000 to 10,000 and is the gentlest way to start adding movement without the barrier of a gym.\nStart two short resistance sessions a week, even 15 minutes each, at home with bodyweight exercises: squats, press-ups, lunges and planks. Anchor: pick two fixed days and a fixed time, and lay out your clothes the night before. Why: resistance training builds lean mass, raises resting metabolic rate, supports bone density, and is one of the strongest predictors of long-term health and longevity, which is your primary goal.\nBefore bed, spend 10 minutes without screens in a dimly lit room. Read a physical book, stretch or do a breathing exercise. Anchor: phone on charge outside the bedroom at 9pm. Why: blue light suppresses melatonin and keeps your brain in alert mode, and removing it is one of the most reliable ways to improve sleep onset and reduce nighttime waking.","flags":"White cell count 3.94, below the lower limit of 4.0, driven by neutrophils at 1.85, below the lower limit of 2.0. In a lean woman sleeping under 6 hours with constant stress and eating below her needs, this is most likely a combination of sleep deprivation and mild energy deficit suppressing bone marrow output. Worth mentioning to her GP as a baseline. If she develops recurrent infections, a repeat with a blood film would be appropriate.\nAbsolute reticulocyte count 34.1, below the lower limit of 50. Reticulocytes are newly released red blood cells. Her haemoglobin is healthy at 135, so she is not anaemic, but the marrow is producing at a reduced rate. Same explanation as the white cell suppression: inadequate sleep and energy intake. Expected to improve with the lifestyle changes in this report.\nC-Peptide 0.519 ug/L (approximately 172 pmol/L), below the laboratory range of 1.1 to 4.4 ug/L. With a fasting glucose of 4.2, HbA1c of 29 and HOMA-IR of 0.52, this reflects excellent insulin sensitivity and very low insulin demand, not pancreatic insufficiency.\nFree testosterone 0.007 nmol/L, marginally below the lower limit of 0.01. Driven by SHBG at the higher end at 83.8. A subtle finding that may contribute to fatigue and brain fog. Not a primary driver and does not require treatment but worth noting.\nTransferrin 1.95 g/L, below the lower limit of 2.5. With CRP below 0.2, ferritin at 71 and transferrin saturation at 38.8%, this is not inflammation or iron overload. Most likely the body downregulating transport protein because iron stores are adequate. Worth noting as a baseline with her GP.\nAlkaline phosphatase 37 IU/L, below the lower limit of 46. With all other liver markers excellent, this is not liver disease. Low ALP in a young woman is most commonly associated with low zinc or insufficient nutrition. Consistent with her eating volume of 4 out of 10.\nUrea 3.1 mmol/L, marginally below the lower limit of 3.2. Reflects low protein turnover, consistent with under-eating. Kidney function is excellent.\nLp(a) 46.64 nmol/L, above the ideal threshold of 32 but within the normal range and below the level of approximately 125 where it is considered to add meaningful risk. Inherited and unchangeable. Not a concern given her otherwise excellent cardiovascular profile.\nRheumatoid factor 17 IU/mL, marginally above the upper limit of 14. No joint symptoms, CRP below 0.2 and ESR 3. Most likely a non-specific finding seen in up to 10% of healthy people. Should be repeated if she ever develops joint symptoms.\nFIB-4 1.55, above the 1.45 threshold. Driven by low platelets (162) and very low ALT (10) inflating the calculation. All direct liver markers are excellent. No liver disease.\nDe Ritis ratio (AST to ALT) 2.4, above the range of 0.6 to 1.6. Both AST (24) and ALT (10) are individually well within range. The ratio is high because ALT is very low. In the absence of any liver pathology, this ratio is clinically insignificant.\nMCHC 346, one point above the upper limit of 345, and MPV 10.3, marginally above the upper limit of 10.1. Neither is clinically significant. MPV is consistent with slightly larger platelets compensating for a lower count.\nReassuring negatives: thyroid function excellent with negative antibodies, no anaemia with healthy haemoglobin and iron stores, B12 and folate adequate, blood sugar and insulin sensitivity exceptional, no inflammation (CRP below 0.2, ESR 3), liver in excellent health, kidney function strong (eGFR 106), cortisol within morning range, coeliac excluded (tTG negative with adequate IgA), all tumour markers within range, vitamin D ideal at 106, urinalysis clean.","recommendations":"Discuss the low white cell count (3.94) and low neutrophils (1.85) with your GP so they can note it as a baseline. If you develop recurrent infections, a repeat full blood count with a blood film would be the next step.\nMention the low transferrin (1.95) alongside your adequate ferritin (71) and normal transferrin saturation (38.8%). No action is likely needed, but having it on record means any future changes can be tracked.\nIf the palpitations and dizziness do not improve once sleep and eating are addressed, ask your GP for a resting ECG and consider a 24-hour Holter monitor to rule out a rhythm abnormality.\nDiscuss the chronic insomnia and constant stress with your GP. If the sleep habits in this report do not improve things within 4 to 6 weeks, cognitive behavioural therapy for insomnia (CBT-I) is the most effective treatment and can be accessed through the NHS.\nMention the marginally low free testosterone (0.007) if fatigue and brain fog persist despite improving sleep, eating and stress. SHBG is at the higher end at 83.8, which is driving this. It does not require treatment at this level but is useful context.\nAim for approximately 1,800 to 2,000 calories a day with a protein target of 80 to 95 grams (roughly 1.3 to 1.6 grams per kilogram of bodyweight). Retest in 6 months and repeat the full blood count (white cells, neutrophils, reticulocytes), urea, ALP, transferrin and folate to confirm the changes are working.","supplementation":"Magnesium glycinate, 300mg, taken 30 to 60 minutes before bed. Why: magnesium supports sleep quality and muscle relaxation, and at 0.91 she is within the ideal range but at a level where supplementation before bed may help with her insomnia and nighttime waking.\nFolate as methylfolate, 400mcg daily, taken with breakfast. Why: her folate at 7 is just below the ideal of above 8, and methylfolate is the active form the body uses directly. This supplements the dietary increase in green vegetables.\nVitamin D3 as cholecalciferol, 2,000 IU daily, taken with a meal containing fat. Why: her vitamin D at 106 is ideal, and this is a maintenance dose to keep it there through the winter months when sun exposure drops. Take with vitamin K2 (MK-7) 100mcg daily to support calcium direction into bones rather than arteries.\nDo not take iron supplements. Her ferritin at 71 and transferrin saturation at 38.8% show adequate iron stores, and supplementing would risk pushing iron above the ideal range.\nThe most important changes from this report are not supplements. They are sleeping more, eating more, and finding a way to manage the chronic stress that has been running for over a year.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"67","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6091","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 67 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 66.9. Weakest systems: glucose & insulin 40%, lipids & cardiovascular 54%, hematology 57%. Biggest drags: C-Peptide, Lipoprotein(a), Urea, White Blood Cell Count.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"14.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1921","lower_normal":"","upper_normal":"38","lower_optimal":"","upper_optimal":"33","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4342","units":"years","description":"PhenoAge is a composite biological ageing score calculated from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 14.6 against a calendar age of 33, this places her biological age 18.4 years younger than her chronological age. This is an exceptional result driven by her very low CRP, low glucose, healthy albumin and clean metabolic profile. It reflects a body that is ageing slowly at the cellular level, despite how she currently feels.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"0","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built right now, regardless of age. At 0 out of 100, every input is in its most favourable range. Despite the mildly elevated Lp(a), the combined profile produces the lowest possible score. This is an outstanding result.","low_causes":"Excellent lipids, low inflammation, optimal blood sugar","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"4.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6133","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5093","units":"mmol/L","description":"Fasting blood glucose measures the amount of sugar circulating in the blood after an overnight fast. At 4.2, this is within the ideal range of 4.0 to 5.4 and reflects excellent blood sugar regulation. The body is clearing glucose from the blood efficiently without needing to overproduce insulin. This is consistent with her very low fasting insulin and excellent HOMA-IR.","low_causes":"Prolonged fasting, excess insulin, liver disease, adrenal insufficiency","high_causes":"Insulin resistance, type 2 diabetes, stress response, high carbohydrate intake, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.32","lower_normal":"0","upper_normal":"6.0","lower_optimal":"0","upper_optimal":"5.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4583","units":"%","description":"HbA1c measures the percentage of haemoglobin in the red blood cells that has glucose attached to it, reflecting average blood sugar over the past two to three months. At 4.8%, this is well below the normal threshold of 6.0% and indicates excellent long-term blood sugar control. There is no suggestion of pre-diabetes or diabetes.","low_causes":"Low carbohydrate intake, increased red cell turnover, blood loss","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hba1c","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3452","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in mmol/mol, the international standard unit. At 29 against a normal threshold of 42 and an ideal threshold of 36, this confirms excellent average blood sugar control over the past two to three months. A result below 36 is considered optimal.","low_causes":"Low carbohydrate intake, increased red cell turnover","high_causes":"Insulin resistance, pre-diabetes, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.78","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3414","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3307","upper_optimal_position":"0.3548","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas is producing to keep blood sugar in check. At 2.78, this is just inside the laboratory range and well within the ideal range of 2 to 8. A low fasting insulin alongside a healthy fasting glucose means the body's cells are highly sensitive to insulin and very little is needed to do the job. This is an excellent finding.","low_causes":"Very high insulin sensitivity, low carbohydrate intake, type 1 diabetes","high_causes":"Insulin resistance, metabolic syndrome, excess carbohydrate intake, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpeptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.519","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1576","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin, making it a reliable measure of how much insulin the body is producing. At 0.519 ug/L (approximately 172 pmol/L), this is below the laboratory range of 1.1 to 4.4. However, with fasting glucose at 4.2, HbA1c at 29 and HOMA-IR at 0.52, the pancreas is simply not being asked to produce much insulin because the body is so insulin-sensitive. This is a reflection of low insulin demand, not pancreatic failure.","low_causes":"Very high insulin sensitivity, low carbohydrate intake, fasting state, type 1 diabetes","high_causes":"Insulin resistance, pancreatic tumour (insulinoma), kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3571","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose converts the HbA1c into an approximation of the average blood sugar over the past two to three months. At 5 mmol/L, this confirms excellent long-term blood sugar control.","low_causes":"Low carbohydrate intake, increased red cell turnover","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"7.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4080","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is calculated from fasting triglycerides and glucose and is used as a surrogate marker for insulin resistance. At 7.18, this is well within the ideal range of below 8.5, confirming excellent insulin sensitivity. This is consistent with her HOMA-IR of 0.52 and low triglycerides.","low_causes":"High insulin sensitivity, low carbohydrate intake","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"135","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"120","upper_normal":"150","lower_optimal":"125","upper_optimal":"145","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"Haemoglobin is the protein in red blood cells that carries oxygen from the lungs to every tissue in the body. At 135, this is right in the middle of the female range of 120 to 150 and within the ideal band. There is no anaemia, and the body has adequate oxygen-carrying capacity.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, polycythaemia, living at altitude, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"3.8","upper_normal":"4.8","lower_optimal":"4.0","upper_optimal":"4.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3556","upper_optimal_position":"0.6333","units":"x10^12/L","description":"This counts the total number of red blood cells in a litre of blood. At 4.61, this is well within the female range and the ideal band, confirming healthy red cell production.","low_causes":"Anaemia, bone marrow suppression, nutritional deficiency, chronic disease","high_causes":"Dehydration, polycythaemia, hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0.36","upper_normal":"0.46","lower_optimal":"0.37","upper_optimal":"0.44","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6133","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is made up of red blood cells. At 0.39, this is within the ideal range for a woman and confirms adequate red cell mass and hydration.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"12.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"11.6","upper_normal":"14","lower_optimal":"11.8","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6250","units":"%","description":"RDW measures the variation in size among red blood cells. A normal RDW means the red cells are uniform in size, which is expected when iron, B12 and folate are adequate. At 12.5, this is within the ideal range and confirms no nutritional deficiency affecting red cell production.","low_causes":"Not clinically significant when low","high_causes":"Iron deficiency, B12 or folate deficiency, mixed anaemia, chronic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Cell Volume","group":"HEMATOLOGY","result":"84.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3611","lower_normal":"83","upper_normal":"101","lower_optimal":"84","upper_optimal":"96","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"fL","description":"MCV measures the average size of red blood cells. At 84.5, this is within the ideal range. Small red cells (low MCV) suggest iron deficiency, while large cells (high MCV) suggest B12 or folate deficiency. A normal MCV confirms neither is present.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Cell Haemoglobin","group":"HEMATOLOGY","result":"29.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4800","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"31","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6000","units":"pg","description":"MCH measures the average amount of haemoglobin in each red blood cell. At 29.2, this is within the ideal range and confirms the red cells are properly loaded with haemoglobin for oxygen transport.","low_causes":"Iron deficiency, thalassaemia","high_causes":"B12 or folate deficiency, macrocytosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Cell Haemoglobin Concentration","group":"HEMATOLOGY","result":"346","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6778","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"340","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6111","units":"g/L","description":"MCHC measures the concentration of haemoglobin within each red blood cell. At 346, this is one point above the upper limit of 345. At this margin, this is laboratory variation rather than a clinical finding and is not a concern.","low_causes":"Iron deficiency","high_causes":"Hereditary spherocytosis, laboratory artefact, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"162","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3487","lower_normal":"150","upper_normal":"410","lower_optimal":"175","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3629","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that help the blood clot when a vessel is damaged. At 162, this is within the laboratory range of 150 to 410 but below the ideal of 175 to 350. A count at the lower end is common in lean women and is not a concern in itself, but it is contributing to the elevated FIB-4 score through the calculation.","low_causes":"Viral infection, bone marrow suppression, autoimmune conditions, nutritional deficiency, medications","high_causes":"Infection, inflammation, iron deficiency, after surgery or trauma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"10.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6889","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6333","units":"fL","description":"MPV measures the average size of platelets. At 10.3, this is marginally above the upper limit of 10.1. When the platelet count is lower, the bone marrow often produces slightly larger, more active platelets to compensate. At this margin, this is not a clinical concern.","low_causes":"Bone marrow suppression, inflammatory conditions","high_causes":"Increased platelet turnover, lower platelet count compensation, some inflammatory conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"3.94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3233","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"White blood cells are the immune system's defence force, fighting infection and responding to foreign invaders. At 3.94, this is just below the lower limit of 4.0. The low count is driven by low neutrophils. In a lean woman sleeping under 6 hours with constant stress and eating below her needs, this is most likely a functional suppression by the bone marrow rather than a disease process. It should be noted as a baseline with her GP.","low_causes":"Sleep deprivation, undernutrition, viral infection, chronic stress, bone marrow suppression, certain medications","high_causes":"Infection, inflammation, stress response, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2967","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4333","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the body's first line of defence against bacterial infection. At 1.85, this is below the lower limit of 2.0. This is the main driver of the low total white cell count. Chronic sleep deprivation, constant stress and under-eating can all independently suppress neutrophil production, and together they provide a sufficient explanation. This is worth noting as a baseline with her GP, with a repeat recommended if she develops recurrent infections.","low_causes":"Sleep deprivation, undernutrition, chronic stress, viral infection, benign ethnic neutropenia, medications, bone marrow disorders","high_causes":"Bacterial infection, acute stress, inflammation, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.63","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4383","lower_normal":"1","upper_normal":"3","lower_optimal":"1.2","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells involved in the adaptive immune response, including fighting viral infections and producing antibodies. At 1.63, this is within the ideal range and shows the adaptive arm of the immune system is functioning normally.","low_causes":"Viral infection, steroid use, immunosuppression, stress","high_causes":"Viral infection, chronic inflammation, lymphocytic leukaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3583","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that engulf and digest pathogens and dead cells. At 0.24, this is within the ideal range.","low_causes":"Bone marrow suppression, certain medications","high_causes":"Chronic inflammation, infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4861","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the response to parasites and allergic reactions. At 0.19, this is within the ideal range and shows no allergic or parasitic activation.","low_causes":"Steroid use, acute stress","high_causes":"Allergies, asthma, parasitic infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3458","lower_normal":"0.02","upper_normal":"0.1","lower_optimal":"0.02","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Basophils are the least common white blood cell and play a role in allergic and inflammatory reactions. At 0.03, this is within the ideal range.","low_causes":"Acute infection, steroid use","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.74","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3733","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3833","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are newly released red blood cells, fresh from the bone marrow. The percentage at 0.74 is within the laboratory range but below the ideal of 0.8 to 2.0%. The absolute count at 34.1 is below range, suggesting the marrow is producing red cells at a reduced rate. Since haemoglobin is healthy, this is not causing anaemia but reflects the bone marrow conserving output, likely in response to under-eating and sleep deprivation.","low_causes":"Bone marrow suppression, nutritional deficiency, undernutrition, chronic disease","high_causes":"Recovery from anaemia, blood loss, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytesabsolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"34.114","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2274","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"This is the absolute count of reticulocytes in the blood, calculated from the percentage and the red cell count. At 34.1, this is below the lower limit of 50, confirming the bone marrow is producing fewer new red blood cells than expected. With adequate iron, B12 and folate, the most likely explanation is reduced bone marrow activity due to under-eating and chronic sleep deprivation.","low_causes":"Bone marrow suppression, undernutrition, chronic stress, iron or B12 deficiency","high_causes":"Haemolysis, recovery from blood loss, erythropoietin use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"18.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer index is calculated by dividing MCV by the red blood cell count and helps distinguish iron deficiency anaemia from thalassaemia trait when MCV is low. At 18.3, a value above 13 suggests iron deficiency rather than thalassaemia if anaemia were present. As her MCV and haemoglobin are both normal, this is reported for context only.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.125","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3333","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube over one hour, which increases when there is inflammation in the body. At 3, this is very low and confirms no significant inflammatory process.","low_causes":"Not clinically significant","high_causes":"Infection, autoimmune disease, can
