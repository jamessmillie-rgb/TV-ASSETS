cer, pregnancy, anaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"38.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5216","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation measures the percentage of the body's iron transport protein (transferrin) that is currently loaded with iron. At 38.8%, this is right within the ideal range of 25 to 40%, meaning the transport system is neither overloaded nor underused. This is a healthy finding.","low_causes":"Iron deficiency, chronic disease, inflammation","high_causes":"Iron overload, haemochromatosis, excessive iron supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4890","lower_normal":"9","upper_normal":"30.4","lower_optimal":"12","upper_optimal":"26","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3738","upper_optimal_position":"0.5888","units":"umol/L","description":"Serum iron measures the amount of iron circulating in the blood at the time of the draw. At 19, this is within the ideal range and confirms adequate iron availability for the body's needs.","low_causes":"Iron deficiency, chronic disease, menstrual blood loss, poor absorption","high_causes":"Iron overload, haemochromatosis, liver disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"1.95","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1744","lower_normal":"2.5","upper_normal":"3.8","lower_optimal":"2.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6103","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the tissues that need it. At 1.95, this is below the lower limit of 2.5. Low transferrin can occur in two main situations: when the body has plenty of iron and downregulates production because less transport is needed, or when it falls as part of an inflammatory response (transferrin is a negative acute phase protein). With CRP below 0.2, inflammation is not the cause. With ferritin at 71 and transferrin saturation at 38.8%, both healthy, this is most likely the body producing less transferrin because iron stores are adequate and less transport capacity is needed. Worth noting as a baseline with her GP.","low_causes":"Adequate iron stores (downregulation), inflammation, liver disease, malnutrition, nephrotic syndrome","high_causes":"Iron deficiency, pregnancy, oral contraceptives","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"47","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3443","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3954","upper_optimal_position":"0.6037","units":"umol/L","description":"TIBC measures the total capacity of the blood to bind and transport iron, which reflects the amount of transferrin available. At 47, this is within the laboratory range but below the ideal of 50 to 70, consistent with the low transferrin level. This is not a concern given the adequate iron stores and saturation.","low_causes":"Iron overload, inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"71","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4053","lower_normal":"10","upper_normal":"291","lower_optimal":"40","upper_optimal":"150","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4996","units":"ng/mL","description":"Ferritin is the body's iron storage protein, and its level reflects how much iron is held in reserve. At 71, this is within the ideal female range of 40 to 150, meaning iron stores are healthy. This is a reassuring finding for a menstruating woman.","low_causes":"Iron deficiency, heavy menstruation, vegetarian diet, poor absorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"140","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5128","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"144","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6180","units":"mmol/L","description":"Sodium is the main electrolyte in the blood, essential for fluid balance, nerve signalling and muscle contraction. At 140, this is right in the middle of the ideal range and reflects normal hydration and kidney function.","low_causes":"Overhydration, heart failure, liver disease, adrenal insufficiency, medications","high_causes":"Dehydration, excessive salt intake, diabetes insipidus","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"100","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4872","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3590","upper_optimal_position":"0.6180","units":"mmol/L","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. At 100, this is within the ideal range and confirms normal electrolyte balance.","low_causes":"Vomiting, metabolic alkalosis, overhydration","high_causes":"Dehydration, metabolic acidosis, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"29.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6330","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/L","description":"Bicarbonate is a buffer that helps maintain the acid-base balance of the blood. At 29.9, this is within the laboratory range but slightly above the ideal of 22 to 28. A mildly elevated bicarbonate can reflect slight dehydration or a metabolic compensation. It is not a concern at this level.","low_causes":"Metabolic acidosis, kidney disease, diarrhoea","high_causes":"Vomiting, dehydration, metabolic alkalosis, respiratory compensation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"4.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"5.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.6111","units":"mmol/L","description":"Potassium is essential for heart rhythm, nerve function and muscle contraction. At 4.4, this is within the ideal range and confirms normal potassium regulation.","low_causes":"Diuretics, vomiting, diarrhoea, poor intake","high_causes":"Kidney disease, medications (ACE inhibitors, potassium-sparing diuretics), sample haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"3.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.3200","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.5867","units":"mmol/L","description":"Urea is a waste product of protein metabolism, filtered out of the blood by the kidneys. At 3.1, this is marginally below the lower limit of 3.2. A low urea in someone with excellent kidney function (eGFR 106) is not a kidney problem. It is a nutritional signal, suggesting lower protein turnover than ideal. In someone eating at a volume of 4 out of 10, this is consistent with not eating enough protein.","low_causes":"Low protein intake, liver disease, overhydration, malnutrition","high_causes":"Kidney disease, dehydration, high protein diet, gastrointestinal bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4756","lower_normal":"49","upper_normal":"90","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.6098","units":"umol/L","description":"Creatinine is a waste product from muscle metabolism, filtered by the kidneys. At 67, this is within the ideal range and reflects healthy kidney filtration.","low_causes":"Low muscle mass, pregnancy","high_causes":"Kidney disease, dehydration, high muscle mass, creatine supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":">90","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"eGFR estimates how well the kidneys filter waste from the blood, calculated from creatinine. Above 90 is considered optimal. Her creatinine-based eGFR confirms excellent kidney function, consistent with the Cystatin C-based eGFR of 106.","low_causes":"Kidney disease, dehydration, medications","high_causes":"Not clinically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatinc_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"106","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"mL/min/1.73m2","description":"Cystatin C is a protein produced at a constant rate by all cells and filtered by the kidneys, making it a more reliable measure of kidney function than creatinine because it is not affected by muscle mass. At 106, this confirms excellent kidney filtration.","low_causes":"Kidney disease","high_causes":"Not clinically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uricacid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"204","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3571","lower_normal":"184","upper_normal":"464","lower_optimal":"160","upper_optimal":"320","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3048","upper_optimal_position":"0.5190","units":"umol/L","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods and produced by the body. At 204, this is within the laboratory range and within the ideal female range of 160 to 320. Healthy uric acid reduces the risk of gout and kidney stones.","low_causes":"Low purine intake, medications","high_causes":"High purine diet, alcohol, obesity, kidney disease, gout","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatinc","name":"Cystatin C","group":"KIDNEY FUNCTION","result":"0.83","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3773","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/L","description":"Cystatin C is a small protein filtered by the kidneys, and its blood level reflects how well the kidneys are working. At 0.83, this is well within the ideal range and confirms excellent kidney filtration. Cystatin C is particularly useful because it is not influenced by muscle mass, age or sex as much as creatinine.","low_causes":"Not clinically significant","high_causes":"Kidney disease, thyroid dysfunction","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"egfrcombined","name":"eGFR (Creatinine + Cystatin C)","group":"KIDNEY FUNCTION","result":"106","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.8833","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.7500","upper_optimal_position":"1.0000","units":"mL/min/1.73m2","description":"This combined eGFR uses both creatinine and cystatin C to estimate kidney filtration, providing a more accurate result than either marker alone. At 106, this is well above the ideal of 90 and confirms excellent kidney function at 33.","low_causes":"Chronic kidney disease, dehydration, kidney strain","high_causes":"Not clinically significant when high","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ureacreatinineratio","name":"Urea:Creatinine Ratio","group":"KIDNEY FUNCTION","result":"46.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3683","lower_normal":"40","upper_normal":"100","lower_optimal":"45","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.6111","units":"ratio","description":"The urea to creatinine ratio helps distinguish between kidney causes of raised urea (where the ratio stays normal) and non-kidney causes such as dehydration or gastrointestinal bleeding (where it rises). At 46.3, this is within the ideal range and confirms that the marginally low urea is not a kidney issue but rather a nutritional finding.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity C-Reactive Protein","group":"INFLAMMATION","result":"0.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.02","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1","units":"mg/L","description":"High-sensitivity CRP is the most useful general marker of systemic inflammation in the body. It is produced by the liver in response to inflammatory signals from anywhere in the body. At below 0.2, this is the lowest the assay reports and means there is essentially no detectable systemic inflammation. This is an excellent finding and rules out inflammation as a cause of her symptoms.","low_causes":"Not clinically significant","high_causes":"Infection, chronic inflammation, cardiovascular risk, autoimmune disease, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca125","name":"CA125","group":"TUMOR MARKERS","result":"14.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2057","lower_normal":"0","upper_normal":"35","lower_optimal":"0","upper_optimal":"35","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA125 is a protein that can be elevated in ovarian cancer and other conditions such as endometriosis, fibroids and pelvic inflammation. At 14.4 against a cut-off of 35, this is well within the normal range. This is a reassuring screening result.","low_causes":"Not clinically significant","high_causes":"Ovarian cancer, endometriosis, fibroids, pelvic inflammatory disease, menstruation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ca153","name":"CA15-3","group":"TUMOR MARKERS","result":"16.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2784","lower_normal":"0","upper_normal":"30","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"CA15-3 is a protein that can be elevated in breast cancer and is used as a screening marker. At 16.69 against a cut-off of 30, this is well within the normal range. This is a reassuring finding.","low_causes":"Not clinically significant","high_causes":"Breast cancer, ovarian cancer, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"totalprotein","name":"Total Protein","group":"LIVER & METABOLIC","result":"76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5267","lower_normal":"57","upper_normal":"82","lower_optimal":"63","upper_optimal":"79","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3733","upper_optimal_position":"0.6213","units":"g/L","description":"Total protein measures the combined amount of albumin and globulin in the blood. At 76, this is within the ideal range and reflects healthy liver function and adequate protein status.","low_causes":"Malnutrition, liver disease, kidney disease","high_causes":"Dehydration, chronic infection, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5833","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6250","units":"g/L","description":"Albumin is the most abundant protein in the blood, made by the liver. It transports hormones, vitamins and medications around the body, and its level reflects liver synthetic function and nutritional status. At 46, this is within the ideal range and confirms the liver is producing protein normally.","low_causes":"Liver disease, malnutrition, inflammation, kidney disease","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"30","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/L","description":"Globulin encompasses the immune proteins (immunoglobulins) and other transport proteins in the blood. At 30, this is within the ideal range and reflects a healthy immune protein level.","low_causes":"Immune deficiency, malnutrition","high_causes":"Chronic infection, inflammation, autoimmune disease, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2143","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6048","units":"IU/L","description":"Alkaline phosphatase is an enzyme found in the liver, bones and gut. At 37, this is below the lower limit of 46. In a 33-year-old woman with all other liver markers in excellent condition and healthy bones (calcium and PTH are normal), a low ALP is most commonly associated with low zinc or broader nutritional insufficiency. Her eating volume of 4 out of 10 supports this. Low ALP is not harmful in itself but is a subtle nutritional signal.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Liver disease, bone disease, bile duct obstruction, pregnancy, growing children","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"16","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4375","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"umol/L","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. At 16, this is within the ideal range and reflects normal liver function and red cell turnover.","low_causes":"Not clinically significant","high_causes":"Liver disease, bile duct obstruction, haemolysis, Gilbert's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0893","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/L","description":"ALT is a liver enzyme that rises when liver cells are damaged or inflamed. At 10, this is well within the ideal range of below 25 for a woman. A very low ALT confirms no liver cell damage or metabolic strain.","low_causes":"Not clinically significant","high_causes":"Fatty liver disease, hepatitis, medications, alcohol, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3958","upper_optimal_position":"0.6042","units":"IU/L","description":"AST is an enzyme found in the liver, heart and muscles. At 24, this is within the ideal range. AST and ALT together provide a picture of liver health, and both being within the ideal range confirms the liver is in excellent condition.","low_causes":"Not clinically significant","high_causes":"Liver disease, muscle damage, heart attack, medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"10","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1316","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3289","units":"IU/L","description":"GGT is a liver enzyme that is particularly sensitive to alcohol, medications and metabolic strain. At 10 against a female upper limit of 38 and an ideal of below 25, this is very low. A clean GGT confirms the liver is under no strain from any source.","low_causes":"Not clinically significant","high_causes":"Alcohol, medications, fatty liver, bile duct disease, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4545","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3939","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. At 62, this is within the ideal range and confirms normal pancreatic function. There is no sign of pancreatitis or pancreatic stress.","low_causes":"Chronic pancreatitis, cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland inflammation, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4787","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3758","upper_optimal_position":"0.6242","units":"U/L","description":"Lipase is an enzyme from the pancreas that breaks down fats. At 39, this is within the ideal range and confirms the pancreas is functioning normally.","low_causes":"Chronic pancreatitis","high_causes":"Acute pancreatitis, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5147","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.2","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3544","upper_optimal_position":"0.6374","units":"mmol/L","description":"Calcium is essential for bone strength, muscle contraction, nerve signalling and blood clotting. At 2.39, this is within the ideal range and reflects healthy calcium regulation.","low_causes":"Vitamin D deficiency, parathyroid dysfunction, malnutrition, kidney disease","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"correctedcalcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"2.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4083","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.2","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"mmol/L","description":"Corrected calcium adjusts the total calcium for the albumin level, giving a more accurate reflection of the biologically active calcium. At 2.29, this is within the ideal range and confirms normal calcium status.","low_causes":"Vitamin D deficiency, parathyroid dysfunction, malnutrition","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"phosphate","name":"Phosphate","group":"ELECTROLYTES & MINERALS","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4176","lower_normal":"0.78","upper_normal":"1.65","lower_optimal":"0.9","upper_optimal":"1.45","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3714","upper_optimal_position":"0.6048","units":"mmol/L","description":"Phosphate works with calcium to build bones and teeth, and is essential for energy production in cells. At 1.0, this is within the ideal range.","low_causes":"Vitamin D deficiency, malnutrition, antacid use, hyperparathyroidism","high_causes":"Kidney disease, hypoparathyroidism, excessive vitamin D","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"0.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5517","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6264","units":"mmol/L","description":"Magnesium is involved in over 300 biochemical reactions in the body, including muscle and nerve function, blood sugar control and sleep regulation. At 0.91, this is within the ideal range of 0.85 to 1.05. Supplementing with magnesium glycinate before bed may still help with her sleep, as serum magnesium does not fully reflect intracellular levels.","low_causes":"Poor intake, stress, alcohol, medications (diuretics, PPIs), diarrhoea","high_causes":"Kidney disease, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamind","name":"Vitamin D","group":"VITAMINS & NUTRIENTS","result":"106","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"0.95","units":"nmol/L","description":"Vitamin D is essential for bone health, immune function, mood regulation and muscle strength. It is produced in the skin from sunlight and obtained from food. At 106, this is within the ideal range of 75 to 120 and is an excellent level. A maintenance dose of 2,000 IU daily through the winter months will help keep it here.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, winter months","high_causes":"Excessive supplementation","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"1.792","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3882","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.2","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3392","upper_optimal_position":"0.6060","units":"pmol/L","description":"PTH is a hormone produced by the parathyroid glands that regulates calcium levels in the blood, working in concert with vitamin D. At 1.792, this is within the ideal range and confirms normal calcium regulation. A healthy PTH alongside healthy calcium and excellent vitamin D means bone metabolism is functioning well.","low_causes":"Hypoparathyroidism, high calcium, excess vitamin D","high_causes":"Hyperparathyroidism, vitamin D deficiency, kidney disease, low calcium","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"603","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5195","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5559","upper_optimal_position":"0.5846","units":"pg/mL","description":"Vitamin B12 is essential for nerve function, red blood cell formation and DNA synthesis. At 603, this is within the ideal range of 500 to 900 and confirms adequate B12 status. No supplementation is needed.","low_causes":"Vegan or vegetarian diet, pernicious anaemia, malabsorption, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate","group":"VITAMINS & NUTRIENTS","result":"7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4286","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6666666667","units":"ng/mL","description":"Folate (vitamin B9) is essential for DNA synthesis, cell division and red blood cell formation. At 7, this is within the laboratory range of 3 to 17 but just below the ideal of 8 and above. Increasing green leafy vegetables (spinach, broccoli, kale) and supplementing with 400mcg of methylfolate daily will bring this into the ideal range.","low_causes":"Low vegetable intake, alcohol, malabsorption, medications, pregnancy","high_causes":"Supplementation, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3089","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/L","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. At 3.2 against a desirable level of below 5.18, this is excellent. Total cholesterol alone is less informative than its components, but a low total alongside the excellent breakdown below is a strong positive.","low_causes":"Malnutrition, hyperthyroidism, liver disease","high_causes":"Diet, genetics, hypothyroidism, obesity, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1147","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/L","description":"Triglycerides are a type of fat in the blood, mainly influenced by carbohydrate and sugar intake, alcohol and body weight. At 0.39, this is very low and well within the ideal of below 1.0. Low triglycerides alongside a healthy glucose and insulin confirm excellent metabolic health.","low_causes":"Low carbohydrate intake, malnutrition, hyperthyroidism","high_causes":"Excess carbohydrate or sugar, alcohol, obesity, insulin resistance, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1154","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/L","description":"VLDL carries triglycerides from the liver to the tissues. At 0.18 against an upper limit of 0.78, this is very low and reflects the low triglyceride level. This is an excellent finding.","low_causes":"Low triglycerides, low carbohydrate intake","high_causes":"Insulin resistance, metabolic syndrome, high carbohydrate diet, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6731","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.7692","upper_optimal_position":"1","units":"mmol/L","description":"HDL is often called 'good' cholesterol because it removes excess cholesterol from the arteries and carries it back to the liver for disposal. At 1.4, this is above the desirable threshold of 1.04 but below the ideal for a woman of 1.6 and above. Regular aerobic exercise is one of the most reliable ways to raise HDL, and even walking more would help.","low_causes":"Sedentary lifestyle, smoking, obesity, insulin resistance, low-fat diet","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2080","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5733","units":"mmol/L","description":"LDL is the main carrier of cholesterol to the tissues and, when in excess, into the artery walls. At 1.56 against a range of 0.5 to 3 and an ideal of below 2.6, this is very healthy. Low LDL means fewer cholesterol particles are available to enter the artery walls.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet high in saturated fat, genetics, hypothyroidism, obesity","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tchdlratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.29","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2544","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is a simple way to assess cardiovascular risk. At 2.29 against an upper limit of 4.5, this is excellent and well within the ideal range.","low_causes":"High HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdlpercentage","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"43.75","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.75","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"This shows what proportion of total cholesterol is made up of protective HDL. At 43.75%, well above the 20% minimum, nearly half of her total cholesterol is the protective type. This is a strong positive.","low_causes":"Sedentary lifestyle, obesity, smoking","high_causes":"Exercise, genetics, healthy diet","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nonhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"1.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.225","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.375","units":"mmol/L","description":"Non-HDL cholesterol is total cholesterol minus HDL and captures all the atherogenic (artery-damaging) cholesterol in one number. At 1.8 against an upper limit of 4, this is well within the ideal range and confirms low cardiovascular risk.","low_causes":"Low LDL, healthy metabolism","high_causes":"Elevated LDL, elevated triglycerides, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.24","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4429","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.5","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5357","upper_optimal_position":"1","units":"g/L","description":"ApoA1 is the main protein on HDL particles, and its level reflects the functional capacity of the protective HDL system. At 1.24, this is below the desirable level of 1.4 or above. This is consistent with the HDL being just below the ideal. Regular exercise is the most effective way to raise both HDL and ApoA1.","low_causes":"Sedentary lifestyle, smoking, obesity, genetic factors","high_causes":"Regular exercise, moderate alcohol, genetics","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.25","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"ApoB is the protein found on every atherogenic lipoprotein particle (LDL, VLDL and Lp(a)), so its level directly counts how many potentially artery-damaging particles are in the blood. It is considered the single best predictor of cardiovascular risk. At 0.45, well below the desirable threshold of 0.9 and the ideal of 0.8, this is an outstanding result. There are very few harmful particles in her blood.","low_causes":"Healthy metabolism, low LDL, genetics","high_causes":"High LDL, familial hypercholesterolaemia, insulin resistance, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apobratio","name":"ApoB/A1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.362903","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3024","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA1 ratio balances the number of atherogenic particles (ApoB) against the protective particles (ApoA1). At 0.36, this is well within the lower-risk threshold of below 0.6 for a woman. This is a strong positive for cardiovascular health.","low_causes":"High HDL/ApoA1, low LDL/ApoB","high_causes":"High LDL, low HDL, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"46.64","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7288","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Lipoprotein(a) is a genetically inherited lipoprotein particle similar to LDL but with an additional protein (apolipoprotein(a)) attached. It carries cholesterol and has prothrombotic (clot-promoting) properties. At 46.64, this is above the ideal threshold of 32 but within the normal range and well below the level of about 125 nmol/L at which it is generally considered to add meaningful cardiovascular risk. It cannot be changed through diet, exercise or lifestyle. At this level, with her otherwise exceptional cardiovascular profile (ApoB 0.45, LDL 1.56, triglycerides 0.39, CRP below 0.2), it is worth knowing but does not alter her risk picture.","low_causes":"Genetics","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ck","name":"Creatine Kinase","group":"SPECIALIZED TESTS","result":"98","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4571","lower_normal":"25","upper_normal":"200","lower_optimal":"40","upper_optimal":"170","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3762","upper_optimal_position":"0.6095","units":"U/L","description":"Creatine kinase is an enzyme found in muscle, heart and brain tissue. It rises when muscle is damaged, whether from exercise, injury or disease. At 98, this is within the ideal range and confirms no muscle damage.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4554","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5804","units":"pmol/L","description":"FT4 is the unbound, active form of thyroxine, the main hormone produced by the thyroid gland. It acts as the body's storage form of thyroid hormone and is converted into the more active FT3 in the tissues. At 15.5, this is within the ideal range of 14 to 20 and confirms the thyroid is producing adequate hormone.","low_causes":"Hypothyroidism, pituitary disease, medications","high_causes":"Hyperthyroidism, thyroiditis, excess levothyroxine","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"0.81","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3728","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3440","upper_optimal_position":"0.4795","units":"mIU/L","description":"TSH is a hormone produced by the pituitary gland in the brain that tells the thyroid how hard to work. When the thyroid is underactive, TSH rises to push it harder; when overactive, TSH falls. At 0.81, this is within the laboratory range but just below the ideal band of 1.0 to 2.5. At this level, with FT4 and FT3 both within the ideal range and negative antibodies, the thyroid is functioning efficiently and a TSH just below 1.0 is not a concern.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"FT3 is the active thyroid hormone that cells actually use for energy production, metabolism and temperature regulation. At 5.2, this is right within the ideal range of 4.5 to 6.5. Good FT3 levels mean the body is converting the storage hormone (FT4) into the active form efficiently. This is a strong positive for someone reporting fatigue, because it rules out thyroid underactivity as a cause.","low_causes":"Hypothyroidism, sick euthyroid syndrome, calorie restriction, chronic illness","high_causes":"Hyperthyroidism, T3 thyrotoxicosis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"TPO antibodies are immune proteins that attack the thyroid gland when the immune system mistakenly targets it, as in Hashimoto's thyroiditis. At below 6.6, this is well below the cut-off of 13.8 and negative. There is no autoimmune attack on the thyroid.","low_causes":"Not clinically significant, normal finding","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/mL","description":"Thyroglobulin antibodies target thyroglobulin, a protein used by the thyroid to produce its hormones. At below 1.3, this is well below the 4.4 cut-off and negative. Combined with the negative TPO antibodies, autoimmune thyroid disease is excluded.","low_causes":"Normal finding","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.335","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"0.2","upper_normal":"0.45","lower_optimal":"0.27","upper_optimal":"0.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4267","upper_optimal_position":"0.6000","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the storage thyroid hormone (T4) into the active form (T3). At 0.335, this is right within the ideal range of 0.27 to 0.4, confirming efficient thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"O // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

// ---- global stats -------------------------------------------
const assessable = bms.filter(b => b.within_optimal === 'TRUE' || b.within_optimal === 'FALSE');

const optimalCount = bms.filter(b => b.within_optimal === 'TRUE').length;
const rangeCount = bms.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
const healthPct = assessable.length ? Math.round((optimalCount / assessable.length) * 100) : 0;

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
