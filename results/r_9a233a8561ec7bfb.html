ophils","name":"Neutrophils","group":"HEMATOLOGY","result":"1.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2600","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant type of white blood cell and the first responders to bacterial infection. John's neutrophil count of 1.8 is below the lower limit of 2.0. As discussed above, this is most likely driven by his very high training volume causing temporary redistribution of neutrophils to exercising muscle and repair sites. Benign ethnic neutropaenia and cannabis use are other possible contributors. The rest of his white cell differential is normal, which is reassuring.","low_causes":"Intense exercise, benign ethnic neutropaenia, viral infections, cannabis use, bone marrow suppression, certain medications","high_causes":"Bacterial infection, inflammation, stress, corticosteroid use, smoking","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3667","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Lymphocytes include T cells, B cells, and natural killer cells, which together coordinate the adaptive immune response and long-term immune memory. John's lymphocyte count of 1.2 is within the laboratory range but below the optimal band of 1.5 to 2.5. In the context of a generally low total white cell count, this is proportionate and likely reflects the same exercise-related redistribution affecting his neutrophils.","low_causes":"Intense exercise, viral infections, corticosteroid use, autoimmune conditions, chronic stress","high_causes":"Viral infections, chronic lymphocytic leukaemia, autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3333","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.3","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues where they become macrophages, engulfing bacteria, dead cells, and debris. John's monocyte count of 0.2 is at the lower boundary of the laboratory range. While this is technically within range, it sits below the optimal band and is consistent with the generally low white cell count seen across his differential.","low_causes":"Intense exercise, bone marrow suppression, certain infections","high_causes":"Chronic infections, autoimmune conditions, certain cancers, recovery from acute illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3889","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.04","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3375","upper_optimal_position":"0.5958","units":"x10^9/L","description":"Eosinophils are white blood cells involved in fighting parasitic infections and modulating allergic responses. John's eosinophil count of 0.1 is within both the lab and optimal ranges, indicating no allergic or parasitic process.","low_causes":"Corticosteroid use, acute stress, Cushing's syndrome","high_causes":"Allergies, asthma, parasitic infections, eczema, autoimmune conditions, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.02","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3704","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the least common type of white blood cell, involved in allergic reactions and inflammation. John's basophil count of 0.02 is within the normal and optimal ranges.","low_causes":"Generally not clinically significant","high_causes":"Allergic reactions, chronic inflammation, myeloproliferative disorders, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_percent","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4733","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.8","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3500","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young, newly released red blood cells. Their percentage tells us how actively the bone marrow is producing new red cells. John's reticulocyte percentage of 1.34% is within the optimal range, indicating healthy, steady red cell production.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic kidney disease, low energy availability","high_causes":"Recovery from blood loss, haemolytic anaemia, response to EPO or altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes_absolute","name":"Reticulocytes (Absolute)","group":"HEMATOLOGY","result":"64.856","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4638","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"85","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5667","units":"x10^9/L","description":"The absolute reticulocyte count gives the actual number of young red blood cells per litre of blood, which is more precise than the percentage when red cell numbers vary. John's absolute reticulocyte count of 64.9 is within the optimal range, confirming that bone marrow red cell production is healthy.","low_causes":"Iron deficiency, B12/folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Recovery from blood loss, haemolytic anaemia, EPO use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"esr","name":"Erythrocyte Sedimentation Rate","group":"INFLAMMATION","result":"1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0417","lower_normal":"0","upper_normal":"12","lower_optimal":"0","upper_optimal":"5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2083","units":"mm/hour","description":"ESR measures how quickly red blood cells settle to the bottom of a test tube over one hour. Faster settling suggests inflammation, as inflammatory proteins make red cells clump together. John's ESR of 1 mm/hour is essentially as low as it gets, confirming an absence of systemic inflammation. This is consistent with his excellent hs-CRP.","low_causes":"Generally indicates absence of inflammation (positive finding)","high_causes":"Infection, autoimmune conditions, cancer, chronic inflammation, pregnancy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"sodium","name":"Sodium","group":"ELECTROLYTES & MINERALS","result":"164.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"133","upper_normal":"146","lower_optimal":"136","upper_optimal":"143","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6103","units":"mmol/l","description":"Sodium is the primary electrolyte in the blood and plays a critical role in fluid balance, nerve transmission, and muscle contraction. John's sodium of 164.2 mmol/L is significantly above the upper limit of 146, a state called hypernatraemia. This is most commonly caused by dehydration, where water loss concentrates sodium in the blood. Given John's very high training volume and the fact that his chloride is also elevated while bicarbonate is depressed, the most likely explanation is that he was significantly dehydrated at the time of the blood draw. This needs to be repeated on a fresh sample taken when he has been drinking normally and has not exercised that morning.","low_causes":"Excessive water intake, heart failure, kidney disease, diuretic use, vomiting/diarrhoea, SIADH","high_causes":"Dehydration, insufficient fluid intake, excessive sweating, diabetes insipidus, excessive salt intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"potassium","name":"Potassium","group":"ELECTROLYTES & MINERALS","result":"5.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6481","lower_normal":"3.5","upper_normal":"5.3","lower_optimal":"3.8","upper_optimal":"4.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3519","upper_optimal_position":"0.5741","units":"mmol/l","description":"Potassium is essential for heart rhythm, muscle contraction, and nerve function. John's potassium of 5.2 mmol/L is within the laboratory range but at the upper end, sitting above the optimal ceiling of 4.8. The lab notes that potassium can be falsely elevated if the sample is delayed or remains on cells, and dehydration also concentrates potassium. This is likely artefactual and should normalise on a well-hydrated repeat sample.","low_causes":"Diuretic use, vomiting/diarrhoea, excessive sweating, poor dietary intake","high_causes":"Dehydration, haemolysis in sample, kidney disease, ACE inhibitors, potassium supplements, sample delay","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"chloride","name":"Chloride","group":"ELECTROLYTES & MINERALS","result":"111","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8974","lower_normal":"95","upper_normal":"108","lower_optimal":"98","upper_optimal":"106","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3564","upper_optimal_position":"0.6154","units":"mmol/l","description":"Chloride works alongside sodium to maintain fluid balance and acid-base equilibrium. John's chloride of 111 mmol/L is above the upper limit of 108, which is consistent with the dehydration pattern seen in his sodium. Elevated chloride alongside low bicarbonate creates what is called a hyperchloraemic metabolic acidosis, which in this context is most likely driven by dehydration and the metabolic effects of a low-carb diet. This should be repeated with the other electrolytes on a well-hydrated sample.","low_causes":"Vomiting, metabolic alkalosis, heart failure, SIADH","high_causes":"Dehydration, excessive salt intake, renal tubular acidosis, diarrhoea, hyperventilation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bicarbonate","name":"Bicarbonate","group":"ELECTROLYTES & MINERALS","result":"13.1","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0576","lower_normal":"20","upper_normal":"31","lower_optimal":"22","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3515","upper_optimal_position":"0.5758","units":"mmol/l","description":"Bicarbonate is the body's primary buffer against acidity in the blood. It neutralises acids produced by metabolism and exercise. John's bicarbonate of 13.1 mmol/L is significantly below the lower limit of 20, indicating a metabolic acidosis. In the context of a low-carb diet (which produces ketoacids), very high-intensity exercise (which produces lactic acid), and the dehydration evident from his other electrolytes, this likely reflects the cumulative acid load exceeding the body's buffering capacity at the time of the sample. This is the most important of the electrolyte findings because persistent low bicarbonate can affect kidney function and bone mineral density over time. The GP should confirm whether this normalises on a well-hydrated, rested sample.","low_causes":"Metabolic acidosis, diabetic ketoacidosis, chronic kidney disease, severe diarrhoea, intense exercise, low-carb diet","high_causes":"Metabolic alkalosis, vomiting, diuretic use, Cushing's syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urea","name":"Urea","group":"KIDNEY FUNCTION","result":"9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7133","lower_normal":"3.2","upper_normal":"8.2","lower_optimal":"3.5","upper_optimal":"7.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3400","upper_optimal_position":"0.5867","units":"mmol/l","description":"Urea is a waste product formed when the liver breaks down protein. The kidneys filter it out of the blood and excrete it in urine. John's urea of 9.0 mmol/L is above the upper limit of 8.2. On a high-protein diet, urea production is naturally higher because more protein is being metabolised. Dehydration further concentrates urea in the blood. Both factors are present here: his diet is explicitly high-protein, and his sodium and chloride indicate dehydration. This combination almost certainly explains the elevated urea. It should normalise on a repeat sample taken in a well-hydrated state.","low_causes":"Low-protein diet, liver disease, overhydration, malnutrition","high_causes":"High-protein diet, dehydration, kidney impairment, gastrointestinal bleeding, catabolic states","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"creatinine","name":"Creatinine","group":"KIDNEY FUNCTION","result":"119","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7504","lower_normal":"65","upper_normal":"104","lower_optimal":"70","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3462","upper_optimal_position":"0.6359","units":"umol/l","description":"Creatinine is a waste product produced by muscle metabolism. The kidneys filter it from the blood, so elevated levels can indicate reduced kidney function. However, creatinine is directly proportional to muscle mass, and a man training three times per week with resistance exercise and performing very high-intensity exercise will produce more creatinine simply from having more muscle. John's creatinine of 119 umol/L is above the lab's upper limit of 104. This is likely a combination of his muscle mass and the dehydration concentrating the sample. The Cystatin C-based eGFR of 70 is a more reliable assessment of his true kidney function, and this should be repeated when he is well hydrated.","low_causes":"Low muscle mass, malnutrition, liver disease","high_causes":"High muscle mass, resistance training, dehydration, creatine supplementation, kidney impairment, high-protein diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"egfr","name":"Estimated GFR (Creatinine)","group":"KIDNEY FUNCTION","result":"61","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5083","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"ml/min/1.73m2","description":"Estimated GFR (glomerular filtration rate) is a calculation based on creatinine that estimates how well the kidneys are filtering waste. John's creatinine-based eGFR of 61 sits just above the threshold of 60, below which further investigation is recommended. However, in a muscular, heavily training man, creatinine overestimates kidney impairment because the higher muscle mass produces more creatinine regardless of kidney function. His Cystatin C-based eGFR of 70, which is not affected by muscle mass, provides a more accurate estimate. Both should be repeated on a well-hydrated sample to get a true baseline.","low_causes":"Kidney disease, dehydration, high muscle mass inflating creatinine, nephrotoxic medications","high_causes":"Hyperfiltration (early diabetes), pregnancy, high cardiac output states","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"cystatin_c_egfr","name":"Cystatin C eGFR","group":"KIDNEY FUNCTION","result":"70","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"60","upper_normal":"","lower_optimal":"90","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"","description":"Cystatin C-based eGFR uses a different protein marker to estimate kidney function. Unlike creatinine, Cystatin C is produced at a constant rate by all nucleated cells and is not affected by muscle mass, making it more reliable in muscular individuals. John's Cystatin C eGFR of 70 is higher than his creatinine-based eGFR of 61, which confirms that muscle mass is inflating his creatinine. However, 70 is still below the optimal threshold of 90. The dehydration evident from his electrolyte panel is the most likely explanation, as concentrated blood will elevate Cystatin C and depress the eGFR calculation. This should be repeated when John is well hydrated.","low_causes":"Kidney disease, dehydration, nephrotoxic medications","high_causes":"Hyperfiltration, high cardiac output states","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"uric_acid","name":"Uric Acid","group":"KIDNEY FUNCTION","result":"296","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4101","lower_normal":"220","upper_normal":"547","lower_optimal":"200","upper_optimal":"380","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3272","upper_optimal_position":"0.4763","units":"umol/l","description":"Uric acid is a waste product from the breakdown of purines, which are found in certain foods (red meat, organ meats, shellfish, beer) and in the body's own cells. Elevated levels can cause gout and are associated with cardiovascular risk. John's uric acid of 296 umol/L is within the optimal range for men of 200 to 380, indicating healthy purine metabolism and adequate kidney clearance.","low_causes":"Low-purine diet, Fanconi syndrome, Wilson's disease, SIADH","high_causes":"High-purine diet, alcohol, dehydration, kidney disease, gout, metabolic syndrome, rapid cell turnover","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cystatin_c","name":"Cystatin-C","group":"KIDNEY FUNCTION","result":"1.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5000","lower_normal":"0","upper_normal":"1.1","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4091","units":"mg/l","description":"Cystatin C is a small protein produced at a constant rate by all nucleated cells. The kidneys filter it from the blood, so its concentration reflects kidney filtration efficiency. Unlike creatinine, it is not influenced by muscle mass, diet, or sex. John's Cystatin C of 1.1 mg/L is at the upper boundary of the lab range. As with his eGFR values, this is most likely elevated by dehydration concentrating the sample. A repeat when well hydrated will clarify whether this represents a true kidney concern or simply a dry sample.","low_causes":"Generally not clinically significant when low","high_causes":"Reduced kidney function, dehydration, thyroid dysfunction, corticosteroid use, inflammation","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"total_protein","name":"Total Protein","group":"LIVER & METABOLIC","result":"80","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5867","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6533","units":"g/l","description":"Total protein measures the combined amount of albumin and globulin in the blood. These proteins perform critical functions including maintaining blood pressure, transporting molecules, and fighting infection. John's total protein of 80 g/L is within the optimal range, reflecting healthy protein production by the liver and a well-functioning immune system.","low_causes":"Liver disease, malnutrition, malabsorption, kidney disease (protein loss)","high_causes":"Dehydration, chronic infection, autoimmune conditions, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"albumin","name":"Albumin","group":"LIVER & METABOLIC","result":"48","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6250","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"50","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4583","upper_optimal_position":"0.6667","units":"g/l","description":"Albumin is the most abundant protein in the blood, produced by the liver. It maintains blood pressure, transports hormones and nutrients, and is one of the best markers of nutritional status and liver synthetic function. John's albumin of 48 g/L is within the optimal range, indicating excellent liver function and good nutritional status. This is consistent with his high-protein diet and strong dietary volume.","low_causes":"Liver disease, malnutrition, chronic inflammation, kidney disease (nephrotic syndrome)","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"globulin","name":"Globulin","group":"LIVER & METABOLIC","result":"32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/l","description":"Globulin is a group of proteins that includes antibodies (immunoglobulins), transport proteins, and enzymes. John's globulin of 32 g/L is within the optimal range, indicating a healthy and balanced immune protein profile.","low_causes":"Immune deficiency, malnutrition, liver disease","high_causes":"Chronic infection, autoimmune conditions, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ag_ratio","name":"Albumin/Globulin Ratio","group":"LIVER & METABOLIC","result":"1.50","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.2","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3571","upper_optimal_position":"0.5476","units":"","description":"The albumin-to-globulin ratio compares the two major protein types in the blood. A balanced ratio indicates healthy liver function and immune status. John's ratio of 1.50 (48/32) is within the optimal range, reflecting a good balance between albumin production and immune protein levels.","low_causes":"Liver disease, chronic infection, autoimmune conditions, nephrotic syndrome","high_causes":"Immune deficiency (reduced globulin production)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"79","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4905","lower_normal":"46","upper_normal":"116","lower_optimal":"50","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3524","upper_optimal_position":"0.5905","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bones, kidneys, and intestines. It is used to assess liver and bone health. John's ALP of 79 IU/L is within the optimal range, indicating no evidence of liver obstruction or bone turnover abnormalities.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism, pernicious anaemia","high_causes":"Liver disease, bile duct obstruction, bone disease, Paget's disease, hyperparathyroidism, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bilirubin","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"13","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is a yellow pigment produced when the liver breaks down old red blood cells. Elevated levels can indicate liver disease, bile duct obstruction, or excessive red cell breakdown. John's bilirubin of 13 umol/L is within the optimal range, confirming healthy bilirubin metabolism and liver clearance.","low_causes":"Generally not clinically significant","high_causes":"Gilbert's syndrome, liver disease, haemolytic anaemia, bile duct obstruction, medication effects","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT (GPT)","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2232","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"30","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2679","units":"IU/l","description":"ALT (alanine aminotransferase) is a liver enzyme that is released into the blood when liver cells are damaged. It is one of the most sensitive markers of liver injury. John's ALT of 25 IU/L is within the optimal limit for men of below 30, indicating that his liver cells are healthy and not under metabolic stress. This is a reassuring finding.","low_causes":"Generally not clinically significant","high_causes":"Fatty liver disease, alcohol excess, medications (paracetamol, statins), viral hepatitis, intense exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST (GOT)","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3906","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5938","units":"IU/l","description":"AST (aspartate aminotransferase) is an enzyme found in the liver, heart, and muscles. It is released when these tissues are damaged. Unlike ALT, AST is not liver-specific, so elevated levels can come from muscle damage as well. John's AST of 25 IU/L is within the optimal range, confirming healthy liver and muscle tissue integrity.","low_causes":"Vitamin B6 deficiency, uraemia","high_causes":"Liver disease, heart attack, intense exercise, alcohol excess, muscle injury","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Score","group":"LIVER & METABOLIC","result":"1.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3552","lower_normal":"0","upper_normal":"1.45","lower_optimal":"0","upper_optimal":"1.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4483","units":"","description":"FIB-4 is a calculation that uses age, ALT, AST, and platelet count to estimate the likelihood of liver fibrosis (scarring). A score below 1.3 (or below 2.0 in people over 65) suggests a low probability of significant liver fibrosis. John's FIB-4 of 1.03 is well within the reassuring range, and with all his individual liver markers also being healthy, this confirms no evidence of liver fibrosis.","low_causes":"Young age, high platelets, low liver enzymes (all positive)","high_causes":"Liver fibrosis, older age, low platelets, elevated liver enzymes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1712","lower_normal":"4","upper_normal":"73","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1712","units":"IU/l","description":"Gamma GT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol, medications, and bile duct issues. It is often the first liver enzyme to rise when the liver is under strain. John's GGT of 25 IU/L is right at the optimal ceiling of 25 for men, which is a positive finding, indicating that his liver is handling its metabolic load without visible strain.","low_causes":"Generally not clinically significant","high_causes":"Alcohol excess, fatty liver disease, bile duct obstruction, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"amylase","name":"Amylase","group":"DIGESTIVE","result":"113","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4716","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3447","upper_optimal_position":"0.5758","units":"IU/L","description":"Amylase is an enzyme produced primarily by the pancreas and salivary glands that breaks down starches. Elevated levels can indicate pancreatic inflammation. John's amylase of 113 IU/L is within the laboratory range but above the optimal ceiling of 100. On a low-carb diet, the pancreas still produces amylase, and mild variation within the lab range is common. With his lipase also within range and no symptoms of pancreatic disease, this is not concerning.","low_causes":"Chronic pancreatitis (burned out), cystic fibrosis, liver disease","high_causes":"Pancreatitis, salivary gland inflammation, bowel obstruction, kidney disease, macroamylasaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lipase","name":"Lipase","group":"DIGESTIVE","result":"45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4574","lower_normal":"13","upper_normal":"60","lower_optimal":"15","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3476","upper_optimal_position":"0.6238","units":"U/L","description":"Lipase is an enzyme produced by the pancreas that breaks down fats. It is a more specific marker of pancreatic function than amylase. John's lipase of 45 U/L is within the optimal range, confirming healthy pancreatic function.","low_causes":"Generally not clinically significant","high_causes":"Pancreatitis, pancreatic cancer, bowel obstruction, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"calcium","name":"Calcium","group":"ELECTROLYTES & MINERALS","result":"2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2193","lower_normal":"2.08","upper_normal":"2.65","lower_optimal":"2.15","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3456","upper_optimal_position":"0.6228","units":"mmol/l","description":"Calcium is the most abundant mineral in the body, essential for bone structure, muscle contraction, nerve signalling, and heart rhythm. Approximately 99% of calcium is stored in bones, with only a tiny fraction circulating in blood, so blood levels are tightly regulated. John's total calcium of 2.0 mmol/L is below the lower limit of 2.08. This, combined with the even lower corrected calcium, indicates genuine hypocalcaemia (low blood calcium) that needs investigation. The lab notes that calcium can be falsely reduced in older specimens, so a repeat on a fresh, promptly processed sample is the first step.","low_causes":"Hypoparathyroidism, vitamin D deficiency, chronic kidney disease, magnesium depletion, sample degradation, malabsorption","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis, dehydration, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"corrected_calcium","name":"Corrected Calcium","group":"ELECTROLYTES & MINERALS","result":"1.85","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0417","lower_normal":"2.2","upper_normal":"2.6","lower_optimal":"2.25","upper_optimal":"2.55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3750","upper_optimal_position":"0.6250","units":"mmol/L","description":"Corrected calcium adjusts the total calcium result based on albumin levels, because about half of calcium in the blood is bound to albumin. If albumin is high or low, the correction gives a truer picture of available calcium. John's corrected calcium of 1.85 mmol/L is significantly below the lower limit of 2.2. This is the most important finding in this report. Calcium at this level, if confirmed on repeat testing, can cause muscle cramps, tingling in the fingers and around the mouth, fatigue, brain fog, and anxiety, many of which overlap with his reported symptoms. The fact that his PTH has not responded appropriately to this low calcium is the key clinical question that the GP needs to investigate.","low_causes":"Hypoparathyroidism, vitamin D deficiency, chronic kidney disease, magnesium depletion, sample degradation","high_causes":"Hyperparathyroidism, cancer, excessive vitamin D, sarcoidosis, thiazide diuretics","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"magnesium","name":"Magnesium","group":"ELECTROLYTES & MINERALS","result":"1.06","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6379","lower_normal":"0.53","upper_normal":"1.11","lower_optimal":"0.85","upper_optimal":"1.05","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.5517","upper_optimal_position":"0.6276","units":"mmol/l","description":"Magnesium is involved in over 300 enzymatic reactions including energy production, muscle function, nerve signalling, and sleep regulation. John's magnesium of 1.06 mmol/L is within the laboratory range but sits just above the optimal ceiling of 1.05. At this margin, this is essentially at the top of optimal and is a reassuring finding, particularly given his high training volume which increases magnesium losses through sweat. Magnesium plays a critical role in calcium regulation, and adequate magnesium is necessary for the parathyroid glands to function properly, so maintaining magnesium levels is relevant to the calcium finding.","low_causes":"Poor dietary intake, alcohol excess, intense exercise/sweating, diuretics, gastrointestinal losses","high_causes":"Kidney disease, excessive supplementation, dehydration, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_d","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"120","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is a hormone-like vitamin essential for calcium absorption, bone health, immune function, and mood regulation. John's vitamin D at 120 nmol/L is at the top of the optimal range of 75 to 120, which is an excellent level. This makes the low calcium finding more puzzling, because vitamin D is needed to absorb calcium from the gut, and at 120 nmol/L there should be no absorption issue. This further supports the need for GP investigation of the parathyroid axis. A maintenance dose of vitamin D through autumn and winter will help sustain this level.","low_causes":"Insufficient sun exposure, poor dietary intake, malabsorption, obesity (fat sequestration), dark skin, kidney/liver disease","high_causes":"Excessive supplementation, granulomatous diseases (sarcoidosis)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Parathyroid Hormone","group":"ELECTROLYTES & MINERALS","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3489","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3805","upper_optimal_position":"0.5571","units":"pmol/L","description":"Parathyroid hormone (PTH) is produced by four small glands behind the thyroid. Its primary role is to maintain blood calcium levels. When calcium falls, PTH should rise to pull calcium from bones, increase kidney calcium reabsorption, and activate vitamin D. John's PTH of 1.2 pmol/L is within the laboratory range of 0.98 to 4.73, but it is inappropriately low given his corrected calcium of 1.85. In a healthy feedback loop, this degree of hypocalcaemia should trigger PTH well above the mid-range. An inappropriately low or normal PTH in the face of low calcium raises the possibility of hypoparathyroidism, where the glands themselves are underperforming. The lab notes that PTH results should be viewed with caution if the sample was not centrifuged and separated on the day of sampling, so sample handling is a possible confounder. This needs GP investigation.","low_causes":"Hypoparathyroidism (autoimmune, post-surgical), magnesium depletion, sample degradation, hypercalcaemia","high_causes":"Hyperparathyroidism, vitamin D deficiency, chronic kidney disease, calcium deficiency (appropriate response)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitamin_b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"503","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4626","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.6157","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, DNA synthesis, and red blood cell formation. Deficiency can cause fatigue, brain fog, nerve tingling, and anaemia. John's B12 at 503 pg/mL sits at the lower end of the optimal range of 500 to 900. A high-protein diet including animal products typically provides adequate B12, and this level confirms sufficient intake. No supplementation is required, though maintaining dietary intake of B12-rich foods (meat, fish, eggs) will keep this at a healthy level.","low_causes":"Vegetarian/vegan diet, malabsorption (coeliac, Crohn's), pernicious anaemia, metformin use, ageing","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for DNA synthesis, red blood cell production, and methylation processes that regulate gene expression. John's folate of 11 ng/mL is within the optimal range, indicating good dietary intake from green vegetables, legumes, and fortified foods.","low_causes":"Poor dietary intake, alcohol excess, malabsorption, pregnancy, certain medications (methotrexate, phenytoin)","high_causes":"Supplementation, high dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hscrp","name":"High-Sensitivity CRP","group":"INFLAMMATION","result":"0.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0400","lower_normal":"0","upper_normal":"5","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.1000","units":"mg/l","description":"High-sensitivity CRP (C-reactive protein) is the most precise measure of systemic inflammation in the body. CRP is produced by the liver in response to inflammatory signals from any source: infection, injury, metabolic stress, or chronic disease. John's hs-CRP of 0.4 mg/L is within the optimal zone below 1.0, indicating minimal systemic inflammation. At a BMI of 30.7, where body fat itself is an inflammatory tissue, a CRP this low is genuinely impressive and suggests that his high activity level and dietary approach are keeping inflammation well controlled.","low_causes":"Good health, anti-inflammatory diet, regular exercise, low body fat","high_causes":"Infection, chronic inflammation, obesity, autoimmune disease, cardiovascular risk, smoking, poor diet","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cholesterol","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5599","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol measures all cholesterol in the blood, including HDL (protective), LDL (atherogenic), and VLDL. John's total cholesterol of 5.8 mmol/L is above the desirable level of 5.18. However, total cholesterol alone is a poor predictor of cardiovascular risk because it includes HDL, which is protective. John's HDL is exceptionally high at 2.1, which inflates his total cholesterol in a beneficial way. The more meaningful markers are his LDL, ApoB, and the TC/HDL ratio, which is an excellent 2.76.","low_causes":"Malnutrition, hyperthyroidism, liver disease, malabsorption","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, low-carb/keto diets, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"triglycerides","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2912","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are fats carried in the blood, primarily reflecting recent dietary fat and carbohydrate intake. High levels are associated with increased cardiovascular risk and metabolic syndrome. John's triglycerides of 0.99 mmol/L are within the optimal zone below 1.0, which is an excellent result. Low-carb diets typically produce favourable triglyceride levels, and this confirms that his dietary approach is working well for this marker.","low_causes":"Low-fat diet, malabsorption, hyperthyroidism, malnutrition","high_causes":"High-carbohydrate diet, alcohol excess, obesity, metabolic syndrome, diabetes, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldl","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.45","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2885","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) carries triglycerides from the liver to tissues. Elevated VLDL is associated with increased cardiovascular risk. John's VLDL of 0.45 mmol/L is within the optimal range, consistent with his excellent triglyceride level.","low_causes":"Low-fat diet, malabsorption","high_causes":"High-carb diet, obesity, metabolic syndrome, diabetes, alcohol excess","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7500","lower_normal":"1.04","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6731","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) cholesterol is often called 'good' cholesterol because it removes excess cholesterol from arteries and transports it back to the liver for disposal. Higher HDL is protective against cardiovascular disease. John's HDL of 2.1 mmol/L is well above the optimal threshold of 1.4 for men and is an outstanding result. This level of HDL provides significant cardiovascular protection and partially offsets the risk from his elevated LDL and ApoB. High HDL like this is often seen in people who are very physically active, which is consistent with John's training volume.","low_causes":"Sedentary lifestyle, obesity, smoking, high-carb/low-fat diet, metabolic syndrome, genetic factors","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.31","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5517","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) cholesterol carries cholesterol from the liver to tissues and arteries. When LDL particles penetrate artery walls, they trigger plaque formation, which is the primary mechanism of atherosclerosis. John's LDL of 3.31 mmol/L is above the lab upper limit of 3.0 and above the optimal target of 2.6. In the context of his excellent HDL and triglycerides, this is a pattern sometimes seen on low-carb, high-protein diets where the metabolic profile is favourable but LDL particle count drifts up. The ApoB result of 1.19, which directly counts atherogenic particles, confirms this is a genuine elevation rather than just large, fluffy LDL particles.","low_causes":"Hyperthyroidism, liver disease, malabsorption, very low-fat diet, statins","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia, hypothyroidism, obesity, low-carb/keto diets, diabetes","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tc_hdl_ratio","name":"TC/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"2.76","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3067","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"3.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3889","units":"","description":"The total cholesterol to HDL ratio is one of the best overall predictors of cardiovascular risk. A lower ratio indicates more protective HDL relative to total cholesterol. John's ratio of 2.76 is well within the optimal zone below 3.5 and below the upper limit of 4.5. This is an excellent result that reflects his outstanding HDL level.","low_causes":"Very high HDL (positive finding)","high_causes":"Low HDL, high total cholesterol, metabolic syndrome, sedentary lifestyle","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl_percent","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"36.21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6034","lower_normal":"20","upper_normal":"","lower_optimal":"30","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the circulating cholesterol is in the protective HDL form. A higher percentage is better. John's HDL percentage of 36.21% is excellent, meaning over a third of his total cholesterol is the protective kind. This is well above the minimum of 20% and above the optimal threshold of 30%.","low_causes":"Low HDL, high total cholesterol, metabolic syndrome, sedentary lifestyle","high_causes":"Very high HDL, regular exercise, genetic factors","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"non_hdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4625","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4125","units":"mmol/l","description":"Non-HDL cholesterol is calculated by subtracting HDL from total cholesterol. It captures all the potentially atherogenic cholesterol fractions (LDL, VLDL, and remnants) in a single number. John's non-HDL cholesterol of 3.7 mmol/L is within the lab range below 4.0 but above the optimal ceiling of 3.3. This is consistent with his elevated LDL and ApoB and should respond to the same dietary modifications.","low_causes":"Low LDL, very low-fat diet, statins","high_causes":"High LDL, elevated triglycerides, high saturated fat diet, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa1","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.69","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7042","lower_normal":"1.2","upper_normal":"","lower_optimal":"1.4","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5833","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 (ApoA1) is the main protein component of HDL cholesterol and reflects the number and quality of protective HDL particles. Higher ApoA1 is associated with better cardiovascular protection. John's ApoA1 of 1.69 g/L is well above the minimum of 1.2 and above the optimal threshold of 1.4, consistent with his excellent HDL level.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic factors, chronic kidney disease","high_causes":"Regular exercise, moderate alcohol intake, genetic factors, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.19","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6611","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the most important lipid marker in this report. Each atherogenic lipoprotein particle (LDL, VLDL, IDL, Lp(a)) carries exactly one ApoB molecule, so ApoB is a direct count of all the particles capable of embedding in artery walls and forming plaque. John's ApoB of 1.19 g/L is significantly above the target of 0.9 and sits at the boundary between borderline high and high. This tells us that the number of atherogenic particles in his blood is elevated, and this is the primary cardiovascular concern in this report. The target should be to bring ApoB below 0.9 through dietary modification, primarily by increasing soluble fibre and reducing saturated fat.","low_causes":"Low-fat diet, statins, hyperthyroidism, malabsorption","high_causes":"High saturated fat diet, familial hypercholesterolaemia, low-carb diets, hypothyroidism, diabetes, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apob_a1_ratio","name":"ApoB/ApoA1 Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.704","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5029","lower_normal":"0","upper_normal":"0.7","lower_optimal":"0","upper_optimal":"0.6","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"","description":"The ApoB/ApoA1 ratio compares the number of atherogenic (harmful) particles to the number of protective HDL particles. It is one of the most powerful predictors of cardiovascular risk. John's ratio of 0.704 is marginally above the lower risk threshold of 0.7, placing him in the average risk category (0.7 to 0.9) rather than the lower risk category. Given his outstanding ApoA1 of 1.69, the ratio is being driven up entirely by the elevated ApoB. Reducing ApoB below 0.9 would bring this ratio comfortably into the lower risk zone.","low_causes":"Low ApoB and/or high ApoA1 (positive finding)","high_causes":"High ApoB (elevated atherogenic particles), low ApoA1 (reduced protective particles)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"39.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6238","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a) is a specialised lipoprotein particle that is entirely genetically determined. Its level is set by inherited genes and cannot be meaningfully changed by diet, exercise, or most medications. Lp(a) increases cardiovascular risk through three mechanisms: it delivers cholesterol into artery walls like LDL, it promotes blood clotting by interfering with the clot-dissolving system, and it drives local inflammation at sites of plaque formation. John's Lp(a) of 39.92 nmol/L is above the 32 nmol/L threshold, placing him in the slightly increased risk category (32 to 90). This is not a dramatically elevated result, but it means that his elevated ApoB carries somewhat more weight than it would with a normal Lp(a). This result should be recorded permanently in his medical notes because it will never change, and his first-degree relatives (brothers, sons, father) should be offered testing because the trait is inherited.","low_causes":"Genetic variation (favourable)","high_causes":"Genetic variation (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tg_hdl_ratio","name":"TG/HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1567","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride-to-HDL ratio is a powerful marker of insulin resistance and metabolic health. A ratio below 0.87 is considered optimal, and lower values indicate better metabolic function. John's ratio of 0.47 (calculated as 0.99 / 2.1) is excellent, confirming outstanding metabolic health despite his elevated total cholesterol and LDL. This ratio supports the interpretation that his metabolic machinery is functioning very well.","low_causes":"Excellent metabolic health, high HDL, low triglycerides (all positive)","high_causes":"Insulin resistance, metabolic syndrome, high-carb diet, obesity, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnant_cholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.39","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2438","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles, which are increasingly recognised as an independent cardiovascular risk factor. John's remnant cholesterol of 0.39 mmol/L (5.8 - 2.1 - 3.31 = 0.39) is within the optimal range below 0.5, indicating that triglyceride-rich remnant particles are not contributing meaningfully to his cardiovascular risk.","low_causes":"Low triglycerides, good metabolic health (positive finding)","high_causes":"High triglycerides, metabolic syndrome, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"creatine_kinase","name":"Creatine Kinase","group":"LIVER & METABOLIC","result":"306","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6310","lower_normal":"40","upper_normal":"320","lower_optimal":"50","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3452","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase (CK) is an enzyme found predominantly in muscle tissue. It is released into the blood when muscles are damaged or under heavy use. John's CK of 306 U/L is near the upper end of the lab range of 40 to 320 but above the optimal ceiling of 250. For someone training at his intensity, with three resistance sessions plus five or more cardio sessions per week, this level of muscle enzyme release is entirely expected and is a marker of training load rather than pathology. No action is needed.","low_causes":"Low muscle mass, sedentary lifestyle, muscle wasting disorders","high_causes":"Intense exercise (most common), rhabdomyolysis, statin use, muscle injury, hypothyroidism, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"17.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5149","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the inactive form of thyroid hormone that circulates in the blood and is converted into the active form (T3) in tissues. John's FT4 of 17.6 pmol/L is within the optimal range of 14 to 20, indicating that his thyroid gland is producing a healthy amount of hormone.","low_causes":"Hypothyroidism, pituitary dysfunction, severe illness, certain medications","high_causes":"Hyperthyroidism (Graves' disease), thyroiditis, excessive thyroid medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.54","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4117","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3692","upper_optimal_position":"0.4887","units":"mIU/l","description":"TSH (thyroid stimulating hormone) is produced by the pituitary gland in the brain to tell the thyroid how much hormone to produce. It acts like a thermostat: when thyroid hormone is low, TSH rises to push the thyroid harder; when thyroid hormone is adequate, TSH stays low. John's TSH of 1.54 mIU/L sits within the optimal range of 1.0 to 2.5, indicating that the pituitary is happy with the amount of thyroid hormone being produced. This rules out thyroid dysfunction as a cause of his fatigue.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary dysfunction","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5185","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4556","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active form of thyroid hormone that directly drives metabolism, energy production, and heat generation in every cell. John's FT3 of 5.1 pmol/L is within the optimal range of 4.5 to 6.5, confirming that his body is efficiently converting the inactive T4 into the active T3 form. Good T3 levels are important for energy, mood, and cognitive function.","low_causes":"Hypothyroidism, poor T4-to-T3 conversion, chronic illness, calorie restriction, selenium deficiency","high_causes":"Hyperthyroidism, T3 supplementation, thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpo_antibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced by the immune system when it mistakenly attacks the thyroid gland, as occurs in the autoimmune condition Hashimoto's thyroiditis. John's TPO antibodies are below 6.6 U/mL, well within the normal range below 13.8, effectively ruling out autoimmune thyroid disease.","low_causes":"Normal finding (positive)","high_causes":"Hashimoto's thyroiditis, Graves' disease, other autoimmune conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulin_antibodies","name":"Thyroglobulin Antibodies","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1477","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are another marker of autoimmune thyroid activity. Over 80% of the population have undetectable levels. John's result of below 1.3 U/mL is well within the normal range, further confirming that his thyroid is healthy and not under autoimmune attack.","low_causes":"Normal finding (positive)","high_causes":"Hashimoto's thyroiditis, Graves' disease, thyroid cancer follow-up","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.64","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1280","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4","units":"ng/ml","description":"Prostate-specific antigen (PSA) is a protein produced by the prostate gland. While it is not specific to cancer (it can be elevated by benign prostate enlargement, infection, or recent activity), it is the primary screening tool for prostate health. John specifically requested this test, and his PSA of 0.64 ng/mL is very low against the limit of 2.5. This is an excellent baseline result to have on record at 49. It provides a reference point for future monitoring, as changes in PSA over time are often more informative than a single reading.","low_causes":"Normal finding","high_causes":"Benign prostate enlargement (BPH), prostatitis, prostate cancer, recent ejaculation, cycling","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_free","name":"PSA (Free)","group":"PROSTATE","result":"0.19","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1056","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA measures the proportion of PSA circulating unbound in the blood. When interpreted as a ratio against total PSA, it helps distinguish between benign and malignant causes of elevated PSA. A higher free-to-total ratio favours benign causes. John's free PSA of 0.19 ug/L is within range.","low_causes":"Generally not assessed in isolation","high_causes":"Benign prostate enlargement, age-related prostate growth","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psa_ratio","name":"PSA Free/Total Ratio","group":"PROSTATE","result":"0.297","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.7816","lower_normal":"0.19","upper_normal":"","lower_optimal":"0.25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.6579","upper_optimal_position":"1","units":"","description":"The PSA free-to-total ratio of 29.7% is well above the reassurance threshold of 19% and above the optimal threshold of 25%. A ratio above 25% strongly favours benign prostate tissue as the source of any PSA, rather than malignancy. Combined with the very low total PSA, John's prostate health looks excellent.","low_causes":"Higher probability of prostate malignancy (below 15% is concerning)","high_causes":"Benign prostate tissue (reassuring finding)","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ca19_9","name":"CA 19-9","group":"TUMOR MARKERS","result":"39.07","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5280","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker most commonly associated with pancreatic and biliary tract conditions. However, it is not specific and can be mildly elevated in a range of benign conditions including gallstones, biliary inflammation, pancreatitis, liver disease, and even some lung and gastrointestinal conditions. John's CA 19-9 of 39.07 U/mL is marginally above the upper limit of 37, just 5% above the cut-off. With all his liver enzymes, amylase, lipase, and CRP completely normal, this is very unlikely to represent significant pathology. However, any tumour marker above range should be noted, repeated in three months, and if persistently elevated, investigated with imaging. Approximately 5 to 10% of the population of European ancestry cannot produce CA 19-9 at all (Lewis antigen negative), while others naturally run slightly above the cut-off without pathology.","low_causes":"Lewis antigen negative blood type (cannot produce this marker)","high_causes":"Pancreatic cancer, biliary tract disease, gallstones, pancreatitis, liver disease, lung disease, ovarian conditions","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3413","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"Carcinoembryonic antigen (CEA) is a protein that can be elevated in certain cancers, particularly colorectal, but also in smokers, inflammatory bowel disease, and liver conditions. John's CEA of 1.57 ng/mL is well within the non-smoker range of 0 to 2.3, which is reassuring.","low_causes":"Normal finding","high_causes":"Colorectal cancer, other gastrointestinal cancers, smoking, inflammatory bowel disease, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"12.9","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5579","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"g/l","description":"Immunoglobulin G (IgG) is the most abundant antibody in the blood and provides long-term immune protection against previously encountered infections. John's IgG of 12.9 g/L is within the laboratory range of 6.5 to 16, indicating a healthy, functioning adaptive immune system.","low_causes":"Immune deficiency, certain medications (rituximab, chemotherapy), chronic kidney disease","high_causes":"Chronic infection, autoimmune conditions, liver disease, multiple myeloma","padding":"1","one_sided":"0.5","range_typ   .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}
const num = (v) => (v === '' || v == null ? null : parseFloat(v));

function groupStatus(names) {
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  const rp = num(b.result_position); if (rp == null) return '';
  const lnp = num(b.lower_normal_position), unp = num(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = num(b.lower_optimal_position), uo = num(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}
