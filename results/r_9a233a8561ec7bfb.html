<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}
.gate-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:46px 40px;max-width:410px;width:90%;text-align:center;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);overflow:hidden}
.gate-card>*{position:relative}
@keyframes spin{to{transform:rotate(360deg)}}
/* gate-logo replaced by .gate-logo-img */
.gate-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.55}
.gate-label{display:block;text-align:left;font-size:12.5px;font-weight:600;color:var(--text2);margin-bottom:8px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:15px;color:var(--text);font-family:inherit;font-size:17px;text-align:center;letter-spacing:2px;outline:none;transition:.18s}
.gate-input:focus{border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.gate-input.shake{animation:shake .4s;border-color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

const REPORT_DATA = {"patient_name":"John Whittaker","dob":"26/04/1977","report_date":"2026-08-17","summary":"John is a 49-year-old male presenting with a BMI of 30.7, following a low-carb, high-protein diet rated 6 out of 10 for quality with a volume of 9 out of 10. He trains at least eight times per week, with five or more cardio sessions and three resistance sessions, alongside 10,000 to 15,000 daily steps, which is a very high training load. He uses recreational THC drops to help him relax and reports no other medications or conditions. He reports brain fog, low sex drive, and low energy. His goals are to lose body fat, improve mood, and improve long-term health and longevity. He specifically requested PSA screening, noting he has never had one done and feels it is overdue at his age.\n\nThere are two findings in this report that should go to his GP promptly. The first is his corrected calcium, which at 1.85 is significantly below the lower limit of 2.2. Calcium is essential for nerve signalling, muscle contraction, heart rhythm, and bone integrity, and levels this far below range are not something to sit on. His parathyroid hormone (PTH), the hormone that should rise to rescue low calcium, is only 1.2, which is within the laboratory range of 0.98 to 4.73 but inappropriately low for the degree of calcium deficit. In a healthy feedback loop, the parathyroid glands detect falling calcium and flood the blood with PTH to pull calcium from bone, increase kidney reabsorption, and activate vitamin D. The fact that PTH has not responded raises the possibility of hypoparathyroidism, where the glands themselves are underperforming, or a vitamin D pathway issue, although his vitamin D level at 120 is excellent. The lab does note that calcium can be falsely reduced in older specimens, so this could be a sample handling artefact, but at this margin below range the GP should repeat this on a fresh, promptly processed sample and, if confirmed, investigate parathyroid function. ve on record. His immune system markers, immunoglobulins IgG, IgM, IgA, and IgE, are all within their respective ranges, and rheumatoid factor is negative. His coeliac screen (tissue transglutaminase IgA) is negative. His urinalysis is clean, with no protein, no glucose, no blood, no white cells, no nitrites, and no significant bacterial growth. The lab noted the sample was received in a plain bottle without boric acid preservative, so the insignificant skin flora growth is expected contamination rather than infection.\n\nTurning to the concerns beyond the calcium and electrolytes. His C-Peptide is flagged low at 0.56 ug/L, which converts to approximately 185 pmol/L, against a lab range starting at 1.1 ug/L (364 pmol/L). C-Peptide is released by the pancreas in equal measure to insulin and is the most reliable marker of how much insulin the body is producing. However, in the context of a low-carb diet, excellent blood sugar control, and a HOMA-IR of 0.62, this low C-Peptide simply reflects low insulin demand rather than pancreatic failure. The pancreas is not struggling; it is coasting because the diet is not asking it to work hard. The lab also notes that samples not separated within four hours can see C-Peptide degrade to 44% of baseline, so sample handling may have exaggerated the low reading. This does not require GP action unless future glucose or HbA1c values start to climb.\n\nHis white blood cell count is 3.32, below the lower limit of 4.0, driven by neutrophils at 1.8 against a lower limit of 2.0. Neutrophils are the immune system's front-line defence against bacterial infection. A mildly low count in someone training at this intensity, with excellent diet volume and low body fat ambitions, could reflect a phenomenon called exercise-induced neutropaenia, where the immune system temporarily redistributes white cells after repeated bouts of intense exercise. Benign ethnic neutropaenia is another possibility in people of European ancestry, though it is more common in people of African or Middle Eastern descent. Cannabis use has also been associated with mild immune cell suppression. His lymphocytes at 1.2 are within range, and the rest of the white cell differential is normal. This is not alarming at a single time point, but it is worth monitoring, and if he finds he is catching infections more frequently, the GP should repeat a full blood count.\n\nHis lipid profile tells an interesting story. His HDL cholesterol at 2.1 is outstanding, well above the optimal threshold of 1.4 for men, and his triglycerides at 0.99 are within the optimal zone below 1.0. His TC/HDL ratio at 2.76 and his HDL percentage of total cholesterol at 36% are both excellent markers of cardiovascular efficiency. However, his LDL at 3.31 is above the 3.0 upper limit and above the optimal target of 2.6, and his ApoB (apolipoprotein B, a direct count of the atherogenic particles that drive plaque formation) is 1.19, well above the 0.9 target and sitting at the boundary between borderline high and high. His ApoB to ApoA1 ratio is 0.70, which is right at the threshold, placing him at average rather than lower cardiovascular risk. His Lp(a) is 39.92 nmol/L, above the 32 nmol/L threshold. Lp(a) is entirely genetically determined, cannot be changed by diet or exercise, and is a permanent entry in his medical record. It works by making LDL particles stickier and more prone to embedding in artery walls, while also promoting clotting. At 39.92 it represents a slightly increased risk rather than a dramatically elevated one, but it does mean that his elevated ApoB carries a little more weight than it would with a normal Lp(a). The combination of excellent HDL, excellent triglycerides, but elevated LDL and ApoB is a pattern sometimes seen on low-carb, high-protein diets. The metabolic markers are all favourable, suggesting the diet is working well for insulin sensitivity, but the LDL particle count has drifted up. Given the Lp(a) finding, it would be worth discussing with his GP whether targeted dietary modifications, specifically increasing soluble fibre, increasing oily fish to three portions per week, and moderately reducing saturated fat from animal sources, could bring ApoB below 0.9 without losing the metabolic benefits of his current approach. His first-degree relatives should also be offered Lp(a) testing, as the trait is inherited.\n\nHis kidney function picture needs careful interpretation. The creatinine-based eGFR of 61 sits just above the threshold of 60 and looks low for a 49-year-old, but creatinine is heavily influenced by muscle mass, and a man training eight-plus times per week with three resistance sessions will produce more creatinine simply from greater muscle turnover. His Cystatin C, a kidney marker that is not affected by muscle mass, gives an eGFR of 70, which is higher but still below the optimal threshold of 90. His Cystatin C itself at 1.1 is right at the upper limit. The most likely explanation is the dehydration evident from the sodium and chloride results, which concentrates both creatinine and Cystatin C in the blood and temporarily depresses the eGFR calculation. Once the electrolytes are repeated on a well-hydrated sample, the kidney markers should be repeated at the same time. If the Cystatin C eGFR remains below 90 on a hydrated sample, further investigation would be appropriate. His uric acid at 296 is within range and within the optimal band for men.\n\nHis CA 19-9 tumour marker is 39.07, marginally above the upper limit of 37. CA 19-9 is a marker most commonly associated with pancreatic and biliary tract conditions, but it is not specific. It can be raised by benign conditions including inflammation, biliary stasis, and even benign cysts. At this margin, just 5% above the cut-off, and with his amylase, lipase, liver enzymes, and CRP all completely normal, this is very likely to be a statistical outlier or benign variation. However, because it is above range, the GP should be made aware and it should be repeated in three months. If it remains elevated or rises, imaging of the pancreas and biliary tract would be the next step. His CEA at 1.57 and PSA at 0.64 are both reassuringly normal.\n\nHis total antioxidant activity (TAA) at 2.38 is above the upper range of 1.77, which in practice reflects either supplementation with antioxidant-rich compounds or a diet high in polyphenols and coloured vegetables. This is not a clinical concern and if anything reflects a body with good antioxidant defences.\n\nHis MCH (mean corpuscular haemoglobin, the average amount of haemoglobin per red blood cell) at 32.2 is marginally above the upper limit of 32. His MCHC at 341, MCV at 94.3, and RDW at 14.2 are all within range, and his red cell count, haemoglobin, and haematocrit are healthy. A marginally elevated MCH with everything else normal is almost always laboratory variation rather than a clinical finding. His iron studies are healthy, with ferritin at 56 within the optimal band, transferrin saturation at 37.8% in the optimal range of 25 to 40%, and serum iron, transferrin, and iron binding capacity all within range.\n\nHis magnesium at 1.06 is within the laboratory range but sits just above the optimal ceiling of 1.05, which at this margin is essentially optimal. His vitamin D at 120 nmol/L is in the optimal band of 75 to 120. His B12 at 503 is within the optimal range of 500 to 900. His folate at 11 is within range and above the optimal floor of 8. His cortisol at 351 is within the expected morning range and does not suggest adrenal dysfunction. His oestradiol at 126 is within range for a man, and his progesterone at 0.94 is just inside the male reference range. His prolactin, LH, and FSH are all within their respective ranges. His creatine kinase at 306 is within range at 40 to 320, though at the upper end, which is entirely expected for someone training at his intensity and is not a concern.","links":"The most important next step is a GP appointment to address three findings. First, the corrected calcium of 1.85 with an inappropriately low PTH of 1.2 needs to be repeated on a fresh, promptly processed blood sample. John should mention to his GP that the PTH did not rise in response to the low calcium, raising the possibility of hypoparathyroidism, and that the lab noted calcium can be falsely reduced in older specimens. If the repeat confirms low calcium with a flat PTH response, the GP may wish to check ionised calcium, 24-hour urinary calcium, and consider referral to endocrinology. Second, the sodium of 164.2, chloride of 111, and bicarbonate of 13.1 need repeating on a sample taken when John has been drinking normally for at least 24 hours and has not exercised that morning. These are most likely driven by dehydration, but the GP should confirm this. The numbers to bring to the appointment are: corrected calcium 1.85 (range 2.2 to 2.6), PTH 1.2 (range 0.98 to 4.73), sodium 164.2 (range 133 to 146), chloride 111 (range 95 to 108), bicarbonate 13.1 (range 20 to 31), urea 9.0 (range 3.2 to 8.2), creatinine 119 (range 65 to 104), creatinine-based eGFR 61, Cystatin C eGFR 70, and CA 19-9 at 39.07 (range below 37). Third, the CA 19-9 should be repeated in three months. If it normalises, no further action is needed. If it remains elevated, pancreatic and biliary imaging would be appropriate.\n\nFor the Lp(a) finding, John should ask his GP to record it permanently in his medical notes as it is genetically fixed and will not change. First-degree relatives, particularly brothers, sons, and his father if alive, should be offered Lp(a) testing.\n\nRegarding his lipid profile, the goal should be to bring ApoB below 0.9 without abandoning the metabolic advantages of his current dietary approach. The most effective dietary changes for lowering ApoB are increasing soluble fibre to 10 to 15 grams per day from sources such as oats, barley, beans, lentils, flaxseed, and psyllium husk; eating oily fish (salmon, mackerel, sardines, anchovies) three times per week; and moderately reducing saturated fat from red meat, butter, cheese, and coconut oil, replacing some of it with olive oil, avocado, and nuts. These changes can reduce LDL and ApoB by 10 to 15% without affecting insulin sensitivity.\n\nFor hydration, given the electrolyte picture and the training volume, John should aim for a minimum of three litres of water per day on rest days and four litres or more on training days, sipping throughout the day rather than loading before or after sessions. Adding a pinch of salt and a squeeze of lemon to water can support electrolyte balance during heavy training. On blood test days, he should drink normally the evening before and the morning of, and avoid exercising before the blood draw.\n\nFor body composition, at 95 kg, 176 cm, and a BMI of 30.7, with his training volume and stated goal of fat loss, a reasonable target would be to reach 85 to 88 kg over six to nine months, which would bring his BMI to approximately 27 to 28. His estimated maintenance calories at his current activity level (very active multiplier of 1.75) would be approximately 2,900 to 3,050 kcal per day. A moderate deficit of 400 to 500 kcal, targeting 2,400 to 2,600 kcal per day, would produce steady fat loss of 0.4 to 0.5 kg per week without compromising training performance or recovery. His protein intake should remain high at 140 to 160 grams per day (approximately 1.5 to 1.7 g per kg of body weight), which will support muscle preservation during the deficit and is consistent with his current high-protein dietary approach.\n\nFor his reported brain fog and fatigue, the electrolyte abnormalities and low calcium are the most likely contributors from this blood panel. If these normalise on repeat testing and the symptoms persist, further investigation including sleep quality assessment would be warranted. His thyroid, B12, folate, iron, and cortisol are all healthy, so the common nutritional causes have been excluded. Cannabis, even in the form of THC drops, can contribute to brain fog the day after use, particularly if used in the evening. If the symptoms track with the days following use, reducing frequency may help.\n\nFor his low libido, his testosterone and free testosterone are excellent, which means the cause is more likely to be multifactorial. Chronic fatigue itself suppresses desire, as can overtraining, poor sleep, and the neurochemical effects of regular THC use. If the calcium and electrolyte issues are resolved and energy improves, libido often follows. If it does not, a more detailed assessment of sleep architecture and stress load would be the next step.\n\nFor retest timing, the electrolytes, calcium, PTH, kidney markers (creatinine, Cystatin C, eGFR), and CA 19-9 should be repeated in eight to twelve weeks. A full lipid panel including ApoB should be repeated in four to six months after implementing the dietary modifications, to assess whether ApoB has responded. The white blood cell count and neutrophils should be repeated at the same time.","flags":"GP-URGENT: Corrected calcium 1.85 mmol/L (range 2.2 to 2.6), significantly below range. PTH 1.2 pmol/L (range 0.98 to 4.73), inappropriately low for the degree of hypocalcaemia. This combination raises the possibility of hypoparathyroidism or sample degradation. Recommend repeat on a fresh, promptly processed sample. If confirmed, ionised calcium, 24-hour urinary calcium, and endocrine referral are appropriate.\n\nGP-URGENT: Sodium 164.2 mmol/L (range 133 to 146), chloride 111 mmol/L (range 95 to 108), bicarbonate 13.1 mmol/L (range 20 to 31). This electrolyte pattern is consistent with significant dehydration and possible non-anion-gap metabolic acidosis. Most likely driven by high training volume and inadequate fluid intake on the day of sampling, but requires confirmation on a repeat sample taken in a euhydrated state. Urea mildly raised at 9.0 (range 3.2 to 8.2), consistent with dehydration.\n\nKIDNEY: Creatinine 119 umol/L (range 65 to 104), creatinine-based eGFR 61 (threshold above 60), Cystatin C 1.1 mg/L (limit below 1.1), Cystatin C eGFR 70. The elevated creatinine is likely multifactorial: high muscle mass from resistance training and dehydration concentrating the sample. The Cystatin C eGFR at 70, while better than creatinine-based, is still below the optimal threshold of 90. Should be repeated on a well-hydrated sample. If Cystatin C eGFR remains below 90 when hydrated, further investigation of renal function is appropriate.\n\nLIPIDS: LDL 3.31 mmol/L (range 0.5 to 3.0), ApoB 1.19 g/L (target below 0.9), ApoB/A1 ratio 0.70 (target below 0.7), Lp(a) 39.92 nmol/L (target below 32). Elevated atherogenic particle count with slightly raised inherited Lp(a). HDL 2.1 and triglycerides 0.99 are both excellent, suggesting good metabolic health despite elevated LDL/ApoB. Dietary modification targeting soluble fibre and saturated fat reduction recommended as first-line approach. Lp(a) is genetically fixed and should be recorded permanently. First-degree relatives should be offered testing.\n\nTUMOUR MARKERS: CA 19-9 at 39.07 U/mL (range below 37), marginally above range. All pancreatic and liver enzymes are normal. CRP 0.4. Most likely benign variation at this margin. Recommend repeat in three months. If persistently elevated, pancreatic and biliary imaging appropriate.\n\nHAEMATOLOGY: White cell count 3.32 (range 4.0 to 10.0), neutrophils 1.8 (range 2.0 to 7.0). Mild leucopaenia and neutropaenia, likely exercise-induced or benign ethnic variation. Cannabis use may contribute. Monitor and repeat with next panel.\n\nGLUCOSE: C-Peptide 0.56 ug/L (range 1.1 to 4.4), below lab range. In the context of low-carb diet, fasting insulin 2.67, HOMA-IR 0.62, and normal glucose and HbA1c, this reflects low insulin demand rather than pancreatic insufficiency. Lab notes sample degradation may contribute. No action required unless glucose or HbA1c begin to rise.\n\nMINOR: MCH 32.2 pg (range 27 to 32), marginally above range. All other red cell indices normal. Laboratory variation. Total cholesterol 5.8, above the desirable threshold of 5.18, driven by the elevated LDL and addressed in the lipid recommendations above.\n\nReassuring negatives: PSA 0.64 with free ratio 29.7%, excluding prostate concerns. CEA 1.57, normal. Thyroid function optimal with negative antibodies. Liver function entirely normal with FIB-4 1.03. hs-CRP 0.4, minimal systemic inflammation. ESR 1. HbA1c 34, excellent glycaemic control. Iron studies balanced. Testosterone 27.1, outstanding for age. Coeliac screen negative. Urinalysis clean. Rheumatoid factor negative. All immunoglobulins within range.","recommendations":"1. Book a GP appointment within two weeks to discuss the low corrected calcium (1.85, range 2.2 to 2.6) with inappropriately flat PTH response, the electrolyte abnormalities (sodium 164.2, chloride 111, bicarbonate 13.1), and the marginally raised CA 19-9 (39.07, range below 37). Bring this report or the specific numbers listed in the links section.\n\n2. Increase daily water intake to a minimum of three litres on rest days and four litres or more on training days. Sip throughout the day. Add a pinch of salt and a squeeze of citrus to water during and after training to support electrolyte balance. Do not exercise before future blood draws, and drink normally the evening before and morning of testing.\n\n3. Record the Lp(a) result of 39.92 nmol/L permanently in medical notes. Offer Lp(a) testing to first-degree relatives (brothers, sons, father).\n\n4. To reduce ApoB from 1.19 toward the 0.9 target: add 10 to 15 grams of soluble fibre daily (oats, psyllium husk, flaxseed, beans, lentils); eat oily fish three times per week; moderately reduce saturated fat from red meat, butter, cheese, and coconut oil, replacing with olive oil, avocado, and nuts.\n\n5. Target a calorie intake of 2,400 to 2,600 kcal per day to achieve gradual fat loss toward 85 to 88 kg. Maintain protein at 140 to 160 grams per day to preserve muscle mass.\n\n6. Improve diet quality from its current rating of 6 out of 10 by increasing vegetable diversity, particularly leafy greens (a natural source of calcium, magnesium, and folate), and including more whole food carbohydrate sources such as sweet potatoes, quinoa, and legumes, which also provide the soluble fibre needed for cholesterol reduction.\n\n7. Consider whether THC drop use correlates with days of worse brain fog and fatigue. If so, reducing frequency may help. THC can also suppress immune cell activity, which may be contributing to the mildly low white cell count.\n\n8. Repeat bloods in eight to twelve weeks: basic metabolic panel (sodium, potassium, chloride, bicarbonate, calcium, PTH), creatinine, Cystatin C, eGFR, CA 19-9, and full blood count. Repeat full lipid panel including ApoB in four to six months after dietary changes.","supplementation":"John's blood results show good levels of most vitamins and minerals, so the supplementation list is short and targeted.\n\nVitamin D3 (cholecalciferol), 2,000 IU daily, taken with a meal containing fat. His vitamin D at 120 nmol/L is at the top of the optimal range, so this is a maintenance dose to hold it through the autumn and winter months when skin synthesis drops. At his BMI, fat tissue sequesters some of the vitamin D he takes, so maintaining a consistent daily dose year-round is more effective than seasonal supplementation.\n\nVitamin K2 (MK-7), 100 to 200 mcg daily, taken with the vitamin D. K2 directs calcium into bones and teeth and away from arteries and soft tissues. Given the low calcium finding, ensuring calcium goes where it is needed is particularly relevant until the cause is established.\n\nOmega-3 fish oil, providing 2 to 3 grams of combined EPA and DHA daily, taken with food. This supports the goal of reducing ApoB and LDL, complements the dietary increase in oily fish, and has anti-inflammatory properties that support recovery from his high training volume.\n\nMagnesium glycinate, 300 to 400 mg before bed. His serum magnesium at 1.06 is adequate, but at his training volume magnesium is lost through sweat, and supplementation supports sleep quality, muscle recovery, and may help with the relaxation he currently seeks through THC drops.\n\nPsyllium husk, 5 to 10 grams daily mixed into water or food, taken with meals. This is a concentrated source of soluble fibre that directly binds cholesterol in the gut and reduces LDL and ApoB. Starting at 5 grams and building up over two weeks avoids digestive discomfort.\n\nJohn should NOT supplement with iron. His ferritin at 56, transferrin saturation at 37.8%, and full iron panel are all healthy, and additional iron when stores are adequate can cause oxidative stress.\n\nJohn should NOT supplement with calcium until the GP has investigated the low calcium finding. Adding calcium when the underlying cause is unknown could mask a condition that needs treatment.\n\nThe most important changes from this report are not supplements. They are getting the calcium and electrolyte findings investigated by the GP, increasing daily water intake to match his training volume, and making the targeted dietary changes to bring his ApoB below 0.9.","biomarkers":[{"key":"glucose","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5733","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4.0","upper_optimal":"5.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6093","units":"mmol/l","description":"Blood glucose measures the concentration of sugar in the blood at the time the sample was taken. For someone following a low-carb diet, this is a direct measure of how well the body is maintaining blood sugar without relying heavily on dietary carbohydrate. John's result of 5.2 mmol/L sits within the optimal fasting range of 4.0 to 5.4, confirming that his blood sugar regulation is working efficiently. This is consistent with his excellent HOMA-IR and low insulin, painting a picture of a metabolism that is handling glucose well.","low_causes":"Prolonged fasting, excessive insulin production, adrenal insufficiency, liver disease, excessive alcohol","high_causes":"Diabetes, pre-diabetes, stress response, corticosteroid use, Cushing's syndrome, pancreatic disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_percent","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"5.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4417","lower_normal":"3.5","upper_normal":"6.0","lower_optimal":"3.5","upper_optimal":"5.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6267","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been glycated, meaning sugar has attached to it. Because red blood cells live for approximately three months, this gives an average picture of blood sugar control over that period rather than a snapshot. John's result of 5.3% is well within the normal range (below 6.0%) and comfortably below the pre-diabetes threshold of 6.0%. This confirms that his blood sugar control has been consistently good over the past two to three months.","low_causes":"Recent blood loss, haemolytic anaemia, chronic kidney disease, certain haemoglobin variants","high_causes":"Diabetes, pre-diabetes, iron deficiency, chronic high sugar intake, reduced red cell turnover","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hba1c_mmol","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4365","lower_normal":"20","upper_normal":"42","lower_optimal":"20","upper_optimal":"36","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5697","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international standard units of mmol/mol. John's result of 34 mmol/mol is well within the optimal zone below 36 and comfortably below the pre-diabetes threshold of 42. This is an excellent result and, combined with his low insulin and HOMA-IR, confirms that his low-carb approach is delivering outstanding glycaemic control.","low_causes":"Recent blood loss, haemolytic anaemia, chronic kidney disease","high_causes":"Diabetes, pre-diabetes, iron deficiency, high sugar intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"insulin","name":"Insulin","group":"GLUCOSE & INSULIN","result":"2.67","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3360","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2.0","upper_optimal":"8.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3063","upper_optimal_position":"0.5755","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. Lower levels in the context of normal blood sugar indicate excellent insulin sensitivity, meaning the cells respond efficiently to small amounts of insulin. John's result of 2.67 mIU/L is at the bottom of the lab range, which is a positive finding on a low-carb diet. It means his pancreas barely needs to work to maintain healthy blood sugar. This is the metabolic signature of someone whose diet is well matched to their physiology.","low_causes":"Low-carb diet, high insulin sensitivity, type 1 diabetes (pathological context), prolonged fasting","high_causes":"Insulin resistance, pre-diabetes, type 2 diabetes, high-carbohydrate diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"c_peptide","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"185","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0839","lower_normal":"364","upper_normal":"1456","lower_optimal":"364","upper_optimal":"1100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5844","units":"pmol/L","description":"C-Peptide is a molecule released by the pancreas in equal amounts to insulin. It is a more reliable marker of true insulin production than insulin itself because it is not cleared as quickly by the liver. John's result of 185 pmol/L (converted from the reported 0.56 ug/L) is below the lab range starting at 364 pmol/L. However, this must be interpreted in context. His blood sugar is 5.2, his HbA1c is 34, and his HOMA-IR is 0.62, all of which confirm excellent blood sugar control. The low C-Peptide simply reflects low insulin demand from a low-carb diet. The lab also notes that samples not separated within four hours can degrade C-Peptide to 44% of baseline, so sample handling may have contributed. This is not a sign of pancreatic failure.","low_causes":"Low-carb diet, high insulin sensitivity, sample degradation, type 1 diabetes (pathological context), prolonged fasting","high_causes":"Insulin resistance, type 2 diabetes, insulinoma, chronic kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_ir","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.62","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4533","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is a calculation using fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin. A score below 1.0 indicates insulin sensitivity, which is the optimal state. John's HOMA-IR of 0.62 places him firmly in the insulin-sensitive category, meaning his cells respond efficiently to insulin and his pancreas does not need to over-produce to maintain blood sugar control. At a BMI of 30.7, this is a genuinely impressive result, as higher body fat typically drives insulin resistance upward. His low-carb, high-protein diet and high training volume are clearly keeping his metabolic machinery in excellent working order.","low_causes":"Low-carb diet, high insulin sensitivity, lean body mass, high physical activity","high_causes":"Obesity, sedentary lifestyle, high-carbohydrate diet, metabolic syndrome, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa_b","name":"HOMA-B","group":"GLUCOSE & INSULIN","result":"31.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.0872","lower_normal":"80","upper_normal":"200","lower_optimal":"80","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6667","units":"","description":"HOMA-B estimates how well the beta cells of the pancreas are functioning based on fasting insulin and glucose. John's calculated HOMA-B of 31.4 (calculated as 20 x 2.67 / (5.2 - 3.5) = 31.4) is below the reference range of 80 to 200. However, this calculation assumes a standard mixed diet. On a low-carb diet, the pancreas deliberately downregulates insulin production because there is less glucose to manage. A low HOMA-B in this context reflects efficient adaptation to a low-carbohydrate intake rather than beta cell failure. The proof is in his glucose and HbA1c, both of which are excellent. If his diet were to change to include more carbohydrate, insulin output and HOMA-B would be expected to rise accordingly.","low_causes":"Low-carb diet, high insulin sensitivity, early type 1 diabetes (pathological context), prolonged fasting","high_causes":"Insulin resistance (compensatory increase), insulinoma, high-carbohydrate diet","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin_saturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"37.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5125","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5279","units":"%","description":"Transferrin saturation tells us what percentage of the body's iron transport protein (transferrin) is currently loaded with iron. It gives a snapshot of how much iron is actively moving through the bloodstream. John's result of 37.84% sits perfectly within the optimal range of 25 to 40%, indicating that iron is being transported efficiently without overloading the system. This is a reassuring finding alongside his healthy ferritin and serum iron.","low_causes":"Iron deficiency, chronic disease, chronic blood loss, poor dietary iron intake","high_causes":"Haemochromatosis, iron supplementation, haemolytic anaemia, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"serum_iron","name":"Serum Iron","group":"IRON STUDIES","result":"24.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5578","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"14","upper_optimal":"28","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3550","upper_optimal_position":"0.6109","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood at the time of the test. It fluctuates throughout the day and with meals, so it is best interpreted alongside the other iron markers. John's serum iron of 24.8 umol/L is comfortably within range and within the optimal band, confirming healthy iron availability for red blood cell production, energy metabolism, and immune function.","low_causes":"Iron deficiency, chronic disease, heavy exercise, poor absorption, blood loss","high_causes":"Haemochromatosis, excessive supplementation, liver damage, haemolytic anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.61","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4356","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that carries iron through the bloodstream to the bone marrow and other tissues. The body adjusts transferrin production based on iron status: it rises when iron is low (to scavenge more) and falls when iron is adequate. John's transferrin of 2.61 g/L is well within range, indicating that his body is not over-producing transport protein to compensate for deficiency, nor is it suppressed by iron overload.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease, malnutrition","high_causes":"Iron deficiency, pregnancy, oral contraceptive use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"63.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5367","lower_normal":"44","upper_normal":"76.1","lower_optimal":"50","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3952","upper_optimal_position":"0.6042","units":"umol/l","description":"Total Iron Binding Capacity (TIBC) measures the maximum amount of iron that transferrin in the blood could carry. It is essentially a measure of how much spare iron-carrying capacity exists. John's TIBC of 63.6 umol/L is within the healthy range, consistent with balanced iron stores and neither deficiency nor overload.","low_causes":"Iron overload, haemochromatosis, chronic inflammation, liver disease","high_causes":"Iron deficiency, pregnancy, chronic blood loss","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"56","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3711","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5311","units":"ng/ml","description":"Ferritin is the body's iron storage protein. Each ferritin molecule acts like a vault, holding iron until the body needs it for red blood cell production, energy metabolism, or immune function. John's ferritin of 56 ng/mL sits within the optimal range for men of 50 to 200, indicating healthy iron reserves. At this level, he has enough stored iron to support his high training volume without being in the excess zone where iron can become pro-oxidant.","low_causes":"Iron deficiency, chronic blood loss, heavy exercise, poor dietary intake, malabsorption","high_causes":"Haemochromatosis, inflammation, liver disease, infection, excessive supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haemoglobin","name":"Haemoglobin","group":"HEMATOLOGY","result":"156","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5500","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. It is one of the most fundamental markers of health. John's haemoglobin of 156 g/L is comfortably within the optimal range for men of 140 to 165, indicating excellent oxygen-carrying capacity to support his high training volume.","low_causes":"Iron deficiency, B12/folate deficiency, chronic disease, blood loss, bone marrow disorders","high_causes":"Dehydration, chronic lung disease, altitude, polycythaemia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"4.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5133","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures how many red blood cells are in a given volume of blood. These cells are responsible for transporting oxygen throughout the body. John's count of 4.84 is within the optimal range, indicating healthy red cell production from the bone marrow.","low_causes":"Anaemia, B12/folate deficiency, chronic disease, bone marrow suppression, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"haematocrit","name":"Haematocrit","group":"HEMATOLOGY","result":"0.457","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5233","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3433","upper_optimal_position":"0.5800","units":"L/L","description":"Haematocrit measures the proportion of blood volume that is occupied by red blood cells. It reflects both red cell production and hydration status. John's haematocrit of 0.457 is within the optimal range. Notably, despite the dehydration suggested by his sodium and chloride levels, his haematocrit has not risen above range, which would be expected in severe dehydration, suggesting the electrolyte changes may partly reflect sample handling.","low_causes":"Anaemia, fluid overload, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic hypoxia, testosterone use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"14.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5905","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"RDW measures how much variation there is in the size of red blood cells. A higher number means more variation, which can indicate that the body is producing red cells of different sizes, often seen in nutritional deficiencies or mixed anaemia states. John's RDW of 14.2% is within the laboratory range but above the optimal ceiling of 13.5%. In the context of otherwise healthy red cell indices, haemoglobin, and iron studies, this is unlikely to be clinically significant, but it is worth noting as part of the overall picture.","low_causes":"Generally not clinically significant when low","high_causes":"Iron deficiency, B12/folate deficiency, mixed anaemia, liver disease, chronic inflammation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume","group":"HEMATOLOGY","result":"94.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5428","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"98","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3444","upper_optimal_position":"0.6167","units":"fl","description":"MCV measures the average size of red blood cells. Small cells (low MCV) can suggest iron deficiency, while large cells (high MCV) can suggest B12 or folate deficiency. John's MCV of 94.3 fL is within the optimal range, indicating that his red blood cells are a normal, healthy size. This is consistent with his adequate B12, folate, and iron levels.","low_causes":"Iron deficiency, thalassaemia, chronic disease, lead poisoning","high_causes":"B12/folate deficiency, alcohol excess, liver disease, hypothyroidism, certain medications","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin","group":"HEMATOLOGY","result":"32.2","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7067","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3533","upper_optimal_position":"0.6667","units":"pg","description":"MCH measures the average amount of haemoglobin inside each red blood cell. John's result of 32.2 pg is marginally above the upper limit of 32. With all other red cell indices, haemoglobin, iron studies, B12, and folate within healthy ranges, this tiny excursion is almost certainly laboratory variation rather than a meaningful finding. The lab notes that MCV and MCHC can be affected by temperature and storage, which may explain this marginal result.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"B12/folate deficiency, laboratory variation, temperature/storage effects on sample","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mchc","name":"Mean Corpuscular Haemoglobin Concentration","group":"HEMATOLOGY","result":"341","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5556","lower_normal":"315","upper_normal":"345","lower_optimal":"320","upper_optimal":"345","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC measures the average concentration of haemoglobin within each red blood cell. John's result of 341 g/L is within range and within optimal bounds, confirming that each red blood cell is packed with an appropriate amount of haemoglobin for efficient oxygen transport.","low_causes":"Iron deficiency, thalassaemia, chronic disease","high_causes":"Hereditary spherocytosis, severe dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"platelets","name":"Platelets","group":"HEMATOLOGY","result":"239","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4479","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5897","units":"x10^9/L","description":"Platelets are small cell fragments that play a critical role in blood clotting and wound healing. John's platelet count of 239 is within the optimal range, indicating healthy platelet production and no clotting concerns.","low_causes":"Viral infections, bone marrow disorders, autoimmune conditions, alcohol excess, certain medications","high_causes":"Infection, inflammation, iron deficiency, post-surgery, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.9","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3467","upper_optimal_position":"0.6133","units":"fL","description":"MPV measures the
