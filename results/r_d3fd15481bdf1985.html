<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Neha Jawed","dob":"14/11/1984","report_date":"2026-10-02","summary":"Neha is a 41-year-old female presenting with a BMI of 21.3, following a standard mixed diet rated 7 out of 10 for quality with a volume of 5 out of 10. She trains nine or more times per week, with five or more cardio sessions and four resistance sessions, supplemented by very high-intensity exercise or bodybuilding, and walks between 7,500 and 10,000 steps a day. She takes an SSRI (such as sertraline or fluoxetine). She vapes nicotine and drinks more than seven alcoholic drinks per week. She reports brain fog, bloating and digestive discomfort, and poor sleep or insomnia. Her goals are to reduce stress and anxiety, improve long-term health and longevity, and lose body fat. She notes tummy bloating and is considering whether she may be entering perimenopause.\n\nThe finding in this report that needs the most immediate attention is her cardiovascular risk profile, which is the most unfavourable combination of lipid markers we see. Her Lp(a), a genetically inherited lipoprotein that accelerates plaque formation in arteries, is above 212.5 nmol/L, which is the upper limit of the assay and places her well into the high-risk category (above 200). Lp(a) is entirely genetic; it does not change with diet, exercise or lifestyle. It is fixed for life and should be recorded permanently in her medical notes. Because Lp(a) carries cholesterol particles that are particularly sticky and pro-inflammatory, it deposits cholesterol into artery walls more aggressively than ordinary LDL, encourages clot formation, and drives local inflammation. This single marker, on its own, substantially raises her lifetime cardiovascular risk. On top of that inherited burden, her modifiable lipid markers are also elevated: her ApoB (apolipoprotein B, a direct count of the number of cholesterol-carrying particles in the blood, and the single best predictor of cardiovascular risk) is 1.75 g/L, nearly double the 0.9 target. Her LDL cholesterol (the main cholesterol carried by those ApoB particles) is 4.49 mmol/L against a target below 3.0, and even after correcting for the cholesterol trapped inside Lp(a) particles, the Lp(a)-corrected LDL is still 3.8 mmol/L, well above the 3.0 upper limit. Her total cholesterol is 7.4 mmol/L and her non-HDL cholesterol (everything except the protective HDL fraction) is 5.4 against a target below 4.0. Her triglycerides are 2.18, above the 1.7 fasting threshold. Her VLDL (very low-density lipoprotein, the triglyceride-rich particle the liver exports) is 0.99 against an upper limit of 0.78, reflecting that triglyceride excess. Her ApoB to ApoA-I ratio is 0.92, above the 0.6 threshold for higher risk in women. Her cardiovascular risk score, a TrueVitals index built from ApoB, LDL, HDL, Lp(a), hsCRP and HbA1c that measures the risk being accumulated rather than the ten-year probability of an event, is 100 out of 100. At 41, her ten-year absolute risk of an event remains statistically low simply because she is young, but the gap between that low short-term probability and the extremely high score is exactly the window she has to act in. The two inputs driving that score are the Lp(a) above 212.5 and the ApoB of 1.75. Her GP needs to see these numbers. Given the combination of a very high inherited Lp(a) and very high modifiable ApoB, she is likely to be a candidate for lipid-lowering medication, and we would recommend discussing this with her GP as a priority. All first-degree relatives (parents, siblings, children) should also have their Lp(a) tested, because it is inherited and they may carry the same risk without knowing it.\n\nThere is one important piece of reassurance sitting inside this lipid profile. Her HDL cholesterol is 2.0 mmol/L, which is excellent and well above the 1.55 threshold for a protective level. Her ApoA-I (the protein on the surface of HDL particles, which reflects how well the body clears cholesterol from artery walls) is 1.91, comfortably above the 1.4 target. Her TC to HDL ratio is 3.7, within the healthy range below 4.5. Her LDL to HDL ratio (Castelli II) is 2.25, within the ideal band below 2.5. Her atherogenic index of plasma is 0.037, which is ideal. These are genuinely positive findings and suggest that her body's reverse cholesterol transport, the process of pulling cholesterol out of artery walls and returning it to the liver, is working very well. The concern is that the sheer volume of ApoB particles entering the artery walls, amplified by Lp(a), is overwhelming that clearance.\n\nHer hsCRP (high-sensitivity C-reactive protein, the most widely used marker of systemic inflammation) is below 0.5, which is genuinely excellent, especially given the volume of training she does. This means there is no measurable systemic inflammation, and it suggests her arteries are not yet showing an inflammatory response to the lipid burden, which is encouraging and supports early intervention.\n\nHer thyroid is working well. TSH (thyroid-stimulating hormone, the brain's signal to the thyroid to produce more hormone) is 1.32, within the ideal range of 1.0 to 2.5. Free T4 (the inactive thyroid hormone the gland releases) is 15.7, within the ideal band. Free T3 (the active form the body converts T4 into, which drives metabolic rate) is 4.7, just inside the ideal range of 4.5 to 6.5. The FT3 to FT4 ratio is 0.299, within ideal, confirming good conversion. Both thyroid antibodies are negative, ruling out autoimmune thyroid disease. This is important context for her brain fog and fatigue because it means the thyroid is not the explanation.\n\nHer kidney function is excellent. Cystatin C, a more precise measure of kidney filtration than creatinine alone (because it is not affected by muscle mass, diet or exercise), is 0.88, giving an eGFR of 106, exactly where it should be at 41. Her urea, creatinine and electrolytes are all within range. Uric acid at 253 is within ideal.\n\nHer blood sugar control is very good. HbA1c (glycated haemoglobin, the average blood sugar over the past three months) is 35 mmol/mol, within the optimal range below 36. Her fasting glucose is 5.4, at the top of the optimal band of 4.0 to 5.4. Her fasting insulin is 5.81, within the optimal range of 2 to 8. Her HOMA-IR (a calculation combining glucose and insulin that estimates how resistant the body's cells are to insulin) is 1.39, within the healthy range. This is a reassuring profile, especially given the South Asian ethnicity, which carries a higher baseline risk of insulin resistance and type 2 diabetes. Her C-peptide is 0.727 ug/L, which is below the laboratory range of 1.1 to 4.4, but this needs careful interpretation. C-peptide is a byproduct released when the pancreas makes insulin, so it reflects how hard the pancreas is working. In the context of a normal fasting glucose, a normal HbA1c and a low-normal insulin, a low C-peptide simply means the pancreas does not need to work hard because the body is very insulin-sensitive. This is not a sign of pancreatic failure; it is the opposite. The lab note on this marker mentions that samples not separated within four hours can see C-peptide fall to 44% of baseline, so sample handling may also have contributed to the low reading. In context, this is not a concern.\n\nHer liver shows a mixed picture. The structural markers are reassuring: ALT (alanine transaminase, the enzyme most specific to liver cell damage) is 21, within the optimal range below 25. AST (aspartate transaminase) is 26, within range. Bilirubin is 8, normal. Albumin is 44, healthy. The FIB-4 score (a fibrosis screening calculation) is 0.77, well below the threshold, and the APRI score is 0.214, also well within range. The NAFLD fibrosis score is minus 3.78, within the ideal band. The De Ritis ratio (AST divided by ALT) is 1.24, within ideal. There is no sign of liver scarring or fatty liver disease. However, her GGT (gamma-glutamyl transferase, an enzyme that rises with alcohol use, metabolic strain and certain medications) is 39 against an upper limit of 38 for women. At this margin, this is only fractionally above range, but given that she drinks more than seven alcoholic drinks per week, the GGT is the marker most sensitive to that intake and is likely reflecting it. Reducing alcohol to under seven drinks and ideally under four per week is the single change most likely to bring GGT back within range.\n\nHer lipase is 94 U/L against an upper limit of 60, which is worth noting. Lipase is an enzyme produced mainly by the pancreas that breaks down dietary fat. A raised lipase can reflect pancreatic irritation, but mild elevations are common and are not the same as pancreatitis, which typically produces lipase three or more times the upper limit. At 1.5 times the upper limit, the most likely explanations are alcohol intake (which can irritate the pancreas at a subclinical level), high-intensity exercise, or normal variation. Her amylase, the other pancreatic enzyme, is 117 against an upper limit of 118, so essentially at the ceiling but within range. She has no abdominal pain (her symptom is bloating, not pain), so acute pancreatitis is very unlikely. We would recommend mentioning this to her GP for context, particularly given the alcohol intake, and repeating lipase on a fasting sample if the bloating persists.\n\nHer globulin is 37 against an upper limit of 36. Globulins are proteins made by the immune system and the liver. The breakdown of her immunoglobulins shows IgG at 15.2 (just within range, upper limit 16), IgM at 0.8 and IgA at 2.1, both within range. Her IgE (the antibody class associated with allergic responses) is 134 against an upper limit of 100, which is elevated. The mildly raised globulin is explained by the elevated IgE contributing to the total. An IgE of 134 is not dramatically high but does suggest the immune system is reacting to something, and the most common causes are environmental allergens (dust mites, pollen, pet dander), food intolerances, or eczema and other atopic conditions. This could contribute to the bloating she reports if there is an element of food-related immune activation. If she has a history of hayfever, eczema or asthma, the IgE finding fits into that pattern. If she does not, and particularly if the bloating is persistent, it may be worth discussing allergy testing with her GP.\n\nHer ESR (erythrocyte sedimentation rate, a general inflammation marker that measures how quickly red blood cells settle in a tube) is 26 against an upper limit of 12, which is elevated. However, ESR must be read alongside hsCRP, which is below 0.5 and therefore excellent. When CRP is low and ESR is high, the ESR elevation is almost always driven by something other than acute inflammation. In women, the most common causes are a higher proportion of globulins (she has slightly raised globulin and IgE), the menstrual cycle, and iron status. Her ESR of 26 is consistent with the mildly elevated globulin and is not, in the presence of a CRP below 0.5, a sign of active inflammatory disease. It is worth recording, but it does not require urgent investigation.\n\nHer white cell count is 3.88 against a lower limit of 4.0, and her monocytes are 0.13 against a lower limit of 0.2. A mildly low total white cell count is common in South Asian populations and is a well-recognised ethnic variant rather than a sign of immune deficiency. Benign ethnic neutropenia, as it is known, typically produces a total white cell count in the 3 to 4 range, exactly where hers sits. Her neutrophils at 2.0 are at the very bottom of the laboratory range but within it. Her lymphocytes at 1.69 are within range. The low monocytes are consistent with the same pattern. She is not reporting recurrent infections, so this is almost certainly a normal finding for her. It does not require investigation unless she begins experiencing frequent or unusual infections.\n\nHer hormone profile is consistent with an active menstrual cycle, not perimenopause. Her FSH (follicle-stimulating hormone, the brain's signal to the ovaries to mature eggs) is 6.94, within the follicular phase range of 2.5 to 10.2, and well below the 23 to 116 range that would indicate post-menopausal status. Her LH (luteinising hormone) is 9.1, also within follicular range. Her oestradiol is 241, within the follicular or midcycle range. Her progesterone is 0.44, which is below the luteal range but entirely normal for the follicular phase (0 to 4.45), suggesting this sample was taken in the first half of her cycle. Her testosterone at 1.1 is within the female range of 0.5 to 2.6. Her SHBG (sex hormone-binding globulin, the protein that carries testosterone and oestradiol in the blood) is 58.7, within range. Her free androgen index is 1.87 and her free testosterone is 0.013, both within range. Her bioavailable testosterone is 0.32, within ideal. Her DHEA-S is 2.2 umol/L (811 ug/dL), within range. Her prolactin is 76, within the non-pregnant range. There is no hormonal evidence of perimenopause at present, which is reassuring. That said, perimenopause can be intermittent, and a single blood test during the follicular phase may not capture the hormonal fluctuations that cause symptoms. If her symptoms of poor sleep, brain fog and mood changes persist, it would be worth repeating FSH, LH and oestradiol during a different point in her cycle or in six to twelve months.\n\nHer iron studies are reassuring. Ferritin (the body's iron stores) is 60, within the optimal range of 40 to 150 for women. Serum iron is 17.9, within range. Transferrin saturation is 27.95%, within the optimal band of 25 to 40%. Transferrin is 2.55, at the lower end of range but within it. Iron-binding capacity is 59.4, within range. Haemoglobin is 128, within the female range of 120 to 150. These results rule out iron deficiency as a cause of her brain fog and fatigue.\n\nHer vitamin D is 77 nmol/L, which is sufficient and within the optimal range of 75 to 120. Her B12 is 346, which is within the laboratory range of 193 to 982 but below the optimal level of 500. At this level, B12 stores are adequate but not generous, and given her brain fog, it is worth optimising to above 500. B12 is essential for nerve function and the production of myelin, the insulating layer around nerve fibres, and suboptimal levels can contribute to cognitive symptoms. Her folate is 22, above the upper limit of 17, which is not harmful and simply reflects good dietary intake or supplementation. There is no clinical concern with elevated folate unless B12 is deficient, which it is not. Her corrected calcium is 2.24, at the lower end of the range of 2.2 to 2.6 but within it. Her PTH (parathyroid hormone, which regulates calcium by pulling it from bone when blood levels drop) is 4.3, within range but towards the upper end of 0.98 to 4.73. The combination of calcium at the floor and PTH at the ceiling suggests the parathyroid glands are working hard to keep calcium levels up. At this BMI and training volume, with adequate vitamin D, this pattern most commonly reflects dietary calcium intake that is on the low side. Ensuring adequate calcium from food (dairy, leafy greens, fortified foods) or a supplement would be sensible. Her magnesium is 1.03, within the optimal range of 0.85 to 1.05.\n\nHer celiac screen (tissue transglutaminase IgA antibodies) is negative, which rules out coeliac disease as a cause of the bloating. Her rheumatoid factor is 14 against an upper limit of 14, borderline but within range.\n\nHer tumour markers are all within range. CA125 is 22.9 (below 35), CA15-3 is 13.53 (below 30), CA19-9 is 22.95 (below 37), and CEA is 1.6 (below 2.3 for a non-smoker). These are screening markers and are reassuring at these levels.\n\nHer total antioxidant activity is 1.72, within the range of 1.3 to 1.77, which is a positive finding given her training volume. Her creatine kinase is 94, within range, which confirms her muscles are recovering well despite the high training load.\n\nHer PhenoAge, a biological ageing calculation built from albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count, is 24.9 against her calendar age of 41, making her biologically 16 years younger than her age. This is an exceptional result and reflects the combination of low inflammation, good kidney function, healthy blood sugar, and strong blood cell markers. It is worth noting that the lab's glucose result was not used directly; the estimated average glucose derived from her HbA1c was substituted.\n\nHer urine shows one finding that needs attention. Her urinary red blood cells are 40 per microlitre against a threshold of 25 for significance. The urine is otherwise clean: no white cells, no nitrites, no protein, no bacterial growth, and no casts. In a 41-year-old woman, the most common cause of isolated red blood cells in the urine is menstrual contamination of the sample. If this sample was collected during or close to her period, that is the most likely explanation and no further action is needed. However, if it was collected well away from menstruation, microscopic haematuria should be investigated with a repeat sample and, if confirmed, a referral for urological assessment. We would recommend mentioning this to her GP so they can determine whether a repeat is warranted based on the timing of the sample.\n\nHer brain fog, bloating and poor sleep are her main symptoms, and the bloods have partially but not fully explained them. The bloating could be linked to the elevated IgE (suggesting an immune response to a food or environmental allergen), and a food diary or elimination trial (starting with common triggers like dairy, wheat, onions and garlic) would be a practical next step. A hydrogen breath test for SIBO (small intestinal bacterial overgrowth) or lactose intolerance could also be considered if the bloating is persistent and centred in the upper abdomen. The brain fog is not explained by thyroid disease, anaemia, iron deficiency, or blood sugar problems, all of which have been excluded. The most likely contributors are her poor sleep (which she reports), the SSRI (which can cause cognitive dulling in some people), the volume of training (nine or more sessions a week is a very high load and can produce central fatigue), and alcohol (which disrupts sleep architecture even at moderate intake). The poor sleep itself may be driven by the training volume, the nicotine from vaping (a stimulant that disrupts sleep onset and quality), and the alcohol (which sedates initially but fragments sleep in the second half of the night). Addressing sleep is likely to be the single biggest lever for the brain fog.","links":"The dominant story in this report is cardiovascular risk, and it has two distinct chapters. The first is inherited and unchangeable: Neha's Lp(a) is above 212.5 nmol/L, placing her in the high-risk category. Lp(a) particles carry cholesterol into artery walls, promote clot formation and drive inflammation at the plaque site. This risk has been present since birth and will remain for life. The second chapter is modifiable: her ApoB at 1.75, LDL at 4.49, triglycerides at 2.18 and non-HDL at 5.4 are all substantially above target. Even after subtracting the cholesterol carried by Lp(a) particles, the corrected LDL is still 3.8, above the 3.0 threshold, confirming that a large proportion of the risk is diet and lifestyle-driven and therefore reducible. Her excellent HDL of 2.0 and ApoA-I of 1.91 show that her body is good at clearing cholesterol, but the inflow is overwhelming the outflow. The cardiovascular risk score of 100 out of 100 reflects this combination.\n\nThe second thread connects her GGT, lipase, triglycerides and sleep. Alcohol at more than seven drinks per week can raise GGT (which it has, marginally), irritate the pancreas (which may explain the lipase of 94), increase triglyceride production by the liver (contributing to the 2.18), and disrupt sleep architecture. It is one contributing factor among several, not the sole explanation, but reducing intake to under four drinks per week would address all four of these markers simultaneously.\n\nThe third thread is her symptom triad of brain fog, bloating and poor sleep. The bloods have ruled out the common medical causes: thyroid disease, anaemia, iron deficiency, coeliac disease, blood sugar dysregulation, kidney disease and significant inflammation. What the bloods have surfaced is an elevated IgE, which raises the possibility of an allergic or food-intolerance component to the bloating. Beyond that, the explanations are lifestyle-driven: the training volume of nine-plus sessions a week is extremely high and can produce central nervous system fatigue that manifests as brain fog; nicotine from vaping is a stimulant that impairs sleep onset and quality; alcohol fragments deep sleep; and SSRIs can dull cognition in some individuals. These factors compound each other: poor sleep worsens brain fog, brain fog increases perceived stress, stress drives the anxiety the SSRI is treating, and the cycle continues.\n\nThe findings that do not fit a single pattern are the mildly low white cell count and monocytes, which are almost certainly benign ethnic neutropenia given her South Asian heritage, and the urinary red blood cells, which are most likely menstrual contamination but need to be ruled out with a properly timed repeat sample. The ESR of 26 sits alongside a CRP below 0.5, which means there is no acute inflammation; the ESR is being driven by the elevated globulin and IgE rather than by disease.\n\nFinally, her hormone profile is reassuring for perimenopause concerns. FSH, LH, oestradiol and progesterone are all consistent with a normal follicular-phase cycle. Perimenopause has not declared itself in this blood test, though it remains possible that symptoms are intermittent and a single snapshot may not capture them.","lifestyle":"Cut alcohol to under four drinks per week, and aim for two or three alcohol-free days in a row. Anchor: set Tuesday to Thursday as your alcohol-free window. Why: alcohol is the one input that touches your GGT (currently just above range), your lipase (94, above range), your triglycerides (2.18, above target), and your sleep quality, which is the symptom you are most aware of.\nSwap refined carbohydrates (white bread, pastry, sugary snacks) for oats, pulses and wholegrain alternatives, one meal at a time starting with breakfast. Why: soluble fibre from oats, barley and lentils directly lowers LDL cholesterol and ApoB by binding bile acids in the gut, and your ApoB at 1.75 is the modifiable marker that most needs to come down.\nAdd two portions of oily fish per week (salmon, mackerel, sardines), ideally replacing a red meat or processed meal. Why: omega-3 from oily fish lowers triglycerides (yours are 2.18) and supports the anti-inflammatory profile your CRP already shows.\nStop vaping nicotine by 2pm at the latest, and ideally work towards stopping altogether. Anchor: set a phone alarm at 2pm labelled \"last vape\". Why: nicotine is a stimulant with a half-life of about two hours; vaping in the evening is likely contributing directly to your poor sleep onset, and poor sleep is the most plausible driver of your brain fog.\nKeep a two-week food and symptom diary, noting what you eat and when bloating occurs. Anchor: photograph each meal and rate bloating 0 to 3 at bedtime. Why: your IgE is elevated at 134, suggesting your immune system is reacting to something; a diary is the fastest way to identify a food trigger before formal allergy testing.\nReduce training volume by two sessions per week for four weeks and observe whether brain fog and sleep improve. Anchor: drop one cardio and one resistance session, keeping total at seven. Why: at nine-plus sessions per week on a diet volume of 5 out of 10, you may be in a state of overreaching where the central nervous system cannot recover between sessions, and this produces the exact symptoms you describe.\nAim for a daily calorie intake of approximately 1,750 to 1,950 kcal, with at least 85 to 95g of protein per day (1.5 to 1.7g per kg of body weight). Anchor: build each main meal around a palm-sized portion of protein first. Why: at BMI 21.3 with very high training volume, you need adequate fuel and protein to support recovery, maintain lean mass, and avoid the low energy availability that suppresses immune and hormonal function.\nSet a fixed wake time seven days a week and get outside within thirty minutes of waking for at least ten minutes. Anchor: alarm at the same time every day, walk before coffee. Why: morning light resets the circadian clock and is the single most effective non-pharmaceutical intervention for the poor sleep and brain fog you report.","flags":"Lp(a) above 212.5 nmol/L (assay upper limit), well above the 32 nmol/L threshold for normal. This is a genetically inherited, permanent, high-risk cardiovascular finding. It cannot be modified by diet or exercise. Should be recorded permanently in her medical notes and all first-degree relatives should be tested. Discuss with GP as a priority, as she may be a candidate for lipid-lowering therapy given the combination of very high Lp(a) and very high ApoB.\nApoB 1.75 g/L (target below 0.9), LDL 4.49 mmol/L (target below 3.0), non-HDL 5.4 mmol/L (target below 4.0), triglycerides 2.18 mmol/L (target below 1.7 fasting), VLDL 0.99 (target below 0.78), total cholesterol 7.4 mmol/L, ApoB/A-I ratio 0.92 (target below 0.6 for women). Cardiovascular risk score 100/100. These modifiable lipid markers are substantially above target. Diet, alcohol reduction and oily fish are first-line interventions, but given the co-existing very high Lp(a), pharmacological intervention should be discussed with the GP.\nESR 26 mm/hour (upper limit 12), but hsCRP below 0.5. The ESR elevation is most likely driven by the mildly elevated globulin and IgE rather than by acute inflammation. Does not require urgent investigation but is worth recording.\nGGT 39 IU/L (upper limit 38 for women). Marginally above range. Most likely reflects alcohol intake. All other liver markers are clean and fibrosis scores are well within range.\nLipase 94 U/L (upper limit 60). Mildly elevated at 1.5 times the upper limit. Amylase at 117 is within range. No abdominal pain. Most likely reflects alcohol intake or high-intensity exercise. Not consistent with acute pancreatitis. Worth mentioning to GP and repeating on a fasting sample if bloating persists.\nGlobulin 37 g/l (upper limit 36). Marginally above range. Explained by the elevated IgE contributing to total globulin. IgG 15.2 is within range.\nIgE 134 IU/ml (upper limit 100). Mildly elevated, suggesting an allergic or atopic immune response. Could relate to food intolerance contributing to bloating. Consider allergy testing if a food diary identifies triggers.\nWBC 3.88 x10^9/L (lower limit 4.0), monocytes 0.13 (lower limit 0.2). Mildly low white cell count consistent with benign ethnic neutropenia, a well-recognised normal variant in South Asian populations. No recurrent infections reported. Does not require investigation.\nC-peptide 0.727 ug/L (240.6 pmol/L), below range of 1.1 to 4.4 ug/L. In the context of normal fasting glucose, normal HbA1c and normal insulin, this reflects low pancreatic demand due to good insulin sensitivity rather than pancreatic insufficiency. Sample handling may also have contributed.\nUrinary RBC 40/uL (threshold for significance 25). Urine otherwise clean. Most likely menstrual contamination. If sample was collected away from menstruation, a repeat mid-stream sample should be submitted to exclude microscopic haematuria.\nB12 346 pg/ml, within laboratory range but below optimal level of 500. Supplementation recommended.\nReassuring negatives: thyroid function excellent with negative antibodies ruling out autoimmune thyroid disease; coeliac screen negative; fasting glucose 5.4 and HbA1c 35 ruling out diabetes and pre-diabetes; HOMA-IR 1.39 ruling out insulin resistance; hsCRP below 0.5 ruling out systemic inflammation; kidney function excellent with cystatin C eGFR 106; liver structurally healthy with FIB-4 0.77, APRI 0.214 and NAFLD score minus 3.78; ferritin 60 and iron studies normal ruling out iron deficiency; all tumour markers within range; hormone profile consistent with active menstrual cycle with no evidence of perimenopause; PhenoAge 24.9 against calendar age 41.","recommendations":"Discuss the Lp(a) result (above 212.5 nmol/L, high-risk category) and the full lipid profile (ApoB 1.75, LDL 4.49, triglycerides 2.18, non-HDL 5.4) with your GP. Given the combination of very high inherited Lp(a) and very high modifiable ApoB, you are likely to be a candidate for lipid-lowering medication (a statin to lower ApoB and LDL, and potentially a PCSK9 inhibitor which is one of the few agents that also lowers Lp(a)). Ask for Lp(a) to be recorded permanently in your medical record.\nAsk your GP to arrange Lp(a) testing for your first-degree relatives (parents, siblings, any children), as this is inherited and they may carry the same risk.\nMention the lipase of 94 (upper limit 60) to your GP. In the absence of abdominal pain, this is most likely subclinical and related to alcohol or exercise, but it should be noted and repeated on a fasting sample if bloating continues.\nMention the urinary red blood cells of 40 per microlitre. If this sample was collected during or near your period, no action is needed. If not, a repeat mid-stream urine sample should be submitted to confirm or exclude microscopic haematuria.\nIf bloating persists after a two-week food diary and elimination trial, discuss a hydrogen breath test for SIBO or lactose intolerance with your GP, and consider formal allergy testing given the elevated IgE of 134.\nIf brain fog and poor sleep do not improve with the lifestyle changes in this report (reducing training volume, stopping nicotine after 2pm, reducing alcohol), discuss with your GP whether the SSRI could be contributing and whether a review of the medication is appropriate.\nRetest in four to six months: lipid panel (total cholesterol, LDL, HDL, triglycerides, ApoB, ApoA-I), GGT, lipase, ESR, IgE, B12, and a repeat urine sample timed away from menstruation. Daily calorie target 1,750 to 1,950 kcal with at least 85 to 95g of protein per day.","supplementation":"Vitamin B12: sublingual methylcobalamin, 1,000 mcg daily, taken in the morning. Why: your B12 is 346, within the laboratory range but below the optimal level of 500. B12 supports nerve function and cognitive clarity, and optimising it may help with the brain fog you report.\nOmega-3 fish oil: 2 to 3g of combined EPA and DHA daily, taken with your largest meal. Why: omega-3 lowers triglycerides (yours are 2.18, above the 1.7 target) and supports cardiovascular health, which is the priority in this report given the lipid profile and Lp(a).\nVitamin D3: cholecalciferol, 2,000 IU daily, taken with a meal containing fat. Why: your vitamin D is 77, within the optimal range of 75 to 120, and this dose will maintain it through the winter months.\nVitamin K2: MK-7, 100 mcg daily, taken with vitamin D. Why: K2 directs calcium into bone rather than arteries, and should always accompany vitamin D supplementation, especially with your calcium sitting at the lower end of range at 2.24.\nMagnesium glycinate: 300 to 400mg taken before bed. Why: your magnesium at 1.03 is within optimal range, but at your training volume magnesium is used heavily and supplementation before bed supports sleep quality, which is one of your main concerns.\nDo not take iron supplements. Your ferritin is 60 and your iron studies are healthy. Additional iron is not needed and could cause gastrointestinal discomfort that worsens the bloating you report.\nThe most important changes from this report are not supplements. They are reducing alcohol to under four drinks per week, adding soluble fibre and oily fish to lower the modifiable lipid markers, stopping nicotine after 2pm to improve sleep, and discussing the Lp(a) and ApoB results with your GP to determine whether medication is appropriate.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"46","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.4182","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 46 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Poor. Raw 46. Weakest systems: urinalysis 0%, inflammation 11%, lipids & cardiovascular 15%. Biggest drags: LDL Cholesterol, Apolipoprotein B, Remnant Cholesterol, White Blood Cell Count.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2717","lower_normal":"","upper_normal":"46","lower_optimal":"","upper_optimal":"41","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4457","units":"years","description":"PhenoAge is a biological ageing calculation developed by Dr Morgan Levine. It uses nine blood markers (albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count) to estimate biological age. Neha's PhenoAge is 24.9 against a calendar age of 41, making her biologically 16 years younger than her age. This is an exceptional result, driven by her very low CRP, healthy albumin, good kidney function and clean blood cell profile. The laboratory did not return a fasting glucose, so the estimated average glucose from HbA1c (5.4 mmol/L) was used in the calculation.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"100","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1.0000","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The Cardiovascular Risk Score is a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being accumulated rather than the ten-year probability of an event, so a high score in a young person means the risk is building even though a heart attack is statistically unlikely in the short term. Neha's score is 100, the maximum, driven by her Lp(a) above 212.5 and ApoB of 1.75. At 41, her ten-year absolute risk is low because she is young, but the gap between that low short-term risk and this maximum score is the window she has to act in. Reducing the modifiable inputs (ApoB, LDL, triglycerides) through diet, lifestyle and likely medication will bring this score down substantially, even though the Lp(a) component cannot be changed.","low_causes":"Low ApoB, low LDL, high HDL, low Lp(a), low CRP, healthy HbA1c","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_  diet, obesity, PCOS","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.727","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2197","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/l","description":"C-peptide is a fragment released by the pancreas in equal measure to insulin. It reflects how much insulin the pancreas is producing. Neha's C-peptide is 0.727 ug/L (approximately 241 pmol/L), below the laboratory range of 1.1 to 4.4. In isolation this could suggest the pancreas is not making enough insulin, but in the context of her normal fasting glucose of 5.4, HbA1c of 35 and insulin of 5.81, the low C-peptide simply means the pancreas does not need to work hard because her cells are very insulin-sensitive. The lab notes that samples not separated within four hours can see C-peptide decrease significantly, so sample handling may also be a factor. This is not a concern.","low_causes":"High insulin sensitivity (low demand), sample degradation, type 1 diabetes, late-stage type 2 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease reducing clearance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"1.39","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4633","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR is a calculation that combines fasting glucose and fasting insulin to estimate how resistant the body's cells are to insulin's signal. A lower number means better sensitivity. N
