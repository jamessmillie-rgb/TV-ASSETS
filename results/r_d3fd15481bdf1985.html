vated urea or creatinine. Neha's ratio is 70.4, within the optimal range of 45 to 90. This is a normal result consistent with healthy kidney function and adequate hydration.","low_causes":"Low protein intake, liver disease, overhydration","high_causes":"Dehydration, high protein intake, upper GI bleeding","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prot","name":"Total Protein","group":"LIVER & METABOLIC","result":"81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6533","lower_normal":"57","upper_normal":"82","lower_optimal":"65","upper_optimal":"80","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3653","upper_optimal_position":"0.6587","units":"g/l","description":"Total protein is the sum of albumin (made by the liver) and globulins (made by the liver and immune system). Neha's total protein is 81, within the reference range. The slightly higher total is driven by the globulin fraction at 37, rather than by albumin, which is healthy at 44.","low_causes":"Malnutrition, liver disease, kidney disease (nephrotic syndrome)","high_causes":"Chronic infection, inflammation, elevated immunoglobulins, dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alb","name":"Albumin","group":"LIVER & METABOLIC","result":"44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5417","lower_normal":"34","upper_normal":"50","lower_optimal":"40","upper_optimal":"48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6042","units":"g/l","description":"Albumin is the most abundant protein in the blood, made by the liver. It carries hormones, vitamins and medications, and maintains fluid balance by keeping water in the blood vessels. Neha's albumin is 44, within the optimal range of 40 to 48, confirming healthy liver synthetic function and adequate nutrition.","low_causes":"Liver disease, kidney disease, malnutrition, inflammation, chronic illness","high_causes":"Dehydration","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"glob","name":"Globulin","group":"LIVER & METABOLIC","result":"37","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7222","lower_normal":"18","upper_normal":"36","lower_optimal":"22","upper_optimal":"34","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.6296","units":"g/l","description":"Globulins are a group of proteins in the blood, including immunoglobulins (antibodies) produced by the immune system. Neha's globulin is 37, marginally above the upper limit of 36. The individual immunoglobulin breakdown shows IgG at 15.2 (within range), IgM at 0.8 and IgA at 2.1 (both within range), with IgE elevated at 134. The mildly raised globulin is explained by the elevated IgE contributing to the total. This does not indicate liver disease or a serious immune condition.","low_causes":"Immune deficiency, liver disease, kidney disease","high_causes":"Chronic infection, autoimmune conditions, liver disease, myeloma, elevated immunoglobulins, allergic response","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alp","name":"Alkaline Phosphatase","group":"LIVER & METABOLIC","result":"57","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3857","lower_normal":"46","upper_normal":"116","lower_optimal":"46","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"IU/l","description":"Alkaline phosphatase (ALP) is an enzyme found in the liver, bile ducts and bones. It can rise with bile duct obstruction, bone disease or liver disease. Neha's ALP is 57, well within the healthy range, confirming no bile duct or bone abnormality.","low_causes":"Zinc deficiency, malnutrition, hypothyroidism","high_causes":"Bile duct obstruction, liver disease, bone disease, pregnancy, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bili","name":"Total Bilirubin","group":"LIVER & METABOLIC","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3542","lower_normal":"5","upper_normal":"21","lower_optimal":"5","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"umol/l","description":"Bilirubin is the yellow pigment produced when old red blood cells are broken down. The liver processes it for excretion. Neha's bilirubin is 8, well within the healthy range, confirming normal red blood cell turnover and liver processing.","low_causes":"Normal variation","high_causes":"Liver disease, bile duct obstruction, Gilbert's syndrome, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"alt","name":"ALT","group":"LIVER & METABOLIC","result":"21","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1875","lower_normal":"0","upper_normal":"56","lower_optimal":"0","upper_optimal":"25","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2232","units":"IU/l","description":"ALT (alanine transaminase) is the liver enzyme most specific to liver cell damage. When liver cells are injured, ALT leaks into the bloodstream. Neha's ALT is 21, within the optimal range below 25 for women. This confirms her liver cells are under no significant strain.","low_causes":"Normal liver health, B6 deficiency (rare cause of misleadingly low ALT)","high_causes":"Fatty liver disease, alcohol, medication, hepatitis, obesity","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ast","name":"AST","group":"LIVER & METABOLIC","result":"26","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4688","lower_normal":"13","upper_normal":"45","lower_optimal":"15","upper_optimal":"35","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3542","upper_optimal_position":"0.5833","units":"IU/l","description":"AST (aspartate transaminase) is found in the liver, heart and muscles. It rises with liver damage but also with intense exercise and muscle injury. Neha's AST is 26, within the optimal range, confirming no liver or significant muscle damage.","low_causes":"Normal variation, B6 deficiency","high_causes":"Liver disease, muscle damage, intense exercise, heart attack","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ggt","name":"Gamma GT","group":"LIVER & METABOLIC","result":"39","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5132","lower_normal":"4","upper_normal":"38","lower_optimal":"4","upper_optimal":"25","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5294","units":"IU/l","description":"GGT (gamma-glutamyl transferase) is a liver enzyme that is particularly sensitive to alcohol intake, metabolic strain and bile duct issues. Neha's GGT is 39, marginally above the upper limit of 38 for women. All her other liver markers are clean, and her fibrosis scores are well within range, so this is not a sign of liver disease. The most likely explanation is her alcohol intake of more than seven drinks per week. GGT is the first liver marker to rise with regular alcohol use and the first to normalise when intake is reduced. A reduction to under four drinks per week would be expected to bring this within range.","low_causes":"Normal liver health","high_causes":"Alcohol, fatty liver disease, bile duct disease, medications, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"amy","name":"Amylase","group":"LIVER & METABOLIC","result":"117","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4943","lower_normal":"30","upper_normal":"118","lower_optimal":"40","upper_optimal":"100","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3447","upper_optimal_position":"0.5795","units":"IU/L","description":"Amylase is an enzyme produced by the pancreas and salivary glands that breaks down starch. Neha's amylase is 117, at the upper edge of the range of 30 to 118 but technically within it. Alongside the elevated lipase, this suggests the pancreas is producing enzymes at the upper end of normal, which could reflect alcohol intake or high-intensity exercise. It is not in the range associated with pancreatitis.","low_causes":"Chronic pancreatitis (burnt-out pancreas), cystic fibrosis","high_causes":"Acute pancreatitis, salivary gland disease, alcohol, kidney disease, bowel obstruction","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lip","name":"Lipase","group":"LIVER & METABOLIC","result":"94","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7833","lower_normal":"13","upper_normal":"60","lower_optimal":"13","upper_optimal":"45","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"U/L","description":"Lipase is an enzyme produced mainly by the pancreas that breaks down dietary fat. It is the most specific blood marker for pancreatic function. Neha's lipase is 94, above the upper limit of 60. In acute pancreatitis, lipase typically rises to three or more times the upper limit (above 180), so at 94 this does not suggest acute pancreatitis. Mild elevations are most commonly caused by alcohol use, high-intensity exercise, and normal variation. Given her reported alcohol intake and very high training volume, either or both could explain this. She reports bloating rather than abdominal pain, which is reassuring. We would recommend mentioning this to her GP and repeating lipase on a fasting sample if the bloating persists.","low_causes":"Chronic pancreatitis (burnt-out), cystic fibrosis","high_causes":"Pancreatitis, alcohol, gallstones, medications, kidney disease, high-intensity exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"agratio","name":"Albumin:Globulin Ratio","group":"LIVER & METABOLIC","result":"1.19","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"1.1","upper_normal":"2.5","lower_optimal":"1.3","upper_optimal":"2.2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3810","upper_optimal_position":"0.5952","units":"","description":"The albumin to globulin ratio compares the two main protein types in the blood. A ratio below 1 can suggest liver disease or immune overactivity. Neha's ratio is 1.19, within the laboratory range but below the optimal band of 1.3 to 2.2, driven by the marginally elevated globulin of 37. This is not a concern and is explained by the elevated IgE.","low_causes":"Elevated immunoglobulins, liver disease, chronic infection, autoimmune disease","high_causes":"Immune deficiency, low protein intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fib4","name":"FIB-4 Index","group":"LIVER & METABOLIC","result":"0.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1442","lower_normal":"","upper_normal":"2.67","lower_optimal":"","upper_optimal":"1.3","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2434","units":"score","description":"The FIB-4 score is a calculation that uses age, AST, ALT and platelet count to screen for liver fibrosis (scarring). A score below 1.3 (or 2.0 at age 65+) indicates a very low risk of significant fibrosis. Neha's FIB-4 is 0.77, well below the threshold, confirming no evidence of liver scarring.","low_causes":"Healthy liver, young age","high_causes":"Liver fibrosis, cirrhosis, age","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apri","name":"APRI","group":"LIVER & METABOLIC","result":"0.214","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0713","lower_normal":"","upper_normal":"1.5","lower_optimal":"","upper_optimal":"0.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.1667","units":"score","description":"The APRI (AST to Platelet Ratio Index) is a simple score that screens for significant liver fibrosis and cirrhosis. A score below 0.5 makes significant fibrosis very unlikely. Neha's APRI is 0.214, well within the ideal range, confirming no evidence of liver scarring.","low_causes":"Healthy liver","high_causes":"Liver fibrosis, cirrhosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nafldfibrosisscore","name":"NAFLD Fibrosis Score","group":"LIVER & METABOLIC","result":"-3.782","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3489","lower_normal":"-4","upper_normal":"0.676","lower_optimal":"-4","upper_optimal":"-1.455","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5148","units":"score","description":"The NAFLD Fibrosis Score uses age, BMI, diabetes status, albumin, platelet count and AST/ALT ratio to estimate the risk of advanced fibrosis in non-alcoholic fatty liver disease. Neha's score is minus 3.782, within the ideal range, confirming a very low risk of liver fibrosis.","low_causes":"Healthy liver, low BMI, normal blood sugar","high_causes":"Advanced fibrosis in fatty liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"deritisratio","name":"AST:ALT Ratio (De Ritis)","group":"LIVER & METABOLIC","result":"1.24","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The De Ritis ratio divides AST by ALT. In healthy individuals with normal transaminases, this ratio is typically between 0.8 and 1.3. A ratio above 2.0 when both enzymes are elevated can suggest alcoholic liver disease or cirrhosis. Neha's ratio is 1.24, within the optimal range, and both her AST and ALT are within normal limits, confirming a healthy liver.","low_causes":"Fatty liver, viral hepatitis","high_causes":"Alcohol-related liver disease, cirrhosis, muscle injury","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"cho","name":"Total Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"7.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7143","lower_normal":"0","upper_normal":"5.18","lower_optimal":"0","upper_optimal":"5.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4826","units":"mmol/l","description":"Total cholesterol is the sum of all cholesterol in the blood, including LDL, HDL and VLDL. Neha's total cholesterol is 7.4 mmol/L, well above the desirable level of below 5.18. While total cholesterol includes the protective HDL fraction (which is excellent at 2.0), the overall number is driven by the significantly elevated LDL and VLDL. This is one component of the unfavourable lipid profile that requires attention.","low_causes":"Hyperthyroidism, malnutrition, liver disease","high_causes":"Diet, genetics, hypothyroidism, familial hypercholesterolaemia, obesity, diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tri","name":"Triglycerides","group":"LIPIDS & CARDIOVASCULAR","result":"2.18","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6412","lower_normal":"0","upper_normal":"1.7","lower_optimal":"0","upper_optimal":"1.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2941","units":"mmol/l","description":"Triglycerides are the main form of fat circulating in the blood. They rise after meals, with alcohol, and with high carbohydrate intake. Neha's triglycerides are 2.18, above the 1.7 fasting threshold. Elevated triglycerides increase cardiovascular risk independently and drive the production of small, dense LDL particles that are more atherogenic. The two most likely contributors are alcohol (which stimulates the liver to produce triglycerides) and dietary refined carbohydrate. Reducing alcohol and swapping refined carbohydrates for wholegrain and fibre-rich alternatives are the most effective interventions.","low_causes":"Very low-fat diet, malnutrition, hyperthyroidism","high_causes":"Alcohol, high-carbohydrate diet, obesity, insulin resistance, hypothyroidism, medications","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vldc","name":"VLDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.99","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6346","lower_normal":"0","upper_normal":"0.78","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3205","units":"mmol/l","description":"VLDL (very low-density lipoprotein) is the triglyceride-rich particle the liver exports into the bloodstream. It is a precursor to LDL. Neha's VLDL is 0.99, above the upper limit of 0.78, reflecting the elevated triglycerides. Reducing triglycerides through alcohol reduction and dietary changes will lower VLDL.","low_causes":"Low triglyceride levels","high_causes":"High triglycerides, alcohol, high-carbohydrate diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hdl","name":"HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6452","lower_normal":"1.55","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5161","upper_optimal_position":"1","units":"mmol/l","description":"HDL (high-density lipoprotein) is the protective cholesterol that removes excess cholesterol from artery walls and returns it to the liver for disposal, a process called reverse cholesterol transport. Neha's HDL is 2.0, well above the optimal threshold of 1.6 for women. This is an excellent result and is one of the strongest protective factors in her lipid profile. Her regular exercise is likely a major contributor.","low_causes":"Sedentary lifestyle, smoking, obesity, high-carbohydrate diet, metabolic syndrome","high_causes":"Regular exercise, moderate alcohol, genetics, oestrogen","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"ldl","name":"LDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"4.49","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7483","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"2.6","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6133","units":"mmol/l","description":"LDL (low-density lipoprotein) is the cholesterol particle that deposits cholesterol into artery walls, driving atherosclerosis. Neha's LDL is 4.49, well above the target of below 3.0. Part of this LDL measurement includes cholesterol carried inside Lp(a) particles, which is genetically determined and not modifiable by diet. After correcting for Lp(a), the modifiable LDL is estimated at 3.8, still above target. This means both her inherited and lifestyle-driven cholesterol are elevated, and both channels need to be addressed.","low_causes":"Hyperthyroidism, malnutrition, malabsorption, liver disease","high_causes":"Diet (saturated fat), genetics, familial hypercholesterolaemia, hypothyroidism, obesity, Lp(a)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hdlrat","name":"TC:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"3.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4111","lower_normal":"0","upper_normal":"4.5","lower_optimal":"0","upper_optimal":"4.0","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"","description":"The total cholesterol to HDL ratio provides context for total cholesterol by accounting for the protective HDL fraction. Neha's ratio is 3.7, within the ideal range below 4.0. This is a positive finding and reflects her excellent HDL partially offsetting the elevated total cholesterol. However, this ratio does not capture the full risk because it does not account for ApoB particle number or Lp(a).","low_causes":"Very high HDL, low total cholesterol","high_causes":"Low HDL, high total cholesterol","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"hcr","name":"HDL % of Total","group":"LIPIDS & CARDIOVASCULAR","result":"27.03","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"20","upper_normal":"","lower_optimal":"25","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.625","upper_optimal_position":"1","units":"%","description":"HDL as a percentage of total cholesterol shows how much of the total is protective. Neha's HDL makes up 27% of her total cholesterol, above the 20% minimum and above the 25% optimal threshold. This is a positive finding driven by her excellent HDL of 2.0.","low_causes":"Low HDL, very high total cholesterol","high_causes":"High HDL, low total cholesterol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"nhdl","name":"Non-HDL Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"5.4","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6750","lower_normal":"0","upper_normal":"4","lower_optimal":"0","upper_optimal":"3.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4250","units":"mmol/l","description":"Non-HDL cholesterol is everything except HDL, meaning all the cholesterol-carrying particles that can deposit into artery walls. It captures LDL, VLDL and Lp(a) in a single number. Neha's non-HDL is 5.4, above the target of below 4.0. This is a key metric because it includes the contribution from her elevated Lp(a) alongside the elevated LDL and triglyceride-rich particles.","low_causes":"Low LDL, low triglycerides","high_causes":"Elevated LDL, elevated triglycerides, elevated Lp(a), diet, genetics","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apoa","name":"Apolipoprotein A1","group":"LIPIDS & CARDIOVASCULAR","result":"1.91","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6821","lower_normal":"1.4","upper_normal":"","lower_optimal":"1.6","upper_optimal":"","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5714","upper_optimal_position":"1","units":"g/L","description":"Apolipoprotein A1 is the main structural protein on HDL particles. It reflects the functional capacity of the reverse cholesterol transport system, which pulls cholesterol out of artery walls. Neha's ApoA-I is 1.91, well above the 1.4 threshold, confirming that her HDL particles are abundant and functional. This is a strong protective finding.","low_causes":"Sedentary lifestyle, smoking, metabolic syndrome, genetic conditions","high_causes":"Regular exercise, genetics, oestrogen, moderate alcohol","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"apob","name":"Apolipoprotein B","group":"LIPIDS & CARDIOVASCULAR","result":"1.75","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.9722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4444","units":"g/L","description":"Apolipoprotein B (ApoB) is the single best predictor of cardiovascular risk. Every LDL, VLDL and Lp(a) particle carries exactly one ApoB molecule, so the ApoB count is a direct count of the total number of atherogenic particles in the blood. Neha's ApoB is 1.75, nearly double the 0.9 desirable target and well above the 0.8 optimal target. This is a significantly elevated result. It means the number of cholesterol-carrying particles entering her artery walls is very high. Given her co-existing very high Lp(a), this is the modifiable marker that most needs to be reduced. Diet changes (increasing soluble fibre, reducing saturated fat, adding oily fish) are first-line, but given the magnitude and the Lp(a), pharmacological intervention should be discussed with her GP.","low_causes":"Hyperthyroidism, malnutrition, malabsorption","high_causes":"Diet (saturated fat), genetics, familial hypercholesterolaemia, high Lp(a), obesity, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"apor","name":"ApoB:ApoA-I Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"0.92","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7667","lower_normal":"0","upper_normal":"0.6","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4167","units":"","description":"The ApoB to ApoA-I ratio is one of the most powerful predictors of cardiovascular risk. It compares the number of atherogenic particles (ApoB) to the number of protective particles (ApoA-I). For women, a ratio below 0.6 is desirable. Neha's ratio is 0.92, placing her in the higher-risk category. Despite her excellent ApoA-I of 1.91, the sheer number of ApoB particles at 1.75 overwhelms the protective clearance. Reducing ApoB through diet and potentially medication will bring this ratio down.","low_causes":"High HDL with low LDL, healthy lifestyle","high_causes":"High ApoB (elevated LDL, Lp(a), triglycerides), low ApoA-I","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpa","name":"Lipoprotein(a)","group":"LIPIDS & CARDIOVASCULAR","result":"> 212.5","within_normal":"FALSE","within_optimal":"FALSE","result_position":"1","lower_normal":"0","upper_normal":"32","lower_optimal":"0","upper_optimal":"32","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/l","description":"Lipoprotein(a), or Lp(a), is a genetically determined lipoprotein particle that is structurally similar to LDL but carries an additional protein called apolipoprotein(a). Lp(a) deposits cholesterol into artery walls, promotes blood clot formation by interfering with the clot-dissolving system, and drives inflammation at the plaque site. Neha's Lp(a) is above 212.5 nmol/L, which is above the assay's upper measurement limit, placing her well into the high-risk category (above 200 nmol/L). This is entirely inherited, fixed for life, and cannot be changed by diet, exercise or any currently available supplement. It should be recorded permanently in her medical notes. All first-degree relatives (parents, siblings, children) should be tested. This result, combined with her very high ApoB, makes cardiovascular risk management a priority and is the main reason we recommend discussing pharmacological intervention with her GP. PCSK9 inhibitors are one of the few drug classes that can lower Lp(a) modestly alongside their primary effect on LDL and ApoB.","low_causes":"Genetics (low Lp(a) is inherited and protective)","high_causes":"Genetics (inherited, not modifiable by lifestyle)","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"nlr","name":"Neutrophil:Lymphocyte Ratio","group":"HEMATOLOGY","result":"1.18","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4267","lower_normal":"1","upper_normal":"3","lower_optimal":"1.0","upper_optimal":"2.0","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"The neutrophil to lymphocyte ratio is a marker of systemic inflammation and immune balance. Neha's NLR is 1.18, within the optimal range of 1.0 to 2.0. This is a healthy result confirming no significant immune-inflammatory activation.","low_causes":"Neutropenia, elevated lymphocytes","high_causes":"Bacterial infection, physiological stress, chronic inflammation, tissue damage","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mentzerindex","name":"Mentzer Index","group":"HEMATOLOGY","result":"21.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Mentzer Index is calculated by dividing MCV by the red blood cell count. It is used to help distinguish between iron deficiency anaemia (index above 13) and thalassaemia trait (index below 13). Neha's Mentzer Index is 21.7, well above 13, which is reported for context and is consistent with normal iron-replete red blood cell production rather than a thalassaemia pattern.","low_causes":"Thalassaemia trait","high_causes":"Iron deficiency","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"reticulocyteproductionindex","name":"Reticulocyte Production Index","group":"HEMATOLOGY","result":"0.84","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"Reticulocyte Production Index is reported for context only and is not applicable at present, so it is not flagged.","low_causes":"Marrow not responding to anaemia: iron, B12 or folate deficiency, marrow suppression","high_causes":"Blood loss or haemolysis with an appropriate marrow response","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tghdlratio","name":"TG:HDL Ratio","group":"LIPIDS & CARDIOVASCULAR","result":"1.09","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3633","lower_normal":"0","upper_normal":"1.5","lower_optimal":"0","upper_optimal":"0.87","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.2900","units":"","description":"The triglyceride to HDL ratio is a useful proxy for insulin resistance and small, dense LDL particles. Neha's ratio is 1.09, within the laboratory range below 1.5 but above the optimal threshold of 0.87. The mildly elevated triglycerides are driving this. Reducing triglycerides through alcohol reduction and dietary changes will improve this ratio.","low_causes":"Very low triglycerides, high HDL","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"remnantcholesterol","name":"Remnant Cholesterol","group":"LIPIDS & CARDIOVASCULAR","result":"0.91","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.5688","lower_normal":"0","upper_normal":"0.8","lower_optimal":"0","upper_optimal":"0.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.3125","units":"mmol/l","description":"Remnant cholesterol is calculated as total cholesterol minus HDL minus LDL. It represents the cholesterol carried in triglyceride-rich remnant particles (VLDL remnants and chylomicron remnants), which are now recognised as independently atherogenic. Neha's remnant cholesterol is 0.91, above the 0.8 threshold, reflecting her elevated triglycerides and VLDL. Reducing triglycerides will lower remnant cholesterol.","low_causes":"Low triglycerides, healthy lipid metabolism","high_causes":"Elevated triglycerides, alcohol, high-carbohydrate diet, insulin resistance","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"lpacorrectedldl","name":"Lp(a)-Corrected LDL","group":"LIPIDS & CARDIOVASCULAR","result":"3.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6333","lower_normal":"","upper_normal":"3","lower_optimal":"","upper_optimal":"2.6","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4333","units":"mmol/L","description":"Lp(a)-corrected LDL removes the cholesterol carried inside Lp(a) particles from the total LDL measurement, isolating the modifiable portion of LDL that can be reduced by diet, lifestyle and medication. Neha's corrected LDL is 3.8, still above the 3.0 target. This confirms that even after removing the inherited Lp(a) contribution, her modifiable LDL cholesterol is elevated and there is significant scope for reduction through dietary changes and potentially medication.","low_causes":"Low dietary saturated fat, medication, hyperthyroidism","high_causes":"Diet high in saturated fat, familial hypercholesterolaemia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"atherogenicindex","name":"Atherogenic Index of Plasma","group":"LIPIDS & CARDIOVASCULAR","result":"0.037","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6190","lower_normal":"-1","upper_normal":"0.21","lower_optimal":"-1","upper_optimal":"0.11","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.6391","units":"index","description":"The Atherogenic Index of Plasma is calculated from triglycerides and HDL and estimates the balance between atherogenic and protective lipoproteins. Neha's AIP is 0.037, within the ideal range below 0.11. Despite her elevated triglycerides, her excellent HDL keeps this ratio in the healthy zone. This is a reassuring finding, though it does not negate the risk from her very high ApoB and Lp(a).","low_causes":"High HDL, low triglycerides","high_causes":"High triglycerides, low HDL, insulin resistance","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"castelliii","name":"LDL:HDL Ratio (Castelli II)","group":"LIPIDS & CARDIOVASCULAR","result":"2.25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3214","lower_normal":"","upper_normal":"3.5","lower_optimal":"","upper_optimal":"2.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.3571","units":"ratio","description":"The LDL to HDL ratio (Castelli II) compares atherogenic LDL to protective HDL. Neha's ratio is 2.25, within the ideal range below 2.5. Her excellent HDL moderates the impact of the elevated LDL in this ratio. However, this metric does not capture Lp(a) risk or ApoB particle number, which are the more important metrics in her case.","low_causes":"Low LDL, high HDL","high_causes":"Raised LDL, low HDL","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"vidc","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"50","upper_normal":"","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.75","upper_optimal_position":"1","units":"nmol/L","description":"Vitamin D is essential for calcium absorption, bone health, immune function and mood regulation. Neha's vitamin D is 77 nmol/L, within the optimal range of 75 to 120 and classed as sufficient. Given the sample was taken in early October, maintaining supplementation through the winter months will prevent the seasonal decline that typically occurs in the UK between October and March.","low_causes":"Insufficient sunlight, dark skin, low dietary intake, malabsorption, obesity","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"pth","name":"Parathyroid Hormone (PTH)","group":"VITAMINS & NUTRIENTS","result":"4.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5547","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.5","upper_optimal":"3.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3722","upper_optimal_position":"0.5222","units":"pmol/L","description":"Parathyroid hormone (PTH) is released by the four small parathyroid glands behind the thyroid. Its job is to regulate calcium levels by pulling calcium from bones, increasing kidney calcium retention, and activating vitamin D to boost gut calcium absorption. Neha's PTH is 4.3, within the laboratory range of 0.98 to 4.73 but towards the upper end. Alongside her corrected calcium of 2.24, which is at the lower end of range, this pattern suggests the parathyroid glands are working harder than ideal to maintain calcium levels. The most common explanation is dietary calcium intake that is slightly below what the body needs, particularly at her training volume. Ensuring adequate calcium from food or supplementation would be sensible.","low_causes":"Excess calcium, vitamin D toxicity, magnesium deficiency, post-thyroid surgery","high_causes":"Low calcium, vitamin D deficiency, kidney disease, primary hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"b12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"346","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3657","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4555","upper_optimal_position":"0.6149","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, DNA synthesis and the formation of red blood cells. It also plays a key role in methylation, a process involved in energy production, detoxification and mood regulation. Neha's B12 is 346 pg/ml, within the laboratory range of 193 to 982 but below the optimal level of 500. At this level, stores are adequate but not generous. Given her brain fog, optimising B12 to above 500 through sublingual methylcobalamin supplementation is recommended, as suboptimal B12 can contribute to cognitive and neurological symptoms.","low_causes":"Vegetarian/vegan diet, malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fola","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"22","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.6471","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) is essential for cell division, DNA repair and red blood cell formation. Neha's folate is 22 ng/ml, above the laboratory upper limit of 17. An elevated folate is not harmful and simply reflects good dietary intake from green vegetables, fortified foods or supplementation. Elevated folate only becomes clinically relevant when B12 is deficient, because high folate can mask the blood cell changes of B12 deficiency while allowing the neurological damage to continue. Neha's B12 at 346 is below optimal but not deficient, so this is not a concern. No action is needed for the folate level itself.","low_causes":"Poor dietary intake, malabsorption, coeliac disease, alcohol, pregnancy, medications","high_causes":"Supplementation, fortified foods, high vegetable intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.72","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6312","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.5","upper_optimal":"1.77","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4619","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the blood's overall capacity to neutralise free radicals, the unstable molecules that damage cells and accelerate ageing. Neha's TAA is 1.72, near the top of the range and within the optimal band. This is a strong result, suggesting her dietary antioxidant intake and her body's own defences are working well, particularly impressive given her high training volume which generates free radicals.","low_causes":"Poor dietary antioxidant intake, oxidative stress, smoking, chronic disease","high_causes":"Good dietary intake of fruits, vegetables and polyphenols, antioxidant supplementation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"15.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4583","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4107","upper_optimal_position":"0.5893","units":"pmol/l","description":"Free T4 (thyroxine) is the inactive thyroid hormone produced by the thyroid gland. The body converts it into the active form, T3, in the tissues. Neha's FT4 is 15.7, within the optimal range of 14 to 20. Her thyroid is producing an adequate amount of hormone.","low_causes":"Hypothyroidism, pituitary disease, sick euthyroid syndrome","high_causes":"Hyperthyroidism, Graves' disease, thyroiditis, excessive thyroxine replacement","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tsh","name":"TSH","group":"THYROID","result":"1.32","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3939","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3773","upper_optimal_position":"0.4827","units":"mIU/l","description":"TSH (thyroid-stimulating hormone) is produced by the pituitary gland in the brain and acts as the thermostat for the thyroid. When thyroid hormone levels are low, TSH rises to stimulate more production; when they are adequate, TSH stays low. Neha's TSH is 1.32, within the optimal range of 1.0 to 2.5. This confirms her thyroid is functioning well and the pituitary is not having to push the gland to produce more.","low_causes":"Hyperthyroidism, excessive thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, thyroid failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"4.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4741","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5926","units":"pmol/L","description":"Free T3 (triiodothyronine) is the active thyroid hormone that drives metabolic rate, energy production, body temperature and cognitive function. It is produced mainly by converting FT4 in the tissues. Neha's FT3 is 4.7, just inside the optimal range of 4.5 to 6.5. Her body is converting T4 to T3 adequately. This rules out thyroid underperformance as a cause of her brain fog or fatigue.","low_causes":"Hypothyroidism, sick euthyroid syndrome, low energy availability, chronic illness","high_causes":"Hyperthyroidism, T3 supplementation, Graves' disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tha","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"< 6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroid peroxidase (TPO) antibodies are produced when the immune system mistakenly attacks the thyroid gland, a condition called Hashimoto's thyroiditis. Neha's TPO antibodies are below 6.6, well within the negative range below 13.8. This rules out autoimmune thyroid disease.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroiditis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thy","name":"Thyroglobulin Antibody","group":"THYROID","result":"< 1.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1478","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies target thyroglobulin, the protein the thyroid uses to make thyroid hormones. Neha's thyroglobulin antibodies are below 1.3, within the negative range. Combined with the negative TPO antibodies, this confirms no autoimmune thyroid disease. More than 80% of the population have undetectable levels.","low_causes":"No autoimmune thyroid disease","high_causes":"Hashimoto's thyroiditis, Graves' disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.299","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio measures how efficiently the body converts the inactive thyroid hormone (T4) into its active form (T3). Neha's ratio is 0.299, within the optimal range of 0.27 to 0.40. This confirms good thyroid hormone conversion.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"cort","name":"Cortisol","group":"HORMONES","result":"253","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5814","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a natural daily rhythm, peaking in the morning and falling through the day. Neha's cortisol is 253 nmol/L, within the morning reference range. This is a healthy result and does not suggest adrenal overactivity or insufficiency. Given her reported stress and anxiety, cortisol is not elevated, which is reassuring.","low_causes":"Adrenal insufficiency (Addison's disease), pituitary disease, steroid withdrawal","high_causes":"Chronic stress, Cushing's syndrome, steroid medication, intense exercise","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oes","name":"Oestradiol","group":"HORMONES","result":"241","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"71.6","upper_normal":"529.2","lower_optimal":"100","upper_optimal":"400","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5502","units":"pmol/L","description":"Oestradiol is the primary female sex hormone, responsible for regulating the menstrual cycle, maintaining bone density, supporting brain function and protecting cardiovascular health. Neha's oestradiol is 241 pmol/L, within the follicular phase range of 71.6 to 529.2. This is a healthy, pre-menopausal level and does not suggest perimenopause at this point in her cycle.","low_causes":"Perimenopause, menopause, low body fat, excessive exercise, pituitary disease","high_causes":"Midcycle surge, pregnancy, ovarian cysts, obesity, hormone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prog","name":"Progesterone","group":"HORMONES","result":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"0","upper_normal":"4.45","lower_optimal":"0","upper_optimal":"4.45","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"nmol/L","description":"Progesterone is produced primarily after ovulation and rises sharply in the luteal phase (second half of the cycle). It supports pregnancy preparation and has calming effects on mood and sleep. Neha's progesterone is 0.44, within the follicular phase range of 0 to 4.45, confirming this sample was taken before ovulation. To assess whether ovulation is occurring normally, progesterone should be tested on day 21 of the cycle (approximately seven days after expected ovulation).","low_causes":"Follicular phase of cycle (normal), anovulation, perimenopause, PCOS, low body weight","high_causes":"Luteal phase, pregnancy, ovarian cysts, adrenal conditions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone (LH)","group":"HORMONES","result":"9.1","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"1.9","upper_normal":"12.5","lower_optimal":"2.5","upper_optimal":"10","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3590","upper_optimal_position":"0.5741","units":"mIU/ml","description":"Luteinising hormone (LH) is produced by the pituitary gland and triggers ovulation in the middle of the menstrual cycle. Neha's LH is 9.1, within the follicular phase range. In perimenopause, LH typically rises alongside FSH. Neha's LH is in the normal pre-menopausal range, which is reassuring.","low_causes":"Pituitary disease, low body weight, excessive exercise, oral contraceptives","high_causes":"Menopause, PCOS, midcycle surge, primary ovarian insufficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone (FSH)","group":"HORMONES","result":"6.94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"2.5","upper_normal":"10.2","lower_optimal":"3","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3683","upper_optimal_position":"0.5800","units":"mIU/ml","description":"FSH (follicle-stimulating hormone) is produced by the pituitary and stimulates the ovaries to mature eggs each cycle. In perimenopause and menopause, FSH rises as the ovaries produce less oestrogen and the brain compensates by sending a stronger signal. Neha's FSH is 6.94, within the normal follicular phase range of 2.5 to 10.2, and well below the post-menopausal threshold of 23 to 116. This provides no evidence of perimenopause at the time of this blood test. However, FSH can fluctuate from cycle to cycle in early perimenopause, so a single normal result does not completely rule it out if symptoms persist.","low_causes":"Oral contraceptives, pregnancy, pituitary disease, low body weight","high_causes":"Perimenopause, menopause, primary ovarian insufficiency, Turner syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"test","name":"Testosterone","group":"HORMONES","result":"1.1","within_normal":"TRUE","within_optimal":"TRUE","resu     return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  if(norm(dob.value)===norm(data.dob)){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
    document.getElementById('app-nav').classList.remove('hide');
    document.getElementById('app-mnav').classList.remove('hide');
    app.classList.remove('hide');
    document.body.classList.add('unlocked');
    runIntro();
  } else {
    gerr.style.display='block'; dob.classList.add('shake');
    setTimeout(()=>dob.classList.remove('shake'),500);
  }
}
