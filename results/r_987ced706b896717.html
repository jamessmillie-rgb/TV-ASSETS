<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueVitals Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#131316; --surface2:#1a1a1e; --surface3:#212127;
  --border:#242429; --border2:#33333a;
  --text:#f7f7f8; --text2:#a5a5ae; --text3:#6e6e78;
  --green:#2ce4ad; --green-soft:rgba(44,228,173,.12); --green-mid:rgba(44,228,173,.28);
  --red:#ff5a5f; --red-soft:rgba(255,90,95,.12); --red-mid:rgba(255,90,95,.3);
  --amber:#e8c15a; --amber-soft:rgba(232,193,90,.12); --amber-mid:rgba(232,193,90,.3);
  --blue:#7c9bff; --blue-soft:rgba(124,155,255,.12);
  --silh-top:#17171c; --silh-bot:#101014; --silh-stroke:#2a2a31;
  --shadow:0 1px 0 rgba(255,255,255,.02), 0 10px 30px -12px rgba(0,0,0,.6);
  --r:16px; --r-sm:11px;
}
body[data-theme="light"]{
  --bg:#f6f7f9; --bg2:#eef0f4; --surface:#ffffff; --surface2:#f4f5f8; --surface3:#eceef2;
  --border:#e3e6ec; --border2:#d3d7df;
  --text:#14161c; --text2:#565b66; --text3:#8b909b;
  --green:#0fb488; --green-soft:rgba(15,180,136,.12); --green-mid:rgba(15,180,136,.28);
  --red:#e23d43; --red-soft:rgba(226,61,67,.1); --red-mid:rgba(226,61,67,.28);
  --amber:#c79514; --amber-soft:rgba(199,149,20,.12); --amber-mid:rgba(199,149,20,.3);
  --blue:#4864d8; --blue-soft:rgba(72,100,216,.1);
  --silh-top:#e9ecf1; --silh-bot:#dfe3ea; --silh-stroke:#cfd4dd;
  --shadow:0 1px 2px rgba(20,22,28,.04), 0 12px 30px -16px rgba(20,22,28,.18);
}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 600px at 80% -10%, rgba(44,228,173,.05), transparent 60%),radial-gradient(900px 500px at 0% 10%, rgba(124,155,255,.04), transparent 55%);}
.c-green{color:var(--green)} .c-amber{color:var(--amber)} .c-red{color:var(--red)}
a{color:var(--green)}
.hide{display:none!important}

/* ---------- NAV ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:80;height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;
  background:color-mix(in srgb,var(--bg) 78%, transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border)}
.nav-brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-size:19px;font-weight:700;letter-spacing:-.4px}.brand span{color:var(--green)}
.gate-logo-img{display:block;width:180px;height:auto;margin:0 auto 14px}
.logo-dark,.logo-light{height:26px;width:auto;display:block}
.logo-light{display:none}
body[data-theme="light"] .logo-dark{display:none}
body[data-theme="light"] .logo-light{display:block}
.logo-print{height:30px;width:auto}
.foot-logo{height:24px;width:auto;margin:0 auto 12px;display:block}
body[data-theme="light"] .foot-logo.inv{display:none}
body[data-theme="light"] .foot-logo.std{display:block}
.foot-logo.std{display:none}
.nav-patient{font-size:12.5px;color:var(--text3);padding-left:14px;border-left:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--text3);text-decoration:none;font-size:13px;font-weight:500;padding:8px 13px;border-radius:9px;transition:.18s}
.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--green);background:var(--green-soft)}
.nav-actions{display:flex;align-items:center;gap:8px}
.iconbtn{display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:transparent;border:1px solid var(--border2);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.18s}
.iconbtn:hover{color:var(--text);border-color:var(--green);background:var(--green-soft)}
.iconbtn svg{width:15px;height:15px}
.iconbtn.primary{color:var(--green);border-color:var(--green-mid)}

/* ---------- MOBILE NAV ---------- */
.mnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 88%, transparent);backdrop-filter:blur(22px);border-top:1px solid var(--border)}
.mnav-in{display:flex;justify-content:space-around}
.mnav a{flex:1;color:var(--text3);text-decoration:none;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px}
.mnav a.active{color:var(--green)}
.mnav svg{width:20px;height:20px}

/* ---------- LAYOUT ---------- */
.wrap{max-width:940px;margin:0 auto;padding:92px 22px 120px}
section{margin-bottom:60px;opacity:1}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.2,.7,.2,1),transform .6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--green);margin-bottom:12px}
.sec-title{font-size:clamp(22px,3.4vw,30px);font-weight:700;letter-spacing:-.6px;margin-bottom:6px}
.sec-sub{color:var(--text2);font-size:15px;margin-bottom:26px;max-width:560px}

/* ---------- HERO ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;
  background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:24px;padding:40px 40px;box-shadow:var(--shadow)}
.hero-name{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:-1.5px;line-height:1;display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.hero-name-sub{font-size:15px;font-weight:500;letter-spacing:0;color:var(--text2)}
.hero-lede{color:var(--text2);font-size:15.5px;max-width:420px;margin-bottom:26px}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap}
.hstat{display:flex;flex-direction:column}
.hstat-n{font-size:30px;font-weight:700;letter-spacing:-1px;line-height:1}
.hstat-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:4px}
.hero-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:var(--surface3);stroke-width:12}
.ring-track2{fill:none;stroke:var(--surface2);stroke-width:6}
.ring-fill{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;filter:drop-shadow(0 0 8px var(--green-mid))}
.ring-fill2{fill:none;stroke:var(--red);stroke-width:6;stroke-linecap:round;opacity:.85}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:52px;font-weight:800;letter-spacing:-2px;line-height:1}
.ring-pct span{font-size:22px;font-weight:600;color:var(--text2);margin-left:2px}
.ring-cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-top:6px}

/* ---------- ALERT ---------- */
.alert{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,var(--red-soft),transparent);border:1px solid var(--red-mid);border-radius:16px;padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden}
.alert::before{content:"";position:absolute;inset:0;border-radius:16px;border:1px solid var(--red);opacity:0;animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.alert-ic{flex-shrink:0;width:40px;height:40px;border-radius:11px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center}
.alert-ic svg{width:22px;height:22px}
.alert-body{flex:1;min-width:0}
.alert-title{font-weight:600;font-size:15px;margin-bottom:2px}
.alert-text{font-size:13px;color:var(--text2)}
.alert-btn{flex-shrink:0;font-family:inherit;font-weight:600;font-size:13px;color:var(--red);background:var(--red-soft);border:1px solid var(--red-mid);border-radius:10px;padding:9px 14px;cursor:pointer;transition:.18s}
.alert-btn:hover{background:var(--red);color:#fff}

/* ---------- BODY MAP ---------- */
.bodywrap{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.bodysvg{width:100%;max-width:760px;height:auto;display:block;margin:0 auto}
.bodysvg > g > g[stroke^="rgba(255,255,255"]{stroke:var(--text3)}
.bodysvg .organ{stroke:var(--text3);fill:var(--text3);fill-opacity:.08;stroke-opacity:.35;stroke-width:1.4;transition:fill-opacity .2s}
.bodysvg .organ:hover{fill-opacity:.7}
.bodysvg .detail{stroke:var(--bg);fill:none;stroke-width:1.2;stroke-opacity:.8}.bodysvg .detail2{fill:none;stroke-width:1.2;stroke-opacity:.6}.bodysvg .thick{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}.bodysvg .thin{fill:none;stroke-width:1.2}
.bodysvg .leader2{fill:none;stroke-width:1;stroke-opacity:.75}
.bodysvg .lbl-t{font-family:'Outfit',system-ui,sans-serif;fill:var(--text);font-weight:700;font-size:15px;letter-spacing:-.01em}
.bodysvg .lbl-s{font-family:'Outfit',system-ui,sans-serif;font-weight:600;font-size:11px}
.bodysvg .node{cursor:pointer}
.silhouette{opacity:.9}
.leader{stroke:var(--border2);stroke-width:1;stroke-dasharray:3 4;opacity:.7}
.node{cursor:pointer;opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center;transition:opacity .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.node.on{opacity:1;transform:scale(1)}
.node-halo{fill:transparent;opacity:.16}
.node-dot{stroke:var(--bg);stroke-width:2}
.node-ic{color:#06110d;opacity:.85}
.node-gradient .node-dot{stroke:var(--bg);stroke-width:2}
.node-gradient .node-halo{opacity:.16;animation:halo 3s ease-in-out infinite}
.node-green .node-dot{fill:var(--green)} .node-green .node-halo{fill:var(--green);animation:halo 3s ease-in-out infinite}
.node-amber .node-dot{fill:var(--amber)} .node-amber .node-halo{fill:var(--amber);animation:halo 3s ease-in-out infinite}
.node-red .node-dot{fill:var(--red)} .node-red .node-halo{fill:var(--red);animation:haloRed 1.8s ease-in-out infinite}
.node-red .node-ic,.node-amber .node-ic{color:#120c02}
body[data-theme="light"] .node-ic{color:#fff}
@keyframes halo{0%,100%{opacity:.14;r:18}50%{opacity:.26;r:22}}
@keyframes haloRed{0%,100%{opacity:.2}50%{opacity:.4}}
.node:hover .node-dot,.node:focus .node-dot{filter:brightness(1.15)}
.node:focus{outline:none}
.node:focus .node-halo{opacity:.4}
.scan rect{fill:var(--green);opacity:0}
.scan.run rect{animation:scan 1.5s cubic-bezier(.4,0,.2,1) 1}
@keyframes scan{0%{opacity:0;transform:translateY(70px)}10%{opacity:.5}90%{opacity:.5}100%{opacity:0;transform:translateY(330px)}}
.scan{transform-box:view-box}
.bodytip{position:fixed;z-index:200;transform:translate(-50%,-100%);background:var(--surface3);border:1px solid var(--border2);border-radius:10px;padding:8px 11px;font-size:12px;color:var(--text);pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:var(--shadow);white-space:nowrap}
.bodytip.show{opacity:1}
.bodytip strong{display:block;font-size:12.5px;margin-bottom:1px}
.tip-red{color:var(--red)}
.mpills{display:none;gap:8px;overflow-x:auto;padding:14px 2px 4px;-webkit-overflow-scrolling:touch}
.mpill{flex-shrink:0;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.mpill-dot{width:8px;height:8px;border-radius:50%;background:var(--pill-c, var(--green))}


/* ---------- SYSTEM GRID ---------- */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scard{display:flex;align-items:center;gap:13px;text-align:left;font-family:inherit;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.scard:hover{transform:translateY(-2px);border-color:var(--border2)}
.scard-ic{flex-shrink:0;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface2)}
.scard-ic svg{width:20px;height:20px;color:var(--text2)}
.scard .scard-ic{background:color-mix(in srgb,var(--sc) 15%,transparent)}.scard .scard-ic svg{color:var(--sc)}
.scard-body{flex:1;min-width:0}
.scard-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.scard-meta{font-size:12px;color:var(--text3)}
.scard-badge{flex-shrink:0;font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-align:center}


/* ---------- TOP FINDINGS ---------- */
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.find{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow);border-left:3px solid var(--border2)}
.find-red{border-left-color:var(--red)}.find-green{border-left-color:var(--green)}.find-amber{border-left-color:var(--amber)}
.find-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.find-name{font-size:14px;font-weight:600}
.find-val{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
.find-val span{font-size:13px;font-weight:500;color:var(--text3)}
.find-desc{font-size:13px;color:var(--text2);margin-top:12px;line-height:1.6}

/* ---------- ANALYSIS CARDS ---------- */
.acard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;border-left:3px solid var(--border2)}
.acard-green{border-left-color:var(--green)}.acard-red{border-left-color:var(--red)}.acard-blue{border-left-color:var(--blue)}
.acard-h{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin-bottom:14px}
.acard-dot{width:8px;height:8px;border-radius:50%}
.dot-green{background:var(--green)}.dot-red{background:var(--red)}.dot-blue{background:var(--blue)}
.acard-c{font-size:14.5px;color:var(--text2);line-height:1.85;white-space:pre-line}
.lead-warn{font-size:15px;font-weight:500;color:var(--text);line-height:1.7;padding:14px 16px;margin-bottom:16px;background:var(--red-soft);border-left:3px solid var(--red);border-radius:0 10px 10px 0;white-space:pre-line}
.numbered{padding-left:74px}
.num{position:absolute;left:22px;top:22px;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.num-red{background:var(--red-soft);color:var(--red)}
.hab-k{color:var(--green);font-weight:700}
.num-green{background:var(--green-soft);color:var(--green)}
.num-blue{background:var(--blue-soft);color:var(--blue)}

/* ---------- CONTROLS ---------- */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:11px 15px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.18s}
.search:focus{border-color:var(--green)}
.search::placeholder{color:var(--text3)}
.fbtn{font-family:inherit;font-size:13px;font-weight:600;color:var(--text3);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.18s}
.fbtn:hover{color:var(--text);border-color:var(--border2)}
.fbtn.active{color:var(--green);background:var(--green-soft);border-color:var(--green-mid)}

/* ---------- GROUPS ---------- */
.grp{margin-bottom:12px;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface)}
.grp-flash{box-shadow:0 0 0 2px var(--green-mid)}
.grp-h{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;cursor:pointer;user-select:none;transition:.18s}
.grp-h:hover{background:var(--surface2)}
.grp-name{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.grp-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text3)}
.grp-flag{color:var(--red);font-weight:600}
.chev{transition:transform .3s;color:var(--text3)}
.grp.open .chev{transform:rotate(180deg)}
.grp-body{display:none;padding:6px 12px 14px}
.grp.open .grp-body{display:block}

/* ---------- BIOMARKER CARD ---------- */
.bc{border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--bg2);transition:border-color .18s}
.bc:hover{border-color:var(--border2)}
.bc-red{background:linear-gradient(90deg,var(--red-soft),transparent 55%)}
.bc-green{background:linear-gradient(90deg,var(--green-soft),transparent 55%)}
.bc-amber{background:linear-gradient(90deg,var(--amber-soft),transparent 55%)}
.bc-main{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.bc-tick{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tick-red{background:var(--red)}.tick-green{background:var(--green)}.tick-amber{background:var(--amber)}.tick-blue{background:var(--blue)}
.bc-info{flex:1;min-width:110px}
.bc-name{font-size:14px;font-weight:500}
.bc-res{font-size:13px;color:var(--text2)}
.chip{flex-shrink:0;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.chip-flag{background:var(--red-soft);color:var(--red)}.chip-optimal{background:var(--green-soft);color:var(--green)}
.chip-range{background:var(--amber-soft);color:var(--amber)}.chip-qual{background:var(--blue-soft);color:var(--blue)}
.bc-chev{color:var(--text3);transition:transform .3s;flex-shrink:0}
.bc.open .bc-chev{transform:rotate(180deg)}
.bc-detail{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.bc-detail-in{padding:2px 16px 18px 39px;border-top:1px solid var(--border)}
.bc-desc{font-size:13.5px;color:var(--text2);line-height:1.7;padding-top:14px;margin-bottom:14px}
.bc-desc strong{color:var(--text);font-weight:600}
.bc-ranges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bc-ranges span{font-size:11.5px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:1px}
.bc-ranges em{font-style:normal;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bc-causes{font-size:12.5px;color:var(--text3);line-height:1.6}
.bc-causes em{font-style:normal;color:var(--text2);font-weight:600}

/* ---------- RANGE BAR ---------- */
.rbar-wrap{flex:1;max-width:240px;min-width:130px}
.rbar-big{max-width:none;margin:4px 0 2px}
.rbar{position:relative;height:10px;border-radius:6px;overflow:visible;
  background:linear-gradient(90deg,var(--red-mid),var(--amber-mid) 35%,var(--amber-mid) 65%,var(--red-mid))}
.rbar-normal{position:absolute;top:0;height:100%;background:var(--amber-soft);border-radius:6px}
.rbar-opt{position:absolute;top:0;height:100%;background:var(--green-mid);border-radius:6px;box-shadow:inset 0 0 0 1px var(--green-soft)}
.rbar-dot{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid var(--bg2);transition:left 1s cubic-bezier(.34,1.3,.5,1)}
.rbar-dot.dot-red{background:var(--red);box-shadow:0 0 10px var(--red-mid)}
.rbar-dot.dot-green{background:var(--green);box-shadow:0 0 10px var(--green-mid)}
.rbar-dot.dot-amber{background:var(--amber);box-shadow:0 0 10px var(--amber-mid)}

/* ---------- FOOTER ---------- */
.foot{text-align:center;padding:44px 22px;border-top:1px solid var(--border);margin-top:40px}
/* foot-brand replaced by .foot-logo img */
.foot p{font-size:12px;color:var(--text3);margin-bottom:5px}

/* ---------- GATE ---------- */
.gate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(700px 500px at 50% 30%, rgba(44,228,173,.1), transparent 60%);transition:opacity .5s,transform .5s}
.gate-out{opacity:0;transform:scale(1.04);pointer-events:none}

const REPORT_DATA = {"patient_name":"Mohammed Suleman","dob":"18/02/1999","report_date":"2026-10-12","summary":"This is a report for a 27-year-old male of South Asian ethnicity presenting with a BMI of 17.6, following a standard mixed diet, eating 0 to 1 portions of vegetables and fruit a day with takeaway or ultra-processed food most days and sugary food rarely; portions are small, and he often skips meals (volume 2 out of 10). He does no structured cardio or resistance training, with 5,000 to 7,500 daily steps at easy intensity. He sleeps 7 to 8 hours and wakes feeling refreshed, with steady energy throughout the day. Stress feels hard to manage some weeks. He does not drink alcohol. He works night shifts or rotating shifts. He takes no medications and no supplements. He has a family history of heart attack or stroke before 60, type 2 diabetes, and dementia. He has not had a previous blood test. He reports no symptoms. His goal is to build muscle.\n\nHis PhenoAge, a composite biological ageing score built from nine blood markers including albumin, glucose, CRP, white cell count and others, comes in at 21.3 against a calendar age of 27, meaning his blood is ageing nearly six years younger than his birth certificate. That is a genuinely excellent result and reflects the fact that most of his internal systems are working well. His Cardiovascular Risk Score, a TrueVitals index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c, comes in at 35 out of 100, which is within the acceptable range but above the ideal threshold of 20, and given his family history of premature cardiovascular disease this score deserves attention. The two markers driving it are his ApoB and his HDL, both discussed below.\n\nThere is a lot of good news in this report, and it is worth walking through it because at a BMI of 17.6 with minimal food intake and no training, these positives are not guaranteed. His kidney function is excellent. Cystatin C, a small protein filtered by the kidneys that gives a more accurate picture of filtration than creatinine alone, is 0.85, giving a cystatin C eGFR of 115, exactly where it should be at 27. His creatinine-based eGFR confirms the same picture at above 90. His liver is in very good health. ALT, the enzyme most specific to liver cell damage, is 21, comfortably below the optimal threshold of 30. Gamma GT (GGT), a liver enzyme that rises with metabolic strain, alcohol, or fat accumulation in the liver, is 23, within the optimal range. AST is 19. The FIB-4 score, a composite of age, platelets, AST and ALT used to screen for liver scarring, is 0.42, well within the safe range and effectively ruling out any fibrosis. The APRI score at 0.177 and the NAFLD Fibrosis Score at minus 4.515 both confirm the same reassuring picture. His blood sugar control is excellent. Fasting glucose is 5.0, HbA1c is 25 mmol/mol, which is one of the lowest readings we see and places him well within optimal, and his fasting insulin at 4.12 gives a HOMA-IR of 0.92, meaning his body needs very little insulin to manage his blood sugar. That insulin sensitivity is a significant positive, particularly given his family history of type 2 diabetes, because it means his pancreas is under no strain whatsoever at present. His thyroid is working well. TSH, the hormone the pituitary gland sends to the thyroid to ask it to produce more thyroid hormone, is 1.59, sitting within the optimal range of 1.0 to 2.5. Free T4 at 18.8 and Free T3 at 6.3 are both within the optimal range, and the FT3 to FT4 ratio at 0.335 confirms healthy conversion. Both thyroid antibodies, TPO and thyroglobulin, are negative, ruling out autoimmune thyroid disease. His testosterone is healthy at 23.4 nmol/L, sitting within the optimal range of 18 to 30, and his free testosterone at 0.452 and free androgen index at 57.92 are both within range, meaning SHBG at 40.4 is not binding too much of it. His bioavailable testosterone, the fraction available to tissues, comes in at 10.83. DHEA-S, the adrenal precursor to testosterone, is 5.2 umol/L, healthy and mid-range. Prolactin at 216 and LH at 7.77 are both within range. His iron studies are well balanced. Ferritin at 130 is within the optimal range of 50 to 200, transferrin saturation at 40.12% sits within the ideal window of 25 to 40%, serum iron at 26.4 is healthy, and transferrin at 2.62 and iron binding capacity at 62.5 are both within range. His haemoglobin at 161 and red cell count at 5.0 confirm the bone marrow is producing red cells well. His Lp(a), a genetically determined lipoprotein particle that independently drives cardiovascular risk, is below 25 nmol/L, well under the 32 threshold. This is genuinely useful information because it means the lipid findings discussed below are driven entirely by modifiable factors, not by an inherited particle he cannot change. It also means his family history of premature heart disease is not being amplified by Lp(a). His tumour markers are all clear. PSA at 0.42 with a free ratio of 0.429 is entirely normal for his age. CA19-9 and CEA are both well within range. His immunoglobulins IgG, IgM, IgA and IgE are all within range, and rheumatoid factor is negative. Tissue transglutaminase IgA is negative, effectively ruling out coeliac disease. His urine is clear, with no protein, glucose, blood, or significant bacterial growth.\n\nTurning to the findings that need attention, the most important is his cardiovascular lipid profile, and this matters more than it usually would at 27 because of his family history of heart attack or stroke before the age of 60. His ApoB is 0.99 g/L, above the 0.9 target. ApoB is the protein that sits on every LDL particle, every VLDL particle, and every Lp(a) particle, so it is essentially a count of the total number of particles capable of depositing cholesterol into artery walls. At 0.99, there are more of these particles circulating than is ideal. His LDL at 2.86 is within the laboratory range but above the optimal threshold of 2.6, and his Lp(a)-corrected LDL, which strips out the small contribution from Lp(a) particles, is 2.78, confirming this is genuine LDL elevation rather than an artefact of Lp(a). His HDL, the particle that removes cholesterol from artery walls and carries it back to the liver, is 1.0 mmol/L. The laboratory has flagged this as high, but their reference is set for risk stratification rather than optimal health: an HDL of 1.0 in a man is actually below the optimal threshold of 1.4 and below the desirable level of 1.55. Low HDL at his age, with no alcohol and no exercise, is almost certainly driven by the combination of very low body weight, minimal physical activity, and a diet dominated by ultra-processed food with almost no vegetables or fruit. His ApoA1, the protein on HDL particles, is 1.17, below the 1.20 desirable threshold, which mirrors the HDL finding. The ApoB to ApoA1 ratio at 0.846 is above the lower risk threshold of 0.7 and approaching the higher risk threshold of 0.9, placing him in the average risk category. His triglycerides at 0.75 are excellent, and the TG to HDL ratio is favourable, so this is not a pattern of insulin-driven dyslipidaemia. The Atherogenic Index of Plasma at minus 0.125 is within the optimal range. The pattern here is one of insufficient HDL production rather than excessive harmful particle generation, and the single biggest lever to raise HDL and lower ApoB simultaneously is regular exercise, particularly resistance training, combined with a substantial increase in dietary quality and quantity.\n\nHis Apolipoprotein A1 being below desirable and his HDL being below optimal together paint a consistent picture. In a 27-year-old who does not drink, does not smoke, and is underweight, the most likely explanation is that his body simply is not being given the raw materials or the metabolic stimulus to produce enough of the protective lipoprotein. Exercise, particularly resistance and moderate-intensity cardio, is the most potent stimulus for HDL production, and he does none. A diet with adequate healthy fats, omega-3 from oily fish, and a much higher intake of vegetables and fibre would also support HDL synthesis.\n\nHis oestradiol is 257 pmol/L, which is above the male reference limit of 146.1. Oestradiol is the primary oestrogen, and in men it is produced by the aromatase enzyme converting testosterone into oestradiol in fat tissue and other sites. At a BMI of 17.6, the usual explanation of excess aromatisation from body fat does not apply. His testosterone is healthy, his LH and FSH are normal, and his SHBG is mid-range, so the hypothalamic-pituitary-gonadal axis appears to be functioning well. Mildly elevated oestradiol in a young man with otherwise normal hormones can occur naturally and does not always indicate pathology, but at nearly twice the upper limit it is worth discussing with his GP. The GP may wish to repeat the test to confirm the finding, as a single elevated reading could reflect the timing of the sample or a transient fluctuation, and if confirmed, further investigation with an ultrasound of the testes and a more detailed hormone panel would be appropriate.\n\nHis neutrophils are 1.9, marginally below the lower limit of 2.0. Neutrophils are the most abundant white blood cell and the first line of defence against bacterial infection. At 1.9 against a limit of 2.0, this is a marginal finding, and benign ethnic neutropenia is well recognised in people of South Asian, African and Middle Eastern descent. It is a normal variant, not a disease, and does not increase infection risk. His total white cell count at 4.04 is just at the lower boundary of normal, consistent with the same explanation. His lymphocytes, monocytes, eosinophils and basophils are all within range. However, the combination of very low body weight, a diet volume of 2 out of 10, and no exercise means that low energy availability could also be contributing to a suppressed neutrophil count, and improving his nutrition would be expected to bring this up.\n\nHis C-Peptide is 0.733 ug/L, which converts to approximately 243 pmol/L, below the laboratory range of 1.1 to 4.4 ug/L (364 to 1,456 pmol/L). C-Peptide is released by the pancreas in exactly equal amounts to insulin, so it is used to measure how much insulin the pancreas is actually producing. His fasting glucose at 5.0 and HbA1c at 25 are both excellent, and his HOMA-IR at 0.92 confirms he is insulin-sensitive. In this context, low C-Peptide simply reflects low insulin demand: his body needs very little insulin to keep his blood sugar controlled, and his pancreas is responding appropriately by producing very little. This is not a sign of pancreatic failure. The lab has also noted that C-Peptide can degrade by up to 56% if the sample is not separated within four hours, so the true value may be somewhat higher. Given his excellent glucose control, this finding is reassuring rather than concerning.\n\nHis urea is 8.3 mmol/L, marginally above the upper limit of 8.2. Urea is a waste product from protein metabolism, filtered by the kidneys. At 0.1 above the limit with perfect kidney function (eGFR 115, creatinine 81, cystatin C 0.85), this is not a kidney concern. Mildly elevated urea with normal creatinine and eGFR is most commonly seen with mild dehydration or a higher protein intake relative to body size. At his very low body weight, even a modest amount of protein produces a proportionally higher urea load. The urea to creatinine ratio at 102.5 is marginally above the optimal range of 45 to 90, consistent with mild dehydration at the time of the sample rather than any kidney pathology.\n\nHis alkaline phosphatase (ALP) is 138 IU/L, above the upper limit of 116. ALP is an enzyme found in bone, liver, bile ducts and intestine. At 27, with all other liver markers clean (ALT 21, GGT 23, bilirubin 18, albumin 44) and no symptoms, elevated ALP in a young man is most commonly from bone. Bone turnover is still active in the mid-to-late twenties, and ALP from growing or remodelling bone is a normal finding. His calcium at 2.43, corrected calcium at 2.38, phosphate at 0.8 and PTH at 3.2 are all within range, so there is no suggestion of a parathyroid or bone mineral disorder. The most likely explanation is residual skeletal maturation, but if it persists on a future retest, his GP could request an ALP isoenzyme test to confirm the bone origin.\n\nHis hsCRP is 2.2 mg/L. CRP, or C-reactive protein, is a marker of systemic inflammation produced by the liver. While it is within the laboratory range of under 5, the optimal level is below 1.0. At 2.2, there is a low-grade inflammatory signal. In a non-drinker with no diagnosed conditions and no symptoms, the most likely contributors are his diet, which is high in ultra-processed food and very low in vegetables and fruit, and his shift work pattern, which is independently associated with higher inflammatory markers through disruption of the circadian rhythm. Improving his diet quality, increasing his vegetable and fruit intake, and managing the physiological stress of night shifts would all be expected to bring CRP down.\n\nHis cortisol is 601 nmol/L, at the very top of the morning reference range of 145.4 to 619.4. Cortisol is the body's primary stress hormone, produced by the adrenal glands, and follows a strong circadian pattern: it should be highest in the early morning and fall through the day. At 601, this is within range but high, and in someone working night shifts or rotating shifts, the cortisol rhythm can become dysregulated. The quiz shows he wakes feeling refreshed and has steady energy, which is reassuring, but a cortisol at this level combined with shift work is worth monitoring. If he begins to notice disrupted sleep, anxiety, or difficulty winding down, a repeat cortisol with a morning and evening sample would help map his rhythm.\n\nHis vitamin D is 82 nmol/L, which is above the sufficiency threshold of 50 and within the laboratory's adequate range, but below the optimal range of 75 to 120, sitting in the lower half of optimal. For a South Asian male in the UK, 82 is actually a reasonable level, as melanin-rich skin produces less vitamin D from sunlight. Maintaining supplementation through the winter months would be sensible to keep this above 75.\n\nHis vitamin B12 at 319 pg/mL is within the laboratory range but below the optimal threshold of 500. B12 is essential for nerve function, red blood cell production, and DNA synthesis. At 319, he has adequate stores but not optimal ones, and on a diet low in vegetables with frequent ultra-processed food, his intake of B12-rich whole foods (meat, fish, eggs, dairy) may be inconsistent. His folate at 6 ng/mL is within range but below the optimal level of 8, and folate works alongside B12 in the methylation cycle, so both being below optimal together is consistent with a diet very low in green vegetables and whole foods.\n\nHis serum osmolality is calculated at 301.3 mOsm/kg, above the normal range of 275 to 295. This is consistent with the mildly elevated urea and suggests he was mildly dehydrated at the time of the blood draw. It is not a clinical concern but reinforces the importance of adequate fluid intake, particularly during night shifts.\n\nHis ESR is 12 mm/hour, sitting exactly at the upper boundary of the reference range. ESR, or erythrocyte sedimentation rate, is a non-specific marker of inflammation. At exactly the boundary, with CRP also mildly elevated at 2.2, there is a consistent low-grade inflammatory signal, most likely diet and shift-work driven as discussed above.\n\nHis total antioxidant activity (TAA) at 1.94 is above the reference range of 1.3 to 1.77. TAA measures the overall antioxidant capacity of the blood. An elevated TAA is not a concern and can be seen with certain dietary patterns, recent food intake, or uric acid levels (his uric acid at 348 is within range and contributes to antioxidant capacity). This is not a finding that needs action.\n\nHis MCH at 32.3 pg is marginally above the upper limit of 32. MCH, mean corpuscular haemoglobin, is the average amount of haemoglobin in each red blood cell. At 0.3 above the limit with a normal MCV of 94 and normal MCHC of 343, this is laboratory variation and not clinically significant. His bilirubin at 18 is within range but towards the upper end, which in the context of completely clean liver enzymes and a marginally high MCH is consistent with Gilbert's syndrome, a harmless inherited variation in bilirubin metabolism affecting 5 to 10% of the population. It does not need treatment or monitoring.\n\nHis phosphate at 0.8 mmol/L is technically within range but sitting right at the lower boundary of 0.78. Phosphate is essential for bone mineralisation, energy production and cell signalling. At 0.8, this is adequate but not robust, and in a young man who is significantly underweight and eating very little, ensuring adequate dietary phosphate through dairy, meat, fish and whole grains would be sensible.\n\nHis progesterone at 2.26 nmol/L is within the male reference range. His creatine kinase at 61 is within range and reflects his current lack of resistance training; this marker will rise naturally as he begins training, which is normal.\n\nThe overarching theme of this report is that his internal health is very good for his age, with excellent blood sugar control, insulin sensitivity, kidney function, liver health, thyroid function and testosterone. His PhenoAge of 21.3 reflects this. However, his body is significantly underweight at a BMI of 17.6, he is eating far too little (volume 2 out of 10), the food he is eating is dominated by ultra-processed items with almost no vegetables or fruit, and he does no exercise at all. His goal is to build muscle, and the honest assessment is that every single aspect of his current lifestyle works against that goal. His body cannot build muscle without substantially more calories, substantially more protein, resistance training, and better food quality. The cardiovascular lipid findings, the low HDL, the elevated ApoB, the below-optimal B12 and folate, and the low-grade inflammation are all downstream consequences of the same root cause: not enough food, not enough good food, and not enough physical demand on the body. The good news is that every one of these findings is modifiable, and at 27 with his excellent baseline organ function, the response to change will be fast.","links":"The central thread through this report is energy availability. At 57 kg and 180 cm, with a BMI of 17.6, a diet volume of 2 out of 10, and no structured exercise, the body is in a state of chronic under-fuelling. The blood results reflect this in several interconnected ways.\n\nFirst, the immune and inflammatory picture. Neutrophils at 1.9, just below range, alongside a total white cell count of 4.04 at the floor of normal, could partly reflect benign ethnic neutropenia, which is a well-recognised normal variant in people of South Asian descent. But chronic under-eating also suppresses neutrophil production, and at his level of energy intake, both explanations likely contribute. Meanwhile, hsCRP at 2.2 and ESR at 12, both at or above their respective boundaries, suggest low-grade systemic inflammation. The most likely sources are the high intake of ultra-processed food, the near absence of anti-inflammatory nutrients from vegetables and fruit, and the circadian disruption of shift work. These are not acute inflammatory signals, but they are a background hum that, over years, contributes to cardiovascular risk and accelerated ageing.\n\nSecond, the lipid picture connects directly to both diet and activity. His ApoB at 0.99 and LDL at 2.86 are above optimal, while his HDL at 1.0 and ApoA1 at 1.17 are below optimal. Triglycerides are excellent at 0.75, so this is not an insulin-driven pattern. The low HDL is the most telling finding: in a 27-year-old non-drinker, the two most powerful determinants of HDL are exercise (which he does none of) and dietary quality (which is poor). The ApoB to ApoA1 ratio at 0.846 summarises the imbalance: not enough protective particles relative to harmful ones. His Lp(a) below 25 is the crucial exclusion, because it confirms the entire lipid picture is modifiable. Given his family history of premature cardiovascular events, this is not a pattern to leave alone, even at 27. The Cardiovascular Risk Score of 35 is acceptable but not ideal, and the inputs driving it are exactly the ones that diet and exercise will move.\n\nThird, the hormonal finding that does not fit the pattern. Oestradiol at 257 pmol/L, nearly twice the male upper limit, is unexpected in an underweight young man. The usual mechanism in men, aromatisation of testosterone in adipose tissue, does not apply at his body fat level. His testosterone, LH, FSH and SHBG are all normal, so the hypothalamic-pituitary-gonadal axis is intact. This may be a transient finding, a sample timing effect, or it may point to an exogenous source or a rarer endocrine explanation. It is the one finding in this report that warrants GP investigation rather than lifestyle change alone.\n\nFourth, the nutritional picture. B12 at 319 and folate at 6 are both adequate but below optimal, consistent with a diet low in whole foods, green vegetables and quality protein. Vitamin D at 82 is reasonable for his ethnicity but needs maintenance. Phosphate at 0.8 is at the floor of range. These are not deficiency states, but they are the early signs of a diet that is not providing enough micronutrient density, and they will worsen if intake does not improve.\n\nThe positive exclusions are important. His blood sugar control is excellent, with HbA1c of 25 and HOMA-IR of 0.92, which is particularly reassuring given his family history of type 2 diabetes. His liver, kidneys, thyroid and prostate are all clear. His PhenoAge of 21.3 confirms that, at a cellular level, his body is ageing well despite the lifestyle factors working against it. The window to build on this foundation is now, before the cumulative effects of under-eating, poor diet quality, no exercise and shift work begin to erode what is currently a very healthy baseline.","lifestyle":"Start resistance training twice a week, using a beginner programme with compound movements: squats, deadlifts, bench press, rows, overhead press. Anchor: pick two fixed days, the same each week, and treat them as non-negotiable. Why: resistance training is the single most powerful stimulus for building muscle, raising HDL, lowering ApoB, and improving insulin sensitivity, and right now you do none of it.\nEat three full meals every day, no skipping. Anchor: set alarms if needed, especially around shift patterns. Why: at 57 kg with a diet volume of 2 out of 10, your body does not have the raw materials to build muscle or produce enough HDL, and undereating is the root cause of most of the findings in this report.\nAdd a palm-sized portion of protein to every meal: eggs, chicken, fish, Greek yoghurt, lentils, or beef mince. Anchor: protein goes on the plate first, before anything else. Why: you need a minimum of 91 g of protein a day to support muscle growth, and at your current intake this is almost certainly not being met.\nAdd at least two portions of vegetables or fruit to your daily intake, building towards four or five. Anchor: one portion at lunch, one at dinner, added to whatever you are already eating. Why: your current intake of 0 to 1 portions is contributing to your below-optimal folate, your elevated CRP of 2.2, and your low HDL, because vegetables and fruit provide fibre, antioxidants and anti-inflammatory compounds that directly improve all three.\nReplace one ultra-processed meal per day with a whole-food alternative. Anchor: start with whichever meal is easiest, often lunch. Swap a meal deal for a chicken and rice bowl or a wrap with real ingredients. Why: ultra-processed food most days is driving low-grade inflammation and providing calories without the micronutrients your body needs.\nDrink at least 2 litres of water across your waking hours, more on shift days. Anchor: carry a bottle and finish it by the midpoint of your shift, refill and finish by the end. Why: your calculated serum osmolality at 301.3 and urea at 8.3 both suggest you were mildly dehydrated at the time of the blood draw.\nOn night shifts, eat your main meal before the shift and a smaller meal during it rather than grazing on snacks. Anchor: prepare food before the shift starts. Why: shift work disrupts circadian cortisol rhythms, and structured meal timing is one of the few things shown to reduce the metabolic impact of night work.\nAim for 7,500 to 10,000 steps on rest days. Anchor: a 15-minute walk after your main meal. Why: even modest increases in daily movement improve insulin sensitivity and support the cardiovascular profile.","flags":"ApoB 0.99 g/L (target below 0.9), HDL 1.0 mmol/L (optimal above 1.4), ApoA1 1.17 g/L (desirable above 1.20), ApoB/A1 ratio 0.846 (lower risk below 0.7). Consistent lipid pattern of insufficient protective particles with mildly excessive atherogenic particles, driven by no exercise and poor diet quality. Cardiovascular Risk Score 35/100, acceptable but above ideal of 20. Family history of premature cardiovascular disease makes this a priority.\nOestradiol 257 pmol/L (male upper limit 146.1). Nearly twice the reference limit in a young man with normal testosterone, LH, FSH and SHBG. Mechanism unclear at BMI 17.6. Recommend GP review with repeat oestradiol, and if confirmed, further investigation.\nNeutrophils 1.9 x10^9/L (lower limit 2.0). Marginal finding in a South Asian male where benign ethnic neutropenia is a recognised normal variant. Low energy availability may also contribute. No clinical action needed unless recurrent infections develop.\nC-Peptide 0.733 ug/L (range 1.1 to 4.4). Below range but in the context of fasting glucose 5.0, HbA1c 25 and HOMA-IR 0.92, this reflects low insulin demand rather than pancreatic insufficiency. Lab notes potential sample degradation.\nUrea 8.3 mmol/L (upper limit 8.2). Marginally above range with perfect kidney function (eGFR 115). Most likely mild dehydration. Urea:creatinine ratio 102.5 supports this.\nALP 138 IU/L (upper limit 116). All other liver markers clean. Most likely bone-origin ALP from residual skeletal maturation at age 27. If persistent on retest, ALP isoenzyme testing would confirm.\nhsCRP 2.2 mg/L (optimal below 1.0). Low-grade inflammation, most likely from ultra-processed food intake, minimal vegetable consumption, and circadian disruption from shift work.\nCortisol 601 nmol/L (morning range 145.4 to 619.4). Within range but at the ceiling. Shift work is the most likely explanation. Monitor if symptoms of cortisol dysregulation develop.\nESR 12 mm/hour (upper limit 12). At the boundary. Consistent with the mild inflammatory signal from CRP.\nVitamin B12 319 pg/mL (optimal above 500). Adequate but below optimal. Dietary quality is the likely driver.\nFolate 6 ng/mL (optimal above 8). Below optimal. Consistent with a diet very low in green vegetables and whole foods.\nSerum osmolality 301.3 mOsm/kg (range 275 to 295). Above range, consistent with mild dehydration.\nMCH 32.3 pg (upper limit 32). Marginally above range with normal MCV and MCHC. Laboratory variation, not clinically significant.\nReassuring negatives: Lp(a) below 25 (inherited cardiovascular risk excluded), HbA1c 25 and HOMA-IR 0.92 (no insulin resistance despite family history of type 2 diabetes), liver fibrosis excluded (FIB-4 0.42, APRI 0.177), thyroid function optimal with negative antibodies, testosterone 23.4 within optimal range, PSA 0.42 normal, all tumour markers clear, coeliac screen negative, immunoglobulins normal, rheumatoid factor negative, kidney function excellent (cystatin C eGFR 115), PhenoAge 21.3 (biologically 5.7 years younger).","recommendations":"Discuss the elevated oestradiol of 257 pmol/L with your GP. Ask for a repeat fasting oestradiol to confirm the finding, and if confirmed, request further investigation including an ultrasound of the testes and a more detailed hormone assessment. Bring the result showing testosterone 23.4, LH 7.77, FSH 5.5 and SHBG 40.4 are all normal, as this context is important.\nDiscuss your ApoB of 0.99 (target below 0.9), HDL of 1.0 (optimal above 1.4), and your family history of heart attack or stroke before 60 with your GP. Given the family history, your GP may wish to perform a formal cardiovascular risk assessment and discuss whether early intervention beyond lifestyle change is appropriate.\nMention the ALP of 138 (limit 116) with all other liver markers normal. If the GP considers it worth investigating, an ALP isoenzyme test will confirm whether it is from bone, which is the most likely explanation at your age.\nMention the neutrophils of 1.9 (limit 2.0) and that you are of South Asian ethnicity, as benign ethnic neutropenia is a recognised normal variant and the GP can note this on your record.\nAim for a daily calorie intake of approximately 2,400 to 2,600 kcal to support weight gain and muscle building, based on your current weight of 57 kg, height of 180 cm, and sedentary activity level with a target of gaining 0.25 to 0.5 kg per week towards a healthier weight of 65 to 70 kg. Protein target: a minimum of 91 g per day (1.6 g per kg), ideally building to 100 to 114 g (1.8 to 2.0 g per kg) once resistance training is established. Retest in six months with a focused panel including: lipid profile with ApoB and ApoA1, hsCRP, oestradiol, full blood count, B12, folate, and vitamin D to track the response to dietary and training changes.","supplementation":"Vitamin D3 (cholecalciferol), 2,000 IU daily taken with a meal containing fat. Continue through autumn and winter at minimum, year-round if shift work limits sun exposure. Why: your vitamin D at 82 is within the sufficient range but needs maintaining, and South Asian skin produces less vitamin D from sunlight. Take with vitamin K2 (MK-7), 100 mcg daily, which directs calcium into bone rather than arteries.\nVitamin B12 (sublingual methylcobalamin), 1,000 mcg daily, dissolved under the tongue first thing in the morning. Why: your B12 at 319 is adequate but below the optimal level of 500, and sublingual absorption bypasses any variation in gut absorption.\nFolate (methylfolate), 400 to 800 mcg daily. Why: your folate at 6 is below the optimal level of 8. Folate and B12 work together in the methylation cycle, and both are below optimal.\nOmega-3 fish oil, 2 g of combined EPA and DHA daily, taken with food. Why: omega-3 supports HDL production, lowers inflammatory markers including CRP, and at your current dietary intake you are very unlikely to be getting enough from food.\nMagnesium glycinate, 300 mg before bed on nights when you are sleeping during the day or struggling with shift-change sleep. Why: your magnesium at 0.92 is within optimal range, but magnesium glycinate supports sleep quality and muscle recovery, both of which matter for a shift worker beginning a training programme.\nDo not take iron supplements. Your ferritin at 130 and transferrin saturation at 40% are both within the optimal range, and additional iron could push stores above the ideal level.\nThe most important changes from this report are not supplements. They are eating three full meals a day with protein at every meal, adding vegetables and fruit, replacing ultra-processed food with whole food, and starting resistance training twice a week. No supplement will build muscle or raise HDL in the absence of food and exercise.","is_retest":false,"biomarkers":[{"key":"truescore","name":"TrueScore","group":"OVERALL HEALTH","result":"59","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5364","lower_normal":"55","upper_normal":"","lower_optimal":"70","upper_optimal":"","lower_normal_position":"0.5000","upper_normal_position":"1.0000","lower_optimal_position":"0.6364","upper_optimal_position":"1.0000","units":"/100","description":"Your TrueScore is 59 out of 100. Every marker is scored on how far it sits from its ideal range, combined by body system with the systems that matter most for long-term health weighted highest, and then capped by the most serious finding, so a result that needs a GP cannot be hidden by good numbers elsewhere. Fair. Raw 70.1; held to 59 by a system rated \"See your GP\". Weakest systems: hormones 52%, electrolytes & minerals 58%, liver & metabolic 60%. Biggest drags: Apolipoprotein B, HDL Cholesterol, Urea, Oestradiol.","low_causes":"One or more systems well outside ideal, or a finding that needs a GP","high_causes":"","padding":"1","one_sided":"0.5","range_type":"no upper"},{"key":"phenoage","name":"PhenoAge","group":"OVERALL HEALTH","result":"21.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3328","lower_normal":"","upper_normal":"32","lower_optimal":"","upper_optimal":"27","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4219","units":"years","description":"PhenoAge is a composite biological ageing score developed by Morgan Levine at Yale, built from nine blood markers: albumin, creatinine, glucose, CRP, lymphocyte percentage, MCV, RDW, alkaline phosphatase and white cell count. At 21.3 years against a calendar age of 27, this means the blood is ageing nearly six years younger than the birth certificate. The markers driving this favourable result include the excellent glucose of 5.0, healthy albumin at 44, low CRP relative to the model's expectation, and normal RDW at 12.7. This is an excellent result.","low_causes":"Low inflammation, healthy blood counts","high_causes":"Inflammation, raised glucose, anaemia, kidney or liver strain, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cardiovascularriskscore","name":"Cardiovascular Risk Score","group":"OVERALL HEALTH","result":"35","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4375","lower_normal":"","upper_normal":"40","lower_optimal":"","upper_optimal":"20","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.2500","units":"/100","description":"The TrueVitals Cardiovascular Risk Score is an index from 0 to 100 built from ApoB, LDL, HDL, triglycerides, Lp(a), hsCRP and HbA1c. It measures the cardiovascular risk being built, not the ten-year chance of an event. At 35, this is within the acceptable range of under 40 but above the ideal threshold of 20. The inputs driving the score are the ApoB at 0.99 (above the 0.9 target), the HDL at 1.0 (below the 1.4 optimal), and the hsCRP at 2.2 (above the 1.0 optimal). At 27, the ten-year risk of a cardiovascular event is low, but the gap between a low ten-year risk and a score of 35 is the window for acting. Given his family history of premature cardiovascular disease, this is the right time to start.","low_causes":"Optimal lipid profile, low inflammation, good metabolic health","high_causes":"Raised ApoB or LDL, high Lp(a), inflammation, raised HbA1c, smoking","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"glu","name":"Blood Glucose","group":"GLUCOSE & INSULIN","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5333","lower_normal":"3.5","upper_normal":"6","lower_optimal":"4","upper_optimal":"5.4","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.5867","units":"mmol/L","description":"Blood glucose is the amount of sugar circulating in the bloodstream after fasting. At 5.0 mmol/L, this sits comfortably within the optimal range of 4.0 to 5.4, indicating the body is managing blood sugar efficiently. This is particularly reassuring given the family history of type 2 diabetes.","low_causes":"Prolonged fasting, excessive insulin, liver disease","high_causes":"Insulin resistance, type 2 diabetes, stress response, high carbohydrate intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ghb","name":"HbA1c (%)","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3750","lower_normal":"0","upper_normal":"6","lower_optimal":"0","upper_optimal":"5.7","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4750","units":"%","description":"HbA1c measures the percentage of haemoglobin in red blood cells that has been coated with sugar over the previous two to three months, giving a long-term picture of blood sugar control. At 4.5%, this is well within the normal range of under 6.0% and far from the pre-diabetic threshold of 6.0 to 6.4%. This is one of the lowest readings we see and confirms excellent long-term glucose regulation.","low_causes":"Low carbohydrate intake, anaemia, blood loss","high_causes":"Insulin resistance, type 2 diabetes, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ghbi","name":"HbA1c (mmol/mol)","group":"GLUCOSE & INSULIN","result":"25","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2976","lower_normal":"0","upper_normal":"42","lower_optimal":"0","upper_optimal":"36","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.4286","units":"mmol/mol","description":"This is the same HbA1c measurement expressed in the international units of mmol/mol. At 25, well below the normal threshold of 42 and the optimal threshold of 36, this confirms excellent long-term blood sugar control. Given the family history of type 2 diabetes, this is a genuinely reassuring result.","low_causes":"Low carbohydrate intake, anaemia, blood loss","high_causes":"Insulin resistance, type 2 diabetes, high sugar intake","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ins","name":"Insulin","group":"GLUCOSE & INSULIN","result":"4.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2364","lower_normal":"2.6","upper_normal":"24.9","lower_optimal":"2","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3064","upper_optimal_position":"0.4082","units":"mIU/L","description":"Fasting insulin measures how much insulin the pancreas needs to produce to keep blood sugar under control. At 4.12 mIU/L, this is within the optimal range of 2 to 8, meaning the body is highly insulin-sensitive and the pancreas is under minimal strain. This is an excellent result, especially in the context of a family history of type 2 diabetes.","low_causes":"Very low carbohydrate intake, low calorie intake, high insulin sensitivity","high_causes":"Insulin resistance, high carbohydrate diet, obesity, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cpep","name":"C-Peptide","group":"GLUCOSE & INSULIN","result":"0.733","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1108","lower_normal":"1.1","upper_normal":"4.4","lower_optimal":"1.1","upper_optimal":"3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5758","units":"ug/L","description":"C-Peptide is a protein released by the pancreas in equal amounts to insulin, providing an independent measure of how much insulin the pancreas is producing. At 0.733 ug/L (approximately 243 pmol/L), this is below the laboratory range of 1.1 to 4.4, but in the context of a fasting glucose of 5.0, HbA1c of 25 and HOMA-IR of 0.92, this simply reflects very low insulin demand from a highly insulin-sensitive body. The lab has noted that C-Peptide can degrade by up to 56% if the sample is not separated within four hours. This is not a sign of pancreatic failure.","low_causes":"High insulin sensitivity, low carbohydrate intake, sample degradation, type 1 diabetes","high_causes":"Insulin resistance, insulinoma, kidney disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"homa","name":"HOMA-IR","group":"GLUCOSE & INSULIN","result":"0.92","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3067","lower_normal":"0.5","upper_normal":"1.5","lower_optimal":"0.5","upper_optimal":"1","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5000","units":"","description":"HOMA-IR (Homeostatic Model Assessment of Insulin Resistance) is calculated from fasting glucose and fasting insulin to estimate how resistant the body is to insulin. At 0.92, this is within the optimal range and below 1.0, meaning the body is insulin-sensitive. A score below 1.0 is considered optimal, above 1.9 indicates early insulin resistance, and above 2.9 indicates significant insulin resistance. This result confirms excellent metabolic health.","low_causes":"High insulin sensitivity, very low carbohydrate diet, low calorie intake","high_causes":"Insulin resistance, obesity, metabolic syndrome, polycystic ovarian syndrome","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"estimatedaverageglucose","name":"Estimated Average Glucose","group":"GLUCOSE & INSULIN","result":"4.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3214","lower_normal":"","upper_normal":"7","lower_optimal":"","upper_optimal":"6.2","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4429","units":"mmol/L","description":"Estimated average glucose is derived from HbA1c and represents the average blood sugar over the previous two to three months. At 4.5 mmol/L, this confirms excellent long-term blood sugar control.","low_causes":"Low carbohydrate intake, excellent insulin sensitivity","high_causes":"Prediabetes, type 2 diabetes","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"tygindex","name":"TyG Index","group":"GLUCOSE & INSULIN","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4545","lower_normal":"","upper_normal":"8.8","lower_optimal":"","upper_optimal":"8.5","lower_normal_position":"0.0000","upper_normal_position":"0.5000","lower_optimal_position":"0.0000","upper_optimal_position":"0.4830","units":"index","description":"The TyG index is calculated from fasting triglycerides and glucose and is used as a surrogate marker of insulin resistance. At 8.0, this is within the optimal range of below 8.5, confirming good insulin sensitivity. This aligns with the HOMA-IR of 0.92.","low_causes":"High insulin sensitivity, low triglycerides","high_causes":"Insulin resistance, metabolic syndrome","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"fesa","name":"Transferrin Saturation","group":"IRON STUDIES","result":"40.12","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5315","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3956","upper_optimal_position":"0.5289","units":"%","description":"Transferrin saturation shows what proportion of the iron-carrying protein transferrin is loaded with iron. At 40.12%, this sits right at the top of the optimal range of 25 to 40%, indicating healthy iron transport with no excess and no deficiency.","low_causes":"Iron deficiency, chronic disease, low dietary iron","high_causes":"Iron overload, haemochromatosis, excessive supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fe","name":"Serum Iron","group":"IRON STUDIES","result":"26.4","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5842","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":" cription":"Total iron binding capacity (TIBC) measures the maximum amount of iron the blood could carry if every transferrin molecule were fully loaded. At 62.5 umol/L, this is within the reference range and indicates normal iron-carrying capacity. It is read alongside serum iron and transferrin to complete the iron transport picture.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferr","name":"Ferritin","group":"IRON STUDIES","result":"130","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4511","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3644","upper_optimal_position":"0.5267","units":"ng/mL","description":"Ferritin is the protein that stores iron inside cells, and the blood level reflects total body iron stores. At 130 ng/mL, this is within the optimal range of 50 to 200 for a male, indicating healthy iron reserves without excess. This is a good level for supporting red blood cell production and energy.","low_causes":"Iron deficiency, chronic blood loss, poor dietary intake, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hbgl","name":"Haemoglobin","group":"HEMATOLOGY","result":"161","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5917","lower_normal":"130","upper_normal":"170","lower_optimal":"140","upper_optimal":"165","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6250","units":"g/L","description":"Haemoglobin is the protein inside red blood cells that carries oxygen from the lungs to every tissue in the body. At 161 g/L, this is within the optimal range for a male and confirms the bone marrow is producing healthy red cells with adequate iron.","low_causes":"Iron deficiency, B12 or folate deficiency, chronic disease, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rbc","name":"Red Blood Cell Count","group":"HEMATOLOGY","result":"5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5000","lower_normal":"4.5","upper_normal":"5.5","lower_optimal":"4.6","upper_optimal":"5.3","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^12/L","description":"The red blood cell count measures the total number of red cells per litre of blood. At 5.0, this sits in the middle of both the laboratory and optimal ranges, confirming healthy red cell production.","low_causes":"Anaemia, bone marrow disorders, chronic disease, nutritional deficiency","high_causes":"Dehydration, polycythaemia, chronic hypoxia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"hct","name":"Haematocrit","group":"HEMATOLOGY","result":"0.47","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"0.4","upper_normal":"0.5","lower_optimal":"0.41","upper_optimal":"0.48","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"L/L","description":"Haematocrit is the proportion of blood volume occupied by red blood cells. At 0.47, this is within the optimal range for a male, indicating a healthy balance between red cells and plasma volume.","low_causes":"Anaemia, overhydration, blood loss","high_causes":"Dehydration, polycythaemia, chronic lung disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"rdw","name":"Red Cell Distribution Width","group":"HEMATOLOGY","result":"12.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4476","lower_normal":"11.5","upper_normal":"15","lower_optimal":"11.5","upper_optimal":"13.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5238","units":"%","description":"RDW measures the variation in size among red blood cells. A low RDW means the cells are uniform, which is healthy. At 12.7%, this is within optimal, confirming that red cell production is consistent and there is no mixed deficiency pattern.","low_causes":"Normal variation","high_causes":"Iron deficiency, B12 or folate deficiency, mixed deficiency, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcv","name":"Mean Corpuscular Volume","group":"HEMATOLOGY","result":"94","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5370","lower_normal":"83","upper_normal":"101","lower_optimal":"85","upper_optimal":"96","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3704","upper_optimal_position":"0.5741","units":"fL","description":"MCV is the average size of each red blood cell. At 94 fL, this is within the optimal range, indicating the cells are a normal size. Small cells suggest iron deficiency, large cells suggest B12 or folate deficiency; his are neither.","low_causes":"Iron deficiency, thalassaemia trait, chronic disease","high_causes":"B12 or folate deficiency, alcohol excess, liver disease, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mch","name":"Mean Corpuscular Haemoglobin","group":"HEMATOLOGY","result":"32.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7200","lower_normal":"27","upper_normal":"32","lower_optimal":"28","upper_optimal":"32","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4000","upper_optimal_position":"0.6667","units":"pg","description":"MCH is the average amount of haemoglobin packed into each red blood cell. At 32.3 pg, this is marginally above the upper limit of 32. With a normal MCV of 94 and MCHC of 343, this is laboratory variation rather than a clinical finding and does not suggest any underlying problem.","low_causes":"Iron deficiency, thalassaemia trait","high_causes":"B12 or folate deficiency, macrocytosis, laboratory variation","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mcgl","name":"MCHC","group":"HEMATOLOGY","result":"343","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6444","lower_normal":"315","upper_normal":"345","lower_optimal":"325","upper_optimal":"345","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4444","upper_optimal_position":"0.6667","units":"g/L","description":"MCHC is the average concentration of haemoglobin within each red blood cell. At 343 g/L, this is within both the laboratory and optimal ranges, confirming that each red cell is appropriately packed with haemoglobin.","low_causes":"Iron deficiency, thalassaemia","high_causes":"Hereditary spherocytosis, dehydration, laboratory artefact","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"plts","name":"Platelets","group":"HEMATOLOGY","result":"268","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4846","lower_normal":"150","upper_normal":"410","lower_optimal":"180","upper_optimal":"350","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3718","upper_optimal_position":"0.6026","units":"x10^9/L","description":"Platelets are small cell fragments that help blood clot when needed. At 268, this is within the optimal range, indicating normal platelet production and no evidence of bone marrow stress or excessive consumption.","low_causes":"Viral infection, bone marrow disorders, autoimmune conditions, medications","high_causes":"Iron deficiency, infection, inflammation, bone marrow disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"8.3","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4667","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"9.5","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6000","units":"fL","description":"MPV measures the average size of platelets. At 8.3 fL, this is within the optimal range, indicating that platelets are being produced at a normal rate and are a normal size.","low_causes":"Bone marrow suppression, aplastic anaemia, inflammatory conditions","high_causes":"Platelet destruction, immune thrombocytopenia, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"4.04","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3400","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3611","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count is a measure of the total number of immune cells circulating in the blood. At 4.04, this sits just inside the lower boundary of the laboratory range, driven by the slightly low neutrophil count. In someone of South Asian ethnicity, a white cell count at the lower end of range is often a normal variant. Low energy availability from chronic undereating may also contribute.","low_causes":"Benign ethnic neutropenia, viral infection, low energy availability, bone marrow suppression, medications","high_causes":"Infection, inflammation, stress, smoking, steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neut","name":"Neutrophils","group":"HEMATOLOGY","result":"1.9","within_normal":"FALSE","within_optimal":"FALSE","result_ auses":"Allergic reactions, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ret","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"1.04","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4233","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. Their percentage reflects how actively the bone marrow is producing new red cells. At 1.04%, this is within the optimal range, indicating healthy and appropriate red cell production.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic kidney disease","high_causes":"Haemolysis, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reta","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"52","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"50","upper_normal":"100","lower_optimal":"55","upper_optimal":"90","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.3667","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count is the total number of young red blood cells in circulation. At 52, this sits just inside the lower end of the laboratory range. It is adequate and consistent with the normal percentage reticulocyte count and haemoglobin. A slightly higher result would be expected as caloric intake and body weight increase.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease","high_causes":"Haemolysis, blood loss, recovery from anaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"m
