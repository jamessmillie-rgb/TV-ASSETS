s":"Infection, inflammation, iron deficiency, post-surgery, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"mpv","name":"Mean Platelet Volume","group":"HEMATOLOGY","result":"9.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5667","lower_normal":"7.1","upper_normal":"10.1","lower_optimal":"7.5","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3778","upper_optimal_position":"0.6556","units":"fL","description":"MPV measures the average size of platelets. Larger platelets tend to be younger and more active. At 9.2, this is within the optimal range and shows normal platelet turnover.","low_causes":"Bone marrow suppression, medications","high_causes":"Platelet destruction (ITP), inflammation, vitamin D deficiency","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"wbc","name":"White Blood Cell Count","group":"HEMATOLOGY","result":"8.01","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5558","lower_normal":"4","upper_normal":"10","lower_optimal":"4.5","upper_optimal":"8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3889","upper_optimal_position":"0.5556","units":"x10^9/L","description":"The white blood cell count measures the total number of immune cells in the blood. At 8.01, this is within the laboratory range but right at the upper edge of the optimal band of 4.5 to 8.0. A WBC at this level is normal and shows an active, responsive immune system without evidence of infection or inflammation.","low_causes":"Viral infections, bone marrow suppression, autoimmune disease, medications","high_causes":"Infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"neutrophils","name":"Neutrophils","group":"HEMATOLOGY","result":"4.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4993","lower_normal":"2","upper_normal":"7","lower_optimal":"2.5","upper_optimal":"5.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"x10^9/L","description":"Neutrophils are the most abundant white blood cells and the first responders to bacterial infection. At 4.49, this is within the optimal range and shows healthy innate immune function.","low_causes":"Viral infections, medications, autoimmune disease, bone marrow suppression","high_causes":"Bacterial infection, inflammation, stress, smoking, corticosteroids","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lymphocytes","name":"Lymphocytes","group":"HEMATOLOGY","result":"2.99","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.6650","lower_normal":"1","upper_normal":"3","lower_optimal":"1.5","upper_optimal":"2.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4167","upper_optimal_position":"0.6333","units":"x10^9/L","description":"Lymphocytes are white blood cells that drive the adaptive immune response, including antibody production and viral defence. At 2.99, this is at the upper end of the reference range and just above the optimal band of 1.5 to 2.8. A lymphocyte count at this level is not a concern and may reflect a recent minor immune activation. All immunoglobulin levels are normal.","low_causes":"Stress, corticosteroids, HIV, autoimmune disease","high_causes":"Viral infection, chronic inflammation, lymphocytic leukaemia (high levels)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"monocytes","name":"Monocytes","group":"HEMATOLOGY","result":"0.44","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4333","lower_normal":"0.2","upper_normal":"1","lower_optimal":"0.2","upper_optimal":"0.8","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Monocytes are white blood cells that migrate into tissues and become macrophages, clearing debris and dead cells. At 0.44, this is within the optimal range.","low_causes":"Bone marrow suppression, corticosteroids","high_causes":"Chronic infection, inflammation, autoimmune disease, recovery from infection","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"eosinophils","name":"Eosinophils","group":"HEMATOLOGY","result":"0.09","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3819","lower_normal":"0.02","upper_normal":"0.5","lower_optimal":"0.02","upper_optimal":"0.4","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"x10^9/L","description":"Eosinophils are white blood cells involved in the response to parasites and allergic reactions. At 0.09, this is well within the optimal range, consistent with his normal IgE and no evidence of allergy or parasitic infection.","low_causes":"Stress, corticosteroids, acute infection","high_causes":"Allergy, asthma, parasitic infection, eczema, drug reactions","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"basophils","name":"Basophils","group":"HEMATOLOGY","result":"0.01","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3333","lower_normal":"0.01","upper_normal":"0.1","lower_optimal":"0.01","upper_optimal":"0.08","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5926","units":"x10^9/L","description":"Basophils are the rarest white blood cells, involved in allergic and inflammatory responses. The lab reported this as less than 0.01, which sits at the detection limit. At this level it is essentially at the lower boundary of the range and has no clinical significance. Basophils are normally present in very small numbers.","low_causes":"Stress, corticosteroids, hyperthyroidism","high_causes":"Allergy, chronic inflammation, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocytes","name":"Reticulocyte Count (%)","group":"HEMATOLOGY","result":"0.81","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3847","lower_normal":"0.5","upper_normal":"2.5","lower_optimal":"0.5","upper_optimal":"2.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"%","description":"Reticulocytes are young red blood cells freshly released from the bone marrow. The percentage reflects the proportion of circulating red cells that are new. At 0.81 per cent, this is within the optimal range and shows normal red cell turnover.","low_causes":"Bone marrow suppression, nutritional deficiency, chronic disease","high_causes":"Blood loss, haemolysis, recovery from anaemia, altitude","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"reticulocyteabsolute","name":"Reticulocyte Absolute Count","group":"HEMATOLOGY","result":"39.447","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2630","lower_normal":"50","upper_normal":"100","lower_optimal":"50","upper_optimal":"90","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6000","units":"x10^9/L","description":"The absolute reticulocyte count measures the actual number of young red blood cells released from the bone marrow into the bloodstream. At 39.4, this is below the lower limit of 50. However, with haemoglobin at 150, haematocrit at 0.425 and no sign of anaemia or blood loss, this reflects a bone marrow that is producing at a rate adequate for current demand. There is no stimulus to increase production. This is a monitoring point to be rechecked at retest rather than a concern requiring investigation.","low_causes":"Iron deficiency, B12 or folate deficiency, bone marrow suppression, chronic disease, low erythropoietin","high_causes":"Blood loss, haemolysis, recovery from anaemia, erythropoietin therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ferritin","name":"Ferritin","group":"IRON STUDIES","result":"164","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4907","lower_normal":"22","upper_normal":"322","lower_optimal":"50","upper_optimal":"200","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4267","upper_optimal_position":"0.5267","units":"ng/ml","description":"Ferritin is the body's iron storage protein. At 164, this is within the optimal range for a male (50 to 200), confirming adequate iron stores without excess. Iron deficiency as a cause of fatigue or poor recovery is excluded.","low_causes":"Iron deficiency, blood loss, poor dietary iron, malabsorption","high_causes":"Iron overload, haemochromatosis, inflammation, liver disease, alcohol excess","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iron","name":"Serum Iron","group":"IRON STUDIES","result":"14.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3824","lower_normal":"11.6","upper_normal":"31.3","lower_optimal":"12","upper_optimal":"25","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3536","upper_optimal_position":"0.5138","units":"umol/l","description":"Serum iron measures the amount of iron circulating in the blood. At 14.6, this is within the optimal range. Serum iron fluctuates through the day and with meals, so it is interpreted alongside ferritin, transferrin and saturation for the full picture.","low_causes":"Iron deficiency, chronic disease, malabsorption","high_causes":"Haemochromatosis, iron supplementation, liver disease, haemolysis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrin","name":"Transferrin","group":"IRON STUDIES","result":"2.21","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3467","lower_normal":"2.15","upper_normal":"3.65","lower_optimal":"2.3","upper_optimal":"3.2","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3667","upper_optimal_position":"0.5667","units":"g/L","description":"Transferrin is the protein that transports iron in the blood. The body produces more transferrin when iron stores are low and less when they are adequate. At 2.21, this is within the laboratory range but just below the optimal band of 2.3 to 3.2. With ferritin at 164 and iron at 14.6, this simply reflects that the body has adequate iron stores and does not need to increase its transport capacity.","low_causes":"Iron overload, chronic disease, inflammation, liver disease","high_causes":"Iron deficiency, pregnancy, oestrogen therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tibc","name":"Total Iron Binding Capacity","group":"IRON STUDIES","result":"53.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4625","lower_normal":"44","upper_normal":"76.1","lower_optimal":"45","upper_optimal":"70","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3437","upper_optimal_position":"0.6039","units":"umol/l","description":"TIBC measures the total capacity of the blood to bind and transport iron. At 53.2, this is within the optimal range, consistent with the rest of the iron panel showing balanced iron status.","low_causes":"Iron overload, chronic disease, malnutrition","high_causes":"Iron deficiency, pregnancy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"transferrinsaturation","name":"Transferrin Saturation","group":"IRON STUDIES","result":"26.31","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4082","lower_normal":"18","upper_normal":"55","lower_optimal":"25","upper_optimal":"40","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3963","upper_optimal_position":"0.5297","units":"%","description":"Transferrin saturation shows what percentage of the iron-carrying capacity is being used. At 26.31 per cent, this is within the optimal band of 25 to 40 per cent, confirming that iron is being transported and utilised at a healthy rate.","low_causes":"Iron deficiency, chronic disease","high_causes":"Haemochromatosis, iron supplementation, liver disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"testosterone","name":"Testosterone","group":"HORMONES","result":"17.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4653","lower_normal":"8.4","upper_normal":"28.7","lower_optimal":"18","upper_optimal":"30","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4914","upper_optimal_position":"0.6893","units":"nmol/L","description":"Testosterone is the primary male hormone, essential for muscle mass, bone density, libido, energy, mood and body composition. At 17.2, this is within the laboratory range but below the optimal band of 18 to 30. At 41, testosterone naturally declines by about one per cent a year from the early thirties, but the lack of resistance training, circadian disruption from night shifts and the sedentary lifestyle are all modifiable factors that are likely suppressing it further. This connects directly to his symptoms of low libido and poor exercise recovery. Resistance training is the single most effective non-pharmaceutical intervention for raising testosterone.","low_causes":"Ageing, obesity, sedentary lifestyle, poor sleep, chronic stress, alcohol, medications, pituitary disease","high_causes":"Testosterone replacement, anabolic steroids, adrenal tumours","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freetestosterone","name":"Free Testosterone (Calculated)","group":"HORMONES","result":"0.353","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4078","lower_normal":"0.13","upper_normal":"1.04","lower_optimal":"0.35","upper_optimal":"0.7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4078","upper_optimal_position":"0.5260","units":"nmol/l","description":"Free testosterone is the fraction of total testosterone not bound to proteins (SHBG or albumin) and therefore immediately available for use by tissues. At 0.353, this is right at the lower edge of the optimal range of 0.35 to 0.7. His SHBG at 33.5 is in a healthy range, so the slightly low free testosterone is driven by the below-optimal total testosterone rather than by excess binding.","low_causes":"Low total testosterone, high SHBG, ageing, obesity","high_causes":"High total testosterone, low SHBG, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"shbg","name":"Sex Hormone Binding Globulin","group":"HORMONES","result":"33.5","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4451","lower_normal":"17.3","upper_normal":"65.8","lower_optimal":"25","upper_optimal":"55","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3922","upper_optimal_position":"0.6113","units":"nmol/l","description":"SHBG is a protein produced by the liver that binds testosterone and oestradiol, reducing their availability to tissues. At 33.5, this is within the optimal range of 25 to 55. A healthy SHBG means the balance between total and free testosterone is appropriate, and the below-optimal testosterone is a production issue rather than a binding issue.","low_causes":"Obesity, insulin resistance, hypothyroidism, high androgen levels","high_causes":"Ageing, liver disease, hyperthyroidism, oestrogen excess, low BMI","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fai","name":"Free Androgen Index","group":"HORMONES","result":"51.34","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5111","lower_normal":"30","upper_normal":"150","lower_optimal":"35","upper_optimal":"100","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3472","upper_optimal_position":"0.5278","units":"","description":"The Free Androgen Index estimates the proportion of testosterone that is biologically available, calculated from total testosterone and SHBG. At 51.34, this is within the optimal range of 35 to 100, confirming that the amount of testosterone available to tissues is adequate relative to the SHBG level.","low_causes":"High SHBG, low testosterone, ageing","high_causes":"Low SHBG, high testosterone, PCOS (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"oestradiol","name":"Oestradiol","group":"HORMONES","result":"110","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.3766","lower_normal":"0","upper_normal":"146.1","lower_optimal":"40","upper_optimal":"130","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0.1370","upper_optimal_position":"0.4450","units":"pmol/L","description":"Oestradiol is the primary oestrogen, produced in men by conversion of testosterone in fat tissue and other sites. It plays roles in bone health, brain function and cardiovascular protection. At 110, this is within the optimal range for a male. A healthy oestradiol in the context of a below-optimal testosterone suggests aromatase conversion (the enzyme that turns testosterone into oestradiol) is functioning normally.","low_causes":"Low testosterone, low body fat, aromatase inhibitors","high_causes":"Obesity, liver disease, excess alcohol, testosterone therapy","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"progesterone","name":"Progesterone","group":"HORMONES","result":"0.35","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2156","lower_normal":"0.89","upper_normal":"3.88","lower_optimal":"0.89","upper_optimal":"3.0","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5714","units":"nmol/L","description":"Progesterone in men is produced in small amounts by the adrenal glands and the testes. At 0.35, this is below the laboratory lower limit of 0.89. However, progesterone is not routinely measured or treated in men, and a low level in a male has no established clinical consequence. It is noted for completeness but does not require investigation or treatment.","low_causes":"Normal male physiology, adrenal insufficiency","high_causes":"Adrenal hyperplasia, medications, ovulation (females)","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"lh","name":"Luteinising Hormone","group":"HORMONES","result":"4.11","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4461","lower_normal":"1.5","upper_normal":"9.3","lower_optimal":"2","upper_optimal":"7","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3974","upper_optimal_position":"0.5897","units":"mIU/ml","description":"LH is a pituitary hormone that signals the testes to produce testosterone. At 4.11, this is within the optimal range, showing that the brain is sending appropriate signals to the testes. The below-optimal testosterone with normal LH suggests the testes are receiving the signal but producing at the lower end, which is consistent with lifestyle factors (sedentary, shift work) rather than a primary testicular or pituitary problem.","low_causes":"Pituitary disease, medications, steroids","high_causes":"Primary hypogonadism, menopause (females), testicular failure","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"fsh","name":"Follicle Stimulating Hormone","group":"HORMONES","result":"3.77","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4718","lower_normal":"1.4","upper_normal":"18.1","lower_optimal":"2","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3693","upper_optimal_position":"0.5181","units":"mIU/ml","description":"FSH is a pituitary hormone involved in sperm production and testicular function. At 3.77, this is within the optimal range, confirming normal pituitary-testicular signalling.","low_causes":"Pituitary disease, medications, steroids","high_causes":"Primary hypogonadism, testicular failure, ageing","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"prolactin","name":"Prolactin","group":"HORMONES","result":"128","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4182","lower_normal":"45","upper_normal":"375","lower_optimal":"50","upper_optimal":"300","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3485","upper_optimal_position":"0.6061","units":"uIU/ml","description":"Prolactin is a hormone produced by the pituitary gland. In men, elevated prolactin can suppress testosterone and cause sexual dysfunction. At 128, this is within the optimal range and rules out prolactin excess as a contributor to his low libido.","low_causes":"Dopamine agonist medications","high_causes":"Pituitary tumour (prolactinoma), medications, hypothyroidism, stress","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"dheas","name":"DHEA Sulphate","group":"HORMONES","result":"2.3","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3810","lower_normal":"0.44","upper_normal":"13.4","lower_optimal":"4","upper_optimal":"10","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4241","upper_optimal_position":"0.5693","units":"umol/L","description":"DHEA-S is a hormone produced by the adrenal glands that serves as a precursor to testosterone and oestradiol. It is considered a marker of adrenal reserve and biological ageing. At 2.3 umol/L (approximately 848 ug/dL), this is within the laboratory range but below the optimal band of 4 to 10 umol/L. DHEA-S naturally declines with age, and at 41 a level in this range is not uncommon. The below-optimal DHEA-S may contribute to the below-optimal testosterone and could be partly driven by circadian disruption from shift work. It does not require treatment but is worth tracking on retest.","low_causes":"Ageing, adrenal insufficiency, chronic stress, medications","high_causes":"Adrenal tumours, PCOS (females), congenital adrenal hyperplasia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"cortisol","name":"Cortisol","group":"HORMONES","result":"116","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.1872","lower_normal":"145.4","upper_normal":"619.4","lower_optimal":"200","upper_optimal":"500","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3718","upper_optimal_position":"0.5846","units":"nmol/l","description":"Cortisol is the body's primary stress hormone, produced by the adrenal glands. It follows a strong circadian rhythm, peaking within an hour of waking (typically 7 to 9 am) and falling throughout the day. The reference range of 145 to 619 is based on a morning sample. At 116, this is below the morning lower limit. However, as someone who works night shifts, his circadian rhythm may be shifted so that the sample was taken during what is effectively his 'afternoon' or 'evening', which would explain the low level. This is the most likely explanation, and it connects to his symptoms of being slow to get going and crashing in the afternoon. If these symptoms persist after implementing the lifestyle changes in this report, a repeat cortisol between 7 and 9 am on a non-shift day would clarify whether this is a timing artefact or a genuine adrenal issue.","low_causes":"Afternoon sampling, shifted circadian rhythm (night shifts), adrenal insufficiency","high_causes":"Stress, Cushing's syndrome, corticosteroid medications, early morning sampling","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bioavailabletestosterone","name":"Bioavailable Testosterone","group":"HORMONES","result":"8.46","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.6410","lower_normal":"2","upper_normal":"9","lower_optimal":"4","upper_optimal":"9","lower_normal_position":"0.3333","upper_normal_position":"0.6667","lower_optimal_position":"0.4286","upper_optimal_position":"0.6667","units":"nmol/L","description":"Bioavailable testosterone includes both the free testosterone and the fraction loosely bound to albumin, representing the total testosterone available to tissues. At 8.46, this is within the optimal range of 4 to 9, indicating that despite the total testosterone being slightly below the optimal band, the amount of testosterone actually reaching the tissues is adequate. His SHBG is not over-binding testosterone.","low_causes":"Low total testosterone, high SHBG, obesity, poor sleep, chronic stress","high_causes":"Testosterone therapy, anabolic steroid use","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"freeoestradiolindex","name":"Free Oestradiol Index","group":"HORMONES","result":"3.28","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"index","description":"The Free Oestradiol Index estimates the proportion of oestradiol that is unbound and biologically active. At 3.28, this is reported for context and is not applicable at present. His oestradiol at 110 and SHBG at 33.5 are both within healthy ranges.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"tsh","name":"Thyroid Stimulating Hormone","group":"THYROID","result":"1.43","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4028","lower_normal":"0.55","upper_normal":"4.78","lower_optimal":"1.0","upper_optimal":"2.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3690","upper_optimal_position":"0.4880","units":"mIU/l","description":"TSH is the hormone produced by the pituitary gland that tells the thyroid how much thyroid hormone to make. A high TSH means the thyroid is underperforming; a low TSH means it is overproducing. At 1.43, this is within the optimal range of 1.0 to 2.5, showing that the pituitary is satisfied with the thyroid's output. Thyroid dysfunction as a cause of his fatigue and brain fog is excluded.","low_causes":"Hyperthyroidism, excess thyroid medication, pituitary disease","high_causes":"Hypothyroidism, Hashimoto's thyroiditis, iodine deficiency, recovery from illness","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft4","name":"Free Thyroxine (FT4)","group":"THYROID","result":"19.8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5804","lower_normal":"11.5","upper_normal":"22.7","lower_optimal":"14","upper_optimal":"20","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4077","upper_optimal_position":"0.5871","units":"pmol/l","description":"Free T4 is the storage form of thyroid hormone, produced by the thyroid gland and converted into the active form (T3) in tissues. At 19.8, this is in the upper part of the optimal range (14 to 20), showing the thyroid is producing well.","low_causes":"Hypothyroidism, pituitary disease, iodine deficiency","high_causes":"Hyperthyroidism, excess thyroid medication, early thyroiditis","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ft3","name":"Free T3","group":"THYROID","result":"5.4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.5407","lower_normal":"2.6","upper_normal":"7.1","lower_optimal":"4.5","upper_optimal":"6.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4630","upper_optimal_position":"0.5963","units":"pmol/L","description":"Free T3 is the active thyroid hormone that drives metabolism, energy production and body temperature. At 5.4, this is within the optimal range of 4.5 to 6.5, confirming that the body is converting the storage form (T4) into the active form effectively. Thyroid function is not contributing to his fatigue or brain fog.","low_causes":"Hypothyroidism, selenium deficiency, chronic illness, calorie restriction","high_causes":"Hyperthyroidism, excess T3 medication","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"tpoantibodies","name":"Thyroid Peroxidase Antibodies","group":"THYROID","result":"6.6","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2391","lower_normal":"0","upper_normal":"13.8","lower_optimal":"0","upper_optimal":"13.8","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"TPO antibodies are proteins the immune system produces against thyroid peroxidase, an enzyme the thyroid uses to make thyroid hormones. Elevated TPO antibodies are the hallmark of Hashimoto's thyroiditis, the most common cause of underactive thyroid. At less than 6.6, this is well within the normal range and negative, meaning autoimmune thyroid disease of the TPO type is not present.","low_causes":"","high_causes":"Hashimoto's thyroiditis, Graves' disease, autoimmune thyroid disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"thyroglobulinantibody","name":"Thyroglobulin Antibody","group":"THYROID","result":"7.3","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.8297","lower_normal":"0","upper_normal":"4.4","lower_optimal":"0","upper_optimal":"4.4","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"Thyroglobulin antibodies are proteins the immune system produces against thyroglobulin, the scaffold protein the thyroid gland uses to manufacture thyroid hormones. At 7.3, this is above the upper limit of 4.4. In isolation, a mildly elevated thyroglobulin antibody does not mean the thyroid is under attack, and more than 80 per cent of the population have undetectable levels. However, it does mean the immune system has recognised thyroid tissue as a potential target, which places him in a population with a slightly higher lifetime risk of developing autoimmune thyroid disease. With negative TPO antibodies and normal thyroid function (TSH 1.43, FT4 19.8, FT3 5.4), there is no functional impact at present. This should be recorded in his medical notes and rechecked in 12 months to track the trend.","low_causes":"","high_causes":"Hashimoto's thyroiditis, autoimmune thyroid disease, thyroid cancer follow-up interference","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"ft3ft4ratio","name":"FT3:FT4 Ratio","group":"THYROID","result":"0.273","within_normal":"TRUE","within_optimal":"TRUE","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"ratio","description":"The FT3 to FT4 ratio reflects how efficiently the body converts the storage form of thyroid hormone (T4) into its active form (T3). At 0.273, this is at the lower edge of the optimal range (0.27 to 0.4), indicating adequate conversion. A ratio at this end of the optimal band is driven by the relatively high FT4 (19.8) rather than by poor T3 production.","low_causes":"Poor T4 to T3 conversion, low ferritin or selenium, chronic illness","high_causes":"Overactive thyroid, stimulant use","padding":"1","one_sided":"0.5","range_type":"informational"},{"key":"vitamind","name":"Vitamin D 25(OH)","group":"VITAMINS & NUTRIENTS","result":"72","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3000","lower_normal":"50","upper_normal":"120","lower_optimal":"75","upper_optimal":"120","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"nmol/L","description":"Vitamin D is produced in the skin from sunlight and is essential for calcium absorption, bone health, immune function, mood and muscle performance. At 72, this is above the sufficiency threshold of 50 but below the optimal range of 75 to 120. Given that he works night shifts and likely has limited sun exposure, this level is expected. Supplementing with 3,000 IU of vitamin D3 daily should bring this into the optimal range within three months.","low_causes":"Insufficient sunlight, dark skin, obesity, malabsorption, northern latitude, night shift work","high_causes":"Excessive supplementation, granulomatous disease","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"vitaminb12","name":"Vitamin B12","group":"VITAMINS & NUTRIENTS","result":"317","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.3824","lower_normal":"193","upper_normal":"982","lower_optimal":"500","upper_optimal":"900","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4558","upper_optimal_position":"0.5861","units":"pg/ml","description":"Vitamin B12 is essential for nerve function, DNA synthesis, red blood cell production and brain health. At 317, this is within the laboratory range but significantly below the optimal level of 500. Suboptimal B12 can contribute to brain fog, fatigue and mood changes, all of which are relevant to his reported symptoms. Supplementing with 1,000 mcg of sublingual methylcobalamin daily is the most effective way to bring this into the optimal range.","low_causes":"Poor dietary intake (especially plant-based diets), malabsorption, pernicious anaemia, medications (metformin, PPIs)","high_causes":"Supplementation, liver disease, myeloproliferative disorders","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"folate","name":"Serum Folate (Vitamin B9)","group":"VITAMINS & NUTRIENTS","result":"8","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4524","lower_normal":"3","upper_normal":"17","lower_optimal":"8","upper_optimal":"17","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.4524","upper_optimal_position":"0.6667","units":"ng/ml","description":"Folate (vitamin B9) works alongside B12 in DNA synthesis, red blood cell production and homocysteine metabolism. At 8, this is right at the lower edge of the optimal range. With only 2 to 3 portions of vegetables and fruit a day, increasing green leafy vegetables (spinach, broccoli, asparagus) would provide more folate naturally.","low_causes":"Poor diet, alcohol, malabsorption, pregnancy, medications","high_causes":"Supplementation, excessive dietary intake","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"pth","name":"Intact Parathyroid Hormone","group":"VITAMINS & NUTRIENTS","result":"0.8","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.2134","lower_normal":"0.98","upper_normal":"4.73","lower_optimal":"1.0","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3387","upper_optimal_position":"0.5040","units":"pmol/L","description":"PTH (parathyroid hormone) is produced by four small glands behind the thyroid and is the body's primary regulator of calcium. When blood calcium drops, PTH rises to pull calcium from bone, activate vitamin D and reduce calcium loss through the kidneys. When calcium is adequate, PTH falls. At 0.8, this is below the lower limit of 0.98. However, his corrected calcium is 2.56, sitting at the upper end of the reference range, which means the parathyroid glands are appropriately suppressing PTH because they sense that calcium is already high enough. This is a physiologically appropriate response rather than a pathological finding.","low_causes":"High calcium levels (physiological suppression), hypoparathyroidism, magnesium deficiency, sample handling","high_causes":"Vitamin D deficiency, low calcium, chronic kidney disease, hyperparathyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"taa","name":"Total Antioxidant Activity","group":"VITAMINS & NUTRIENTS","result":"1.9","within_normal":"FALSE","within_optimal":"FALSE","result_position":"0.7447","lower_normal":"1.3","upper_normal":"1.77","lower_optimal":"1.3","upper_optimal":"1.77","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"mmol/l","description":"Total antioxidant activity measures the combined capacity of the blood to neutralise free radicals. At 1.9, this is above the upper reference limit of 1.77. A result above range is not harmful and most likely reflects supplementation (vitamin D, creatine and protein powder can contribute, as can dietary antioxidants such as tea, coffee and fruit). This is not a concern.","low_causes":"Poor diet, oxidative stress, chronic disease","high_causes":"Supplementation, antioxidant-rich diet, high uric acid","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ck","name":"Creatine Kinase","group":"VITAMINS & NUTRIENTS","result":"132","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4762","lower_normal":"40","upper_normal":"320","lower_optimal":"40","upper_optimal":"250","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.5833","units":"U/L","description":"Creatine kinase is an enzyme released from muscle tissue when it is damaged or stressed. It rises after intense exercise, injury or muscle disease. At 132, this is mid-range and consistent with someone who is not doing heavy resistance training. As he begins resistance training, CK may rise on retest, which would be expected and not a concern.","low_causes":"Low muscle mass, sedentary lifestyle","high_causes":"Intense exercise, muscle injury, rhabdomyolysis, statin use, hypothyroidism","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"psa","name":"PSA","group":"PROSTATE","result":"0.59","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1180","lower_normal":"0","upper_normal":"2.5","lower_optimal":"0","upper_optimal":"2.5","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"PSA (prostate-specific antigen) is a protein produced by the prostate gland. Elevated levels can indicate prostate enlargement, infection or, less commonly, prostate cancer. At 0.59, this is very low and well within the target of below 2.5 at 41 years old. Prostate pathology is effectively excluded.","low_causes":"","high_causes":"Benign prostatic hyperplasia, prostatitis, prostate cancer, recent ejaculation, vigorous exercise","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"freepsa","name":"Free PSA","group":"PROSTATE","result":"0.49","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2722","lower_normal":"0","upper_normal":"0.9","lower_optimal":"0","upper_optimal":"0.9","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ug/l","description":"Free PSA is the fraction of PSA that circulates unbound to proteins. The ratio of free to total PSA helps distinguish between benign and malignant causes of elevated PSA. At 0.49, this is within range.","low_causes":"","high_causes":"Benign prostatic hyperplasia","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"psaratio","name":"PSA Ratio (Free/Total)","group":"PROSTATE","result":"0.831","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.4374","lower_normal":"0.19","upper_normal":"1","lower_optimal":"0.25","upper_optimal":"1","lower_normal_position":"0.5","upper_normal_position":"1","lower_optimal_position":"0.5370","upper_optimal_position":"1","units":"","description":"The PSA ratio shows the proportion of total PSA that is in the free (unbound) form. A high ratio (above 0.25) is reassuring and favours benign causes. At 0.831, this is very high and strongly reassuring. Combined with the very low total PSA of 0.59, prostate health is excellent.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ca199","name":"CA 19-9","group":"TUMOR MARKERS","result":"1.2","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.0162","lower_normal":"0","upper_normal":"37","lower_optimal":"0","upper_optimal":"37","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"U/ml","description":"CA 19-9 is a tumour marker primarily associated with pancreatic and biliary cancers. At less than 1.2, this is very low and well within the normal range, providing reassurance that there is no detectable pancreatic or biliary pathology.","low_causes":"","high_causes":"Pancreatic cancer, biliary obstruction, pancreatitis, liver disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"cea","name":"CEA","group":"TUMOR MARKERS","result":"1.07","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.2326","lower_normal":"0","upper_normal":"2.3","lower_optimal":"0","upper_optimal":"2.3","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"ng/ml","description":"CEA (carcinoembryonic antigen) is a tumour marker most commonly associated with colorectal cancer, though it can also rise in other cancers and benign conditions. At 1.07 for a non-smoker (range 0 to 2.3), this is well within the normal range and provides reassurance.","low_causes":"","high_causes":"Colorectal cancer, other cancers, smoking, inflammatory bowel disease","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"igg","name":"IgG","group":"IMMUNOLOGY","result":"10.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4614","lower_normal":"6.5","upper_normal":"16","lower_optimal":"6.5","upper_optimal":"16","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/l","description":"IgG is the most abundant immunoglobulin and provides the majority of antibody-based immunity. At 10.1, this is within the reference range and shows a well-functioning adaptive immune system with adequate protection from previous infections and vaccinations.","low_causes":"Immune deficiency, medications (immunosuppressants)","high_causes":"Chronic infection, autoimmune disease, liver disease, myeloma","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"igm","name":"IgM","group":"IMMUNOLOGY","result":"1.2","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.4267","lower_normal":"0.5","upper_normal":"3","lower_optimal":"0.5","upper_optimal":"3","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/l","description":"IgM is the first antibody the immune system produces in response to a new infection. At 1.2, this is within the reference range, indicating no acute infection.","low_causes":"Immune deficiency, medications","high_causes":"Acute infection, autoimmune disease, Waldenstrom's macroglobulinaemia","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"iga","name":"IgA","group":"IMMUNOLOGY","result":"2.1","within_normal":"TRUE","within_optimal":"FALSE","result_position":"0.5161","lower_normal":"0.4","upper_normal":"3.5","lower_optimal":"0.4","upper_optimal":"3.5","lower_normal_position":"0.3333333333","upper_normal_position":"0.6666666667","lower_optimal_position":"0.3333333333","upper_optimal_position":"0.6667","units":"g/l","description":"IgA protects mucosal surfaces including the gut, airways and urinary tract. At 2.1, this is within the reference range and confirms healthy mucosal immunity. Importantly, an adequate IgA level validates the coeliac screen (tissue transglutaminase IgA), which would be unreliable in someone with IgA deficiency.","low_causes":"Selective IgA deficiency (commonest primary immune deficiency), medications","high_causes":"Liver disease, coeliac disease, chronic infection, IgA nephropathy","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"ige","name":"IgE","group":"IMMUNOLOGY","result":"23.7","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1185","lower_normal":"0","upper_normal":"100","lower_optimal":"0","upper_optimal":"100","lower_normal_position":"0","upper_normal_position":"0.5","lower_optimal_position":"0","upper_optimal_position":"0.5","units":"IU/ml","description":"IgE is the immunoglobulin involved in allergic reactions and defence against parasites. At 23.7, this is well within the normal range and shows no evidence of an active allergic or parasitic process.","low_causes":"Immune deficiency","high_causes":"Allergy, asthma, eczema, parasitic infection, allergic bronchopulmonary aspergillosis","padding":"1","one_sided":"0.5","range_type":"no lower"},{"key":"rheumatoidfactor","name":"Rheumatoid Factor","group":"IMMUNOLOGY","result":"4","within_normal":"TRUE","within_optimal":"TRUE","result_position":"0.1429","lower_normal":"0", with his normal fasting glucose.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"specificgravity","name":"Specific Gravity","group":"URINALYSIS","result":"1.03","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Specific gravity measures the concentration of the urine. A value of 1.03 indicates concentrated urine, which can be normal depending on fluid intake and the time of collection.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urobilinogen","name":"Urobilinogen","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urobilinogen is a breakdown product of bilirubin processed in the gut. Small amounts in urine are normal. A negative result is not concerning and is consistent with normal liver and gut function.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"casts","name":"Urine Casts","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Urine casts are cylindrical structures formed in the kidney tubules. Their presence can indicate kidney disease. A negative result confirms there is no kidney tubular pathology.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinewbc","name":"Urine WBCs","group":"URINALYSIS","result":"1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"wbc/ul","description":"White blood cells in the urine can indicate a urinary tract infection or kidney inflammation. At less than 1, this is not significant (the lab considers less than 10 as normal) and rules out urinary tract infection.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"urinerbc","name":"Urine RBCs","group":"URINALYSIS","result":"1","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"rbc/ul","description":"Red blood cells in the urine (haematuria) can indicate kidney disease, infection, stones or bladder pathology. At less than 1, this is not significant (the lab considers less than 25 as normal) and rules out microscopic haematuria.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"nitrites","name":"Urine Nitrites","group":"URINALYSIS","result":"Negative","within_normal":"","within_optimal":"","result_position":"","lower_normal":"","upper_normal":"","lower_optimal":"","upper_optimal":"","lower_normal_position":"","upper_normal_position":"","lower_optimal_position":"","upper_optimal_position":"","units":"","description":"Nitrites in the urine suggest the presence of bacteria that convert nitrate to nitrite, indicating a urinary tract infection. A negative result rules out a bacterial UTI.","low_causes":"","high_causes":"","padding":"1","one_sided":"0.5","range_type":"normal"},{"key":"bacterialcount","name":"Bacterial Count","group":"URINAL // ---- helpers -------------------------------------------------
function statusOf(b) {
  if (b.within_normal === 'FALSE') return 'flag';
  if (b.within_optimal === 'TRUE') return 'optimal';
  if (b.within_normal === 'TRUE') return 'range';
  return 'qual'; // qualitative (Negative etc.)
}

const groups = {};
bms.forEach(b => { (groups[b.group] = groups[b.group] || []).push(b); });

const RATING_COLOR = { red:'var(--red)', orange:'var(--orange)', amber:'var(--amber)', lime:'var(--lime)', green:'var(--green)' };
const RATING_LABEL = { red:'See your GP', orange:'Needs attention', amber:'Room to improve', lime:'Mostly good', green:'Optimal' };
function groupStatus(names, sysId) {
  const rt = sysId && data.system_ratings && data.system_ratings[sysId];
  if (rt && RATING_COLOR[rt.level]) {
    let markers = [];
    names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
    if (!markers.length) return null;
    return { s: rt.level, rated: true, color: RATING_COLOR[rt.level], label: rt.label || RATING_LABEL[rt.level], note: rt.note || '',
      flagged: markers.filter(b => b.within_normal === 'FALSE').length, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  }
  let markers = [];
  names.forEach(n => { if (groups[n]) markers = markers.concat(groups[n]); });
  if (!markers.length) return null;
  const flagged = markers.filter(b => b.within_normal === 'FALSE').length;
  if (flagged) return { s: 'flag', flagged, total: markers.length, optimal: markers.filter(b => b.within_optimal === 'TRUE').length };
  const nonOpt = markers.filter(b => b.within_normal === 'TRUE' && b.within_optimal !== 'TRUE').length;
  const optimal = markers.filter(b => b.within_optimal === 'TRUE').length;
  return { s: nonOpt ? 'amber' : 'optimal', flagged: 0, total: markers.length, optimal };
}

function statusColor(s, st) {
  // Calculate a 0-1 health score for this system
  if (!st || !st.total) return 'green';
  var optPct = st.optimal / st.total;
  var flagPct = st.flagged / st.total;
  // Score: 1.0 = all optimal, 0.0 = all flagged
  var score = optPct - flagPct;
  score = Math.max(0, Math.min(1, (score + 1) / 2)); // normalise to 0-1
  return score;
}
// Map score to colour on a 5-stop gradient: red -> orange -> yellow -> light teal -> bright teal
function scoreToColor(score) {
  var stops = [
    [0.0, [255, 90, 95]],    // --red
    [0.25, [232, 160, 70]],  // orange
    [0.5, [232, 193, 90]],   // --amber/yellow
    [0.75, [100, 200, 180]], // light teal
    [1.0, [44, 228, 173]]    // --green (bright teal)
  ];
  for (var i = 0; i < stops.length - 1; i++) {
    if (score <= stops[i+1][0]) {
      var t = (score - stops[i][0]) / (stops[i+1][0] - stops[i][0]);
      var r = Math.round(stops[i][1][0] + t * (stops[i+1][1][0] - stops[i][1][0]));
      var g = Math.round(stops[i][1][1] + t * (stops[i+1][1][1] - stops[i][1][1]));
      var b = Math.round(stops[i][1][2] + t * (stops[i+1][1][2] - stops[i][1][2]));
      return 'rgb('+r+','+g+','+b+')';
    }
  }
  return 'rgb(44,228,173)';
}

function rangeBar(b, big){
  // positions are 0..1; tolerate a 0..100 record from older writers rather than drawing off the card
  const sc = (v) => { const n = num(v); return n == null ? null : Math.max(0, Math.min(1, n > 1.0001 ? n / 100 : n)); };
  const rp = sc(b.result_position); if (rp == null) return '';
  const lnp = sc(b.lower_normal_position), unp = sc(b.upper_normal_position);
  if (lnp == null && unp == null) return '';
  const lo = sc(b.lower_optimal_position), uo = sc(b.upper_optimal_position);
  const st = statusOf(b);
  const dotc = st==='flag'?'red':st==='optimal'?'green':'amber';
  const L = (lnp==null?0:lnp)*100, U=(unp==null?1:unp)*100;
  const oL = (lo==null?L/100:lo)*100, oU=(uo==null?U/100:uo)*100;
  const pos = Math.max(2, Math.min(98, rp*100));
  return `<div class="rbar-wrap ${big?'rbar-big':''}">
    <div class="rbar">
      <div class="rbar-normal" style="left:${L}%;width:${Math.max(0,U-L)}%"></div>
      <div class="rbar-opt" style="left:${oL}%;width:${Math.max(0,oU-oL)}%"></div>
      <div class="rbar-dot dot-${dotc}" style="--x:${pos}%" data-x="${pos}"></div>
    </div>
  </div>`;
}

function bioCard(b){
  const st = statusOf(b);
  const col = st==='flag'?'red':st==='optimal'?'green':st==='qual'?'blue':'amber';
  const badge = st==='flag'?'Outside range':st==='optimal'?'Optimal':st==='qual'?esc(b.result||'—'):'In range';
  const bar = rangeBar(b, false);
  // detail
  let detail = '';
  if (b.description){
    const parts = (b.description||'').split(/(?<=\.)\s/);
    const head = parts.shift(); const rest = parts.join(' ');
    detail += `<p class="bc-desc"><strong>${esc(head)}</strong>${rest?' '+esc(rest):''}</p>`;
  }
  const ranges = [];
  if (b.lower_optimal!=='') ranges.push(`<span><em>Optimal low</em>${esc(b.lower_optimal)}</span>`);
  if (b.upper_optimal!=='') ranges.push(`<span><em>Optimal high</em>${esc(b.upper_optimal)}</span>`);
  if (b.lower_normal!=='') ranges.push(`<span><em>Normal low</em>${esc(b.lower_normal)}</span>`);
  if (b.upper_normal!=='') ranges.push(`<span><em>Normal high</em>${esc(b.upper_normal)}</span>`);
  if (ranges.length) detail += `<div class="bc-ranges">${ranges.join('')}</div>`;
  if (b.low_causes || b.high_causes){
    detail += `<div class="bc-causes">`;
    if (b.low_causes) detail += `<p><em>If low</em> ${esc(b.low_causes)}</p>`;
    if (b.high_causes) detail += `<p><em>If high</em> ${esc(b.high_causes)}</p>`;
    detail += `</div>`;
  }
  return `<div class="bc bc-${col}" data-status="${st}" data-name="${esc((b.name||'').toLowerCase())}">
    <div class="bc-main" onclick="toggleCard(this.parentElement)">
      <span class="bc-tick tick-${col}"></span>
      <div class="bc-info"><div class="bc-name">${esc(b.name)}</div><div class="bc-res">${esc(b.result)} ${esc(b.units||'')}</div></div>
      ${bar}
      <span class="chip chip-${st}">${badge}</span>
      <svg class="bc-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="bc-detail"><div class="bc-detail-in">${detail||'<p class="bc-desc">No additional detail for this marker.</p>'}</div></div>
  </div>`;
}

// ---------- PROGRESS (retest) VISUALS ----------
// Renders when the report carries baseline_result values (a retest). Data-driven: nothing hard-coded.
(function(){
  const withBase = bms.filter(b => b && b.baseline_result != null && b.baseline_result !== '' && num(b.baseline_result) != null && num(b.result) != null);
  if (!(data.is_retest || withBase.length >= 10)) return;
  const ov = document.getElementById('overview'); if (!ov) return;

  const G = '#2ce4ad', R = '#ff5a5f', A = '#e8c15a', GREY = 'rgba(128,128,140,.55)';
  const isDark = !document.body.hasAttribute('data-theme') || document.body.getAttribute('data-theme') !== 'light';
  const bandFill = isDark ? 'rgba(44,228,173,.14)' : 'rgba(15,180,136,.14)';
  const trackFill = isDark ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.05)';

  // distance from the optimal band (0 inside it), used to judge direction of travel
  function dist(b, v){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && v < lo) return lo - v;
    if (hi != null && v > hi) return v - hi;
    return 0;
  }
  function span(b){
    const lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    if (lo != null && hi != null && hi > lo) return hi - lo;
    const ln = num(b.lower_normal), un = num(b.upper_normal);
    if (ln != null && un != null && un > ln) return un - ln;
    return Math.max(Math.abs(num(b.result)) * 0.5, 1e-6);
  }
  const rows = withBase.map(b => {
    const prev = num(b.baseline_result), cur = num(b.result);
    const pct = prev !== 0 ? (cur - prev) / Math.abs(prev) * 100 : (cur === 0 ? 0 : 100);
    const dPrev = dist(b, prev), dCur = dist(b, cur);
    const moved = Math.abs(cur - prev) / span(b);          // change relative to the band width
    let dir = 'same';
    if (moved >= 0.08 || Math.abs(pct) >= 5) {
      if (dCur < dPrev - 1e-9) dir = 'better';
      else if (dCur > dPrev + 1e-9) dir = 'worse';
      else dir = 'same';                                    // moved within the ideal band: not a concern
    }
    return { b, prev, cur, pct, dPrev, dCur, moved, dir };
  });
  const better = rows.filter(r => r.dir === 'better').sort((a,z) => (z.dPrev - z.dCur) / span(z.b) - (a.dPrev - a.dCur) / span(a.b));
  const worse  = rows.filter(r => r.dir === 'worse').sort((a,z) => (z.dCur - z.dPrev) / span(z.b) - (a.dCur - a.dPrev) / span(a.b));
  const same   = rows.filter(r => r.dir === 'same');
  const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 100) / 100);
  const pctTxt = p => (p > 0 ? '+' : '') + Math.round(p) + '%';

  // ---- 1. Key changes: mini charts ----
  function mini(r){
    const b = r.b, lo = num(b.lower_optimal), hi = num(b.upper_optimal);
    const vals = [r.prev, r.cur].concat(lo != null ? [lo] : []).concat(hi != null ? [hi] : []);
    let vmin = Math.min.apply(null, vals), vmax = Math.max.apply(null, vals);
    const pad = (vmax - vmin) * 0.25 || Math.abs(vmax) * 0.25 || 1; vmin -= pad; vmax += pad;
    const y = v => 52 - ((v - vmin) / (vmax - vmin)) * 42;
    const col = r.dir === 'better' ? G : r.dir === 'worse' ? R : A;
    let band = '';
    if (lo != null || hi != null) {
      const top = y(hi != null ? hi : vmax), bot = y(lo != null ? lo : vmin);
      band = `<rect x="24" y="${Math.min(top,bot).toFixed(1)}" width="176" height="${Math.abs(bot-top).toFixed(1)}" fill="${bandFill}" rx="2"/>`;
    }
    return `<svg viewBox="0 0 224 62" xmlns="http://www.w3.org/2000/svg">
      <rect x="24" y="8" width="176" height="46" fill="${trackFill}" rx="3"/>${band}
      <line x1="30" y1="${y(r.prev).toFixed(1)}" x2="194" y2="${y(r.cur).toFixed(1)}" stroke="${col}" stroke-width="2" opacity=".75"/>
      <circle cx="30" cy="${y(r.prev).toFixed(1)}" r="4" fill="${GREY}"/>
      <circle cx="194" cy="${y(r.cur).toFixed(1)}" r="5" fill="${col}"/>
      <text x="4" y="${(y(r.prev)+3.5).toFixed(1)}" font-size="8.5" fill="${GREY}" font-family="inherit">${fmt(r.prev)}</text>
      <text x="221" y="${(y(r.cur)+3.5).toFixed(1)}" font-size="9" font-weight="700" text-anchor="end" fill="${col}" font-family="inherit">${fmt(r.cur)}</text>
    </svg>`;
  }
  function cards(list, col){
    return list.map(r => `<div class="pg-card">
      <div class="pg-card-h"><span class="pg-name">${esc(r.b.name)}</span><span class="pg-pct" style="color:${col}">${r.dir==='better'?'&#9650;':'&#9660;'} ${pctTxt(r.pct)}</span></div>
      ${mini(r)}
      <div class="pg-vals">${fmt(r.prev)} &rarr; ${fmt(r.cur)} ${esc(r.b.units||'')}${r.dCur===0?' &middot; now in the ideal range':''}</div>
    </div>`).join('');
  }
  let kc = `<section id="progress" class="pg-section">
    <div class="eyebrow">Since your last test</div>
    <h2 class="sec-title">What has changed</h2>
    <p class="sec-sub">Each chart runs from your previous result to this one. The shaded band is the ideal range.</p>`;
  if (better.length) kc += `<div class="pg-label" style="color:var(--green)">Improved</div><div class="pg-grid">${cards(better.slice(0,8), G)}</div>`;
  if (worse.length)  kc += `<div class="pg-label" style="color:var(--red)">Moved the wrong way</div><div class="pg-grid">${cards(worse.slice(0,6), R)}</div>`;
  kc += `</section>`;

  // ---- 2. Radar: system score previous vs current ----
  const sysList = SYSTEMS.filter(sy => sy.groups.some(g => groups[g] && groups[g].length));
  // Score both tests on the SAME markers: only those with a previous value, so the comparison is like for like.
  // Continuous health per marker (same curve as TrueScore): inside ideal = 1; drifting through the lab range costs
  // up to a third; crossing the lab limit costs steeply; nothing left by 2.5 range-widths out. A marker sitting a hair
  // outside ideal scores ~0.9, not 0, so a small drift reads as a small change.
  function markerHealth(b, v){
    const lo_o = num(b.lower_optimal), hi_o = num(b.upper_optimal), lo_n = num(b.lower_normal), hi_n = num(b.upper_normal);
    if (v == null || (lo_o == null && hi_o == null)) return null;
    let x = 0;
    if (hi_o != null && v > hi_o) { let gap = (hi_n != null && hi_n > hi_o) ? hi_n - hi_o : Math.abs(hi_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(hi_o), 0.5)), 1e-6); x = (v - hi_o) / gap; }
    else if (lo_o != null && v < lo_o) { let gap = (lo_n != null && lo_o > lo_n) ? lo_o - lo_n : Math.abs(lo_o) * 0.25; gap = Math.max(Math.min(gap, Math.max(Math.abs(lo_o), 0.5)), 1e-6); x = (lo_o - v) / gap; }
    if (x <= 0) return 1; if (x <= 1) return 1 - 0.33 * x; if (x <= 2.5) return 0.67 - 0.67 * ((x - 1) / 1.5); return 0;
  }
  function sysScore(sy, useBase){
    let n = 0, ok = 0;
    sy.groups.forEach(g => (groups[g]||[]).forEach(b => {
      const pv = num(b.baseline_result), cv = num(b.result);
      if (pv == null || cv == null) return;
      const h = markerHealth(b, useBase ? pv : cv);
      if (h == null) return;
      n++; ok += h;
    }));
    return n >= 2 ? Math.round(ok / n * 100) : null;   // need at least two comparable markers per axis
  }
  const axes = sysList.map(sy => ({ label: sy.label, prev: sysScore(sy, true), cur: sysScore(sy, false) })).filter(a => a.prev != null && a.cur != null);
  let radar = '';
  if (axes.length >= 5) {
    const N = axes.length, cx = 250, cy = 240, Rr = 175;
    const pt = (i, val) => { const ang = -Math.PI/2 + i * 2*Math.PI/N; const rr = Rr * val/100; return [cx + rr*Math.cos(ang), cy + rr*Math.sin(ang)]; };
    const ring = f => axes.map((_, i) => pt(i, f).map(v=>v.toFixed(1)).join(',')).join(' ');
    const poly = key => axes.map((a, i) => pt(i, a[key]).map(v=>v.toFixed(1)).join(',')).join(' ');
    const gridStroke = isDark ? 'rgba(255,255,255,.09)' : 'rgba(0,0,0,.09)';
    let svg = `<svg viewBox="-40 0 580 480" xmlns="http://www.w3.org/2000/svg">`;
    [25,50,75,100].forEach(f => { svg += `<polygon points="${ring(f)}" fill="none" stroke="${gridStroke}" stroke-width="1"/>`; });
    axes.forEach((a, i) => { const [x,y] = pt(i, 100); svg += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridStroke}"/>`;
      const [lx, ly] = pt(i, 113); const dx = lx - cx; const anchor = Math.abs(dx) < 18 ? 'middle' : dx > 0 ? 'start' : 'end'; const nudge = anchor === 'middle' ? 0 : (dx > 0 ? 6 : -6);
      svg += `<text x="${(lx + nudge).toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="${anchor}" font-size="11" fill="currentColor" opacity=".75" font-family="inherit">${esc(a.label)}</text>`; });
    svg += `<polygon points="${poly('prev')}" fill="rgba(160,160,175,.16)" stroke="rgba(190,190,205,.9)" stroke-width="2" stroke-dasharray="5,4"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.prev); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="rgba(190,190,205,.9)"/>`; });
    svg += `<polygon points="${poly('cur')}" fill="rgba(44,228,173,.18)" stroke="${G}" stroke-width="2"/>`;
    axes.forEach((a, i) => { const [x,y] = pt(i, a.cur); svg += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${G}" stroke="var(--surface)" stroke-width="1.5"/>`; });
    svg += `</svg>`;
    radar = `<section class="pg-section"><div class="pg-radar">
      <div class="pg-title">System performance, previous vs current</div>
      <div class="pg-sub">Each axis is a body system, scored by how close its markers sit to the ideal range. Both tests are scored on the same markers.</div>
      ${svg}
      <div class="pg-legend"><span><i style="background:${GREY}"></i>Previous test</span><span><i style="background:${G}"></i>This test</span></div>
    </div></section>`;
  }

  // ---- 3. Longitudinal table ----
  function table(list, colour){
    if (!list.length) return '';
    return `<div class="pg-wrap"><table class="pg-table"><tr><th>Marker</th><th>Previous</th><th>Current</th><th>Change</th></tr>` +
      list.map(r => `<tr><td>${esc(r.b.name)}</td><td class="pg-prev">${fmt(r.prev)} ${esc(r.b.units||'')}</td><td>${fmt(r.cur)} ${esc(r.b.units||'')}</td><td class="pg-chg" style="color:${colour}">${pctTxt(r.pct)}</td></tr>`).join('') + `</table></div>`;
  }
  let tbl = `<section class="pg-section"><div class="pg-title">Every marker, previous vs current</div>`;
  if (better.length) tbl += `<div class="pg-label" style="color:var(--green)">Improved (${better.length})</div>${table(better, G)}`;
  if (worse.length)  tbl += `<div class="pg-label" style="color:var(--red)">Moved the wrong way (${worse.length})</div>${table(worse, R)}`;
  if (same.length)   tbl += `<div class="pg-label" style="color:var(--text3)">Stable (${same.length})</div>${table(same, 'var(--text3)')}`;
  tbl += `</section>`;

  ov.insertAdjacentHTML('afterend', kc + radar + tbl);
})();

function runIntro(){
  // ring count-up
  const R=94, C=2*Math.PI*R; const fill=document.getElementById('ringFill');
  const R2=72, C2=2*Math.PI*R2; const fill2=document.getElementById('ringFill2');
  fill.style.strokeDasharray=C; fill.style.strokeDashoffset=C;
  fill2.style.strokeDasharray=C2; fill2.style.strokeDashoffset=C2;
  const tsBm=bms.find(b=>b.key==='truescore'); const trueScore=tsBm?parseFloat(tsBm.result):healthPct;
  const optFrac=tsBm?trueScore/100:(assessable.length?optimalCount/assessable.length:0);
  const flagFrac=totalTested?flaggedCount/totalTested:0;
  const pctEl=document.getElementById('ringPct');
  const suffix=tsBm?'<span>/100</span>':'<span>%</span>';
  // final state first, so the score is right even if animation frames never run (background tab, print, old browser)
  fill.style.strokeDashoffset=C*(1-optFrac); fill2.style.strokeDashoffset=C2*(1-flagFrac);
  pctEl.innerHTML=Math.round(trueScore)+suffix;
  if(!runIntro._ran && typeof requestAnimationFrame==='function' && !(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){
    runIntro._ran=true;
    const dur=1400; let t0=null;
    function step(t){
      if(t0==null)t0=t;
      const k=Math.min(1,(t-t0)/dur); const e=1-Math.pow(1-k,3);
      fill.style.strokeDashoffset=C*(1-optFrac*e);
      fill2.style.strokeDashoffset=C2*(1-flagFrac*e);
      pctEl.innerHTML=Math.round(trueScore*e)+suffix;
      if(k<1) requestAnimationFrame(step); else { fill.style.strokeDashoffset=C*(1-optFrac); pctEl.innerHTML=Math.round(trueScore)+suffix; }
    }
    requestAnimationFrame(step);
  }
  // scan sweep + node pop
  const scan=document.getElementById('scan'); if(scan) scan.classList.add('run');
  document.querySelectorAll('.node').forEach((n,i)=>{ setTimeout(()=>n.classList.add('on'), 300+i*70); });
  // first-visible bars
  setTimeout(()=>animateBarsIn(document), 200);
}

const dob=document.getElementById('gate-dob');
const gerr=document.getElementById('gate-error');
dob.addEventListener('input',function(){
  let v=this.value.replace(/[^\d]/g,'').slice(0,8), f='';
  if(v.length>0)f=v.slice(0,2); if(v.length>2)f+=' / '+v.slice(2,4); if(v.length>4)f+=' / '+v.slice(4);
  this.value=f;
});
dob.addEventListener('keydown',e=>{ if(e.key==='Enter') verifyDob(); });
function verifyDob(){
  const norm=d=>{ let c=String(d).replace(/\s/g,''); if(/^\d{4}-\d{2}-\d{2}/.test(c)){ const p=c.split(/[-T]/); return p[2]+'/'+p[1]+'/'+p[0]; } return c; };
  const okDobs=[data.dob].concat(Array.isArray(data._alt_dobs)?data._alt_dobs:[]).filter(Boolean).map(norm);
  if(okDobs.includes(norm(dob.value))){
    document.getElementById('gate').classList.add('gate-out');
    setTimeout(()=>{ document.getElementById('gate').style.display='none'; },550);
